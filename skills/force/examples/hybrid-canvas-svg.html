<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Force Layout — Hybrid Canvas + SVG Rendering</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; }
    #controls { padding: 8px 16px; display: flex; gap: 8px; align-items: center; }
    button { padding: 4px 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    #chart { position: relative; }
    #chart canvas, #chart svg { position: absolute; top: 0; left: 0; }
    #status { padding: 4px 16px; font-size: 13px; color: #666; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .label { font-size: 11px; pointer-events: none; text-anchor: middle; fill: #333; }
    .focus-ring { fill: none; stroke: #005fcc; stroke-width: 2.5; }
  </style>
</head>
<body>
  <div id="controls">
    <button data-action="toggle-labels">Toggle Labels</button>
    <span id="status"></span>
  </div>
  <div id="chart"></div>
  <!-- Screen reader announcements -->
  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const width = 800, height = 600;
    const color = d3.scaleOrdinal(d3.schemeTableau10);
    const liveRegion = document.getElementById("live-region");

    // --- Data ---
    const groups = ["Core", "API", "UI", "Data"];
    const nodes = d3.range(120).map(i => ({
      id: `n${i}`,
      label: `${groups[i % groups.length][0]}${Math.floor(i / groups.length)}`,
      group: groups[i % groups.length],
      r: 3 + Math.random() * 5,
    }));

    const links = [];
    for (const [, group] of d3.groups(nodes, d => d.group)) {
      for (let i = 1; i < group.length; i++) {
        if (Math.random() < 0.5) links.push({ source: group[i - 1].id, target: group[i].id });
        if (i > 1 && Math.random() < 0.15) links.push({ source: group[0].id, target: group[i].id });
      }
    }
    for (let i = 0; i < 15; i++) {
      const a = nodes[Math.floor(Math.random() * nodes.length)];
      const b = nodes[Math.floor(Math.random() * nodes.length)];
      if (a.group !== b.group) links.push({ source: a.id, target: b.id });
    }

    // Degree for label visibility
    const deg = new Map();
    links.forEach(d => {
      deg.set(d.source, (deg.get(d.source) || 0) + 1);
      deg.set(d.target, (deg.get(d.target) || 0) + 1);
    });
    nodes.forEach(d => { d.degree = deg.get(d.id) || 0; });

    // --- Layers ---
    const container = d3.select("#chart")
      .style("width", width + "px")
      .style("height", height + "px");

    // Canvas layer: bulk rendering (nodes + links)
    const canvas = container.append("canvas")
      .attr("width", width).attr("height", height)
      .attr("tabindex", "0")
      .attr("role", "img")
      .attr("aria-roledescription", "interactive network graph")
      .attr("aria-label", `Force-directed network with ${nodes.length} nodes and ${links.length} links`);

    const ctx = canvas.node().getContext("2d");

    // SVG layer: focus rings, labels, annotations
    const svg = container.append("svg")
      .attr("width", width).attr("height", height)
      .style("pointer-events", "none"); // canvas handles pointer events

    const focusRing = svg.append("circle")
      .attr("class", "focus-ring")
      .attr("display", "none");

    const labelGroup = svg.append("g").attr("class", "labels");
    let showLabels = true;

    // --- Simulation ---
    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(25))
      .force("charge", d3.forceManyBody().strength(-60).distanceMax(250))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collide", d3.forceCollide(d => d.r + 1))
      .on("tick", render);

    // Announce when layout stabilizes
    simulation.on("end", () => {
      liveRegion.textContent = `Network layout complete. ${nodes.length} nodes, ${links.length} connections. Use arrow keys to navigate.`;
    });

    let quadtree;

    function render() {
      // --- Canvas: data layer ---
      ctx.clearRect(0, 0, width, height);

      // Links
      ctx.globalAlpha = 0.2;
      ctx.strokeStyle = "#999";
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      for (const d of links) {
        ctx.moveTo(d.source.x, d.source.y);
        ctx.lineTo(d.target.x, d.target.y);
      }
      ctx.stroke();

      // Nodes — batch by group for fewer style changes
      ctx.globalAlpha = 0.85;
      for (const group of groups) {
        ctx.fillStyle = color(group);
        ctx.beginPath();
        for (const d of nodes) {
          if (d.group !== group) continue;
          ctx.moveTo(d.x + d.r, d.y);
          ctx.arc(d.x, d.y, d.r, 0, 2 * Math.PI);
        }
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // --- SVG: interaction layer ---

      // Focus ring
      if (focusedNode) {
        focusRing
          .attr("cx", focusedNode.x).attr("cy", focusedNode.y)
          .attr("r", focusedNode.r + 4)
          .attr("display", null);
      } else {
        focusRing.attr("display", "none");
      }

      // Labels for high-degree nodes
      if (showLabels) {
        const labelNodes = nodes.filter(d => d.degree >= 4);
        const labels = labelGroup.selectAll(".label")
          .data(labelNodes, d => d.id);

        labels.exit().remove();

        labels.enter().append("text")
          .attr("class", "label")
          .text(d => d.label)
        .merge(labels)
          .attr("x", d => d.x)
          .attr("y", d => d.y - d.r - 4);
      } else {
        labelGroup.selectAll(".label").remove();
      }

      // Rebuild quadtree
      quadtree = d3.quadtree().x(d => d.x).y(d => d.y).addAll(nodes);
    }

    // --- Keyboard navigation ---
    let focusedNode = null;

    const dirs = {
      ArrowRight: [1, 0], ArrowLeft: [-1, 0],
      ArrowUp: [0, -1], ArrowDown: [0, 1],
    };

    canvas.node().addEventListener("keydown", (e) => {
      if (!focusedNode && (e.key in dirs || e.key === "Enter")) {
        focusedNode = nodes[0];
        announce(focusedNode);
        render();
        e.preventDefault();
        return;
      }

      if (e.key === "Escape") {
        focusedNode = null;
        render();
        e.preventDefault();
        return;
      }

      const dir = dirs[e.key];
      if (!dir || !focusedNode) return;

      let best = null, bestDist = Infinity;
      for (const n of nodes) {
        if (n === focusedNode) continue;
        const dx = n.x - focusedNode.x, dy = n.y - focusedNode.y;
        if (dx * dir[0] + dy * dir[1] <= 0) continue;
        const dist = Math.hypot(dx, dy);
        if (dist < bestDist) { best = n; bestDist = dist; }
      }
      if (best) { focusedNode = best; announce(focusedNode); render(); }
      e.preventDefault();
    });

    function announce(node) {
      const conns = links.filter(l => l.source === node || l.target === node).length;
      liveRegion.textContent = `${node.label}, ${node.group} group, ${conns} connections`;
    }

    // --- Mouse drag ---
    let dragNode = null;
    d3.select(canvas.node()).call(d3.drag()
      .subject((event) => {
        const [mx, my] = d3.pointer(event, canvas.node());
        return quadtree?.find(mx, my, 20) || null;
      })
      .on("start", (event) => {
        dragNode = event.subject;
        if (!event.active) simulation.alphaTarget(0.3).restart();
        dragNode.fx = dragNode.x; dragNode.fy = dragNode.y;
      })
      .on("drag", (event) => {
        dragNode.fx = event.x; dragNode.fy = event.y;
      })
      .on("end", (event) => {
        if (!event.active) simulation.alphaTarget(0);
        dragNode.fx = null; dragNode.fy = null; dragNode = null;
      })
    );

    // --- Controls ---
    document.querySelector("[data-action=toggle-labels]").addEventListener("click", () => {
      showLabels = !showLabels;
      render();
    });

    document.body.dataset.ready = "true";
  </script>
</body>
</html>
