<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color & Compositing — Test Fixture</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #fff; padding: 20px; color: #333; }
  h2 { font-size: 14px; margin: 20px 0 8px; font-weight: 600; }
  h2:first-of-type { margin-top: 0; }
  .controls { margin: 8px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .controls button {
    padding: 3px 10px; border: 1px solid #ccc; border-radius: 4px;
    background: #f8f8f8; cursor: pointer; font-size: 11px;
  }
  .controls button.active { background: #4477AA; color: #fff; border-color: #4477AA; }
  .palette-row { display: flex; gap: 2px; margin-bottom: 4px; }
  .palette-row .swatch { width: 36px; height: 20px; border-radius: 2px; }
  .palette-label { font-size: 11px; color: #666; margin-bottom: 2px; }
  .flex-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; }
  .panel { text-align: center; }
  .panel-label { font-size: 11px; color: #666; margin-top: 4px; }
  canvas, svg { display: block; }
  canvas { border: 1px solid #eee; }
  .legend-section { margin: 12px 0; }
  .swatch-legend { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch-item { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .swatch-item span.color { width: 14px; height: 14px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>

<h2>Paul Tol Qualitative Palettes</h2>
<div id="palettes"></div>

<h2>Canvas Compositing Modes</h2>
<div class="controls" id="comp-controls">
  <button data-mode="source-over" class="active">source-over</button>
  <button data-mode="lighter">lighter (additive)</button>
  <button data-mode="multiply">multiply</button>
  <button data-mode="screen">screen</button>
  <button data-mode="xor">xor</button>
  <button data-toggle="sim">colorblind sim</button>
</div>
<div class="flex-row" id="canvas-area"></div>

<h2>Scale Design — Sequential Lightness Ramp</h2>
<div class="flex-row" id="lightness-check"></div>

<h2>Small-Area Color Perception</h2>
<div class="flex-row" id="small-area"></div>

<h2>Auto Text Color on Backgrounds</h2>
<div id="auto-text"></div>

<h2>Dark Mode Adaptation</h2>
<div class="flex-row" id="dark-mode"></div>

<h2>Masking with source-in</h2>
<div class="flex-row" id="masking"></div>

<h2>Color Legends</h2>
<div class="legend-section" id="legends"></div>

<script type="module">
// --- Tol palettes ---
const tolBright   = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377","#BBBBBB"];
const tolVibrant  = ["#EE7733","#0077BB","#33BBEE","#EE3377","#CC3311","#009988","#BBBBBB"];
const tolMuted    = ["#CC6677","#332288","#DDCC77","#117733","#88CCEE","#882255","#44AA99","#999933","#AA4499"];
const tolHighContrast = ["#004488","#DDAA33","#BB5566"];
const tolLight    = ["#77AADD","#EE8866","#EEDD88","#FFAABB","#99DDFF","#44BB99","#BBCC33","#AAAA00","#DDDDDD"];
const tolSunset   = ["#364B9A","#4A7BB7","#6EA6CD","#98CAE1","#C2E4EF","#EAECCC","#FEDA8B","#FDB366","#F67E4B","#DD3D2D","#A50026"];

const palettes = { Bright: tolBright, Vibrant: tolVibrant, Muted: tolMuted, "High-Contrast": tolHighContrast, Light: tolLight };

// --- 1. Palette swatches ---
const palDiv = d3.select("#palettes");
for (const [name, colors] of Object.entries(palettes)) {
  palDiv.append("div").attr("class", "palette-label").text(name);
  const row = palDiv.append("div").attr("class", "palette-row");
  colors.forEach(c => row.append("div").attr("class", "swatch").style("background", c).attr("title", c));
}

// --- Colorblind simulation ---
function linearize(c) {
  c /= 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
function delinearize(c) {
  return Math.round(Math.max(0, Math.min(1, c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1/2.4) - 0.055)) * 255);
}
const deutMatrix = [0.367322,0.860646,-0.227968, 0.280085,0.672501,0.047413, -0.011820,0.042940,0.968881];
function simDeuteranopia(imageData) {
  const d = imageData.data, m = deutMatrix;
  for (let i = 0; i < d.length; i += 4) {
    const lr = linearize(d[i]), lg = linearize(d[i+1]), lb = linearize(d[i+2]);
    d[i]   = delinearize(m[0]*lr + m[1]*lg + m[2]*lb);
    d[i+1] = delinearize(m[3]*lr + m[4]*lg + m[5]*lb);
    d[i+2] = delinearize(m[6]*lr + m[7]*lg + m[8]*lb);
  }
}

// --- Utility ---
function relativeLuminance(hex) {
  const [r, g, b] = [1, 3, 5].map(i => {
    const c = parseInt(hex.slice(i, i + 2), 16) / 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrastRatio(a, b) {
  const l1 = relativeLuminance(a), l2 = relativeLuminance(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}
function textColorWCAG(bgHex) {
  return contrastRatio(bgHex, "#000000") > contrastRatio(bgHex, "#ffffff") ? "#000000" : "#ffffff";
}

// --- 2. Compositing scatter ---
const rng = d3.randomLcg(42);
const randNorm = d3.randomNormal.source(rng)(0, 1);
const W = 280, H = 240, N = 2000;

const groups = ["A", "B", "C"];
const centers = { A: [W * 0.35, H * 0.4], B: [W * 0.65, H * 0.55], C: [W * 0.5, H * 0.3] };
const color = d3.scaleOrdinal(tolBright).domain(groups);
const data = d3.range(N).map(() => {
  const g = groups[Math.floor(rng() * 3)];
  const [cx, cy] = centers[g];
  return { x: cx + randNorm() * 35, y: cy + randNorm() * 30, group: g };
});

function drawScatter(canvas, mode, applySimulation = false) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  if (mode === "lighter" || mode === "screen") {
    ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = mode;
  const alpha = (mode === "lighter" || mode === "screen") ? 0.06 : 0.35;
  for (const g of groups) {
    const c = d3.rgb(color(g));
    ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
    ctx.beginPath();
    for (const d of data) {
      if (d.group !== g) continue;
      ctx.moveTo(d.x + 3, d.y); ctx.arc(d.x, d.y, 3, 0, Math.PI * 2);
    }
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  if (applySimulation) {
    const imageData = ctx.getImageData(0, 0, W, H);
    simDeuteranopia(imageData);
    ctx.putImageData(imageData, 0, 0);
  }
}

const canvasArea = d3.select("#canvas-area");
const mainPanel = canvasArea.append("div").attr("class", "panel");
const mainCanvas = mainPanel.append("canvas").attr("width", W).attr("height", H).node();
mainPanel.append("div").attr("class", "panel-label").attr("id", "mode-label").text("source-over");

const simPanel = canvasArea.append("div").attr("class", "panel");
const simCanvas = simPanel.append("canvas").attr("width", W).attr("height", H).style("display", "none").node();
simPanel.append("div").attr("class", "panel-label").attr("id", "sim-label");

let currentMode = "source-over", showSim = false;

function renderCompositing() {
  drawScatter(mainCanvas, currentMode);
  d3.select("#mode-label").text(currentMode);
  if (showSim) {
    simCanvas.style.display = "block";
    drawScatter(simCanvas, currentMode, true);
    d3.select("#sim-label").text(currentMode + " (deuteranopia)");
  } else {
    simCanvas.style.display = "none";
    d3.select("#sim-label").text("");
  }
}

d3.selectAll("#comp-controls button").on("click", function() {
  if (this.dataset.toggle) {
    showSim = !showSim;
    d3.select(this).classed("active", showSim);
  } else {
    currentMode = this.dataset.mode;
    d3.selectAll("#comp-controls button[data-mode]").each(function() {
      d3.select(this).classed("active", this.dataset.mode === currentMode);
    });
  }
  renderCompositing();
});
renderCompositing();

// --- 3. Sequential lightness ramp check ---
{
  const container = d3.select("#lightness-check");
  const schemes = [
    { name: "Blues (good)", interp: d3.interpolateBlues },
    { name: "Viridis (good)", interp: d3.interpolateViridis },
    { name: "Rainbow (bad)", interp: d3.interpolateRainbow },
    { name: "Sinebow (bad)", interp: d3.interpolateSinebow },
  ];

  schemes.forEach(({ name, interp }) => {
    const panel = container.append("div").attr("class", "panel");
    const sw = 200, sh = 70;
    const svg = panel.append("svg").attr("width", sw).attr("height", sh);

    // Color ramp
    for (let i = 0; i < sw; i++) {
      svg.append("rect").attr("x", i).attr("y", 0).attr("width", 1).attr("height", 14)
        .attr("fill", interp(i / sw));
    }
    // Grayscale ramp
    for (let i = 0; i < sw; i++) {
      const c = d3.lab(interp(i / sw));
      const gray = Math.round(c.l * 2.55);
      svg.append("rect").attr("x", i).attr("y", 16).attr("width", 1).attr("height", 14)
        .attr("fill", `rgb(${gray},${gray},${gray})`);
    }
    // Lightness curve
    const lightness = d3.range(sw).map(i => d3.lab(interp(i / sw)).l);
    const lScale = d3.scaleLinear().domain([0, 100]).range([sh - 2, 34]);
    const line = d3.line().x((d, i) => i).y(d => lScale(d));
    svg.append("path").datum(lightness)
      .attr("d", line).attr("fill", "none").attr("stroke", "#333").attr("stroke-width", 1);
    svg.append("text").attr("x", 0).attr("y", sh - 1).attr("font-size", 9).attr("fill", "#666").text("L*");

    panel.append("div").attr("class", "panel-label").text(name);
  });
}

// --- 4. Small-area color perception ---
{
  const container = d3.select("#small-area");
  const sw = 280, sh = 120;

  // Normal palette
  const p1 = container.append("div").attr("class", "panel");
  const svg1 = p1.append("svg").attr("width", sw).attr("height", sh);
  const cats = ["A", "B", "C", "D", "E"];
  const catColor = d3.scaleOrdinal(tolBright).domain(cats);

  // Large marks
  svg1.append("text").attr("x", 0).attr("y", 12).attr("font-size", 10).attr("fill", "#666").text("Large marks");
  cats.forEach((c, i) => {
    svg1.append("rect").attr("x", i * 54).attr("y", 16).attr("width", 48).attr("height", 30)
      .attr("fill", catColor(c)).attr("rx", 3);
  });

  // Small marks — same colors
  svg1.append("text").attr("x", 0).attr("y", 62).attr("font-size", 10).attr("fill", "#666").text("Small marks — same colors");
  const rng2 = d3.randomLcg(99);
  for (let i = 0; i < 120; i++) {
    const cat = cats[Math.floor(rng2() * cats.length)];
    svg1.append("circle")
      .attr("cx", rng2() * (sw - 10) + 5).attr("cy", 70 + rng2() * 38)
      .attr("r", 2.5).attr("fill", catColor(cat));
  }
  p1.append("div").attr("class", "panel-label").text("Original palette");

  // Boosted palette
  const p2 = container.append("div").attr("class", "panel");
  const svg2 = p2.append("svg").attr("width", sw).attr("height", sh);
  function boostColor(hex) {
    const c = d3.hcl(hex);
    c.c = Math.min(130, (c.c || 0) + 20);
    c.l = Math.max(20, c.l - 5);
    return c.toString();
  }
  const boostedColor = d3.scaleOrdinal(tolBright.map(boostColor)).domain(cats);

  svg2.append("text").attr("x", 0).attr("y", 12).attr("font-size", 10).attr("fill", "#666").text("Large marks");
  cats.forEach((c, i) => {
    svg2.append("rect").attr("x", i * 54).attr("y", 16).attr("width", 48).attr("height", 30)
      .attr("fill", boostedColor(c)).attr("rx", 3);
  });

  svg2.append("text").attr("x", 0).attr("y", 62).attr("font-size", 10).attr("fill", "#666").text("Small marks — boosted chroma");
  const rng3 = d3.randomLcg(99); // same seed = same positions
  for (let i = 0; i < 120; i++) {
    const cat = cats[Math.floor(rng3() * cats.length)];
    svg2.append("circle")
      .attr("cx", rng3() * (sw - 10) + 5).attr("cy", 70 + rng3() * 38)
      .attr("r", 2.5).attr("fill", boostedColor(cat));
  }
  p2.append("div").attr("class", "panel-label").text("Chroma-boosted for small marks");
}

// --- 5. Auto text color ---
{
  const container = d3.select("#auto-text");
  const colors = ["#08519c", "#3182bd", "#6baed6", "#bdd7e7", "#eff3ff",
                  "#a50026", "#f67e4b", "#feda8b", "#eaeccc", "#364b9a",
                  "#228833", "#ccbb44", "#ee6677", "#4477aa", "#333333"];

  const row = container.append("div").style("display", "flex").style("flex-wrap", "wrap").style("gap", "3px");
  colors.forEach(bg => {
    const tc = textColorWCAG(bg);
    const ratio = tc === "#000000" ? contrastRatio(bg, "#000000") : contrastRatio(bg, "#ffffff");
    row.append("div")
      .style("background", bg).style("color", tc)
      .style("padding", "6px 10px").style("border-radius", "4px")
      .style("font-size", "11px").style("font-weight", "600")
      .style("min-width", "70px").style("text-align", "center")
      .text(`${ratio.toFixed(1)}:1`);
  });
  container.append("div").attr("class", "panel-label").text("Auto black/white text with WCAG contrast ratio");
}

// --- 6. Dark mode adaptation ---
{
  const container = d3.select("#dark-mode");

  function adaptForDarkMode(hex) {
    const c = d3.hcl(hex);
    c.l = 100 - c.l;
    c.c = Math.min(130, (c.c || 0) * 1.1);
    return c.toString();
  }

  // Light mode
  const lp = container.append("div").attr("class", "panel");
  const ls = lp.append("svg").attr("width", 260).attr("height", 100);
  ls.append("rect").attr("width", 260).attr("height", 100).attr("fill", "#fff").attr("rx", 6)
    .attr("stroke", "#ddd");

  const barData = [42, 78, 55, 91, 33, 67];
  const bx = d3.scaleBand().domain(d3.range(6)).range([20, 240]).padding(0.3);
  const by = d3.scaleLinear().domain([0, 100]).range([90, 10]);

  barData.forEach((v, i) => {
    ls.append("rect").attr("x", bx(i)).attr("y", by(v)).attr("width", bx.bandwidth())
      .attr("height", 90 - by(v)).attr("fill", tolBright[i % tolBright.length]).attr("rx", 2);
  });
  lp.append("div").attr("class", "panel-label").text("Light mode — Tol Bright");

  // Dark mode
  const dp = container.append("div").attr("class", "panel");
  const ds = dp.append("svg").attr("width", 260).attr("height", 100);
  ds.append("rect").attr("width", 260).attr("height", 100).attr("fill", "#1a1a2e").attr("rx", 6);

  const darkPalette = tolBright.map(adaptForDarkMode);
  barData.forEach((v, i) => {
    ds.append("rect").attr("x", bx(i)).attr("y", by(v)).attr("width", bx.bandwidth())
      .attr("height", 90 - by(v)).attr("fill", darkPalette[i % darkPalette.length]).attr("rx", 2);
  });
  dp.append("div").attr("class", "panel-label").text("Dark mode — HCL lightness inverted");

  // Vibrant on dark (recommended)
  const vp = container.append("div").attr("class", "panel");
  const vs = vp.append("svg").attr("width", 260).attr("height", 100);
  vs.append("rect").attr("width", 260).attr("height", 100).attr("fill", "#1a1a2e").attr("rx", 6);

  barData.forEach((v, i) => {
    vs.append("rect").attr("x", bx(i)).attr("y", by(v)).attr("width", bx.bandwidth())
      .attr("height", 90 - by(v)).attr("fill", tolVibrant[i % tolVibrant.length]).attr("rx", 2);
  });
  vp.append("div").attr("class", "panel-label").text("Dark mode — Tol Vibrant (recommended)");
}

// --- 7. Masking with source-in ---
{
  const container = d3.select("#masking");
  const mw = 200, mh = 200;

  const panel = container.append("div").attr("class", "panel");
  const canvas = panel.append("canvas").attr("width", mw).attr("height", mh).node();
  const ctx = canvas.getContext("2d");

  // Draw circle mask
  ctx.beginPath();
  ctx.arc(mw / 2, mh / 2, 80, 0, Math.PI * 2);
  ctx.fillStyle = "#000";
  ctx.fill();

  // Source-in: only draw inside the mask
  ctx.globalCompositeOperation = "source-in";

  // Draw a colorful scatter inside the mask
  const rng4 = d3.randomLcg(77);
  const norm4 = d3.randomNormal.source(rng4)(0, 1);
  for (let i = 0; i < 3000; i++) {
    const x = mw / 2 + norm4() * 40;
    const y = mh / 2 + norm4() * 40;
    const hue = (Math.atan2(y - mh/2, x - mw/2) * 180 / Math.PI + 360) % 360;
    ctx.fillStyle = d3.hcl(hue, 60, 60).toString();
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalCompositeOperation = "source-over";

  // Draw ring outline
  ctx.beginPath();
  ctx.arc(mw / 2, mh / 2, 80, 0, Math.PI * 2);
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 2;
  ctx.stroke();

  panel.append("div").attr("class", "panel-label").text("source-in: scatter clipped to circle");
}

// --- 8. Legends ---
{
  const legendDiv = d3.select("#legends");

  // Categorical
  legendDiv.append("div").attr("class", "palette-label").text("Categorical (Tol Bright)");
  const swatchDiv = legendDiv.append("div").attr("class", "swatch-legend");
  groups.forEach(g => {
    const item = swatchDiv.append("div").attr("class", "swatch-item");
    item.append("span").attr("class", "color").style("background", color(g));
    item.append("span").text(`Group ${g}`);
  });

  // Continuous diverging
  legendDiv.append("div").attr("class", "palette-label").style("margin-top", "10px").text("Continuous (Tol Sunset, diverging)");
  const legendW = 260, legendH = 14;
  const sunsetScale = d3.scaleSequential(d3.piecewise(d3.interpolateLab, tolSunset)).domain([-1, 1]);

  const legendCanvas = legendDiv.append("canvas")
    .attr("width", legendW).attr("height", legendH).style("display", "block").node();
  const lctx = legendCanvas.getContext("2d");
  for (let i = 0; i < legendW; i++) {
    lctx.fillStyle = sunsetScale(-1 + 2 * i / legendW);
    lctx.fillRect(i, 0, 1, legendH);
  }

  const axisSvg = legendDiv.append("svg")
    .attr("width", legendW + 1).attr("height", 22).style("display", "block");
  const axisScale = d3.scaleLinear().domain([-1, 1]).range([0, legendW]);
  axisSvg.append("g").attr("transform", "translate(0.5,0)")
    .call(d3.axisBottom(axisScale).ticks(5).tickSize(4))
    .call(g => g.selectAll("text").attr("font-size", "9px"));

  // Bivariate legend
  legendDiv.append("div").attr("class", "palette-label").style("margin-top", "10px").text("Bivariate (Pink–Blue)");
  const biPalette = ["#e8e8e8","#ace4e4","#5ac8c8","#dfb0d6","#a5add3","#5698b9","#be64ac","#8c62aa","#3b4994"];
  const biSize = 22;
  const biSvg = legendDiv.append("svg").attr("width", biSize * 3 + 60).attr("height", biSize * 3 + 20).style("display", "block");
  const biG = biSvg.append("g").attr("transform", "translate(16, 2)");
  for (let col = 0; col < 3; col++)
    for (let row = 0; row < 3; row++)
      biG.append("rect").attr("x", col * biSize).attr("y", row * biSize)
        .attr("width", biSize - 1).attr("height", biSize - 1).attr("rx", 2)
        .attr("fill", biPalette[(2 - row) * 3 + col]);
  biG.append("text").attr("x", biSize * 1.5).attr("y", biSize * 3 + 12)
    .attr("text-anchor", "middle").attr("font-size", 9).attr("fill", "#666").text("Var X →");
  biG.append("text").attr("transform", `translate(-6, ${biSize * 1.5}) rotate(-90)`)
    .attr("text-anchor", "middle").attr("font-size", 9).attr("fill", "#666").text("Var Y →");
}

document.body.dataset.ready = "true";
</script>
</body>
</html>
