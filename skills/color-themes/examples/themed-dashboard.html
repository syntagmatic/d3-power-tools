<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Themed Dashboard — D3 Power Tools</title>
<script>
  // Prevent FOWT: apply theme before render
  const saved = localStorage.getItem("chart-theme");
  const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
</script>
<style>
  /* ── Theme Tokens ── */
  :root, [data-theme="light"] {
    color-scheme: light;
    --color-bg: #ffffff;
    --color-surface: #f8f9fa;
    --color-text: #212529;
    --color-text-muted: #6c757d;
    --color-axis: #333333;
    --color-tick: #666666;
    --color-grid: #e9ecef;
    --color-primary: #4e79a7;
    --color-secondary: #e15759;
    --color-tertiary: #76b7b2;
    --color-accent: #f28e2b;
    --color-success: #59a14f;
    --color-muted: #adb5bd;
    --color-tooltip-bg: #ffffff;
    --color-tooltip-border: #dee2e6;
    --shadow-alpha: 0.08;
    --color-cat-1: #4e79a7;
    --color-cat-2: #f28e2b;
    --color-cat-3: #e15759;
    --color-cat-4: #76b7b2;
    --color-cat-5: #59a14f;
    --color-cat-6: #edc948;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --color-bg: #1a1a2e;
    --color-surface: #16213e;
    --color-text: #e8e8e8;
    --color-text-muted: #9a9ab0;
    --color-axis: #667788;
    --color-tick: #778899;
    --color-grid: #2a2a4a;
    --color-primary: #6fa8dc;
    --color-secondary: #ea8385;
    --color-tertiary: #8fd4cf;
    --color-accent: #f5a623;
    --color-success: #81c784;
    --color-muted: #4a4a6a;
    --color-tooltip-bg: #2d2d50;
    --color-tooltip-border: #444466;
    --shadow-alpha: 0.3;
    --color-cat-1: #6fa8dc;
    --color-cat-2: #f5a623;
    --color-cat-3: #ea8385;
    --color-cat-4: #8fd4cf;
    --color-cat-5: #81c784;
    --color-cat-6: #f7dc6f;
  }

  [data-theme="high-contrast"] {
    color-scheme: dark;
    --color-bg: #000000;
    --color-surface: #111111;
    --color-text: #ffffff;
    --color-text-muted: #cccccc;
    --color-axis: #ffffff;
    --color-tick: #ffffff;
    --color-grid: #333333;
    --color-primary: #ffff00;
    --color-secondary: #00ffff;
    --color-tertiary: #ff00ff;
    --color-accent: #ff8800;
    --color-success: #00ff00;
    --color-muted: #666666;
    --color-tooltip-bg: #111111;
    --color-tooltip-border: #ffffff;
    --shadow-alpha: 0.5;
    --color-cat-1: #ffff00;
    --color-cat-2: #00ffff;
    --color-cat-3: #ff00ff;
    --color-cat-4: #00ff00;
    --color-cat-5: #ff8800;
    --color-cat-6: #ffffff;
  }

  /* ── Base Styles ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    transition: background-color 0.4s ease, color 0.4s ease;
    padding: 24px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; }
  .subtitle { color: var(--color-text-muted); font-size: 13px; margin-top: 2px; transition: color 0.4s ease; }

  /* ── Theme Switcher ── */
  .theme-switcher {
    display: flex;
    gap: 4px;
    background: var(--color-surface);
    padding: 3px;
    border-radius: 8px;
    transition: background-color 0.4s ease;
  }
  .theme-btn {
    border: none;
    background: transparent;
    color: var(--color-text-muted);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .theme-btn:hover { color: var(--color-text); }
  .theme-btn.active {
    background: var(--color-bg);
    color: var(--color-text);
    box-shadow: 0 1px 3px rgba(0,0,0, var(--shadow-alpha));
  }

  /* ── Dashboard Grid ── */
  .dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    max-width: 1100px;
  }
  .card {
    background: var(--color-surface);
    border-radius: 10px;
    padding: 16px;
    transition: background-color 0.4s ease, box-shadow 0.4s ease;
    box-shadow: 0 1px 4px rgba(0,0,0, var(--shadow-alpha));
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--color-text-muted);
    margin-bottom: 12px;
    transition: color 0.4s ease;
  }
  .card.wide { grid-column: span 2; }

  /* ── SVG Theming (CSS-driven) ── */
  svg text { fill: var(--color-text); transition: fill 0.4s ease; }
  svg .axis .domain { stroke: var(--color-axis); transition: stroke 0.4s ease; }
  svg .axis line { stroke: var(--color-tick); transition: stroke 0.4s ease; }
  svg .grid line { stroke: var(--color-grid); stroke-dasharray: 2 2; transition: stroke 0.4s ease; }
  svg .grid .domain { display: none; }
  svg .axis text { font-size: 11px; fill: var(--color-text-muted); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Themed Dashboard</h1>
    <div class="subtitle">CSS custom properties driving D3 chart colors with smooth theme transitions.</div>
  </div>
  <div class="theme-switcher" id="theme-switcher">
    <button class="theme-btn" data-theme="light">Light</button>
    <button class="theme-btn" data-theme="dark">Dark</button>
    <button class="theme-btn" data-theme="high-contrast">High Contrast</button>
  </div>
</div>

<div class="dashboard">
  <div class="card wide" id="bar-card">
    <div class="card-title">Monthly Revenue by Product</div>
    <div id="bar-chart"></div>
  </div>
  <div class="card" id="donut-card">
    <div class="card-title">Market Share</div>
    <div id="donut-chart"></div>
  </div>
  <div class="card" style="grid-column: span 3;" id="line-card">
    <div class="card-title">Weekly Trend</div>
    <div id="line-chart"></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script type="module">

// ── Token Reader ──
const getToken = name =>
  getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const getCatColors = (n = 6) =>
  Array.from({ length: n }, (_, i) => getToken(`--color-cat-${i + 1}`));

// ── Data ──
const categories = ["Alpha", "Beta", "Gamma", "Delta", "Epsilon"];
const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];

const barData = months.flatMap(month =>
  categories.slice(0, 3).map(cat => ({
    month,
    category: cat,
    value: 20 + Math.floor(Math.random() * 80),
  }))
);

// Seed random for reproducibility
const seededRandom = (function(seed) {
  return function() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };
})(42);

barData.forEach(d => { d.value = 20 + Math.floor(seededRandom() * 80); });

const donutData = [
  { label: "Alpha", value: 35 },
  { label: "Beta", value: 25 },
  { label: "Gamma", value: 18 },
  { label: "Delta", value: 12 },
  { label: "Epsilon", value: 10 },
];

const weeks = d3.range(20).map(i => `W${i + 1}`);
const lineSeriesData = ["Alpha", "Beta", "Gamma"].map((name, si) => ({
  name,
  values: weeks.map((w, i) => {
    const base = [50, 35, 25][si];
    const trend = si === 0 ? i * 1.5 : si === 1 ? i * 0.8 : -i * 0.3;
    // deterministic "noise"
    const noise = Math.sin(i * (si + 1) * 1.7) * 10;
    return { week: w, value: Math.max(5, base + trend + noise) };
  }),
}));

// ── Margins ──
const margin = { top: 12, right: 16, bottom: 32, left: 44 };

// ══════════════════════════════════════════
// ── Bar Chart (grouped) ──
// ══════════════════════════════════════════
const barContainer = d3.select("#bar-chart");
const barW = 680, barH = 260;

const barSvg = barContainer.append("svg")
  .attr("viewBox", `0 0 ${barW} ${barH}`)
  .attr("width", "100%");

const barCats = [...new Set(barData.map(d => d.category))];

const x0 = d3.scaleBand(months, [margin.left, barW - margin.right]).paddingInner(0.2);
const x1 = d3.scaleBand(barCats, [0, x0.bandwidth()]).padding(0.05);
const yBar = d3.scaleLinear([0, 100], [barH - margin.bottom, margin.top]).nice();

// Grid
barSvg.append("g").attr("class", "grid")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(yBar).tickSize(-(barW - margin.left - margin.right)).tickFormat(""));

// Axes
barSvg.append("g").attr("class", "axis x-axis")
  .attr("transform", `translate(0,${barH - margin.bottom})`)
  .call(d3.axisBottom(x0).tickSizeOuter(0));

barSvg.append("g").attr("class", "axis y-axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(yBar).ticks(5));

// Bars — use CSS classes for theming
const barGroups = barSvg.selectAll(".bar-group")
  .data(d3.group(barData, d => d.month))
  .join("g")
    .attr("class", "bar-group")
    .attr("transform", ([month]) => `translate(${x0(month)},0)`);

const bars = barGroups.selectAll("rect")
  .data(([, items]) => items)
  .join("rect")
    .attr("x", d => x1(d.category))
    .attr("y", d => yBar(d.value))
    .attr("width", x1.bandwidth())
    .attr("height", d => yBar(0) - yBar(d.value))
    .attr("rx", 2)
    .style("transition", "fill 0.4s ease");

function updateBarColors() {
  const colors = getCatColors();
  const catIdx = Object.fromEntries(barCats.map((c, i) => [c, i]));
  bars.attr("fill", d => colors[catIdx[d.category]]);
}

// ══════════════════════════════════════════
// ── Donut Chart ──
// ══════════════════════════════════════════
const donutContainer = d3.select("#donut-chart");
const donutW = 300, donutH = 260;
const radius = Math.min(donutW, donutH) / 2 - 20;

const donutSvg = donutContainer.append("svg")
  .attr("viewBox", `0 0 ${donutW} ${donutH}`)
  .attr("width", "100%");

const donutG = donutSvg.append("g")
  .attr("transform", `translate(${donutW / 2},${donutH / 2})`);

const pie = d3.pie().value(d => d.value).sort(null).padAngle(0.02);
const arc = d3.arc().innerRadius(radius * 0.55).outerRadius(radius);
const labelArc = d3.arc().innerRadius(radius * 0.78).outerRadius(radius * 0.78);

const arcs = donutG.selectAll("path")
  .data(pie(donutData))
  .join("path")
    .attr("d", arc)
    .attr("stroke", "var(--color-bg)")
    .attr("stroke-width", 2)
    .style("transition", "fill 0.4s ease");

// Labels
const donutLabels = donutG.selectAll(".donut-label")
  .data(pie(donutData))
  .join("text")
    .attr("class", "donut-label")
    .attr("transform", d => `translate(${labelArc.centroid(d)})`)
    .attr("text-anchor", "middle")
    .attr("dy", "0.35em")
    .style("font-size", "10px")
    .style("font-weight", "600")
    .text(d => d.data.label);

// Center label
donutG.append("text")
  .attr("class", "donut-center")
  .attr("text-anchor", "middle")
  .attr("dy", "-0.1em")
  .style("font-size", "22px")
  .style("font-weight", "700")
  .text("100");

donutG.append("text")
  .attr("text-anchor", "middle")
  .attr("dy", "1.3em")
  .style("font-size", "10px")
  .style("fill", "var(--color-text-muted)")
  .text("Total Units");

function updateDonutColors() {
  const colors = getCatColors();
  arcs.attr("fill", (d, i) => colors[i]);
}

// ══════════════════════════════════════════
// ── Line Chart (multi-series) ──
// ══════════════════════════════════════════
const lineContainer = d3.select("#line-chart");
const lineW = 1060, lineH = 220;

const lineSvg = lineContainer.append("svg")
  .attr("viewBox", `0 0 ${lineW} ${lineH}`)
  .attr("width", "100%");

const xLine = d3.scalePoint(weeks, [margin.left, lineW - margin.right]).padding(0.5);
const yLine = d3.scaleLinear(
  [0, d3.max(lineSeriesData, s => d3.max(s.values, v => v.value))],
  [lineH - margin.bottom, margin.top]
).nice();

// Grid
lineSvg.append("g").attr("class", "grid")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(yLine).tickSize(-(lineW - margin.left - margin.right)).tickFormat(""));

// Axes
lineSvg.append("g").attr("class", "axis")
  .attr("transform", `translate(0,${lineH - margin.bottom})`)
  .call(d3.axisBottom(xLine).tickValues(weeks.filter((_, i) => i % 4 === 0)).tickSizeOuter(0));

lineSvg.append("g").attr("class", "axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(yLine).ticks(4));

const line = d3.line()
  .x(d => xLine(d.week))
  .y(d => yLine(d.value))
  .curve(d3.curveMonotoneX);

const linePaths = lineSvg.selectAll(".line-path")
  .data(lineSeriesData)
  .join("path")
    .attr("class", "line-path")
    .attr("d", d => line(d.values))
    .attr("fill", "none")
    .attr("stroke-width", 2.5)
    .attr("stroke-linejoin", "round")
    .attr("stroke-linecap", "round")
    .style("transition", "stroke 0.4s ease");

// Endpoint dots
const endDots = lineSvg.selectAll(".end-dot")
  .data(lineSeriesData)
  .join("circle")
    .attr("class", "end-dot")
    .attr("cx", d => xLine(d.values.at(-1).week))
    .attr("cy", d => yLine(d.values.at(-1).value))
    .attr("r", 4)
    .style("transition", "fill 0.4s ease");

// Series labels at end
const seriesLabels = lineSvg.selectAll(".series-label")
  .data(lineSeriesData)
  .join("text")
    .attr("class", "series-label")
    .attr("x", d => xLine(d.values.at(-1).week) + 8)
    .attr("y", d => yLine(d.values.at(-1).value))
    .attr("dy", "0.35em")
    .style("font-size", "11px")
    .style("font-weight", "600")
    .text(d => d.name)
    .style("transition", "fill 0.4s ease");

function updateLineColors() {
  const colors = getCatColors();
  linePaths.attr("stroke", (d, i) => colors[i]);
  endDots.attr("fill", (d, i) => colors[i]);
  seriesLabels.attr("fill", (d, i) => colors[i]);
}

// ══════════════════════════════════════════
// ── Theme Switcher Logic ──
// ══════════════════════════════════════════
function updateAllCharts() {
  // Use requestAnimationFrame to ensure CSS variables are resolved
  requestAnimationFrame(() => {
    updateBarColors();
    updateDonutColors();
    updateLineColors();
  });
}

const buttons = document.querySelectorAll(".theme-btn");

function setTheme(name) {
  document.documentElement.setAttribute("data-theme", name);
  localStorage.setItem("chart-theme", name);
  buttons.forEach(b => b.classList.toggle("active", b.dataset.theme === name));
  updateAllCharts();
}

buttons.forEach(btn => {
  btn.addEventListener("click", () => setTheme(btn.dataset.theme));
});

// Set initial active state
const initial = document.documentElement.getAttribute("data-theme") || "light";
setTheme(initial);

// Listen for OS-level theme changes
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
  if (!localStorage.getItem("chart-theme")) {
    setTheme(e.matches ? "dark" : "light");
  }
});

</script>
</body>
</html>
