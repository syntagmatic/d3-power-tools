<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Preparation — D3 Power Tools</title>
<style>
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #fff;
    color: #333;
  }
  h2 {
    font-size: 14px;
    font-weight: 500;
    color: #333;
    margin: 24px 0 8px;
  }
  h2:first-of-type { margin-top: 0; }
  .panel {
    display: inline-block;
    vertical-align: top;
    margin: 0 24px 20px 0;
  }
  .bar { fill: steelblue; }
  .bar:hover { fill: #2a5f8f; }
  .bin { fill: #e08214; }
  .bin:hover { fill: #b5670f; }
  .axis text { font-size: 11px; }
  .axis path, .axis line { stroke: #999; }
  .pc-line { fill: none; stroke-width: 1.5; opacity: 0.7; }
  .pc-axis text { font-size: 10px; }
</style>
</head>
<body>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

// --- Inline CSV with ~30 rows, 4 regions, some missing revenue, one duplicate ---
const csvText = `date,region,product,revenue,units
2023-01-15,North,Widget,1200,40
2023-02-10,South,Gadget,980,30
2023-03-05,East,Widget,1540,52
2023-04-18,West,Gizmo,870,28
2023-05-22,North,Gadget,,35
2023-06-14,South,Widget,1100,38
2023-07-09,East,Gizmo,760,25
2023-08-20,West,Widget,1320,44
2023-09-03,North,Gizmo,940,31
2023-10-11,South,Gadget,1050,34
2023-11-25,East,Widget,1680,55
2023-12-08,West,Gadget,,22
2024-01-17,North,Widget,1350,46
2024-02-22,South,Gizmo,890,29
2024-03-14,East,Gadget,1120,37
2024-04-06,West,Widget,1450,48
2024-05-19,North,Gadget,1010,33
2024-06-28,South,Widget,1230,41
2024-07-03,East,Gizmo,,27
2024-08-15,West,Gizmo,960,32
2024-09-10,North,Widget,1580,53
2024-10-01,South,Gadget,1070,36
2024-11-12,East,Widget,1490,50
2024-12-05,West,Gadget,920,30
2024-01-20,North,Gizmo,840,27
2024-03-08,South,Widget,1160,39
2024-05-11,East,Gizmo,780,26
2024-07-25,West,Widget,1400,47
2024-09-30,North,Gadget,1090,35
2024-09-30,North,Gadget,1090,35`;

// --- Parse & coerce types ---
const parseDate = d3.timeParse("%Y-%m-%d");
const raw = d3.csvParse(csvText, d => ({
  date: parseDate(d.date),
  region: d.region,
  product: d.product,
  revenue: d.revenue === "" ? null : +d.revenue,
  units: +d.units
}));

// --- Clean: drop rows with missing revenue ---
const clean = raw.filter(d => d.revenue != null);

// ==================== Panel 1: Revenue by Region ====================
{
  const panel = d3.select("body").append("div").attr("class", "panel");
  panel.append("h2").text("Revenue by Region");

  const rolled = d3.rollup(clean, v => d3.sum(v, d => d.revenue), d => d.region);
  const data = Array.from(rolled, ([region, revenue]) => ({ region, revenue }))
    .sort((a, b) => d3.descending(a.revenue, b.revenue));

  const width = 320, height = 200;
  const margin = { top: 10, right: 20, bottom: 30, left: 50 };
  const inner = { w: width - margin.left - margin.right, h: height - margin.top - margin.bottom };

  const x = d3.scaleLinear()
    .domain([0, d3.max(data, d => d.revenue)])
    .range([0, inner.w]);

  const y = d3.scaleBand()
    .domain(data.map(d => d.region))
    .range([0, inner.h])
    .padding(0.2);

  const svg = panel.append("svg").attr("width", width).attr("height", height);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  g.selectAll(".bar")
    .data(data)
    .join("rect")
      .attr("class", "bar")
      .attr("y", d => y(d.region))
      .attr("width", d => x(d.revenue))
      .attr("height", y.bandwidth());

  g.append("g").attr("class", "axis").call(d3.axisLeft(y));
  g.append("g").attr("class", "axis")
    .attr("transform", `translate(0,${inner.h})`)
    .call(d3.axisBottom(x).ticks(5, "~s"));
}

// ==================== Panel 2: Revenue Distribution ====================
{
  const panel = d3.select("body").append("div").attr("class", "panel");
  panel.append("h2").text("Revenue Distribution");

  const revenues = clean.map(d => d.revenue);
  const bins = d3.bin().thresholds(8)(revenues);

  const width = 300, height = 200;
  const margin = { top: 10, right: 10, bottom: 30, left: 40 };
  const inner = { w: width - margin.left - margin.right, h: height - margin.top - margin.bottom };

  const x = d3.scaleLinear()
    .domain([bins[0].x0, bins[bins.length - 1].x1])
    .range([0, inner.w]);

  const y = d3.scaleLinear()
    .domain([0, d3.max(bins, d => d.length)])
    .nice()
    .range([inner.h, 0]);

  const svg = panel.append("svg").attr("width", width).attr("height", height);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  g.selectAll(".bin")
    .data(bins)
    .join("rect")
      .attr("class", "bin")
      .attr("x", d => x(d.x0) + 1)
      .attr("width", d => Math.max(0, x(d.x1) - x(d.x0) - 1))
      .attr("y", d => y(d.length))
      .attr("height", d => inner.h - y(d.length));

  g.append("g").attr("class", "axis")
    .attr("transform", `translate(0,${inner.h})`)
    .call(d3.axisBottom(x).ticks(6, "~s"));

  g.append("g").attr("class", "axis").call(d3.axisLeft(y).ticks(5));
}

// ==================== Panel 3: Region Profiles (Normalized) ====================
{
  const panel = d3.select("body").append("div").attr("class", "panel");
  panel.append("h2").text("Region Profiles (Normalized)");

  // Aggregate per region
  const agg = d3.rollups(clean, v => ({
    totalRevenue: d3.sum(v, d => d.revenue),
    meanRevenue: d3.mean(v, d => d.revenue),
    totalUnits: d3.sum(v, d => d.units),
    count: v.length
  }), d => d.region).map(([region, vals]) => ({ region, ...vals }));

  const dims = ["totalRevenue", "meanRevenue", "totalUnits", "count"];
  const labels = ["Total Rev", "Mean Rev", "Total Units", "Count"];

  // Normalize each dimension to [0,1]
  const scales = {};
  for (const dim of dims) {
    const ext = d3.extent(agg, d => d[dim]);
    scales[dim] = d3.scaleLinear().domain(ext).range([0, 1]);
  }

  const width = 300, height = 200;
  const margin = { top: 20, right: 30, bottom: 20, left: 30 };
  const inner = { w: width - margin.left - margin.right, h: height - margin.top - margin.bottom };

  const xPC = d3.scalePoint().domain(dims).range([0, inner.w]);
  const yPC = d3.scaleLinear().domain([0, 1]).range([inner.h, 0]);
  const color = d3.scaleOrdinal(d3.schemeTableau10).domain(agg.map(d => d.region));

  const svg = panel.append("svg").attr("width", width).attr("height", height);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // Lines
  const line = d3.line().defined(() => true);
  g.selectAll(".pc-line")
    .data(agg)
    .join("path")
      .attr("class", "pc-line")
      .attr("stroke", d => color(d.region))
      .attr("d", d => line(dims.map(dim => [xPC(dim), yPC(scales[dim](d[dim]))])));

  // Axes
  for (let i = 0; i < dims.length; i++) {
    const dim = dims[i];
    const axisG = g.append("g")
      .attr("class", "pc-axis")
      .attr("transform", `translate(${xPC(dim)},0)`);
    axisG.call(d3.axisLeft(yPC).ticks(4).tickSize(0).tickFormat(""));
    axisG.append("line").attr("y2", inner.h).attr("stroke", "#999");
    axisG.append("text")
      .attr("y", -6)
      .attr("text-anchor", "middle")
      .attr("fill", "#333")
      .style("font-size", "10px")
      .text(labels[i]);
  }

  // Legend
  const legend = g.append("g").attr("transform", `translate(0,${inner.h + 10})`);
  agg.forEach((d, i) => {
    const lg = legend.append("g").attr("transform", `translate(${i * 70},0)`);
    lg.append("rect").attr("width", 10).attr("height", 10).attr("fill", color(d.region));
    lg.append("text").attr("x", 13).attr("y", 9).style("font-size", "10px").text(d.region);
  });
}

document.body.dataset.ready = "true";
</script>
</body>
</html>
