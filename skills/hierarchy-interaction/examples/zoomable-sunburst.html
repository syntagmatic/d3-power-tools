<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zoomable Sunburst</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #fafafa; display: flex; flex-direction: column; align-items: center; }
  #info { padding: 12px 20px; font-size: 13px; color: #555; text-align: center; }
  svg { display: block; cursor: pointer; }
  #status { padding: 4px 20px; font-size: 12px; color: #666; }
</style>
</head>
<body>
<div id="info">Click an arc to zoom in. Click the center to zoom out.</div>
<svg id="chart"></svg>
<div id="status"></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const width = 800;
const height = 800;
const radius = width / 6;

const svg = d3.select("#chart")
  .attr("viewBox", [-width / 2, -height / 2, width, height])
  .attr("width", width)
  .attr("height", height);

const status = d3.select("#status");

// --- Sample data ---
const data = {
  name: "flare", children: [
    { name: "analytics", children: [
      { name: "cluster", children: [
        { name: "AgglomerativeCluster", value: 3938 },
        { name: "CommunityStructure", value: 3812 },
        { name: "HierarchicalCluster", value: 6714 },
        { name: "MergeEdge", value: 743 }
      ]},
      { name: "graph", children: [
        { name: "BetweennessCentrality", value: 3534 },
        { name: "LinkDistance", value: 5731 },
        { name: "MaxFlowMinCut", value: 7840 },
        { name: "ShortestPaths", value: 5914 },
        { name: "SpanningTree", value: 3416 }
      ]},
      { name: "optimization", children: [
        { name: "AspectRatioBanker", value: 7074 }
      ]}
    ]},
    { name: "animate", children: [
      { name: "Easing", value: 17010 },
      { name: "FunctionSequence", value: 5842 },
      { name: "Parallel", value: 5176 },
      { name: "Pause", value: 449 },
      { name: "Scheduler", value: 5593 },
      { name: "Tween", value: 6006 },
      { name: "Transitioner", value: 19975 }
    ]},
    { name: "data", children: [
      { name: "converters", children: [
        { name: "Converters", value: 721 },
        { name: "DelimitedTextConverter", value: 4294 },
        { name: "GraphMLConverter", value: 9800 },
        { name: "JSONConverter", value: 2220 }
      ]},
      { name: "DataField", value: 1759 },
      { name: "DataSchema", value: 2165 },
      { name: "DataSet", value: 586 },
      { name: "DataSource", value: 3331 },
      { name: "DataTable", value: 772 },
      { name: "DataUtil", value: 3322 }
    ]},
    { name: "display", children: [
      { name: "DirtySprite", value: 8833 },
      { name: "LineSprite", value: 1732 },
      { name: "RectSprite", value: 3623 },
      { name: "TextSprite", value: 10066 }
    ]},
    { name: "flex", children: [
      { name: "FlareVis", value: 4116 }
    ]},
    { name: "vis", children: [
      { name: "axis", children: [
        { name: "Axes", value: 1302 },
        { name: "Axis", value: 24593 },
        { name: "AxisGridLine", value: 652 },
        { name: "AxisLabel", value: 636 }
      ]},
      { name: "controls", children: [
        { name: "AnchorControl", value: 2138 },
        { name: "ClickControl", value: 3824 },
        { name: "Control", value: 1353 },
        { name: "ControlList", value: 4665 },
        { name: "DragControl", value: 2649 },
        { name: "HoverControl", value: 4896 }
      ]},
      { name: "data", children: [
        { name: "Data", value: 20544 },
        { name: "DataList", value: 19788 },
        { name: "DataSprite", value: 10349 },
        { name: "EdgeSprite", value: 3301 },
        { name: "NodeSprite", value: 19382 }
      ]},
      { name: "legend", children: [
        { name: "Legend", value: 20859 },
        { name: "LegendItem", value: 4614 },
        { name: "LegendRange", value: 10530 }
      ]}
    ]}
  ]
};

const hierarchy = d3.hierarchy(data)
  .sum(d => d.value || 0)
  .sort((a, b) => b.value - a.value);

const root = d3.partition().size([2 * Math.PI, hierarchy.height + 1])(hierarchy);
root.each(d => d.current = d);

const color = d3.scaleOrdinal(d3.quantize(d3.interpolateRainbow, root.children.length + 1));

const arc = d3.arc()
  .startAngle(d => d.x0)
  .endAngle(d => d.x1)
  .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
  .padRadius(radius * 1.5)
  .innerRadius(d => d.y0 * radius)
  .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 1));

// --- Arcs ---
const path = svg.append("g")
  .selectAll("path")
  .data(root.descendants().slice(1))
  .join("path")
    .attr("fill", d => { while (d.depth > 1) d = d.parent; return color(d.data.name); })
    .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.6 : 0.4) : 0)
    .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
    .attr("d", d => arc(d.current));

path.filter(d => d.children)
  .style("cursor", "pointer")
  .on("click", clicked);

path.append("title")
  .text(d => `${d.ancestors().map(d => d.data.name).reverse().join("/")}\n${d3.format(",")(d.value)}`);

// --- Labels ---
const label = svg.append("g")
  .attr("pointer-events", "none")
  .attr("text-anchor", "middle")
  .style("user-select", "none")
  .selectAll("text")
  .data(root.descendants().slice(1))
  .join("text")
    .attr("dy", "0.35em")
    .attr("fill-opacity", d => +labelVisible(d.current))
    .attr("transform", d => labelTransform(d.current))
    .text(d => d.data.name)
    .style("font-size", "10px");

// --- Center circle (zoom out target) ---
const parent = svg.append("circle")
  .datum(root)
  .attr("r", radius)
  .attr("fill", "none")
  .attr("pointer-events", "all")
  .on("click", clicked);

// Center label
const centerLabel = svg.append("text")
  .attr("text-anchor", "middle")
  .attr("dy", "0.35em")
  .style("font-size", "14px")
  .style("font-weight", "600")
  .style("fill", "#555")
  .text(root.data.name);

let currentFocus = root;

function clicked(event, p) {
  parent.datum(p.parent || root);
  currentFocus = p;

  root.each(d => d.target = {
    x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
    x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
    y0: Math.max(0, d.y0 - p.depth),
    y1: Math.max(0, d.y1 - p.depth)
  });

  const t = svg.transition().duration(750).ease(d3.easeCubicInOut);

  path.transition(t)
    .tween("data", d => {
      const i = d3.interpolate(d.current, d.target);
      return t => d.current = i(t);
    })
    .filter(function(d) {
      return +this.getAttribute("fill-opacity") || arcVisible(d.target);
    })
    .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.6 : 0.4) : 0)
    .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
    .attrTween("d", d => () => arc(d.current));

  label.filter(function(d) {
      return +this.getAttribute("fill-opacity") || labelVisible(d.target);
    }).transition(t)
    .attr("fill-opacity", d => +labelVisible(d.target))
    .attrTween("transform", d => () => labelTransform(d.current));

  // Fade center label: out, change text, then back in
  centerLabel.transition().duration(200)
    .attr("opacity", 0)
    .on("end", () => {
      centerLabel.text(p.data.name);
      centerLabel.transition().duration(200).attr("opacity", 1);
    });
  updateStatus();
}

function arcVisible(d) {
  return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0;
}

function labelVisible(d) {
  return d.y1 <= 3 && d.y0 >= 1 && (d.y1 - d.y0) * (d.x1 - d.x0) > 0.03;
}

function labelTransform(d) {
  const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
  const y = (d.y0 + d.y1) / 2 * radius;
  return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
}

function updateStatus() {
  const visibleCount = root.descendants().filter(d => arcVisible(d.current)).length;
  status.text(`Focus: ${currentFocus.data.name} | Depth: ${currentFocus.depth} | Visible arcs: ${visibleCount}`);
  document.getElementById("chart").dataset.focus = currentFocus.data.name;
}

updateStatus();
document.getElementById("chart").dataset.ready = "true";
</script>
</body>
</html>
