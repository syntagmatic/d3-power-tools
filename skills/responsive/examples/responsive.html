<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive Charts Demo</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #6366f1;
    --card-bg: #fafafa;
    --radius: 8px;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }

  .subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin-bottom: 20px;
  }

  .chart-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    position: relative;
  }

  .chart-card h2 {
    font-size: 0.8125rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .chart-card svg, .chart-card canvas { display: block; }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .slider-row label {
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .slider-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }

  .breakpoint-bar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    font-family: var(--font);
    color: var(--muted);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    margin-bottom: 16px;
  }

  .breakpoint-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  #chart-wrapper {
    container-type: inline-size;
    width: 100%;
    overflow: hidden;
    position: relative;
  }

  #chart-inner { width: 100%; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(26, 26, 46, 0.92);
    color: #fff;
    font-size: 0.75rem;
    padding: 8px 10px;
    border-radius: 6px;
    line-height: 1.4;
    opacity: 0;
    transition: opacity 0.12s ease;
    z-index: 10;
    white-space: nowrap;
  }

  @container (max-width: 500px) {
    .legend { font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    svg * { transition-duration: 0s !important; animation: none !important; }
  }

  @media (max-width: 700px) {
    body { padding: 16px; }
  }
</style>
</head>
<body>

<h1>Responsive Charts Demo</h1>
<p class="subtitle">Drag the slider to resize the chart container and observe breakpoint-driven layout changes</p>

<div class="slider-row">
  <label>Container width</label>
  <input type="range" id="width-slider" min="300" max="100" value="100">
  <span id="slider-value" style="font-size: 0.8125rem; color: var(--muted); min-width: 48px; text-align: right;">100%</span>
</div>

<div class="breakpoint-bar" id="breakpoint-bar">
  <span class="breakpoint-dot"></span>
  <span id="bp-label">Desktop (960px)</span>
</div>

<div id="chart-wrapper">
  <div class="chart-card">
    <h2>Monthly Revenue by Category</h2>
    <div id="chart-inner"></div>
  </div>
</div>

<div id="chart-wrapper-canvas" style="width: 100%;">
  <div class="chart-card">
    <h2>Trend Sparkline (Canvas, DPI-aware)</h2>
    <div id="canvas-chart" style="width: 100%; height: 80px;"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script type="module">
  // --- Data Generation ---
  const seed = d3.randomLcg(42);
  const categories = ["Electronics", "Apparel", "Groceries"];
  const months = [];
  for (let y = 0; y < 2; y++) {
    for (let m = 0; m < 12; m++) {
      months.push(new Date(2024 + y, m, 1));
    }
  }

  const baseValues = { Electronics: 120, Apparel: 80, Groceries: 95 };
  const rng = d3.randomNormal.source(seed)(0, 15);
  const data = [];
  for (const date of months) {
    for (const cat of categories) {
      const seasonal = Math.sin((date.getMonth() / 12) * Math.PI * 2) * 20;
      const trend = ((date - months[0]) / (months[months.length - 1] - months[0])) * 30;
      data.push({
        date,
        category: cat,
        value: Math.max(10, Math.round(baseValues[cat] + seasonal + trend + rng())),
      });
    }
  }

  const color = d3.scaleOrdinal()
    .domain(categories)
    .range(["#6366f1", "#f59e0b", "#10b981"]);

  // --- Tooltip ---
  const tooltip = d3.select("#tooltip");
  function showTooltip(event, html) {
    tooltip.style("opacity", 1).html(html)
      .style("left", (event.pageX + 12) + "px")
      .style("top", (event.pageY - 12) + "px");
  }
  function hideTooltip() { tooltip.style("opacity", 0); }

  // --- Breakpoint config ---
  function getConfig(width) {
    if (width <= 480) return {
      mode: "horizontal", label: "Mobile", tickCount: 4,
      dateFmt: d3.timeFormat("%b"), legendPos: "top", fontSize: 11,
    };
    if (width <= 700) return {
      mode: "horizontal", label: "Tablet", tickCount: 6,
      dateFmt: d3.timeFormat("%b"), legendPos: "top", fontSize: 12,
    };
    if (width <= 900) return {
      mode: "vertical", label: "Desktop", tickCount: 12,
      dateFmt: d3.timeFormat("%b '%y"), legendPos: "right", fontSize: 12,
    };
    return {
      mode: "vertical", label: "Desktop", tickCount: 12,
      dateFmt: d3.timeFormat("%b %Y"), legendPos: "right", fontSize: 13,
    };
  }

  // --- Main chart render ---
  const chartInner = document.getElementById("chart-inner");

  function render(width) {
    const config = getConfig(width);
    const height = config.mode === "horizontal"
      ? Math.max(400, months.length * 22 + 80)
      : 400;

    // Update breakpoint indicator
    d3.select("#bp-label").text(`${config.label} (${Math.round(width)}px)`);

    d3.select(chartInner).selectAll("*").remove();

    if (config.mode === "vertical") {
      renderVerticalGrouped(width, height, config);
    } else {
      renderHorizontalStacked(width, height, config);
    }
  }

  function renderVerticalGrouped(width, height, config) {
    const legendWidth = config.legendPos === "right" ? 110 : 0;
    const margin = {
      top: config.legendPos === "top" ? 40 : 16,
      right: Math.max(16, legendWidth + 16),
      bottom: 70,
      left: Math.max(40, width * 0.05),
    };
    const w = width - margin.left - margin.right;
    const h = height - margin.top - margin.bottom;

    const svg = d3.select(chartInner).append("svg")
        .attr("width", width).attr("height", height);
    const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    // Scales
    const x0 = d3.scaleBand().domain(months).range([0, w]).paddingInner(0.15).paddingOuter(0.05);
    const x1 = d3.scaleBand().domain(categories).range([0, x0.bandwidth()]).padding(0.08);
    const y = d3.scaleLinear()
      .domain([0, d3.max(data, d => d.value) * 1.05]).nice()
      .range([h, 0]);

    // Gridlines
    g.append("g").attr("class", "grid")
      .selectAll("line").data(y.ticks(5)).join("line")
      .attr("x1", 0).attr("x2", w)
      .attr("y1", d => y(d)).attr("y2", d => y(d))
      .attr("stroke", "var(--border)").attr("stroke-dasharray", "3,3");

    // X axis — responsive tick labels
    const tickValues = width < 600
      ? months.filter((_, i) => i % 3 === 0)
      : width < 900 ? months.filter((_, i) => i % 2 === 0) : months;

    const xAxis = g.append("g").attr("transform", `translate(0,${h})`)
      .call(d3.axisBottom(x0).tickValues(tickValues).tickFormat(config.dateFmt).tickSizeOuter(0));
    xAxis.select(".domain").remove();
    xAxis.selectAll("text").attr("font-size", config.fontSize - 2)
      .attr("text-anchor", "end").attr("dx", "-0.5em").attr("dy", "0.3em")
      .attr("transform", "rotate(-40)");

    // Y axis
    const yAxis = g.append("g").call(d3.axisLeft(y).ticks(5).tickFormat(d => `$${d}`));
    yAxis.select(".domain").remove();
    yAxis.selectAll("text").attr("font-size", config.fontSize - 1);

    // Bars
    const byMonth = d3.groups(data, d => d.date);
    const monthGroups = g.selectAll(".month-group")
      .data(byMonth, ([date]) => +date)
      .join("g")
        .attr("class", "month-group")
        .attr("transform", ([date]) => `translate(${x0(date)},0)`);

    monthGroups.selectAll("rect")
      .data(([, items]) => items, d => d.category)
      .join("rect")
        .attr("x", d => x1(d.category))
        .attr("y", d => y(d.value))
        .attr("width", x1.bandwidth())
        .attr("height", d => h - y(d.value))
        .attr("fill", d => color(d.category))
        .attr("rx", 2)
        .on("pointerenter", (event, d) => showTooltip(event,
          `<strong>${d.category}</strong><br>${d3.timeFormat("%B %Y")(d.date)}<br>$${d.value}`))
        .on("pointermove", (event) => tooltip
          .style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 12) + "px"))
        .on("pointerleave", hideTooltip);

    // Legend
    renderLegend(svg, config, margin, w, h);
  }

  function renderHorizontalStacked(width, height, config) {
    const margin = { top: 40, right: 16, bottom: 20, left: Math.max(60, width * 0.18) };
    const w = width - margin.left - margin.right;
    const h = height - margin.top - margin.bottom;

    // Stack the data by month
    const byMonth = d3.groups(data, d => d.date).map(([date, items]) => {
      const row = { date };
      for (const item of items) row[item.category] = item.value;
      return row;
    });
    const stack = d3.stack().keys(categories)(byMonth);

    const svg = d3.select(chartInner).append("svg")
        .attr("width", width).attr("height", height);
    const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    const y = d3.scaleBand().domain(months).range([0, h]).padding(0.12);
    const x = d3.scaleLinear()
      .domain([0, d3.max(byMonth, d => d3.sum(categories, k => d[k])) * 1.05]).nice()
      .range([0, w]);

    // Gridlines
    g.append("g").selectAll("line").data(x.ticks(config.tickCount)).join("line")
      .attr("x1", d => x(d)).attr("x2", d => x(d))
      .attr("y1", 0).attr("y2", h)
      .attr("stroke", "var(--border)").attr("stroke-dasharray", "3,3");

    // Y axis — month labels
    const tickVals = width <= 480
      ? months.filter((_, i) => i % 3 === 0)
      : months.filter((_, i) => i % 2 === 0);

    const yAxis = g.append("g")
      .call(d3.axisLeft(y).tickValues(tickVals).tickFormat(config.dateFmt).tickSizeOuter(0));
    yAxis.select(".domain").remove();
    yAxis.selectAll("text").attr("font-size", config.fontSize - 1);

    // X axis
    const xAxis = g.append("g").attr("transform", `translate(0,${h})`)
      .call(d3.axisBottom(x).ticks(config.tickCount).tickFormat(d => `$${d}`).tickSizeOuter(0));
    xAxis.select(".domain").remove();
    xAxis.selectAll("text").attr("font-size", config.fontSize - 1);

    // Stacked bars
    const layers = g.selectAll(".layer")
      .data(stack, d => d.key)
      .join("g")
        .attr("class", "layer")
        .attr("fill", d => color(d.key));

    layers.selectAll("rect")
      .data(d => d.map(seg => ({ ...seg, key: d.key })))
      .join("rect")
        .attr("y", d => y(d.data.date))
        .attr("x", d => x(d[0]))
        .attr("width", d => Math.max(0, x(d[1]) - x(d[0])))
        .attr("height", y.bandwidth())
        .attr("rx", 2)
        .on("pointerenter", (event, d) => showTooltip(event,
          `<strong>${d.key}</strong><br>${d3.timeFormat("%B %Y")(d.data.date)}<br>$${d.data[d.key]}`))
        .on("pointermove", (event) => tooltip
          .style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 12) + "px"))
        .on("pointerleave", hideTooltip);

    // Legend on top
    renderLegend(svg, config, margin, w, h);
  }

  function renderLegend(svg, config, margin, plotW, plotH) {
    const legend = svg.append("g").attr("class", "legend");
    if (config.legendPos === "right") {
      legend.attr("transform", `translate(${margin.left + plotW + 16}, ${margin.top})`);
      const items = legend.selectAll(".legend-item")
        .data(categories)
        .join("g")
          .attr("class", "legend-item")
          .attr("transform", (d, i) => `translate(0, ${i * 22})`);
      items.append("rect")
          .attr("width", 12).attr("height", 12)
          .attr("fill", d => color(d)).attr("rx", 2);
      items.append("text")
          .attr("x", 18).attr("y", 10)
          .attr("font-size", "12px").attr("fill", "var(--fg)").text(d => d);
    } else {
      legend.attr("transform", `translate(${margin.left}, 12)`);
      // Pre-compute horizontal offsets
      const offsets = [];
      let xOff = 0;
      for (const cat of categories) {
        offsets.push(xOff);
        xOff += 14 + cat.length * 7 + 16;
      }
      const items = legend.selectAll(".legend-item")
        .data(categories)
        .join("g")
          .attr("class", "legend-item")
          .attr("transform", (d, i) => `translate(${offsets[i]}, 0)`);
      items.append("rect")
          .attr("width", 10).attr("height", 10)
          .attr("fill", d => color(d)).attr("rx", 2);
      items.append("text")
          .attr("x", 14).attr("y", 10)
          .attr("font-size", "11px").attr("fill", "var(--fg)").text(d => d);
    }
  }

  // --- Canvas sparkline with DPI handling ---
  function renderCanvas() {
    const container = document.getElementById("canvas-chart");
    container.innerHTML = "";
    const rect = container.getBoundingClientRect();
    const cw = rect.width;
    const ch = rect.height || 80;
    const dpr = devicePixelRatio || 1;

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    canvas.style.width = `${cw}px`;
    canvas.style.height = `${ch}px`;
    container.appendChild(canvas);

    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    // Aggregate total per month
    const totals = d3.rollups(data, v => d3.sum(v, d => d.value), d => d.date)
      .map(([date, value]) => ({ date, value }))
      .sort((a, b) => a.date - b.date);

    const pad = { top: 10, right: 12, bottom: 10, left: 12 };
    const pw = cw - pad.left - pad.right;
    const ph = ch - pad.top - pad.bottom;

    const x = d3.scaleTime()
      .domain(d3.extent(totals, d => d.date))
      .range([pad.left, pad.left + pw]);
    const y = d3.scaleLinear()
      .domain([0, d3.max(totals, d => d.value) * 1.05])
      .range([pad.top + ph, pad.top]);

    // Fill area
    ctx.beginPath();
    ctx.moveTo(x(totals[0].date), y(0));
    for (const d of totals) ctx.lineTo(x(d.date), y(d.value));
    ctx.lineTo(x(totals[totals.length - 1].date), y(0));
    ctx.closePath();
    ctx.fillStyle = "rgba(99, 102, 241, 0.12)";
    ctx.fill();

    // Line
    ctx.beginPath();
    totals.forEach((d, i) => {
      const px = x(d.date), py = y(d.value);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.strokeStyle = "#6366f1";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.stroke();

    // Dots at endpoints
    for (const d of [totals[0], totals[totals.length - 1]]) {
      ctx.beginPath();
      ctx.arc(x(d.date), y(d.value), 3, 0, Math.PI * 2);
      ctx.fillStyle = "#6366f1";
      ctx.fill();
    }

    // Labels
    ctx.font = `11px ${getComputedStyle(document.body).fontFamily}`;
    ctx.fillStyle = "#6b7280";
    ctx.textAlign = "left";
    ctx.fillText(`$${totals[0].value}`, x(totals[0].date) + 6, y(totals[0].value) + 4);
    ctx.textAlign = "right";
    ctx.fillText(`$${totals[totals.length - 1].value}`,
      x(totals[totals.length - 1].date) - 6, y(totals[totals.length - 1].value) + 4);
  }

  // --- Width slider ---
  const wrapper = document.getElementById("chart-wrapper");
  const slider = document.getElementById("width-slider");
  const sliderLabel = document.getElementById("slider-value");

  // Compute slider range: 300px to full parent width
  function getMaxWidth() {
    return wrapper.parentElement.getBoundingClientRect().width;
  }

  function updateSlider() {
    const maxW = getMaxWidth();
    slider.min = 300;
    slider.max = Math.round(maxW);
    if (!slider.dataset.initialized) {
      slider.value = Math.round(maxW);
      slider.dataset.initialized = "1";
    }
  }

  slider.addEventListener("input", () => {
    const val = +slider.value;
    const maxW = getMaxWidth();
    const pct = Math.round((val / maxW) * 100);
    wrapper.style.width = `${val}px`;
    sliderLabel.textContent = pct >= 99 ? "100%" : `${pct}%`;
  });

  updateSlider();
  window.addEventListener("resize", updateSlider);

  // --- ResizeObserver with 150ms debounce ---
  let resizeTimer;
  const ro = new ResizeObserver(([entry]) => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const { width } = entry.contentRect;
      if (width > 0) render(width);
    }, 150);
  });
  ro.observe(wrapper);

  // Canvas observer — separate because it's a different container
  let canvasTimer;
  const canvasRo = new ResizeObserver(() => {
    clearTimeout(canvasTimer);
    canvasTimer = setTimeout(renderCanvas, 150);
  });
  canvasRo.observe(document.getElementById("chart-wrapper-canvas"));

  // --- Initial render ---
  const initWidth = wrapper.getBoundingClientRect().width;
  render(initWidth);
  renderCanvas();
</script>
</body>
</html>
