<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patterned Fills & Stroke Styles — Test Fixture</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #fff; padding: 20px; color: #333; }
  h2 { font-size: 14px; margin: 20px 0 8px; font-weight: 600; }
  h2:first-of-type { margin-top: 0; }
  .controls { margin: 8px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .controls button {
    padding: 3px 10px; border: 1px solid #ccc; border-radius: 4px;
    background: #f8f8f8; cursor: pointer; font-size: 11px;
  }
  .controls button.active { background: #4477AA; color: #fff; border-color: #4477AA; }
  .section { margin-bottom: 20px; }
  .flex-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; }
  .panel { text-align: center; }
  .panel-label { font-size: 11px; color: #666; margin-top: 4px; }
  svg, canvas { display: block; }
</style>
</head>
<body>

<h2>Pattern Catalog — Geometric</h2>
<div class="section" id="catalog"></div>

<h2>Bar Chart — Color + Pattern Encoding</h2>
<div class="controls" id="bar-controls">
  <button data-action="color-only" class="active">Color only</button>
  <button data-action="pattern-only">Pattern only (B&W)</button>
  <button data-action="color-pattern">Color + Pattern</button>
</div>
<div class="section" id="bar-chart"></div>

<h2>Stroke Dash Patterns</h2>
<div class="section" id="dash-chart"></div>

<h2>SVG Filter Textures</h2>
<div class="flex-row" id="filter-textures"></div>

<h2>Density Hatching (quantitative)</h2>
<div class="section" id="density-chart"></div>

<h2>Canvas Pattern Atlas</h2>
<div class="flex-row" id="canvas-patterns"></div>

<script type="module">

// ---- Pattern definitions ----

function patternDiagonalHatch(defs, { id = "hatch-diag", size = 8, strokeWidth = 1.5, stroke = "#333", angle = 45 } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse")
    .attr("patternTransform", `rotate(${angle})`);
  p.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternCrossHatch(defs, { id = "hatch-cross", size = 8, strokeWidth = 1, stroke = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse")
    .attr("patternTransform", "rotate(45)");
  p.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  p.append("line").attr("x1", 0).attr("y1", 0).attr("x2", size).attr("y2", 0)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternDots(defs, { id = "dots", size = 8, radius = 1.5, fill = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  p.append("circle").attr("cx", size / 2).attr("cy", size / 2).attr("r", radius).attr("fill", fill);
  return id;
}

function patternHorizontalLines(defs, { id = "lines-h", size = 6, strokeWidth = 1, stroke = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  p.append("line").attr("x1", 0).attr("y1", size / 2).attr("x2", size).attr("y2", size / 2)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternVerticalLines(defs, { id = "lines-v", size = 6, strokeWidth = 1, stroke = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  p.append("line").attr("x1", size / 2).attr("y1", 0).attr("x2", size / 2).attr("y2", size)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternCheckerboard(defs, { id = "checker", size = 8, fill = "#333" } = {}) {
  const half = size / 2;
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  p.append("rect").attr("width", half).attr("height", half).attr("fill", fill);
  p.append("rect").attr("x", half).attr("y", half).attr("width", half).attr("height", half).attr("fill", fill);
  return id;
}

function patternStipple(defs, { id = "stipple", size = 16, density = 12, radius = 0.8, fill = "#333", seed = 42 } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  let s = seed;
  const rand = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < density; i++) {
    p.append("circle").attr("cx", rand() * size).attr("cy", rand() * size).attr("r", radius).attr("fill", fill);
  }
  return id;
}

function patternWavy(defs, { id = "wavy", size = 16, strokeWidth = 1.5, stroke = "#333", amplitude = 2.5 } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  const mid = size / 2, q = size / 4;
  p.append("path")
    .attr("d", `M0,${mid} Q${q},${mid - amplitude} ${size / 2},${mid} Q${q * 3},${mid + amplitude} ${size},${mid}`)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth).attr("fill", "none");
  return id;
}

function patternDiamonds(defs, { id = "diamonds", size = 12, strokeWidth = 1, stroke = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  const half = size / 2;
  p.append("path")
    .attr("d", `M${half},0 L${size},${half} L${half},${size} L0,${half} Z`)
    .attr("fill", "none").attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternTriangles(defs, { id = "triangles", size = 12, strokeWidth = 1, stroke = "#333" } = {}) {
  const h = size * Math.sqrt(3) / 2;
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", h)
    .attr("patternUnits", "userSpaceOnUse");
  p.append("path")
    .attr("d", `M0,${h} L${size / 2},0 L${size},${h} Z`)
    .attr("fill", "none").attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternZigzag(defs, { id = "zigzag", size = 12, strokeWidth = 1.5, stroke = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  const q = size / 4;
  p.append("path")
    .attr("d", `M0,${q*3} L${q},${q} L${q*2},${q*3} L${q*3},${q} L${size},${q*3}`)
    .attr("fill", "none").attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}


// ---- 1. Pattern Catalog ----

const catalogSwatchSize = 56, catalogGap = 8;
const patternDefs = [
  { name: "Diagonal",    fn: (d, id) => patternDiagonalHatch(d, { id }) },
  { name: "Backslash",   fn: (d, id) => patternDiagonalHatch(d, { id, angle: -45 }) },
  { name: "Cross-hatch", fn: (d, id) => patternCrossHatch(d, { id }) },
  { name: "Dots",        fn: (d, id) => patternDots(d, { id }) },
  { name: "Horizontal",  fn: (d, id) => patternHorizontalLines(d, { id }) },
  { name: "Vertical",    fn: (d, id) => patternVerticalLines(d, { id }) },
  { name: "Checkerboard",fn: (d, id) => patternCheckerboard(d, { id }) },
  { name: "Stipple",     fn: (d, id) => patternStipple(d, { id }) },
  { name: "Wavy",        fn: (d, id) => patternWavy(d, { id }) },
  { name: "Diamonds",    fn: (d, id) => patternDiamonds(d, { id }) },
  { name: "Triangles",   fn: (d, id) => patternTriangles(d, { id }) },
  { name: "Zigzag",      fn: (d, id) => patternZigzag(d, { id }) },
];

const catalogWidth = patternDefs.length * (catalogSwatchSize + catalogGap);
const catalogSvg = d3.select("#catalog").append("svg")
  .attr("width", catalogWidth).attr("height", catalogSwatchSize + 28);
const catDefs = catalogSvg.append("defs");

const catG = catalogSvg.append("g").attr("transform", "translate(2, 2)");
patternDefs.forEach(({ name, fn }, i) => {
  const pid = `cat-${i}`;
  fn(catDefs, pid);
  const x = i * (catalogSwatchSize + catalogGap);
  catG.append("rect")
    .attr("x", x).attr("y", 0)
    .attr("width", catalogSwatchSize).attr("height", catalogSwatchSize)
    .attr("fill", `url(#${pid})`)
    .attr("stroke", "#bbb").attr("stroke-width", 0.5).attr("rx", 3);
  catG.append("text")
    .attr("x", x + catalogSwatchSize / 2).attr("y", catalogSwatchSize + 13)
    .attr("text-anchor", "middle").attr("font-size", 9).attr("fill", "#555")
    .text(name);
});


// ---- 2. Bar Chart with pattern modes ----

const tolBright = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377"];
const categories = ["Alpha", "Beta", "Gamma", "Delta", "Epsilon", "Zeta"];
const barData = categories.map((c, i) => ({ category: c, value: 30 + Math.sin(i * 1.7) * 20 + i * 8 }));

const barMargin = { top: 16, right: 120, bottom: 28, left: 36 };
const barWidth = 660, barHeight = 220;
const bw = barWidth - barMargin.left - barMargin.right;
const bh = barHeight - barMargin.top - barMargin.bottom;

const barSvg = d3.select("#bar-chart").append("svg")
  .attr("width", barWidth).attr("height", barHeight);
const barDefs = barSvg.append("defs");
const barG = barSvg.append("g").attr("transform", `translate(${barMargin.left},${barMargin.top})`);

const x = d3.scaleBand().domain(categories).range([0, bw]).padding(0.25);
const y = d3.scaleLinear().domain([0, d3.max(barData, d => d.value) * 1.1]).range([bh, 0]);
const colorScale = d3.scaleOrdinal().domain(categories).range(tolBright);

barG.append("g").attr("transform", `translate(0,${bh})`).call(d3.axisBottom(x)).selectAll("text").attr("font-size", 10);
barG.append("g").call(d3.axisLeft(y).ticks(5));

// B&W patterns (distinct types for accessibility)
const barPatternFns = [
  (d, id) => patternDiagonalHatch(d, { id }),
  (d, id) => patternDots(d, { id }),
  (d, id) => patternCrossHatch(d, { id }),
  (d, id) => patternDiagonalHatch(d, { id, angle: -45 }),
  (d, id) => patternHorizontalLines(d, { id }),
  (d, id) => patternDiamonds(d, { id }),
];

// Create B&W and color+pattern versions
categories.forEach((cat, i) => {
  barPatternFns[i](barDefs, `bw-${i}`);

  // Color+pattern combined
  const size = 8;
  const bgColor = colorScale(cat);
  const isDark = d3.lab(bgColor).l < 55;
  const markColor = isDark ? "rgba(255,255,255,0.45)" : "rgba(0,0,0,0.2)";

  const p = barDefs.append("pattern").attr("id", `cp-${i}`)
    .attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");

  // Determine rotation
  if (i === 0 || i === 3) p.attr("patternTransform", `rotate(${i === 0 ? 45 : -45})`);
  if (i === 2) p.attr("patternTransform", "rotate(45)");

  p.append("rect").attr("width", size).attr("height", size).attr("fill", bgColor);

  if ([0, 2, 3].includes(i)) {
    p.append("line").attr("y2", size).attr("stroke", markColor).attr("stroke-width", 1.5);
    if (i === 2) p.append("line").attr("x2", size).attr("stroke", markColor).attr("stroke-width", 1.5);
  } else if (i === 1) {
    p.append("circle").attr("cx", size / 2).attr("cy", size / 2).attr("r", 1.5).attr("fill", markColor);
  } else if (i === 4) {
    p.append("line").attr("x1", 0).attr("y1", size / 2).attr("x2", size).attr("y2", size / 2)
      .attr("stroke", markColor).attr("stroke-width", 1.5);
  } else if (i === 5) {
    const half = size / 2;
    p.append("path").attr("d", `M${half},0 L${size},${half} L${half},${size} L0,${half} Z`)
      .attr("fill", "none").attr("stroke", markColor).attr("stroke-width", 1);
  }
});

const bars = barG.selectAll(".bar")
  .data(barData)
  .join("rect")
    .attr("class", "bar")
    .attr("x", d => x(d.category))
    .attr("y", d => y(d.value))
    .attr("width", x.bandwidth())
    .attr("height", d => bh - y(d.value))
    .attr("fill", d => colorScale(d.category))
    .attr("stroke", "#fff").attr("stroke-width", 1);

const legendG = barG.append("g").attr("class", "bar-legend").attr("transform", `translate(${bw + 12}, 0)`);

function updateBarMode(mode) {
  bars.transition().duration(300).attr("fill", (d, i) => {
    const ci = categories.indexOf(d.category);
    if (mode === "color-only") return colorScale(d.category);
    if (mode === "pattern-only") return `url(#bw-${ci})`;
    return `url(#cp-${ci})`;
  }).attr("stroke", mode === "pattern-only" ? "#999" : "#fff");

  legendG.selectAll("*").remove();
  categories.forEach((cat, i) => {
    const g = legendG.append("g").attr("transform", `translate(0, ${i * 18})`);
    let fill;
    if (mode === "color-only") fill = colorScale(cat);
    else if (mode === "pattern-only") fill = `url(#bw-${i})`;
    else fill = `url(#cp-${i})`;
    g.append("rect").attr("width", 14).attr("height", 14)
      .attr("fill", fill).attr("stroke", "#999").attr("stroke-width", 0.5).attr("rx", 2);
    g.append("text").attr("x", 18).attr("y", 11).attr("font-size", 10).text(cat);
  });
}

d3.selectAll("#bar-controls button").on("click", function () {
  d3.selectAll("#bar-controls button").classed("active", false);
  d3.select(this).classed("active", true);
  updateBarMode(this.dataset.action);
});
updateBarMode("color-only");


// ---- 3. Stroke Dash Patterns ----

const dashPatterns = [
  { name: "Solid", dash: null },
  { name: "Dashed (6 3)", dash: "6 3" },
  { name: "Dotted (2 3)", dash: "2 3" },
  { name: "Dash-dot (12 4 4 4)", dash: "12 4 4 4" },
  { name: "Dash-dot-dot (8 3 2 3 2 3)", dash: "8 3 2 3 2 3" },
  { name: "Fine dot (0.1 6)", dash: "0.1 6", linecap: "round" },
  { name: "Long dash (16 6)", dash: "16 6" },
];

const lineColors = ["#4477AA", "#EE6677", "#228833", "#AA3377", "#CCBB44", "#66CCEE", "#0077BB"];
const dashRowH = 26;
const dashSvg = d3.select("#dash-chart").append("svg")
  .attr("width", 560).attr("height", dashPatterns.length * dashRowH + 6);

dashPatterns.forEach((dp, i) => {
  const g = dashSvg.append("g").attr("transform", `translate(10, ${6 + i * dashRowH})`);
  g.append("line")
    .attr("x1", 0).attr("y1", 8).attr("x2", 180).attr("y2", 8)
    .attr("stroke", lineColors[i]).attr("stroke-width", 2.5)
    .attr("stroke-dasharray", dp.dash).attr("stroke-linecap", dp.linecap || "butt");
  g.append("text").attr("x", 196).attr("y", 12).attr("font-size", 10).attr("fill", "#444").text(dp.name);
});


// ---- 4. SVG Filter Textures ----

{
  const container = d3.select("#filter-textures");
  const sw = 140, sh = 100;

  const filters = [
    {
      name: "Noise grain",
      filter: `<filter id="f-noise" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="42" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
        <feComponentTransfer in="gray" result="pat"><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
        <feComposite in="SourceGraphic" in2="pat" operator="atop"/>
      </filter>`
    },
    {
      name: "Paper texture",
      filter: `<filter id="f-paper" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5" seed="7" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
        <feComponentTransfer in="gray" result="pat"><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
        <feComposite in="SourceGraphic" in2="pat" operator="atop"/>
      </filter>`
    },
    {
      name: "Halftone",
      filter: `<filter id="f-halftone" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="turbulence" baseFrequency="0.12" numOctaves="1" seed="1" result="dots"/>
        <feColorMatrix in="dots" type="saturate" values="0" result="bw"/>
        <feComponentTransfer in="bw"><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
        <feComposite in="SourceGraphic" operator="in"/>
      </filter>`
    },
    {
      name: "Coarse noise",
      filter: `<filter id="f-coarse" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="2" seed="13" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
        <feComponentTransfer in="gray" result="pat"><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
        <feComposite in="SourceGraphic" in2="pat" operator="atop"/>
      </filter>`
    }
  ];

  filters.forEach(({ name, filter }, i) => {
    const panel = container.append("div").attr("class", "panel");
    const svg = panel.append("svg").attr("width", sw).attr("height", sh);
    svg.append("defs").html(filter);
    const fid = `f-${["noise","paper","halftone","coarse"][i]}`;

    // Draw colored rects with filter applied
    const fillColors = ["#6baed6", "#fd8d3c", "#74c476", "#9e9ac8"];
    svg.append("rect").attr("width", sw).attr("height", sh)
      .attr("fill", fillColors[i]).attr("rx", 4).attr("filter", `url(#${fid})`);
    // Label on top
    svg.append("text").attr("x", sw / 2).attr("y", sh / 2 + 4)
      .attr("text-anchor", "middle").attr("font-size", 13).attr("font-weight", 600)
      .attr("fill", "#fff").attr("fill-opacity", 0.9)
      .text(name);

    panel.append("div").attr("class", "panel-label").text(fid.replace("f-", "feTurbulence: "));
  });
}


// ---- 5. Density Hatching ----

const densityData = d3.range(12).map(i => ({ index: i, value: 5 + i * 8 }));
const maxDensityVal = d3.max(densityData, d => d.value);

const densityWidth = 560, densityHeight = 110;
const densityMargin = { top: 8, right: 8, bottom: 28, left: 36 };
const dw = densityWidth - densityMargin.left - densityMargin.right;
const dh = densityHeight - densityMargin.top - densityMargin.bottom;

const densitySvg = d3.select("#density-chart").append("svg")
  .attr("width", densityWidth).attr("height", densityHeight);
const densityDefs = densitySvg.append("defs");
const densityG = densitySvg.append("g").attr("transform", `translate(${densityMargin.left},${densityMargin.top})`);

const dx = d3.scaleBand().domain(densityData.map(d => d.index)).range([0, dw]).padding(0.1);
const dy = d3.scaleLinear().domain([0, maxDensityVal * 1.1]).range([dh, 0]);

densityG.append("g").attr("transform", `translate(0,${dh})`).call(d3.axisBottom(dx).tickFormat(i => densityData[i].value)).selectAll("text").attr("font-size", 9);
densityG.append("g").call(d3.axisLeft(dy).ticks(3));

densityData.forEach(d => {
  const spacing = 12 - (d.value / maxDensityVal) * 9;
  const size = Math.max(3, spacing);
  const p = densityDefs.append("pattern")
    .attr("id", `density-${d.index}`)
    .attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse")
    .attr("patternTransform", "rotate(45)");
  p.append("line").attr("y2", size).attr("stroke", "#333").attr("stroke-width", 1);
});

densityG.selectAll(".density-bar")
  .data(densityData)
  .join("rect")
    .attr("class", "density-bar")
    .attr("x", d => dx(d.index))
    .attr("y", d => dy(d.value))
    .attr("width", dx.bandwidth())
    .attr("height", d => dh - dy(d.value))
    .attr("fill", d => `url(#density-${d.index})`)
    .attr("stroke", "#999").attr("stroke-width", 0.5);


// ---- 6. Canvas Pattern Atlas ----

{
  const container = d3.select("#canvas-patterns");
  const cw = 400, ch = 200;
  const dpr = window.devicePixelRatio || 1;

  const panel = container.append("div").attr("class", "panel");
  const canvas = panel.append("canvas")
    .attr("width", cw * dpr).attr("height", ch * dpr)
    .style("width", `${cw}px`).style("height", `${ch}px`).node();
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  // Build pattern atlas — pre-render all tile types
  function drawHatchTile(tctx, size, angle) {
    tctx.save();
    tctx.translate(size / 2, size / 2);
    tctx.rotate(angle * Math.PI / 180);
    tctx.translate(-size / 2, -size / 2);
    tctx.strokeStyle = "#333"; tctx.lineWidth = 1.5;
    tctx.beginPath();
    for (let offset = -size; offset <= size * 2; offset += size) {
      tctx.moveTo(offset, -size); tctx.lineTo(offset, size * 2);
    }
    tctx.stroke();
    tctx.restore();
  }

  function drawDotTile(tctx, size) {
    tctx.fillStyle = "#333";
    tctx.beginPath();
    tctx.arc(size / 2, size / 2, 1.5, 0, Math.PI * 2);
    tctx.fill();
  }

  function drawCrossTile(tctx, size) {
    drawHatchTile(tctx, size, 45);
    drawHatchTile(tctx, size, -45);
  }

  function drawDiamondTile(tctx, size) {
    const half = size / 2;
    tctx.strokeStyle = "#333"; tctx.lineWidth = 1;
    tctx.beginPath();
    tctx.moveTo(half, 0); tctx.lineTo(size, half); tctx.lineTo(half, size); tctx.lineTo(0, half); tctx.closePath();
    tctx.stroke();
  }

  const tileSize = 10;
  const atlasDefs = [
    { name: "Hatch 45°", fn: t => drawHatchTile(t, tileSize, 45) },
    { name: "Hatch -45°", fn: t => drawHatchTile(t, tileSize, -45) },
    { name: "Dots", fn: t => drawDotTile(t, tileSize) },
    { name: "Cross-hatch", fn: t => drawCrossTile(t, tileSize) },
    { name: "Diamonds", fn: t => drawDiamondTile(t, tileSize) },
  ];

  const patterns = atlasDefs.map(({ fn }) => {
    const tile = document.createElement("canvas");
    tile.width = tileSize * dpr; tile.height = tileSize * dpr;
    const tctx = tile.getContext("2d");
    tctx.scale(dpr, dpr);
    fn(tctx);
    return ctx.createPattern(tile, "repeat");
  });

  // Draw bars using Canvas pattern atlas
  const barValues = [65, 82, 45, 91, 58];
  const barW = 50, barGap = 18, startX = 30;
  const maxVal = 100;

  ctx.fillStyle = "#f8f8f8";
  ctx.fillRect(0, 0, cw, ch);

  barValues.forEach((val, i) => {
    const bx = startX + i * (barW + barGap);
    const barH = (val / maxVal) * (ch - 40);
    const by = ch - 20 - barH;

    ctx.fillStyle = patterns[i];
    ctx.fillRect(bx, by, barW, barH);

    ctx.strokeStyle = "#999";
    ctx.lineWidth = 0.5;
    ctx.strokeRect(bx, by, barW, barH);

    // Label
    ctx.fillStyle = "#333";
    ctx.font = "10px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(atlasDefs[i].name, bx + barW / 2, ch - 6);
    ctx.fillText(val, bx + barW / 2, by - 4);
  });

  panel.append("div").attr("class", "panel-label").text("Canvas CanvasPattern atlas — pre-built tiles");
}


// ---- Signal ready ----
document.body.dataset.ready = "true";
document.body.dataset.barMode = "color-only";

</script>
