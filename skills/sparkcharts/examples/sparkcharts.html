<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sparkcharts — D3 Power Tools</title>
<style>
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    margin: 40px;
    color: #222;
    font-size: 14px;
    line-height: 1.6;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .subtitle { color: #666; font-size: 13px; margin: 0 0 28px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin: 28px 0 10px; color: #444; }

  /* Table styles */
  table { border-collapse: separate; border-spacing: 0; width: 100%; max-width: 720px; }
  th, td { padding: 5px 10px; text-align: left; border-bottom: 1px solid #eee; }
  th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: #666; position: sticky; top: 0; background: #fff; }
  td { font-size: 13px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "SF Mono", Monaco, monospace; font-size: 12px; }
  td.spark { white-space: nowrap; line-height: 0; padding: 4px 8px; }
  td.change-pos { color: #2ca02c; }
  td.change-neg { color: #e41a1c; }

  /* Inline sparkline demo */
  .inline-demo { max-width: 600px; line-height: 1.8; margin-bottom: 20px; }
  .spark-inline svg { vertical-align: middle; margin: 0 3px; }

  /* Chart types grid */
  .chart-types { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; max-width: 720px; margin-bottom: 20px; }
  .chart-type { border: 1px solid #eee; border-radius: 4px; padding: 12px; }
  .chart-type .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; color: #666; margin-bottom: 6px; }

  /* Grid */
  .spark-grid { max-width: 720px; }
</style>
</head>
<body>

<h1>Sparkcharts</h1>
<p class="subtitle">Word-sized inline charts: sparklines, bars, win/loss, bullets, bands, and dot strips.</p>

<h2>Chart Types</h2>
<div class="chart-types" id="chart-types"></div>

<h2>Inline in Text</h2>
<div class="inline-demo" id="inline-demo"></div>

<h2>Stock Table</h2>
<table id="stock-table">
  <thead><tr></tr></thead>
  <tbody></tbody>
</table>

<h2>Small Multiples Grid</h2>
<div class="spark-grid" id="spark-grid"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

// --- Sparkline builders ---

function sparkline(container, data, {
  width = 80, height = 16,
  strokeColor = "currentColor", strokeWidth = 1.5,
  showEndpoint = true, endpointRadius = 1.5,
  endpointColor = "#e41a1c",
  curve = d3.curveMonotoneX,
  domain                       // shared y-domain for cross-row comparability
} = {}) {
  const pad = endpointRadius + 0.5;
  const x = d3.scaleLinear().domain([0, data.length - 1]).range([pad, width - pad]);
  const ext = domain || d3.extent(data);
  const y = d3.scaleLinear()
    .domain(ext[0] === ext[1] ? [ext[0] - 1, ext[1] + 1] : ext)
    .range([height - pad, pad]);

  const line = d3.line().x((d, i) => x(i)).y(d => y(d)).curve(curve).defined(d => d != null);

  const svg = d3.select(container).append("svg")
    .attr("width", width).attr("height", height)
    .attr("viewBox", `0 0 ${width} ${height}`)
    .style("vertical-align", "middle")
    .attr("role", "img")
    .attr("aria-label", `Sparkline: min ${d3.min(data)}, max ${d3.max(data)}, latest ${data[data.length - 1]}`);

  svg.append("path").datum(data).attr("d", line)
    .attr("fill", "none").attr("stroke", strokeColor)
    .attr("stroke-width", strokeWidth)
    .attr("stroke-linecap", "round").attr("stroke-linejoin", "round");

  if (showEndpoint) {
    const last = data.length - 1;
    svg.append("circle")
      .attr("cx", x(last)).attr("cy", y(data[last]))
      .attr("r", endpointRadius).attr("fill", endpointColor);
  }
  return svg.node();
}

function sparkArea(container, data, opts = {}) {
  const { width = 80, height = 20, fillColor = "#3182bd", fillOpacity = 0.12, curve = d3.curveMonotoneX } = opts;
  const pad = 1;
  const x = d3.scaleLinear().domain([0, data.length - 1]).range([pad, width - pad]);
  const ext = d3.extent(data);
  const y = d3.scaleLinear().domain(ext[0] === ext[1] ? [ext[0] - 1, ext[1] + 1] : ext).range([height - pad, pad]);

  const area = d3.area().x((d, i) => x(i)).y0(height).y1(d => y(d)).curve(curve);
  const line = d3.line().x((d, i) => x(i)).y(d => y(d)).curve(curve);

  const svg = d3.select(container).append("svg")
    .attr("width", width).attr("height", height)
    .style("vertical-align", "middle")
    .attr("role", "img")
    .attr("aria-label", `Area chart: ${data.length} points`);

  svg.append("path").datum(data).attr("d", area).attr("fill", fillColor).attr("opacity", fillOpacity);
  svg.append("path").datum(data).attr("d", line).attr("fill", "none").attr("stroke", fillColor).attr("stroke-width", 1.5);
  return svg.node();
}

function sparkbar(container, data, {
  width = 80, height = 16,
  barColor = "#3182bd", gap = 1,
  negativeColor = "#e6550d"
} = {}) {
  const n = data.length;
  const barWidth = Math.max(1, (width - gap * (n - 1)) / n);

  const yMin = Math.min(0, d3.min(data));
  const y = d3.scaleLinear().domain([yMin, d3.max(data)]).range([height, 0]);
  const zero = y(0);

  const svg = d3.select(container).append("svg")
    .attr("width", width).attr("height", height)
    .style("vertical-align", "middle")
    .attr("role", "img")
    .attr("aria-label", `Bar chart: ${n} values`);

  svg.selectAll("rect").data(data).join("rect")
    .attr("x", (d, i) => i * (barWidth + gap))
    .attr("y", d => d >= 0 ? y(d) : zero)
    .attr("width", barWidth)
    .attr("height", d => Math.abs(y(d) - zero))
    .attr("fill", d => d >= 0 ? barColor : negativeColor);

  return svg.node();
}

function sparkWinLoss(container, data, {
  width = 80, height = 16,
  winColor = "#2ca02c", lossColor = "#d62728",
  tieColor = "#999", gap = 1
} = {}) {
  const n = data.length;
  const barWidth = Math.max(1, (width - gap * (n - 1)) / n);
  const mid = height / 2;
  const barH = mid - 1;

  const svg = d3.select(container).append("svg")
    .attr("width", width).attr("height", height)
    .style("vertical-align", "middle")
    .attr("role", "img")
    .attr("aria-label", `Win/loss: ${data.filter(d => d > 0).length}W ${data.filter(d => d < 0).length}L`);

  svg.selectAll("rect").data(data).join("rect")
    .attr("x", (d, i) => i * (barWidth + gap))
    .attr("y", d => d > 0 ? mid - barH : d < 0 ? mid + 1 : mid - 0.5)
    .attr("width", barWidth)
    .attr("height", d => d === 0 ? 1 : barH)
    .attr("fill", d => d > 0 ? winColor : d < 0 ? lossColor : tieColor);

  return svg.node();
}

function sparkBullet(container, { value, target, ranges, width = 120, height = 18, colors = ["#e0e0e0", "#ccc", "#b8b8b8"] } = {}) {
  const max = d3.max(ranges);
  const x = d3.scaleLinear().domain([0, max]).range([0, width]);

  const svg = d3.select(container).append("svg")
    .attr("width", width).attr("height", height)
    .style("vertical-align", "middle")
    .attr("role", "img")
    .attr("aria-label", `Bullet: ${value} of ${target} target`);

  [...ranges].sort((a, b) => b - a).forEach((r, i) => {
    svg.append("rect").attr("x", 0).attr("y", 0).attr("width", x(r)).attr("height", height).attr("fill", colors[i]);
  });

  const barH = height * 0.4;
  svg.append("rect").attr("x", 0).attr("y", (height - barH) / 2).attr("width", x(value)).attr("height", barH).attr("fill", "#333");

  const mH = height * 0.7;
  svg.append("line")
    .attr("x1", x(target)).attr("x2", x(target))
    .attr("y1", (height - mH) / 2).attr("y2", (height + mH) / 2)
    .attr("stroke", "#000").attr("stroke-width", 2);

  return svg.node();
}

function sparkBand(container, data, { width = 80, height = 20, bandColor = "#e0e0e0", lineColor = "#333" } = {}) {
  const x = d3.scaleLinear().domain([0, data.length - 1]).range([0, width]);
  const allY = data.flatMap(d => [d.lo, d.hi, d.value]);
  const y = d3.scaleLinear().domain(d3.extent(allY)).range([height - 1, 1]);

  const area = d3.area().x((d, i) => x(i)).y0(d => y(d.lo)).y1(d => y(d.hi)).curve(d3.curveMonotoneX);
  const line = d3.line().x((d, i) => x(i)).y(d => y(d.value)).curve(d3.curveMonotoneX);

  const svg = d3.select(container).append("svg")
    .attr("width", width).attr("height", height)
    .style("vertical-align", "middle")
    .attr("role", "img")
    .attr("aria-label", `Range chart: ${data.length} points`);

  svg.append("path").datum(data).attr("d", area).attr("fill", bandColor);
  svg.append("path").datum(data).attr("d", line).attr("fill", "none").attr("stroke", lineColor).attr("stroke-width", 1.5);
  return svg.node();
}

function sparkDotStrip(container, data, { width = 80, height = 12, dotRadius = 1.5, dotColor = "#3182bd", dotOpacity = 0.6 } = {}) {
  const x = d3.scaleLinear().domain(d3.extent(data)).range([dotRadius, width - dotRadius]);
  const svg = d3.select(container).append("svg")
    .attr("width", width).attr("height", height)
    .style("vertical-align", "middle")
    .attr("role", "img")
    .attr("aria-label", `Distribution: ${data.length} values`);

  svg.selectAll("circle").data(data).join("circle")
    .attr("cx", d => x(d)).attr("cy", height / 2)
    .attr("r", dotRadius).attr("fill", dotColor).attr("opacity", dotOpacity);
  return svg.node();
}


// --- Random data generators ---

function randomWalk(n, start = 50) {
  const vals = [start];
  for (let i = 1; i < n; i++) vals.push(vals[i-1] + (Math.random() - 0.48) * 5);
  return vals;
}

function randomWinLoss(n) {
  return d3.range(n).map(() => {
    const r = Math.random();
    return r < 0.4 ? 1 : r < 0.8 ? -1 : 0;
  });
}


// --- 1. Chart Types showcase ---

const types = d3.select("#chart-types");
const demoData = randomWalk(30);
const demoBarData = d3.range(12).map(() => Math.random() * 10 - 3);
const demoWL = randomWinLoss(20);
const demoBand = d3.range(20).map((_, i) => {
  const v = 50 + Math.sin(i / 3) * 20 + Math.random() * 5;
  return { value: v, lo: v - 5 - Math.random() * 5, hi: v + 5 + Math.random() * 5 };
});
const demoDots = d3.range(40).map(() => d3.randomNormal(50, 15)());

const chartDefs = [
  { label: "Sparkline", fn: c => sparkline(c, demoData, { width: 140, height: 24 }) },
  { label: "Area", fn: c => sparkArea(c, demoData, { width: 140, height: 24 }) },
  { label: "Bar", fn: c => sparkbar(c, demoBarData, { width: 140, height: 24 }) },
  { label: "Win / Loss", fn: c => sparkWinLoss(c, demoWL, { width: 140, height: 24 }) },
  { label: "Bullet", fn: c => sparkBullet(c, { value: 72, target: 85, ranges: [60, 80, 100], width: 140, height: 18 }) },
  { label: "Band / Range", fn: c => sparkBand(c, demoBand, { width: 140, height: 24 }) },
  { label: "Dot Strip", fn: c => sparkDotStrip(c, demoDots, { width: 140, height: 16 }) },
];

chartDefs.forEach(({ label, fn }) => {
  const div = types.append("div").attr("class", "chart-type");
  div.append("div").attr("class", "label").text(label);
  fn(div.node());
});


// --- 2. Inline text ---

const inlineDiv = d3.select("#inline-demo");
const rev = randomWalk(20, 3).map(d => Math.max(0, d));
const users = randomWalk(20, 100).map(d => Math.round(Math.max(0, d)));

const p = inlineDiv.append("p");
p.append("span").text("Revenue has grown steadily ");
sparkline(p.append("span").attr("class", "spark-inline").node(), rev, { width: 60, height: 14, strokeColor: "#2ca02c" });
p.append("span").text(` reaching $${d3.format(",.1f")(rev[rev.length - 1])}M. Meanwhile, active users `);
sparkline(p.append("span").attr("class", "spark-inline").node(), users, { width: 60, height: 14, strokeColor: "#3182bd" });
p.append("span").text(` sit at ${d3.format(",")(users[users.length - 1])}.`);


// --- 3. Stock table ---

const stocks = [
  { name: "AAPL", sector: "Tech" },
  { name: "MSFT", sector: "Tech" },
  { name: "JNJ", sector: "Healthcare" },
  { name: "XOM", sector: "Energy" },
  { name: "JPM", sector: "Finance" },
  { name: "PG", sector: "Consumer" },
  { name: "NVDA", sector: "Tech" },
  { name: "UNH", sector: "Healthcare" },
].map(s => {
  const hist = randomWalk(30, 100 + Math.random() * 100);
  const current = hist[hist.length - 1];
  const prev = hist[hist.length - 2];
  return { ...s, history: hist, current, change: (current - prev) / prev };
});

const cols = [
  { key: "name", label: "Ticker" },
  { key: "sector", label: "Sector" },
  { key: "current", label: "Price", format: d3.format("$,.2f"), cls: "num" },
  { key: "change", label: "Change", format: d3.format("+.2%"), cls: "num" },
  { key: "history", label: "30-day", type: "sparkline" },
];

const table = d3.select("#stock-table");
table.select("thead tr").selectAll("th").data(cols).join("th").text(d => d.label);

const rows = table.select("tbody").selectAll("tr").data(stocks).join("tr");
rows.selectAll("td")
  .data(d => cols.map(col => ({ col, row: d })))
  .join("td")
    .attr("class", ({ col, row }) => {
      if (col.type === "sparkline") return "spark";
      if (col.key === "change") return `num ${row.change >= 0 ? "change-pos" : "change-neg"}`;
      return col.cls || "";
    })
    .each(function({ col, row }) {
      if (col.type === "sparkline") {
        const color = row.change >= 0 ? "#2ca02c" : "#e41a1c";
        sparkline(this, row.history, { width: 80, height: 16, strokeColor: color, endpointColor: color });
      } else {
        d3.select(this).text(col.format ? col.format(row[col.key]) : row[col.key]);
      }
    });


// --- 4. Small multiples grid ---

const gridData = [
  "New York", "Los Angeles", "Chicago", "Houston",
  "Phoenix", "Philadelphia", "San Antonio", "San Diego"
].map(name => ({ label: name, values: randomWalk(40, 60 + Math.random() * 40) }));

const globalExtent = d3.extent(gridData.flatMap(d => d.values));

const grid = d3.select("#spark-grid").append("div")
  .style("display", "grid")
  .style("grid-template-columns", "repeat(4, 1fr)")
  .style("gap", "10px")
  .style("max-width", "720px");

gridData.forEach(({ label, values }) => {
  const cell = grid.append("div")
    .style("border", "1px solid #eee")
    .style("border-radius", "4px")
    .style("padding", "8px 10px");

  cell.append("div")
    .style("font-size", "11px")
    .style("font-weight", "600")
    .style("color", "#666")
    .style("margin-bottom", "4px")
    .text(label);

  const last = values[values.length - 1];
  const first = values[0];
  const color = last >= first ? "#2ca02c" : "#e41a1c";

  cell.append("div")
    .style("font-size", "18px")
    .style("font-weight", "500")
    .style("font-variant-numeric", "tabular-nums")
    .style("color", color)
    .text(d3.format(",.1f")(last));

  const x = d3.scaleLinear().domain([0, values.length - 1]).range([0, 150]);
  const y = d3.scaleLinear().domain(globalExtent).range([30, 2]);
  const line = d3.line().x((d, i) => x(i)).y(d => y(d)).curve(d3.curveMonotoneX);

  const svg = cell.append("svg").attr("width", 150).attr("height", 32);
  svg.append("path").datum(values).attr("d", line)
    .attr("fill", "none").attr("stroke", color).attr("stroke-width", 1.5)
    .attr("stroke-linecap", "round").attr("stroke-linejoin", "round");
});

</script>
</body>
</html>
