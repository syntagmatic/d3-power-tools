<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geographic Maps — D3 Power Tools</title>
<style>
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #fff;
  }
  h2 {
    font-size: 14px;
    font-weight: 500;
    color: #333;
    margin: 24px 0 8px;
  }
  h2:first-of-type { margin-top: 0; }
  .panel {
    display: inline-block;
    vertical-align: top;
    margin: 0 20px 20px 0;
  }
  canvas, svg {
    display: block;
  }
  .legend {
    font-size: 11px;
    color: #555;
  }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 4px 8px;
    border-radius: 3px;
    font-size: 12px;
    display: none;
  }
</style>
</head>
<body>

<h2>US Choropleth — Unemployment Rate by County</h2>
<div class="panel" id="choropleth"></div>

<h2>World — Equal Earth Projection with Graticule</h2>
<div class="panel" id="world"></div>

<h2>Interactive Globe</h2>
<div class="panel" id="globe"></div>

<div class="tooltip" id="tip"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

// ─── US Choropleth (Canvas) ───

const cw = 960, ch = 600;
const canvas = d3.select("#choropleth").append("canvas")
  .attr("width", cw).attr("height", ch)
  .style("width", `${cw}px`).style("height", `${ch}px`);
const ctx = canvas.node().getContext("2d");

const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json");
const counties = topojson.feature(us, us.objects.counties).features;
const states = topojson.mesh(us, us.objects.states, (a, b) => a !== b);
const nation = topojson.merge(us, us.objects.states.geometries);

// Synthetic unemployment data (deterministic from FIPS)
const unemploymentById = new Map(
  counties.map(d => [d.id, ((d.id * 7 + 13) % 100) / 10])
);

const color = d3.scaleQuantize()
  .domain([0, 10])
  .range(d3.schemeBlues[9]);

const projection = d3.geoAlbersUsa().fitSize([cw, ch], nation);
const path = d3.geoPath(projection, ctx);

// Per-feature fill
for (const feature of counties) {
  ctx.beginPath();
  path(feature);
  const val = unemploymentById.get(feature.id);
  ctx.fillStyle = val != null ? color(val) : "#ccc";
  ctx.fill();
}

// State borders
ctx.beginPath();
path(states);
ctx.strokeStyle = "#fff";
ctx.lineWidth = 0.8;
ctx.stroke();

// Nation outline
ctx.beginPath();
path(nation);
ctx.strokeStyle = "#333";
ctx.lineWidth = 1;
ctx.stroke();

// SVG legend overlay
const legendSvg = d3.select("#choropleth").append("svg")
  .attr("width", 300).attr("height", 50)
  .style("position", "relative").style("margin-top", "-56px").style("margin-left", "20px");

const lw = 240, lh = 10;
const legendScale = d3.scaleLinear().domain(color.domain()).range([0, lw]);
const thresholds = color.thresholds();

legendSvg.selectAll("rect")
  .data(color.range().map((c, i) => {
    const d0 = i === 0 ? color.domain()[0] : thresholds[i - 1];
    const d1 = i === color.range().length - 1 ? color.domain()[1] : thresholds[i];
    return [d0, d1, c];
  }))
  .join("rect")
    .attr("x", d => legendScale(d[0]) + 10)
    .attr("y", 8)
    .attr("width", d => legendScale(d[1]) - legendScale(d[0]))
    .attr("height", lh)
    .attr("fill", d => d[2]);

legendSvg.append("g")
  .attr("transform", `translate(10, ${8 + lh})`)
  .call(d3.axisBottom(legendScale).ticks(5).tickSize(4).tickFormat(d => `${d}%`))
  .call(g => g.select(".domain").remove())
  .call(g => g.selectAll("text").attr("font-size", "10px"));


// ─── World Map (SVG) ───

const ww = 960, wh = 500;
const worldSvg = d3.select("#world").append("svg")
  .attr("width", ww).attr("height", wh)
  .attr("viewBox", [0, 0, ww, wh]);

const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
const land = topojson.feature(world, world.objects.land);
const countries = topojson.feature(world, world.objects.countries).features;
const worldBorders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

const worldProjection = d3.geoEqualEarth().fitSize([ww, wh], { type: "Sphere" });
const worldPath = d3.geoPath(worldProjection);
const graticule = d3.geoGraticule().step([20, 20]);

// Sphere background
worldSvg.append("path")
  .datum({ type: "Sphere" })
  .attr("d", worldPath)
  .attr("fill", "#e8f4f8")
  .attr("stroke", "#999");

// Graticule
worldSvg.append("path")
  .datum(graticule())
  .attr("d", worldPath)
  .attr("fill", "none")
  .attr("stroke", "#ddd")
  .attr("stroke-width", 0.5);

// Countries with color by area (synthetic)
const countryColor = d3.scaleSequential(d3.interpolateYlGnBu)
  .domain([0, 5e6]);

worldSvg.selectAll(".country")
  .data(countries)
  .join("path")
    .attr("class", "country")
    .attr("d", worldPath)
    .attr("fill", d => {
      const a = d3.geoArea(d) * 510e6; // approximate km²
      return countryColor(Math.min(a, 5e6));
    })
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.3);

// Borders (single mesh, cleaner than per-feature strokes)
worldSvg.append("path")
  .datum(worldBorders)
  .attr("d", worldPath)
  .attr("fill", "none")
  .attr("stroke", "#999")
  .attr("stroke-width", 0.5)
  .attr("stroke-linejoin", "round");

// Zoom to feature on click
const worldZoom = d3.zoom()
  .scaleExtent([1, 8])
  .on("zoom", (event) => {
    worldSvg.selectAll("path").attr("transform", event.transform);
  });

worldSvg.call(worldZoom);

worldSvg.selectAll(".country").on("click", (event, d) => {
  const [[x0, y0], [x1, y1]] = worldPath.bounds(d);
  const dx = x1 - x0, dy = y1 - y0;
  const x = (x0 + x1) / 2, y = (y0 + y1) / 2;
  const scale = Math.max(1, Math.min(8, 0.9 / Math.max(dx / ww, dy / wh)));
  worldSvg.transition().duration(750).call(
    worldZoom.transform,
    d3.zoomIdentity
      .translate(ww / 2, wh / 2)
      .scale(scale)
      .translate(-x, -y)
  );
});

worldSvg.on("dblclick.zoom", () => {
  worldSvg.transition().duration(750).call(worldZoom.transform, d3.zoomIdentity);
});


// ─── Interactive Globe (Canvas) ───

const gw = 500, gh = 500;
const globeCanvas = d3.select("#globe").append("canvas")
  .attr("width", gw).attr("height", gh)
  .style("width", `${gw}px`).style("height", `${gh}px`);
const gctx = globeCanvas.node().getContext("2d");

const globeProjection = d3.geoOrthographic()
  .scale(gh / 2.2)
  .translate([gw / 2, gh / 2])
  .clipAngle(90);
const globePath = d3.geoPath(globeProjection, gctx);
const globeGraticule = d3.geoGraticule().step([15, 15]);

function renderGlobe() {
  gctx.clearRect(0, 0, gw, gh);

  // Sphere
  gctx.beginPath();
  globePath({ type: "Sphere" });
  gctx.fillStyle = "#e8f4f8";
  gctx.fill();
  gctx.strokeStyle = "#999";
  gctx.lineWidth = 1;
  gctx.stroke();

  // Graticule
  gctx.beginPath();
  globePath(globeGraticule());
  gctx.strokeStyle = "#ddd";
  gctx.lineWidth = 0.4;
  gctx.stroke();

  // Land
  gctx.beginPath();
  globePath(land);
  gctx.fillStyle = "#b8d4a0";
  gctx.fill();

  // Borders
  gctx.beginPath();
  globePath(worldBorders);
  gctx.strokeStyle = "#fff";
  gctx.lineWidth = 0.5;
  gctx.stroke();
}

renderGlobe();

// Drag to rotate (simple 2-axis)
let [λ, φ] = globeProjection.rotate();

d3.select(globeCanvas.node()).call(
  d3.drag()
    .on("drag", (event) => {
      λ += event.dx * 0.4;
      φ -= event.dy * 0.4;
      φ = Math.max(-90, Math.min(90, φ));
      globeProjection.rotate([λ, φ]);
      renderGlobe();
    })
);


// ─── Tooltip for US choropleth ───

const tip = d3.select("#tip");
const hiddenCanvas = document.createElement("canvas");
hiddenCanvas.width = cw;
hiddenCanvas.height = ch;
const hctx = hiddenCanvas.getContext("2d", { willReadFrequently: true });
const hiddenPath = d3.geoPath(projection, hctx);
const colorToCounty = new Map();

counties.forEach((f, i) => {
  const r = (i >> 16) & 255, g = (i >> 8) & 255, b = i & 255;
  const c = `${r},${g},${b}`;
  colorToCounty.set(c, f);
  hctx.beginPath();
  hiddenPath(f);
  hctx.fillStyle = `rgb(${r},${g},${b})`;
  hctx.fill();
});

canvas.on("mousemove", (event) => {
  const [mx, my] = d3.pointer(event);
  const [r, g, b] = hctx.getImageData(mx, my, 1, 1).data;
  const key = `${r},${g},${b}`;
  const feature = colorToCounty.get(key);
  if (feature) {
    const val = unemploymentById.get(feature.id);
    tip.style("display", "block")
      .style("left", `${event.pageX + 12}px`)
      .style("top", `${event.pageY - 20}px`)
      .html(`FIPS ${feature.id}<br>${val != null ? val.toFixed(1) + "%" : "N/A"}`);
  } else {
    tip.style("display", "none");
  }
});
canvas.on("mouseleave", () => tip.style("display", "none"));


// Signal ready
document.body.setAttribute("data-ready", "true");
</script>
</body>
</html>
