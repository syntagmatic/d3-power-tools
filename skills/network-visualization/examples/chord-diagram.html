<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chord Diagram</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; }
    #controls { padding: 8px 16px; display: flex; gap: 8px; align-items: center; }
    button { padding: 4px 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
    button.active { background: #4682b4; color: #fff; border-color: #4682b4; }
    svg { display: block; margin: 0 auto; }
    .ribbon { cursor: pointer; }
    .group-arc { cursor: pointer; }
    #status { padding: 4px 16px; font-size: 13px; color: #666; text-align: center; }
    #tooltip { position: absolute; padding: 6px 10px; background: rgba(0,0,0,0.85); color: #fff; border-radius: 4px; font-size: 12px; pointer-events: none; display: none; max-width: 220px; }
  </style>
</head>
<body>
  <div id="controls">
    <button data-action="departments" class="active">Departments</button>
    <button data-action="regions">Regions</button>
    <button data-action="pad-wide">Wide Padding</button>
    <button data-action="pad-narrow">Narrow Padding</button>
  </div>
  <svg id="chart"></svg>
  <div id="status"></div>
  <div id="tooltip"></div>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const width = 800, height = 800;
    const outerRadius = Math.min(width, height) / 2 - 60;
    const innerRadius = outerRadius - 30;

    const svg = d3.select("#chart")
      .attr("width", width).attr("height", height)
      .attr("viewBox", [-width / 2, -height / 2, width, height]);

    const tooltip = document.getElementById("tooltip");
    const status = document.getElementById("status");
    const color = d3.scaleOrdinal(d3.schemeTableau10);

    // Datasets
    const datasets = {
      departments: {
        names: ["Engineering", "Design", "Product", "Marketing", "Sales", "Support"],
        matrix: [
          [0, 45, 30, 15, 10, 20],
          [35, 0, 40, 10, 5, 8],
          [25, 35, 0, 30, 20, 15],
          [10, 8, 25, 0, 40, 12],
          [8, 3, 15, 35, 0, 25],
          [15, 6, 12, 10, 20, 0],
        ],
      },
      regions: {
        names: ["North America", "Europe", "Asia Pacific", "Latin America", "Middle East"],
        matrix: [
          [0, 120, 85, 45, 30],
          [95, 0, 70, 25, 50],
          [75, 60, 0, 35, 40],
          [40, 20, 30, 0, 15],
          [25, 45, 35, 10, 0],
        ],
      },
    };

    let currentDataset = "departments";
    let padAngle = 0.05;

    const chord = d3.chord().padAngle(padAngle).sortSubgroups(d3.descending);
    const arc = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);
    const ribbon = d3.ribbon().radius(innerRadius);

    const gGroups = svg.append("g").attr("class", "groups-layer");
    const gRibbons = svg.append("g").attr("class", "ribbons-layer");
    const gLabels = svg.append("g").attr("class", "labels-layer");

    function render(data, animate = true) {
      const chords = chord(data.matrix);
      const t = animate ? d3.transition().duration(600) : d3.transition().duration(0);

      // Group arcs
      const groups = gGroups.selectAll(".group-arc")
        .data(chords.groups, d => d.index);

      groups.exit().transition(t).attr("opacity", 0).remove();

      const groupsEnter = groups.enter().append("path")
        .attr("class", "group-arc")
        .attr("opacity", 0);

      groupsEnter.merge(groups).transition(t)
        .attr("d", arc)
        .attr("fill", d => color(data.names[d.index]))
        .attr("stroke", "#fff")
        .attr("opacity", 1);

      // Group labels
      const labels = gLabels.selectAll(".group-label")
        .data(chords.groups, d => d.index);

      labels.exit().transition(t).attr("opacity", 0).remove();

      const labelsEnter = labels.enter().append("text")
        .attr("class", "group-label")
        .attr("dy", "0.35em")
        .style("font-size", "12px")
        .attr("opacity", 0);

      labelsEnter.merge(labels).transition(t)
        .attr("opacity", d => d.endAngle - d.startAngle > 0.08 ? 1 : 0)
        .attr("transform", d => {
          const angle = (d.startAngle + d.endAngle) / 2;
          return `rotate(${angle * 180 / Math.PI - 90}) translate(${outerRadius + 14})${angle > Math.PI ? " rotate(180)" : ""}`;
        })
        .attr("text-anchor", d => {
          const angle = (d.startAngle + d.endAngle) / 2;
          return angle > Math.PI ? "end" : "start";
        })
        .text(d => data.names[d.index]);

      // Ribbons
      const ribbons = gRibbons.selectAll(".ribbon")
        .data(chords, d => `${d.source.index}-${d.target.index}`);

      ribbons.exit().transition(t).attr("opacity", 0).remove();

      const ribbonsEnter = ribbons.enter().append("path")
        .attr("class", "ribbon")
        .attr("opacity", 0);

      ribbonsEnter.merge(ribbons).transition(t)
        .attr("d", ribbon)
        .attr("fill", d => color(data.names[d.source.index]))
        .attr("stroke", "#fff")
        .attr("stroke-width", 0.5)
        .attr("opacity", 0.67);

      // Interaction — highlight on group hover
      gGroups.selectAll(".group-arc")
        .on("mouseover", (event, d) => {
          gRibbons.selectAll(".ribbon")
            .attr("opacity", r =>
              r.source.index === d.index || r.target.index === d.index ? 0.85 : 0.08);
          const total = data.matrix[d.index].reduce((a, b) => a + b, 0);
          tooltip.style.display = "block";
          tooltip.innerHTML = `<strong>${data.names[d.index]}</strong><br>Total flow: ${total}`;
          svg.node().parentElement.dataset.highlightedGroup = data.names[d.index];
        })
        .on("pointermove", (event) => {
          tooltip.style.left = (event.pageX + 12) + "px";
          tooltip.style.top = (event.pageY - 8) + "px";
        })
        .on("mouseout", () => {
          gRibbons.selectAll(".ribbon").attr("opacity", 0.67);
          tooltip.style.display = "none";
          svg.node().parentElement.dataset.highlightedGroup = "";
        });

      // Ribbon hover
      gRibbons.selectAll(".ribbon")
        .on("mouseover", (event, d) => {
          d3.select(event.currentTarget).attr("opacity", 0.95);
          tooltip.style.display = "block";
          tooltip.innerHTML = `${data.names[d.source.index]} → ${data.names[d.target.index]}: ${data.matrix[d.source.index][d.target.index]}<br>${data.names[d.target.index]} → ${data.names[d.source.index]}: ${data.matrix[d.target.index][d.source.index]}`;
        })
        .on("pointermove", (event) => {
          tooltip.style.left = (event.pageX + 12) + "px";
          tooltip.style.top = (event.pageY - 8) + "px";
        })
        .on("mouseout", (event) => {
          d3.select(event.currentTarget).attr("opacity", 0.67);
          tooltip.style.display = "none";
        });

      status.textContent = `${data.names.length} groups, ${chords.length} ribbons | Dataset: ${currentDataset}`;
      document.body.dataset.groups = data.names.length;
      document.body.dataset.ribbons = chords.length;
      document.body.dataset.dataset = currentDataset;
    }

    render(datasets[currentDataset], false);

    // Controls
    document.getElementById("controls").addEventListener("click", (e) => {
      const action = e.target.dataset?.action;
      if (!action) return;

      if (action === "departments" || action === "regions") {
        currentDataset = action;
        document.querySelectorAll("button[data-action=departments],button[data-action=regions]").forEach(b =>
          b.classList.toggle("active", b.dataset.action === action));
        render(datasets[currentDataset]);
      } else if (action === "pad-wide") {
        padAngle = 0.12;
        chord.padAngle(padAngle);
        render(datasets[currentDataset]);
      } else if (action === "pad-narrow") {
        padAngle = 0.02;
        chord.padAngle(padAngle);
        render(datasets[currentDataset]);
      }
    });

    document.body.dataset.ready = "true";
  </script>
</body>
</html>
