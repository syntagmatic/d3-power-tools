<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotations &amp; Labels — D3 Power Tools</title>
<style>
  :root {
    --color-bg: #fafafa;
    --color-text: #333;
    --color-muted: #888;
    --color-axis: #ccc;
    --color-grid: #eee;
    --color-dot: #4e79a7;
    --color-dot-stroke: #3a6291;
    --color-highlight: #e15759;
    --color-annotation: #555;
    --color-leader: #999;
    --color-threshold: #e15759;
    --color-label-bg: rgba(255,255,255,0.88);
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-size-label: 11px;
    --font-size-annotation: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-family);
    background: var(--color-bg);
    color: var(--color-text);
    display: flex;
    justify-content: center;
    padding: 24px;
  }

  #chart-container {
    width: 100%;
    max-width: 900px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 20px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--color-text);
  }

  .subtitle {
    font-size: 13px;
    color: var(--color-muted);
    margin-bottom: 16px;
  }

  .axis text {
    font-size: 11px;
    fill: var(--color-muted);
  }

  .axis line, .axis path {
    stroke: var(--color-axis);
  }

  .grid line {
    stroke: var(--color-grid);
    stroke-dasharray: 2,2;
  }

  .grid path {
    stroke: none;
  }

  .annotation-leader {
    fill: none;
    stroke: var(--color-leader);
    stroke-width: 1;
  }

  .annotation-subject {
    fill: none;
    stroke: var(--color-highlight);
    stroke-width: 1.5;
  }

  .annotation-title {
    font-size: var(--font-size-annotation);
    font-weight: 600;
    fill: var(--color-text);
  }

  .annotation-text {
    font-size: 11px;
    fill: var(--color-annotation);
  }

  .label-text {
    font-size: var(--font-size-label);
    fill: var(--color-muted);
  }

  .label-leader {
    stroke: var(--color-leader);
    stroke-width: 0.7;
    fill: none;
  }

  .threshold-line {
    stroke: var(--color-threshold);
    stroke-width: 1.5;
    stroke-dasharray: 6,3;
  }

  .threshold-label {
    font-size: 11px;
    font-weight: 600;
    fill: var(--color-threshold);
  }
</style>
</head>
<body>

<div id="chart-container">
  <h1>Technology Companies — Revenue vs. Growth</h1>
  <p class="subtitle">Force-placed labels with callout annotations and threshold reference line</p>
  <div id="chart"></div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Data: 30 fictional tech companies ---
const data = [
  { label: "Nexora", x: 12, y: 34, r: 6 },
  { label: "Veltrix", x: 45, y: 67, r: 9 },
  { label: "Quantix", x: 78, y: 23, r: 5 },
  { label: "Synapt", x: 23, y: 89, r: 11 },
  { label: "Omnius", x: 56, y: 45, r: 7 },
  { label: "Heliora", x: 89, y: 78, r: 13 },
  { label: "Driftly", x: 34, y: 12, r: 4 },
  { label: "Pyralis", x: 67, y: 56, r: 8 },
  { label: "Cendrix", x: 91, y: 91, r: 15 },
  { label: "Aurabit", x: 15, y: 72, r: 10 },
  { label: "Floware", x: 42, y: 38, r: 6 },
  { label: "Kintara", x: 73, y: 15, r: 4 },
  { label: "Zephlux", x: 28, y: 55, r: 7 },
  { label: "Novaxis", x: 61, y: 82, r: 12 },
  { label: "Stratiq", x: 85, y: 41, r: 6 },
  { label: "Pulseon", x: 19, y: 48, r: 5 },
  { label: "Triblix", x: 52, y: 28, r: 5 },
  { label: "Wavenet", x: 37, y: 76, r: 10 },
  { label: "Ecliptor", x: 65, y: 63, r: 9 },
  { label: "Lumigen", x: 8, y: 19, r: 3 },
  { label: "Firmara", x: 48, y: 52, r: 7 },
  { label: "Grideon", x: 82, y: 58, r: 8 },
  { label: "Solvian", x: 30, y: 33, r: 5 },
  { label: "Optique", x: 71, y: 43, r: 6 },
  { label: "Aeronyx", x: 55, y: 71, r: 9 },
  { label: "Bricada", x: 95, y: 12, r: 3 },
  { label: "Halorix", x: 40, y: 85, r: 11 },
  { label: "Deltum", x: 18, y: 61, r: 8 },
  { label: "Cytrex", x: 76, y: 35, r: 5 },
  { label: "Magnova", x: 60, y: 18, r: 4 },
];

// Annotations for notable data points
const annotationDefs = [
  {
    target: "Cendrix",
    title: "Market Leader",
    text: "Highest revenue & growth",
    dx: -70, dy: -50,
    connector: "curve",
  },
  {
    target: "Heliora",
    title: "Strong Performer",
    text: "High growth, large scale",
    dx: -80, dy: 40,
    connector: "elbow",
  },
  {
    target: "Synapt",
    title: "Fast Grower",
    text: "Rapid expansion phase",
    dx: 60, dy: -45,
    connector: "curve",
  },
  {
    target: "Lumigen",
    title: "Early Stage",
    text: "Small but emerging",
    dx: 55, dy: 40,
    connector: "elbow",
  },
];

const thresholdValue = 50; // growth rate threshold

// --- Chart setup ---
const margin = { top: 16, right: 24, bottom: 44, left: 52 };
const container = d3.select("#chart");

function render() {
  container.selectAll("svg").remove();

  const containerWidth = container.node().getBoundingClientRect().width;
  const width = containerWidth - margin.left - margin.right;
  const height = Math.max(300, Math.min(500, containerWidth * 0.55)) - margin.top - margin.bottom;

  const xScale = d3.scaleLinear().domain([0, 100]).range([0, width]);
  const yScale = d3.scaleLinear().domain([0, 100]).range([height, 0]);
  const rScale = d3.scaleSqrt().domain([3, 15]).range([4, 16]);

  const svg = container.append("svg")
    .attr("width", containerWidth)
    .attr("height", height + margin.top + margin.bottom)
    .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // --- Grid ---
  svg.append("g")
    .attr("class", "grid")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(xScale).ticks(5).tickSize(-height).tickFormat(""));

  svg.append("g")
    .attr("class", "grid")
    .call(d3.axisLeft(yScale).ticks(5).tickSize(-width).tickFormat(""));

  // --- Axes ---
  svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(xScale).ticks(5));

  svg.append("g")
    .attr("class", "axis")
    .call(d3.axisLeft(yScale).ticks(5));

  // Axis labels
  svg.append("text")
    .attr("x", width / 2)
    .attr("y", height + 38)
    .attr("text-anchor", "middle")
    .attr("font-size", "12px")
    .attr("fill", "var(--color-muted)")
    .text("Revenue ($B)");

  svg.append("text")
    .attr("transform", "rotate(-90)")
    .attr("x", -height / 2)
    .attr("y", -40)
    .attr("text-anchor", "middle")
    .attr("font-size", "12px")
    .attr("fill", "var(--color-muted)")
    .text("Growth Rate (%)");

  // --- Threshold line ---
  const thresholdY = yScale(thresholdValue);
  svg.append("line")
    .attr("class", "threshold-line")
    .attr("x1", 0).attr("x2", width)
    .attr("y1", thresholdY).attr("y2", thresholdY);

  svg.append("text")
    .attr("class", "threshold-label")
    .attr("x", width - 4)
    .attr("y", thresholdY - 6)
    .attr("text-anchor", "end")
    .text("50% Growth Threshold");

  // --- Data layer ---
  const dataLayer = svg.append("g").attr("class", "data-layer");

  dataLayer.selectAll("circle")
    .data(data)
    .join("circle")
    .attr("cx", d => xScale(d.x))
    .attr("cy", d => yScale(d.y))
    .attr("r", d => rScale(d.r))
    .attr("fill", "var(--color-dot)")
    .attr("fill-opacity", 0.7)
    .attr("stroke", "var(--color-dot-stroke)")
    .attr("stroke-width", 1);

  // --- Force-based label placement ---
  const fontSize = containerWidth < 500 ? 9 : 11;
  const padding = 2;

  // Determine which labels to show based on width
  const showAll = containerWidth >= 700;
  const showMost = containerWidth >= 500;
  const labelsToShow = showAll ? data : showMost ? data.filter((_, i) => i % 2 === 0) : data.filter((_, i) => i % 3 === 0);

  const labelNodes = labelsToShow.map(d => ({
    ...d,
    targetX: xScale(d.x),
    targetY: yScale(d.y),
    x: xScale(d.x) + 10,
    y: yScale(d.y),
    labelWidth: d.label.length * fontSize * 0.6 + padding * 2,
    labelHeight: fontSize + padding * 2,
  }));

  // Rectangular collision force for text labels
  const rectCollide = (() => {
    let nodes;
    const force = (alpha) => {
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const overlapX = (a.labelWidth + b.labelWidth) / 2 + padding - Math.abs(dx);
          const overlapY = (a.labelHeight + b.labelHeight) / 2 + padding - Math.abs(dy);
          if (overlapX > 0 && overlapY > 0) {
            if (overlapX < overlapY) {
              const shift = overlapX * alpha * 0.5;
              a.x -= Math.sign(dx) * shift;
              b.x += Math.sign(dx) * shift;
            } else {
              const shift = overlapY * alpha * 0.5;
              a.y -= Math.sign(dy) * shift;
              b.y += Math.sign(dy) * shift;
            }
          }
        }
      }
    };
    force.initialize = (n) => { nodes = n; };
    return force;
  })();

  // Bounding box force
  const boundingBox = (() => {
    let nodes;
    const force = () => {
      for (const d of nodes) {
        const hw = d.labelWidth / 2, hh = d.labelHeight / 2;
        if (d.x - hw < 0) { d.x = hw; d.vx = 0; }
        if (d.x + hw > width) { d.x = width - hw; d.vx = 0; }
        if (d.y - hh < 0) { d.y = hh; d.vy = 0; }
        if (d.y + hh > height) { d.y = height - hh; d.vy = 0; }
      }
    };
    force.initialize = (n) => { nodes = n; };
    return force;
  })();

  const labelSim = d3.forceSimulation(labelNodes)
    .force("x", d3.forceX(d => d.targetX + 12).strength(0.3))
    .force("y", d3.forceY(d => d.targetY).strength(0.5))
    .force("collide", rectCollide)
    .force("bounds", boundingBox)
    .alphaDecay(0.05)
    .velocityDecay(0.6)
    .stop();

  for (let i = 0; i < 150; i++) labelSim.tick();

  // Draw label leaders and text
  const labelLayer = svg.append("g").attr("class", "label-layer");

  // Exclude annotated points from regular labels
  const annotatedLabels = new Set(annotationDefs.map(a => a.target));

  labelNodes.filter(d => !annotatedLabels.has(d.label)).forEach(d => {
    // Leader line from data point to label
    const dist = Math.hypot(d.x - d.targetX, d.y - d.targetY);
    if (dist > 8) {
      labelLayer.append("line")
        .attr("class", "label-leader")
        .attr("x1", d.targetX)
        .attr("y1", d.targetY)
        .attr("x2", d.x)
        .attr("y2", d.y);
    }

    // Background rect for readability
    labelLayer.append("rect")
      .attr("x", d.x - 2)
      .attr("y", d.y - fontSize + 1)
      .attr("width", d.labelWidth)
      .attr("height", d.labelHeight)
      .attr("fill", "var(--color-label-bg)")
      .attr("rx", 2);

    labelLayer.append("text")
      .attr("class", "label-text")
      .attr("x", d.x)
      .attr("y", d.y)
      .attr("font-size", `${fontSize}px`)
      .text(d.label);
  });

  // --- Callout annotations ---
  const annotationLayer = svg.append("g").attr("class", "annotation-layer");

  annotationDefs.forEach(ann => {
    const d = data.find(p => p.label === ann.target);
    if (!d) return;

    const sx = xScale(d.x), sy = yScale(d.y);

    // Clamp annotation position within chart bounds
    let dx = ann.dx, dy = ann.dy;
    if (containerWidth < 600) {
      dx *= 0.7;
      dy *= 0.7;
    }

    // Flip if annotation would go out of bounds
    if (sx + dx < 10) dx = Math.abs(dx);
    if (sx + dx > width - 10) dx = -Math.abs(dx);
    if (sy + dy < 10) dy = Math.abs(dy);
    if (sy + dy > height - 10) dy = -Math.abs(dy);

    const g = annotationLayer.append("g")
      .attr("transform", `translate(${sx},${sy})`);

    // Subject circle
    g.append("circle")
      .attr("class", "annotation-subject")
      .attr("r", rScale(d.r) + 3);

    // Connector path
    let pathD;
    if (ann.connector === "elbow") {
      pathD = `M0,0 L${dx},0 L${dx},${dy}`;
    } else {
      pathD = `M0,0 Q${dx},0 ${dx},${dy}`;
    }

    g.append("path")
      .attr("class", "annotation-leader")
      .attr("d", pathD);

    // Note background
    const noteG = g.append("g")
      .attr("transform", `translate(${dx},${dy})`);

    const textAnchor = dx > 0 ? "start" : "end";
    const textX = dx > 0 ? 4 : -4;

    // Title
    noteG.append("text")
      .attr("class", "annotation-title")
      .attr("x", textX)
      .attr("dy", "-0.4em")
      .attr("text-anchor", textAnchor)
      .text(ann.title);

    // Description
    noteG.append("text")
      .attr("class", "annotation-text")
      .attr("x", textX)
      .attr("dy", "0.9em")
      .attr("text-anchor", textAnchor)
      .text(ann.text);

    // Background rects behind text for readability
    noteG.selectAll("text").each(function () {
      const bbox = this.getBBox();
      noteG.insert("rect", "text")
        .attr("x", bbox.x - 2)
        .attr("y", bbox.y - 1)
        .attr("width", bbox.width + 4)
        .attr("height", bbox.height + 2)
        .attr("fill", "var(--color-label-bg)")
        .attr("rx", 2);
    });
  });
}

// Initial render
render();

// Responsive via ResizeObserver
const ro = new ResizeObserver(() => render());
ro.observe(document.getElementById("chart-container"));
</script>
</body>
</html>
