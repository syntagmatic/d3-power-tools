<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Table with Chart Toggle</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #fafafa; }
  #container { max-width: 960px; margin: 0 auto; padding: 16px; }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 8px 0; }
  .toolbar button { padding: 5px 14px; border: 1px solid #ccc; border-radius: 4px;
    background: #fff; cursor: pointer; font-size: 13px; }
  .toolbar button:hover { background: #f0f0f0; }
  .toolbar button[aria-pressed="true"] { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .toolbar input[type="search"] { padding: 5px 10px; border: 1px solid #ccc; border-radius: 4px;
    font-size: 13px; width: 200px; }
  #status { font-size: 12px; color: #666; padding: 4px 0; }

  /* Chart */
  #chart-container { background: #fff; border: 1px solid #ddd; border-radius: 4px; }
  .dot { cursor: pointer; transition: opacity 0.15s; }
  .dot.dimmed { opacity: 0.12; }
  .dot.hovered { stroke: #333; stroke-width: 2; }
  .axis text { font-size: 11px; }
  .axis-label { font-size: 12px; fill: #555; }

  /* Table */
  #table-container { background: #fff; border: 1px solid #ddd; border-radius: 4px;
    max-height: 460px; overflow-y: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  thead th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #333;
    font-weight: 600; white-space: nowrap; position: sticky; top: 0; background: #fff;
    z-index: 1; cursor: pointer; user-select: none; }
  thead th:hover { background: #f5f5f5; }
  thead th.sort-asc::after { content: ' ▲'; font-size: 10px; }
  thead th.sort-desc::after { content: ' ▼'; font-size: 10px; }
  tbody td { padding: 6px 12px; border-bottom: 1px solid #eee; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:nth-child(even) { background: #fafafa; }
  tbody tr:hover { background: #f0f4f8; }
  tbody tr.hovered { background: #e3f2fd; }
  tbody tr.selected { background: #bbdefb; font-weight: 600; }
  tbody tr.selected.hovered { background: #90caf9; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div id="container">
  <div class="toolbar">
    <button id="toggle" aria-pressed="false">Show as table</button>
    <input type="search" id="search" placeholder="Filter rows…" aria-label="Filter table rows">
    <button id="csv-btn">Download CSV</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="chart-container"><svg id="chart"></svg></div>
  <div id="table-container" style="display:none" aria-hidden="true"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ============================
// Data generation
// ============================
const continents = ['Africa', 'Asia', 'Europe', 'N. America', 'S. America', 'Oceania'];
const rng = d3.randomLcg(42);
const rand = d3.randomNormal.source(rng);

const data = d3.range(80).map(i => {
  const continent = continents[Math.floor(rng() * continents.length)];
  const baseGdp = { Africa: 3000, Asia: 15000, Europe: 35000,
    'N. America': 30000, 'S. America': 10000, Oceania: 25000 }[continent];
  const basePop = { Africa: 30, Asia: 80, Europe: 20,
    'N. America': 40, 'S. America': 25, Oceania: 8 }[continent];
  return {
    id: i,
    name: `Country ${String.fromCharCode(65 + Math.floor(i / 3))}${(i % 3) + 1}`,
    population: Math.max(1, Math.round(basePop * (0.3 + rng() * 2))),
    gdp: Math.max(500, Math.round(baseGdp * (0.3 + rng() * 1.5))),
    lifeExp: Math.min(85, Math.max(45, Math.round(50 + rng() * 35))),
    continent
  };
});

// ============================
// Shared state
// ============================
const state = {
  hoveredId: null,
  selectedIds: new Set(),
  listeners: [],
  onHover(id) { this.hoveredId = id; this.notify(); },
  onSelect(id) {
    this.selectedIds.has(id) ? this.selectedIds.delete(id) : this.selectedIds.add(id);
    this.notify();
  },
  clearSelection() { this.selectedIds.clear(); this.notify(); },
  onChange(fn) { this.listeners.push(fn); },
  notify() { for (const fn of this.listeners) fn(); }
};

const columns = [
  { key: 'name', label: 'Name', type: 'string' },
  { key: 'continent', label: 'Continent', type: 'string' },
  { key: 'population', label: 'Population (M)', type: 'number', format: d3.format(',') },
  { key: 'gdp', label: 'GDP/capita', type: 'number', format: d3.format('$,') },
  { key: 'lifeExp', label: 'Life Exp.', type: 'number' }
];

const color = d3.scaleOrdinal(d3.schemeTableau10).domain(continents);

// ============================
// Scatter plot
// ============================
const margin = { top: 20, right: 20, bottom: 50, left: 60 };
const width = 920, height = 440;
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const svg = d3.select('#chart')
  .attr('width', width).attr('height', height)
  .attr('viewBox', `0 0 ${width} ${height}`);

const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

const x = d3.scaleLog()
  .domain(d3.extent(data, d => d.gdp)).nice()
  .range([0, innerW]);

const y = d3.scaleLinear()
  .domain(d3.extent(data, d => d.lifeExp)).nice()
  .range([innerH, 0]);

const r = d3.scaleSqrt()
  .domain(d3.extent(data, d => d.population))
  .range([4, 24]);

// Axes
g.append('g').attr('class', 'axis')
  .attr('transform', `translate(0,${innerH})`)
  .call(d3.axisBottom(x).ticks(6, '$,'));
g.append('g').attr('class', 'axis')
  .call(d3.axisLeft(y));

g.append('text').attr('class', 'axis-label')
  .attr('x', innerW / 2).attr('y', innerH + 40).attr('text-anchor', 'middle')
  .text('GDP per Capita');
g.append('text').attr('class', 'axis-label')
  .attr('transform', 'rotate(-90)')
  .attr('x', -innerH / 2).attr('y', -45).attr('text-anchor', 'middle')
  .text('Life Expectancy');

const dots = g.selectAll('.dot')
  .data(data, d => d.id)
  .join('circle')
    .attr('class', 'dot')
    .attr('cx', d => x(d.gdp))
    .attr('cy', d => y(d.lifeExp))
    .attr('r', d => r(d.population))
    .attr('fill', d => color(d.continent))
    .attr('fill-opacity', 0.75)
    .attr('stroke', 'none');

dots.on('mouseenter', (e, d) => state.onHover(d.id))
  .on('mouseleave', () => state.onHover(null))
  .on('click', (e, d) => state.onSelect(d.id));

// Legend
const legend = svg.append('g')
  .attr('transform', `translate(${margin.left + 10}, ${margin.top + 5})`);
continents.forEach((c, i) => {
  const row = legend.append('g').attr('transform', `translate(0, ${i * 18})`);
  row.append('circle').attr('r', 5).attr('fill', color(c));
  row.append('text').attr('x', 10).attr('y', 4).attr('font-size', 11).text(c);
});

function renderChart() {
  const hasSelection = state.selectedIds.size > 0;
  dots.classed('dimmed', d => hasSelection && !state.selectedIds.has(d.id))
    .classed('hovered', d => d.id === state.hoveredId)
    .attr('stroke', d => d.id === state.hoveredId ? '#333' : 'none')
    .attr('stroke-width', d => d.id === state.hoveredId ? 2 : 0);
}

// ============================
// Table
// ============================
let currentData = data;
let sortKey = null, sortOrder = 'ascending';

function buildTable() {
  const tc = d3.select('#table-container');
  tc.selectAll('*').remove();

  const table = tc.append('table').attr('role', 'table');
  table.append('caption').attr('class', 'sr-only')
    .text(`Data table with ${currentData.length} rows`);

  const thead = table.append('thead').append('tr');
  thead.selectAll('th')
    .data(columns)
    .join('th')
      .attr('scope', 'col')
      .attr('tabindex', '0')
      .attr('aria-sort', d => d.key === sortKey ? sortOrder : 'none')
      .classed('sort-asc', d => d.key === sortKey && sortOrder === 'ascending')
      .classed('sort-desc', d => d.key === sortKey && sortOrder === 'descending')
      .text(d => d.label)
      .on('click', (e, col) => sortBy(col))
      .on('keydown', function(e, col) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(col); }
      });

  table.append('tbody');
  updateTableRows();
}

function sortBy(col) {
  if (sortKey === col.key) {
    sortOrder = sortOrder === 'ascending' ? 'descending' : 'ascending';
  } else {
    sortKey = col.key;
    sortOrder = 'ascending';
  }
  const cmp = sortOrder === 'ascending' ? d3.ascending : d3.descending;
  currentData = [...currentData].sort((a, b) => cmp(a[sortKey], b[sortKey]));
  buildTable();
}

function updateTableRows() {
  const tbody = d3.select('#table-container tbody');

  const rows = tbody.selectAll('tr')
    .data(currentData, d => d.id)
    .join('tr')
      .classed('hovered', d => d.id === state.hoveredId)
      .classed('selected', d => state.selectedIds.has(d.id))
      .on('mouseenter', (e, d) => state.onHover(d.id))
      .on('mouseleave', () => state.onHover(null))
      .on('click', (e, d) => state.onSelect(d.id));

  rows.selectAll('td')
    .data(d => columns.map(col => ({
      value: col.format ? col.format(d[col.key]) : d[col.key],
      type: col.type
    })))
    .join('td')
      .attr('class', d => d.type === 'number' ? 'num' : null)
      .text(d => d.value);

  d3.select('#status').text(
    currentData.length < data.length
      ? `Showing ${currentData.length} of ${data.length}`
      : `${data.length} rows`
  );
}

buildTable();

// ============================
// Linked state updates
// ============================
state.onChange(() => {
  renderChart();
  // Update table row classes without rebuilding
  d3.select('#table-container tbody').selectAll('tr')
    .classed('hovered', d => d.id === state.hoveredId)
    .classed('selected', d => state.selectedIds.has(d.id));

  // Scroll to hovered row in table view (only if table is visible)
  if (state.hoveredId != null && d3.select('#table-container').style('display') !== 'none') {
    const row = d3.select('#table-container tbody').selectAll('tr')
      .filter(d => d.id === state.hoveredId).node();
    if (row) row.scrollIntoView({ block: 'nearest', behavior: 'auto' });
  }
});

// ============================
// Toggle
// ============================
const toggleBtn = document.getElementById('toggle');
toggleBtn.addEventListener('click', () => {
  const showingTable = toggleBtn.getAttribute('aria-pressed') === 'true';
  const chart = document.getElementById('chart-container');
  const table = document.getElementById('table-container');

  chart.style.display = showingTable ? '' : 'none';
  chart.setAttribute('aria-hidden', String(!showingTable));
  table.style.display = showingTable ? 'none' : '';
  table.setAttribute('aria-hidden', String(showingTable));

  toggleBtn.textContent = showingTable ? 'Show as table' : 'Show as chart';
  toggleBtn.setAttribute('aria-pressed', String(!showingTable));
});

// ============================
// Search filter
// ============================
document.getElementById('search').addEventListener('input', function () {
  const query = this.value.toLowerCase().trim();
  currentData = query === ''
    ? [...data]
    : data.filter(d => columns.some(col =>
        String(d[col.key]).toLowerCase().includes(query)));

  // Re-apply current sort
  if (sortKey) {
    const cmp = sortOrder === 'ascending' ? d3.ascending : d3.descending;
    currentData.sort((a, b) => cmp(a[sortKey], b[sortKey]));
  }

  buildTable();

  // Also dim chart dots not matching filter
  const filteredIds = new Set(currentData.map(d => d.id));
  dots.attr('display', d => filteredIds.has(d.id) ? null : 'none');
});

// ============================
// CSV export
// ============================
document.getElementById('csv-btn').addEventListener('click', () => {
  const header = columns.map(c => c.label).join(',');
  const rows = currentData.map(d =>
    columns.map(c => {
      const val = d[c.key];
      if (typeof val === 'string' && /[",\n]/.test(val)) return `"${val.replace(/"/g, '""')}"`;
      return val ?? '';
    }).join(',')
  );
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'data.csv'; a.click();
  URL.revokeObjectURL(url);
});

// Signal ready
document.getElementById('container').setAttribute('data-ready', '');
</script>
</body>
</html>
