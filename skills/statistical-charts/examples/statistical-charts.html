<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistical Charts — Distribution Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #6366f1;
    --card-bg: #fafafa;
    --radius: 8px;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin-bottom: 20px;
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .controls button {
    font-family: var(--font);
    font-size: 0.8125rem;
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .controls button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .controls button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .chart-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: relative;
  }

  .chart-card h2 {
    font-size: 0.8125rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .chart-card svg {
    display: block;
  }

  .single-view {
    grid-column: 1 / -1;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(26, 26, 46, 0.92);
    color: #fff;
    font-size: 0.75rem;
    padding: 8px 10px;
    border-radius: 6px;
    line-height: 1.4;
    opacity: 0;
    transition: opacity 0.12s ease;
    z-index: 10;
    white-space: nowrap;
  }

  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 16px; }
  }
</style>
</head>
<body>

<h1>Distribution Dashboard</h1>
<p class="subtitle">Synthetic data from 5 groups with different normal distributions — same data, four chart types</p>

<div class="controls">
  <button class="active" data-view="grid">2 x 2 Grid</button>
  <button data-view="box">Box Plot</button>
  <button data-view="violin">Violin Plot</button>
  <button data-view="ridgeline">Ridgeline Plot</button>
  <button data-view="swarm">Bee Swarm</button>
</div>

<div class="grid" id="dashboard"></div>
<div class="tooltip" id="tooltip"></div>

<script type="module">
  // --- Data Generation ---
  const seed = d3.randomLcg(12345);
  const groups = [
    { key: "Alpha",   mean: 50, std: 8 },
    { key: "Beta",    mean: 62, std: 12 },
    { key: "Gamma",   mean: 45, std: 6 },
    { key: "Delta",   mean: 70, std: 15 },
    { key: "Epsilon", mean: 55, std: 10 },
  ];

  const data = [];
  for (const g of groups) {
    const rng = d3.randomNormal.source(seed)(g.mean, g.std);
    for (let i = 0; i < 100; i++) {
      data.push({ group: g.key, value: rng() });
    }
  }

  const groupNames = groups.map(g => g.key);
  const colorScale = d3.scaleOrdinal()
    .domain(groupNames)
    .range(["#6366f1", "#f59e0b", "#10b981", "#ef4444", "#8b5cf6"]);

  // --- Statistics ---
  function computeStats(values) {
    const sorted = Float64Array.from(values).sort();
    const q1 = d3.quantile(sorted, 0.25);
    const q3 = d3.quantile(sorted, 0.75);
    const iqr = q3 - q1;
    const lf = q1 - 1.5 * iqr;
    const uf = q3 + 1.5 * iqr;
    return {
      min: sorted[0], max: sorted[sorted.length - 1],
      q1, median: d3.quantile(sorted, 0.5), q3, iqr,
      mean: d3.mean(sorted), std: d3.deviation(sorted),
      whiskerLow: d3.min(sorted.filter(v => v >= lf)),
      whiskerHigh: d3.max(sorted.filter(v => v <= uf)),
      outliers: Array.from(sorted.filter(v => v < lf || v > uf)),
      n: sorted.length,
    };
  }

  const grouped = d3.groups(data, d => d.group).map(([key, items]) => ({
    key,
    values: items.map(d => d.value),
    stats: computeStats(items.map(d => d.value)),
    items,
  }));

  // --- KDE ---
  const gaussian = x => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);

  function kde(kernel, bandwidth, data) {
    return points => points.map(x => [
      x,
      d3.mean(data, v => kernel((x - v) / bandwidth)) / bandwidth,
    ]);
  }

  function silvermanBandwidth(values) {
    const n = values.length;
    const std = d3.deviation(values);
    const sorted = Float64Array.from(values).sort();
    const iqr = d3.quantile(sorted, 0.75) - d3.quantile(sorted, 0.25);
    return 0.9 * Math.min(std, iqr / 1.34) * Math.pow(n, -0.2);
  }

  const globalExtent = d3.extent(data, d => d.value);
  const padding = (globalExtent[1] - globalExtent[0]) * 0.15;
  const domainMin = globalExtent[0] - padding;
  const domainMax = globalExtent[1] + padding;
  const kdeTicks = d3.ticks(domainMin, domainMax, 200);

  for (const g of grouped) {
    const bw = silvermanBandwidth(g.values);
    g.density = kde(gaussian, bw, g.values)(kdeTicks);
  }

  const maxDensity = d3.max(grouped, g => d3.max(g.density, d => d[1]));

  // --- Bee swarm positions (pre-computed) ---
  const swarmData = data.map(d => ({ ...d }));
  const swarmYScale = d3.scaleLinear().domain([domainMin, domainMax]).range([280, 0]);
  const swarmGroupScale = d3.scaleBand().domain(groupNames).range([0, 540]).padding(0.15);

  const simulation = d3.forceSimulation(swarmData)
    .force("y", d3.forceY(d => swarmYScale(d.value)).strength(1))
    .force("x", d3.forceX(d => swarmGroupScale(d.group) + swarmGroupScale.bandwidth() / 2).strength(0.3))
    .force("collide", d3.forceCollide(3.5).iterations(3))
    .stop();

  for (let i = 0; i < 150; i++) simulation.tick();

  // Map positions back
  const swarmPositions = new Map(swarmData.map(d => [`${d.group}-${d.value}`, { x: d.x, y: d.y }]));

  // --- Tooltip ---
  const tooltip = d3.select("#tooltip");

  function showTooltip(event, html) {
    tooltip.style("opacity", 1).html(html)
      .style("left", (event.pageX + 12) + "px")
      .style("top", (event.pageY - 12) + "px");
  }

  function hideTooltip() { tooltip.style("opacity", 0); }

  // --- Chart Renderers ---
  const margin = { top: 10, right: 20, bottom: 30, left: 45 };

  function createSvg(container, w, h) {
    return container.append("svg")
      .attr("width", w + margin.left + margin.right)
      .attr("height", h + margin.top + margin.bottom)
      .append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);
  }

  function drawBoxPlot(container, w = 540, h = 280) {
    const svg = createSvg(container, w, h);
    const x = d3.scaleBand().domain(groupNames).range([0, w]).padding(0.3);
    const y = d3.scaleLinear().domain([domainMin, domainMax]).nice().range([h, 0]);
    const bw = x.bandwidth();

    // Axes
    svg.append("g").attr("transform", `translate(0,${h})`).call(d3.axisBottom(x)).select(".domain").remove();
    svg.append("g").call(d3.axisLeft(y).ticks(6)).select(".domain").remove();

    const boxes = svg.selectAll(".box").data(grouped).join("g")
      .attr("class", "box")
      .attr("transform", d => `translate(${x(d.key)},0)`);

    // Whisker lines
    boxes.append("line")
      .attr("x1", bw / 2).attr("x2", bw / 2)
      .attr("y1", d => y(d.stats.whiskerHigh)).attr("y2", d => y(d.stats.whiskerLow))
      .attr("stroke", "#999").attr("stroke-width", 1);

    // Whisker caps
    const capW = bw * 0.4;
    for (const prop of ["whiskerLow", "whiskerHigh"]) {
      boxes.append("line")
        .attr("x1", (bw - capW) / 2).attr("x2", (bw + capW) / 2)
        .attr("y1", d => y(d.stats[prop])).attr("y2", d => y(d.stats[prop]))
        .attr("stroke", "#999").attr("stroke-width", 1);
    }

    // Box (IQR)
    boxes.append("rect")
      .attr("x", 0).attr("y", d => y(d.stats.q3))
      .attr("width", bw)
      .attr("height", d => y(d.stats.q1) - y(d.stats.q3))
      .attr("fill", d => colorScale(d.key))
      .attr("fill-opacity", 0.75)
      .attr("stroke", d => d3.color(colorScale(d.key)).darker(0.5))
      .attr("stroke-width", 1)
      .attr("rx", 2)
      .on("pointerenter", (event, d) => showTooltip(event,
        `<strong>${d.key}</strong><br>Median: ${d.stats.median.toFixed(1)}<br>IQR: ${d.stats.q1.toFixed(1)} – ${d.stats.q3.toFixed(1)}<br>n = ${d.stats.n}`))
      .on("pointermove", (event) => tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 12) + "px"))
      .on("pointerleave", hideTooltip);

    // Median line
    boxes.append("line")
      .attr("x1", 0).attr("x2", bw)
      .attr("y1", d => y(d.stats.median)).attr("y2", d => y(d.stats.median))
      .attr("stroke", "#fff").attr("stroke-width", 2);

    // Outliers
    boxes.selectAll(".outlier").data(d => d.stats.outliers.map(v => ({ value: v, key: d.key })))
      .join("circle").attr("class", "outlier")
      .attr("cx", bw / 2).attr("cy", d => y(d.value)).attr("r", 3)
      .attr("fill", "none").attr("stroke", d => colorScale(d.key)).attr("stroke-width", 1.5);
  }

  function drawViolin(container, w = 540, h = 280) {
    const svg = createSvg(container, w, h);
    const x = d3.scaleBand().domain(groupNames).range([0, w]).padding(0.15);
    const y = d3.scaleLinear().domain([domainMin, domainMax]).nice().range([h, 0]);

    const violinScale = d3.scaleLinear()
      .domain([0, maxDensity])
      .range([0, x.bandwidth() / 2]);

    svg.append("g").attr("transform", `translate(0,${h})`).call(d3.axisBottom(x)).select(".domain").remove();
    svg.append("g").call(d3.axisLeft(y).ticks(6)).select(".domain").remove();

    const areaGen = d3.area()
      .x0(d => -violinScale(d[1]))
      .x1(d => violinScale(d[1]))
      .y(d => y(d[0]))
      .curve(d3.curveCatmullRom);

    const violins = svg.selectAll(".violin").data(grouped).join("g")
      .attr("class", "violin")
      .attr("transform", d => `translate(${x(d.key) + x.bandwidth() / 2},0)`);

    violins.append("path")
      .attr("d", d => areaGen(d.density))
      .attr("fill", d => colorScale(d.key))
      .attr("fill-opacity", 0.6)
      .attr("stroke", d => d3.color(colorScale(d.key)).darker(0.3))
      .attr("stroke-width", 1)
      .on("pointerenter", (event, d) => showTooltip(event,
        `<strong>${d.key}</strong><br>Mean: ${d.stats.mean.toFixed(1)}<br>Std: ${d.stats.std.toFixed(1)}<br>n = ${d.stats.n}`))
      .on("pointermove", (event) => tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 12) + "px"))
      .on("pointerleave", hideTooltip);

    // Inner box
    const innerW = 5;
    violins.append("rect")
      .attr("x", -innerW / 2).attr("y", d => y(d.stats.q3))
      .attr("width", innerW)
      .attr("height", d => y(d.stats.q1) - y(d.stats.q3))
      .attr("fill", "#333").attr("rx", 2);

    // Median dot
    violins.append("circle")
      .attr("cx", 0).attr("cy", d => y(d.stats.median))
      .attr("r", 3).attr("fill", "#fff");
  }

  function drawRidgeline(container, w = 540, h = 280) {
    const svg = createSvg(container, w, h);
    const xScale = d3.scaleLinear().domain([domainMin, domainMax]).range([0, w]);
    const yBand = d3.scaleBand().domain(groupNames).range([0, h]).padding(0.05);
    const overlap = 1.8;
    const ridgeHeight = yBand.step() * overlap;
    const densityY = d3.scaleLinear().domain([0, maxDensity]).range([0, ridgeHeight]);

    svg.append("g").attr("transform", `translate(0,${h})`).call(d3.axisBottom(xScale).ticks(8)).select(".domain").remove();

    // Group labels on left
    svg.selectAll(".label").data(grouped).join("text")
      .attr("class", "label")
      .attr("x", -8).attr("y", d => yBand(d.key) + yBand.bandwidth())
      .attr("text-anchor", "end").attr("dominant-baseline", "middle")
      .attr("font-size", "11px").attr("fill", "var(--fg)")
      .text(d => d.key);

    const area = d3.area()
      .x(d => xScale(d[0]))
      .y0(0)
      .y1(d => -densityY(d[1]))
      .curve(d3.curveBasis);

    const line = d3.line()
      .x(d => xScale(d[0]))
      .y(d => -densityY(d[1]))
      .curve(d3.curveBasis);

    // Render bottom-to-top so lower rows occlude upper
    const ridges = svg.selectAll(".ridge").data([...grouped].reverse()).join("g")
      .attr("class", "ridge")
      .attr("transform", d => `translate(0,${yBand(d.key) + yBand.bandwidth()})`);

    ridges.append("path")
      .attr("d", d => area(d.density))
      .attr("fill", d => colorScale(d.key))
      .attr("fill-opacity", 0.55)
      .on("pointerenter", (event, d) => showTooltip(event,
        `<strong>${d.key}</strong><br>Mean: ${d.stats.mean.toFixed(1)}<br>Std: ${d.stats.std.toFixed(1)}`))
      .on("pointermove", (event) => tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 12) + "px"))
      .on("pointerleave", hideTooltip);

    ridges.append("path")
      .attr("d", d => line(d.density))
      .attr("fill", "none")
      .attr("stroke", d => d3.color(colorScale(d.key)).darker(0.4))
      .attr("stroke-width", 1.5);
  }

  function drawBeeSwarm(container, w = 540, h = 280) {
    const svg = createSvg(container, w, h);
    const x = d3.scaleBand().domain(groupNames).range([0, w]).padding(0.15);
    const y = d3.scaleLinear().domain([domainMin, domainMax]).nice().range([h, 0]);

    svg.append("g").attr("transform", `translate(0,${h})`).call(d3.axisBottom(x)).select(".domain").remove();
    svg.append("g").call(d3.axisLeft(y).ticks(6)).select(".domain").remove();

    // Re-run force sim with these exact scales
    const points = data.map(d => ({ ...d }));
    const sim = d3.forceSimulation(points)
      .force("y", d3.forceY(d => y(d.value)).strength(1))
      .force("x", d3.forceX(d => x(d.group) + x.bandwidth() / 2).strength(0.3))
      .force("collide", d3.forceCollide(3.5).iterations(3))
      .stop();

    for (let i = 0; i < 150; i++) sim.tick();

    svg.selectAll("circle").data(points).join("circle")
      .attr("cx", d => d.x).attr("cy", d => d.y)
      .attr("r", 3)
      .attr("fill", d => colorScale(d.group))
      .attr("fill-opacity", 0.7)
      .attr("stroke", d => d3.color(colorScale(d.group)).darker(0.3))
      .attr("stroke-width", 0.5)
      .on("pointerenter", (event, d) => showTooltip(event,
        `<strong>${d.group}</strong><br>Value: ${d.value.toFixed(1)}`))
      .on("pointermove", (event) => tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 12) + "px"))
      .on("pointerleave", hideTooltip);
  }

  // --- Layout Manager ---
  const dashboard = d3.select("#dashboard");

  const chartTypes = {
    box: { title: "Box Plot", render: drawBoxPlot },
    violin: { title: "Violin Plot", render: drawViolin },
    ridgeline: { title: "Ridgeline Plot", render: drawRidgeline },
    swarm: { title: "Bee Swarm", render: drawBeeSwarm },
  };

  function renderView(view) {
    // Fade out existing
    dashboard.selectAll(".chart-card")
      .transition().duration(200).style("opacity", 0)
      .end().then(() => {
        dashboard.selectAll(".chart-card").remove();
        if (view === "grid") {
          for (const [key, ct] of Object.entries(chartTypes)) {
            const card = dashboard.append("div").attr("class", "chart-card").style("opacity", 0);
            card.append("h2").text(ct.title);
            ct.render(card);
            card.transition().duration(400).style("opacity", 1);
          }
        } else {
          const ct = chartTypes[view];
          const card = dashboard.append("div").attr("class", "chart-card single-view").style("opacity", 0);
          card.append("h2").text(ct.title);
          ct.render(card, 1100, 400);
          card.transition().duration(400).style("opacity", 1);
        }
      }).catch(() => {
        // If no elements to transition, render immediately
        dashboard.selectAll(".chart-card").remove();
        if (view === "grid") {
          for (const [key, ct] of Object.entries(chartTypes)) {
            const card = dashboard.append("div").attr("class", "chart-card");
            card.append("h2").text(ct.title);
            ct.render(card);
          }
        } else {
          const ct = chartTypes[view];
          const card = dashboard.append("div").attr("class", "chart-card single-view");
          card.append("h2").text(ct.title);
          ct.render(card, 1100, 400);
        }
      });
  }

  // --- Controls ---
  d3.selectAll(".controls button").on("click", function () {
    d3.selectAll(".controls button").classed("active", false);
    d3.select(this).classed("active", true);
    renderView(this.dataset.view);
  });

  // Initial render
  renderView("grid");
</script>
</body>
</html>
