<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axes &amp; Scales Gallery</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #222;
    margin: 0;
    padding: 30px 40px;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 22px; font-weight: 400; margin: 0 0 4px; }
  h1 b { font-weight: 600; }
  .lead { color: #666; margin: 0 0 28px; font-size: 12px; }
  .panel {
    margin-bottom: 36px;
  }
  .panel h2 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #666;
    margin: 0 0 8px;
  }
  svg { display: block; }
  .grid line { stroke: #e8e8e8; }
  .grid .domain { display: none; }
  .break-symbol { stroke: #888; stroke-width: 1.5; fill: none; }
  .gap-region { fill: #f7f7f7; }
</style>
</head>
<body>

<h1><b>Axes &amp; Scales</b> Gallery</h1>
<p class="lead">Six panels demonstrating scale types, label collision avoidance, broken axes, dual-y, time gaps, and grouped ordinal axes.</p>

<div id="charts"></div>

<script>
const container = d3.select("#charts");

// ── 1. Scale comparison: linear vs log vs symlog ──────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Scale Comparison \u2014 Linear vs Log vs Symlog");

  const w = 900, h = 180;
  const margin = { top: 20, right: 30, bottom: 40, left: 55 };
  const data = d3.range(50).map(i => ({
    x: i,
    value: i === 0 ? 0 : Math.round(Math.pow(10, Math.random() * 4))
  }));

  const scaleTypes = [
    { name: "linear", fn: d3.scaleLinear },
    { name: "log (no zero)", fn: d3.scaleLog },
    { name: "symlog", fn: d3.scaleSymlog }
  ];

  const svgW = (w - 20) / 3;
  const svg = panel.append("svg").attr("width", w).attr("height", h);

  scaleTypes.forEach(({ name, fn }, si) => {
    const g = svg.append("g").attr("transform", `translate(${si * (svgW + 10)}, 0)`);
    const innerW = svgW - margin.left - margin.right;
    const innerH = h - margin.top - margin.bottom;

    const filtered = name === "log (no zero)" ? data.filter(d => d.value > 0) : data;
    const x = d3.scaleLinear()
      .domain([0, d3.max(data, d => d.x)])
      .range([margin.left, svgW - margin.right]);

    let y;
    if (name === "log (no zero)") {
      y = d3.scaleLog()
        .domain([1, d3.max(filtered, d => d.value)])
        .range([h - margin.bottom, margin.top])
        .nice();
    } else if (name === "symlog") {
      y = d3.scaleSymlog()
        .domain(d3.extent(data, d => d.value))
        .range([h - margin.bottom, margin.top])
        .constant(1);
    } else {
      y = d3.scaleLinear()
        .domain([0, d3.max(data, d => d.value)])
        .range([h - margin.bottom, margin.top])
        .nice();
    }

    // Grid
    g.append("g").attr("class", "grid")
      .attr("transform", `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).tickSize(-innerW).tickFormat("").ticks(4));

    // Axes
    g.append("g")
      .attr("transform", `translate(0,${h - margin.bottom})`)
      .call(d3.axisBottom(x).ticks(5))
      .call(g => g.select(".domain").attr("stroke", "#ccc"));
    g.append("g")
      .attr("transform", `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(4, "~s"))
      .call(g => g.select(".domain").attr("stroke", "#ccc"));

    // Dots
    g.selectAll("circle").data(filtered).join("circle")
      .attr("cx", d => x(d.x))
      .attr("cy", d => y(d.value))
      .attr("r", 2.5)
      .attr("fill", "#4e79a7")
      .attr("opacity", 0.7);

    // Label
    g.append("text")
      .attr("x", margin.left + innerW / 2)
      .attr("y", 12)
      .attr("text-anchor", "middle")
      .attr("font-size", "11px")
      .attr("font-weight", 500)
      .text(name);
  });
}

// ── 2. Label collision avoidance ──────────────────────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Label Collision Avoidance \u2014 Rotated, Staggered, Truncated");

  const categories = [
    "Renewable Energy", "Manufacturing", "Healthcare Services",
    "Financial Technology", "Artificial Intelligence", "Supply Chain",
    "Cybersecurity", "Cloud Computing", "Biotechnology", "Autonomous Vehicles",
    "Quantum Computing", "Edge Computing"
  ];
  const values = categories.map(() => Math.round(Math.random() * 80 + 20));

  const w = 900, h = 200;
  const margin = { top: 10, right: 20, bottom: 70, left: 40 };
  const chartW = (w - 20) / 3;

  const svg = panel.append("svg").attr("width", w).attr("height", h);

  const strategies = [
    { name: "Rotated 45\u00B0", apply: g => {
      g.selectAll("text")
        .attr("transform", "rotate(-45)")
        .attr("text-anchor", "end")
        .attr("dx", "-0.5em")
        .attr("dy", "0.3em");
    }},
    { name: "Staggered", apply: g => {
      g.selectAll("text")
        .attr("dy", (d, i) => i % 2 === 0 ? "1em" : "2.2em");
      g.selectAll(".tick line")
        .attr("y2", (d, i) => i % 2 === 0 ? 6 : 18);
    }},
    { name: "Truncated", apply: g => {
      g.selectAll("text").each(function() {
        const el = d3.select(this);
        const full = el.text();
        if (full.length > 8) {
          el.text(full.slice(0, 7) + "\u2026");
          el.append("title").text(full);
        }
      });
    }}
  ];

  strategies.forEach(({ name, apply }, si) => {
    const g = svg.append("g").attr("transform", `translate(${si * (chartW + 10)}, 0)`);

    const x = d3.scaleBand()
      .domain(categories)
      .range([margin.left, chartW - margin.right])
      .padding(0.2);

    const y = d3.scaleLinear()
      .domain([0, 100])
      .range([h - margin.bottom, margin.top]);

    // Bars
    g.selectAll("rect").data(d3.zip(categories, values)).join("rect")
      .attr("x", ([c]) => x(c))
      .attr("y", ([, v]) => y(v))
      .attr("width", x.bandwidth())
      .attr("height", ([, v]) => y(0) - y(v))
      .attr("fill", "#76b7b2")
      .attr("rx", 1);

    // Y axis
    g.append("g")
      .attr("transform", `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(4))
      .call(g => g.select(".domain").remove());

    // X axis with strategy
    const xAxisG = g.append("g")
      .attr("transform", `translate(0,${h - margin.bottom})`)
      .call(d3.axisBottom(x).tickSizeOuter(0));
    xAxisG.selectAll("text").attr("font-size", "8px");
    apply(xAxisG);

    // Panel label
    g.append("text")
      .attr("x", margin.left)
      .attr("y", 8)
      .attr("font-size", "10px")
      .attr("font-weight", 500)
      .attr("fill", "#666")
      .text(name);
  });
}

// ── 3. Broken axis ────────────────────────────────────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Broken Axis \u2014 Discontinuous Y Scale");

  const w = 420, h = 220;
  const margin = { top: 15, right: 20, bottom: 35, left: 50 };

  const data = [
    { name: "A", value: 45 }, { name: "B", value: 62 },
    { name: "C", value: 38 }, { name: "D", value: 920 },
    { name: "E", value: 51 }, { name: "F", value: 870 }
  ];

  const svg = panel.append("svg").attr("width", w).attr("height", h);
  const innerH = h - margin.top - margin.bottom;

  // Two y-ranges: [0–100] in the bottom portion, [850–950] in the top
  const breakGap = 16;
  const splitY = margin.top + innerH * 0.45;

  const yBottom = d3.scaleLinear()
    .domain([0, 100])
    .range([h - margin.bottom, splitY + breakGap / 2]);

  const yTop = d3.scaleLinear()
    .domain([850, 950])
    .range([splitY - breakGap / 2, margin.top]);

  const yScale = v => v <= 100 ? yBottom(v) : yTop(v);

  const x = d3.scaleBand()
    .domain(data.map(d => d.name))
    .range([margin.left, w - margin.right])
    .padding(0.3);

  // Bars
  svg.selectAll("rect").data(data).join("rect")
    .attr("x", d => x(d.name))
    .attr("width", x.bandwidth())
    .attr("y", d => yScale(d.value))
    .attr("height", d => (h - margin.bottom) - yScale(d.value))
    .attr("fill", d => d.value > 100 ? "#e15759" : "#4e79a7")
    .attr("rx", 2);

  // Bottom y-axis
  svg.append("g")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(yBottom).ticks(4))
    .call(g => g.select(".domain").attr("stroke", "#ccc"));

  // Top y-axis
  svg.append("g")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(yTop).ticks(3))
    .call(g => g.select(".domain").attr("stroke", "#ccc"));

  // Break symbol (zigzag)
  const bx = margin.left;
  const by = splitY;
  const sz = 5;
  svg.append("path")
    .attr("class", "break-symbol")
    .attr("d", `M${bx - 8},${by - sz * 1.5} L${bx + 8},${by - sz * 0.5} L${bx - 8},${by + sz * 0.5} L${bx + 8},${by + sz * 1.5}`);

  // White mask over the break gap
  svg.append("rect")
    .attr("x", margin.left + 1)
    .attr("y", splitY - breakGap / 2 + 1)
    .attr("width", w - margin.left - margin.right)
    .attr("height", breakGap - 2)
    .attr("fill", "white");

  // X axis
  svg.append("g")
    .attr("transform", `translate(0,${h - margin.bottom})`)
    .call(d3.axisBottom(x).tickSizeOuter(0));

  // Value labels
  svg.selectAll(".val-label").data(data).join("text")
    .attr("x", d => x(d.name) + x.bandwidth() / 2)
    .attr("y", d => yScale(d.value) - 4)
    .attr("text-anchor", "middle")
    .attr("font-size", "10px")
    .attr("fill", "#444")
    .text(d => d.value);
}

// ── 4. Dual-Y axes ───────────────────────────────────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Dual-Y Axes \u2014 Temperature & Precipitation");

  const w = 440, h = 220;
  const margin = { top: 20, right: 55, bottom: 35, left: 50 };

  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const temp = [32, 35, 45, 58, 68, 78, 84, 82, 74, 62, 48, 36];
  const precip = [3.2, 2.8, 3.9, 3.4, 4.1, 3.8, 4.5, 4.2, 3.5, 3.1, 3.3, 3.0];
  const data = months.map((m, i) => ({ month: m, temp: temp[i], precip: precip[i] }));

  const svg = panel.append("svg").attr("width", w).attr("height", h);

  const x = d3.scaleBand()
    .domain(months)
    .range([margin.left, w - margin.right])
    .padding(0.3);

  const yTemp = d3.scaleLinear()
    .domain([20, 90]).nice()
    .range([h - margin.bottom, margin.top]);

  const yPrecip = d3.scaleLinear()
    .domain([0, 6]).nice()
    .range([h - margin.bottom, margin.top]);

  // Grid
  svg.append("g").attr("class", "grid")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(yTemp).tickSize(-(w - margin.left - margin.right)).tickFormat("").ticks(5));

  // Bars for precipitation
  svg.selectAll(".precip-bar").data(data).join("rect")
    .attr("class", "precip-bar")
    .attr("x", d => x(d.month))
    .attr("width", x.bandwidth())
    .attr("y", d => yPrecip(d.precip))
    .attr("height", d => yPrecip(0) - yPrecip(d.precip))
    .attr("fill", "#4e79a7")
    .attr("opacity", 0.5)
    .attr("rx", 1);

  // Line for temperature
  const line = d3.line()
    .x(d => x(d.month) + x.bandwidth() / 2)
    .y(d => yTemp(d.temp));

  svg.append("path")
    .datum(data)
    .attr("fill", "none")
    .attr("stroke", "#e15759")
    .attr("stroke-width", 2)
    .attr("d", line);

  svg.selectAll(".temp-dot").data(data).join("circle")
    .attr("cx", d => x(d.month) + x.bandwidth() / 2)
    .attr("cy", d => yTemp(d.temp))
    .attr("r", 3)
    .attr("fill", "#e15759");

  // X axis
  svg.append("g")
    .attr("transform", `translate(0,${h - margin.bottom})`)
    .call(d3.axisBottom(x).tickSizeOuter(0))
    .selectAll("text").attr("font-size", "9px");

  // Left Y axis (temperature)
  svg.append("g")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(yTemp).ticks(5))
    .call(g => {
      g.select(".domain").remove();
      g.selectAll("text").attr("fill", "#e15759");
      g.selectAll(".tick line").attr("stroke", "#e15759").attr("opacity", 0.3);
      g.append("text")
        .attr("x", -margin.left + 4).attr("y", margin.top - 6)
        .attr("fill", "#e15759").attr("text-anchor", "start")
        .attr("font-size", "10px").attr("font-weight", 500)
        .text("Temp (\u00B0F)");
    });

  // Right Y axis (precipitation)
  svg.append("g")
    .attr("transform", `translate(${w - margin.right},0)`)
    .call(d3.axisRight(yPrecip).ticks(5))
    .call(g => {
      g.select(".domain").remove();
      g.selectAll("text").attr("fill", "#4e79a7");
      g.selectAll(".tick line").attr("stroke", "#4e79a7").attr("opacity", 0.3);
      g.append("text")
        .attr("x", margin.right - 4).attr("y", margin.top - 6)
        .attr("fill", "#4e79a7").attr("text-anchor", "end")
        .attr("font-size", "10px").attr("font-weight", 500)
        .text("Precip (in)");
    });
}

// ── 5. Time scale with weekend gaps ──────────────────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Time Scale with Gaps \u2014 Weekends Removed");

  const w = 900, h = 180;
  const margin = { top: 15, right: 20, bottom: 30, left: 50 };

  // Generate 30 days of "stock" data, filter to weekdays
  const startDate = new Date(Date.UTC(2024, 0, 2)); // Tue Jan 2
  const allDays = d3.range(42).map(i => {
    const d = d3.utcDay.offset(startDate, i);
    return { date: d, day: d.getUTCDay(), close: 150 + Math.random() * 30 - 15 };
  });
  // Random walk
  allDays.reduce((prev, d) => {
    d.close = prev + (Math.random() - 0.48) * 3;
    return d.close;
  }, 150);
  const weekdays = allDays.filter(d => d.day !== 0 && d.day !== 6);

  const svg = panel.append("svg").attr("width", w).attr("height", h);

  // Band scale on trading day index (no weekend gaps)
  const x = d3.scaleBand()
    .domain(weekdays.map(d => d.date))
    .range([margin.left, w - margin.right])
    .padding(0.1);

  const y = d3.scaleLinear()
    .domain(d3.extent(weekdays, d => d.close)).nice()
    .range([h - margin.bottom, margin.top]);

  // Grid
  svg.append("g").attr("class", "grid")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(y).tickSize(-(w - margin.left - margin.right)).tickFormat("").ticks(4));

  // Area + line
  const area = d3.area()
    .x(d => x(d.date) + x.bandwidth() / 2)
    .y0(h - margin.bottom)
    .y1(d => y(d.close));

  svg.append("path")
    .datum(weekdays)
    .attr("fill", "#4e79a7")
    .attr("opacity", 0.1)
    .attr("d", area);

  const line = d3.line()
    .x(d => x(d.date) + x.bandwidth() / 2)
    .y(d => y(d.close));

  svg.append("path")
    .datum(weekdays)
    .attr("fill", "none")
    .attr("stroke", "#4e79a7")
    .attr("stroke-width", 1.5)
    .attr("d", line);

  // Week separators
  weekdays.forEach((d, i) => {
    if (i > 0 && d.day === 1) { // Monday
      const xPos = x(d.date);
      svg.append("line")
        .attr("x1", xPos - 1).attr("x2", xPos - 1)
        .attr("y1", margin.top).attr("y2", h - margin.bottom)
        .attr("stroke", "#ddd")
        .attr("stroke-dasharray", "2,2");
    }
  });

  // X axis — show only Mondays
  const mondays = weekdays.filter(d => d.day === 1).map(d => d.date);
  svg.append("g")
    .attr("transform", `translate(0,${h - margin.bottom})`)
    .call(d3.axisBottom(x)
      .tickValues(mondays)
      .tickFormat(d3.utcFormat("%b %-d"))
      .tickSizeOuter(0)
    )
    .selectAll("text").attr("font-size", "9px");

  // Y axis
  svg.append("g")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(y).ticks(4, "$,.0f"))
    .call(g => g.select(".domain").remove());
}

// ── 6. Grouped ordinal / nested axis ─────────────────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Nested Ordinal Axis \u2014 Quarters within Years");

  const w = 600, h = 220;
  const margin = { top: 15, right: 20, bottom: 52, left: 45 };

  const years = ["2022", "2023", "2024"];
  const quarters = ["Q1", "Q2", "Q3", "Q4"];
  const data = years.flatMap(yr =>
    quarters.map(q => ({ year: yr, quarter: q, value: Math.round(40 + Math.random() * 60) }))
  );

  const svg = panel.append("svg").attr("width", w).attr("height", h);

  const x0 = d3.scaleBand()
    .domain(years)
    .range([margin.left, w - margin.right])
    .paddingInner(0.15);

  const x1 = d3.scaleBand()
    .domain(quarters)
    .range([0, x0.bandwidth()])
    .padding(0.08);

  const y = d3.scaleLinear()
    .domain([0, 100])
    .range([h - margin.bottom, margin.top]);

  const color = d3.scaleOrdinal()
    .domain(quarters)
    .range(["#4e79a7", "#59a14f", "#f28e2b", "#e15759"]);

  // Grid
  svg.append("g").attr("class", "grid")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(y).tickSize(-(w - margin.left - margin.right)).tickFormat("").ticks(4));

  // Bars
  svg.selectAll("rect").data(data).join("rect")
    .attr("x", d => x0(d.year) + x1(d.quarter))
    .attr("y", d => y(d.value))
    .attr("width", x1.bandwidth())
    .attr("height", d => y(0) - y(d.value))
    .attr("fill", d => color(d.quarter))
    .attr("rx", 1);

  // Y axis
  svg.append("g")
    .attr("transform", `translate(${margin.left},0)`)
    .call(d3.axisLeft(y).ticks(4))
    .call(g => g.select(".domain").remove());

  // Inner axis — quarter labels
  const innerAxisG = svg.append("g")
    .attr("transform", `translate(0,${h - margin.bottom})`);

  years.forEach(yr => {
    const g = innerAxisG.append("g")
      .attr("transform", `translate(${x0(yr)},0)`);
    quarters.forEach(q => {
      g.append("text")
        .attr("x", x1(q) + x1.bandwidth() / 2)
        .attr("y", 14)
        .attr("text-anchor", "middle")
        .attr("font-size", "9px")
        .attr("fill", "#666")
        .text(q);
    });
  });

  // Outer axis — year labels
  svg.append("g")
    .attr("transform", `translate(0,${h - margin.bottom + 26})`)
    .call(d3.axisBottom(x0).tickSize(0).tickPadding(4))
    .call(g => g.select(".domain").remove())
    .selectAll("text")
      .attr("font-size", "11px")
      .attr("font-weight", 600);

  // Group separators
  years.forEach((yr, i) => {
    if (i === 0) return;
    const xPos = x0(yr) - x0.step() * x0.paddingInner() / 2;
    svg.append("line")
      .attr("x1", xPos).attr("x2", xPos)
      .attr("y1", margin.top).attr("y2", h - margin.bottom)
      .attr("stroke", "#ddd")
      .attr("stroke-dasharray", "3,3");
  });

  // Legend
  const legend = svg.append("g")
    .attr("transform", `translate(${w - margin.right - 140}, ${margin.top})`);
  quarters.forEach((q, i) => {
    const g = legend.append("g").attr("transform", `translate(${i * 36}, 0)`);
    g.append("rect").attr("width", 10).attr("height", 10).attr("rx", 1).attr("fill", color(q));
    g.append("text").attr("x", 13).attr("y", 9).attr("font-size", "9px").attr("fill", "#444").text(q);
  });
}

</script>
</body>
</html>
