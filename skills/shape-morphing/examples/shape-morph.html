<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape Morph Test</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #fafafa; }
  .section { padding: 12px 20px; }
  .section h3 { margin: 0 0 8px; font-size: 14px; color: #444; }
  #controls1, #controls2 { display: flex; gap: 8px; margin-bottom: 8px; }
  button { padding: 6px 14px; border: 1px solid #999; border-radius: 4px;
           background: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #eee; }
  button.active { background: steelblue; color: #fff; border-color: steelblue; }
  svg { display: block; }
</style>
</head>
<body>
<div class="section">
  <h3>Tier 1: Parametric — Circle ↔ Rect via cornerRadius</h3>
  <div id="controls1">
    <button data-tier="1" data-action="circles" class="active">Circles</button>
    <button data-tier="1" data-action="rounded">Rounded Rects</button>
    <button data-tier="1" data-action="rects">Rectangles</button>
  </div>
  <svg id="chart1"></svg>
</div>
<div class="section">
  <h3>Tier 2: Point Resampling — Arbitrary Paths</h3>
  <div id="controls2">
    <button data-tier="2" data-action="star" class="active">Star</button>
    <button data-tier="2" data-action="circle">Circle</button>
    <button data-tier="2" data-action="heart">Heart</button>
    <button data-tier="2" data-action="cross">Cross</button>
  </div>
  <svg id="chart2"></svg>
</div>
<div id="status" style="padding: 4px 20px; font-size: 12px; color: #666;"></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ─── Tier 1: Parametric cornerRadius morphing ────────────────────────

const w1 = 960, h1 = 200;
const svg1 = d3.select("#chart1").attr("width", w1).attr("height", h1);
const color = d3.scaleOrdinal(d3.schemeTableau10);

const items = d3.range(12).map(i => ({ id: i }));
const cellW = 60, cellH = 60, pad = 16;
const shapeSize = 40;

// Shape states defined by rect parameters
const shapeStates = {
  circles: { w: shapeSize, h: shapeSize, rx: shapeSize / 2 },
  rounded: { w: shapeSize * 1.3, h: shapeSize, rx: 8 },
  rects:   { w: shapeSize * 1.3, h: shapeSize, rx: 0 },
};

function tier1Render(state, duration = 600) {
  const s = shapeStates[state];

  svg1.selectAll(".t1-shape")
    .data(items, d => d.id)
    .join("rect")
    .attr("class", "t1-shape")
    .attr("fill", (d, i) => color(i))
    .attr("stroke", "#fff")
    .attr("stroke-width", 1)
    .transition().duration(duration)
    .attr("x", (d, i) => pad + i * (cellW + pad) + (cellW - s.w) / 2)
    .attr("y", (h1 - s.h) / 2)
    .attr("width", s.w)
    .attr("height", s.h)
    .attr("rx", s.rx)
    .attr("ry", s.rx);
}

tier1Render("circles", 0);

// ─── Tier 2: Point-resampling arbitrary path morph ───────────────────

const w2 = 960, h2 = 300;
const svg2 = d3.select("#chart2").attr("width", w2).attr("height", h2);

// Generate shape path strings centered at origin
function starPath(cx, cy, outerR, innerR, points) {
  const angles = d3.range(points * 2).map(i => (i * Math.PI) / points - Math.PI / 2);
  return angles.map((a, i) => {
    const r = i % 2 === 0 ? outerR : innerR;
    return `${i === 0 ? "M" : "L"}${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
  }).join("") + "Z";
}

function circlePath(cx, cy, r, segments = 64) {
  return d3.range(segments).map(i => {
    const a = (i / segments) * 2 * Math.PI;
    return `${i === 0 ? "M" : "L"}${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
  }).join("") + "Z";
}

function heartPath(cx, cy, size) {
  const s = size / 36;
  const pts = [];
  for (let i = 0; i < 64; i++) {
    const t = (i / 64) * 2 * Math.PI;
    const x = 16 * Math.sin(t) ** 3;
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    pts.push([cx + x * s, cy + y * s]);
  }
  return "M" + pts.map(p => p.join(",")).join("L") + "Z";
}

function crossPath(cx, cy, size) {
  const a = size * 0.15, b = size * 0.5;
  return `M${cx-a},${cy-b}L${cx+a},${cy-b}L${cx+a},${cy-a}L${cx+b},${cy-a}` +
         `L${cx+b},${cy+a}L${cx+a},${cy+a}L${cx+a},${cy+b}L${cx-a},${cy+b}` +
         `L${cx-a},${cy+a}L${cx-b},${cy+a}L${cx-b},${cy-a}L${cx-a},${cy-a}Z`;
}

// ─── Core morph engine: resample + align + interpolate ───────────────

const NUM_POINTS = 128;

// Resample any SVG path to N evenly-spaced points
function resamplePath(pathStr, n) {
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", pathStr);
  const len = path.getTotalLength();
  return d3.range(n).map(i => {
    const pt = path.getPointAtLength((i / n) * len);
    return [pt.x, pt.y];
  });
}

// Rotate points array to minimize total squared distance to target
function bestRotation(source, target) {
  const n = source.length;
  let bestOffset = 0, bestDist = Infinity;
  // Check every possible rotation (for 128 points this is fast enough)
  for (let offset = 0; offset < n; offset++) {
    let dist = 0;
    for (let i = 0; i < n; i++) {
      const j = (i + offset) % n;
      const dx = source[j][0] - target[i][0];
      const dy = source[j][1] - target[i][1];
      dist += dx * dx + dy * dy;
    }
    if (dist < bestDist) {
      bestDist = dist;
      bestOffset = offset;
    }
  }
  // Return rotated copy
  return source.map((_, i) => source[(i + bestOffset) % n]);
}

// Convert point array back to SVG path
function pointsToPath(pts) {
  return "M" + pts.map(p => `${p[0].toFixed(2)},${p[1].toFixed(2)}`).join("L") + "Z";
}

// The morph shapes
const cols = 6, morphR = 50;
const morphItems = d3.range(cols).map(i => ({ id: i }));
const morphCenters = morphItems.map((d, i) => ({
  cx: pad + morphR + i * (morphR * 2 + pad * 2),
  cy: h2 / 2,
}));

function getShapePath(shape, cx, cy) {
  switch (shape) {
    case "star":   return starPath(cx, cy, morphR, morphR * 0.4, 5);
    case "circle": return circlePath(cx, cy, morphR);
    case "heart":  return heartPath(cx, cy, morphR * 2);
    case "cross":  return crossPath(cx, cy, morphR * 2);
  }
}

let currentShape = "star";
let morphCount = 0;

// Initial render
svg2.selectAll(".t2-shape")
  .data(morphItems, d => d.id)
  .join("path")
  .attr("class", "t2-shape")
  .attr("fill", (d, i) => color(i))
  .attr("stroke", "#fff")
  .attr("stroke-width", 1)
  .attr("d", (d, i) => getShapePath("star", morphCenters[i].cx, morphCenters[i].cy));

function tier2Morph(targetShape, duration = 800) {
  if (targetShape === currentShape) return;
  const prevShape = currentShape;
  currentShape = targetShape;

  svg2.selectAll(".t2-shape")
    .each(function(d, i) {
      const el = d3.select(this);
      const { cx, cy } = morphCenters[i];
      const fromPath = el.attr("d");
      const toPath = getShapePath(targetShape, cx, cy);

      // Resample both to equal point arrays
      const fromPts = resamplePath(fromPath, NUM_POINTS);
      const toPts = resamplePath(toPath, NUM_POINTS);

      // Align rotation to minimize travel
      const aligned = bestRotation(fromPts, toPts);

      el.transition().duration(duration)
        .attrTween("d", () => t => {
          const pts = aligned.map((p, j) => [
            p[0] * (1 - t) + toPts[j][0] * t,
            p[1] * (1 - t) + toPts[j][1] * t,
          ]);
          return pointsToPath(pts);
        });
    });

  morphCount++;
  updateStatus(targetShape);
}

function updateStatus(shape) {
  d3.select("#status").text(`Shape: ${shape} | Morphs: ${morphCount}`);
  document.body.dataset.morphCount = morphCount;
  document.body.dataset.shape = shape;
}

// ─── Button handlers ─────────────────────────────────────────────────

d3.selectAll("button[data-tier='1']").on("click", function() {
  d3.selectAll("button[data-tier='1']").classed("active", false);
  d3.select(this).classed("active", true);
  tier1Render(this.dataset.action);
});

d3.selectAll("button[data-tier='2']").on("click", function() {
  d3.selectAll("button[data-tier='2']").classed("active", false);
  d3.select(this).classed("active", true);
  tier2Morph(this.dataset.action);
});

updateStatus("star");
document.body.dataset.ready = "true";
</script>
</body>
</html>
