<style>
  body { padding: 40px 50px; }
  h1 { font-size: 28px; font-weight: 300; margin: 0 0 4px; }
  h1 b { font-weight: 500; }
  .lead { color: var(--color-text-muted); font-size: 15px; margin: 0 0 24px; }
  .nav { font-size: 13px; margin-bottom: 20px; }
  .nav a { color: var(--color-link); text-decoration: none; }
  .nav a:hover { text-decoration: underline; }

  .stats { display: flex; gap: 32px; margin-bottom: 24px; font-size: 14px; color: var(--color-text-muted); }
  .stats strong { color: var(--color-text); }

  .block-table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.4; }
  .block-table th {
    position: sticky; top: 0; background: var(--color-bg);
    border-bottom: 2px solid var(--color-border); padding: 8px 6px;
    text-align: left; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--color-text-muted); cursor: pointer; user-select: none; white-space: nowrap; z-index: 2;
  }
  .block-table th:hover { color: var(--color-text); }
  .block-table th.sort-asc::after { content: " ▲"; font-size: 9px; }
  .block-table th.sort-desc::after { content: " ▼"; font-size: 9px; }
  .block-table td { padding: 6px; border-bottom: 1px solid var(--color-border-light); vertical-align: middle; }
  .block-table tr:hover td { background: var(--color-surface); }

  .col-num { width: 36px; text-align: right; font-variant-numeric: tabular-nums; color: var(--color-text-faint); }
  .col-name { min-width: 220px; }
  .col-name a { color: var(--color-text); text-decoration: none; font-weight: 500; }
  .col-name a:hover { color: var(--color-link); text-decoration: underline; }
  .col-skills { color: var(--color-text-muted); }
  .col-version { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .col-version a { color: var(--color-link); text-decoration: none; font-weight: 500; }
  .col-version a:hover { text-decoration: underline; }
  .col-version-na { color: var(--color-text-faint); font-size: 11px; }

  .score-inline { display: inline-flex; gap: 6px; margin-left: 8px; font-size: 12px; }
  .score-tag { border-radius: 3px; padding: 1px 5px; font-variant-numeric: tabular-nums; }
  .score-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.7; margin-right: 2px; }
  .s-high { background: rgba(89,161,79,0.15); color: #2d6e24; }
  .s-mid  { background: rgba(242,142,43,0.12); color: #8a5a0a; }
  .s-low  { background: rgba(225,87,89,0.15); color: #a02020; }
  [data-theme="dark"] .s-high { background: rgba(89,161,79,0.2); color: #8fd88a; }
  [data-theme="dark"] .s-mid  { background: rgba(242,142,43,0.15); color: #f0c070; }
  [data-theme="dark"] .s-low  { background: rgba(225,87,89,0.2); color: #f09090; }

  .filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  .filter-bar input {
    padding: 6px 10px; border: 1px solid var(--color-border); border-radius: var(--radius);
    font-size: 13px; background: var(--color-bg); color: var(--color-text); width: 260px;
  }
  .filter-bar input::placeholder { color: var(--color-text-faint); }
  .filter-count { font-size: 13px; color: var(--color-text-muted); }
</style>

    const tbody = document.getElementById("tbody");
    const filter = document.getElementById("filter");
    const filterCount = document.getElementById("filter-count");

    function sc(v) {
      if (v == null) return "";
      return v >= 7.5 ? "s-high" : v >= 6.0 ? "s-mid" : "s-low";
    }
    function fs(v) { return v == null ? "—" : Number.isInteger(v) ? v : v.toFixed(1); }

    const dimLabels = { visual: "Vis", deception: "Dec", interact: "Int", percept: "Per", metamorph: "Met" };
    const dims = Object.keys(dimLabels);

    function lowest(b) {
      let minVal = Infinity, minKey = null;
      for (const k of dims) { if (b[k] != null && b[k] < minVal) { minVal = b[k]; minKey = k; } }
      return minKey ? { val: minVal, label: dimLabels[minKey] } : null;
    }

    function scoreTag(label, val) {
      return `<span class="score-tag ${sc(val)}"><span class="score-label">${label}</span>${fs(val)}</span>`;
    }

    function renderRows(data) {
      tbody.innerHTML = data.map(b => {
        const low = lowest(b);
        const claudeScores = b.claude_avg != null
          ? `<span class="score-inline">${scoreTag("avg", b.claude_avg)}${low ? scoreTag("low " + low.label, low.val) : ""}</span>`
          : "";
        const gemScores = b.gem_avg != null
          ? `<span class="score-inline">${scoreTag("avg", b.gem_avg)}</span>`
          : "";
        return `
        <tr>
          <td class="col-num">${b.num}</td>
          <td class="col-name"><a href="blocks/v0/${b.id}.html">${b.name}</a></td>
          <td class="col-skills">${b.skills.join(", ")}</td>
          <td class="col-version"><a href="blocks/v0/${b.id}.html">v0</a>${claudeScores}</td>
          <td class="col-version"><a href="blocks/v0/gem/${b.id}.html">gem</a>${gemScores}</td>
          <td class="col-version">${b.has_v1 ? `<a href="blocks/v1/${b.id}.html">v1</a>` : `<span class="col-version-na">—</span>`}</td>
          <td class="col-version">${b.v1_composite != null ? `<span class="score-inline">${scoreTag("", b.v1_composite)}</span>` : b.v1_render === false ? `<span class="score-tag s-low">fail</span>` : ""}</td>
        </tr>`;
      }).join("");
      filterCount.textContent = `${data.length} block${data.length === 1 ? "" : "s"}`;
    }

    let sortKey = "num", sortDir = 1;
    document.querySelectorAll("th[data-key]").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (sortKey === key) sortDir *= -1;
        else { sortKey = key; sortDir = key === "num" || key === "name" || key === "skills" ? 1 : -1; }
        document.querySelectorAll("th").forEach(t => t.classList.remove("sort-asc", "sort-desc"));
        th.classList.add(sortDir === 1 ? "sort-asc" : "sort-desc");
        applyFilter();
      });
    });

    function cmp(a, b) {
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === "skills") { va = va.join(","); vb = vb.join(","); }
      if (va == null) va = -Infinity; if (vb == null) vb = -Infinity;
      return va < vb ? -sortDir : va > vb ? sortDir : 0;
    }

    function applyFilter() {
      const q = filter.value.toLowerCase().trim();
      let data = blocks;
      if (q) data = blocks.filter(b =>
        b.name.toLowerCase().includes(q) || b.id.includes(q) ||
        b.skills.some(s => s.includes(q)) || String(b.num).includes(q) ||
        String(b.claude_avg).includes(q) || String(b.gem_avg).includes(q)
      );
      renderRows([...data].sort(cmp));
    }

    filter.addEventListener("input", applyFilter);
    applyFilter();
  </script>
