<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patterned Fills & Stroke Styles — Test Fixture</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #fff; padding: 20px; color: #333; }
  h2 { font-size: 14px; margin: 16px 0 8px; font-weight: 600; }
  h2:first-of-type { margin-top: 0; }
  .controls { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .controls button {
    padding: 4px 12px; border: 1px solid #ccc; border-radius: 4px;
    background: #f8f8f8; cursor: pointer; font-size: 12px;
  }
  .controls button.active { background: #4477AA; color: #fff; border-color: #4477AA; }
  .section { margin-bottom: 24px; }
  svg { display: block; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>
</head>
<body>

<h2>Pattern Fill Catalog</h2>
<div class="section" id="catalog"></div>

<h2>Bar Chart — Color + Pattern Encoding</h2>
<div class="controls" id="bar-controls">
  <button data-action="color-only" class="active">Color only</button>
  <button data-action="pattern-only">Pattern only (B&W)</button>
  <button data-action="color-pattern">Color + Pattern</button>
</div>
<div class="section" id="bar-chart"></div>

<h2>Stroke Dash Patterns</h2>
<div class="section" id="dash-chart"></div>

<h2>Density Hatching (quantitative)</h2>
<div class="section" id="density-chart"></div>

<div class="sr-only" aria-live="polite" id="live-region"></div>

<script type="module">

// ---- Pattern definitions ----

function patternDiagonalHatch(defs, { id = "hatch-diag", size = 8, strokeWidth = 1.5, stroke = "#333", angle = 45 } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse")
    .attr("patternTransform", `rotate(${angle})`);
  p.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternCrossHatch(defs, { id = "hatch-cross", size = 8, strokeWidth = 1, stroke = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse")
    .attr("patternTransform", "rotate(45)");
  p.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  p.append("line").attr("x1", 0).attr("y1", 0).attr("x2", size).attr("y2", 0)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternDots(defs, { id = "dots", size = 8, radius = 1.5, fill = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  p.append("circle").attr("cx", size / 2).attr("cy", size / 2).attr("r", radius).attr("fill", fill);
  return id;
}

function patternHorizontalLines(defs, { id = "lines-h", size = 6, strokeWidth = 1, stroke = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  p.append("line").attr("x1", 0).attr("y1", size / 2).attr("x2", size).attr("y2", size / 2)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternVerticalLines(defs, { id = "lines-v", size = 6, strokeWidth = 1, stroke = "#333" } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  p.append("line").attr("x1", size / 2).attr("y1", 0).attr("x2", size / 2).attr("y2", size)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth);
  return id;
}

function patternCheckerboard(defs, { id = "checker", size = 8, fill = "#333" } = {}) {
  const half = size / 2;
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  p.append("rect").attr("width", half).attr("height", half).attr("fill", fill);
  p.append("rect").attr("x", half).attr("y", half).attr("width", half).attr("height", half).attr("fill", fill);
  return id;
}

function patternStipple(defs, { id = "stipple", size = 16, density = 12, radius = 0.8, fill = "#333", seed = 42 } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  let s = seed;
  const rand = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < density; i++) {
    p.append("circle").attr("cx", rand() * size).attr("cy", rand() * size).attr("r", radius).attr("fill", fill);
  }
  return id;
}

function patternWavy(defs, { id = "wavy", size = 16, strokeWidth = 1.5, stroke = "#333", amplitude = 2.5 } = {}) {
  const p = defs.append("pattern")
    .attr("id", id).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  const mid = size / 2, q = size / 4;
  p.append("path")
    .attr("d", `M0,${mid} Q${q},${mid - amplitude} ${size / 2},${mid} Q${q * 3},${mid + amplitude} ${size},${mid}`)
    .attr("stroke", stroke).attr("stroke-width", strokeWidth).attr("fill", "none");
  return id;
}

// ---- 1. Pattern Catalog ----

const catalogWidth = 900, catalogSwatchSize = 60, catalogGap = 12;
const patternNames = ["Diagonal hatch", "Backslash hatch", "Cross-hatch", "Dots", "Horizontal lines", "Vertical lines", "Checkerboard", "Stipple", "Wavy"];

const catalogSvg = d3.select("#catalog").append("svg")
  .attr("width", catalogWidth).attr("height", catalogSwatchSize + 30);
const catDefs = catalogSvg.append("defs");

const catalogIds = [
  patternDiagonalHatch(catDefs, { id: "cat-diag" }),
  patternDiagonalHatch(catDefs, { id: "cat-back", angle: -45 }),
  patternCrossHatch(catDefs, { id: "cat-cross" }),
  patternDots(catDefs, { id: "cat-dots" }),
  patternHorizontalLines(catDefs, { id: "cat-horiz" }),
  patternVerticalLines(catDefs, { id: "cat-vert" }),
  patternCheckerboard(catDefs, { id: "cat-check" }),
  patternStipple(catDefs, { id: "cat-stipple" }),
  patternWavy(catDefs, { id: "cat-wavy" }),
];

const catG = catalogSvg.append("g").attr("transform", "translate(4, 2)");
catalogIds.forEach((pid, i) => {
  const x = i * (catalogSwatchSize + catalogGap);
  catG.append("rect")
    .attr("class", "pattern-swatch")
    .attr("x", x).attr("y", 0)
    .attr("width", catalogSwatchSize).attr("height", catalogSwatchSize)
    .attr("fill", `url(#${pid})`)
    .attr("stroke", "#bbb").attr("stroke-width", 0.5)
    .attr("rx", 3);
  catG.append("text")
    .attr("x", x + catalogSwatchSize / 2).attr("y", catalogSwatchSize + 14)
    .attr("text-anchor", "middle").attr("font-size", 10).attr("fill", "#555")
    .text(patternNames[i]);
});

// ---- 2. Bar Chart with pattern modes ----

const tolBright = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377"];
const categories = ["Alpha", "Beta", "Gamma", "Delta", "Epsilon", "Zeta"];
const barData = categories.map((c, i) => ({ category: c, value: 30 + Math.sin(i * 1.7) * 20 + i * 8 }));

const barMargin = { top: 20, right: 130, bottom: 30, left: 40 };
const barWidth = 700, barHeight = 260;
const bw = barWidth - barMargin.left - barMargin.right;
const bh = barHeight - barMargin.top - barMargin.bottom;

const barSvg = d3.select("#bar-chart").append("svg")
  .attr("width", barWidth).attr("height", barHeight);
const barDefs = barSvg.append("defs");
const barG = barSvg.append("g").attr("transform", `translate(${barMargin.left},${barMargin.top})`);

const x = d3.scaleBand().domain(categories).range([0, bw]).padding(0.25);
const y = d3.scaleLinear().domain([0, d3.max(barData, d => d.value) * 1.1]).range([bh, 0]);
const colorScale = d3.scaleOrdinal().domain(categories).range(tolBright);

barG.append("g").attr("transform", `translate(0,${bh})`).call(d3.axisBottom(x)).selectAll("text").attr("font-size", 11);
barG.append("g").call(d3.axisLeft(y).ticks(5));

// Pattern types for each category
const barPatternTypes = [
  { fn: "hatch", angle: 45 },
  { fn: "dots" },
  { fn: "crosshatch" },
  { fn: "hatch", angle: -45 },
  { fn: "horizontal" },
  { fn: "vertical" },
];

// Create B&W patterns
categories.forEach((cat, i) => {
  const type = barPatternTypes[i];
  const size = 8;
  if (type.fn === "hatch") patternDiagonalHatch(barDefs, { id: `bw-${i}`, angle: type.angle });
  else if (type.fn === "dots") patternDots(barDefs, { id: `bw-${i}` });
  else if (type.fn === "crosshatch") patternCrossHatch(barDefs, { id: `bw-${i}` });
  else if (type.fn === "horizontal") patternHorizontalLines(barDefs, { id: `bw-${i}` });
  else if (type.fn === "vertical") patternVerticalLines(barDefs, { id: `bw-${i}` });
});

// Create color+pattern combined patterns
categories.forEach((cat, i) => {
  const type = barPatternTypes[i];
  const size = 8;
  const color = colorScale(cat);
  const p = barDefs.append("pattern")
    .attr("id", `cp-${i}`).attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse");
  if (type.angle) p.attr("patternTransform", `rotate(${type.angle})`);
  p.append("rect").attr("width", size).attr("height", size).attr("fill", color);
  const isDark = d3.lab(color).l < 55;
  const markColor = isDark ? "rgba(255,255,255,0.45)" : "rgba(0,0,0,0.2)";
  if (type.fn === "hatch" || type.fn === "crosshatch") {
    p.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
      .attr("stroke", markColor).attr("stroke-width", 1.5);
    if (type.fn === "crosshatch") {
      p.append("line").attr("x1", 0).attr("y1", 0).attr("x2", size).attr("y2", 0)
        .attr("stroke", markColor).attr("stroke-width", 1.5);
    }
  } else if (type.fn === "dots") {
    p.append("circle").attr("cx", size / 2).attr("cy", size / 2).attr("r", 1.5).attr("fill", markColor);
  } else if (type.fn === "horizontal") {
    p.append("line").attr("x1", 0).attr("y1", size / 2).attr("x2", size).attr("y2", size / 2)
      .attr("stroke", markColor).attr("stroke-width", 1.5);
  } else if (type.fn === "vertical") {
    p.append("line").attr("x1", size / 2).attr("y1", 0).attr("x2", size / 2).attr("y2", size)
      .attr("stroke", markColor).attr("stroke-width", 1.5);
  }
});

const bars = barG.selectAll(".bar")
  .data(barData)
  .join("rect")
    .attr("class", "bar")
    .attr("x", d => x(d.category))
    .attr("y", d => y(d.value))
    .attr("width", x.bandwidth())
    .attr("height", d => bh - y(d.value))
    .attr("fill", d => colorScale(d.category))
    .attr("stroke", "#fff")
    .attr("stroke-width", 1);

// Legend
const legendG = barG.append("g").attr("class", "bar-legend").attr("transform", `translate(${bw + 16}, 0)`);

function updateLegend(mode) {
  legendG.selectAll("*").remove();
  categories.forEach((cat, i) => {
    const g = legendG.append("g").attr("transform", `translate(0, ${i * 20})`);
    let fill;
    if (mode === "color-only") fill = colorScale(cat);
    else if (mode === "pattern-only") fill = `url(#bw-${i})`;
    else fill = `url(#cp-${i})`;
    g.append("rect").attr("width", 14).attr("height", 14)
      .attr("fill", fill).attr("stroke", "#999").attr("stroke-width", 0.5).attr("rx", 2);
    g.append("text").attr("x", 20).attr("y", 11).attr("font-size", 11).text(cat);
  });
}

function setBarMode(mode) {
  bars.transition().duration(300).attr("fill", (d, i) => {
    if (mode === "color-only") return colorScale(d.category);
    if (mode === "pattern-only") return `url(#bw-${categories.indexOf(d.category)})`;
    return `url(#cp-${categories.indexOf(d.category)})`;
  }).attr("stroke", mode === "pattern-only" ? "#999" : "#fff");
  updateLegend(mode);
  document.body.dataset.barMode = mode;
}

d3.selectAll("#bar-controls button").on("click", function () {
  d3.selectAll("#bar-controls button").classed("active", false);
  d3.select(this).classed("active", true);
  setBarMode(this.dataset.action);
});

updateLegend("color-only");

// ---- 3. Stroke Dash Patterns ----

const dashPatterns = [
  { name: "Solid", dash: null },
  { name: "Dashed (6 3)", dash: "6 3" },
  { name: "Dotted (2 3)", dash: "2 3" },
  { name: "Dash-dot (12 4 4 4)", dash: "12 4 4 4" },
  { name: "Dash-dot-dot (8 3 2 3 2 3)", dash: "8 3 2 3 2 3" },
  { name: "Fine dot (0.1 6)", dash: "0.1 6", linecap: "round" },
  { name: "Long dash (16 6)", dash: "16 6" },
];

const dashWidth = 600, dashRowH = 28;
const dashSvg = d3.select("#dash-chart").append("svg")
  .attr("width", dashWidth).attr("height", dashPatterns.length * dashRowH + 10);

const lineColors = ["#4477AA", "#EE6677", "#228833", "#AA3377", "#CCBB44", "#66CCEE", "#0077BB"];

dashPatterns.forEach((dp, i) => {
  const gy = 8 + i * dashRowH;
  const g = dashSvg.append("g").attr("transform", `translate(10, ${gy})`);

  g.append("line")
    .attr("class", "dash-line")
    .attr("x1", 0).attr("y1", 8)
    .attr("x2", 200).attr("y2", 8)
    .attr("stroke", lineColors[i % lineColors.length])
    .attr("stroke-width", 2.5)
    .attr("stroke-dasharray", dp.dash)
    .attr("stroke-linecap", dp.linecap || "butt");

  g.append("text")
    .attr("x", 216).attr("y", 12)
    .attr("font-size", 11).attr("fill", "#444")
    .text(dp.name);
});

// ---- 4. Density Hatching ----

const densityData = d3.range(12).map(i => ({ index: i, value: 5 + i * 8 }));
const maxDensityVal = d3.max(densityData, d => d.value);

const densityWidth = 600, densityHeight = 120;
const densityMargin = { top: 10, right: 10, bottom: 30, left: 40 };
const dw = densityWidth - densityMargin.left - densityMargin.right;
const dh = densityHeight - densityMargin.top - densityMargin.bottom;

const densitySvg = d3.select("#density-chart").append("svg")
  .attr("width", densityWidth).attr("height", densityHeight);
const densityDefs = densitySvg.append("defs");
const densityG = densitySvg.append("g").attr("transform", `translate(${densityMargin.left},${densityMargin.top})`);

const dx = d3.scaleBand().domain(densityData.map(d => d.index)).range([0, dw]).padding(0.1);
const dy = d3.scaleLinear().domain([0, maxDensityVal * 1.1]).range([dh, 0]);

densityG.append("g").attr("transform", `translate(0,${dh})`).call(d3.axisBottom(dx).tickFormat(i => densityData[i].value)).selectAll("text").attr("font-size", 10);
densityG.append("g").call(d3.axisLeft(dy).ticks(3));

// Create density-varying patterns
densityData.forEach(d => {
  const spacing = 12 - (d.value / maxDensityVal) * 9;
  const size = Math.max(3, spacing);
  const p = densityDefs.append("pattern")
    .attr("id", `density-${d.index}`)
    .attr("width", size).attr("height", size)
    .attr("patternUnits", "userSpaceOnUse")
    .attr("patternTransform", "rotate(45)");
  p.append("line")
    .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
    .attr("stroke", "#333").attr("stroke-width", 1);
});

densityG.selectAll(".density-bar")
  .data(densityData)
  .join("rect")
    .attr("class", "density-bar")
    .attr("x", d => dx(d.index))
    .attr("y", d => dy(d.value))
    .attr("width", dx.bandwidth())
    .attr("height", d => dh - dy(d.value))
    .attr("fill", d => `url(#density-${d.index})`)
    .attr("stroke", "#999")
    .attr("stroke-width", 0.5);

// ---- Signal ready ----
document.body.dataset.ready = "true";
document.body.dataset.barMode = "color-only";

</script>
</body>
</html>
