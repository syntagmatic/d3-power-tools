<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hierarchy Patterns Test</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f2f5; font-family: sans-serif; }
        canvas { display: block; background: white; margin: 20px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: crosshair; }
        .controls { position: absolute; top: 10px; left: 10px; display: flex; gap: 10px; }
        button { padding: 8px 12px; cursor: pointer; }
        #info { position: absolute; bottom: 10px; left: 10px; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="controls">
        <button data-layout="treemap">Treemap</button>
        <button data-layout="sunburst">Sunburst</button>
        <button data-layout="pack">Circle Pack</button>
    </div>
    <canvas id="viz"></canvas>
    <div id="info">Hover an element</div>

    <script type="module">
        // --- Point resampling for cross-shape morphing ---
        const nPts = 48;

        function circlePoints(cx, cy, r, n) {
            if (r <= 0) return d3.range(n).map(() => [cx, cy]);
            return d3.range(n).map(i => {
                const a = (i / n) * 2 * Math.PI;
                return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
            });
        }

        function rectPoints(cx, cy, w, h, n) {
            if (w <= 0 || h <= 0) return d3.range(n).map(() => [cx, cy]);
            const hw = w / 2, hh = h / 2;
            const perim = 2 * (w + h);
            return d3.range(n).map(i => {
                let d = (i / n) * perim;
                if (d < w) return [cx - hw + d, cy - hh];
                d -= w;
                if (d < h) return [cx + hw, cy - hh + d];
                d -= h;
                if (d < w) return [cx + hw - d, cy + hh];
                d -= w;
                return [cx - hw, cy + hh - d];
            });
        }

        function arcPoints(centerX, centerY, startAngle, endAngle, innerR, outerR, n) {
            if (endAngle - startAngle < 0.001 || outerR <= 0)
                return d3.range(n).map(() => [centerX, centerY]);
            const outerLen = (endAngle - startAngle) * outerR;
            const innerLen = innerR > 0 ? (endAngle - startAngle) * innerR : 0;
            const sideLen = outerR - innerR;
            const total = outerLen + sideLen + innerLen + sideLen;
            return d3.range(n).map(i => {
                let d = (i / n) * total;
                if (d <= outerLen) {
                    const a = startAngle + d / outerR - Math.PI / 2;
                    return [centerX + outerR * Math.cos(a), centerY + outerR * Math.sin(a)];
                }
                d -= outerLen;
                if (d <= sideLen) {
                    const a = endAngle - Math.PI / 2;
                    const r = outerR - d;
                    return [centerX + r * Math.cos(a), centerY + r * Math.sin(a)];
                }
                d -= sideLen;
                if (d <= innerLen && innerR > 0) {
                    const a = endAngle - d / innerR - Math.PI / 2;
                    return [centerX + innerR * Math.cos(a), centerY + innerR * Math.sin(a)];
                }
                d -= innerLen;
                const a = startAngle - Math.PI / 2;
                const r = innerR + d;
                return [centerX + r * Math.cos(a), centerY + r * Math.sin(a)];
            });
        }

        function shapeToPoints(rs, w, h) {
            if (rs.shapeType === 'circle') return circlePoints(rs.x, rs.y, rs.r, nPts);
            if (rs.shapeType === 'rect') return rectPoints(rs.x, rs.y, rs.w, rs.h, nPts);
            if (rs.shapeType === 'arc') return arcPoints(w / 2, h / 2, rs.startAngle, rs.endAngle, rs.innerR, rs.outerR, nPts);
            return d3.range(nPts).map(() => [rs.x, rs.y]);
        }

        function bestRotation(source, target) {
            const n = source.length;
            let bestOffset = 0, bestDist = Infinity;
            for (let offset = 0; offset < n; offset++) {
                let dist = 0;
                for (let i = 0; i < n; i++) {
                    const j = (i + offset) % n;
                    const dx = source[j][0] - target[i][0];
                    const dy = source[j][1] - target[i][1];
                    dist += dx * dx + dy * dy;
                }
                if (dist < bestDist) { bestDist = dist; bestOffset = offset; }
            }
            return source.map((_, i) => source[(i + bestOffset) % n]);
        }

        // --- TransitionManager with point resampling ---

        class TransitionManager {
            constructor(onRender) {
                this.morphData = new Map();
                this.onRender = onRender;
                this.isTransitioning = false;
            }

            startTransition(targets, renderState, canvasW, canvasH, duration = 800) {
                this.morphData = new Map();
                this.isTransitioning = true;

                for (const [nodeId, target] of targets) {
                    const rs = renderState.get(nodeId);
                    if (!rs) continue;

                    // Compute source and target point arrays in absolute coords
                    const fromPts = shapeToPoints(rs, canvasW, canvasH);
                    const toPts = shapeToPoints(target, canvasW, canvasH);
                    const aligned = bestRotation(fromPts, toPts);

                    this.morphData.set(nodeId, { from: aligned, to: toPts, target });
                }

                this.runLoop(renderState, duration);
            }

            runLoop(renderState, duration) {
                const ease = d3.easeCubicInOut;
                const startTime = performance.now();

                const tick = (now) => {
                    const elapsed = now - startTime;
                    const t = Math.min(1, elapsed / duration);
                    const easedT = ease(t);

                    for (const [nodeId, data] of this.morphData) {
                        const rs = renderState.get(nodeId);
                        // Interpolate point arrays
                        rs.morphPts = data.from.map((fp, j) => [
                            fp[0] + (data.to[j][0] - fp[0]) * easedT,
                            fp[1] + (data.to[j][1] - fp[1]) * easedT
                        ]);

                        if (t >= 1) {
                            // Apply final target properties
                            Object.assign(rs, data.target);
                            rs.morphPts = null;
                        }
                    }

                    this.onRender();

                    if (t < 1) {
                        requestAnimationFrame(tick);
                    } else {
                        this.isTransitioning = false;
                    }
                };
                requestAnimationFrame(tick);
            }
        }

        const hitTestRect = (mouseX, mouseY, nodes) => {
            let best = null;
            let bestDepth = -1;
            for (const node of nodes) {
                const left = node.x - node.w / 2;
                const top = node.y - node.h / 2;
                if (mouseX >= left && mouseX <= left + node.w && mouseY >= top && mouseY <= top + node.h) {
                    if (node.depth > bestDepth) {
                        bestDepth = node.depth;
                        best = node;
                    }
                }
            }
            return best;
        };

        const hitTestArc = (mouseX, mouseY, nodes) => {
            const dist = Math.sqrt(mouseX * mouseX + mouseY * mouseY);
            let angle = Math.atan2(mouseY, mouseX) + Math.PI / 2;
            if (angle < 0) angle += Math.PI * 2;
            let best = null;
            let bestDepth = -1;
            for (const node of nodes) {
                if (dist >= node.innerR && dist <= node.outerR && angle >= node.startAngle && angle <= node.endAngle) {
                    if (node.depth > bestDepth) {
                        bestDepth = node.depth;
                        best = node;
                    }
                }
            }
            return best;
        };

        // --- Viz Setup ---

        const canvas = document.getElementById('viz');
        const ctx = canvas.getContext('2d');
        const width = 800, height = 600;
        canvas.width = width * devicePixelRatio;
        canvas.height = height * devicePixelRatio;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.scale(devicePixelRatio, devicePixelRatio);

        const data = {
            name: "root",
            children: [
                { name: "A", children: [{ name: "A1", value: 10 }, { name: "A2", value: 20 }] },
                { name: "B", children: [{ name: "B1", value: 15 }, { name: "B2", value: 25 }] },
                { name: "C", value: 30 }
            ]
        };

        const hierarchy = d3.hierarchy(data).sum(d => d.value);
        const nodes = hierarchy.descendants();
        const renderState = new Map();
        let currentLayout = 'pack';

        // Initialize render state
        nodes.forEach((d, i) => {
            renderState.set(i, {
                id: i,
                name: d.data.name,
                depth: d.depth,
                x: width / 2, y: height / 2, r: 0, w: 0, h: 0,
                startAngle: 0, endAngle: 0, innerR: 0, outerR: 0,
                fillOpacity: 1,
                shapeType: 'circle'
            });
        });

        const layouts = {
            pack: () => {
                d3.pack().size([width - 40, height - 40]).padding(3)(hierarchy);
                return nodes.map((d, i) => ({
                    id: i, x: d.x + 20, y: d.y + 20, r: d.r,
                    shapeType: 'circle', fillOpacity: 1
                }));
            },
            treemap: () => {
                d3.treemap().size([width - 40, height - 40]).padding(2)(hierarchy);
                return nodes.map((d, i) => ({
                    id: i, x: (d.x0 + d.x1) / 2 + 20, y: (d.y0 + d.y1) / 2 + 20,
                    w: d.x1 - d.x0, h: d.y1 - d.y0,
                    shapeType: 'rect', fillOpacity: 1
                }));
            },
            sunburst: () => {
                d3.partition().size([2 * Math.PI, Math.min(width, height) / 2 - 40])(hierarchy);
                return nodes.map((d, i) => ({
                    id: i, x: 0, y: 0,
                    startAngle: d.x0, endAngle: d.x1,
                    innerR: d.y0, outerR: d.y1,
                    shapeType: 'arc', fillOpacity: 1
                }));
            }
        };

        const tm = new TransitionManager(render);

        function render() {
            ctx.clearRect(0, 0, width, height);

            for (const rs of renderState.values()) {
                ctx.beginPath();
                ctx.fillStyle = d3.interpolateRainbow(rs.depth / 3);
                ctx.globalAlpha = rs.fillOpacity * (rs.id === hoveredId ? 1 : 0.7);

                if (rs.morphPts) {
                    // During transition: draw interpolated polygon
                    ctx.moveTo(rs.morphPts[0][0], rs.morphPts[0][1]);
                    for (let i = 1; i < rs.morphPts.length; i++) {
                        ctx.lineTo(rs.morphPts[i][0], rs.morphPts[i][1]);
                    }
                    ctx.closePath();
                } else if (rs.shapeType === 'circle') {
                    ctx.arc(rs.x, rs.y, rs.r, 0, Math.PI * 2);
                } else if (rs.shapeType === 'rect') {
                    ctx.rect(rs.x - rs.w / 2, rs.y - rs.h / 2, rs.w, rs.h);
                } else if (rs.shapeType === 'arc') {
                    ctx.save();
                    ctx.translate(width / 2, height / 2);
                    ctx.arc(0, 0, rs.outerR, rs.startAngle - Math.PI / 2, rs.endAngle - Math.PI / 2);
                    ctx.arc(0, 0, rs.innerR, rs.endAngle - Math.PI / 2, rs.startAngle - Math.PI / 2, true);
                    ctx.restore();
                }
                ctx.fill();
                if (rs.id === hoveredId) {
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        function updateLayout(name) {
            currentLayout = name;
            const targetData = layouts[name]();
            const targets = new Map(targetData.map(d => [d.id, d]));
            tm.startTransition(targets, renderState, width, height);
        }

        let hoveredId = null;
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            let hit = null;
            const visibleNodes = Array.from(renderState.values());
            
            if (currentLayout === 'sunburst') {
                hit = hitTestArc(mx - width / 2, my - height / 2, visibleNodes);
            } else if (currentLayout === 'treemap') {
                hit = hitTestRect(mx, my, visibleNodes);
            } else {
                // simple point-dist for circle pack in this test
                hit = visibleNodes.find(n => Math.hypot(n.x - mx, n.y - my) <= n.r);
            }
            
            if (hit && hit.id !== hoveredId) {
                hoveredId = hit.id;
                document.getElementById('info').textContent = `Hovered: ${hit.name} (depth ${hit.depth})`;
                render();
            } else if (!hit && hoveredId !== null) {
                hoveredId = null;
                document.getElementById('info').textContent = `Hover an element`;
                render();
            }
        });

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => updateLayout(btn.dataset.layout));
        });

        // Start with pack
        updateLayout('pack');

    </script>
</body>
</html>
