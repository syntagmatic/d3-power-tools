<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animated Transitions Test</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #fafafa; }
  #controls { padding: 12px 20px; display: flex; gap: 8px; }
  button { padding: 6px 14px; border: 1px solid #999; border-radius: 4px;
           background: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #eee; }
  button.active { background: steelblue; color: #fff; border-color: steelblue; }
  svg { display: block; }
  .bar { fill: steelblue; }
  .label { font-size: 11px; fill: #333; text-anchor: middle; }
  .axis text { font-size: 11px; }
  .axis .domain { stroke: #ccc; }
</style>
</head>
<body>
<div id="controls">
  <button data-action="update" class="active">Update Data</button>
  <button data-action="add">Add Items</button>
  <button data-action="remove">Remove Items</button>
  <button data-action="shuffle">Shuffle</button>
  <button data-action="sort">Sort</button>
  <button data-action="stagger">Stagger In</button>
</div>
<svg id="chart"></svg>
<div id="status" style="padding: 4px 20px; font-size: 12px; color: #666;"></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const margin = { top: 20, right: 20, bottom: 40, left: 50 };
const width = 960 - margin.left - margin.right;
const height = 450 - margin.top - margin.bottom;

const svg = d3.select("#chart")
  .attr("width", width + margin.left + margin.right)
  .attr("height", height + margin.top + margin.bottom)
  .append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const xScale = d3.scaleBand().range([0, width]).padding(0.15);
const yScale = d3.scaleLinear().range([height, 0]);
const colorScale = d3.scaleSequential(d3.interpolateViridis);

const xAxisG = svg.append("g")
  .attr("class", "axis x-axis")
  .attr("transform", `translate(0,${height})`);

const yAxisG = svg.append("g")
  .attr("class", "axis y-axis");

let nextId = 0;
const status = d3.select("#status");

function generateData(n = 12) {
  return d3.range(n).map(() => ({
    id: nextId++,
    label: String.fromCharCode(65 + (nextId % 26)),
    value: Math.round(10 + Math.random() * 90),
  }));
}

let data = generateData();
let transitionCount = 0;

function render(data, { stagger = false } = {}) {
  const hasExit = svg.selectAll(".bar").data().some(
    old => !data.find(d => d.id === old.id)
  );
  const hasEnter = data.some(
    d => svg.selectAll(".bar").data().every(old => old.id !== d.id)
  );

  // Timing: stage exit → move → enter so bars don't overlap
  const exitDur = 300;
  const moveDur = 400;
  const enterDur = 400;
  const moveDelay = hasExit ? exitDur : 0;
  const enterDelay = hasExit || hasEnter ? moveDelay + moveDur : 0;

  xScale.domain(data.map(d => d.id));
  yScale.domain([0, d3.max(data, d => d.value) * 1.1]).nice();
  colorScale.domain([0, d3.max(data, d => d.value)]);

  // Axes move with the update phase
  xAxisG.transition().delay(moveDelay).duration(moveDur)
    .call(d3.axisBottom(xScale).tickFormat((id) => {
      const d = data.find(x => x.id === id);
      return d ? d.label : "";
    }));
  yAxisG.transition().delay(moveDelay).duration(moveDur).call(d3.axisLeft(yScale));

  // Bars
  svg.selectAll(".bar")
    .data(data, d => d.id)
    .join(
      enter => enter.append("rect")
        .attr("class", "bar")
        .attr("x", d => xScale(d.id))
        .attr("y", height)
        .attr("width", xScale.bandwidth())
        .attr("height", 0)
        .attr("fill", d => colorScale(d.value))
        .call(enter => enter.transition().duration(enterDur)
          .delay(stagger ? (d, i) => enterDelay + i * 40 : enterDelay)
          .ease(d3.easeCubicOut)
          .attr("y", d => yScale(d.value))
          .attr("height", d => height - yScale(d.value))),
      update => update
        .call(update => update.transition().delay(moveDelay).duration(moveDur)
          .attr("x", d => xScale(d.id))
          .attr("width", xScale.bandwidth())
          .attr("y", d => yScale(d.value))
          .attr("height", d => height - yScale(d.value))
          .attr("fill", d => colorScale(d.value))
          .attr("opacity", 1)),
      exit => exit
        .call(exit => exit.transition().duration(exitDur)
          .ease(d3.easeCubicIn)
          .attr("y", height)
          .attr("height", 0)
          .attr("opacity", 0)
          .remove())
    );

  // Labels
  svg.selectAll(".label")
    .data(data, d => d.id)
    .join(
      enter => enter.append("text")
        .attr("class", "label")
        .attr("x", d => xScale(d.id) + xScale.bandwidth() / 2)
        .attr("y", height)
        .attr("opacity", 0)
        .text(d => d.value)
        .call(enter => enter.transition().duration(enterDur)
          .delay(stagger ? (d, i) => enterDelay + i * 40 : enterDelay)
          .attr("y", d => yScale(d.value) - 5)
          .attr("opacity", 1)),
      update => update
        .call(update => update.transition().delay(moveDelay).duration(moveDur)
          .attr("x", d => xScale(d.id) + xScale.bandwidth() / 2)
          .attr("y", d => yScale(d.value) - 5)
          .attr("opacity", 1)
          .text(d => d.value)),
      exit => exit
        .call(exit => exit.transition().duration(exitDur)
          .attr("opacity", 0)
          .remove())
    );

  transitionCount++;
  status.text(`Transitions: ${transitionCount} | Items: ${data.length}`);
  document.getElementById("chart").dataset.transitionCount = transitionCount;
  document.getElementById("chart").dataset.itemCount = data.length;
}

// --- Button handlers ---
d3.selectAll("button").on("click", function() {
  const action = this.dataset.action;

  d3.selectAll("button").classed("active", false);
  d3.select(this).classed("active", true);

  switch (action) {
    case "update":
      data = data.map(d => ({ ...d, value: Math.round(10 + Math.random() * 90) }));
      render(data);
      break;
    case "add":
      data = [...data, ...generateData(3)];
      render(data);
      break;
    case "remove":
      // Remove last 3 items (deterministic, no shuffle)
      if (data.length > 3) {
        data = data.slice(0, data.length - 3);
      }
      render(data);
      break;
    case "shuffle":
      data = d3.shuffle(data.slice());
      render(data);
      break;
    case "sort":
      data = data.slice().sort((a, b) => a.value - b.value);
      render(data);
      break;
    case "stagger":
      data = generateData(16);
      render(data, { stagger: true });
      break;
  }
});

// Initial render
render(data);
document.getElementById("chart").dataset.ready = "true";
</script>
</body>
</html>
