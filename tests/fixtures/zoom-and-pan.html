<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoom &amp; Pan Gallery</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #222;
    margin: 0;
    padding: 30px 40px;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 22px; font-weight: 400; margin: 0 0 4px; }
  h1 b { font-weight: 600; }
  .lead { color: #666; margin: 0 0 28px; font-size: 12px; }
  .panel { margin-bottom: 36px; }
  .panel h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; color: #666; margin: 0 0 8px;
  }
  .panel-row { display: flex; gap: 24px; flex-wrap: wrap; }
  svg { display: block; }
  canvas { display: block; }
  .grid line { stroke: #eee; }
  .grid .domain { display: none; }
  .chart-wrap { position: relative; }
  .zoom-controls {
    position: absolute; top: 6px; right: 6px;
    display: flex; gap: 2px;
  }
  .zoom-controls button {
    width: 24px; height: 24px; border: 1px solid #ccc; border-radius: 3px;
    background: #fff; cursor: pointer; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    color: #444;
  }
  .zoom-controls button:hover { background: #f0f0f0; }
  .minimap-wrap { position: relative; }
  .minimap-wrap .viewport {
    fill: rgba(78, 121, 167, 0.15);
    stroke: #4e79a7;
    stroke-width: 1;
  }
  .context-area { fill: #4e79a7; opacity: 0.15; }
  .context-line { fill: none; stroke: #4e79a7; stroke-width: 1; }
  .focus-area { fill: #4e79a7; opacity: 0.2; }
  .focus-line { fill: none; stroke: #4e79a7; stroke-width: 1.5; }
  .brush .selection { fill: rgba(78, 121, 167, 0.3); stroke: #4e79a7; }
</style>
</head>
<body>

<h1><b>Zoom &amp; Pan</b> Gallery</h1>
<p class="lead">Four panels: semantic zoom with axes, geometric zoom on Canvas with minimap, focus+context with brush-to-zoom, and level-of-detail rendering.</p>

<div id="charts"></div>

<script>
const container = d3.select("#charts");

// Shared data generation
function genScatter(n) {
  return d3.range(n).map(i => ({
    x: Math.random() * 100,
    y: Math.random() * 100,
    r: 2 + Math.random() * 3,
    group: Math.floor(Math.random() * 4)
  }));
}

const groupColors = ["#4e79a7", "#e15759", "#59a14f", "#f28e2b"];

// ── 1. Semantic Zoom with Axes ───────────────────────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Semantic Zoom \u2014 Rescaled Axes, Constant Point Size");

  const w = 440, h = 320;
  const margin = { top: 15, right: 15, bottom: 35, left: 45 };
  const data = genScatter(200);

  const wrap = panel.append("div").attr("class", "chart-wrap")
    .style("width", w + "px").style("display", "inline-block");

  const controls = wrap.append("div").attr("class", "zoom-controls");
  controls.append("button").attr("id", "sz-in").text("+");
  controls.append("button").attr("id", "sz-out").text("\u2212");
  controls.append("button").attr("id", "sz-reset").text("\u21BA");

  const svg = wrap.append("svg").attr("width", w).attr("height", h);

  const xScale = d3.scaleLinear().domain([0, 100]).range([margin.left, w - margin.right]);
  const yScale = d3.scaleLinear().domain([0, 100]).range([h - margin.bottom, margin.top]);

  // Clip path
  svg.append("clipPath").attr("id", "clip-sz")
    .append("rect")
      .attr("x", margin.left).attr("y", margin.top)
      .attr("width", w - margin.left - margin.right)
      .attr("height", h - margin.top - margin.bottom);

  const chartArea = svg.append("g").attr("clip-path", "url(#clip-sz)");

  // Grid
  const gridG = svg.append("g").attr("class", "grid")
    .attr("transform", `translate(${margin.left},0)`);

  // Axes
  const xAxisG = svg.append("g")
    .attr("transform", `translate(0,${h - margin.bottom})`);
  const yAxisG = svg.append("g")
    .attr("transform", `translate(${margin.left},0)`);

  // Points
  chartArea.selectAll("circle").data(data).join("circle")
    .attr("cx", d => xScale(d.x))
    .attr("cy", d => yScale(d.y))
    .attr("r", d => d.r)
    .attr("fill", d => groupColors[d.group])
    .attr("opacity", 0.7);

  function drawAxes(zx, zy) {
    const chartW = w - margin.left - margin.right;
    xAxisG.call(d3.axisBottom(zx).ticks(Math.max(3, Math.floor(chartW / 80))));
    yAxisG.call(d3.axisLeft(zy).ticks(6));
    gridG.call(d3.axisLeft(zy).tickSize(-(chartW)).tickFormat("").ticks(6))
      .call(g => g.select(".domain").remove());
  }

  drawAxes(xScale, yScale);

  const zoom = d3.zoom()
    .scaleExtent([1, 20])
    .extent([[margin.left, margin.top], [w - margin.right, h - margin.bottom]])
    .translateExtent([[margin.left, margin.top], [w - margin.right, h - margin.bottom]])
    .on("zoom", zoomed);

  svg.call(zoom);

  function zoomed(event) {
    const zx = event.transform.rescaleX(xScale);
    const zy = event.transform.rescaleY(yScale);
    drawAxes(zx, zy);
    chartArea.selectAll("circle")
      .attr("cx", d => zx(d.x))
      .attr("cy", d => zy(d.y));
  }

  d3.select("#sz-in").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1.5));
  d3.select("#sz-out").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.5));
  d3.select("#sz-reset").on("click", () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity));
}

// ── 2. Canvas Zoom with Minimap ──────────────────────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Canvas Zoom with Minimap \u2014 2,000 Points, Viewport Indicator");

  const w = 500, h = 320;
  const margin = { top: 10, right: 10, bottom: 35, left: 45 };
  const mw = 120, mh = Math.round(mw * h / w);
  const data = genScatter(2000);

  const row = panel.append("div").attr("class", "panel-row");

  // Main canvas
  const wrap = row.append("div").attr("class", "chart-wrap");
  const controls = wrap.append("div").attr("class", "zoom-controls");
  controls.append("button").attr("id", "cz-in").text("+");
  controls.append("button").attr("id", "cz-out").text("\u2212");
  controls.append("button").attr("id", "cz-reset").text("\u21BA");

  const dpr = window.devicePixelRatio || 1;
  const canvas = wrap.append("canvas")
    .attr("width", w * dpr).attr("height", h * dpr)
    .style("width", w + "px").style("height", h + "px");
  const ctx = canvas.node().getContext("2d");
  ctx.scale(dpr, dpr);

  // Scales
  const xScale = d3.scaleLinear().domain([0, 100]).range([margin.left, w - margin.right]);
  const yScale = d3.scaleLinear().domain([0, 100]).range([h - margin.bottom, margin.top]);

  // Minimap
  const miniWrap = row.append("div").attr("class", "minimap-wrap");
  const miniSvg = miniWrap.append("svg").attr("width", mw).attr("height", mh)
    .style("border", "1px solid #ddd").style("border-radius", "3px");
  const mx = d3.scaleLinear().domain([0, 100]).range([2, mw - 2]);
  const my = d3.scaleLinear().domain([0, 100]).range([mh - 2, 2]);

  miniSvg.selectAll("circle").data(data).join("circle")
    .attr("cx", d => mx(d.x)).attr("cy", d => my(d.y))
    .attr("r", 0.7).attr("fill", "#999").attr("opacity", 0.5);

  const viewport = miniSvg.append("rect").attr("class", "viewport");

  function updateMinimap(transform) {
    const zx = transform.rescaleX(xScale);
    const zy = transform.rescaleY(yScale);
    const [x0, x1] = zx.domain();
    const [y0, y1] = zy.domain();
    viewport
      .attr("x", mx(x0)).attr("y", my(y1))
      .attr("width", Math.max(1, mx(x1) - mx(x0)))
      .attr("height", Math.max(1, my(y0) - my(y1)));
  }
  updateMinimap(d3.zoomIdentity);

  function draw(transform) {
    const zx = transform.rescaleX(xScale);
    const zy = transform.rescaleY(yScale);
    const [xMin, xMax] = zx.domain();
    const [yMin, yMax] = zy.domain();

    ctx.save();
    ctx.clearRect(0, 0, w, h);

    // Clip to chart area
    ctx.beginPath();
    ctx.rect(margin.left, margin.top, w - margin.left - margin.right, h - margin.top - margin.bottom);
    ctx.clip();

    // Draw points (viewport culled)
    for (let g = 0; g < 4; g++) {
      ctx.fillStyle = groupColors[g];
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      for (const d of data) {
        if (d.group !== g) continue;
        if (d.x < xMin || d.x > xMax || d.y < yMin || d.y > yMax) continue;
        const px = zx(d.x), py = zy(d.y);
        ctx.moveTo(px + d.r, py);
        ctx.arc(px, py, d.r, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // Axes
    drawCanvasAxis(ctx, zx, "bottom", [0, h - margin.bottom]);
    drawCanvasAxis(ctx, zy, "left", [margin.left, 0]);
  }

  function drawCanvasAxis(ctx, scale, orient, translate) {
    const ticks = scale.ticks(6);
    const format = scale.tickFormat(6);
    ctx.save();
    ctx.translate(...translate);
    ctx.strokeStyle = "#999";
    ctx.fillStyle = "#666";
    ctx.lineWidth = 1;
    ctx.font = "10px sans-serif";
    ctx.beginPath();

    if (orient === "bottom") {
      const [r0, r1] = scale.range();
      ctx.moveTo(r0, 0); ctx.lineTo(r1, 0);
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      for (const t of ticks) {
        const x = scale(t);
        ctx.moveTo(x, 0); ctx.lineTo(x, 5);
      }
      ctx.stroke();
      for (const t of ticks) ctx.fillText(format(t), scale(t), 7);
    } else {
      const [r0, r1] = scale.range();
      ctx.moveTo(0, r0); ctx.lineTo(0, r1);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      for (const t of ticks) {
        const y = scale(t);
        ctx.moveTo(0, y); ctx.lineTo(-5, y);
      }
      ctx.stroke();
      for (const t of ticks) ctx.fillText(format(t), -7, scale(t));
    }
    ctx.restore();
  }

  draw(d3.zoomIdentity);

  const zoom = d3.zoom()
    .scaleExtent([1, 30])
    .on("zoom", (event) => {
      draw(event.transform);
      updateMinimap(event.transform);
    });

  canvas.call(zoom);

  // Minimap click-to-navigate
  miniSvg.on("click", (event) => {
    const [px, py] = d3.pointer(event);
    const dataX = mx.invert(px), dataY = my.invert(py);
    const k = d3.zoomTransform(canvas.node()).k;
    const transform = d3.zoomIdentity
      .translate(w / 2, h / 2).scale(k)
      .translate(-xScale(dataX), -yScale(dataY));
    canvas.transition().duration(500).call(zoom.transform, transform);
  });

  d3.select("#cz-in").on("click", () => canvas.transition().duration(300).call(zoom.scaleBy, 1.5));
  d3.select("#cz-out").on("click", () => canvas.transition().duration(300).call(zoom.scaleBy, 1 / 1.5));
  d3.select("#cz-reset").on("click", () => canvas.transition().duration(500).call(zoom.transform, d3.zoomIdentity));
}

// ── 3. Focus + Context (Brush-to-Zoom) ──────────────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Focus + Context \u2014 Brush-to-Zoom with Linked Axes");

  const w = 900, focusH = 200, contextH = 50, gap = 30;
  const totalH = focusH + gap + contextH;
  const margin = { top: 10, right: 20, bottom: 25, left: 45 };

  // Time series data
  const n = 365;
  const startDate = new Date(Date.UTC(2024, 0, 1));
  const tsData = d3.range(n).map(i => {
    const date = d3.utcDay.offset(startDate, i);
    return { date, value: 0 };
  });
  tsData.reduce((prev, d) => {
    d.value = prev + (Math.random() - 0.48) * 5;
    return d.value;
  }, 50);

  const svg = panel.append("svg").attr("width", w).attr("height", totalH);

  const xDomain = d3.extent(tsData, d => d.date);
  const yDomain = d3.extent(tsData, d => d.value);

  // Focus scales
  const xFocus = d3.scaleUtc().domain(xDomain).range([margin.left, w - margin.right]);
  const yFocus = d3.scaleLinear().domain(yDomain).nice().range([focusH - 5, margin.top]);

  // Context scales
  const xContext = d3.scaleUtc().domain(xDomain).range([margin.left, w - margin.right]);
  const yContext = d3.scaleLinear().domain(yDomain).range([totalH - margin.bottom, focusH + gap]);

  // Clip
  svg.append("clipPath").attr("id", "clip-fc")
    .append("rect")
      .attr("x", margin.left).attr("y", margin.top)
      .attr("width", w - margin.left - margin.right)
      .attr("height", focusH - margin.top);

  // Focus area
  const focusG = svg.append("g").attr("clip-path", "url(#clip-fc)");

  const focusArea = d3.area()
    .x(d => xFocus(d.date)).y0(focusH - 5).y1(d => yFocus(d.value));
  const focusLine = d3.line()
    .x(d => xFocus(d.date)).y(d => yFocus(d.value));

  focusG.append("path").datum(tsData).attr("class", "focus-area").attr("d", focusArea);
  focusG.append("path").datum(tsData).attr("class", "focus-line").attr("d", focusLine);

  const focusXAxisG = svg.append("g")
    .attr("transform", `translate(0,${focusH - 5})`);
  const focusYAxisG = svg.append("g")
    .attr("transform", `translate(${margin.left},0)`);

  focusXAxisG.call(d3.axisBottom(xFocus).ticks(8));
  focusYAxisG.call(d3.axisLeft(yFocus).ticks(5))
    .call(g => g.select(".domain").remove());

  // Context area
  const contextG = svg.append("g");

  const contextArea = d3.area()
    .x(d => xContext(d.date)).y0(totalH - margin.bottom).y1(d => yContext(d.value));
  const contextLine = d3.line()
    .x(d => xContext(d.date)).y(d => yContext(d.value));

  contextG.append("path").datum(tsData).attr("class", "context-area").attr("d", contextArea);
  contextG.append("path").datum(tsData).attr("class", "context-line").attr("d", contextLine);

  svg.append("g")
    .attr("transform", `translate(0,${totalH - margin.bottom})`)
    .call(d3.axisBottom(xContext).ticks(8));

  // Brush on context
  const brush = d3.brushX()
    .extent([[margin.left, focusH + gap], [w - margin.right, totalH - margin.bottom]])
    .on("brush end", brushed);

  const brushG = contextG.append("g").call(brush);

  // Set initial brush to middle third
  const initExtent = [
    xContext(d3.utcDay.offset(startDate, 120)),
    xContext(d3.utcDay.offset(startDate, 240))
  ];
  brushG.call(brush.move, initExtent);

  function brushed(event) {
    if (!event.selection) return;
    const [s0, s1] = event.selection;
    const newDomain = [xContext.invert(s0), xContext.invert(s1)];

    xFocus.domain(newDomain);

    focusG.select(".focus-area").attr("d", focusArea);
    focusG.select(".focus-line").attr("d", focusLine);

    const chartW = w - margin.left - margin.right;
    focusXAxisG.call(d3.axisBottom(xFocus)
      .ticks(Math.max(3, Math.floor(chartW / 120))));
  }

  // Trigger initial update
  brushed({ selection: initExtent });
}

// ── 4. Level-of-Detail Zoom ─────────────────────────────────────
{
  const panel = container.append("div").attr("class", "panel");
  panel.append("h2").text("Level of Detail \u2014 Density at Overview, Points When Zoomed");

  const w = 440, h = 280;
  const margin = { top: 15, right: 15, bottom: 35, left: 45 };
  const data = genScatter(800);

  const wrap = panel.append("div").attr("class", "chart-wrap")
    .style("width", w + "px").style("display", "inline-block");

  const controls = wrap.append("div").attr("class", "zoom-controls");
  controls.append("button").attr("id", "lod-in").text("+");
  controls.append("button").attr("id", "lod-out").text("\u2212");
  controls.append("button").attr("id", "lod-reset").text("\u21BA");

  const svg = wrap.append("svg").attr("width", w).attr("height", h);

  const xScale = d3.scaleLinear().domain([0, 100]).range([margin.left, w - margin.right]);
  const yScale = d3.scaleLinear().domain([0, 100]).range([h - margin.bottom, margin.top]);

  svg.append("clipPath").attr("id", "clip-lod")
    .append("rect")
      .attr("x", margin.left).attr("y", margin.top)
      .attr("width", w - margin.left - margin.right)
      .attr("height", h - margin.top - margin.bottom);

  const chartArea = svg.append("g").attr("clip-path", "url(#clip-lod)");
  const gridG = svg.append("g").attr("class", "grid")
    .attr("transform", `translate(${margin.left},0)`);
  const xAxisG = svg.append("g").attr("transform", `translate(0,${h - margin.bottom})`);
  const yAxisG = svg.append("g").attr("transform", `translate(${margin.left},0)`);

  // LOD indicator
  const lodLabel = svg.append("text")
    .attr("x", w - margin.right - 4).attr("y", margin.top + 12)
    .attr("text-anchor", "end")
    .attr("font-size", "9px").attr("fill", "#999");

  // Precompute hex bins at original scale
  const hexRadius = 15;

  function drawLOD(transform) {
    const k = transform.k;
    const zx = transform.rescaleX(xScale);
    const zy = transform.rescaleY(yScale);
    const chartW = w - margin.left - margin.right;

    // Axes
    xAxisG.call(d3.axisBottom(zx).ticks(Math.max(3, Math.floor(chartW / 80))));
    yAxisG.call(d3.axisLeft(zy).ticks(6));
    gridG.call(d3.axisLeft(zy).tickSize(-chartW).tickFormat("").ticks(6))
      .call(g => g.select(".domain").remove());

    chartArea.selectAll("*").remove();

    if (k < 2.5) {
      // Overview: binned density circles
      lodLabel.text("density");
      const [xMin, xMax] = zx.domain();
      const [yMin, yMax] = zy.domain();
      const binSize = 10;

      const bins = new Map();
      for (const d of data) {
        if (d.x < xMin || d.x > xMax || d.y < yMin || d.y > yMax) continue;
        const bx = Math.floor(d.x / binSize) * binSize + binSize / 2;
        const by = Math.floor(d.y / binSize) * binSize + binSize / 2;
        const key = `${bx},${by}`;
        bins.set(key, (bins.get(key) || 0) + 1);
      }

      const maxCount = d3.max([...bins.values()]) || 1;
      const rScale = d3.scaleSqrt().domain([0, maxCount]).range([2, hexRadius * k * 0.4]);

      chartArea.selectAll("circle")
        .data([...bins.entries()])
        .join("circle")
          .attr("cx", ([key]) => zx(+key.split(",")[0]))
          .attr("cy", ([key]) => zy(+key.split(",")[1]))
          .attr("r", ([, count]) => rScale(count))
          .attr("fill", "#4e79a7")
          .attr("opacity", ([, count]) => 0.15 + 0.5 * count / maxCount);

    } else if (k < 6) {
      // Mid: individual points, no labels
      lodLabel.text("points");
      const [xMin, xMax] = zx.domain();
      const [yMin, yMax] = zy.domain();

      chartArea.selectAll("circle")
        .data(data.filter(d => d.x >= xMin && d.x <= xMax && d.y >= yMin && d.y <= yMax))
        .join("circle")
          .attr("cx", d => zx(d.x))
          .attr("cy", d => zy(d.y))
          .attr("r", d => d.r)
          .attr("fill", d => groupColors[d.group])
          .attr("opacity", 0.6);

    } else {
      // Zoomed: points with coordinate labels
      lodLabel.text("labeled");
      const [xMin, xMax] = zx.domain();
      const [yMin, yMax] = zy.domain();
      const visible = data.filter(d => d.x >= xMin && d.x <= xMax && d.y >= yMin && d.y <= yMax);

      chartArea.selectAll("circle")
        .data(visible)
        .join("circle")
          .attr("cx", d => zx(d.x))
          .attr("cy", d => zy(d.y))
          .attr("r", d => d.r + 1)
          .attr("fill", d => groupColors[d.group])
          .attr("opacity", 0.7)
          .attr("stroke", "#fff")
          .attr("stroke-width", 0.5);

      // Show labels for up to 30 visible points
      chartArea.selectAll("text")
        .data(visible.slice(0, 30))
        .join("text")
          .attr("x", d => zx(d.x))
          .attr("y", d => zy(d.y) - d.r - 3)
          .attr("text-anchor", "middle")
          .attr("font-size", "8px")
          .attr("fill", "#666")
          .text(d => `${d.x.toFixed(0)},${d.y.toFixed(0)}`);
    }
  }

  drawLOD(d3.zoomIdentity);

  const zoom = d3.zoom()
    .scaleExtent([1, 20])
    .extent([[margin.left, margin.top], [w - margin.right, h - margin.bottom]])
    .translateExtent([[margin.left, margin.top], [w - margin.right, h - margin.bottom]])
    .on("zoom", (event) => drawLOD(event.transform));

  svg.call(zoom);

  d3.select("#lod-in").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1.5));
  d3.select("#lod-out").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.5));
  d3.select("#lod-reset").on("click", () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity));
}
</script>
</body>
</html>
