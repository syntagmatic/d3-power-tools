<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Org budget and headcount sunburst</title>
<style>
  html, body { margin: 0; height: 100%; background: #f7f6f2; color: #23262b;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: flex; height: 100vh; align-items: center; justify-content: center; gap: 24px; padding: 0 24px; box-sizing: border-box; }
  #chart { flex: 0 1 auto; height: 96vh; aspect-ratio: 1; max-width: 70vw; }
  svg { width: 100%; height: 100%; display: block; }
  aside { width: 250px; flex: none; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 10px; color: #4b5058; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .legend-row { margin: 3px 0; }
  .node, .headcount { stroke: #f7f6f2; stroke-width: 1; transition: opacity .15s; cursor: pointer; }
  .node.dimmed, .headcount.dimmed { opacity: .2; }
  .node.active, .headcount.active { stroke: #23262b; stroke-width: 1.8; }
  .label { font-size: 11px; fill: #fff; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
  .label.depth-1 { font-weight: 600; font-size: 12px; }
  .label.dimmed { opacity: .25; }
  .ring-caption { font-size: 10px; fill: #6a7078; text-anchor: middle; }
  .center-text { text-anchor: middle; fill: #23262b; }
  #tooltip { position: fixed; pointer-events: none; background: #23262b; color: #fff; padding: 6px 9px;
    border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity .1s; white-space: nowrap; z-index: 5; }
  #tooltip b { display: block; margin-bottom: 2px; }
  #tooltip.visible { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="chart"></div>
  <aside>
    <h1>Org budget and headcount</h1>
    <p>Inner rings (division, department, team): angle is budget_k. Outer ring: each team's radial length is its headcount relative to the largest team in its division.</p>
    <p>A long outer arc under a narrow inner arc means many people on a small budget share.</p>
    <div id="legend"></div>
  </aside>
</div>
<div id="tooltip"></div>
<script src="d3.v7.min.js"></script>
<script type="module">
const rows = await d3.json('data/org-budget.json');

const divColors = { Engineering: '#2f6f9f', Product: '#8a5aa8', Sales: '#c2662d', Operations: '#3f8a6a' };
const divisions = [...new Set(rows.map(d => d.division))];
const color = d3.scaleOrdinal().domain(divisions).range(divisions.map(d => divColors[d] || '#777777'));

// Build division -> department -> team hierarchy
const tree = {
  name: 'Org',
  children: Array.from(d3.group(rows, d => d.division), ([division, dv]) => ({
    name: division,
    children: Array.from(d3.group(dv, d => d.department), ([department, dp]) => ({
      name: department,
      children: dp.map(r => ({ name: r.team, headcount: r.headcount, budget_k: r.budget_k, value: r.budget_k }))
    }))
  }))
};
const root = d3.hierarchy(tree).sum(d => d.value || 0);
d3.partition().size([2 * Math.PI, 1])(root);

// headcount normalised within each division
const maxHc = new Map(root.children.map(div => [div.data.name, d3.max(div.leaves(), l => l.data.headcount)]));
root.each(n => {
  n.hc = d3.sum(n.leaves(), l => l.data.headcount);
  n.bud = n.value;
  n.division = n.depth ? n.ancestors().find(a => a.depth === 1).data.name : null;
});

const size = 800, R = size / 2 - 14;
const r0 = 62, ringW = 88, gap = 0;
const ringIn = d => r0 + (d - 1) * ringW;          // depth 1..3
const outerIn = ringIn(4);
const outerBand = R - outerIn;

const svg = d3.select('#chart').append('svg').attr('viewBox', `${-size/2} ${-size/2} ${size} ${size}`);
const g = svg.append('g');

const arc = d3.arc().startAngle(d => d.x0).endAngle(d => d.x1).padAngle(0.004).padRadius(200)
  .innerRadius(d => ringIn(d.depth)).outerRadius(d => ringIn(d.depth) + ringW - 1);
const outerArc = d3.arc().startAngle(d => d.x0).endAngle(d => d.x1).padAngle(0.004).padRadius(200)
  .innerRadius(outerIn + 2)
  .outerRadius(d => outerIn + 2 + (outerBand - 2) * d.data.headcount / maxHc.get(d.division));

const shade = (d) => {
  const base = d3.color(color(d.division));
  return (d.depth === 1 ? base : d.depth === 2 ? base.brighter(0.5) : base.brighter(1.1)).formatHex();
};

const nodes = root.descendants().filter(d => d.depth > 0);
const leaves = root.leaves();

g.selectAll('path.node').data(nodes).join('path')
  .attr('class', d => `node depth-${d.depth}${d.depth === 3 ? ' leaf' : ''}`)
  .attr('d', arc)
  .attr('fill', shade);

g.selectAll('path.headcount').data(leaves).join('path')
  .attr('class', 'headcount leaf-headcount')
  .attr('d', outerArc)
  .attr('fill', d => d3.color(color(d.division)).darker(0.4).formatHex())
  .attr('fill-opacity', 0.85);

// faint guide at the full-band radius
g.append('circle').attr('r', R).attr('fill', 'none').attr('stroke', '#c9c6bc').attr('stroke-dasharray', '2 4');

// labels for depth 1 and 2 when angle span > 15deg
const spanDeg = d => (d.x1 - d.x0) * 180 / Math.PI;
const labelNodes = nodes.filter(d => d.depth <= 2 && spanDeg(d) > 15);
const truncate = (s, n) => s.length > n ? s.slice(0, Math.max(1, n - 1)) + '…' : s;
g.selectAll('text.label').data(labelNodes).join('text')
  .attr('class', d => `label depth-${d.depth}`)
  .attr('transform', d => {
    const a = (d.x0 + d.x1) / 2 * 180 / Math.PI;
    const r = ringIn(d.depth) + ringW / 2;
    return `rotate(${a - 90}) translate(${r},0) rotate(${a < 180 ? 0 : 180})`;
  })
  .text(d => truncate(d.data.name, 12));

g.append('text').attr('class', 'center-text').attr('y', -4).style('font-size', '13px').style('font-weight', 600).text(`$${d3.format(',')(root.value)}k`);
g.append('text').attr('class', 'center-text').attr('y', 12).style('font-size', '11px').text(`${root.hc} people`);

// legend
d3.select('#legend').selectAll('div').data(divisions).join('div').attr('class', 'legend-row')
  .html(d => `<span class="swatch" style="background:${color(d)}"></span>${d}`);

// interaction
const tip = d3.select('#tooltip');
const fmt = d3.format(',');
const nodeSel = g.selectAll('path.node');
const hcSel = g.selectAll('path.headcount');
const labelSel = g.selectAll('text.label');

const show = (event, d) => {
  const chain = new Set(d.ancestors());
  const inChain = n => chain.has(n);
  nodeSel.classed('active', n => inChain(n) && n.depth > 0).classed('dimmed', n => !inChain(n));
  hcSel.classed('active', n => n === d).classed('dimmed', n => n !== d);
  labelSel.classed('dimmed', n => !inChain(n));
  const leaf = !d.children;
  const title = leaf ? `${d.data.name} (${d.parent.data.name}, ${d.division})` : d.data.name;
  tip.html(`<b>${title}</b>Headcount: ${fmt(d.hc)}<br>Budget: $${fmt(d.bud)}k`)
    .classed('visible', true);
  move(event);
};
const move = event => {
  const w = tip.node().offsetWidth, h = tip.node().offsetHeight;
  let x = event.clientX + 14, y = event.clientY + 14;
  if (x + w > innerWidth - 4) x = event.clientX - w - 14;
  if (y + h > innerHeight - 4) y = event.clientY - h - 14;
  tip.style('left', x + 'px').style('top', y + 'px');
};
const hide = () => {
  nodeSel.classed('active dimmed', false);
  hcSel.classed('active dimmed', false);
  labelSel.classed('dimmed', false);
  tip.classed('visible', false);
};

nodeSel.on('mouseenter', show).on('mousemove', move).on('mouseleave', hide);
hcSel.on('mouseenter', show).on('mousemove', move).on('mouseleave', hide);
</script>
</body>
</html>
