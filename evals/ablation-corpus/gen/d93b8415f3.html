<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>US States Economic Index</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #f7f6f2; color: #1f2933;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  #app { position: relative; width: 100vw; height: 100vh; }
  svg { display: block; width: 100%; height: 100%; }
  .title { font-size: 18px; font-weight: 600; fill: #1f2933; }
  .subtitle { font-size: 12px; fill: #5f6b76; }
  .state { stroke: #ffffff; stroke-width: 0.8; stroke-linejoin: round; cursor: pointer;
    transition: opacity 120ms; }
  .state.dimmed { opacity: 0.55; }
  .state.highlight { stroke: #111827; stroke-width: 2.5; opacity: 1; }
  .legend-bar { stroke: #9aa5b1; stroke-width: 0.5; }
  .legend-tick line, .legend-tick path { stroke: #5f6b76; }
  .legend-tick text { fill: #3e4c59; font-size: 11px; }
  .legend-label { font-size: 12px; fill: #3e4c59; }
  .legend-marker { stroke: #111827; stroke-width: 2; fill: none; opacity: 0; }
  .legend-marker.active { opacity: 1; }
  .tooltip { position: absolute; pointer-events: none; background: #111827; color: #f9fafb;
    padding: 8px 10px; border-radius: 4px; font-size: 12px; line-height: 1.45;
    opacity: 0; transition: opacity 100ms; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .tooltip.active { opacity: 1; }
  .tooltip .tt-name { font-weight: 600; font-size: 13px; }
  .tooltip .tt-swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px;
    border: 1px solid #f9fafb; vertical-align: -1px; }
</style>
</head>
<body>
<div id="app">
  <svg id="map" role="img" aria-label="Choropleth of US states by economic index"></svg>
  <div class="tooltip" id="tooltip"></div>
</div>
<script src="d3.v7.min.js"></script>
<script>
(async () => {
  const geo = await d3.json('data/us-states.json');

  // d3 expects clockwise exterior rings; rewind any ring that encloses more than a hemisphere.
  const rewind = f => {
    if (d3.geoArea(f) > 2 * Math.PI) {
      const g = f.geometry;
      const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
      polys.forEach(p => p.forEach(r => r.reverse()));
    }
  };
  geo.features.forEach(rewind);

  const [lo, hi] = d3.extent(geo.features, d => d.properties.economic_index);
  const color = d3.scaleSequential(d3.interpolateYlGnBu).domain([lo, hi]);
  const fill = v => color(v);
  const fmt = d3.format('.0f');

  const svg = d3.select('#map');
  const tooltip = d3.select('#tooltip');
  const gMap = svg.append('g').attr('class', 'map-layer');
  const gLegend = svg.append('g').attr('class', 'legend');
  const title = svg.append('text').attr('class', 'title').attr('x', 24).attr('y', 32).text('Economic index by state');
  const sub = svg.append('text').attr('class', 'subtitle').attr('x', 24).attr('y', 50)
    .text('Synthetic data, 0-100 scale. Hover a state for details.');

  const projection = d3.geoAlbersUsa();
  const path = d3.geoPath(projection);

  // Draw large states first so small ones stay hoverable on top.
  const features = geo.features.slice().sort((a, b) => d3.geoArea(b) - d3.geoArea(a));

  const states = gMap.selectAll('path.state')
    .data(features, d => d.properties.abbr)
    .join('path')
    .attr('class', 'state')
    .attr('fill', d => fill(d.properties.economic_index));

  // Legend gradient
  const defs = svg.append('defs');
  const grad = defs.append('linearGradient').attr('id', 'legend-gradient');
  d3.range(0, 1.001, 0.1).forEach(t => {
    grad.append('stop').attr('offset', `${t * 100}%`).attr('stop-color', color(lo + t * (hi - lo)));
  });
  const legendScale = d3.scaleLinear().domain([lo, hi]);
  const legendBar = gLegend.append('rect').attr('class', 'legend-bar').attr('height', 12).attr('fill', 'url(#legend-gradient)');
  const legendAxis = gLegend.append('g').attr('class', 'legend-tick');
  const legendLabel = gLegend.append('text').attr('class', 'legend-label').text('Economic index');
  const marker = gLegend.append('rect').attr('class', 'legend-marker').attr('y', -2).attr('width', 4).attr('height', 16);

  const layout = () => {
    const w = window.innerWidth, h = window.innerHeight;
    const top = 64, bottom = 64;
    projection.fitExtent([[20, top], [w - 20, h - bottom]], { type: 'FeatureCollection', features: geo.features });
    states.attr('d', path);

    const lw = Math.min(320, w - 48);
    legendScale.range([0, lw]);
    gLegend.attr('transform', `translate(${(w - lw) / 2},${h - 46})`);
    legendBar.attr('width', lw);
    legendLabel.attr('x', lw / 2).attr('y', -8).attr('text-anchor', 'middle');
    legendAxis.attr('transform', 'translate(0,12)')
      .call(d3.axisBottom(legendScale).ticks(6).tickSize(4).tickFormat(fmt))
      .call(g => g.select('.domain').remove());
  };
  layout();
  window.addEventListener('resize', layout);

  const placeTooltip = event => {
    const [x, y] = d3.pointer(event, document.getElementById('app'));
    const node = tooltip.node();
    const tw = node.offsetWidth, th = node.offsetHeight;
    const w = window.innerWidth, h = window.innerHeight;
    let left = x + 14, top = y + 14;
    if (left + tw > w - 8) left = x - tw - 14;
    if (top + th > h - 8) top = y - th - 14;
    tooltip.style('left', `${Math.max(8, left)}px`).style('top', `${Math.max(8, top)}px`);
  };

  states
    .on('mouseenter', function (event, d) {
      const p = d.properties;
      states.classed('dimmed', s => s !== d).classed('highlight', s => s === d);
      d3.select(this).raise();
      tooltip.html(
        `<div class="tt-name"><span class="tt-swatch" style="background:${fill(p.economic_index)}"></span>${p.name} (${p.abbr})</div>` +
        `<div>Economic index: <b>${p.economic_index}</b></div>`
      ).classed('active', true);
      marker.attr('x', legendScale(p.economic_index) - 2).classed('active', true);
      placeTooltip(event);
    })
    .on('mousemove', placeTooltip)
    .on('mouseleave', () => {
      states.classed('dimmed', false).classed('highlight', false);
      tooltip.classed('active', false);
      marker.classed('active', false);
    });
})();
</script>
</body>
</html>
