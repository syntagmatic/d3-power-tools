<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cities: parallel coordinates and summary table</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="d3.v7.min.js"></script>
<style>
  :root { --ink:#1f2933; --mute:#6b7785; --rule:#d9dee4; --bg:#fafbfc; --accent:#0b5fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 12px/1.35 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 18px; padding: 8px 16px; border-bottom: 1px solid var(--rule); background: #fff; }
  header h1 { font-size: 14px; margin: 0; font-weight: 650; }
  .count-badge { background: var(--ink); color: #fff; border-radius: 12px; padding: 2px 11px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .count-badge.empty { background: #b42318; }
  .count-badge .total { opacity: .6; font-weight: 400; }
  .legend { display: flex; gap: 12px; margin-left: auto; }
  .legend-item { display: flex; align-items: center; gap: 5px; cursor: default; color: var(--mute); }
  .legend-item.active { color: var(--ink); font-weight: 600; }
  .legend-item.dimmed { opacity: .45; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  button.reset { font: inherit; padding: 3px 10px; border: 1px solid var(--rule); background: #fff; border-radius: 4px; cursor: pointer; }
  button.reset:hover { border-color: var(--accent); color: var(--accent); }
  button.reset:disabled { opacity: .4; cursor: default; }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 8px 12px 10px; }
  .panel { background: #fff; border: 1px solid var(--rule); border-radius: 6px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 0; padding: 7px 12px 0; font-weight: 600; }
  #pc-panel { flex: 1 1 58%; }
  #table-panel { flex: 0 0 auto; width: 500px; }
  #pc-wrap { flex: 1; min-height: 0; position: relative; }
  #pc-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* parallel coordinates */
  .line { fill: none; stroke-width: 1.2; stroke-opacity: .5; transition: stroke-opacity .12s; }
  .line.dimmed { stroke: #c5cbd3 !important; stroke-opacity: .28; stroke-width: 1; }
  .line.active { stroke-opacity: .9; stroke-width: 1.8; }
  .line.highlight { stroke-opacity: 1; stroke-width: 3; }
  .axis-title { font-size: 11px; font-weight: 650; text-anchor: middle; fill: var(--ink); }
  .axis-title.active { fill: var(--accent); }
  .axis .domain { stroke: #8a95a3; }
  .axis .tick text { fill: var(--mute); font-size: 10px; }
  .axis .tick line { stroke: #8a95a3; }
  .brush .selection { fill: var(--accent); fill-opacity: .14; stroke: var(--accent); stroke-width: 1.2; }
  .city-label { font-size: 10.5px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
  .city-label.dimmed { opacity: .5; }
  .city-label.highlight { font-size: 12px; }
  .end-dot { stroke: #fff; stroke-width: 1; }
  /* table */
  table { border-collapse: collapse; width: 100%; }
  th { text-align: right; font-size: 10.5px; color: var(--mute); font-weight: 600; padding: 7px 6px 4px; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; padding-left: 12px; }
  th.spark-head { text-align: left; }
  td { padding: 0 6px; border-bottom: 1px solid #eef1f4; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  td.spark-cell { text-align: left; padding: 3px 10px 3px 6px; }
  tr.axis-row.active td { background: #f0f5ff; }
  tr.axis-row.active td.axis-name { color: var(--accent); }
  td.axis-name { font-weight: 650; }
  td.stat.empty { color: #b8c0ca; }
  td.stat.median { font-weight: 650; }
  .spark-bg { fill: #e3e7ec; }
  .spark-bar { fill: #3b5b8c; }
  .spark-rug { stroke: #3b5b8c; stroke-width: 1; opacity: .7; }
  .spark-median { stroke: #d9480f; stroke-width: 2; }
  .spark-base { stroke: #b8c0ca; }
  .spark-axis text { font-size: 9px; fill: var(--mute); }
  .spark-axis path, .spark-axis line { stroke: #b8c0ca; }
  .table-note { padding: 6px 12px 8px; color: var(--mute); font-size: 10.5px; }
  #city-list { padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 4px; }
  .city-chip { border: 1px solid var(--rule); border-radius: 10px; padding: 1px 8px; font-size: 10.5px; display: flex; align-items: center; gap: 4px; }
  .city-chip.highlight { border-color: var(--ink); background: #f3f5f7; }
  .city-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  #tip { position: fixed; pointer-events: none; background: #1f2933; color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 11px; opacity: 0; z-index: 10; }
  #tip.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <h1>150 synthetic cities</h1>
  <span class="count-badge" id="badge"><span class="n">150</span> <span class="total">of 150 cities</span></span>
  <button class="reset" id="reset" disabled>Clear brushes</button>
  <div class="legend" id="legend"></div>
</header>
<main>
  <section class="panel" id="pc-panel">
    <h2>Axes: drag on any axis to brush (combine several)</h2>
    <div id="pc-wrap"></div>
  </section>
  <section class="panel" id="table-panel">
    <h2>Brushed subset: drag across a distribution to brush</h2>
    <table>
      <thead><tr><th>Axis</th><th>Min</th><th>Median</th><th>Max</th><th class="spark-head">Distribution</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="table-note">Grey: all cities. Blue bars: brushed subset (scaled to its own peak). Ticks: each brushed city. Orange: median.</div>
    <div id="city-list"></div>
  </section>
</main>
<div id="tip"></div>
<script type="module">
const data = await d3.json('data/cities-synthetic.json');

const keys = ['population', 'temp', 'elevation', 'rainfall', 'gdp', 'density'];
const labels = { population: 'Population', temp: 'Temp (°C)', elevation: 'Elevation (m)', rainfall: 'Rainfall (mm)', gdp: 'GDP', density: 'Density (/km²)' };
const fmt = {
  population: d3.format(',.0f'), temp: d3.format('.1f'), elevation: d3.format(',.0f'),
  rainfall: d3.format(',.0f'), gdp: d3.format(',.0f'), density: d3.format(',.0f')
};
const tickFmt = { population: d3.format('.2s'), temp: d3.format('.0f'), elevation: d3.format('.0f'), rainfall: d3.format('.0f'), gdp: d3.format('.2s'), density: d3.format('.0f') };

const regions = [...new Set(data.map(d => d.region))].sort();
const palette = ['#1f77b4', '#d95f02', '#2a9d5c', '#c2185b', '#7b5cc4', '#8c6d1f'];
const color = d3.scaleOrdinal(regions, palette);

const domains = Object.fromEntries(keys.map(k => [k, d3.extent(data, d => d[k])]));
const nice = Object.fromEntries(keys.map(k => [k, d3.scaleLinear().domain(domains[k]).nice().domain()]));

// shared state: value-space extent per axis, or null
const extents = Object.fromEntries(keys.map(k => [k, null]));
let hoverCity = null, hoverRegion = null;
const passes = d => keys.every(k => !extents[k] || (d[k] >= extents[k][0] && d[k] <= extents[k][1]));
let subset = data;

const tip = d3.select('#tip');

/* ---------- header ---------- */
const legend = d3.select('#legend').selectAll('.legend-item').data(regions).join('div').attr('class', 'legend-item')
  .on('mouseenter', (e, r) => { hoverRegion = r; refreshHover(); })
  .on('mouseleave', () => { hoverRegion = null; refreshHover(); });
legend.append('span').attr('class', 'swatch').style('background', r => color(r));
legend.append('span').attr('class', 'legend-label').text(r => r);

d3.select('#reset').on('click', () => {
  keys.forEach(k => extents[k] = null);
  update(null);
});

/* ---------- parallel coordinates ---------- */
const wrap = d3.select('#pc-wrap');
const svg = wrap.append('svg');
const root = svg.append('g');
const lineGen = d3.line();
let x, ys = {}, H = 0, W = 0;
const axisBrushes = {};
const axisBrushG = {};
const M = { top: 34, right: 96, bottom: 26, left: 44 };

function buildPC() {
  const box = wrap.node().getBoundingClientRect();
  W = box.width; H = box.height;
  root.selectAll('*').remove();
  root.attr('transform', `translate(${M.left},${M.top})`);
  const iw = W - M.left - M.right, ih = H - M.top - M.bottom;
  x = d3.scalePoint(keys, [0, iw]);
  keys.forEach(k => ys[k] = d3.scaleLinear(nice[k], [ih, 0]));

  const lineLayer = root.append('g').attr('class', 'lines');
  lineLayer.selectAll('.line').data(data, d => d.city).join('path')
    .attr('class', 'line')
    .attr('stroke', d => color(d.region))
    .attr('d', d => lineGen(keys.map(k => [x(k), ys[k](d[k])])))
    .on('mouseenter', (e, d) => { hoverCity = d.city; refreshHover(); showTip(e, d); })
    .on('mousemove', (e, d) => showTip(e, d))
    .on('mouseleave', () => { hoverCity = null; refreshHover(); tip.classed('show', false); });

  const labelLayer = root.append('g').attr('class', 'labels');
  labelLayer.attr('transform', `translate(${iw},0)`);

  const axes = root.selectAll('.axis-group').data(keys).join('g')
    .attr('class', 'axis-group').attr('transform', k => `translate(${x(k)},0)`);
  axes.append('g').attr('class', 'axis').each(function (k) { d3.select(this).call(d3.axisLeft(ys[k]).ticks(6).tickFormat(tickFmt[k])); });
  axes.append('text').attr('class', 'axis-title').attr('y', -14).text(k => labels[k]);
  axes.append('g').attr('class', 'brush').each(function (k) {
    axisBrushG[k] = d3.select(this);
    axisBrushes[k] = d3.brushY().extent([[-11, 0], [11, ih]])
      .on('start brush end', e => {
        if (!e.sourceEvent) return;
        extents[k] = e.selection ? [ys[k].invert(e.selection[1]), ys[k].invert(e.selection[0])] : null;
        update({ view: 'axis', key: k });
      });
    d3.select(this).call(axisBrushes[k]);
  });
  syncBrushes(null);
  paint();
}

function showTip(e, d) {
  tip.html(`<b>${d.city}</b> · ${d.region}<br>` + keys.map(k => `${labels[k]}: ${fmt[k](d[k])}`).join('<br>'))
    .style('left', (e.clientX + 14) + 'px').style('top', (e.clientY + 14) + 'px').classed('show', true);
}

/* ---------- table ---------- */
const SW = 210, SH = 40, SP = { l: 4, r: 4, t: 3, b: 12 };
const sx = {}, tableBrushes = {}, tableBrushG = {};
const NB = 24;
const hists = {};
keys.forEach(k => {
  sx[k] = d3.scaleLinear(nice[k], [SP.l, SW - SP.r]);
  hists[k] = d3.bin().domain(nice[k]).thresholds(d3.range(1, NB).map(i => nice[k][0] + (nice[k][1] - nice[k][0]) * i / NB)).value(d => d[k]);
});
const fullBins = Object.fromEntries(keys.map(k => [k, hists[k](data)]));

const rows = d3.select('#tbody').selectAll('.axis-row').data(keys).join('tr').attr('class', 'axis-row');
rows.append('td').attr('class', 'axis-name').text(k => labels[k]);
['min', 'median', 'max'].forEach(s => rows.append('td').attr('class', `stat ${s}`));
const sparkCells = rows.append('td').attr('class', 'spark-cell');
sparkCells.each(function (k) {
  const s = d3.select(this).append('svg').attr('width', SW).attr('height', SH);
  const base = SH - SP.b;
  const y = d3.scaleLinear([0, d3.max(fullBins[k], b => b.length)], [base, SP.t]);
  const bw = b => Math.max(1, sx[k](b.x1) - sx[k](b.x0) - 1);
  s.append('g').attr('class', 'spark-bgs').selectAll('.spark-bg').data(fullBins[k]).join('rect')
    .attr('class', 'spark-bg').attr('x', b => sx[k](b.x0)).attr('width', bw)
    .attr('y', b => y(b.length)).attr('height', b => base - y(b.length));
  s.append('g').attr('class', 'spark-bars');
  s.append('line').attr('class', 'spark-base').attr('x1', SP.l).attr('x2', SW - SP.r).attr('y1', base).attr('y2', base);
  s.append('g').attr('class', 'spark-rugs');
  s.append('line').attr('class', 'spark-median').attr('y1', SP.t).attr('y2', base + 4).style('display', 'none');
  s.append('g').attr('class', 'spark-axis').attr('transform', `translate(0,${base + 4})`)
    .call(d3.axisBottom(sx[k]).tickValues(nice[k]).tickSize(2).tickFormat(tickFmt[k]))
    .call(g => g.select('.domain').remove())
    .call(g => g.selectAll('text').attr('text-anchor', (d, i) => i ? 'end' : 'start').attr('dy', '0.9em'));
  tableBrushes[k] = d3.brushX().extent([[SP.l, 0], [SW - SP.r, base + 2]])
    .on('start brush end', e => {
      if (!e.sourceEvent) return;
      extents[k] = e.selection ? [sx[k].invert(e.selection[0]), sx[k].invert(e.selection[1])] : null;
      update({ view: 'table', key: k });
    });
  tableBrushG[k] = s.append('g').attr('class', 'brush').call(tableBrushes[k]);
});

/* ---------- update / sync ---------- */
function syncBrushes(src) {
  keys.forEach(k => {
    const e = extents[k];
    if (!(src && src.view === 'axis' && src.key === k) && axisBrushG[k])
      axisBrushG[k].call(axisBrushes[k].move, e ? [ys[k](e[1]), ys[k](e[0])] : null);
    if (!(src && src.view === 'table' && src.key === k))
      tableBrushG[k].call(tableBrushes[k].move, e ? [sx[k](e[0]), sx[k](e[1])] : null);
  });
}

function update(src) {
  subset = data.filter(passes);
  if (!src || true) syncBrushes(src);
  paint();
}

function paint() {
  const n = subset.length;
  const any = keys.some(k => extents[k]);
  d3.select('#badge').classed('empty', n === 0).html(`<span class="n">${n}</span> <span class="total">of ${data.length} cities</span>`);
  d3.select('#reset').property('disabled', !any);

  const inSet = new Set(subset.map(d => d.city));
  root.selectAll('.line')
    .classed('dimmed', d => any && !inSet.has(d.city))
    .classed('active', d => any && inSet.has(d.city));
  root.selectAll('.axis-title').classed('active', k => !!extents[k]);
  rows.classed('active', k => !!extents[k]);

  // city labels at the right edge when few pass
  const iw = W - M.left - M.right;
  const lastK = keys[keys.length - 1];
  let lab = n <= 8 && n > 0 && any ? subset.slice().sort((a, b) => a[lastK] - b[lastK]) : [];
  const ly = lab.map(d => ys[lastK](d[lastK]));
  // nudge apart, top to bottom
  const pos = ly.map((v, i) => v);
  const order = d3.range(lab.length).sort((a, b) => pos[a] - pos[b]);
  for (let i = 1; i < order.length; i++) pos[order[i]] = Math.max(pos[order[i]], pos[order[i - 1]] + 13);
  root.select('.labels').selectAll('.label-group').data(lab, d => d.city).join(
    enter => {
      const g = enter.append('g').attr('class', 'label-group');
      g.append('circle').attr('class', 'end-dot').attr('r', 3.5);
      g.append('text').attr('class', 'city-label').attr('x', 10).attr('dy', '0.32em');
      return g;
    })
    .each(function (d, i) {
      const g = d3.select(this);
      g.select('.end-dot').attr('cy', ly[i]).attr('fill', color(d.region));
      g.select('text').attr('y', pos[i]).attr('fill', color(d.region)).text(`${d.city} · ${d.region}`);
    });

  // table stats and sparklines
  rows.each(function (k) {
    const r = d3.select(this);
    const vals = subset.map(d => d[k]).sort(d3.ascending);
    const has = vals.length > 0;
    const stat = { min: vals[0], median: d3.median(vals), max: vals[vals.length - 1] };
    ['min', 'median', 'max'].forEach(s => r.select(`.stat.${s}`).classed('empty', !has).text(has ? fmt[k](stat[s]) : '—'));

    const s = r.select('svg');
    const base = SH - SP.b;
    const sb = hists[k](subset);
    const y = d3.scaleLinear([0, Math.max(1, d3.max(sb, b => b.length))], [base, SP.t]);
    s.select('.spark-bars').selectAll('.spark-bar').data(sb.filter(b => b.length), b => b.x0).join('rect')
      .attr('class', 'spark-bar')
      .attr('x', b => sx[k](b.x0)).attr('width', b => Math.max(1, sx[k](b.x1) - sx[k](b.x0) - 1))
      .attr('y', b => y(b.length)).attr('height', b => base - y(b.length));
    s.select('.spark-rugs').selectAll('.spark-rug').data(subset, d => d.city).join('line')
      .attr('class', 'spark-rug').attr('y1', base - 3).attr('y2', base + 1)
      .attr('x1', d => sx[k](d[k])).attr('x2', d => sx[k](d[k]));
    s.select('.spark-median').style('display', has ? null : 'none').attr('x1', has ? sx[k](stat.median) : 0).attr('x2', has ? sx[k](stat.median) : 0);
  });

  // chips for small subsets
  const chips = n <= 8 ? subset : [];
  d3.select('#city-list').selectAll('.city-chip').data(chips, d => d.city).join(
    enter => {
      const c = enter.append('div').attr('class', 'city-chip')
        .on('mouseenter', (e, d) => { hoverCity = d.city; refreshHover(); })
        .on('mouseleave', () => { hoverCity = null; refreshHover(); });
      c.append('span').attr('class', 'dot').style('background', d => color(d.region));
      c.append('span').attr('class', 'chip-label').text(d => `${d.city} · ${d.region}`);
      return c;
    });
  refreshHover();
}

function refreshHover() {
  root.selectAll('.line')
    .classed('highlight', d => d.city === hoverCity)
    .style('display', null);
  if (hoverCity) root.selectAll('.line').filter(d => d.city === hoverCity).raise();
  root.selectAll('.line').classed('region-dim', false);
  if (hoverRegion) {
    root.selectAll('.line').classed('highlight', d => d.region === hoverRegion && (subset.includes(d) || subset.length === data.length));
  }
  legend.classed('active', r => r === hoverRegion).classed('dimmed', r => hoverRegion && r !== hoverRegion);
  root.selectAll('.label-group text').classed('highlight', d => d.city === hoverCity);
  d3.selectAll('.city-chip').classed('highlight', d => d.city === hoverCity);
}

buildPC();
update(null);
new ResizeObserver(() => { const b = wrap.node().getBoundingClientRect(); if (b.width !== W || b.height !== H) { buildPC(); } }).observe(wrap.node());
</script>
</body>
</html>
