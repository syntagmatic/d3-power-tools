<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Salary Distribution by Job Category</title>
<style>
  html, body { margin: 0; height: 100%; background: #fafaf7; color: #222; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; padding: 10px 16px; box-sizing: border-box; }
  h1 { font-size: 17px; margin: 0 0 2px; font-weight: 600; }
  .subtitle { font-size: 12px; color: #666; margin-bottom: 8px; }
  #filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .filter-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--c); background: #fff; color: #222; border-radius: 14px; padding: 3px 11px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .filter-btn .swatch { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .filter-btn.active { background: var(--c); color: #fff; }
  .filter-btn.active .swatch { background: #fff; }
  .filter-btn.dimmed { opacity: 0.6; }
  #chart { flex: 1; min-height: 0; }
  svg { width: 100%; height: 100%; display: block; }
  .band-label { font-size: 12px; font-weight: 600; }
  .band-line { stroke: #e4e2dc; stroke-dasharray: 2 3; }
  .band-line.dimmed, .band-label.dimmed { opacity: 0.25; }
  .axis text { font-size: 11px; fill: #555; }
  .axis path, .axis line { stroke: #999; }
  .grid line { stroke: #ececE6; }
  .grid path { display: none; }
  .axis-title { font-size: 11px; fill: #555; }
  .dot { stroke: #fff; stroke-width: 0.8; fill-opacity: 0.85; cursor: pointer; }
  .dot.highlight { stroke: #111; stroke-width: 2.2; fill-opacity: 1; }
  .dot.dimmed { fill-opacity: 0.25; }
  .tooltip { position: fixed; pointer-events: none; background: #1f1f1f; color: #fff; padding: 6px 9px; border-radius: 4px; font-size: 12px; line-height: 1.45; opacity: 0; transition: opacity 0.12s; z-index: 10; white-space: nowrap; }
  .tooltip.visible { opacity: 1; }
  .tooltip b { font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <h1>Salary distribution by job category</h1>
  <div class="subtitle">300 employees. Each circle is one person, positioned by annual salary. Toggle categories below; hover a circle for details.</div>
  <div id="filters"></div>
  <div id="chart"></div>
</div>
<div class="tooltip" id="tooltip"></div>
<script src="d3.v7.min.js"></script>
<script type="module">
const categories = ["Engineer", "Designer", "Manager", "Analyst", "Sales", "Support"];
const colors = { Engineer: "#2f6db5", Designer: "#c0479a", Manager: "#d9822b", Analyst: "#2a9d8f", Sales: "#7a5cc0", Support: "#8a8a3a" };

const data = await d3.json("data/job-salaries.json");
const active = new Set(categories);
const tooltip = d3.select("#tooltip");
const r = 4.6;

const margin = { top: 8, right: 24, bottom: 38, left: 86 };
const svg = d3.select("#chart").append("svg");
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
const gridG = g.append("g").attr("class", "grid");
const bandG = g.append("g").attr("class", "bands");
const dotG = g.append("g").attr("class", "dots");
const axisG = g.append("g").attr("class", "axis");
const axisTitle = g.append("text").attr("class", "axis-title").attr("text-anchor", "middle").text("Annual salary ($ thousands)");

const x = d3.scaleLinear().domain(d3.extent(data, d => d.salary_k)).nice();
const y = d3.scaleBand().domain(categories).padding(0.05);

const dots = dotG.selectAll("circle.dot").data(data, d => d.id).join("circle")
  .attr("class", "dot")
  .attr("r", r)
  .attr("fill", d => colors[d.category])
  .on("mouseenter", (event, d) => {
    d3.select(event.currentTarget).classed("highlight", true).raise();
    dots.classed("dimmed", o => o.category !== d.category);
    tooltip.html(`<b>${d.category}</b><br>Salary: $${d.salary_k}k<br>Experience: ${d.years_exp} yr${d.years_exp === 1 ? "" : "s"}`).classed("visible", true);
    move(event);
  })
  .on("mousemove", move)
  .on("mouseleave", (event) => {
    d3.select(event.currentTarget).classed("highlight", false);
    dots.classed("dimmed", false);
    tooltip.classed("visible", false);
  });

function move(event) {
  const w = tooltip.node().offsetWidth;
  let left = event.clientX + 14;
  if (left + w > window.innerWidth - 4) left = event.clientX - w - 14;
  tooltip.style("left", left + "px").style("top", (event.clientY - 48) + "px");
}

const bandLines = bandG.selectAll("line.band-line").data(categories).join("line").attr("class", "band-line");
const bandLabels = bandG.selectAll("text.band-label").data(categories).join("text")
  .attr("class", "band-label").attr("text-anchor", "end").attr("dy", "0.35em")
  .attr("fill", d => colors[d]).text(d => d);

function layout() {
  const box = document.getElementById("chart").getBoundingClientRect();
  const W = box.width, H = box.height;
  const iw = W - margin.left - margin.right, ih = H - margin.top - margin.bottom;
  svg.attr("viewBox", `0 0 ${W} ${H}`);
  x.range([0, iw]);
  y.range([0, ih]);

  gridG.attr("transform", `translate(0,${ih})`).call(d3.axisBottom(x).ticks(10).tickSize(-ih).tickFormat(""));
  axisG.attr("transform", `translate(0,${ih})`).call(d3.axisBottom(x).ticks(10).tickFormat(d => "$" + d + "k"));
  axisTitle.attr("x", iw / 2).attr("y", ih + 32);

  bandLines.attr("x1", 0).attr("x2", iw).attr("y1", d => y(d) + y.bandwidth() / 2).attr("y2", d => y(d) + y.bandwidth() / 2);
  bandLabels.attr("x", -10).attr("y", d => y(d) + y.bandwidth() / 2);

  // beeswarm: fixed x by salary, y pulled to band center, collisions resolved by force simulation
  const nodes = data.map(d => ({ d, x: x(d.salary_k), y: y(d.category) + y.bandwidth() / 2 }));
  const maxOff = y.bandwidth() / 2 - r;
  const sim = d3.forceSimulation(nodes)
    .force("x", d3.forceX(n => x(n.d.salary_k)).strength(1))
    .force("y", d3.forceY(n => y(n.d.category) + y.bandwidth() / 2).strength(0.12))
    .force("collide", d3.forceCollide(r + 0.6).iterations(3))
    .stop();
  for (let i = 0; i < 300; i++) {
    sim.tick();
    nodes.forEach(n => {
      const cy = y(n.d.category) + y.bandwidth() / 2;
      n.y = Math.max(cy - maxOff, Math.min(cy + maxOff, n.y));
    });
  }
  const pos = new Map(nodes.map(n => [n.d.id, n]));
  dots.attr("cx", d => pos.get(d.id).x).attr("cy", d => pos.get(d.id).y);
}

function applyFilter() {
  const t = d3.transition().duration(500).ease(d3.easeCubicInOut);
  dots.filter(d => active.has(d.category)).style("pointer-events", null)
    .transition(t).attr("r", r).style("opacity", 1);
  dots.filter(d => !active.has(d.category)).style("pointer-events", "none")
    .classed("highlight", false)
    .transition(t).attr("r", 0).style("opacity", 0);
  bandLines.classed("dimmed", d => !active.has(d));
  bandLabels.classed("dimmed", d => !active.has(d));
  buttons.classed("active", d => active.has(d)).attr("aria-pressed", d => active.has(d));
}

const buttons = d3.select("#filters").selectAll("button.filter-btn").data(categories).join("button")
  .attr("class", "filter-btn").attr("type", "button")
  .style("--c", d => colors[d])
  .on("click", (event, d) => {
    active.has(d) ? active.delete(d) : active.add(d);
    tooltip.classed("visible", false);
    applyFilter();
  });
buttons.append("span").attr("class", "swatch");
buttons.append("span").text(d => `${d} (${data.filter(o => o.category === d).length})`);

layout();
applyFilter();
dots.interrupt().attr("r", r).style("opacity", 1);
let timer;
window.addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(() => { layout(); }, 100); });
</script>
</body>
</html>
