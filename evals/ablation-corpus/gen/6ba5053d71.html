<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cities: parallel coordinates and summary table</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #fafaf7; --ink: #1f2430; --muted: #6b7280; --rule: #d9d9d2; --panel: #ffffff;
    --accent: #1f2430;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 12px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px 6px; flex: none; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  .badge { display: inline-flex; align-items: baseline; gap: 5px; background: var(--ink); color: #fff;
    border-radius: 14px; padding: 3px 12px; font-variant-numeric: tabular-nums; }
  .badge .count { font-size: 16px; font-weight: 700; }
  .badge.few { background: #b4441a; }
  .badge.none { background: #9ca3af; }
  .readout { color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .readout b { color: var(--ink); }
  button.reset { font: inherit; border: 1px solid var(--rule); background: var(--panel); border-radius: 5px; padding: 3px 10px; cursor: pointer; }
  button.reset:hover { border-color: var(--ink); }
  .legend { display: flex; gap: 12px; padding: 0 18px 4px; flex: none; }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--muted); }
  .legend-item.active { color: var(--ink); font-weight: 600; }
  .legend-item.dimmed { opacity: .4; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; padding: 0 18px 12px; }
  .pane { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; min-height: 0; position: relative; }
  .pane svg { display: block; width: 100%; height: 100%; }
  .pane-title { position: absolute; left: 10px; top: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  .line { fill: none; stroke-width: 1.2; stroke-opacity: .55; transition: stroke-opacity .15s; }
  .line.dimmed { stroke: #c9c9c2 !important; stroke-opacity: .35; stroke-width: .8; }
  .line.active { stroke-opacity: .85; }
  .line.few { stroke-width: 2.4; stroke-opacity: 1; }
  .line.highlight { stroke-width: 3; stroke-opacity: 1; }
  .line.region-dimmed { stroke-opacity: .08; }
  .axis-label { font-size: 11px; font-weight: 650; text-anchor: middle; fill: var(--ink); }
  .axis-unit { font-size: 9.5px; text-anchor: middle; fill: var(--muted); }
  .axis .domain { stroke: #8b8b85; }
  .axis text { font-size: 9.5px; fill: var(--muted); }
  .axis-brush .selection { fill: #1f2430; fill-opacity: .12; stroke: #1f2430; }
  .city-label { font-size: 10px; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 3px; }

  table { border-collapse: collapse; width: 100%; height: 100%; table-layout: fixed; }
  th { text-align: right; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500;
    padding: 24px 6px 4px; border-bottom: 1px solid var(--rule); }
  th.name, td.axis-name { text-align: left; }
  td { padding: 0 6px; border-bottom: 1px solid #eeeee8; text-align: right; font-variant-numeric: tabular-nums; }
  td.axis-name { font-weight: 650; }
  td.axis-name small { display: block; color: var(--muted); font-weight: 400; font-size: 9.5px; }
  td.spark-cell { padding: 0 8px; }
  td.stat.empty { color: #b8b8b0; }
  .spark-svg { width: 100%; height: 44px; overflow: visible; }
  .spark-ghost { fill: #e3e3dc; }
  .spark-bar { fill: #3b5b92; }
  .spark-baseline { stroke: #b8b8b0; }
  .spark-dot { fill: #b4441a; stroke: #fff; stroke-width: 1; }
  .spark-median { stroke: #b4441a; stroke-width: 1.5; }
  .spark-brush .selection { fill: #1f2430; fill-opacity: .12; stroke: #1f2430; }
  tr.row-filtered td.axis-name { color: #b4441a; }
  .tip { position: fixed; pointer-events: none; background: #1f2430; color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 11px; opacity: 0; z-index: 5; white-space: nowrap; }
  .tip.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>150 synthetic cities</h1>
  <span class="badge" id="badge"><span class="count">150</span><span class="of">of 150 cities</span></span>
  <span class="readout" id="readout"></span>
  <button class="reset" id="reset">Clear brushes</button>
</header>
<div class="legend" id="legend"></div>
<main>
  <section class="pane" id="pc-pane"><span class="pane-title">Axes: drag on an axis to brush</span><svg id="pc"></svg></section>
  <section class="pane" id="table-pane"><span class="pane-title">Brushed subset: drag on a sparkline to brush</span>
    <table id="summary"></table>
  </section>
</main>
<div class="tip" id="tip"></div>

<script src="d3.v7.min.js"></script>
<script>
(async () => {
  const data = await d3.json('data/cities-synthetic.json');

  const AXES = [
    { key: 'population', label: 'Population', unit: 'people', log: true,  fmt: d3.format('.3~s') },
    { key: 'temp',       label: 'Temp',       unit: '°C', log: false, fmt: d3.format('.1f') },
    { key: 'elevation',  label: 'Elevation',  unit: 'm',      log: false, fmt: d3.format(',.0f') },
    { key: 'rainfall',   label: 'Rainfall',   unit: 'mm/yr',  log: false, fmt: d3.format(',.0f') },
    { key: 'gdp',        label: 'GDP',        unit: 'per capita', log: true, fmt: d3.format('$.3~s') },
    { key: 'density',    label: 'Density',    unit: '/km²', log: true, fmt: d3.format(',.0f') }
  ];

  // Normalised scale per axis: value -> t in [0,1]. Both views share t-space,
  // so a filter is just [t0, t1] regardless of which view drew it.
  AXES.forEach(a => {
    const ext = d3.extent(data, d => d[a.key]);
    a.norm = (a.log && ext[0] > 0 ? d3.scaleLog() : d3.scaleLinear()).domain(ext).range([0, 1]).nice();
    a.tOf = d => a.norm(d[a.key]);
    a.bins = d3.bin().domain([0, 1]).thresholds(d3.range(1, 20).map(i => i / 20)).value(a.tOf);
    a.tickFmt = a.fmt;
  });

  // Axis order: greedy chain by |r| so adjacent pairs are the readable ones.
  const corr = (a, b) => {
    const xs = data.map(a.tOf), ys = data.map(b.tOf), mx = d3.mean(xs), my = d3.mean(ys);
    return d3.sum(xs, (x, i) => (x - mx) * (ys[i] - my)) / Math.sqrt(d3.sum(xs, x => (x - mx) ** 2) * d3.sum(ys, y => (y - my) ** 2));
  };
  const rem = AXES.slice();
  const first = d3.greatest(rem, a => d3.sum(rem, b => b === a ? 0 : Math.abs(corr(a, b))));
  const order = [first]; rem.splice(rem.indexOf(first), 1);
  while (rem.length) {
    const last = order[order.length - 1];
    const next = d3.greatest(rem, b => Math.abs(corr(last, b)));
    order.push(next); rem.splice(rem.indexOf(next), 1);
  }

  const regions = [...new Set(data.map(d => d.region))].sort();
  const color = d3.scaleOrdinal().domain(regions)
    .range(['#1f6fb4', '#d8551f', '#2a9d6f', '#8e4ec6', '#c8a012', '#c2456f']);

  const filters = new Map();   // axis key -> [t0, t1]
  let activeRegion = null;
  let brushed = data.slice();
  const passes = d => [...filters].every(([k, [t0, t1]]) => {
    const a = AXES.find(x => x.key === k), t = a.tOf(d);
    return t >= t0 && t <= t1;
  });

  const tip = d3.select('#tip');
  const showTip = (event, d) => tip.classed('show', true)
    .style('left', event.clientX + 12 + 'px').style('top', event.clientY + 12 + 'px')
    .text(`${d.city} (${d.region})`);
  const hideTip = () => tip.classed('show', false);

  // ---------- legend ----------
  const legend = d3.select('#legend').selectAll('.legend-item').data(regions).join('span').attr('class', 'legend-item');
  legend.append('span').attr('class', 'legend-swatch').style('background', d => color(d));
  legend.append('span').text(d => d);
  legend.on('click', (e, r) => { activeRegion = activeRegion === r ? null : r; update(); });

  // ---------- parallel coordinates ----------
  const svg = d3.select('#pc');
  const gRoot = svg.append('g');
  const linesG = gRoot.append('g').attr('class', 'lines');
  const axesG = gRoot.append('g').attr('class', 'axes');
  const labelG = gRoot.append('g').attr('class', 'labels');
  let W, H, x;
  const margin = { top: 52, right: 34, bottom: 26, left: 46 };
  const yOf = (a, d) => (1 - a.tOf(d)) * H;
  const line = d => d3.line()(order.map(a => [x(a.key), yOf(a, d)]));

  const brushes = new Map();
  order.forEach(a => {
    const b = d3.brushY().extent([[-11, 0], [11, 1]]);
    b.on('start brush end', event => {
      if (!event.sourceEvent) return;
      if (!event.selection) filters.delete(a.key);
      else {
        const [y0, y1] = event.selection;
        filters.set(a.key, [1 - y1 / H, 1 - y0 / H]);
      }
      update('pc:' + a.key);
    });
    brushes.set(a.key, b);
  });

  function layoutPC() {
    const box = document.getElementById('pc').getBoundingClientRect();
    const w = box.width, h = box.height;
    W = w - margin.left - margin.right; H = h - margin.top - margin.bottom;
    gRoot.attr('transform', `translate(${margin.left},${margin.top})`);
    x = d3.scalePoint().domain(order.map(a => a.key)).range([0, W]);

    linesG.selectAll('.line').data(data, d => d.city).join('path').attr('class', 'line')
      .attr('stroke', d => color(d.region))
      .on('mouseenter', (e, d) => { d3.select(e.currentTarget).classed('highlight', true).raise(); showTip(e, d); setReadout(d); })
      .on('mousemove', showTip)
      .on('mouseleave', (e) => { d3.select(e.currentTarget).classed('highlight', false); hideTip(); setReadout(null); })
      .attr('d', line);

    const ax = axesG.selectAll('.axis-group').data(order, a => a.key).join(enter => {
      const g = enter.append('g').attr('class', 'axis-group');
      g.append('g').attr('class', 'axis');
      g.append('text').attr('class', 'axis-label').attr('y', -28).text(a => a.label);
      g.append('text').attr('class', 'axis-unit').attr('y', -15).text(a => a.unit);
      g.append('g').attr('class', 'axis-brush');
      return g;
    });
    ax.attr('transform', a => `translate(${x(a.key)},0)`);
    ax.select('.axis').each(function (a) {
      const s = a.norm.copy().range([H, 0]);
      d3.select(this).call(d3.axisLeft(s).ticks(6, a.log ? '~s' : undefined).tickSize(4).tickFormat(a.tickFmt));
      d3.select(this).selectAll('.tick text').attr('x', -7);
    });
    ax.select('.axis-brush').each(function (a) {
      const b = brushes.get(a.key).extent([[-11, 0], [11, H]]);
      d3.select(this).call(b).selectAll('.selection').attr('class', 'selection');
      d3.select(this).classed('axis-brush', true);
      syncBrush(a);
    });
  }

  // programmatic brush move: no sourceEvent, so the handler ignores it
  function syncBrush(a) {
    const node = axesG.selectAll('.axis-group').filter(d => d === a).select('.axis-brush');
    const f = filters.get(a.key);
    node.call(brushes.get(a.key).move, f ? [(1 - f[1]) * H, (1 - f[0]) * H] : null);
  }

  // ---------- summary table ----------
  const table = d3.select('#summary');
  const SW = 220, SH = 44, sx = d3.scaleLinear().domain([0, 1]).range([0, SW]);
  const head = table.append('thead').append('tr');
  [['Axis', 'name', '15%'], ['Min', '', '13%'], ['Median', '', '13%'], ['Max', '', '13%'], ['Distribution', '', '46%']].forEach(([t, c, w]) =>
    head.append('th').attr('class', c).style('width', w).text(t));
  const rows = table.append('tbody').selectAll('tr').data(order, a => a.key).join('tr').attr('class', 'axis-row');
  rows.append('td').attr('class', 'axis-name').html(a => `${a.label}<small>${a.unit}</small>`);
  rows.append('td').attr('class', 'stat min');
  rows.append('td').attr('class', 'stat median');
  rows.append('td').attr('class', 'stat max');
  const sparkSvgs = rows.append('td').attr('class', 'spark-cell').append('svg').attr('class', 'spark-svg').attr('viewBox', `0 0 ${SW} ${SH}`).attr('preserveAspectRatio', 'none');
  sparkSvgs.each(function (a) {
    const s = d3.select(this);
    s.append('g').attr('class', 'ghost');
    s.append('g').attr('class', 'bars');
    s.append('line').attr('class', 'spark-baseline').attr('x1', 0).attr('x2', SW).attr('y1', SH - 6).attr('y2', SH - 6);
    s.append('g').attr('class', 'dots');
    s.append('line').attr('class', 'spark-median').attr('y1', 2).attr('y2', SH - 6);
    const b = d3.brushX().extent([[0, 0], [SW, SH]]).on('start brush end', event => {
      if (!event.sourceEvent) return;
      if (!event.selection) filters.delete(a.key);
      else filters.set(a.key, event.selection.map(v => sx.invert(v)));
      update('sp:' + a.key);
    });
    a.sparkBrush = b;
    s.append('g').attr('class', 'spark-brush').call(b);
  });

  // Ghost = whole dataset on the same bins; a shared y per axis so bars stay comparable to the ghost.
  const full = new Map(AXES.map(a => [a.key, a.bins(data)]));

  function updateTable() {
    const barH = SH - 8;
    sparkSvgs.each(function (a) {
      const s = d3.select(this), all = full.get(a.key), sub = a.bins(brushed);
      const ymax = d3.max(all, b => b.length) || 1;
      const yFull = d3.scaleLinear().domain([0, ymax]).range([0, barH]);
      // subset is scaled to its own peak so 3 cities still show as visible bars; ghost keeps the full shape
      const smax = d3.max(sub, b => b.length) || 1;
      const ySub = brushed.length < 0.5 * data.length ? d3.scaleLinear().domain([0, smax]).range([0, barH]) : yFull;
      s.select('.ghost').selectAll('.spark-ghost').data(all).join('rect').attr('class', 'spark-ghost')
        .attr('x', b => sx(b.x0) + .5).attr('width', b => Math.max(0, sx(b.x1) - sx(b.x0) - 1))
        .attr('y', b => SH - 6 - yFull(b.length)).attr('height', b => yFull(b.length));
      s.select('.bars').selectAll('.spark-bar').data(sub).join('rect').attr('class', 'spark-bar')
        .attr('x', b => sx(b.x0) + .5).attr('width', b => Math.max(0, sx(b.x1) - sx(b.x0) - 1))
        .attr('y', b => SH - 6 - ySub(b.length)).attr('height', b => ySub(b.length));
      // few rows: show each city as a dot, since bins say little about 3 points
      const dots = brushed.length <= 12 ? brushed : [];
      s.select('.dots').selectAll('.spark-dot').data(dots, d => d.city).join('circle').attr('class', 'spark-dot')
        .attr('r', 3.2).attr('cy', SH - 6).attr('cx', d => sx(a.tOf(d)))
        .on('mouseenter', (e, d) => { showTip(e, d); setReadout(d); }).on('mousemove', showTip)
        .on('mouseleave', () => { hideTip(); setReadout(null); });
      const vals = brushed.map(d => d[a.key]);
      const med = brushed.length ? d3.median(vals) : null;
      s.select('.spark-median').attr('display', med == null || brushed.length <= 12 ? 'none' : null)
        .attr('x1', med == null ? 0 : sx(a.norm(med))).attr('x2', med == null ? 0 : sx(a.norm(med)));
    });
    rows.classed('row-filtered', a => filters.has(a.key));
    rows.select('.min').text(a => brushed.length ? a.fmt(d3.min(brushed, d => d[a.key])) : '–').classed('empty', !brushed.length);
    rows.select('.median').text(a => brushed.length ? a.fmt(d3.median(brushed, d => d[a.key])) : '–').classed('empty', !brushed.length);
    rows.select('.max').text(a => brushed.length ? a.fmt(d3.max(brushed, d => d[a.key])) : '–').classed('empty', !brushed.length);
  }

  function setReadout(hover) {
    const ro = d3.select('#readout');
    if (hover) { ro.html(`<b>${hover.city}</b> (${hover.region}) ` + order.map(a => `${a.label} ${a.fmt(hover[a.key])}`).join(' · ')); return; }
    if (brushed.length && brushed.length <= 6 && filters.size) ro.html('<b>' + brushed.map(d => d.city).join(', ') + '</b>');
    else ro.text(filters.size ? '' : 'No brushes active.');
  }

  function update(source) {
    brushed = data.filter(passes);
    const n = brushed.length, set = new Set(brushed);
    const few = n > 0 && n <= 6 && filters.size > 0;
    d3.select('#badge').classed('few', few).classed('none', n === 0);
    d3.select('#badge .count').text(n);
    d3.select('#reset').style('visibility', filters.size ? 'visible' : 'hidden');

    linesG.selectAll('.line')
      .classed('active', d => set.has(d))
      .classed('dimmed', d => !set.has(d))
      .classed('few', d => few && set.has(d))
      .classed('region-dimmed', d => activeRegion && d.region !== activeRegion);
    linesG.selectAll('.line.active').raise();
    legend.classed('active', r => r === activeRegion).classed('dimmed', r => activeRegion && r !== activeRegion);

    // mirror filters into whichever view did not originate the change
    order.forEach(a => {
      const f = filters.get(a.key);
      if (source !== 'pc:' + a.key) syncBrush(a);
      if (source !== 'sp:' + a.key) rows.filter(r => r === a).select('.spark-brush').call(a.sparkBrush.move, f ? f.map(sx) : null);
    });
    updateTable();
    setReadout(null);
    drawFewLabels(few);
  }

  // label surviving cities on the axes view at the right edge when only a handful pass
  function drawFewLabels(few) {
    const last = order[order.length - 1];
    const items = few ? brushed.slice().sort((a, b) => yOf(last, a) - yOf(last, b)) : [];
    // nudge apart so labels never overlap
    let prev = -Infinity;
    const pos = items.map(d => { const y = Math.max(yOf(last, d), prev + 12); prev = y; return { d, y }; });
    labelG.selectAll('.city-label').data(pos, p => p.d.city).join('text').attr('class', 'city-label')
      .attr('x', W + 8).attr('y', p => p.y + 3).text(p => p.d.city.replace('city-', '#'))
      .attr('fill', p => color(p.d.region));
  }

  d3.select('#reset').on('click', () => { filters.clear(); update(); });

  layoutPC();
  update();
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layoutPC(); update(); }, 120); });
})();
</script>
</body>
</html>
