ards against scroll-vs-brush conflict on mobile.", "cognitive_load": 9, "cognitive_load_note": "Textbook crossfilter execution — 3 panels well within working memory limits, single-hue palette eliminates color overload, ghost bars provide unfiltered context, and transitions are correctly suppressed during drag and smoothed on brush-end, leaving no perceptual risk to flag.", "composite": 6.6}, "08-small-multiples-seasonal": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol palette, shared axes, and synchronized crosshair across all 12 panels show deliberate craft, but the dense overlapping lines at high-consumption months (Jan, Feb, Dec) and the slightly cramped vertical cell height make individual year traces hard to distinguish without hovering.", "encoding_integrity": 8, "encoding_integrity_note": "Shared y-scale derived from d3.extent across all data enables honest cross-month comparison; line chart exempts non-zero baseline, but x-domain is hardcoded to [1,31] for all months regardless of actual days (Feb ends at 28 leaving dead space), and no line.defined() guard exists.", "stress_test": 6, "flags": ["Update Storm", "Stale Closure"], "stress_test_note": "The pointermove handler calls showCrosshair() with no RAF or throttle, mutating 48 DOM nodes (12 crosshair lines + 36 dots) plus innerHTML on every mousemove; xScale/yScale are captured in a static closure with no resize handler.", "cognitive_load": 8, "cognitive_load_note": "12-panel grid with 3-color Tol palette executes cleanly — shared axes and a clear seasonal U-shape narrative make cross-panel comparison easy, but lines interweave in low-consumption spring/fall months where year-over-year differences are small, and the crosshair linking all 12 panels simultaneously adds moderate interaction load near the 5-view warning threshold.", "composite": 7.3}, "11-zoomable-treemap": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate HCL-based color system with lightness-by-depth creates genuine visual hierarchy, breadcrumb nav and label-fitting logic show real polish, but leaf text at 9-10px becomes illegible at overview scale and the legend swatches use raw palette hues that don't match the rendered (HCL-shifted) cell fills.", "encoding_integrity": 7, "encoding_integrity_note": "Area encoding is correct (d3.treemap sum proportional to value), domains are data-driven, and zoom scales are computed from node bounds; minor issues are a fragile data-join key (name+depth+parentName risks collisions) and rng()-based leaf lightness that adds visual noise unrelated to data values.", "stress_test": 8, "stress_test_note": "All five stress-test checks pass: click-only zoom avoids update storms, pointer events prevent mouse-touch fights, x/y scales are updated before use eliminating stale closures, cell.interrupt() is called before each new transition preventing mid-flight snaps, and there is no cross-view dispatcher to produce infinite loops; minor deduction for concurrent named 'zoom' (750ms) and 'opacity' (400ms) transitions running simultaneously on the same cells, which can produce visual artifacts on rapid clicks before the opacity transition completes.", "cognitive_load": 7, "cognitive_load_note": "8-color Tol palette with depth-based lightness hierarchy manages perceptual load well and the root view is readable, but the palette sits exactly at the color-overload warning threshold and the root view's leaf density is high enough that animation quality (500+ elements rescaling on zoom) can't be confirmed safe from a static screenshot.", "composite": 7.2}, "13-radial-dendrogram-edge-bundling": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "15-adjacency-matrix-reorder": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol Bright palette, community-colored labels, and a well-integrated degree bar chart give the layout a considered feel, but the rotated column labels are slightly cramped and the bracket indicators are invisible until Community mode is selected, muting their design payoff.", "encoding_integrity": 8, "encoding_integrity_note": "Honest encoding throughout: color scale domain derived from d3.max, degree bars have zero baseline, all data joins use key functions, and no radius/area deception — minor robustness concern is that subset removal shifts the bar scale domain, but this is typical for well-made synthetic-data demos.", "stress_test": 5, "flags": ["Mid-Flight Snap", "Update Storm"], "stress_test_note": "reorder() starts a 600ms transition on 1225+ cells/labels without .interrupt(), so rapid button clicks cause mid-flight snapping; onPointerMove also mutates 70 label attrs on every cell crossing with no RAF or dirty-flag coalescing.", "cognitive_load": 8, "cognitive_load_note": "5-color Tol Bright palette cleanly separates communities in labels and bars, sequential blue weights don't compete, and the single matrix + linked degree bar stay well within working memory limits — the only friction is that the Name-order default shows a scattered matrix until the viewer discovers the reorder controls.", "composite": 7.1}, "16-sankey-energy-flow": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberate Tol muted palette with colorblind-safe stage colors, gradient link fills, and dashed loss flows show strong design intentionality, though the mid-chart visual complexity (overlapping flows between Grid and Sectors) makes it hard to trace individual paths without interaction.", "encoding_integrity": 8, "encoding_integrity_note": "Flow widths are correctly proportional via d3-sankey layout, flow conservation holds across all nodes, losses are distinctly encoded in red with dashing, and the colorblind-safe palette is applied consistently; minor deductions for Math.max(1.5,d.width) clamping small flows and absent key functions in data joins.", "stress_test": 6, "flags": ["Update Storm"], "stress_test_note": "The drag handler calls sankey.update(graph), linkPath.attr('d',...), and iterates all gradients on every mousemove with no requestAnimationFrame or dirty-flag throttle; all other stress-test criteria (infinite loop, stale closure, mid-flight snap, mouse-touch fight) are clean.", "cognitive_load": 8, "cognitive_load_note": "Five-stage gradient Sankey with 23 nodes and 33 links reads clearly — column headers, colorblind-safe palette, and loss-flow dashing manage complexity well, with ribbon density at the Grid stage being the only mild perceptual friction.", "composite": 7.6}, "17-chord-diagram-trade": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol palette, clear typographic hierarchy (monospace tick labels are a nice touch), and well-crafted hover isolation lift this above generic, but the dense ribbon tangle at center makes individual flows hard to trace without interaction.", "encoding_integrity": 8, "encoding_integrity_note": "Chord layout is fully data-driven with honest arc/ribbon proportionality and correct asymmetric matrix handling, but the hardcoded $50B tick step and absent key functions in joins would cause robustness failures under data rescaling or live updates.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "No .interrupt() calls before hover transitions in highlightGroup/resetHighlight means rapid arc-to-arc mousing during the 600ms entrance animation will snap arc growth mid-tween; all other checks pass cleanly (pointerenter-only renders avoid update storms, single-view eliminates feedback loops, static layout has no stale scale risk, and unified Pointer Events API prevents mouse-touch fights).", "cognitive_load": 7, "cognitive_load_note": "Hover-to-isolate interaction redeems a dense 45-ribbon, 10-color layout that reads as a tangle in its static state, but the palette has near-duplicate hues (two blues, two greens) and the ribbon congestion at center is unavoidable without hovering.", "composite": 7.2}, "18-collapsible-tree-search": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Tol palette with rank-color encoding, clean search UX and count badges, but the lower half of the viewport is wasted empty space at default expansion depth.", "encoding_integrity": 7, "encoding_integrity_note": "Honest categorical encoding (color by rank, position by hierarchy, text count badges — no lie factor), data-driven SVG dimensions, but the node key function (name+depth) risks collision under data permutation and nodeSize is hardcoded rather than data-driven.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "No .interrupt() before new transitions on node/link selections means rapid clicks during the 500ms animation can cause positional snapping, and a stale-closure setTimeout scroll (line 591–601) fires with captured `first`/`offsetY` values that may be outdated if update() is called again before the timer fires; all other checks pass — search is debounced 200ms, pointer events unify mouse/touch, and the single-view design eliminates feedback-loop and update-storm risk.", "cognitive_load": 8, "cognitive_load_note": "Single-view tree with well-managed progressive disclosure keeps default state uncluttered (14 visible nodes, 6-color Tol palette within bounds); full expansion to ~200 nodes stacks vertically requiring scroll but staged transitions and search-driven auto-expand prevent perceptual overwhelm.", "composite": 7.2}, "20-arc-diagram": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol muted palette with weight-encoded stroke widths and satisfying hover dimming shows real design intent, but the dense arc tangle and cramped 10px angled labels make individual connections hard to trace at rest.", "encoding_integrity": 6, "encoding_integrity_note": "Arc height correctly uses scaleSqrt for perceptual honesty, but node radius uses scaleLinear (circle area scales as r², creating a lie factor for importance encoding), and all scale domains are hardcoded magic numbers rather than data-driven.", "stress_test": 5, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "onBrush fires unthrottled DOM mutations on all 90 arcs and 60 node/label selections every mousemove with no RAF/debounce, and hover transitions lack .interrupt() so brush events during a 120ms hover animation cause attribute conflicts and snapping.", "cognitive_load": 6, "cognitive_load_note": "Hover highlight and chapter brush effectively manage 30 nodes / 90 edges, but the uninteracted static state is dense: 9 simultaneous hues on overlapping arcs at 0.35 opacity makes color grouping unreliable before the viewer discovers the interactions.", "composite": 6.1}, "23-hex-bin-map": {"render": true, "visual_critic": 2, "visual_critic_note": "The hexbin canvas layer is entirely absent from the screenshot — only blank state outlines render, making the population density encoding completely invisible and the visualization non-functional.", "encoding_integrity": 6, "encoding_integrity_note": "Color encoding is structurally honest (data-driven domain via d3.max, sequential scale from 0, perceptual gamma ramp) but 32-bucket color quantization misrepresents exact bin counts, and the screenshot shows no hex bins rendered on canvas—only SVG state borders—indicating a likely async load failure at capture time.", "stress_test": 6, "flags": ["Update Storm (slider: no debounce/throttle on input event, full hexbin recomputation over 20k points on every drag frame)", "Update Storm (pointermove: full canvas re-render on every bin boundary crossing, no RAF coalescing)"], "stress_test_note": "Hover guard prevents per-frame redraws within the same bin, and pointer events unify mouse/touch cleanly, but the radius slider fires synchronous full hexbin recomputes at input-event rate with no debounce or requestAnimationFrame.", "cognitive_load": 5, "cognitive_load_note": "Single sequential color scale and one slider control keep cognitive load minimal in design, but the screenshot shows a blank canvas with no hex bins rendered — likely the async TopoJSON fetch hadn't resolved at capture time — leaving the viewer with zero information and no loading indicator.", "composite": 4.6}, "26-horizon-chart-stack": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol sequential blues palette, clear typographic hierarchy (title → subtitle → labels → ticks), and restrained dashed gridlines show real design intent, but the horizon chart's folded encoding is hard to decode without prior familiarity and the compact 56px row height leaves little room for the bands to express value magnitude.", "encoding_integrity": 7, "encoding_integrity_note": "Horizon folding is correctly implemented (bands shifted by step, area bounded 0–rowHeight, semantically justified maxVal=100 for CPU%), but a new d3.scaleLinear is created inside the y1 accessor on every data point (performance anti-pattern), and line.defined() is absent — a structural gap if real data with nulls were substituted.", "stress_test": 6, "flags": ["Update Storm: pointermove fires unthrottled DOM mutations (crosshair, 8 markers, innerHTML rebuild) plus getBoundingClientRect() on every mousemove — forced layout reflow at 60fps with no RAF or dirty-flag guard", "Stale Closure: x scale is captured in a static closure with no resize handler — scale becomes stale if the container resizes, producing wrong coordinate mapping on crosshair and markers"], "stress_test_note": "No brush/zoom or transitions reduce the blast radius, but the unthrottled pointermove triggers a forced layout reflow via getBoundingClientRect() and full innerHTML replacement on every frame, and the x scale has no resize path.", "cognitive_load": 8, "cognitive_load_note": "3-band horizon chart with 8 rows and a shared time axis reads cleanly — the sequential blue palette, alternating row backgrounds, and crosshair tooltip manage density well, though the folded encoding requires legend literacy and the compact 56px row height makes band separation subtle at a glance.", "composite": 7.1}, "28-cycle-plot": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberate Tol palette with sequential blue encoding for year progression, restrained mean-line annotation, and well-placed narrative callouts (COVID dip, Holiday Season bracket) show clear design intent, though the bottom half of the viewport is wasted empty space and the mean value labels at 8px are marginal on readability.", "encoding_integrity": 8, "encoding_integrity_note": "Cycle plot is structurally honest — data-driven Y domain via d3.min/max, no zero-baseline violation (line/dot chart, not bar), no radius deception, correct per-month mean from data, single shared Y-scale; minor omissions: no line.defined() for gap handling and no key functions in data joins, neither of which causes real deception with the complete synthetic dataset.", "stress_test": 8, "flags": ["Mid-Flight Snap"], "stress_test_note": "updateHighlight() starts 120ms transitions on every pointerenter/pointerleave without calling .interrupt() first, so rapid hover across dots can stack conflicting transitions; all other checks pass cleanly (pointer events unify mouse/touch, no brush/zoom storm, no cross-view dispatch loop, scales are static so no stale closure risk).", "cognitive_load": 8, "cognitive_load_note": "Clean cycle plot execution: 12 panels share a Y-axis and a 5-shade sequential blue palette that matches the ordinal year encoding, keeping cross-panel comparison effortless; the sparse annotations (High/Low, COVID dip, Holiday bracket) add context without clutter, and the 5-dot-per-panel density is well within perceptual limits.", "composite": 8.0}, "29-bar-chart-race": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol palette, tabular-nums monospace values, and year watermark show real design intent, but Canada/China bars overlap at identical values and the scrubber/controls row feels slightly dense against the generous chart margins.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baseline correct, key functions present (d => d.country), domain is data-driven via d3.max, but x-scale domain recalculates every frame from the top-12 subset causing cross-time absolute comparisons to be unreliable — mitigated by absolute value labels and is standard bar-chart-race trade-off.", "stress_test": 6, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "Scrubber fires unthrottled full D3 data joins on every input event without RAF coalescing, and unnamed enter/exit transitions lack .interrupt() calls so rapid scrubbing can conflict with in-flight animations; named 'move' transitions on updates and no cross-view dispatch prevent the other three traps.", "cognitive_load": 8, "cognitive_load_note": "Clean single-view race with dual labeling (name + code) compensating for the 15-color palette; animation quality can't be fully assessed statically but code uses named transitions, easeLinear, and prefers-reduced-motion correctly.", "composite": 7.1}, "30-scrollytelling-climate": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed scrollytelling — Tol palette, clear typographic hierarchy, polished step-card fade mechanic, and thoughtful annotations; docked from 8 because the step-0 gray bars at 0.35 opacity render nearly invisible, making the initial state feel unintentionally empty.", "encoding_integrity": 7, "encoding_integrity_note": "Bars correctly extend from zero baseline with key functions and honest color encoding, but hardcoded y-domain [-0.55, 1.45] and x-domain [1884, 2023] break metamorphic scaling and shift relations.", "stress_test": 7, "flags": ["mid-flight-snap", "unthrottled-resize"], "stress_test_note": "No .interrupt() before new transitions in renderState() means rapid IntersectionObserver scroll events can stack 700ms transitions; window resize listener also fires renderState with full DOM mutation on every pixel change without debounce.", "cognitive_load": 8, "cognitive_load_note": "Scrollytelling serializes complexity well — one sticky chart, 5 sequential states, a 2-hue palette (warm/cool), and contextual annotations per step keep working memory load minimal, with step 4's composite overlay (regression line + inline decade-bar chart + endpoint label) being the only moment where annotation density could briefly crowd the chart area.", "composite": 7.2}, "32-shape-morphing-gallery": {"render": true, "visual_critic": 5, "visual_critic_note": "Clean Tol-palette cards and restrained grid layout show real design intent, but 6 of 9 panels render blank at screenshot time due to staggered setTimeout initialization — the gallery reads as broken rather than animated.", "encoding_integrity": 6, "encoding_integrity_note": "Structurally honest animation gallery with data-driven domains on most charts, but the Bar↔Pie radial-bar state uses a linear radius scale (yScale = scaleLinear mapped to outerRadius), making area ∝ value² — a classic lie factor violation — and no key functions are used in any data join, creating permutation-relation fragility if data were ever updated.", "stress_test": 8, "flags": ["Mid-Flight Snap"], "stress_test_note": "Purely automated gallery eliminates Update Storm, Infinite Loop, Stale Scale, and Mouse-Touch risks entirely, but all 9 morph loops omit .interrupt() before launching new transitions, leaving a latent mid-flight snap if browser timer drift causes a second loopMorph cycle to fire while a previous transition is still running.", "cognitive_load": 7, "cognitive_load_note": "9-cell gallery with clean layout, clear labels, and restrained per-cell color (Tol palette), but 9 concurrent animations with no focal hierarchy compete for attention — the staggered 400ms start offsets help, yet in motion the viewer can't comfortably track any single morph while eight others animate simultaneously; static screenshot also reveals 6 empty cells due to setTimeout stagger timing at capture, which is a rendering-timing issue rather than a design flaw.", "composite": 6.3}, "34-visual-texture-a11y": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate dual-encoding concept with a colorblind-safe palette and distinct patterns earns real design credit, but the bottom half of the viewport is wasted empty space and the large side-by-side panels feel slightly cramped at this canvas size.", "encoding_integrity": 8, "encoding_integrity_note": "Zero baseline enforced, y-domain is data-driven via d3.max, no size/radius deception, and dual color+pattern encoding is honestly labeled — minor: static render avoids key-function concern but yMax*1.08 buffer is a magic number.", "stress_test": 9, "stress_test_note": "No brush/zoom/transitions/cross-view dispatch present; pointer events API unifies mouse+touch correctly; only interaction is a lightweight tooltip on pointermove with no D3 re-renders, so no stress-test criteria are violated.", "cognitive_load": 8, "cognitive_load_note": "Two panels form a single conceptual unit (normal vs. deuteranopia), 4 categories with a colorblind-safe palette and perceptually distinct patterns keep cognitive load well within limits, though pattern overlays are subtle enough that texture-only discrimination requires deliberate inspection.", "composite": 7.9}, "35-color-palette-explorer": {"render": true, "visual_critic": 6, "visual_critic_note": "Genuine design thought in panel structure, monospace for technical values, and semantic traffic-light contrast matrix, but the bar chart is decorative filler and the 6.5px CVD hex labels are too small to read comfortably, keeping it at competent-but-not-remarkable.", "encoding_integrity": 8, "encoding_integrity_note": "Bar chart uses honest zero baseline and data-driven domain (d3.max); WCAG contrast ratios are computed with correct linearization; no lie factor, dual-axis, or gap issues — minor flaw is unseeded d3.randomNormal regenerating new data on each palette switch, preventing honest cross-palette comparison.", "stress_test": 9, "stress_test_note": "No brushes, zoom, or cross-view dispatch; palette switches do a full container tear-down (selectAll('*').remove()) which implicitly cancels in-flight transitions, and pointer events prevent mouse-touch conflicts — no stress-test violations found.", "cognitive_load": 8, "cognitive_load_note": "Three conceptually unified panels (bar chart, 7×7 contrast matrix, 4-condition CVD strips) update together on palette switch with purposeful grow-in animation; layout is clean and the views form one coherent tool rather than independent charts, though the 6.5px hex labels in the CVD strip are marginally too small to read without zooming.", "composite": 7.6}, "36-responsive-multi-breakpoint": {"render": true, "visual_critic": 2, "visual_critic_note": "Visually broken at screenshot time — the scatter plot and marginal histograms are completely absent, leaving only a title, badge, and a lone x-axis stranded at the bottom of a blank canvas; the ResizeObserver-driven render apparently did not fire before capture.", "encoding_integrity": 7, "encoding_integrity_note": "Correct scaleSqrt for size encoding and data-driven domains, but histogram bin counts are hardcoded (thresholds(24)/thresholds(20)) rather than data-driven, and the chart renders blank on load since it depends entirely on ResizeObserver firing.", "stress_test": 6, "flags": ["Update Storm - ResizeObserver fires render() on every pixel without debounce or RAF, triggering full multi-layer data joins and axis redraws at resize rate"], "stress_test_note": "The 1px width guard is insufficient — rapid window resize hammers render() with expensive DOM mutations across 9 layers at up to 60fps; named transition 'main' prevents mid-flight snapping but constant interruption causes animation jank; no brush/zoom interactions so loop/stale-scale/touch risks are N/A.", "cognitive_load": 3, "cognitive_load_note": "Cognitively sound design (4 colors, single responsive view, staged transitions) but the chart fails to render data in the screenshot — only an empty x-axis is visible, making insight extraction impossible.", "composite": 4.3}, "39-quadtree-hit-detection": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Paul Tol palette over schemeCategory10 and thoughtful interaction details (glow rings, dashed connectors, crosshair, Voronoi toggle) show genuine design intent, though the gray Chalcogen cluster reads weakly against the white background and the legend/title stacking at top-left feels cramped.", "encoding_integrity": 7, "encoding_integrity_note": "No encoding violations (scatter plot, ordinal color, decorative radii not encoding data); positions map directly as pixel coordinates without a D3 scale, acceptable for this synthetic spatial demo, but hardcoded cluster centers and no axis scales limit robustness under data changes.", "stress_test": 6, "flags": ["Update Storm: updateVoronoi() runs synchronously on every zoom event — recomputes d3.Delaunay.from() over 5000 points and does a full DOM join of 5000 <path> elements with no RAF coalescing or throttle guard", "Mid-Flight Snap: resetZoom fires a 750ms svg.transition() with no .interrupt() call, so rapid re-clicks stack concurrent transitions"], "stress_test_note": "Canvas highlights use a correct dirty-flag/RAF pattern, but enabling the Voronoi overlay exposes a severe update storm in the zoom handler where O(n log n) Delaunay recomputation and 5000-node DOM mutation run unthrottled on every wheel tick.", "cognitive_load": 7, "cognitive_load_note": "Single-view scatter with well-separated clusters carries 8 colors without overload, but the legend/title stack at top-left overlaps the densest cluster region, and 5000 overlapping points in the central zone obscure structure until the user zooms or hovers.", "composite": 6.8}, "41-force-bundling-chord-triptych": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol palette, synchronized cross-panel highlighting, and uppercase panel-title treatment show real design intent, but 8px labels crowd the bottom of the bundling panel and the mechanical equal-thirds layout underserves the force-directed panel's visual weight.", "encoding_integrity": 7, "encoding_integrity_note": "All three panels use structurally honest encodings (chord arcs/ribbons are area-proportional via d3.chord, node size is fixed non-data, no truncated baselines) but no key functions in any data join and a fully hardcoded 5-group×8-node synthetic structure make it brittle under data substitution.", "stress_test": 7, "flags": ["Update Storm (un-throttled slider input triggers full canvas drawEdges on every tick without RAF or debounce)", "Infinite Feedback Loop (dispatch.call passes null as source; no `if (source === this) return` guard, though handlers don't re-dispatch so risk is latent)"], "stress_test_note": "Largely robust — pointer events unify mouse/touch correctly, no transitions mean no mid-flight snaps, static pre-computed layout avoids stale scale closures, and hover is bound to pointerenter (not pointermove) so cross-panel updates don't storm at 60fps; only the tension slider fires an un-throttled full canvas redraw on every input event.", "cognitive_load": 7, "cognitive_load_note": "Three linked views of one network form a coherent conceptual unit with restrained 5-color Tol palette and clean cross-panel dispatch, but 8px rotated labels in the radial bundling panel are a real legibility strain at the Thalamus cluster where 8 nodes crowd the lower arc.", "composite": 7.0}, "43-classification-choropleth": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional YlOrBr palette with good lightness ramp, synchronized hover across all four maps, and a histogram breakpoint overlay are deliberate design choices, but the legend text at 9px is barely legible and the four maps feel cramped with insufficient breathing room between panels.", "encoding_integrity": 7, "encoding_integrity_note": "Color scales are data-driven and correctly labeled across all four classification methods, but the supplementary histogram uses 30 fixed bins for ~51 data points (over-binned vs. Sturges'/Scott's rule) and state joins lack key functions.", "stress_test": 7, "flags": ["update_storm_slider"], "stress_test_note": "Slider `input` handler calls `update()` synchronously with no throttle, triggering 200+ DOM mutations (fill on 50 states × 4 panels + legend + histogram line removal/recreation) on every discrete step change; all other checks pass — no transitions to interrupt, no dispatch feedback loops, no stale closures (scales recomputed per call), and pointer events unify mouse/touch correctly.", "cognitive_load": 8, "cognitive_load_note": "Four-panel comparison reads as a single conceptual unit with a well-ordered sequential palette, but the 9px monospace legend labels with dollar ranges are borderline illegible at display size.", "composite": 7.2}, "44-diverging-midpoint-heatmap": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed — Tol-inspired diverging palette, clear typographic hierarchy, intentional event annotations with leader lines, and the Singapore panel's near-white cells effectively communicate narrow climate range without any additional explanation.", "encoding_integrity": 8, "encoding_integrity_note": "Symmetric diverging scale correctly anchored at 0 with data-driven domain via d3.max; shared color scale across all cities enables honest cross-city comparison with transparent Singapore annotation, though no key functions on data joins (acceptable for static render) and Math.ceil rounding slightly compresses saturation at extremes.", "stress_test": 9, "stress_test_note": "Static heatmap with pointer-event-based tooltips only — no brush, zoom, transitions, or cross-view dispatch, so all five interaction traps are structurally absent; the sole minor issue is offsetWidth/offsetHeight reads inside pointermove causing repeated layout reflows, but no DOM mutations occur there.", "cognitive_load": 8, "cognitive_load_note": "Calendar layout handles ~1098 cells cleanly across 3 panels — the diverging blue-white-red scale is semantically clear, annotations are sparse and well-placed, and Singapore's washed-out appearance is correctly framed as a feature via the range annotation rather than a perceptual failure.", "composite": 7.9}, "47-mixed-scale-parcoords": {"render": true, "visual_critic": 7, "visual_critic_note": "Colorblind-safe Tol palette, canvas/SVG layering, and clean typographic hierarchy make this feel deliberately designed, but the dense unfiltered line mass at 30% alpha is visually noisy and the subtitle's meta-commentary ('2 linear, 1 log…') reads as developer notes rather than user-facing context.", "encoding_integrity": 8, "encoding_integrity_note": "Log scale correctly applied to log-normally distributed salary, data-driven domains via d3.extent/d3.max for continuous axes, appropriate ordinal scalePoint for categorical dimensions, colorblind-safe palette, and no misleading encoding patterns; minor deduction for hardcoded performance domain [1,5] (semantically justified but not derived from data) and no .nice() on the salary log scale.", "stress_test": 7, "flags": ["Update Storm"], "stress_test_note": "drawLines() is called synchronously on every brush mousemove event without requestAnimationFrame or a dirty-flag coalesce, redrawing all 300 polylines per frame; canvas mitigates jank but the pattern is still unthrottled.", "cognitive_load": 6, "cognitive_load_note": "The colorblind-safe 6-color palette and low alpha (0.30) are well-chosen, but 300 unfiltered lines converging on two ordinal axes (Department, Education) create dense hairball bundles at those columns that make cross-axis patterns unreadable without brushing — the unfiltered state is the primary cognitive load failure.", "composite": 7.0}, "49-textured-network-diagram": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "51-accessible-force-network": {"render": true, "visual_critic": 6, "visual_critic_note": "Paul Tol palette and thoughtful accessibility scaffolding show real intentionality, but the flat #fafafa canvas, uniform node sizing, and generic system-ui typography produce a competent-but-undesigned feel at normal viewing distance.", "encoding_integrity": 7, "encoding_integrity_note": "No deceptive encodings (uniform node size, honest categorical color for community, no axes/baselines to truncate), but degree is not visually encoded in the network itself, and the pre-computed force layout (simulation.tick(300) then frozen) fails the scaling/shift metamorphic relations — data changes would not update node positions.", "stress_test": 7, "flags": ["Update Storm (RAF loop without dirty flag)"], "stress_test_note": "The animated focus-ring RAF loop (line 463) re-draws all 150 nodes and 260 links at 60fps with no dirty-flag guard, and table row pointerenter/pointerleave fire raw render() calls; no stale-scale, infinite-loop, mid-flight, or touch-fight issues exist because the simulation is pre-computed and Pointer Events API is used correctly.", "cognitive_load": 7, "cognitive_load_note": "6-color Tol palette, pre-computed static simulation, and 18%-opacity edges manage 150-node density well, but community clusters overlap enough at rest that structure isn't legible without interaction.", "composite": 6.7}, "52-accessible-choropleth": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional Tol sequential palette and clean typographic hierarchy elevate it above generic, but the legend labels run together without spacing ('$10,936$12,271$13,606'), a concrete layout bug that undermines an otherwise competent choropleth.", "encoding_integrity": 7, "encoding_integrity_note": "Choropleth is structurally honest — data-driven scaleQuantize domain, correct legend thresholds — but the table's inline bar scale uses a truncated baseline (d3.scaleLinear(extent, [0,100])) starting at the data minimum rather than zero, exaggerating relative differences between states.", "stress_test": 8, "flags": ["Update Storm (minor): table pointerenter/pointerleave call render() without debounce or RAF"], "stress_test_note": "No brush/zoom/transition interactions eliminates most stress-test risks, but table row hover triggers un-throttled full canvas redraws on every pointerenter and pointerleave without RAF coalescing.", "cognitive_load": 8, "cognitive_load_note": "Single-view choropleth with a restrained 5-step sequential blue palette reads cleanly at a glance; the only perceptual friction is legend label crowding ($10,936$12,271 run together without gaps), and small northeastern states are hard to distinguish without the hover interaction.", "composite": 7.2}, "53-textured-raincloud": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberately designed: Tol palette with distinct SVG texture overlays, clean typographic hierarchy, well-proportioned row layout, and a genuinely useful accessibility toggle — held from 9 by the redundant legend (groups already labeled on y-axis) and the slightly cramped bottom row cut off by the viewport.", "encoding_integrity": 8, "encoding_integrity_note": "Data-driven x-domain (d3.extent), Silverman bandwidth, correct IQR box stats, and pattern+color dual encoding are all honest; per-group KDE normalization hides cross-group density comparisons (by-design but unstated), and Silverman may over-smooth the intentional Coastal bimodal group.", "stress_test": 9, "stress_test_note": "No brush/zoom/transitions or cross-view dispatch present; hover uses Pointer Events API unifying mouse and touch, and pointermove only mutates two CSS properties—no interaction robustness violations found.", "cognitive_load": 8, "cognitive_load_note": "Six-group raincloud with dual color+pattern encoding is well-managed: 6 hues stay within perceptual limits, the three-layer anatomy (KDE, box, strip) is clearly separated vertically within each row, and the legend is compact and self-explanatory — the main friction is that the box plot whisker line sits very close to the jitter strip, making the two layers slightly hard to parse at a glance without the anatomy key.", "composite": 8.2}, "54-textured-treemap": {"render": true, "visual_critic": 7, "visual_critic_note": "Ambitious bivariate encoding with a deliberately chosen Tol palette and well-implemented pattern-density legend, but the subcategory pattern key is misleading (each subcategory index maps to the same pattern across all categories, not one pattern per named subcategory), and the dense pattern overlay on small cells creates visual noise that obscures rather than encodes growth.", "encoding_integrity": 7, "encoding_integrity_note": "Area encoding is correct (d3.hierarchy sum with data-driven domains), no baseline or radius deception, but pattern density is a perceptually weak quantitative channel for growth rate and no key functions are used in data joins (acceptable for this static render).", "stress_test": 9, "stress_test_note": "Static treemap with pointer-unified tooltips only — no brush, zoom, transitions, or cross-view dispatchers exist, so all five interaction stress-test criteria are cleanly satisfied; the sole minor nit is that pointermove repositions the tooltip via inline style on every event without RAF, but this is CSS-only and trivially cheap.", "cognitive_load": 5, "cognitive_load_note": "Color encoding (6 categories) works and the treemap layout is clean, but superimposing two pattern channels — shape (subcategory) and density/spacing (growth rate) — on top of hue forces the viewer to simultaneously decode four visual variables (area, color, pattern type, pattern spacing), and the density channel is perceptually too weak to read without hovering on every cell.", "composite": 6.9}, "55-webgl-million-scatter": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "56-webgl-force-galaxy": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "60-webgl-animated-treemap": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol palette with clear sector color harmony and clean typographic hierarchy, but the dense 5,000-leaf layout makes individual cells nearly indistinguishable at resting size, and the sector labels crowd the top edge with little breathing room.", "encoding_integrity": 8, "encoding_integrity_note": "Area encoding is correct (treemap area proportional to value via data-driven .sum()), leaf identity tracked by data reference for animation, categorical color only, clean metric toggle avoids dual-axis fabrication, but WebGL context-loss recovery is unimplemented and synthetic hardcoded dimensions cap the score.", "stress_test": 7, "flags": ["Update Storm - unthrottled O(N) pointermove scan"], "stress_test_note": "The pointermove handler performs an unthrottled O(5000) linear scan on every mouse move with no RAF coalescing; mid-flight animation handoff, stale closure, and mouse/touch concerns are all handled correctly via the custom RAF loop and Pointer Events API.", "cognitive_load": 7, "cognitive_load_note": "10 sectors color-coded with a restrained 7-color Tol palette and clear group labels manage 5,000 leaves well, but animation quality — the primary cognitive-load claim — cannot be assessed from a static screenshot, and the hairline white gaps between tiny leaves create visual noise that makes individual cells unreadable without hovering.", "composite": 7.2}, "61-progressive-crossfilter": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "63-semantic-zoom-distributions": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Tol palette, smooth contour blues, and a well-conceived LOD badge make this feel designed, but the absent axis labels and near-invisible bottom/right margins leave the data floating without context.", "encoding_integrity": 7, "encoding_integrity_note": "Structurally honest: data-driven scale domains via d3.extent, correct key function on point joins (d => d.id), zoom-rescaled axes; main weaknesses are hardcoded KDE bandwidth (25px) and no contour color legend, but semantic LOD transitions mitigate bandwidth concerns.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "RAF coalescing, pointer-event unification, and rescaleX usage are all correct, but drawPoints starts enter/exit transitions without calling .interrupt() first, so rapid zoom gestures during mode transitions can leave elements mid-flight with conflicting r animations.", "cognitive_load": 8, "cognitive_load_note": "Single-view, monochromatic contour rendering at default zoom is clean and uncluttered; semantic zoom with hysteresis manages 2000 points across 3 LOD states well, but cluster identity is invisible in contour mode and hex/point interaction quality cannot be assessed from the static screenshot.", "composite": 7.2}, "68-animated-sparkline-table": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberately designed dashboard with a restrained TOL palette, clear typographic hierarchy (bold server names, monospace numerals, uppercased muted headers), and satisfying staggered sparkline animation — held back from a 9 by the cramped sparkline cells (80×18px) making CPU and memory lines hard to distinguish at a glance, and the KPI mini-charts being too small to read detail.", "encoding_integrity": 6, "encoding_integrity_note": "Spark-area KPI uses d3.extent (non-zero baseline) for an area chart — a truncated baseline violation — while table sparklines are structurally honest with data-driven or appropriately fixed [0,100] domains.", "stress_test": 8, "flags": ["Mid-Flight Snap (sort path)"], "stress_test_note": "The replay button correctly calls .interrupt() before re-animating, but renderTable(false) triggered by column sort does not interrupt in-flight clip-rect transitions before tearing down and rebuilding the DOM, leaving staggered reveal transitions running on detached nodes during the ~720ms initial animation window; no update storms, infinite loops, stale closures, or mouse-touch conflicts were found.", "cognitive_load": 8, "cognitive_load_note": "Well-managed cognitive load: 3-color sparkline encoding is consistent across 18 rows, staggered wipe animation (54 targets, 40ms row delay) aids object constancy rather than creating noise, and KPI cards establish a clear summary-to-detail hierarchy — the only weakness is the 80×18px sparklines are near minimum readable size and the win/loss KPI card lacks enough context to interpret without the legend label.", "composite": 7.5}, "70-gantt-edge-bundle": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol palette, restrained phase backgrounds, and clear typographic hierarchy (bold title → muted subtitle → quiet axis ticks → tiny task labels) give the chart real design intention, but the task labels at 9px are borderline unreadable at full render size and the dependency edges are nearly invisible at rest (0.25 opacity grey), making the chart's defining feature invisible until hover.", "encoding_integrity": 8, "encoding_integrity_note": "Fully data-driven domains (d3.min/max), key function on bar join, appropriate time-axis (no zero-baseline obligation), and correct area encoding; only minor issue is the 4px minimum bar width that slightly overstates very short tasks.", "stress_test": 8, "flags": ["Mid-Flight Snap (pointerenter starts transitions without .interrupt(), relying on D3 supersession rather than explicit cancellation)"], "stress_test_note": "Interaction is largely robust — pointer events unify mouse/touch, pointermove only repositions tooltip with no DOM mutations, and pointerleave correctly calls .interrupt() before re-transitioning, but pointerenter lacks a matching .interrupt() call which could produce visual glitches on rapid successive hovers.", "cognitive_load": 8, "cognitive_load_note": "50-task Gantt with 4-color TOL palette and edge bundling managed well — edges hidden at rest (0.25 opacity) and revealed on hover prevents spaghetti overload, but 9px labels in a 200px margin are near the legibility floor.", "composite": 7.7}, "75-flame-chart-profile": {"render": true, "visual_critic": 6, "visual_critic_note": "Functional flame chart with a deliberate Tol-palette and canvas LOD rendering, but the visualization occupies only the top third of the viewport with a large empty void below, and the dense initial view renders most frames as unreadable pixel-thin slivers with no visual hierarchy.", "encoding_integrity": 7, "encoding_integrity_note": "Width correctly encodes duration via d3.partition proportional subdivision, but the time axis domain is hardcoded to [0,10000] matching synthetic root time, making it brittle with real data; children are sorted by value rather than call order, which alters temporal semantics but is not an active deception.", "stress_test": 7, "flags": ["Unthrottled tooltip DOM mutation on pointermove (findNode O(n) + .html() run at raw mousemove rate, only canvas redraw is rAF-coalesced)", "No .interrupt() before zoomToNode transitions (D3 auto-interrupts unnamed transitions, but rapid multi-click during 500ms ease can still cause mid-flight snap)", "No zoom .filter() guard for pinch/scroll conflict on mobile (ctrlKey+wheel reaches browser zoom instead of d3-zoom)"], "stress_test_note": "Canvas redraw is correctly rAF-throttled and hover-delta-gated, but tooltip DOM writes and O(n) hit-detection run unthrottled on every pointermove, and missing .interrupt() + zoom filter leave mid-flight snap and touch-jitter vectors open.", "cognitive_load": 8, "cognitive_load_note": "Well-executed flame chart with 855 frames across 8 modules — LOD system, canvas culling, and click-to-zoom keep cognitive load managed; the dense upper rows at default zoom are intentionally detail-deferred, not a failure, and the 8-color palette sits at the ceiling but remains distinguishable in wide frames.", "composite": 7.0}, "76-treemap-sparkline-dashboard": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberate TOL palette with per-division color harmony, sparklines inside treemap cells, and a well-structured KPI strip create a genuinely designed dashboard — held back from 9 by the very small leaf labels (8-9px) that strain readability at render size and the heavy categorical color saturation that leaves little visual rest.", "encoding_integrity": 7, "encoding_integrity_note": "Treemap area encoding is honest and data-driven, but sparkline area fills use d3.extent() Y-domains (non-zero baseline) making the filled area represent deviation from minimum rather than from zero, a minor but real encoding violation.", "stress_test": 6, "flags": ["Update Storm (unthrottled ResizeObserver → full SVG teardown/rebuild on every width change, no RAF or debounce)"], "stress_test_note": "Resize fires a complete DOM reconstruction for 100+ nodes without debouncing; all other checks pass — pointer events unify mouse/touch, no transitions mean no mid-flight conflicts, no cross-view dispatch means no feedback loops, and scales are freshly created inside render() so no stale closures.", "cognitive_load": 7, "cognitive_load_note": "Five-color division grouping successfully organizes 100 leaf cells into scannable regions, but many smaller cells degrade to name-only or color-only, making cross-division product comparison impossible without tooltip interaction.", "composite": 7.1}, "77-sunburst-breadcrumb-brush": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed with a colorblind-safe Tol palette, depth-adjusted HCL lightness, confident whitespace in the sidebar, and a clear typographic hierarchy — but outer-ring leaf labels are nearly unreadable at 9px and truncated names like 'Beverag…' undercut an otherwise polished layout.", "encoding_integrity": 7, "encoding_integrity_note": "Angular-area encoding is proportionally correct via d3.partition().sum(), data-driven domains with no hardcoded values, and the brush correctly maps leaf midpoint angles to selection — but no key functions in .data(descendants) and synthetic data prevent a higher score.", "stress_test": 8, "flags": ["Touch Jitter (no multi-touch filter)"], "stress_test_note": "RAF coalescing and cancelAnimationFrame are correctly applied to the brush pointermove; .interrupt() is called before each zoom transition; no cross-view dispatch loop; only gap is the absence of a multi-touch filter on the brush overlay, leaving pinch-zoom and two-finger gestures able to start a conflicting brush drag on mobile.", "cognitive_load": 7, "cognitive_load_note": "Six-color depth-lightened encoding and zoom+brush interaction manage 136 leaves well, but the outer leaf ring has dozens of slices too thin to label or click without zooming first, creating friction before the interaction pays off.", "composite": 7.2}, "78-expandable-edge-bundle": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "79-reduced-motion-dashboard": {"render": true, "visual_critic": 6, "visual_critic_note": "Competent crossfilter dashboard with a thoughtful Tol colorblind-safe palette and ghost-bar context, but the line chart is an illegible tangle of overlapping colored spikes and the scatter plot devolves into a confetti cloud with no discernible pattern — both panels fail the 'can the viewer extract the data?' test at a glance.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baselines, data-driven domains, and key functions are all correct, but missing category-month values are filled with 0 (|| 0) rather than handled via line.defined(), creating false zero-revenue valleys in the line chart instead of honest gaps.", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "The brush listener fires on every mousemove and unconditionally calls renderBar+renderLine+renderScatter with full data joins and transitions—no RAF, dirty flag, or throttle; additionally no .interrupt() is called before any transition, leaving mid-flight snaps unguarded.", "cognitive_load": 6, "cognitive_load_note": "Bar chart and crossfilter logic are clean, but the line chart renders all 6 categories simultaneously at full opacity creating a spaghetti tangle, and the scatter has no visible legend making color-to-category matching impossible without hovering.", "composite": 5.8}, "80-container-query-chart": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed tech demo with intentional TOL palette, responsive degradation hierarchy (full→sparkline→KPI), and satisfying linked highlighting — held back from 8 by the simplified-mode bottom legend clipping at the SVG edge and the 'SIMPLIFIED' badge appearing on three panels without visual differentiation between them.", "encoding_integrity": 8, "encoding_integrity_note": "Scatter plot with data-driven domains (d3.extent + nice), correct key function (d => d.id), uniform fixed-radius dots (no size encoding to deceive), properly computed OLS regression — no baseline, lie-factor, or dual-axis violations; synthetic data and a non-zero Y baseline (acceptable for scatter) keep it from 9.", "stress_test": 6, "flags": ["Update Storm (ResizeObserver unthrottled)", "Update Storm (updateAllHighlights unthrottled on pointerenter)"], "stress_test_note": "ResizeObserver triggers a full SVG teardown-and-rebuild on every resize tick across all 6 panels without debouncing or RAF coalescing; updateAllHighlights also mutates 360 DOM attributes synchronously on each voronoi cell crossing with no requestAnimationFrame guard, though the use of pointer events (not mouse+touch duplication), absence of d3.dispatch cross-view loops, no transitions, and fresh-closure scales on each renderChart call means the remaining four stress-test criteria are cleanly satisfied.", "cognitive_load": 8, "cognitive_load_note": "Six panels are one conceptual unit demonstrating responsive breakpoints, not independent views — cognitive load is low, 5-color Tol palette is restrained, and progressive simplification (full→simplified→sparkline→KPI) is itself the message; linked hover highlighting across panels cannot be fully evaluated from a static screenshot.", "composite": 7.3}, "81-letter-value-table-toggle": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "82-hive-plot-accessible": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol colorblind-safe palette, generous whitespace, and clear typographic hierarchy in the side panel elevate it above generic, but nodes collapse into a single-file line along each axis (activity mapped to radius, not angular spread) making the hive structure feel cramped and hard to read at a glance.", "encoding_integrity": 7, "encoding_integrity_note": "Correct scaleSqrt for node area encoding and data-driven sizeScale domain, but rScale hardcodes domain [0,100] making it brittle to out-of-range activity values under scaling/shift transformations.", "stress_test": 9, "stress_test_note": "No brush/zoom update storms, no dispatch feedback loops, no stale scale closures (positions are pre-computed), no transitions so no mid-flight snap, and unified Pointer Events API prevents mouse-touch fight; only minor issue is pointerdown cascades through svgEl.focus() causing drawFocusRing and announce to fire twice per click, but debouncing absorbs the announce duplicate.", "cognitive_load": 8, "cognitive_load_note": "3-color Tol palette, 0.18 edge opacity, and single-view tripartite layout keep 80 nodes and ~142 edges perceptually manageable; interaction-driven highlight on selection prevents spaghetti overload, though animation quality can't be assessed statically.", "composite": 7.7}, "83-community-detection-table": {"render": true, "visual_critic": 7, "visual_critic_note": "Colorblind-safe Tol palette, clean split-panel layout, and subtle bar fills show genuine design intentionality, but the table's Community column is redundant given the grouped headers, and the muted hull opacity makes community boundaries hard to read at a glance.", "encoding_integrity": 8, "encoding_integrity_note": "scaleSqrt used correctly for node radius, betweenness bar scale has a data-driven zero baseline, node joins use key functions, and no dual-axis or baseline violations are present; minor dead branch in sort comparator has no encoding effect.", "stress_test": 6, "flags": ["Mid-Flight Snap: highlightNode, highlightCommunity, and clear handlers start 200-250ms transitions without calling .interrupt() first — rapid clicks cause jumping/NaN attributes", "Update Storm: drawHulls() on every simulation tick destroys and recreates all 5 hull <path> elements via .remove() + append rather than using a keyed data join, running at ~60fps during drag with no RAF coalescing"], "stress_test_note": "Two violations: missing .interrupt() before all cross-view transitions invites mid-flight snapping on rapid interaction, and the per-tick hull destroy/recreate pattern is an update storm during active drag; no brush/zoom, no infinite dispatch loop, and unified pointer events are all clean.", "cognitive_load": 8, "cognitive_load_note": "Five well-separated clusters with hull outlines and a restrained 5-color Tol palette make the 100-node network readable at a glance; the linked table adds numeric precision without competing for attention, and the 250ms highlight transitions are congruent — drag-reheating the simulation is the only minor perceptual disruption that can't be fully assessed from a static screenshot.", "composite": 7.3}, "86-block-skill-matrix": {"render": true, "visual_critic": 6, "visual_critic_note": "Dark theme with a Nord-inspired palette shows color intentionality, but the matrix renders too small to read row labels or cell details without zooming, and the column labels (rotated skill names) collide into an illegible fan at the top.", "encoding_integrity": 7, "encoding_integrity_note": "Honest nominal encoding (presence/absence + categorical color, no area or baseline violations), data-driven scale domains, key function on cell join — but g.selectAll('*').remove() on every sort defeats object constancy, and categoryColors has a duplicate 'Making it legible' key (harmless but sloppy).", "stress_test": 7, "flags": ["pointerenter-mass-update", "render-full-dom-nuke-on-sort"], "stress_test_note": "No continuous-event storms (no brush/drag listeners), no stale closures, and pointer events avoid mouse-touch fights, but pointerenter synchronously updates opacity on all ~315 cells plus all axis labels without RAF coalescing, and sort changes nuke/rebuild the entire DOM via g.selectAll('*').remove() rather than using keyed data joins with transitions.", "cognitive_load": 7, "cognitive_load_note": "Well-executed adjacency matrix — 7-color categorical palette stays manageable, hover row/column highlighting plus zoom/pan directly address the density of 105×26 cells, but the default fit-to-screen view compresses row labels and diagonal skill headers to near-illegibility, making interaction non-optional rather than supplementary.", "composite": 6.7}, "87-skill-anatomy-treemap": {"render": true, "visual_critic": 3, "visual_critic_note": "Category labels are readable and correctly colored, but the leaf fills — darkened variants of already-dark palette colors like #332288 and #117733 — are nearly indistinguishable from the #1a1a2e background, making the primary color-to-category encoding functionally broken.", "encoding_integrity": 8, "encoding_integrity_note": "Treemap correctly encodes area proportional to line counts via data-driven .sum(d => d.lines) with no hardcoded domains, no radius deception, and an honest subtitle ('Area ∝ lines'); minor: secondary color-lightness encoding within categories is redundant but not deceptive, and fixed SVG width/height are acceptable for a viewBox layout.", "stress_test": 9, "stress_test_note": "Static treemap with pointer-event unified hover; no brush/zoom storms, no cross-view dispatch, no transitions to interrupt, and no mouse-touch fight — the sole minor gap is pointermove updating tooltip position on every event without RAF, but the operation is CSS-only and trivially cheap.", "cognitive_load": 5, "cognitive_load_note": "Category grouping and layout are clear, but darkening an already-dark palette (e.g. #332288 darker(0.8)) renders most cells near-black, collapsing within-category differentiation and hiding the lightness-encodes-size signal almost entirely.", "composite": 6.0}, "89-score-ridge-plot": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Tol Bright palette, clear typographic hierarchy, staggered entrance animation, and restrained data-ink all show design craft, but the legend clips 'After calibratio[n]' at the right edge — a concrete layout bug that caps the score.", "encoding_integrity": 8, "encoding_integrity_note": "Honest ridge plot: areas start from zero baseline, global maxDensity scale makes row heights comparable, x-domain [0,100] is appropriate for score data, and yDensity uses data-driven d3.max — minor concern is KDE bandwidth 6 smoothing the mixture-model skew in 'before' distributions, but bimodality remains visible in the output.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "The toggle button fires 600ms transitions without calling .interrupt() first, so rapid click coverage-heatmap": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "92-score-delta-waterfall": {"render": true, "visual_critic": 7, "visual_critic_note": "CVD-safe Tol palette, clean typographic hierarchy, and a dashed separator above the net bar show real design intent, but several annotation leader lines collide with bar labels (e.g. 'Leader line overlap penalty' note crowds the -3.1 label) and the right margin is too tight for the longer annotation text overflowing at 'Lightness ramp corrected'.", "encoding_integrity": 8, "encoding_integrity_note": "Waterfall encoding is structurally honest — data-driven x domain via d3.extent, correct bar positioning from cumulative start/end values, explicit zero baseline line, and CVD-safe Tol palette — minor deduction for absent key functions in data joins and fixed-offset annotation text that could overlap on different data.", "stress_test": 9, "stress_test_note": "Fully static chart with no brush, zoom, drag, touch, or transition handlers — all five interaction failure modes are structurally impossible.", "cognitive_load": 8, "cognitive_load_note": "Clean waterfall with only 3 categorical colors, inline value labels, and sparse annotations — cognitive load is well-managed for 12 criteria; the one weak spot is annotation leader lines that occasionally crowd bar edges at negative deltas.", "composite": 7.9}, "94-election-swing-map": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "96-regional-parcoords-grid": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate dark palette with four distinct per-region accent colors, canvas+SVG layering for performant brushing, and clean panel layout — held back from an 8 by cramped axis labels that overlap at this panel size and a subtitle that's nearly invisible at rendered scale.", "encoding_integrity"
