render": true, "visual_critic": 7, "visual_critic_note": "Dark-themed particle demo with deliberate GitHub-palette UI, satisfying glow/connector interaction feedback, and clean legend — slightly undermined by the static screenshot showing dense overlapping clusters that blur together without the mouse interaction active.", "encoding_integrity": 8, "encoding_integrity_note": "No quantitative size encoding avoids lie factor; position and color are the only channels and both are correct; hardcoded N=5000 is a demo constant, not a domain clamp, and quadtree rebuilds from data on every zoom so scaling/subset relations hold.", "stress_test": 6, "flags": ["Update Storm"], "stress_test_note": "mousemove and zoom handlers synchronously call rebuildScreenPoints(), kNearest(), and draw() on every event with no RAF coalescing or dirty-flag deferral, iterating 5000 canvas points at 60fps; the voronoiDirty flag is a positive pattern but the core render loop is unthrottled.", "cognitive_load": 8, "cognitive_load_note": "5,000 points across 8 well-separated clusters with a restrained dark palette; the nearest-neighbor highlight with glow and connector lines gives clear interactive focus, though 8 categorical colors is at the warning threshold and the Voronoi overlay could add visual noise if enabled simultaneously.", "composite": 7.3}, "41-force-bundling-chord-triptych": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed dark-theme triptych with cohesive 5-color palette, clean panel divisions, and intentional cross-panel linking — held back from 8 by the radial panel's cramped, rotated node labels that are difficult to read at this size.", "encoding_integrity": 7, "encoding_integrity_note": "Relational/topological charts with no bar/area baseline violations; chord correctly uses proportional arc angles and data-driven matrix, but cross-panel highlight maps node hover to group-level ribbons (overstating connections) and link stroke-width uses linear scaling for value rather than a perceptually correct channel.", "stress_test": 7, "flags": ["Mouse-Touch Fight", "dispatch_missing_source_guard"], "stress_test_note": "Hover correctly uses mouseenter (no update storm or stale-scale risk), no D3 transitions so no mid-flight snap, and no feedback loop; however drag on force nodes has no touch-event filter and the dispatch omits a source parameter, leaving a theoretical re-entry path if handlers were ever extended.", "cognitive_load": 7, "cognitive_load_note": "Three linked panels with 40 nodes and 5 categories stay within working memory limits; the dim-on-hover interaction elegantly manages cross-panel complexity, though the radial bundling center shows noticeable tangle for cross-group edges that can't be fully assessed without live interaction.", "composite": 7.0}, "47-mixed-scale-parcoords": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark-theme parallel coordinates with intentional color palette, canvas/SVG hybrid for performance, good typographic hierarchy with scale-type badges, and satisfying brush interaction — slightly generic categorical colors prevent it from reaching 8.", "encoding_integrity": 8, "encoding_integrity_note": "Data-driven domains via d3.extent throughout, appropriate log scale for salary with clearly labeled scale-type badges per axis, and canvas rendering avoids DOM join key-function concerns — structurally honest with no baseline, lie-factor, or dual-axis fabrication issues.", "stress_test": 6, "flags": ["update_storm", "touch_jitter"], "stress_test_note": "Brush handler calls draw() synchronously on every mousemove without RAF or debouncing, re-rendering 300 canvas polylines per frame; no touch event filtering on the brush.", "cognitive_load": 6, "cognitive_load_note": "300 lines at 0.62 opacity on canvas keeps active traces readable, but convergence at the two ordinal axes (Department, Performance) creates dense fan patterns that obscure individual paths until brushing is used.", "composite": 6.8}, "49-textured-network-diagram": {"render": true, "visual_critic": 6, "visual_critic_note": "Thoughtful dual-encoding concept (color + texture for accessibility) with a cohesive dark palette, but the force layout leaves the cluster off-center in the lower viewport with large dead space above, and the rightmost legend item (Zeta) is visually clipped.", "encoding_integrity": 8, "encoding_integrity_note": "Categorical encoding (community → color + texture) is honest with no quantitative distortion — all nodes use fixed uniform radius (no lie factor), redundant dual-channel encoding supports accessibility, force center is dynamic, but no key functions on data joins and hardcoded simulation distances are minor robustness gaps.", "stress_test": 8, "flags": ["Mouse-Touch Fight"], "stress_test_note": "No D3 transitions, no brush events, and no cross-view dispatch—interaction surface is minimal and clean—but the zoom handler lacks a `.filter()` to prevent simultaneous touch-drag and pinch-zoom conflicts on mobile.", "cognitive_load": 7, "cognitive_load_note": "6 communities with dual color+texture encoding are distinguishable at a glance, but 50 nodes packed into a dense central cluster with no visible community separation makes community membership hard to parse without hovering.", "composite": 7.2}, "51-accessible-force-network": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark-mode GitHub-inspired palette with clear community color coding and thoughtful focus/selection states, but the network edges are nearly invisible against the background and the bottom data table is cut off, leaving the layout feeling incomplete at render size.", "encoding_integrity": 7, "encoding_integrity_note": "Node radius is encoded linearly (r = 4 + degree/maxDeg * 5.5) rather than with scaleSqrt, introducing a mild area lie factor, but maxDeg is correctly data-driven and no baseline, dual-axis, or gap-handling issues apply to this chart type.", "stress_test": 8, "flags": ["Update Storm"], "stress_test_note": "The mousemove listener runs an unthrottled O(n) linear hitTest scan over all 150 nodes on every event to update cursor style, but no brush/zoom storms, no D3 transitions (eliminating mid-flight snap), no cross-view dispatch (no infinite loop risk), and no touch handlers (no mouse-touch fight).", "cognitive_load": 6, "cognitive_load_note": "150 nodes with near-invisible edges at rest keeps the network readable, but two perceptually similar red-orange community colors (Cassini #f78166 / Fenrir #ff7b72) undermine the primary categorical encoding and will be indistinguishable for most viewers.", "composite": 7.0}, "52-accessible-choropleth": {"render": true, "visual_critic": 6, "visual_critic_note": "Clean YlOrRd palette and readable layout work well, but the legend is undersized and unlabeled with actual values, the subtitle doubles as an accessibility disclaimer rather than adding insight, and the overall presentation is functional but unremarkably generic.", "encoding_integrity": 8, "encoding_integrity_note": "Sequential color scale uses data-driven domain (d3.min/d3.max), no quantile trap, table bars correctly encode from zero, and the legend gradient faithfully maps the full data range — minor point that the color domain starts at minVal (2.1%) rather than 0 is acceptable and standard for choropleths.", "stress_test": 7, "flags": ["Update Storm (unthrottled d3.geoContains loop over all features on every mousemove with no RAF/debounce)", "Mouse-Touch Fight (no touch event handling or synthetic-event filtering)"], "stress_test_note": "Hit-testing runs O(n) geo contains on every mousemove without throttling, and the absence of any touch event guards risks double-trigger on mobile; no transitions or cross-view dispatch loops are present.", "cognitive_load": 8, "cognitive_load_note": "Single sequential color scale (YlOrRd) across 51 states reads immediately — high/low regions pop without effort, the legend is minimal and clear, and the info panel surfaces precise values on demand rather than cluttering the map.", "composite": 7.2}, "79-reduced-motion-dashboard": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional dark theme with a restrained monochromatic blue palette and decent typographic hierarchy, but the three charts occupy only the top half of the viewport leaving a large dead zone, and the 'dark dashboard with single blue accent' treatment is a well-worn template rather than a distinctive design choice.", "encoding_integrity": 8, "encoding_integrity_note": "Zero baselines on all bar/histogram charts, data-driven y-domains, scatter Y truncation is acceptable for position-encoded dots, and crossfilter scales correctly stabilize under filtering; minor issue is the hardcoded age X domain [20,67] which could clip out-of-range data.", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "Both brush handlers fire on every mousemove via '.on(\"brush end\", ...)' calling updateAll() (full DOM mutations on all three charts) at 60fps with no debouncing, RAF, or throttling; additionally no .interrupt() is called before new transitions are started, risking mid-flight snaps during rapid brushing.", "cognitive_load": 8, "cognitive_load_note": "3 crossfiltered views with a single monochromatic palette, clear filter pills, and labeled axes keep cognitive load low; the scatter's 400 overlapping dots at small size are the only readability strain.", "composite": 6.6}, "82-hive-plot-accessible": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed dark-theme hive plot with a colorblind-safe palette, clear typographic hierarchy (uppercase tracking on axis labels, muted tick/legend chrome), restrained edges at 0.18 opacity, and a balanced four-corner UI layout — but the chart sits slightly high in the viewport leaving dead space below, and the dense edge bundle at center is visually muddy until hover interaction resolves it.", "encoding_integrity": null, "stress_test": 8, "flags": ["Update Storm (ResizeObserver)"], "stress_test_note": "No brush/zoom/transitions so most traps are N/A; the only issue is the ResizeObserver calling full svg.selectAll('*').remove() + render() on every resize tick without debouncing, which can cause a DOM-rebuild storm during window drag-resize.", "cognitive_load": 7, "cognitive_load_note": "Single-view hive plot with 5 perceptually-distinct colors and low-opacity edges (0.18) manages 80-node/120-edge density well, though the center edge convergence creates a visual blob that obscures individual connection paths without hover interaction.", "composite": null}, "83-community-detection-table": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed dark-theme split-panel with harmonious Tableau palette consistently applied across hulls, nodes, table headers, and bar sparklines, though the force graph clusters in a fraction of the left panel leaving conspicuous dead space at top and bottom.", "encoding_integrity": 8, "encoding_integrity_note": "scaleSqrt used correctly for node-size encoding, betweenness bars are zero-based with data-driven normalization, hull joins use a key function — no lie factor, no truncated baselines, and no silent gaps; node joins lack a key but the visualization is static so no object-constancy violation occurs in practice.", "stress_test": 6, "flags": ["Update Storm"], "stress_test_note": "updateHulls() performs a full D3 data join and hull recomputation on every simulation tick (~60fps) with no requestAnimationFrame coalescing or dirty-flag guard, causing excessive DOM mutations during drag interactions; no brush/zoom stale-closure or infinite-loop risks exist, and no explicit touch event filtering is present but D3 drag handles basics.", "cognitive_load": 8, "cognitive_load_note": "5-color palette and convex hull boundaries keep 100-node force layout readable; graph+table split gives spatial overview plus ranked detail without exceeding working memory limits.", "composite": 7.3}, "87-skill-anatomy-treemap": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark background with deliberate per-category color palette, clear group-label hierarchy, and generous padding give the treemap a polished, intentional feel — held back slightly by some cells truncating to cryptic initials and the rightmost column being clipped ('META · WORKSH…').", "encoding_integrity": 8, "encoding_integrity_note": "Treemap correctly encodes data as proportional area via d3.treemap().sum(d => d.lines), data-driven layout with no hardcoded domains, no baseline or radius-deception issues; minor deductions for synthetic data and missing key functions (mitigated by full re-render on resize).", "stress_test": 7, "flags": ["Update Storm (ResizeObserver calls full svg.selectAll('*').remove() + rebuild on every resize event without debounce/RAF)", "Update Storm (pointermove sets tooltip innerHTML on every mouse move without throttling)"], "stress_test_note": "No zoom/brush/transitions to mishandle, and pointer events avoid mouse-touch fights, but the un-debounced ResizeObserver triggers a complete DOM teardown and rebuild on every resize frame.", "cognitive_load": 8, "cognitive_load_note": "10 categories with perceptually distinct colors, 29 leaf cells, dark group backgrounds cleanly separate sections, and label truncation prevents clutter — the treemap reads as a coherent structure at a glance with no overwhelming density.", "composite": 7.5}, "90-skill-growth-sparklines": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "98-shape-morphing-timeline": {"render": true, "visual_critic": 7, "visual_critic_note": "Cohesive dark theme with monospace typography, restrained blue palette, and a well-designed scrubber control, though the single flat bar color and minimal typographic contrast between title and subtitle keep it from feeling truly polished.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baseline and area fill are correct, but y-domain is hardcoded at [0,110] rather than data-driven via d3.max, and data joins lack key functions — structurally honest but brittle to data changes.", "stress_test": 7, "flags": ["Update Storm - scrubber input handler calls render() directly on every mousemove in parallel with the always-running RAF loop, producing double renders per scrub frame without dirty-flag coalescing"], "stress_test_note": "No D3 transitions are used (manual RAF interpolation eliminates mid-flight snap and stale-closure risks), but the scrubber input event fires render() unthrottled alongside the perpetual RAF loop, doubling DOM mutations during scrubbing.", "cognitive_load": 8, "cognitive_load_note": "Single view with one color and a clear sequential morph sequence keeps cognitive load very low; the scrubber labels and type badge orient the viewer throughout, though animation quality cannot be fully assessed from a static screenshot.", "composite": 7.2}, "100-city-similarity-explorer": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}}}, {"timestamp": "2026-03-30T02:20:57", "git_sha": "20c4ed4", "skill_shas": {"visual_critic": "663cdf2", "encoding_integrity": "663cdf2", "stress_test": "663cdf2", "cognitive_load": "663cdf2"}, "block_set": "v2-claude-sonnet-4-6", "model": "claude-sonnet-4-6", "cli_version": "2.1.87 (Claude Code)", "blocks": {"05-crossfilter-flight-explorer": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional GitHub-dark palette with restrained single-accent blue, smart ghost-bar technique, and clear typographic hierarchy (uppercase tracking labels, quiet axis ticks), but the charts occupy only the top ~45% of the viewport, leaving a large empty void that makes the layout feel unfinished.", "encoding_integrity": 8, "encoding_integrity_note": "Histograms use zero baseline, Y domain derived from data via d3.max, ghost-bar crossfilter pattern correctly anchors scale during filtering, and uniform bin thresholds are semantically appropriate; only minor issue is hardcoded X domains that would not adapt to different data ranges.", "stress_test": 3, "flags": ["Update Storm", "Infinite Feedback Loop (partial)", "Stale Closure"], "stress_test_note": "Every brush mousemove fires updateAll() which filters 2000 records and rebins+repaints all 3 charts with no RAF/debounce; the source parameter is accepted but never used to guard cross-view updates; reset calls brush.move on each chart re-triggering the brush handler 3 extra times; x/y scales are closed over with no resize handler so they go stale on window resize.", "cognitive_load": 9, "cognitive_load_note": "3 linked histograms with a single monochrome palette, ghost bars for context, and a clear flight-count counter keep cognitive load minimal — the classic crossfilter pattern executed cleanly with no excess complexity.", "composite": 6.7}, "08-small-multiples-seasonal": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed dark-theme small multiples with harmonious blue/salmon/green palette, axes only on left column and bottom row, and subtly restrained gridlines — but the shared y-scale leaves spring/fall panels with flat lines hugging the bottom, and the 1.4px lines feel thin at rendered size.", "encoding_integrity": 7, "encoding_integrity_note": "Shared y-scale with zero baseline and data-driven domain is correct for cross-panel comparison, but xScale is hardcoded [1,31] for all months regardless of actual month length, causing Feb/Apr/Jun/Sep/Nov to have trailing whitespace and breaking the subset robustness invariant.", "stress_test": 7, "flags": ["Update Storm"], "stress_test_note": "The pointermove handler synchronously updates 12 crosshair elements, 3 dot markers, and tooltip innerHTML on every mousemove with no RAF coalescing or dirty-flag throttle; all other criteria (no transitions to interrupt, static scales, pointer events unify mouse/touch, no cross-view dispatch) are clean.", "cognitive_load": 8, "cognitive_load_note": "12 panels, 3 visually distinct year lines (color + dash), shared scales, and a calendar layout make cross-panel comparison easy; crosshair broadcasting across all panels works at this count but dot markers only appear on the hovered panel, slightly limiting the cross-month read.", "composite": 7.2}, "11-zoomable-treemap": {"render": true, "visual_critic": 7, "visual_critic_note": "Hand-picked palette with depth-driven opacity and a coherent dark IDE aesthetic show real design intent, but many leaf cells are too small to read without zooming, limiting immediate data legibility.", "encoding_integrity": 8, "encoding_integrity_note": "Treemap area encoding is correctly proportional to file size via data-driven `root.sum(d => d.size || 0)`, zoom correctly remaps scale domains to focused node bounds, and no deceptive encoding choices (no radius scaling, no truncated baseline, no dual-axis); minor: no key functions in data join but irrelevant for this static single-render pattern.", "stress_test": 6, "flags": ["Mid-Flight Snap", "Stale Closure"], "stress_test_note": "zoomTo() mutates x/y scale domains synchronously before starting a 720ms transition with no .interrupt() call, so rapid clicks cause in-flight transition callbacks to immediately use the new domain, producing coordinate jumps; no brush/touch/feedback-loop issues exist.", "cognitive_load": 8, "cognitive_load_note": "8-hue palette is at the warning threshold but works as spatial territory markers rather than lookup, zoom interaction with label culling and breadcrumb navigation cleanly manages the ~400-node density, though the root view has many unreadable micro-cells that require drilling to resolve.", "composite": 7.3}, "17-chord-diagram-trade": {"render": true, "visual_critic": 4, "visual_critic_note": "The screenshot captures the animation mid-flight — chord ribbons (the entire data encoding) are invisible, and the diagram is vertically cropped; the visible arcs show good Tableau10 color choices and typographic hierarchy, but the visualization is functionally broken as captured.", "encoding_integrity": 8, "encoding_integrity_note": "Chord layout correctly derives all angular extents from the matrix (no hardcoded domains), ribbon widths and arc lengths are proportionally honest, tick marks use correct angular interpolation, and tooltip aggregations (row/column sums) are mathematically accurate; no key functions in joins is a minor robustness gap but irrelevant for this static chart.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "highlight() and reset() call .transition() without .interrupt() on arcPaths/ribbonPaths/labels, so hovering during the ~1.6s staggered entrance animation (named 'arcs'/'ribbons') creates conflicting unnamed transitions that can cause jumping or NaN attributes; no brush/zoom means Update Storm, Stale Scale, and Infinite Loop checks are N/A; touch-vs-mouse is low risk given no drag interactions.", "cognitive_load": 7, "cognitive_load_note": "10-color Tableau10 palette hits the warning threshold but hover-to-isolate interaction effectively manages ribbon density (90 chords); screenshot captured before ribbons rendered so full density assessment is limited to structural analysis.", "composite": 6.4}, "23-hex-bin-map": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate plasma palette on dark background with sqrt-compressed color scale creates clear density gradients; state borders are appropriately quiet but the data-note text (#3d4155) is nearly invisible against the background.", "encoding_integrity": 7, "encoding_integrity_note": "Color encoding is honest (data-driven maxCount, uniform hex size, appropriate sqrt-power compression for skewed density), but the 20-bucket linear quantization used for rendering is not reflected in the continuous legend gradient, creating a minor mismatch between display and legend.", "stress_test": 6, "flags": ["Update Storm (slider `input` calls full `drawHexes` re-projection of 20k points on every tick without RAF or debounce)", "Update Storm (ResizeObserver fires `redraw` including border re-draw on every resize frame without debounce)"], "stress_test_note": "No transitions or cross-view dispatch to worry about, but the slider input and ResizeObserver both trigger expensive full canvas re-renders synchronously without coalescing.", "cognitive_load": 8, "cognitive_load_note": "Single-view hex-bin map with a sequential plasma scale and one labeled slider control — minimal working memory demand, clear density clusters visible at a glance, and no categorical color overload.", "composite": 7.1}, "35-color-palette-explorer": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed tool with clever contrast matrix (ratio text rendered in the actual foreground color), solid typographic hierarchy via small-caps panel titles, and polished palette switcher buttons — held from 8 by some cells where low-contrast ratios make the ratio numbers themselves illegible, which is ironic but still a readability issue.", "encoding_integrity": 7, "encoding_integrity_note": "Bar chart correctly uses zero baseline (domain [0,100]) and key functions (.data(data, d => d.label)), but the x-scale domain is hardcoded to 100 rather than data-driven via d3.max, making it brittle under the scaling metamorphic transform.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "Bar chart transitions (500ms enter, 400ms update) lack .interrupt() calls before new transitions, so rapid palette switching causes mid-flight snapping; no brush/zoom means Update Storm, Stale Closure, and Infinite Loop checks are not applicable, and Mouse-Touch Fight is minimal (click-only UI).", "cognitive_load": 8, "cognitive_load_note": "Three coordinated views (bar chart, contrast matrix, CVD strips) form a coherent conceptual unit with clear labeling and restrained layout; the 7×7 contrast matrix is dense but purpose-built for ratio lookup, not pattern reading.", "composite": 7.2}, "41-force-bundling-chord-triptych": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed dark-theme triptych with coordinated 5-color palette and consistent visual language across all three panels; radial bundling labels are too small/dense to read comfortably and chord ribbons at 0.2 opacity barely distinguish cross-group flows.", "encoding_integrity": 7, "encoding_integrity_note": "No quantitative encoding violations (chord arcs correctly scale with connection counts, fixed-size nodes don't misrepresent data, no truncated baselines); minor imprecision in chord tooltip where cross-group edges are symmetrically double-counted into each group's 'total connections' label, which is standard but undisclosed convention.", "stress_test": 6, "flags": ["Update Storm (resize)", "Mouse-Touch Fight"], "stress_test_note": "Un-throttled resize handler fully rebuilds all three panels on every pixel of resize (full DOM teardown+rebuild with no debounce/RAF), and hover interactions use only mouse events with no touch disambiguation or event.preventDefault() guard.", "cognitive_load": 7, "cognitive_load_note": "Three well-coordinated panels with a 5-color palette and cross-panel highlighting keep cognitive load manageable, but the radial bundling center creates a visible tangle and 40 node labels at 9px crowd the ring — interaction is essential for disambiguation.", "composite": 6.8}, "47-mixed-scale-parcoords": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark navy background with Tableau10 categorical palette creates strong visual hierarchy and readable parallel coordinates, though line density at 0.32 alpha causes the unfiltered view to look murky and the scale-badge annotations feel visually underdeveloped.", "encoding_integrity": 8, "encoding_integrity_note": "Mixed scales are clearly badged, domains are data-driven via d3.extent, log scale is appropriate for salary, and axes remain stable during brushing; only minor issue is hardcoded log tick candidates that could leave sparse ticks if salary range shifts significantly.", "stress_test": 5, "flags": ["Update Storm", "Stale Brush Extents on Resize", "ResizeObserver Unthrottled"], "stress_test_note": "Brush fires drawCanvas() (300-line canvas redraw) on every mousemove with no RAF or debounce; ResizeObserver also lacks debounce; brush extents stored in pixel space become stale after resize, silently corrupting filter logic.", "cognitive_load": 7, "cognitive_load_note": "6 axes, 6 Tableau10 colors, and 300 lines at 32% alpha stay within cognitive limits — the ordinal Department/Performance axes create readable fan structure, though the unfiltered line density makes individual path tracing difficult without brushing.", "composite": 6.8}, "49-textured-network-diagram": {"render": true, "visual_critic": 8, "visual_critic_note": "Intentional Julesz texton encoding with harmonious muted palette, clean sidebar hierarchy, and thoughtful grayscale toggle — let down only slightly by the node patterns reading as visually busy at this density.", "encoding_integrity": 8, "encoding_integrity_note": "Categorical-only encoding (community via dual color+texture channels) is honest with no quantitative deception; fixed node radii encode no data; minor robustness gap from missing key functions in node/link data joins but inconsequential for this static dataset.", "stress_test": 6, "flags": ["update_storm", "mouse_touch_fight"], "stress_test_note": "updateHulls() performs a full 6-path DOM join with 5 attribute mutations on every simulation tick (no RAF/dirty-flag), causing an update storm during drag when alphaTarget(0.3) drives rapid ticks; d3.drag() also lacks an event filter to prevent mouse/touch double-trigger on mobile.", "cognitive_load": 8, "cognitive_load_note": "50 nodes with 6 well-separated clusters are immediately readable — dual color+texture encoding, convex hull overlays, and a restrained 6-color palette all manage complexity effectively, though animation quality can't be assessed from the static screenshot.", "composite": 7.6}, "79-reduced-motion-dashboard": {"render": true, "visual_critic": 6, "visual_critic_note": "Dark GitHub-inspired theme and ghost/active crossfilter layering show design intent, but the histogram and revenue charts are flat single-color fills (uniform blue and green), the axis tick labels are nearly invisible (#3d444d on near-black), and a large empty space below the dashboard makes the layout feel unfinished.", "encoding_integrity": 8, "encoding_integrity_note": "All bar charts use zero baselines with data-driven Y domains, scatter uses key functions for object constancy, no size-encoding deception, and crossfilter axes stay fixed during filtering — only minor issue is scatter axes hardcoded to [0,100] (appropriate for this synthetic dataset).", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "The brush 'brush' event calls updateAll() directly on every mousemove with no RAF/debounce, triggering transitions on 300+ scatter circles and all histogram/timeseries bars simultaneously, and none of the update functions call .interrupt() before starting new transitions, causing mid-flight snap on rapid input.", "cognitive_load": 8, "cognitive_load_note": "3-view crossfilter with 5 perceptually distinct colors on a dark background — density in the 300-point scatter is manageable because ghost dots provide context and the layout clearly separates scatter (brush) from histogram/timeseries (click filters), keeping working memory load low.", "composite": 6.6}, "86-block-skill-matrix": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional dark theme with a consistent 7-category color system applied across cells, headers, frequency bars, and legend shows real design thought, but row labels at #667 on #111318 are nearly illegible and the 105-row density makes the matrix unreadable without interaction.", "encoding_integrity": 8, "encoding_integrity_note": "Matrix uses honest binary presence/absence encoding, categorical color, and frequency bars with a data-driven zero-baseline scale (domain([0, d3.max(...)]) ); full redraw pattern sidesteps key-function issues, and no size, dual-axis, or smoothing deceptions are present.", "stress_test": 8, "stress_test_note": "No brush, zoom, or transitions means the five major interaction traps are all avoided; the only minor concern is unguarded touch events on mobile, but with no scroll/zoom conflict the practical risk is negligible.", "cognitive_load": 6, "cognitive_load_note": "7-color category palette and hover highlighting manage the 105×26 matrix well as a single conceptual unit, but 11px cells with 9.5px truncated row labels make individual block identification nearly impossible without hovering, pushing too much work onto interaction for a static read.", "composite": 6.9}, "87-skill-anatomy-treemap": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate dark-theme palette (Tableau 10 with opacity), clean typographic hierarchy, and well-padded treemap layout feel intentional, but category labels at 9px/35% opacity are barely readable in context.", "encoding_integrity": 8, "encoding_integrity_note": "Treemap correctly encodes area proportional to line count via d3.hierarchy().sum(), uses data-driven layout with no hardcoded domains, and categorical color is ordinal — no baseline, lie factor, or dual-axis violations; full DOM teardown on resize makes key functions unnecessary.", "stress_test": 7, "flags": ["Update Storm (ResizeObserver calls full render() with chartEl.innerHTML='' on every resize event, no debounce or RAF)"], "stress_test_note": "No brush/zoom/transitions so most interaction traps are N/A, but the un-debounced ResizeObserver triggers a full SVG teardown and rebuild at resize frequency, which will cause jank during window drag-resize.", "cognitive_load": 8, "cognitive_load_note": "8 categories with perceptually distinct colors, clear group borders and labels, and well-sized leaf cells with inline name+line-count labels keep the treemap readable at a glance; the only friction is a few small cells (e.g. cognitive-load, sharpen-tool) where labels are truncated and size differences between categories are hard to compare precisely.", "composite": 7.5}, "90-skill-growth-sparklines": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberately designed dashboard with a Tableau-10-inspired categorical palette, clear typographic hierarchy, category badges with dot+label encoding, and crisp inline sparklines with area fills — held back from 9 only by the sparklines being quite small (88×26px) and the score mini-bars adding visual noise without much payoff.", "encoding_integrity": 7, "encoding_integrity_note": "Shared-scale mode correctly anchors area fill at zero (domain [0,100]), score bars are properly zero-based, and per-skill domains are data-driven via d3.extent; main weakness is per-skill mode sets area y0 to local minimum minus padding rather than 0, creating a truncated baseline that exaggerates growth magnitude in the area fill.", "stress_test": 9, "stress_test_note": "No brush, zoom, or drag interactions exist; all re-renders fire on discrete click events only, so none of the five interaction traps (update storm, infinite loop, stale closure, mid-flight snap, mouse-touch fight) apply.", "cognitive_load": 8, "cognitive_load_note": "26-row sparkline table with 7 category colors is well-managed: color is encoded redundantly via badges and sparklines, the shared-scale toggle and category filters reduce simultaneous load, and the tabular layout makes row-by-row scanning natural rather than overwhelming.", "composite": 8.0}, "98-shape-morphing-timeline": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed dark-theme demo with a coordinated quarterly palette (blue/green/orange/pink), confident typographic hierarchy, minimal dashed gridlines, and rich interaction (scrubber, play, pills, keyboard, tooltip) — held back from 8 by the vestigial 'bar' morph-label artifact and quarterly color encoding that adds visual noise without encoding information the x-axis labels don't already provide.", "encoding_integrity": 8, "encoding_integrity_note": "Zero baseline correct for bars/area, scaleSqrt used for scatter size encoding, data-driven yScale domain, key functions present on joins; minor robustness gap: no line.defined() guard for missing values in line/area modes.", "stress_test": 5, "flags": ["mid_flight_snap", "update_storm"], "stress_test_note": "animateScrubberTo has no cancel handle so rapid pill clicks spawn concurrent RAF loops fighting applyT simultaneously, and the scrubber input event drives morphRender synchronously on every tick with no RAF coalescing.", "cognitive_load": 7, "cognitive_load_note": "Single view with 4 perceptually distinct quarter colors and clean bar layout reads clearly; main untestable risk is whether the scrubber-driven morphing (bar→line→area→scatter) maintains object constancy in motion, and the scrubber's dual role — controlling both chart-type morph and the month label — conflates two things without visual distinction.", "composite": 6.8}, "100-city-similarity-explorer": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}}}, {"timestamp": "2026-03-30T02:16:37", "git_sha": "20c4ed4", "skill_shas": {"visual_critic": "663cdf2", "encoding_integrity": "663cdf2", "stress_test": "663cdf2", "cognitive_load": "663cdf2"}, "block_set": "v2-gemini-3.1-pro-preview-noskills", "model": "claude-sonnet-4-6", "cli_version": "2.1.87 (Claude Code)", "blocks": {"01-parallel-coords-sparkline-table": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "15-adjacency-matrix-reorder": {"render": true, "visual_critic": 5, "visual_critic_note": "Functional and readable with thoughtful community-color encoding and a useful side bar chart, but schemeCategory10 palette, flat typographic hierarchy, and multicolored row/column labels create visual noise rather than clarity.", "encoding_integrity": 7, "encoding_integrity_note": "Bar chart baseline is zero and degree scale uses d3.max for a data-driven domain, but mouseout resets all cell opacity to 1 rather than restoring the fill-opacity weight encoding, permanently erasing the weight signal after any hover.", "stress_test": 5, "flags": ["Mid-Flight Snap", "Mouse-Touch Fight", "Update Storm"], "stress_test_note": "No .interrupt() before reorder transitions, mouseover force-updates all 1225 cells' opacity on every cell entry, and no touch/mouse event deduplication exists.", "cognitive_load": 6, "cognitive_load_note": "35×35 matrix with 5 community colors is structurally sound and hover highlighting aids reading, but the default Name ordering scatters community colors into visual noise — the viewer must discover the Community sort button to extract any meaningful structure, and the simultaneous opacity-weight encoding adds a second dimension that compounds the initial confusion.", "composite": 5.8}, "16-sankey-energy-flow": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "39-quadtree-hit-detection": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark canvas with Tableau-palette dots, glowing nearest-point highlights, and a clean frosted-glass UI panel make this feel deliberately designed rather than default, though the 8 scattered category colors lack harmony at low density.", "encoding_integrity": 7, "encoding_integrity_note": "No deceptive encoding — position and categorical color are used honestly, particle radius is random aesthetic variation not data encoding, and zoom correctly transforms world coordinates via transform.applyX/Y; docked from top marks only because no quantitative axis encoding is present to audit for baseline/lie-factor issues and domains are hardcoded to synthetic world dimensions.", "stress_test": 4, "flags": ["Update Storm", "Touch Jitter"], "stress_test_note": "Both mousemove and zoom fire full canvas redraws (5000 particles) plus quadtree rebuilds on every event with zero throttling, debouncing, or RAF coalescing; no touch/mouse disambiguation on the D3 zoom+mousemove dual-listener setup risks scroll/zoom fights on mobile.", "cognitive_load": 8, "cognitive_load_note": "Single view with one interaction mode (hover to find 10 nearest), 8-color categorical palette at the warning threshold but interaction dims non-selected points to near-zero, making the active context clear; the main static-screenshot limitation is that the hover-dimming and line-drawing behavior can't be fully assessed without interaction.", "composite": 6.7}, "53-textured-raincloud": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Paul Tol muted palette with redundant texture encoding for colorblind accessibility is genuinely thoughtful, clean card layout and typographic hierarchy are solid, but the chart extends beyond the screenshot viewport leaving groups E and F cut off.", "encoding_integrity": 7, "encoding_integrity_note": "Honest raincloud encoding with data-driven x-domain and per-group KDE normalization (standard practice), but hardcoded KDE bandwidth (2.5) would distort shapes under data rescaling, and the Math.max(0,...) x-domain floor silently clips negative values.", "stress_test": 9, "stress_test_note": "Essentially static visualization with a single button toggle applying a CSS filter; no brush, zoom, cross-view dispatch, D3 transitions, or touch handlers present, so none of the five interaction robustness failure modes apply.", "cognitive_load": 7, "cognitive_load_note": "Six groups with redundant color+pattern encoding are well-managed and the three-layer raincloud (KDE, box, jitter) reads as a cohesive unit, but the chart extends below the viewport requiring scroll to see all groups, breaking at-a-glance comparison.", "composite": 7.4}, "68-animated-sparkline-table": {"render": true, "visual_critic": 7, "visual_critic_note": "Clean dashboard layout with intentional color coding (red for offline), varied sparkline types across KPI cards, and good typographic hierarchy — held back from 8 by the win/loss chart using raw green/red bars without visual calibration and the bullet chart's muted gray ranges blending indistinctly.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baselines are correct on all bar/area charts and domains are data-driven via d3.max, but per-row independent y-scales on table sparklines make cross-row visual magnitude comparison misleading, and no line.defined() guard exists for missing data.", "stress_test": 8, "flags": ["Mid-Flight Snap"], "stress_test_note": "The Replay button calls animateAll() without .interrupt(), so rapid clicks during a running transition snap elements to width=0 immediately while old transitions may still be queued, causing conflicting animation state; no brush/zoom storms, no feedback loops, no stale closures, and no mouse-touch conflicts are present.", "cognitive_load": 8, "cognitive_load_note": "4 KPI cards + 7-row sparkline table with restrained 2-color palette and clear status badges keep cognitive load low; animation is purposeful (left-to-right wipe with stagger) but cannot be fully evaluated from a static screenshot.", "composite": 7.5}, "77-sunburst-breadcrumb-brush": {"render": true, "visual_critic": 5, "visual_critic_note": "Clean sunburst layout with soft card shadows, but the rainbow palette (interpolateRainbow) is generic, the breadcrumb trail only shows 'All Products' at rest with no typographic hierarchy, and the chart is cropped at the bottom—cutting off a full quarter of the visualization.", "encoding_integrity": 7, "encoding_integrity_note": "Angular proportional encoding via d3.partition is mathematically correct and data-driven (no magic domains), but the data join lacks key functions which could cause corruption on dynamic updates, and the brush desaturates only visually without actually filtering the encoded data.", "stress_test": 3, "flags": ["Update Storm", "Mid-Flight Snap", "Stale Closure"], "stress_test_note": "brushed() calls applyDesaturation() on every mousemove with no RAF/throttle, clicked() starts a 750ms transition with no .interrupt() allowing mid-flight conflicts, and concurrent brush drags read d.current while the transition tween is mutating it.", "cognitive_load": 7, "cognitive_load_note": "Single-view sunburst with 4 well-separated rainbow hues manages 213 nodes cleanly; the unlabeled outer ring's 144 thin leaf segments require hover to identify, and the angular brush ring's affordance is non-obvious without a tooltip or label, but neither issue causes overload in normal exploration.", "composite": 5.6}, "82-hive-plot-accessible": {"render": true, "visual_critic": 5, "visual_critic_note": "The hive plot renders cleanly with a clear triangular structure, but uses default D3 categorical colors (blue/green/red), the 'Connec' label is clipped at the viewport edge, and the axis labels lack sufficient contrast with the background.", "encoding_integrity": 7, "encoding_integrity_note": "Hive plot uses honest categorical color and fixed-size node encoding with no baseline or lie-factor violations, but radial position maps raw pixel values directly instead of through a D3 scale (no d3.scaleLinear with data-driven domain), making it brittle for real data.", "stress_test": 9, "flags": ["Mouse-Touch Fight"], "stress_test_note": "No brush/zoom/transition interactions to trigger update storms, stale closures, or mid-flight snaps; only minor risk is unthrottled mouseenter→focus link updates and lack of touch/mouse differentiation on mobile.", "cognitive_load": 7, "cognitive_load_note": "3-axis hive plot with 80 nodes and 120 edges is visually manageable — restrained 3-color palette and low edge opacity (0.25) prevent hairball effect — but the 'Connector' axis label is clipped to 'Connec', breaking a key orientation cue.", "composite": 6.8}, "90-skill-growth-sparklines": {"render": true, "visual_critic": 4, "visual_critic_note": "Functional table with readable sparklines, but entirely undesigned — generic sans-serif, flat typographic hierarchy, default green (#4caf50), sparklines occupy only half the viewport width, and the large empty lower half makes the layout feel unfinished.", "encoding_integrity": 8, "encoding_integrity_note": "Area baseline correctly anchored at y=0 (domain [0,100], y0=innerHeight), key function present for object constancy on sort, fixed [0,100] domain is semantically appropriate for skill scores, no lie factor or dual-axis issues.", "stress_test": 9, "stress_test_note": "Interactions are limited to click-based column sorting with no brush, zoom, transitions, or cross-view dispatch, making all major stress-test failure modes (update storm, infinite loop, stale closure, mid-flight snap, touch fight) essentially non-applicable; minor inefficiency of full SVG teardown/rebuild per sort click is benign at human click rates.", "cognitive_load": 9, "cognitive_load_note": "8 rows, single monochrome color, shared y-axis domain (0–100), and compact sparklines form a clean scannable table with minimal cognitive demand.", "composite": 7.2}, "94-election-swing-map": {"render": true, "visual_critic": 5, "visual_critic_note": "Functional county-level election choropleth with brushable histogram, but no color legend, flat typography, harshly saturated red/blue palette, and the histogram feels visually disconnected from the map — competent but undesigned.", "encoding_integrity": 6, "encoding_integrity_note": "Histogram zero baseline and linear color scale are correct, but the Y-axis domain recalculates from d3.max per year, causing bar heights to rescale across transitions and breaking cross-year visual comparisons (subset/shift invariant violation).", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "The brush handler calls applyBrushFilter() on every mousemove doing a full DOM class-toggle walk over ~3k county paths with no RAF/throttle, and updateView() starts 400ms transitions without .interrupt(), causing mid-flight snaps when the slider is dragged rapidly.", "cognitive_load": 7, "cognitive_load_note": "Two-view linked dashboard (choropleth + histogram) with a familiar diverging red/blue political palette stays well within working memory limits; the brush-to-dim linking is clear, but the histogram is small relative to the map and animated county fills across ~3000 paths could feel busy at slower connections.", "composite": 5.5}, "96-regional-parcoords-grid": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}}}, {"timestamp": "2026-03-30T02:16:37", "git_sha": "20c4ed4", "skill_shas": {"visual_critic": "663cdf2", "encoding_integrity": "663cdf2", "stress_test": "663cdf2", "cognitive_load": "663cdf2"}, "block_set": "v2-gemini-3.1-pro-preview", "model": "claude-sonnet-4-6", "cli_version": "2.1.87 (Claude Code)", "blocks": {"01-parallel-coords-sparkline-table": {"render": true, "visual_critic": 7, "visual_critic_note": "Consistently applied indigo accent, clean card layout with good whitespace, and a thoughtful parallel-coords + sparkline-table pairing elevate this above generic, though Tableau10 for region colors and 150-line density keep it short of polished.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baselines correct, data-driven extents on all parallel-coord axes, no size/area encoding issues, but sparkline histograms use a hardcoded threshold of 24 bins rather than a data-driven rule (Sturges'/Scott's), and fg-bar data joins lack key functions.", "stress_test": 5, "flags": ["update_storm", "stale_closure"], "stress_test_note": "Every pointermove during strumming synchronously calls updateSelection()→drawLines()+updateTable() with no RAF/dirty-flag throttling, and x/y scales are captured in static closures with no resize handler to refresh them.", "cognitive_load": 7, "cognitive_load_note": "Two linked views, 6-color regional encoding (within perceptual limits), and opacity-layered canvas rendering manage 150 lines reasonably well, but the unfiltered default state shows a dense color tangle that requires interaction to resolve.", "composite": 6.6}, "15-adjacency-matrix-reorder": {"render": true, "visual_critic": 6, "visual_critic_note": "Thoughtful hover interaction and meaningful gray/colored encoding for cross- vs intra-community edges lift it above generic, but schemeCategory10 palette and flat typographic hierarchy keep it from feeling deliberately designed.", "encoding_integrity": 8, "encoding_integrity_note": "Bar chart uses data-driven zero-based domain (d3.max for maxDegree), opacity domain [0,10] is hardcoded but exactly matches the synthetic weight generation range (1–10), no radius deception or dual-axis fabrication, and reordering correctly updates scale domains rather than re-joining data.", "stress_test": 6, "flags": ["Mid-Flight Snap"], "stress_test_note": "updateOrder() starts a 1200ms staggered transition with no .interrupt() call, so rapid button clicks during animation cause mid-flight snapping; mouseover also bulk-updates all 1225 cells on every cell entry but lacks touch event filtering.", "cognitive_load": 7, "cognitive_load_note": "35×35 matrix with 5-color community encoding and linked bar chart is clean and well-structured, but cell size (~16px) is near the minimum for comfortable reading and the staggered wave reorder animation — while aesthetic — makes it hard to track individual node positions during transition.", "composite": 6.8}, "16-sankey-energy-flow": {"render": true, "visual_critic": 6, "visual_critic_note": "Dark background and source-to-target gradient links show genuine effort, but schemeCategory10 produces a noisy rainbow across nodes and the flat typographic hierarchy (all labels same size/weight) prevents it from feeling deliberately designed.", "encoding_integrity": 8, "encoding_integrity_note": "Sankey link widths and node heights are correctly proportional to flow values via d3-sankey layout; dynamicTotal is data-driven; no baseline, radius-deception, or dual-axis violations apply; minor deductions for synthetic data and absent key functions (acceptable since no data updates occur).", "stress_test": 5, "flags": ["Update Storm", "Mouse-Touch Fight"], "stress_test_note": "Drag handler calls sankey.update(graph) and redraws all 37 link paths on every mousemove with no RAF or throttling; no touch event filtering or .filter() guard on the drag behavior leaves mobile scroll/drag unresolved.", "cognitive_load": 7, "cognitive_load_note": "22 nodes and 37 gradient-blended links create mid-chart density that's hard to trace statically, but the hover-to-fade interaction and clear 5-column layout manage it well enough that the viewer can orient without overload.", "composite": 6.5}, "39-quadtree-hit-detection": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark background with a vibrant radial color-coded point cloud looks polished and purposeful; the glowing hit-detection interaction and clean UI panel show genuine design intent, though the rainbow 8-category palette edges toward busy.", "encoding_integrity": 7, "encoding_integrity_note": "No encoding violations apply — fixed-radius circles encode no quantitative data, color is categorical and correct, and the identity xScale/yScale are appropriate for a spatial coordinate visualization, though hardcoded viewport domains rather than data-driven extents limit robustness.", "stress_test": 5, "flags": ["Update Storm"], "stress_test_note": "The zoom handler unconditionally calls buildQuadtree (O(n) over 5000 points), drawBackground, drawVoronoi (full Delaunay recompute when enabled), and drawInteraction on every scroll/pinch frame with no requestAnimationFrame coalescing or dirty-flag throttling; pointermove is canvas-only and lightweight, no stale-closure, infinite-loop, mid-flight, or touch-fight issues found.", "cognitive_load": 7, "cognitive_load_note": "Single-view with 8 categories hits the color warning threshold, but strong spatial separation of radial clusters and a dark high-contrast background make each color group immediately identifiable; the interaction layer (10-nearest lines on hover) is focused and adds no visual noise at rest.", "composite": 6.6}, "53-textured-raincloud": {"render": true, "visual_critic": 7, "visual_critic_note": "Dual-encoding with Tol palette + distinct SVG patterns is a genuinely considered accessibility design choice, layout is clean with good whitespace, but the six-color categorical palette at 50% opacity creates a slightly muddy mid-tone feel and the absence of any legend forces reliance on y-axis labels alone.", "encoding_integrity": 7, "encoding_integrity_note": "KDE uses principled Silverman bandwidth (with documented bimodal adjustment), boxplot stats are correctly computed, and x-scale domain is data-driven via d3.max, but the x-axis lower bound is hardcoded to 0 rather than data-driven, leaving unnecessary empty space on the left for distributions ranging ~30–100.", "stress_test": 9, "stress_test_note": "Visualization is almost entirely static with no brush, zoom, or drag interactions — the sole interaction is a checkbox CSS class toggle, so none of the five stress-test failure modes (update storm, infinite loop, stale scale, mid-flight snap, touch fight) are applicable.", "cognitive_load": 7, "cognitive_load_note": "6 groups, 6 colors (Tol bright palette), triple-layer encoding per row (violin + boxplot + jitter) requires brief orientation but is consistent and readable across all rows with no animation or multi-view complexity.", "composite": 7.4}, "68-animated-sparkline-table": {"render": true, "visual_critic": 7, "visual_critic_note": "Cohesive dark theme with semantic color palette (blue/green/amber/red mapped consistently across KPI charts, table sparklines, and status badges), clear typographic hierarchy, and four distinct KPI chart types show genuine design intent — docked by the memory bullet chart feeling weaker than the other three KPI visualizations and the large dead space below the table.", "encoding_integrity": 7, "encoding_integrity_note": "Table sparkline areas use d3.extent (non-zero) domain so filled area doesn't represent magnitude from zero, and the memory KPI has hardcoded magic-number values (68, 85) rather than data-driven bindings; otherwise scales are data-driven, shared cross-row domains enable honest comparison, and the table uses correct key functions for object constancy.", "stress_test": 6, "flags": ["Update Storm (resize handler calls all 4 KPI redraws on every resize event without debounce/throttle)", "Mid-Flight Snap (Replay button calls init() which removes DOM and starts new transitions without .interrupt() on in-flight animations)"], "stress_test_note": "Unthrottled resize redraws all KPI charts at 60fps and the Replay button lacks .interrupt() guards, but no brush/zoom storms, no cross-view dispatch loops, no stale scale closures, and no touch/mouse fight since only a click button is used.", "cognitive_load": 8, "cognitive_load_note": "Clean two-tier hierarchy (4 KPI cards + 6-row table) with consistent 3-color encoding across all 18 table sparklines; only mild friction is the KPI row using four different chart types (area, bar, win-loss, bullet) requiring per-card decoding rather than a unified encoding.", "composite": 7.1}, "77-sunburst-breadcrumb-brush": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "82-hive-plot-accessible": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "90-skill-growth-sparklines": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate design with per-category color-coded badges, solid typographic hierarchy, and a smart shared y-domain (0–100) across sparklines for direct comparison — let down slightly by the sparklines being small enough that the faint area fill reads as decoration rather than data encoding.", "encoding_integrity": 8, "encoding_integrity_note": "Shared [0,100] y-domain enables honest cross-row comparison, area y0 correctly anchors at zero (data value 0 maps to baseline), key function d=>d.name maintains object constancy on sort, but no line.defined() guard for missing values.", "stress_test": 9, "stress_test_note": "No brush, zoom, or drag interactions exist; only click-to-sort triggers renderTable(), which is infrequent and non-continuous, so none of the five interaction traps apply.", "cognitive_load": 9, "cognitive_load_note": "Clean tabular layout with shared y-axis sparklines, restrained single-hue encoding, and 7 badge colors used as labels not data marks — cognitive load is minimal and cross-row comparison is effortless.", "composite": 8.1}, "94-election-swing-map": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "96-regional-parcoords-grid": {"render": true, "visual_critic": 6, "visual_critic_note": "Tableau-derived palette and linked brushing across panels show real design intent, but solid-stroke colored lines without alpha lose density information, and the typography hierarchy is minimal — functional and readable but not crafted.", "encoding_integrity": 8, "encoding_integrity_note": "Parallel const dims = ["render","visual_critic","encoding_integrity","stress_test","cognitive_load","composite"];
const labels = ["Render","Visual Critic","Encoding","Stress","Cognitive","Comp"];
const sel = document.getElementById("run-select");
runs.forEach((r,i) => {
  const o = document.createElement("option");
  o.value = i;
  const d = r.timestamp.slice(0,16).replace("T"," ");
  o.textContent = `${d} · ${r.block_set} · ${r.model}`;
  sel.appendChild(o);
});
sel.value = runs.length - 1;

const margin = {top: 36, right: 16, bottom: 16, left: 200};
const cellW = 62, cellH = 26;
const color = d3.scaleSequential(d3.interpolateRdYlGn).domain([1, 10]);

function draw(idx) {
  const run = runs[idx];
  const bids = Object.keys(run.blocks).sort();
  const w = margin.left + dims.length * cellW + margin.right;
  const h = margin.top + (bids.length + 1) * cellH + margin.bottom;

  d3.select("#chart").selectAll("*").remove();
  const svg = d3.select("#chart").append("svg").attr("width", w).attr("height", h);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  g.selectAll(".col-hdr").data(labels).join("text").attr("class","col-hdr")
    .attr("x",(d,i) => i*cellW+cellW/2).attr("y",-10).text(d=>d);

  bids.forEach((bid,row) => {
    const s = run.blocks[bid];
    const short = bid.replace(/^\d+-/,"").replace(/-/g," ");
    g.append("text").attr("class","label")
      .attr("x",-6).attr("y",row*cellH+cellH/2)
      .attr("text-anchor","end").attr("dominant-baseline","central")
      .text(`${bid.split("-")[0]} ${short}`);
    dims.forEach((dim,col) => {
      const v = dim==="render" ? (s.render?10:1) : s[dim];
      const x=col*cellW, y=row*cellH;
      g.append("rect").attr("class","cell")
        .attr("x",x).attr("y",y).attr("width",cellW).attr("height",cellH)
        .attr("fill",v!=null?color(v):"#eee").attr("rx",2);
      if (v!=null) {
        const lbl = dim==="render"?(s.render?"✓":"✗"):dim==="composite"?v.toFixed(1):v;
        g.append("text").attr("class","score")
          .attr("x",x+cellW/2).attr("y",y+cellH/2).text(lbl);
      }
    });
  });

  // Average row
  const ay = bids.length * cellH + 4;
  g.append("text").attr("class","label").attr("x",-6).attr("y",ay+cellH/2)
    .attr("text-anchor","end").attr("dominant-baseline","central")
    .attr("font-weight",600).text("Average");
  dims.forEach((dim,col) => {
    if (dim==="render") return;
    const vals = bids.map(b=>run.blocks[b][dim]).filter(v=>v!=null);
    if (!vals.length) return;
    const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    const x=col*cellW;
    g.append("rect").attr("class","cell")
      .attr("x",x).attr("y",ay).attr("width",cellW).attr("height",cellH)
      .attr("fill",color(+avg)).attr("rx",2).attr("stroke-width",2);
    g.append("text").attr("class","score").attr("x",x+cellW/2).attr("y",ay+cellH/2)
      .attr("font-weight",600).text(avg);
  });
}

sel.addEventListener("change", () => draw(+sel.value));
draw(runs.length - 1);
</script>
