rHTML fire synchronously on every wheel/drag tick", "Touch Filter: no .filter() on zoom behavior to prevent scroll-zoom conflict on mobile"], "stress_test_note": "The RAF coalescing pattern was scaffolded but never connected — the live zoom handler issues full WebGL+DOM redraws on every mousemove/wheel event with no throttling.", "cognitive_load": 8, "cognitive_load_note": "Single-view density heatmap with a perceptually ordered color ramp and smart LOD crossfade; cluster structure reads immediately at a glance, but the crossfade transition quality and 6-cluster point mode legibility cannot be assessed from a static screenshot.", "composite": 6.8}, "59-webgl-edge-bundling": {"render": true, "visual_critic": 4, "visual_critic_note": "The peripheral design is clean and intentional (Tol palette, clear typographic hierarchy, well-positioned controls), but the primary data encoding — the bundled edges — is invisible in the resting state, leaving the center of the canvas blank and making the visualization appear broken.", "encoding_integrity": 8, "encoding_integrity_note": "No quantitative axes means most honesty checks are N/A; categorical color (Tol bright palette) is perceptually honest, node size is fixed (not data-encoded so no lie factor), and the interactive tension slider transparently exposes bundling distortion rather than hiding it.", "stress_test": 7, "flags": ["Update Storm (partial) - highlight() synchronously rebuilds full colorVis buffer (829 edges × 20 segs) + GPU upload + draw on every pointerenter with no RAF or debounce; densely-packed nodes can trigger this many times per second during rapid mouse traversal"], "stress_test_note": "Slider interaction is correctly RAF-coalesced, no transitions so no mid-flight snap, pointer events unify mouse/touch correctly, and no feedback loops; the only stress-test weakness is the un-throttled synchronous GPU work in the hover path on pointerenter.", "cognitive_load": 7, "cognitive_load_note": "6-color Tol palette and hover-dimming interaction are well-managed for 283 nodes and 829 edges, but the WebGL edges are invisible in the static state (too low alpha or screenshot capture gap), making the network structure completely latent until hover — the default view shows only an empty circle of dots with no visual evidence of the 829 connections it contains.", "composite": 6.4}, "60-webgl-animated-treemap": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol palette with clear sector color harmony and clean typographic hierarchy, but the dense 5,000-leaf layout makes individual cells nearly indistinguishable at resting size, and the sector labels crowd the top edge with little breathing room.", "encoding_integrity": 8, "encoding_integrity_note": "Area encoding is correct (treemap area proportional to value via data-driven .sum()), leaf identity tracked by data reference for animation, categorical color only, clean metric toggle avoids dual-axis fabrication, but WebGL context-loss recovery is unimplemented and synthetic hardcoded dimensions cap the score.", "stress_test": 7, "flags": ["Update Storm - unthrottled O(N) pointermove scan"], "stress_test_note": "The pointermove handler performs an unthrottled O(5000) linear scan on every mouse move with no RAF coalescing; mid-flight animation handoff, stale closure, and mouse/touch concerns are all handled correctly via the custom RAF loop and Pointer Events API.", "cognitive_load": 7, "cognitive_load_note": "10 sectors color-coded with a restrained 7-color Tol palette and clear group labels manage 5,000 leaves well, but animation quality — the primary cognitive-load claim — cannot be assessed from a static screenshot, and the hairline white gaps between tiny leaves create visual noise that makes individual cells unreadable without hovering.", "composite": 7.2}, "61-progressive-crossfilter": {"render": true, "visual_critic": 4, "visual_critic_note": "Four-panel crossfilter layout renders and functions, but uses schemeCategory10 bars with no palette cohesion, flat all-caps section labels with no typographic hierarchy, and the scatter plot's rainbow point coloring reads as noise rather than encoding.", "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "62-icicle-brush-explorer": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Tol palette with light/dark parent-child distinction, confident whitespace, and well-integrated brush-histogram interaction, but the histogram's SteelBlue-adjacent fill and flat typographic hierarchy between title, axis labels, and tick marks leave it just short of fully designed.", "encoding_integrity": 8, "encoding_integrity_note": "Honest area encoding via partition layout, zero-based histogram Y-axis, data-driven log-scale domains, and key-function joins; only minor issue is the hardcoded bin count (30) rather than algorithmically derived thresholds.", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "Brush 'brush' event calls renderIcicle (full D3 join + event rebind) on every mousemove with no throttle or RAF, and no .interrupt() is called before new transitions, so brushing during the 750ms zoom animation causes mid-flight conflicts.", "cognitive_load": 8, "cognitive_load_note": "Two-view coordination (icicle zoom + histogram brush) is clean and within cognitive limits; 7-color TOL palette maps semantically to top-level dirs, opacity fade on brush filter is clear, but rightmost icicle columns degrade to unreadable hairline strips at full zoom-out.", "composite": 6.9}, "63-semantic-zoom-distributions": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Tol palette, smooth contour blues, and a well-conceived LOD badge make this feel designed, but the absent axis labels and near-invisible bottom/right margins leave the data floating without context.", "encoding_integrity": 7, "encoding_integrity_note": "Structurally honest: data-driven scale domains via d3.extent, correct key function on point joins (d => d.id), zoom-rescaled axes; main weaknesses are hardcoded KDE bandwidth (25px) and no contour color legend, but semantic LOD transitions mitigate bandwidth concerns.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "RAF coalescing, pointer-event unification, and rescaleX usage are all correct, but drawPoints starts enter/exit transitions without calling .interrupt() first, so rapid zoom gestures during mode transitions can leave elements mid-flight with conflicting r animations.", "cognitive_load": 8, "cognitive_load_note": "Single-view, monochromatic contour rendering at default zoom is clean and uncluttered; semantic zoom with hysteresis manages 2000 points across 3 LOD states well, but cluster identity is invisible in contour mode and hex/point interaction quality cannot be assessed from the static screenshot.", "composite": 7.2}, "64-strum-brush-parcoords": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol colorblind-safe palette, deliberate alpha layering, and clean typographic hierarchy are all intentional; the parallel coordinates fill the viewport well, but the overall layout feels slightly cramped with thin margins and the scatter panel hint text is borderline unreadable at its rendered size.", "encoding_integrity": 8, "encoding_integrity_note": "Parallel coordinates axes correctly use data-driven extent domains (non-zero baseline appropriate for parcoords), scatter plots use scaleLinear for position (correct), key functions present on data joins, no lie factor or dual-axis fabrication, but strum markers keyed by index `(_, i) => i` rather than object identity causing potential visual corruption when strums are removed from mid-array.", "stress_test": 7, "flags": ["stale_closure_no_resize_handler", "scatter_bg_dots_repositioned_every_raf_frame"], "stress_test_note": "RAF dirty-flag pattern correctly coalesces update storms and unified pointer events prevent touch fights, but pre-computed pxPositions and axisXPositions are never invalidated on resize creating a stale closure risk, and scatter panels redundantly reset cx/cy on all 2000 background dots each RAF frame.", "cognitive_load": 7, "cognitive_load_note": "Well-executed parcoords with canvas rendering, DPR-aware alpha scaling, and colorblind-safe 5-color TOL palette — but at full selection (2000 lines) the initial view is a dense color spaghetti where per-category structure is nearly indiscernible, and the strum interaction (Alt+drag) is non-discoverable without reading the hint.", "composite": 7.2}, "65-brush-compose-scatter": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol palette, clean whitespace, and progressive annotation staging show real design intent, but the 6-panel layout renders points at r=3.5 with density that makes group separation hard to read, and the panel titles at 11px font-weight 600 don't sufficiently dominate the 10px axis labels — hierarchy is compressed.", "encoding_integrity": 8, "encoding_integrity_note": "Scatterplots use data-driven d3.extent domains with .nice(), no size encoding of values (fixed radius), no dual-axis, no baseline violation — structurally honest; no key function on data join is harmless since dots are never re-joined after init.", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "The brush 'brush' event fires updateAll() on every mousemove with no throttling or RAF, triggering transitions on 1800 dots across 6 panels at 60fps; transitions are also started without .interrupt(), so rapid brushing causes constant mid-flight restarts and visual jank.", "cognitive_load": 8, "cognitive_load_note": "Six panels with 3-color palette and cross-panel brushing compose clearly; the union/intersect toggle and staged annotations (centroid crosshair, outlier flags) add density without overwhelming because they appear progressively, though static screenshot cannot assess whether the 80ms dot transitions and 900ms annotation cascade feel smooth or jittery under rapid brushing.", "composite": 6.9}, "66-falcon-histogram": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional TOL palette and dual-layer histogram (grey background + blue foreground) show real design thinking, but the latency chart renders as a near-empty panel in the initial state — large empty grey space with only a faint dashed threshold line — making the dashboard feel incomplete at load.", "encoding_integrity": 8, "encoding_integrity_note": "Zero baselines correct on all bar/area charts, domains are data-driven via d3.min/max, log-scaled histogram bins are data-derived and clearly labeled, no radius deception or dual-axis fabrication; minor gap: latency sparkline omits line.defined() but data is always contiguous when rendered.", "stress_test": 4, "flags": ["update_storm", "mid_flight_snap"], "stress_test_note": "The unthrottled brush handler fires on every mousemove and synchronously executes a full O(500K) naive scan plus three full axis DOM re-renders with no RAF coalescing or dirty flag, and the 60ms fgBars transition is started without .interrupt() so rapid brushing queues conflicting transitions.", "cognitive_load": 8, "cognitive_load_note": "Three naturally sequenced views (timeline → histogram → latency) with a single-hue palette and 48-bar transitions that are purposeful and short (60ms); the latency panel reads as nearly empty pre-interaction, which could momentarily confuse viewers, but hint text recovers it.", "composite": 6.6}, "67-temporal-edge-bundling": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate TOL palette, confident whitespace, and node-size encoding show clear design intent, but the bundled edges at low opacity read as a pale undifferentiated mass that undercuts the cross-department story.", "encoding_integrity": 8, "encoding_integrity_note": "Structurally honest: scaleSqrt used correctly for node-size encoding, maxCount domain is data-driven, data join uses key function d=>d.id, no baseline or dual-axis violations; only cosmetic issue is the inverted beta slider direction.", "stress_test": 7, "flags": ["update_storm_slider_no_raf"], "stress_test_note": "Both month and bundling sliders call render() synchronously on every input event with no RAF or dirty-flag coalescing, triggering canvas redraw plus ~320 SVG attribute mutations per tick at up to 60fps; all other checks pass — pointer events prevent mouse/touch fights, no transitions eliminate mid-flight conflicts, no dispatch prevents feedback loops, and module-level state prevents stale closures.", "cognitive_load": 7, "cognitive_load_note": "Edge bundling and low opacity (0.18) manage 32 active edges cleanly in the static view, 6-color TOL palette is perceptually distinct and within limits, but the core temporal animation (700ms play loop across 380 edges) cannot be assessed for object constancy from a static screenshot.", "composite": 7.2}, "68-animated-sparkline-table": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberately designed dashboard with a restrained TOL palette, clear typographic hierarchy (bold server names, monospace numerals, uppercased muted headers), and satisfying staggered sparkline animation — held back from a 9 by the cramped sparkline cells (80×18px) making CPU and memory lines hard to distinguish at a glance, and the KPI mini-charts being too small to read detail.", "encoding_integrity": 6, "encoding_integrity_note": "Spark-area KPI uses d3.extent (non-zero baseline) for an area chart — a truncated baseline violation — while table sparklines are structurally honest with data-driven or appropriately fixed [0,100] domains.", "stress_test": 8, "flags": ["Mid-Flight Snap (sort path)"], "stress_test_note": "The replay button correctly calls .interrupt() before re-animating, but renderTable(false) triggered by column sort does not interrupt in-flight clip-rect transitions before tearing down and rebuilding the DOM, leaving staggered reveal transitions running on detached nodes during the ~720ms initial animation window; no update storms, infinite loops, stale closures, or mouse-touch conflicts were found.", "cognitive_load": 8, "cognitive_load_note": "Well-managed cognitive load: 3-color sparkline encoding is consistent across 18 rows, staggered wipe animation (54 targets, 40ms row delay) aids object constancy rather than creating noise, and KPI cards establish a clear summary-to-detail hierarchy — the only weakness is the 80×18px sparklines are near minimum readable size and the win/loss KPI card lacks enough context to interpret without the legend label.", "composite": 7.5}, "69-prediction-band-timeseries": {"render": true, "visual_critic": 6, "visual_critic_note": "Deliberate Tol muted palette and story-reveal structure show real design intent, but the initial render is a blank grid — the screenshot captures nothing, making it look broken before any interaction.", "encoding_integrity": 7, "encoding_integrity_note": "Structurally honest line/fan chart with correct CI z-scores (0.674/1.282/1.96σ), appropriate non-zero baseline (line chart variance exception applies), and data-driven domains, but hardcoded absolute y-padding (±0.3/0.4M) fails the scaling metamorphic relation for data at different magnitudes.", "stress_test": 7, "flags": ["Mid-Flight Snap", "Update Storm (layout thrashing)"], "stress_test_note": "exit() handlers for actualLine, actualDots, bands, forecastLine, and divider omit .interrupt(), so rapid Next/Reset clicks during the 1200ms stroke-dashoffset or staggered dot transitions leave stale dashoffset=0, breaking the line-draw animation on replay; additionally, offsetWidth/offsetHeight reads inside the un-throttled pointermove handler force synchronous reflow on every frame.", "cognitive_load": 8, "cognitive_load_note": "Sequential story reveal with only 3 hues and staged transitions keeps cognitive load minimal; screenshot captures pre-interaction blank state which obscures the content but the progressive disclosure design is sound.", "composite": 7.0}, "70-gantt-edge-bundle": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol palette, restrained phase backgrounds, and clear typographic hierarchy (bold title → muted subtitle → quiet axis ticks → tiny task labels) give the chart real design intention, but the task labels at 9px are borderline unreadable at full render size and the dependency edges are nearly invisible at rest (0.25 opacity grey), making the chart's defining feature invisible until hover.", "encoding_integrity": 8, "encoding_integrity_note": "Fully data-driven domains (d3.min/max), key function on bar join, appropriate time-axis (no zero-baseline obligation), and correct area encoding; only minor issue is the 4px minimum bar width that slightly overstates very short tasks.", "stress_test": 8, "flags": ["Mid-Flight Snap (pointerenter starts transitions without .interrupt(), relying on D3 supersession rather than explicit cancellation)"], "stress_test_note": "Interaction is largely robust — pointer events unify mouse/touch, pointermove only repositions tooltip with no DOM mutations, and pointerleave correctly calls .interrupt() before re-transitioning, but pointerenter lacks a matching .interrupt() call which could produce visual glitches on rapid successive hovers.", "cognitive_load": 8, "cognitive_load_note": "50-task Gantt with 4-color TOL palette and edge bundling managed well — edges hidden at rest (0.25 opacity) and revealed on hover prevents spaghetti overload, but 9px labels in a 200px margin are near the legibility floor.", "composite": 7.7}, "71-small-multiples-force": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol palette used deliberately across nodes and edge states, clean white-card grid with generous margins, but the force layouts produce isolated outlier nodes in several panels (April, February) that feel unanchored and the typographic hierarchy is flat — panel title and stats share the same weight at nearly the same size.", "encoding_integrity": 7, "encoding_integrity_note": "Structurally honest—correct key function, fixed node radius, clear edge-status encoding—but independent force simulations per panel prevent stable node positions across months, undermining the comparative purpose (disclosed in subtitle).", "stress_test": 6, "flags": ["Mid-Flight Snap"], "stress_test_note": "No .interrupt() calls in animateSequence or resetPanels — clicking Reset during the 600ms sequence animation starts competing rect/node transitions mid-flight, and pg.sim.alpha(0.8).restart() reheats the simulation while the 'pulse' transition is in-flight; pointer events are correctly unified (no mouse-touch fight), force tick runs on D3's internal RAF loop (no update storm), and there is no cross-panel dispatch (no infinite loop risk).", "cognitive_load": 4, "cognitive_load_note": "Edge encoding (green/dashed-red/gray) is clear and 6 panels is well within small-multiples limits, but independent force simulations give each panel different node positions, making cross-panel node tracking impossible — the animate sequence then reheats each sim (alpha=0.8), actively destroying any positional memory the viewer built up, which fatally undermines the evolutionary comparison the layout promises.", "composite": 6.1}, "72-scrollytelling-network": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed — Tol colorblind-safe palette, clear typographic hierarchy (uppercase stage label → bold title → muted body → mono stat pill), and per-stage annotation system show real craft, but the Stage 1 network renders small relative to the 62% sticky column and the fixed progress dots clip into the scroll text at narrow widths.", "encoding_integrity": 7, "encoding_integrity_note": "No quantitative encoding violations (node sizes are categorical role-based, no axes), proper key functions ensure object constancy, and nodeMap preserves positions across stages, but the legend lists one 'Community' entry while the viz encodes three community groups (Design/Engineering/Research) in three distinct colors, leaving two color channels unexplained.", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "updateAnnotations() does selectAll('*').remove() + full DOM rebuild on every simulation tick (~60fps via ticked()), and goToStage() starts transitions with no .interrupt() call, so rapid scrolling causes mid-flight snaps.", "cognitive_load": 7, "cognitive_load_note": "Scrollytelling's progressive disclosure manages cognitive load well across 5 stages, but the legend omits 2 of 3 community colors (Engineering=yellow, Research=purple appear unlabeled until stage annotations appear), and the force reheat at alpha=0.6 on 65 nodes risks a chaotic transition that can't be assessed from the static screenshot.", "composite": 6.4}, "73-hierarchy-data-table": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed with the Paul Tol palette, monospace numerics, dual proportion encodings (spark bar + donut), and clean typographic hierarchy — held back from an 8 by the redundant Proportion/Share columns encoding identical data twice and the tiny donut arcs that are hard to read at 20px.", "encoding_integrity": 8, "encoding_integrity_note": "Proportion encoding is honest in both channels (spark bar width and donut arc angle use pct = sizeBytes/parentSize linearly), data join uses key function d=>d.id for object constancy, domains are data-driven via d3.stratify+sum, and the 0.5% minimum bar clamp is a cosmetic UX choice rather than deception.", "stress_test": 8, "flags": ["share-cell-full-dom-rebuild"], "stress_test_note": "No brush/zoom interactions make most stress-test criteria N/A; the only real weakness is td.share-cell using selectAll('*').remove() + full SVG reconstruction on every renderTable() call instead of D3's enter/update/exit pattern, though search is properly debounced at 120ms.", "cognitive_load": 8, "cognitive_load_note": "Six-color branch encoding maps cleanly to the hierarchy, bar+donut redundancy is well-managed, and the table structure keeps 5 columns readable at a glance — the only risk is the dual Proportion/Share columns encoding the same metric twice, adding a small decoding cost without payoff.", "composite": 7.7}, "74-marimekko-chart": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol Bright palette (not schemeCategory10), monospace numerics, clear typographic hierarchy, and cell-dimming hover lift this well above generic — docked from 8 because the Finance column is narrow enough to crowd labels and the bottom revenue/legend row is clipped in the rendered viewport.", "encoding_integrity": 7, "encoding_integrity_note": "Area encoding is mathematically correct (treemap area ∝ absolute segment revenue), Y-axis starts at 0%, and labels show accurate within-industry percentages, but segments are sorted by value within each column rather than held at consistent row positions, impairing cross-column comparison, and no key function is used in the data join.", "stress_test": 8, "flags": ["unthrottled_pointermove_layout_read"], "stress_test_note": "No brush/zoom/dispatch means the major stress-test traps don't apply; the only flag is an un-throttled getBoundingClientRect() call on every pointermove which forces a synchronous layout reflow, but impact is low on a static chart with no D3 transitions or cross-view updates.", "cognitive_load": 8, "cognitive_load_note": "4-color Tol palette separates cleanly across all 20 cells, dual encoding is clearly explained in subtitle and y-axis, labels fit every visible cell including the narrower Finance column, and hover-to-dim interaction lets viewers isolate one segment without cognitive overload.", "composite": 7.5}, "75-flame-chart-profile": {"render": true, "visual_critic": 6, "visual_critic_note": "Functional flame chart with a deliberate Tol-palette and canvas LOD rendering, but the visualization occupies only the top third of the viewport with a large empty void below, and the dense initial view renders most frames as unreadable pixel-thin slivers with no visual hierarchy.", "encoding_integrity": 7, "encoding_integrity_note": "Width correctly encodes duration via d3.partition proportional subdivision, but the time axis domain is hardcoded to [0,10000] matching synthetic root time, making it brittle with real data; children are sorted by value rather than call order, which alters temporal semantics but is not an active deception.", "stress_test": 7, "flags": ["Unthrottled tooltip DOM mutation on pointermove (findNode O(n) + .html() run at raw mousemove rate, only canvas redraw is rAF-coalesced)", "No .interrupt() before zoomToNode transitions (D3 auto-interrupts unnamed transitions, but rapid multi-click during 500ms ease can still cause mid-flight snap)", "No zoom .filter() guard for pinch/scroll conflict on mobile (ctrlKey+wheel reaches browser zoom instead of d3-zoom)"], "stress_test_note": "Canvas redraw is correctly rAF-throttled and hover-delta-gated, but tooltip DOM writes and O(n) hit-detection run unthrottled on every pointermove, and missing .interrupt() + zoom filter leave mid-flight snap and touch-jitter vectors open.", "cognitive_load": 8, "cognitive_load_note": "Well-executed flame chart with 855 frames across 8 modules — LOD system, canvas culling, and click-to-zoom keep cognitive load managed; the dense upper rows at default zoom are intentionally detail-deferred, not a failure, and the 8-color palette sits at the ceiling but remains distinguishable in wide frames.", "composite": 7.0}, "76-treemap-sparkline-dashboard": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberate TOL palette with per-division color harmony, sparklines inside treemap cells, and a well-structured KPI strip create a genuinely designed dashboard — held back from 9 by the very small leaf labels (8-9px) that strain readability at render size and the heavy categorical color saturation that leaves little visual rest.", "encoding_integrity": 7, "encoding_integrity_note": "Treemap area encoding is honest and data-driven, but sparkline area fills use d3.extent() Y-domains (non-zero baseline) making the filled area represent deviation from minimum rather than from zero, a minor but real encoding violation.", "stress_test": 6, "flags": ["Update Storm (unthrottled ResizeObserver → full SVG teardown/rebuild on every width change, no RAF or debounce)"], "stress_test_note": "Resize fires a complete DOM reconstruction for 100+ nodes without debouncing; all other checks pass — pointer events unify mouse/touch, no transitions mean no mid-flight conflicts, no cross-view dispatch means no feedback loops, and scales are freshly created inside render() so no stale closures.", "cognitive_load": 7, "cognitive_load_note": "Five-color division grouping successfully organizes 100 leaf cells into scannable regions, but many smaller cells degrade to name-only or color-only, making cross-division product comparison impossible without tooltip interaction.", "composite": 7.1}, "77-sunburst-breadcrumb-brush": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed with a colorblind-safe Tol palette, depth-adjusted HCL lightness, confident whitespace in the sidebar, and a clear typographic hierarchy — but outer-ring leaf labels are nearly unreadable at 9px and truncated names like 'Beverag…' undercut an otherwise polished layout.", "encoding_integrity": 7, "encoding_integrity_note": "Angular-area encoding is proportionally correct via d3.partition().sum(), data-driven domains with no hardcoded values, and the brush correctly maps leaf midpoint angles to selection — but no key functions in .data(descendants) and synthetic data prevent a higher score.", "stress_test": 8, "flags": ["Touch Jitter (no multi-touch filter)"], "stress_test_note": "RAF coalescing and cancelAnimationFrame are correctly applied to the brush pointermove; .interrupt() is called before each zoom transition; no cross-view dispatch loop; only gap is the absence of a multi-touch filter on the brush overlay, leaving pinch-zoom and two-finger gestures able to start a conflicting brush drag on mobile.", "cognitive_load": 7, "cognitive_load_note": "Six-color depth-lightened encoding and zoom+brush interaction manage 136 leaves well, but the outer leaf ring has dozens of slices too thin to label or click without zooming first, creating friction before the interaction pays off.", "composite": 7.2}, "78-expandable-edge-bundle": {"render": true, "visual_critic": 6, "visual_critic_note": "TOL palette and frosted-glass controls show real design intent, but the dense gray edge spaghetti at rest overwhelms the layout and the 9px leaf labels are too small to read without hover.", "encoding_integrity": 7, "encoding_integrity_note": "Encoding is structurally honest — categorical color, data-driven cluster layout, sqrt-scaled edge weights — but key functions in data joins are nullified by `selectAll('*').remove()` on every render, abandoning object constancy and making metamorphic permutation/subset relations untestable through DOM identity.", "stress_test": 5, "flags": ["update_storm_slider_unthrottled", "mid_flight_tension_race", "render_nodes_full_dom_teardown_per_frame"], "stress_test_note": "The tension slider fires drawEdges() on every input event without debouncing or RAF coalescing, and can race with the d3.timer animation loop (which also calls drawEdges+renderNodes at 60fps with full gMain.selectAll('*').remove() teardown each tick), while touch/mouse and feedback-loop checks pass cleanly due to pointer-event unification and no dispatch cross-talk.", "cognitive_load": 5, "cognitive_load_note": "Peripheral module color-coding (6 hues, ~72 leaves) is clear, but default β=0.39 produces a gray tangle at center — 100 edges barely bundled along hierarchical paths, making structure unreadable without hover; collapse/expand and highlight-on-hover are well-designed mitigations that matter only in motion, not the static view.", "composite": 5.8}, "79-reduced-motion-dashboard": {"render": true, "visual_critic": 6, "visual_critic_note": "Competent crossfilter dashboard with a thoughtful Tol colorblind-safe palette and ghost-bar context, but the line chart is an illegible tangle of overlapping colored spikes and the scatter plot devolves into a confetti cloud with no discernible pattern — both panels fail the 'can the viewer extract the data?' test at a glance.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baselines, data-driven domains, and key functions are all correct, but missing category-month values are filled with 0 (|| 0) rather than handled via line.defined(), creating false zero-revenue valleys in the line chart instead of honest gaps.", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "The brush listener fires on every mousemove and unconditionally calls renderBar+renderLine+renderScatter with full data joins and transitions—no RAF, dirty flag, or throttle; additionally no .interrupt() is called before any transition, leaving mid-flight snaps unguarded.", "cognitive_load": 6, "cognitive_load_note": "Bar chart and crossfilter logic are clean, but the line chart renders all 6 categories simultaneously at full opacity creating a spaghetti tangle, and the scatter has no visible legend making color-to-category matching impossible without hovering.", "composite": 5.8}, "80-container-query-chart": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed tech demo with intentional TOL palette, responsive degradation hierarchy (full→sparkline→KPI), and satisfying linked highlighting — held back from 8 by the simplified-mode bottom legend clipping at the SVG edge and the 'SIMPLIFIED' badge appearing on three panels without visual differentiation between them.", "encoding_integrity": 8, "encoding_integrity_note": "Scatter plot with data-driven domains (d3.extent + nice), correct key function (d => d.id), uniform fixed-radius dots (no size encoding to deceive), properly computed OLS regression — no baseline, lie-factor, or dual-axis violations; synthetic data and a non-zero Y baseline (acceptable for scatter) keep it from 9.", "stress_test": 6, "flags": ["Update Storm (ResizeObserver unthrottled)", "Update Storm (updateAllHighlights unthrottled on pointerenter)"], "stress_test_note": "ResizeObserver triggers a full SVG teardown-and-rebuild on every resize tick across all 6 panels without debouncing or RAF coalescing; updateAllHighlights also mutates 360 DOM attributes synchronously on each voronoi cell crossing with no requestAnimationFrame guard, though the use of pointer events (not mouse+touch duplication), absence of d3.dispatch cross-view loops, no transitions, and fresh-closure scales on each renderChart call means the remaining four stress-test criteria are cleanly satisfied.", "cognitive_load": 8, "cognitive_load_note": "Six panels are one conceptual unit demonstrating responsive breakpoints, not independent views — cognitive load is low, 5-color Tol palette is restrained, and progressive simplification (full→simplified→sparkline→KPI) is itself the message; linked hover highlighting across panels cannot be fully evaluated from a static screenshot.", "composite": 7.3}, "81-letter-value-table-toggle": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate blue sequential palette and confident whitespace work well, but the monochromatic depth encoding makes distinguishing inner levels difficult without hovering.", "encoding_integrity": 8, "encoding_integrity_note": "Structurally honest letter-value plot with data-driven y-domain (d3.extent), correct area encoding absent (width encodes statistical depth by design), seeded RNG for reproducibility, and proper table key functions; minor risk in outlier detection using max-range level instead of max-depth level which could misidentify in pathological distributions.", "stress_test": 8, "flags": ["Unthrottled pointermove tooltip update", "Full DOM teardown on every table sort (renderTable wipes and rebuilds on each click)"], "stress_test_note": "No brush/zoom/drag means the major Update Storm and Stale Scale risks are absent; the only concerns are unthrottled pointermove (cheap CSS reposition) and renderTable doing a full selectAll('*').remove() rebuild on each sort click rather than a keyed data-join update.", "cognitive_load": 8, "cognitive_load_note": "Five groups, single-hue blue ramp for depth, no animation, and a chart/table toggle make this cognitively clean; the only friction is distinguishing five sequential blue shades without hovering, but spatial nesting compensates as the primary depth cue.", "composite": 7.7}, "82-hive-plot-accessible": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol colorblind-safe palette, generous whitespace, and clear typographic hierarchy in the side panel elevate it above generic, but nodes collapse into a single-file line along each axis (activity mapped to radius, not angular spread) making the hive structure feel cramped and hard to read at a glance.", "encoding_integrity": 7, "encoding_integrity_note": "Correct scaleSqrt for node area encoding and data-driven sizeScale domain, but rScale hardcodes domain [0,100] making it brittle to out-of-range activity values under scaling/shift transformations.", "stress_test": 9, "stress_test_note": "No brush/zoom update storms, no dispatch feedback loops, no stale scale closures (positions are pre-computed), no transitions so no mid-flight snap, and unified Pointer Events API prevents mouse-touch fight; only minor issue is pointerdown cascades through svgEl.focus() causing drawFocusRing and announce to fire twice per click, but debouncing absorbs the announce duplicate.", "cognitive_load": 8, "cognitive_load_note": "3-color Tol palette, 0.18 edge opacity, and single-view tripartite layout keep 80 nodes and ~142 edges perceptually manageable; interaction-driven highlight on selection prevents spaghetti overload, though animation quality can't be assessed statically.", "composite": 7.7}, "83-community-detection-table": {"render": true, "visual_critic": 7, "visual_critic_note": "Colorblind-safe Tol palette, clean split-panel layout, and subtle bar fills show genuine design intentionality, but the table's Community column is redundant given the grouped headers, and the muted hull opacity makes community boundaries hard to read at a glance.", "encoding_integrity": 8, "encoding_integrity_note": "scaleSqrt used correctly for node radius, betweenness bar scale has a data-driven zero baseline, node joins use key functions, and no dual-axis or baseline violations are present; minor dead branch in sort comparator has no encoding effect.", "stress_test": 6, "flags": ["Mid-Flight Snap: highlightNode, highlightCommunity, and clear handlers start 200-250ms transitions without calling .interrupt() first — rapid clicks cause jumping/NaN attributes", "Update Storm: drawHulls() on every simulation tick destroys and recreates all 5 hull <path> elements via .remove() + append rather than using a keyed data join, running at ~60fps during drag with no RAF coalescing"], "stress_test_note": "Two violations: missing .interrupt() before all cross-view transitions invites mid-flight snapping on rapid interaction, and the per-tick hull destroy/recreate pattern is an update storm during active drag; no brush/zoom, no infinite dispatch loop, and unified pointer events are all clean.", "cognitive_load": 8, "cognitive_load_note": "Five well-separated clusters with hull outlines and a restrained 5-color Tol palette make the 100-node network readable at a glance; the linked table adds numeric precision without competing for attention, and the 250ms highlight transitions are congruent — drag-reheating the simulation is the only minor perceptual disruption that can't be fully assessed from a static screenshot.", "composite": 7.3}, "84-sparkline-embed-text": {"render": true, "visual_critic": 8, "visual_critic_note": "Sparklines integrate naturally into prose with a restrained TOL palette and clean typographic hierarchy; the summary table is well-structured, but inline sparklines are quite small (12px tall) and the alternating row striping adds visual noise without aiding comprehension.", "encoding_integrity": 8, "encoding_integrity_note": "Line sparklines correctly use data-driven d3.extent Y domains (non-zero baseline is appropriate for trend-shape lines), key function present on table row joins, inverted-metric good/bad logic handled, no area-encoding or dual-axis violations; only minor gap is no line.defined() guard, but synthetic data has no missing values.", "stress_test": 9, "stress_test_note": "No transitions, no cross-view dispatch, and pointer events API used throughout; the sole continuous interaction (pointermove tooltip) performs only trivial DOM text/style updates with no data joins or redraws, so none of the five stress-test failure modes apply.", "cognitive_load": 9, "cognitive_load_note": "Two-view layout (narrative + table) with 8 metrics, 2 colors, and 24-point sparklines is executed with extreme restraint — inline sparklines (60×12px) are appropriately minimal for trend-in-text use, color encoding (blue=good, red=bad) is consistent and instantly legible, and the table reinforces without redundancy; the only risk is that the 60px inline sparklines are too narrow to surface detail like the churn spike, but that is acceptable given their role as directional cues.", "composite": 8.4}, "85-skill-constellation": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional dark constellation aesthetic with a deliberate jewel-tone palette and satisfying glow effect, but two isolated nodes (data-gathering, webgl) drift far from the main cluster as simulation artifacts, and label congestion in the dense core makes several skill names illegible.", "encoding_integrity": 8, "encoding_integrity_note": "scaleSqrt used correctly for bubble area encoding, all scale domains are data-driven via d3.extent/d3.max, key function d=>d.id present for object constancy, and no baseline violations since no bar/area marks are used.", "stress_test": 8, "flags": ["ResizeObserver_no_debounce"], "stress_test_note": "No transitions, brush, or cross-view dispatch means most traps are N/A; only the un-debounced ResizeObserver triggers repeated simulation restarts during rapid window resizing, but pointer events are correctly unified and no stale closures or mid-flight conflicts exist.", "cognitive_load": 6, "cognitive_load_note": "Hover-to-highlight interaction and restrained edge opacity manage a 26-node/58-edge network well, but label collisions in the dense central cluster and several visually orphaned outlier nodes (their edges are near-invisible at rest) obscure structure before any interaction.", "composite": 6.9}, "86-block-skill-matrix": {"render": true, "visual_critic": 6, "visual_critic_note": "Dark theme with a Nord-inspired palette shows color intentionality, but the matrix renders too small to read row labels or cell details without zooming, and the column labels (rotated skill names) collide into an illegible fan at the top.", "encoding_integrity": 7, "encoding_integrity_note": "Honest nominal encoding (presence/absence + categorical color, no area or baseline violations), data-driven scale domains, key function on cell join — but g.selectAll('*').remove() on every sort defeats object constancy, and categoryColors has a duplicate 'Making it legible' key (harmless but sloppy).", "stress_test": 7, "flags": ["pointerenter-mass-update", "render-full-dom-nuke-on-sort"], "stress_test_note": "No continuous-event storms (no brush/drag listeners), no stale closures, and pointer events avoid mouse-touch fights, but pointerenter synchronously updates opacity on all ~315 cells plus all axis labels without RAF coalescing, and sort changes nuke/rebuild the entire DOM via g.selectAll('*').remove() rather than using keyed data joins with transitions.", "cognitive_load": 7, "cognitive_load_note": "Well-executed adjacency matrix — 7-color categorical palette stays manageable, hover row/column highlighting plus zoom/pan directly address the density of 105×26 cells, but the default fit-to-screen view compresses row labels and diagonal skill headers to near-illegibility, making interaction non-optional rather than supplementary.", "composite": 6.7}, "87-skill-anatomy-treemap": {"render": true, "visual_critic": 3, "visual_critic_note": "Category labels are readable and correctly colored, but the leaf fills — darkened variants of already-dark palette colors like #332288 and #117733 — are nearly indistinguishable from the #1a1a2e background, making the primary color-to-category encoding functionally broken.", "encoding_integrity": 8, "encoding_integrity_note": "Treemap correctly encodes area proportional to line counts via data-driven .sum(d => d.lines) with no hardcoded domains, no radius deception, and an honest subtitle ('Area ∝ lines'); minor: secondary color-lightness encoding within categories is redundant but not deceptive, and fixed SVG width/height are acceptable for a viewBox layout.", "stress_test": 9, "stress_test_note": "Static treemap with pointer-event unified hover; no brush/zoom storms, no cross-view dispatch, no transitions to interrupt, and no mouse-touch fight — the sole minor gap is pointermove updating tooltip position on every event without RAF, but the operation is CSS-only and trivially cheap.", "cognitive_load": 5, "cognitive_load_note": "Category grouping and layout are clear, but darkening an already-dark palette (e.g. #332288 darker(0.8)) renders most cells near-black, collapsing within-category differentiation and hiding the lightness-encodes-size signal almost entirely.", "composite": 6.0}, "88-agent-disagreement-parcoords": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Tol Sunset palette, clear typographic hierarchy with the red disagreement axis label, and confident whitespace — let down slightly by axis label crowding at small render widths and the legend being easy to miss.", "encoding_integrity": 7, "encoding_integrity_note": "Structurally honest parallel coordinates with data-driven y-scales via d3.extent, but color domains are hardcoded ([0,3] for σ, [-3,3] for delta) risking clipping on real data, and subset removal would cause axis jumping since scales recalculate from current data.", "stress_test": 6, "flags": ["Update Storm: brush 'brush' event calls render() directly on every mousemove with no RAF coalescing or dirty-flag — redraws both main and hit canvases (84 polylines each) at 60fps during drag", "Stale Scale: no window resize handler means xScale/yScales go stale on viewport changes; fixed 940px layout only masks this"], "stress_test_note": "Canvas rendering mitigates DOM-mutation cost but brush still triggers un-throttled full redraws on every mousemove; no transitions so mid-flight snap is N/A, and pointer-event API cleanly avoids mouse-touch fight.", "cognitive_load": 7, "cognitive_load_note": "84 semi-transparent lines on 6 axes stay readable via alpha management and a continuous diverging color scale, but individual line tracing requires hover/brush interaction — static view reads as moderate spaghetti without brushing.", "composite": 6.8}, "89-score-ridge-plot": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Tol Bright palette, clear typographic hierarchy, staggered entrance animation, and restrained data-ink all show design craft, but the legend clips 'After calibratio[n]' at the right edge — a concrete layout bug that caps the score.", "encoding_integrity": 8, "encoding_integrity_note": "Honest ridge plot: areas start from zero baseline, global maxDensity scale makes row heights comparable, x-domain [0,100] is appropriate for score data, and yDensity uses data-driven d3.max — minor concern is KDE bandwidth 6 smoothing the mixture-model skew in 'before' distributions, but bimodality remains visible in the output.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "The toggle button fires 600ms transitions without calling .interrupt() first, so rapid clicks cause conflicting in-flight transitions; all other criteria (Update Storm, Infinite Loop, Stale Closure, Mouse-Touch Fight) are not applicable or clean given the static, button-only interaction model.", "cognitive_load": 8, "cognitive_load_note": "Clean ridgeline execution — 2-color palette, 10 shared-axis rows, and staggered entrance animation all work well, but the legend label 'After calibratio' is visibly clipped at the right edge, and high row overlap (0.65) occasionally merges adjacent distributions at wide tails.", "composite": 7.5}, "90-skill-growth-sparklines": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate category-color palette carried through dots, sparkline fills, and lines creates strong visual coherence, but the shared global y-domain flattens all sparklines to nearly flat strokes, undermining the 'growth' encoding the column promises.", "encoding_integrity": 7, "encoding_integrity_note": "Sparkline line encoding is honest with a data-driven global shared domain for cross-row comparability and correct key functions for object constancy, but the area fill uses y0=sparkH (SVG bottom) while sy's domain starts at globalExtent[0] not zero, making the filled area decoratively misleading rather than proportionally grounded.", "stress_test": 8, "flags": ["Update Storm - pointermove updates hoverDot attrs and tooltip.innerHTML on every mousemove without throttling or RAF coalescing"], "stress_test_note": "No transitions, no cross-view dispatch, and Pointer Events API correctly avoids mouse-touch fights; only risk is the un-throttled pointermove performing innerHTML writes at up to 60fps.", "cognitive_load": 8, "cognitive_load_note": "25-row scrollable table with 7-category color palette and shared-axis sparklines reads cleanly — color dots aid category scanning, global y-domain enables row comparison, and the layout is uncluttered, though hover-only tooltips mean monthly values are invisible at a glance.", "composite": 7.5}, "91-test-coverage-heatmap": {"render": true, "visual_critic": 6, "visual_critic_note": "Clean structure with readable Blues sequential scale and a useful summary row, but the dense numeric values in every cell, flat typographic hierarchy across controls and labels, and no visual breathing room make it feel like a competent data tool rather than a designed artifact.", "encoding_integrity": 8, "encoding_integrity_note": "Honest sequential color scale with correct [0,100] domain for percentage data, row-level key function present, CVD-safe palette option included; minor: inner td join lacks key function and summary row is destroyed/rebuilt each render rather than updated in place.", "stress_test": 9, "stress_test_note": "No brush/zoom interactions; palette and sort changes fire only on discrete `change` events so no update storm; `colorScale` is reassigned before `renderBody()` is called avoiding stale closure; no D3 transitions means no mid-flight snap risk; tooltip `mousemove` only repositions a div with no DOM mutation.", "cognitive_load": 7, "cognitive_load_note": "Single sequential palette over 416 cells (26×16) is perceptually clean — color patterns emerge instantly — but the scrollable viewport fragments row comparison and the clipped vertical column headers require hover to read fully.", "composite": 7.3}, "92-score-delta-waterfall": {"render": true, "visual_critic": 7, "visual_critic_note": "CVD-safe Tol palette, clean typographic hierarchy, and a dashed separator above the net bar show real design intent, but several annotation leader lines collide with bar labels (e.g. 'Leader line overlap penalty' note crowds the -3.1 label) and the right margin is too tight for the longer annotation text overflowing at 'Lightness ramp corrected'.", "encoding_integrity": 8, "encoding_integrity_note": "Waterfall encoding is structurally honest — data-driven x domain via d3.extent, correct bar positioning from cumulative start/end values, explicit zero baseline line, and CVD-safe Tol palette — minor deduction for absent key functions in data joins and fixed-offset annotation text that could overlap on different data.", "stress_test": 9, "stress_test_note": "Fully static chart with no brush, zoom, drag, touch, or transition handlers — all five interaction failure modes are structurally impossible.", "cognitive_load": 8, "cognitive_load_note": "Clean waterfall with only 3 categorical colors, inline value labels, and sparse annotations — cognitive load is well-managed for 12 criteria; the one weak spot is annotation leader lines that occasionally crowd bar edges at negative deltas.", "composite": 7.9}, "93-prompt-complexity-scatter": {"render": true, "visual_critic": 5, "visual_critic_note": "Intentional Paul Tol palette and annotated sweet-spot zone show design thought, but the median label is clipped at the right edge ('medi'), the top-scorer callout text collides with the subtitle, and a large empty viewport below the legend wastes space.", "encoding_integrity": 8, "encoding_integrity_note": "scaleSqrt used correctly for size encoding, key function present on dots, x domain is data-driven via d3.extent, but y domain is hardcoded [10,100] causing subset instability if scores shift outside that range.", "stress_test": 6, "flags": ["Update Storm", "Stale Closure"], "stress_test_note": "The brush handler fires on every mousemove with no throttling or RAF coalescing, mutating class and opacity attributes on all 105 dots per frame; scales are captured in a static closure with no resize handler, making them stale if the viewport ever changes.", "cognitive_load": 6, "cognitive_load_note": "Clean single-view scatter with a restrained 6-color palette and well-separated points, but two annotation collisions hurt legibility: the top-scorer callout overlaps the subtitle text, and the median label is clipped to 'medi' at the right edge.", "composite": 6.2}, "94-election-swing-map": {"render": true, "visual_critic": 2, "visual_critic_note": "Map and histogram panels render completely empty — county choropleth and histogram bars are invisible, likely due to the external CDN TopoJSON fetch failing at render time, leaving only the dark chrome visible.", "encoding_integrity": 6, "encoding_integrity_note": "Choropleth uses a continuous diverging scale with clamp and documented legend bounds (honest), but the histogram x-domain is hardcoded to [-20, 20] which silently clips any swing values outside that range — a binning-bias / hidden-outlier violation.", "stress_test": 5, "flags": ["Update Storm: brush 'brush end' calls drawMap() (full canvas redraw of ~3100 county paths) on every mousemove without RAF/dirty-flag throttling", "Resize Storm: window resize listener calls resize()+drawHistogram() synchronously with no debounce, triggering full SVG teardown and canvas repaint on every resize event"], "stress_test_note": "The brush handler triggers an unthrottled full-canvas redraw of all US counties on every mousemove frame, and the resize handler is also un-debounced; no infinite loops, stale closures, mid-flight transitions, or mouse-touch conflicts are present.", "cognitive_load": 7, "cognitive_load_note": "Design is cognitively lean — 2 linked views, conventional diverging blue/red, brushable histogram — but the screenshot shows a blank render (map and histogram failed to load), so perceptual evaluation of actual county density and color separation is impossible.", "composite": 4.8}, "95-flight-route-bundling": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark-field map with intentional muted palette, glowing bundled routes, and clean hover interaction feels genuinely designed, though the schemeOrdinal-style region colors are a touch saturated and the legend sits uncomfortably close to the Northeast cluster.", "encoding_integrity": 7, "encoding_integrity_note": "No encoding violations — geographic projection is data-driven (fitSize), color is categorical by region, no quantitative size-encoding, no dual axes, no truncated baseline; minor robustness weakness is the unweighted US centroid (mean of region centroids ignores region size), but overall structurally honest for a canvas-based network visualization on synthetic data.", "stress_test": 7, "flags": ["Update Storm - tension slider input fires full 200-route canvas render on every tick without RAF or debounce"], "stress_test_note": "The pointermove guard (nearest.id !== hoveredAirport) correctly prevents per-pixel re-renders, but the slider input handler calls render() synchronously on every value change with no requestAnimationFrame coalescing; no transitions means no mid-flight snap risk, pointer events API eliminates mouse-touch fight, and no cross-view dispatch means no infinite loop exposure.", "cognitive_load": 7, "cognitive_load_note": "Edge bundling keeps 200 routes across 50 nodes readable by funneling them into visible corridors, and the 5-color regional palette is well within perceptual limits, but the synthetic bundling through regional centroids produces geometrically odd paths that misrepresent geography at low tension values.", "composite": 7.0}, "96-regional-parcoords-grid": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate dark palette with four distinct per-region accent colors, canvas+SVG layering for performant brushing, and clean panel layout — held back from an 8 by cramped axis labels that overlap at this panel size and a subtitle that's nearly invisible at rendered scale.", "encoding_integrity": 8, "encoding_integrity_note": "Parallel coordinates with globally shared, data-driven yScales (d3.extent over full dataset) enable fair cross-panel comparison; no baseline, radius, or dual-axis violations; line.defined() omitted but irrelevant with complete synthetic data.", "stress_test": 5, "flags": ["Update Storm: renderAll() called synchronously on every brush mousemove with no debounce or RAF — redraws all 4 canvas panels (200 lines each) at 60fps during drag", "Stale Closure: yPx and xScale captured once in requestAnimationFrame closure with no resize handler, so all brush pixel-space comparisons silently break on window resize"], "stress_test_note": "The un-throttled renderAll() on every brush event is the dominant flaw; no transitions means no mid-flight race, and no cross-dispatch means no feedback loop, but the missing RAF coalescing and stale-on-resize scales drop the score to mid-range.", "cognitive_load": 7, "cognitive_load_note": "4-panel small multiples with 50 lines each at restrained opacity is readable and well-structured, but compact panel size (~474×312px) crowds the 6 axis labels and tick marks, and brush cross-filter quality cannot be assessed from a static screenshot.", "composite": 6.8}, "97-supply-chain-sankey": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberately designed dark-theme Sankey with animated particles, multi-interpolator color palette per layer, and confident hover-trace interaction — held back from 9 by text labels that are all the same weight/color with no typographic hierarchy between title and node names.", "encoding_integrity": 8, "encoding_integrity_note": "Sankey link widths and node heights are fully data-driven via d3-sankey (no hardcoded domains or magic numbers), categorical colors carry no quantitative encoding, and proportional flow representation is mathematically correct; particles use linear rather than cubic-Bézier path interpolation but that is decorative only and does not affect encoding integrity.", "stress_test": 9, "stress_test_note": "No brush/zoom eliminates update-storm and stale-scale risks; pointer events unify mouse/touch correctly; no transitions means no mid-flight snap; RAF animation loop with particle cap is well-structured; only minor concern is that pointerenter performs synchronous DOM mutations across all links and nodes, but dataset size keeps it negligible.", "cognitive_load": 6, "cognitive_load_note": "Single-view Sankey with 33 nodes, ~96 links, and 33 distinct colors across 4 layer palettes is dense but manageable — the hover-trace interaction is the load-reduction mechanism, making the unfiltered view intentionally busy; up to 3000 simultaneous canvas particles cannot be assessed for noise from a static screenshot.", "composite": 7.7}, "98-shape-morphing-timeline": {"render": true, "visual_critic": 6, "visual_critic_note": "Cohesive dark palette and consistent blue accent show intentionality, but the controls (bare range input, generic button) undercut the otherwise polished chart chrome, and the gridlines are so faint against the near-identical dark backgrounds as to be invisible.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baseline correct (y domain starts at 0, area y0=ih, bars use ih-y(d.value)), data-driven domains via d3.max/d3.extent, no radius deception, but no key functions in data joins and the first render() function is dead code never called.", "stress_test": 7, "flags": ["Update Storm (minor): scrubber input event calls renderClean() synchronously on every mousemove without RAF coalescing", "Stale Closure: x/y/xBand scales captured in module-level closure with no resize handler to refresh them"], "stress_test_note": "Animation loop correctly uses RAF but the scrubber input handler bypasses it with a direct synchronous renderClean() call; no D3 transitions means zero mid-flight snap risk, and single-view design eliminates feedback loop and touch-fight concerns entirely.", "cognitive_load": 8, "cognitive_load_note": "Single view, 4 phases, 24 points, restrained single-hue palette — clean and uncluttered in static form; animation quality (the entire premise) cannot be assessed from screenshot, but the opacity cross-fade approach in renderClean avoids perceptual noise from coordinate-level morphing.", "composite": 7.0}, "99-tidal-harmonic-decomposition": {"render": true, "visual_critic": 8, "visual_critic_note": "Cohesive dark palette with intentional color assignments per constituent, clear typographic hierarchy, and three coordinated chart types that read cleanly — slightly dinged for the ridgeline's low-contrast fill-opacity making amplitude distributions hard to compare at a glance.", "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "100-city-similarity-explorer": {"render": true, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "101-webgl-color-space": {"render": true, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "102-earthquake-depth-globe": {"render": true, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "103-book-sentence-rhythm": {"render": true, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "104-nutrient-treemap-explorer": {"render": true, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "105-migration-flow-chord": {"render": true, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}}}];
const dims = ["render","visual_critic","encoding_integrity","stress_test","cognitive_load","composite"];
const labels = ["Render","Visual Critic","Encoding","Stress","Cognitive","Comp"];
const sel = document.getElementById("run-select");
runs.forEach((r,i) => {
  const o = document.createElement("option");
  o.value = i;
  const d = r.timestamp.slice(0,16).replace("T"," ");
  o.textContent = `${d} · ${r.block_set} · ${r.model}`;
  sel.appendChild(o);
});
sel.value = runs.length - 1;

const margin = {top: 36, right: 16, bottom: 16, left: 200};
const cellW = 62, cellH = 26;
const color = d3.scaleSequential(d3.interpolateRdYlGn).domain([1, 10]);

function draw(idx) {
  const run = runs[idx];
  const bids = Object.keys(run.blocks).sort();
  const w = margin.left + dims.length * cellW + margin.right;
  const h = margin.top + (bids.length + 1) * cellH + margin.bottom;

  d3.select("#chart").selectAll("*").remove();
  const svg = d3.select("#chart").append("svg").attr("width", w).attr("height", h);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  g.selectAll(".col-hdr").data(labels).join("text").attr("class","col-hdr")
    .attr("x",(d,i) => i*cellW+cellW/2).attr("y",-10).text(d=>d);

  bids.forEach((bid,row) => {
    const s = run.blocks[bid];
    const short = bid.replace(/^\d+-/,"").replace(/-/g," ");
    g.append("text").attr("class","label")
      .attr("x",-6).attr("y",row*cellH+cellH/2)
      .attr("text-anchor","end").attr("dominant-baseline","central")
      .text(`${bid.split("-")[0]} ${short}`);
    dims.forEach((dim,col) => {
      const v = dim==="render" ? (s.render?10:1) : s[dim];
      const x=col*cellW, y=row*cellH;
      g.append("rect").attr("class","cell")
        .attr("x",x).attr("y",y).attr("width",cellW).attr("height",cellH)
        .attr("fill",v!=null?color(v):"#eee").attr("rx",2);
      if (v!=null) {
        const lbl = dim==="render"?(s.render?"✓":"✗"):dim==="composite"?v.toFixed(1):v;
        g.append("text").attr("class","score")
          .attr("x",x+cellW/2).attr("y",y+cellH/2).text(lbl);
      }
    });
  });

  // Average row
  const ay = bids.length * cellH + 4;
  g.append("text").attr("class","label").attr("x",-6).attr("y",ay+cellH/2)
    .attr("text-anchor","end").attr("dominant-baseline","central")
    .attr("font-weight",600).text("Average");
  dims.forEach((dim,col) => {
    if (dim==="render") return;
    const vals = bids.map(b=>run.blocks[b][dim]).filter(v=>v!=null);
    if (!vals.length) return;
    const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    const x=col*cellW;
    g.append("rect").attr("class","cell")
      .attr("x",x).attr("y",ay).attr("width",cellW).attr("height",cellH)
      .attr("fill",color(+avg)).attr("rx",2).attr("stroke-width",2);
    g.append("text").attr("class","score").attr("x",x+cellW/2).attr("y",ay+cellH/2)
      .attr("font-weight",600).text(avg);
  });
}

sel.addEventListener("change", () => draw(+sel.value));
draw(runs.length - 1);
</script>
</body>
</html>
