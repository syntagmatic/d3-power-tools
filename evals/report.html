const runs = [{"timestamp": "2026-03-29T10:29:28", "git_sha": "32b5cfe", "skill_shas": {"visual_critic": "663cdf2", "encoding_integrity": "663cdf2", "stress_test": "663cdf2", "cognitive_load": "663cdf2"}, "block_set": "v1", "model": "claude-sonnet-4-6", "cli_version": "2.1.87 (Claude Code)", "blocks": {"01-parallel-coords-sparkline-table": {"render": true, "visual_critic": 6, "visual_critic_note": "Deliberate Tol palette and linked sparkline table show real design intent, but 150 overlapping colored lines in parallel coords reads as spaghetti at this scale, and the legend is crammed to the bottom edge of the SVG with no breathing room.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baseline and data-driven axis domains are correct, but sparkline y-scale recalculates from the active subset max (subset relation violated — bars rescale on filter) and the hardcoded 30-bin threshold is arbitrary rather than Sturges'/Scott's rule.", "stress_test": 4, "flags": ["Update Storm: brush 'brush' event fires render() on every mousemove, which calls updateTable() that destroys and recreates all 6 sparkline SVGs (selectAll('*').remove() + full bin recalc + DOM join) at 60fps with no RAF, debounce, or dirty flag", "Stale Closure (minor): brush pixel-range filter is not invalidated when axis is inverted via click — d3.brushSelection pixels are reused with the new inverted scale without moving the brush handle, potentially filtering wrong data rows", "Deprecated API: axis invert click handler uses arguments.callee which is forbidden in strict mode and will throw in ES modules"], "stress_test_note": "The dominant issue is an unthrottled Update Storm: every brush mousemove triggers a full sparkline table rebuild (6x SVG destroy-and-recreate) with no requestAnimationFrame coalescing, causing severe jank on any dataset larger than trivial.", "cognitive_load": 7, "cognitive_load_note": "Well-executed: smart alpha scaling and canvas rendering manage 150-line density, 6-region p en for log-normal income, uniform dot radius avoids lie factor, box plot whiskers and outliers computed correctly, but domain is hardcoded ([14000,550000]) rather than data-derived, reducing metamorphic robustness under scaling or shift transforms.", "stress_test": 9, "flags": ["pointermove-reflow"], "stress_test_note": "Essentially static (simulation pre-computed, no brush/zoom/transitions/dispatch); only interaction is pointer-event tooltip which reads offsetWidth/offsetHeight on every mousemove causing layout reflow, but no update storms, stale closures, feedback loops, mid-flight conflicts, or touch-fight issues.", "cognitive_load": 7, "cognitive_load_note": "Single-view with 4-category palette stays well within working memory limits, but the top-5 earner callout lines converge in a small region making it hard to trace which leader connects to which dot.", "composite": 7.1}, "05-crossfilter-flight-explorer": {"render": true, "visual_critic": 6, "visual_critic_note": "Competent crossfilter implementation with a deliberate single-hue palette and ghost bars, but the solid steelblue fills, flat typographic hierarchy (label and axis text are nearly indistinguishable), and bare-bones layout leave it firmly in functional-but-generic territory.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baselines correct, Y-scale data-driven from full-data max (honest crossfilter context), ghost bars provide truthful reference, but X domains are hardcoded to synthetic ranges causing silent clipping for real data, and bin thresholds are fixed rather than data-driven.", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap", "Touch Jitter"], "stress_test_note": "Every brush mousemove triggers a full 3-panel re-filter+re-bin with no RAF coalescing; end transitions start without .interrupt(), so direct .attr() calls during drag race against the 250ms transition still in flight; no touch-action CSS or event filtering guards against scroll-vs-brush conflict on mobile.", "cognitive_load": 9, "cognitive_load_note": "Textbook crossfilter execution — 3 panels well within working memory limits, single-hue palette eliminates color overload, ghost bars provide unfiltered context, and transitions are correctly suppressed during drag and smoothed on brush-end, leaving no perceptual risk to flag.", "composite": 6.6}, "06-qq-plot-confidence": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol palette, clear typographic hierarchy, and Voronoi hover elevate this above generic, but the '95% envelope' label is clipped by the inset histogram box—a concrete layout bug that should have been caught.", "encoding_integrity": 7, "encoding_integrity_note": "Encoding is structurally honest (data-driven symmetric domain, correct pointwise confidence band math, proper density-scaled histogram), but the source footnote claims N(2.5, 0.8) while the code generates from N(3.5, 0.6) — a factual label mismatch that misrepresents the synthetic data parameters.", "stress_test": 8, "flags": ["Update Storm (minor): un-throttled pointermove performs DOM mutations (highlight + tooltip) on every frame with no RAF or debounce"], "stress_test_note": "No brush/zoom, no transitions, no cross-view dispatch, and pointer events API used correctly; only risk is un-throttled pointermove DOM writes which are lightweight (1 circle + tooltip) and unlikely to cause jank at n=200.", "cognitive_load": 8, "cognitive_load_note": "Two-view layout (QQ + inset histogram) reads as a single analytical unit with binary color encoding and a confidence envelope that guide interpretation without cognitive overload.", "composite": 7.5}, "07-density-contour-heatmap": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark navy + viridis contours is a genuinely intentional palette and the monospace tick labels, muted gridlines, and colorblind-safe cluster swatches show real design care — held back from 8 by placeholder 'X'/'Y' axis labels and the darkest cluster color (#332288) nearly disappearing into the navy background.", "encoding_integrity": 8, "encoding_integrity_note": "Data-driven domains via d3.extent, correct sequential color scale with recomputed maxDensity per zoom, no baseline or area-scaling violations; fixed 25px KDE bandwidth and hardcoded threshold count are minor but non-deceptive limitations.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "Brush correctly fires only on 'end' (no update storm), but updateAxes uses .transition().duration(300) with no preceding .interrupt(), so rapid successive brush-zooms will produce conflicting in-flight axis transitions.", "cognitive_load": 8, "cognitive_load_note": "Single view, 3 well-separated clusters, viridis contours over Tol categorical dots reads clearly — mild dual-encoding ambiguity (combined density gradient vs. per-cluster point colors) is absorbed by strong spatial separation of clusters.", "composite": 7.5}, "08-small-multiples-seasonal": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol palette, shared axes, and synchronized crosshair across all 12 panels show deliberate craft, but the dense overlapping lines at high-consumption months (Jan, Feb, Dec) and the slightly cramped vertical cell height make individual year traces hard to distinguish without hovering.", "encoding_integrity": 8, "encoding_integrity_note": "Shared y-scale derived from d3.extent across all data enables honest cross-month comparison; line chart exempts non-zero baseline, but x-domain is hardcoded to [1,31] for all months regardless of actual days (Feb ends at 28 leaving dead space), and no line.defined() guard exists.", "stress_test": 6, "flags": ["Update Storm", "Stale Closure"], "stress_test_note": "The pointermove handler calls showCrosshair() with no RAF or throttle, mutating 48 DOM nodes (12 crosshair lines + 36 dots) plus innerHTML on every mousemove; xScale/yScale are captured in a static closure with no resize handler.", "cognitive_load": 8, "cognitive_load_note": "12-panel grid with 3-color Tol palette executes cleanly — shared axes and a clear seasonal U-shape narrative make cross-panel comparison easy, but lines interweave in low-consumption spring/fall months where year-over-year differences are small, and the crosshair linking all 12 panels simultaneously adds moderate interaction load near the 5-view warning threshold.", "composite": 7.3}, "09-sparkline-dashboard-table": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed table with a coherent Tol palette, clear typographic hierarchy (bold tickers, muted company names, small-caps headers), and four distinct sparkline types that are all readable at their rendered size — held back from 8 by the win/loss bars being almost too small to distinguish at a glance and the bullet chart's qualitative bands being so close in shade they read as a single gray block.", "encoding_integrity": 7, "encoding_integrity_note": "Volume bars and bullet chart encode correctly from zero with data-driven domains and key functions present, but the spark area uses a shared non-zero priceDomain (d3.extent across all stocks) for y0(h), making the area fill encode trend rather than magnitude from zero—acceptable for sparklines but a minor baseline honesty gap.", "stress_test": 5, "flags": ["Mid-Flight Snap", "Stale Closure Trap"], "stress_test_note": "Rapid sort clicks launch new 400ms transitions without .interrupt(), and the stale `all` closure in the on('end') handler calls all.order()/all.style('transform',null) against the wrong selection state, causing row-reorder glitches mid-animation.", "cognitive_load": 7, "cognitive_load_note": "Four mini-chart types per row (area sparkline, bar sparkline, win/loss, bullet) are spatially segregated into consistent columns so they read as a scanning pattern rather than simultaneous overload, but the win/loss bars (4px wide × ~6px tall, 20 marks) are near the perceptual minimum and the bullet chart's three qualitative bands (#e8e8e8/#dedede/#d2d2d2) are barely distinguishable; the global shared price domain also flattens within-stock movement for low-volatility tickers, and the 25-row simultaneous sort animation cannot be assessed as clear or chaotic from a static screenshot.", "composite": 6.6}, "10-strip-plot-marginals": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed: Tol colorblind-safe palette, clear typographic hierarchy (title/subtitle/axis/tick weights all distinct), and brush-linked marginal strip+box plots show genuine design intent, but the top marginal panel is cramped and the uncolored gray box plots in the margins lose the per-group information the rest of the chart earns.", "encoding_integrity": 8, "encoding_integrity_note": "Honest encoding throughout: data-driven domains via d3.extent, scatterplot correctly omits zero baseline, box-plot statistics use proper Tukey fences, no size encoding requiring scaleSqrt, brush preserves fixed axes so subsets don't cause jumping—minor demerit for missing key function on dot join (no update path so harmless) and fixed-seed LCG jitter resetting on each brush redraw.", "stress_test": 4, "flags": ["Update Storm"], "stress_test_note": "The brush 'brush' event fires on every mousemove with no throttle or RAF: each tick does a full .remove()+join of up to 250 strip dots in both marginals, rebuilds box-plot elements from scratch, updates opacity/radius on all 250 scatter circles, and recomputes linear regression — worst-case ~1500+ DOM mutations per frame at 60fps.", "cognitive_load": 8, "cognitive_load_note": "Three-color Tol palette separates risk groups cleanly across a 250-point scatter with well-integrated marginal strip+boxplots; top strip band is narrow enough that dots pile up slightly, but the aggregate boxplot compensates and the overall cognitive load stays low with only 3 linked views updating on brush.", "composite": 6.9}, "11-zoomable-treemap": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate HCL-based color system with lightness-by-depth creates genuine visual hierarchy, breadcrumb nav and label-fitting logic show real polish, but leaf text at 9-10px becomes illegible at overview scale and the legend swatches use raw palette hues that don't match the rendered (HCL-shifted) cell fills.", "encoding_integrity": 7, "encoding_integrity_note": "Area encoding is correct (d3.treemap sum proportional to value), domains are data-driven, and zoom scales are computed from node bounds; minor issues are a fragile data-join key (name+depth+parentName risks collisions) and rng()-based leaf lightness that adds visual noise unrelated to data values.", "stress_test": 8, "stress_test_note": "All five stress-test checks pass: click-only zoom avoids update storms, pointer events prevent mouse-touch fights, x/y scales are updated before use eliminating stale closures, cell.interrupt() is called before each new transition preventing mid-flight snaps, and there is no cross-view dispatcher to produce infinite loops; minor deduction for concurrent named 'zoom' (750ms) and 'opacity' (400ms) transitions running simultaneously on the same cells, which can produce visual artifacts on rapid clicks before the opacity transition completes.", "cognitive_load": 7, "cognitive_load_note": "8-color Tol palette with depth-based lightness hierarchy manages perceptual load well and the root view is readable, but the palette sits exactly at the color-overload warning threshold and the root view's leaf density is high enough that animation quality (500+ elements rescaling on zoom) can't be confirmed safe from a static screenshot.", "composite": 7.2}, "12-sunburst-icicle-morph": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol palette with depth-scaled lightness shows real color intentionality, but the outermost ring of tiny leaf slices reads as visual noise and the chart bleeds off the bottom of the viewport at its rendered size.", "encodi h no RAF or throttle, redrawing 80 bundled bezier paths per pixel of slider movement; all other interactions (pointer events, no transitions, fresh closure reads of `currentBeta`/`hoveredNode`) are clean.", "cognitive_load": 7, "cognitive_load_note": "Edge bundling at 0.85 tension cleanly manages 80 cross-module edges across ~120 leaves, and the hover focus+context interaction is well-executed, but ~120 labels at 9.5px around the perimeter create dense overlap that limits readability without hover.", "composite": 6.7}, "14-force-directed-clustering": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Tol colorblind-safe palette and well-tuned force simulation with neighbor-dimming hover create a polished result, but the grey Support cluster reads weakly against the dark background and the title has no typographic hierarchy over the legend.", "encoding_integrity": 8, "encoding_integrity_note": "Correct area encoding via scaleSqrt, data-driven domain with d3.extent, colorblind-safe ordinal palette, and no deceptive encodings; canvas rendering bypasses key-function concerns, and force-layout positional non-determinism is inherent to the chart type.", "stress_test": 7, "flags": ["update_storm_risk", "touch_fight"], "stress_test_note": "pointermove triggers drawEdges()+drawNodes() synchronously without RAF (though gated on node-change), and d3.drag() lacks a .filter() to prevent touch-scroll vs. drag conflicts on mobile; no stale-closure, infinite-loop, or mid-flight-snap issues since canvas+tick-loop replaces transitions.", "cognitive_load": 8, "cognitive_load_note": "Seven well-separated clusters read clearly at a glance with a colorblind-safe 7-hue palette and edge opacity (0.15) that suppresses hairball risk across 400 nodes and 600 edges; drag-reheat could cause transient disorientation but cannot be assessed from a static screenshot.", "composite": 7.5}, "15-adjacency-matrix-reorder": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol Bright palette, community-colored labels, and a well-integrated degree bar chart give the layout a considered feel, but the rotated column labels are slightly cramped and the bracket indicators are invisible until Community mode is selected, muting their design payoff.", "encoding_integrity": 8, "encoding_integrity_note": "Honest encoding throughout: color scale domain derived from d3.max, degree bars have zero baseline, all data joins use key functions, and no radius/area deception — minor robustness concern is that subset removal shifts the bar scale domain, but this is typical for well-made synthetic-data demos.", "stress_test": 5, "flags": ["Mid-Flight Snap", "Update Storm"], "stress_test_note": "reorder() starts a 600ms transition on 1225+ cells/labels without .interrupt(), so rapid button clicks cause mid-flight snapping; onPointerMove also mutates 70 label attrs on every cell crossing with no RAF or dirty-flag coalescing.", "cognitive_load": 8, "cognitive_load_note": "5-color Tol Bright palette cleanly separates communities in labels and bars, sequential blue weights don't compete, and the single matrix + linked degree bar stay well within working memory limits — the only friction is that the Name-order default shows a scattered matrix until the viewer discovers the reorder controls.", "composite": 7.1}, "16-sankey-energy-flow": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberate Tol muted palette with colorblind-safe stage colors, gradient link fills, and dashed loss flows show strong design intentionality, though the mid-chart visual complexity (overlapping flows between Grid and Sectors) makes it hard to trace individual paths without interaction.", "encoding_integrity": 8, "encoding_integrity_note": "Flow widths are correctly proportional via d3-sankey layout, flow conservation holds across all nodes, losses are distinctly encoded in red with dashing, and the colorblind-safe palette is applied consistently; minor deductions for Math.max(1.5,d.width) clamping small flows and absent key functions in data joins.", "stress_test": 6, "flags": ["Update Storm"], "stress_test_note": "The drag handler calls sankey.update(graph), linkPath.attr('d',...), and iterates all gradients on every mousemove with no requestAnimationFrame or dirty-flag throttle; all other stress-test criteria (infinite loop, stale closure, mid-flight snap, mouse-touch fight) are clean.", "cognitive_load": 8, "cognitive_load_note": "Five-stage gradient Sankey with 23 nodes and 33 links reads clearly — column headers, colorblind-safe palette, and loss-flow dashing manage complexity well, with ribbon density at the Grid stage being the only mild perceptual friction.", "composite": 7.6}, "17-chord-diagram-trade": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol palette, clear typographic hierarchy (monospace tick labels are a nice touch), and well-crafted hover isolation lift this above generic, but the dense ribbon tangle at center makes individual flows hard to trace without interaction.", "encoding_integrity": 8, "encoding_integrity_note": "Chord layout is fully data-driven with honest arc/ribbon proportionality and correct asymmetric matrix handling, but the hardcoded $50B tick step and absent key functions in joins would cause robustness failures under data rescaling or live updates.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "No .interrupt() calls before hover transitions in highlightGroup/resetHighlight means rapid arc-to-arc mousing during the 600ms entrance animation will snap arc growth mid-tween; all other checks pass cleanly (pointerenter-only renders avoid update storms, single-view eliminates feedback loops, static layout has no stale scale risk, and unified Pointer Events API prevents mouse-touch fights).", "cognitive_load": 7, "cognitive_load_note": "Hover-to-isolate interaction redeems a dense 45-ribbon, 10-color layout that reads as a tangle in its static state, but the palette has near-duplicate hues (two blues, two greens) and the ribbon congestion at center is unavoidable without hovering.", "composite": 7.2}, "18-collapsible-tree-search": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional Tol palette with rank-color encoding, clean search UX and count badges, but the lower half of the viewport is wasted empty space at default expansion depth.", "encoding_integrity": 7, "encoding_integrity_note": "Honest categorical encoding (color by rank, position by hierarchy, text count badges — no lie factor), data-driven SVG dimensions, but the node key function (name+depth) risks collision under data permutation and nodeSize is hardcoded rather than data-driven.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "No .interrupt() before new transitions on node/link selections means rapid clicks during the 500ms animation can cause positional snapping, and a stale-closure setTimeout scroll (line 591–601) fires with captured `first`/`offsetY` values that may be outdated if update() is called again before the timer fires; all other checks pass — search is debounced 200ms, pointer events unify mouse/touch, and the single-view design eliminates feedback-loop and update-storm risk.", "cognitive_load": 8, "cognitive_load_note": "Single-view tree with well-managed progressive disclosure keeps default state uncluttered (14 visible nodes, 6-color Tol palette within bounds); full expansion to ~200 nodes stacks vertically requiring scroll but staged transitions and search-driven auto-expand prevent perceptual overwhelm.", "composite": 7.2}, "19-circle-packing-zoom": {"render": true, "visual_critic": 6, "visual_critic_note": "Deliberate Tol Bright palette mapped through HCL adds real design intent, but subcategory circles render at l=92 / 40% chroma making the mid-level nearly invisible, and the initial view is a flat wall of washed-out pastels with no visual hierarchy to guide the eye.", "encoding_integrity": 8, "encoding_integrity_note": "Circle area encoding is correct — d3.pack() allocates area proportional to summed value, zoom math is exact, domains are data-driven via hierarchy.sum(), and no key function is needed because data never mutates post-render.", "stress_test": 6, "flags": ["mid-flight-snap", "update-storm"], "stress_test_note": "No explicit .interrupt() before new svg.transition() calls, and applyView() runs an O(n²) vis.find() inside labels.each() on every tween tick during the 750ms zoom animation.", "cognitive_load": 8, "cognitive_load_note": "Six-color palette maps cleanly to six categories, LOD labeling suppresses clutter at root view, and zoom-to-focus collapses all ~300 nodes to a single conceptual interaction — cognitive load is well-managed, though tiny leaf circles are indistinguishable without zooming in.", "composite": 7.0}, "20-arc-diagram": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol muted palette with weight-encoded stroke widths and satisfying hover dimming shows real design intent, but the dense arc tangle and cramped 10px angled labels make individual connections hard to trace at rest.", "encoding_integrity": 6, "encoding_integrity_note": "Arc height correctly uses scaleSqrt for perceptual honesty, but node radius uses scaleLinear (circle area scales as r², creating a lie factor for importance encoding), and all scale domains are hardcoded magic numbers rather than data-driven.", "stress_test": 5, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "onBrush fires unthrottled DOM mutations on all 90 arcs and 60 node/label selections every mousemove with no RAF/debounce, and hover transitions lack .interrupt() so brush events during a 120ms hover animation cause attribute conflicts and snapping.", "cognitive_load": 6, "cognitive_load_note": "Hover highlight and chapter brush effectively manage 30 nodes / 90 edges, but the uninteracted static state is dense: 9 simultaneous hues on overlapping arcs at 0.35 opacity makes color grouping unreliable before the viewer discovers the interactions.", "composite": 6.1}, "21-us-choropleth": {"render": true, "visual_critic": 6, "visual_critic_note": "Clean sequential blue palette and real typographic hierarchy (bold title, muted subtitle, quiet legend ticks) lift it above generic, but the execution is standard — nothing distinctive in palette choice, proportions, or layout that signals authorship.", "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "22-rotating-globe": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark-navy palette with muted green land, dashed golden terminator, and pulsing continent-colored city dots are all deliberate choices that cohere visually, but the land fill dominates so heavily that the globe reads as a uniform green mass — city markers get lost against it, and continent differentiation is harder than it should be at a glance.", "encoding_integrity": 8, "encoding_integrity_note": "Honest cartographic encoding throughout — orthographic projection with correct clipAngle(90) hemisphere culling, categorical Tol palette for continent color, no quantitative size-encoding violations, and canvas-based rendering sidesteps D3 join key-function concerns; docked from 9 only for hardcoded city dataset (no data-driven domain derivation) and the approximate solar-position formula used for the terminator.", "stress_test": 6, "flags": ["Update Storm"], "stress_test_note": "The drag 'drag' handler calls render() directly while the requestAnimationFrame animate() loop also calls render() every frame, causing redundant double-redraws of all four canvas layers (ocean, land, graticule, cities) on every pointer-move during rotation; no other stress-test violations found—no cross-view dispatch loops, no stale scale closures, no D3 transitions to interrupt, and pointer/touch handling is consolidated via pointermove.", "cognitive_load": 8, "cognitive_load_note": "Single-view globe with 6-continent palette stays well within working memory and color limits; the auto-rotation and 30 pulsing cities can't be fully assessed from a static frame, but encoding is restrained enough that motion is unlikely to overwhelm.", "composite": 7.3}, "23-hex-bin-map": {"render": true, "visual_critic": 2, "visual_critic_note": "The hexbin canvas layer is entirely absent from the screenshot — only blank state outlines render, making the population density encoding completely invisible and the visualization non-functional.", "encoding_integrity": 6, "encoding_integrity_note": "Color encoding is structurally honest (data-driven domain via d3.max, sequential scale from 0, perceptual gamma ramp) but 32-bucket color quantization misrepresents exact bin counts, and the screenshot shows no hex bins rendered on canvas—only SVG state borders—indicating a likely async load failure at capture time.", "stress_test": 6, "flags": ["Update Storm (slider: no debounce/throttle on input event, full hexbin recomputation over 20k points on every drag frame)", "Update Storm (pointermove: full canvas re-render on every bin boundary crossing, no RAF coalescing)"], "stress_test_note": "Hover guard prevents per-frame redraws within the same bin, and pointer events unify mouse/touch cleanly, but the radius slider fires synchronous full hexbin recomputes at input-event rate with no debounce or requestAnimationFrame.", "cognitive_load": 5, "cognitive_load_note": "Single sequential color scale and one slider control keep cognitive load minimal in design, but the screenshot shows a blank canvas with no hex bins rendered — likely the async TopoJSON fetch hadn't resolved at capture time — leaving the viewer with zero information and no loading indicator.", "composite": 4.6}, "24-flow-map-arrows": {"render": true, "visual_critic": 3, "visual_critic_note": "The simplified US outline GeoJSON projects as a distorted horseshoe that dominates the viewport, while all 12 cities and their flow arrows collapse into an illegible cluster in the lower-center — the map background is broken and the data encoding is nearly unreadable at render size.", "encoding_integrity": 7, "encoding_integrity_note": "Node radii use scaleSqrt (area-correct), domains are data-driven via d3.extent, but stroke width also uses scaleSqrt for a 1D encoding — contradicting the subtitle's 'width ∝ volume' claim by compressing high-volume flows sublinearly.", "stress_test": 7, "flags": ["Mid-Flight Snap: highlight() and resetHighlight() start new transitions without .interrupt(), so rapid hover between cities stacks conflicting transitions on flowPaths and cityNodes", "Update Storm (animation): d3.timer loop unconditionally calls dashPaths.attr('stroke-dashoffset') on all 28 dash elements every animation frame (~60fps) with no RAF coalescing or dirty-flag guard"], "stress_test_note": "Hover-only interaction avoids brush/zoom failure modes entirely, but absent .interrupt() calls risk mid-flight snapping on fast traversal and the naked d3.timer is a continuous 60fps DOM writer on all dash overlays.", "cognitive_load": 4, "cognitive_load_note": "Interaction design is sound but the Albers projection compresses all 12 cities into a dense cluster occupying ~10% of the canvas, turning 28 flow arrows into an illegible hairball with overlapping labels — the map outline wastes 90% of the space while the actual data becomes unreadable without hovering.", "composite": 5.0}, "25-projection-morphing": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol muted palette for continents, clean sphere/graticule styling, and clear typographic hierarchy (title/subtitle/controls/legend) show real design intent, though the ocean fill (#f0f4f8) blends too closely with Antarctica and the continent colors lack enough contrast distinction between Africa and Oceania (#CC6677 vs #882255).", "encoding_integrity": 7, "encoding_integrity_note": "Categorical continent encoding is honest and uses correct key functions (.data(countries, d => d.id)) and data-driven fitSize, but the || 'Africa' fallback silently misclassifies unknown country IDs and duplicate entries across continent arrays (e.g., 854/Burkina Faso in both africaIds and naIds) can cause miscoloring.", "stress_test": 7, "flags": ["Update Storm: new d3.geoProjection object created inside d3.timer on every frame (~60fps), plus full countryPaths.attr('d') redraw of all country features per tick", "Mid-Flight Snap: d3.timer handle not externally stoppable; if transitioning flag is ever cleared prematurely a second timer could run concurrently", "scheduleNext always calls itself even when transitionTo returns early due to transitioning guard, risking missed-advance accumulation"], "stress_test_note": "The transitioning flag and unified pointer events (pointerenter/move/leave) prevent most race conditions, but per-frame geoProjection instantiation and the dual sourceProj+targetProj call per vertex is an unthrottled update storm inside the animation loop that will cause jank on low-end hardware.", "cognitive_load": 8, "cognitive_load_note": "Single-view world map with a restrained 6-color Tol muted palette reads cleanly at a glance; the projection morphing animates ~250 paths simultaneously but as a coherent whole-map transform rather than independent motion, so object constancy is maintained — perceptual quality of the transition itself cannot be confirmed from a static screenshot.", "composite": 7.2}, "26-horizon-chart-stack": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol sequential blues palette, clear typographic hierarchy (title → subtitle → labels → ticks), and restrained dashed gridlines show real design intent, but the horizon chart's folded encoding is hard to decode without prior familiarity and the compact 56px row height leaves little room for the bands to express value magnitude.", "encoding_integrity": 7, "encoding_integrity_note": "Horizon folding is correctly implemented (bands shifted by step, area bounded 0–rowHeight, semantically justified maxVal=100 for CPU%), but a new d3.scaleLinear is created inside the y1 accessor on every data point (performance anti-pattern), and line.defined() is absent — a structural gap if real data with nulls were substituted.", "stress_test": 6, "flags": ["Update Storm: pointermove fires unthrottled DOM mutations (crosshair, 8 markers, innerHTML rebuild) plus getBoundingClientRect() on every mousemove — forced layout reflow at 60fps with no RAF or dirty-flag guard", "Stale Closure: x scale is captured in a static closure with no resize handler — scale becomes stale if the container resizes, producing wrong coordinate mapping on crosshair and markers"], "stress_test_note": "No brush/zoom or transitions reduce the blast radius, but the unthrottled pointermove triggers a forced layout reflow via getBoundingClientRect() and full innerHTML replacement on every frame, and the x scale has no resize path.", "cognitive_load": 8, "cognitive_load_note": "3-band horizon chart with 8 rows and a shared time axis reads cleanly — the sequential blue palette, alternating row backgrounds, and crosshair tooltip manage density well, though the folded encoding requires legend literacy and the compact 56px row height makes band separation subtle at a glance.", "composite": 7.1}, "27-swimlane-gantt": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed — intentional Paul Tol-adjacent palette, S-curve dependency arrows with blocked/normal differentiation, subtle pastel swimlane bands, and a brush-zoom overview bar show real craft, but milestone labels at 9.5px are too small and the chart overflows the viewport hiding the overview bar.", "encoding_integrity": 8, "encoding_integrity_note": "Honest time encoding throughout — position and width correctly map to start/duration via scaleUtc, key functions (d => d.id) ensure object constancy on brush updates, progress-bar math is correct, and hardcoded project domain [projectStart, projectEnd] is appropriate for a Gantt context rather than a violation.", "stress_test": 5, "flags": ["update_storm"], "stress_test_note": "The brush handler calls the full render() on every mousemove with no RAF coalescing or debounce, triggering complete D3 data joins across 6 layers (bars, deps, grid, milestones, axis) at 60fps with 35 tasks.", "cognitive_load": 7, "cognitive_load_note": "Clean execution — 4-color status palette, subtle lane shading, and restrained dependency arrows keep the 35-task layout readable, but at full 6-month zoom roughly half the task labels truncate to ellipsis, making tooltips load-bearing for basic identification.", "composite": 6.8}, "28-cycle-plot": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberate Tol palette with sequential blue encoding for year progression, restrained mean-line annotation, and well-placed narrative callouts (COVID dip, Holiday Season bracket) show clear design intent, though the bottom half of the viewport is wasted empty space and the mean value labels at 8px are marginal on readability.", "encoding_integrity": 8, "encoding_integrity_note": "Cycle plot is structurally honest — data-driven Y domain via d3.min/max, no zero-baseline violation (line/dot chart, not bar), no radius deception, correct per-month mean from data, single shared Y-scale; minor omissions: no line.defined() for gap handling and no key functions in data joins, neither of which causes real deception with the complete synthetic dataset.", "stress_test": 8, "flags": ["Mid-Flight Snap"], "stress_test_note": "updateHighlight() starts 120ms transitions on every pointerenter/pointerleave without calling .interrupt() first, so rapid hover across dots can stack conflicting transitions; all other checks pass cleanly (pointer events unify mouse/touch, no brush/zoom storm, no cross-view dispatch loop, scales are static so no stale closure risk).", "cognitive_load": 8, "cognitive_load_note": "Clean cycle plot execution: 12 panels share a Y-axis and a 5-shade sequential blue palette that matches the ordinal year encoding, keeping cross-panel comparison effortless; the sparse annotations (High/Low, COVID dip, Holiday bracket) add context without clutter, and the 5-dot-per-panel density is well within perceptual limits.", "composite": 8.0}, "29-bar-chart-race": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol palette, tabular-nums monospace values, and year watermark show real design intent, but Canada/China bars overlap at identical values and the scrubber/controls row feels slightly dense against the generous chart margins.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baseline correct, key functions present (d => d.country), domain is data-driven via d3.max, but x-scale domain recalculates every frame from the top-12 subset causing cross-time absolute comparisons to be unreliable — mitigated by absolute value labels and is standard bar-chart-race trade-off.", "stress_test": 6, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "Scrubber fires unthrottled full D3 data joins on every input event without RAF coalescing, and unnamed enter/exit transitions lack .interrupt() calls so rapid scrubbing can conflict with in-flight animations; named 'move' transitions on updates and no cross-view dispatch prevent the other three traps.", "cognitive_load": 8, "cognitive_load_note": "Clean single-view race with dual labeling (name + code) compensating for the 15-color palette; animation quality can't be fully assessed statically but code uses named transitions, easeLinear, and prefers-reduced-motion correctly.", "composite": 7.1}, "30-scrollytelling-climate": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed scrollytelling — Tol palette, clear typographic hierarchy, polished step-card fade mechanic, and thoughtful annotations; docked from 8 because the step-0 gray bars at 0.35 opacity render nearly invisible, making the initial state feel unintentionally empty.", "encoding_integrity": 7, "encoding_integrity_note": "Bars correctly extend from zero baseline with key functions and honest color encoding, but hardcoded y-domain [-0.55, 1.45] and x-domain [1884, 2023] break metamorphic scaling and shift relations.", "stress_test": 7, "flags": ["mid-flight-snap", "unthrottled-resize"], "stress_test_note": "No .interrupt() before new transitions in renderState() means rapid IntersectionObserver scroll events can stack 700ms transitions; window resize listener also fires renderState with full DOM mutation on every pixel change without debounce.", "cognitive_load": 8, "cognitive_load_note": "Scrollytelling serializes complexity well — one sticky chart, 5 sequential states, a 2-hue palette (warm/cool), and contextual annotations per step keep working memory load minimal, with step 4's composite overlay (regression line + inline decade-bar chart + endpoint label) being the only moment where annotation density could briefly crowd the chart area.", "composite": 7.2}, "31-streaming-realtime-line": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional TOL-blue palette, gradient area fill, monospace stats bar, and a clean overview+brush panel show real design thought, but the stats row is visually busy and the overview label clips awkwardly into the brush selection.", "encoding_integrity": 7, "encoding_integrity_note": "Honest line encoding with data-driven domains and correct LTTB downsampling, but the area fill anchors to the dynamic chart bottom (vMin−pad, not 0) making the shaded region decoratively ambiguous, and stats (min/max/mean) reflect only the visible window rather than the full buffer, which could mislead users expecting historical extremes.", "stress_test": 8, "flags": ["axis-dom-mutations-every-raf-frame"], "stress_test_note": "RAF-gated render loop, correct sourceEvent guard on brush preventing infinite feedback, no D3 transitions eliminating mid-flight race, and unified Pointer Events API eliminating mouse-touch fight; minor: full D3 axis DOM re-render (selectAll tick/domain mutations) fires every frame at 60fps instead of only on scale change.", "cognitive_load": 9, "cognitive_load_note": "Single-series real-time line with overview+brush is clean and well-structured; live animation quality cannot be assessed from a static screenshot but the static layout shows no cognitive overload.", "composite": 7.7}, "32-shape-morphing-gallery": {"render": true, "visual_critic": 5, "visual_critic_note": "Clean Tol-palette cards and restrained grid layout show real design intent, but 6 of 9 panels render blank at screenshot time due to staggered setTimeout initialization — the gallery reads as broken rather than animated.", "encoding_integrity": 6, "encoding_integrity_note": "Structurally honest animation gallery with data-driven domains on most charts, but the Bar↔Pie radial-bar state uses a linear radius scale (yScale = scaleLinear mapped to outerRadius), making area ∝ value² — a classic lie factor violation — and no key functions are used in any data join, creating permutation-relation fragility if data were ever updated.", "stress_test": 8, "flags": ["Mid-Flight Snap"], "stress_test_note": "Purely automated gallery eliminates Update Storm, Infinite Loop, Stale Scale, and Mouse-Touch risks entirely, but all 9 morph loops omit .interrupt() before launching new transitions, leaving a latent mid-flight snap if browser timer drift causes a second loopMorph cycle to fire while a previous transition is still running.", "cognitive_load": 7, "cognitive_load_note": "9-cell gallery with clean layout, clear labels, and restrained per-cell color (Tol palette), but 9 concurrent animations with no focal hierarchy compete for attention — the staggered 400ms start offsets help, yet in motion the viewer can't comfortably track any single morph while eight others animate simultaneously; static screenshot also reveals 6 empty cells due to setTimeout stagger timing at capture, which is a rendering-timing issue rather than a design flaw.", "composite": 6.3}, "33-annotation-showcase": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol palette, elbow leader lines with collision avoidance, and clean typographic hierarchy earn a 7, but the two crash event labels ('Sell-off begins' / 'Market trough') collide at the top and the range arrow sits awkwardly offset from its annotated points.", "encoding_integrity": 8, "encoding_integrity_note": "Line chart with fully data-driven domains (d3.extent, d3.min/max), correct OLS trend, accurate percentage annotation, no zero-baseline violation (line chart exemption), no size-encoding or dual-axis issues; only gap: missing line.defined() guard, harmless here since synthetic data is complete.", "stress_test": 8, "flags": ["UpdateStorm"], "stress_test_note": "Un-throttled pointermove fires Delaunay lookup plus innerHTML and multiple style writes at 60fps with no RAF coalescing; all other interaction risks (infinite loop, stale scale, mid-flight snap, mouse-touch fight) are absent because the chart has no brush, zoom, cross-view dispatch, transitions, or separate mouse/touch handlers (uses unified Pointer Events API).", "cognitive_load": 8, "cognitive_load_note": "Single-view line chart with dense but well-managed annotations (3 callouts, 3 event markers, range arrow, trend line, threshold band) using a restrained Tol palette; the only perceptual friction is the 'Sell-off begins' and 'Market trough' labels crowding at the top of the chart.", "composite": 7.7}, "34-visual-texture-a11y": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate dual-encoding concept with a colorblind-safe palette and distinct patterns earns real design credit, but the bottom half of the viewport is wasted empty space and the large side-by-side panels feel slightly cramped at this canvas size.", "encoding_integrity": 8, "encoding_integrity_note": "Zero baseline enforced, y-domain is data-driven via d3.max, no size/radius deception, and dual color+pattern encoding is honestly labeled — minor: static render avoids key-function concern but yMax*1.08 buffer is a magic number.", "stress_test": 9, "stress_test_note": "No brush/zoom/transitions/cross-view dispatch present; pointer events API unifies mouse+touch correctly; only interaction is a lightweight tooltip on pointermove with no D3 re-renders, so no stress-test criteria are violated.", "cognitive_load": 8, "cognitive_load_note": "Two panels form a single conceptual unit (normal vs. deuteranopia), 4 categories with a colorblind-safe palette and perceptually distinct patterns keep cognitive load well within limits, though pattern overlays are subtle enough that texture-only discrimination requires deliberate inspection.", "composite": 7.9}, "35-color-palette-explorer": {"render": true, "visual_critic": 6, "visual_critic_note": "Genuine design thought in panel structure, monospace for technical values, and semantic traffic-light contrast matrix, but the bar chart is decorative filler and the 6.5px CVD hex labels are too small to read comfortably, keeping it at competent-but-not-remarkable.", "encoding_integrity": 8, "encoding_integrity_note": "Bar chart uses honest zero baseline and data-driven domain (d3.max); WCAG contrast ratios are computed with correct linearization; no lie factor, dual-axis, or gap issues — minor flaw is unseeded d3.randomNormal regenerating new data on each palette switch, preventing honest cross-palette comparison.", "stress_test": 9, "stress_test_note": "No brushes, zoom, or cross-view dispatch; palette switches do a full container tear-down (selectAll('*').remove()) which implicitly cancels in-flight transitions, and pointer events prevent mouse-touch conflicts — no stress-test violations found.", "cognitive_load": 8, "cognitive_load_note": "Three conceptually unified panels (bar chart, 7×7 contrast matrix, 4-condition CVD strips) update together on palette switch with purposeful grow-in animation; layout is clean and the views form one coherent tool rather than independent charts, though the 6.5px hex labels in the CVD strip are marginally too small to read without zooming.", "composite": 7.6}, "36-responsive-multi-breakpoint": {"render": true, "visual_critic": 2, "visual_critic_note": "Visually broken at screenshot time — the scatter plot and marginal histograms are completely absent, leaving only a title, badge, and a lone x-axis stranded at the bottom of a blank canvas; the ResizeObserver-driven render apparently did not fire before capture.", "encoding_integrity": 7, "encoding_integrity_note": "Correct scaleSqrt for size encoding and data-driven domains, but histogram bin counts are hardcoded (thresholds(24)/thresholds(20)) rather than data-driven, and the chart renders blank on load since it depends entirely on ResizeObserver firing.", "stress_test": 6, "flags": ["Update Storm - ResizeObserver fires render() on every pixel without debounce or RAF, triggering full multi-layer data joins and axis redraws at resize rate"], "stress_test_note": "The 1px width guard is insufficient — rapid window resize hammers render() with expensive DOM mutations across 9 layers at up to 60fps; named transition 'main' prevents mid-flight snapping but constant interruption causes animation jank; no brush/zoom interactions so loop/stale-scale/touch risks are N/A.", "cognitive_load": 3, "cognitive_load_note": "Cognitively sound design (4 colors, single responsive view, staged transitions) but the chart fails to render data in the screenshot — only an empty x-axis is visible, making insight extraction impossible.", "composite": 4.3}, "37-accessible-canvas-scatter": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional Tol bright palette and clear typographic hierarchy lift it above generic, but 45% opacity across 1,500 overlapping dots washes out the color encoding in the dense region, making the promised clusters and correlations hard to see.", "encoding_integrity": 7, "encoding_integrity_note": "Scatter encoding is honest (zero-anchored axes, fixed-radius dots with no size deception, clear categorical color), but scale domains are hardcoded magic numbers ([0,36],[0,210]) rather than data-driven, making the chart brittle under data changes; D3 table join correctly uses key functions and canvas redraw is stateless, so permutation/subset relations hold.", "stress_test": 7, "flags": ["RAF_loop_proliferation"], "stress_test_note": "Each keydown and focus event calls render() synchronously which schedules a new requestAnimationFrame(render) without cancelling any existing RAF loop, so rapid arrow-key navigation spawns multiple concurrent animation loops; no cancelAnimationFrame guard exists (no brush/zoom storm, no cross-view feedback, no touch fight since pointer events are used correctly).", "cognitive_load": 8, "cognitive_load_note": "Single view with a well-chosen 5-color Tol palette and 45% opacity manages 1,500 points cleanly; the positive trend reads immediately, though Biology (#4477AA) and Chemistry (#66CCEE) blur together in the dense experience-10–25 band where overlapping circles from both hues merge into ambiguous mid-tones.", "composite": 7.0}, "38-dual-axis-gap-handling": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberate Paul Tol palette, color-coded dual axes, well-handled gap semantics (dashed bridges, hatched bars, shaded regions, labeled markers), and generous whitespace — held back from 9 by the cyan rainfall axis text being barely readable against the light background and the subtitle/legend crowding the top margin.", "encoding_integrity": 8, "encoding_integrity_note": "Rainfall bars have honest zero baseline, temperature non-zero baseline is disclosed via zigzag break indicator, gap handling exceeds requirements (segment splitting + dashed bridges + markers rather than mere line.defined()), dual-axis risk is mitigated by distinct visual channels, color-coded labels, and an explicit caution footnote, with all domains derived from d3.extent/d3.max rather than magic numbers.", "stress_test": 7, "flags": ["Update Storm"], "stress_test_note": "The unthrottled `pointermove` handler mutates ~8 DOM attributes per frame and reads `tooltip.node().offsetWidth` (forced sync layout reflow) on every mousemove with no RAF coalescing; no brush/zoom, no transitions, no cross-view dispatch, and Pointer Events API correctly unifies mouse/touch, so all other checks pass.", "cognitive_load": 8, "cognitive_load_note": "Single-view dual-axis chart with only 4 hues; gap encoding (dashed bridges, hatched bars, boundary circles, shading) has upfront parsing cost but the legend and subtitle fully explain it, and the color-coded axes keep the two series mentally separable.", "composite": 7.8}, "39-quadtree-hit-detection": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Paul Tol palette over schemeCategory10 and thoughtful interaction details (glow rings, dashed connectors, crosshair, Voronoi toggle) show genuine design intent, though the gray Chalcogen cluster reads weakly against the white background and the legend/title stacking at top-left feels cramped.", "encoding_integrity": 7, "encoding_integrity_note": "No encoding violations (scatter plot, ordinal color, decorative radii not encoding data); positions map directly as pixel coordinates without a D3 scale, acceptable for this synthetic spatial demo, but hardcoded cluster centers and no axis scales limit robustness under data changes.", "stress_test": 6, "flags": ["Update Storm: updateVoronoi() runs synchronously on every zoom event — recomputes d3.Delaunay.from() over 5000 points and does a full DOM join of 5000 <path> elements with no RAF coalescing or throttle guard", "Mid-Flight Snap: resetZoom fires a 750ms svg.transition() with no .interrupt() call, so rapid re-clicks stack concurrent transitions"], "stress_test_note": "Canvas highlights use a correct dirty-flag/RAF pattern, but enabling the Voronoi overlay exposes a severe update storm in the zoom handler where O(n log n) Delaunay recomputation and 5000-node DOM mutation run unthrottled on every wheel tick.", "cognitive_load": 7, "cognitive_load_note": "Single-view scatter with well-separated clusters carries 8 colors without overload, but the legend/title stack at top-left overlaps the densest cluster region, and 5000 overlapping points in the central zone obscure structure until the user zooms or hovers.", "composite": 6.8}, "40-minimap-navigator": {"render": true, "visual_critic": 7, "visual_critic_note": "Restrained Tol palette, clean typographic hierarchy, and generous whitespace give this a deliberately designed feel, but the minimap brush selection rectangle (blue outline, barely visible area fill) sits awkwardly against the grey minimap line and reads as a debug artifact rather than a polished UI element.", "encoding_integrity": 8, "encoding_integrity_note": "Honest line chart with data-driven domains via d3.extent, correct LTTB downsampling, no lie factor or dual-axis violations; dynamic Y rescaling to visible slice is standard for pan-zoom time series and acceptable given the minimap's fixed full-extent context.", "stress_test": 4, "flags": ["Update Storm", "Mouse-Touch Fight"], "stress_test_note": "Every zoom/brush event triggers a synchronous full canvas redraw, SVG axis DOM mutation, and up to 50k-iteration stats loop with no RAF coalescing or debouncing; the zoom filter partially guards against right-click but does not prevent touchstart+mousedown double-firing on mobile.", "cognitive_load": 9, "cognitive_load_note": "Two-view layout with a single color series, LTTB downsampling, and LOD transitions keeps 50k points readable at every zoom level with minimal cognitive load; minor deduction for the minimap brush handle being nearly invisible at its far-right default position.", "composite": 7.1}, "41-force-bundling-chord-triptych": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate Tol palette, synchronized cross-panel highlighting, and uppercase panel-title treatment show real design intent, but 8px labels crowd the bottom of the bundling panel and the mechanical equal-thirds layout underserves the force-directed panel's visual weight.", "encoding_integrity": 7, "encoding_integrity_note": "All three panels use structurally honest encodings (chord arcs/ribbons are area-proportional via d3.chord, node size is fixed non-data, no truncated baselines) but no key functions in any data join and a fully hardcoded 5-group×8-node synthetic structure make it brittle under data substitution.", "stress_test": 7, "flags": ["Update Storm (un-throttled slider input triggers full canvas drawEdges on every tick without RAF or debounce)", "Infinite Feedback Loop (dispatch.call passes null as source; no `if (source === this) return` guard, though handlers don't re-dispatch so risk is latent)"], "stress_test_note": "Largely robust — pointer events unify mouse/touch correctly, no transitions mean no mid-flight snaps, static pre-computed layout avoids stale scale closures, and hover is bound to pointerenter (not pointermove) so cross-panel updates don't storm at 60fps; only the tension slider fires an un-throttled full canvas redraw on every input event.", "cognitive_load": 7, "cognitive_load_note": "Three linked views of one network form a coherent conceptual unit with restrained 5-color Tol palette and clean cross-panel dispatch, but 8px rotated labels in the radial bundling panel are a real legibility strain at the Thalamus cluster where 8 nodes crowd the lower arc.", "composite": 7.0}, "42-phyllotaxis-data-art": {"render": true, "visual_critic": 4, "visual_critic_note": "The control panel typography and layout are cleanly designed, but the default ocean palette renders nearly invisible against the #111 background — at 2000 dots the computed alpha (~0.08) produces dots that are almost indistinguishable from the dark canvas, defeating the visualization's own glow premise.", "encoding_integrity": 7, "encoding_integrity_note": "Pure generative art with no data encoding violations — golden angle and sqrt radial spacing are mathematically correct for uniform area density, but encoding integrity criteria are largely N/A since no external data values are represented.", "stress_test": 9, "stress_test_note": "All interactions are correctly mediated through a RAF loop—sliders and pointermove only mutate state variables, pointer events use the unified Pointer Events API, and there are no D3 transitions or cross-view dispatchers to produce storms, stale closures, or feedback loops.", "cognitive_load": 8, "cognitive_load_note": "Single-view data art with coherent animation — cognitive overhead is minimal (one spiral, one conceptual unit, four sliders), but the screenshot shows very low dot contrast against the dark background, suggesting the additive glow effect requires motion to read well.", "composite": 6.8}, "43-classification-choropleth": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional YlOrBr palette with good lightness ramp, synchronized hover across all four maps, and a histogram breakpoint overlay are deliberate design choices, but the legend text at 9px is barely legible and the four maps feel cramped with insufficient breathing room between panels.", "encoding_integrity": 7, "encoding_integrity_note": "Color scales are data-driven and correctly labeled across all four classification methods, but the supplementary histogram uses 30 fixed bins for ~51 data points (over-binned vs. Sturges'/Scott's rule) and state joins lack key functions.", "stress_test": 7, "flags": ["update_storm_slider"], "stress_test_note": "Slider `input` handler calls `update()` synchronously with no throttle, triggering 200+ DOM mutations (fill on 50 states × 4 panels + legend + histogram line removal/recreation) on every discrete step change; all other checks pass — no transitions to interrupt, no dispatch feedback loops, no stale closures (scales recomputed per call), and pointer events unify mouse/touch correctly.", "cognitive_load": 8, "cognitive_load_note": "Four-panel comparison reads as a single conceptual unit with a well-ordered sequential palette, but the 9px monospace legend labels with dollar ranges are borderline illegible at display size.", "composite": 7.2}, "44-diverging-midpoint-heatmap": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed — Tol-inspired diverging palette, clear typographic hierarchy, intentional event annotations with leader lines, and the Singapore panel's near-white cells effectively communicate narrow climate range without any additional explanation.", "encoding_integrity": 8, "encoding_integrity_note": "Symmetric diverging scale correctly anchored at 0 with data-driven domain via d3.max; shared color scale across all cities enables honest cross-city comparison with transparent Singapore annotation, though no key functions on data joins (acceptable for static render) and Math.ceil rounding slightly compresses saturation at extremes.", "stress_test": 9, "stress_test_note": "Static heatmap with pointer-event-based tooltips only — no brush, zoom, transitions, or cross-view dispatch, so all five interaction traps are structurally absent; the sole minor issue is offsetWidth/offsetHeight reads inside pointermove causing repeated layout reflows, but no DOM mutations occur there.", "cognitive_load": 8, "cognitive_load_note": "Calendar layout handles ~1098 cells cleanly across 3 panels — the diverging blue-white-red scale is semantically clear, annotations are sparse and well-placed, and Singapore's washed-out appearance is correctly framed as a feature via the range annotation rather than a perceptual failure.", "composite": 7.9}, "45-log-scale-bee-swarm": {"render": true, "visual_critic": 7, "visual_critic_note": "Colorblind-safe Tol palette, monospace axis labels, and the embedded box plot summary are deliberate design choices that elevate this well above generic, but the swarm occupies only the top third of a very tall canvas leaving a large empty lower half that makes the layout feel unresolved.", "encoding_integrity": 8, "encoding_integrity_note": "Honest bee-swarm encoding: log scale is appropriate for skewed log-normal data, domain is data-driven via d3.extent, fixed radius avoids lie factor, key function present, and box plot augments distributional context; minor robustness concern is that removing a point shifts the shared extent domain, causing axis jump.", "stress_test": 5, "flags": ["update_storm_pointermove", "mid_flight_no_interrupt"], "stress_test_note": "The unthrottled pointermove handler iterates all 500 nodes and mutates all 500 circle attributes on every mousemove without RAF or dirty-flag coalescing, and rapid scale-toggle clicks fire overlapping 600ms axis transitions with no .interrupt() guard.", "cognitive_load": 8, "cognitive_load_note": "Six-color Tol palette stays distinguishable across 500 points, the log scale manages the wide revenue spread cleanly, and the companion box plot anchors summary stats — main limitation is that sector mixing in the dense center makes per-sector pattern reading slow without hover interaction, which can't be assessed from the static screenshot.", "composite": 7.1}, "46-threshold-scale-dashboard": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberate colorblind-safe palette (Paul Tol), clear typographic hierarchy with monospace data cells, and well-composed multi-encoding columns (sparklines, bullet charts, uptime bars), but the memory bullet chart labels are clipped at the right edge and the table feels slightly cramped at 13px with tight row padding.", "encoding_integrity": 7, "encoding_integrity_note": "Structurally honest — zero baselines correct, key function present for data joins, CPU sparkline domain [0,100] appropriate for bounded metric — but memory bullet bar reuses CPU threshold sliders for its color encoding (semantic mismatch) and sparklines lack `line.defined()` for gap handling.", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "Slider 'input' fires a full render() with svg.selectAll('*').remove() + DOM rebuild for all 20 sparklines and bullet charts on every pixel of drag (no RAF, no debounce); FLIP animation captures getBoundingClientRect() mid-transition on rapid re-sort, producing wrong deltas and visual snaps with no interrupt guard.", "cognitive_load": 8, "cognitive_load_note": "Clean 3-color Tol palette with consistent semantic encoding across all columns, KPI strip + threshold sliders provide clear hierarchy, and row-level chunking keeps 7 columns × 20 rows manageable — sparkline threshold bands at 72×22px are near the minimum readable size and FLIP sort animation quality can't be assessed statically.", "composite": 6.7}, "47-mixed-scale-parcoords": {"render": true, "visual_critic": 7, "visual_critic_note": "Colorblind-safe Tol palette, canvas/SVG layering, and clean typographic hierarchy make this feel deliberately designed, but the dense unfiltered line mass at 30% alpha is visually noisy and the subtitle's meta-commentary ('2 linear, 1 log…') reads as developer notes rather than user-facing context.", "encoding_integrity": 8, "encoding_integrity_note": "Log scale correctly applied to log-normally distributed salary, data-driven domains via d3.extent/d3.max for continuous axes, appropriate ordinal scalePoint for categorical dimensions, colorblind-safe palette, and no misleading encoding patterns; minor deduction for hardcoded performance domain [1,5] (semantically justified but not derived from data) and no .nice() on the salary log scale.", "stress_test": 7, "flags": ["Update Storm"], "stress_test_note": "drawLines() is called synchronously on every brush mousemove event without requestAnimationFrame or a dirty-flag coalesce, redrawing all 300 polylines per frame; canvas mitigates jank but the pattern is still unthrottled.", "cognitive_load": 6, "cognitive_load_note": "The colorblind-safe 6-color palette and low alpha (0.30) are well-chosen, but 300 unfiltered lines converging on two ordinal axes (Department, Education) create dense hairball bundles at those columns that make cross-axis patterns unreadable without brushing — the unfiltered state is the primary cognitive load failure.", "composite": 7.0}, "48-scale-perception-network": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol diverging palette and neighborhood-highlight interaction are genuinely considered, but the SVG renders at 1200×800 inside a narrower viewport leaving the graph clipped and the legend pushed below the fold.", "encoding_integrity": 8, "encoding_integrity_note": "Default sqrt scale correctly encodes area, domains are data-driven via d3.extent, key functions present on node join, and linear/log options are intentionally labeled as distortions for educational purposes; minor: size legend uses hardcoded sample values [10,30,60,100] instead of data-driven quantiles.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "The ticked() function directly sets labelSel dy on every simulation tick, fighting the 600ms dy transition triggered on scale change—the label offset animation is immediately overwritten each tick, and no .interrupt() is called before the new transition starts.", "cognitive_load": 6, "cognitive_load_note": "60 nodes with moderate edge density (~200 edges); low-opacity gray edges and selective labeling (top 15%) manage clutter well, but community structure is invisible in the layout — the four communities bleed together into a central tangle with no visible cluster separation, undermining the network's social structure narrative.", "composite": 7.0}, "49-textured-network-diagram": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed with a Tol colorblind-safe palette, meaningful texture dual-encoding, and a clean legend with grayscale toggle, but the force layout leaves uneven whitespace (heavy bottom void) and a few community clusters sit too close together to read separation clearly.", "encoding_integrity": 8, "encoding_integrity_note": "Correct scaleSqrt for degree-based node sizing, data-driven domain via d3.extent, and key function on data join; no bar/area baseline concerns for this chart type, with dual color+texture encoding being intentionally honest and accessibility-verified via grayscale toggle.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "No .interrupt() calls before the 150ms hover transitions or the 400ms grayscale toggle transitions, so rapid pointer-enter/leave cycles or clicking the mode button mid-hover can leave opacity and fill attributes in conflicting in-flight states; no brush/zoom means Update Storm, Stale Closure, Infinite Loop, and Mouse-Touch Fight criteria are cleanly avoided.", "cognitive_load": 8, "cognitive_load_note": "Six communities separate cleanly in the force layout, dual color+texture encoding stays within perceptual limits (6 hues, 6 distinct textures), edge density is low enough that inter-cluster bridges don't create spaghetti, and neighborhood highlighting on hover manages the ~110-edge count well — the main weakness is slight spatial crowding where communities abut in the center, making a few cross-community edges hard to trace without interaction.", "composite": 7.5}, "50-stippled-density-map": {"render": true, "visual_critic": 6, "visual_critic_note": "Deliberate parchment palette, warm brown dots, and subtle dual-weight borders show real design intent, but the legend overlaps the Alaska inset — a concrete layout bug that undercuts an otherwise considered execution.", "encoding_integrity": 8, "encoding_integrity_note": "Dot-count encoding is linearly honest (nDots = pop/10000) on an equal-area AlbersUsa projection so visual density faithfully reflects geographic density, but the legend hardcodes NJ/WY density values instead of deriving them from the live data pipeline, and the computed maxDensity variable is never used.", "stress_test": 9, "stress_test_note": "Uses Pointer Events API (no mouse-touch fight), guards redundant redraws with activeFips check, has no transitions to interrupt, no cross-view dispatch, and no zoom/brush closures to go stale; only minor concern is a double canvas redraw (pointerleave+pointerenter) at state borders but it is not per-frame.", "cognitive_load": 8, "cognitive_load_note": "Single monochromatic view with ~33,000 dots and a clean hover-highlight interaction; cognitive load is minimal, though dot saturation in the Northeast makes individual state boundaries perceptually indistinct without hovering.", "composite": 7.6}, "51-accessible-force-network": {"render": true, "visual_critic": 6, "visual_critic_note": "Paul Tol palette and thoughtful accessibility scaffolding show real intentionality, but the flat #fafafa canvas, uniform node sizing, and generic system-ui typography produce a competent-but-undesigned feel at normal viewing distance.", "encoding_integrity": 7, "encoding_integrity_note": "No deceptive encodings (uniform node size, honest categorical color for community, no axes/baselines to truncate), but degree is not visually encoded in the network itself, and the pre-computed force layout (simulation.tick(300) then frozen) fails the scaling/shift metamorphic relations — data changes would not update node positions.", "stress_test": 7, "flags": ["Update Storm (RAF loop without dirty flag)"], "stress_test_note": "The animated focus-ring RAF loop (line 463) re-draws all 150 nodes and 260 links at 60fps with no dirty-flag guard, and table row pointerenter/pointerleave fire raw render() calls; no stale-scale, infinite-loop, mid-flight, or touch-fight issues exist because the simulation is pre-computed and Pointer Events API is used correctly.", "cognitive_load": 7, "cognitive_load_note": "6-color Tol palette, pre-computed static simulation, and 18%-opacity edges manage 150-node density well, but community clusters overlap enough at rest that structure isn't legible without interaction.", "composite": 6.7}, "52-accessible-choropleth": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional Tol sequential palette and clean typographic hierarchy elevate it above generic, but the legend labels run together without spacing ('$10,936$12,271$13,606'), a concrete layout bug that undermines an otherwise competent choropleth.", "encoding_integrity": 7, "encoding_integrity_note": "Choropleth is structurally honest — data-driven scaleQuantize domain, correct legend thresholds — but the table's inline bar scale uses a truncated baseline (d3.scaleLinear(extent, [0,100])) starting at the data minimum rather than zero, exaggerating relative differences between states.", "stress_test": 8, "flags": ["Update Storm (minor): table pointerenter/pointerleave call render() without debounce or RAF"], "stress_test_note": "No brush/zoom/transition interactions eliminates most stress-test risks, but table row hover triggers un-throttled full canvas redraws on every pointerenter and pointerleave without RAF coalescing.", "cognitive_load": 8, "cognitive_load_note": "Single-view choropleth with a restrained 5-step sequential blue palette reads cleanly at a glance; the only perceptual friction is legend label crowding ($10,936$12,271 run together without gaps), and small northeastern states are hard to distinguish without the hover interaction.", "composite": 7.2}, "53-textured-raincloud": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberately designed: Tol palette with distinct SVG texture overlays, clean typographic hierarchy, well-proportioned row layout, and a genuinely useful accessibility toggle — held from 9 by the redundant legend (groups already labeled on y-axis) and the slightly cramped bottom row cut off by the viewport.", "encoding_integrity": 8, "encoding_integrity_note": "Data-driven x-domain (d3.extent), Silverman bandwidth, correct IQR box stats, and pattern+color dual encoding are all honest; per-group KDE normalization hides cross-group density comparisons (by-design but unstated), and Silverman may over-smooth the intentional Coastal bimodal group.", "stress_test": 9, "stress_test_note": "No brush/zoom/transitions or cross-view dispatch present; hover uses Pointer Events API unifying mouse and touch, and pointermove only mutates two CSS properties—no interaction robustness violations found.", "cognitive_load": 8, "cognitive_load_note": "Six-group raincloud with dual color+pattern encoding is well-managed: 6 hues stay within perceptual limits, the three-layer anatomy (KDE, box, strip) is clearly separated vertically within each row, and the legend is compact and self-explanatory — the main friction is that the box plot whisker line sits very close to the jitter strip, making the two layers slightly hard to parse at a glance without the anatomy key.", "composite": 8.2}, "54-textured-treemap": {"render": true, "visual_critic": 7, "visual_critic_note": "Ambitious bivariate encoding with a deliberately chosen Tol palette and well-implemented pattern-density legend, but the subcategory pattern key is misleading (each subcategory index maps to the same pattern across all categories, not one pattern per named subcategory), and the dense pattern overlay on small cells creates visual noise that obscures rather than encodes growth.", "encoding_integrity": 7, "encoding_integrity_note": "Area encoding is correct (d3.hierarchy sum with data-driven domains), no baseline or radius deception, but pattern density is a perceptually weak quantitative channel for growth rate and no key functions are used in data joins (acceptable for this static render).", "stress_test": 9, "stress_test_note": "Static treemap with pointer-unified tooltips only — no brush, zoom, transitions, or cross-view dispatchers exist, so all five interaction stress-test criteria are cleanly satisfied; the sole minor nit is that pointermove repositions the tooltip via inline style on every event without RAF, but this is CSS-only and trivially cheap.", "cognitive_load": 5, "cognitive_load_note": "Color encoding (6 categories) works and the treemap layout is clean, but superimposing two pattern channels — shape (subcategory) and density/spacing (growth rate) — on top of hue forces the viewer to simultaneously decode four visual variables (area, color, pattern type, pattern spacing), and the density channel is perceptually too weak to read without hovering on every cell.", "composite": 6.9}, "55-webgl-million-scatter": {"render": true, "visual_critic": 6, "visual_critic_note": "Deliberate Tol colorblind-safe palette and SDF circle rendering show real design intent, but placeholder 'X'/'Y' axis labels, washed-out overlapping cluster blobs from 0.35 alpha blending, and an always-visible empty inset panel keep it at competent demo rather than polished work.", "encoding_integrity": 8, "encoding_integrity_note": "Scatterplot position encoding is honest with data-driven linear scales (d3.min/d3.max + .nice()), correct categorical color channel, and no baseline/lie-factor violations; only minor issue is the hardcoded 20-bin inset histogram rather than a data-driven bin count.", "stress_test": 4, "flags": ["Update Storm"], "stress_test_note": "The brush handler synchronously iterates all 1M points twice (visibility loop + histogram loop), uploads a 4MB GPU buffer via bufferSubData, and calls draw() — all on every mousemove with no RAF coalescing, dirty flag, or debounce.", "cognitive_load": 8, "cognitive_load_note": "WebGL alpha-blending converts 1M points into readable density hazes, 6-color Tol palette stays distinguishable, and the 2-view layout (scatter + inset histogram) is well within working-memory limits; the only weak spot is the overlapping cluster centers create an ambiguous muddy region where per-point cluster membership is unresolvable.", "composite": 6.6}, "56-webgl-force-galaxy": {"render": true, "visual_critic": 7, "visual_critic_note": "Tol muted palette with glow-blended particles on a dark background creates a genuinely beautiful galaxy aesthetic, but the legend is cramped into the top-right alongside the controls and the title buries itself in dim low-contrast text at bottom-right where it's nearly invisible.", "encoding_integrity": 8, "encoding_integrity_note": "Size encoding correctly uses scaleSqrt for degree-proportional area; domain is data-driven via d3.max; no bar/area baseline violations; community color mapping is honest 1-to-1; no dual axes or smoothing deception.", "stress_test": 8, "flags": ["Stale Closure (Quadtree)"], "stress_test_note": "RAF loop, pointer events, and transition-free rendering avoid the major pitfalls, but the quadtree is rebuilt only every 8 frames so hover hit-detection targets stale node positions during hot simulation; no update storm, infinite loop, mid-flight snap, or mouse-touch fight detected.", "cognitive_load": 5, "cognitive_load_note": "Community clusters read clearly at macro scale with 8 well-chosen Tol colors, but 50K nodes obliterates network topology — edges at 0.08 opacity vanish into texture, node-level relationships are invisible, and the reheat animation (unassessable from screenshot) would scatter 50K particles simultaneously, making this a particle-density aesthetic rather than an analyzable network.", "composite": 6.9}, "57-webgl-streaming-particles": {"render": true, "visual_critic": 8, "visual_critic_note": "Deliberate Tol-derived palette (indigo→teal→sand) with additive blending glow and trail fade creates a polished, visually cohesive particle flow demo — controls panel and FPS readout are well-styled, though the legend is tiny and the title sits awkwardly above the canvas rather than integrated into it.", "encoding_integrity": 7, "encoding_integrity_note": "Color-to-velocity encoding is proportionally correct with linear interpolation, but magnitude normalization uses a hardcoded magic number (1.1) rather than a data-driven domain, and D3 is imported but entirely unused — all rendering is raw WebGL math.", "stress_test": 9, "stress_test_note": "Pure WebGL RAF loop with slider handlers that only mutate primitive variables sidesteps all five interaction traps: no brush/zoom storms, no cross-view dispatch, no D3 scale closures, no transitions to interrupt, and no mouse/touch handlers on the canvas.", "cognitive_load": 8, "cognitive_load_note": "Single-channel sequential encoding (velocity → indigo-teal-yellow) with coherent trail-driven flow streams makes macro-structure immediately readable in the static frame; animation quality at 200K simultaneous movers cannot be assessed from screenshot but the trail fade design mitigates swarm chaos.", "composite": 8.0}, "58-webgl-density-heatmap": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional perceptual color ramp (dark-blue→cyan→yellow→white) with gamma correction and smooth LOD crossfade from heatmap to cluster-colored points shows real design thought, but the HUD and legend panels are visually mismatched (monospace vs. system-ui, inconsistent border radii), and the title doubles as a UI instruction string rather than a descriptive label, diluting typographic hierarchy.", "encoding_integrity": 7, "encoding_integrity_note": "Density normalized by data-driven maxDensity and gamma-corrected for perceptual scaling, but the linear legend strip misrepresents the non-linear (γ=0.45) color mapping, and the ramp cycling back to white at max density risks conflating peak density with zero-data background regions.", "stress_test": 5, "flags": ["Update Storm: zoom handler calls draw() directly on every event — RAF/debounce infrastructure (pendingTransform, rafId, debouncedZoom) is dead code never wired up; axis DOM mutations (xAxisG.call, yAxisG.call) and hud.inne
