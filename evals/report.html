tive_load_note": "Single view, 4 phases, 24 points, restrained single-hue palette — clean and uncluttered in static form; animation quality (the entire premise) cannot be assessed from screenshot, but the opacity cross-fade approach in renderClean avoids perceptual noise from coordinate-level morphing.", "composite": 7.0}, "100-city-similarity-explorer": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional dark navy palette with temp-coded RdYlBu lines, confident ghost/active layering, and a clean linked map — let down by left-clipped axis labels and all-same-weight typography between title, axis labels, and tick text.", "encoding_integrity": 7, "encoding_integrity_note": "Parallel coordinates axes use data-driven d3.extent domains with padding (honest), no bar/area baseline issues, no size-encoding lie factor, but the temperature color scale domain is hardcoded [30,-2] rather than derived from data, and map dot joins lack key functions though the static data makes this benign.", "stress_test": 5, "flags": ["Update Storm"], "stress_test_note": "The brush 'brush' event calls renderLines() on every mousemove with a full canvas redraw plus synchronous DOM mutations in updateMap() — no requestAnimationFrame coalescing or dirty-flag pattern; mitigated by canvas rendering and a small 40-city dataset, but the pattern is a clear violation.", "cognitive_load": 8, "cognitive_load_note": "Two well-linked views with restrained sequential color (temperature only), ghost/active layering manages 40-line parcoords density, and the brush-to-map interaction model is immediately legible from the subtitle — no categorical color overload, no animation noise, and the only risk is label crowding on the map when all 40 cities are unfiltered.", "composite": 6.8}, "102-earthquake-depth-globe": {"render": true, "visual_critic": 8, "visual_critic_note": "Cohesive dark-theme dashboard with plasma depth colorscale, deliberate panel layout, and meaningful cross-panel brushing, though the legend placement in the globe panel clips against the left edge and the ridgeline zone labels feel cramped at this render size.", "encoding_integrity": 8, "encoding_integrity_note": "Honest encoding throughout: scaleSqrt correctly used for bubble radius, all domains data-driven via d3.extent, KDE uses Silverman's bandwidth rule; minor gap: no key functions in data joins, but no dynamic updates occur so impact is limited.", "stress_test": 4, "flags": ["Update Storm"], "stress_test_note": "The brush handler fires globeApi.render() (full canvas clear+redraw), all-dot DOM attribute mutations, and per-zone KDE recomputation inside updateRidgeHighlights on every mousemove with zero throttling, RAF coalescing, or dirty-flag gating.", "cognitive_load": 7, "cognitive_load_note": "Three linked panels with restrained color use (plasma sequential + 5 zone hues) stay well within working memory limits, but the auto-rotating globe creates constant motion that competes with reading the adjacent scatter and ridgeline panels — perceptual cost of the animation cannot be fully assessed from a static screenshot.", "composite": 7.0}, "103-book-sentence-rhythm": {"render": true, "visual_critic": 7, "visual_critic_note": "Cohesive steel-blue palette with red accent dots, clean typographic hierarchy, and a clever dual-encoding (sparkline + mini violin) that earns its layout — violins are quite small but still readable.", "encoding_integrity": 8, "encoding_integrity_note": "Zero-based shared Y scales, data-driven Silverman bandwidth for KDE, correct linear density-to-width violin encoding, and key functions present; per-chapter violin normalization prevents cross-row density comparison but is acceptable for shape display.", "stress_test": 8, "flags": ["stale_closure"], "stress_test_note": "No brush/zoom update storms, no transitions to interrupt, and pointer events unify mouse/touch correctly, but xScale is captured in a static closure inside drawSparkline with no resize handler, making it a latent stale reference if the viewport changes.", "cognitive_load": 8, "cognitive_load_note": "Single-color palette, consistent encoding across 20 rows, and a shared y-scale keep the table scannable — the violin+sparkline pairing is informative without adding visual noise, though the mini violins are too narrow (60px) to reliably distinguish distribution shapes at a glance.", "composite": 7.7}, "104-nutrient-treemap-explorer": {"render": true, "visual_critic": 5, "visual_critic_note": "Treemap section is well-colored with distinct categorical hues, but the parallel coordinates below is a dense tangle of thin lines on a near-black background with no legend, making it nearly unreadable and disconnecting the two halves visually.", "encoding_integrity": 8, "encoding_integrity_note": "Treemap area correctly encodes calories via hierarchy sum, parallel coordinates use data-driven d3.extent domains with proper key functions, no baseline violations, radius deception, or quantile traps — brush filter correctly operates in pixel-space coordinates.", "stress_test": 5, "flags": ["update_storm", "mid_flight_snap"], "stress_test_note": "Brush fires drawPC (canvas clear+redraw) and highlightTreemap (DOM class mutations on all leaf rects) on every mousemove without RAF or dirty-flag coalescing; zoomTo() starts 650ms transitions without .interrupt(), causing element jumping on rapid clicks.", "cognitive_load": 7, "cognitive_load_note": "Two linked views with 7 distinct hues are well-managed via treemap zoom and PC ghost/active layering, but the smallest treemap cells lack readable labels and the PC's 56 lines form a moderate tangle at rest before any brush filter is applied.", "composite": 6.2}}}, {"timestamp": "2026-03-30T02:04:47", "git_sha": "e2f7811", "skill_shas": {"visual_critic": "663cdf2", "encoding_integrity": "663cdf2", "stress_test": "663cdf2", "cognitive_load": "663cdf2"}, "block_set": "v2-claude-opus-4-6-noskills", "model": "claude-sonnet-4-6", "cli_version": "2.1.87 (Claude Code)", "blocks": {"03-violin-plot-orchestra": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional dark palette with complementary blue/orange split violins shows real design thought, but the y-axis tick labels collide with the Oslo city label, the '°C (shared scale)' annotation is nearly invisible at 8px, and the 58px-wide cells compress the violins to wing shapes that strain legibility.", "encoding_integrity": 7, "encoding_integrity_note": "Violin density encoding is structurally honest (data-driven maxDensity, shared y-scale, linear width for KDE is standard), but the hardcoded y-domain [-20, 42] breaks the scaling metamorphic relation — axes would not adapt if data shifted outside that range.", "stress_test": 9, "stress_test_note": "Fully static render with no event listeners, transitions, or cross-view updates — none of the five interaction traps are applicable, though the viewport width is captured once at init with no resize handler.", "cognitive_load": 7, "cognitive_load_note": "72-cell grid (6 cities × 12 months) reads as a single conceptual unit with a restrained 2-color palette; cells are small enough that the subtle decade-warming shift in orange is hard to discern, but seasonal shape patterns per city are immediately legible and the shared y-axis enables cross-row comparison.", "composite": 7.1}, "05-crossfilter-flight-explorer": {"render": true, "visual_critic": 4, "visual_critic_note": "Functional crossfilter with the background/active bar pattern working correctly, but steelblue default color, charts occupying only ~60% of viewport width leaving a large blank void, and no typographic or palette intentionality beyond the basics.", "encoding_integrity": 8, "encoding_integrity_note": "All three histograms have correct zero baselines, data-driven Y domains fixed to global max (correct crossfilter practice for visual comparison), and data-driven X extents for delay and distance; minor deduction for arbitrary bin counts (24/30/30) rather than Sturges'/Scott's formula.", "stress_test": 3, "flags": ["Update Storm", "Mid-Flight Snap", "Infinite Feedback Loop (reset)"], "stress_test_note": "Brush 'brush' event fires full DOM data-joins on every mousemove with no RAF/debounce/throttle; reset calls brush.move on all 3 charts triggering cascading updateAll calls with no source guard; no .interrupt() before the 300ms reset transition leaves mid-flight snap risk.", "cognitive_load": 9, "cognitive_load_note": "3 linked histograms with a single steelblue palette, gray background bars for context, and a clear flight-count counter keep cognitive load minimal — a textbook crossfilter execution with no overload risks.", "composite": 6.1}, "08-small-multiples-seasonal": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional dark palette and synchronized crosshair show design care, but the 12-panel grid occupies only the top ~65% of the viewport leaving large dead space below, and the small panel height makes the overlapping lines dense and hard to distinguish.", "encoding_integrity": 8, "encoding_integrity_note": "Shared zero-based Y-axis across all panels enables honest cross-month comparison, domain is data-driven via d3.max, no area/radius encoding or dual-axis deception; no line.defined() but synthetic data has no gaps so no practical violation.", "stress_test": 6, "flags": ["Update Storm", "Stale Scale"], "stress_test_note": "mousemove synchronously updates 12 crosshair DOM elements and rebuilds tooltip HTML on every event without requestAnimationFrame or throttling; xScale references are captured in closures with no resize handler to refresh them.", "cognitive_load": 8, "cognitive_load_note": "12 panels (well under the 20+ warning threshold), shared y-axis and 3-color palette keep cross-panel comparison easy, and the synchronized crosshair interaction manages the one real cognitive cost — tracking a specific day across all months simultaneously.", "composite": 7.0}, "11-zoomable-treemap": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional dark-navy palette with opacity-modulated hierarchy and smooth zoom interaction shows real design thinking, but eight simultaneous saturated hues feel garish rather than harmonious, and 8–9px leaf labels push the readability floor.", "encoding_integrity": 7, "encoding_integrity_note": "Treemap area correctly encodes file size via d3.hierarchy().sum(), but initial render applies a value-modulated leaf opacity (0.7 + value/total*2) that vanishes on zoom — inconsistent dual-encoding that silently drops a visual channel on interaction.", "stress_test": 5, "flags": ["Mid-Flight Snap", "Stale Scale"], "stress_test_note": "zoomTo() immediately mutates shared x/y scale domains and starts a 650ms transition with no .interrupt() call, so rapid clicks during animation corrupt all in-flight tweened attributes with wrong scale values.", "cognitive_load": 7, "cognitive_load_note": "8 distinct colors sit at the warning threshold but are perceptually separable on the dark background, zoom interaction offloads detail to drill-down rather than forcing the viewer to read all small cells at once, and breadcrumb navigation maintains orientation — the overview does read as busy but structure is graspable at a glance.", "composite": 6.3}, "13-radial-dendrogram-edge-bundling": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "16-sankey-energy-flow": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "17-chord-diagram-trade": {"render": true, "visual_critic": 6, "visual_critic_note": "Dark background with mix-blend-mode screen and entrance animation show genuine design intent, but the Tableau10 palette is a recognizable default and the dense tick-label ring around the arcs creates clutter that undercuts the otherwise clean composition.", "encoding_integrity": 8, "encoding_integrity_note": "Chord arcs and ribbon widths are proportionally derived from the matrix via d3.chord() (data-driven, not hardcoded), asymmetric flows are correctly represented, tick marks provide quantitative grounding, and no bar/area baseline or radius-deception issues apply to this encoding type.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "Mouseover/mouseout handlers fire during the 950ms entrance transition with no .interrupt() call, and the CSS 'opacity: 0.04 !important' fade class conflicts with the ongoing inline-style opacity transition, risking visual snapping on early hover.", "cognitive_load": 6, "cognitive_load_note": "10 countries with hover-to-isolate interaction manages the chord tangle reasonably well, but the dark background causes many similarly-dark ribbons to visually merge into an indistinct mass, making it hard to trace individual flows without interaction.", "composite": 6.7}, "23-hex-bin-map": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "34-visual-texture-a11y": {"render": true, "visual_critic": 5, "visual_critic_note": "Clever a11y dual-encoding concept with a decent non-default palette, but dense value labels on every bar, visually busy patterns, and the charts occupy only the top half of the viewport leaving large dead whitespace below.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baseline is correct and bar height encoding is honest, but Y-domain is hardcoded at [0,110] rather than data-driven, making it brittle under scaling or data changes.", "stress_test": 9, "stress_test_note": "Fully static chart with no event listeners, transitions, brush, zoom, or cross-view dispatch — none of the five interaction failure modes can trigger.", "cognitive_load": 8, "cognitive_load_note": "Two-panel side-by-side comparison with 4 categories and dual color+texture encoding is well-managed — legend is clear, bars are labeled, and the structural parallel between panels makes the deuteranopia comparison easy to parse without exceeding working memory limits.", "composite": 7.0}, "35-color-palette-explorer": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed tool: dark navy theme is intentional, three-panel layout (bar preview, contrast matrix, CVD strips) is well-organized, the indigo active-button accent coordinates with the background, and contrast matrix pass/fail coloring is functional — held back from 8 by flat section-title hierarchy and a bar chart preview that feels slightly generic against the tool's otherwise purposeful design.", "encoding_integrity": 8, "encoding_integrity_note": "Bar chart uses honest zero baseline with data-driven domain (d3.max * 1.1), correct length encoding, no radius deception or dual-axis issues; contrast matrix encodes ratios as numbers rather than visual magnitude, avoiding binning bias; minor robustness gap: no key function on bar .data() join, but data is static so no practical corruption risk.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "The update() function applies a 400ms bar transition without calling .interrupt() first, so rapid palette clicks can cause mid-flight snapping; no brush/zoom events exist so Update Storm, Stale Scale, and Infinite Loop do not apply.", "cognitive_load": 8, "cognitive_load_note": "Three coherent views (bar preview, 7×7 contrast matrix, 4-row CVD strips) all serve the same analytical goal and update together on a single palette switch, keeping cognitive load well-managed despite the dense matrix grid.", "composite": 7.5}, "36-responsive-multi-breakpoint": {"render": true, "visual_critic": 6, "visual_critic_note": "Functional scatter with marginal histograms and a thoughtful responsive breakpoint strategy, but the muted gray histograms feel like placeholders, the legend floats awkwardly inside the plot area overlapping scatter dots, and the flat typography (same weight axis labels vs title) gives it a competent-but-undesigned feel.", "encoding_integrity": 8, "encoding_integrity_note": "Data-driven domains via d3.extent with padding, zero-baseline marginal histograms, correct key functions (d => d.id), no size deception or dual-axis issues; minor binning bias from hardcoded nBins=20 instead of Sturges'/Scott's rule.", "stress_test": 5, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "ResizeObserver fires render() with no debounce/throttle, causing expensive DOM mutations on every pixel of resize, and no .interrupt() call before the 600ms transition means rapid resizes cause mid-flight element snapping.", "cognitive_load": 8, "cognitive_load_note": "Three-color palette separates cleanly across 150 points, marginal histograms add distributional context without crowding, and the legend is well-positioned — the only mild friction is that the marginal histograms share no axis labels, requiring a moment to orient.", "composite": 6.8}, "39-quadtree-hit-detection": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark canvas with a well-chosen categorical palette (not schemeCategory10), glow/connector interaction feedback looks polished, and the UI panel is clean — held back from 8 by the static screenshot showing only the idle state where the interaction highlight (the whole point of the demo) is absent.", "encoding_integrity": 8, "encoding_integrity_note": "No misleading encodings present — this is an interaction/algorithmic demo with no bar/area baselines, particle radii use raw r values (1.5–3px cosmetic, not data-magnitude encoding), and scale domains are data-driven via d3.scaleLinear with transform.rescaleX/Y, though the quadtree is correctly rebuilt on zoom ensuring spatial queries remain honest under all transforms.", "stress_test": 6, "flags": ["Update Storm"], "stress_test_note": "Both pointermove and zoom events trigger full quadtree rebuilds and canvas repaints of 5000 particles on every frame with no requestAnimationFrame coalescing or debouncing.", "cognitive_load": 7, "cognitive_load_note": "Single-view canvas with 5000 clustered particles across 8 hues is visually dense but the dark background, 50% alpha, and visible cluster structure keep it readable; the 8-color palette is at the warning threshold but clusters are spatially separated so color-to-cluster matching is feasible without interaction.", "composite": 7.0}, "41-force-bundling-chord-triptych": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed dark-background triptych with a consistent 5-color palette and sophisticated cross-panel hover dispatch, but the force-directed cluster sits off-center in its panel and chord group labels clip at the right edge.", "encoding_integrity": 7, "encoding_integrity_note": "No zero-baseline violations (all relational charts), chord arc-width correctly encodes flow magnitude via D3's layout, but no key functions on any data join and chord hover highlights by group rather than individual node adjacency, misrepresenting per-node connectivity.", "stress_test": 9, "stress_test_note": "No brush/zoom/transition interactions present; hover-only cross-panel dispatch uses pointer events correctly with no re-dispatch feedback loops, no stale scales, and no mid-flight transition conflicts.", "cognitive_load": 6, "cognitive_load_note": "3 panels × 5 colors × 40 nodes is well-managed and cross-panel highlight dispatch is cognitively feasible, but the radial bundling panel routes all edges through r×0.35 creating an opaque dark hairball at the convergence zone that makes individual connections untraceable.", "composite": 7.2}, "43-classification-choropleth": {"render": true, "visual_critic": 8, "visual_critic_note": "Intentional dark theme with harmonious YlGnBu palette across all four panels, clean typographic hierarchy, and a well-integrated histogram+breakpoints panel — the cross-panel hover highlight is a polished interaction touch, though the maps feel slightly cramped and the histogram bars are muted to near-invisibility against the dark background.", "encoding_integrity": 8, "encoding_integrity_note": "Choropleths use data-driven scaleThreshold with correctly computed breaks for all four methods; histogram has a proper zero baseline and data-driven y-domain; minor issues are hardcoded thresholds(30) bin count and no key function on statePaths (harmless here since data never re-joins).", "stress_test": 7, "flags": ["Update Storm (minor)"], "stress_test_note": "Slider input fires unthrottled synchronous update across 4 maps (~200 DOM mutations) with no RAF or dirty-flag coalescing, but no transitions, no stale closures, no feedback loops, and pointer events unify mouse/touch correctly.", "cognitive_load": 8, "cognitive_load_note": "Four small-multiple choropleths sharing a single sequential palette and a linked histogram below form one coherent conceptual unit — the 2×2 grid is immediately legible, the YlGnBu ramp keeps color load low, and cross-map hover highlighting aids comparison, though the histogram breakpoint lines (4 methods × up to 9 lines each) can crowd near the center of the distribution at higher class counts.", "composite": 7.8}, "47-mixed-scale-parcoords": {"render": true, "visual_critic": 7, "visual_critic_note": "Dark navy background with intentional categorical palette and active/inactive line contrast creates a polished, readable parallel coordinates chart, though the dense line crossing between ordinal axes makes individual paths hard to follow and the axis tick labels are small.", "encoding_integrity": 8, "encoding_integrity_note": "Data-driven domains via d3.extent throughout, log scale appropriately applied to salary, ordinal axes handled correctly with scalePoint, no size/area encoding deception, and brushing filters display without corrupting scale domains which are built once from full data.", "stress_test": 6, "flags": ["Update Storm"], "stress_test_note": "brush.on('brush end', ...) calls render() on every mousemove with no RAF or debouncing, redrawing all 300 canvas lines unthrottled; canvas mitigates but does not resolve the violation.", "cognitive_load": 6, "cognitive_load_note": "300 polylines at 0.45 opacity across 6 axes creates tolerable density aided by canvas rendering and brush-to-fade interaction, but ordinal axes force line convergence into spaghetti bands that obscure structure without active brushing.", "composite": 6.8}, "49-textured-network-diagram": {"render": true, "visual_critic": 7, "visual_critic_note": "Distinctive textured encoding with per-community color-tinted hatching/dots/waves is genuinely inventive and readable, and the grayscale toggle is a thoughtful accessibility feature, but the legend text is clipped ('Diamonds' cut off), node ID labels at 9px are barely legible, and the chart occupies only ~60% of the viewport with a large empty bottom half.", "encoding_integrity": 8, "encoding_integrity_note": "Node size correctly uses scaleSqrt for area-proportional degree encoding, domain derived from d3.extent, and dual color+texture encoding for community is honest; no key function in data join is benign since no updates occur.", "stress_test": 8, "flags": ["Touch Jitter — zoom has no .filter() guard for pinch-vs-scroll conflicts on mobile"], "stress_test_note": "No update storm, stale scale, infinite loop, or mid-flight transition issues; only minor risk is the unfiltered d3.zoom() which can conflict with native scroll on touch devices.", "cognitive_load": 7, "cognitive_load_note": "50 nodes across 6 well-separated color+texture clusters read cleanly at a glance, but dual-encoding (color + pattern) adds legend complexity and the node ID labels are too small to scan without zooming.", "composite": 7.4}, "51-accessible-force-network": {"render": true, "visual_critic": 6, "visual_critic_note": "Accessibility engineering is genuinely thoughtful (amber focus ring, blue neighbor links, keyboard nav) and the palette avoids schemeCategory10 defaults, but 7 competing saturated colors without a visual hierarchy anchor and a generic layout make it competent rather than designed.", "encoding_integrity": 7, "encoding_integrity_note": "Node size uses Math.sqrt(degree) for radius (directionally correct), but the non-zero base offset (3 + sqrt(d)*1.5) means area is not proportional to degree — minor lie factor; no bar/area baseline issues, color correctly encodes categorical community, no dual-axis or gap-handling concerns for this chart type.", "stress_test": 7, "flags": ["Update Storm (unthrottled resize restarts simulation on every resize event)", "Stale Closure (forceCenter/forceX/forceY not updated after resize, using stale width/height)", "Update Storm (updateQuadtree() rebuilds full quadtree on every simulation tick inside draw())"], "stress_test_note": "No brush/zoom/transitions so most adversarial scenarios don't apply, but the resize handler fires sim.alpha().restart() without debouncing and the force centers become stale after resize.", "cognitive_load": 5, "cognitive_load_note": "150 nodes across 7 communities with no clustering force means communities are spatially intermixed — the color encoding is legible but the layout doesn't reinforce community structure at a glance, requiring per-node inspection rather than gestalt reading.", "composite": 6.2}, "53-textured-raincloud": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed with Tol colorblind-safe palette, dual texture+color encoding, and clean raincloud layout — let down slightly by the redundant legend (groups are already labeled on the y-axis) and the bottom row (Treatment E) being partially cropped.", "encoding_integrity": 7, "encoding_integrity_note": "X domain is data-driven, box stats correct, and no baseline/lie-factor violations, but per-group KDE y-normalization (each group scaled to its own maxDensity) prevents cross-group density comparison, and the hardcoded bandwidth=4 could mask distributional features on different data.", "stress_test": 9, "stress_test_note": "Interaction surface is a single checkbox change event with no brush/zoom, no transitions, no cross-view dispatch, and no touch/mouse conflicts — all five stress-test criteria are effectively moot.", "cognitive_load": 8, "cognitive_load_note": "Six groups with triple-layer encoding (violin + box + strip) is managed well — vertical separation is generous, the Tol palette is perceptually distinct, and the redundant texture encoding keeps groups identifiable even under the load of three simultaneous visual layers per row.", "composite": 7.7}, "55-webgl-million-scatter": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "56-webgl-force-galaxy": {"render": true, "visual_critic": 7, "visual_critic_note": "Striking galaxy aesthetic with a deliberate Tol muted palette and smooth alpha-blended nodes against deep navy — the 8 community clusters read clearly and the overall composition feels intentional, though the minimal UI (small button, stats readout) is functional but unpolished.", "encoding_integrity": 8, "encoding_integrity_note": "No quantitative encoding violations — categorical color maps 1:1 to community, fixed-radius nodes avoid size distortion, and force physics correctly encodes graph topology; minor deduction for non-random edge sampling (first 40K by array index) which can bias visual representation of community connectivity.", "stress_test": 6, "flags": ["Update Storm (quadtree rebuilt for 50K nodes on every simulation tick without throttling)", "Mouse-Touch Fight (zoom behavior has no .filter() guard; unthrottled mousemove does DOM mutation on every event)"], "stress_test_note": "WebGL rendering and RAF loop are correctly separated, but O(N log N) quadtree reconstruction inside onTick at 60fps is an unthrottled CPU storm, and the zoom/mousemove handlers lack touch-event filtering.", "cognitive_load": 7, "cognitive_load_note": "8 communities with perceptually distinct Tol palette form clear radial galaxy clusters visible at a glance, but 50K nodes and 80K edges (even at 3% opacity) create a dense fog where individual nodes are indistinguishable and community boundaries blur at the center — saved by the macro-level cluster separation rather than node-level legibility.", "composite": 7.0}, "60-webgl-animated-treemap": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "61-progressive-crossfilter": {"render": true, "visual_critic": 7, "visual_critic_note": "Deliberately designed dark dashboard with a consistent blue accent palette, monospace typography, clear panel hierarchy, and a satisfying green status indicator — held back slightly by blocky bar proportions and limited typographic differentiation between panel titles and axis labels.", "encoding_integrity": 8, "encoding_integrity_note": "Bar and histogram charts use zero-based Y domains driven by d3.max(data), key functions are present on all joins, no area/radius lie factor, and crossfilter updates correctly recalculate scales; only minor issue is fixed bin count (40) rather than data-driven Sturges'/Scott's rule.", "stress_test": 5, "flags": ["Update Storm", "ResizeObserver Unthrottled"], "stress_test_note": "All four brush handlers call updateAll() on every mousemove without RAF or debounce, synchronously redrawing 10K canvas points and doing DOM data-joins across all panels at 60fps; the precomputed cube mitigates histogram cost but canvas scatter and DOM mutations remain unthrottled, and the ResizeObserver also fires full setup+redraw without debouncing.", "cognitive_load": 8, "cognitive_load_note": "4 linked panels, monochromatic palette, and canvas-rendered scatter manage 100K records cleanly — crossfilter interaction is standard and the status indicator orients the viewer during progressive load, but animation quality during brush updates can't be assessed from a static screenshot.", "composite": 7.1}, "63-semantic-zoom-distributions": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional viridis-on-dark-navy palette with clean typographic hierarchy and a sophisticated three-level semantic zoom (contours → hexbins → points), but missing a color legend explaining density encoding and the mode label reads as functional rather than polished.", "encoding_integrity": 7, "encoding_integrity_note": "Hexbin correctly uses scaleSqrt for radius, scales use data-driven d3.extent domains, and label joins have key functions, but KDE bandwidth is hardcoded at 25px (not adaptive to data distribution or zoom) which can hide bimodal structure at intermediate zoom levels.", "stress_test": 4, "flags": ["Update Storm", "Touch Jitter"], "stress_test_note": "The zoom handler calls render() synchronously on every event with no RAF or throttle, and in contour mode this recalculates d3.contourDensity() across 2000 points on every mousemove tick—a severe Update Storm; no touch filter is set on the zoom behavior to prevent scroll/zoom conflicts on mobile.", "cognitive_load": 8, "cognitive_load_note": "Single-view semantic zoom progressively reveals complexity (contour→hexbin→points) with a clean viridis sequential palette, keeping cognitive load low at each zoom level; the only unassessable risk is whether mode-transition animations preserve object constancy.", "composite": 6.7}, "68-animated-sparkline-table": {"render": true, "visual_critic": 8, "visual_critic_note": "Cohesive dark-theme dashboard with intentional color coding (blue/purple/yellow/red per metric), staggered sparkline reveal animation, and clear typographic hierarchy — let down slightly by the KPI row's inconsistent chart types (area, bar, bullet, winloss) that feel sampled rather than unified, and the latency bullet chart's subdued bands that nearly disappear against the dark background.", "encoding_integrity": 6, "encoding_integrity_note": "Bar and bullet charts use zero-based domains correctly, but the CPU KPI area sparkline uses d3.extent (truncated baseline) and latency sparklines also use local extent domain for area fill, both minor baseline violations; no radius deception, no dual-axis, and no key-function issues since table fully rebuilds on replay.", "stress_test": 8, "flags": ["Mid-Flight Snap"], "stress_test_note": "No brush/zoom/touch interactions exist so most traps are moot, but replay() removes elements and restarts transitions without calling .interrupt(), risking mid-flight conflicts on rapid clicks.", "cognitive_load": 7, "cognitive_load_note": "Consistent 3-color encoding (blue=CPU, purple=memory, yellow=latency) and a clear KPI-to-detail hierarchy manage a dense 10-column × 12-row table well, though the four heterogeneous KPI mini-chart types (area, bar, bullet, win/loss) add minor visual overhead that a unified form would avoid.", "composite": 7.2}, "70-gantt-edge-bundle": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional dark navy palette with phase-coded colors and solid typographic hierarchy, but the edge-bundled dependency curves — the chart's headline feature — are nearly invisible at 0.15 opacity, and the Launch phase is clipped entirely from the viewport.", "encoding_integrity": 7, "encoding_integrity_note": "Bar width honestly encodes duration via time scale and categorical color correctly maps phases, but the x-domain is hardcoded to [toDate(0), toDate(54)] rather than data-driven, and no key functions on data joins make it brittle to updates.", "stress_test": 9, "stress_test_note": "No brush/zoom interactions; expensive DOM mutations (classing all bars and paths) are correctly isolated to mouseenter/mouseleave—not mousemove—so no update storm, and with no D3 transitions or cross-view dispatch, mid-flight snaps and infinite loops are non-issues.", "cognitive_load": 7, "cognitive_load_note": "Single view, 4 colors, hover-chain highlighting elegantly manages 50 tasks and ~50 dependency edges, but the bundled paths at 15% opacity still create a faint mid-chart tangle that adds low-level visual noise in the static state.", "composite": 7.1}, "75-flame-chart-profile": {"render": true, "visual_critic": 4, "visual_critic_note": "Intentional One Dark-inspired module color palette, but the flame chart occupies only the bottom ~15% of the viewport, leaving the top 85% as dead empty dark space — a critical layout failure that wastes the canvas and makes the data appear cramped and distant.", "encoding_integrity": 7, "encoding_integrity_note": "d3.partition correctly normalizes widths to proportional time fractions (data-driven domain, no hardcoded magic numbers, correct leaf-only sum for flame semantics), but the fixed ROW_HEIGHT with no vertical scaling leaves most of the viewport empty as seen in the screenshot, and there are no key functions needed (canvas) nor zero-baseline/lie-factor risks for this chart type.", "stress_test": 7, "flags": ["Mid-Flight Snap", "Touch Jitter"], "stress_test_note": "RAF dirty-flag coalescing is correctly implemented, but zoomToNode() lacks .interrupt() before chained transitions and the custom mousemove/click handlers have no touch-vs-mouse discrimination.", "cognitive_load": 5, "cognitive_load_note": "8-color module palette and LOD labels are well-managed, but the flame chart content is crammed into the bottom ~20% of the viewport with the upper 80% wasted as empty dark space, creating immediate disorientation about whether the visualization loaded correctly.", "composite": 5.6}, "77-sunburst-breadcrumb-brush": {"render": true, "visual_critic": 6, "visual_critic_note": "Intentional 4-color palette with depth-brightening on a polished dark background lifts it above generic, but the outer ring dissolves into imperceptibly thin slivers and no arc labels means the data is inaccessible without interaction.", "encoding_integrity": 7, "encoding_integrity_note": "Angular partition encoding is mathematically correct (proportional arc widths via d3.partition), no baseline or lie-factor issues apply, but leaf values are randomized synthetic data and the data join lacks key functions, making it brittle under dynamic updates.", "stress_test": 4, "flags": ["Update Storm", "Handoff Race Condition"], "stress_test_note": "Brush drag calls updateAppearance() synchronously on every mousemove (100+ DOM mutations at 60fps, no RAF/throttle), and brush appearance mutations directly conflict with concurrent 650ms zoom transitions since no .interrupt() is called before new transitions begin.", "cognitive_load": 7, "cognitive_load_note": "4-color palette with depth-based brightness is well-managed and the zoom+breadcrumb interaction effectively reduces working memory load, but the outermost ring is too dense with ~160 unlabeled leaf segments to read without hovering.", "composite": 6.1}, "78-expandable-edge-bundle": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "79-reduced-motion-dashboard": {"render": true, "visual_critic": 6, "visual_critic_note": "Cohesive dark theme with a single blue accent is deliberate and readable, but the scatter plot's x-axis is essentially invisible (income data clusters so tightly that it looks like a vertical strip), and the flat typographic hierarchy — panel titles, axis labels, and controls all at similar weight/size — leaves the layout feeling like a competent demo rather than a designed artifact.", "encoding_integrity": 7, "encoding_integrity_note": "Zero baselines correct (histogram y-domain [0,max], area y0=y(0)), scatter uses key function d=>d.id, but income/satisfaction domains are hardcoded magic numbers ([10000,120000],[1,10]) that would break under data shifts rather than derived from d3.extent.", "stress_test": 4, "flags": ["Update Storm", "Mid-Flight Snap"], "stress_test_note": "Every brush mousemove fires updateAll() which fully re-renders the 500-dot scatter and area chart without RAF/debounce, and no .interrupt() is called before new 300ms transitions, causing mid-flight snapping during rapid brushing.", "cognitive_load": 8, "cognitive_load_note": "Three-panel crossfilter is well within working memory limits, monochromatic blue-on-dark palette eliminates color overload, and the active/muted encoding clearly communicates filter state across all views; animation quality cannot be assessed from a static screenshot but the reduced-motion toggle is a meaningful accessibility affordance.", "composite": 6.3}, "80-container-query-chart": {"render": false, "visual_critic": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "81-letter-value-table-toggle": {"render": true, "visual_critic": 6, "visual_critic_note": "Coherent blue sequential palette and functional chart-table toggle work well, but the chart occupies only the top half of the viewport leaving large dead space below, and the nested boxes lose differentiation at smaller widths where the lightest sixteenths shade nearly disappears into the background.", "encoding_integrity": 8, "encoding_integrity_note": "Y-scale domain is data-driven via d3.extent, quantile boundaries use d3.quantileSorted correctly, whiskers follow 1.5*IQR convention, no baseline violation (distributional chart), and no area/radius deception — box widths are hardcoded visual design choices for nesting depth, not data encodings, which is standard for letter-value plots.", "stress_test": 9, "stress_test_note": "Fully static chart with only a show/hide toggle; no brush, zoom, drag, or transitions exist, so all interaction robustness criteria are non-applicable.", "cognitive_load": 8, "cognitive_load_note": "Single view, 4-color sequential blue palette, and 5 groups keep cognitive load low; nested box encoding is legible with the legend, and the chart/table toggle reduces informa ": null, "encoding_integrity": null, "stress_test": null, "cognitive_load": null, "composite": null}, "16-sankey-energy-flow": {"render": true, "visual_critic": 4, "visual_critic_note": "Dark background combined with opacity 0.38 on the flow ribbons makes the core Sankey data encoding nearly invisible — the nodes are legibly colored but the flows connecting them are so faint that the diagram's primary purpose (showing relative flow volumes) is essentially unreadable.", "encoding_integrity": 6, "encoding_integrity_note": "Node heights are per-stage renormalized (each stage independently fills available height) while link widths use a global px-per-unit scale derived from stage 0, so links systematically overflow or underflow node boundaries at intermediate stages — a structural Sankey encoding violation, though proportionality within each dimension is otherwise honest.", "stress_test": 6, "flags": ["Update Storm"], "stress_test_note": "The drag handler calls recomputeLinks() on every mousemove — recomputing all link geometries and updating all path `d` attributes with no throttling, debounce, or requestAnimationFrame coalescing; no other interaction traps (transitions, dispatch loops, stale scales, touch conflicts) are present.", "cognitive_load": 5, "cognitive_load_note": "Stage headers and labels orient clearly, but the flow ribbons are nearly invisible at 0.38 opacity on a dark background, collapsing the Sankey into disconnected colored columns and hiding the energy-flow narrative the chart is built to show.", "composite": 5.2}, "17-chord-diagram-trade": {"render": true, "visual_critic": 3, "visual_critic_note": "Screenshot captures the animation mid-flight — chord ribbons (the core data encoding) are invisible and country labels haven't appeared yet, leaving only a plain colored ring that communicates nothing about trade flows; the intentional dark palette and custom colors are wasted on a chart that reads as broken at render time.", "encoding_integrity": 8, "encoding_integrity_note": "Chord layout correctly encodes arc width proportional to trade values via d3.chordDirected(), tick marks are data-driven (k = angleSpan/value), tooltip math is accurate, and no baseline/area-scaling/dual-axis issues apply; screenshot appears captured mid-animation before chord ribbons faded in, but structural encoding is honest.", "stress_test": 7, "flags": ["Mid-Flight Snap"], "stress_test_note": "The animDone guard uses the D3v5 (d,i,nodes) signature on a D3v7 transition.on('end') which receives (event,d), so nodes is undefined and animDone is never set true, permanently locking out all hover interactions; no brush/zoom means no Update Storm, Stale Scale, or Infinite Loop risk, and no touch filtering is present but the interaction surface is hover-only.", "cognitive_load": 6, "cognitive_load_note": "Screenshot captured mid-animation (arcs only, no chords or labels rendered), limiting full assessment; the final state with 90 directed chords across 10 colors (above the 8-hue warning threshold) will be dense, but hover-isolation and staged transitions are well-designed mitigations.", "composite": 5.8}, "23-hex-bin-map": {"render": true, "visual_critic": 7, "visual_critic_note": "Intentional dark-navy + YlOrRd palette creates a striking, harmonious look with good typographic hierarchy, though subtitle and legend labels (#3d444d) are nearly invisible against the dark background.", "encoding_integrity": 7, "encoding_integrity_note": "Color encoding is data-driven via d3.max with no area-scaling deception, but linear normalization on heavily skewed metro-population data compresses most bins toward the cool end of the ramp, limiting perceptual discrimination in low-density regions.", "stress_test": 7, "flags": ["Update Storm"], "stress_test_note": "The slider `input` event calls `render()` synchronously on every tick with no debounce or RAF coalescing, triggering a full hexbin recomputation and canvas redraw on every mousemove during drag; no other
