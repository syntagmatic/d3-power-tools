<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hierarchy Bundles — Transition Experiments</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; padding: 32px 40px; background: #fafafa; color: #222; max-width: 1400px; }
  h1 { font-size: 22px; font-weight: 400; margin: 0 0 2px; } h1 b { font-weight: 600; }
  .page-meta { color: #888; font-size: 13px; margin-bottom: 24px; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px 24px; margin-bottom: 24px; position: relative; }
  .card-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-header h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .card-links { position: absolute; top: 16px; right: 20px; display: flex; gap: 12px; font-size: 12px; }
  .card-links a { color: #3b82f6; text-decoration: none; }
  .card-links a:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .badge-pass { background: #e8f5e9; color: #2e7d32; }
  .badge-fail { background: #ffebee; color: #c62828; }
  .badge-skip { background: #fff3e0; color: #e65100; }
  .scores { display: flex; gap: 16px; font-size: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .score-item { display: flex; align-items: center; gap: 4px; }
  .score-num { font-weight: 700; font-size: 18px; }
  .score-label { color: #666; font-size: 12px; }
  .score-good { color: #2e7d32; }
  .score-mid { color: #f9a825; }
  .score-bad { color: #c62828; }
  .note { background: #f5f5f5; padding: 10px 14px; border-radius: 6px; font-size: 13px; line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
  .section-label { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; }
  .filmstrips { display: flex; flex-direction: column; gap: 8px; }
  .filmstrip-row img { max-width: 100%; max-height: 100px; object-fit: contain; border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer; }
  .filmstrip-row img:hover { border-color: #999; }
  .filmstrip-label { font-size: 11px; color: #888; margin-bottom: 2px; }
  .issues { margin: 0; padding: 0; list-style: none; }
  .issues li { font-size: 13px; padding: 2px 0; color: #c62828; }
  .issues li::before { content: "\26A0 "; }
  .js-errors { margin: 0; padding: 0; list-style: none; }
  .js-errors li { font-size: 12px; padding: 1px 0; color: #888; font-family: 'SF Mono', 'Fira Code', monospace; }
  .toggles { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .toggle { cursor: pointer; color: #3b82f6; font-size: 12px; }
  .toggle:hover { text-decoration: underline; }
  .hidden { display: none; }
  .prompt-box { background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px 14px; font-size: 12px; line-height: 1.5; font-family: 'SF Mono', 'Fira Code', monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; margin-top: 6px; }
  .meta-row { display: flex; gap: 20px; font-size: 12px; color: #888; margin-top: 10px; flex-wrap: wrap; }
  .empty { text-align: center; padding: 60px; color: #999; }
  .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; }
</style>
</head>
<body>
<h1><b>Hierarchy Bundles</b> — Transition Experiments</h1>
<div class="page-meta" id="meta"></div>
<div id="content"></div>

<script>
const MANIFEST = 'hierarchy-bundles-runs.json';

function scoreClass(score) {
  if (score == null) return '';
  if (score >= 7) return 'score-good';
  if (score >= 5) return 'score-mid';
  return 'score-bad';
}

function filmstripLabel(path) {
  const name = path.split('/').pop().replace(/^\d+-/, '').replace('.png', '');
  return name.replace(/-/g, ' ').replace(/^\d+-/, '');
}

function showLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.onclick = () => lb.remove();
  const img = document.createElement('img');
  img.src = src;
  lb.appendChild(img);
  document.body.appendChild(lb);
}

async function main() {
  const metaEl = document.getElementById('meta');
  const contentEl = document.getElementById('content');

  let runs;
  try {
    const resp = await fetch(MANIFEST);
    runs = await resp.json();
  } catch (e) {
    contentEl.innerHTML = '<div class="empty">No runs found. Run eval-hierarchy-bundles.py to generate data.</div>';
    return;
  }

  if (!runs.length) {
    contentEl.innerHTML = '<div class="empty">No runs found.</div>';
    return;
  }

  metaEl.textContent = `${runs.length} evaluation${runs.length > 1 ? 's' : ''} · latest: ${runs[runs.length - 1].timestamp}`;

  for (const run of [...runs].reverse()) {
    const card = document.createElement('div');
    card.className = 'card';

    // Top-right links: prototype + prompt
    const links = document.createElement('div');
    links.className = 'card-links';
    if (run.prototype_path) {
      const a = document.createElement('a');
      a.href = run.prototype_path;
      a.target = '_blank';
      a.textContent = 'prototype';
      links.appendChild(a);
    }
    if (run.prompt) {
      const promptToggle = document.createElement('a');
      promptToggle.href = '#';
      promptToggle.textContent = 'prompt';
      const promptBox = document.createElement('div');
      promptBox.className = 'prompt-box hidden';
      promptBox.textContent = run.prompt;
      promptToggle.onclick = (e) => {
        e.preventDefault();
        promptBox.classList.toggle('hidden');
        promptToggle.textContent = promptBox.classList.contains('hidden') ? 'prompt' : 'hide prompt';
      };
      links.appendChild(promptToggle);
      // Prompt box appended to card later
      run._promptBox = promptBox;
    }
    card.appendChild(links);

    // Header
    const header = document.createElement('div');
    header.className = 'card-header';
    const title = document.createElement('h2');
    title.textContent = run.exp_id != null ? `Exp ${run.exp_id}` : run.timestamp;
    header.appendChild(title);

    const gatePass = run.transition_score != null && run.transition_score > 5;
    const badge = document.createElement('span');
    badge.className = `badge ${gatePass ? 'badge-pass' : run.transition_score != null ? 'badge-fail' : 'badge-skip'}`;
    badge.textContent = gatePass ? 'PASS' : run.transition_score != null ? 'FAIL (gate)' : 'NO SCORE';
    header.appendChild(badge);

    if (run.button_count != null) {
      const bc = document.createElement('span');
      bc.style.cssText = 'font-size:12px;color:#888';
      bc.textContent = `${run.button_count} layouts`;
      header.appendChild(bc);
    }
    card.appendChild(header);

    // Scores
    const scores = document.createElement('div');
    scores.className = 'scores';
    for (const [label, val] of [['Transition', run.transition_score], ['Visual Critic', run.visual_critic_score], ['Composite', run.composite]]) {
      const item = document.createElement('div');
      item.className = 'score-item';
      const num = document.createElement('span');
      num.className = `score-num ${scoreClass(val)}`;
      num.textContent = val != null ? val : '\u2013';
      const lbl = document.createElement('span');
      lbl.className = 'score-label';
      lbl.textContent = label;
      item.appendChild(num);
      item.appendChild(lbl);
      scores.appendChild(item);
    }
    card.appendChild(scores);

    // Prompt box (positioned after scores, before filmstrips)
    if (run._promptBox) card.appendChild(run._promptBox);

    // Notes — behind a toggle
    const hasNotes = run.transition_note || run.visual_critic_note;
    let notesContainer;
    if (hasNotes) {
      const notesToggle = document.createElement('span');
      notesToggle.className = 'toggle';
      notesToggle.textContent = 'show notes';
      notesContainer = document.createElement('div');
      notesContainer.className = 'hidden';
      if (run.transition_note) {
        const n = document.createElement('div');
        n.className = 'note';
        n.textContent = run.transition_note;
        notesContainer.appendChild(n);
      }
      if (run.visual_critic_note) {
        const n = document.createElement('div');
        n.className = 'note';
        n.textContent = `Visual critic: ${run.visual_critic_note}`;
        notesContainer.appendChild(n);
      }
      notesToggle.onclick = () => {
        notesContainer.classList.toggle('hidden');
        notesToggle.textContent = notesContainer.classList.contains('hidden') ? 'show notes' : 'hide notes';
      };
      card.appendChild(notesToggle);
      card.appendChild(notesContainer);
    }

    // Filmstrips
    if (run.filmstrip_paths && run.filmstrip_paths.length) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = 'Filmstrips';
      card.appendChild(label);

      const strips = document.createElement('div');
      strips.className = 'filmstrips';

      const transitions = [], special = [];
      for (const p of run.filmstrip_paths) {
        const name = p.split('/').pop();
        if (name.includes('rapid') || name.includes('bundling') || name.includes('interaction') || name.includes('final')) {
          special.push(p);
        } else {
          transitions.push(p);
        }
      }

      for (const group of [transitions, special]) {
        for (const p of group) {
          const row = document.createElement('div');
          row.className = 'filmstrip-row';
          const lbl = document.createElement('div');
          lbl.className = 'filmstrip-label';
          lbl.textContent = filmstripLabel(p);
          row.appendChild(lbl);
          const img = document.createElement('img');
          img.src = p;
          img.loading = 'lazy';
          img.onclick = () => showLightbox(p);
          row.appendChild(img);
          strips.appendChild(row);
        }
      }
      card.appendChild(strips);
    }

    // Programmatic issues
    if (run.programmatic_issues && run.programmatic_issues.length) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = 'Programmatic Issues';
      card.appendChild(label);
      const list = document.createElement('ul');
      list.className = 'issues';
      for (const issue of run.programmatic_issues) {
        const li = document.createElement('li');
        li.textContent = issue;
        list.appendChild(li);
      }
      card.appendChild(list);
    }

    // Footer toggles: JS errors
    const toggles = document.createElement('div');
    toggles.className = 'toggles';

    if (run.js_errors && run.js_errors.length) {
      const toggle = document.createElement('span');
      toggle.className = 'toggle';
      toggle.textContent = `${run.js_errors.length} JS error${run.js_errors.length > 1 ? 's' : ''}`;
      const errList = document.createElement('ul');
      errList.className = 'js-errors hidden';
      for (const e of run.js_errors) {
        const li = document.createElement('li');
        li.textContent = e;
        errList.appendChild(li);
      }
      toggle.onclick = () => {
        errList.classList.toggle('hidden');
        toggle.textContent = errList.classList.contains('hidden')
          ? `${run.js_errors.length} JS error${run.js_errors.length > 1 ? 's' : ''}`
          : 'hide JS errors';
      };
      toggles.appendChild(toggle);
      card.appendChild(errList);
    }

    if (toggles.childNodes.length) card.appendChild(toggles);

    // Meta
    const meta = document.createElement('div');
    meta.className = 'meta-row';
    meta.innerHTML = `<span>${run.timestamp}</span>`;
    card.appendChild(meta);

    contentEl.appendChild(card);
  }
}

main();
</script>
</body>
</html>
