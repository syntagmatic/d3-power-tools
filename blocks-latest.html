", "motion"], "path": "blocks/v1/105-migration-flow-chord.html"}];
    const tbody = document.getElementById("tbody");
    const filter = document.getElementById("filter");
    const filterCount = document.getElementById("filter-count");

    function renderRows(data) {
      tbody.innerHTML = data.map(b => `
        <tr>
          <td class="col-num">${b.num}</td>
          <td class="col-name"><a href="${b.path}">${b.name}</a></td>
          <td class="col-skills">${b.skills.join(", ")}</td>
          <td class="col-link"><a href="${b.path}">view</a></td>
        </tr>
      `).join("");
      filterCount.textContent = `${data.length} block${data.length === 1 ? "" : "s"}`;
    }

    let sortKey = "num", sortDir = 1;
    document.querySelectorAll("th[data-key]").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (sortKey === key) sortDir *= -1;
        else { sortKey = key; sortDir = 1; }
        document.querySelectorAll("th").forEach(t => t.classList.remove("sort-asc", "sort-desc"));
        th.classList.add(sortDir === 1 ? "sort-asc" : "sort-desc");
        applyFilter();
      });
    });

    function cmp(a, b) {
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === "skills") { va = va.join(","); vb = vb.join(","); }
      return va < vb ? -sortDir : va > vb ? sortDir : 0;
    }

    function applyFilter() {
      const q = filter.value.toLowerCase().trim();
      let data = blocks;
      if (q) data = blocks.filter(b =>
        b.name.toLowerCase().includes(q) || b.id.includes(q) ||
        b.skills.some(s => s.includes(q)) || String(b.num).includes(q)
      );
      renderRows([...data].sort(cmp));
    }

    filter.addEventListener("input", applyFilter);
    applyFilter();
  </script>
