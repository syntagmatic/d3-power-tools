<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block × Skill Coverage Matrix</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --text-muted: #666;
    --border: #ddd;
    --font: system-ui, -apple-system, sans-serif;
    --row-h: 14px;
    --col-w: 28px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .matrix-wrap {
    overflow-x: auto;
    overflow-y: auto;
    max-height: calc(100vh - 100px);
    position: relative;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  table {
    border-collapse: collapse;
    font-size: 10px;
  }
  thead th {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 2px solid #aaa;
  }
  thead th.corner {
    z-index: 30;
    left: 0;
    min-width: 40px;
  }
  thead th.skill-header {
    width: var(--col-w);
    min-width: var(--col-w);
    max-width: var(--col-w);
    height: 110px;
    vertical-align: bottom;
    padding: 0 2px 6px 2px;
    font-weight: 500;
    white-space: nowrap;
  }
  thead th.skill-header > div {
    transform: rotate(-60deg);
    transform-origin: left bottom;
    width: var(--col-w);
    overflow: visible;
  }
  thead th.summary-col-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    font-weight: 600;
    font-size: 9px;
    min-width: 36px;
    vertical-align: bottom;
    padding-bottom: 6px;
  }
  tbody td.row-num {
    position: sticky;
    left: 0;
    z-index: 10;
    background: var(--bg);
    text-align: right;
    padding: 0 6px 0 4px;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    color: var(--text-muted);
    min-width: 40px;
    border-right: 1px solid var(--border);
  }
  tbody td.cell {
    width: var(--col-w);
    min-width: var(--col-w);
    height: var(--row-h);
    padding: 1px;
    border: 0.5px solid rgba(0,0,0,0.03);
  }
  tbody td.cell .dot {
    width: 100%;
    height: 100%;
    border-radius: 2px;
  }
  tbody td.summary-col {
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: 9px;
    color: var(--text-muted);
    min-width: 36px;
    border-left: 2px solid #aaa;
    background: var(--bg);
  }
  tfoot td {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 2px solid #aaa;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: 9px;
    font-weight: 600;
    height: 20px;
    z-index: 5;
  }
  tfoot td.row-num {
    z-index: 15;
  }
  .category-sep {
    border-left: 2px solid #999 !important;
  }
  tr.highlight td.cell { background: rgba(0,0,0,0.04); }
  td.col-highlight { background: rgba(0,0,0,0.04) !important; }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(30,30,30,0.92);
    color: #fff;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    display: none;
    z-index: 100;
    white-space: nowrap;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
</style>
</head>
<body>
<h1>Block &times; Skill Coverage Matrix</h1>
<p class="subtitle">84 blocks &times; 26 skills &mdash; cells show which skills each block uses, colored by category</p>
<div class="legend" id="legend"></div>
<div class="matrix-wrap" id="wrap"></div>
<div class="tooltip" id="tooltip"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const skills = [
  {name:"annotation",category:"Making it legible"},
  {name:"brushing",category:"Seeing patterns"},
  {name:"canvas",category:"Making it work"},
  {name:"canvas-accessibility",category:"Making it legible"},
  {name:"cartography",category:"Seeing place"},
  {name:"color",category:"Making it legible"},
  {name:"data-gathering",category:"Before you render"},
  {name:"data-table",category:"Making it legible"},
  {name:"distributions",category:"Seeing patterns"},
  {name:"edge-bundling",category:"Seeing structure"},
  {name:"force",category:"Seeing structure"},
  {name:"hierarchy-interaction",category:"Seeing structure"},
  {name:"hierarchy-layouts",category:"Seeing structure"},
  {name:"linked-views",category:"Seeing patterns"},
  {name:"motion",category:"Seeing change"},
  {name:"navigation",category:"Making it work"},
  {name:"network",category:"Seeing structure"},
  {name:"parallel-coordinates",category:"Seeing patterns"},
  {name:"responsive",category:"Making it work"},
  {name:"scales",category:"Making it legible"},
  {name:"shape-morphing",category:"Seeing change"},
  {name:"small-multiples",category:"Before you render"},
  {name:"sparkcharts",category:"Before you render"},
  {name:"time-series",category:"Seeing change"},
  {name:"visual-texture",category:"Making it legible"},
  {name:"webgl",category:"Making it work"}
];

// Block skills from manifest (all 84 blocks)
const blockSkills = [
  ["parallel-coordinates","brushing","sparkcharts"],
  ["brushing","linked-views","distributions"],
  ["distributions","color","responsive"],
  ["distributions","force","annotation"],
  ["linked-views","brushing","time-series"],
  ["distributions","annotation","color"],
  ["distributions","canvas","brushing"],
  ["small-multiples","time-series","responsive"],
  ["sparkcharts","data-table","color"],
  ["distributions","brushing","annotation"],
  ["hierarchy-layouts","hierarchy-interaction","color"],
  ["hierarchy-layouts","shape-morphing","motion"],
  ["edge-bundling","hierarchy-layouts","canvas"],
  ["force","network","canvas"],
  ["network","color","data-table"],
  ["network","annotation","responsive"],
  ["network","color","motion"],
  ["hierarchy-interaction","annotation","motion"],
  ["hierarchy-layouts","navigation","color"],
  ["network","color","brushing"],
  ["cartography","color","annotation"],
  ["cartography","canvas","motion"],
  ["cartography","canvas","distributions"],
  ["cartography","network","motion"],
  ["cartography","shape-morphing","motion"],
  ["time-series","color","responsive"],
  ["time-series","annotation","brushing"],
  ["time-series","small-multiples","annotation"],
  ["motion","color","annotation"],
  ["motion","annotation","responsive"],
  ["time-series","canvas","navigation"],
  ["shape-morphing","motion","color"],
  ["annotation","color","responsive"],
  ["visual-texture","color","distributions"],
  ["color","canvas","responsive"],
  ["responsive","annotation","small-multiples"],
  ["canvas-accessibility","canvas","data-table"],
  ["scales","annotation","time-series"],
  ["canvas","navigation","brushing"],
  ["canvas","navigation","responsive"],
  ["force","edge-bundling","network"],
  ["motion","color","canvas"],
  ["cartography","scales","color"],
  ["scales","color","annotation"],
  ["distributions","force","scales"],
  ["scales","annotation","color"],
  ["parallel-coordinates","scales","brushing"],
  ["scales","force","network"],
  ["visual-texture","network","color"],
  ["visual-texture","cartography","canvas"],
  ["canvas-accessibility","force","network"],
  ["canvas-accessibility","cartography","color"],
  ["visual-texture","distributions","color"],
  ["visual-texture","hierarchy-layouts","color"],
  ["webgl","canvas","distributions"],
  ["webgl","force","canvas"],
  ["webgl","time-series","canvas"],
  ["webgl","distributions","canvas"],
  ["webgl","edge-bundling","canvas"],
  ["webgl","hierarchy-layouts","motion"],
  ["linked-views","brushing","canvas"],
  ["hierarchy-interaction","brushing","navigation"],
  ["navigation","distributions","brushing"],
  ["parallel-coordinates","brushing","canvas"],
  ["brushing","linked-views","distributions"],
  ["linked-views","brushing","canvas"],
  ["edge-bundling","time-series","motion"],
  ["sparkcharts","data-table","motion"],
  ["time-series","annotation","distributions"],
  ["time-series","edge-bundling","annotation"],
  ["small-multiples","force","network"],
  ["motion","network","annotation"],
  ["hierarchy-interaction","data-table","annotation"],
  ["small-multiples","scales","annotation"],
  ["hierarchy-layouts","hierarchy-interaction","canvas"],
  ["hierarchy-layouts","sparkcharts","data-table"],
  ["hierarchy-interaction","brushing","annotation"],
  ["hierarchy-interaction","edge-bundling","motion"],
  ["responsive","motion","canvas-accessibility"],
  ["responsive","canvas","annotation"],
  ["distributions","data-table","canvas-accessibility"],
  ["network","visual-texture","canvas-accessibility"],
  ["network","data-table","force"],
  ["sparkcharts","data-gathering","responsive"]
];

const blockNames = [
  "Parallel Coords + Sparkline Table","Linked Scatterplot Matrix","Violin Plot Orchestra","Bee Swarm Census",
  "Crossfilter Flight Explorer","QQ Plot with Confidence Bands","Density Contour Heatmap","Small Multiples Seasonal",
  "Sparkline Dashboard Table","Strip Plot with Marginals","Zoomable Treemap","Sunburst to Icicle Morph",
  "Radial Dendrogram + Edge Bundling","Force-Directed Clustering","Adjacency Matrix Reorder","Sankey Energy Flow",
  "Chord Diagram of Trade","Collapsible Tree with Search","Circle Packing Zoom","Arc Diagram",
  "US Choropleth","Rotating Globe","Hex Bin Map","Flow Map with Curved Arrows",
  "Projection Morphing Showcase","Horizon Chart Stack","Swimlane Gantt Chart","Cycle Plot",
  "Bar Chart Race","Scrollytelling Climate","Streaming Real-Time Line","Shape Morphing Gallery",
  "Annotation Showcase","Visual Texture Accessibility Chart","Color Palette Explorer","Responsive Multi-Breakpoint",
  "Accessible Canvas Scatterplot","Dual-Axis with Gap Handling","Quadtree Hit Detection Demo","Minimap Navigator",
  "Force + Bundling + Chord Triptych","Phyllotaxis Data Art","Classification Choropleth","Diverging Midpoint Heatmap",
  "Log Scale Bee Swarm","Threshold Scale KPI Dashboard","Mixed-Scale Parallel Coords","Scale Perception Network",
  "Textured Network Diagram","Stippled Density Map","Accessible Force Network","Accessible Choropleth",
  "Textured Raincloud Plot","Textured Bivariate Treemap","WebGL Million-Point Scatter","WebGL Force Galaxy",
  "WebGL Streaming Particles","WebGL Density Heatmap","WebGL Edge-Bundled Network","WebGL Animated Treemap",
  "Progressive Crossfilter","Icicle Brush Explorer","Semantic Zoom Distributions","Strum Brush Parallel Coords",
  "Brush Composition Scatterplots","Falcon Prefetch Histogram","Temporal Edge Bundling","Animated Sparkline Table",
  "Prediction Band Time Series","Gantt with Edge-Bundled Dependencies","Small Multiples Force Network","Scrollytelling Network Growth",
  "Expandable Hierarchy Data Table","Marimekko Chart","Flame Chart Profiler","Treemap Sparkline Dashboard",
  "Sunburst Breadcrumb Brush","Expandable Edge Bundle","Reduced Motion Dashboard","Container Query Chart",
  "Letter-Value Plot with Table Toggle","Accessible Hive Plot","Community Detection with Table","Sparklines Embedded in Text"
];

const categories = ["Before you render","Seeing patterns","Seeing structure","Seeing place","Seeing change","Making it legible","Making it work"];
const tolMuted = ["#999933","#332288","#44AA99","#117733","#CC6677","#88CCEE","#AA4499"];
const catColor = {};
categories.forEach((c, i) => { catColor[c] = tolMuted[i]; });

// Sort skills by category then name
const orderedSkills = [...skills].sort((a, b) => {
  const ci = categories.indexOf(a.category) - categories.indexOf(b.category);
  return ci !== 0 ? ci : a.name.localeCompare(b.name);
});

const skillIndex = {};
orderedSkills.forEach((s, i) => { skillIndex[s.name] = i; });

// Build legend
const legend = document.getElementById("legend");
categories.forEach(cat => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-swatch" style="background:${catColor[cat]}"></div>${cat}`;
  legend.appendChild(item);
});

// Build matrix
const skillSet = new Set(skills.map(s => s.name));
const matrix = blockSkills.map(bs => {
  const row = new Array(orderedSkills.length).fill(false);
  bs.forEach(s => { if (skillIndex[s] !== undefined) row[skillIndex[s]] = true; });
  return row;
});

// Summary: count per skill (column sums)
const colSums = orderedSkills.map((_, ci) => matrix.reduce((sum, row) => sum + (row[ci] ? 1 : 0), 0));
// Skills per block (row sums)
const rowSums = matrix.map(row => row.reduce((sum, v) => sum + (v ? 1 : 0), 0));

// Detect category boundaries for separators
const catBoundaries = new Set();
for (let i = 1; i < orderedSkills.length; i++) {
  if (orderedSkills[i].category !== orderedSkills[i - 1].category) catBoundaries.add(i);
}

// Build table
const wrap = document.getElementById("wrap");
const table = document.createElement("table");

// Header
const thead = document.createElement("thead");
const headerRow = document.createElement("tr");
const corner = document.createElement("th");
corner.className = "corner";
corner.textContent = "#";
headerRow.appendChild(corner);

orderedSkills.forEach((s, i) => {
  const th = document.createElement("th");
  th.className = "skill-header" + (catBoundaries.has(i) ? " category-sep" : "");
  th.dataset.col = i;
  const div = document.createElement("div");
  div.textContent = s.name;
  div.style.color = catColor[s.category];
  th.appendChild(div);
  headerRow.appendChild(th);
});
const summaryHeader = document.createElement("th");
summaryHeader.className = "summary-col-header";
summaryHeader.textContent = "Skills";
headerRow.appendChild(summaryHeader);

thead.appendChild(headerRow);
table.appendChild(thead);

// Body
const tbody = document.createElement("tbody");
matrix.forEach((row, ri) => {
  const tr = document.createElement("tr");
  tr.dataset.row = ri;
  const numTd = document.createElement("td");
  numTd.className = "row-num";
  numTd.textContent = ri + 1;
  tr.appendChild(numTd);

  row.forEach((val, ci) => {
    const td = document.createElement("td");
    td.className = "cell" + (catBoundaries.has(ci) ? " category-sep" : "");
    td.dataset.row = ri;
    td.dataset.col = ci;
    if (val) {
      const dot = document.createElement("div");
      dot.className = "dot";
      dot.style.background = catColor[orderedSkills[ci].category];
      dot.style.opacity = "0.8";
      td.appendChild(dot);
    }
    tr.appendChild(td);
  });

  const sumTd = document.createElement("td");
  sumTd.className = "summary-col";
  sumTd.textContent = rowSums[ri];
  tr.appendChild(sumTd);
  tbody.appendChild(tr);
});
table.appendChild(tbody);

// Footer
const tfoot = document.createElement("tfoot");
const footRow = document.createElement("tr");
const footCorner = document.createElement("td");
footCorner.className = "row-num";
footCorner.textContent = "\u03A3";
footRow.appendChild(footCorner);
colSums.forEach((sum, ci) => {
  const td = document.createElement("td");
  td.className = catBoundaries.has(ci) ? "category-sep" : "";
  td.textContent = sum;
  footRow.appendChild(td);
});
const footSum = document.createElement("td");
footSum.className = "summary-col";
footSum.textContent = "";
footRow.appendChild(footSum);
tfoot.appendChild(footRow);
table.appendChild(tfoot);

wrap.appendChild(table);

// Tooltip and crosshair
const tooltip = document.getElementById("tooltip");
let highlightedRow = -1;
let highlightedCol = -1;

table.addEventListener("mouseover", (e) => {
  const td = e.target.closest("td.cell");
  if (!td) {
    clearHighlight();
    tooltip.style.display = "none";
    return;
  }
  const ri = +td.dataset.row;
  const ci = +td.dataset.col;
  if (ri === highlightedRow && ci === highlightedCol) return;

  clearHighlight();
  highlightedRow = ri;
  highlightedCol = ci;

  // Highlight row
  const row = tbody.querySelectorAll(`tr[data-row="${ri}"]`);
  row.forEach(r => r.classList.add("highlight"));

  // Highlight column
  tbody.querySelectorAll(`td[data-col="${ci}"]`).forEach(c => c.classList.add("col-highlight"));

  const skillName = orderedSkills[ci].name;
  const has = matrix[ri][ci];
  tooltip.innerHTML = has
    ? `Block ${ri + 1} uses <b>${skillName}</b>`
    : `Block ${ri + 1} does not use ${skillName}`;
  tooltip.style.display = "block";
});

table.addEventListener("mousemove", (e) => {
  tooltip.style.left = (e.clientX + 12) + "px";
  tooltip.style.top = (e.clientY + 12) + "px";
});

table.addEventListener("mouseleave", () => {
  clearHighlight();
  tooltip.style.display = "none";
});

function clearHighlight() {
  if (highlightedRow >= 0) {
    tbody.querySelectorAll("tr.highlight").forEach(r => r.classList.remove("highlight"));
    tbody.querySelectorAll("td.col-highlight").forEach(c => c.classList.remove("col-highlight"));
    highlightedRow = -1;
    highlightedCol = -1;
  }
}
</script>
</body>
</html>
