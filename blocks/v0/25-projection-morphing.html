<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projection Morphing</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #fafafa;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  h2 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #222;
    min-height: 36px;
  }
  #map-container {
    width: 800px;
    height: 500px;
  }
  svg { display: block; }
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .controls button {
    font-family: system-ui, sans-serif;
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid #999;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .controls button:hover { background: #eee; }
  .controls button.active {
    background: #4477AA;
    color: #fff;
    border-color: #4477AA;
  }
  .controls button.play-btn {
    border-color: #666;
    font-weight: 600;
  }
</style>
</head>
<body>
<h2 id="title">Natural Earth</h2>
<div id="map-container"></div>
<div class="controls" id="controls"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const width = 800, height = 500;

// --- Tol muted palette (6 continent colors) ---
const continentColors = {
  "Africa": "#CC6677",
  "Asia": "#DDCC77",
  "Europe": "#88CCEE",
  "North America": "#44AA99",
  "South America": "#AA4499",
  "Oceania": "#882255"
};

// --- Simplified world countries (approximate polygons, non-overlapping) ---
// Drawn large-to-small so small countries render on top
const countries = [
  // Large countries first
  { name: "Russia", continent: "Asia", coords: [[[28,55],[40,55],[50,52],[65,54],[80,54],[100,50],[120,53],[140,50],[170,60],[180,65],[180,72],[140,72],[100,72],[60,70],[28,68],[28,55]]] },
  { name: "Canada", continent: "North America", coords: [[[-141,49],[-95,49],[-88,49],[-55,49],[-55,58],[-60,65],[-70,70],[-85,73],[-100,73],[-120,72],[-141,70],[-141,49]]] },
  { name: "USA", continent: "North America", coords: [[[-125,30],[-105,30],[-95,26],[-82,25],[-80,30],[-75,35],[-67,44],[-67,47],[-82,47],[-95,49],[-105,49],[-120,49],[-125,48],[-125,30]]] },
  { name: "China", continent: "Asia", coords: [[[75,22],[80,32],[90,28],[97,28],[105,22],[110,18],[117,22],[122,30],[127,40],[135,42],[135,48],[120,50],[100,50],[80,45],[75,35],[75,22]]] },
  { name: "Brazil", continent: "South America", coords: [[[-74,-10],[-70,2],[-60,5],[-50,3],[-44,0],[-35,-5],[-38,-12],[-40,-22],[-48,-28],[-54,-33],[-58,-30],[-58,-20],[-68,-12],[-74,-10]]] },
  { name: "Australia", continent: "Oceania", coords: [[[114,-35],[120,-35],[130,-32],[137,-35],[145,-38],[153,-38],[153,-28],[148,-20],[143,-12],[133,-12],[129,-15],[114,-22],[114,-35]]] },
  { name: "India", continent: "Asia", coords: [[[68,8],[72,15],[68,23],[70,28],[75,32],[78,35],[85,28],[90,26],[90,22],[87,15],[80,8],[76,10],[68,8]]] },
  { name: "Kazakhstan", continent: "Asia", coords: [[[50,40],[55,42],[60,45],[65,45],[70,42],[75,42],[80,44],[87,49],[80,52],[70,54],[60,52],[50,46],[50,40]]] },
  { name: "Argentina", continent: "South America", coords: [[[-73,-52],[-65,-55],[-63,-42],[-58,-38],[-58,-28],[-60,-22],[-65,-22],[-68,-27],[-70,-35],[-72,-42],[-73,-52]]] },
  { name: "Greenland", continent: "North America", coords: [[[-55,60],[-45,60],[-22,65],[-18,72],[-20,78],[-35,83],[-50,82],[-55,78],[-52,72],[-45,65],[-55,60]]] },
  { name: "Algeria", continent: "Africa", coords: [[[0,20],[3,20],[9,20],[12,24],[9,32],[3,37],[0,36],[-2,35],[-1,30],[0,20]]] },
  { name: "DR Congo", continent: "Africa", coords: [[[12,-13],[18,-13],[25,-8],[30,-3],[30,4],[26,6],[18,4],[16,0],[12,-5],[12,-13]]] },
  { name: "Saudi Arabia", continent: "Asia", coords: [[[35,16],[40,18],[46,17],[50,19],[55,22],[52,26],[48,29],[44,30],[38,28],[35,24],[36,20],[35,16]]] },
  { name: "Iran", continent: "Asia", coords: [[[44,25],[48,30],[52,37],[54,38],[60,38],[63,35],[60,30],[55,26],[50,25],[44,25]]] },
  { name: "Mongolia", continent: "Asia", coords: [[[88,42],[97,42],[105,42],[110,44],[115,46],[120,50],[112,50],[100,48],[92,48],[88,42]]] },
  { name: "Mexico", continent: "North America", coords: [[[-117,15],[-107,15],[-100,16],[-92,15],[-87,18],[-90,21],[-97,20],[-97,24],[-105,24],[-115,28],[-117,28],[-117,15]]] },
  { name: "South Africa", continent: "Africa", coords: [[[17,-35],[20,-35],[25,-34],[30,-30],[33,-28],[33,-24],[28,-22],[22,-28],[17,-33],[17,-35]]] },
  { name: "Egypt", continent: "Africa", coords: [[[25,22],[33,22],[35,27],[35,31],[30,31],[25,31],[25,22]]] },
  { name: "Nigeria", continent: "Africa", coords: [[[3,4],[7,4],[10,7],[12,10],[14,13],[10,13],[4,10],[3,7],[3,4]]] },
  { name: "Ethiopia", continent: "Africa", coords: [[[33,3],[38,5],[42,8],[48,10],[47,14],[42,15],[36,14],[33,10],[33,3]]] },
  { name: "Colombia", continent: "South America", coords: [[[-79,0],[-76,-4],[-70,-4],[-67,2],[-67,7],[-73,12],[-76,10],[-78,7],[-79,0]]] },
  { name: "Peru", continent: "South America", coords: [[[-81,-5],[-79,0],[-76,-4],[-70,-4],[-70,-18],[-76,-18],[-81,-15],[-81,-5]]] },
  { name: "France", continent: "Europe", coords: [[[-2,43],[2,43],[5,44],[7,44],[8,48],[5,49],[2,51],[-2,48],[-5,47],[-2,43]]] },
  { name: "Spain", continent: "Europe", coords: [[[-10,36],[-6,36],[0,37],[3,40],[3,42],[-2,43],[-5,44],[-8,44],[-10,42],[-10,36]]] },
  { name: "Germany", continent: "Europe", coords: [[[6,47],[9,47],[12,47],[15,50],[15,54],[13,55],[9,55],[6,52],[6,47]]] },
  { name: "Ukraine", continent: "Europe", coords: [[[22,44],[30,44],[36,46],[40,47],[40,52],[35,52],[30,50],[22,50],[22,44]]] },
  { name: "Sweden", continent: "Europe", coords: [[[12,56],[16,56],[20,60],[19,64],[18,68],[15,68],[12,64],[12,56]]] },
  { name: "Japan", continent: "Asia", coords: [[[130,31],[132,33],[136,35],[140,37],[142,40],[144,43],[140,44],[138,38],[132,34],[130,31]]] },
  { name: "New Zealand", continent: "Oceania", coords: [[[166,-47],[172,-47],[178,-42],[176,-37],[173,-34],[170,-42],[166,-47]]] },
];

// Convert to GeoJSON FeatureCollection
// GeoJSON spec: exterior rings must be counterclockwise (right-hand rule).
// Ensure correct winding so D3 doesn't render the complement.
function ensureCCW(ring) {
  // Shoelace formula: positive area = CCW, negative = CW
  let area = 0;
  for (let i = 0, n = ring.length - 1; i < n; i++) {
    area += (ring[i + 1][0] - ring[i][0]) * (ring[i + 1][1] + ring[i][1]);
  }
  return area > 0 ? ring : ring.slice().reverse();
}

const geojson = {
  type: "FeatureCollection",
  features: countries.map((c, i) => ({
    type: "Feature",
    properties: { name: c.name, continent: c.continent },
    geometry: {
      type: "Polygon",
      coordinates: c.coords.map(ensureCCW)
    }
  }))
};

// --- Graticule ---
const graticule = d3.geoGraticule().step([20, 20])();
const outline = { type: "Sphere" };

// --- Projections ---
const projections = [
  { name: "Natural Earth", fn: () => d3.geoNaturalEarth1().fitSize([width, height], outline) },
  { name: "Mercator", fn: () => d3.geoMercator().fitSize([width, height], { type: "Sphere" }).clipExtent([[0, 0], [width, height]]) },
  { name: "Globe", fn: () => d3.geoOrthographic().rotate([0, -20]).fitSize([width, height], outline).clipAngle(90) },
  { name: "Equal Earth", fn: () => d3.geoEqualEarth().fitSize([width, height], outline) },
  { name: "Azimuthal", fn: () => d3.geoAzimuthalEqualArea().fitSize([width, height], outline).clipAngle(180) },
];

let currentIdx = 0;
let playing = true;
let timer = null;
let transitioning = false;

// --- SVG setup ---
const svg = d3.select("#map-container")
  .append("svg")
    .attr("width", width)
    .attr("height", height);

// Background sphere
svg.append("path")
    .attr("class", "sphere")
    .attr("fill", "#e8f0f8")
    .attr("stroke", "#bbb")
    .attr("stroke-width", 0.5);

// Graticule
svg.append("path")
    .attr("class", "graticule")
    .datum(graticule)
    .attr("fill", "none")
    .attr("stroke", "#ccc")
    .attr("stroke-width", 0.4);

// Countries
const countryPaths = svg.selectAll(".country")
  .data(geojson.features)
  .join("path")
    .attr("class", "country")
    .attr("fill", d => continentColors[d.properties.continent] || "#999")
    .attr("fill-opacity", 0.8)
    .attr("stroke", "#333")
    .attr("stroke-width", 0.5);

// Initial render
const path = d3.geoPath();

function renderProjection(idx) {
  const proj = projections[idx].fn();
  path.projection(proj);
  svg.select(".sphere").attr("d", path(outline));
  svg.select(".graticule").attr("d", path(graticule));
  countryPaths.attr("d", d => path(d) || "");
  d3.select("#title").text(projections[idx].name);
}

renderProjection(0);

// --- Projection transition using interpolated projection ---
function transitionTo(targetIdx) {
  if (transitioning || targetIdx === currentIdx) return;
  transitioning = true;

  const projA = projections[currentIdx].fn();
  const projB = projections[targetIdx].fn();
  const duration = 2000;

  // Update title immediately
  d3.select("#title").text(projections[targetIdx].name);
  updateButtons(targetIdx);

  const pathGen = d3.geoPath();

  const t0 = d3.now();
  const anim = d3.timer((elapsed) => {
    const rawT = Math.min(1, (d3.now() - t0) / duration);
    const t = d3.easeCubicInOut(rawT);

    // Interpolated projection: lerp pixel outputs of both projections
    const interp = d3.geoProjection((lon, lat) => {
      // d3.geoProjection receives radians; convert to degrees for the projection call
      const degLon = lon * 180 / Math.PI;
      const degLat = lat * 180 / Math.PI;
      const a = projA([degLon, degLat]);
      const b = projB([degLon, degLat]);
      if (!a || !b) return a || b || [0, 0];
      return [
        a[0] * (1 - t) + b[0] * t,
        a[1] * (1 - t) + b[1] * t
      ];
    })
      .scale(1)
      .translate([0, 0]);

    // Disable clipping on the interpolated projection so partial paths render
    interp.clipAngle(null);
    interp.clipExtent(null);

    pathGen.projection(interp);

    svg.select(".sphere").attr("d", pathGen(outline));
    svg.select(".graticule").attr("d", pathGen(graticule));
    countryPaths.attr("d", d => pathGen(d) || "");

    if (rawT >= 1) {
      anim.stop();
      currentIdx = targetIdx;
      // Snap to exact final projection
      renderProjection(currentIdx);
      transitioning = false;
    }
  });
}

// --- Controls ---
const controls = d3.select("#controls");

// Projection buttons
projections.forEach((p, i) => {
  controls.append("button")
    .attr("class", i === 0 ? "proj-btn active" : "proj-btn")
    .text(p.name)
    .on("click", () => {
      transitionTo(i);
      resetTimer();
    });
});

// Play/Pause
const playBtn = controls.append("button")
    .attr("class", "play-btn")
    .text("Pause")
    .on("click", () => {
      playing = !playing;
      playBtn.text(playing ? "Pause" : "Play");
      if (playing) startTimer();
      else stopTimer();
    });

function updateButtons(idx) {
  controls.selectAll(".proj-btn")
    .classed("active", (_, i) => i === idx);
}

// --- Auto-advance timer ---
function startTimer() {
  stopTimer();
  timer = d3.interval(() => {
    if (!transitioning && playing) {
      const next = (currentIdx + 1) % projections.length;
      transitionTo(next);
    }
  }, 4000);
}

function stopTimer() {
  if (timer) { timer.stop(); timer = null; }
}

function resetTimer() {
  if (playing) startTimer();
}

startTimer();
</script>
</body>
</html>
