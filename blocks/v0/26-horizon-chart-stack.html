<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Server CPU Usage — Horizon Chart</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fafafa; display: flex; justify-content: center; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; color: #222; margin-bottom: 8px; }
  .container { max-width: 960px; width: 100%; }
  .tooltip-panel {
    position: absolute; pointer-events: none; background: rgba(255,255,255,0.96);
    border: 1px solid #ccc; border-radius: 4px; padding: 8px 10px;
    font-size: 12px; line-height: 1.6; box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    display: none;
  }
  .tooltip-panel .tt-time { font-weight: 600; margin-bottom: 4px; color: #333; }
  .tooltip-panel .tt-row { display: flex; justify-content: space-between; gap: 16px; }
  .tooltip-panel .tt-name { color: #555; }
  .tooltip-panel .tt-val { font-variant-numeric: tabular-nums; font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <h1>Server CPU Usage — 24 Hour Horizon View</h1>
  <svg id="chart"></svg>
  <div class="tooltip-panel" id="tooltip"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Data generation ---
const serverNames = [
  "web-prod-01", "web-prod-02", "web-prod-03", "api-gateway",
  "db-primary", "db-replica-01", "db-replica-02", "cache-01"
];
const n = 1440; // one point per minute, 24 hours
const baselines = [35, 28, 40, 55, 45, 30, 25, 20];

// Seeded PRNG for reproducibility
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(42);

function generateSeries(baseline, spikeWindows) {
  const data = new Float64Array(n);
  let val = baseline;
  for (let i = 0; i < n; i++) {
    // Random walk with mean reversion
    val += (rng() - 0.5) * 3;
    val += (baseline - val) * 0.02;
    // Correlated spikes
    for (const [center, width, intensity] of spikeWindows) {
      const dist = Math.abs(i - center);
      if (dist < width) {
        const spike = intensity * Math.exp(-0.5 * (dist / (width * 0.3)) ** 2);
        val += spike * (0.5 + rng() * 0.5);
      }
    }
    data[i] = Math.max(0, Math.min(100, val));
  }
  return data;
}

// Correlated spike windows: [centerMinute, halfWidth, peakIntensity]
const spikeConfigs = [
  [[840, 40, 50], [300, 20, 25]],           // server 0: spike ~14:00, minor ~05:00
  [[845, 35, 55], [300, 20, 20]],           // server 1: correlated with 0
  [[835, 45, 45]],                           // server 2: correlated with 0,1
  [[720, 30, 30]],                           // server 3: noon spike
  [[540, 50, 55], [1100, 25, 30]],          // server 4: spike ~09:00
  [[535, 45, 60]],                           // server 5: correlated with 4
  [[545, 40, 50]],                           // server 6: correlated with 4,5
  [[400, 20, 20], [900, 15, 15]],           // server 7: mild spikes
];

const series = serverNames.map((name, i) => ({
  name,
  values: generateSeries(baselines[i], spikeConfigs[i])
}));

// --- Chart dimensions ---
const margin = { top: 4, right: 20, bottom: 30, left: 100 };
const bandHeight = 50;
const bandGap = 2;
const width = 960;
const chartHeight = serverNames.length * (bandHeight + bandGap) - bandGap;
const totalHeight = margin.top + chartHeight + margin.bottom;

const svg = d3.select("#chart")
    .attr("viewBox", `0 0 ${width} ${totalHeight}`)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("width", "100%")
    .style("height", "auto");

// --- Scales ---
const startDate = new Date(2026, 2, 25, 0, 0); // midnight
const x = d3.scaleUtc()
    .domain([startDate, new Date(+startDate + 24 * 60 * 60 * 1000)])
    .range([margin.left, width - margin.right]);

// --- Horizon bands ---
const bands = 3;
const step = 100 / bands; // ~33.33
// Blues with increasing darkness for 3 bands
const bandColors = ["#c6dbef", "#6baed6", "#2171b5"];

const area = d3.area()
    .x((d, i) => x(new Date(+startDate + i * 60000)))
    .y0(bandHeight)
    .y1(d => {
      const y = d3.scaleLinear().domain([0, step]).range([bandHeight, 0]);
      return y(Math.min(step, d));
    })
    .curve(d3.curveMonotoneX);

const chartArea = svg.append("g");

// Clip path for each band
svg.append("defs")
  .selectAll("clipPath")
  .data(series)
  .join("clipPath")
    .attr("id", (d, i) => `clip-${i}`)
  .append("rect")
    .attr("width", width - margin.left - margin.right)
    .attr("height", bandHeight);

series.forEach((s, si) => {
  const bandGroup = chartArea.append("g")
      .attr("transform", `translate(0, ${margin.top + si * (bandHeight + bandGap)})`);

  // Background
  bandGroup.append("rect")
      .attr("x", margin.left)
      .attr("width", width - margin.left - margin.right)
      .attr("height", bandHeight)
      .attr("fill", "#f5f5f5");

  // Horizon layers: for each band level, clip values and render
  for (let b = 0; b < bands; b++) {
    const bandData = Array.from(s.values, v => Math.max(0, v - b * step));

    bandGroup.append("path")
        .datum(bandData)
        .attr("d", area)
        .attr("fill", bandColors[b])
        .attr("clip-path", `url(#clip-${si})`)
        .attr("transform", `translate(0, 0)`);
  }

  // Clip rect needs to be positioned at margin.left
  svg.select(`#clip-${si} rect`).attr("x", margin.left);

  // Server label
  bandGroup.append("text")
      .attr("x", margin.left - 8)
      .attr("y", bandHeight / 2)
      .attr("text-anchor", "end")
      .attr("dominant-baseline", "central")
      .attr("fill", "#333")
      .attr("font-size", "11px")
      .text(s.name);

  // Bottom border
  bandGroup.append("line")
      .attr("x1", margin.left)
      .attr("x2", width - margin.right)
      .attr("y1", bandHeight)
      .attr("y2", bandHeight)
      .attr("stroke", "#ddd")
      .attr("stroke-width", 0.5);
});

// --- X axis ---
const xAxis = d3.axisBottom(x)
    .ticks(d3.utcHour.every(2))
    .tickFormat(d3.utcFormat("%H:%M"));

svg.append("g")
    .attr("transform", `translate(0, ${margin.top + chartHeight})`)
    .call(xAxis)
    .call(g => g.select(".domain").attr("stroke", "#999"))
    .call(g => g.selectAll(".tick line").attr("stroke", "#bbb"))
    .call(g => g.selectAll(".tick text").attr("fill", "#555").attr("font-size", "11px"));

// --- Interaction: vertical hover line + tooltip ---
const hoverLine = svg.append("line")
    .attr("y1", margin.top)
    .attr("y2", margin.top + chartHeight)
    .attr("stroke", "#333")
    .attr("stroke-width", 1)
    .attr("stroke-dasharray", "3,2")
    .attr("pointer-events", "none")
    .style("display", "none");

const tooltip = document.getElementById("tooltip");

// Invisible rect for pointer events
svg.append("rect")
    .attr("x", margin.left)
    .attr("y", margin.top)
    .attr("width", width - margin.left - margin.right)
    .attr("height", chartHeight)
    .attr("fill", "transparent")
    .on("pointermove", function(event) {
      const [mx] = d3.pointer(event);
      const date = x.invert(mx);
      const minuteIndex = Math.round((date - startDate) / 60000);
      if (minuteIndex < 0 || minuteIndex >= n) return;

      const snappedX = x(new Date(+startDate + minuteIndex * 60000));
      hoverLine
          .attr("x1", snappedX)
          .attr("x2", snappedX)
          .style("display", null);

      const hours = String(Math.floor(minuteIndex / 60)).padStart(2, "0");
      const mins = String(minuteIndex % 60).padStart(2, "0");

      let html = `<div class="tt-time">${hours}:${mins}</div>`;
      for (const s of series) {
        const val = s.values[minuteIndex];
        html += `<div class="tt-row"><span class="tt-name">${s.name}</span><span class="tt-val">${val.toFixed(1)}%</span></div>`;
      }
      tooltip.innerHTML = html;
      tooltip.style.display = "block";

      // Position tooltip
      const svgRect = document.getElementById("chart").getBoundingClientRect();
      const fracX = snappedX / width;
      const px = svgRect.left + fracX * svgRect.width;
      const py = svgRect.top + (margin.top / totalHeight) * svgRect.height;

      const ttWidth = tooltip.offsetWidth;
      const flip = px + ttWidth + 16 > window.innerWidth;
      tooltip.style.left = (flip ? px - ttWidth - 12 : px + 12) + "px";
      tooltip.style.top = py + "px";
    })
    .on("pointerleave", function() {
      hoverLine.style("display", "none");
      tooltip.style.display = "none";
    });
</script>
</body>
</html>
