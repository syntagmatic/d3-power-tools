<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>World GDP Rankings — Bar Chart Race</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  #container { width: 100%; max-width: 960px; }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .controls button {
    font-family: system-ui;
    font-size: 0.85rem;
    padding: 4px 14px;
    border: 1px solid #bbb;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    color: #333;
  }
  .controls button:hover { background: #eee; }
  .controls button.active {
    background: #4477AA;
    color: #fff;
    border-color: #4477AA;
  }
  .controls .separator {
    width: 1px;
    height: 20px;
    background: #ccc;
    margin: 0 4px;
  }
  .year-display {
    font-size: 4rem;
    font-weight: 700;
    fill: #e0e0e0;
    text-anchor: end;
  }
  .bar-label {
    font-size: 0.78rem;
    fill: #333;
    font-weight: 500;
  }
  .bar-value {
    font-size: 0.75rem;
    fill: #555;
    font-weight: 400;
  }
  .bar-code {
    font-size: 0.65rem;
    fill: #fff;
    font-weight: 700;
  }
</style>
</head>
<body>
<div id="container">
  <h1>World GDP Rankings — Bar Chart Race</h1>
  <div class="controls">
    <button id="btn-play">Pause</button>
    <div class="separator"></div>
    <button class="speed-btn" data-speed="0.5">0.5x</button>
    <button class="speed-btn active" data-speed="1">1x</button>
    <button class="speed-btn" data-speed="2">2x</button>
  </div>
  <div id="chart"></div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- DATA GENERATION ---
// Realistic GDP trajectories (trillions USD, nominal)
const countries = [
  { name: "United States", code: "US", y1994: 7.29, y2023: 25.46, curve: "linear" },
  { name: "China",         code: "CN", y1994: 0.56, y2023: 17.79, curve: "exponential" },
  { name: "Japan",         code: "JP", y1994: 4.90, y2023: 4.21,  curve: "stagnant" },
  { name: "Germany",       code: "DE", y1994: 2.21, y2023: 4.46,  curve: "linear" },
  { name: "United Kingdom",code: "GB", y1994: 1.14, y2023: 3.07,  curve: "linear" },
  { name: "India",         code: "IN", y1994: 0.33, y2023: 3.57,  curve: "accelerating" },
  { name: "France",        code: "FR", y1994: 1.57, y2023: 3.05,  curve: "linear" },
  { name: "Italy",         code: "IT", y1994: 1.09, y2023: 2.19,  curve: "slow" },
  { name: "Brazil",        code: "BR", y1994: 0.56, y2023: 2.13,  curve: "boom-bust" },
  { name: "Canada",        code: "CA", y1994: 0.57, y2023: 2.12,  curve: "linear" },
  { name: "Russia",        code: "RU", y1994: 0.40, y2023: 1.86,  curve: "recovery" },
  { name: "South Korea",   code: "KR", y1994: 0.46, y2023: 1.71,  curve: "linear" },
  { name: "Australia",     code: "AU", y1994: 0.32, y2023: 1.69,  curve: "linear" },
  { name: "Spain",         code: "ES", y1994: 0.53, y2023: 1.58,  curve: "linear" },
  { name: "Mexico",        code: "MX", y1994: 0.53, y2023: 1.32,  curve: "linear" },
];

const startYear = 1994, endYear = 2023;
const years = d3.range(startYear, endYear + 1);

function generateGDP(c) {
  const n = years.length;
  return years.map((year, i) => {
    const t = i / (n - 1); // 0..1
    let gdp;
    switch (c.curve) {
      case "exponential":
        // China: exponential ramp
        gdp = c.y1994 + (c.y2023 - c.y1994) * Math.pow(t, 1.6);
        break;
      case "accelerating":
        // India: slow start, fast finish
        gdp = c.y1994 + (c.y2023 - c.y1994) * Math.pow(t, 2.2);
        break;
      case "stagnant":
        // Japan: peak around 2012 then decline
        gdp = c.y1994 + (c.y2023 - c.y1994) * t
          + 1.2 * Math.sin(t * Math.PI);
        break;
      case "boom-bust":
        // Brazil: rise to 2011 peak, dip, partial recovery
        gdp = c.y1994 + (c.y2023 - c.y1994) * t
          + 0.7 * Math.sin(t * Math.PI * 1.1);
        break;
      case "recovery":
        // Russia: collapse then recovery
        gdp = c.y1994 + (c.y2023 - c.y1994) * Math.pow(t, 1.3)
          - 0.15 * Math.sin(t * Math.PI * 0.8);
        break;
      case "slow":
        gdp = c.y1994 + (c.y2023 - c.y1994) * Math.pow(t, 0.7);
        break;
      default: // linear
        gdp = c.y1994 + (c.y2023 - c.y1994) * t;
    }
    return { country: c.name, code: c.code, year, gdp: Math.max(0.1, gdp) };
  });
}

const allData = countries.flatMap(generateGDP);
const dataByYear = d3.group(allData, d => d.year);

// --- COLOR SCALE ---
// Tol bright + muted combined for 15 distinct colors
const bright = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377","#BBBBBB"];
const muted  = ["#CC6677","#332288","#DDCC77","#117733","#88CCEE","#882255","#44AA99","#999933"];
const palette = [...bright, ...muted];
const colorScale = d3.scaleOrdinal()
  .domain(countries.map(c => c.name))
  .range(palette);

// --- LAYOUT ---
const margin = { top: 30, right: 90, bottom: 10, left: 160 };
const nBars = 12;
const barHeight = 34;
const barGap = 4;
const width = 900;
const innerWidth = width - margin.left - margin.right;
const innerHeight = nBars * (barHeight + barGap);
const height = innerHeight + margin.top + margin.bottom;

const svg = d3.select("#chart").append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("width", "100%");

const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// Year display
const yearText = svg.append("text")
    .attr("class", "year-display")
    .attr("x", width - margin.right)
    .attr("y", height - 20)
    .text(startYear);

// Scales
const x = d3.scaleLinear().range([0, innerWidth]);
const y = d3.scaleBand()
    .domain(d3.range(nBars))
    .range([0, innerHeight])
    .padding(0.1);

// --- ANIMATION STATE ---
let currentYear = startYear;
let playing = true;
let speed = 1;
let timer = null;
const duration = () => 600 / speed;

function getTopN(year) {
  const yearData = dataByYear.get(year);
  return yearData
    .slice()
    .sort((a, b) => b.gdp - a.gdp)
    .slice(0, nBars);
}

function textTween(targetValue) {
  return function() {
    const node = this;
    const current = parseFloat(node.textContent.replace(/[^0-9.]/g, "")) || 0;
    const i = d3.interpolateRound(Math.round(current * 100), Math.round(targetValue * 100));
    return t => {
      node.textContent = `$${(i(t) / 100).toFixed(2)}T`;
    };
  };
}

function render(year, dur) {
  const data = getTopN(year);
  x.domain([0, d3.max(data, d => d.gdp) * 1.05]);

  // --- BARS ---
  const bars = g.selectAll(".bar")
    .data(data, d => d.country);

  bars.exit()
    .interrupt().transition().duration(dur)
      .attr("y", innerHeight + barHeight)
      .attr("width", 0)
      .attr("opacity", 0)
      .remove();

  bars.interrupt().transition().duration(dur)
      .ease(d3.easeLinear)
      .attr("y", (d, i) => y(i))
      .attr("width", d => x(d.gdp))
      .attr("height", y.bandwidth());

  bars.enter().append("rect")
      .attr("class", "bar")
      .attr("x", 0)
      .attr("y", innerHeight + barHeight)
      .attr("height", y.bandwidth())
      .attr("width", 0)
      .attr("fill", d => colorScale(d.country))
      .attr("rx", 3)
      .attr("opacity", 0)
    .transition().duration(dur)
      .ease(d3.easeLinear)
      .attr("y", (d, i) => y(i))
      .attr("width", d => x(d.gdp))
      .attr("opacity", 1);

  // --- COUNTRY LABELS (left) ---
  const labels = g.selectAll(".bar-label")
    .data(data, d => d.country);

  labels.exit()
    .interrupt().transition().duration(dur)
      .attr("y", innerHeight + barHeight + y.bandwidth() / 2)
      .attr("opacity", 0)
      .remove();

  labels.interrupt().transition().duration(dur)
      .ease(d3.easeLinear)
      .attr("y", (d, i) => y(i) + y.bandwidth() / 2);

  labels.enter().append("text")
      .attr("class", "bar-label")
      .attr("x", -8)
      .attr("y", innerHeight + barHeight + y.bandwidth() / 2)
      .attr("text-anchor", "end")
      .attr("dominant-baseline", "central")
      .attr("opacity", 0)
      .text(d => d.country)
    .transition().duration(dur)
      .ease(d3.easeLinear)
      .attr("y", (d, i) => y(i) + y.bandwidth() / 2)
      .attr("opacity", 1);

  // --- COUNTRY CODE (inside bar end) ---
  const codes = g.selectAll(".bar-code")
    .data(data, d => d.country);

  codes.exit()
    .interrupt().transition().duration(dur)
      .attr("y", innerHeight + barHeight + y.bandwidth() / 2)
      .attr("opacity", 0)
      .remove();

  codes.interrupt().transition().duration(dur)
      .ease(d3.easeLinear)
      .attr("y", (d, i) => y(i) + y.bandwidth() / 2)
      .attr("x", d => Math.max(20, x(d.gdp) - 6));

  codes.enter().append("text")
      .attr("class", "bar-code")
      .attr("x", d => Math.max(20, x(d.gdp) - 6))
      .attr("y", innerHeight + barHeight + y.bandwidth() / 2)
      .attr("text-anchor", "end")
      .attr("dominant-baseline", "central")
      .attr("opacity", 0)
      .text(d => d.code)
    .transition().duration(dur)
      .ease(d3.easeLinear)
      .attr("y", (d, i) => y(i) + y.bandwidth() / 2)
      .attr("opacity", 1);

  // --- VALUE LABELS (right of bar) ---
  const values = g.selectAll(".bar-value")
    .data(data, d => d.country);

  values.exit()
    .interrupt().transition().duration(dur)
      .attr("y", innerHeight + barHeight + y.bandwidth() / 2)
      .attr("opacity", 0)
      .remove();

  values.interrupt().transition().duration(dur)
      .ease(d3.easeLinear)
      .attr("y", (d, i) => y(i) + y.bandwidth() / 2)
      .attr("x", d => x(d.gdp) + 6)
      .tween("text", d => textTween(d.gdp).call(values.filter(v => v.country === d.country).node()));

  values.enter().append("text")
      .attr("class", "bar-value")
      .attr("x", d => x(d.gdp) + 6)
      .attr("y", innerHeight + barHeight + y.bandwidth() / 2)
      .attr("text-anchor", "start")
      .attr("dominant-baseline", "central")
      .attr("opacity", 0)
      .text(d => `$${d.gdp.toFixed(2)}T`)
    .transition().duration(dur)
      .ease(d3.easeLinear)
      .attr("y", (d, i) => y(i) + y.bandwidth() / 2)
      .attr("opacity", 1);

  // --- YEAR ---
  yearText.text(year);
}

// Initial render
render(currentYear, 0);

function advance() {
  if (currentYear >= endYear) {
    playing = false;
    d3.select("#btn-play").text("Replay");
    clearInterval(timer);
    timer = null;
    return;
  }
  currentYear++;
  render(currentYear, duration());
}

function startTimer() {
  if (timer) clearInterval(timer);
  timer = setInterval(advance, duration() + 50);
}

// Auto-play
startTimer();

// Controls
d3.select("#btn-play").on("click", () => {
  if (currentYear >= endYear) {
    // Replay
    currentYear = startYear;
    render(currentYear, 0);
    playing = true;
    d3.select("#btn-play").text("Pause");
    startTimer();
    return;
  }
  playing = !playing;
  d3.select("#btn-play").text(playing ? "Pause" : "Play");
  if (playing) {
    startTimer();
  } else {
    clearInterval(timer);
    timer = null;
  }
});

d3.selectAll(".speed-btn").on("click", function() {
  d3.selectAll(".speed-btn").classed("active", false);
  d3.select(this).classed("active", true);
  speed = +this.dataset.speed;
  if (playing) startTimer();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (timer) { clearInterval(timer); timer = null; }
  } else {
    if (playing) startTimer();
  }
});
</script>
</body>
</html>
