<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL OKLCH Color Space Explorer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0a0a0c;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      color: #ececec;
    }
    canvas {
      display: block;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
      width: 320px;
    }
    .panel {
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: all;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .desc {
      font-size: 12px;
      opacity: 0.6;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .control-group {
      margin-bottom: 12px;
    }
    .control-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      opacity: 0.8;
    }
    input[type="range"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      height: 4px;
      border-radius: 2px;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
    }
    .val {
      font-variant-numeric: tabular-nums;
      float: right;
    }
    #tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 8px;
      pointer-events: none;
      display: none;
      font-size: 13px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .swatch {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .stat {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
    }
    .legend {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 10px;
      opacity: 0.4;
      text-align: right;
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="panel">
    <h1>OKLCH Color Universe</h1>
    <div class="desc">
      1500+ named colors from CSS, Paul Tol, and ColorBrewer mapped in perceptual 3D space.
    </div>
    
    <div class="control-group">
      <label>Lightness Slice <span class="val" id="l-val">0.0 - 1.0</span></label>
      <input type="range" id="l-min" min="0" max="1" step="0.01" value="0">
      <input type="range" id="l-max" min="0" max="1" step="0.01" value="1" style="margin-top: 4px;">
    </div>

    <div class="control-group">
      <label>Chroma Slice <span class="val" id="c-val">0.0 - 0.4</span></label>
      <input type="range" id="c-min" min="0" max="0.4" step="0.01" value="0">
      <input type="range" id="c-max" min="0" max="0.4" step="0.01" value="0.4" style="margin-top: 4px;">
    </div>
    
    <div class="control-group">
      <label>Point Size <span class="val" id="s-val">4.0</span></label>
      <input type="range" id="p-size" min="1" max="20" step="0.5" value="4">
    </div>
  </div>
</div>

<div id="tooltip">
  <div class="swatch" id="tt-swatch"></div>
  <div id="tt-name" style="font-weight:600;"></div>
  <div id="tt-hex" style="opacity:0.7; font-family:monospace;"></div>
  <div class="stat" id="tt-oklch"></div>
</div>

<div class="legend">
  Orbit: Drag&nbsp;&nbsp;Zoom: Scroll&nbsp;&nbsp;Pan: Right-click
</div>

<script>
  // 1. Data Aggregation
  function getColors() {
    const colorMap = new Map();

    // CSS Named Colors
    Object.keys(d3.colors).forEach(name => {
      const hex = d3.colors[name];
      if (!colorMap.has(hex)) colorMap.set(hex, name);
    });

    // ColorBrewer Schemes
    const brewerSchemes = [
      'BrBG', 'PRGn', 'PiYG', 'PuOr', 'RdBu', 'RdGy', 'RdYlBu', 'RdYlGn', 'Spectral',
      'Blues', 'Greens', 'Greys', 'Oranges', 'Purples', 'Reds',
      'BuGn', 'BuPu', 'GnBu', 'OrRd', 'PuBuGn', 'PuBu', 'PuRd', 'RdPu', 'YlGnBu', 'YlGn', 'YlOrBr', 'YlOrRd'
    ];
    brewerSchemes.forEach(s => {
      const scheme = d3['scheme' + s];
      if (scheme) {
        // Take the largest version (usually 9 or 11 stops)
        const colors = scheme[Math.max(...Object.keys(scheme).map(Number))];
        colors.forEach((c, i) => {
          if (!colorMap.has(c)) colorMap.set(c, `${s}-${i}`);
        });
      }
    });

    // Discrete Qualitative Schemes
    ['Accent', 'Dark2', 'Paired', 'Pastel1', 'Pastel2', 'Set1', 'Set2', 'Set3', 'Tableau10'].forEach(s => {
      const colors = d3['scheme' + s];
      colors.forEach((c, i) => {
        if (!colorMap.has(c)) colorMap.set(c, `${s}-${i}`);
      });
    });

    // Paul Tol Palettes (Simulated/Commonly used)
    const tol = {
      bright: ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377","#BBBBBB"],
      vibrant: ["#EE7733","#0077BB","#33BBEE","#EE3377","#CC3311","#009988","#BBBBBB"],
      muted: ["#CC6677","#332288","#DDCC77","#117733","#88CCEE","#882255","#44AA99","#999933","#AA4499"]
    };
    Object.entries(tol).forEach(([name, colors]) => {
      colors.forEach((c, i) => {
        if (!colorMap.has(c)) colorMap.set(c, `Tol-${name}-${i}`);
      });
    });

    // Sample from interpolators to hit 1500+ if needed
    const interpolators = [d3.interpolateViridis, d3.interpolateMagma, d3.interpolateInferno, d3.interpolatePlasma, d3.interpolateTurbo, d3.interpolateCividis];
    interpolators.forEach((interp, j) => {
      const count = 150;
      for(let i=0; i<count; i++) {
        const c = interp(i/(count-1));
        const hex = d3.color(c).formatHex();
        if (!colorMap.has(hex)) colorMap.set(hex, `Interp-${j}-${i}`);
      }
    });

    return Array.from(colorMap.entries()).map(([hex, name]) => {
      const c = d3.oklch(hex);
      return { hex, name, l: c.l, c: c.c, h: c.h };
    });
  }

  const colorData = getColors();

  // 2. Three.js Setup
  const width = window.innerWidth;
  const height = window.innerHeight;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width / height, 1, 5000);
  camera.position.set(400, 300, 400);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(width, height);
  renderer.setClearColor(0x0a0a0c, 1);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // 3. Shaders
  const vertexShader = `
    attribute float size;
    attribute vec3 customColor;
    attribute vec3 oklch;
    varying vec3 vColor;
    varying vec3 vOklch;
    varying float vVisible;

    uniform float u_lMin;
    uniform float u_lMax;
    uniform float u_cMin;
    uniform float u_cMax;
    uniform float u_pointSize;

    void main() {
      vColor = customColor;
      vOklch = oklch;
      
      // Slicing logic
      bool visible = (oklch.x >= u_lMin && oklch.x <= u_lMax) && (oklch.y >= u_cMin && oklch.y <= u_cMax);
      vVisible = visible ? 1.0 : 0.0;

      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = u_pointSize * (300.0 / -mvPosition.z) * vVisible;
      gl_Position = projectionMatrix * mvPosition;
    }
  `;

  const fragmentShader = `
    varying vec3 vColor;
    varying float vVisible;
    void main() {
      if (vVisible < 0.5) discard;
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      
      // Subtle glow/anti-alias
      float strength = 1.0 - smoothstep(0.4, 0.5, d);
      gl_FragColor = vec4(vColor, strength);
    }
  `;

  // 4. Geometry
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(colorData.length * 3);
  const colors = new Float32Array(colorData.length * 3);
  const oklchAttrs = new Float32Array(colorData.length * 3);

  const SCALE_L = 400;
  const SCALE_C = 800;

  colorData.forEach((d, i) => {
    const angle = (d.h || 0) * Math.PI / 180;
    const x = d.c * SCALE_C * Math.cos(angle);
    const z = d.c * SCALE_C * Math.sin(angle);
    const y = (d.l - 0.5) * SCALE_L;

    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    const rgb = d3.rgb(d.hex);
    colors[i * 3] = rgb.r / 255;
    colors[i * 3 + 1] = rgb.g / 255;
    colors[i * 3 + 2] = rgb.b / 255;

    oklchAttrs[i * 3] = d.l;
    oklchAttrs[i * 3 + 1] = d.c;
    oklchAttrs[i * 3 + 2] = d.h;
  });

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('oklch', new THREE.BufferAttribute(oklchAttrs, 3));

  const uniforms = {
    u_lMin: { value: 0.0 },
    u_lMax: { value: 1.0 },
    u_cMin: { value: 0.0 },
    u_cMax: { value: 0.4 },
    u_pointSize: { value: 4.0 }
  };

  const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geometry, material);
  scene.add(points);

  // Axis Helpers
  const gridHelper = new THREE.GridHelper(1000, 20, 0x333333, 0x1a1a1a);
  gridHelper.position.y = -SCALE_L/2;
  scene.add(gridHelper);

  // Labels for L
  const lAxis = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -SCALE_L/2, 0), new THREE.Vector3(0, SCALE_L/2, 0)]),
    new THREE.LineBasicMaterial({ color: 0x555555 })
  );
  scene.add(lAxis);

  // 5. Interaction
  const raycaster = new THREE.Raycaster();
  raycaster.params.Points.threshold = 5;
  const mouse = new THREE.Vector2();

  const tooltip = d3.select("#tooltip");
  const ttName = d3.select("#tt-name");
  const ttHex = d3.select("#tt-hex");
  const ttSwatch = d3.select("#tt-swatch");
  const ttOklch = d3.select("#tt-oklch");

  window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(points);

    if (intersects.length > 0) {
      // Find the first visible point
      let target = null;
      for (let inter of intersects) {
        const idx = inter.index;
        const l = oklchAttrs[idx * 3];
        const c = oklchAttrs[idx * 3 + 1];
        if (l >= uniforms.u_lMin.value && l <= uniforms.u_lMax.value && 
            c >= uniforms.u_cMin.value && c <= uniforms.u_cMax.value) {
          target = inter;
          break;
        }
      }

      if (target) {
        const d = colorData[target.index];
        tooltip.style("display", "block")
               .style("left", (e.clientX + 15) + "px")
               .style("top", (e.clientY + 15) + "px");
        ttName.text(d.name);
        ttHex.text(d.hex.toUpperCase());
        ttSwatch.style("background-color", d.hex);
        ttOklch.text(`L: ${d.l.toFixed(3)} C: ${d.c.toFixed(3)} H: ${d.h.toFixed(1)}°`);
        return;
      }
    }
    tooltip.style("display", "none");
  });

  // UI Handlers
  const lMinInput = document.getElementById('l-min');
  const lMaxInput = document.getElementById('l-max');
  const cMinInput = document.getElementById('c-min');
  const cMaxInput = document.getElementById('c-max');
  const pSizeInput = document.getElementById('p-size');

  function updateUI() {
    uniforms.u_lMin.value = parseFloat(lMinInput.value);
    uniforms.u_lMax.value = parseFloat(lMaxInput.value);
    uniforms.u_cMin.value = parseFloat(cMinInput.value);
    uniforms.u_cMax.value = parseFloat(cMaxInput.value);
    uniforms.u_pointSize.value = parseFloat(pSizeInput.value);

    document.getElementById('l-val').innerText = `${uniforms.u_lMin.value.toFixed(2)} - ${uniforms.u_lMax.value.toFixed(2)}`;
    document.getElementById('c-val').innerText = `${uniforms.u_cMin.value.toFixed(2)} - ${uniforms.u_cMax.value.toFixed(2)}`;
    document.getElementById('s-val').innerText = uniforms.u_pointSize.value.toFixed(1);
  }

  [lMinInput, lMaxInput, cMinInput, cMaxInput, pSizeInput].forEach(el => el.addEventListener('input', updateUI));
  updateUI();

  // Animation Loop
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
