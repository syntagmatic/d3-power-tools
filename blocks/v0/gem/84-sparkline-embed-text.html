<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metric Performance & Narrative</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --tol-blue: #4477AA;
      --tol-red: #EE6677;
      --tol-green: #228833;
      --bg: #ffffff;
      --text: #1a1a1a;
      --border: #e0e0e0;
      --row-hover: #f9f9f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      background-color: var(--bg);
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .narrative p {
      margin-bottom: 1.25rem;
      text-align: justify;
    }

    .sparkline-inline {
      display: inline-block;
      vertical-align: baseline;
      margin: 0 2px;
      position: relative;
      top: 2px;
    }

    .sparkline-inline svg {
      display: block;
    }

    .table-container {
      margin-top: 3rem;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      min-width: 600px;
    }

    caption {
      text-align: left;
      font-weight: 600;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    th, td {
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      background: var(--bg);
    }

    th:hover {
      color: var(--text);
    }

    th.sort-active {
      color: var(--text);
    }

    th.sort-active::after {
      content: ' ↓';
    }

    th.sort-active.sort-asc::after {
      content: ' ↑';
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .change-up { color: var(--tol-green); }
    .change-down { color: var(--tol-red); }

    .trend-cell {
      width: 80px;
      padding: 4px 8px;
    }

    tr {
      transition: background-color 0.2s;
    }

    tr:hover {
      background-color: var(--row-hover);
    }

    /* Responsive Sticky Column */
    @media (max-width: 600px) {
      .metric-col {
        position: sticky;
        left: 0;
        background: var(--bg);
        z-index: 1;
        box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
      }
      
      th.metric-col {
        z-index: 2;
      }
    }

    .metric-name {
      font-weight: 500;
    }
  </style>
</head>
<body>

<header>
  <h1>Operational Performance Review</h1>
</header>

<main>
  <section class="narrative" id="narrative-content">
    <!-- Content generated by JS -->
  </section>

  <section class="table-container">
    <table id="metrics-table">
      <caption>Monthly Performance Metrics (2023–2024)</caption>
      <thead>
        <tr>
          <th class="metric-col" data-sort="name">Metric</th>
          <th class="num" data-sort="latest">Latest</th>
          <th class="num" data-sort="yoy">YoY Change</th>
          <th style="cursor: default;">Trend</th>
          <th class="num" data-sort="min">Min</th>
          <th class="num" data-sort="max">Max</th>
          <th class="num" data-sort="avg">Avg</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows generated by JS -->
      </tbody>
    </table>
  </section>
</main>

<script>
  // 1. Data Generation
  const months = Array.from({length: 24}, (_, i) => i);
  
  const metrics = [
    {
      id: "revenue",
      name: "Revenue",
      unit: "$M",
      format: d3.format("$.1f"),
      data: months.map(i => 8.2 + (i * (12.1 - 8.2) / 23) + (Math.random() * 0.4 - 0.2))
    },
    {
      id: "margin",
      name: "Gross Margin",
      unit: "%",
      format: d3.format(".1f"),
      data: months.map(() => 42 + (Math.random() * 1.5 - 0.75))
    },
    {
      id: "customers",
      name: "Customer Count",
      unit: "K",
      format: d3.format(".1f"),
      data: months.map(i => 15 + (i * (22 - 15) / 23) + (Math.random() * 0.6 - 0.3))
    },
    {
      id: "churn",
      name: "Churn Rate",
      unit: "%",
      format: d3.format(".1f"),
      data: months.map(i => {
        let val = 5.2 - (i * (5.2 - 3.8) / 23);
        if (i === 13) val += 1.5; // Month 14 spike (0-indexed 13)
        return val + (Math.random() * 0.2 - 0.1);
      })
    },
    {
      id: "nps",
      name: "NPS",
      unit: "",
      format: d3.format(".0f"),
      data: months.map(i => 32 + (i * (58 - 32) / 23) + (Math.random() * 8 - 4))
    },
    {
      id: "aov",
      name: "Avg Order Value",
      unit: "$",
      format: d3.format("$.0f"),
      data: months.map(() => 127 + (Math.random() * 4 - 2))
    },
    {
      id: "tickets",
      name: "Support Tickets",
      unit: "K",
      format: d3.format(".1f"),
      data: months.map(i => 4.5 - (i * (4.5 - 2.8) / 23) + (Math.random() * 0.3 - 0.15))
    },
    {
      id: "employees",
      name: "Employee Count",
      unit: "",
      format: d3.format(".0f"),
      data: months.map(i => {
        if (i < 8) return 340;
        if (i < 16) return 375;
        return 410;
      })
    }
  ];

  // Calculate statistics
  metrics.forEach(m => {
    const d = m.data;
    m.latest = d[d.length - 1];
    m.previousYear = d[d.length - 13];
    m.yoy = (m.latest - m.previousYear) / m.previousYear;
    m.min = d3.min(d);
    m.max = d3.max(d);
    m.avg = d3.mean(d);
  });

  // 2. Render Narrative
  const narrativeData = [
    {
      text: "In the fiscal year 2024, our **REVENUE** [REVENUE] showed a strong upward trajectory, reaching $12.1M. This growth was supported by a steady expansion in our **CUSTOMER_COUNT** [CUSTOMER_COUNT], which grew by 47% over the period. Despite the rapid scale, **GROSS_MARGIN** [GROSS_MARGIN] remained remarkably stable at approximately 42%, reflecting operational efficiency.",
      sparks: ["revenue", "customers", "margin"]
    },
    {
      text: "Customer retention remains a key focus. Although **CHURN_RATE** [CHURN_RATE] experienced a notable spike in month 14 due to a platform migration, it has since declined to a healthy 3.8%. This improvement is mirrored in our **NPS** [NPS], which climbed from 32 to 58 as we addressed long-standing feedback. Meanwhile, **AVG_ORDER_VALUE** [AVG_ORDER_VALUE] held steady at $127, indicating consistent purchasing behavior across our segments.",
      sparks: ["churn", "nps", "aov"]
    },
    {
      text: "Operational scale is being managed carefully. **SUPPORT_TICETS** [SUPPORT_TICETS] have steadily declined as product stability improved, even as our **EMPLOYEE_COUNT** [EMPLOYEE_COUNT] followed a planned step-function increase from 340 to 410 to support our international expansion. These metrics collectively point to a robust and scalable business model heading into 2025.",
      sparks: ["tickets", "employees"]
    }
  ];

  const narrativeContainer = d3.select("#narrative-content");
  
  narrativeData.forEach(p => {
    let html = p.text
      .replace("**REVENUE**", "<strong>Revenue</strong>")
      .replace("**CUSTOMER_COUNT**", "<strong>Customer Count</strong>")
      .replace("**GROSS_MARGIN**", "<strong>Gross Margin</strong>")
      .replace("**CHURN_RATE**", "<strong>Churn Rate</strong>")
      .replace("**NPS**", "<strong>NPS</strong>")
      .replace("**AVG_ORDER_VALUE**", "<strong>Avg Order Value</strong>")
      .replace("**SUPPORT_TICETS**", "<strong>Support Tickets</strong>")
      .replace("**EMPLOYEE_COUNT**", "<strong>Employee Count</strong>");
    
    const para = narrativeContainer.append("p").html(html);
    
    p.sparks.forEach(id => {
      const metric = metrics.find(m => m.id === id);
      const placeholder = `[${id.toUpperCase()}]`;
      const spanId = `spark-${id}`;
      
      para.html(para.html().replace(placeholder, `<span class="sparkline-inline" id="${spanId}"></span>`));
      renderSparkline(d3.select(`#${spanId}`), metric.data, 60, 12);
    });
  });

  // 3. Render Table
  const tbody = d3.select("#metrics-table tbody");
  let currentSort = { key: "name", asc: true };

  function renderTable() {
    const sortedMetrics = [...metrics].sort((a, b) => {
      let vA = a[currentSort.key];
      let vB = b[currentSort.key];
      if (typeof vA === "string") return currentSort.asc ? vA.localeCompare(vB) : vB.localeCompare(vA);
      return currentSort.asc ? vA - vB : vB - vA;
    });

    const rows = tbody.selectAll("tr")
      .data(sortedMetrics, d => d.id)
      .join(
        enter => enter.append("tr"),
        update => update,
        exit => exit.remove()
      );

    rows.html(""); // Clear for redraw

    rows.append("td").attr("class", "metric-col metric-name").text(d => d.name);
    rows.append("td").attr("class", "num").text(d => d.format(d.latest) + d.unit);
    
    rows.append("td").attr("class", d => `num ${d.yoy >= 0 ? 'change-up' : 'change-down'}`)
      .text(d => (d.yoy >= 0 ? "+" : "") + d3.format(".1%")(d.yoy));
    
    const trendCells = rows.append("td").attr("class", "trend-cell");
    trendCells.each(function(d) {
      renderSparkline(d3.select(this), d.data, 80, 20);
    });

    rows.append("td").attr("class", "num").text(d => d.format(d.min) + d.unit);
    rows.append("td").attr("class", "num").text(d => d.format(d.max) + d.unit);
    rows.append("td").attr("class", "num").text(d => d.format(d.avg) + d.unit);

    // Re-apply sort icons
    d3.selectAll("th").classed("sort-active", false).classed("sort-asc", false);
    const activeTh = d3.select(`th[data-sort="${currentSort.key}"]`);
    activeTh.classed("sort-active", true).classed("sort-asc", currentSort.asc);
  }

  // 4. Sparkline Renderer
  function renderSparkline(container, data, width, height) {
    const svg = container.append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("aria-hidden", "true");

    const x = d3.scaleLinear().domain([0, data.length - 1]).range([2, width - 4]);
    const y = d3.scaleLinear().domain(d3.extent(data)).range([height - 2, 2]);

    const line = d3.line()
      .x((_, i) => x(i))
      .y(d => y(d))
      .curve(d3.curveMonotoneX);

    svg.append("path")
      .datum(data)
      .attr("fill", "none")
      .attr("stroke", "currentColor")
      .attr("stroke-width", 1.5)
      .attr("d", line);

    const lastVal = data[data.length - 1];
    const firstVal = data[0];
    const trendColor = lastVal >= firstVal ? "#4477AA" : "#EE6677";

    svg.append("circle")
      .attr("cx", x(data.length - 1))
      .attr("cy", y(lastVal))
      .attr("r", 1.5)
      .attr("fill", trendColor);
  }

  // 5. Sorting Logic
  d3.selectAll("th[data-sort]").on("click", function() {
    const key = d3.select(this).attr("data-sort");
    if (currentSort.key === key) {
      currentSort.asc = !currentSort.asc;
    } else {
      currentSort.key = key;
      currentSort.asc = true;
    }
    
    // Sort animation
    const rows = tbody.selectAll("tr");
    rows.transition()
      .duration(150)
      .style("opacity", 0)
      .on("end", () => {
        renderTable();
        tbody.selectAll("tr")
          .style("opacity", 0)
          .transition()
          .duration(150)
          .style("opacity", 1);
      });
  });

  // Initial Render
  renderTable();

</script>
</body>
</html>
