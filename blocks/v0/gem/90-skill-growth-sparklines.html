<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Growth Sparklines</title>
<style>
  :root {
    --bg: #0f111a;
    --surface: #1a1c25;
    --text: #e6e6e6;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --positive: #3fb950;
    --negative: #f85149;
    --border: #30363d;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 900px;
  }
  header {
    margin-bottom: 32px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .description {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
  }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
  }
  thead th {
    background: rgba(48, 54, 61, 0.4);
    padding: 12px 16px;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  thead th:hover {
    background: rgba(48, 54, 61, 0.8);
    color: var(--text);
  }
  thead th.sort-active {
    color: var(--accent);
  }
  thead th::after {
    content: "↕";
    margin-left: 6px;
    opacity: 0.3;
    font-size: 10px;
    display: inline-block;
    vertical-align: middle;
  }
  thead th.sort-asc::after { content: "↑"; opacity: 1; }
  thead th.sort-desc::after { content: "↓"; opacity: 1; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover {
    background: rgba(255, 255, 255, 0.03);
  }
  
  td {
    padding: 10px 16px;
    vertical-align: middle;
  }
  td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .skill-name {
    font-weight: 600;
    color: var(--text);
  }
  .category {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }
  .growth-val {
    font-weight: 500;
  }
  .positive { color: var(--positive); }
  .negative { color: var(--negative); }
  
  svg.sparkline {
    display: block;
    overflow: visible;
  }
  .sparkline path {
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sparkline .area {
    stroke: none;
    opacity: 0.15;
  }
  .sparkline .endpoint {
    stroke-width: 1;
    stroke: var(--surface);
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Skill Growth Analytics</h1>
    <p class="description">Performance and adoption trends across the D3 Power Tools skill ecosystem. Measured over a simulated 12-month period.</p>
  </header>

  <div class="table-wrap">
    <table id="skill-table">
      <thead>
        <tr>
          <th data-key="name">Skill</th>
          <th data-key="category">Category</th>
          <th data-key="current" class="num">Current</th>
          <th data-key="growth" class="num">Growth (YoY)</th>
          <th data-key="trend">Trend</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const skillNames = [
  {name:"annotation", category:"Legibility"},
  {name:"brushing", category:"Patterns"},
  {name:"canvas", category:"Performance"},
  {name:"canvas-accessibility", category:"Legibility"},
  {name:"cartography", category:"Spatial"},
  {name:"color", category:"Legibility"},
  {name:"data-gathering", category:"Prep"},
  {name:"data-table", category:"Legibility"},
  {name:"distributions", category:"Patterns"},
  {name:"edge-bundling", category:"Structure"},
  {name:"force", category:"Structure"},
  {name:"hierarchy-interaction", category:"Structure"},
  {name:"hierarchy-layouts", category:"Structure"},
  {name:"linked-views", category:"Patterns"},
  {name:"motion", category:"Change"},
  {name:"navigation", category:"Performance"},
  {name:"network", category:"Structure"},
  {name:"parallel-coordinates", category:"Patterns"},
  {name:"responsive", category:"Performance"},
  {name:"scales", category:"Legibility"},
  {name:"shape-morphing", category:"Change"},
  {name:"small-multiples", category:"Prep"},
  {name:"sparkcharts", category:"Legibility"},
  {name:"time-series", category:"Change"},
  {name:"visual-texture", category:"Legibility"},
  {name:"webgl", category:"Performance"}
];

// Generate synthetic growth data
const seed = (s) => {
  let t = s % 2147483647;
  if (t <= 0) t += 2147483646;
  return () => (t = (t * 16807) % 2147483647) / 2147483647;
};

const data = skillNames.map((s, i) => {
  const rand = seed(i + 42);
  const base = 20 + rand() * 80;
  const volatility = 0.1 + rand() * 0.2;
  const momentum = (rand() - 0.4) * 0.1;
  
  const history = [base];
  for (let t = 1; t < 12; t++) {
    const prev = history[t-1];
    const change = prev * (momentum + (rand() - 0.5) * volatility);
    history.push(Math.max(1, prev + change));
  }
  
  const current = history[history.length - 1];
  const start = history[0];
  const growth = (current - start) / start;
  
  return {
    ...s,
    history,
    current,
    growth
  };
});

const formatNum = d3.format(".1f");
const formatPct = d3.format("+.1%");

let sortKey = "growth";
let sortOrder = "desc";

const table = d3.select("#skill-table");
const tbody = table.select("tbody");
const headers = table.selectAll("thead th");

function render() {
  const sortedData = [...data].sort((a, b) => {
    let va = a[sortKey];
    let vb = b[sortKey];
    if (typeof va === "string") {
      return sortOrder === "asc" ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return sortOrder === "asc" ? va - vb : vb - va;
  });

  headers.classed("sort-active", d => d3.select(event?.target).attr("data-key") === sortKey)
         .attr("class", function() {
           const key = d3.select(this).attr("data-key");
           let cls = d3.select(this).attr("class")?.split(" ")[0] || "";
           if (key === sortKey) {
             cls += " sort-active " + (sortOrder === "asc" ? "sort-asc" : "sort-desc");
           }
           return cls;
         });

  const rows = tbody.selectAll("tr")
    .data(sortedData, d => d.name)
    .join("tr");

  rows.each(function(d) {
    const row = d3.select(this);
    row.selectAll("td").remove();
    
    row.append("td").append("div").attr("class", "skill-name").text(d.name);
    row.append("td").append("div").attr("class", "category").text(d.category);
    row.append("td").attr("class", "num").text(formatNum(d.current));
    
    const growthTd = row.append("td").attr("class", "num growth-val");
    growthTd.text(formatPct(d.growth))
      .classed("positive", d.growth > 0)
      .classed("negative", d.growth < 0);
      
    const trendTd = row.append("td");
    const svg = trendTd.append("svg")
      .attr("class", "sparkline")
      .attr("width", 100)
      .attr("height", 24);
      
    drawSparkline(svg, d.history, d.growth >= 0 ? "var(--positive)" : "var(--negative)");
  });
}

function drawSparkline(svg, history, color) {
  const w = 100, h = 24;
  const x = d3.scaleLinear().domain([0, history.length - 1]).range([2, w - 2]);
  const y = d3.scaleLinear().domain(d3.extent(history)).range([h - 4, 4]);
  
  const line = d3.line()
    .x((_, i) => x(i))
    .y(d => y(d))
    .curve(d3.curveMonotoneX);
    
  const area = d3.area()
    .x((_, i) => x(i))
    .y0(h)
    .y1(d => y(d))
    .curve(d3.curveMonotoneX);
    
  svg.append("path")
    .datum(history)
    .attr("class", "area")
    .attr("d", area)
    .attr("fill", color);
    
  svg.append("path")
    .datum(history)
    .attr("d", line)
    .attr("stroke", color);
    
  svg.append("circle")
    .attr("class", "endpoint")
    .attr("cx", x(history.length - 1))
    .attr("cy", y(history[history.length - 1]))
    .attr("r", 2.5)
    .attr("fill", color);
}

headers.on("click", function() {
  const key = d3.select(this).attr("data-key");
  if (sortKey === key) {
    sortOrder = sortOrder === "asc" ? "desc" : "asc";
  } else {
    sortKey = key;
    sortOrder = "desc";
  }
  render();
});

render();

</script>
</body>
</html>
