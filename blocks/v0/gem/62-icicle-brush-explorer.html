<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icicle Brush Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #222;
            --muted-color: #666;
            --border-color: #ddd;
            --highlight-color: #4477AA;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        #container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        #badge {
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        #breadcrumb {
            display: flex;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--muted-color);
            height: 24px;
            align-items: center;
        }

        .crumb {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .crumb:hover {
            background: #eee;
            color: var(--text-color);
        }

        .crumb::after {
            content: "/";
            margin-left: 8px;
            pointer-events: none;
        }

        .crumb:last-child::after {
            content: "";
        }

        .viz-panel {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        #icicle-container {
            height: 350px;
        }

        #histogram-container {
            height: 180px;
        }

        .cell {
            cursor: pointer;
            stroke: #fff;
            stroke-width: 0.5px;
            transition: opacity 0.3s;
        }

        .cell text {
            font-size: 11px;
            fill: #fff;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .bar {
            fill: #ccc;
            transition: fill 0.2s;
        }

        .bar.active {
            fill: var(--highlight-color);
        }

        .axis-label {
            font-size: 10px;
            fill: var(--muted-color);
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 250px;
            word-wrap: break-word;
        }

        .tooltip b {
            display: block;
            margin-bottom: 4px;
            border-bottom: 1px solid #555;
            padding-bottom: 2px;
        }

        .brush .selection {
            fill: var(--highlight-color);
            fill-opacity: 0.2;
            stroke: var(--highlight-color);
        }

        /* Touch targets */
        .cell {
            min-height: 44px;
        }
    </style>
</head>
<body>

<div id="container">
    <header>
        <h1>File System Explorer</h1>
        <div id="badge">Showing all files</div>
    </header>

    <div id="breadcrumb"></div>

    <div id="icicle-container" class="viz-panel"></div>

    <div id="histogram-container" class="viz-panel"></div>
</div>

<div id="tooltip" class="tooltip"></div>

<script>
    // Configuration & Data Generation
    const width = document.getElementById('container').clientWidth;
    const icicleHeight = 350;
    const histHeight = 180;
    const colors = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377"];
    const types = ["js", "ts", "md", "json", "png", "css", "html"];

    function generateData() {
        const root = { name: "root", children: [] };
        let leafId = 0;
        for (let i = 0; i < 6; i++) {
            const dir = { name: `project_${i + 1}`, children: [], color: colors[i] };
            root.children.push(dir);
            const subCount = Math.floor(Math.random() * 6) + 3; // 3-8
            for (let j = 0; j < subCount; j++) {
                const subdir = { name: `module_${i + 1}_${j + 1}`, children: [] };
                dir.children.push(subdir);
                const fileCount = Math.floor(Math.random() * 16) + 5; // 5-20
                for (let k = 0; k < fileCount; k++) {
                    const type = types[Math.floor(Math.random() * types.length)];
                    // Size 100B to 50MB log-distributed
                    const size = Math.pow(10, 2 + Math.random() * 5.7); 
                    subdir.children.push({
                        id: leafId++,
                        name: `index_${k}.${type}`,
                        path: `root/project_${i+1}/module_${i+1}_${j+1}/file_${k}.${type}`,
                        size: size,
                        type: type
                    });
                }
            }
        }
        return root;
    }

    const formatSize = d3.format(".2s");
    const data = generateData();
    let root = d3.hierarchy(data)
        .sum(d => d.size)
        .sort((a, b) => b.value - a.value);

    let currentFocus = root;
    let currentSelection = null; // [minSize, maxSize]

    // Scales & Layouts
    const partition = d3.partition().size([width, icicleHeight]);
    partition(root);

    const icicleSvg = d3.select("#icicle-container").append("svg")
        .attr("width", width)
        .attr("height", icicleHeight);

    const histSvg = d3.select("#histogram-container").append("svg")
        .attr("width", width)
        .attr("height", histHeight);

    const xHist = d3.scaleLog()
        .domain([100, 50e6])
        .range([40, width - 20]);

    const yHist = d3.scaleLinear()
        .range([histHeight - 30, 20]);

    const tooltip = d3.select("#tooltip");

    // Icicle Chart Elements
    let cells = icicleSvg.selectAll(".cell-group")
        .data(root.descendants())
        .join("g")
        .attr("class", "cell-group")
        .attr("transform", d => `translate(${d.x0},${d.y0})`);

    const rects = cells.append("rect")
        .attr("class", "cell")
        .attr("width", d => d.x1 - d.x0)
        .attr("height", d => d.y1 - d.y0)
        .attr("fill", d => {
            if (d.depth === 0) return "#ccc";
            return d.ancestors().reverse()[1].data.color;
        })
        .on("mouseover", showTooltip)
        .on("mousemove", moveTooltip)
        .on("mouseout", hideTooltip)
        .on("click", (e, d) => d.children ? zoom(d) : null);

    const labels = cells.append("text")
        .attr("x", 5)
        .attr("y", 20)
        .text(d => d.data.name)
        .attr("opacity", d => (d.x1 - d.x0 > 60) ? 1 : 0);

    // Histogram Elements
    const histG = histSvg.append("g");
    const brush = d3.brushX()
        .extent([[40, 20], [width - 20, histHeight - 30]])
        .on("brush end", brushed);

    histSvg.append("g")
        .attr("class", "brush")
        .call(brush);

    histSvg.append("g")
        .attr("transform", `translate(0, ${histHeight - 30})`)
        .call(d3.axisBottom(xHist).ticks(10, ".0s"))
        .attr("class", "axis-label");

    // Initialization
    updateHistogram();
    updateBreadcrumbs();

    function updateHistogram() {
        const leaves = currentFocus.leaves();
        const binGenerator = d3.bin()
            .domain(xHist.domain())
            .thresholds(xHist.ticks(25))
            .value(d => d.data.size);

        const bins = binGenerator(leaves);
        yHist.domain([0, d3.max(bins, d => d.length)]);

        histG.selectAll(".bar")
            .data(bins)
            .join("rect")
            .attr("class", "bar")
            .attr("x", d => xHist(d.x0) + 1)
            .attr("width", d => Math.max(0, xHist(d.x1) - xHist(d.x0) - 1))
            .attr("y", d => yHist(d.length))
            .attr("height", d => yHist(0) - yHist(d.length));
        
        applyHighlight();
    }

    function brushed(event) {
        if (!event.selection) {
            currentSelection = null;
        } else {
            currentSelection = event.selection.map(xHist.invert);
        }
        applyHighlight();
    }

    function applyHighlight() {
        let matchedCount = 0;
        const leaves = currentFocus.leaves();

        // 1. Identify matching leaves
        leaves.forEach(d => {
            d.matched = currentSelection ? (d.data.size >= currentSelection[0] && d.data.size <= currentSelection[1]) : true;
            if (d.matched) matchedCount++;
        });

        // 2. Propagate to parents
        root.each(d => {
            if (d.children) {
                d.matched = d.leaves().some(l => l.matched && isDescendant(l, currentFocus));
            }
        });

        // 3. Update Visuals
        rects.transition().duration(200)
            .style("opacity", d => d.matched ? 1 : 0.15);
        
        histG.selectAll(".bar")
            .classed("active", d => {
                if (!currentSelection) return false;
                const binMid = (d.x0 + d.x1) / 2;
                return binMid >= currentSelection[0] && binMid <= currentSelection[1];
            });

        const total = leaves.length;
        d3.select("#badge").text(currentSelection ? `Matched ${matchedCount} of ${total} files` : `Showing all ${total} files`);
    }

    function isDescendant(child, parent) {
        let node = child;
        while (node) {
            if (node === parent) return true;
            node = node.parent;
        }
        return false;
    }

    function zoom(d) {
        currentFocus = d;
        const t = icicleSvg.transition().duration(750);

        // Rescale x and y domains
        const x = d3.scaleLinear().domain([d.x0, d.x1]).range([0, width]);
        const y = d3.scaleLinear().domain([d.y0, icicleHeight]).range([0, icicleHeight]);

        cells.transition(t)
            .attr("transform", d => `translate(${x(d.x0)},${y(d.y0)})`);

        rects.transition(t)
            .attr("width", d => x(d.x1) - x(d.x0))
            .attr("height", d => y(d.y1) - y(d.y0));

        labels.transition(t)
            .attr("opacity", d => (x(d.x1) - x(d.x0) > 60 && y(d.y1) - y(d.y0) > 15) ? 1 : 0);

        // Show/hide nodes outside current view
        cells.transition(t)
            .style("visibility", n => isDescendant(n, d) ? "visible" : "hidden");

        updateHistogram();
        updateBreadcrumbs();
    }

    function updateBreadcrumbs() {
        const ancestors = currentFocus.ancestors().reverse();
        d3.select("#breadcrumb").selectAll(".crumb")
            .data(ancestors)
            .join("span")
            .attr("class", "crumb")
            .text(d => d.data.name)
            .on("click", (e, d) => zoom(d));
    }

    // Tooltip Logic
    function showTooltip(event, d) {
        tooltip.style("opacity", 1);
        if (d.data.children) {
            tooltip.html(`<b>${d.data.name}</b>Items: ${d.children.length}<br>Total size: ${formatSize(d.value)}B`);
        } else {
            tooltip.html(`<b>${d.data.name}</b>Path: ${d.data.path}<br>Type: ${d.data.type.toUpperCase()}<br>Size: ${formatSize(d.data.size)}B`);
        }
    }

    function moveTooltip(event) {
        tooltip
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 10) + "px");
    }

    function hideTooltip() {
        tooltip.style("opacity", 0);
    }

    // Handle Resize
    window.addEventListener('resize', () => {
        const newWidth = document.getElementById('container').clientWidth;
        icicleSvg.attr("width", newWidth);
        histSvg.attr("width", newWidth);
        xHist.range([40, newWidth - 20]);
        // Ideally we would re-run partition and update all nodes, but for this 
        // demonstration we'll stick to initial width for internal coordinates.
    });

</script>

</body>
</html>
