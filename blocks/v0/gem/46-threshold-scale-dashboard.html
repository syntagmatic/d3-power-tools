<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Threshold Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --border: #e0e0e0;
            --row-alt: #f8f9fa;
            --green: #228833;
            --yellow: #CCBB44;
            --red: #EE6677;
            --gray: #bbbbbb;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            color: var(--text);
            background: var(--bg);
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }

        .dashboard {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .summary {
            font-weight: 600;
        }

        .summary span {
            margin-right: 16px;
            display: inline-flex;
            align-items: center;
        }

        .summary .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .controls {
            display: flex;
            gap: 24px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            font-weight: 600;
        }

        .table-container {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg);
        }

        /* Div-based Table for better animations */
        .table {
            display: grid;
            grid-template-columns: 1fr 60px 80px 100px 80px 80px;
            width: 100%;
            font-variant-numeric: tabular-nums;
        }

        .thead {
            display: contents;
        }

        .th {
            background: var(--bg);
            padding: 12px;
            font-weight: 600;
            border-bottom: 2px solid var(--border);
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
        }

        .th:hover {
            background: var(--row-alt);
        }

        .th .sort-icon {
            display: inline-block;
            width: 12px;
            margin-left: 4px;
            color: var(--gray);
            font-size: 14px;
        }

        .th.active .sort-icon {
            color: var(--text);
        }

        .tbody {
            display: block;
            position: relative;
            height: 740px; /* 20 rows * 37px */
        }

        .tr {
            display: grid;
            grid-template-columns: 1fr 60px 80px 100px 80px 80px;
            position: absolute;
            left: 0;
            right: 0;
            height: 37px;
            border-bottom: 1px solid var(--border);
            transition: transform 300ms, background-color 200ms;
            background: var(--bg);
        }

        .tr:hover {
            background-color: #f0f4f8;
            z-index: 5;
        }

        .tr:nth-child(even) {
            background-color: var(--row-alt);
        }
        .tr:nth-child(even):hover {
            background-color: #f0f4f8;
        }

        .td {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }

        .td.num {
            justify-content: flex-end;
            text-align: right;
        }

        .server-name {
            font-family: var(--font-mono);
            font-weight: 500;
            color: #334155;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: background-color 300ms;
        }

        .uptime-val {
            font-weight: 600;
            transition: color 300ms;
        }

        input[type="range"] {
            width: 120px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <div class="summary" id="summary"></div>
        <div class="controls">
            <div class="control-group">
                <label>Warning: <span id="warn-val">70</span>%</label>
                <input type="range" id="warn-slider" min="50" max="90" value="70">
            </div>
            <div class="control-group">
                <label>Critical: <span id="crit-val">85</span>%</label>
                <input type="range" id="crit-slider" min="60" max="95" value="85">
            </div>
        </div>
    </header>

    <div class="table-container">
        <div class="table">
            <div class="thead">
                <div class="th" data-key="server_name">Server <span class="sort-icon"></span></div>
                <div class="th" data-key="status">Status <span class="sort-icon"></span></div>
                <div class="th" data-key="cpu_latest">CPU <span class="sort-icon"></span></div>
                <div class="th" data-key="mem_pct">Memory <span class="sort-icon"></span></div>
                <div class="th num" data-key="uptime_pct">Uptime <span class="sort-icon"></span></div>
                <div class="th num" data-key="request_rate">Req/s <span class="sort-icon"></span></div>
            </div>
            <div class="tbody" id="tbody"></div>
        </div>
    </div>
</div>

<script>
    // 1. Data Generation
    const N = 20;
    const servers = d3.range(N).map(i => {
        const cpuHistory = d3.range(30).map(() => 20 + Math.random() * 75);
        const memLimit = 16 + (i % 4) * 16; 
        const memUsed = (0.2 + Math.random() * 0.75) * memLimit;
        return {
            id: i,
            server_name: `srv-${String(i + 1).padStart(2, '0')}.prod.cluster`,
            cpu_history: cpuHistory,
            cpu_latest: cpuHistory[cpuHistory.length - 1],
            mem_used: memUsed,
            mem_limit: memLimit,
            mem_pct: (memUsed / memLimit) * 100,
            uptime_pct: 98 + Math.random() * 1.99,
            request_rate: 100 + Math.random() * 4900
        };
    });

    // 2. State
    let warnThreshold = 70;
    let critThreshold = 85;
    let sortKey = 'status';
    let sortDirection = -1; // -1 for DESC (Red first)

    const colors = { green: "#228833", yellow: "#CCBB44", red: "#EE6677", gray: "#bbbbbb" };

    function getStatus(val) {
        if (val >= critThreshold) return 'critical';
        if (val >= warnThreshold) return 'warning';
        return 'healthy';
    }

    function getColor(val) {
        const s = getStatus(val);
        return s === 'critical' ? colors.red : (s === 'warning' ? colors.yellow : colors.green);
    }

    function getUptimeStress(d) {
        return (100 - d.uptime_pct) * 20; // 99% -> 20 stress, 95% -> 100 stress
    }

    function getStatusSortValue(d) {
        const s = getStatus(d.cpu_latest);
        return s === 'critical' ? 3 : (s === 'warning' ? 2 : 1);
    }

    function renderSummary() {
        const counts = { critical: 0, warning: 0, healthy: 0 };
        servers.forEach(d => counts[getStatus(d.cpu_latest)]++);
        d3.select("#summary").html(`
            <span><div class="dot" style="background:${colors.red}"></div> ${counts.critical} critical</span>
            <span><div class="dot" style="background:${colors.yellow}"></div> ${counts.warning} warning</span>
            <span><div class="dot" style="background:${colors.green}"></div> ${counts.healthy} healthy</span>
        `);
    }

    function initTable() {
        const tbody = d3.select("#tbody");
        const rows = tbody.selectAll(".tr")
            .data(servers, d => d.id)
            .join("div")
            .attr("class", "tr")
            .style("transform", (d, i) => `translateY(${i * 37}px)`);

        rows.each(function(d) {
            const row = d3.select(this);
            row.append("div").attr("class", "td").append("span").attr("class", "server-name").text(d.server_name);
            row.append("div").attr("class", "td").append("div").attr("class", "status-dot").style("background-color", getColor(d.cpu_latest));
            
            const cpuTd = row.append("div").attr("class", "td");
            renderSparkline(cpuTd, d.cpu_history);

            const memTd = row.append("div").attr("class", "td");
            renderBullet(memTd, d.mem_used, d.mem_limit);

            row.append("div").attr("class", "td num").append("span").attr("class", "uptime-val")
                .style("color", getColor(getUptimeStress(d)))
                .text(d.uptime_pct.toFixed(2) + "%");

            row.append("div").attr("class", "td num").text(d3.format(",.0f")(d.request_rate));
        });
        
        updateSort();
    }

    function updateSort() {
        const sorted = [...servers].sort((a, b) => {
            let vA, vB;
            if (sortKey === 'status') {
                vA = getStatusSortValue(a); vB = getStatusSortValue(b);
            } else {
                vA = a[sortKey]; vB = b[sortKey];
            }
            if (vA === vB) return a.id - b.id;
            return (vA < vB ? -1 : 1) * sortDirection;
        });

        const idToIndex = new Map(sorted.map((d, i) => [d.id, i]));

        d3.selectAll(".tr")
            .transition().duration(300)
            .style("transform", d => `translateY(${idToIndex.get(d.id) * 37}px)`);

        d3.selectAll(".th").each(function() {
            const th = d3.select(this);
            const key = th.attr("data-key");
            const icon = th.select(".sort-icon");
            if (key === sortKey) {
                th.classed("active", true);
                icon.text(sortDirection === -1 ? "↓" : "↑");
            } else {
                th.classed("active", false);
                icon.text("");
            }
        });
        renderSummary();
    }

    function renderSparkline(container, data) {
        const w = 60, h = 18;
        const svg = container.append("svg").attr("width", w).attr("height", h);
        const x = d3.scaleLinear().domain([0, data.length - 1]).range([0, w]);
        const y = d3.scaleLinear().domain([0, 100]).range([h, 0]);
        const area = d3.area().x((_, i) => x(i)).y0(h).y1(d => y(d)).curve(d3.curveMonotoneX);
        const line = d3.line().x((_, i) => x(i)).y(d => y(d)).curve(d3.curveMonotoneX);
        svg.append("path").datum(data).attr("fill", "#64748b").attr("opacity", 0.15).attr("d", area);
        svg.append("path").datum(data).attr("fill", "none").attr("stroke", "#64748b").attr("stroke-width", 1.2).attr("d", line);
    }

    function renderBullet(container, used, limit) {
        const w = 80, h = 10;
        const pct = (used / limit) * 100;
        const svg = container.append("svg").attr("width", w).attr("height", h).style("display", "block");
        const x = d3.scaleLinear().domain([0, 100]).range([0, w]);
        svg.append("rect").attr("width", w).attr("height", h).attr("fill", "#e2e8f0").attr("rx", 2);
        svg.append("rect").attr("class", "bullet-fill").attr("width", x(pct)).attr("height", h).attr("fill", getColor(pct)).attr("rx", 2);
        svg.append("line").attr("x1", x(75)).attr("x2", x(75)).attr("y1", 0).attr("y2", h).attr("stroke", "#1e293b").attr("stroke-width", 1.5);
    }

    function updateIndicators() {
        d3.selectAll(".status-dot").transition().duration(300).style("background-color", d => getColor(d.cpu_latest));
        d3.selectAll(".bullet-fill").transition().duration(300).style("fill", d => getColor(d.mem_pct));
        d3.selectAll(".uptime-val").transition().duration(300).style("color", d => getColor(getUptimeStress(d)));
        updateSort(); // Re-sort if status changed
    }

    // Sliders
    d3.select("#warn-slider").on("input", function() {
        warnThreshold = +this.value;
        d3.select("#warn-val").text(warnThreshold);
        if (+d3.select("#crit-slider").property("value") < warnThreshold) {
            critThreshold = warnThreshold;
            d3.select("#crit-slider").property("value", warnThreshold);
            d3.select("#crit-val").text(warnThreshold);
        }
        updateIndicators();
    });

    d3.select("#crit-slider").on("input", function() {
        critThreshold = +this.value;
        d3.select("#crit-val").text(critThreshold);
        if (+d3.select("#warn-slider").property("value") > critThreshold) {
            warnThreshold = critThreshold;
            d3.select("#warn-slider").property("value", critThreshold);
            d3.select("#warn-val").text(critThreshold);
        }
        updateIndicators();
    });

    // Sort
    d3.selectAll(".th").on("click", function() {
        const key = d3.select(this).attr("data-key");
        if (sortKey === key) { sortDirection *= -1; } 
        else { sortKey = key; sortDirection = -1; }
        updateSort();
    });

    initTable();
</script>
</body>
</html>
