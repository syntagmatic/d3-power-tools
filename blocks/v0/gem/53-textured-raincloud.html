<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raincloud Plots — Dual Encoding for Accessibility</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg: #fff;
            --text: #333;
            --muted: #666;
            --border: #ddd;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 700px;
            position: relative;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            text-align: center;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button.active {
            background: #4477AA;
            color: white;
            border-color: #335588;
        }
        .annotation {
            font-size: 13px;
            font-style: italic;
            color: var(--muted);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .annotation.visible {
            opacity: 1;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .swatch {
            width: 24px;
            height: 16px;
            border: 1px solid #999;
        }
        .axis-label {
            font-size: 12px;
            fill: var(--muted);
        }
        .group-label {
            font-size: 13px;
            font-weight: 600;
            text-anchor: end;
        }
        /* Filter application */
        .cvd-active svg {
            filter: url(#deuteranopia);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Raincloud Plots — Dual Encoding for Accessibility</h1>
    
    <div class="controls">
        <button id="toggleCVD">Simulate Deuteranopia</button>
        <span class="annotation" id="cvdNote">Patterns remain distinguishable without color</span>
    </div>

    <div id="chart"></div>
    <div id="legend" class="legend"></div>
</div>

<script>
    const width = 700;
    const height = 600;
    const margin = {top: 40, right: 30, bottom: 50, left: 60};
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    // 1. Data Generation
    const n = 80;
    const random = d3.randomLcg(42);
    const groups = [
        {id: 'A', name: 'Group A: Normal(50,8)', data: d3.range(n).map(() => d3.randomNormal.source(random)(50, 8)())},
        {id: 'B', name: 'Group B: Normal(62,10)', data: d3.range(n).map(() => d3.randomNormal.source(random)(62, 10)())},
        {id: 'C', name: 'Group C: Bimodal', data: d3.range(n).map(() => random() < 0.5 ? d3.randomNormal.source(random)(40, 4)() : d3.randomNormal.source(random)(75, 4)())},
        {id: 'D', name: 'Group D: Right-Skewed', data: d3.range(n).map(() => 30 + d3.randomLogNormal.source(random)(2.8, 0.4)())},
        {id: 'E', name: 'Group E: Normal(70,6)', data: d3.range(n).map(() => d3.randomNormal.source(random)(70, 6)())},
        {id: 'F', name: 'Group F: Uniform(30,75)', data: d3.range(n).map(() => d3.randomUniform.source(random)(30, 75)())}
    ];

    // Colors: Tol Bright
    const colors = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377"];
    const patterns = [
        {id: 'p-hatch', type: 'hatch'},
        {id: 'p-dots', type: 'dots'},
        {id: 'p-cross', type: 'cross'},
        {id: 'p-horiz', type: 'horiz'},
        {id: 'p-waves', type: 'waves'},
        {id: 'p-vert', type: 'vert'}
    ];

    // 2. Setup SVG
    const svg = d3.select("#chart").append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    const defs = d3.select("svg").append("defs");

    // Add CVD Filter
    defs.append("filter")
        .attr("id", "deuteranopia")
        .append("feColorMatrix")
        .attr("type", "matrix")
        .attr("values", "0.625 0.375 0 0 0 0.7 0.3 0 0 0 0 0.3 0.7 0 0 0 0 0 1 0");

    // Add Patterns
    function createPatterns() {
        const size = 8;
        const stroke = "rgba(0,0,0,0.25)";
        const strokeWidth = 1.2;

        // A: Diagonal Hatch
        const p1 = defs.append("pattern")
            .attr("id", "p-hatch")
            .attr("width", size)
            .attr("height", size)
            .attr("patternUnits", "userSpaceOnUse")
            .attr("patternTransform", "rotate(45)");
        p1.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size).attr("stroke", stroke).attr("stroke-width", strokeWidth);

        // B: Dots
        const p2 = defs.append("pattern")
            .attr("id", "p-dots")
            .attr("width", size)
            .attr("height", size)
            .attr("patternUnits", "userSpaceOnUse");
        p2.append("circle").attr("cx", size/2).attr("cy", size/2).attr("r", 1.5).attr("fill", stroke);

        // C: Crosshatch
        const p3 = defs.append("pattern")
            .attr("id", "p-cross")
            .attr("width", size)
            .attr("height", size)
            .attr("patternUnits", "userSpaceOnUse");
        p3.append("line").attr("x1", 0).attr("y1", size/2).attr("x2", size).attr("y2", size/2).attr("stroke", stroke).attr("stroke-width", strokeWidth);
        p3.append("line").attr("x1", size/2).attr("y1", 0).attr("x2", size/2).attr("y2", size).attr("stroke", stroke).attr("stroke-width", strokeWidth);

        // D: Horizontal
        const p4 = defs.append("pattern")
            .attr("id", "p-horiz")
            .attr("width", size)
            .attr("height", size)
            .attr("patternUnits", "userSpaceOnUse");
        p4.append("line").attr("x1", 0).attr("y1", size/2).attr("x2", size).attr("y2", size/2).attr("stroke", stroke).attr("stroke-width", strokeWidth);

        // E: Waves
        const p5 = defs.append("pattern")
            .attr("id", "p-waves")
            .attr("width", size)
            .attr("height", size)
            .attr("patternUnits", "userSpaceOnUse");
        p5.append("path")
            .attr("d", `M 0 ${size/2} Q ${size/4} 0, ${size/2} ${size/2} T ${size} ${size/2}`)
            .attr("fill", "none")
            .attr("stroke", stroke)
            .attr("stroke-width", strokeWidth);

        // F: Vertical
        const p6 = defs.append("pattern")
            .attr("id", "p-vert")
            .attr("width", size)
            .attr("height", size)
            .attr("patternUnits", "userSpaceOnUse");
        p6.append("line").attr("x1", size/2).attr("y1", 0).attr("x2", size/2).attr("y2", size).attr("stroke", stroke).attr("stroke-width", strokeWidth);
    }
    createPatterns();

    // 3. Scales
    const x = d3.scaleLinear()
        .domain([0, 100])
        .range([0, innerWidth]);

    const y = d3.scaleBand()
        .domain(groups.map(g => g.id))
        .range([0, innerHeight])
        .paddingInner(0.1);

    // 4. KDE Helper
    function kernelGaussian(v) {
        return Math.exp(-v * v / 2) / Math.sqrt(2 * Math.PI);
    }

    function kde(kernel, thresholds, data) {
        // Silverman's rule for bandwidth
        const std = d3.deviation(data);
        const iqr = d3.quantile(data, 0.75) - d3.quantile(data, 0.25);
        const bandwidth = 0.9 * Math.min(std, iqr / 1.34) * Math.pow(data.length, -0.2);
        
        return thresholds.map(t => [t, d3.mean(data, d => kernel((t - d) / bandwidth)) / bandwidth]);
    }

    // 5. Build Components
    groups.forEach((g, i) => {
        const groupG = svg.append("g")
            .attr("class", `group group-${g.id}`)
            .attr("transform", `translate(0, ${y(g.id)})`);

        const color = colors[i];
        const patternId = patterns[i].id;
        const data = g.data.sort((a, b) => a - b);
        const bw = y.bandwidth();

        // --- Raincloud: HALF-VIOLIN (KDE) ---
        const thresholds = x.ticks(100);
        const density = kde(kernelGaussian, thresholds, data);
        const maxDensity = d3.max(density, d => d[1]);
        
        // Scale for violin height (goes UP from baseline)
        const vScale = d3.scaleLinear()
            .domain([0, maxDensity])
            .range([0, bw * 0.45]);

        const area = d3.area()
            .curve(d3.curveBasis)
            .x(d => x(d[0]))
            .y0(bw * 0.45) // baseline
            .y1(d => bw * 0.45 - vScale(d[1]));

        // Background Color Fill
        groupG.append("path")
            .datum(density)
            .attr("d", area)
            .attr("fill", color);

        // Pattern Overlay
        groupG.append("path")
            .datum(density)
            .attr("d", area)
            .attr("fill", `url(#${patternId})`);

        // --- BOX PLOT ---
        const q1 = d3.quantile(data, 0.25);
        const median = d3.quantile(data, 0.5);
        const q3 = d3.quantile(data, 0.75);
        const iqr = q3 - q1;
        const lowFence = q1 - 1.5 * iqr;
        const highFence = q3 + 1.5 * iqr;
        const whiskerLow = d3.min(data.filter(d => d >= lowFence));
        const whiskerHigh = d3.max(data.filter(d => d <= highFence));
        const outliers = data.filter(d => d < lowFence || d > highFence);

        const boxCenter = bw * 0.6;
        const boxHeight = 12;

        // Whiskers
        groupG.append("line")
            .attr("x1", x(whiskerLow))
            .attr("x2", x(whiskerHigh))
            .attr("y1", boxCenter)
            .attr("y2", boxCenter)
            .attr("stroke", "#333")
            .attr("stroke-width", 1);

        // Box
        groupG.append("rect")
            .attr("x", x(q1))
            .attr("y", boxCenter - boxHeight/2)
            .attr("width", x(q3) - x(q1))
            .attr("height", boxHeight)
            .attr("fill", "#fff")
            .attr("stroke", "#333")
            .attr("stroke-width", 1);

        // Median Line
        groupG.append("line")
            .attr("x1", x(median))
            .attr("x2", x(median))
            .attr("y1", boxCenter - boxHeight/2)
            .attr("y2", boxCenter + boxHeight/2)
            .attr("stroke", "#000")
            .attr("stroke-width", 2.5);

        // Outliers
        groupG.append("g")
            .selectAll("circle")
            .data(outliers)
            .join("circle")
            .attr("cx", d => x(d))
            .attr("cy", boxCenter)
            .attr("r", 2.5)
            .attr("fill", color)
            .attr("stroke", "#333")
            .attr("stroke-width", 0.5);

        // --- JITTERED STRIP ---
        const stripBase = bw * 0.85;
        const jitterRandom = d3.randomLcg(i + 42);

        groupG.append("g")
            .selectAll("circle")
            .data(data)
            .join("circle")
            .attr("cx", d => x(d))
            .attr("cy", () => stripBase + (jitterRandom() - 0.5) * bw * 0.15)
            .attr("r", 2.5)
            .attr("fill", color)
            .attr("fill-opacity", 0.5);

        // Group Label
        groupG.append("text")
            .attr("class", "group-label")
            .attr("x", -10)
            .attr("y", bw / 2)
            .attr("dy", "0.35em")
            .text(g.id);
    });

    // 6. Axis
    svg.append("g")
        .attr("transform", `translate(0, ${innerHeight})`)
        .call(d3.axisBottom(x));

    svg.append("text")
        .attr("class", "axis-label")
        .attr("text-anchor", "middle")
        .attr("x", innerWidth / 2)
        .attr("y", innerHeight + 40)
        .text("Value");

    // 7. Legend
    const legend = d3.select("#legend");
    groups.forEach((g, i) => {
        const item = legend.append("div").attr("class", "legend-item");
        
        const swatch = item.append("svg")
            .attr("width", 24)
            .attr("height", 16)
            .attr("class", "swatch");
        
        swatch.append("rect")
            .attr("width", 24)
            .attr("height", 16)
            .attr("fill", colors[i]);
            
        swatch.append("rect")
            .attr("width", 24)
            .attr("height", 16)
            .attr("fill", `url(#${patterns[i].id})`);

        item.append("span").text(g.name);
    });

    // 8. CVD Toggle
    const btn = d3.select("#toggleCVD");
    const note = d3.select("#cvdNote");
    btn.on("click", function() {
        const active = d3.select("body").classed("cvd-active");
        d3.select("body").classed("cvd-active", !active);
        btn.classed("active", !active);
        note.classed("visible", !active);
        btn.text(active ? "Simulate Deuteranopia" : "Reset Simulation");
    });

</script>
</body>
</html>
