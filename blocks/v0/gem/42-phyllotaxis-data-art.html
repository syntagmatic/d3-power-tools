<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phyllotaxis Data Art</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 700px;
            height: 700px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.8);
            padding: 15px 25px;
            border-radius: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        input[type=range] {
            width: 100px;
            accent-color: #555;
            margin-top: 5px;
        }

        button {
            background: #333;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
            min-width: 70px;
        }

        button:hover {
            background: #444;
        }

        h1 {
            position: absolute;
            top: 20px;
            margin: 0;
            font-weight: 200;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>Phyllotaxis</h1>

    <div id="container">
        <div id="controls">
            <div class="control-group">
                <label>Dots</label>
                <input type="range" id="dots-slider" min="500" max="3000" value="2000">
            </div>
            <div class="control-group">
                <label>Angle Offset</label>
                <input type="range" id="offset-slider" min="0" max="0.1" step="0.001" value="0.02">
            </div>
            <div class="control-group">
                <label>Speed</label>
                <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1.0">
            </div>
            <button id="play-pause">Pause</button>
        </div>
    </div>

    <script>
        const width = 700;
        const height = 700;
        const centerX = width / 2;
        const centerY = height / 2;
        const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
        const spacing = 6;

        const container = d3.select("#container");
        const canvas = container.append("canvas")
            .attr("width", width)
            .attr("height", height);
        const ctx = canvas.node().getContext("2d");

        // State
        let numDots = 2000;
        let angleOffsetAmplitude = 0.02;
        let speedMultiplier = 1.0;
        let isPaused = false;
        let totalTime = 0;
        let lastTimestamp = 0;

        // Controls
        d3.select("#dots-slider").on("input", function() {
            numDots = +this.value;
        });
        d3.select("#offset-slider").on("input", function() {
            angleOffsetAmplitude = +this.value;
        });
        d3.select("#speed-slider").on("input", function() {
            speedMultiplier = +this.value;
        });
        d3.select("#play-pause").on("click", function() {
            isPaused = !isPaused;
            d3.select(this).text(isPaused ? "Play" : "Pause");
        });

        const rScale = d3.scalePow()
            .exponent(0.5)
            .domain([0, 3000])
            .range([2, 5]);

        function draw(elapsed) {
            if (isPaused) {
                lastTimestamp = elapsed;
                return;
            }

            const dt = (elapsed - (lastTimestamp || elapsed)) * speedMultiplier;
            totalTime += dt;
            lastTimestamp = elapsed;

            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, width, height);

            const currentGoldenAngle = GOLDEN_ANGLE + Math.sin(totalTime / 5000) * angleOffsetAmplitude;
            const globalRotation = totalTime * 0.0001;

            // Draw Glow Pass
            ctx.globalCompositeOperation = "lighter";
            for (let i = 0; i < numDots; i++) {
                const baseAngle = i * currentGoldenAngle;
                const angle = baseAngle + globalRotation;
                const r = Math.sqrt(i) * spacing;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);

                const hue = (baseAngle * 180 / Math.PI) % 360;
                const pulse = Math.sin(totalTime / 1000 + i * 0.01) * 1.5;
                const dotRadius = rScale(i) + pulse;

                ctx.beginPath();
                ctx.arc(x, y, dotRadius * 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 70%, 55%, 0.1)`;
                ctx.fill();
            }

            // Draw Main Pass
            ctx.globalCompositeOperation = "source-over";
            for (let i = 0; i < numDots; i++) {
                const baseAngle = i * currentGoldenAngle;
                const angle = baseAngle + globalRotation;
                const r = Math.sqrt(i) * spacing;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);

                const hue = (baseAngle * 180 / Math.PI) % 360;
                const pulse = Math.sin(totalTime / 1000 + i * 0.01) * 1.5;
                const dotRadius = rScale(i) + pulse;

                ctx.beginPath();
                ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${hue}, 70%, 55%)`;
                ctx.fill();
            }
        }

        d3.timer(draw);

    </script>
</body>
</html>
