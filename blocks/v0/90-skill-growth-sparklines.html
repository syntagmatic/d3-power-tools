<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Dashboard — depth, usage, and growth</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #1a1a1a; line-height: 1.5; }
  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 0.82rem; color: #666; margin-bottom: 24px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead { position: sticky; top: 0; z-index: 2; }
  th {
    background: #f0f0f0; border-bottom: 2px solid #d0d0d0; padding: 8px 10px;
    text-align: left; font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { background: #e4e4e4; }
  th .arrow { font-size: 0.6rem; margin-left: 3px; opacity: 0.4; }
  th.active .arrow { opacity: 1; }
  td { padding: 6px 10px; border-bottom: 1px solid #eaeaea; white-space: nowrap; }
  tr.even { background: #fff; }
  tr.odd { background: #f7f7f7; }
  tr:hover { background: #edf4ff; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .cat-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .spark-cell { padding: 4px 10px; }
  .spark-cell svg { display: block; }
  @media (max-width: 599px) {
    th:first-child, td:first-child { position: sticky; left: 0; background: inherit; z-index: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Skill Dashboard — depth, usage, and growth</h1>
  <p class="subtitle">26 skills: line count, block usage, test coverage, and synthetic growth trajectory</p>
  <div class="table-wrap">
    <table>
      <title>Skill dashboard showing depth, usage, and growth for 26 D3 visualization skills</title>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<script>
(() => {
  const skills = [
    {name:"annotation",lines:406,cat:"Making it legible",blocks:17,tests:4},
    {name:"brushing",lines:735,cat:"Seeing patterns",blocks:14,tests:3},
    {name:"canvas",lines:396,cat:"Making it work",blocks:17,tests:6},
    {name:"canvas-accessibility",lines:341,cat:"Making it legible",blocks:6,tests:3},
    {name:"cartography",lines:575,cat:"Seeing place",blocks:8,tests:4},
    {name:"color",lines:329,cat:"Making it legible",blocks:21,tests:4},
    {name:"data-gathering",lines:177,cat:"Before you render",blocks:4,tests:2},
    {name:"data-table",lines:168,cat:"Making it legible",blocks:11,tests:2},
    {name:"distributions",lines:406,cat:"Seeing patterns",blocks:15,tests:6},
    {name:"edge-bundling",lines:237,cat:"Seeing structure",blocks:6,tests:4},
    {name:"force",lines:286,cat:"Seeing structure",blocks:10,tests:4},
    {name:"hierarchy-interaction",lines:184,cat:"Seeing structure",blocks:7,tests:4},
    {name:"hierarchy-layouts",lines:175,cat:"Seeing structure",blocks:11,tests:4},
    {name:"linked-views",lines:304,cat:"Seeing patterns",blocks:6,tests:3},
    {name:"motion",lines:633,cat:"Seeing change",blocks:17,tests:8},
    {name:"navigation",lines:352,cat:"Making it work",blocks:5,tests:8},
    {name:"network",lines:172,cat:"Seeing structure",blocks:12,tests:4},
    {name:"parallel-coordinates",lines:452,cat:"Seeing patterns",blocks:6,tests:4},
    {name:"responsive",lines:309,cat:"Making it work",blocks:13,tests:3},
    {name:"scales",lines:308,cat:"Making it legible",blocks:12,tests:3},
    {name:"shape-morphing",lines:216,cat:"Seeing change",blocks:5,tests:8},
    {name:"small-multiples",lines:228,cat:"Before you render",blocks:5,tests:2},
    {name:"sparkcharts",lines:340,cat:"Before you render",blocks:7,tests:3},
    {name:"time-series",lines:420,cat:"Seeing change",blocks:12,tests:4},
    {name:"visual-texture",lines:210,cat:"Making it legible",blocks:6,tests:4},
    {name:"webgl",lines:385,cat:"Making it work",blocks:6,tests:3},
  ];

  const catColors = {
    "Seeing patterns": "#4477AA",
    "Seeing structure": "#66CCEE",
    "Seeing place": "#228833",
    "Seeing change": "#CCBB44",
    "Making it legible": "#EE6677",
    "Making it work": "#AA3377",
    "Before you render": "#BBBBBB",
  };

  // Generate synthetic growth data (10 points)
  function makeGrowth(lines) {
    const deep = lines > 400;
    const shallow = lines < 200;
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const t = i / 9;
      let v;
      if (t < 0.3) {
        // initial commit → 40% to ~50%
        v = 0.4 + (t / 0.3) * (deep ? 0.08 : shallow ? 0.12 : 0.1);
      } else if (t < 0.6) {
        // philosophy pass → 50% to 60%
        const u = (t - 0.3) / 0.3;
        const base = deep ? 0.48 : shallow ? 0.52 : 0.5;
        v = base + u * (deep ? 0.1 : shallow ? 0.08 : 0.1);
      } else {
        // research expansion → 60% to 100%
        const u = (t - 0.6) / 0.4;
        const base = deep ? 0.58 : shallow ? 0.6 : 0.6;
        v = base + u * (deep ? 0.42 : shallow ? 0.4 : 0.4);
      }
      // small jitter
      const seed = (lines * 7 + i * 31) % 100;
      v += (seed / 100 - 0.5) * 0.03;
      pts.push(Math.round(v * lines));
    }
    pts[9] = lines; // ensure last = actual
    return pts;
  }

  skills.forEach(s => { s.growth = makeGrowth(s.lines); });

  const columns = [
    {key: "name", label: "Skill", cls: ""},
    {key: "cat", label: "Category", cls: ""},
    {key: "lines", label: "Lines", cls: "num"},
    {key: "blocks", label: "Blocks", cls: "num"},
    {key: "tests", label: "Tests", cls: "num"},
    {key: "growth", label: "Growth", cls: "spark-cell", sortable: true},
  ];

  let sortKey = "lines";
  let sortAsc = false;

  function comparator(key, asc) {
    return (a, b) => {
      let va = a[key], vb = b[key];
      if (key === "growth") { va = a.lines; vb = b.lines; }
      if (typeof va === "string") { va = va.toLowerCase(); vb = vb.toLowerCase(); }
      return asc ? d3.ascending(va, vb) : d3.descending(va, vb);
    };
  }

  // Header
  const thead = d3.select("#thead");
  thead.selectAll("th")
    .data(columns)
    .join("th")
    .attr("class", d => d.cls.includes("num") ? "num" : "")
    .html(d => `${d.label}<span class="arrow">▼</span>`)
    .on("click", (e, d) => {
      if (d.key === sortKey) sortAsc = !sortAsc;
      else { sortKey = d.key; sortAsc = true; }
      thead.selectAll("th").classed("active", (c) => c.key === sortKey);
      render();
    });

  // Sparkline scales
  const maxLines = d3.max(skills, d => d.lines);
  const sparkW = 80, sparkH = 16;

  function sparkline(growth) {
    const y = d3.scaleLinear().domain([0, maxLines]).range([sparkH - 1, 1]);
    const x = d3.scaleLinear().domain([0, 9]).range([1, sparkW - 5]);
    const line = d3.line().x((d, i) => x(i)).y(d => y(d)).curve(d3.curveMonotoneX);
    return { line: line(growth), cx: x(9), cy: y(growth[9]) };
  }

  const tbody = d3.select("#tbody");

  function render() {
    const sorted = skills.slice().sort(comparator(sortKey, sortAsc));

    const rows = tbody.selectAll("tr")
      .data(sorted, d => d.name)
      .join(
        enter => enter.append("tr").style("opacity", 0),
        update => update,
        exit => exit.transition().duration(300).style("opacity", 0).remove()
      )
      .transition().duration(300)
      .style("opacity", 1)
      .selection();

    rows.attr("class", (d, i) => i % 2 === 0 ? "even" : "odd");

    rows.each(function(d) {
      const tr = d3.select(this);
      let cells = tr.selectAll("td").data(columns);
      cells = cells.join("td");

      cells.each(function(col) {
        const td = d3.select(this);
        td.attr("class", col.cls.includes("num") ? "num" : col.cls.includes("spark") ? "spark-cell" : "");

        if (col.key === "name") {
          td.text(d.name);
        } else if (col.key === "cat") {
          td.html(`<span class="cat-dot" style="background:${catColors[d.cat]}"></span>${d.cat}`);
        } else if (col.key === "growth") {
          td.html("");
          const sp = sparkline(d.growth);
          const svg = td.append("svg")
            .attr("width", sparkW).attr("height", sparkH)
            .attr("viewBox", `0 0 ${sparkW} ${sparkH}`);
          svg.append("title").text(`${d.name}: ${d.growth[0]} → ${d.growth[9]} lines`);
          svg.append("path")
            .attr("d", sp.line)
            .attr("fill", "none")
            .attr("stroke", "#888")
            .attr("stroke-width", 1.5);
          svg.append("circle")
            .attr("cx", sp.cx).attr("cy", sp.cy)
            .attr("r", 2)
            .attr("fill", "#228833");
        } else {
          td.text(d[col.key]);
        }
      });
    });
  }

  render();
})();
</script>
</body>
</html>
