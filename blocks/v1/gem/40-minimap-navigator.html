<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimap Navigator | D3 Power Tools</title>
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #1a1d23;
            --primary: #4cc9f0;
            --secondary: #7209b7;
            --text: #e0e0e0;
            --axis: #4a4d52;
            --brush-fill: rgba(76, 201, 240, 0.15);
            --brush-stroke: #4cc9f0;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #888;
        }

        #viz-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .chart-wrapper {
            position: relative;
            background: var(--surface);
            border-radius: 4px;
            overflow: hidden;
        }

        #main-chart {
            flex-grow: 1;
        }

        #minimap {
            height: 80px;
            flex-shrink: 0;
        }

        canvas {
            display: block;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        svg .interaction-layer {
            pointer-events: all;
            fill: none;
        }

        .axis text {
            fill: #888;
            font-size: 10px;
        }

        .axis line, .axis path {
            stroke: var(--axis);
        }

        .brush .selection {
            fill: var(--brush-fill);
            stroke: var(--brush-stroke);
            stroke-width: 1px;
        }

        .brush .handle {
            fill: var(--brush-stroke);
        }

        .stats {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            pointer-events: none;
            color: var(--primary);
        }

        .controls-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 11px;
            color: #666;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Minimap Navigator</h1>
        <p>50,000 points fractal random walk • LTTB downsampling • Semantic zoom</p>
    </div>

    <div id="viz-container">
        <div id="main-chart" class="chart-wrapper">
            <div id="main-stats" class="stats">Points: 50,000</div>
            <div class="controls-hint">Scroll to zoom • Drag to pan</div>
        </div>
        <div id="minimap" class="chart-wrapper">
            <div class="stats" style="top:5px; right:5px;">Minimap (LTTB: 500)</div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        /**
         * Largest Triangle Three Buckets (LTTB) Downsampling
         */
        function lttb(data, threshold) {
            const size = data.length;
            if (threshold >= size || threshold === 0) return data;

            const sampled = [];
            let sampledIndex = 0;

            // Bucket size. Leave room for start and end data points
            const every = (size - 2) / (threshold - 2);

            let a = 0; // Initially a is the first point in the triangle
            let maxAreaPoint, maxArea, area, nextA;

            sampled[sampledIndex++] = data[a]; // Always add the first point

            for (let i = 0; i < threshold - 2; i++) {
                // Calculate point average for next bucket (containing c)
                let avgX = 0, avgY = 0, avgRangeStart = Math.floor((i + 1) * every) + 1;
                let avgRangeEnd = Math.floor((i + 2) * every) + 1;
                avgRangeEnd = avgRangeEnd < size ? avgRangeEnd : size;

                const avgRangeLength = avgRangeEnd - avgRangeStart;

                for (; avgRangeStart < avgRangeEnd; avgRangeStart++) {
                    avgX += data[avgRangeStart].x;
                    avgY += data[avgRangeStart].y;
                }
                avgX /= avgRangeLength;
                avgY /= avgRangeLength;

                // Get the range for this bucket
                let rangeOffs = Math.floor((i + 0) * every) + 1;
                const rangeTo = Math.floor((i + 1) * every) + 1;

                // Point a
                const pointAX = data[a].x;
                const pointAY = data[a].y;

                maxArea = area = -1;

                for (; rangeOffs < rangeTo; rangeOffs++) {
                    // Calculate triangle area over three buckets
                    area = Math.abs((pointAX - avgX) * (data[rangeOffs].y - pointAY) -
                                    (pointAX - data[rangeOffs].x) * (avgY - pointAY)) * 0.5;
                    if (area > maxArea) {
                        maxArea = area;
                        maxAreaPoint = data[rangeOffs];
                        nextA = rangeOffs; // Next a is this b
                    }
                }

                sampled[sampledIndex++] = maxAreaPoint; // Pick this point from the bucket
                a = nextA; // This bucket's char is next bucket's a
            }

            sampled[sampledIndex++] = data[size - 1]; // Always add last

            return sampled;
        }

        /**
         * Fractal Random Walk Generator
         */
        function generateData(n) {
            const data = new Array(n);
            const octaves = 6;
            const persistence = 0.5;
            const lacunarity = 2.0;
            const seeds = Array.from({length: octaves}, () => Math.random() * 100);
            
            let minY = Infinity, maxY = -Infinity;

            for (let i = 0; i < n; i++) {
                let y = 0;
                let amplitude = 1;
                let frequency = 0.0002;
                for (let o = 0; o < octaves; o++) {
                    y += amplitude * (Math.sin(frequency * i + seeds[o]) + 
                                     (Math.random() - 0.5) * 0.2); // Add some local walk noise
                    amplitude *= persistence;
                    frequency *= lacunarity;
                }
                data[i] = { x: i, y: y };
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
            return { data, extent: [minY, maxY] };
        }

        // Configuration
        const N = 50000;
        const MINIMAP_POINTS = 500;
        const margin = { top: 20, right: 30, bottom: 30, left: 50 };
        const miniMargin = { top: 5, right: 30, bottom: 20, left: 50 };

        // State
        const { data, extent } = generateData(N);
        const downsampled = lttb(data, MINIMAP_POINTS);
        
        const mainContainer = d3.select("#main-chart");
        const miniContainer = d3.select("#minimap");

        let width, height, miniWidth, miniHeight;
        let x, y, miniX, miniY;
        let mainCtx, miniCtx;
        let mainSvg, miniSvg;
        let zoom, brush;
        let currentTransform = d3.zoomIdentity;

        function init() {
            // Dimensions
            width = mainContainer.node().clientWidth;
            height = mainContainer.node().clientHeight;
            miniWidth = miniContainer.node().clientWidth;
            miniHeight = miniContainer.node().clientHeight;

            // Scales
            x = d3.scaleLinear().domain([0, N - 1]).range([margin.left, width - margin.right]);
            y = d3.scaleLinear().domain(extent).range([height - margin.bottom, margin.top]).nice();
            
            miniX = d3.scaleLinear().domain([0, N - 1]).range([miniMargin.left, miniWidth - miniMargin.right]);
            miniY = d3.scaleLinear().domain(extent).range([miniHeight - miniMargin.bottom, miniMargin.top]);

            // Canvases
            mainCtx = setupCanvas(mainContainer, width, height);
            miniCtx = setupCanvas(miniContainer, miniWidth, miniHeight);

            // SVGs
            mainSvg = mainContainer.append("svg").attr("width", width).attr("height", height);
            miniSvg = miniContainer.append("svg").attr("width", miniWidth).attr("height", miniHeight);

            // Axes
            mainSvg.append("g").attr("class", "x-axis axis").attr("transform", `translate(0,${height - margin.bottom})`);
            mainSvg.append("g").attr("class", "y-axis axis").attr("transform", `translate(${margin.left},0)`);

            // Zoom
            zoom = d3.zoom()
                .scaleExtent([1, 1000])
                .translateExtent([[margin.left, 0], [width - margin.right, height]])
                .extent([[margin.left, 0], [width - margin.right, height]])
                .on("zoom", zoomed);

            mainSvg.append("rect")
                .attr("class", "interaction-layer")
                .attr("width", width)
                .attr("height", height)
                .call(zoom);

            // Brush
            brush = d3.brushX()
                .extent([[miniMargin.left, 0], [miniWidth - miniMargin.right, miniHeight - miniMargin.bottom]])
                .on("brush end", brushed);

            miniSvg.append("g")
                .attr("class", "brush")
                .call(brush);

            // Initial Draw
            renderMinimap();
            updateCharts();
        }

        function setupCanvas(container, w, h) {
            const dpr = window.devicePixelRatio || 1;
            const canvas = container.append("canvas")
                .attr("width", w * dpr)
                .attr("height", h * dpr)
                .style("width", w + "px")
                .style("height", h + "px")
                .node();
            const ctx = canvas.getContext("2d");
            ctx.scale(dpr, dpr);
            return ctx;
        }

        function renderMinimap() {
            miniCtx.clearRect(0, 0, miniWidth, miniHeight);
            
            // Draw area
            miniCtx.beginPath();
            miniCtx.moveTo(miniX(downsampled[0].x), miniY(extent[0]));
            for (const d of downsampled) {
                miniCtx.lineTo(miniX(d.x), miniY(d.y));
            }
            miniCtx.lineTo(miniX(downsampled[downsampled.length - 1].x), miniY(extent[0]));
            miniCtx.closePath();
            miniCtx.fillStyle = "rgba(76, 201, 240, 0.1)";
            miniCtx.fill();

            // Draw line
            miniCtx.beginPath();
            for (let i = 0; i < downsampled.length; i++) {
                const d = downsampled[i];
                if (i === 0) miniCtx.moveTo(miniX(d.x), miniY(d.y));
                else miniCtx.lineTo(miniX(d.x), miniY(d.y));
            }
            miniCtx.strokeStyle = "rgba(76, 201, 240, 0.5)";
            miniCtx.lineWidth = 1;
            miniCtx.stroke();
        }

        function updateCharts() {
            const tx = currentTransform.rescaleX(x);
            const [x0, x1] = tx.domain();

            // Clear
            mainCtx.clearRect(0, 0, width, height);
            
            // LOD: Find visible points
            // For 50k points, we can bisect or just iterate if the view is wide
            // Using a simple index filter for efficiency
            const i0 = Math.max(0, Math.floor(x0));
            const i1 = Math.min(N - 1, Math.ceil(x1));
            
            // Cull / Downsample for rendering
            // If the range is large, we could downsample on the fly, 
            // but at 50k points, Canvas handles it fine if we just draw lines.
            
            mainCtx.save();
            // Clipping path for main chart area
            mainCtx.beginPath();
            mainCtx.rect(margin.left, margin.top, width - margin.left - margin.right, height - margin.top - margin.bottom);
            mainCtx.clip();

            // Draw line
            mainCtx.beginPath();
            mainCtx.strokeStyle = "var(--primary)";
            mainCtx.lineWidth = Math.max(1, 2 / Math.sqrt(currentTransform.k));
            mainCtx.lineJoin = "round";
            
            let step = 1;
            if (currentTransform.k < 2) step = 10;
            else if (currentTransform.k < 5) step = 5;
            else if (currentTransform.k < 10) step = 2;

            for (let i = i0; i <= i1; i += step) {
                const d = data[i];
                if (i === i0) mainCtx.moveTo(tx(d.x), y(d.y));
                else mainCtx.lineTo(tx(d.x), y(d.y));
            }
            mainCtx.stroke();

            // LOD: Dots at high zoom
            if (currentTransform.k > 50) {
                mainCtx.fillStyle = "var(--primary)";
                const dotRadius = Math.min(4, currentTransform.k / 100);
                for (let i = i0; i <= i1; i++) {
                    const d = data[i];
                    mainCtx.beginPath();
                    mainCtx.arc(tx(d.x), y(d.y), dotRadius, 0, Math.PI * 2);
                    mainCtx.fill();
                }
            }

            mainCtx.restore();

            // Update axes
            mainSvg.select(".x-axis").call(d3.axisBottom(tx).ticks(width / 80).tickSizeOuter(0));
            mainSvg.select(".y-axis").call(d3.axisLeft(y).ticks(height / 50).tickSizeOuter(0));

            // Update stats
            d3.select("#main-stats").text(`Visible Range: ${i0.toLocaleString()} - ${i1.toLocaleString()} (${(i1 - i0).toLocaleString()} pts)`);
        }

        let isSyncing = false;

        function zoomed(event) {
            if (isSyncing) return;
            isSyncing = true;
            
            currentTransform = event.transform;
            updateCharts();

            // Update brush position
            const [x0, x1] = currentTransform.rescaleX(x).domain();
            miniSvg.select(".brush").call(brush.move, [miniX(x0), miniX(x1)]);
            
            isSyncing = false;
        }

        function brushed(event) {
            if (isSyncing || !event.sourceEvent) return;
            isSyncing = true;

            const selection = event.selection;
            if (selection) {
                const [x0, x1] = selection.map(miniX.invert);
                const k = (N - 1) / (x1 - x0);
                const t = d3.zoomIdentity.scale(k).translate(-x(x0), 0);
                
                // We need to adjust the translate to account for the fact that x(0) is at margin.left
                // d3.zoom transform: x' = x * k + tx
                // we want tx s.t. x(x0) * k + tx = margin.left
                const tx = margin.left - x(x0) * k;
                const newTransform = d3.zoomIdentity.translate(tx, 0).scale(k);
                
                mainSvg.select(".interaction-layer").call(zoom.transform, newTransform);
                currentTransform = newTransform;
                updateCharts();
            } else {
                // Reset zoom on double click / clear brush
                mainSvg.select(".interaction-layer").call(zoom.transform, d3.zoomIdentity);
                currentTransform = d3.zoomIdentity;
                updateCharts();
            }

            isSyncing = false;
        }

        // Handle Resize
        window.addEventListener("resize", () => {
            d3.select("canvas").remove();
            d3.selectAll("svg").remove();
            init();
        });

        init();
    </script>
</body>
</html>
