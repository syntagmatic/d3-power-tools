<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Triptych: Force, Bundle, Chord</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .header {
      padding: 2rem 1rem 1rem;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--text-dim);
      font-size: 0.875rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .triptych {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 420px;
      height: 520px;
      position: relative;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: border-color 0.2s;
    }

    .panel:hover {
      border-color: var(--accent);
    }

    .panel-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }

    .viz-container {
      width: 100%;
      height: calc(520px - 50px);
      position: relative;
    }

    svg, canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    .tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .node { cursor: pointer; stroke-width: 1.5px; transition: opacity 0.2s, stroke-width 0.2s; }
    .link { transition: opacity 0.2s, stroke-width 0.2s; }
    .label { font-size: 9px; pointer-events: none; fill: var(--text-dim); }
    
    @media (max-width: 450px) {
      .panel { width: 100%; height: 400px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>Network Archetypes</h1>
    <p>A 40-node network visualized through three lenses. Interact with any element to see its counterparts highlighted across all views.</p>
  </header>

  <main class="triptych">
    <div class="panel" id="force-panel">
      <div class="panel-header"><span class="panel-title">Force Directed</span></div>
      <div class="viz-container"></div>
    </div>
    <div class="panel" id="bundle-panel">
      <div class="panel-header"><span class="panel-title">Radial Bundling</span></div>
      <div class="viz-container"></div>
    </div>
    <div class="panel" id="chord-panel">
      <div class="panel-header"><span class="panel-title">Chord Hierarchical</span></div>
      <div class="viz-container"></div>
    </div>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // Configuration
    const NUM_GROUPS = 5;
    const NODES_PER_GROUP = 8;
    const TOTAL_NODES = NUM_GROUPS * NODES_PER_GROUP;
    const SCHEME = d3.schemeSpectral[NUM_GROUPS];
    
    // Coordination
    const dispatch = d3.dispatch("hoverNode", "hoverGroup", "clear");

    // Tooltip
    const tooltip = d3.select("#tooltip");
    const showTooltip = (event, content) => {
      tooltip.html(content)
        .style("display", "block")
        .style("left", (event.clientX + 15) + "px")
        .style("top", (event.clientY - 15) + "px");
    };
    const hideTooltip = () => tooltip.style("display", "none");

    // Data Generation
    function generateData() {
      const nodes = [];
      const groups = ["Nebula", "Quasar", "Pulsar", "Nova", "Stellar"];
      
      for (let i = 0; i < NUM_GROUPS; i++) {
        for (let j = 0; j < NODES_PER_GROUP; j++) {
          nodes.push({
            id: i * NODES_PER_GROUP + j,
            name: `${groups[i]} ${j + 1}`,
            group: i,
            groupName: groups[i]
          });
        }
      }

      const links = [];
      const rng = d3.randomLcg(123);
      
      // Intra-group links
      nodes.forEach(source => {
        nodes.forEach(target => {
          if (source.id < target.id && source.group === target.group) {
            if (rng() < 0.45) links.push({ source: source.id, target: target.id, value: 1 });
          }
        });
      });

      // Inter-group links (bridging)
      for (let i = 0; i < NUM_GROUPS; i++) {
        const nextGroup = (i + 1) % NUM_GROUPS;
        for (let k = 0; k < 4; k++) {
          const sIdx = i * NODES_PER_GROUP + Math.floor(rng() * NODES_PER_GROUP);
          const tIdx = nextGroup * NODES_PER_GROUP + Math.floor(rng() * NODES_PER_GROUP);
          links.push({ source: sIdx, target: tIdx, value: 0.5 });
        }
      }

      // Add some random long-distance noise
      for (let k = 0; k < 10; k++) {
        const sIdx = Math.floor(rng() * TOTAL_NODES);
        const tIdx = Math.floor(rng() * TOTAL_NODES);
        if (nodes[sIdx].group !== nodes[tIdx].group) {
          links.push({ source: sIdx, target: tIdx, value: 0.3 });
        }
      }

      return { nodes, links, groups };
    }

    const { nodes, links, groups } = generateData();
    const adj = new Array(TOTAL_NODES).fill(0).map(() => new Set());
    links.forEach(l => {
      adj[l.source].add(l.target);
      adj[l.target].add(l.source);
    });

    // --- 1. Force Layout ---
    function initForce() {
      const container = d3.select("#force-panel .viz-container");
      const width = container.node().clientWidth;
      const height = container.node().clientHeight;
      const svg = container.append("svg").attr("viewBox", [0, 0, width, height]);

      const simulation = d3.forceSimulation(nodes.map(d => ({...d})))
        .force("link", d3.forceLink(links.map(d => ({...d}))).id(d => d.id).distance(30).strength(0.5))
        .force("charge", d3.forceManyBody().strength(-80))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("x", d3.forceX(width / 2).strength(0.05))
        .force("y", d3.forceY(height / 2).strength(0.05));

      // Wait for cooling
      for (let i = 0; i < 300; ++i) simulation.tick();

      const link = svg.append("g")
        .attr("stroke", "#475569")
        .attr("stroke-opacity", 0.4)
        .selectAll("line")
        .data(simulation.force("link").links())
        .join("line")
        .attr("stroke-width", d => Math.sqrt(d.value) * 1.5)
        .attr("class", "link");

      const node = svg.append("g")
        .selectAll("circle")
        .data(simulation.nodes())
        .join("circle")
        .attr("r", 6)
        .attr("fill", d => SCHEME[d.group])
        .attr("stroke", "#1e293b")
        .attr("class", "node")
        .on("mouseenter", (event, d) => {
          showTooltip(event, `<strong>${d.name}</strong><br>${d.groupName} Cluster`);
          dispatch.call("hoverNode", null, d.id);
        })
        .on("mousemove", (event) => showTooltip(event, tooltip.html()))
        .on("mouseleave", () => {
          hideTooltip();
          dispatch.call("clear");
        });

      node.attr("cx", d => d.x).attr("cy", d => d.y);
      link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);

      dispatch.on("hoverNode.force", id => {
        node.style("opacity", d => d.id === id || adj[id].has(d.id) ? 1 : 0.15);
        link.style("opacity", d => d.source.id === id || d.target.id === id ? 1 : 0.05)
            .style("stroke", d => d.source.id === id || d.target.id === id ? SCHEME[nodes[id].group] : "#475569");
      });

      dispatch.on("hoverGroup.force", groupIdx => {
        node.style("opacity", d => d.group === groupIdx ? 1 : 0.15);
        link.style("opacity", d => d.source.group === groupIdx || d.target.group === groupIdx ? 0.6 : 0.05);
      });

      dispatch.on("clear.force", () => {
        node.style("opacity", 1);
        link.style("opacity", 0.4).style("stroke", "#475569");
      });
    }

    // --- 2. Radial Bundling ---
    function initBundle() {
      const container = d3.select("#bundle-panel .viz-container");
      const width = container.node().clientWidth;
      const height = container.node().clientHeight;
      const radius = Math.min(width, height) / 2 - 60;

      // Canvas for performance and smooth gradients
      const canvas = container.append("canvas")
        .attr("width", width).attr("height", height);
      const ctx = canvas.node().getContext("2d");

      const svg = container.append("svg").attr("viewBox", [0, 0, width, height]);
      const g = svg.append("g").attr("transform", `translate(${width / 2},${height / 2})`);

      // Hierarchy
      const hierarchyData = {
        name: "root",
        children: groups.map((gName, i) => ({
          name: gName,
          children: nodes.filter(n => n.group === i)
        }))
      };

      const root = d3.hierarchy(hierarchyData)
        .sum(d => 1)
        .sort((a, b) => b.value - a.value);

      const cluster = d3.cluster().size([360, radius]);
      cluster(root);

      const leaves = root.leaves();
      const idToNode = new Map(leaves.map(l => [l.data.id, l]));

      const bundleLinks = links.map(l => {
        const source = idToNode.get(l.source);
        const target = idToNode.get(l.target);
        return source.path(target);
      });

      const line = d3.lineRadial()
        .curve(d3.curveBundle.beta(0.85))
        .radius(d => d.y)
        .angle(d => (d.x * Math.PI) / 180);

      function drawLinks(highlightId = null, highlightGroup = null) {
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.translate(width / 2, height / 2);
        
        links.forEach((l, i) => {
          const path = bundleLinks[i];
          const isHighlighted = highlightId !== null 
            ? (l.source === highlightId || l.target === highlightId)
            : highlightGroup !== null
              ? (nodes[l.source].group === highlightGroup || nodes[l.target].group === highlightGroup)
              : false;

          ctx.beginPath();
          // We can't directly use line() with canvas as easily for radial, 
          // so we map the points
          path.forEach((p, j) => {
            const angle = (p.x * Math.PI) / 180 - Math.PI / 2;
            const x = p.y * Math.cos(angle);
            const y = p.y * Math.sin(angle);
            if (j === 0) ctx.moveTo(x, y);
            else {
              // Simple approximation of the bundle curve for canvas
              // For perfect accuracy, we could use Path2D(line(path))
            }
          });
          
          // Using Path2D is better for SVG-path parity
          const pathStr = line(path);
          const p2d = new Path2D(pathStr);

          if (isHighlighted) {
            ctx.strokeStyle = SCHEME[nodes[l.source].group];
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.8;
          } else if (highlightId !== null || highlightGroup !== null) {
            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 0.5;
            ctx.globalAlpha = 0.05;
          } else {
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 0.7;
            ctx.globalAlpha = 0.3;
          }
          
          ctx.stroke(p2d);
        });
        ctx.restore();
      }

      drawLinks();

      const node = g.append("g")
        .selectAll("g")
        .data(leaves)
        .join("g")
        .attr("transform", d => `rotate(${d.x - 90}) translate(${d.y},0)`);

      node.append("circle")
        .attr("r", 4)
        .attr("fill", d => SCHEME[d.data.group])
        .attr("stroke", "#1e293b")
        .attr("class", "node")
        .on("mouseenter", (event, d) => {
          showTooltip(event, `<strong>${d.data.name}</strong><br>${d.data.groupName} Cluster`);
          dispatch.call("hoverNode", null, d.data.id);
        })
        .on("mouseleave", () => {
          hideTooltip();
          dispatch.call("clear");
        });

      node.append("text")
        .attr("dy", "0.31em")
        .attr("x", d => d.x < 180 ? 10 : -10)
        .attr("text-anchor", d => d.x < 180 ? "start" : "end")
        .attr("transform", d => d.x >= 180 ? "rotate(180)" : null)
        .attr("class", "label")
        .text(d => d.data.name)
        .style("opacity", 0); // Hide labels by default to reduce clutter

      dispatch.on("hoverNode.bundle", id => {
        drawLinks(id);
        node.style("opacity", d => d.data.id === id || adj[id].has(d.data.id) ? 1 : 0.2);
      });

      dispatch.on("hoverGroup.bundle", groupIdx => {
        drawLinks(null, groupIdx);
        node.style("opacity", d => d.data.group === groupIdx ? 1 : 0.2);
      });

      dispatch.on("clear.bundle", () => {
        drawLinks();
        node.style("opacity", 1);
      });
    }

    // --- 3. Chord Diagram ---
    function initChord() {
      const container = d3.select("#chord-panel .viz-container");
      const width = container.node().clientWidth;
      const height = container.node().clientHeight;
      const innerRadius = Math.min(width, height) / 2 - 80;
      const outerRadius = innerRadius + 15;

      const svg = container.append("svg").attr("viewBox", [0, 0, width, height]);
      const g = svg.append("g").attr("transform", `translate(${width / 2},${height / 2})`);

      // Build group-to-group matrix
      const matrix = Array.from({ length: NUM_GROUPS }, () => new Array(NUM_GROUPS).fill(0));
      links.forEach(l => {
        const sGroup = nodes[l.source].group;
        const tGroup = nodes[l.target].group;
        matrix[sGroup][tGroup] += 1;
        if (sGroup !== tGroup) matrix[tGroup][sGroup] += 1;
      });

      const chord = d3.chord()
        .padAngle(0.1)
        .sortSubgroups(d3.descending);

      const chords = chord(matrix);

      const arc = d3.arc()
        .innerRadius(innerRadius)
        .outerRadius(outerRadius);

      const ribbon = d3.ribbon()
        .radius(innerRadius);

      const group = g.append("g")
        .selectAll("g")
        .data(chords.groups)
        .join("g");

      group.append("path")
        .attr("fill", d => SCHEME[d.index])
        .attr("stroke", "#1e293b")
        .attr("d", arc)
        .style("cursor", "pointer")
        .on("mouseenter", (event, d) => {
          showTooltip(event, `<strong>${groups[d.index]} Cluster</strong><br>${matrix[d.index][d.index]} Internal / ${d3.sum(matrix[d.index]) - matrix[d.index][d.index]} External Links`);
          dispatch.call("hoverGroup", null, d.index);
        })
        .on("mouseleave", () => {
          hideTooltip();
          dispatch.call("clear");
        });

      group.append("text")
        .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
        .attr("dy", ".35em")
        .attr("class", "label")
        .attr("fill", varName => SCHEME[varName.index])
        .attr("transform", d => `
          rotate(${(d.angle * 180 / Math.PI - 90)})
          translate(${outerRadius + 10})
          ${d.angle > Math.PI ? "rotate(180)" : ""}
        `)
        .attr("text-anchor", d => d.angle > Math.PI ? "end" : "start")
        .text(d => groups[d.index])
        .style("font-weight", "bold")
        .style("fill", varName => SCHEME[varName.index]);

      const ribbons = g.append("g")
        .attr("fill-opacity", 0.6)
        .selectAll("path")
        .data(chords)
        .join("path")
        .attr("d", ribbon)
        .attr("fill", d => SCHEME[d.source.index])
        .attr("stroke", "#1e293b")
        .attr("stroke-width", 0.5)
        .attr("class", "link");

      dispatch.on("hoverNode.chord", id => {
        const groupIdx = nodes[id].group;
        group.style("opacity", d => d.index === groupIdx ? 1 : 0.1);
        ribbons.style("opacity", d => (d.source.index === groupIdx || d.target.index === groupIdx) ? 1 : 0.05);
      });

      dispatch.on("hoverGroup.chord", groupIdx => {
        group.style("opacity", d => d.index === groupIdx ? 1 : 0.1);
        ribbons.style("opacity", d => (d.source.index === groupIdx || d.target.index === groupIdx) ? 1 : 0.05);
      });

      dispatch.on("clear.chord", () => {
        group.style("opacity", 1);
        ribbons.style("opacity", 0.6);
      });
    }

    // Initialize all panels
    initForce();
    initBundle();
    initChord();

  </script>
</body>
</html>
