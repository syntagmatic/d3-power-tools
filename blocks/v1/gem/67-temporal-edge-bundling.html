<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporal Edge Bundling | D3 Power Tools</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --muted: #64748b;
  }
  
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
  }

  .header {
    width: 100%;
    padding: 1.5rem 2rem;
    background: linear-gradient(to bottom, rgba(30, 41, 59, 0.8), transparent);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.025em;
  }

  .subtitle {
    font-size: 0.875rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  #viz-container {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .controls {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    padding: 1rem 2rem;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 20;
  }

  #play-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s, background-color 0.2s;
  }

  #play-btn:hover {
    transform: scale(1.1);
    background-color: #7dd3fc;
  }

  #play-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .slider-container {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    width: 240px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
  }

  input[type="range"]:focus {
    outline: none;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    cursor: pointer;
    background: var(--muted);
    border-radius: 2px;
  }

  input[type="range"]::-webkit-slider-thumb {
    height: 16px;
    width: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    -webkit-appearance: none;
    margin-top: -6px;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
  }

  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .month-display {
    font-size: 1.5rem;
    font-weight: 700;
    min-width: 80px;
    text-align: center;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .stats {
    position: absolute;
    top: 2rem;
    right: 2rem;
    text-align: right;
    pointer-events: none;
  }

  .stat-val {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .node-label {
    font-size: 10px;
    fill: var(--muted);
    pointer-events: none;
    transition: fill 0.2s;
  }

  .node:hover .node-label {
    fill: var(--text);
  }

  .tooltip {
    position: absolute;
    padding: 0.5rem 0.75rem;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 0.5rem;
    font-size: 0.75rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    z-index: 100;
  }
</style>
</head>
<body>

<header class="header">
  <div>
    <h1>Temporal Edge Bundling</h1>
    <p class="subtitle">Inter-departmental collaboration dynamics over a fiscal year</p>
  </div>
</header>

<div class="stats">
  <div class="stat-val" id="edge-count">0</div>
  <div class="stat-label">Active Connections</div>
</div>

<div id="viz-container">
  <div class="tooltip" id="tooltip"></div>
</div>

<div class="controls">
  <button id="play-btn" title="Toggle Play/Pause">
    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>
  
  <div class="month-display" id="month-name">JAN</div>

  <div class="slider-container">
    <input type="range" id="month-slider" min="0" max="11" value="0" step="1">
    <div class="slider-labels">
      <span>JAN</span>
      <span>DEC</span>
    </div>
  </div>
</div>

<script>
const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const DEPTS = [
  { name: "Engineering", color: "#38bdf8" },
  { name: "Product", color: "#818cf8" },
  { name: "Design", color: "#f472b6" },
  { name: "Marketing", color: "#fb923c" },
  { name: "Operations", color: "#4ade80" }
];

const width = window.innerWidth;
const height = window.innerHeight;
const radius = Math.min(width, height) / 2 - 120;
const innerRadius = radius - 100;

const svg = d3.select("#viz-container")
  .append("svg")
  .attr("width", width)
  .attr("height", height)
  .append("g")
  .attr("transform", `translate(${width / 2}, ${height / 2})`);

const tooltip = d3.select("#tooltip");

// --- Data Generation ---
const generateData = () => {
  const nodes = [{ id: "root", parent: null }];
  const edges = [];
  const rng = d3.randomLcg(42);

  DEPTS.forEach(dept => {
    nodes.push({ id: dept.name, parent: "root", type: "dept" });
    const teamCount = 3 + Math.floor(rng() * 3);
    for (let i = 0; i < teamCount; i++) {
      const teamId = `${dept.name}.T${i}`;
      nodes.push({ id: teamId, parent: dept.name, type: "team" });
      const memberCount = 4 + Math.floor(rng() * 6);
      for (let j = 0; j < memberCount; j++) {
        nodes.push({ 
          id: `${teamId}.M${j}`, 
          parent: teamId, 
          type: "member", 
          name: `${dept.name} Member ${i}-${j}`,
          dept: dept.name
        });
      }
    }
  });

  const leaves = nodes.filter(n => n.type === "member");
  
  // Generate 400 temporal edges
  for (let i = 0; i < 400; i++) {
    const source = leaves[Math.floor(rng() * leaves.length)];
    let target;
    do {
      target = leaves[Math.floor(rng() * leaves.length)];
    } while (target.id === source.id || target.dept === source.dept);

    // Active time window
    const start = Math.floor(rng() * 10);
    const duration = 2 + Math.floor(rng() * 4);
    const months = [];
    for (let m = start; m < Math.min(12, start + duration); m++) {
      months.push(m);
    }

    edges.push({
      source: source.id,
      target: target.id,
      months: months
    });
  }

  return { nodes, edges };
};

const { nodes, edges } = generateData();

// --- Hierarchy & Layout ---
const root = d3.stratify()
  .id(d => d.id)
  .parentId(d => d.parent)
  (nodes);

const cluster = d3.cluster()
  .size([360, innerRadius]);

cluster(root);

const idToNode = new Map(root.leaves().map(d => [d.data.id, d]));

// Precompute paths for edge bundling
const line = d3.lineRadial()
  .curve(d3.curveBundle.beta(0.85))
  .radius(d => d.y)
  .angle(d => d.x * Math.PI / 180);

const edgeData = edges.map(e => {
  const source = idToNode.get(e.source);
  const target = idToNode.get(e.target);
  return {
    ...e,
    path: source.path(target)
  };
});

// --- Scales ---
const colorScale = d3.scaleOrdinal()
  .domain(DEPTS.map(d => d.name))
  .range(DEPTS.map(d => d.color));

const sizeScale = d3.scaleSqrt()
  .domain([0, 15])
  .range([2, 12]);

// --- Drawing ---

// Nodes
const node = svg.append("g")
  .selectAll(".node")
  .data(root.leaves())
  .join("g")
  .attr("class", "node")
  .attr("transform", d => `rotate(${d.x - 90}) translate(${d.y},0)`);

const nodeCircle = node.append("circle")
  .attr("r", 3)
  .attr("fill", d => colorScale(d.data.dept))
  .attr("fill-opacity", 0.6)
  .attr("stroke", varProp("--bg"))
  .attr("stroke-width", 1);

node.on("mouseenter", (event, d) => {
    tooltip.style("opacity", 1)
      .html(`<strong>${d.data.name}</strong><br/>${d.data.dept}`)
      .style("left", `${event.pageX + 10}px`)
      .style("top", `${event.pageY - 10}px`);
    
    // Highlight connected edges
    const currentMonth = +d3.select("#month-slider").property("value");
    edgePath.filter(e => e.months.includes(currentMonth) && (e.source === d.data.id || e.target === d.data.id))
      .attr("stroke-opacity", 1)
      .attr("stroke-width", 2);
  })
  .on("mousemove", (event) => {
    tooltip.style("left", `${event.pageX + 10}px`)
      .style("top", `${event.pageY - 10}px`);
  })
  .on("mouseleave", () => {
    tooltip.style("opacity", 0);
    update(currentMonth); // Reset highlights
  });

// Edges
const edgePath = svg.append("g")
  .attr("fill", "none")
  .selectAll("path")
  .data(edgeData)
  .join("path")
  .attr("stroke", d => colorScale(idToNode.get(d.source).data.dept))
  .attr("stroke-width", 1)
  .attr("stroke-opacity", 0)
  .attr("d", d => line(d.path))
  .style("mix-blend-mode", "screen");

// --- Update Logic ---
let currentMonth = 0;
let isPlaying = false;
let timer;

function update(month) {
  currentMonth = month;
  
  // Update UI
  d3.select("#month-name").text(MONTHS[month]);
  d3.select("#month-slider").property("value", month);
  
  const activeEdges = edgeData.filter(e => e.months.includes(month));
  d3.select("#edge-count").text(activeEdges.size ? activeEdges.length : activeEdges.length);

  // Calculate degrees for node sizes
  const degrees = new Map();
  activeEdges.forEach(e => {
    degrees.set(e.source, (degrees.get(e.source) || 0) + 1);
    degrees.set(e.target, (degrees.get(e.target) || 0) + 1);
  });

  // Update edge visibility
  edgePath
    .transition()
    .duration(400)
    .attr("stroke-opacity", d => d.months.includes(month) ? 0.2 : 0);

  // Update node sizes
  nodeCircle
    .transition()
    .duration(400)
    .attr("r", d => sizeScale(degrees.get(d.data.id) || 0))
    .attr("fill-opacity", d => degrees.has(d.data.id) ? 0.9 : 0.2);
}

function varProp(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// --- Interaction ---
d3.select("#month-slider").on("input", function() {
  stop();
  update(+this.value);
});

d3.select("#play-btn").on("click", togglePlay);

function togglePlay() {
  if (isPlaying) {
    stop();
  } else {
    start();
  }
}

function start() {
  isPlaying = true;
  d3.select("#play-icon").style("display", "none");
  d3.select("#pause-icon").style("display", "block");
  
  timer = setInterval(() => {
    let next = (currentMonth + 1) % 12;
    update(next);
  }, 1500);
}

function stop() {
  isPlaying = false;
  d3.select("#play-icon").style("display", "block");
  d3.select("#pause-icon").style("display", "none");
  clearInterval(timer);
}

// Initialize
update(0);

// Responsive
window.addEventListener("resize", () => {
  const newWidth = window.innerWidth;
  const newHeight = window.innerHeight;
  d3.select("svg").attr("width", newWidth).attr("height", newHeight);
  d3.select("svg g").attr("transform", `translate(${newWidth / 2}, ${newHeight / 2})`);
});

</script>
</body>
</html>
