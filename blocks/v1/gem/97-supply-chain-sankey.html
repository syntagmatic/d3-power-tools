<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Supply Chain Sankey</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12/dist/d3-sankey.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --node-stroke: #1e293b;
            --link-color: rgba(148, 163, 184, 0.15);
            --highlight-color: #38bdf8;
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .header {
            position: absolute;
            top: 2rem;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--highlight-color);
        }

        .subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        #viz-container {
            width: 100vw;
            height: 100vh;
        }

        .node rect {
            cursor: pointer;
            transition: fill 0.2s ease;
        }

        .node text {
            font-size: 10px;
            fill: var(--text-color);
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .link {
            fill: none;
            stroke: var(--link-color);
            stroke-opacity: 0.4;
            transition: stroke 0.3s ease, stroke-opacity 0.3s ease;
        }

        .link.highlight {
            stroke: var(--highlight-color);
            stroke-opacity: 0.8;
        }

        .node.dimmed, .link.dimmed {
            opacity: 0.1;
        }

        .particle {
            pointer-events: none;
        }

        .tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--highlight-color);
            border-radius: 4px;
            pointer-events: none;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .level-labels {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            color: #64748b;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Supply Chain Ecosystem</h1>
        <div class="subtitle">Hover nodes to trace provenance & upstream dependencies</div>
    </div>

    <div id="viz-container"></div>

    <div class="level-labels">
        <span>Materials</span>
        <span>Components</span>
        <span>Products</span>
        <span>Markets</span>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        const margin = { top: 100, right: 150, bottom: 100, left: 150 };

        const svg = d3.select("#viz-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const tooltip = d3.select("#tooltip");

        // 1. Data Generation
        const levels = [
            { name: "Materials", nodes: ["Rare Earths", "Silicon", "Cobalt", "Lithium", "Aluminum", "Steel", "Copper", "Polymers"] },
            { name: "Components", nodes: ["Semiconductors", "Batteries", "Electric Motors", "Chassis", "OLED Panels", "Sensors", "Optical Glass", "PCBs", "Composite Shells", "Power Cables", "Precision Fasteners", "Sustainability Packaging"] },
            { name: "Products", nodes: ["Smartphones", "Workstations", "Electric Vehicles", "Solar Arrays", "Diagnostic Imaging", "Home Automation", "Industrial Cobots", "Delivery Drones"] },
            { name: "Markets", nodes: ["North America", "European Union", "Asia Pacific", "Latin America", "MEA Region"] }
        ];

        const nodes = [];
        levels.forEach((lvl, lIdx) => {
            lvl.nodes.forEach(n => {
                nodes.push({ name: n, level: lIdx });
            });
        });

        const links = [];
        const nodeIndicesByLevel = levels.map((_, i) => 
            nodes.map((n, idx) => n.level === i ? idx : -1).filter(idx => idx !== -1)
        );

        // Connect Level 0 -> 1 (Materials to Components)
        nodeIndicesByLevel[0].forEach(src => {
            const targets = d3.shuffled(nodeIndicesByLevel[1]).slice(0, 3 + Math.floor(Math.random() * 3));
            targets.forEach(tgt => {
                links.push({ source: src, target: tgt, value: 10 + Math.random() * 40 });
            });
        });

        // Connect Level 1 -> 2 (Components to Products)
        nodeIndicesByLevel[1].forEach(src => {
            const targets = d3.shuffled(nodeIndicesByLevel[2]).slice(0, 2 + Math.floor(Math.random() * 3));
            targets.forEach(tgt => {
                links.push({ source: src, target: tgt, value: 10 + Math.random() * 40 });
            });
        });

        // Connect Level 2 -> 3 (Products to Markets)
        nodeIndicesByLevel[2].forEach(src => {
            const targets = d3.shuffled(nodeIndicesByLevel[3]).slice(1, 4);
            targets.forEach(tgt => {
                links.push({ source: src, target: tgt, value: 20 + Math.random() * 60 });
            });
        });

        // 2. Sankey Layout
        const sankey = d3.sankey()
            .nodeWidth(12)
            .nodePadding(25)
            .extent([[0, 0], [width - margin.left - margin.right, height - margin.top - margin.bottom]]);

        const { nodes: skNodes, links: skLinks } = sankey({
            nodes: nodes.map(d => Object.assign({}, d)),
            links: links.map(d => Object.assign({}, d))
        });

        const colorScale = d3.scaleOrdinal()
            .domain([0, 1, 2, 3])
            .range(["#f87171", "#fbbf24", "#34d399", "#818cf8"]);

        // 3. Drawing
        const link = g.append("g")
            .selectAll(".link")
            .data(skLinks)
            .enter().append("path")
            .attr("class", "link")
            .attr("d", d3.sankeyLinkHorizontal())
            .attr("stroke-width", d => Math.max(1, d.width));

        const node = g.append("g")
            .selectAll(".node")
            .data(skNodes)
            .enter().append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.x0},${d.y0})`);

        node.append("rect")
            .attr("height", d => d.y1 - d.y0)
            .attr("width", d => d.x1 - d.x0)
            .attr("fill", d => colorScale(d.level))
            .attr("rx", 2)
            .on("mouseover", (event, d) => highlightUpstream(d))
            .on("mouseout", resetHighlight)
            .on("mousemove", (event) => {
                tooltip.style("left", (event.pageX + 15) + "px")
                       .style("top", (event.pageY - 15) + "px");
            });

        node.append("text")
            .attr("x", d => d.level < 3 ? d.x1 - d.x0 + 8 : -8)
            .attr("y", d => (d.y1 - d.y0) / 2)
            .attr("dy", "0.35em")
            .attr("text-anchor", d => d.level < 3 ? "start" : "end")
            .text(d => d.name);

        // 4. Trace Backward Interaction
        function highlightUpstream(targetNode) {
            const upstreamNodes = new Set();
            const upstreamLinks = new Set();

            function trace(n) {
                upstreamNodes.add(n.index);
                skLinks.forEach(l => {
                    if (l.target.index === n.index) {
                        upstreamLinks.add(l);
                        trace(l.source);
                    }
                });
            }

            trace(targetNode);

            node.classed("dimmed", d => !upstreamNodes.has(d.index));
            link.classed("dimmed", d => !upstreamLinks.has(d))
                .classed("highlight", d => upstreamLinks.has(d));

            tooltip.style("opacity", 1)
                   .html(`<strong>${targetNode.name}</strong><br/>Level: ${levels[targetNode.level].name}<br/>Inflow: ${d3.format(".1f")(targetNode.value)} units`);
        }

        function resetHighlight() {
            node.classed("dimmed", false);
            link.classed("dimmed", false).classed("highlight", false);
            tooltip.style("opacity", 0);
        }

        // 5. Particle Animation
        const particles = [];
        const maxParticlesPerLink = 2;
        const particleSpeed = 0.002;
        
        // Create an array of path nodes and their lengths for sampling
        const linkPaths = link.nodes().map(n => ({
            path: n,
            length: n.getTotalLength()
        }));

        function spawnParticles() {
            skLinks.forEach((l, i) => {
                // Stochastic spawning based on link value
                if (Math.random() < l.value * 0.001) {
                    particles.push({
                        linkIdx: i,
                        t: 0,
                        speed: particleSpeed + Math.random() * 0.001,
                        size: Math.min(3, 1 + l.value / 20)
                    });
                }
            });
        }

        const particleGroup = g.append("g").attr("class", "particle-layer");

        d3.timer((elapsed) => {
            spawnParticles();

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.t += p.speed;
                if (p.t > 1) {
                    particles.splice(i, 1);
                }
            }

            // Draw particles
            const pSelection = particleGroup.selectAll(".particle")
                .data(particles);

            pSelection.exit().remove();

            pSelection.enter().append("circle")
                .attr("class", "particle")
                .attr("fill", "#fff")
                .attr("filter", "blur(1px)")
                .merge(pSelection)
                .attr("r", d => d.size)
                .attr("opacity", d => {
                    // Fade in/out at ends
                    if (d.t < 0.1) return d.t * 10;
                    if (d.t > 0.9) return (1 - d.t) * 10;
                    return 0.8;
                })
                .attr("cx", d => {
                    const { path, length } = linkPaths[d.linkIdx];
                    return path.getPointAtLength(d.t * length).x;
                })
                .attr("cy", d => {
                    const { path, length } = linkPaths[d.linkIdx];
                    return path.getPointAtLength(d.t * length).y;
                });
        });

        // Handle Resize
        window.addEventListener("resize", () => {
            location.reload();
        });

    </script>
</body>
</html>
