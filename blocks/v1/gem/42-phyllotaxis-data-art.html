<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phyllotaxis Data Art</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #050505;
      --text: #e0e0e0;
      --accent: #66ccff;
      --panel: #1a1a1a;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(8px);
      padding: 15px 25px;
      border-radius: 40px;
      display: flex;
      gap: 30px;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 100;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      display: flex;
      justify-content: space-between;
    }

    .control-group span {
      font-family: monospace;
      color: var(--accent);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 120px;
      background: transparent;
    }

    input[type="range"]:focus {
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 2px;
      cursor: pointer;
      background: #444;
      border-radius: 1px;
    }

    input[type="range"]::-webkit-slider-thumb {
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 0 10px rgba(102, 204, 255, 0.5);
    }

    canvas {
      display: block;
    }

    .instructions {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

<header>
  <h1>Phyllotaxis</h1>
</header>

<div class="instructions">Generative Data Art</div>

<div class="controls">
  <div class="control-group">
    <label>Dots <span id="dots-val">2000</span></label>
    <input type="range" id="dots" min="100" max="5000" value="2000" step="100">
  </div>
  <div class="control-group">
    <label>Offset <span id="offset-val">0.0000</span></label>
    <input type="range" id="offset" min="-0.01" max="0.01" value="0" step="0.0001">
  </div>
  <div class="control-group">
    <label>Speed <span id="speed-val">1.0</span></label>
    <input type="range" id="speed" min="0.1" max="5" value="1" step="0.1">
  </div>
</div>

<div id="canvas-container"></div>

<script>
  // Configuration
  const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
  let n = 2000;
  let offset = 0;
  let speed = 1;
  const dotSpacing = 8;
  
  // UI Selection
  const dotsInput = d3.select("#dots");
  const offsetInput = d3.select("#offset");
  const speedInput = d3.select("#speed");
  
  const dotsVal = d3.select("#dots-val");
  const offsetVal = d3.select("#offset-val");
  const speedVal = d3.select("#speed-val");

  // State update on input
  dotsInput.on("input", function() {
    n = +this.value;
    dotsVal.text(n);
  });
  offsetInput.on("input", function() {
    offset = +this.value;
    offsetVal.text(offset.toFixed(4));
  });
  speedInput.on("input", function() {
    speed = +this.value;
    speedVal.text(speed.toFixed(1));
  });

  // Canvas setup
  const container = d3.select("#canvas-container");
  const canvas = container.append("canvas");
  const ctx = canvas.node().getContext("2d");
  
  let width, height;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.attr("width", width * dpr)
          .attr("height", height * dpr)
          .style("width", width + "px")
          .style("height", height + "px");
    ctx.scale(dpr, dpr);
  }

  window.addEventListener("resize", resize);
  resize();

  // Animation
  d3.timer((elapsed) => {
    const t = elapsed * 0.001 * speed;
    
    // Clear background
    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, width, height);
    
    // Angle oscillation: shifts spiral arms
    // We oscillate around the golden angle
    const angleShift = Math.sin(t * 0.2) * 0.002;
    const currentAngle = GOLDEN_ANGLE + offset + angleShift;
    
    // Global rotation
    const rotation = t * 0.05;
    
    ctx.save();
    ctx.translate(width / 2, height / 2);
    ctx.rotate(rotation);
    
    // First pass: Additive Glow
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < n; i++) {
      const r = dotSpacing * Math.sqrt(i);
      const theta = i * currentAngle;
      
      const x = r * Math.cos(theta);
      const y = r * Math.sin(theta);
      
      // Dynamic color based on index and time
      const hue = (i * 0.1 + t * 20) % 360;
      const size = 1.5 + Math.sin(t + i * 0.01) * 0.5;
      
      // Glow circle
      ctx.fillStyle = `hsla(${hue}, 80%, 50%, 0.15)`;
      ctx.beginPath();
      ctx.arc(x, y, size * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Second pass: Sharp points
    ctx.globalCompositeOperation = "source-over";
    for (let i = 0; i < n; i++) {
      const r = dotSpacing * Math.sqrt(i);
      const theta = i * currentAngle;
      
      const x = r * Math.cos(theta);
      const y = r * Math.sin(theta);
      
      const hue = (i * 0.1 + t * 20) % 360;
      const size = 1.2 + Math.sin(t + i * 0.01) * 0.4;
      
      ctx.fillStyle = `hsla(${hue}, 90%, 70%, 0.8)`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.restore();
  });

</script>

</body>
</html>
