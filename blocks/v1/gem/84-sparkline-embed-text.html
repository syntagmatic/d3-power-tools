<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metric Sparklines & Trends</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666;
      --border: #e5e7eb;
      --row-hover: #f9fafb;
      --blue: #4477AA;
      --red: #EE6677;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: #fcfcfc;
      margin: 0;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.01em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Narrative Styling */
    .narrative {
      font-size: 1.05rem;
      margin-bottom: 3rem;
    }

    .narrative p {
      margin-bottom: 1.25rem;
    }

    /* Sparkline alignment */
    .spark {
      display: inline-block;
      white-space: nowrap;
    }

    .spark svg {
      vertical-align: middle;
      margin: 0 4px;
      display: inline-block;
      overflow: visible;
    }

    /* Table Styling */
    .table-container {
      overflow-x: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.85rem;
    }

    th {
      background: #f8fafc;
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      background: #f1f5f9;
      color: var(--text);
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: var(--row-hover);
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
    }

    .trend-up { color: var(--blue); }
    .trend-down { color: var(--red); }

    .sort-indicator {
      display: inline-block;
      width: 12px;
      margin-left: 4px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    caption {
      text-align: left;
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 10px;
      caption-side: bottom;
    }

    @media (max-width: 640px) {
      .narrative { font-size: 1rem; }
      th, td { padding: 8px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Executive Performance Summary</h1>
    <p class="subtitle">Operational Health & Growth Metrics | 24-Month Window (2024-2025)</p>
  </header>

  <section class="narrative" id="narrative-content">
    <!-- Narrative will be injected here -->
  </section>

  <div class="table-container">
    <table id="metrics-table">
      <thead>
        <tr id="header-row"></tr>
      </thead>
      <tbody id="table-body"></tbody>
      <caption>Click headers to sort. Sparklines show 24-month relative trend.</caption>
    </table>
  </div>
</div>

<script>
(() => {
  // --- Configuration ---
  const MONTHS = 24;
  const SPARK_W = 60;
  const SPARK_H = 12;
  const TABLE_SPARK_W = 80;
  const TABLE_SPARK_H = 16;
  const BLUE = "#4477AA";
  const RED = "#EE6677";

  // --- Data Generation ---
  function generateTrend(start, end, variance, seed) {
    const random = d3.randomLcg(seed);
    const step = (end - start) / (MONTHS - 1);
    return Array.from({length: MONTHS}, (_, i) => {
      const base = start + (step * i);
      const noise = (random() - 0.5) * variance;
      return +(base + noise).toFixed(2);
    });
  }

  const metrics = [
    { 
      id: "rev", name: "Revenue", unit: "$M", 
      values: generateTrend(12.5, 18.2, 0.8, 0.1), 
      format: d3.format("$,.1f"), label: "M" 
    },
    { 
      id: "gm", name: "Gross Margin", unit: "%", 
      values: generateTrend(42.1, 44.5, 0.5, 0.2), 
      format: d3.format(".1f"), label: "%" 
    },
    { 
      id: "churn", name: "Churn Rate", unit: "%", 
      values: generateTrend(4.2, 2.8, 0.4, 0.3), 
      format: d3.format(".2f"), label: "%", inverted: true 
    },
    { 
      id: "cust", name: "Customers", unit: "K", 
      values: generateTrend(240, 310, 5, 0.4), 
      format: d3.format(",.0f"), label: "K" 
    },
    { 
      id: "nps", name: "NPS", unit: "", 
      values: generateTrend(32, 58, 6, 0.5), 
      format: d3.format(".0f"), label: "" 
    },
    { 
      id: "aov", name: "Avg Order Value", unit: "$", 
      values: generateTrend(115, 128, 4, 0.6), 
      format: d3.format("$,.0f"), label: "" 
    },
    { 
      id: "tickets", name: "Support Volume", unit: "K", 
      values: generateTrend(8.4, 5.2, 0.6, 0.7), 
      format: d3.format(".1f"), label: "K", inverted: true 
    },
    { 
      id: "rr", name: "Retention Rate", unit: "%", 
      values: generateTrend(88, 94, 1.2, 0.8), 
      format: d3.format(".1f"), label: "%" 
    }
  ];

  // Post-process metrics
  metrics.forEach(m => {
    m.latest = m.values[MONTHS - 1];
    m.start = m.values[0];
    m.change = ((m.latest - m.start) / m.start) * 100;
    m.isGood = m.inverted ? m.latest < m.start : m.latest > m.start;
    m.color = m.isGood ? BLUE : RED;
    m.min = d3.min(m.values);
    m.max = d3.max(m.values);
  });

  // --- Sparkline Component ---
  function drawSpark(container, data, width, height, color) {
    const svg = d3.select(container).append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("role", "img")
      .attr("aria-label", "Trend sparkline");

    const x = d3.scaleLinear()
      .domain([0, data.length - 1])
      .range([0, width]);

    const y = d3.scaleLinear()
      .domain(d3.extent(data))
      .range([height - 1, 1]);

    const line = d3.line()
      .x((d, i) => x(i))
      .y(d => y(d))
      .curve(d3.curveMonotoneX);

    svg.append("path")
      .datum(data)
      .attr("fill", "none")
      .attr("stroke", "#ccc")
      .attr("stroke-width", 1)
      .attr("d", line);

    // Highlight final segment or point
    svg.append("circle")
      .attr("cx", x(data.length - 1))
      .attr("cy", y(data[data.length - 1]))
      .attr("r", 1.5)
      .attr("fill", color);
  }

  // --- Narrative Injection ---
  const narrative = d3.select("#narrative-content");
  
  const p1 = narrative.append("p");
  p1.html(`Over the last 24 months, our revenue trajectory has seen significant momentum, scaling from $12.5M to ${metrics[0].format(metrics[0].latest)}M <span id="spark-rev" class="spark"></span>. This growth was underpinned by a disciplined focus on margins, which improved from 42% to 44.5% <span id="spark-gm" class="spark"></span>, even as we aggressively acquired new customers. Our total customer base now stands at ${metrics[3].format(metrics[3].latest)}K <span id="spark-cust" class="spark"></span>, a 29% increase since January 2024.`);

  const p2 = narrative.append("p");
  p2.html(`Perhaps more critical is the underlying quality of this growth. Churn rate dropped from 4.2% to a record low of ${metrics[2].format(metrics[2].latest)}% <span id="spark-churn" class="spark"></span>, while retention climbed to ${metrics[7].format(metrics[7].latest)}% <span id="spark-rr" class="spark"></span>. This operational excellence is reflected in our customer sentiment; NPS scores surged from 32 to ${metrics[4].format(metrics[4].latest)} <span id="spark-nps" class="spark"></span> during this period.`);

  const p3 = narrative.append("p");
  p3.html(`Efficiency gains are evident in our support operations. Despite the larger user base, monthly ticket volume decreased from 8.4K to ${metrics[6].format(metrics[6].latest)}K <span id="spark-tickets" class="spark"></span>, largely due to automation initiatives. Meanwhile, Average Order Value remained resilient, ticking up from $115 to ${metrics[5].format(metrics[5].latest)} <span id="spark-aov" class="spark"></span>, indicating strong upsell performance.`);

  // Draw inline sparks
  metrics.forEach(m => {
    const el = document.getElementById(`spark-${m.id}`);
    if (el) drawSpark(el, m.values, SPARK_W, SPARK_H, m.color);
  });

  // --- Table Implementation ---
  const columns = [
    { key: "name", label: "Metric", sortable: true, type: "text" },
    { key: "latest", label: "Latest", sortable: true, type: "number", format: (d, r) => r.format(d) + r.label },
    { key: "change", label: "2Y Change", sortable: true, type: "number", format: d => (d > 0 ? "+" : "") + d.toFixed(1) + "%" },
    { key: "trend", label: "24-Month Trend", sortable: false, type: "spark" },
    { key: "min", label: "Min", sortable: true, type: "number", format: (d, r) => r.format(d) },
    { key: "max", label: "Max", sortable: true, type: "number", format: (d, r) => r.format(d) }
  ];

  let currentSort = { key: "name", asc: true };

  function renderTable() {
    const data = [...metrics].sort((a, b) => {
      let vA = a[currentSort.key];
      let vB = b[currentSort.key];
      if (typeof vA === "string") vA = vA.toLowerCase();
      if (typeof vB === "string") vB = vB.toLowerCase();
      
      const cmp = d3.ascending(vA, vB);
      return currentSort.asc ? cmp : -cmp;
    });

    // Header
    const header = d3.select("#header-row");
    header.selectAll("th").data(columns).join("th")
      .attr("class", d => d.type === "number" ? "num" : "")
      .on("click", (e, d) => {
        if (!d.sortable) return;
        if (currentSort.key === d.key) currentSort.asc = !currentSort.asc;
        else { currentSort.key = d.key; currentSort.asc = true; }
        renderTable();
      })
      .html(d => `
        ${d.label}
        <span class="sort-indicator">${currentSort.key === d.key ? (currentSort.asc ? "▲" : "▼") : ""}</span>
      `);

    // Body
    const tbody = d3.select("#table-body");
    const rows = tbody.selectAll("tr").data(data, d => d.id).join("tr");

    rows.selectAll("td").data(d => columns.map(c => ({ col: c, row: d }))).join("td")
      .attr("class", d => d.col.type === "number" ? "num" : "")
      .each(function(d) {
        const cell = d3.select(this);
        cell.selectAll("*").remove(); // Clear previous content

        if (d.col.type === "spark") {
          drawSpark(this, d.row.values, TABLE_SPARK_W, TABLE_SPARK_H, d.row.color);
        } else if (d.col.key === "change") {
          cell.classed(d.row.isGood ? "trend-up" : "trend-down", true)
              .text(d.col.format(d.row.change));
        } else {
          cell.text(d.col.format ? d.col.format(d.row[d.col.key], d.row) : d.row[d.col.key]);
        }
      });
  }

  renderTable();

})();
</script>
</body>
</html>
