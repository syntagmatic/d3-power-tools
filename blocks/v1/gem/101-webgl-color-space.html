<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OKLCH Color Space — WebGL 3D</title>
  <style>
    :root {
      --bg: #111;
      --text: #eee;
      --accent: #0af;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      overflow: hidden; width: 100vw; height: 100vh;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute; top: 24px; left: 24px; pointer-events: none;
    }
    .overlay h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.01em; }
    .overlay .sub { font-size: 13px; color: #888; }
    .controls {
      position: absolute; top: 24px; right: 24px; width: 220px;
      display: flex; flex-direction: column; gap: 20px;
      pointer-events: auto; padding: 20px;
      background: rgba(20, 20, 20, 0.85); border: 1px solid #333;
      border-radius: 12px; backdrop-filter: blur(8px);
    }
    .control-group label {
      font-size: 12px; color: #bbb; display: block; margin-bottom: 8px;
    }
    .slider-range { display: flex; flex-direction: column; gap: 4px; }
    .slider-range input { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .range-val { font-size: 11px; color: #888; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }
    .tooltip {
      position: absolute; pointer-events: none; opacity: 0;
      background: rgba(30, 30, 30, 0.95); border: 1px solid #444;
      border-radius: 8px; padding: 12px;
      font-size: 12px; line-height: 1.5;
      transition: opacity 0.15s ease-out; backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
    }
    .tooltip .swatch {
      width: 100%; height: 40px; border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px;
    }
    .tooltip .name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .tooltip .coords { color: #888; font-family: monospace; }
    .instructions {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.1em;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="container"></div>
<div class="overlay">
  <h1>OKLCH Color Space</h1>
  <div class="sub">1,500 named colors in 3D &middot; D3.js + Three.js</div>
</div>
<div class="controls">
  <div class="control-group">
    <label>Lightness (L)</label>
    <div class="slider-range">
      <input type="range" id="l-min" min="0" max="1" step="0.01" value="0.0">
      <input type="range" id="l-max" min="0" max="1" step="0.01" value="1.0">
      <div class="range-val"><span id="l-min-v">0.00</span><span id="l-max-v">1.00</span></div>
    </div>
  </div>
  <div class="control-group">
    <label>Chroma (C)</label>
    <div class="slider-range">
      <input type="range" id="c-min" min="0" max="0.4" step="0.01" value="0.0">
      <input type="range" id="c-max" min="0" max="0.4" step="0.01" value="0.4">
      <div class="range-val"><span id="c-min-v">0.00</span><span id="c-max-v">0.40</span></div>
    </div>
  </div>
  <div id="count-label" style="font-size: 11px; color: #666; text-align: right;">1500 visible</div>
</div>
<div class="tooltip" id="tip">
  <div class="swatch" id="tip-swatch"></div>
  <div class="name" id="tip-name"></div>
  <div class="coords" id="tip-coords"></div>
</div>
<div class="instructions">Orbit &middot; Zoom &middot; Hover</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.skypack.dev/three@0.136.0",
      "three/examples/jsm/controls/OrbitControls": "https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js",
      "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
    }
  }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls";
import * as d3 from "d3";

// --- Data Generation ---
const cssNames = ["aliceblue","antiquewhite","aqua","aquamarine","azure","beige","bisque","black","blanchedalmond","blue","blueviolet","brown","burlywood","cadetblue","chartreuse","chocolate","coral","cornflowerblue","cornsilk","crimson","cyan","darkblue","darkcyan","darkgoldenrod","darkgray","darkgreen","darkkhaki","darkmagenta","darkolivegreen","darkorange","darkorchid","darkred","darksalmon","darkseagreen","darkslateblue","darkslategray","darkturquoise","darkviolet","deeppink","deepskyblue","dimgray","dodgerblue","firebrick","floralwhite","forestgreen","fuchsia","gainsboro","ghostwhite","gold","goldenrod","gray","green","greenyellow","honeydew","hotpink","indianred","indigo","ivory","khaki","lavender","lavenderblush","lawngreen","lemonchiffon","lightblue","lightcoral","lightcyan","lightgoldenrodyellow","lightgray","lightgreen","lightpink","lightsalmon","lightseagreen","lightskyblue","lightslategray","lightsteelblue","lightyellow","lime","limegreen","linen","magenta","maroon","mediumaquamarine","mediumblue","mediumorchid","mediumpurple","mediumseagreen","mediumslateblue","mediumspringgreen","mediumturquoise","mediumvioletred","midnightblue","mintcream","mistyrose","moccasin","navajowhite","navy","oldlace","olive","olivedrab","orange","orangered","orchid","palegoldenrod","palegreen","paleturquoise","palevioletred","papayawhip","peachpuff","peru","pink","plum","powderblue","purple","rebeccapurple","red","rosybrown","royalblue","saddlebrown","salmon","sandybrown","seagreen","seashell","sienna","silver","skyblue","slateblue","slategray","snow","springgreen","steelblue","tan","teal","thistle","tomato","turquoise","violet","wheat","white","whitesmoke","yellow","yellowgreen"];

function srgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055)/1.055, 2.4);
}

function rgbToOklch(r, g, b) {
  const lr = srgbToLinear(r), lg = srgbToLinear(g), lb = srgbToLinear(b);
  const l_ = 0.4122214708*lr + 0.5363325363*lg + 0.0514459929*lb;
  const m_ = 0.2119034982*lr + 0.6806995451*lg + 0.1073969566*lb;
  const s_ = 0.0883024619*lr + 0.2220049401*lg + 0.6896926080*lb;
  const l1 = Math.cbrt(l_), m1 = Math.cbrt(m_), s1 = Math.cbrt(s_);
  const L = 0.2104542553*l1 + 0.7936177850*m1 - 0.0040720468*s1;
  const a = 1.9779984951*l1 - 2.4285922050*m1 + 0.4505937099*s1;
  const bv = 0.0259040371*l1 + 0.7827717662*m1 - 0.8086757660*s1;
  const C = Math.sqrt(a*a + bv*bv);
  let H = Math.atan2(bv, a) * 180 / Math.PI;
  if (H < 0) H += 360;
  return [L, C, H];
}

function oklchInGamut(L, C, H) {
  const a = C * Math.cos(H * Math.PI / 180);
  const b = C * Math.sin(H * Math.PI / 180);
  const l1 = L + 0.3963377774*a + 0.2158037573*b;
  const m1 = L - 0.1055613458*a - 0.0638541728*b;
  const s1 = L - 0.0894841775*a - 1.2914855480*b;
  const l_ = l1*l1*l1, m_ = m1*m1*m1, s_ = s1*s1*s1;
  const r = 4.0767416621*l_ - 3.3077115913*m_ + 0.2309699292*s_;
  const g = -1.2684380046*l_ + 2.6097574011*m_ - 0.3413193965*s_;
  const bv = -0.0041960863*l_ - 0.7034186147*m_ + 1.7076147010*s_;
  const tol = -0.002;
  return r >= tol && r <= 1.002 && g >= tol && g <= 1.002 && bv >= tol && bv <= 1.002;
}

function oklchToSrgb(L, C, H) {
  const a = C * Math.cos(H * Math.PI / 180);
  const b = C * Math.sin(H * Math.PI / 180);
  const l1 = L + 0.3963377774*a + 0.2158037573*b;
  const m1 = L - 0.1055613458*a - 0.0638541728*b;
  const s1 = L - 0.0894841775*a - 1.2914855480*b;
  const l_ = l1*l1*l1, m_ = m1*m1*m1, s_ = s1*s1*s1;
  let r = 4.0767416621*l_ - 3.3077115913*m_ + 0.2309699292*s_;
  let g = -1.2684380046*l_ + 2.6097574011*m_ - 0.3413193965*s_;
  let bv = -0.0041960863*l_ - 0.7034186147*m_ + 1.7076147010*s_;
  r = Math.max(0,Math.min(1,r)); g = Math.max(0,Math.min(1,g)); bv = Math.max(0,Math.min(1,bv));
  const f = c => c <= 0.0031308 ? 12.92*c : 1.055*Math.pow(c,1/2.4)-0.055;
  return [Math.round(f(r)*255), Math.round(f(g)*255), Math.round(f(bv)*255)];
}

const colors = [];
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

// 1. Add CSS named colors
cssNames.forEach(name => {
  ctx.fillStyle = name;
  const hex = ctx.fillStyle;
  const r = parseInt(hex.slice(1,3), 16) / 255;
  const g = parseInt(hex.slice(3,5), 16) / 255;
  const b = parseInt(hex.slice(5,7), 16) / 255;
  const [L, C, H] = rgbToOklch(r, g, b);
  colors.push({ name, hex, L, C, H, r, g, b });
});

// 2. Generate more "named" colors by sampling and using LCH as names
let seed = 123;
function random() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

while (colors.length < 1500) {
  const L = random();
  const C = random() * 0.4;
  const H = random() * 360;
  if (oklchInGamut(L, C, H)) {
    const [rv, gv, bv] = oklchToSrgb(L, C, H);
    const hex = `#${rv.toString(16).padStart(2,'0')}${gv.toString(16).padStart(2,'0')}${bv.toString(16).padStart(2,'0')}`;
    const name = `OKLCH(${L.toFixed(2)}, ${C.toFixed(2)}, ${Math.round(H)})`;
    colors.push({ name, hex, L, C, H, r: rv/255, g: gv/255, b: bv/255 });
  }
}

// Map to 3D Space: H = angle, C = radius, L = height
const scaleC = 10;
const scaleL = 8;
colors.forEach(d => {
  const rad = d.H * Math.PI / 180;
  d.x = Math.cos(rad) * d.C * scaleC;
  d.z = Math.sin(rad) * d.C * scaleC;
  d.y = (d.L - 0.5) * scaleL;
});

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(12, 8, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.getElementById('container').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Grid and Axes
const gridHelper = new THREE.GridHelper(10, 20, 0x333333, 0x222222);
gridHelper.position.y = -scaleL/2;
scene.add(gridHelper);

const axisHelper = new THREE.AxesHelper(1);
axisHelper.position.y = -scaleL/2;
scene.add(axisHelper);

// Points
const geometry = new THREE.BufferGeometry();
const posArr = new Float32Array(colors.length * 3);
const colArr = new Float32Array(colors.length * 3);
const sizeArr = new Float32Array(colors.length);
const visibleArr = new Float32Array(colors.length);

colors.forEach((d, i) => {
  posArr[i * 3] = d.x;
  posArr[i * 3 + 1] = d.y;
  posArr[i * 3 + 2] = d.z;
  colArr[i * 3] = d.r;
  colArr[i * 3 + 1] = d.g;
  colArr[i * 3 + 2] = d.b;
  sizeArr[i] = 1.0;
  visibleArr[i] = 1.0;
});

geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizeArr, 1));
geometry.setAttribute('visible', new THREE.BufferAttribute(visibleArr, 1));

const material = new THREE.ShaderMaterial({
  uniforms: {
    uPixelRatio: { value: window.devicePixelRatio }
  },
  vertexShader: `
    attribute float size;
    attribute float visible;
    varying vec3 vColor;
    varying float vVisible;
    uniform float uPixelRatio;
    void main() {
      vColor = color;
      vVisible = visible;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * uPixelRatio * (400.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vVisible;
    void main() {
      if (vVisible < 0.5) discard;
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = smoothstep(0.5, 0.45, d);
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent: true,
  vertexColors: true
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// --- Interactions ---
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.1;
const mouse = new THREE.Vector2();
const tip = d3.select("#tip");

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

function updateTooltip(idx, mx, my) {
  if (idx === null) {
    tip.style("opacity", 0);
    return;
  }
  const d = colors[idx];
  tip.select("#tip-swatch").style("background", d.hex);
  tip.select("#tip-name").text(d.name);
  tip.select("#tip-coords").html(`
    L: ${d.L.toFixed(3)}<br>
    C: ${d.C.toFixed(3)}<br>
    H: ${d.H.toFixed(1)}&deg;<br>
    ${d.hex.toUpperCase()}
  `);
  tip.style("opacity", 1)
     .style("left", Math.min(mx + 15, window.innerWidth - 180) + "px")
     .style("top", Math.min(my + 15, window.innerHeight - 180) + "px");
}

// Filtering
const lMinInput = document.getElementById('l-min');
const lMaxInput = document.getElementById('l-max');
const cMinInput = document.getElementById('c-min');
const cMaxInput = document.getElementById('c-max');

const lMinV = document.getElementById('l-min-v');
const lMaxV = document.getElementById('l-max-v');
const cMinV = document.getElementById('c-min-v');
const cMaxV = document.getElementById('c-max-v');
const countLabel = document.getElementById('count-label');

function filter() {
  const lMin = +lMinInput.value;
  const lMax = +lMaxInput.value;
  const cMin = +cMinInput.value;
  const cMax = +cMaxInput.value;

  lMinV.textContent = lMin.toFixed(2);
  lMaxV.textContent = lMax.toFixed(2);
  cMinV.textContent = cMin.toFixed(2);
  cMaxV.textContent = cMax.toFixed(2);

  const vis = geometry.attributes.visible.array;
  let count = 0;
  for (let i = 0; i < colors.length; i++) {
    const d = colors[i];
    const show = d.L >= lMin && d.L <= lMax && d.C >= cMin && d.C <= cMax;
    vis[i] = show ? 1.0 : 0.0;
    if (show) count++;
  }
  geometry.attributes.visible.needsUpdate = true;
  countLabel.textContent = `${count} visible`;
}

[lMinInput, lMaxInput, cMinInput, cMaxInput].forEach(el => el.addEventListener('input', filter));

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  material.uniforms.uPixelRatio.value = window.devicePixelRatio;
});

// Render Loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(points);
  
  let hoveredIdx = null;
  if (intersects.length > 0) {
    // Only pick visible points
    for (let i = 0; i < intersects.length; i++) {
      const idx = intersects[i].index;
      if (geometry.attributes.visible.array[idx] > 0.5) {
        hoveredIdx = idx;
        break;
      }
    }
  }
  
  const clientX = (mouse.x + 1) * window.innerWidth / 2;
  const clientY = (-mouse.y + 1) * window.innerHeight / 2;
  updateTooltip(hoveredIdx, clientX, clientY);

  renderer.render(scene, camera);
}

animate();
filter();
</script>
</body>
</html>
