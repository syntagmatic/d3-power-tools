<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Network & Centrality Explorer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #666666;
      --border: #e5e7eb;
      --surface: #f9fafb;
      --highlight: #3b82f6;
      --highlight-bg: #eff6ff;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      z-index: 10;
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .title-group p {
      margin: 0.25rem 0 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-item span {
      color: var(--muted);
      margin-right: 0.25rem;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 3fr 2fr;
      overflow: hidden;
    }

    #viz-container {
      position: relative;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    #table-container {
      overflow-y: auto;
      background: #fff;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hull {
      fill-opacity: 0.08;
      stroke-width: 20;
      stroke-linejoin: round;
      stroke-opacity: 0.1;
      transition: fill-opacity 0.2s, stroke-opacity 0.2s;
      pointer-events: none;
    }

    .hull.active {
      fill-opacity: 0.2;
      stroke-opacity: 0.3;
    }

    .link {
      stroke: #d1d5db;
      stroke-opacity: 0.4;
      transition: stroke-opacity 0.2s;
    }

    .node {
      stroke: #fff;
      stroke-width: 1.5;
      transition: r 0.2s, stroke-width 0.2s, opacity 0.2s;
      cursor: pointer;
    }

    .node:hover {
      stroke: var(--text);
      stroke-width: 2.5;
    }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }

    thead {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 5;
      box-shadow: 0 1px 0 var(--border);
    }

    th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    th:hover { background: var(--surface); }

    td {
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .num {
      font-family: var(--font-mono);
      text-align: right;
    }

    tr.comm-header {
      background: var(--surface);
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    tr.comm-header:hover {
      background: var(--border);
    }

    tr.node-row {
      transition: background 0.1s;
      cursor: pointer;
    }

    tr.node-row:hover {
      background: var(--surface);
    }

    tr.node-row.active {
      background: var(--highlight-bg);
    }

    .comm-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.5rem;
    }

    .sort-indicator {
      display: inline-block;
      margin-left: 0.25rem;
      width: 0.75rem;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      padding: 0.5rem 0.75rem;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      border-radius: 4px;
      font-size: 0.75rem;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>Community Network explorer</h1>
    <p>Synced community detection, hulls, and centrality metrics</p>
  </div>
  <div class="stats" id="global-stats">
    <!-- Filled by JS -->
  </div>
</header>

<main>
  <div id="viz-container">
    <svg id="viz"></svg>
  </div>
  <div id="table-container">
    <table>
      <thead>
        <tr id="table-head">
          <th data-key="name">Node</th>
          <th data-key="degree" class="num">Degree <span class="sort-indicator"></span></th>
          <th data-key="betweenness" class="num">Betweenness <span class="sort-indicator"></span></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</main>

<script>
/**
 * COMMUNITY DETECTION & TABLE SYNC V1
 * Features:
 * - Brandes' Algorithm for Betweenness Centrality
 * - D3 Force Simulation with Community Constraints
 * - Grouped Table with Multi-Level Highlighting
 * - Organic Hull Rendering
 */

const CONFIG = {
  nodeCount: 100,
  commCount: 5,
  commSizes: [28, 22, 18, 17, 15],
  colors: [
    '#3b82f6', // blue
    '#10b981', // emerald
    '#f59e0b', // amber
    '#ef4444', // red
    '#8b5cf6'  // violet
  ],
  commNames: ['Alpha Sector', 'Beta Cluster', 'Gamma Node', 'Delta Group', 'Epsilon Hub']
};

// --- DATA GENERATION & ANALYSIS ---

function generateData() {
  const nodes = [];
  const edges = [];
  const rng = d3.randomLcg(42);

  // 1. Create Nodes
  let id = 0;
  CONFIG.commSizes.forEach((size, ci) => {
    for (let i = 0; i < size; i++) {
      nodes.push({
        id: id++,
        index: id-1,
        name: `Node ${String.fromCharCode(65 + ci)}${i + 1}`,
        community: ci,
        degree: 0,
        betweenness: 0
      });
    }
  });

  // 2. Create Edges (Stochastic Block Model approach)
  const matrix = nodes.map(() => []);
  const addEdge = (u, v) => {
    if (u === v) return;
    const key = u < v ? `${u}-${v}` : `${v}-${u}`;
    if (matrix[u].includes(v)) return;
    matrix[u].push(v);
    matrix[v].push(u);
    edges.push({ source: u, target: v });
    nodes[u].degree++;
    nodes[v].degree++;
  };

  // Internal edges (high probability)
  nodes.forEach(u => {
    nodes.forEach(v => {
      if (u.id < v.id && u.community === v.community) {
        if (rng() < 0.25) addEdge(u.id, v.id);
      }
    });
  });

  // External edges (low probability)
  for (let i = 0; i < 60; i++) {
    const u = Math.floor(rng() * nodes.length);
    const v = Math.floor(rng() * nodes.length);
    if (nodes[u].community !== nodes[v].community) {
      addEdge(u, v);
    }
  }

  // 3. Centrality calculation (Brandes' Algorithm)
  const N = nodes.length;
  const cb = new Float64Array(N);
  
  for (let s = 0; s < N; s++) {
    const stack = [];
    const P = Array.from({ length: N }, () => []);
    const sigma = new Float64Array(N);
    const d = new Int32Array(N).fill(-1);
    
    sigma[s] = 1;
    d[s] = 0;
    
    const Q = [s];
    while (Q.length > 0) {
      const v = Q.shift();
      stack.push(v);
      for (const w of matrix[v]) {
        if (d[w] < 0) {
          d[w] = d[v] + 1;
          Q.push(w);
        }
        if (d[w] === d[v] + 1) {
          sigma[w] += sigma[v];
          P[w].push(v);
        }
      }
    }
    
    const delta = new Float64Array(N);
    while (stack.length > 0) {
      const w = stack.pop();
      for (const v of P[w]) {
        delta[v] += (sigma[v] / sigma[w]) * (1 + delta[w]);
      }
      if (w !== s) cb[w] += delta[w];
    }
  }
  
  // Normalize and assign
  nodes.forEach((n, i) => {
    n.betweenness = cb[i] / 2; // Undirected graph
  });

  return { nodes, edges };
}

const { nodes, edges } = generateData();

// --- INITIALIZATION ---

const dispatch = d3.dispatch('hoverNode', 'hoverComm', 'clickNode', 'clickComm');
const container = d3.select('#viz-container');
const svg = d3.select('#viz');
const tooltip = d3.select('body').append('div').attr('class', 'tooltip').style('opacity', 0);

let width, height;
function updateSize() {
  const rect = container.node().getBoundingClientRect();
  width = rect.width;
  height = rect.height;
  svg.attr('viewBox', [0, 0, width, height]);
}
updateSize();
window.addEventListener('resize', () => {
  updateSize();
  simulation.force('center', d3.forceCenter(width / 2, height / 2)).alpha(0.3).restart();
});

// --- SIMULATION ---

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(d => d.source.community === d.target.community ? 30 : 100))
  .force('charge', d3.forceManyBody().strength(-80))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('x', d3.forceX(width / 2).strength(0.05))
  .force('y', d3.forceY(height / 2).strength(0.05))
  .force('collide', d3.forceCollide().radius(d => Math.sqrt(d.degree) * 3 + 4));

// --- RENDERING ---

const g = svg.append('g');

const link = g.append('g')
  .attr('class', 'links')
  .selectAll('line')
  .data(edges)
  .join('line')
  .attr('class', 'link');

const hullG = g.append('g').attr('class', 'hulls');

const node = g.append('g')
  .attr('class', 'nodes')
  .selectAll('circle')
  .data(nodes)
  .join('circle')
  .attr('class', 'node')
  .attr('r', d => Math.sqrt(d.degree) * 2 + 3)
  .attr('fill', d => CONFIG.colors[d.community])
  .call(d3.drag()
    .on('start', dragstarted)
    .on('drag', dragged)
    .on('end', dragended));

node.on('mouseenter', (e, d) => {
  dispatch.call('hoverNode', null, d);
  showTooltip(e, `<strong>${d.name}</strong><br/>Degree: ${d.degree}<br/>Betweenness: ${d.betweenness.toFixed(1)}`);
})
.on('mouseleave', () => {
  dispatch.call('hoverNode', null, null);
  hideTooltip();
})
.on('click', (e, d) => {
  e.stopPropagation();
  dispatch.call('clickNode', null, d);
});

svg.on('click', () => dispatch.call('clickNode', null, null));

// --- HULLS ---

const hullLine = d3.line().curve(d3.curveCatmullRomClosed);

function updateHulls() {
  const hulls = [];
  for (let i = 0; i < CONFIG.commCount; i++) {
    const commNodes = nodes.filter(d => d.community === i);
    const points = [];
    commNodes.forEach(d => {
      // Create a small circle of points around each node to make hull more robust
      const r = Math.sqrt(d.degree) * 2 + 8;
      for (let a = 0; a < 2 * Math.PI; a += Math.PI / 4) {
        points.push([d.x + Math.cos(a) * r, d.y + Math.sin(a) * r]);
      }
    });
    const hull = d3.polygonHull(points);
    if (hull) hulls.push({ id: i, path: hullLine(hull) });
  }

  hullG.selectAll('path')
    .data(hulls, d => d.id)
    .join('path')
    .attr('class', 'hull')
    .attr('id', d => `hull-${d.id}`)
    .attr('d', d => d.path)
    .attr('fill', d => CONFIG.colors[d.id])
    .attr('stroke', d => CONFIG.colors[d.id]);
}

// --- TABLE ---

let sortKey = 'degree';
let sortOrder = -1; // -1 for desc

function renderTable() {
  const tbody = d3.select('#table-body');
  tbody.selectAll('*').remove();

  for (let ci = 0; ci < CONFIG.commCount; ci++) {
    const commNodes = nodes.filter(n => n.community === ci)
      .sort((a, b) => (a[sortKey] - b[sortKey]) * sortOrder);

    // Comm Header
    const head = tbody.append('tr')
      .attr('class', 'comm-header')
      .attr('id', `row-comm-${ci}`)
      .on('click', () => dispatch.call('clickComm', null, ci));
    
    head.append('td')
      .attr('colspan', 3)
      .html(`<span class="comm-dot" style="background:${CONFIG.colors[ci]}"></span> ${CONFIG.commNames[ci]} (${commNodes.length})`);

    // Node Rows
    commNodes.forEach(n => {
      const row = tbody.append('tr')
        .attr('class', 'node-row')
        .attr('id', `row-node-${n.id}`)
        .on('mouseenter', () => dispatch.call('hoverNode', null, n))
        .on('mouseleave', () => dispatch.call('hoverNode', null, null))
        .on('click', (e) => {
          e.stopPropagation();
          dispatch.call('clickNode', null, n);
        });

      row.append('td').text(n.name);
      row.append('td').attr('class', 'num').text(n.degree);
      row.append('td').attr('class', 'num').text(n.betweenness.toFixed(1));
    });
  }

  updateSortIndicators();
}

function updateSortIndicators() {
  d3.selectAll('th .sort-indicator').text('');
  d3.select(`th[data-key="${sortKey}"] .sort-indicator`).text(sortOrder === 1 ? '↑' : '↓');
}

d3.selectAll('th').on('click', function() {
  const key = d3.select(this).attr('data-key');
  if (sortKey === key) {
    sortOrder *= -1;
  } else {
    sortKey = key;
    sortOrder = -1;
  }
  renderTable();
});

renderTable();

// --- DISPATCH HANDLERS ---

dispatch.on('hoverNode', (d) => {
  if (d) {
    node.style('opacity', n => n.id === d.id || n.community === d.community ? 1 : 0.2);
    link.style('opacity', l => l.source.id === d.id || l.target.id === d.id ? 1 : 0.1);
    d3.select(`#row-node-${d.id}`).classed('active', true);
  } else {
    node.style('opacity', 1);
    link.style('opacity', 1);
    d3.selectAll('.node-row').classed('active', false);
  }
});

dispatch.on('clickNode', (d) => {
  if (d) {
    // Scroll table
    const el = document.getElementById(`row-node-${d.id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    
    // Highlight in viz
    node.transition().duration(300)
      .attr('r', n => n.id === d.id ? (Math.sqrt(n.degree) * 2 + 10) : (Math.sqrt(n.degree) * 2 + 3))
      .attr('stroke-width', n => n.id === d.id ? 4 : 1.5)
      .attr('stroke', n => n.id === d.id ? '#000' : '#fff');
    
    // Pulse animation
    d3.select(node.nodes()[d.index])
      .transition().duration(200).attr('r', Math.sqrt(d.degree) * 2 + 15)
      .transition().duration(200).attr('r', Math.sqrt(d.degree) * 2 + 10);
  } else {
    node.transition().duration(300)
      .attr('r', n => Math.sqrt(n.degree) * 2 + 3)
      .attr('stroke-width', 1.5)
      .attr('stroke', '#fff');
  }
});

dispatch.on('clickComm', (ci) => {
  const isActive = d3.select(`#hull-${ci}`).classed('active');
  d3.selectAll('.hull').classed('active', false);
  d3.selectAll('.comm-header').classed('active', false);
  
  if (!isActive) {
    d3.select(`#hull-${ci}`).classed('active', true);
    d3.select(`#row-comm-${ci}`).classed('active', true);
    
    // Zoom/pan towards community
    const commNodes = nodes.filter(n => n.community === ci);
    const x = d3.mean(commNodes, n => n.x);
    const y = d3.mean(commNodes, n => n.y);
    
    // We could add d3-zoom here, but keeping it simple with direct force adjustments
    simulation.force('x', d3.forceX(width / 2 + (width/2 - x) * 0.2).strength(0.1));
    simulation.force('y', d3.forceY(height / 2 + (height/2 - y) * 0.2).strength(0.1));
    simulation.alpha(0.3).restart();
  }
});

// --- FORCE TICK ---

simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);

  node
    .attr('cx', d => d.x)
    .attr('cy', d => d.y);

  updateHulls();
});

// --- UTILS ---

function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x;
  d.fy = d.y;
}

function dragged(event, d) {
  d.fx = event.x;
  d.fy = event.y;
}

function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null;
  d.fy = null;
}

function showTooltip(e, content) {
  tooltip.style('opacity', 1)
    .html(content)
    .style('left', (e.pageX + 10) + 'px')
    .style('top', (e.pageY - 10) + 'px');
}

function hideTooltip() {
  tooltip.style('opacity', 0);
}

// Global Stats
d3.select('#global-stats').html(`
  <div class="stat-item"><span>Nodes</span>${nodes.length}</div>
  <div class="stat-item"><span>Edges</span>${edges.length}</div>
  <div class="stat-item"><span>Comm</span>${CONFIG.commCount}</div>
  <div class="stat-item"><span>Avg Degree</span>${(edges.length * 2 / nodes.length).toFixed(1)}</div>
`);

</script>
</body>
</html>
