<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Flight Route Bundling</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson@3"></script>
  <style>
    :root {
      --bg: #0f172a;
      --text: #f8fafc;
      --muted: #64748b;
      --accent: #38bdf8;
      --panel: rgba(30, 41, 59, 0.7);
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1.5rem 2rem;
      z-index: 10;
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    p {
      margin: 0.25rem 0 0;
      font-size: 0.875rem;
      color: var(--muted);
    }
    #container {
      flex: 1;
      position: relative;
      width: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      background: var(--panel);
      backdrop-filter: blur(8px);
      padding: 1rem 1.5rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 280px;
      z-index: 20;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .control-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
    .legend {
      position: absolute;
      top: 2rem;
      right: 2rem;
      background: var(--panel);
      backdrop-filter: blur(8px);
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 20;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
    }
    .legend-color {
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 50%;
    }
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      display: none;
      z-index: 30;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body>
  <header>
    <h1>US Flight Route Bundling</h1>
    <p>Hierarchical edge bundling of ~200 routes between 50 major airports.</p>
  </header>
  <div id="container">
    <canvas id="viz"></canvas>
    <div id="tooltip"></div>
    <div class="controls">
      <div class="control-group">
        <div class="control-label">
          <span>Bundle Tension</span>
          <span id="tension-val">0.85</span>
        </div>
        <input type="range" id="tension" min="0" max="1" step="0.01" value="0.85">
      </div>
      <div class="control-group" style="margin-top: 0.5rem;">
        <div style="font-size: 0.75rem; color: var(--muted); line-height: 1.4;">
          Hover an airport to isolate its routes. Use the slider to adjust bundling strength.
        </div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <script>
    const airports = [
      {id: "ATL", name: "Atlanta", lon: -84.42, lat: 33.64, region: "South"},
      {id: "LAX", name: "Los Angeles", lon: -118.41, lat: 33.94, region: "West"},
      {id: "ORD", name: "Chicago", lon: -87.91, lat: 41.98, region: "Midwest"},
      {id: "DFW", name: "Dallas", lon: -97.04, lat: 32.90, region: "South"},
      {id: "DEN", name: "Denver", lon: -104.67, lat: 39.86, region: "West"},
      {id: "JFK", name: "New York", lon: -73.78, lat: 40.64, region: "Northeast"},
      {id: "SFO", name: "San Francisco", lon: -122.37, lat: 37.62, region: "West"},
      {id: "SEA", name: "Seattle", lon: -122.31, lat: 47.45, region: "West"},
      {id: "LAS", name: "Las Vegas", lon: -115.15, lat: 36.08, region: "West"},
      {id: "MCO", name: "Orlando", lon: -81.31, lat: 28.43, region: "South"},
      {id: "EWR", name: "Newark", lon: -74.17, lat: 40.69, region: "Northeast"},
      {id: "CLT", name: "Charlotte", lon: -80.94, lat: 35.21, region: "South"},
      {id: "PHX", name: "Phoenix", lon: -112.01, lat: 33.43, region: "West"},
      {id: "IAH", name: "Houston", lon: -95.34, lat: 29.98, region: "South"},
      {id: "MIA", name: "Miami", lon: -80.29, lat: 25.79, region: "South"},
      {id: "MSP", name: "Minneapolis", lon: -93.22, lat: 44.88, region: "Midwest"},
      {id: "FLL", name: "Fort Lauderdale", lon: -80.15, lat: 26.07, region: "South"},
      {id: "DTW", name: "Detroit", lon: -83.35, lat: 42.21, region: "Midwest"},
      {id: "PHL", name: "Philadelphia", lon: -75.24, lat: 39.87, region: "Northeast"},
      {id: "LGA", name: "New York", lon: -73.87, lat: 40.77, region: "Northeast"},
      {id: "BWI", name: "Baltimore", lon: -76.67, lat: 39.18, region: "South"},
      {id: "SLC", name: "Salt Lake City", lon: -111.98, lat: 40.79, region: "West"},
      {id: "SAN", name: "San Diego", lon: -117.19, lat: 32.73, region: "West"},
      {id: "DCA", name: "Washington", lon: -77.04, lat: 38.85, region: "South"},
      {id: "IAD", name: "Washington", lon: -77.46, lat: 38.95, region: "South"},
      {id: "TPA", name: "Tampa", lon: -82.53, lat: 27.98, region: "South"},
      {id: "MDW", name: "Chicago", lon: -87.75, lat: 41.79, region: "Midwest"},
      {id: "PDX", name: "Portland", lon: -122.60, lat: 45.59, region: "West"},
      {id: "BNA", name: "Nashville", lon: -86.68, lat: 36.12, region: "South"},
      {id: "AUS", name: "Austin", lon: -97.67, lat: 30.19, region: "South"},
      {id: "STL", name: "St. Louis", lon: -90.37, lat: 38.75, region: "Midwest"},
      {id: "SJC", name: "San Jose", lon: -121.93, lat: 37.36, region: "West"},
      {id: "HOU", name: "Houston", lon: -95.28, lat: 29.65, region: "South"},
      {id: "MSY", name: "New Orleans", lon: -90.26, lat: 29.99, region: "South"},
      {id: "RDU", name: "Raleigh", lon: -78.79, lat: 35.88, region: "South"},
      {id: "MCI", name: "Kansas City", lon: -94.71, lat: 39.30, region: "Midwest"},
      {id: "SMF", name: "Sacramento", lon: -121.59, lat: 38.70, region: "West"},
      {id: "SNA", name: "Santa Ana", lon: -117.87, lat: 33.68, region: "West"},
      {id: "OAK", name: "Oakland", lon: -122.22, lat: 37.72, region: "West"},
      {id: "CLE", name: "Cleveland", lon: -81.85, lat: 41.41, region: "Midwest"},
      {id: "SAT", name: "San Antonio", lon: -98.47, lat: 29.53, region: "South"},
      {id: "IND", name: "Indianapolis", lon: -86.29, lat: 39.72, region: "Midwest"},
      {id: "PIT", name: "Pittsburgh", lon: -80.23, lat: 40.49, region: "Northeast"},
      {id: "CMH", name: "Columbus", lon: -82.89, lat: 40.00, region: "Midwest"},
      {id: "PBI", name: "West Palm Beach", lon: -80.10, lat: 26.68, region: "South"},
      {id: "CVG", name: "Cincinnati", lon: -84.66, lat: 39.05, region: "Midwest"},
      {id: "OKC", name: "Oklahoma City", lon: -97.60, lat: 35.39, region: "South"},
      {id: "SDF", name: "Louisville", lon: -85.73, lat: 38.17, region: "South"},
      {id: "MEM", name: "Memphis", lon: -89.98, lat: 35.04, region: "South"},
      {id: "OMA", name: "Omaha", lon: -95.89, lat: 41.30, region: "Midwest"}
    ];

    const regions = ["Northeast", "Midwest", "South", "West"];
    const regionColors = {
      "Northeast": "#fbbf24", // Amber
      "Midwest": "#34d399",   // Emerald
      "South": "#f87171",     // Red
      "West": "#818cf8"        // Indigo
    };

    // Initialize legend
    const legendEl = document.getElementById("legend");
    regions.forEach(r => {
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="legend-color" style="background: ${regionColors[r]}"></span>${r}`;
      legendEl.appendChild(item);
    });

    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");
    const tensionSlider = document.getElementById("tension");
    const tensionVal = document.getElementById("tension-val");
    const tooltip = document.getElementById("tooltip");

    let width, height;
    let projection, geoPath;
    let mapData;
    let routes = [];
    let hierarchy;
    let tension = 0.85;
    let hoveredAirport = null;

    async function init() {
      // Load US Map Data
      const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
      mapData = {
        states: topojson.feature(us, us.objects.states),
        outline: topojson.mesh(us, us.objects.nation)
      };

      // Generate Routes
      const routeSet = new Set();
      const hubs = airports.filter(a => ["ATL", "LAX", "ORD", "DFW", "DEN", "JFK"].includes(a.id));
      
      // Connect hubs
      for (let i = 0; i < hubs.length; i++) {
        for (let j = i + 1; j < hubs.length; j++) {
          routes.push({source: hubs[i].id, target: hubs[j].id});
          routeSet.add(`${hubs[i].id}-${hubs[j].id}`);
        }
      }

      // Add random routes
      while (routes.length < 200) {
        const a = airports[Math.floor(Math.random() * airports.length)];
        const b = airports[Math.floor(Math.random() * airports.length)];
        if (a.id !== b.id && !routeSet.has(`${a.id}-${b.id}`) && !routeSet.has(`${b.id}-${a.id}`)) {
          routes.push({source: a.id, target: b.id});
          routeSet.add(`${a.id}-${b.id}`);
        }
      }

      // Build Hierarchy for HEB
      const root = {
        name: "root",
        children: regions.map(r => ({
          name: r,
          children: airports.filter(a => a.region === r).map(a => ({
            name: a.id,
            airport: a
          }))
        }))
      };
      
      hierarchy = d3.hierarchy(root);
      const leafMap = new Map();
      hierarchy.leaves().forEach(l => leafMap.set(l.data.name, l));

      // Calculate route paths through hierarchy
      routes.forEach(route => {
        const start = leafMap.get(route.source);
        const end = leafMap.get(route.target);
        route.pathNodes = start.path(end);
      });

      // Count connections for airport sizing
      airports.forEach(a => {
        a.connections = routes.filter(r => r.source === a.id || r.target === a.id).length;
      });

      window.addEventListener("resize", resize);
      resize();

      tensionSlider.addEventListener("input", (e) => {
        tension = +e.target.value;
        tensionVal.textContent = tension.toFixed(2);
        render();
      });

      canvas.addEventListener("mousemove", handleMouseMove);
    }

    function resize() {
      width = canvas.offsetWidth;
      height = canvas.offsetHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);

      projection = d3.geoAlbersUsa()
        .fitSize([width, height], {type: "Sphere"})
        .scale(width * 1.1)
        .translate([width / 2, height / 2]);
        
      geoPath = d3.geoPath(projection);

      // Project airport coordinates
      airports.forEach(a => {
        const p = projection([a.lon, a.lat]);
        if (p) {
          a.x = p[0];
          a.y = p[1];
        } else {
          a.x = -100; a.y = -100; // Outside view
        }
      });

      // Update hierarchy node positions
      hierarchy.leaves().forEach(l => {
        l.x = l.data.airport.x;
        l.y = l.data.airport.y;
      });

      // Simple region/root positioning as average of leaves
      hierarchy.each(n => {
        if (!n.children) return;
        const leaves = n.leaves();
        n.x = d3.mean(leaves, d => d.x);
        n.y = d3.mean(leaves, d => d.y);
      });

      render();
    }

    function handleMouseMove(e) {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      let found = null;
      for (const a of airports) {
        const dx = a.x - mx;
        const dy = a.y - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 8) {
          found = a;
          break;
        }
      }

      if (found !== hoveredAirport) {
        hoveredAirport = found;
        if (hoveredAirport) {
          tooltip.style.display = "block";
          tooltip.style.left = `${e.clientX + 15}px`;
          tooltip.style.top = `${e.clientY + 15}px`;
          tooltip.innerHTML = `<strong>${hoveredAirport.name} (${hoveredAirport.id})</strong><br/>${hoveredAirport.region}<br/>${hoveredAirport.connections} routes`;
        } else {
          tooltip.style.display = "none";
        }
        render();
      } else if (hoveredAirport) {
        tooltip.style.left = `${e.clientX + 15}px`;
        tooltip.style.top = `${e.clientY + 15}px`;
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw Map
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 1;
      ctx.beginPath();
      geoPath.context(ctx)(mapData.states);
      ctx.stroke();

      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      geoPath.context(ctx)(mapData.outline);
      ctx.stroke();

      // 2. Draw Routes
      const line = d3.line()
        .x(d => d.x)
        .y(d => d.y)
        .curve(d3.curveBundle.beta(tension))
        .context(ctx);

      routes.forEach(r => {
        const isRelated = hoveredAirport && (r.source === hoveredAirport.id || r.target === hoveredAirport.id);
        
        if (hoveredAirport && !isRelated) {
          ctx.globalAlpha = 0.03;
          ctx.strokeStyle = "#475569";
          ctx.lineWidth = 0.5;
        } else if (isRelated) {
          ctx.globalAlpha = 0.8;
          ctx.strokeStyle = varToColor(r.source);
          ctx.lineWidth = 1.5;
        } else {
          ctx.globalAlpha = 0.15;
          ctx.strokeStyle = "#94a3b8";
          ctx.lineWidth = 0.8;
        }

        ctx.beginPath();
        line(r.pathNodes);
        ctx.stroke();
      });

      ctx.globalAlpha = 1;

      // 3. Draw Airports
      airports.forEach(a => {
        const isHovered = hoveredAirport && a.id === hoveredAirport.id;
        const isRelated = hoveredAirport && routes.some(r => 
          (r.source === hoveredAirport.id && r.target === a.id) || 
          (r.target === hoveredAirport.id && r.source === a.id)
        );

        const radius = isHovered ? 6 : (isRelated ? 4 : 2.5);
        
        ctx.fillStyle = regionColors[a.region];
        ctx.beginPath();
        ctx.arc(a.x, a.y, radius, 0, Math.PI * 2);
        ctx.fill();

        if (isHovered || isRelated) {
          ctx.strokeStyle = "white";
          ctx.lineWidth = isHovered ? 2 : 1;
          ctx.stroke();
        } else {
          ctx.strokeStyle = "rgba(0,0,0,0.5)";
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      });
    }

    function varToColor(airportId) {
      const a = airports.find(ap => ap.id === airportId);
      return regionColors[a.region];
    }

    init();
  </script>
</body>
</html>
