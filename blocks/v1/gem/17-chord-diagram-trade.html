<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Trade Flows - Chord Diagram</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --tooltip-bg: rgba(15, 23, 42, 0.9);
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #chart-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 1;
    }

    .tooltip {
      position: absolute;
      padding: 12px;
      background: var(--tooltip-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      pointer-events: none;
      font-size: 14px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .title-box {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin: 4px 0 0;
      font-size: 14px;
      color: #94a3b8;
    }

    .ribbon {
      transition: fill-opacity 0.2s ease;
    }

    .group-arc {
      cursor: pointer;
    }

    .tick line {
      stroke: #475569;
    }

    .tick text {
      fill: #94a3b8;
      font-size: 10px;
      font-weight: 500;
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      fill: #cbd5e1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="title-box">
    <h1>Global Trade Network</h1>
    <p>Annual Flow Volume (Billions USD)</p>
  </div>

  <div id="chart-container">
    <div id="tooltip" class="tooltip"></div>
  </div>

  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    const width = 800;
    const height = 800;
    const outerRadius = Math.min(width, height) * 0.5 - 100;
    const innerRadius = outerRadius - 20;

    const countries = [
      "USA", "China", "Germany", "Japan", "UK", 
      "France", "S. Korea", "India", "Canada", "Brazil"
    ];

    // Asymmetric trade matrix (billions USD)
    // Row = Exporter, Column = Importer
    const matrix = [
      [0, 150, 65, 75, 70, 45, 55, 35, 310, 40],   // USA
      [540, 0, 110, 140, 75, 55, 160, 95, 45, 60], // China
      [145, 115, 0, 30, 95, 120, 25, 20, 15, 25],  // Germany
      [150, 175, 25, 0, 15, 12, 55, 15, 15, 12],   // Japan
      [65, 35, 55, 15, 0, 50, 12, 15, 10, 8],      // UK
      [45, 30, 85, 12, 45, 0, 12, 10, 8, 10],      // France
      [85, 165, 15, 35, 12, 10, 0, 18, 10, 12],    // S. Korea
      [75, 25, 15, 8, 15, 8, 10, 0, 8, 10],        // India
      [385, 28, 10, 12, 10, 5, 8, 5, 0, 8],        // Canada
      [45, 65, 30, 15, 12, 12, 15, 15, 12, 0]      // Brazil
    ];

    const colors = [
      "#60a5fa", "#f87171", "#4ade80", "#fbbf24", "#818cf8",
      "#f472b6", "#2dd4bf", "#fb923c", "#a78bfa", "#94a3b8"
    ];

    const svg = d3.select("#chart-container")
      .append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`)
      .append("g")
      .attr("transform", `translate(${width / 2},${height / 2})`);

    const chord = d3.chord()
      .padAngle(0.05)
      .sortSubgroups(d3.descending);

    const arc = d3.arc()
      .innerRadius(innerRadius)
      .outerRadius(outerRadius);

    const ribbon = d3.ribbon()
      .radius(innerRadius);

    const chords = chord(matrix);

    // --- Arcs ---
    const group = svg.append("g")
      .selectAll("g")
      .data(chords.groups)
      .join("g")
      .attr("class", "group");

    const groupPath = group.append("path")
      .attr("class", "group-arc")
      .attr("fill", d => colors[d.index])
      .attr("stroke", d => d3.rgb(colors[d.index]).darker())
      .on("mouseover", (event, d) => highlightGroup(d.index, event))
      .on("mouseout", resetHighlight);

    // Animate arcs: grow from zero angle
    groupPath.transition()
      .duration(1000)
      .ease(d3.easeExpOut)
      .attrTween("d", d => {
        const i = d3.interpolate(d.startAngle, d.endAngle);
        return t => arc({ ...d, endAngle: i(t) });
      });

    // --- Labels ---
    group.append("text")
      .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
      .attr("class", "label")
      .attr("dy", ".35em")
      .attr("transform", d => `
        rotate(${d.angle * 180 / Math.PI - 90})
        translate(${outerRadius + 35})
        ${d.angle > Math.PI ? "rotate(180)" : ""}
      `)
      .attr("text-anchor", d => d.angle > Math.PI ? "end" : null)
      .text(d => countries[d.index])
      .style("opacity", 0)
      .transition()
      .delay(800)
      .duration(500)
      .style("opacity", 1);

    // --- Ticks ---
    const ticks = group.selectAll(".tick")
      .data(d => groupTicks(d, 100))
      .join("g")
      .attr("class", "tick")
      .attr("transform", d => `rotate(${d.angle * 180 / Math.PI - 90}) translate(${outerRadius},0)`);

    ticks.append("line")
      .attr("x2", 6)
      .style("opacity", 0)
      .transition()
      .delay(1000)
      .duration(500)
      .style("opacity", 1);

    ticks.append("text")
      .attr("x", 9)
      .attr("dy", ".35em")
      .attr("transform", d => d.angle > Math.PI ? "rotate(180) translate(-20)" : null)
      .attr("text-anchor", d => d.angle > Math.PI ? "end" : null)
      .text(d => d.value > 0 && d.value % 500 === 0 ? d.value : "")
      .style("opacity", 0)
      .transition()
      .delay(1200)
      .duration(500)
      .style("opacity", 1);

    // --- Chords (Ribbons) ---
    const ribbons = svg.append("g")
      .attr("fill-opacity", 0.6)
      .selectAll("path")
      .data(chords)
      .join("path")
      .attr("class", "ribbon")
      .attr("fill", d => colors[d.source.index])
      .attr("stroke", d => d3.rgb(colors[d.source.index]).darker())
      .style("opacity", 0);

    // Animate ribbons: appear after arcs
    ribbons.transition()
      .delay(1000)
      .duration(1500)
      .ease(d3.easePolyOut.exponent(3))
      .style("opacity", 1)
      .attrTween("d", d => {
        const iSource = d3.interpolate(d.source.startAngle, d.source.endAngle);
        const iTarget = d3.interpolate(d.target.startAngle, d.target.endAngle);
        return t => ribbon({
          source: { ...d.source, endAngle: iSource(t) },
          target: { ...d.target, endAngle: iTarget(t) }
        });
      });

    ribbons.on("mouseover", (event, d) => highlightRibbon(d, event))
      .on("mouseout", resetHighlight);

    // --- Helper Functions ---
    function groupTicks(d, step) {
      const k = (d.endAngle - d.startAngle) / d.value;
      return d3.range(0, d.value, step).map(value => ({
        value: value,
        angle: value * k + d.startAngle
      }));
    }

    const tooltip = d3.select("#tooltip");

    function highlightGroup(index, event) {
      ribbons.interrupt().transition().duration(200)
        .style("opacity", d => (d.source.index === index || d.target.index === index) ? 1 : 0.05);
      
      const exports = d3.sum(matrix[index]);
      const imports = d3.sum(matrix.map(row => row[index]));

      tooltip.style("opacity", 1)
        .html(`
          <div style="font-weight:bold; color:${colors[index]}; margin-bottom:4px">${countries[index]}</div>
          <div>Total Exports: <strong>$${exports}B</strong></div>
          <div>Total Imports: <strong>$${imports}B</strong></div>
        `)
        .style("left", (event.pageX + 15) + "px")
        .style("top", (event.pageY - 15) + "px");
    }

    function highlightRibbon(d, event) {
      ribbons.interrupt().transition().duration(200)
        .style("opacity", ribbonData => ribbonData === d ? 1 : 0.05);

      const src = countries[d.source.index];
      const tgt = countries[d.target.index];
      const val1 = matrix[d.source.index][d.target.index];
      const val2 = matrix[d.target.index][d.source.index];

      tooltip.style("opacity", 1)
        .html(`
          <div style="margin-bottom:8px">
            <span style="color:${colors[d.source.index]}">●</span> ${src} → ${tgt}: <strong>$${val1}B</strong>
          </div>
          <div>
            <span style="color:${colors[d.target.index]}">●</span> ${tgt} → ${src}: <strong>$${val2}B</strong>
          </div>
        `)
        .style("left", (event.pageX + 15) + "px")
        .style("top", (event.pageY - 15) + "px");
    }

    function resetHighlight() {
      ribbons.interrupt().transition().duration(400)
        .style("opacity", 1);
      tooltip.style("opacity", 0);
    }

    // Update tooltip position on mousemove
    d3.select("body").on("mousemove", (event) => {
      if (tooltip.style("opacity") > 0) {
        tooltip
          .style("left", (event.pageX + 15) + "px")
          .style("top", (event.pageY - 15) + "px");
      }
    });

  </script>
</body>
</html>
