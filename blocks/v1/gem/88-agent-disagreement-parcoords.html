<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agent Disagreement — Parallel Coordinates</title>
  <link rel="stylesheet" href="../../../style/d3-power-tools.css">
  <style>
    :root {
      --pc-height: 380px;
    }
    body {
      padding: var(--sp-4) var(--sp-6);
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: var(--sp-4);
    }
    .badge {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 2px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
    }
    .badge b {
      color: var(--color-cat-1);
    }

    #viz-container {
      display: flex;
      flex-direction: column;
      gap: var(--sp-6);
    }

    /* Parallel Coordinates Styles */
    #pc-wrapper {
      position: relative;
      height: var(--pc-height);
      user-select: none;
      background: var(--color-bg);
      border-radius: var(--radius);
      border: 1px solid var(--color-border-light);
    }
    #pc-canvas, #pc-svg {
      position: absolute;
      top: 0;
      left: 0;
    }
    #pc-svg {
      pointer-events: none;
    }
    #pc-svg .axis {
      pointer-events: all;
    }
    #pc-svg .brush {
      pointer-events: all;
    }
    .axis-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      fill: var(--color-text);
      cursor: default;
    }
    .axis text {
      font-size: 10px;
      fill: var(--color-text-muted);
    }
    .brush .selection {
      fill: var(--color-cat-1);
      fill-opacity: 0.12;
      stroke: var(--color-cat-1);
      stroke-width: 1.5px;
      stroke-dasharray: 2,2;
    }

    /* Table Styles */
    table {
      margin-top: var(--sp-2);
    }
    th {
      background: var(--color-bg);
      z-index: 10;
    }
    .spark-cell {
      width: 180px;
      padding: 4px 12px;
    }
    .sparkline-bg {
      fill: var(--color-surface);
    }
    .sparkline-full {
      fill: var(--color-text-faint);
      opacity: 0.15;
    }
    .sparkline-subset {
      fill: var(--color-cat-1);
    }
    
    .legend {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      margin-bottom: var(--sp-4);
    }
    .legend-gradient {
      width: 120px;
      height: 8px;
      border-radius: 4px;
    }
    .legend-label {
      font-size: 11px;
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .tooltip-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .tooltip-header {
      font-weight: 600;
      border-bottom: 1px solid var(--color-border-light);
      margin-bottom: 4px;
      padding-bottom: 2px;
    }
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 11px;
    }
    .tooltip-val {
      font-family: var(--font-mono);
      font-weight: 600;
    }

    [data-theme="dark"] .sparkline-bg { fill: #2a2a40; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Agent <b>Disagreement</b></h1>
      <p class="subtitle">Parallel coordinates of adversarial agent scores per block</p>
    </div>
    <div class="controls">
      <button class="active" id="btn-scores">Agent Scores</button>
      <button id="btn-delta">Score Deltas (v2−v1)</button>
      <div class="badge">
        Selected: <span id="count-brushed">84</span> / <span id="count-total">84</span>
      </div>
    </div>
  </div>

  <div id="viz-container">
    <div>
      <div class="legend">
        <span class="legend-label" id="legend-min">Low σ</span>
        <canvas class="legend-gradient" id="legend-canvas"></canvas>
        <span class="legend-label" id="legend-max">High σ</span>
      </div>
      <div id="pc-wrapper">
        <canvas id="pc-canvas"></canvas>
        <svg id="pc-svg"></svg>
      </div>
    </div>

    <div>
      <h2>Summary Statistics</h2>
      <table id="summary-table">
        <thead>
          <tr>
            <th>Agent / Metric</th>
            <th class="spark-cell">Selection vs Total Distribution</th>
            <th class="num">Min</th>
            <th class="num">Median</th>
            <th class="num">Max</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="../../../style/theme-switch.js"></script>
  <script>
    // ── Data Generation ───────────────────────────────────────────────
    const agentNames = ["Visual Critic", "Encoding Integrity", "Interaction Stress", "Perceptual Red Team", "Metamorphic"];
    const agentKeys = ["visual", "encoding", "interaction", "perceptual", "metamorphic"];
    
    // Seeded PRNG
    let _s = 88;
    const rand = () => { _s = (_s * 16807) % 2147483647; return (_s & 0x7fffffff) / 0x7fffffff; };
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const round1 = v => Math.round(v * 10) / 10;

    const archetypes = [
      { bias: [8,8,7,7,8], spread: [0.8,0.6,1.0,0.8,0.7] },
      { bias: [4,8,6,7,7], spread: [1.2,0.8,1.0,0.6,0.9] },
      { bias: [7,7,3,6,7], spread: [0.7,1.0,1.5,1.2,0.8] },
      { bias: [7,3,6,5,8], spread: [0.9,1.5,1.0,1.3,0.7] },
      { bias: [6,7,6,3,6], spread: [1.0,0.8,0.9,1.5,1.0] },
      { bias: [5,5,5,5,5], spread: [1.2,1.2,1.2,1.2,1.2] },
      { bias: [9,4,8,3,7], spread: [0.5,1.5,0.7,1.8,1.0] },
    ];

    function genScores(id) {
      const arch = archetypes[id % archetypes.length];
      return agentKeys.map((_, i) => round1(clamp(arch.bias[i] + (rand() - 0.5) * 2 * arch.spread[i], 1, 10)));
    }

    const blocks = Array.from({ length: 84 }, (_, i) => {
      const id = i + 1;
      const v1 = genScores(id);
      const v2 = v1.map((s, j) => {
        let adj = s;
        if (j === 1) adj += rand() * 1.5;
        if (j === 3) adj -= (rand() - 0.3) * 0.8;
        adj = adj * 0.85 + 10 * 0.15;
        return round1(clamp(adj, 1, 10));
      });
      const sigma = v => round1(d3.deviation(v));
      return {
        id,
        v1, v2,
        delta: v1.map((s, j) => round1(v2[j] - s)),
        sigmaV1: sigma(v1),
        sigmaV2: sigma(v2)
      };
    });

    // ── Configuration ───────────────────────────────────────────────
    let mode = "scores"; // or "delta"
    let brushedData = [...blocks];

    const margin = { top: 44, right: 60, bottom: 24, left: 60 };
    const wrapper = d3.select("#pc-wrapper");
    const width = wrapper.node().clientWidth - margin.left - margin.right;
    const height = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--pc-height")) - margin.top - margin.bottom;
    const dpr = window.devicePixelRatio || 1;

    // ── Scales & Colors ─────────────────────────────────────────────
    const scoreDims = [...agentKeys, "sigma"];
    const scoreLabels = [...agentNames, "Disagreement (σ)"];
    const deltaDims = agentKeys.map(k => `d_${k}`);
    const deltaLabels = agentNames.map(n => `Δ ${n}`);

    let dims, labels, x, y;

    const colorScores = d3.scaleSequential(d3.interpolateRdYlGn).domain([3, 0]); // Lower sigma is greener
    const colorDelta = d3.scaleSequential(d3.interpolatePuOr).domain([-2, 2]); // Positive is purple, negative is orange

    function updateScales() {
      dims = mode === "scores" ? scoreDims : deltaDims;
      labels = mode === "scores" ? scoreLabels : deltaLabels;

      x = d3.scalePoint().domain(dims).range([0, width]).padding(0.05);
      y = new Map();
      dims.forEach(dim => {
        const vals = blocks.map(b => getVal(b, dim));
        const ext = d3.extent(vals);
        const pad = (ext[1] - ext[0]) * 0.1 || 0.5;
        y.set(dim, d3.scaleLinear().domain([ext[0] - pad, ext[1] + pad]).range([height, 0]).nice());
      });
    }

    function getVal(b, dim) {
      if (mode === "scores") {
        if (dim === "sigma") return b.sigmaV2;
        return b.v2[agentKeys.indexOf(dim)];
      } else {
        return b.delta[agentKeys.indexOf(dim.replace("d_", ""))];
      }
    }

    function getColor(b) {
      if (mode === "scores") return colorScores(b.sigmaV2);
      return colorDelta(d3.mean(b.delta));
    }

    // ── Rendering ───────────────────────────────────────────────────
    const canvas = d3.select("#pc-canvas")
      .attr("width", (width + margin.left + margin.right) * dpr)
      .attr("height", (height + margin.top + margin.bottom) * dpr)
      .style("width", (width + margin.left + margin.right) + "px")
      .style("height", (height + margin.top + margin.bottom) + "px");
    const ctx = canvas.node().getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.translate(margin.left, margin.top);

    const svg = d3.select("#pc-svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom);
    const g = svg.append("g").attr("transform", `translate(${margin.left}, ${margin.top})`);

    const hitCanvas = document.createElement("canvas");
    hitCanvas.width = (width + margin.left + margin.right) * dpr;
    hitCanvas.height = (height + margin.top + margin.bottom) * dpr;
    const hitCtx = hitCanvas.getContext("2d", { willReadFrequently: true });
    hitCtx.scale(dpr, dpr);
    hitCtx.translate(margin.left, margin.top);

    const activeBrushes = new Map();

    function drawLines() {
      ctx.clearRect(-margin.left, -margin.top, width + margin.left + margin.right, height + margin.top + margin.bottom);
      hitCtx.clearRect(-margin.left, -margin.top, width + margin.left + margin.right, height + margin.top + margin.bottom);

      const brushedIds = new Set(brushedData.map(d => d.id));
      const hasBrush = activeBrushes.size > 0;

      // Unselected
      if (hasBrush) {
        ctx.globalAlpha = 0.05;
        ctx.lineWidth = 1;
        blocks.forEach(b => {
          if (!brushedIds.has(b.id)) {
            ctx.strokeStyle = getColor(b);
            renderPath(ctx, b);
          }
        });
      }

      // Selected
      ctx.globalAlpha = hasBrush ? 0.75 : 0.4;
      ctx.lineWidth = hasBrush ? 1.8 : 1.2;
      blocks.forEach(b => {
        if (brushedIds.has(b.id)) {
          ctx.strokeStyle = getColor(b);
          renderPath(ctx, b);
          
          // Hit test path
          hitCtx.lineWidth = 8;
          hitCtx.strokeStyle = `rgb(${(b.id >> 16) & 0xFF}, ${(b.id >> 8) & 0xFF}, ${b.id & 0xFF})`;
          renderPath(hitCtx, b);
        }
      });
    }

    function renderPath(context, b) {
      context.beginPath();
      dims.forEach((dim, i) => {
        const px = x(dim);
        const py = y.get(dim)(getVal(b, dim));
        if (i === 0) context.moveTo(px, py);
        else context.lineTo(px, py);
      });
      context.stroke();
    }

    function update() {
      brushedData = blocks.filter(b => {
        return Array.from(activeBrushes).every(([dim, range]) => {
          const val = getVal(b, dim);
          return val >= Math.min(...range) && val <= Math.max(...range);
        });
      });

      d3.select("#count-brushed").text(brushedData.length);
      drawLines();
      updateTable();
    }

    function buildAxes() {
      g.selectAll("*").remove();
      dims.forEach((dim, i) => {
        const xPos = x(dim);
        const axisG = g.append("g")
          .attr("class", "axis")
          .attr("transform", `translate(${xPos}, 0)`);

        axisG.call(d3.axisLeft(y.get(dim)).ticks(6).tickFormat(d3.format(mode === "delta" ? "+.1f" : ".1f")));

        axisG.append("text")
          .attr("class", "axis-label")
          .attr("y", -18)
          .attr("text-anchor", "middle")
          .text(labels[i]);

        const brush = d3.brushY()
          .extent([[-12, 0], [12, height]])
          .on("start brush end", (event) => {
            if (event.selection) {
              activeBrushes.set(dim, event.selection.map(y.get(dim).invert));
            } else {
              activeBrushes.delete(dim);
            }
            update();
          });

        axisG.append("g")
          .attr("class", "brush")
          .call(brush);
      });
    }

    // ── Summary Table ────────────────────────────────────────────────
    const tableBody = d3.select("#summary-table tbody");
    
    function initTable() {
      tableBody.selectAll("*").remove();
      const metrics = mode === "scores" 
        ? agentKeys.map((k, i) => ({ id: k, label: agentNames[i] })).concat({ id: "sigma", label: "Disagreement (σ)" })
        : agentKeys.map((k, i) => ({ id: `d_${k}`, label: `Δ ${agentNames[i]}` }));

      const rows = tableBody.selectAll("tr")
        .data(metrics)
        .enter()
        .append("tr");

      rows.append("td").style("font-weight", "600").text(d => d.label);
      
      rows.append("td").attr("class", "spark-cell")
        .append("svg")
        .attr("width", 160)
        .attr("height", 30)
        .each(function() {
          d3.select(this).append("rect").attr("class", "sparkline-bg").attr("width", 160).attr("height", 30).attr("rx", 3);
        });

      rows.append("td").attr("class", "num min-val");
      rows.append("td").attr("class", "num med-val");
      rows.append("td").attr("class", "num max-val");
    }

    function updateTable() {
      const rows = tableBody.selectAll("tr");
      rows.each(function(m) {
        const row = d3.select(this);
        const values = brushedData.map(b => getVal(b, m.id)).sort(d3.ascending);
        const allValues = blocks.map(b => getVal(b, m.id)).sort(d3.ascending);

        const fmt = d3.format(mode === "delta" ? "+.1f" : ".1f");
        row.select(".min-val").text(values.length ? fmt(d3.min(values)) : "-");
        row.select(".med-val").text(values.length ? fmt(d3.median(values)) : "-");
        row.select(".max-val").text(values.length ? fmt(d3.max(values)) : "-");

        const sparkSvg = row.select("svg");
        const sx = d3.scaleLinear().domain(y.get(m.id).domain()).range([4, 156]);
        const bins = d3.bin().domain(sx.domain()).thresholds(18);
        const fullBins = bins(allValues);
        const subsetBins = bins(values);
        
        const sy = d3.scaleLinear().domain([0, d3.max(fullBins, b => b.length)]).range([30, 5]);
        const area = d3.area().x(d => sx(d.x0)).y0(30).y1(d => sy(d.length)).curve(d3.curveBasis);

        let fullPath = sparkSvg.selectAll(".sparkline-full").data([fullBins]);
        fullPath.enter().append("path").attr("class", "sparkline-full").merge(fullPath).attr("d", area);

        let subsetPath = sparkSvg.selectAll(".sparkline-subset").data([subsetBins]);
        subsetPath.enter().append("path").attr("class", "sparkline-subset").merge(subsetPath).attr("d", area);
      });
    }

    // ── Tooltip ──────────────────────────────────────────────────────
    const tooltip = d3.select("#tooltip");

    d3.select("#pc-wrapper").on("mousemove", (event) => {
      const [mx, my] = d3.pointer(event);
      const pixel = hitCtx.getImageData(mx * dpr, my * dpr, 1, 1).data;
      const id = (pixel[0] << 16) | (pixel[1] << 8) | pixel[2];
      
      if (id > 0 && id <= blocks.length && pixel[3] > 0) {
        const b = blocks[id - 1];
        tooltip.classed("visible", true)
          .style("left", (event.pageX + 15) + "px")
          .style("top", (event.pageY - 10) + "px");
        
        let html = `<div class="tooltip-content"><div class="tooltip-header">Block ${b.id}</div>`;
        agentNames.forEach((name, i) => {
          const val = mode === "scores" ? b.v2[i] : b.delta[i];
          const fmt = d3.format(mode === "delta" ? "+.1f" : ".1f");
          html += `<div class="tooltip-row"><span>${name}</span><span class="tooltip-val">${fmt(val)}</span></div>`;
        });
        if (mode === "scores") {
          html += `<div class="tooltip-row" style="margin-top:4px; border-top:1px solid var(--color-border-light); padding-top:4px;">
            <span>Disagreement σ</span><span class="tooltip-val">${b.sigmaV2.toFixed(1)}</span></div>`;
        }
        html += `</div>`;
        tooltip.html(html);
      } else {
        tooltip.classed("visible", false);
      }
    });

    d3.select("#pc-wrapper").on("mouseleave", () => tooltip.classed("visible", false));

    // ── Legend ───────────────────────────────────────────────────────
    function drawLegend() {
      const lCanvas = document.getElementById("legend-canvas");
      const lCtx = lCanvas.getContext("2d");
      const scale = mode === "scores" ? colorScores : colorDelta;
      const [min, max] = mode === "scores" ? [3, 0] : [-2, 2];
      
      for (let i = 0; i < 120; i++) {
        const t = min + (max - min) * (i / 119);
        lCtx.fillStyle = scale(t);
        lCtx.fillRect(i, 0, 1, 8);
      }
      
      d3.select("#legend-min").text(mode === "scores" ? "High σ" : "-2.0 Δ");
      d3.select("#legend-max").text(mode === "scores" ? "Low σ" : "+2.0 Δ");
    }

    // ── Controls ─────────────────────────────────────────────────────
    d3.select("#btn-scores").on("click", function() {
      mode = "scores";
      d3.select(this).classed("active", true);
      d3.select("#btn-delta").classed("active", false);
      activeBrushes.clear();
      updateScales();
      buildAxes();
      initTable();
      drawLegend();
      update();
    });

    d3.select("#btn-delta").on("click", function() {
      mode = "delta";
      d3.select(this).classed("active", true);
      d3.select("#btn-scores").classed("active", false);
      activeBrushes.clear();
      updateScales();
      buildAxes();
      initTable();
      drawLegend();
      update();
    });

    // ── Initialize ──────────────────────────────────────────────────
    updateScales();
    buildAxes();
    initTable();
    drawLegend();
    update();

    window.addEventListener("resize", () => {
      const newWidth = wrapper.node().clientWidth - margin.left - margin.right;
      if (Math.abs(newWidth - width) < 10) return;
      location.reload();
    });

  </script>
</body>
</html>
