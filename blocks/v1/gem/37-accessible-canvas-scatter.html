<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Canvas Scatterplot</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --primary: #1a73e8;
      --bg: #ffffff;
      --text: #202124;
      --border: #dadce0;
      --focus: #1a73e8;
      --hover: #f1f3f4;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
    }

    button {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--hover);
    }

    button.active {
      background: #e8f0fe;
      border-color: var(--primary);
      color: var(--primary);
    }

    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .viz-frame {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
      height: 500px;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    canvas:focus {
      outline: none;
    }

    .table-container {
      height: 100%;
      overflow: auto;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.875rem;
    }

    th {
      position: sticky;
      top: 0;
      background: #f8f9fa;
      padding: 0.75rem;
      text-align: left;
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover {
      background: #f1f3f4;
    }

    th::after {
      content: ' ↕';
      opacity: 0.3;
      font-size: 0.75rem;
    }

    th.sort-asc::after { content: ' ↑'; opacity: 1; }
    th.sort-desc::after { content: ' ↓'; opacity: 1; }

    td {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    tr:hover td {
      background: var(--hover);
    }

    tr.focused td {
      background: #e8f0fe;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    .legend {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #5f6368;
      display: flex;
      justify-content: space-between;
    }

    .kbd-hint kbd {
      background: #f1f3f4;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.1rem 0.3rem;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Health vs. Wealth Explorer</h1>
      <p style="margin: 0.25rem 0 0; font-size: 0.875rem; color: #5f6368;">1,500 synthetic data points comparing income and life expectancy.</p>
    </div>
    <div class="controls">
      <button id="btn-chart" class="active" aria-pressed="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        Chart
      </button>
      <button id="btn-table" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        Table
      </button>
    </div>
  </header>

  <div class="viz-frame">
    <canvas id="scatterplot" width="900" height="500" tabindex="0" role="application" aria-label="Scatterplot of 1500 data points. Use arrow keys to navigate between points."></canvas>
    
    <div id="table-view" class="table-container hidden">
      <table id="data-table" role="grid" aria-label="Sortable data table of scatterplot points">
        <thead>
          <tr role="row">
            <th id="th-id" role="columnheader" tabindex="0">ID</th>
            <th id="th-income" role="columnheader" tabindex="0" class="num">Income (USD)</th>
            <th id="th-life" role="columnheader" tabindex="0" class="num">Life Expectancy</th>
            <th id="th-group" role="columnheader" tabindex="0">Region</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <div class="legend">
    <div class="kbd-hint">
      <kbd>←</kbd> <kbd>→</kbd> Navigate points (sorted by Income) • <kbd>Enter</kbd> Select • <kbd>Esc</kbd> Reset
    </div>
    <div id="status-region" class="sr-only" aria-live="polite"></div>
    <div id="selection-display">No point selected</div>
  </div>
</div>

<script>
  // --- Constants & Config ---
  const width = 900;
  const height = 500;
  const margin = { top: 30, right: 30, bottom: 50, left: 60 };
  const pointRadius = 4;
  const dpr = window.devicePixelRatio || 1;

  const canvas = document.getElementById('scatterplot');
  const ctx = canvas.getContext('2d');
  const statusRegion = document.getElementById('status-region');
  const selectionDisplay = document.getElementById('selection-display');

  // Set physical dimensions for high-DPI
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  ctx.scale(dpr, dpr);

  // --- Data Generation ---
  const regions = ['Americas', 'Europe', 'Africa', 'Asia', 'Oceania'];
  const colors = d3.scaleOrdinal(d3.schemeCategory10).domain(regions);

  const rawData = Array.from({ length: 1500 }, (_, i) => {
    const group = regions[Math.floor(Math.random() * regions.length)];
    // Base relationship: life expectancy increases with income, but with noise and diminishing returns
    const income = Math.max(500, Math.floor(d3.randomLogNormal(9, 1)()));
    const lifeExpectancy = Math.min(90, 45 + 10 * Math.log10(income) + d3.randomNormal(0, 5)());
    
    return {
      id: `P-${String(i).padStart(4, '0')}`,
      income: Math.round(income),
      lifeExpectancy: parseFloat(lifeExpectancy.toFixed(1)),
      region: group,
      color: colors(group)
    };
  });

  // Sort data by income for consistent arrow key navigation
  const data = [...rawData].sort((a, b) => a.income - b.income);

  // --- Scales ---
  const x = d3.scaleLog()
    .domain(d3.extent(data, d => d.income))
    .range([margin.left, width - margin.right])
    .nice();

  const y = d3.scaleLinear()
    .domain([30, 95])
    .range([height - margin.bottom, margin.top])
    .nice();

  // --- State ---
  let focusedIndex = -1;
  let selectedId = null;
  let view = 'chart';
  let sortKey = 'income';
  let sortAsc = true;

  // --- Rendering ---
  function render() {
    ctx.clearRect(0, 0, width, height);

    // Draw Axes
    drawAxes();

    // Draw Points
    data.forEach((d, i) => {
      const px = x(d.income);
      const py = y(d.lifeExpectancy);
      
      ctx.beginPath();
      ctx.arc(px, py, pointRadius, 0, 2 * Math.PI);
      ctx.fillStyle = d.color;
      ctx.globalAlpha = (selectedId === d.id || focusedIndex === i) ? 1.0 : 0.6;
      ctx.fill();
      
      // Subtle stroke for all points
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    });

    // Draw Focus Ring
    if (focusedIndex !== -1 && view === 'chart') {
      const d = data[focusedIndex];
      drawFocusRing(x(d.income), y(d.lifeExpectancy));
    }
  }

  function drawAxes() {
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#666';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';

    // X-axis
    const xTicks = x.ticks(10);
    const xFormat = x.tickFormat(10, "$.0s");
    
    ctx.beginPath();
    ctx.moveTo(margin.left, height - margin.bottom);
    ctx.lineTo(width - margin.right, height - margin.bottom);
    ctx.stroke();

    xTicks.forEach(t => {
      const tx = x(t);
      ctx.beginPath();
      ctx.moveTo(tx, height - margin.bottom);
      ctx.lineTo(tx, height - margin.bottom + 5);
      ctx.stroke();
      ctx.fillText(xFormat(t), tx, height - margin.bottom + 15);
    });
    
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('Income (USD, log scale)', width / 2, height - 10);

    // Y-axis
    const yTicks = y.ticks(10);
    
    ctx.beginPath();
    ctx.moveTo(margin.left, margin.top);
    ctx.lineTo(margin.left, height - margin.bottom);
    ctx.stroke();

    ctx.textAlign = 'right';
    ctx.font = '10px sans-serif';
    yTicks.forEach(t => {
      const ty = y(t);
      ctx.beginPath();
      ctx.moveTo(margin.left, ty);
      ctx.lineTo(margin.left - 5, ty);
      ctx.stroke();
      ctx.fillText(t, margin.left - 10, ty + 3);
    });

    ctx.save();
    ctx.translate(15, height / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('Life Expectancy (Years)', 0, 0);
    ctx.restore();
  }

  function drawFocusRing(cx, cy) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, pointRadius + 4, 0, 2 * Math.PI);
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 2]);
    // Animate dash offset if not reduced motion
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      ctx.lineDashOffset = -Date.now() / 50;
    }
    ctx.stroke();

    // Outer glow/contrast ring
    ctx.beginPath();
    ctx.arc(cx, cy, pointRadius + 6, 0, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.stroke();
    ctx.restore();
  }

  // --- Interaction Handlers ---
  function updateSelection(index, announce = true) {
    focusedIndex = index;
    if (index !== -1) {
      const d = data[index];
      selectedId = d.id;
      selectionDisplay.textContent = `${d.id}: Income ${d3.format("$,.0f")(d.income)}, Life Expectancy ${d.lifeExpectancy} yrs (${d.region})`;
      
      if (announce) {
        statusRegion.textContent = `Point ${index + 1} of ${data.length}: ${d.region}, income ${d3.format("$,.0f")(d.income)}, life expectancy ${d.lifeExpectancy} years.`;
      }
    } else {
      selectedId = null;
      selectionDisplay.textContent = 'No point selected';
      statusRegion.textContent = 'Selection cleared';
    }
    render();
    if (view === 'table') updateTableFocus();
  }

  canvas.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      updateSelection(Math.min(data.length - 1, focusedIndex + 1));
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      updateSelection(Math.max(0, focusedIndex - 1));
    } else if (e.key === 'Home') {
      e.preventDefault();
      updateSelection(0);
    } else if (e.key === 'End') {
      e.preventDefault();
      updateSelection(data.length - 1);
    } else if (e.key === 'Escape') {
      focusedIndex = -1;
      selectedId = null;
      updateSelection(-1);
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (focusedIndex !== -1) {
        statusRegion.textContent = `Selected: ${data[focusedIndex].id}`;
      }
    }
  });

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    // Simple hit detection
    const hitIndex = data.findIndex(d => {
      const dx = x(d.income) - mx;
      const dy = y(d.lifeExpectancy) - my;
      return Math.sqrt(dx*dx + dy*dy) < pointRadius + 2;
    });

    if (hitIndex !== -1 && hitIndex !== focusedIndex) {
      updateSelection(hitIndex, false); // Don't announce on hover
    }
  });

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    const hitIndex = data.findIndex(d => {
      const dx = x(d.income) - mx;
      const dy = y(d.lifeExpectancy) - my;
      return Math.sqrt(dx*dx + dy*dy) < pointRadius + 4;
    });

    if (hitIndex !== -1) {
      updateSelection(hitIndex);
      canvas.focus();
    }
  });

  // --- Table Logic ---
  const columns = [
    { key: 'id', label: 'ID' },
    { key: 'income', label: 'Income (USD)', format: d3.format("$,.0f") },
    { key: 'lifeExpectancy', label: 'Life Expectancy', format: d => d + ' yrs' },
    { key: 'region', label: 'Region' }
  ];

  function renderTable() {
    const tableData = [...data];
    if (sortKey) {
      tableData.sort((a, b) => {
        const va = a[sortKey];
        const vb = b[sortKey];
        return sortAsc ? d3.ascending(va, vb) : d3.descending(va, vb);
      });
    }

    const tbody = d3.select('#table-body');
    const rows = tbody.selectAll('tr')
      .data(tableData, d => d.id)
      .join('tr')
      .attr('role', 'row')
      .classed('focused', d => d.id === selectedId)
      .on('click', (e, d) => {
        const idx = data.findIndex(p => p.id === d.id);
        updateSelection(idx);
      });

    rows.selectAll('td')
      .data(d => columns.map(col => col.format ? col.format(d[col.key]) : d[col.key]))
      .join('td')
      .attr('role', 'gridcell')
      .text(d => d);
      
    // Sync sorting classes
    d3.selectAll('th').each(function() {
      const th = d3.select(this);
      const key = th.attr('id').replace('th-', '');
      // Map display IDs back to data keys
      const keyMap = { 'income': 'income', 'life': 'lifeExpectancy', 'group': 'region', 'id': 'id' };
      const actualKey = keyMap[key];
      
      th.classed('sort-asc', sortKey === actualKey && sortAsc);
      th.classed('sort-desc', sortKey === actualKey && !sortAsc);
    });
  }

  function updateTableFocus() {
    d3.selectAll('#table-body tr')
      .classed('focused', d => d.id === selectedId);
    
    const focusedRow = d3.select('#table-body tr.focused').node();
    if (focusedRow) {
      focusedRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  d3.selectAll('th').on('click', function() {
    const id = d3.select(this).attr('id').replace('th-', '');
    const keyMap = { 'income': 'income', 'life': 'lifeExpectancy', 'group': 'region', 'id': 'id' };
    const key = keyMap[id];
    
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = true;
    }
    
    statusRegion.textContent = `Table sorted by ${id} ${sortAsc ? 'ascending' : 'descending'}`;
    renderTable();
  });

  // Handle keyboard on headers
  d3.selectAll('th').on('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      this.click();
    }
  });

  // --- View Toggle ---
  document.getElementById('btn-chart').addEventListener('click', () => setView('chart'));
  document.getElementById('btn-table').addEventListener('click', () => setView('table'));

  function setView(v) {
    view = v;
    document.getElementById('btn-chart').classList.toggle('active', v === 'chart');
    document.getElementById('btn-chart').setAttribute('aria-pressed', v === 'chart');
    document.getElementById('btn-table').classList.toggle('active', v === 'table');
    document.getElementById('btn-table').setAttribute('aria-pressed', v === 'table');
    
    document.getElementById('scatterplot').classList.toggle('hidden', v !== 'chart');
    document.getElementById('table-view').classList.toggle('hidden', v !== 'table');
    
    if (v === 'table') {
      renderTable();
      updateTableFocus();
    } else {
      render();
    }
    
    statusRegion.textContent = `Switched to ${v} view`;
  }

  // Animation Loop for Focus Ring
  function animate() {
    if (focusedIndex !== -1 && view === 'chart') {
      render();
    }
    requestAnimationFrame(animate);
  }

  // Initialize
  render();
  animate();

</script>
</body>
</html>
