<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape-Morphing Timeline</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0a0a1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    margin-bottom: 0.5rem;
    color: #aab;
  }
  #chart {
    position: relative;
    width: 100%;
    max-width: 820px;
  }
  svg { display: block; width: 100%; height: auto; }
  .controls {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: 1rem;
    width: 100%;
    max-width: 820px;
  }
  .controls button {
    background: #1a1a2e;
    border: 1px solid #333;
    color: #ccc;
    padding: 0.4rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    min-width: 70px;
    transition: background 0.15s;
  }
  .controls button:hover { background: #252540; }
  .scrubber-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .scrubber-wrap input[type="range"] {
    flex: 1;
    accent-color: #6c8aff;
    height: 6px;
  }
  .shape-label {
    font-size: 0.8rem;
    color: #889;
    min-width: 50px;
    text-align: right;
  }
  .phase-indicators {
    display: flex;
    justify-content: space-between;
    max-width: 820px;
    width: 100%;
    padding: 0.3rem 5.5rem 0 5.5rem;
  }
  .phase-indicators span {
    font-size: 0.7rem;
    color: #556;
    transition: color 0.3s;
  }
  .phase-indicators span.active { color: #6c8aff; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0s !important; animation-duration: 0s !important; }
  }
</style>
</head>
<body>
<h1>Shape-Morphing Timeline</h1>
<div id="chart"></div>
<div class="phase-indicators">
  <span data-phase="0">Bar</span>
  <span data-phase="1">Line</span>
  <span data-phase="2">Area</span>
  <span data-phase="3">Scatter</span>
</div>
<div class="controls">
  <button id="playBtn">Pause</button>
  <div class="scrubber-wrap">
    <input type="range" id="scrubber" min="0" max="1000" value="0">
    <span class="shape-label" id="shapeLabel">Bar</span>
  </div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data: 24 months of revenue ---
const n = 24;
const data = Array.from({length: n}, (_, i) => {
  const date = new Date(2024, i);
  const trend = 40 + i * 2.2;
  const seasonal = 12 * Math.sin((i / 12) * Math.PI * 2 - Math.PI / 2);
  const noise = (Math.sin(i * 7.3) * 5 + Math.cos(i * 3.1) * 3);
  return { date, value: Math.max(5, trend + seasonal + noise), index: i };
});

// --- Layout ---
const width = 820, height = 420;
const margin = { top: 30, right: 30, bottom: 50, left: 55 };
const iw = width - margin.left - margin.right;
const ih = height - margin.top - margin.bottom;

const svg = d3.select("#chart").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("preserveAspectRatio", "xMidYMid meet");

const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// --- Scales ---
const x = d3.scaleTime()
  .domain(d3.extent(data, d => d.date))
  .range([0, iw]);

const xBand = d3.scaleBand()
  .domain(data.map(d => d.index))
  .range([0, iw])
  .padding(0.15);

const y = d3.scaleLinear()
  .domain([0, d3.max(data, d => d.value) * 1.1])
  .range([ih, 0])
  .nice();

// --- Axes ---
const xAxis = g.append("g").attr("transform", `translate(0,${ih})`);
const yAxis = g.append("g");

function drawAxes() {
  xAxis.call(d3.axisBottom(x).ticks(d3.timeMonth.every(3)).tickFormat(d3.timeFormat("%b '%y")))
    .call(g => g.select(".domain").attr("stroke", "#333"))
    .call(g => g.selectAll(".tick line").attr("stroke", "#333"))
    .call(g => g.selectAll(".tick text").attr("fill", "#778"));
  yAxis.call(d3.axisLeft(y).ticks(6).tickFormat(d => `$${d}`))
    .call(g => g.select(".domain").attr("stroke", "#333"))
    .call(g => g.selectAll(".tick line").attr("stroke", "#333"))
    .call(g => g.selectAll(".tick text").attr("fill", "#778"));
}
drawAxes();

// Gridlines
g.append("g").attr("class", "grid")
  .call(d3.axisLeft(y).ticks(6).tickSize(-iw).tickFormat(""))
  .call(g => g.select(".domain").remove())
  .call(g => g.selectAll(".tick line").attr("stroke", "#1a1a2e"));

// --- Color ---
const color = d3.scaleSequential(d3.interpolateViridis).domain([0, n - 1]);

// --- Shape geometries ---
// Resample a path string to N points
const NSAMPLE = 128;

function resamplePath(pathNode) {
  const len = pathNode.getTotalLength();
  return Array.from({length: NSAMPLE}, (_, i) => {
    const pt = pathNode.getPointAtLength((i / (NSAMPLE - 1)) * len);
    return [pt.x, pt.y];
  });
}

// Bar: each datum is a rect. For morphing, we resample the full composite path.
function barPoints() {
  // Build array of point-pairs forming the bar outlines as a single shape
  const pts = [];
  // Top edge left-to-right, then bottom edge right-to-left
  for (const d of data) {
    const bx = xBand(d.index);
    const bw = xBand.bandwidth();
    const by = y(d.value);
    // Top-left and top-right of each bar
    pts.push([bx, by], [bx + bw, by]);
  }
  // Close along baseline
  for (let i = data.length - 1; i >= 0; i--) {
    const bx = xBand(data[i].index);
    const bw = xBand.bandwidth();
    pts.push([bx + bw, ih], [bx, ih]);
  }
  return pts;
}

function linePoints() {
  return data.map(d => [x(d.date), y(d.value)]);
}

function areaTopPoints() {
  return data.map(d => [x(d.date), y(d.value)]);
}
function areaBottomPoints() {
  return data.slice().reverse().map(d => [x(d.date), ih]);
}
function areaPoints() {
  return [...areaTopPoints(), ...areaBottomPoints()];
}

function scatterPoints() {
  return data.map(d => [x(d.date), y(d.value)]);
}

// Resample any polygon to NSAMPLE points
function resamplePoly(pts, closed = true) {
  if (pts.length < 2) return pts;
  // Compute cumulative lengths
  const lengths = [0];
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i-1][0], dy = pts[i][1] - pts[i-1][1];
    lengths.push(lengths[i-1] + Math.sqrt(dx*dx + dy*dy));
  }
  if (closed) {
    const dx = pts[0][0] - pts[pts.length-1][0], dy = pts[0][1] - pts[pts.length-1][1];
    lengths.push(lengths[lengths.length-1] + Math.sqrt(dx*dx + dy*dy));
  }
  const totalLen = lengths[lengths.length - 1];
  if (totalLen === 0) return Array.from({length: NSAMPLE}, () => [...pts[0]]);

  const allPts = closed ? [...pts, pts[0]] : pts;
  const result = [];
  let seg = 0;
  for (let i = 0; i < NSAMPLE; i++) {
    const targetLen = (i / (NSAMPLE - 1)) * totalLen;
    while (seg < lengths.length - 2 && lengths[seg + 1] < targetLen) seg++;
    const segLen = lengths[seg + 1] - lengths[seg];
    const t = segLen === 0 ? 0 : (targetLen - lengths[seg]) / segLen;
    result.push([
      allPts[seg][0] + t * (allPts[seg + 1][0] - allPts[seg][0]),
      allPts[seg][1] + t * (allPts[seg + 1][1] - allPts[seg][1])
    ]);
  }
  return result;
}

// For scatter: shrink a circle of points around each data point
function scatterResampled() {
  const perPoint = Math.floor(NSAMPLE / n);
  const remainder = NSAMPLE - perPoint * n;
  const result = [];
  const r = 5;
  data.forEach((d, idx) => {
    const cx = x(d.date), cy = y(d.value);
    const count = perPoint + (idx < remainder ? 1 : 0);
    for (let j = 0; j < count; j++) {
      const angle = (j / count) * Math.PI * 2;
      result.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
    }
  });
  return result;
}

// Pre-compute resampled shapes
const shapes = {
  bar: resamplePoly(barPoints(), true),
  line: resamplePoly(linePoints(), false),
  area: resamplePoly(areaPoints(), true),
  scatter: scatterResampled()
};

// --- Drawing layer ---
const morphPath = g.append("path")
  .attr("fill", "none")
  .attr("stroke", "#6c8aff")
  .attr("stroke-width", 2);

const morphFill = g.append("path")
  .attr("fill", "rgba(108,138,255,0.15)")
  .attr("stroke", "none");

// Scatter dots layer
const dotsGroup = g.append("g");

// Bar rects layer
const barsGroup = g.append("g");

// --- Phases: 0=bar, 1=line, 2=area, 3=scatter ---
const phaseNames = ["Bar", "Line", "Area", "Scatter"];
const phaseDuration = 250; // each phase spans 250 units on the 0-1000 scrubber

function pointsToPath(pts) {
  if (pts.length === 0) return "";
  return "M" + pts.map(p => `${p[0]},${p[1]}`).join("L");
}

function closedPath(pts) {
  return pointsToPath(pts) + "Z";
}

function lerpPoints(a, b, t) {
  return a.map((p, i) => [
    p[0] + (b[i][0] - p[0]) * t,
    p[1] + (b[i][1] - p[1]) * t
  ]);
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

function render(scrubVal) {
  // scrubVal: 0-1000
  // phases: 0-250=bar→line, 250-500=line→area, 500-750=area→scatter, 750-1000=scatter (hold)
  const phaseOrder = ["bar", "line", "area", "scatter"];

  let fromIdx, toIdx, t;
  if (scrubVal <= 0) {
    fromIdx = 0; toIdx = 0; t = 0;
  } else if (scrubVal >= 1000) {
    fromIdx = 3; toIdx = 3; t = 0;
  } else {
    // 3 transitions across 0-1000
    const transitionSpan = 1000 / 3;
    const rawPhase = scrubVal / transitionSpan;
    fromIdx = Math.min(Math.floor(rawPhase), 2);
    toIdx = fromIdx + 1;
    t = easeInOut(rawPhase - fromIdx);
  }

  const fromShape = phaseOrder[fromIdx];
  const toShape = phaseOrder[toIdx];
  const pts = fromIdx === toIdx ? shapes[fromShape] : lerpPoints(shapes[fromShape], shapes[toShape], t);

  // Determine visual style based on current dominant phase
  const dominantIdx = t < 0.5 ? fromIdx : toIdx;
  const dominant = phaseOrder[dominantIdx];

  // Fade factors for each element type
  const barOpacity = dominant === "bar" ? 1 : (fromShape === "bar" || toShape === "bar") ? (fromShape === "bar" ? 1 - t : t) : 0;
  const fillOpacity = (dominant === "area" || dominant === "bar") ? 0.18 : (fromShape === "area" || toShape === "area") ? 0.18 * (fromShape === "area" ? 1 - t : t) : 0;
  const strokeOpacity = (dominant === "line" || dominant === "area") ? 1 : (dominant === "scatter") ? 1 - t * 0.5 : 0.6;
  const scatterOpacity = dominant === "scatter" ? 1 : (toShape === "scatter") ? t : (fromShape === "scatter") ? 1 - t : 0;

  // Draw bars
  barsGroup.selectAll("rect").data(dominant === "bar" || barOpacity > 0 ? data : [])
    .join("rect")
    .attr("x", d => xBand(d.index))
    .attr("width", xBand.bandwidth())
    .attr("y", d => {
      if (barOpacity >= 1) return y(d.value);
      // During transition, interpolate from full bar to line position
      const lineY = y(d.value);
      return lineY;
    })
    .attr("height", d => {
      const h = ih - y(d.value);
      return h * barOpacity;
    })
    .attr("fill", d => color(d.index))
    .attr("opacity", barOpacity * 0.85)
    .attr("rx", 2);

  // Draw morph path (line/area outline)
  if (dominant === "bar" && t === 0) {
    morphPath.attr("d", null);
    morphFill.attr("d", null);
  } else if (dominant === "scatter" && t >= 0.95) {
    morphPath.attr("d", null);
    morphFill.attr("d", null);
  } else {
    // For line-like shapes, draw as open path
    const isClosed = (dominant === "area" || dominant === "bar");

    if (isClosed) {
      morphFill.attr("d", closedPath(pts)).attr("fill-opacity", fillOpacity);
      morphPath.attr("d", closedPath(pts));
    } else {
      // Line or scatter transition - just top edge
      const topPts = pts.slice(0, Math.floor(NSAMPLE / 2));
      morphPath.attr("d", pointsToPath(topPts));
      morphFill.attr("d", null);
    }
    morphPath.attr("stroke-opacity", strokeOpacity)
      .attr("stroke", "#6c8aff")
      .attr("stroke-width", 2.5);
  }

  // Draw scatter dots
  dotsGroup.selectAll("circle").data(scatterOpacity > 0 ? data : [])
    .join("circle")
    .attr("cx", d => x(d.date))
    .attr("cy", d => y(d.value))
    .attr("r", 5 * scatterOpacity)
    .attr("fill", d => color(d.index))
    .attr("opacity", scatterOpacity * 0.9)
    .attr("stroke", "#0a0a1a")
    .attr("stroke-width", 1.5);

  // Phase label
  const currentPhase = t < 0.5 ? fromIdx : toIdx;
  document.getElementById("shapeLabel").textContent = phaseNames[currentPhase];
  document.querySelectorAll(".phase-indicators span").forEach(el => {
    el.classList.toggle("active", +el.dataset.phase === currentPhase);
  });
}

// --- Better approach: render each shape type directly with interpolated opacity ---
// Override render with a cleaner version that morphs between chart types visually

function renderClean(scrubVal) {
  const transitionSpan = 1000 / 3;
  let phase, t;
  if (scrubVal <= 0) { phase = 0; t = 0; }
  else if (scrubVal >= 1000) { phase = 3; t = 0; }
  else {
    const raw = scrubVal / transitionSpan;
    phase = Math.min(Math.floor(raw), 2);
    t = easeInOut(Math.min(raw - phase, 1));
  }

  const currentPhase = t <= 0.5 ? phase : Math.min(phase + 1, 3);

  // Phase 0→1: bar to line
  // Phase 1→2: line to area
  // Phase 2→3: area to scatter

  // Bar opacity
  let barOp = 0;
  if (phase === 0) barOp = 1 - t;

  // Line stroke
  let lineOp = 0;
  if (phase === 0) lineOp = t;
  else if (phase === 1) lineOp = 1;
  else if (phase === 2) lineOp = 1 - t * 0.7;

  // Area fill
  let areaOp = 0;
  if (phase === 1) areaOp = t;
  else if (phase === 2) areaOp = 1 - t;

  // Scatter dots
  let dotOp = 0;
  if (phase === 2) dotOp = t;
  else if (phase === 3) dotOp = 1;

  // Bars
  barsGroup.selectAll("rect").data(data)
    .join("rect")
    .attr("x", d => xBand(d.index))
    .attr("width", xBand.bandwidth())
    .attr("y", d => y(d.value))
    .attr("height", d => ih - y(d.value))
    .attr("fill", d => color(d.index))
    .attr("rx", 2)
    .attr("opacity", barOp * 0.85);

  // Line
  const lineGen = d3.line().x(d => x(d.date)).y(d => y(d.value)).curve(d3.curveMonotoneX);
  morphPath.attr("d", lineGen(data))
    .attr("stroke", "#6c8aff")
    .attr("stroke-width", 2.5)
    .attr("fill", "none")
    .attr("stroke-opacity", lineOp);

  // Area
  const areaGen = d3.area().x(d => x(d.date)).y0(ih).y1(d => y(d.value)).curve(d3.curveMonotoneX);
  morphFill.attr("d", areaGen(data))
    .attr("fill", "rgba(108,138,255,0.22)")
    .attr("stroke", "none")
    .attr("fill-opacity", areaOp);

  // Scatter
  dotsGroup.selectAll("circle").data(data)
    .join("circle")
    .attr("cx", d => x(d.date))
    .attr("cy", d => y(d.value))
    .attr("r", 5.5)
    .attr("fill", d => color(d.index))
    .attr("stroke", "#0a0a1a")
    .attr("stroke-width", 1.5)
    .attr("opacity", dotOp * 0.9);

  // Labels
  document.getElementById("shapeLabel").textContent = phaseNames[currentPhase];
  document.querySelectorAll(".phase-indicators span").forEach(el => {
    el.classList.toggle("active", +el.dataset.phase === currentPhase);
  });
}

// --- Playback ---
const scrubber = document.getElementById("scrubber");
const playBtn = document.getElementById("playBtn");
let playing = true;
let scrubVal = 0;
const speed = 0.4; // units per ms

playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) lastTime = null;
});

scrubber.addEventListener("input", () => {
  scrubVal = +scrubber.value;
  playing = false;
  playBtn.textContent = "Play";
  renderClean(scrubVal);
});

let lastTime = null;
function tick(now) {
  if (playing) {
    if (lastTime !== null) {
      scrubVal += (now - lastTime) * speed;
      if (scrubVal > 1000) {
        scrubVal = 0; // loop
      }
      scrubber.value = scrubVal;
    }
    lastTime = now;
    renderClean(scrubVal);
  } else {
    lastTime = null;
  }
  requestAnimationFrame(tick);
}

// Respect prefers-reduced-motion
const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (prefersReduced) {
  playing = false;
  playBtn.textContent = "Play";
}

renderClean(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
