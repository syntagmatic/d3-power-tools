<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>US Flight Route Bundling</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #0a0e17; color: #ccc; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
  h1 { font-size: 15px; font-weight: 500; margin: 12px 0 4px; color: #8899bb; letter-spacing: 0.5px; }
  .controls { display: flex; gap: 18px; align-items: center; font-size: 12px; margin-bottom: 6px; color: #667; }
  .controls label { display: flex; align-items: center; gap: 6px; }
  .controls input[type=range] { width: 140px; accent-color: #4af; }
  .container { position: relative; flex: 1; width: 100%; }
  canvas, svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  svg { pointer-events: none; }
  .tooltip { position: absolute; background: rgba(10,14,23,0.92); border: 1px solid #335; color: #aac; font-size: 12px; padding: 5px 9px; border-radius: 4px; pointer-events: none; display: none; white-space: nowrap; }
</style>
</head>
<body>
<h1>US Flight Route Bundling — 50 Airports, 200 Routes</h1>
<div class="controls">
  <label>Tension <input type="range" id="tensionSlider" min="0" max="1" step="0.01" value="0.15"> <span id="tensionVal">0.15</span></label>
  <span id="info" style="color:#556"></span>
</div>
<div class="container" id="container">
  <div class="tooltip" id="tooltip"></div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

// ── Synthetic airport data (50 US airports with approximate coords) ──
const airports = [
  {id:"ATL",name:"Atlanta",lon:-84.43,lat:33.64,region:"SE"},
  {id:"ORD",name:"Chicago O'Hare",lon:-87.90,lat:41.97,region:"MW"},
  {id:"DFW",name:"Dallas/Fort Worth",lon:-97.04,lat:32.90,region:"SC"},
  {id:"DEN",name:"Denver",lon:-104.67,lat:39.86,region:"MW"},
  {id:"JFK",name:"New York JFK",lon:-73.78,lat:40.64,region:"NE"},
  {id:"LAX",name:"Los Angeles",lon:-118.41,lat:33.94,region:"WE"},
  {id:"SFO",name:"San Francisco",lon:-122.38,lat:37.62,region:"WE"},
  {id:"SEA",name:"Seattle",lon:-122.31,lat:47.45,region:"WE"},
  {id:"MIA",name:"Miami",lon:-80.29,lat:25.79,region:"SE"},
  {id:"BOS",name:"Boston",lon:-71.01,lat:42.36,region:"NE"},
  {id:"MSP",name:"Minneapolis",lon:-93.22,lat:44.88,region:"MW"},
  {id:"DTW",name:"Detroit",lon:-83.35,lat:42.21,region:"MW"},
  {id:"PHX",name:"Phoenix",lon:-112.01,lat:33.43,region:"WE"},
  {id:"LAS",name:"Las Vegas",lon:-115.15,lat:36.08,region:"WE"},
  {id:"IAH",name:"Houston",lon:-95.34,lat:29.98,region:"SC"},
  {id:"CLT",name:"Charlotte",lon:-80.94,lat:35.21,region:"SE"},
  {id:"EWR",name:"Newark",lon:-74.17,lat:40.69,region:"NE"},
  {id:"MCO",name:"Orlando",lon:-81.31,lat:28.43,region:"SE"},
  {id:"PHL",name:"Philadelphia",lon:-75.24,lat:39.87,region:"NE"},
  {id:"SAN",name:"San Diego",lon:-117.19,lat:32.73,region:"WE"},
  {id:"SLC",name:"Salt Lake City",lon:-111.98,lat:40.79,region:"WE"},
  {id:"DCA",name:"Washington Reagan",lon:-77.04,lat:38.85,region:"NE"},
  {id:"IAD",name:"Washington Dulles",lon:-77.46,lat:38.95,region:"NE"},
  {id:"TPA",name:"Tampa",lon:-82.53,lat:27.98,region:"SE"},
  {id:"PDX",name:"Portland",lon:-122.60,lat:45.59,region:"WE"},
  {id:"STL",name:"St. Louis",lon:-90.37,lat:38.75,region:"MW"},
  {id:"BNA",name:"Nashville",lon:-86.68,lat:36.12,region:"SE"},
  {id:"AUS",name:"Austin",lon:-97.67,lat:30.19,region:"SC"},
  {id:"RDU",name:"Raleigh-Durham",lon:-78.79,lat:35.88,region:"SE"},
  {id:"MCI",name:"Kansas City",lon:-94.71,lat:39.30,region:"MW"},
  {id:"SMF",name:"Sacramento",lon:-121.59,lat:38.70,region:"WE"},
  {id:"CLE",name:"Cleveland",lon:-81.85,lat:41.41,region:"MW"},
  {id:"IND",name:"Indianapolis",lon:-86.29,lat:39.72,region:"MW"},
  {id:"PIT",name:"Pittsburgh",lon:-80.23,lat:40.50,region:"NE"},
  {id:"CMH",name:"Columbus",lon:-82.89,lat:39.99,region:"MW"},
  {id:"OAK",name:"Oakland",lon:-122.22,lat:37.72,region:"WE"},
  {id:"ABQ",name:"Albuquerque",lon:-106.61,lat:35.04,region:"WE"},
  {id:"OMA",name:"Omaha",lon:-95.89,lat:41.30,region:"MW"},
  {id:"RNO",name:"Reno",lon:-119.77,lat:39.50,region:"WE"},
  {id:"MEM",name:"Memphis",lon:-89.98,lat:35.04,region:"SE"},
  {id:"JAX",name:"Jacksonville",lon:-81.69,lat:30.49,region:"SE"},
  {id:"BDL",name:"Hartford",lon:-72.68,lat:41.94,region:"NE"},
  {id:"MSY",name:"New Orleans",lon:-90.26,lat:29.99,region:"SC"},
  {id:"SAT",name:"San Antonio",lon:-98.47,lat:29.53,region:"SC"},
  {id:"OKC",name:"Oklahoma City",lon:-97.60,lat:35.39,region:"SC"},
  {id:"CVG",name:"Cincinnati",lon:-84.67,lat:39.05,region:"MW"},
  {id:"BUF",name:"Buffalo",lon:-78.73,lat:42.94,region:"NE"},
  {id:"HNL",name:"Honolulu",lon:-157.92,lat:21.32,region:"WE"},
  {id:"ANC",name:"Anchorage",lon:-149.99,lat:61.17,region:"WE"},
  {id:"BOI",name:"Boise",lon:-116.22,lat:43.56,region:"WE"},
];

// ── Generate 200 routes deterministically ──
function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 16807 + 0) % 2147483647; return s / 2147483647; };
}

const rng = seededRandom(42);
const hubs = ["ATL","ORD","DFW","DEN","JFK","LAX","SFO","SEA","MIA","IAH"];
const routeSet = new Set();
const routes = [];

// Hub routes first
for (const hub of hubs) {
  for (const ap of airports) {
    if (ap.id !== hub && routes.length < 140 && !routeSet.has([hub,ap.id].sort().join("-"))) {
      const key = [hub, ap.id].sort().join("-");
      if (rng() < 0.45) {
        routeSet.add(key);
        routes.push({source: hub, target: ap.id});
      }
    }
  }
}
// Fill to 200 with random routes
while (routes.length < 200) {
  const a = airports[Math.floor(rng() * airports.length)].id;
  const b = airports[Math.floor(rng() * airports.length)].id;
  if (a === b) continue;
  const key = [a, b].sort().join("-");
  if (routeSet.has(key)) continue;
  routeSet.add(key);
  routes.push({source: a, target: b});
}

// ── Build hierarchy for edge bundling ──
// root → region → airport
const regionNames = {NE:"Northeast",SE:"Southeast",MW:"Midwest",SC:"South Central",WE:"West"};
const hierarchyData = [
  {id: "US", parent: ""},
  ...Object.keys(regionNames).map(r => ({id: r, parent: "US"})),
  ...airports.map(a => ({id: a.id, parent: a.region}))
];

const stratify = d3.stratify().id(d => d.id).parentId(d => d.parent || null);
const root = stratify(hierarchyData);

// Use cluster layout in radial form (just for hierarchy path routing, not for positioning)
d3.cluster().size([2 * Math.PI, 1])(root);

const nodeById = new Map(root.leaves().map(d => [d.id, d]));

// Compute LCA paths for each route
const bundledRoutes = routes.map(r => {
  const s = nodeById.get(r.source);
  const t = nodeById.get(r.target);
  return s && t ? {path: s.path(t), source: r.source, target: r.target} : null;
}).filter(Boolean);

// ── Load US map ──
const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
const states = topojson.feature(us, us.objects.states);
const stateMesh = topojson.mesh(us, us.objects.states, (a, b) => a !== b);
const nation = topojson.feature(us, us.objects.nation);

// ── Layout ──
const container = document.getElementById("container");
const rect = container.getBoundingClientRect();
const width = rect.width;
const height = rect.height;
const dpr = devicePixelRatio;

const projection = d3.geoAlbersUsa().fitSize([width - 40, height - 20], nation);
// Offset to center
projection.translate([projection.translate()[0] + 20, projection.translate()[1] + 10]);
const geoPath = d3.geoPath(projection);

// Pre-project airports
const airportMap = new Map(airports.map(a => {
  const xy = projection([a.lon, a.lat]);
  return [a.id, {...a, x: xy ? xy[0] : null, y: xy ? xy[1] : null}];
}));

// ── Canvas setup ──
function makeCanvas(id) {
  const canvas = document.createElement("canvas");
  canvas.id = id;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  container.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  return {canvas, ctx};
}

const {ctx: mapCtx, canvas: mapCanvas} = makeCanvas("map-canvas");
const {ctx: routeCtx, canvas: routeCanvas} = makeCanvas("route-canvas");
const {ctx: hlCtx, canvas: hlCanvas} = makeCanvas("hl-canvas");

// ── Draw map (once) ──
function drawMap() {
  const ctx = mapCtx;
  ctx.clearRect(0, 0, width, height);

  // States fill
  ctx.fillStyle = "#131a2a";
  ctx.beginPath();
  geoPath.context(ctx)(states);
  ctx.fill();

  // State borders
  ctx.strokeStyle = "#1e2a40";
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  geoPath.context(ctx)(stateMesh);
  ctx.stroke();
}
drawMap();

// ── Edge bundling: interpolate between straight line and LCA path ──
// For geographic bundling, we interpolate control points between direct geo path
// and a "bundled" path that routes through regional centroids

// Compute region centroids
const regionCentroids = new Map();
for (const [region] of Object.entries(regionNames)) {
  const members = airports.filter(a => a.region === region).map(a => airportMap.get(a.id)).filter(a => a.x != null);
  if (members.length) {
    regionCentroids.set(region, {
      x: d3.mean(members, d => d.x),
      y: d3.mean(members, d => d.y)
    });
  }
}

// US centroid
const usCentroid = {
  x: d3.mean([...regionCentroids.values()], d => d.x),
  y: d3.mean([...regionCentroids.values()], d => d.y)
};

// Convert LCA path to screen coordinates
// Each path node: leaf → region → root → region → leaf
// Map to: airport coord → region centroid → US centroid → region centroid → airport coord
function pathToPoints(route) {
  return route.path.map(node => {
    if (node.depth === 0) return usCentroid;
    if (node.depth === 1) return regionCentroids.get(node.id) || usCentroid;
    const a = airportMap.get(node.id);
    return a && a.x != null ? {x: a.x, y: a.y} : null;
  }).filter(Boolean);
}

// Pre-compute all route point arrays
const routePoints = bundledRoutes.map(r => ({...r, points: pathToPoints(r)}));

// Interpolate between straight line (beta=1) and bundled path (beta=0)
function interpolatePoints(points, beta) {
  if (points.length < 2) return points;
  const start = points[0];
  const end = points[points.length - 1];
  return points.map((p, i) => {
    const t = i / (points.length - 1);
    const straightX = start.x + t * (end.x - start.x);
    const straightY = start.y + t * (end.y - start.y);
    return {
      x: straightX * beta + p.x * (1 - beta),
      y: straightY * beta + p.y * (1 - beta)
    };
  });
}

// ── Color by region of source ──
const regionColor = d3.scaleOrdinal()
  .domain(Object.keys(regionNames))
  .range(["#4af","#f74","#5e5","#e5e","#fd4"]);

// ── Draw routes ──
let currentBeta = 0.15;

function drawRoutes(beta, highlightId = null) {
  const ctx = routeCtx;
  ctx.clearRect(0, 0, width, height);

  const line = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveBasis).context(ctx);

  ctx.globalAlpha = highlightId ? 0.04 : 0.25;
  ctx.lineWidth = 1;

  for (const route of routePoints) {
    const pts = interpolatePoints(route.points, beta);
    if (pts.length < 2) continue;
    const srcAirport = airportMap.get(route.source);
    ctx.strokeStyle = regionColor(srcAirport?.region || "NE");
    ctx.beginPath();
    line(pts);
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
}

function drawHighlight(beta, airportId) {
  const ctx = hlCtx;
  ctx.clearRect(0, 0, width, height);
  if (!airportId) return;

  const line = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveBasis).context(ctx);
  const connected = new Set();

  for (const route of routePoints) {
    if (route.source !== airportId && route.target !== airportId) continue;
    connected.add(route.source);
    connected.add(route.target);
    const pts = interpolatePoints(route.points, beta);
    if (pts.length < 2) continue;
    const srcAirport = airportMap.get(route.source);
    ctx.strokeStyle = regionColor(srcAirport?.region || "NE");
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 2;
    ctx.beginPath();
    line(pts);
    ctx.stroke();
  }

  // Draw all airports
  ctx.globalAlpha = 1;
  for (const [id, a] of airportMap) {
    if (a.x == null) continue;
    const isConnected = connected.has(id);
    const isHovered = id === airportId;
    ctx.fillStyle = isHovered ? "#fff" : isConnected ? regionColor(a.region) : "#334";
    ctx.beginPath();
    ctx.arc(a.x, a.y, isHovered ? 5 : isConnected ? 3.5 : 2, 0, Math.PI * 2);
    ctx.fill();
    if (isHovered) {
      ctx.strokeStyle = regionColor(a.region);
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

// Draw airports on route canvas (default state)
function drawAirports(ctx, highlightId = null) {
  for (const [id, a] of airportMap) {
    if (a.x == null) continue;
    ctx.fillStyle = highlightId ? "#334" : regionColor(a.region);
    ctx.globalAlpha = highlightId ? 0.3 : 0.9;
    ctx.beginPath();
    ctx.arc(a.x, a.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function render(beta, highlightId = null) {
  drawRoutes(beta, highlightId);
  if (!highlightId) {
    hlCtx.clearRect(0, 0, width, height);
    drawAirports(routeCtx);
  } else {
    drawHighlight(beta, highlightId);
  }
}

render(currentBeta);

// ── Quadtree for airport hit detection ──
const visibleAirports = airports.map(a => airportMap.get(a.id)).filter(a => a.x != null);
const quadtree = d3.quadtree().x(d => d.x).y(d => d.y).addAll(visibleAirports);

// ── Interaction ──
const tooltip = document.getElementById("tooltip");
const info = document.getElementById("info");
let hoveredAirport = null;

// Route count per airport
const routeCount = new Map();
for (const r of routes) {
  routeCount.set(r.source, (routeCount.get(r.source) || 0) + 1);
  routeCount.set(r.target, (routeCount.get(r.target) || 0) + 1);
}

hlCanvas.style.pointerEvents = "auto";
hlCanvas.addEventListener("pointermove", (event) => {
  const [mx, my] = d3.pointer(event);
  const nearest = quadtree.find(mx, my, 15);
  if (nearest && nearest.id !== hoveredAirport) {
    hoveredAirport = nearest.id;
    render(currentBeta, hoveredAirport);
    tooltip.style.display = "block";
    tooltip.style.left = (nearest.x + 12) + "px";
    tooltip.style.top = (nearest.y - 8) + "px";
    const count = routeCount.get(nearest.id) || 0;
    tooltip.textContent = `${nearest.id} — ${nearest.name} (${count} routes)`;
    info.textContent = `${nearest.id}: ${count} routes`;
  } else if (!nearest && hoveredAirport) {
    hoveredAirport = null;
    render(currentBeta);
    tooltip.style.display = "none";
    info.textContent = "";
  }
});

hlCanvas.addEventListener("pointerleave", () => {
  hoveredAirport = null;
  render(currentBeta);
  tooltip.style.display = "none";
  info.textContent = "";
});

// ── Tension slider ──
const slider = document.getElementById("tensionSlider");
const tensionVal = document.getElementById("tensionVal");
slider.addEventListener("input", () => {
  currentBeta = +slider.value;
  tensionVal.textContent = currentBeta.toFixed(2);
  render(currentBeta, hoveredAirport);
});

// ── Legend ──
const svg = d3.select(container).append("svg").attr("width", width).attr("height", height);
const legend = svg.append("g").attr("transform", `translate(${width - 130}, 20)`);
Object.entries(regionNames).forEach(([key, name], i) => {
  legend.append("circle").attr("cx", 0).attr("cy", i * 18).attr("r", 5).attr("fill", regionColor(key));
  legend.append("text").attr("x", 12).attr("y", i * 18 + 4).text(name)
    .attr("fill", "#778").attr("font-size", 11);
});

// ── Resize ──
const ro = new ResizeObserver(() => location.reload());
ro.observe(container);
</script>
</body>
</html>
