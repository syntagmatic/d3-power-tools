<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supply Chain Sankey with Animated Flow</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #e0e0e0;
    font-family: "Inter", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #container {
    position: relative;
    width: 1100px;
    height: 680px;
  }
  canvas, svg {
    position: absolute;
    top: 0;
    left: 0;
  }
  h1 {
    position: absolute;
    top: 12px;
    left: 40px;
    font-size: 16px;
    font-weight: 500;
    color: #8888aa;
    letter-spacing: 0.5px;
  }
  .hint {
    position: absolute;
    bottom: 10px;
    right: 40px;
    font-size: 11px;
    color: #555570;
  }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(10, 10, 18, 0.92);
    border: 1px solid #444;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    color: #ccc;
    white-space: nowrap;
    display: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="container">
  <h1>Supply Chain Flow</h1>
  <canvas id="particle-canvas"></canvas>
  <svg id="sankey-svg"></svg>
  <div class="tooltip" id="tooltip"></div>
  <div class="hint">Hover a node to trace its supply chain</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12/dist/d3-sankey.min.js"></script>
<script type="module">

// --- Synthetic Data ---
const materials = ["Iron Ore","Copper","Silicon","Lithium","Aluminum","Rubber","Glass","Polymers"];
const components = ["Batteries","Circuits","Chassis","Displays","Motors","Wiring","Sensors","Optics","Fasteners","Insulation","Capacitors","Heat Sinks"];
const products = ["Smartphones","Laptops","EVs","Solar Panels","Drones","Wearables","Servers","Robotics"];
const markets = ["North America","Europe","Asia Pacific","Latin America","Africa & ME"];

const nodes = [
  ...materials.map(n => ({name: n, layer: 0})),
  ...components.map(n => ({name: n, layer: 1})),
  ...products.map(n => ({name: n, layer: 2})),
  ...markets.map(n => ({name: n, layer: 3})),
];

const nodeIndex = new Map(nodes.map((d, i) => [d.name, i]));

// Seeded pseudo-random for reproducibility
let seed = 42;
function rand() { seed = (seed * 16807 + 0) % 2147483647; return (seed - 1) / 2147483646; }

function generateLinks(sources, targets, density = 0.5, minVal = 5, maxVal = 80) {
  const links = [];
  for (const s of sources) {
    const count = Math.max(1, Math.floor(targets.length * density * (0.5 + rand())));
    const shuffled = targets.slice().sort(() => rand() - 0.5).slice(0, count);
    for (const t of shuffled) {
      links.push({
        source: nodeIndex.get(s),
        target: nodeIndex.get(t),
        value: Math.round(minVal + rand() * (maxVal - minVal))
      });
    }
  }
  return links;
}

const links = [
  ...generateLinks(materials, components, 0.35, 10, 60),
  ...generateLinks(components, products, 0.4, 8, 50),
  ...generateLinks(products, markets, 0.6, 15, 90),
];

// --- Layout ---
const width = 1100, height = 680;
const margin = {top: 50, right: 40, bottom: 30, left: 40};

const sankey = d3.sankey()
  .nodeId(d => d.index)
  .nodeWidth(18)
  .nodePadding(10)
  .nodeAlign(d3.sankeyJustify)
  .extent([[margin.left, margin.top], [width - margin.right, height - margin.bottom]]);

const graph = sankey({
  nodes: nodes.map(d => ({...d})),
  links: links.map(d => ({...d}))
});

// --- Layer Colors ---
const layerColors = [
  d3.scaleOrdinal(materials, d3.quantize(t => d3.interpolateWarm(0.2 + t * 0.4), materials.length)),
  d3.scaleOrdinal(components, d3.quantize(t => d3.interpolateCool(0.2 + t * 0.5), components.length)),
  d3.scaleOrdinal(products, d3.quantize(t => d3.interpolateViridis(0.3 + t * 0.5), products.length)),
  d3.scaleOrdinal(markets, d3.quantize(t => d3.interpolatePlasma(0.25 + t * 0.5), markets.length)),
];

function nodeColor(d) {
  return layerColors[d.layer](d.name);
}

function linkColor(d) {
  return nodeColor(d.source);
}

// --- Canvas for particles ---
const canvas = document.getElementById("particle-canvas");
canvas.width = width * devicePixelRatio;
canvas.height = height * devicePixelRatio;
canvas.style.width = width + "px";
canvas.style.height = height + "px";
const ctx = canvas.getContext("2d");
ctx.scale(devicePixelRatio, devicePixelRatio);

// --- SVG for structure ---
const svg = d3.select("#sankey-svg")
  .attr("width", width)
  .attr("height", height)
  .attr("viewBox", [0, 0, width, height]);

// --- Draw links ---
const linkG = svg.append("g")
  .attr("fill", "none")
  .selectAll("g")
  .data(graph.links)
  .join("g")
  .attr("class", "link-group");

const linkPaths = linkG.append("path")
  .attr("d", d3.sankeyLinkHorizontal())
  .attr("stroke", d => linkColor(d))
  .attr("stroke-opacity", 0.25)
  .attr("stroke-width", d => Math.max(1, d.width));

// --- Draw nodes ---
const nodeG = svg.append("g")
  .selectAll("g")
  .data(graph.nodes)
  .join("g")
  .attr("class", "node-group");

nodeG.append("rect")
  .attr("x", d => d.x0)
  .attr("y", d => d.y0)
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => d.y1 - d.y0)
  .attr("fill", d => nodeColor(d))
  .attr("rx", 2)
  .attr("opacity", 0.9);

nodeG.append("text")
  .attr("x", d => d.layer < 2 ? d.x1 + 6 : d.x0 - 6)
  .attr("y", d => (d.y0 + d.y1) / 2)
  .attr("dy", "0.35em")
  .attr("text-anchor", d => d.layer < 2 ? "start" : "end")
  .attr("fill", "#aaa")
  .attr("font-size", 11)
  .text(d => d.name);

// --- Particles ---
const particles = [];
const PARTICLE_SPEED = 0.008;
const SPAWN_RATE = 0.15; // per link per frame, scaled by value

function spawnParticles() {
  for (const link of graph.links) {
    const rate = SPAWN_RATE * (link.value / 30);
    if (rand() < rate) {
      const yOffset = (rand() - 0.5) * link.width * 0.7;
      particles.push({
        link,
        t: 0,
        yOffset,
        size: 1.2 + rand() * 1.5,
        opacity: 0.4 + rand() * 0.4,
        highlighted: false,
      });
    }
  }
}

// Compute point along sankey link path
function linkPoint(link, t) {
  const x0 = link.source.x1, x1 = link.target.x0;
  const x = x0 + (x1 - x0) * t;
  const y0 = link.y0, y1 = link.y1;
  // Cubic interpolation matching d3.sankeyLinkHorizontal
  const xi = d3.interpolateNumber(x0, x1);
  const xm = xi(t);
  const ym = d3.interpolateNumber(y0, y1)(t);
  return [xm, ym];
}

// --- Hover trace logic ---
let highlightedNodes = new Set();
let highlightedLinks = new Set();

function traceBackward(node, nodes, links) {
  const visited = new Set([node.index]);
  const visitedLinks = new Set();
  const queue = [node];
  while (queue.length) {
    const n = queue.shift();
    for (const link of n.targetLinks || []) {
      visitedLinks.add(link);
      if (!visited.has(link.source.index)) {
        visited.add(link.source.index);
        queue.push(link.source);
      }
    }
  }
  return {nodes: visited, links: visitedLinks};
}

function traceForward(node) {
  const visited = new Set([node.index]);
  const visitedLinks = new Set();
  const queue = [node];
  while (queue.length) {
    const n = queue.shift();
    for (const link of n.sourceLinks || []) {
      visitedLinks.add(link);
      if (!visited.has(link.target.index)) {
        visited.add(link.target.index);
        queue.push(link.target);
      }
    }
  }
  return {nodes: visited, links: visitedLinks};
}

const tooltip = document.getElementById("tooltip");

nodeG.on("pointerenter", (event, d) => {
  const back = traceBackward(d, graph.nodes, graph.links);
  const fwd = traceForward(d);
  highlightedNodes = new Set([...back.nodes, ...fwd.nodes]);
  highlightedLinks = new Set([...back.links, ...fwd.links]);

  // Dim non-highlighted
  linkPaths.attr("stroke-opacity", l => highlightedLinks.has(l) ? 0.55 : 0.04);
  nodeG.select("rect").attr("opacity", n => highlightedNodes.has(n.index) ? 1 : 0.15);
  nodeG.select("text").attr("fill", n => highlightedNodes.has(n.index) ? "#ddd" : "#333");

  // Tooltip
  const totalIn = (d.targetLinks || []).reduce((s, l) => s + l.value, 0);
  const totalOut = (d.sourceLinks || []).reduce((s, l) => s + l.value, 0);
  tooltip.innerHTML = `<strong>${d.name}</strong><br>In: ${totalIn} &nbsp; Out: ${totalOut}`;
  tooltip.style.display = "block";
})
.on("pointermove", (event) => {
  const rect = document.getElementById("container").getBoundingClientRect();
  tooltip.style.left = (event.clientX - rect.left + 12) + "px";
  tooltip.style.top = (event.clientY - rect.top - 10) + "px";
})
.on("pointerleave", () => {
  highlightedNodes.clear();
  highlightedLinks.clear();
  linkPaths.attr("stroke-opacity", 0.25);
  nodeG.select("rect").attr("opacity", 0.9);
  nodeG.select("text").attr("fill", "#aaa");
  tooltip.style.display = "none";
});

// --- Animation loop ---
function animate() {
  ctx.clearRect(0, 0, width, height);
  spawnParticles();

  const hasHighlight = highlightedLinks.size > 0;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += PARTICLE_SPEED * (0.7 + rand() * 0.6);
    if (p.t >= 1) { particles.splice(i, 1); continue; }

    const [x, y] = linkPoint(p.link, p.t);
    const isHighlighted = hasHighlight && highlightedLinks.has(p.link);
    const alpha = hasHighlight
      ? (isHighlighted ? p.opacity * 1.2 : p.opacity * 0.06)
      : p.opacity * 0.6;

    const color = linkColor(p.link);
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.fillStyle = isHighlighted ? "#fff" : color;
    ctx.beginPath();
    ctx.arc(x, y + p.yOffset, isHighlighted ? p.size * 1.3 : p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Cap particles
  if (particles.length > 3000) particles.splice(0, particles.length - 3000);

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
