<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accessible Force Network</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fafafa;
    font-family: system-ui, -apple-system, sans-serif;
    color: #222;
  }
  h1 { text-align: center; font-size: 18px; color: #222; padding: 14px 0 2px; font-weight: 700; }
  .subtitle { text-align: center; font-size: 12px; color: #666; margin-bottom: 6px; }
  .instructions {
    text-align: center; font-size: 11px; color: #888; margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .instructions kbd {
    background: #eee; border: 1px solid #ccc; border-radius: 3px;
    padding: 0 4px; font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
    font-size: 10px;
  }
  #viz-container { position: relative; display: flex; justify-content: center; }
  canvas { border: 1px solid #ddd; border-radius: 6px; cursor: crosshair; }
  canvas:focus { outline: 3px solid #4477AA; outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .tooltip {
    position: absolute; pointer-events: none; background: rgba(255,255,255,0.96);
    border: 1px solid #bbb; border-radius: 5px; padding: 7px 11px; font-size: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10); display: none; line-height: 1.5;
    max-width: 240px;
  }
  .tooltip .tt-name { font-weight: 700; }
  .tooltip .tt-comm { font-size: 11px; color: #555; }
  .legend-bar {
    display: flex; gap: 14px; justify-content: center; font-size: 12px;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .legend-bar .item { display: flex; align-items: center; gap: 5px; }
  .legend-bar .swatch {
    width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15);
  }

  /* Data table */
  #table-section {
    max-width: 780px; margin: 14px auto 24px; padding: 0 16px;
  }
  #table-section h2 { font-size: 14px; margin-bottom: 6px; font-weight: 600; }
  .table-toolbar {
    display: flex; gap: 10px; align-items: center; margin-bottom: 6px; flex-wrap: wrap;
  }
  .table-toolbar input[type="search"] {
    padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;
    width: 180px;
  }
  .table-toolbar .count { font-size: 11px; color: #888; }
  .table-wrap {
    max-height: 320px; overflow-y: auto; border: 1px solid #ddd; border-radius: 5px;
  }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
  thead th {
    position: sticky; top: 0; background: #f0f0f0; padding: 6px 8px;
    text-align: left; border-bottom: 2px solid #ccc; cursor: pointer; user-select: none;
    font-weight: 600; white-space: nowrap; z-index: 1;
  }
  thead th:hover { background: #e4e4e4; }
  thead th .arrow { font-size: 10px; margin-left: 3px; opacity: 0.5; }
  thead th[aria-sort="ascending"] .arrow,
  thead th[aria-sort="descending"] .arrow { opacity: 1; }
  td { padding: 5px 8px; border-bottom: 1px solid #eee; }
  td.num {
    text-align: right; font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
    font-variant-numeric: tabular-nums;
  }
  th.num { text-align: right; }
  tr:nth-child(even) { background: #f8f8f8; }
  tr:hover { background: #eef3fa; }
  tr.row-highlight { background: #dce8f7 !important; }
  tr.row-focused { background: #c5d9f1 !important; outline: 2px solid #4477AA; outline-offset: -2px; }

  /* Forced-colors / Windows High Contrast */
  @media (forced-colors: active) {
    canvas { border-color: CanvasText; }
    canvas:focus { outline-color: Highlight; }
    .tooltip { background: Canvas; color: CanvasText; border-color: CanvasText; }
    thead th { background: Canvas; color: CanvasText; border-color: CanvasText; }
    td { border-color: CanvasText; }
    tr.row-highlight { outline: 2px solid Highlight; }
    tr.row-focused { outline: 2px solid Highlight; }
    .legend-bar .swatch { border-color: CanvasText; }
  }

  /* High contrast preference */
  @media (prefers-contrast: more) {
    canvas { border-width: 2px; border-color: #000; }
    .tooltip { border-width: 2px; border-color: #000; }
    td { border-color: #bbb; }
  }
</style>
</head>
<body>

<h1>Accessible Force Network</h1>
<div class="subtitle">150 nodes across 6 communities &mdash; keyboard-navigable canvas with synced data table</div>
<div class="instructions">
  <kbd>Tab</kbd> into canvas, <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> navigate,
  <kbd>Enter</kbd> select, <kbd>Escape</kbd> clear, <kbd>Home</kbd>/<kbd>End</kbd> jump
</div>
<div class="legend-bar" id="legend" role="img" aria-label="Community color legend"></div>
<div id="viz-container">
  <div class="tooltip" id="tooltip"></div>
</div>
<div id="live-region" class="sr-only" aria-live="polite" role="status"></div>
<a href="#after-table" class="sr-only">Skip data table</a>

<div id="table-section">
  <h2 id="table-heading">Network Data</h2>
  <div class="table-toolbar">
    <input type="search" id="table-search" placeholder="Filter nodes..." aria-label="Filter table rows">
    <span class="count" id="row-count"></span>
  </div>
  <div class="table-wrap" id="table-wrap">
    <table id="data-table" role="grid" aria-labelledby="table-heading">
      <thead><tr id="table-head"></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>
<div id="after-table"></div>

<script>
(() => {
  // --- Constants ---
  const W = 760, H = 520;
  const dpr = window.devicePixelRatio || 1;
  const NODE_R = 5;
  const FOCUS_PAD = 5;
  const tolBright = ['#4477AA','#EE6677','#228833','#CCBB44','#66CCEE','#AA3377'];
  const communityNames = ['Engineering','Design','Marketing','Research','Operations','Leadership'];

  // --- Media queries ---
  const mqForcedColors = matchMedia('(forced-colors: active)');
  const mqReducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const mqHighContrast = matchMedia('(prefers-contrast: more)');

  // --- Generate synthetic data ---
  const rng = d3.randomLcg(42);
  const rand = d3.randomUniform.source(rng)(0, 1);

  const nodes = [];
  const perComm = 25;
  for (let c = 0; c < 6; c++) {
    for (let i = 0; i < perComm; i++) {
      nodes.push({
        id: c * perComm + i,
        name: `${communityNames[c].slice(0, 3)}${String(i + 1).padStart(2, '0')}`,
        community: c,
        communityName: communityNames[c],
        degree: 0
      });
    }
  }

  // ~260 edges: 70% intra-community, 30% inter
  const links = [];
  const edgeSet = new Set();
  const addEdge = (s, t) => {
    if (s === t) return false;
    const key = Math.min(s, t) + '-' + Math.max(s, t);
    if (edgeSet.has(key)) return false;
    edgeSet.add(key);
    links.push({ source: s, target: t });
    return true;
  };

  // Intra-community edges (dense)
  for (let c = 0; c < 6; c++) {
    const base = c * perComm;
    for (let i = 0; i < perComm; i++) {
      for (let j = i + 1; j < perComm; j++) {
        if (rand() < 0.2 && links.length < 180) addEdge(base + i, base + j);
      }
    }
  }
  // Inter-community bridges
  while (links.length < 260) {
    const a = Math.floor(rand() * 150), b = Math.floor(rand() * 150);
    if (nodes[a].community !== nodes[b].community) addEdge(a, b);
  }

  // Compute degree and adjacency
  const adjList = new Map(nodes.map(n => [n.id, []]));
  links.forEach(e => {
    const s = typeof e.source === 'object' ? e.source.id : e.source;
    const t = typeof e.target === 'object' ? e.target.id : e.target;
    nodes[s].degree++;
    nodes[t].degree++;
    adjList.get(s).push(t);
    adjList.get(t).push(s);
  });

  // --- Force simulation (pre-computed) ---
  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(28))
    .force('charge', d3.forceManyBody().strength(-40).distanceMax(300))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collide', d3.forceCollide(NODE_R + 2))
    .stop();

  simulation.tick(300);

  // Clamp to canvas bounds
  for (const n of nodes) {
    n.x = Math.max(NODE_R + 2, Math.min(W - NODE_R - 2, n.x));
    n.y = Math.max(NODE_R + 2, Math.min(H - NODE_R - 2, n.y));
  }

  // --- Canvas setup ---
  const container = d3.select('#viz-container');
  const canvas = container.append('canvas')
    .attr('width', W * dpr).attr('height', H * dpr)
    .style('width', W + 'px').style('height', H + 'px')
    .attr('tabindex', '0')
    .attr('role', 'application')
    .attr('aria-label',
      `Force-directed network graph with ${nodes.length} nodes in 6 communities: ${communityNames.join(', ')}. ` +
      'Use arrow keys to navigate between nodes, Enter to select, Escape to clear.')
    .attr('aria-roledescription', 'network graph')
    .node();

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // --- Hidden DOM mirror for screen readers ---
  const mirror = document.createElement('div');
  mirror.id = 'canvas-mirror';
  mirror.setAttribute('role', 'listbox');
  mirror.setAttribute('aria-label', 'Network nodes');
  mirror.classList.add('sr-only');
  canvas.parentElement.appendChild(mirror);
  canvas.setAttribute('aria-owns', 'canvas-mirror');

  d3.select(mirror).selectAll('[role="option"]')
    .data(nodes, d => d.id)
    .join('div')
      .attr('role', 'option')
      .attr('id', d => `mirror-${d.id}`)
      .attr('aria-label', d => {
        const conns = adjList.get(d.id);
        const named = conns.slice(0, 3).map(i => nodes[i].name).join(', ');
        const extra = conns.length > 3 ? ` and ${conns.length - 3} more` : '';
        return `${d.name}, ${d.communityName} community, ${d.degree} connections: ${named}${extra}`;
      });

  // --- Quadtree for spatial navigation & hit detection ---
  const qt = d3.quadtree().x(d => d.x).y(d => d.y).addAll(nodes);

  // 90-degree directional cone
  const inDirection = (ox, oy, tx, ty, dir) => {
    const dx = tx - ox, dy = ty - oy;
    if (!dx && !dy) return false;
    switch (dir) {
      case 'right': return dx > 0 && Math.abs(dy) <= dx;
      case 'left':  return dx < 0 && Math.abs(dy) <= -dx;
      case 'down':  return dy > 0 && Math.abs(dx) <= dy;
      case 'up':    return dy < 0 && Math.abs(dx) <= -dy;
    }
  };

  const pointRectDist = (px, py, x0, y0, x1, y1) =>
    Math.hypot(Math.max(x0 - px, 0, px - x1), Math.max(y0 - py, 0, py - y1));

  const findNearest = (current, direction) => {
    const cx = current.x, cy = current.y;
    let best = null, bestDist = Infinity;
    qt.visit((quad, x0, y0, x1, y1) => {
      if (best && pointRectDist(cx, cy, x0, y0, x1, y1) > bestDist) return true;
      if (!quad.length) {
        let p = quad;
        do {
          if (p.data === current) continue;
          const px = p.data.x, py = p.data.y;
          if (!inDirection(cx, cy, px, py, direction)) continue;
          const dist = Math.hypot(px - cx, py - cy);
          if (dist < bestDist) { bestDist = dist; best = p.data; }
        } while ((p = p.next));
      }
    });
    return best;
  };

  // Hit detection for pointer
  const hitDetect = (mx, my) => {
    let best = null, bestDist = NODE_R + 4;
    qt.visit((quad, x0, y0, x1, y1) => {
      if (pointRectDist(mx, my, x0, y0, x1, y1) > bestDist) return true;
      if (!quad.length) {
        let p = quad;
        do {
          const dist = Math.hypot(p.data.x - mx, p.data.y - my);
          if (dist < bestDist) { bestDist = dist; best = p.data; }
        } while ((p = p.next));
      }
    });
    return best;
  };

  // --- State ---
  let focusedNode = null;
  let selectedNode = null;
  let hoveredNode = null;

  // --- Announce ---
  const liveRegion = document.getElementById('live-region');
  let announceTimer;
  const announce = (node, extra) => {
    clearTimeout(announceTimer);
    announceTimer = setTimeout(() => {
      const conns = adjList.get(node.id);
      const named = conns.slice(0, 4).map(i => nodes[i].name).join(', ');
      const more = conns.length > 4 ? ` and ${conns.length - 4} more` : '';
      let msg = `${node.name}, ${communityNames[node.community]}, ${node.degree} connections. Connected to ${named}${more}.`;
      if (extra) msg += ` ${extra}`;
      liveRegion.textContent = msg;
    }, 150);
  };

  // --- Render ---
  const render = () => {
    const fc = mqForcedColors.matches;
    const hc = mqHighContrast.matches;
    const strokeBoost = hc ? 1 : 0;

    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = fc ? 'Canvas' : '#fafafa';
    ctx.fillRect(0, 0, W, H);

    // Highlighted edges (if a node is focused or selected)
    const activeNode = selectedNode || focusedNode;
    const activeConns = activeNode ? new Set(adjList.get(activeNode.id)) : null;

    // Draw edges
    ctx.lineWidth = 0.8 + strokeBoost;
    if (activeNode) {
      // Dim all edges first
      ctx.strokeStyle = fc ? 'CanvasText' : '#e0e0e0';
      ctx.globalAlpha = fc ? 0.15 : 0.08;
      ctx.beginPath();
      for (const e of links) {
        const s = e.source, t = e.target;
        if (activeConns.has(s.id) || activeConns.has(t.id)) continue;
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(t.x, t.y);
      }
      ctx.stroke();

      // Highlight connected edges
      ctx.strokeStyle = fc ? 'Highlight' : '#4477AA';
      ctx.globalAlpha = fc ? 0.8 : 0.5;
      ctx.lineWidth = 1.5 + strokeBoost;
      ctx.beginPath();
      for (const e of links) {
        const s = e.source, t = e.target;
        if (s.id === activeNode.id || t.id === activeNode.id) {
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(t.x, t.y);
        }
      }
      ctx.stroke();
    } else {
      ctx.strokeStyle = fc ? 'CanvasText' : '#bbb';
      ctx.globalAlpha = fc ? 0.25 : 0.18;
      ctx.beginPath();
      for (const e of links) {
        ctx.moveTo(e.source.x, e.source.y);
        ctx.lineTo(e.target.x, e.target.y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;

    // Draw nodes batched by community
    const dimmed = activeNode ? new Set() : null;
    if (activeNode) {
      for (const n of nodes) {
        if (n !== activeNode && !activeConns.has(n.id)) dimmed.add(n.id);
      }
    }

    for (let c = 0; c < 6; c++) {
      const members = nodes.filter(d => d.community === c);
      // Active members
      const active = dimmed ? members.filter(d => !dimmed.has(d.id)) : members;
      const dim = dimmed ? members.filter(d => dimmed.has(d.id)) : [];

      // Dim nodes
      if (dim.length) {
        ctx.fillStyle = fc ? 'Canvas' : tolBright[c];
        ctx.globalAlpha = fc ? 0.3 : 0.2;
        if (fc) { ctx.strokeStyle = 'CanvasText'; ctx.lineWidth = 1; }
        ctx.beginPath();
        for (const d of dim) { ctx.moveTo(d.x + NODE_R, d.y); ctx.arc(d.x, d.y, NODE_R, 0, Math.PI * 2); }
        ctx.fill();
        if (fc) ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Active nodes
      if (active.length) {
        ctx.fillStyle = fc ? 'Canvas' : tolBright[c];
        ctx.globalAlpha = 1;
        if (fc) { ctx.strokeStyle = 'CanvasText'; ctx.lineWidth = 1.5 + strokeBoost; }
        ctx.beginPath();
        for (const d of active) { ctx.moveTo(d.x + NODE_R, d.y); ctx.arc(d.x, d.y, NODE_R, 0, Math.PI * 2); }
        ctx.fill();
        if (fc) ctx.stroke();
      }
    }

    // Selected node ring
    if (selectedNode) {
      ctx.strokeStyle = fc ? 'Highlight' : '#222';
      ctx.lineWidth = 2.5 + strokeBoost;
      ctx.beginPath();
      ctx.arc(selectedNode.x, selectedNode.y, NODE_R + 3, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Focus ring (drawn last, on top)
    if (focusedNode && document.activeElement === canvas) {
      ctx.save();
      ctx.strokeStyle = fc ? 'Highlight' : '#1a73e8';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 3]);
      // White halo for visibility on any background
      ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowBlur = 4;
      if (!mqReducedMotion.matches) {
        ctx.lineDashOffset = -performance.now() / 50;
      }
      ctx.beginPath();
      ctx.arc(focusedNode.x, focusedNode.y, NODE_R + FOCUS_PAD, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Hovered node label
    if (hoveredNode && !focusedNode) {
      drawLabel(hoveredNode);
    } else if (focusedNode) {
      drawLabel(focusedNode);
    }

    // Animated focus ring
    if (focusedNode && document.activeElement === canvas && !mqReducedMotion.matches) {
      requestAnimationFrame(render);
    }
  };

  const drawLabel = (node) => {
    const fc = mqForcedColors.matches;
    const label = `${node.name} (${node.degree})`;
    ctx.font = '11px system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    const lx = Math.min(node.x + 10, W - tw - 10);
    const ly = Math.max(node.y - 10, 16);
    ctx.fillStyle = fc ? 'Canvas' : 'rgba(255,255,255,0.92)';
    ctx.fillRect(lx - 3, ly - 12, tw + 6, 16);
    ctx.strokeStyle = fc ? 'CanvasText' : '#aaa';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([]);
    ctx.strokeRect(lx - 3, ly - 12, tw + 6, 16);
    ctx.fillStyle = fc ? 'CanvasText' : '#222';
    ctx.fillText(label, lx, ly);
  };

  render();

  // --- Legend ---
  const legend = d3.select('#legend');
  communityNames.forEach((name, i) => {
    const item = legend.append('span').attr('class', 'item');
    item.append('span').attr('class', 'swatch')
      .style('background', tolBright[i]);
    item.append('span').text(name);
  });

  // --- Keyboard navigation ---
  canvas.addEventListener('keydown', e => {
    const dirMap = { ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up' };
    const dir = dirMap[e.key];

    if (dir) {
      e.preventDefault();
      if (!focusedNode) {
        // Start with the node nearest center
        focusedNode = nodes.reduce((a, b) =>
          Math.hypot(a.x - W/2, a.y - H/2) < Math.hypot(b.x - W/2, b.y - H/2) ? a : b);
      } else {
        const next = findNearest(focusedNode, dir);
        if (next) focusedNode = next;
      }
      canvas.setAttribute('aria-activedescendant', `mirror-${focusedNode.id}`);
      announce(focusedNode);
      syncTableHighlight(focusedNode, true);
      render();
      return;
    }

    switch (e.key) {
      case 'Enter':
      case ' ':
        e.preventDefault();
        if (focusedNode) {
          selectedNode = selectedNode === focusedNode ? null : focusedNode;
          announce(focusedNode, selectedNode ? 'Selected' : 'Deselected');
          syncTableHighlight(focusedNode, true);
          render();
        }
        break;
      case 'Escape':
        e.preventDefault();
        selectedNode = null;
        focusedNode = null;
        canvas.removeAttribute('aria-activedescendant');
        liveRegion.textContent = 'Selection cleared';
        syncTableHighlight(null, false);
        render();
        break;
      case 'Home':
        e.preventDefault();
        focusedNode = nodes[0];
        canvas.setAttribute('aria-activedescendant', `mirror-${focusedNode.id}`);
        announce(focusedNode);
        syncTableHighlight(focusedNode, true);
        render();
        break;
      case 'End':
        e.preventDefault();
        focusedNode = nodes[nodes.length - 1];
        canvas.setAttribute('aria-activedescendant', `mirror-${focusedNode.id}`);
        announce(focusedNode);
        syncTableHighlight(focusedNode, true);
        render();
        break;
    }
  });

  // --- Pointer events ---
  const tooltip = document.getElementById('tooltip');

  canvas.addEventListener('pointermove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);
    const hit = hitDetect(mx, my);

    if (hit !== hoveredNode) {
      hoveredNode = hit;
      canvas.style.cursor = hit ? 'pointer' : 'crosshair';
      if (hit) {
        const conns = adjList.get(hit.id);
        const named = conns.slice(0, 4).map(i => nodes[i].name).join(', ');
        const more = conns.length > 4 ? ` +${conns.length - 4}` : '';
        tooltip.innerHTML = `<span class="tt-name">${hit.name}</span><br>` +
          `<span class="tt-comm">${communityNames[hit.community]}</span><br>` +
          `${hit.degree} connections: ${named}${more}`;
        tooltip.style.display = 'block';
      } else {
        tooltip.style.display = 'none';
      }
      render();
    }

    if (hoveredNode) {
      tooltip.style.left = (e.clientX - container.node().getBoundingClientRect().left + 12) + 'px';
      tooltip.style.top = (e.clientY - container.node().getBoundingClientRect().top - 10) + 'px';
    }
  });

  canvas.addEventListener('pointerleave', () => {
    hoveredNode = null;
    tooltip.style.display = 'none';
    render();
  });

  canvas.addEventListener('pointerdown', e => {
    canvas.focus();
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);
    const hit = hitDetect(mx, my);
    if (hit) {
      focusedNode = hit;
      selectedNode = selectedNode === hit ? null : hit;
      canvas.setAttribute('aria-activedescendant', `mirror-${hit.id}`);
      announce(hit, selectedNode === hit ? 'Selected' : 'Deselected');
      syncTableHighlight(hit, true);
      render();
    }
  });

  // Blur: keep focus state but hide ring
  canvas.addEventListener('blur', () => { render(); });
  canvas.addEventListener('focus', () => { render(); });

  // --- Data table ---
  const columns = [
    { key: 'name', label: 'Name', type: 'string' },
    { key: 'communityName', label: 'Community', type: 'string' },
    { key: 'degree', label: 'Connections', type: 'number', format: d3.format(',') },
    { key: 'id', label: 'ID', type: 'number', format: d3.format('d') }
  ];

  let sortKey = 'name', sortDir = 1;
  let filterText = '';

  const thead = d3.select('#table-head');
  const tbody = d3.select('#table-body');
  const countEl = document.getElementById('row-count');
  const searchInput = document.getElementById('table-search');

  // Header
  const ths = thead.selectAll('th').data(columns).join('th')
    .attr('class', d => d.type === 'number' ? 'num' : null)
    .attr('scope', 'col')
    .attr('tabindex', '0')
    .attr('aria-sort', d => d.key === sortKey ? (sortDir === 1 ? 'ascending' : 'descending') : 'none')
    .on('click', (e, col) => handleSort(col))
    .on('keydown', (e, col) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleSort(col); } });

  ths.html(d => {
    const arrow = d.key === sortKey ? (sortDir === 1 ? '\u25B2' : '\u25BC') : '\u25B2';
    return `${d.label} <span class="arrow">${arrow}</span>`;
  });

  const handleSort = (col) => {
    if (sortKey === col.key) sortDir *= -1;
    else { sortKey = col.key; sortDir = 1; }
    ths.attr('aria-sort', d => d.key === sortKey ? (sortDir === 1 ? 'ascending' : 'descending') : 'none')
      .html(d => {
        const arrow = d.key === sortKey ? (sortDir === 1 ? '\u25B2' : '\u25BC') : '\u25B2';
        return `${d.label} <span class="arrow">${arrow}</span>`;
      });
    renderTable();
    liveRegion.textContent = `Sorted by ${col.label}, ${sortDir === 1 ? 'ascending' : 'descending'}`;
  };

  // Search / filter
  let debounceTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      filterText = searchInput.value.toLowerCase();
      renderTable();
    }, 150);
  });

  const getFilteredSorted = () => {
    let data = [...nodes];
    if (filterText) {
      data = data.filter(d =>
        d.name.toLowerCase().includes(filterText) ||
        d.communityName.toLowerCase().includes(filterText)
      );
    }
    const cmp = columns.find(c => c.key === sortKey).type === 'number'
      ? (a, b) => d3.ascending(a[sortKey], b[sortKey]) * sortDir
      : (a, b) => d3.ascending(String(a[sortKey]), String(b[sortKey])) * sortDir;
    data.sort(cmp);
    return data;
  };

  const renderTable = () => {
    const data = getFilteredSorted();
    countEl.textContent = `${data.length} of ${nodes.length} nodes`;

    const rows = tbody.selectAll('tr').data(data, d => d.id).join('tr')
      .attr('class', d => {
        if (focusedNode && d.id === focusedNode.id) return 'row-focused';
        if (selectedNode && d.id === selectedNode.id) return 'row-highlight';
        return '';
      })
      .on('pointerenter', (e, d) => {
        hoveredNode = d;
        render();
      })
      .on('pointerleave', () => {
        hoveredNode = null;
        render();
      })
      .on('click', (e, d) => {
        focusedNode = d;
        selectedNode = selectedNode === d ? null : d;
        canvas.setAttribute('aria-activedescendant', `mirror-${d.id}`);
        announce(d, selectedNode === d ? 'Selected' : 'Deselected');
        render();
        renderTable();
      });

    rows.selectAll('td').data(d => columns.map(col => ({
      value: col.format ? col.format(d[col.key]) : d[col.key],
      type: col.type
    }))).join('td')
      .attr('class', d => d.type === 'number' ? 'num' : null)
      .text(d => d.value);
  };

  renderTable();

  // Sync table with canvas focus
  const syncTableHighlight = (node, scrollTo) => {
    renderTable();
    if (node && scrollTo) {
      const wrap = document.getElementById('table-wrap');
      const row = tbody.selectAll('tr').filter(d => d.id === node.id).node();
      if (row) row.scrollIntoView({ block: 'nearest', behavior: 'auto' });
    }
  };

  // Listen for media changes
  mqForcedColors.addEventListener('change', render);
  mqHighContrast.addEventListener('change', render);
  mqReducedMotion.addEventListener('change', render);

})();
</script>
</body>
</html>
