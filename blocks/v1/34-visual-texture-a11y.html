<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dual-Encoded Grouped Bar — Color + Pattern Accessibility</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa; color: #333; padding: 20px;
  }
  h1 { text-align: center; font-size: 19px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { text-align: center; font-size: 12px; color: #777; margin-bottom: 16px; }
  .panels { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
  .panel { text-align: center; }
  .panel-label {
    font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .legend-row {
    display: flex; justify-content: center; gap: 20px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #444; }
  .legend-swatch { width: 22px; height: 16px; border: 1px solid #bbb; border-radius: 2px; }
  .axis text { font-size: 11px; fill: #555; }
  .axis path, .axis line { stroke: #ccc; }
  .tooltip {
    position: fixed; pointer-events: none; opacity: 0;
    background: #fff; border: 1px solid #ccc; border-radius: 5px;
    padding: 8px 11px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: opacity 0.12s;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .tooltip .tt-cat { font-weight: 600; margin-bottom: 2px; }
  .tooltip .tt-val { font-family: "SF Mono", Monaco, "Cascadia Code", monospace; }
</style>
</head>
<body>
<h1>Dual-Encoded Grouped Bar — Color + Pattern for Accessibility</h1>
<p class="subtitle">Patterns remain distinguishable without color. Hover bars for detail.</p>
<div class="legend-row" id="legend"></div>
<div class="panels" id="panels"></div>
<div class="tooltip" id="tooltip"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(() => {
  // ── Synthetic data: quarterly revenue by product line ──
  const categories = ["Electronics", "Apparel", "Home & Garden", "Food & Bev"];
  const quarters = ["Q1 2025", "Q2 2025", "Q3 2025", "Q4 2025", "Q1 2026"];
  // Structurally interesting: seasonal patterns, one category growing, one declining
  const baselines = [42, 35, 28, 51];
  const trends = [1.08, 0.94, 1.12, 1.01]; // per-quarter multiplier
  const seasonal = [0.85, 1.05, 0.95, 1.15, 0.88]; // Q-level seasonality
  const rng = d3.randomLcg(42);
  const rand = d3.randomNormal.source(rng)(0, 3);

  const data = [];
  quarters.forEach((q, qi) => {
    categories.forEach((cat, ci) => {
      const val = baselines[ci] * Math.pow(trends[ci], qi) * seasonal[qi] + rand();
      data.push({ quarter: q, category: cat, value: Math.max(5, Math.round(val * 10) / 10) });
    });
  });

  // ── Tol Bright palette (colorblind-safe) ──
  const colors = ["#4477AA", "#EE6677", "#228833", "#CCBB44"];

  // ── Pattern definitions ──
  // Texton-diverse set: diagonal hatch, horizontal lines, stipple dots, crosshatch
  const patternDefs = [
    { id: "pat-hatch",      label: "Diagonal hatch",   type: "hatch" },
    { id: "pat-horizontal",  label: "Horizontal lines", type: "horizontal" },
    { id: "pat-stipple",     label: "Stipple dots",     type: "stipple" },
    { id: "pat-crosshatch",  label: "Crosshatch",       type: "crosshatch" },
  ];

  function addPatterns(defs, prefix) {
    const size = 8, sw = 1.5, stroke = "rgba(0,0,0,0.22)";

    // Diagonal hatch (45°)
    defs.append("pattern")
      .attr("id", `${prefix}-hatch`).attr("width", size).attr("height", size)
      .attr("patternUnits", "userSpaceOnUse")
      .attr("patternTransform", "rotate(45)")
      .append("line")
        .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
        .attr("stroke", stroke).attr("stroke-width", sw);

    // Horizontal lines
    defs.append("pattern")
      .attr("id", `${prefix}-horizontal`).attr("width", size).attr("height", size)
      .attr("patternUnits", "userSpaceOnUse")
      .append("line")
        .attr("x1", 0).attr("y1", size / 2).attr("x2", size).attr("y2", size / 2)
        .attr("stroke", stroke).attr("stroke-width", sw);

    // Stipple dots (grid)
    const dotPat = defs.append("pattern")
      .attr("id", `${prefix}-stipple`).attr("width", size).attr("height", size)
      .attr("patternUnits", "userSpaceOnUse");
    dotPat.append("circle").attr("cx", size / 2).attr("cy", size / 2).attr("r", 1.6)
      .attr("fill", stroke);

    // Crosshatch (two perpendicular lines)
    const crossPat = defs.append("pattern")
      .attr("id", `${prefix}-crosshatch`).attr("width", size).attr("height", size)
      .attr("patternUnits", "userSpaceOnUse")
      .attr("patternTransform", "rotate(45)");
    crossPat.append("line")
      .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
      .attr("stroke", stroke).attr("stroke-width", sw);
    crossPat.append("line")
      .attr("x1", 0).attr("y1", size / 2).attr("x2", size).attr("y2", size / 2)
      .attr("stroke", stroke).attr("stroke-width", sw);
  }

  // ── Deuteranopia simulation via feColorMatrix (Brettel) ──
  // Approximate deuteranopia matrix for feColorMatrix (operates on linearized RGB in SVG)
  const deutanMatrix = [
    0.625, 0.375, 0.0, 0, 0,
    0.700, 0.300, 0.0, 0, 0,
    0.0,   0.300, 0.700, 0, 0,
    0,     0,     0,     1, 0
  ].join(" ");

  // ── Dimensions ──
  const width = 560, height = 420;
  const margin = { top: 28, right: 16, bottom: 44, left: 52 };
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  // ── Scales ──
  const x0 = d3.scaleBand().domain(quarters).range([0, innerW]).paddingInner(0.18).paddingOuter(0.08);
  const x1 = d3.scaleBand().domain(categories).range([0, x0.bandwidth()]).padding(0.06);
  const yMax = d3.max(data, d => d.value) * 1.08;
  const y = d3.scaleLinear().domain([0, yMax]).nice().range([innerH, 0]);

  const colorScale = d3.scaleOrdinal().domain(categories).range(colors);
  const patternIds = ["hatch", "horizontal", "stipple", "crosshatch"];
  const patternScale = d3.scaleOrdinal().domain(categories).range(patternIds);

  // ── Legend ──
  const legendDiv = document.getElementById("legend");
  // We'll build legend SVGs that show color + pattern
  categories.forEach((cat, i) => {
    const item = document.createElement("div");
    item.className = "legend-item";

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", 22);
    svg.setAttribute("height", 16);
    svg.setAttribute("class", "legend-swatch");

    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    svg.appendChild(defs);

    // Add pattern to this mini SVG
    const d3Svg = d3.select(svg);
    addPatterns(d3Svg.select("defs").empty() ? d3Svg.append("defs") : d3Svg.select("defs"), `leg-${i}`);

    // Color rect
    const rect1 = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect1.setAttribute("width", 22); rect1.setAttribute("height", 16);
    rect1.setAttribute("fill", colors[i]);
    svg.appendChild(rect1);

    // Pattern overlay rect
    const rect2 = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect2.setAttribute("width", 22); rect2.setAttribute("height", 16);
    rect2.setAttribute("fill", `url(#leg-${i}-${patternIds[i]})`);
    svg.appendChild(rect2);

    const label = document.createElement("span");
    label.textContent = `${cat} (${patternDefs[i].label.toLowerCase()})`;

    item.appendChild(svg);
    item.appendChild(label);
    legendDiv.appendChild(item);
  });

  // ── Tooltip ──
  const tooltip = d3.select("#tooltip");

  function showTooltip(event, d) {
    tooltip
      .style("opacity", 1)
      .style("left", (event.clientX + 14) + "px")
      .style("top", (event.clientY - 10) + "px")
      .html(`<div class="tt-cat">${d.category}</div>
             <div>${d.quarter}: <span class="tt-val">$${d.value.toFixed(1)}M</span></div>`);
  }
  function hideTooltip() { tooltip.style("opacity", 0); }

  // ── Build a chart panel ──
  function buildChart(containerId, panelLabel, applyFilter) {
    const wrapper = document.createElement("div");
    wrapper.className = "panel";
    const labelEl = document.createElement("div");
    labelEl.className = "panel-label";
    labelEl.textContent = panelLabel;
    wrapper.appendChild(labelEl);
    document.getElementById("panels").appendChild(wrapper);

    const svg = d3.select(wrapper).append("svg")
      .attr("width", width).attr("height", height)
      .attr("viewBox", `0 0 ${width} ${height}`);

    const defs = svg.append("defs");
    const prefix = applyFilter ? "deutan" : "normal";

    // Add patterns
    addPatterns(defs, prefix);

    // Add deuteranopia filter if needed
    if (applyFilter) {
      const filter = defs.append("filter").attr("id", "deuteranopia-filter")
        .attr("color-interpolation-filters", "linearRGB");
      filter.append("feColorMatrix")
        .attr("type", "matrix")
        .attr("values", deutanMatrix);
    }

    // Chart group — apply filter to entire chart content
    const chartG = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    if (applyFilter) {
      chartG.attr("filter", "url(#deuteranopia-filter)");
    }

    // Axes
    chartG.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${innerH})`)
      .call(d3.axisBottom(x0).tickSize(0).tickPadding(8))
      .call(g => g.select(".domain").remove());

    chartG.append("g")
      .attr("class", "axis")
      .call(d3.axisLeft(y).ticks(6).tickFormat(d => `$${d}M`).tickSize(-innerW))
      .call(g => g.select(".domain").remove())
      .call(g => g.selectAll(".tick line").attr("stroke", "#e0e0e0").attr("stroke-dasharray", "2,3"));

    // Y-axis label
    chartG.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -innerH / 2).attr("y", -38)
      .attr("text-anchor", "middle")
      .attr("font-size", 11).attr("fill", "#666")
      .text("Revenue");

    // Grouped bars
    const quarterGroups = chartG.selectAll(".quarter-group")
      .data(quarters)
      .join("g")
        .attr("class", "quarter-group")
        .attr("transform", q => `translate(${x0(q)},0)`);

    // For each quarter, draw bars for each category
    quarterGroups.each(function(q) {
      const g = d3.select(this);
      const qData = data.filter(d => d.quarter === q);

      qData.forEach(d => {
        const barX = x1(d.category);
        const barY = y(d.value);
        const barW = x1.bandwidth();
        const barH = innerH - barY;

        // Color fill
        g.append("rect")
          .attr("x", barX).attr("y", barY)
          .attr("width", barW).attr("height", barH)
          .attr("fill", colorScale(d.category))
          .attr("rx", 1);

        // Pattern overlay
        g.append("rect")
          .attr("x", barX).attr("y", barY)
          .attr("width", barW).attr("height", barH)
          .attr("fill", `url(#${prefix}-${patternScale(d.category)})`)
          .attr("rx", 1);
      });
    });

    // Transparent interaction overlay (on top, outside filter group for clean tooltips)
    const interG = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    quarters.forEach(q => {
      const qData = data.filter(d => d.quarter === q);
      qData.forEach(d => {
        const barX = x0(q) + x1(d.category);
        const barY = y(d.value);
        const barW = x1.bandwidth();
        const barH = innerH - barY;

        interG.append("rect")
          .datum(d)
          .attr("x", barX).attr("y", barY)
          .attr("width", barW).attr("height", barH)
          .attr("fill", "transparent")
          .attr("cursor", "pointer")
          .on("pointerenter", function(event, d) {
            d3.select(this).attr("fill", "rgba(255,255,255,0.25)").attr("stroke", "#333").attr("stroke-width", 1.5);
            showTooltip(event, d);
          })
          .on("pointermove", (event, d) => showTooltip(event, d))
          .on("pointerleave", function() {
            d3.select(this).attr("fill", "transparent").attr("stroke", "none");
            hideTooltip();
          });
      });
    });
  }

  // ── Render both panels ──
  buildChart("panels", "Normal Vision", false);
  buildChart("panels", "Deuteranopia Simulation", true);

})();
</script>
</body>
</html>
