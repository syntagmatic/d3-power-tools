<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skill Anatomy Treemap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Helvetica Neue', system-ui, sans-serif; }
  h1 {
    color: #e0e0e0; text-align: center; padding: 24px 0 4px;
    font-size: 22px; font-weight: 500; letter-spacing: 0.5px;
  }
  .subtitle {
    color: #888; text-align: center; font-size: 13px; padding-bottom: 16px;
  }
  #chart { width: 100%; max-width: 1100px; margin: 0 auto; }
  .tooltip {
    position: absolute; pointer-events: none; background: rgba(10,10,30,0.92);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
    padding: 8px 12px; font-size: 12px; color: #ccc; line-height: 1.5;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .tooltip .name { color: #fff; font-weight: 600; font-size: 13px; }
  .tooltip .lines { color: #aaa; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; padding: 12px 0 20px; }
  .legend-item { display: flex; align-items: center; gap: 5px; color: #999; font-size: 12px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; }
</style>
</head>
<body>
<h1>D3 Power Tools — Skill Line Counts</h1>
<p class="subtitle">Treemap of SKILL.md files grouped by category. Area ∝ lines of knowledge encoded.</p>
<div id="chart"></div>
<div class="legend" id="legend"></div>
<div class="tooltip" id="tooltip" style="display:none;"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = {
  name: "skills",
  children: [
    { name: "Seeing patterns", children: [
      { name: "parallel-coordinates", lines: 331 },
      { name: "brushing", lines: 304 },
      { name: "linked-views", lines: 304 },
      { name: "distributions", lines: 325 },
    ]},
    { name: "Seeing structure", children: [
      { name: "hierarchy-layouts", lines: 231 },
      { name: "hierarchy-interaction", lines: 184 },
      { name: "edge-bundling", lines: 237 },
      { name: "force", lines: 286 },
      { name: "network", lines: 266 },
    ]},
    { name: "Seeing place", children: [
      { name: "cartography", lines: 279 },
    ]},
    { name: "Seeing change", children: [
      { name: "time-series", lines: 317 },
      { name: "motion", lines: 253 },
      { name: "shape-morphing", lines: 216 },
    ]},
    { name: "Making it legible", children: [
      { name: "scales", lines: 308 },
      { name: "color", lines: 329 },
      { name: "visual-texture", lines: 210 },
      { name: "annotation", lines: 320 },
      { name: "data-table", lines: 327 },
      { name: "canvas-accessibility", lines: 341 },
    ]},
    { name: "Making it work", children: [
      { name: "canvas", lines: 251 },
      { name: "webgl", lines: 273 },
      { name: "navigation", lines: 286 },
      { name: "responsive", lines: 309 },
    ]},
    { name: "Before you render", children: [
      { name: "data-gathering", lines: 195 },
      { name: "sparkcharts", lines: 340 },
      { name: "small-multiples", lines: 228 },
    ]},
    { name: "Meta", children: [
      { name: "idiomatic-d3", lines: 294 },
      { name: "cross-skill-composition", lines: 259 },
      { name: "adversarial-eval", lines: 98 },
      { name: "check-skill", lines: 72 },
      { name: "sharpen-tool", lines: 75 },
      { name: "skill-eval", lines: 198 },
      { name: "visual-critic", lines: 101 },
      { name: "encoding-integrity", lines: 160 },
      { name: "interaction-stress-test", lines: 58 },
      { name: "perceptual-red-team", lines: 72 },
    ]},
  ]
};

const width = 1100;
const height = 640;

// Tol muted palette — colorblind-safe
const categoryColors = {
  "Seeing patterns":    "#332288",
  "Seeing structure":   "#88CCEE",
  "Seeing place":       "#44AA99",
  "Seeing change":      "#117733",
  "Making it legible":  "#999933",
  "Making it work":     "#DDCC77",
  "Before you render":  "#CC6677",
  "Meta":               "#AA4499",
};

const color = d3.scaleOrdinal()
  .domain(Object.keys(categoryColors))
  .range(Object.values(categoryColors));

const root = d3.treemap()
  .size([width, height])
  .paddingTop(22)
  .paddingRight(2)
  .paddingBottom(2)
  .paddingLeft(2)
  .paddingInner(2)
  .round(true)
  (d3.hierarchy(data)
    .sum(d => d.lines)
    .sort((a, b) => b.value - a.value));

const svg = d3.select("#chart").append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("width", "100%")
    .attr("style", "max-width: 1100px; height: auto;");

const tooltip = d3.select("#tooltip");

// Category group headers
svg.selectAll(".category-label")
  .data(root.children)
  .join("text")
    .attr("class", "category-label")
    .attr("x", d => d.x0 + 4)
    .attr("y", d => d.y0 + 15)
    .text(d => `${d.data.name} (${d.value} lines)`)
    .attr("fill", d => color(d.data.name))
    .attr("font-size", 11)
    .attr("font-weight", 600)
    .attr("font-family", "Helvetica Neue, system-ui, sans-serif");

// Leaf cells
const leaf = svg.selectAll(".leaf")
  .data(root.leaves())
  .join("g")
    .attr("class", "leaf")
    .attr("transform", d => `translate(${d.x0},${d.y0})`);

leaf.append("rect")
    .attr("width", d => d.x1 - d.x0)
    .attr("height", d => d.y1 - d.y0)
    .attr("fill", d => {
      const base = color(d.parent.data.name);
      // Vary lightness by relative size within category
      const siblings = d.parent.children;
      const maxLines = d3.max(siblings, s => s.value);
      const t = d.value / maxLines;
      return d3.interpolate(d3.color(base).darker(0.8), d3.color(base).brighter(0.3))(t);
    })
    .attr("rx", 2)
    .attr("opacity", 0.88)
    .attr("stroke", "rgba(255,255,255,0.06)")
    .attr("stroke-width", 0.5);

// Labels inside cells — only if they fit
leaf.each(function(d) {
  const w = d.x1 - d.x0;
  const h = d.y1 - d.y0;
  const g = d3.select(this);

  if (w > 50 && h > 28) {
    // Skill name
    const name = d.data.name.replace(/-/g, "\u2011"); // non-breaking hyphen
    const fontSize = w > 100 && h > 40 ? 11 : 9;
    g.append("text")
      .attr("x", 4)
      .attr("y", fontSize + 3)
      .text(name)
      .attr("fill", "#fff")
      .attr("font-size", fontSize)
      .attr("font-weight", 500)
      .attr("font-family", "Helvetica Neue, system-ui, sans-serif")
      .attr("opacity", 0.9);

    // Line count
    if (h > 40) {
      g.append("text")
        .attr("x", 4)
        .attr("y", fontSize + 17)
        .text(`${d.data.lines} lines`)
        .attr("fill", "#fff")
        .attr("font-size", 9)
        .attr("font-family", "Helvetica Neue, system-ui, sans-serif")
        .attr("opacity", 0.5);
    }
  }
});

// Hover interaction
leaf.on("pointerenter", (event, d) => {
  const category = d.parent.data.name;
  const pct = ((d.value / root.value) * 100).toFixed(1);
  tooltip.style("display", "block").html(
    `<div class="name">${d.data.name}</div>` +
    `<div class="lines">${d.data.lines} lines · ${pct}% of total</div>` +
    `<div style="color:${color(category)}">${category}</div>`
  );
  d3.select(event.currentTarget).select("rect")
    .attr("opacity", 1)
    .attr("stroke", "#fff")
    .attr("stroke-width", 1.5);
})
.on("pointermove", (event) => {
  tooltip
    .style("left", (event.pageX + 14) + "px")
    .style("top", (event.pageY - 10) + "px");
})
.on("pointerleave", (event) => {
  tooltip.style("display", "none");
  d3.select(event.currentTarget).select("rect")
    .attr("opacity", 0.88)
    .attr("stroke", "rgba(255,255,255,0.06)")
    .attr("stroke-width", 0.5);
});

// Annotation: largest skill callout
const largest = root.leaves().reduce((a, b) => a.value > b.value ? a : b);
const lx = (largest.x0 + largest.x1) / 2;
const ly = largest.y0;
const ax = Math.min(lx + 80, width - 140);
const ay = Math.max(ly - 50, 30);

svg.append("line")
    .attr("x1", lx).attr("y1", ly)
    .attr("x2", ax).attr("y2", ay + 10)
    .attr("stroke", "#fff").attr("stroke-opacity", 0.3)
    .attr("stroke-width", 1).attr("stroke-dasharray", "3,3");

svg.append("text")
    .attr("x", ax).attr("y", ay)
    .text(`↑ ${largest.data.name}: ${largest.data.lines} lines (largest)`)
    .attr("fill", "#fff").attr("font-size", 11).attr("opacity", 0.7)
    .attr("font-family", "Helvetica Neue, system-ui, sans-serif");

// Total annotation
const total = root.value;
svg.append("text")
    .attr("x", width - 8).attr("y", height - 8)
    .attr("text-anchor", "end")
    .text(`${total.toLocaleString()} total lines across ${root.leaves().length} skills`)
    .attr("fill", "#666").attr("font-size", 11)
    .attr("font-family", "Helvetica Neue, system-ui, sans-serif");

// Legend
const legend = d3.select("#legend");
for (const [name, c] of Object.entries(categoryColors)) {
  const count = root.children.find(d => d.data.name === name)?.value || 0;
  legend.append("div")
    .attr("class", "legend-item")
    .html(`<div class="legend-swatch" style="background:${c}"></div>${name} (${count})`);
}
</script>
</body>
</html>
