<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGL Edge-Bundled Network</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fafafa; color: #333; font-family: system-ui, -apple-system, sans-serif; }
  #container { position: relative; width: 1200px; height: 800px; margin: 0 auto; }
  canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  svg { position: absolute; top: 0; left: 0; }
  #controls {
    position: absolute; top: 14px; left: 20px; z-index: 10;
    background: rgba(255,255,255,0.92); padding: 10px 18px; border-radius: 8px;
    font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    display: flex; align-items: center; gap: 10px;
  }
  #controls label { color: #555; }
  #controls input[type=range] { width: 160px; accent-color: #4477AA; }
  #controls .val { font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 12px; min-width: 32px; }
  #info {
    position: absolute; bottom: 14px; left: 20px; z-index: 10;
    background: rgba(255,255,255,0.92); padding: 6px 14px; border-radius: 6px;
    font-size: 12px; color: #777; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  #tooltip {
    position: absolute; z-index: 20; pointer-events: none; display: none;
    background: rgba(255,255,255,0.95); border: 1px solid #ccc; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    white-space: nowrap;
  }
  #tooltip .name { font-weight: 600; }
  #tooltip .detail { color: #777; font-size: 11px; }
</style>
</head>
<body>
<div id="container">
  <canvas id="glCanvas"></canvas>
  <svg id="overlay"></svg>
  <div id="controls">
    <label>Tension</label>
    <input type="range" id="tensionSlider" min="0" max="100" value="85">
    <span class="val" id="tensionVal">0.85</span>
  </div>
  <div id="info"></div>
  <div id="tooltip"></div>
</div>
<script>
(() => {
  const W = 1200, H = 800;
  const cx = W / 2, cy = H / 2;
  const radius = 330;
  const dpr = window.devicePixelRatio || 1;

  // --- Seeded RNG ---
  const mulberry32 = (a) => () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rng = mulberry32(42);

  // Tol bright palette
  const tolBright = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377"];
  const tolRGB = tolBright.map(hex => {
    const c = d3.rgb(hex);
    return [c.r / 255, c.g / 255, c.b / 255];
  });

  // --- Generate hierarchy: 6 modules, ~50 leaves each = ~300 leaves ---
  const modules = ["core", "render", "data", "ui", "network", "utils"];
  const nodes = [{ id: "root", parent: "" }];

  modules.forEach((mod, mi) => {
    nodes.push({ id: mod, parent: "root" });
    // Sub-groups for deeper hierarchy (better bundling)
    const subCount = 3 + Math.floor(rng() * 4);
    for (let sg = 0; sg < subCount; sg++) {
      const subId = `${mod}.sub${sg}`;
      nodes.push({ id: subId, parent: mod });
      const leafCount = 6 + Math.floor(rng() * 10);
      for (let i = 0; i < leafCount; i++) {
        nodes.push({ id: `${subId}.${String(i).padStart(2, "0")}`, parent: subId });
      }
    }
  });

  const root = d3.stratify().id(d => d.id).parentId(d => d.parent || null)(nodes);

  // Radial cluster layout — leaves at equal radius
  const cluster = d3.cluster()
    .size([2 * Math.PI, radius])
    .separation((a, b) => (a.parent === b.parent ? 1 : 2) / a.depth);
  cluster(root);

  const leaves = root.leaves();
  const nodesById = new Map(root.descendants().map(d => [d.data.id, d]));

  // --- Generate ~1200 dependency edges ---
  const connections = [];
  const leafIds = leaves.map(d => d.data.id);

  // Intra-module edges (structurally meaningful — dense within subgroups)
  modules.forEach(mod => {
    const modLeaves = leafIds.filter(id => id.startsWith(mod + "."));
    for (let i = 0; i < modLeaves.length * 1.5; i++) {
      const a = modLeaves[Math.floor(rng() * modLeaves.length)];
      const b = modLeaves[Math.floor(rng() * modLeaves.length)];
      if (a !== b) connections.push({ source: a, target: b });
    }
  });

  // Cross-module edges (sparser, these create the visible bundles)
  // Weighted: some module pairs have more cross-links
  const crossWeights = [
    ["core", "render", 60], ["core", "data", 50], ["core", "ui", 40],
    ["render", "ui", 45], ["data", "network", 55], ["network", "utils", 30],
    ["ui", "utils", 25], ["data", "utils", 35], ["render", "network", 20],
    ["core", "network", 30], ["core", "utils", 20], ["ui", "data", 25],
  ];
  for (const [m1, m2, count] of crossWeights) {
    const l1 = leafIds.filter(id => id.startsWith(m1 + "."));
    const l2 = leafIds.filter(id => id.startsWith(m2 + "."));
    for (let i = 0; i < count; i++) {
      connections.push({
        source: l1[Math.floor(rng() * l1.length)],
        target: l2[Math.floor(rng() * l2.length)]
      });
    }
  }

  // Deduplicate
  const edgeSet = new Set();
  const uniqueEdges = connections.filter(e => {
    const key = e.source < e.target ? `${e.source}|${e.target}` : `${e.target}|${e.source}`;
    if (edgeSet.has(key)) return false;
    edgeSet.add(key);
    return true;
  });

  // LCA paths — node.path(target) returns [source, ...ancestors..., LCA, ...ancestors..., target]
  const lcaPaths = uniqueEdges.map(e => {
    const s = nodesById.get(e.source);
    const t = nodesById.get(e.target);
    return s && t ? s.path(t) : null;
  }).filter(Boolean);

  // Build per-leaf adjacency for fast hover lookup
  const leafEdgeMap = new Map(); // leafId -> Set of edge indices
  for (let i = 0; i < lcaPaths.length; i++) {
    const path = lcaPaths[i];
    const sId = path[0].data.id;
    const tId = path[path.length - 1].data.id;
    if (!leafEdgeMap.has(sId)) leafEdgeMap.set(sId, new Set());
    if (!leafEdgeMap.has(tId)) leafEdgeMap.set(tId, new Set());
    leafEdgeMap.get(sId).add(i);
    leafEdgeMap.get(tId).add(i);
  }

  // Module color for each leaf
  const leafModule = new Map();
  leaves.forEach(d => {
    const mod = d.data.id.split(".")[0];
    leafModule.set(d.data.id, modules.indexOf(mod));
  });

  // Radial to Cartesian
  const toXY = (node) => {
    const angle = node.x - Math.PI / 2;
    return [node.y * Math.cos(angle), node.y * Math.sin(angle)];
  };

  // --- Tessellate bundled Bezier curves ---
  const SEGS = 20; // segments per edge
  let beta = 0.15; // curveBundle beta: 0 = full bundle, 1 = straight

  // Build tessellated line-segment data for all edges
  // Each segment becomes an instanced quad (for thick lines with taper)
  const tessellate = (beta) => {
    // 6 floats per segment: x0, y0, a0, x1, y1, a1
    const data = new Float32Array(lcaPaths.length * SEGS * 6);
    let offset = 0;

    for (let ei = 0; ei < lcaPaths.length; ei++) {
      const path = lcaPaths[ei];
      const points = path.map(n => toXY(n));
      const start = points[0], end = points[points.length - 1];

      // Bundle interpolation: blend between straight line and tree path
      const bundled = points.map((p, i) => {
        const t = i / (points.length - 1);
        const straight = [
          start[0] + (end[0] - start[0]) * t,
          start[1] + (end[1] - start[1]) * t
        ];
        return [
          straight[0] * beta + p[0] * (1 - beta),
          straight[1] * beta + p[1] * (1 - beta)
        ];
      });

      // Resample to SEGS+1 points via linear interpolation along the path
      const resampled = [];
      for (let s = 0; s <= SEGS; s++) {
        const t = s / SEGS;
        const fi = t * (bundled.length - 1);
        const lo = Math.floor(fi);
        const hi = Math.min(lo + 1, bundled.length - 1);
        const f = fi - lo;
        resampled.push([
          bundled[lo][0] * (1 - f) + bundled[hi][0] * f,
          bundled[lo][1] * (1 - f) + bundled[hi][1] * f
        ]);
      }

      // Store segments with alpha taper (thick at center, thin at endpoints)
      for (let s = 0; s < SEGS; s++) {
        const t0 = s / SEGS, t1 = (s + 1) / SEGS;
        // Taper alpha: peaks at midpoint, fades at endpoints
        const a0 = 0.06 + 0.28 * (1 - Math.pow(Math.abs(t0 * 2 - 1), 1.5));
        const a1 = 0.06 + 0.28 * (1 - Math.pow(Math.abs(t1 * 2 - 1), 1.5));

        data[offset++] = resampled[s][0] + cx;
        data[offset++] = resampled[s][1] + cy;
        data[offset++] = a0;
        data[offset++] = resampled[s + 1][0] + cx;
        data[offset++] = resampled[s + 1][1] + cy;
        data[offset++] = a1;
      }
    }
    return data;
  };

  let segmentData = tessellate(beta);
  const totalSegs = lcaPaths.length * SEGS;

  // --- WebGL setup ---
  const canvas = document.getElementById("glCanvas");
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  const gl = canvas.getContext("webgl2", { antialias: true, premultipliedAlpha: false, alpha: true });
  gl.viewport(0, 0, W * dpr, H * dpr);

  // Shader compilation
  const compile = (src, type) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  };
  const linkProgram = (vSrc, fSrc) => {
    const p = gl.createProgram();
    gl.attachShader(p, compile(vSrc, gl.VERTEX_SHADER));
    gl.attachShader(p, compile(fSrc, gl.FRAGMENT_SHADER));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    return p;
  };

  // Instanced quad shader for thick lines with alpha taper
  // Template: unit quad [-0.5, 0.5] stretched along segment direction
  const program = linkProgram(
`#version 300 es
// Template quad vertex
in vec2 a_quad;
// Per-instance: segment endpoints with alpha
in vec3 a_p0;  // x0, y0, alpha0
in vec3 a_p1;  // x1, y1, alpha1
// Per-instance color + visibility
in vec4 a_color;

uniform vec2 u_resolution;
uniform float u_lineWidth;

out vec4 v_color;
out float v_edge;  // 0 at center, 1 at edge (for antialiasing)

void main() {
  vec2 p0 = a_p0.xy, p1 = a_p1.xy;
  vec2 dir = p1 - p0;
  float len = length(dir);
  vec2 unit = len > 0.001 ? dir / len : vec2(1.0, 0.0);
  vec2 normal = vec2(-unit.y, unit.x);

  // Quad vertex: x along segment, y perpendicular
  vec2 pos = p0 + unit * (a_quad.x + 0.5) * len + normal * a_quad.y * u_lineWidth;

  vec2 clip = (pos / u_resolution) * 2.0 - 1.0;
  clip.y = -clip.y;
  gl_Position = vec4(clip, 0.0, 1.0);

  // Interpolate alpha along segment
  float t = a_quad.x + 0.5;
  float alpha = mix(a_p0.z, a_p1.z, t);

  v_color = vec4(a_color.rgb, alpha * a_color.a);
  v_edge = abs(a_quad.y) * 2.0;
}`,
`#version 300 es
precision mediump float;
in vec4 v_color;
in float v_edge;
out vec4 fragColor;
void main() {
  // Soft antialiased edge
  float aa = 1.0 - smoothstep(0.7, 1.0, v_edge);
  fragColor = vec4(v_color.rgb, v_color.a * aa);
}`
  );

  // Template quad: 6 vertices forming two triangles
  const quadVerts = new Float32Array([
    -0.5, -0.5,  0.5, -0.5,  0.5, 0.5,
    -0.5, -0.5,  0.5,  0.5, -0.5, 0.5
  ]);

  // Per-instance color+visibility buffer: [r, g, b, visibility] per segment
  const colorVis = new Float32Array(totalSegs * 4);
  const buildColorVis = (highlightLeafId) => {
    const connectedEdges = highlightLeafId ? (leafEdgeMap.get(highlightLeafId) || new Set()) : null;

    for (let ei = 0; ei < lcaPaths.length; ei++) {
      const path = lcaPaths[ei];
      const sId = path[0].data.id;
      const sMod = leafModule.get(sId);
      const rgb = tolRGB[sMod] || tolRGB[0];

      let vis;
      if (!highlightLeafId) {
        vis = 1.0;
      } else if (connectedEdges.has(ei)) {
        vis = 2.5; // boost highlighted edges
      } else {
        vis = 0.06; // dim non-connected edges
      }

      for (let s = 0; s < SEGS; s++) {
        const idx = (ei * SEGS + s) * 4;
        colorVis[idx] = rgb[0];
        colorVis[idx + 1] = rgb[1];
        colorVis[idx + 2] = rgb[2];
        colorVis[idx + 3] = vis;
      }
    }
  };
  buildColorVis(null);

  // --- Create VAO and buffers ---
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  // Template quad buffer (shared by all instances)
  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);
  const aQuad = gl.getAttribLocation(program, "a_quad");
  gl.enableVertexAttribArray(aQuad);
  gl.vertexAttribPointer(aQuad, 2, gl.FLOAT, false, 0, 0);

  // Per-instance: p0 (x, y, alpha) — 3 floats
  const p0Buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, p0Buf);
  gl.bufferData(gl.ARRAY_BUFFER, totalSegs * 12, gl.DYNAMIC_DRAW);
  const aP0 = gl.getAttribLocation(program, "a_p0");
  gl.enableVertexAttribArray(aP0);
  gl.vertexAttribPointer(aP0, 3, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(aP0, 1);

  // Per-instance: p1 (x, y, alpha) — 3 floats
  const p1Buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, p1Buf);
  gl.bufferData(gl.ARRAY_BUFFER, totalSegs * 12, gl.DYNAMIC_DRAW);
  const aP1 = gl.getAttribLocation(program, "a_p1");
  gl.enableVertexAttribArray(aP1);
  gl.vertexAttribPointer(aP1, 3, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(aP1, 1);

  // Per-instance: color+vis — 4 floats
  const colorBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
  gl.bufferData(gl.ARRAY_BUFFER, colorVis, gl.DYNAMIC_DRAW);
  const aColor = gl.getAttribLocation(program, "a_color");
  gl.enableVertexAttribArray(aColor);
  gl.vertexAttribPointer(aColor, 4, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(aColor, 1);

  gl.bindVertexArray(null);

  // Upload segment data split into p0 and p1 buffers
  const p0Data = new Float32Array(totalSegs * 3);
  const p1Data = new Float32Array(totalSegs * 3);

  const uploadSegments = () => {
    for (let i = 0; i < totalSegs; i++) {
      const base = i * 6;
      p0Data[i * 3] = segmentData[base];
      p0Data[i * 3 + 1] = segmentData[base + 1];
      p0Data[i * 3 + 2] = segmentData[base + 2];
      p1Data[i * 3] = segmentData[base + 3];
      p1Data[i * 3 + 1] = segmentData[base + 4];
      p1Data[i * 3 + 2] = segmentData[base + 5];
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, p0Buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, p0Data);
    gl.bindBuffer(gl.ARRAY_BUFFER, p1Buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, p1Data);
  };
  uploadSegments();

  // --- Draw ---
  const draw = () => {
    gl.clearColor(250/255, 250/255, 250/255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(program);
    gl.bindVertexArray(vao);
    gl.uniform2f(gl.getUniformLocation(program, "u_resolution"), W, H);
    gl.uniform1f(gl.getUniformLocation(program, "u_lineWidth"), 1.4 * dpr);

    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, totalSegs);
    gl.disable(gl.BLEND);
  };

  // --- SVG overlay: nodes, labels, legend, hover targets ---
  const svg = d3.select("#overlay")
    .attr("width", W).attr("height", H)
    .style("pointer-events", "all");

  // Title
  svg.append("text")
    .attr("x", W / 2).attr("y", 30)
    .attr("text-anchor", "middle")
    .attr("fill", "#333").attr("font-size", 17).attr("font-weight", 600)
    .text("Radial Edge-Bundled Dependency Network");

  svg.append("text")
    .attr("x", W / 2).attr("y", 48)
    .attr("text-anchor", "middle")
    .attr("fill", "#888").attr("font-size", 12)
    .text("Hover a node to trace its connections. Drag the tension slider to bundle or unbundle.");

  const g = svg.append("g").attr("transform", `translate(${cx},${cy})`);

  // Node dots
  g.selectAll("circle.dot")
    .data(leaves)
    .join("circle")
    .attr("class", "dot")
    .attr("cx", d => toXY(d)[0])
    .attr("cy", d => toXY(d)[1])
    .attr("r", 3)
    .attr("fill", d => tolBright[leafModule.get(d.data.id)])
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.5)
    .attr("pointer-events", "none");

  // Labels — show only a subset to avoid clutter; full labels on hover
  const labelGroup = g.selectAll("g.label")
    .data(leaves)
    .join("g")
    .attr("class", "label")
    .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y + 8},0)`);

  labelGroup.append("text")
    .attr("dy", "0.31em")
    .attr("transform", d => d.x < Math.PI ? null : "rotate(180)")
    .attr("text-anchor", d => d.x < Math.PI ? "start" : "end")
    .attr("fill", d => tolBright[leafModule.get(d.data.id)])
    .attr("font-size", 6.5)
    .attr("opacity", 0.55)
    .text(d => {
      const parts = d.data.id.split(".");
      return parts[parts.length - 1]; // short label
    });

  // Invisible hover targets on leaves
  labelGroup.append("circle")
    .attr("r", 10)
    .attr("fill", "transparent")
    .attr("cursor", "pointer")
    .on("pointerenter", (event, d) => highlight(d))
    .on("pointerleave", () => unhighlight());

  // --- Tooltip ---
  const tooltip = document.getElementById("tooltip");

  // --- Hover highlight ---
  let activeLeaf = null;

  const highlight = (node) => {
    const leafId = node.data.id;
    if (activeLeaf === leafId) return;
    activeLeaf = leafId;

    const connectedEdges = leafEdgeMap.get(leafId) || new Set();
    const connectedLeaves = new Set([leafId]);
    for (const ei of connectedEdges) {
      const path = lcaPaths[ei];
      connectedLeaves.add(path[0].data.id);
      connectedLeaves.add(path[path.length - 1].data.id);
    }

    // Update colorVis buffer
    buildColorVis(leafId);
    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, colorVis);
    draw();

    // Update labels
    labelGroup.select("text")
      .attr("opacity", d => connectedLeaves.has(d.data.id) ? 1 : 0.08)
      .attr("font-size", d => d.data.id === leafId ? 9 : connectedLeaves.has(d.data.id) ? 7.5 : 6.5)
      .attr("font-weight", d => d.data.id === leafId ? 700 : 400);

    // Update dots
    g.selectAll("circle.dot")
      .attr("r", d => d.data.id === leafId ? 5 : connectedLeaves.has(d.data.id) ? 4 : 2)
      .attr("opacity", d => connectedLeaves.has(d.data.id) ? 1 : 0.15);

    // Tooltip
    const mod = leafId.split(".")[0];
    const degree = connectedEdges.size;
    tooltip.innerHTML = `<div class="name">${leafId}</div><div class="detail">Module: ${mod} &middot; ${degree} connections</div>`;
    tooltip.style.display = "block";

    // Position tooltip near the node
    const [nx, ny] = toXY(node);
    const tx = cx + nx, ty = cy + ny;
    tooltip.style.left = (tx + 15) + "px";
    tooltip.style.top = (ty - 10) + "px";
  };

  const unhighlight = () => {
    activeLeaf = null;
    buildColorVis(null);
    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, colorVis);
    draw();

    labelGroup.select("text")
      .attr("opacity", 0.55)
      .attr("font-size", 6.5)
      .attr("font-weight", 400);

    g.selectAll("circle.dot").attr("r", 3).attr("opacity", 1);
    tooltip.style.display = "none";
  };

  // --- Tension slider ---
  const slider = document.getElementById("tensionSlider");
  const tensionVal = document.getElementById("tensionVal");
  let rafId = 0;

  slider.addEventListener("input", () => {
    const tension = slider.value / 100;
    beta = 1 - tension;
    tensionVal.textContent = tension.toFixed(2);

    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      segmentData = tessellate(beta);
      uploadSegments();
      // Reapply current highlight state
      if (activeLeaf) {
        buildColorVis(activeLeaf);
      } else {
        buildColorVis(null);
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, colorVis);
      draw();
    });
  });

  // --- Legend ---
  const legG = svg.append("g").attr("transform", `translate(${W - 130}, 20)`);
  legG.append("text")
    .attr("font-size", 11).attr("font-weight", 600).attr("fill", "#555")
    .text("Modules");

  modules.forEach((mod, i) => {
    const row = legG.append("g").attr("transform", `translate(0, ${18 + i * 20})`);
    row.append("circle").attr("cx", 6).attr("cy", 0).attr("r", 5)
      .attr("fill", tolBright[i]);
    row.append("text").attr("x", 16).attr("dy", "0.35em")
      .attr("fill", "#555").attr("font-size", 12)
      .text(mod);
  });

  // Info bar
  document.getElementById("info").textContent =
    `${modules.length} modules \u00B7 ${leaves.length} leaves \u00B7 ${uniqueEdges.length} edges \u00B7 WebGL instanced quads`;

  // --- Context loss handling ---
  canvas.addEventListener("webglcontextlost", e => e.preventDefault());

  // Initial draw
  draw();
})();
</script>
</body>
</html>
