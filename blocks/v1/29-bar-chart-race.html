<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bar Chart Race — World GDP Rankings (1993–2023)</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  #container { width: 100%; max-width: 1200px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  h1 { font-size: 1.25rem; font-weight: 700; color: #222; }
  .subtitle { font-size: 0.82rem; color: #777; }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .controls button {
    font-family: system-ui;
    font-size: 0.82rem;
    padding: 5px 16px;
    border: 1px solid #bbb;
    border-radius: 5px;
    background: #fff;
    cursor: pointer;
    color: #333;
    transition: background 120ms, color 120ms;
    user-select: none;
  }
  .controls button:hover { background: #f0f0f0; }
  .controls button.active {
    background: #4477AA;
    color: #fff;
    border-color: #336699;
  }
  .separator { width: 1px; height: 22px; background: #ddd; }
  .scrubber-wrap {
    flex: 1;
    min-width: 200px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .scrubber-wrap input[type="range"] {
    flex: 1;
    accent-color: #4477AA;
    cursor: pointer;
  }
  .scrubber-year {
    font-size: 0.82rem;
    font-weight: 600;
    color: #555;
    min-width: 36px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .year-watermark {
    font-size: 5rem;
    font-weight: 800;
    fill: #eee;
    text-anchor: end;
    dominant-baseline: auto;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .bar-label {
    font-size: 0.78rem;
    fill: #333;
    font-weight: 600;
  }
  .bar-value {
    font-size: 0.72rem;
    fill: #555;
    font-weight: 400;
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
  }
  .bar-flag {
    font-size: 0.62rem;
    fill: #fff;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .source {
    font-size: 0.68rem;
    color: #aaa;
    margin-top: 6px;
    text-align: right;
  }
</style>
</head>
<body>
<div id="container">
  <header>
    <h1>World GDP Rankings</h1>
    <span class="subtitle">Nominal GDP in trillions USD, top 12 of 15 countries</span>
  </header>
  <div class="controls">
    <button id="btn-play">Pause</button>
    <div class="separator"></div>
    <button class="speed-btn" data-speed="0.5">0.5x</button>
    <button class="speed-btn active" data-speed="1">1x</button>
    <button class="speed-btn" data-speed="2">2x</button>
    <button class="speed-btn" data-speed="4">4x</button>
    <div class="separator"></div>
    <div class="scrubber-wrap">
      <input type="range" id="scrubber" min="1993" max="2023" step="1" value="1993">
      <span class="scrubber-year" id="scrubber-label">1993</span>
    </div>
  </div>
  <div id="chart"></div>
  <div class="source">Synthetic data with realistic growth curves. Not actual GDP figures.</div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function() {
  "use strict";

  // ── DATA ──────────────────────────────────────────────────────────
  // 15 countries with realistic GDP trajectories (trillions USD, nominal)
  const countries = [
    { name: "United States", code: "US", g: [6.86,7.29,7.64,8.10,8.79,9.63,10.25,10.58,10.94,11.51,12.27,13.04,13.81,14.45,14.71,14.45,14.99,15.54,16.16,16.69,17.39,18.04,18.71,19.52,20.53,21.37,20.89,23.32,25.46,25.46,27.36] },
    { name: "China",         code: "CN", g: [0.44,0.56,0.73,0.86,1.03,1.09,1.21,1.34,1.47,1.66,1.96,2.29,2.75,3.55,4.59,5.10,6.09,7.55,8.53,9.57,10.48,11.06,11.23,12.24,13.89,14.28,14.69,17.73,17.96,17.79,17.79] },
    { name: "Japan",         code: "JP", g: [4.45,5.33,5.45,4.71,4.03,4.43,4.89,4.16,3.98,4.30,4.56,4.57,4.36,4.36,4.85,5.04,5.70,6.16,6.20,5.16,4.90,4.44,4.92,4.87,4.97,5.08,5.04,4.94,4.23,4.21,4.21] },
    { name: "Germany",       code: "DE", g: [2.07,2.59,2.59,2.22,2.24,2.20,1.95,1.95,2.08,2.50,2.86,2.90,3.00,3.44,3.75,3.42,3.42,3.75,3.54,3.75,3.89,3.36,3.47,3.69,3.97,3.89,3.85,4.26,4.07,4.46,4.46] },
    { name: "United Kingdom",code: "GB", g: [1.06,1.18,1.24,1.35,1.51,1.67,1.66,1.60,1.78,2.05,2.42,2.54,2.71,3.09,2.93,2.41,2.48,2.62,2.70,2.79,3.00,2.93,2.69,2.66,2.83,2.83,2.70,3.12,3.07,3.07,3.34] },
    { name: "India",         code: "IN", g: [0.28,0.36,0.39,0.42,0.42,0.46,0.47,0.49,0.52,0.60,0.72,0.83,0.94,1.24,1.20,1.34,1.68,1.82,1.83,1.86,2.04,2.10,2.29,2.65,2.70,2.84,2.67,3.18,3.39,3.57,3.57] },
    { name: "France",        code: "FR", g: [1.37,1.61,1.60,1.45,1.50,1.49,1.37,1.38,1.50,1.84,2.20,2.20,2.32,2.66,2.92,2.69,2.64,2.86,2.68,2.81,2.85,2.44,2.47,2.58,2.79,2.72,2.63,2.96,2.78,3.05,3.05] },
    { name: "Italy",         code: "IT", g: [1.02,1.17,1.32,1.24,1.23,1.21,1.14,1.17,1.27,1.57,1.80,1.85,1.94,2.21,2.39,2.19,2.13,2.28,2.09,2.13,2.16,1.83,1.87,1.96,2.09,2.00,1.89,2.11,2.01,2.19,2.19] },
    { name: "Brazil",        code: "BR", g: [0.43,0.77,0.85,0.88,0.86,0.60,0.65,0.56,0.51,0.55,0.67,0.89,1.11,1.40,1.70,1.67,2.21,2.62,2.47,2.47,2.46,1.80,1.80,2.06,1.92,1.87,1.45,1.65,1.92,2.13,2.13] },
    { name: "Canada",        code: "CA", g: [0.56,0.59,0.61,0.64,0.62,0.66,0.74,0.73,0.76,0.87,1.02,1.13,1.31,1.46,1.55,1.37,1.61,1.79,1.83,1.84,1.80,1.56,1.53,1.65,1.71,1.74,1.64,1.99,2.14,2.12,2.12] },
    { name: "Russia",        code: "RU", g: [0.28,0.40,0.40,0.39,0.27,0.20,0.26,0.31,0.35,0.43,0.59,0.76,0.99,1.30,1.66,1.22,1.52,2.05,2.21,2.29,2.06,1.36,1.28,1.57,1.66,1.70,1.48,1.78,2.24,1.86,1.86] },
    { name: "South Korea",   code: "KR", g: [0.41,0.56,0.60,0.56,0.37,0.49,0.56,0.53,0.61,0.68,0.79,0.90,1.01,1.12,1.00,0.90,1.09,1.20,1.22,1.31,1.41,1.38,1.41,1.53,1.62,1.65,1.64,1.80,1.67,1.71,1.71] },
    { name: "Australia",     code: "AU", g: [0.31,0.37,0.40,0.43,0.40,0.39,0.40,0.38,0.42,0.53,0.61,0.69,0.75,0.95,1.05,0.93,1.25,1.54,1.56,1.57,1.46,1.35,1.27,1.38,1.43,1.40,1.33,1.63,1.75,1.69,1.69] },
    { name: "Spain",         code: "ES", g: [0.49,0.61,0.63,0.57,0.60,0.62,0.59,0.62,0.69,0.89,1.07,1.13,1.26,1.48,1.63,1.50,1.43,1.49,1.34,1.36,1.38,1.20,1.23,1.31,1.42,1.39,1.28,1.43,1.40,1.58,1.58] },
    { name: "Mexico",        code: "MX", g: [0.44,0.34,0.40,0.48,0.50,0.58,0.68,0.72,0.74,0.72,0.79,0.87,0.96,1.04,1.10,0.90,1.05,1.17,1.19,1.27,1.31,1.17,1.08,1.15,1.22,1.27,1.09,1.29,1.41,1.32,1.32] },
  ];

  const startYear = 1993, endYear = 2023;
  const years = d3.range(startYear, endYear + 1);

  // Build lookup: data[country][year] = gdp
  const dataMap = new Map();
  countries.forEach(c => {
    const m = new Map();
    years.forEach((yr, i) => m.set(yr, c.g[i]));
    dataMap.set(c.name, { code: c.code, values: m });
  });

  // Interpolate between integer years for smooth sub-year animation
  const interpolateYear = (yearFloat) => {
    const lo = Math.floor(yearFloat), hi = Math.min(lo + 1, endYear);
    const frac = yearFloat - lo;
    return countries.map(c => {
      const entry = dataMap.get(c.name);
      const v0 = entry.values.get(lo) || 0;
      const v1 = entry.values.get(hi) || v0;
      return { country: c.name, code: entry.code, gdp: v0 + (v1 - v0) * frac };
    });
  };

  // ── COLOR ─────────────────────────────────────────────────────────
  // Tol Bright (7) + subset of Tol Muted (8) for 15 distinct colors
  const tolBright = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377","#BBBBBB"];
  const tolMuted  = ["#CC6677","#332288","#DDCC77","#117733","#88CCEE","#882255","#44AA99","#999933"];
  const palette = [...tolBright, ...tolMuted];
  const colorScale = d3.scaleOrdinal()
    .domain(countries.map(c => c.name))
    .range(palette);

  // ── LAYOUT ────────────────────────────────────────────────────────
  const nBars = 12;
  const margin = { top: 24, right: 100, bottom: 14, left: 150 };
  const barHeight = 36;
  const barPad = 5;
  const totalWidth = 1200;
  const innerWidth = totalWidth - margin.left - margin.right;
  const innerHeight = nBars * (barHeight + barPad) - barPad;
  const totalHeight = innerHeight + margin.top + margin.bottom;

  const svg = d3.select("#chart").append("svg")
      .attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`)
      .attr("width", "100%")
      .attr("preserveAspectRatio", "xMidYMid meet");

  const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

  // Year watermark
  const yearText = svg.append("text")
      .attr("class", "year-watermark")
      .attr("x", totalWidth - margin.right)
      .attr("y", totalHeight - 16)
      .text(startYear);

  // Thin x axis line at top
  g.append("line")
    .attr("x1", 0).attr("y1", 0)
    .attr("x2", innerWidth).attr("y2", 0)
    .attr("stroke", "#ddd").attr("stroke-width", 0.5);

  // Scales
  const x = d3.scaleLinear().range([0, innerWidth]);
  const yPos = (rank) => rank * (barHeight + barPad);

  // ── ANIMATION STATE ───────────────────────────────────────────────
  let currentYear = startYear;
  let playing = true;
  let speed = 1;
  let timer = null;

  const tickInterval = () => Math.max(16, 80 / speed);
  const yearStep = () => 0.1 * speed; // sub-year stepping for smooth motion

  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

  // ── RENDER ────────────────────────────────────────────────────────
  function render(yearFloat) {
    const allCountries = interpolateYear(yearFloat);
    allCountries.sort((a, b) => b.gdp - a.gdp);
    const data = allCountries.slice(0, nBars);

    const maxGdp = d3.max(data, d => d.gdp) * 1.08;
    x.domain([0, maxGdp]);

    const dur = reducedMotion.matches ? 0 : tickInterval();

    // --- Bars ---
    g.selectAll(".bar")
      .data(data, d => d.country)
      .join(
        enter => enter.append("rect")
          .attr("class", "bar")
          .attr("x", 0)
          .attr("rx", 3)
          .attr("fill", d => colorScale(d.country))
          .attr("y", (d, i) => yPos(i))
          .attr("height", barHeight)
          .attr("width", 0)
          .attr("opacity", 0)
          .call(e => e.transition().duration(dur)
            .attr("width", d => Math.max(0, x(d.gdp)))
            .attr("opacity", 1)),
        update => update
          .call(u => u.transition("move").duration(dur).ease(d3.easeLinear)
            .attr("y", (d, i) => yPos(i))
            .attr("width", d => Math.max(0, x(d.gdp)))
            .attr("height", barHeight)
            .attr("opacity", 1)),
        exit => exit
          .call(e => e.transition().duration(dur)
            .attr("width", 0).attr("opacity", 0).remove())
      );

    // --- Country labels (left of bars) ---
    g.selectAll(".bar-label")
      .data(data, d => d.country)
      .join(
        enter => enter.append("text")
          .attr("class", "bar-label")
          .attr("x", -10)
          .attr("text-anchor", "end")
          .attr("dominant-baseline", "central")
          .attr("y", (d, i) => yPos(i) + barHeight / 2)
          .attr("opacity", 0)
          .text(d => d.country)
          .call(e => e.transition().duration(dur).attr("opacity", 1)),
        update => update
          .call(u => u.transition("move").duration(dur).ease(d3.easeLinear)
            .attr("y", (d, i) => yPos(i) + barHeight / 2)
            .attr("opacity", 1)),
        exit => exit
          .call(e => e.transition().duration(dur).attr("opacity", 0).remove())
      );

    // --- Country code inside bar ---
    g.selectAll(".bar-flag")
      .data(data, d => d.country)
      .join(
        enter => enter.append("text")
          .attr("class", "bar-flag")
          .attr("text-anchor", "end")
          .attr("dominant-baseline", "central")
          .attr("y", (d, i) => yPos(i) + barHeight / 2)
          .attr("x", d => Math.max(24, x(d.gdp) - 8))
          .attr("opacity", 0)
          .text(d => d.code)
          .call(e => e.transition().duration(dur).attr("opacity", 1)),
        update => update
          .call(u => u.transition("move").duration(dur).ease(d3.easeLinear)
            .attr("y", (d, i) => yPos(i) + barHeight / 2)
            .attr("x", d => Math.max(24, x(d.gdp) - 8))
            .attr("opacity", 1)),
        exit => exit
          .call(e => e.transition().duration(dur).attr("opacity", 0).remove())
      );

    // --- GDP value labels (right of bar) ---
    g.selectAll(".bar-value")
      .data(data, d => d.country)
      .join(
        enter => enter.append("text")
          .attr("class", "bar-value")
          .attr("text-anchor", "start")
          .attr("dominant-baseline", "central")
          .attr("y", (d, i) => yPos(i) + barHeight / 2)
          .attr("x", d => x(d.gdp) + 8)
          .attr("opacity", 0)
          .text(d => `$${d.gdp.toFixed(1)}T`)
          .call(e => e.transition().duration(dur).attr("opacity", 1)),
        update => update
          .text(d => `$${d.gdp.toFixed(1)}T`)
          .call(u => u.transition("move").duration(dur).ease(d3.easeLinear)
            .attr("y", (d, i) => yPos(i) + barHeight / 2)
            .attr("x", d => x(d.gdp) + 8)
            .attr("opacity", 1)),
        exit => exit
          .call(e => e.transition().duration(dur).attr("opacity", 0).remove())
      );

    // --- Year watermark ---
    yearText.text(Math.round(yearFloat));

    // --- Scrubber sync ---
    scrubber.value = Math.round(yearFloat);
    scrubberLabel.textContent = Math.round(yearFloat);
  }

  // ── CONTROLS ──────────────────────────────────────────────────────
  const scrubber = document.getElementById("scrubber");
  const scrubberLabel = document.getElementById("scrubber-label");

  // Initial render
  render(startYear);

  function tick() {
    if (currentYear >= endYear) {
      stopPlaying();
      d3.select("#btn-play").text("Replay");
      return;
    }
    currentYear = Math.min(currentYear + yearStep(), endYear);
    render(currentYear);
  }

  function startPlaying() {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, tickInterval());
  }

  function stopPlaying() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  // Auto-play
  startPlaying();

  d3.select("#btn-play").on("click", () => {
    if (currentYear >= endYear) {
      currentYear = startYear;
      render(currentYear);
      playing = true;
      d3.select("#btn-play").text("Pause");
      startPlaying();
      return;
    }
    playing = !playing;
    d3.select("#btn-play").text(playing ? "Pause" : "Play");
    if (playing) startPlaying(); else stopPlaying();
  });

  d3.selectAll(".speed-btn").on("click", function() {
    d3.selectAll(".speed-btn").classed("active", false);
    d3.select(this).classed("active", true);
    speed = +this.dataset.speed;
    if (playing) { stopPlaying(); startPlaying(); }
  });

  // Scrubber: drag to seek
  scrubber.addEventListener("input", () => {
    const wasPlaying = playing;
    if (playing) { playing = false; stopPlaying(); d3.select("#btn-play").text("Play"); }
    currentYear = +scrubber.value;
    render(currentYear);
  });

  // Keyboard: left/right arrow step by year
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" && currentYear < endYear) {
      currentYear = Math.min(currentYear + 1, endYear);
      render(currentYear);
    } else if (e.key === "ArrowLeft" && currentYear > startYear) {
      currentYear = Math.max(currentYear - 1, startYear);
      render(currentYear);
    } else if (e.key === " ") {
      e.preventDefault();
      d3.select("#btn-play").node().click();
    }
  });

  // Pause when tab hidden, resume when visible
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { stopPlaying(); }
    else if (playing) { startPlaying(); }
  });
})();
</script>
</body>
</html>
