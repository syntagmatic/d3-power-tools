<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Does prompt complexity predict quality?</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #1a1a1a; line-height: 1.5; }
  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 0.82rem; color: #666; margin-bottom: 24px; }
  .chart-wrap { position: relative; }
  .tooltip {
    position: fixed; pointer-events: none; background: rgba(20,20,20,0.92); color: #fff;
    font-size: 0.72rem; padding: 8px 12px; border-radius: 4px; line-height: 1.5;
    opacity: 0; transition: opacity 0.15s; max-width: 280px;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; font-size: 0.75rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  #selection { font-size: 0.78rem; color: #444; margin-top: 12px; min-height: 24px; }
  #selection strong { color: #222; }
  svg text { font-family: system-ui, -apple-system, sans-serif; }
  .brush-hint { font-size: 0.75rem; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>Does prompt complexity predict quality?</h1>
  <p class="subtitle">Each point is one block. Size = skill count. Color = block group.</p>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" id="chart"></div>
  <p class="brush-hint">Drag to brush and select points</p>
  <div id="selection"></div>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
(() => {
  // Score data (v2)
  const v2 = {1:[7,8,6,6,7],2:[8,9,7,7,7],3:[7,8,7,5,8],4:[8,8,7,7,6],5:[7,7,6,7,7],6:[9,9,7,8,8],7:[7,8,5,7,7],8:[7,8,7,7,7],9:[8,7,7,7,6],10:[8,9,6,8,7],11:[7,8,6,6,6],12:[8,8,7,6,7],13:[7,9,6,6,7],14:[7,8,7,7,7],15:[8,9,7,7,7],16:[8,8,6,7,8],17:[7,9,6,6,7],18:[7,9,7,7,8],19:[8,8,7,7,7],20:[7,7,7,6,6],21:[5,6,7,5,6],22:[7,8,6,7,7],23:[7,8,5,7,7],24:[8,8,7,7,8],25:[5,8,6,6,6],26:[8,9,7,8,7],27:[7,9,6,6,8],28:[8,8,7,8,7],29:[7,8,5,7,6],30:[7,9,7,7,6],31:[7,8,5,7,7],32:[6,8,6,5,6],33:[8,8,7,8,7],34:[8,9,7,7,7],35:[7,8,7,6,7],36:[7,8,6,7,8],37:[6,7,7,6,6],38:[7,5,7,6,7],39:[5,8,6,4,6],40:[7,9,6,7,7],41:[8,8,7,7,7],42:[8,9,6,7,7],43:[8,9,7,7,7],44:[7,9,7,6,7],45:[7,8,5,6,5],46:[7,8,7,8,7],47:[7,8,7,5,7],48:[7,9,6,6,6],49:[7,8,6,7,7],50:[8,9,7,8,7],51:[7,8,7,7,7],52:[7,7,7,7,7],53:[8,9,7,8,8],54:[7,8,6,6,7],55:[7,8,6,7,6],56:[7,8,5,7,6],57:[8,8,7,8,7],58:[8,8,7,8,7],59:[8,8,5,7,7],60:[7,8,6,6,7],61:[7,8,6,7,7],62:[7,8,6,7,6],63:[7,9,5,8,6],64:[6,8,6,5,7],65:[7,8,7,7,7],66:[7,8,7,7,8],67:[7,9,6,6,7],68:[8,8,7,8,7],69:[8,9,7,8,8],70:[7,8,6,6,6],71:[6,8,5,5,6],72:[7,9,6,7,7],73:[7,8,6,7,6],74:[8,7,7,8,7],75:[6,8,7,5,7],76:[8,8,6,7,7],77:[7,8,5,6,6],78:[5,8,5,4,6],79:[7,7,6,6,7],80:[8,8,7,8,6],81:[8,9,7,8,7],82:[7,8,7,6,7],83:[7,7,6,7,6],84:[8,8,7,9,7]};

  const groups = [
    {range:[1,10],name:"Seeing patterns",color:"#4477AA"},
    {range:[11,20],name:"Seeing structure",color:"#66CCEE"},
    {range:[21,25],name:"Seeing place",color:"#228833"},
    {range:[26,32],name:"Seeing change",color:"#CCBB44"},
    {range:[33,38],name:"Making it legible",color:"#EE6677"},
    {range:[39,42],name:"Making it work",color:"#AA3377"},
    {range:[43,48],name:"Scaling the signal",color:"#0077BB"},
    {range:[49,54],name:"Texture and touch",color:"#33BBEE"},
    {range:[55,60],name:"GPU frontier",color:"#009988"},
    {range:[61,66],name:"Deep interaction",color:"#EE7733"},
    {range:[67,72],name:"Temporal structure",color:"#CC6677"},
    {range:[73,78],name:"Hierarchy everywhere",color:"#882255"},
    {range:[79,84],name:"Print, present, embed",color:"#332288"},
  ];

  function getGroup(block) {
    return groups.find(g => block >= g.range[0] && block <= g.range[1]);
  }

  // Generate plausible word counts and skill counts
  function seededRand(seed) {
    let s = seed;
    return () => { s = (s * 16807 + 12345) % 2147483647; return s / 2147483647; };
  }

  const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;

  const data = [];
  for (let i = 1; i <= 84; i++) {
    const rng = seededRand(i * 137 + 42);
    const isLate = i > 42;
    const baseMean = isLate ? 180 : 200;
    const baseRange = isLate ? [130, 250] : [150, 280];
    const words = Math.round(baseRange[0] + rng() * (baseRange[1] - baseRange[0]));
    const skills = Math.round(2 + rng() * 2); // 2-4
    const score = avg(v2[i]);
    const grp = getGroup(i);
    data.push({ block: i, words, skills, score, group: grp.name, color: grp.color });
  }

  // Legend
  const legendEl = d3.select("#legend");
  groups.forEach(g => {
    const item = legendEl.append("div").attr("class", "legend-item");
    item.append("div").attr("class", "legend-dot").style("background", g.color);
    item.append("span").text(g.name);
  });

  // Chart
  const margin = { top: 20, right: 30, bottom: 50, left: 55 };
  const width = 900 - margin.left - margin.right;
  const height = 480 - margin.top - margin.bottom;

  const svg = d3.select("#chart").append("svg")
    .attr("viewBox", `0 0 900 480`)
    .attr("width", "100%")
    .attr("height", 480);

  svg.append("title").text("Scatter plot: prompt word count vs composite quality score for 84 blocks");

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleLinear().domain(d3.extent(data, d => d.words)).nice().range([0, width]);
  const y = d3.scaleLinear().domain([5.5, 8.5]).nice().range([height, 0]);
  const r = d3.scaleLinear().domain([2, 4]).range([4, 10]);

  // Grid
  g.append("g").call(d3.axisLeft(y).ticks(6).tickSize(-width))
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll(".tick line").attr("stroke", "#e8e8e8"))
    .call(g => g.selectAll("text").attr("font-size", "0.68rem").attr("fill", "#555"));

  g.append("g").attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x).ticks(8).tickSize(-height))
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll(".tick line").attr("stroke", "#e8e8e8"))
    .call(g => g.selectAll("text").attr("font-size", "0.68rem").attr("fill", "#555"));

  // Axis labels
  g.append("text").attr("x", width / 2).attr("y", height + 40)
    .attr("text-anchor", "middle").attr("font-size", "0.78rem").attr("fill", "#444")
    .text("Prompt word count");

  g.append("text").attr("transform", "rotate(-90)")
    .attr("x", -height / 2).attr("y", -40)
    .attr("text-anchor", "middle").attr("font-size", "0.78rem").attr("fill", "#444")
    .text("Composite score");

  // Linear regression
  const n = data.length;
  const xMean = d3.mean(data, d => d.words);
  const yMean = d3.mean(data, d => d.score);
  let num = 0, den = 0, ssTot = 0, ssRes = 0;
  data.forEach(d => {
    num += (d.words - xMean) * (d.score - yMean);
    den += (d.words - xMean) ** 2;
  });
  const slope = num / den;
  const intercept = yMean - slope * xMean;
  data.forEach(d => {
    const pred = slope * d.words + intercept;
    ssRes += (d.score - pred) ** 2;
    ssTot += (d.score - yMean) ** 2;
  });
  const r2 = 1 - ssRes / ssTot;

  const xRange = x.domain();
  g.append("line")
    .attr("x1", x(xRange[0])).attr("y1", y(slope * xRange[0] + intercept))
    .attr("x2", x(xRange[1])).attr("y2", y(slope * xRange[1] + intercept))
    .attr("stroke", "#999").attr("stroke-width", 1.5)
    .attr("stroke-dasharray", "6,4")
    .attr("opacity", 0.7);

  g.append("text")
    .attr("x", x(xRange[1]) - 4)
    .attr("y", y(slope * xRange[1] + intercept) - 8)
    .attr("text-anchor", "end")
    .attr("font-size", "0.68rem")
    .attr("fill", "#666")
    .text(`R² = ${r2.toFixed(3)}`);

  // Points
  const dots = g.selectAll(".dot")
    .data(data)
    .join("circle")
    .attr("class", "dot")
    .attr("cx", d => x(d.words))
    .attr("cy", d => y(d.score))
    .attr("r", d => r(d.skills))
    .attr("fill", d => d.color)
    .attr("opacity", 0.75)
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.8);

  // Voronoi for hover
  const delaunay = d3.Delaunay.from(data, d => x(d.words), d => y(d.score));
  const voronoi = delaunay.voronoi([0, 0, width, height]);

  const tooltip = d3.select("#tooltip");

  g.selectAll(".voronoi")
    .data(data)
    .join("path")
    .attr("d", (d, i) => voronoi.renderCell(i))
    .attr("fill", "transparent")
    .style("cursor", "default")
    .on("pointerenter", (e, d) => {
      tooltip.style("opacity", 1).html(
        `<strong>#${d.block}</strong> — ${d.group}<br>` +
        `Words: ${d.words}<br>` +
        `Score: ${d.score.toFixed(1)}<br>` +
        `Skills: ${d.skills}`
      );
      dots.attr("opacity", p => p === d ? 1 : 0.3);
    })
    .on("pointermove", (e) => {
      tooltip.style("left", (e.clientX + 14) + "px").style("top", (e.clientY - 10) + "px");
    })
    .on("pointerleave", () => {
      tooltip.style("opacity", 0);
      dots.attr("opacity", 0.75);
    });

  // Brush
  const brush = d3.brush()
    .extent([[0, 0], [width, height]])
    .on("brush end", brushed);

  g.append("g").attr("class", "brush").call(brush);

  function brushed(event) {
    const sel = event.selection;
    const selDiv = d3.select("#selection");
    if (!sel) {
      dots.attr("opacity", 0.75);
      selDiv.html("");
      return;
    }
    const [[x0, y0], [x1, y1]] = sel;
    const selected = data.filter(d =>
      x(d.words) >= x0 && x(d.words) <= x1 &&
      y(d.score) >= y0 && y(d.score) <= y1
    );
    dots.attr("opacity", d => selected.includes(d) ? 1 : 0.15);
    if (selected.length > 0) {
      selDiv.html(`<strong>${selected.length} blocks selected:</strong> ` +
        selected.map(d => `#${d.block}`).join(", "));
    } else {
      selDiv.html("");
    }
  }
})();
</script>
</body>
</html>
