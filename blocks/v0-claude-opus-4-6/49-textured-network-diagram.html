<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Textured Network Diagram</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fafafa; font-family: system-ui, -apple-system, sans-serif; }
  h1 { text-align: center; font-size: 18px; color: #333; padding: 14px 0 4px; }
  .controls { text-align: center; margin-bottom: 8px; }
  .controls button {
    padding: 6px 16px; border: 1px solid #aaa; border-radius: 4px;
    background: #fff; cursor: pointer; font-size: 13px; transition: background 0.2s;
  }
  .controls button:hover { background: #eee; }
  .controls button.active { background: #4477AA; color: #fff; border-color: #4477AA; }
  #chart { display: flex; justify-content: center; }
  .tooltip {
    position: absolute; pointer-events: none; background: rgba(255,255,255,0.95);
    border: 1px solid #ccc; border-radius: 4px; padding: 6px 10px; font-size: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12); display: none; max-width: 200px;
  }
  .legend-box {
    position: absolute; top: 80px; right: 30px; background: rgba(255,255,255,0.92);
    border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; font-size: 12px;
  }
  .legend-box .entry { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .legend-box .swatch { width: 20px; height: 20px; border-radius: 3px; border: 1px solid #ccc; }
</style>
</head>
<body>
<h1>Texture Carries Community Structure</h1>
<div class="controls">
  <button id="btn-color" class="active">Color + Texture</button>
  <button id="btn-gray">Grayscale (Texture Only)</button>
</div>
<div id="chart" style="position:relative;">
  <div class="tooltip" id="tooltip"></div>
  <div class="legend-box" id="legend"></div>
</div>

<script>
(() => {
  const W = 700, H = 500;
  const tolBright = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377"];
  const communityNames = ["Alpha","Beta","Gamma","Delta","Epsilon","Zeta"];
  const commSizes = [10, 9, 9, 8, 8, 6];

  // Generate nodes
  const nodes = [];
  let id = 0;
  commSizes.forEach((size, ci) => {
    for (let i = 0; i < size; i++) {
      nodes.push({ id: id++, name: `${communityNames[ci]}-${i+1}`, community: ci });
    }
  });

  // Generate edges: ~90 edges, 75% within-community
  const rng = d3.randomLcg(42);
  const rand = () => rng();
  const edges = [];
  const edgeSet = new Set();
  const addEdge = (s, t, w) => {
    const key = s < t ? `${s}-${t}` : `${t}-${s}`;
    if (!edgeSet.has(key) && s !== t) { edgeSet.add(key); edges.push({ source: s, target: t, weight: w }); }
  };

  // Within-community
  const byComm = d3.group(nodes, d => d.community);
  for (const [ci, members] of byComm) {
    for (let i = 0; i < members.length; i++) {
      for (let j = i + 1; j < members.length; j++) {
        if (rand() < 0.45) addEdge(members[i].id, members[j].id, Math.ceil(rand() * 5));
      }
    }
  }
  // Between-community (fewer)
  for (let i = 0; i < 300 && edges.length < 90; i++) {
    const a = Math.floor(rand() * nodes.length);
    const b = Math.floor(rand() * nodes.length);
    if (nodes[a].community !== nodes[b].community) {
      addEdge(a, b, Math.ceil(rand() * 3));
    }
  }

  // Compute degree
  nodes.forEach(n => n.degree = 0);
  edges.forEach(e => {
    const s = typeof e.source === 'object' ? e.source.id : e.source;
    const t = typeof e.target === 'object' ? e.target.id : e.target;
    nodes[s].degree++;
    nodes[t].degree++;
  });

  // SVG
  const svg = d3.select("#chart").append("svg")
    .attr("width", W).attr("height", H)
    .attr("viewBox", `0 0 ${W} ${H}`);

  const defs = svg.append("defs");

  // 6 SVG patterns following texton theory
  // 1. Diagonal hatch 45deg
  const mkPattern = (id, size, fn) => {
    const p = defs.append("pattern")
      .attr("id", id).attr("width", size).attr("height", size)
      .attr("patternUnits", "userSpaceOnUse");
    fn(p, size);
    return id;
  };

  mkPattern("pat-diag", 8, (p, s) => {
    p.attr("patternTransform", "rotate(45)");
    p.append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",s)
      .attr("stroke","currentColor").attr("stroke-width",1.5);
  });

  mkPattern("pat-dots", 8, (p, s) => {
    p.append("circle").attr("cx",s/2).attr("cy",s/2).attr("r",1.5)
      .attr("fill","currentColor");
  });

  mkPattern("pat-cross", 8, (p, s) => {
    p.append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",s)
      .attr("stroke","currentColor").attr("stroke-width",1.2);
    p.append("line").attr("x1",0).attr("y1",0).attr("x2",s).attr("y2",0)
      .attr("stroke","currentColor").attr("stroke-width",1.2);
  });

  mkPattern("pat-horiz", 8, (p, s) => {
    p.append("line").attr("x1",0).attr("y1",s/2).attr("x2",s).attr("y2",s/2)
      .attr("stroke","currentColor").attr("stroke-width",1.5);
  });

  mkPattern("pat-wave", 8, (p, s) => {
    p.append("path")
      .attr("d", `M0,${s*0.5} Q${s*0.25},${s*0.2} ${s*0.5},${s*0.5} T${s},${s*0.5}`)
      .attr("fill","none").attr("stroke","currentColor").attr("stroke-width",1.3);
  });

  mkPattern("pat-vert", 8, (p, s) => {
    p.append("line").attr("x1",s/2).attr("y1",0).attr("x2",s/2).attr("y2",s)
      .attr("stroke","currentColor").attr("stroke-width",1.5);
  });

  const patternIds = ["pat-diag","pat-dots","pat-cross","pat-horiz","pat-wave","pat-vert"];
  const patternLabels = ["Diagonal Hatch","Dot Grid","Crosshatch","Horizontal Lines","Waves","Vertical Lines"];

  // Force simulation
  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(edges).id(d => d.id).distance(40))
    .force("charge", d3.forceManyBody().strength(-60))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collide", d3.forceCollide(14))
    .stop();

  // Pre-compute
  simulation.tick(300);

  // Edge rendering
  const linkGroup = svg.append("g");
  const linkEls = linkGroup.selectAll("line")
    .data(edges).join("line")
    .attr("stroke", "#999").attr("stroke-opacity", 0.4)
    .attr("stroke-width", d => Math.sqrt(d.weight));

  // Node group
  const nodeGroup = svg.append("g");

  let grayscaleMode = false;

  const nodeEls = nodeGroup.selectAll("g")
    .data(nodes, d => d.id).join("g")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .style("cursor", "pointer");

  // Color background circle
  nodeEls.append("circle")
    .attr("r", 12)
    .attr("class", "node-bg")
    .attr("fill", d => tolBright[d.community])
    .attr("stroke", "#fff").attr("stroke-width", 1);

  // Pattern overlay circle
  nodeEls.append("circle")
    .attr("r", 12)
    .attr("class", "node-pat")
    .attr("fill", d => `url(#${patternIds[d.community]})`)
    .attr("stroke", "none")
    .style("color", "rgba(0,0,0,0.2)");

  // Tooltip
  const tooltip = d3.select("#tooltip");

  // Hover
  nodeEls.on("pointerenter", (event, d) => {
    // Highlight same-community nodes and edges
    nodeEls.style("opacity", n => n.community === d.community ? 1 : 0.15);
    linkEls.style("opacity", e => {
      const s = typeof e.source === 'object' ? e.source : nodes[e.source];
      const t = typeof e.target === 'object' ? e.target : nodes[e.target];
      return (s.community === d.community && t.community === d.community) ? 0.7 : 0.03;
    });
    tooltip.style("display", "block")
      .html(`<strong>${d.name}</strong><br>Community: ${communityNames[d.community]}<br>Degree: ${d.degree}`)
      .style("left", (event.pageX + 12) + "px")
      .style("top", (event.pageY - 10) + "px");
  })
  .on("pointermove", (event) => {
    tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 10) + "px");
  })
  .on("pointerleave", () => {
    nodeEls.style("opacity", 1);
    linkEls.style("opacity", 0.4);
    tooltip.style("display", "none");
  });

  // Drag
  const drag = d3.drag()
    .on("start", (event, d) => {
      simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", (event, d) => {
      d.fx = event.x; d.fy = event.y;
    })
    .on("end", (event, d) => {
      simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    });
  nodeEls.call(drag);

  // Tick update for drag
  simulation.on("tick", () => {
    linkEls
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    nodeEls.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  // Update positions from pre-computed
  linkEls
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);

  // Grayscale toggle
  const updateMode = () => {
    if (grayscaleMode) {
      nodeEls.select(".node-bg").attr("fill", "#ddd");
      nodeEls.select(".node-pat").style("color", "#333");
    } else {
      nodeEls.select(".node-bg").attr("fill", d => tolBright[d.community]);
      nodeEls.select(".node-pat").style("color", "rgba(0,0,0,0.2)");
    }
    renderLegend();
  };

  d3.select("#btn-color").on("click", () => {
    grayscaleMode = false;
    d3.select("#btn-color").classed("active", true);
    d3.select("#btn-gray").classed("active", false);
    updateMode();
  });
  d3.select("#btn-gray").on("click", () => {
    grayscaleMode = true;
    d3.select("#btn-gray").classed("active", true);
    d3.select("#btn-color").classed("active", false);
    updateMode();
  });

  // Legend
  const legendDiv = d3.select("#legend");
  const renderLegend = () => {
    legendDiv.html("<div style='font-weight:600;margin-bottom:4px;font-size:13px;'>Communities</div>");
    communityNames.forEach((name, i) => {
      const entry = legendDiv.append("div").attr("class", "entry");
      const svgEl = entry.append("svg").attr("width", 20).attr("height", 20);
      const defsL = svgEl.append("defs");
      // Copy pattern for legend
      const patId = `leg-${patternIds[i]}`;
      const origPat = defs.select(`#${patternIds[i]}`);
      const cloned = defsL.node().appendChild(origPat.node().cloneNode(true));
      cloned.id = patId;

      svgEl.append("rect").attr("width",20).attr("height",20).attr("rx",3)
        .attr("fill", grayscaleMode ? "#ddd" : tolBright[i]);
      const patRect = svgEl.append("rect").attr("width",20).attr("height",20).attr("rx",3)
        .attr("fill", `url(#${patId})`);
      // Set color on the cloned pattern marks
      d3.select(cloned).selectAll("line,circle,path")
        .attr("stroke", (_, j, els) => {
          const el = d3.select(els[j]);
          return el.attr("stroke") === "currentColor" ? (grayscaleMode ? "#333" : "rgba(0,0,0,0.2)") : null;
        })
        .attr("fill", (_, j, els) => {
          const el = d3.select(els[j]);
          return el.attr("fill") === "currentColor" ? (grayscaleMode ? "#333" : "rgba(0,0,0,0.2)") : null;
        });

      entry.append("span").text(`${name} — ${patternLabels[i]}`);
    });
  };
  renderLegend();
})();
</script>
</body>
</html>
