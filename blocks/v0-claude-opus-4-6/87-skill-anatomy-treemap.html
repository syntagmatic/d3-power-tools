<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Anatomy — where the line budget goes</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --text-muted: #666;
    --font: system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  #chart {
    width: 100%;
    max-width: 960px;
  }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(30,30,30,0.92);
    color: #fff;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 5px;
    display: none;
    z-index: 100;
    line-height: 1.5;
  }
  .tooltip b { font-weight: 600; }
  .tooltip .cat { opacity: 0.7; }
</style>
</head>
<body>
<h1>Skill Anatomy</h1>
<p class="subtitle">Where the line budget goes &mdash; area proportional to SKILL.md line count</p>
<div id="chart"></div>
<div class="tooltip" id="tooltip"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const skills = [
  {name:"annotation",lines:406,category:"Making it legible"},
  {name:"brushing",lines:735,category:"Seeing patterns"},
  {name:"canvas",lines:396,category:"Making it work"},
  {name:"canvas-accessibility",lines:341,category:"Making it legible"},
  {name:"cartography",lines:575,category:"Seeing place"},
  {name:"color",lines:329,category:"Making it legible"},
  {name:"data-gathering",lines:177,category:"Before you render"},
  {name:"data-table",lines:168,category:"Making it legible"},
  {name:"distributions",lines:406,category:"Seeing patterns"},
  {name:"edge-bundling",lines:237,category:"Seeing structure"},
  {name:"force",lines:286,category:"Seeing structure"},
  {name:"hierarchy-interaction",lines:184,category:"Seeing structure"},
  {name:"hierarchy-layouts",lines:175,category:"Seeing structure"},
  {name:"linked-views",lines:304,category:"Seeing patterns"},
  {name:"motion",lines:633,category:"Seeing change"},
  {name:"navigation",lines:352,category:"Making it work"},
  {name:"network",lines:172,category:"Seeing structure"},
  {name:"parallel-coordinates",lines:452,category:"Seeing patterns"},
  {name:"responsive",lines:309,category:"Making it work"},
  {name:"scales",lines:308,category:"Making it legible"},
  {name:"shape-morphing",lines:216,category:"Seeing change"},
  {name:"small-multiples",lines:228,category:"Before you render"},
  {name:"sparkcharts",lines:340,category:"Before you render"},
  {name:"time-series",lines:420,category:"Seeing change"},
  {name:"visual-texture",lines:210,category:"Making it legible"},
  {name:"webgl",lines:385,category:"Making it work"}
];

const totalLines = d3.sum(skills, d => d.lines);

// Build hierarchy
const categories = [...new Set(skills.map(s => s.category))];
const root = d3.hierarchy({
  name: "root",
  children: categories.map(cat => ({
    name: cat,
    children: skills.filter(s => s.category === cat).map(s => ({...s}))
  }))
}).sum(d => d.lines);

// Color hues per category
const catHues = {
  "Before you render": 50,
  "Seeing patterns": 260,
  "Seeing structure": 160,
  "Seeing place": 120,
  "Seeing change": 340,
  "Making it legible": 200,
  "Making it work": 30
};

// For each category, create a sequential scale based on line count
const catExtents = {};
categories.forEach(cat => {
  const vals = skills.filter(s => s.category === cat).map(s => s.lines);
  catExtents[cat] = d3.extent(vals);
});

function cellColor(skill) {
  const hue = catHues[skill.category];
  const [lo, hi] = catExtents[skill.category];
  const t = hi === lo ? 0.5 : (skill.lines - lo) / (hi - lo);
  // Darker = more lines. lightness from 80 (few lines) to 40 (many lines)
  const l = 80 - t * 40;
  const s = 50 + t * 15;
  return d3.hsl(hue, s / 100, l / 100).formatHex();
}

function catBgColor(cat) {
  const hue = catHues[cat];
  return d3.hsl(hue, 0.25, 0.92).formatHex();
}

function textColor(bgHex) {
  const c = d3.color(bgHex);
  const lum = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
  return lum < 140 ? "#fff" : "#1a1a1a";
}

// Dimensions
const margin = {top: 0, right: 0, bottom: 0, left: 0};
const width = 900;
const height = 600;

d3.treemap()
  .size([width, height])
  .padding(3)
  .paddingTop(22)
  .round(true)
  .tile(d3.treemapSquarify)(root);

const svg = d3.select("#chart").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("width", "100%");

svg.append("title").text("Skill Anatomy Treemap — area proportional to SKILL.md line count");

// Category groups
const catGroups = svg.selectAll("g.cat")
  .data(root.children)
  .join("g")
    .attr("class", "cat");

// Category background
catGroups.append("rect")
  .attr("x", d => d.x0)
  .attr("y", d => d.y0)
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => d.y1 - d.y0)
  .attr("fill", d => catBgColor(d.data.name))
  .attr("rx", 3);

// Category label
catGroups.append("text")
  .attr("x", d => d.x0 + 6)
  .attr("y", d => d.y0 + 15)
  .text(d => d.data.name)
  .attr("font-size", "11px")
  .attr("font-weight", "600")
  .attr("fill", d => d3.hsl(catHues[d.data.name], 0.4, 0.35).formatHex());

// Skill cells
const tooltip = document.getElementById("tooltip");

const leaves = svg.selectAll("g.leaf")
  .data(root.leaves())
  .join("g")
    .attr("class", "leaf");

leaves.append("rect")
  .attr("x", d => d.x0)
  .attr("y", d => d.y0)
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => d.y1 - d.y0)
  .attr("fill", d => cellColor(d.data))
  .attr("rx", 2)
  .attr("stroke", "#fff")
  .attr("stroke-width", 1)
  .style("cursor", "default");

// Skill name label (if cell big enough)
leaves.each(function(d) {
  const w = d.x1 - d.x0;
  const h = d.y1 - d.y0;
  const g = d3.select(this);
  const fill = textColor(cellColor(d.data));

  if (w > 50 && h > 28) {
    g.append("text")
      .attr("x", d.x0 + 4)
      .attr("y", d.y0 + 14)
      .text(d.data.name)
      .attr("font-size", w > 80 ? "11px" : "9px")
      .attr("font-weight", "500")
      .attr("fill", fill)
      .attr("pointer-events", "none");
  }
  if (w > 40 && h > 38) {
    g.append("text")
      .attr("x", d.x0 + 4)
      .attr("y", d.y0 + 27)
      .text(d.data.lines + " lines")
      .attr("font-size", "9px")
      .attr("fill", fill)
      .attr("opacity", 0.8)
      .attr("pointer-events", "none");
  }
});

// Hover
leaves.select("rect")
  .on("mouseenter", (event, d) => {
    const pct = ((d.data.lines / totalLines) * 100).toFixed(1);
    tooltip.innerHTML = `<b>${d.data.name}</b><br>
      <span class="cat">${d.data.category}</span><br>
      ${d.data.lines} lines (${pct}% of ${totalLines.toLocaleString()} total)`;
    tooltip.style.display = "block";
    d3.select(event.currentTarget)
      .attr("stroke", "#333")
      .attr("stroke-width", 2);
  })
  .on("mousemove", (event) => {
    tooltip.style.left = (event.clientX + 14) + "px";
    tooltip.style.top = (event.clientY + 14) + "px";
  })
  .on("mouseleave", (event) => {
    tooltip.style.display = "none";
    d3.select(event.currentTarget)
      .attr("stroke", "#fff")
      .attr("stroke-width", 1);
  });
</script>
</body>
</html>
