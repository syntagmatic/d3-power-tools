<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkline Dashboard Table</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #222; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }

  .table-wrap { max-height: 80vh; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; background: #fff; }

  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }

  thead th {
    position: sticky; top: 0; z-index: 2;
    background: #f5f5f5; border-bottom: 2px solid #ccc;
    padding: 8px 10px; text-align: left; cursor: pointer; user-select: none;
    white-space: nowrap; font-weight: 600;
  }
  thead th:hover { background: #eaeaea; }
  thead th .sort-arrow { font-size: 10px; margin-left: 4px; color: #888; }

  tbody tr { transition: transform 300ms ease; }
  tbody tr:nth-child(even) { background: #f9f9f9; }
  tbody tr:hover { background: #eef3ff; }

  td { padding: 4px 10px; vertical-align: middle; white-space: nowrap; line-height: 1; }
  td.ticker { font-weight: 700; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "SF Mono", "Cascadia Code", "Consolas", monospace; font-size: 12px; }
  th.num { text-align: right; }

  td svg { display: block; }

  .sector-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>
<h1>Stock Dashboard with Sparkline Charts</h1>
<div class="table-wrap">
  <table id="dashboard">
    <thead><tr></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Tol Bright palette for 5 sectors ---
const tolBright = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE"];
const sectors = ["Technology", "Healthcare", "Finance", "Energy", "Consumer"];
const sectorColor = d3.scaleOrdinal(sectors, tolBright);

// --- Generate synthetic data ---
function randomWalk(start, n, volatility) {
  const vals = [start];
  for (let i = 1; i < n; i++) {
    const change = (Math.random() - 0.48) * volatility;
    vals.push(Math.max(1, vals[i - 1] * (1 + change)));
  }
  return vals;
}

const tickers = [
  ["AAPL", "Apple Inc"], ["MSFT", "Microsoft Corp"], ["GOOG", "Alphabet Inc"],
  ["AMZN", "Amazon.com"], ["NVDA", "NVIDIA Corp"], ["META", "Meta Platforms"],
  ["TSLA", "Tesla Inc"], ["JPM", "JPMorgan Chase"], ["JNJ", "Johnson & Johnson"],
  ["UNH", "UnitedHealth"], ["XOM", "Exxon Mobil"], ["PG", "Procter & Gamble"],
  ["HD", "Home Depot"], ["CVX", "Chevron Corp"], ["MRK", "Merck & Co"],
  ["ABBV", "AbbVie Inc"], ["PFE", "Pfizer Inc"], ["KO", "Coca-Cola Co"],
  ["PEP", "PepsiCo Inc"], ["COST", "Costco Wholesale"], ["WMT", "Walmart Inc"],
  ["TMO", "Thermo Fisher"], ["ABT", "Abbott Labs"], ["NKE", "Nike Inc"],
  ["CRM", "Salesforce Inc"]
];

const data = tickers.map(([ticker, name], i) => {
  const sector = sectors[i % 5];
  const price = 10 + Math.random() * 490;
  const prices_30d = randomWalk(price * (0.85 + Math.random() * 0.2), 30, 0.03);
  const volume_7d = Array.from({ length: 7 }, () => 500000 + Math.random() * 5000000);
  const daily_returns_20d = Array.from({ length: 20 }, () => (Math.random() - 0.45) * 0.06);
  const performance_pct = -30 + Math.random() * 80;
  const target_pct = -10 + Math.random() * 40;
  return { id: ticker, ticker, company_name: name, sector, price, prices_30d, volume_7d, daily_returns_20d, performance_pct, target_pct };
});

// --- Shared domains across all rows ---
const priceDomain = [
  d3.min(data, d => d3.min(d.prices_30d)),
  d3.max(data, d => d3.max(d.prices_30d))
];
if (priceDomain[0] === priceDomain[1]) { priceDomain[0] -= 1; priceDomain[1] += 1; }

const volumeDomain = [0, d3.max(data, d => d3.max(d.volume_7d))];

const perfDomain = [
  Math.min(d3.min(data, d => d.performance_pct), d3.min(data, d => d.target_pct), 0),
  Math.max(d3.max(data, d => d.performance_pct), d3.max(data, d => d.target_pct))
];

// --- Column definitions ---
const columns = [
  { key: "ticker", label: "Ticker", type: "string" },
  { key: "sector", label: "Sector", type: "string" },
  { key: "prices_30d", label: "30-Day Price", type: "sparkline" },
  { key: "volume_7d", label: "Volume", type: "sparkbar" },
  { key: "daily_returns_20d", label: "Win/Loss", type: "winloss" },
  { key: "performance_pct", label: "Performance", type: "bullet" },
  { key: "price", label: "Price", type: "number", format: d3.format("$,.2f") }
];

// --- Sort state ---
let sortKey = "ticker";
let sortAsc = true;

function sortedData() {
  const col = columns.find(c => c.key === sortKey);
  const arr = [...data];
  arr.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (col && col.type === "sparkline") { va = a.prices_30d.at(-1); vb = b.prices_30d.at(-1); }
    else if (col && col.type === "sparkbar") { va = d3.sum(a.volume_7d); vb = d3.sum(b.volume_7d); }
    else if (col && col.type === "winloss") { va = d3.sum(a.daily_returns_20d.map(r => r > 0 ? 1 : -1)); vb = d3.sum(b.daily_returns_20d.map(r => r > 0 ? 1 : -1)); }
    else if (col && col.type === "bullet") { /* already numeric */ }
    if (typeof va === "string") return sortAsc ? d3.ascending(va, vb) : d3.descending(va, vb);
    return sortAsc ? d3.ascending(va, vb) : d3.descending(va, vb);
  });
  return arr;
}

// --- Build header ---
const thead = d3.select("#dashboard thead tr");
thead.selectAll("th")
  .data(columns)
  .join("th")
    .classed("num", d => d.type === "number")
    .attr("tabindex", 0)
    .attr("role", "columnheader")
    .attr("aria-sort", d => d.key === sortKey ? (sortAsc ? "ascending" : "descending") : "none")
    .on("click", (e, d) => {
      if (sortKey === d.key) sortAsc = !sortAsc;
      else { sortKey = d.key; sortAsc = true; }
      render();
    })
    .on("keydown", (e, d) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (sortKey === d.key) sortAsc = !sortAsc;
        else { sortKey = d.key; sortAsc = true; }
        render();
      }
    })
    .html(d => {
      const arrow = d.key === sortKey ? (sortAsc ? "\u25B2" : "\u25BC") : "";
      return `${d.label}<span class="sort-arrow">${arrow}</span>`;
    });

// --- Sparkline renderers ---
function drawSparkArea(td, values) {
  const w = 60, h = 16, pad = 1;
  const svg = d3.select(td).append("svg").attr("width", w).attr("height", h)
    .attr("role", "img")
    .attr("aria-label", `Sparkline: ${values.length} points, last value ${values.at(-1).toFixed(1)}`);
  const x = d3.scaleLinear([0, values.length - 1], [pad, w - pad]);
  const y = d3.scaleLinear(priceDomain, [h - pad, pad]);
  const area = d3.area().x((d, i) => x(i)).y0(h).y1(d => y(d)).curve(d3.curveMonotoneX);
  const line = d3.line().x((d, i) => x(i)).y(d => y(d)).curve(d3.curveMonotoneX);
  svg.append("path").datum(values).attr("d", area).attr("fill", "#4477AA").attr("opacity", 0.15);
  svg.append("path").datum(values).attr("d", line).attr("fill", "none").attr("stroke", "#4477AA").attr("stroke-width", 1.2);
  svg.append("circle").attr("cx", x(values.length - 1)).attr("cy", y(values.at(-1))).attr("r", 1.5).attr("fill", "#e41a1c");
}

function drawSparkBars(td, values) {
  const w = 40, h = 16, gap = 1;
  const n = values.length;
  const barW = Math.max(1, (w - gap * (n - 1)) / n);
  const svg = d3.select(td).append("svg").attr("width", w).attr("height", h)
    .attr("role", "img")
    .attr("aria-label", `Volume bars: ${n} bars`);
  const y = d3.scaleLinear(volumeDomain, [h, 0]);
  svg.selectAll("rect").data(values).join("rect")
    .attr("x", (d, i) => i * (barW + gap))
    .attr("y", d => y(d))
    .attr("width", barW)
    .attr("height", d => h - y(d))
    .attr("fill", "#999");
}

function drawWinLoss(td, values) {
  const n = values.length, w = n * 4, h = 12;
  const rectW = 3, gap = 1;
  const svg = d3.select(td).append("svg").attr("width", w).attr("height", h)
    .attr("role", "img")
    .attr("aria-label", `Win/loss: ${values.filter(v => v > 0).length} wins, ${values.filter(v => v < 0).length} losses`);
  svg.selectAll("rect").data(values).join("rect")
    .attr("x", (d, i) => i * (rectW + gap))
    .attr("y", d => d > 0 ? 1 : 7)
    .attr("width", rectW)
    .attr("height", 4)
    .attr("fill", d => d > 0 ? "#228833" : "#e41a1c");
}

function drawBullet(td, row) {
  const w = 80, h = 14;
  const svg = d3.select(td).append("svg").attr("width", w).attr("height", h)
    .attr("role", "img")
    .attr("aria-label", `Bullet: performance ${row.performance_pct.toFixed(1)}%, target ${row.target_pct.toFixed(1)}%`);
  const x = d3.scaleLinear(perfDomain, [0, w]);

  // Background range
  svg.append("rect").attr("width", w).attr("height", h).attr("fill", "#e8e8e8").attr("rx", 2);

  // Target marker
  const tx = x(row.target_pct);
  svg.append("line")
    .attr("x1", tx).attr("x2", tx)
    .attr("y1", 1).attr("y2", h - 1)
    .attr("stroke", "#555").attr("stroke-width", 2);

  // Actual bar
  const exceeds = row.performance_pct >= row.target_pct;
  const barX = x(Math.min(0, row.performance_pct));
  const barW = Math.abs(x(row.performance_pct) - x(0));
  svg.append("rect")
    .attr("x", barX)
    .attr("y", h * 0.25)
    .attr("width", barW)
    .attr("height", h * 0.5)
    .attr("fill", exceeds ? "#228833" : "#e41a1c")
    .attr("rx", 1);
}

// --- Render table ---
function render() {
  // Update header arrows and aria-sort
  thead.selectAll("th")
    .attr("aria-sort", d => d.key === sortKey ? (sortAsc ? "ascending" : "descending") : "none")
    .html(d => {
      const arrow = d.key === sortKey ? (sortAsc ? " \u25B2" : " \u25BC") : "";
      return `${d.label}<span class="sort-arrow">${arrow}</span>`;
    });

  const sorted = sortedData();

  const rows = d3.select("#dashboard tbody")
    .selectAll("tr")
    .data(sorted, d => d.id)
    .join(
      enter => enter.append("tr"),
      update => update,
      exit => exit.remove()
    );

  // Re-order DOM to match data
  rows.order();

  // Clear and rebuild cells
  rows.selectAll("td").remove();

  rows.each(function(d) {
    const tr = d3.select(this);

    // Ticker
    tr.append("td").classed("ticker", true).text(d.ticker);

    // Sector with colored dot
    const sectorTd = tr.append("td");
    sectorTd.append("span").classed("sector-dot", true).style("background", sectorColor(d.sector));
    sectorTd.append("span").text(d.sector);

    // 30-Day Price sparkline
    drawSparkArea(tr.append("td").node(), d.prices_30d);

    // Volume spark bars
    drawSparkBars(tr.append("td").node(), d.volume_7d);

    // Win/Loss strip
    drawWinLoss(tr.append("td").node(), d.daily_returns_20d);

    // Bullet chart
    drawBullet(tr.append("td").node(), d);

    // Price
    tr.append("td").classed("num", true).text(d3.format("$,.2f")(d.price));
  });
}

render();
</script>
</body>
</html>
