<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crossfilter Dashboard · Reduced Motion</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #21262d;
  --border2: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --dim: #484f58;
  --accent: #58a6ff;
  --green: #3fb950;
  --amber: #d29922;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  padding: 20px 24px 24px;
  min-height: 100vh;
}

/* ─── Header ─────────────────────────────── */
header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.title-group h1 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.4px;
  color: #f0f6fc;
}

.title-group p {
  color: var(--muted);
  font-size: 11.5px;
  margin-top: 3px;
}

.motion-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

/* ─── Motion badge ───────────────────────── */
.motion-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  user-select: none;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}

.status-dot.on {
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.18);
}

.status-dot.on.pulsing {
  animation: pulse-dot 2s ease-in-out infinite;
}

.status-dot.off {
  background: var(--amber);
  box-shadow: 0 0 0 3px rgba(210, 153, 34, 0.18);
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.75); }
}

/* ─── Override button ────────────────────── */
.override-btn {
  padding: 5px 13px;
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--text);
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.15s, background 0.15s;
}

.override-btn:hover { border-color: var(--accent); }

.override-btn.active {
  border-color: var(--amber);
  color: var(--amber);
  background: rgba(210, 153, 34, 0.07);
}

/* ─── Grid ───────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 264px 220px;
  gap: 14px;
}

/* ─── Panels ─────────────────────────────── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 14px 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.panel-scatter { grid-row: 1 / 3; }

.panel-head { margin-bottom: 9px; }

.panel-name {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.65px;
  color: var(--muted);
}

.panel-hint {
  font-size: 10.5px;
  color: var(--dim);
  margin-top: 2px;
}

.chart-area { flex: 1; min-height: 0; }
.chart-area svg { display: block; }

/* ─── Legend ─────────────────────────────── */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  margin-top: 7px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  color: var(--muted);
}

.legend-swatch {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ─── Filter bar ─────────────────────────── */
.filter-bar {
  margin-top: 7px;
  font-size: 10.5px;
  color: var(--dim);
  min-height: 15px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.fcount { color: var(--accent); font-weight: 600; }

.clr {
  color: var(--accent);
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  font-size: 10.5px;
  font-family: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.clr:hover { opacity: 0.7; }

/* ─── D3 axis ────────────────────────────── */
.axis text { fill: #3d444d; font-size: 9.5px; font-family: inherit; }
.axis line, .axis path { stroke: var(--border); }
.axis .domain { stroke: none; }

/* ─── D3 brush ───────────────────────────── */
.brush .selection {
  fill: var(--accent);
  fill-opacity: 0.1;
  stroke: var(--accent);
  stroke-opacity: 0.45;
  stroke-width: 1.5;
}

.brush .overlay { cursor: crosshair; }
.brush .handle { fill: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>Sales Performance Dashboard</h1>
    <p>300 observations · brush scatter to select · click histogram bar or month bar to crossfilter</p>
  </div>
  <div class="motion-controls">
    <div class="motion-badge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusLabel">—</span>
    </div>
    <button class="override-btn" id="overrideBtn">—</button>
  </div>
</header>

<div class="grid">
  <div class="panel panel-scatter">
    <div class="panel-head">
      <div class="panel-name">Performance vs. Efficiency</div>
      <div class="panel-hint">Drag to brush · colored by category</div>
    </div>
    <div class="chart-area" id="scatter-area"></div>
    <div class="legend" id="scatter-legend"></div>
    <div class="filter-bar" id="scatter-bar"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-name">Performance Distribution</div>
      <div class="panel-hint">Click bar to filter by range</div>
    </div>
    <div class="chart-area" id="hist-area"></div>
    <div class="filter-bar" id="hist-bar"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-name">Monthly Revenue</div>
      <div class="panel-hint">Click month to filter</div>
    </div>
    <div class="chart-area" id="ts-area"></div>
    <div class="filter-bar" id="ts-bar"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
'use strict';

// ════════════════════════════════════════
//  Seeded RNG (Mulberry32)
// ════════════════════════════════════════
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(2024);

// ════════════════════════════════════════
//  Data
// ════════════════════════════════════════
const CATS   = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Epsilon'];
const COLORS = ['#818cf8', '#fbbf24', '#34d399', '#fb7185', '#38bdf8'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const data = Array.from({length: 300}, (_, id) => {
  const ci   = Math.floor(rand() * 5);
  const perf = rand() * 100;
  // efficiency correlates with performance + category offset
  const eff  = Math.min(100, Math.max(0, perf * 0.45 + rand() * 55 + (ci - 2) * 6));
  return {
    id,
    perf,
    eff,
    ci,
    cat: CATS[ci],
    month: Math.floor(rand() * 12),
    rev: 100 + rand() * 900
  };
});

// ════════════════════════════════════════
//  Reduced Motion
// ════════════════════════════════════════
const motionMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
let sysReduced = motionMQ.matches;
let override   = null; // null = follow system | true/false = force

const isReduced = () => override !== null ? override : sysReduced;
const dur = (base = 300) => isReduced() ? 0 : base;

motionMQ.addEventListener('change', e => {
  sysReduced = e.matches;
  syncMotionUI();
  updateAll();
});

// ════════════════════════════════════════
//  Filter State
// ════════════════════════════════════════
const filt = {
  brush: null,  // {x0, x1, y0, y1} in data coords
  bin:   null,  // bin index into histBins
  month: null   // 0–11
};

const anyFilter = () => filt.brush !== null || filt.bin !== null || filt.month !== null;

function getActive() {
  if (!anyFilter()) return data;
  return data.filter(d => {
    if (filt.brush) {
      const {x0, x1, y0, y1} = filt.brush;
      if (d.perf < x0 || d.perf > x1 || d.eff < y0 || d.eff > y1) return false;
    }
    if (filt.bin !== null) {
      const b = histBins[filt.bin];
      const last = filt.bin === histBins.length - 1;
      if (d.perf < b.x0 || (last ? d.perf > b.x1 : d.perf >= b.x1)) return false;
    }
    if (filt.month !== null && d.month !== filt.month) return false;
    return true;
  });
}

function clearAll() {
  filt.brush = null;
  filt.bin   = null;
  filt.month = null;
  if (brushSel) brushSel.call(brushObj.move, null);
  updateAll();
}

// ════════════════════════════════════════
//  Scatter Chart
// ════════════════════════════════════════
let brushObj, brushSel;
let scX, scY, scActiveCircles;

function initScatter() {
  const el = document.getElementById('scatter-area');
  const W = el.clientWidth, H = el.clientHeight;
  const m = {t: 8, r: 8, b: 32, l: 36};
  const w = W - m.l - m.r, h = H - m.t - m.b;

  scX = d3.scaleLinear().domain([0, 100]).range([0, w]);
  scY = d3.scaleLinear().domain([0, 100]).range([h, 0]);

  const svg = d3.select(el).append('svg').attr('width', W).attr('height', H);
  const g   = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);

  // Grid lines
  g.append('g').selectAll('line').data(scX.ticks(5)).join('line')
    .attr('stroke', '#1c2128').attr('x1', v => scX(v)).attr('x2', v => scX(v))
    .attr('y1', 0).attr('y2', h);
  g.append('g').selectAll('line').data(scY.ticks(5)).join('line')
    .attr('stroke', '#1c2128').attr('x1', 0).attr('x2', w)
    .attr('y1', v => scY(v)).attr('y2', v => scY(v));

  // Axes
  g.append('g').attr('class', 'axis').attr('transform', `translate(0,${h})`)
    .call(d3.axisBottom(scX).ticks(5).tickSize(0).tickPadding(5));
  g.append('g').attr('class', 'axis')
    .call(d3.axisLeft(scY).ticks(5).tickSize(0).tickPadding(5));

  // Axis labels
  g.append('text').attr('fill', '#3d444d').attr('font-size', 9.5)
    .attr('x', w / 2).attr('y', h + 28).attr('text-anchor', 'middle')
    .text('Performance →');
  g.append('text').attr('fill', '#3d444d').attr('font-size', 9.5)
    .attr('transform', 'rotate(-90)').attr('x', -h / 2).attr('y', -28)
    .attr('text-anchor', 'middle').text('← Efficiency');

  // Ghost dots — full dataset, dim
  g.append('g').selectAll('circle').data(data, d => d.id).join('circle')
    .attr('cx', d => scX(d.perf)).attr('cy', d => scY(d.eff))
    .attr('r', 2.5).attr('fill', '#252b34').attr('opacity', 0.9);

  // Active dots — colored, fades out when not selected
  scActiveCircles = g.append('g').selectAll('circle').data(data, d => d.id).join('circle')
    .attr('cx', d => scX(d.perf)).attr('cy', d => scY(d.eff))
    .attr('r', 3).attr('fill', d => COLORS[d.ci]).attr('opacity', 0.82);

  // Brush (sits on top)
  brushObj = d3.brush()
    .extent([[0, 0], [w, h]])
    .on('brush', ({selection}) => {
      if (!selection) return;
      const [[px0, py0], [px1, py1]] = selection;
      filt.brush = {
        x0: scX.invert(px0), x1: scX.invert(px1),
        y0: scY.invert(py1), y1: scY.invert(py0)
      };
      updateAll();
    })
    .on('end', ({selection}) => {
      if (!selection) { filt.brush = null; updateAll(); }
    });

  brushSel = g.append('g').attr('class', 'brush').call(brushObj);

  // Legend
  const legend = d3.select('#scatter-legend');
  CATS.forEach((c, i) => {
    const item = legend.append('div').attr('class', 'legend-item');
    item.append('div').attr('class', 'legend-swatch').style('background', COLORS[i]);
    item.append('span').text(c);
  });
}

function updateScatter(active) {
  if (!scActiveCircles) return;
  const activeSet = new Set(active.map(d => d.id));
  const noFilt = !anyFilter();

  scActiveCircles
    .transition().duration(dur())
    .attr('opacity', d => (noFilt || activeSet.has(d.id)) ? 0.82 : 0)
    .attr('r',       d => (noFilt || activeSet.has(d.id)) ? 3.5 : 2.5);

  renderBar('#scatter-bar', () => {
    const bar = d3.select('#scatter-bar');
    bar.html('');
    if (anyFilter()) {
      bar.append('span').attr('class', 'fcount').text(active.length);
      bar.append('span').text(` / ${data.length} selected · `);
      bar.append('button').attr('class', 'clr').text('clear all').on('click', clearAll);
    } else {
      bar.text(`${data.length} observations · drag to select`);
    }
  });
}

// ════════════════════════════════════════
//  Histogram
// ════════════════════════════════════════
let histBins, histActiveRects, hX, hY, histH;

function initHistogram() {
  const el = document.getElementById('hist-area');
  const W = el.clientWidth, H = el.clientHeight;
  const m = {t: 8, r: 8, b: 24, l: 36};
  const w = W - m.l - m.r;
  histH = H - m.t - m.b;

  hX = d3.scaleLinear().domain([0, 100]).range([0, w]);

  histBins = d3.bin().domain([0, 100]).thresholds(12).value(d => d.perf)(data);

  hY = d3.scaleLinear()
    .domain([0, d3.max(histBins, b => b.length)])
    .range([histH, 0]).nice();

  const svg = d3.select(el).append('svg').attr('width', W).attr('height', H);
  const g   = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);

  g.append('g').attr('class', 'axis').attr('transform', `translate(0,${histH})`)
    .call(d3.axisBottom(hX).ticks(6).tickSize(0).tickPadding(4));
  g.append('g').attr('class', 'axis')
    .call(d3.axisLeft(hY).ticks(3).tickSize(0).tickPadding(4));

  // Ghost bars
  g.append('g').selectAll('rect').data(histBins).join('rect')
    .attr('x',      b => hX(b.x0) + 1)
    .attr('width',  b => Math.max(0, hX(b.x1) - hX(b.x0) - 2))
    .attr('y',      b => hY(b.length))
    .attr('height', b => histH - hY(b.length))
    .attr('fill', '#21262d').attr('stroke', '#30363d').attr('stroke-width', 0.5);

  // Active bars
  histActiveRects = g.append('g').selectAll('rect').data(histBins).join('rect')
    .attr('x',     b => hX(b.x0) + 1)
    .attr('width', b => Math.max(0, hX(b.x1) - hX(b.x0) - 2))
    .attr('y', histH).attr('height', 0)
    .attr('fill', '#388bfd').attr('opacity', 0.82);

  // Invisible click targets
  g.append('g').selectAll('rect').data(histBins).join('rect')
    .attr('x',     b => hX(b.x0) + 1)
    .attr('width', b => Math.max(0, hX(b.x1) - hX(b.x0) - 2))
    .attr('y', 0).attr('height', histH)
    .attr('fill', 'transparent').style('cursor', 'pointer')
    .on('click', (_, b) => {
      const idx = histBins.indexOf(b);
      filt.bin = (filt.bin === idx) ? null : idx;
      updateAll();
    });
}

function updateHistogram(active) {
  if (!histActiveRects) return;

  // Count active per bin (manual to avoid re-binning artifacts)
  const counts = histBins.map((b, i) => {
    const last = i === histBins.length - 1;
    return active.filter(d => d.perf >= b.x0 && (last ? d.perf <= b.x1 : d.perf < b.x1)).length;
  });

  histActiveRects
    .transition().duration(dur())
    .attr('y',       (b, i) => hY(counts[i]))
    .attr('height',  (b, i) => histH - hY(counts[i]))
    .attr('fill',    (b, i) => filt.bin === i ? '#58a6ff' : '#388bfd')
    .attr('opacity', (b, i) => {
      if (!anyFilter()) return 0.78;
      if (filt.bin !== null) return filt.bin === i ? 0.92 : 0.22;
      return 0.82;
    });

  renderBar('#hist-bar', () => {
    const bar = d3.select('#hist-bar');
    bar.html('');
    if (filt.bin !== null) {
      const b = histBins[filt.bin];
      bar.append('span').text(`perf ${Math.round(b.x0)}–${Math.round(b.x1)} · `);
      bar.append('button').attr('class', 'clr').text('clear')
        .on('click', () => { filt.bin = null; updateAll(); });
    } else {
      bar.text('click bar to filter by range');
    }
  });
}

// ════════════════════════════════════════
//  Time Series (Monthly Revenue)
// ════════════════════════════════════════
let tsActiveRects, tsX, tsY, tsH, tsMonthTotals;

function initTimeseries() {
  const el = document.getElementById('ts-area');
  const W = el.clientWidth, H = el.clientHeight;
  const m = {t: 8, r: 8, b: 24, l: 42};
  const w = W - m.l - m.r;
  tsH = H - m.t - m.b;

  tsMonthTotals = Array.from({length: 12}, (_, i) => ({
    month: i,
    total: d3.sum(data.filter(d => d.month === i), d => d.rev)
  }));

  tsX = d3.scaleBand().domain(d3.range(12)).range([0, w]).padding(0.22);
  tsY = d3.scaleLinear()
    .domain([0, d3.max(tsMonthTotals, d => d.total)])
    .range([tsH, 0]).nice();

  const svg = d3.select(el).append('svg').attr('width', W).attr('height', H);
  const g   = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);

  g.append('g').attr('class', 'axis').attr('transform', `translate(0,${tsH})`)
    .call(d3.axisBottom(tsX).tickFormat(i => MONTHS[i]).tickSize(0).tickPadding(4));
  g.append('g').attr('class', 'axis')
    .call(d3.axisLeft(tsY).ticks(3)
      .tickFormat(d => d >= 1000 ? `${(d / 1000).toFixed(0)}k` : d)
      .tickSize(0).tickPadding(4));

  // Ghost bars
  g.append('g').selectAll('rect').data(tsMonthTotals).join('rect')
    .attr('x',      d => tsX(d.month))
    .attr('width',  tsX.bandwidth())
    .attr('y',      d => tsY(d.total))
    .attr('height', d => tsH - tsY(d.total))
    .attr('fill', '#21262d').attr('stroke', '#30363d').attr('stroke-width', 0.5);

  // Active bars
  tsActiveRects = g.append('g').selectAll('rect').data(tsMonthTotals).join('rect')
    .attr('x',     d => tsX(d.month))
    .attr('width', tsX.bandwidth())
    .attr('y', tsH).attr('height', 0)
    .attr('fill', '#3fb950').attr('opacity', 0.82);

  // Invisible click targets
  g.append('g').selectAll('rect').data(tsMonthTotals).join('rect')
    .attr('x',     d => tsX(d.month))
    .attr('width', tsX.bandwidth())
    .attr('y', 0).attr('height', tsH)
    .attr('fill', 'transparent').style('cursor', 'pointer')
    .on('click', (_, d) => {
      filt.month = (filt.month === d.month) ? null : d.month;
      updateAll();
    });
}

function updateTimeseries(active) {
  if (!tsActiveRects) return;

  const monthRevs = Array.from({length: 12}, (_, i) => ({
    month: i,
    total: d3.sum(active.filter(d => d.month === i), d => d.rev)
  }));

  tsActiveRects
    .data(monthRevs)
    .transition().duration(dur())
    .attr('y',       d => tsY(d.total))
    .attr('height',  d => tsH - tsY(d.total))
    .attr('fill',    d => filt.month === d.month ? '#46d35e' : '#3fb950')
    .attr('opacity', d => {
      if (!anyFilter()) return 0.78;
      if (filt.month !== null) return d.month === filt.month ? 0.92 : 0.22;
      return 0.82;
    });

  renderBar('#ts-bar', () => {
    const bar = d3.select('#ts-bar');
    bar.html('');
    if (filt.month !== null) {
      const rev = d3.sum(active.filter(d => d.month === filt.month), d => d.rev);
      bar.append('span').text(`${MONTHS[filt.month]}: $${Math.round(rev).toLocaleString()} · `);
      bar.append('button').attr('class', 'clr').text('clear')
        .on('click', () => { filt.month = null; updateAll(); });
    } else {
      bar.text('click month to filter');
    }
  });
}

// ════════════════════════════════════════
//  Motion UI
// ════════════════════════════════════════
function syncMotionUI() {
  const reduced = isReduced();
  const dot     = document.getElementById('statusDot');
  const label   = document.getElementById('statusLabel');
  const btn     = document.getElementById('overrideBtn');

  // Dot: class controls color + animation
  dot.className = `status-dot ${reduced ? 'off' : 'on'}${(!reduced) ? ' pulsing' : ''}`;
  label.textContent = reduced ? 'Reduced motion' : 'Motion enabled';

  if (override !== null) {
    btn.className   = 'override-btn active';
    btn.textContent = `Override active · reset to system`;
  } else {
    btn.className   = 'override-btn';
    btn.textContent = reduced ? 'Demo: enable motion' : 'Demo: reduce motion';
  }
}

document.getElementById('overrideBtn').addEventListener('click', () => {
  if (override === null) {
    // Start overriding: flip from current system state
    override = !sysReduced;
  } else {
    // Already overriding — reset to system
    override = null;
  }
  syncMotionUI();
  updateAll();
});

// ════════════════════════════════════════
//  Update orchestration
// ════════════════════════════════════════

// Helper: render filter bar content (avoids flicker by replacing all at once)
function renderBar(selector, fn) { fn(); }

function updateAll() {
  const active = getActive();
  updateScatter(active);
  updateHistogram(active);
  updateTimeseries(active);
}

// ════════════════════════════════════════
//  Init (after layout settles)
// ════════════════════════════════════════
requestAnimationFrame(() => {
  initScatter();
  initHistogram();
  initTimeseries();
  syncMotionUI();
  updateAll();
});
</script>
</body>
</html>
