<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Anatomy — D3 Power Tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f1117;
    color: #e8eaf0;
    font-family: "Inter", "SF Pro Display", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 16px 24px 10px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #a0a8c0;
  }

  header p {
    font-size: 12px;
    color: #565e7a;
    margin-top: 3px;
  }

  #chart {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  .cell rect {
    stroke: #0f1117;
    stroke-width: 1.5px;
    transition: filter 0.12s, opacity 0.12s;
  }

  .cell:hover rect {
    filter: brightness(1.25);
  }

  .cell text.label-skill {
    font-size: 10px;
    font-weight: 500;
    fill: rgba(255,255,255,0.92);
    pointer-events: none;
    dominant-baseline: auto;
  }

  .cell text.label-lines {
    font-size: 9px;
    fill: rgba(255,255,255,0.52);
    pointer-events: none;
    dominant-baseline: auto;
  }

  .category-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    fill: rgba(255,255,255,0.35);
    pointer-events: none;
  }

  .category-rect {
    fill: none;
    stroke: rgba(255,255,255,0.08);
    stroke-width: 2px;
  }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(15,17,23,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.6;
    max-width: 240px;
    opacity: 0;
    transition: opacity 0.1s;
  }

  #tooltip strong {
    font-size: 13px;
    color: #fff;
    display: block;
    margin-bottom: 2px;
  }

  #tooltip .cat {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  #tooltip .lines {
    color: #a0a8c0;
  }

  #tooltip .pct {
    color: #565e7a;
    font-size: 11px;
  }

  .legend {
    padding: 8px 24px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    flex-shrink: 0;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: #6b7494;
    cursor: default;
  }

  .legend-swatch {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<header>
  <h1>Skill Anatomy</h1>
  <p>D3 Power Tools — skill files sized by line count, grouped by category</p>
</header>
<div id="chart"></div>
<div class="legend" id="legend"></div>
<div id="tooltip"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// ── Data: synthetic line counts per skill, grouped by category ──────────────
const data = {
  name: "skills",
  children: [
    {
      name: "Seeing Patterns",
      children: [
        { name: "parallel-coordinates", lines: 312, desc: "High-performance multivariate exploration, Canvas+SVG" },
        { name: "brushing",             lines: 287, desc: "Intersection, lasso, fisheye, cross-chart linking" },
        { name: "linked-views",         lines: 341, desc: "d3.dispatch, crossfilter, coordinated zoom" },
        { name: "distributions",        lines: 268, desc: "Box, violin, ridgeline, bee swarm, KDE" },
      ]
    },
    {
      name: "Seeing Structure",
      children: [
        { name: "hierarchy-layouts",    lines: 219, desc: "Treemap, pack, tree, cluster, partition" },
        { name: "hierarchy-interaction",lines: 253, desc: "Expand/collapse, zoomable treemap/sunburst" },
        { name: "edge-bundling",        lines: 198, desc: "LCA routing, curveBundle, radial dendrograms" },
        { name: "force",                lines: 334, desc: "Simulation lifecycle, custom forces, 10K+ nodes" },
        { name: "network",              lines: 276, desc: "Node-link, adjacency matrix, Sankey, chord" },
      ]
    },
    {
      name: "Seeing Place",
      children: [
        { name: "cartography",          lines: 487, desc: "Projections, TopoJSON, choropleth, globe, tiles" },
      ]
    },
    {
      name: "Seeing Change",
      children: [
        { name: "time-series",          lines: 298, desc: "scaleTime, gap handling, horizon, Gantt, LTTB" },
        { name: "motion",               lines: 241, desc: "Enter/update/exit, staggering, scrollytelling" },
        { name: "shape-morphing",       lines: 183, desc: "circle↔rect, bar↔pie, path morphing" },
      ]
    },
    {
      name: "Making it Legible",
      children: [
        { name: "scales",               lines: 229, desc: "Scale selection, axis custom, tick formats" },
        { name: "color",                lines: 356, desc: "Perceptual spaces, CVD simulation, WCAG" },
        { name: "visual-texture",       lines: 174, desc: "SVG/Canvas patterns, dual encoding for a11y" },
        { name: "annotation",           lines: 261, desc: "Callouts, leader lines, force label collision" },
        { name: "data-table",           lines: 188, desc: "Accessible tables, chart↔table toggle" },
        { name: "canvas-accessibility", lines: 212, desc: "Keyboard nav, screen reader, ARIA, focus rings" },
      ]
    },
    {
      name: "Making it Work",
      children: [
        { name: "canvas",               lines: 294, desc: "Quadtree hit detection, typed arrays, LOD" },
        { name: "webgl",                lines: 378, desc: "GPU rendering: shaders, instancing, 10M+ elems" },
        { name: "navigation",           lines: 221, desc: "d3-zoom, geometric/semantic, minimap, pinch" },
        { name: "responsive",           lines: 196, desc: "ResizeObserver, breakpoints, Canvas DPI" },
      ]
    },
    {
      name: "Before You Render",
      children: [
        { name: "data-gathering",       lines: 243, desc: "Loading, coercion, reshape, join, normalize" },
        { name: "sparkcharts",          lines: 157, desc: "Word-sized charts: sparklines, bars, bullet" },
        { name: "small-multiples",      lines: 209, desc: "Trellis, shared vs independent scales" },
      ]
    },
    {
      name: "Meta Skills",
      children: [
        { name: "d3-idioms",            lines: 168, desc: "Code style: chaining, margin, join, closure" },
        { name: "jig-template",         lines: 194, desc: "Multi-skill assembly, layer stack, resize" },
        { name: "visual-critic",        lines: 147, desc: "Design quality: color, type, whitespace" },
        { name: "encoding-integrity",   lines: 163, desc: "Lie factor, zero baseline, metamorphic tests" },
        { name: "stress-test",          lines: 152, desc: "Update storms, stale closures, transition bugs" },
        { name: "cognitive-load",       lines: 139, desc: "Working memory, animation congruence, clarity" },
        { name: "calibrate-tool",       lines: 178, desc: "Measure skill effectiveness, blind eval" },
        { name: "sharpen-tool",         lines: 161, desc: "Audit + compress SKILL.md files" },
      ]
    },
  ]
};

// ── Color scale ──────────────────────────────────────────────────────────────
const categoryNames = data.children.map(d => d.name);
const palette = [
  "#4e79a7", "#f28e2b", "#59a14f", "#e15759",
  "#76b7b2", "#edc948", "#b07aa1", "#ff9da7"
];
const color = d3.scaleOrdinal(categoryNames, palette);

// ── Legend ───────────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
categoryNames.forEach(name => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-swatch" style="background:${color(name)}"></div>${name}`;
  legendEl.appendChild(item);
});

// ── Layout ───────────────────────────────────────────────────────────────────
const chartEl = document.getElementById("chart");
const tooltip = document.getElementById("tooltip");

function render() {
  chartEl.innerHTML = "";
  const W = chartEl.clientWidth;
  const H = chartEl.clientHeight;

  const svg = d3.select(chartEl).append("svg")
    .attr("viewBox", `0 0 ${W} ${H}`)
    .attr("width", W).attr("height", H);

  const root = d3.hierarchy(data)
    .sum(d => d.children ? 0 : d.lines)
    .sort((a, b) => b.value - a.value);

  const totalLines = root.value;

  const treemap = d3.treemap()
    .size([W, H])
    .tile(d3.treemapSquarify.ratio(1.4))
    .paddingOuter(4)
    .paddingTop(18)
    .paddingInner(2);

  treemap(root);

  // ── Category group outlines + labels ─────────────────────────────────────
  svg.selectAll(".cat-group")
    .data(root.children)
    .join("g")
      .attr("class", "cat-group")
    .call(g => {
      g.append("rect")
        .attr("class", "category-rect")
        .attr("x", d => d.x0)
        .attr("y", d => d.y0)
        .attr("width", d => d.x1 - d.x0)
        .attr("height", d => d.y1 - d.y0)
        .attr("rx", 3);

      g.append("text")
        .attr("class", "category-label")
        .attr("x", d => d.x0 + 5)
        .attr("y", d => d.y0 + 12)
        .text(d => d.data.name)
        .each(function(d) {
          const avail = d.x1 - d.x0 - 10;
          while (this.getComputedTextLength() > avail && this.textContent.length > 2) {
            this.textContent = this.textContent.slice(0, -2) + "…";
          }
        });
    });

  // ── Leaf cells ───────────────────────────────────────────────────────────
  const leaves = root.leaves();

  const cell = svg.selectAll(".cell")
    .data(leaves)
    .join("g")
      .attr("class", "cell")
      .attr("transform", d => `translate(${d.x0},${d.y0})`);

  // fill color: category, lightened by depth-style opacity trick
  const getCatName = d => d.ancestors().find(a => a.depth === 1)?.data.name;

  cell.append("rect")
    .attr("width", d => Math.max(0, d.x1 - d.x0))
    .attr("height", d => Math.max(0, d.y1 - d.y0))
    .attr("rx", 2)
    .attr("fill", d => {
      const c = d3.color(color(getCatName(d)));
      c.opacity = 0.72;
      return c + "";
    });

  // skill name label
  cell.each(function(d) {
    const cw = d.x1 - d.x0;
    const ch = d.y1 - d.y0;
    if (ch < 14 || cw < 20) return;

    const g = d3.select(this);
    const name = d.data.name;
    const linesStr = `${d.data.lines} lines`;

    if (ch >= 30) {
      // two-line: name + lines
      const t1 = g.append("text")
        .attr("class", "label-skill")
        .attr("x", 5)
        .attr("y", ch - (ch >= 44 ? 18 : 6));

      t1.text(name);
      // truncate
      const maxW = cw - 10;
      while (t1.node().getComputedTextLength() > maxW && t1.text().length > 1) {
        t1.text(t1.text().slice(0, -2) + "…");
      }

      if (ch >= 44) {
        const t2 = g.append("text")
          .attr("class", "label-lines")
          .attr("x", 5)
          .attr("y", ch - 6)
          .text(linesStr);
        while (t2.node().getComputedTextLength() > maxW && t2.text().length > 1) {
          t2.text(t2.text().slice(0, -2) + "…");
        }
      }
    } else {
      // single line
      const t = g.append("text")
        .attr("class", "label-skill")
        .attr("x", 5)
        .attr("y", ch - 4)
        .text(name);
      const maxW = cw - 10;
      while (t.node().getComputedTextLength() > maxW && t.text().length > 1) {
        t.text(t.text().slice(0, -2) + "…");
      }
    }
  });

  // ── Tooltip ───────────────────────────────────────────────────────────────
  cell
    .on("pointermove", function(event, d) {
      const cat = getCatName(d);
      const pct = ((d.value / totalLines) * 100).toFixed(1);
      tooltip.innerHTML = `
        <strong>${d.data.name}</strong>
        <span class="cat" style="color:${color(cat)}">${cat}</span>
        <span class="lines">${d.data.lines.toLocaleString()} lines</span>
        <span class="pct">${pct}% of total</span>
        <span class="lines" style="font-size:10px;color:#464e68;margin-top:3px;display:block">${d.data.desc}</span>
      `;
      tooltip.style.opacity = "1";
      const rect = chartEl.getBoundingClientRect();
      let x = event.clientX - rect.left + 14;
      let y = event.clientY - rect.top - 10;
      if (x + 250 > W) x = event.clientX - rect.left - 250;
      if (y + 120 > H) y = H - 120;
      tooltip.style.left = x + "px";
      tooltip.style.top = y + "px";
    })
    .on("pointerleave", () => {
      tooltip.style.opacity = "0";
    });
}

render();

const ro = new ResizeObserver(() => render());
ro.observe(chartEl);
</script>
</body>
</html>
