<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Force · Edge Bundling · Chord — Triptych</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117;
    color: #e0e0e0;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px 8px;
    border-bottom: 1px solid #222;
  }
  h1 {
    font-size: 15px;
    font-weight: 500;
    color: #aaa;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  h1 span { color: #e0e0e0; }
  .subtitle {
    font-size: 12px;
    color: #555;
    margin-top: 3px;
  }
  #panels {
    display: flex;
    flex: 1;
    gap: 0;
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #1e1e1e;
    position: relative;
  }
  .panel:last-child { border-right: none; }
  .panel-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #555;
    padding: 10px 16px 0;
  }
  svg { display: block; width: 100%; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    padding: 8px 16px 12px;
    border-top: 1px solid #1a1a1a;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #777;
    cursor: default;
  }
  .legend-swatch {
    width: 10px; height: 10px;
    border-radius: 50%;
  }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(20,20,28,0.95);
    border: 1px solid #333;
    border-radius: 6px;
    padding: 7px 11px;
    font-size: 12px;
    color: #ccc;
    z-index: 100;
    display: none;
    line-height: 1.5;
  }
  .tooltip strong { color: #fff; }
</style>
</head>
<body>
<header>
  <h1><span>40-Node Network</span> — Three Views</h1>
  <div class="subtitle">Hover any node, group, or ribbon to highlight across all panels</div>
</header>
<div id="panels">
  <div class="panel" id="panel-force">
    <div class="panel-title">Force Layout</div>
    <svg id="svg-force"></svg>
    <div class="legend" id="legend"></div>
  </div>
  <div class="panel" id="panel-bundle">
    <div class="panel-title">Radial Edge Bundling</div>
    <svg id="svg-bundle"></svg>
  </div>
  <div class="panel" id="panel-chord">
    <div class="panel-title">Chord Diagram</div>
    <svg id="svg-chord"></svg>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script type="module">
// ─── Data ────────────────────────────────────────────────────────────────────

const GROUPS = [
  { id: 0, name: "Compute",   color: "#4f8ef7" },
  { id: 1, name: "Storage",   color: "#f7934f" },
  { id: 2, name: "Network",   color: "#6bcf7f" },
  { id: 3, name: "Security",  color: "#e06cce" },
  { id: 4, name: "Analytics", color: "#f7d94f" },
];

const NODES = [
  // Compute (0–7)
  { id: 0,  name: "API Gateway",    group: 0 },
  { id: 1,  name: "App Server 1",   group: 0 },
  { id: 2,  name: "App Server 2",   group: 0 },
  { id: 3,  name: "Job Queue",      group: 0 },
  { id: 4,  name: "Scheduler",      group: 0 },
  { id: 5,  name: "Cache Layer",    group: 0 },
  { id: 6,  name: "Worker A",       group: 0 },
  { id: 7,  name: "Worker B",       group: 0 },
  // Storage (8–15)
  { id: 8,  name: "Primary DB",     group: 1 },
  { id: 9,  name: "Replica DB",     group: 1 },
  { id: 10, name: "Object Store",   group: 1 },
  { id: 11, name: "Archive",        group: 1 },
  { id: 12, name: "Search Index",   group: 1 },
  { id: 13, name: "Time Series",    group: 1 },
  { id: 14, name: "KV Store",       group: 1 },
  { id: 15, name: "Blob Cache",     group: 1 },
  // Network (16–23)
  { id: 16, name: "Load Balancer",  group: 2 },
  { id: 17, name: "CDN Edge",       group: 2 },
  { id: 18, name: "DNS Resolver",   group: 2 },
  { id: 19, name: "VPN Gateway",    group: 2 },
  { id: 20, name: "Proxy A",        group: 2 },
  { id: 21, name: "Proxy B",        group: 2 },
  { id: 22, name: "Firewall",       group: 2 },
  { id: 23, name: "SDN Switch",     group: 2 },
  // Security (24–31)
  { id: 24, name: "Auth Service",   group: 3 },
  { id: 25, name: "Token Store",    group: 3 },
  { id: 26, name: "Audit Log",      group: 3 },
  { id: 27, name: "Cert Manager",   group: 3 },
  { id: 28, name: "SIEM",           group: 3 },
  { id: 29, name: "Vault",          group: 3 },
  { id: 30, name: "IDS",            group: 3 },
  { id: 31, name: "Policy Engine",  group: 3 },
  // Analytics (32–39)
  { id: 32, name: "Data Ingest",    group: 4 },
  { id: 33, name: "ETL Pipeline",   group: 4 },
  { id: 34, name: "ML Trainer",     group: 4 },
  { id: 35, name: "Feature Store",  group: 4 },
  { id: 36, name: "Dashboard",      group: 4 },
  { id: 37, name: "Alerting",       group: 4 },
  { id: 38, name: "Report Engine",  group: 4 },
  { id: 39, name: "Notebook",       group: 4 },
];

const EDGES = [
  // Within Compute
  [0,1],[0,2],[0,3],[1,5],[2,5],[3,6],[3,7],[4,6],[4,7],[6,7],
  // Within Storage
  [8,9],[8,14],[9,12],[10,11],[10,15],[12,13],[13,8],
  // Within Network
  [16,17],[16,20],[16,21],[17,18],[18,22],[19,22],[20,23],[21,23],
  // Within Security
  [24,25],[24,31],[25,29],[26,28],[27,29],[28,30],[29,31],[30,24],
  // Within Analytics
  [32,33],[33,34],[33,35],[34,35],[35,36],[36,37],[37,38],[38,39],[32,39],
  // Cross-group: Compute ↔ Storage
  [1,8],[2,8],[5,14],[6,9],[0,12],[7,10],
  // Cross-group: Compute ↔ Network
  [0,16],[1,20],[2,21],[16,5],[17,0],
  // Cross-group: Compute ↔ Security
  [0,24],[1,25],[4,31],[3,26],
  // Cross-group: Compute ↔ Analytics
  [3,32],[6,33],[7,34],[1,36],
  // Cross-group: Storage ↔ Analytics
  [8,32],[13,33],[10,35],[12,34],[11,38],
  // Cross-group: Network ↔ Security
  [22,28],[16,24],[19,29],[17,30],[23,31],
  // Cross-group: Security ↔ Analytics
  [26,32],[28,37],[31,35],
  // Cross-group: Network ↔ Analytics
  [17,36],[16,37],
  // Cross-group: Storage ↔ Network
  [10,17],[15,20],
  // Cross-group: Security ↔ Storage
  [29,8],[26,13],
];

// ─── Shared State ─────────────────────────────────────────────────────────────

const dispatch = d3.dispatch("nodeHover", "nodeOut");
let hoveredNode = null;
let hoveredGroup = null;

const colorScale = d3.scaleOrdinal()
  .domain(GROUPS.map(g => g.id))
  .range(GROUPS.map(g => g.color));

const tooltip = document.getElementById("tooltip");

function showTooltip(html, event) {
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  moveTooltip(event);
}
function moveTooltip(event) {
  tooltip.style.left = (event.clientX + 14) + "px";
  tooltip.style.top  = (event.clientY - 14) + "px";
}
function hideTooltip() {
  tooltip.style.display = "none";
}

// ─── Legend ───────────────────────────────────────────────────────────────────

const legendEl = document.getElementById("legend");
GROUPS.forEach(g => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-swatch" style="background:${g.color}"></div>${g.name}`;
  legendEl.appendChild(item);
});

// ─── Panel sizing helper ───────────────────────────────────────────────────────

function panelSize(svgEl) {
  const rect = svgEl.parentElement.getBoundingClientRect();
  const legendH = svgEl.parentElement.querySelector(".legend")?.offsetHeight || 0;
  const titleH = svgEl.parentElement.querySelector(".panel-title")?.offsetHeight || 0;
  const headerH = document.querySelector("header").offsetHeight;
  const h = window.innerHeight - headerH - titleH - legendH - 2;
  const w = rect.width;
  return { w, h: Math.max(h, 300) };
}

// ─── PANEL 1: Force Layout ────────────────────────────────────────────────────

function buildForce() {
  const svgEl = document.getElementById("svg-force");
  const { w, h } = panelSize(svgEl);
  svgEl.setAttribute("height", h);

  const svg = d3.select(svgEl);
  svg.selectAll("*").remove();

  const nodes = NODES.map(d => ({ ...d }));
  const links = EDGES.map(([s, t]) => ({ source: s, target: t }));

  const nodeById = new Map(nodes.map(d => [d.id, d]));

  const defs = svg.append("defs");

  // Glow filter
  const filter = defs.append("filter").attr("id", "glow-force");
  filter.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "blur");
  const feMerge = filter.append("feMerge");
  feMerge.append("feMergeNode").attr("in", "blur");
  feMerge.append("feMergeNode").attr("in", "SourceGraphic");

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(55).strength(0.4))
    .force("charge", d3.forceManyBody().strength(-120).distanceMax(300))
    .force("center", d3.forceCenter(w / 2, h / 2))
    .force("collide", d3.forceCollide(14))
    .stop();

  sim.tick(300);

  const g = svg.append("g");

  const linkSel = g.append("g").attr("class", "links")
    .selectAll("line")
    .data(links)
    .join("line")
      .attr("stroke", d => {
        const sg = nodes.find(n => n.id === (typeof d.source === "object" ? d.source.id : d.source))?.group;
        const tg = nodes.find(n => n.id === (typeof d.target === "object" ? d.target.id : d.target))?.group;
        return sg === tg ? colorScale(sg) : "#444";
      })
      .attr("stroke-opacity", 0.3)
      .attr("stroke-width", 1.2)
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);

  const nodeSel = g.append("g").attr("class", "nodes")
    .selectAll("circle")
    .data(nodes)
    .join("circle")
      .attr("r", 7)
      .attr("cx", d => d.x)
      .attr("cy", d => d.y)
      .attr("fill", d => colorScale(d.group))
      .attr("fill-opacity", 0.85)
      .attr("stroke", "#0f1117")
      .attr("stroke-width", 1.5)
      .style("cursor", "pointer");

  function updateHighlight(nodeId, groupId) {
    const connectedNodeIds = new Set();
    if (nodeId !== null) {
      connectedNodeIds.add(nodeId);
      links.forEach(l => {
        const sid = typeof l.source === "object" ? l.source.id : l.source;
        const tid = typeof l.target === "object" ? l.target.id : l.target;
        if (sid === nodeId || tid === nodeId) {
          connectedNodeIds.add(sid);
          connectedNodeIds.add(tid);
        }
      });
    }

    nodeSel
      .attr("fill-opacity", d => {
        if (nodeId !== null) return connectedNodeIds.has(d.id) ? 1 : 0.1;
        if (groupId !== null) return d.group === groupId ? 1 : 0.1;
        return 0.85;
      })
      .attr("r", d => {
        if (nodeId !== null && d.id === nodeId) return 10;
        return 7;
      })
      .attr("stroke", d => {
        if (nodeId !== null && d.id === nodeId) return colorScale(d.group);
        return "#0f1117";
      })
      .attr("stroke-width", d => nodeId !== null && d.id === nodeId ? 2.5 : 1.5)
      .style("filter", d => nodeId !== null && d.id === nodeId ? "url(#glow-force)" : null);

    linkSel
      .attr("stroke-opacity", d => {
        const sid = typeof d.source === "object" ? d.source.id : d.source;
        const tid = typeof d.target === "object" ? d.target.id : d.target;
        if (nodeId !== null) {
          return (sid === nodeId || tid === nodeId) ? 0.8 : 0.04;
        }
        if (groupId !== null) {
          const sg = nodeById.get(sid)?.group;
          const tg = nodeById.get(tid)?.group;
          return (sg === groupId || tg === groupId) ? 0.6 : 0.04;
        }
        return 0.3;
      })
      .attr("stroke-width", d => {
        const sid = typeof d.source === "object" ? d.source.id : d.source;
        const tid = typeof d.target === "object" ? d.target.id : d.target;
        if (nodeId !== null && (sid === nodeId || tid === nodeId)) return 2;
        return 1.2;
      });
  }

  nodeSel
    .on("mousemove", (event, d) => {
      moveTooltip(event);
    })
    .on("mouseenter", (event, d) => {
      dispatch.call("nodeHover", null, { nodeId: d.id, groupId: d.group });
      const degree = links.filter(l => {
        const s = typeof l.source === "object" ? l.source.id : l.source;
        const t = typeof l.target === "object" ? l.target.id : l.target;
        return s === d.id || t === d.id;
      }).length;
      showTooltip(`<strong>${d.name}</strong><br>${GROUPS[d.group].name} · ${degree} connections`, event);
    })
    .on("mouseleave", () => {
      dispatch.call("nodeOut");
      hideTooltip();
    });

  dispatch.on("nodeHover.force", ({ nodeId, groupId }) => {
    updateHighlight(nodeId, groupId);
  });
  dispatch.on("nodeOut.force", () => {
    updateHighlight(null, null);
  });
}

// ─── PANEL 2: Radial Edge Bundling ────────────────────────────────────────────

function buildBundle() {
  const svgEl = document.getElementById("svg-bundle");
  const { w, h } = panelSize(svgEl);
  svgEl.setAttribute("height", h);

  const svg = d3.select(svgEl);
  svg.selectAll("*").remove();

  const cx = w / 2, cy = h / 2;
  const outerR = Math.min(w, h) / 2 - 60;

  // Build hierarchy: root → group → node
  const hierarchyData = {
    id: "root",
    children: GROUPS.map(g => ({
      id: `g${g.id}`,
      group: g.id,
      children: NODES.filter(n => n.group === g.id).map(n => ({
        id: `n${n.id}`,
        nodeId: n.id,
        name: n.name,
        group: n.group,
      }))
    }))
  };

  const root = d3.hierarchy(hierarchyData);
  const cluster = d3.cluster().size([2 * Math.PI, outerR]);
  cluster(root);

  const nodeById = new Map(root.leaves().map(d => [d.data.id, d]));

  // LCA path links
  const bundleLinks = EDGES.map(([s, t]) => {
    const src = nodeById.get(`n${s}`);
    const tgt = nodeById.get(`n${t}`);
    if (!src || !tgt) return null;
    return src.path(tgt);
  }).filter(Boolean);

  const line = d3.lineRadial()
    .curve(d3.curveBundle.beta(0.65))
    .radius(d => d.y)
    .angle(d => d.x);

  const g = svg.append("g").attr("transform", `translate(${cx},${cy})`);

  // Link paths
  const linkSel = g.append("g").attr("class", "bundle-links")
    .selectAll("path")
    .data(bundleLinks)
    .join("path")
      .attr("fill", "none")
      .attr("stroke", (d) => {
        const srcGroup = d[0].data.group;
        const tgtGroup = d[d.length - 1].data.group;
        return srcGroup === tgtGroup ? colorScale(srcGroup) : "#556";
      })
      .attr("stroke-opacity", 0.25)
      .attr("stroke-width", 1.1)
      .attr("d", line);

  // Leaf nodes
  const leaves = root.leaves();

  const nodeSel = g.append("g").attr("class", "bundle-nodes")
    .selectAll("circle")
    .data(leaves)
    .join("circle")
      .attr("r", 5)
      .attr("transform", d =>
        `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
      .attr("fill", d => colorScale(d.data.group))
      .attr("fill-opacity", 0.85)
      .attr("stroke", "#0f1117")
      .attr("stroke-width", 1.5)
      .style("cursor", "pointer");

  // Labels
  g.append("g").attr("class", "bundle-labels")
    .selectAll("text")
    .data(leaves)
    .join("text")
      .attr("transform", d => {
        const angle = d.x * 180 / Math.PI - 90;
        const flip = d.x > Math.PI;
        return `rotate(${angle}) translate(${d.y + 10}) ${flip ? "rotate(180)" : ""}`;
      })
      .attr("text-anchor", d => d.x > Math.PI ? "end" : "start")
      .attr("font-size", 9)
      .attr("fill", d => colorScale(d.data.group))
      .attr("fill-opacity", 0.7)
      .attr("dy", "0.31em")
      .text(d => d.data.name);

  // Group arcs
  const groupArcG = g.append("g").attr("class", "group-arcs");
  GROUPS.forEach(gr => {
    const groupLeaves = leaves.filter(l => l.data.group === gr.id);
    if (!groupLeaves.length) return;
    const angles = groupLeaves.map(l => l.x).sort(d3.ascending);
    const startAngle = angles[0] - 0.05;
    const endAngle   = angles[angles.length - 1] + 0.05;
    const arcR = outerR + 40;
    const arcGen = d3.arc()
      .innerRadius(arcR - 4)
      .outerRadius(arcR)
      .startAngle(startAngle)
      .endAngle(endAngle);
    groupArcG.append("path")
      .datum(gr)
      .attr("d", arcGen())
      .attr("fill", gr.color)
      .attr("fill-opacity", 0.6)
      .attr("data-group", gr.id)
      .style("cursor", "pointer")
      .on("mouseenter", (event, d) => {
        dispatch.call("nodeHover", null, { nodeId: null, groupId: d.id });
        showTooltip(`<strong>${d.name}</strong><br>Group`, event);
      })
      .on("mousemove", (event) => moveTooltip(event))
      .on("mouseleave", () => { dispatch.call("nodeOut"); hideTooltip(); });
  });

  function updateHighlight(nodeId, groupId) {
    linkSel.attr("stroke-opacity", (d) => {
      const srcNodeId = d[0].data.nodeId;
      const tgtNodeId = d[d.length - 1].data.nodeId;
      const srcGroup = d[0].data.group;
      const tgtGroup = d[d.length - 1].data.group;

      if (nodeId !== null) {
        return (srcNodeId === nodeId || tgtNodeId === nodeId) ? 0.9 : 0.03;
      }
      if (groupId !== null) {
        return (srcGroup === groupId || tgtGroup === groupId) ? 0.7 : 0.03;
      }
      return 0.25;
    }).attr("stroke-width", (d) => {
      const srcNodeId = d[0].data.nodeId;
      const tgtNodeId = d[d.length - 1].data.nodeId;
      if (nodeId !== null && (srcNodeId === nodeId || tgtNodeId === nodeId)) return 2.5;
      return 1.1;
    }).attr("stroke", (d) => {
      const srcNodeId = d[0].data.nodeId;
      const tgtNodeId = d[d.length - 1].data.nodeId;
      const srcGroup = d[0].data.group;
      const tgtGroup = d[d.length - 1].data.group;
      if (nodeId !== null && (srcNodeId === nodeId || tgtNodeId === nodeId)) {
        const n = NODES[nodeId];
        return colorScale(n.group);
      }
      return srcGroup === tgtGroup ? colorScale(srcGroup) : "#556";
    });

    nodeSel
      .attr("fill-opacity", d => {
        if (nodeId !== null) return d.data.nodeId === nodeId ? 1 : 0.08;
        if (groupId !== null) return d.data.group === groupId ? 1 : 0.08;
        return 0.85;
      })
      .attr("r", d => nodeId !== null && d.data.nodeId === nodeId ? 8 : 5);
  }

  nodeSel
    .on("mouseenter", (event, d) => {
      const degree = EDGES.filter(([s, t]) => s === d.data.nodeId || t === d.data.nodeId).length;
      dispatch.call("nodeHover", null, { nodeId: d.data.nodeId, groupId: d.data.group });
      showTooltip(`<strong>${d.data.name}</strong><br>${GROUPS[d.data.group].name} · ${degree} connections`, event);
    })
    .on("mousemove", (event) => moveTooltip(event))
    .on("mouseleave", () => { dispatch.call("nodeOut"); hideTooltip(); });

  dispatch.on("nodeHover.bundle", ({ nodeId, groupId }) => {
    updateHighlight(nodeId, groupId);
  });
  dispatch.on("nodeOut.bundle", () => {
    updateHighlight(null, null);
  });
}

// ─── PANEL 3: Chord Diagram ───────────────────────────────────────────────────

function buildChord() {
  const svgEl = document.getElementById("svg-chord");
  const { w, h } = panelSize(svgEl);
  svgEl.setAttribute("height", h);

  const svg = d3.select(svgEl);
  svg.selectAll("*").remove();

  const cx = w / 2, cy = h / 2;
  const outerR = Math.min(w, h) / 2 - 70;
  const innerR = outerR - 22;

  const n = GROUPS.length;

  // Build flow matrix: count edges between groups
  const matrix = Array.from({ length: n }, () => new Array(n).fill(0));
  EDGES.forEach(([s, t]) => {
    const sg = NODES[s].group;
    const tg = NODES[t].group;
    matrix[sg][tg] += 1;
    if (sg !== tg) matrix[tg][sg] += 1;
  });

  const chordLayout = d3.chord().padAngle(0.06).sortSubgroups(d3.descending);
  const chords = chordLayout(matrix);

  const arc = d3.arc().innerRadius(innerR).outerRadius(outerR);
  const ribbon = d3.ribbon().radius(innerR - 1);

  const g = svg.append("g").attr("transform", `translate(${cx},${cy})`);

  // Ribbons
  const ribbonSel = g.append("g").attr("class", "ribbons")
    .selectAll("path")
    .data(chords)
    .join("path")
      .attr("d", ribbon)
      .attr("fill", d => {
        const sg = d.source.index, tg = d.target.index;
        return sg === tg ? colorScale(sg) : colorScale(sg);
      })
      .attr("fill-opacity", 0.2)
      .attr("stroke", d => colorScale(d.source.index))
      .attr("stroke-opacity", 0.15)
      .attr("stroke-width", 0.5)
      .style("cursor", "pointer");

  // Group arcs
  const groupSel = g.append("g").attr("class", "chord-groups")
    .selectAll("g")
    .data(chords.groups)
    .join("g");

  groupSel.append("path")
    .attr("d", arc)
    .attr("fill", d => colorScale(d.index))
    .attr("fill-opacity", 0.85)
    .attr("stroke", "#0f1117")
    .attr("stroke-width", 1)
    .style("cursor", "pointer");

  // Group labels
  groupSel.append("text")
    .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
    .attr("transform", d => {
      const flip = d.angle > Math.PI;
      return `rotate(${d.angle * 180 / Math.PI - 90})` +
             `translate(${outerR + 12})` +
             (flip ? "rotate(180)" : "");
    })
    .attr("text-anchor", d => (d.startAngle + d.endAngle) / 2 > Math.PI ? "end" : "start")
    .attr("font-size", 11)
    .attr("font-weight", 600)
    .attr("fill", d => colorScale(d.index))
    .attr("dy", "0.31em")
    .text(d => GROUPS[d.index].name);

  // Tick count labels
  groupSel.append("text")
    .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
    .attr("transform", d => {
      const flip = d.angle > Math.PI;
      return `rotate(${d.angle * 180 / Math.PI - 90})` +
             `translate(${outerR + 12})` +
             (flip ? "rotate(180)" : "");
    })
    .attr("text-anchor", d => (d.startAngle + d.endAngle) / 2 > Math.PI ? "end" : "start")
    .attr("font-size", 9)
    .attr("fill", d => colorScale(d.index))
    .attr("fill-opacity", 0.5)
    .attr("dy", "1.5em")
    .text(d => `${d.value} links`);

  function updateHighlight(nodeId, groupId) {
    const activeGroupId = groupId !== null ? groupId :
      (nodeId !== null ? NODES[nodeId].group : null);

    ribbonSel
      .attr("fill-opacity", d => {
        if (activeGroupId === null) return 0.2;
        return (d.source.index === activeGroupId || d.target.index === activeGroupId) ? 0.55 : 0.04;
      })
      .attr("stroke-opacity", d => {
        if (activeGroupId === null) return 0.15;
        return (d.source.index === activeGroupId || d.target.index === activeGroupId) ? 0.6 : 0.04;
      });

    groupSel.select("path")
      .attr("fill-opacity", d => {
        if (activeGroupId === null) return 0.85;
        return d.index === activeGroupId ? 1 : 0.2;
      });
  }

  groupSel
    .on("mouseenter", (event, d) => {
      const g = GROUPS[d.index];
      const outgoing = matrix[d.index].reduce((a, b) => a + b, 0);
      dispatch.call("nodeHover", null, { nodeId: null, groupId: d.index });
      showTooltip(`<strong>${g.name}</strong><br>${outgoing} total connections`, event);
    })
    .on("mousemove", (event) => moveTooltip(event))
    .on("mouseleave", () => { dispatch.call("nodeOut"); hideTooltip(); });

  ribbonSel
    .on("mouseenter", (event, d) => {
      const sg = GROUPS[d.source.index].name;
      const tg = GROUPS[d.target.index].name;
      dispatch.call("nodeHover", null, { nodeId: null, groupId: d.source.index });
      showTooltip(`<strong>${sg} ↔ ${tg}</strong><br>${d.source.value} connections`, event);
    })
    .on("mousemove", (event) => moveTooltip(event))
    .on("mouseleave", () => { dispatch.call("nodeOut"); hideTooltip(); });

  dispatch.on("nodeHover.chord", ({ nodeId, groupId }) => {
    updateHighlight(nodeId, groupId);
  });
  dispatch.on("nodeOut.chord", () => {
    updateHighlight(null, null);
  });
}

// ─── Init ──────────────────────────────────────────────────────────────────────

buildForce();
buildBundle();
buildChord();

window.addEventListener("resize", () => {
  buildForce();
  buildBundle();
  buildChord();
});
</script>
</body>
</html>
