<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retail Sales — Monthly Cycle Plot (2020-2024)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .panel-divider { stroke: #e0e0e0; stroke-width: 1; }
  .mean-line { stroke-dasharray: 4 2; }
  .annotation-text { font-size: 11px; fill: #555; }
  .bracket-text { font-size: 11px; fill: #882255; font-weight: 600; }
  .year-label { font-size: 9px; fill: #777; }
  .month-label { font-size: 12px; font-weight: 600; fill: #333; }
  .title { font-size: 16px; font-weight: 700; fill: #222; }
  .subtitle { font-size: 12px; fill: #666; }
  .axis text { font-size: 10px; fill: #555; }
  .axis line, .axis path { stroke: #bbb; }
  .legend-text { font-size: 10px; fill: #555; }
</style>
</head>
<body>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Data generation ---
const months = d3.range(12);
const years = [2020, 2021, 2022, 2023, 2024];
const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Seasonal base pattern: Jan-Feb low, spring rise, summer dip, holiday spike
const seasonalBase = [80, 78, 92, 100, 105, 98, 95, 97, 102, 108, 132, 150];

const rng = d3.randomNormal(0, 5);
// Seeded-ish: use a simple deterministic noise
const noise = [
  [2.1,-3.4,1.8,-0.5,4.2,-2.1,0.7,-1.3,3.1,-0.8,2.5,-4.1],
  [-1.5,2.8,-3.2,1.1,-0.3,3.5,-2.4,1.9,-1.7,2.3,-3.8,1.4],
  [3.7,-1.2,0.4,-2.9,1.6,-0.7,2.2,-3.6,0.9,1.5,-2.1,3.3],
  [-0.8,1.5,-2.7,3.4,-1.9,0.3,-1.1,2.7,-3.5,0.6,4.1,-1.8],
  [1.3,-2.6,3.1,-1.4,0.8,-3.3,1.5,-0.2,2.4,-1.6,3.7,-2.9]
];

const data = [];
years.forEach((year, yi) => {
  const growth = Math.pow(1.03, yi); // 3% YoY growth
  months.forEach((month, mi) => {
    const value = seasonalBase[mi] * growth + noise[yi][mi];
    data.push({ year, month, value: Math.round(value * 10) / 10, monthName: monthNames[mi] });
  });
});

// --- Layout ---
const panelWidth = 80;
const panelHeight = 300;
const marginLeft = 55;
const marginTop = 60;
const marginBottom = 50;
const marginRight = 30;
const panelPadX = 8; // inner padding within each panel
const totalWidth = marginLeft + panelWidth * 12 + marginRight;
const totalHeight = marginTop + panelHeight + marginBottom;

const svg = d3.select("body").append("svg")
    .attr("width", totalWidth)
    .attr("height", totalHeight);

// --- Scales ---
const yExtent = [60, 170];
const y = d3.scaleLinear().domain(yExtent).range([panelHeight, 0]);

// X within each panel: map year index to horizontal position
const xPanel = d3.scalePoint()
    .domain(years)
    .range([panelPadX, panelWidth - panelPadX]);

// Tol sequential blue palette for years (light to dark)
const colorScale = d3.scaleOrdinal()
    .domain(years)
    .range(["#BBCCEE", "#88AADD", "#5588CC", "#3366AA", "#224488"]);

// --- Title ---
svg.append("text")
    .attr("class", "title")
    .attr("x", totalWidth / 2)
    .attr("y", 24)
    .attr("text-anchor", "middle")
    .text("Retail Sales \u2014 Monthly Cycle Plot (2020\u20132024)");

svg.append("text")
    .attr("class", "subtitle")
    .attr("x", totalWidth / 2)
    .attr("y", 42)
    .attr("text-anchor", "middle")
    .text("Each panel shows one month across five years. Dashed line = month mean.");

// --- Shared Y axis ---
const chartArea = svg.append("g")
    .attr("transform", `translate(${marginLeft}, ${marginTop})`);

const yAxis = d3.axisLeft(y)
    .ticks(6)
    .tickFormat(d => `$${d}`);

chartArea.append("g")
    .attr("class", "axis")
    .call(yAxis)
  .select(".domain").remove();

// Light horizontal gridlines
chartArea.append("g")
    .attr("class", "axis")
  .selectAll("line")
  .data(y.ticks(6))
  .join("line")
    .attr("x1", 0)
    .attr("x2", panelWidth * 12)
    .attr("y1", d => y(d))
    .attr("y2", d => y(d))
    .attr("stroke", "#e8e8e8")
    .attr("stroke-width", 0.5);

// --- Overall mean line ---
const overallMean = d3.mean(data, d => d.value);
chartArea.append("line")
    .attr("x1", 0)
    .attr("x2", panelWidth * 12)
    .attr("y1", y(overallMean))
    .attr("y2", y(overallMean))
    .attr("stroke", "#999")
    .attr("stroke-width", 1)
    .attr("stroke-dasharray", "6 3");

chartArea.append("text")
    .attr("class", "annotation-text")
    .attr("x", panelWidth * 12 + 4)
    .attr("y", y(overallMean) + 4)
    .text(`Mean $${overallMean.toFixed(0)}`);

// --- Find highest and lowest data points ---
const sorted = [...data].sort((a, b) => a.value - b.value);
const lowest = sorted[0];
const highest = sorted[sorted.length - 1];

// --- Draw panels ---
const byMonth = d3.group(data, d => d.month);
const line = d3.line()
    .x(d => xPanel(d.year))
    .y(d => y(d.value));

months.forEach((month, mi) => {
  const panel = chartArea.append("g")
      .attr("transform", `translate(${mi * panelWidth}, 0)`);

  // Panel dividers
  if (mi > 0) {
    panel.append("line")
        .attr("class", "panel-divider")
        .attr("x1", 0).attr("x2", 0)
        .attr("y1", 0).attr("y2", panelHeight);
  }

  const monthData = [...byMonth.get(month)].sort((a, b) => a.year - b.year);
  const monthMean = d3.mean(monthData, d => d.value);

  // Month mean dashed line
  panel.append("line")
      .attr("class", "mean-line")
      .attr("x1", panelPadX - 4)
      .attr("x2", panelWidth - panelPadX + 4)
      .attr("y1", y(monthMean))
      .attr("y2", y(monthMean))
      .attr("stroke", "#882255")
      .attr("stroke-width", 1.5);

  // Connecting line
  panel.append("path")
      .datum(monthData)
      .attr("d", line)
      .attr("fill", "none")
      .attr("stroke", "#666")
      .attr("stroke-width", 1.2);

  // Data points
  panel.selectAll("circle")
    .data(monthData)
    .join("circle")
      .attr("cx", d => xPanel(d.year))
      .attr("cy", d => y(d.value))
      .attr("r", 4)
      .attr("fill", d => colorScale(d.year))
      .attr("stroke", "#fff")
      .attr("stroke-width", 1.2);

  // Month title
  panel.append("text")
      .attr("class", "month-label")
      .attr("x", panelWidth / 2)
      .attr("y", -8)
      .attr("text-anchor", "middle")
      .text(monthNames[mi]);

  // Year labels below
  years.forEach(yr => {
    panel.append("text")
        .attr("class", "year-label")
        .attr("x", xPanel(yr))
        .attr("y", panelHeight + 14)
        .attr("text-anchor", "middle")
        .text(String(yr).slice(2)); // "20", "21", ...
  });

  // Annotate highest / lowest if in this panel
  [highest, lowest].forEach(pt => {
    if (pt.month !== month) return;
    const isHigh = pt === highest;
    const cx = xPanel(pt.year);
    const cy = y(pt.value);
    const offsetY = isHigh ? -14 : 18;

    panel.append("text")
        .attr("class", "annotation-text")
        .attr("x", cx)
        .attr("y", cy + offsetY)
        .attr("text-anchor", "middle")
        .attr("font-weight", "600")
        .attr("fill", isHigh ? "#117733" : "#CC3311")
        .text(`$${pt.value.toFixed(0)}`);

    // Small arrow line
    panel.append("line")
        .attr("x1", cx).attr("x2", cx)
        .attr("y1", cy + (isHigh ? -3 : 3))
        .attr("y2", cy + (isHigh ? -8 : 12))
        .attr("stroke", isHigh ? "#117733" : "#CC3311")
        .attr("stroke-width", 1);
  });
});

// --- Holiday Season bracket annotation ---
const novX = 10 * panelWidth;
const decX = 11 * panelWidth + panelWidth;
const bracketY = -30;

// Bracket path: horizontal line with downward ticks at ends
chartArea.append("path")
    .attr("d", `M${novX + 10},${bracketY + 8} L${novX + 10},${bracketY} L${decX - 10},${bracketY} L${decX - 10},${bracketY + 8}`)
    .attr("fill", "none")
    .attr("stroke", "#882255")
    .attr("stroke-width", 1.5);

chartArea.append("text")
    .attr("class", "bracket-text")
    .attr("x", (novX + decX) / 2)
    .attr("y", bracketY - 4)
    .attr("text-anchor", "middle")
    .text("Holiday Season");

// --- Year color legend ---
const legend = svg.append("g")
    .attr("transform", `translate(${marginLeft + panelWidth * 12 - 200}, ${totalHeight - 18})`);

years.forEach((yr, i) => {
  const g = legend.append("g")
      .attr("transform", `translate(${i * 40}, 0)`);
  g.append("circle")
      .attr("r", 4)
      .attr("fill", colorScale(yr))
      .attr("stroke", "#fff")
      .attr("stroke-width", 1);
  g.append("text")
      .attr("class", "legend-text")
      .attr("x", 7)
      .attr("y", 4)
      .text(yr);
});

</script>
</body>
</html>
