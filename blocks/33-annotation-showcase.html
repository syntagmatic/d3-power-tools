<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotation Showcase — Stock Price</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }
  #chart-wrapper {
    width: 100%;
    max-width: 1200px;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 1.5rem;
  }
  .axis text { font-family: system-ui, sans-serif; font-size: 11px; fill: #555; }
  .axis path, .axis line { stroke: #ccc; }
  .tick-mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; }
  .annotation-title { font-weight: 600; font-size: 11px; fill: #333; }
  .annotation-body { font-size: 10px; fill: #666; }
  .leader-line { fill: none; stroke: #888; stroke-width: 0.8; }
  .threshold-band { opacity: 0.08; }
  .event-marker { stroke-width: 1; stroke-dasharray: 4,3; opacity: 0.7; }
  .trend-line { fill: none; stroke: #AA3377; stroke-width: 1.2; stroke-dasharray: 6,4; opacity: 0.7; }
  .range-arrow line { stroke: #333; stroke-width: 1.2; }
  .range-arrow polygon { fill: #333; }
  .source-line { font-size: 10px; fill: #999; }
</style>
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<div id="chart-wrapper"></div>
<script>
(() => {
  // --- Tol palette ---
  const COL = {
    line: "#4477AA",
    crash: "#EE6677",
    recovery: "#228833",
    event: "#CCBB44",
    threshold: "#66CCEE",
    trend: "#AA3377",
    band: "#4477AA",
  };

  // --- Synthetic data: 500 trading days, random walk with crash & recovery ---
  const seed = (s) => () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  const rng = seed(42);
  const normal = () => {
    let u, v, s;
    do { u = rng() * 2 - 1; v = rng() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
    return u * Math.sqrt(-2 * Math.log(s) / s);
  };

  const N = 500;
  const startDate = new Date(2023, 0, 3); // Jan 3 2023
  const data = [];
  let price = 100;
  const crashStart = 180, crashEnd = 220, recoveryEnd = 320;

  for (let i = 0; i < N; i++) {
    // Skip weekends
    const date = new Date(startDate);
    date.setDate(date.getDate() + Math.floor(i * 7 / 5) + (i % 5 >= 5 ? 2 : 0));
    // Adjust for actual weekday spacing
    const dayOffset = Math.floor(i / 5) * 7 + (i % 5);
    date.setTime(startDate.getTime() + dayOffset * 86400000);

    let drift = 0.0003, vol = 0.012;
    if (i >= crashStart && i < crashEnd) { drift = -0.008; vol = 0.025; }
    else if (i >= crashEnd && i < recoveryEnd) { drift = 0.004; vol = 0.018; }

    price *= Math.exp(drift + vol * normal());
    price = Math.max(price, 10);
    data.push({ date, price, i });
  }

  // --- Key events for annotation ---
  const crashIdx = crashStart + 5;
  const troughIdx = d3.minIndex(data.slice(crashStart, crashEnd + 20), d => d.price) + crashStart;
  const recoveryIdx = recoveryEnd - 10;
  const peakIdx = d3.maxIndex(data.slice(0, crashStart), d => d.price);
  const endPeakIdx = d3.maxIndex(data.slice(recoveryEnd), d => d.price) + recoveryEnd;

  // --- Dimensions ---
  const margin = { top: 50, right: 60, bottom: 50, left: 65 };
  const fullWidth = 1200, fullHeight = 800;
  const width = fullWidth - margin.left - margin.right;
  const height = fullHeight - margin.top - margin.bottom;

  // --- Scales ---
  const x = d3.scaleTime()
    .domain(d3.extent(data, d => d.date))
    .range([0, width]);

  const y = d3.scaleLinear()
    .domain([d3.min(data, d => d.price) * 0.92, d3.max(data, d => d.price) * 1.08])
    .range([height, 0]);

  // --- SVG ---
  const svg = d3.select("#chart-wrapper")
    .append("svg")
    .attr("viewBox", `0 0 ${fullWidth} ${fullHeight}`)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("width", "100%")
    .style("height", "auto");

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // --- Title ---
  svg.append("text")
    .attr("x", margin.left)
    .attr("y", 28)
    .attr("font-family", "system-ui, sans-serif")
    .attr("font-size", 18)
    .attr("font-weight", 700)
    .attr("fill", "#222")
    .text("ACME Corp Stock Price — Crash & Recovery");

  svg.append("text")
    .attr("x", margin.left)
    .attr("y", 44)
    .attr("font-family", "system-ui, sans-serif")
    .attr("font-size", 12)
    .attr("fill", "#888")
    .text("500 trading days of synthetic data with richly annotated events");

  // --- Threshold bands ---
  const avgPrice = d3.mean(data, d => d.price);
  const bandWidth = avgPrice * 0.08;

  g.append("rect")
    .attr("x", 0)
    .attr("y", y(avgPrice + bandWidth))
    .attr("width", width)
    .attr("height", y(avgPrice - bandWidth) - y(avgPrice + bandWidth))
    .attr("fill", COL.threshold)
    .attr("class", "threshold-band");

  g.append("line")
    .attr("x1", 0).attr("x2", width)
    .attr("y1", y(avgPrice)).attr("y2", y(avgPrice))
    .attr("stroke", COL.threshold)
    .attr("stroke-width", 0.8)
    .attr("stroke-dasharray", "3,3")
    .attr("opacity", 0.6);

  g.append("text")
    .attr("x", width + 4)
    .attr("y", y(avgPrice) + 4)
    .attr("font-family", "ui-monospace, monospace")
    .attr("font-size", 10)
    .attr("fill", COL.threshold)
    .text(`Avg $${avgPrice.toFixed(0)}`);

  g.append("text")
    .attr("x", width + 4)
    .attr("y", y(avgPrice + bandWidth) - 3)
    .attr("font-family", "ui-monospace, monospace")
    .attr("font-size", 9)
    .attr("fill", "#aaa")
    .text("±8% band");

  // --- Event markers (vertical lines) ---
  const events = [
    { idx: crashStart, label: "Sell-off begins", color: COL.crash },
    { idx: troughIdx, label: "Market trough", color: COL.crash },
    { idx: recoveryEnd, label: "Full recovery", color: COL.recovery },
  ];

  events.forEach(ev => {
    const ex = x(data[ev.idx].date);
    g.append("line")
      .attr("x1", ex).attr("x2", ex)
      .attr("y1", 0).attr("y2", height)
      .attr("stroke", ev.color)
      .attr("class", "event-marker");

    g.append("text")
      .attr("x", ex + 4)
      .attr("y", 14)
      .attr("font-family", "system-ui, sans-serif")
      .attr("font-size", 10)
      .attr("font-weight", 600)
      .attr("fill", ev.color)
      .text(ev.label);
  });

  // --- Line ---
  const line = d3.line()
    .x(d => x(d.date))
    .y(d => y(d.price))
    .curve(d3.curveMonotoneX);

  g.append("path")
    .datum(data)
    .attr("fill", "none")
    .attr("stroke", COL.line)
    .attr("stroke-width", 2)
    .attr("d", line);

  // --- Trend / regression line ---
  const xVals = data.map((d, i) => i);
  const yVals = data.map(d => d.price);
  const n = xVals.length;
  const sumX = d3.sum(xVals);
  const sumY = d3.sum(yVals);
  const sumXY = d3.sum(xVals.map((xi, i) => xi * yVals[i]));
  const sumXX = d3.sum(xVals.map(xi => xi * xi));
  const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
  const intercept = (sumY - slope * sumX) / n;

  g.append("line")
    .attr("x1", x(data[0].date))
    .attr("y1", y(intercept))
    .attr("x2", x(data[N - 1].date))
    .attr("y2", y(slope * (N - 1) + intercept))
    .attr("class", "trend-line");

  g.append("text")
    .attr("x", x(data[N - 1].date) + 4)
    .attr("y", y(slope * (N - 1) + intercept) - 6)
    .attr("font-family", "system-ui, sans-serif")
    .attr("font-size", 10)
    .attr("fill", COL.trend)
    .attr("font-style", "italic")
    .text("Trend");

  // --- Range arrow (crash depth) ---
  const preCrashPrice = data[peakIdx].price;
  const troughPrice = data[troughIdx].price;
  const arrowX = x(data[troughIdx].date) + 40;
  const arrowY1 = y(preCrashPrice);
  const arrowY2 = y(troughPrice);
  const arrowMid = (arrowY1 + arrowY2) / 2;
  const arrowSize = 5;

  const arrowG = g.append("g").attr("class", "range-arrow");

  // Vertical line
  arrowG.append("line")
    .attr("x1", arrowX).attr("x2", arrowX)
    .attr("y1", arrowY1 + arrowSize).attr("y2", arrowY2 - arrowSize);

  // Top arrowhead
  arrowG.append("polygon")
    .attr("points", `${arrowX},${arrowY1} ${arrowX - arrowSize},${arrowY1 + arrowSize * 1.8} ${arrowX + arrowSize},${arrowY1 + arrowSize * 1.8}`);

  // Bottom arrowhead
  arrowG.append("polygon")
    .attr("points", `${arrowX},${arrowY2} ${arrowX - arrowSize},${arrowY2 - arrowSize * 1.8} ${arrowX + arrowSize},${arrowY2 - arrowSize * 1.8}`);

  // Label
  const pctDrop = ((troughPrice - preCrashPrice) / preCrashPrice * 100).toFixed(1);
  arrowG.append("text")
    .attr("x", arrowX + 8)
    .attr("y", arrowMid + 4)
    .attr("font-family", "ui-monospace, monospace")
    .attr("font-size", 11)
    .attr("font-weight", 700)
    .attr("fill", COL.crash)
    .text(`${pctDrop}%`);

  // --- Callout annotations with leader lines + force collision avoidance ---
  const annotations = [
    { idx: peakIdx, dx: 50, dy: -50,
      title: "Pre-crash peak",
      body: `$${data[peakIdx].price.toFixed(2)}` },
    { idx: troughIdx, dx: -80, dy: 50,
      title: "Market bottom",
      body: `$${data[troughIdx].price.toFixed(2)}` },
    { idx: endPeakIdx, dx: -70, dy: -55,
      title: "Recovery high",
      body: `$${data[endPeakIdx].price.toFixed(2)}` },
  ];

  // Force simulation for label collision avoidance
  const labelNodes = annotations.map(a => ({
    ...a,
    anchorX: x(data[a.idx].date),
    anchorY: y(data[a.idx].price),
    x: x(data[a.idx].date) + a.dx,
    y: y(data[a.idx].price) + a.dy,
    width: Math.max(a.title.length, a.body.length) * 6.5 + 12,
    height: 30,
  }));

  const rectCollide = (padding = 4) => {
    let nodes;
    const force = (alpha) => {
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const overlapX = (a.width + b.width) / 2 + padding - Math.abs(dx);
          const overlapY = (a.height + b.height) / 2 + padding - Math.abs(dy);
          if (overlapX > 0 && overlapY > 0) {
            const axis = overlapX < overlapY ? "x" : "y";
            const overlap = axis === "x" ? overlapX : overlapY;
            const sign = axis === "x" ? Math.sign(dx) || 1 : Math.sign(dy) || 1;
            const shift = overlap * alpha * 0.5;
            a[axis] -= sign * shift;
            b[axis] += sign * shift;
          }
        }
      }
    };
    force.initialize = (_) => { nodes = _; };
    return force;
  };

  const sim = d3.forceSimulation(labelNodes)
    .force("x", d3.forceX(d => d.anchorX + d.dx).strength(0.3))
    .force("y", d3.forceY(d => d.anchorY + d.dy).strength(0.3))
    .force("collide", rectCollide(6))
    .force("bounds", () => {
      labelNodes.forEach(d => {
        d.x = Math.max(d.width / 2, Math.min(width - d.width / 2, d.x));
        d.y = Math.max(d.height / 2, Math.min(height - d.height / 2, d.y));
      });
    })
    .velocityDecay(0.6)
    .stop();

  for (let i = 0; i < 150; i++) sim.tick();

  // Render annotations
  const annotG = g.append("g").attr("class", "annotations");

  labelNodes.forEach(a => {
    const ag = annotG.append("g");

    // Dot at data point
    ag.append("circle")
      .attr("cx", a.anchorX)
      .attr("cy", a.anchorY)
      .attr("r", 4)
      .attr("fill", "white")
      .attr("stroke", COL.line)
      .attr("stroke-width", 2);

    // Elbow leader line
    const elbowX = a.x;
    const elbowY = a.anchorY;
    ag.append("path")
      .attr("class", "leader-line")
      .attr("d", `M${a.anchorX},${a.anchorY} L${elbowX},${elbowY} L${elbowX},${a.y}`);

    // Background rect for legibility
    ag.append("rect")
      .attr("x", a.x - a.width / 2 - 3)
      .attr("y", a.y - 14)
      .attr("width", a.width + 6)
      .attr("height", a.height + 2)
      .attr("fill", "white")
      .attr("opacity", 0.9)
      .attr("rx", 2);

    // Title
    ag.append("text")
      .attr("x", a.x - a.width / 2)
      .attr("y", a.y)
      .attr("class", "annotation-title")
      .text(a.title);

    // Body (price)
    ag.append("text")
      .attr("x", a.x - a.width / 2)
      .attr("y", a.y + 14)
      .attr("class", "annotation-body tick-mono")
      .text(a.body);
  });

  // --- Axes ---
  const xAxis = g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x)
      .ticks(Math.max(4, Math.floor(width / 120)))
      .tickFormat(d3.timeFormat("%b %Y"))
      .tickSizeOuter(0));

  const yAxis = g.append("g")
    .attr("class", "axis")
    .call(d3.axisLeft(y)
      .ticks(8)
      .tickFormat(d => `$${d.toFixed(0)}`)
      .tickSizeOuter(0));

  yAxis.selectAll(".tick text").attr("class", "tick-mono");

  // Grid lines
  g.insert("g", ":first-child")
    .attr("class", "grid")
    .selectAll("line")
    .data(y.ticks(8))
    .join("line")
    .attr("x1", 0).attr("x2", width)
    .attr("y1", d => y(d)).attr("y2", d => y(d))
    .attr("stroke", "#eee")
    .attr("stroke-width", 0.5);

  // --- Tooltip (Voronoi-based) ---
  const tooltip = d3.select("body").append("div")
    .style("position", "absolute")
    .style("pointer-events", "none")
    .style("opacity", 0)
    .style("background", "white")
    .style("border", "1px solid #ddd")
    .style("border-radius", "4px")
    .style("padding", "6px 10px")
    .style("font-family", "system-ui, sans-serif")
    .style("font-size", "12px")
    .style("box-shadow", "0 1px 4px rgba(0,0,0,0.1)");

  const delaunay = d3.Delaunay.from(data, d => x(d.date), d => y(d.price));

  const hoverDot = g.append("circle")
    .attr("r", 4)
    .attr("fill", COL.line)
    .attr("stroke", "white")
    .attr("stroke-width", 2)
    .style("display", "none");

  g.append("rect")
    .attr("width", width)
    .attr("height", height)
    .attr("fill", "none")
    .attr("pointer-events", "all")
    .on("pointermove", (event) => {
      const [mx, my] = d3.pointer(event);
      const i = delaunay.find(mx, my);
      const d = data[i];
      hoverDot
        .attr("cx", x(d.date))
        .attr("cy", y(d.price))
        .style("display", null);
      tooltip
        .html(`<strong>${d3.timeFormat("%b %d, %Y")(d.date)}</strong><br>
               <span style="font-family:monospace">$${d.price.toFixed(2)}</span>`)
        .style("opacity", 1)
        .style("left", `${event.pageX + 14}px`)
        .style("top", `${event.pageY - 30}px`);
    })
    .on("pointerleave", () => {
      hoverDot.style("display", "none");
      tooltip.style("opacity", 0);
    });

  // --- Source line ---
  svg.append("text")
    .attr("x", fullWidth - margin.right)
    .attr("y", fullHeight - 8)
    .attr("text-anchor", "end")
    .attr("class", "source-line")
    .text("Synthetic data · D3.js v7 · Annotation Showcase");
})();
</script>
</body>
</html>
