<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sankey Energy Flow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #111;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-weight: 300;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        #chart {
            width: 100%;
            max-width: 1200px;
            height: 700px;
            background: #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .node {
            cursor: grab;
        }
        .node:active {
            cursor: grabbing;
        }
        .node rect {
            stroke: #000;
            stroke-width: 1px;
            rx: 2px;
            ry: 2px;
            transition: opacity 0.2s;
        }
        .node text {
            pointer-events: none;
            font-size: 12px;
            fill: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            transition: opacity 0.2s;
        }
        .link {
            fill: none;
            stroke-opacity: 0.4;
            transition: stroke-opacity 0.2s;
        }
        .link.loss {
            stroke: #ef4444 !important;
            stroke-opacity: 0.6;
        }
        .link:hover, .link.highlight {
            stroke-opacity: 0.8 !important;
        }
        .link.loss:hover, .link.loss.highlight {
            stroke-opacity: 0.95 !important;
        }
        
        /* Fade effect for non-highlighted elements */
        .fade .link:not(.highlight) {
            stroke-opacity: 0.05 !important;
        }
        .fade .link.loss:not(.highlight) {
            stroke-opacity: 0.1 !important;
        }
        .fade .node:not(.highlight) {
            opacity: 0.2;
        }

        .tooltip {
            position: absolute;
            background: rgba(15, 15, 20, 0.95);
            border: 1px solid #333;
            color: #eee;
            padding: 12px;
            border-radius: 6px;
            pointer-events: none;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.15s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            z-index: 10;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .tooltip .value {
            font-size: 1.3em;
            font-weight: 600;
            margin: 4px 0;
            color: #60a5fa;
        }
        .tooltip .percentage {
            color: #9ca3af;
            font-size: 0.9em;
        }
        .tooltip .loss-text {
            color: #ef4444 !important;
        }
    </style>
</head>
<body>
    <h1>US Energy Flow</h1>
    <div class="subtitle">Drag nodes vertically. Hover for connected paths and values (TWh).</div>
    <div id="chart">
        <div class="tooltip" id="tooltip"></div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <script>
        const nodes = [
            { id: 0, name: "Solar" },
            { id: 1, name: "Nuclear" },
            { id: 2, name: "Hydro" },
            { id: 3, name: "Wind" },
            { id: 4, name: "Natural Gas" },
            { id: 5, name: "Petroleum" },
            { id: 6, name: "Power Generation" },
            { id: 7, name: "Petroleum Refining" },
            { id: 8, name: "Electrical Grid" },
            { id: 9, name: "Gas Distribution" },
            { id: 10, name: "Fuel Distribution" },
            { id: 11, name: "Residential" },
            { id: 12, name: "Commercial" },
            { id: 13, name: "Industrial" },
            { id: 14, name: "Transportation" },
            { id: 15, name: "Heating" },
            { id: 16, name: "Cooling" },
            { id: 17, name: "Lighting" },
            { id: 18, name: "Electronics" },
            { id: 19, name: "Mechanical Power" },
            { id: 20, name: "Chemical/Materials" },
            { id: 21, name: "Rejected Energy" }
        ];

        const links = [
            { source: 0, target: 6, value: 10 },
            { source: 0, target: 11, value: 2 },
            { source: 1, target: 6, value: 30 },
            { source: 2, target: 6, value: 15 },
            { source: 3, target: 6, value: 20 },
            { source: 4, target: 6, value: 25 },
            { source: 4, target: 9, value: 25 },
            { source: 5, target: 7, value: 45 },
            
            { source: 6, target: 8, value: 65 },
            { source: 6, target: 21, value: 35 },
            { source: 7, target: 10, value: 40 },
            { source: 7, target: 21, value: 5 },
            
            { source: 8, target: 11, value: 20 },
            { source: 8, target: 12, value: 20 },
            { source: 8, target: 13, value: 20 },
            { source: 8, target: 14, value: 5 },
            { source: 9, target: 11, value: 10 },
            { source: 9, target: 12, value: 5 },
            { source: 9, target: 13, value: 10 },
            { source: 10, target: 13, value: 5 },
            { source: 10, target: 14, value: 35 },
            
            { source: 11, target: 15, value: 12 },
            { source: 11, target: 16, value: 5 },
            { source: 11, target: 17, value: 3 },
            { source: 11, target: 18, value: 4 },
            { source: 11, target: 21, value: 8 },
            
            { source: 12, target: 15, value: 8 },
            { source: 12, target: 16, value: 6 },
            { source: 12, target: 17, value: 4 },
            { source: 12, target: 18, value: 4 },
            { source: 12, target: 21, value: 3 },
            
            { source: 13, target: 15, value: 10 },
            { source: 13, target: 19, value: 5 },
            { source: 13, target: 20, value: 5 },
            { source: 13, target: 21, value: 15 },
            
            { source: 14, target: 19, value: 10 },
            { source: 14, target: 21, value: 30 }
        ];

        const width = 1200;
        const height = 700;
        const margin = { top: 40, right: 40, bottom: 40, left: 40 };
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const targetIds = new Set(links.map(l => l.target));
        const dynamicTotal = d3.sum(links.filter(l => !targetIds.has(l.source)), d => d.value);

        const sankey = d3.sankey()
            .nodeId(d => d.id)
            .nodeWidth(18)
            .nodePadding(14)
            .extent([[0, 0], [innerWidth, innerHeight]])
            .nodeAlign(d3.sankeyJustify);

        const graph = sankey({
            nodes: nodes.map(d => Object.assign({}, d)),
            links: links.map(d => Object.assign({}, d))
        });

        const color = d3.scaleOrdinal(d3.schemeCategory10);
        function getNodeColor(d) {
            if (d.name === "Rejected Energy") return "#ef4444";
            return color(d.name);
        }

        const defs = svg.append("defs");
        graph.links.forEach((d, i) => {
            const gradientId = `grad-${i}`;
            const gradient = defs.append("linearGradient")
                .attr("id", gradientId)
                .attr("gradientUnits", "userSpaceOnUse")
                .attr("x1", d.source.x1)
                .attr("x2", d.target.x0);
                
            gradient.append("stop")
                .attr("offset", "0%")
                .attr("stop-color", getNodeColor(d.source));
                
            gradient.append("stop")
                .attr("offset", "100%")
                .attr("stop-color", getNodeColor(d.target));
                
            d.gradientId = gradientId;
        });

        const linkSel = svg.append("g")
            .selectAll(".link")
            .data(graph.links)
            .join("path")
            .attr("class", d => d.target.name === "Rejected Energy" ? "link loss" : "link")
            .attr("d", d3.sankeyLinkHorizontal())
            .attr("stroke", d => d.target.name === "Rejected Energy" ? null : `url(#${d.gradientId})`)
            .attr("stroke-width", d => Math.max(1, d.width));

        const nodeSel = svg.append("g")
            .selectAll(".node")
            .data(graph.nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", function(e, d) {
                    d.__dragOffset = e.y - d.y0;
                    d3.select(this).raise();
                    svg.classed("dragging", true);
                })
                .on("drag", function(e, d) {
                    const h = d.y1 - d.y0;
                    let newY = e.y - d.__dragOffset;
                    
                    if (newY < 0) newY = 0;
                    if (newY + h > innerHeight) newY = innerHeight - h;
                    
                    d.y0 = newY;
                    d.y1 = newY + h;
                    
                    d3.select(this).select("rect").attr("y", d.y0);
                    d3.select(this).select("text").attr("y", d.y0 + h / 2);
                    
                    sankey.update(graph);
                    linkSel.attr("d", d3.sankeyLinkHorizontal());
                })
                .on("end", function() {
                    svg.classed("dragging", false);
                })
            );

        nodeSel.append("rect")
            .attr("x", d => d.x0)
            .attr("y", d => d.y0)
            .attr("height", d => Math.max(1, d.y1 - d.y0))
            .attr("width", d => d.x1 - d.x0)
            .attr("fill", d => getNodeColor(d));

        nodeSel.append("text")
            .attr("x", d => d.x0 < innerWidth / 2 ? d.x1 + 8 : d.x0 - 8)
            .attr("y", d => (d.y1 + d.y0) / 2)
            .attr("dy", "0.35em")
            .attr("text-anchor", d => d.x0 < innerWidth / 2 ? "start" : "end")
            .text(d => d.name);

        const tooltip = d3.select("#tooltip");
        const chartDiv = document.getElementById("chart");

        function highlightConnected(node) {
            const connectedLinks = new Set();
            const connectedNodes = new Set();
            
            function traverseForward(n) {
                connectedNodes.add(n.id);
                n.sourceLinks.forEach(l => {
                    connectedLinks.add(l.index);
                    traverseForward(l.target);
                });
            }
            function traverseBackward(n) {
                connectedNodes.add(n.id);
                n.targetLinks.forEach(l => {
                    connectedLinks.add(l.index);
                    traverseBackward(l.source);
                });
            }
            
            traverseForward(node);
            traverseBackward(node);
            
            svg.classed("fade", true);
            linkSel.classed("highlight", d => connectedLinks.has(d.index));
            nodeSel.classed("highlight", d => connectedNodes.has(d.id));
        }

        function clearHighlight() {
            svg.classed("fade", false);
            linkSel.classed("highlight", false);
            nodeSel.classed("highlight", false);
        }
        
        linkSel
            .on("mouseover", function(e, d) {
                if (svg.classed("dragging")) return;
                svg.classed("fade", true);
                d3.select(this).classed("highlight", true);
                nodeSel.classed("highlight", n => n.id === d.source.id || n.id === d.target.id);
                
                const pct = ((d.value / dynamicTotal) * 100).toFixed(1);
                const lossClass = d.target.name === "Rejected Energy" ? "loss-text" : "";
                
                tooltip.html(`
                    <div style="font-size: 0.9em; margin-bottom: 4px; color: #ccc;">${d.source.name} → ${d.target.name}</div>
                    <div class="value ${lossClass}">${d.value} TWh</div>
                    <div class="percentage">${pct}% of total system flow</div>
                `)
                .style("opacity", 1);
            })
            .on("mousemove", function(e) {
                if (svg.classed("dragging")) return;
                const rect = chartDiv.getBoundingClientRect();
                tooltip.style("left", (e.clientX - rect.left + 15) + "px")
                       .style("top", (e.clientY - rect.top - 15) + "px");
            })
            .on("mouseout", function() {
                if (svg.classed("dragging")) return;
                clearHighlight();
                tooltip.style("opacity", 0);
            });

        nodeSel
            .on("mouseover", function(e, d) {
                if (svg.classed("dragging")) return;
                highlightConnected(d);
                
                const pct = ((d.value / dynamicTotal) * 100).toFixed(1);
                const lossClass = d.name === "Rejected Energy" ? "loss-text" : "";
                
                tooltip.html(`
                    <div style="margin-bottom: 4px; color: #ccc;"><strong>${d.name}</strong></div>
                    <div class="value ${lossClass}">${d.value} TWh</div>
                    <div class="percentage">${pct}% of total system flow</div>
                `)
                .style("opacity", 1);
            })
            .on("mousemove", function(e) {
                if (svg.classed("dragging")) return;
                const rect = chartDiv.getBoundingClientRect();
                tooltip.style("left", (e.clientX - rect.left + 15) + "px")
                       .style("top", (e.clientY - rect.top - 15) + "px");
            })
            .on("mouseout", function() {
                if (svg.classed("dragging")) return;
                clearHighlight();
                tooltip.style("opacity", 0);
            });

    </script>
</body>
</html>
