<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Growth Sparklines</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg-color: #f9fafb;
    --card-bg: #ffffff;
    --text-main: #111827;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --hover-bg: #f3f4f6;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    margin: 0;
    padding: 2rem;
    display: flex;
    justify-content: center;
  }
  .container {
    max-width: 900px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 8px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    overflow: hidden;
  }
  .header {
    padding: 1.5rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 1.5rem;
    font-weight: 600;
  }
  p.subtitle {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }
  th {
    background-color: #f8fafc;
    padding: 0.75rem 1.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    user-select: none;
    border-bottom: 1px solid var(--border);
  }
  th[style*="cursor: pointer"]:hover {
    background-color: var(--hover-bg);
  }
  th.sort-asc::after {
    content: " \2191";
  }
  th.sort-desc::after {
    content: " \2193";
  }
  td {
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    vertical-align: middle;
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  tbody tr:hover {
    background-color: var(--hover-bg);
  }
  .category-badge {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    border-radius: 9999px;
    background-color: #e0f2fe;
    color: #0369a1;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .delta-pos { color: #16a34a; font-weight: 500; }
  .delta-neg { color: #dc2626; font-weight: 500; }
  .delta-neu { color: #6b7280; font-weight: 500; }
  .sparkline-cell { padding-top: 0; padding-bottom: 0; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Engineering Skill Growth</h1>
    <p class="subtitle">12-month trailing proficiency index with inline sparklines</p>
  </div>
  <table id="skills-table"></table>
</div>

<script>
  const skills = [
    { name: "D3.js", category: "Data Viz", values: [20, 25, 30, 45, 55, 60, 75, 80, 85, 88, 92, 95] },
    { name: "React", category: "Frontend", values: [80, 82, 85, 85, 86, 88, 89, 90, 92, 92, 94, 95] },
    { name: "Python", category: "Backend", values: [60, 65, 65, 70, 75, 75, 80, 80, 85, 88, 90, 92] },
    { name: "Rust", category: "Systems", values: [5, 10, 15, 25, 30, 40, 45, 55, 65, 70, 80, 85] },
    { name: "CSS/Layout", category: "Frontend", values: [70, 70, 72, 75, 75, 80, 80, 82, 85, 85, 85, 88] },
    { name: "SQL", category: "Database", values: [40, 45, 50, 50, 60, 65, 70, 75, 75, 80, 85, 90] },
    { name: "WebGL", category: "Graphics", values: [0, 5, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50] },
    { name: "TypeScript", category: "Language", values: [50, 60, 70, 75, 80, 85, 88, 90, 92, 95, 95, 98] },
    { name: "Go", category: "Backend", values: [10, 15, 20, 25, 35, 45, 50, 60, 65, 70, 75, 80] },
    { name: "WebAssembly", category: "Systems", values: [0, 0, 5, 10, 10, 15, 20, 25, 25, 30, 35, 40] }
  ];

  const columns = [
    { key: "name", label: "Skill", type: "text" },
    { key: "category", label: "Category", type: "badge" },
    { key: "trend", label: "12-Month Trend", type: "sparkline" },
    { key: "current", label: "Level", type: "number" },
    { key: "growth", label: "Growth", type: "delta" }
  ];

  let sortCol = "Growth";
  let sortAsc = false;

  const tableData = skills.map(s => {
    const current = s.values.at(-1);
    const first = s.values[0];
    const growth = current - first;
    return { ...s, current, growth };
  });

  const table = d3.select("#skills-table");
  const thead = table.append("thead");
  const tbody = table.append("tbody");

  thead.append("tr")
    .selectAll("th")
    .data(columns)
    .join("th")
    .text(d => d.label)
    .style("cursor", d => d.type === "sparkline" ? "default" : "pointer")
    .on("click", (event, d) => {
      if (d.type === "sparkline") return;
      if (sortCol === d.label) {
        sortAsc = !sortAsc;
      } else {
        sortCol = d.label;
        sortAsc = d.label === "Skill" || d.label === "Category"; // String columns default to ascending
      }
      renderTable();
    });

  function drawSparkline(container, data) {
    const width = 120, height = 32;
    const margin = { top: 6, right: 6, bottom: 6, left: 2 };
    
    // Shared y-domain makes heights directly comparable across rows
    const x = d3.scaleLinear([0, data.length - 1], [margin.left, width - margin.right]);
    const y = d3.scaleLinear([0, 100], [height - margin.bottom, margin.top]);
    
    const line = d3.line()
      .x((d, i) => x(i))
      .y(d => y(d))
      .curve(d3.curveMonotoneX);

    const area = d3.area()
      .x((d, i) => x(i))
      .y0(height - margin.bottom)
      .y1(d => y(d))
      .curve(d3.curveMonotoneX);

    const svg = d3.select(container).append("svg")
      .attr("width", width)
      .attr("height", height)
      .style("display", "block") 
      .attr("role", "img")
      .attr("aria-label", "Sparkline showing growth trend");

    svg.append("path")
      .datum(data)
      .attr("d", area)
      .attr("fill", "#60a5fa")
      .attr("opacity", 0.2);

    svg.append("path")
      .datum(data)
      .attr("d", line)
      .attr("fill", "none")
      .attr("stroke", "#3b82f6")
      .attr("stroke-width", 1.5);

    svg.append("circle")
      .attr("cx", x(data.length - 1))
      .attr("cy", y(data.at(-1)))
      .attr("r", 2.5)
      .attr("fill", "#2563eb");
  }

  const categoryColors = {
    "Data Viz": { bg: "#fce7f3", text: "#be185d" },
    "Frontend": { bg: "#e0f2fe", text: "#0369a1" },
    "Backend": { bg: "#dcfce7", text: "#15803d" },
    "Systems": { bg: "#fef3c7", text: "#b45309" },
    "Database": { bg: "#f3e8ff", text: "#7e22ce" },
    "Graphics": { bg: "#ffedd5", text: "#c2410c" },
    "Language": { bg: "#e2e8f0", text: "#334155" }
  };

  function renderTable() {
    const sortedData = [...tableData].sort((a, b) => {
      let valA, valB;
      if (sortCol === "Skill") { valA = a.name; valB = b.name; }
      else if (sortCol === "Category") { valA = a.category; valB = b.category; }
      else if (sortCol === "Level") { valA = a.current; valB = b.current; }
      else if (sortCol === "Growth") { valA = a.growth; valB = b.growth; }
      else return 0;
      
      if (valA < valB) return sortAsc ? -1 : 1;
      if (valA > valB) return sortAsc ? 1 : -1;
      return 0;
    });

    const rows = tbody.selectAll("tr")
      .data(sortedData, d => d.name)
      .join("tr");

    rows.selectAll("td")
      .data(d => columns.map(col => ({ col, row: d })))
      .join("td")
      .attr("class", d => d.col.type === "sparkline" ? "sparkline-cell" : null)
      .each(function({ col, row }) {
        const cell = d3.select(this);
        cell.selectAll("*").remove();
        cell.text("");
        
        if (col.type === "sparkline") {
          drawSparkline(this, row.values);
        } else if (col.type === "badge") {
          const colors = categoryColors[row.category] || { bg: "#f3f4f6", text: "#374151" };
          cell.append("span")
            .attr("class", "category-badge")
            .style("background-color", colors.bg)
            .style("color", colors.text)
            .text(row.category);
        } else if (col.type === "delta") {
          const isPos = row.growth > 0;
          const isNeg = row.growth < 0;
          cell.attr("class", isPos ? "delta-pos" : (isNeg ? "delta-neg" : "delta-neu"))
              .text(`${isPos ? "+" : ""}${row.growth}`);
        } else if (col.type === "number") {
          cell.style("font-variant-numeric", "tabular-nums")
              .style("font-weight", "500")
              .text(row.current);
        } else {
          cell.style("font-weight", "500")
              .text(row[col.key]);
        }
      });

    thead.selectAll("th").each(function(d) {
      if (d.label === sortCol) {
        d3.select(this).attr("class", sortAsc ? "sort-asc" : "sort-desc");
      } else {
        d3.select(this).attr("class", "");
      }
    });
  }

  renderTable();
</script>
</body>
</html>
