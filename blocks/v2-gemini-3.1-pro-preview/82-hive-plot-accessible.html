<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accessible Hive Plot</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f4f4f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    color: #333;
    margin-bottom: 5px;
  }
  p.instructions {
    text-align: center;
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 20px;
  }
  canvas {
    display: block;
    outline: none;
    cursor: pointer;
  }
  canvas:focus {
    box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    border-radius: 8px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }
</style>
</head>
<body>

<div class="container">
  <h1>System Flow Hierarchy</h1>
  <p class="instructions">Click to focus. Use arrow keys to navigate nodes.</p>
  <div id="live-region" class="sr-only" aria-live="polite"></div>
  <canvas id="viz" width="700" height="700" tabindex="0" role="application" aria-label="Accessible Hive Plot Visualization of 80 nodes and 120 edges. Use arrow keys to navigate along and between the 3 axes."></canvas>
</div>

<script>
const NUM_NODES = 80;
const NUM_EDGES = 120;

let seed = 42;
function random() {
  const x = Math.sin(seed++) * 10000;
  return x - Math.floor(x);
}

const nodes = Array.from({length: NUM_NODES}, (_, i) => {
  const axis = i < 25 ? 0 : i < 55 ? 1 : 2;
  const type = axis === 0 ? 'Source' : axis === 1 ? 'Connector' : 'Sink';
  return {
    id: i,
    axis,
    type,
    value: random(),
    name: `${type} Node ${i + 1}`
  };
});

const nodesByAxis = [
  nodes.filter(n => n.axis === 0).sort((a,b) => a.value - b.value),
  nodes.filter(n => n.axis === 1).sort((a,b) => a.value - b.value),
  nodes.filter(n => n.axis === 2).sort((a,b) => a.value - b.value)
];

nodesByAxis.forEach(axisNodes => {
  axisNodes.forEach((n, i) => n.axisIndex = i);
});

const links = [];
for(let i=0; i<60; i++) {
  links.push({
    source: nodesByAxis[0][Math.floor(random() * nodesByAxis[0].length)],
    target: nodesByAxis[1][Math.floor(random() * nodesByAxis[1].length)]
  });
}
for(let i=0; i<60; i++) {
  links.push({
    source: nodesByAxis[1][Math.floor(random() * nodesByAxis[1].length)],
    target: nodesByAxis[2][Math.floor(random() * nodesByAxis[2].length)]
  });
}

const angleScale = d3.scaleOrdinal()
  .domain([0, 1, 2])
  .range([(150 * Math.PI) / 180, (30 * Math.PI) / 180, (270 * Math.PI) / 180]);

const radiusScale = d3.scaleLinear()
  .domain([0, 1])
  .range([40, 280]);

nodes.forEach(n => {
  const angle = angleScale(n.axis);
  const r = radiusScale(n.value);
  n.x = Math.cos(angle) * r;
  n.y = Math.sin(angle) * r;
});

const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const width = canvas.width;
const height = canvas.height;
const centerX = width / 2;
const centerY = height / 2;
const liveRegion = document.getElementById('live-region');

let focusedNode = null;
let canvasHasFocus = false;
let isAnimating = false;

function announce(text) {
  liveRegion.textContent = text;
}

function render() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(centerX, centerY);

  ctx.lineWidth = 2;
  ctx.strokeStyle = '#dcdcdc';
  [0, 1, 2].forEach(axis => {
    const angle = angleScale(axis);
    const r1 = radiusScale(0) - 10;
    const r2 = radiusScale(1) + 10;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * r1, Math.sin(angle) * r1);
    ctx.lineTo(Math.cos(angle) * r2, Math.sin(angle) * r2);
    ctx.stroke();
    
    const labelR = r2 + 25;
    const label = axis === 0 ? 'Source' : axis === 1 ? 'Connector' : 'Sink';
    ctx.font = '600 14px sans-serif';
    ctx.fillStyle = '#555';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, Math.cos(angle) * labelR, Math.sin(angle) * labelR);
  });

  if (focusedNode) {
    ctx.strokeStyle = 'rgba(150, 160, 170, 0.15)';
  } else {
    ctx.strokeStyle = 'rgba(150, 160, 170, 0.4)';
  }
  ctx.lineWidth = 1.5;
  
  links.forEach(link => {
    let isConnected = false;
    if (focusedNode) {
      if (link.source === focusedNode || link.target === focusedNode) {
        isConnected = true;
      }
    }
    
    ctx.beginPath();
    ctx.moveTo(link.source.x, link.source.y);
    ctx.quadraticCurveTo(0, 0, link.target.x, link.target.y);
    
    if (focusedNode && isConnected) {
      ctx.save();
      ctx.strokeStyle = 'rgba(230, 57, 70, 0.85)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.stroke();
    }
  });

  nodes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 6.5, 0, Math.PI * 2);
    if (n.axis === 0) ctx.fillStyle = '#457b9d';
    else if (n.axis === 1) ctx.fillStyle = '#e9c46a';
    else ctx.fillStyle = '#2a9d8f';
    
    if (focusedNode && focusedNode !== n) {
      const connected = links.some(l => 
        (l.source === focusedNode && l.target === n) || 
        (l.target === focusedNode && l.source === n)
      );
      if (!connected) {
        ctx.globalAlpha = 0.2;
      }
    }
    
    ctx.fill();
    ctx.globalAlpha = 1.0;
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  if (focusedNode && canvasHasFocus) {
    ctx.save();
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 3;
    ctx.setLineDash([4, 4]);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      ctx.lineDashOffset = -performance.now() / 40;
    }
    ctx.shadowColor = 'rgba(255, 255, 255, 1)';
    ctx.shadowBlur = 4;
    
    ctx.beginPath();
    ctx.arc(focusedNode.x, focusedNode.y, 11, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
  
  if (canvasHasFocus && focusedNode) {
    isAnimating = true;
    requestAnimationFrame(render);
  } else {
    isAnimating = false;
  }
}

canvas.addEventListener('focus', () => {
  canvasHasFocus = true;
  if (!focusedNode) {
    focusedNode = nodesByAxis[0][0];
    debouncedAnnounce(focusedNode);
  }
  if (!isAnimating) render();
});

canvas.addEventListener('blur', () => {
  canvasHasFocus = false;
  render();
});

function announceNode(node) {
  const connectedLinks = links.filter(l => l.source === node || l.target === node);
  announce(`${node.name}, value ${node.value.toFixed(2)}, connected to ${connectedLinks.length} nodes.`);
}

let announceTimer;
function debouncedAnnounce(node) {
  clearTimeout(announceTimer);
  announceTimer = setTimeout(() => announceNode(node), 150);
}

canvas.addEventListener('keydown', (e) => {
  if (!focusedNode) return;

  const currentAxis = focusedNode.axis;
  const currentIndex = focusedNode.axisIndex;
  let nextNode = null;

  switch (e.key) {
    case 'ArrowUp':
      if (currentIndex < nodesByAxis[currentAxis].length - 1) {
        nextNode = nodesByAxis[currentAxis][currentIndex + 1];
      } else {
        announce("End of axis");
      }
      break;
    case 'ArrowDown':
      if (currentIndex > 0) {
        nextNode = nodesByAxis[currentAxis][currentIndex - 1];
      } else {
        announce("Start of axis");
      }
      break;
    case 'ArrowRight':
      {
        const nextAxis = (currentAxis + 1) % 3;
        const prop = currentIndex / (nodesByAxis[currentAxis].length - 1 || 1);
        let targetIndex = Math.round(prop * (nodesByAxis[nextAxis].length - 1));
        nextNode = nodesByAxis[nextAxis][targetIndex];
      }
      break;
    case 'ArrowLeft':
      {
        const prevAxis = (currentAxis + 2) % 3;
        const prop = currentIndex / (nodesByAxis[currentAxis].length - 1 || 1);
        let targetIndex = Math.round(prop * (nodesByAxis[prevAxis].length - 1));
        nextNode = nodesByAxis[prevAxis][targetIndex];
      }
      break;
    case 'Home':
      nextNode = nodesByAxis[currentAxis][0];
      break;
    case 'End':
      nextNode = nodesByAxis[currentAxis][nodesByAxis[currentAxis].length - 1];
      break;
    case 'Escape':
      focusedNode = null;
      canvas.blur();
      announce("Visualization unfocused.");
      break;
    case 'Enter':
    case ' ':
      announce(`${focusedNode.name} selected.`);
      break;
    default:
      return;
  }

  if (nextNode) {
    focusedNode = nextNode;
    debouncedAnnounce(focusedNode);
  }
  
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', ' ', 'Enter'].includes(e.key)) {
    e.preventDefault();
  }
  
  if (!isAnimating) render();
});

canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left - centerX;
  const y = e.clientY - rect.top - centerY;
  
  let best = null;
  let bestDist = 15;
  
  nodes.forEach(n => {
    const dist = Math.hypot(n.x - x, n.y - y);
    if (dist < bestDist) {
      bestDist = dist;
      best = n;
    }
  });
  
  if (best) {
    focusedNode = best;
    debouncedAnnounce(focusedNode);
  } else {
    focusedNode = null;
    announce("Selection cleared.");
  }
  
  if (!isAnimating) render();
});

render();
</script>
</body>
</html>
