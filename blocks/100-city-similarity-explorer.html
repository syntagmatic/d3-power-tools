<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Similarity Explorer</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --text-muted: #666;
    --font: system-ui, -apple-system, sans-serif;
    --grid: #e0e0e0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 2px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
  #container { width: 100%; max-width: 960px; }
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin: 0 0 8px 0; font-size: 11px; color: var(--text-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 50%; }
  canvas { display: block; }
  .axis text { font-size: 10px; fill: var(--text-muted); }
  .axis path, .axis line { stroke: var(--grid); }
  .axis-label { font-size: 11px; fill: var(--text); font-weight: 600; }
  .brush .selection { fill: rgba(68,119,170,0.15); stroke: #4477AA; stroke-width: 1; }
  .map-border { stroke: #ccc; fill: none; }
  .city-dot { cursor: pointer; }
  .tip {
    position: absolute; background: #333; color: #fff; padding: 6px 10px;
    border-radius: 4px; font-size: 11px; pointer-events: none;
    opacity: 0; transition: opacity 0.15s; line-height: 1.5;
  }
</style>
</head>
<body>
<h1>City Similarity Explorer</h1>
<p class="subtitle">Brush parallel coordinate axes to find twin cities &mdash; hover map for details</p>
<div id="container"></div>
<div class="tip" id="tip"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import {feature} from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

// Tol muted palette by continent
const continentColors = {
  "Asia":"#CC6677","Europe":"#4477AA","N. America":"#44AA99",
  "S. America":"#DDCC77","Africa":"#AA4499","Oceania":"#88CCEE"
};

const cities = [
  {name:"Tokyo",continent:"Asia",pop:37400,density:6158,elev:40,temp:15.4,rain:1530,cost:83,lat:35.68,lon:139.69},
  {name:"Delhi",continent:"Asia",pop:32000,density:11312,elev:216,temp:25.0,rain:797,cost:33,lat:28.61,lon:77.21},
  {name:"Shanghai",continent:"Asia",pop:28500,density:3800,elev:4,temp:16.1,rain:1166,cost:52,lat:31.23,lon:121.47},
  {name:"S\u00e3o Paulo",continent:"S. America",pop:22400,density:7398,elev:760,temp:19.2,rain:1454,cost:42,lat:-23.55,lon:-46.63},
  {name:"Mexico City",continent:"N. America",pop:21800,density:6000,elev:2240,temp:15.9,rain:846,cost:40,lat:19.43,lon:-99.13},
  {name:"Cairo",continent:"Africa",pop:21300,density:19376,elev:75,temp:21.7,rain:25,cost:34,lat:30.04,lon:31.24},
  {name:"Mumbai",continent:"Asia",pop:20700,density:20634,elev:14,temp:27.2,rain:2422,cost:35,lat:19.08,lon:72.88},
  {name:"Beijing",continent:"Asia",pop:20400,density:1312,elev:43,temp:12.9,rain:571,cost:51,lat:39.91,lon:116.39},
  {name:"Dhaka",continent:"Asia",pop:17900,density:23234,elev:8,temp:25.8,rain:2123,cost:30,lat:23.81,lon:90.41},
  {name:"Osaka",continent:"Asia",pop:19100,density:12000,elev:12,temp:16.9,rain:1306,cost:76,lat:34.69,lon:135.50},
  {name:"New York",continent:"N. America",pop:18800,density:10194,elev:10,temp:12.3,rain:1268,cost:100,lat:40.71,lon:-74.01},
  {name:"Karachi",continent:"Asia",pop:16800,density:24000,elev:8,temp:26.0,rain:234,cost:31,lat:24.86,lon:67.01},
  {name:"Istanbul",continent:"Europe",pop:15500,density:2965,elev:40,temp:14.7,rain:688,cost:42,lat:41.01,lon:28.98},
  {name:"Lagos",continent:"Africa",pop:15300,density:6871,elev:41,temp:27.0,rain:1425,cost:45,lat:6.45,lon:3.40},
  {name:"Buenos Aires",continent:"S. America",pop:15200,density:14450,elev:25,temp:17.9,rain:1147,cost:38,lat:-34.60,lon:-58.38},
  {name:"Moscow",continent:"Europe",pop:12600,density:4880,elev:156,temp:5.8,rain:707,cost:55,lat:55.76,lon:37.62},
  {name:"London",continent:"Europe",pop:9500,density:5598,elev:11,temp:11.3,rain:602,cost:90,lat:51.51,lon:-0.13},
  {name:"Paris",continent:"Europe",pop:11000,density:20546,elev:35,temp:12.3,rain:641,cost:88,lat:48.86,lon:2.35},
  {name:"Bangkok",continent:"Asia",pop:10700,density:3600,elev:2,temp:28.6,rain:1648,cost:44,lat:13.76,lon:100.50},
  {name:"Seoul",continent:"Asia",pop:9800,density:15960,elev:38,temp:12.5,rain:1394,cost:72,lat:37.57,lon:126.98},
  {name:"Lima",continent:"S. America",pop:10700,density:3470,elev:161,temp:19.2,rain:16,cost:38,lat:-12.05,lon:-77.04},
  {name:"Nairobi",continent:"Africa",pop:4700,density:4515,elev:1795,temp:17.8,rain:869,cost:40,lat:-1.29,lon:36.82},
  {name:"Berlin",continent:"Europe",pop:3600,density:4090,elev:34,temp:10.3,rain:570,cost:65,lat:52.52,lon:13.41},
  {name:"Sydney",continent:"Oceania",pop:5300,density:2037,elev:3,temp:18.4,rain:1213,cost:82,lat:-33.87,lon:151.21},
  {name:"Toronto",continent:"N. America",pop:6200,density:4334,elev:76,temp:9.4,rain:831,cost:72,lat:43.65,lon:-79.38},
  {name:"Singapore",continent:"Asia",pop:5900,density:7804,elev:15,temp:27.0,rain:2340,cost:85,lat:1.35,lon:103.82},
  {name:"Bogot\u00e1",continent:"S. America",pop:7700,density:6800,elev:2640,temp:13.5,rain:1015,cost:35,lat:4.71,lon:-74.07},
  {name:"Addis Ababa",continent:"Africa",pop:3600,density:5165,elev:2355,temp:16.0,rain:1089,cost:36,lat:9.02,lon:38.75},
  {name:"Madrid",continent:"Europe",pop:3200,density:5294,elev:667,temp:14.5,rain:436,cost:62,lat:40.42,lon:-3.70},
  {name:"Melbourne",continent:"Oceania",pop:5100,density:1530,elev:31,temp:15.5,rain:648,cost:78,lat:-37.81,lon:144.96},
  {name:"Johannesburg",continent:"Africa",pop:5900,density:2700,elev:1753,temp:16.0,rain:713,cost:42,lat:-26.20,lon:28.05},
  {name:"Santiago",continent:"S. America",pop:6800,density:8500,elev:520,temp:14.4,rain:312,cost:44,lat:-33.45,lon:-70.67},
  {name:"Los Angeles",continent:"N. America",pop:12500,density:3276,elev:71,temp:18.3,rain:381,cost:88,lat:34.05,lon:-118.24},
  {name:"Chicago",continent:"N. America",pop:8600,density:4600,elev:176,temp:10.0,rain:940,cost:75,lat:41.88,lon:-87.63},
  {name:"Miami",continent:"N. America",pop:6200,density:4500,elev:2,temp:24.8,rain:1572,cost:80,lat:25.76,lon:-80.19},
  {name:"Zurich",continent:"Europe",pop:420,density:4700,elev:408,temp:9.3,rain:1134,cost:120,lat:47.38,lon:8.54},
  {name:"La Paz",continent:"S. America",pop:1800,density:5100,elev:3640,temp:8.0,rain:575,cost:32,lat:-16.50,lon:-68.15},
  {name:"Riyadh",continent:"Asia",pop:7600,density:3700,elev:612,temp:26.0,rain:100,cost:50,lat:24.71,lon:46.68},
  {name:"Auckland",continent:"Oceania",pop:1600,density:1200,elev:48,temp:15.2,rain:1240,cost:74,lat:-36.85,lon:174.76},
  {name:"Cape Town",continent:"Africa",pop:4600,density:1530,elev:0,temp:16.7,rain:515,cost:40,lat:-33.93,lon:18.42},
];

const dims = [
  {key:"pop",label:"Population (K)",fmt:d=>d>=1000?`${(d/1000).toFixed(0)}M`:`${d}K`},
  {key:"density",label:"Density (/km\u00b2)",fmt:d3.format(",")},
  {key:"elev",label:"Elevation (m)",fmt:d3.format(",")},
  {key:"temp",label:"Avg Temp (\u00b0C)",fmt:d=>d+"\u00b0"},
  {key:"rain",label:"Rainfall (mm)",fmt:d3.format(",")},
  {key:"cost",label:"Cost Index",fmt:d3.format(",")}
];

const pcW = 920, pcH = 300;
const mapW = 920, mapH = 220;
const margin = {top:30, right:20, bottom:8, left:20};

const container = d3.select("#container");

// Legend
const legend = container.append("div").attr("class","legend");
for (const [cont, col] of Object.entries(continentColors)) {
  const item = legend.append("div").attr("class","legend-item");
  item.append("div").attr("class","legend-swatch").style("background",col);
  item.append("span").text(cont);
}

// --- Parallel Coordinates ---
const pcSvg = container.append("svg")
  .attr("viewBox",`0 0 ${pcW} ${pcH}`).attr("width","100%")
  .style("overflow","visible");
pcSvg.append("title").text("Parallel coordinates — 40 world cities on 6 axes");

const pcG = pcSvg.append("g").attr("transform",`translate(0,${margin.top})`);
const innerH = pcH - margin.top - margin.bottom;

const xPC = d3.scalePoint().domain(dims.map(d=>d.key)).range([margin.left+30, pcW-margin.right-10]).padding(0.1);
const yScales = {};
for (const dim of dims) {
  const ext = d3.extent(cities, d => d[dim.key]);
  yScales[dim.key] = d3.scaleLinear().domain(ext).range([innerH, 0]).nice();
}

// Canvas for lines
const canvasEl = document.createElement("canvas");
canvasEl.width = pcW * 2; canvasEl.height = (pcH) * 2;
canvasEl.style.width = pcW + "px";
canvasEl.style.height = pcH + "px";
canvasEl.style.position = "absolute";
canvasEl.style.top = "0";
canvasEl.style.left = "0";
canvasEl.style.pointerEvents = "none";

const pcWrap = container.select("svg:last-of-type").node().parentNode;
const pcContainer = document.createElement("div");
pcContainer.style.position = "relative";
pcContainer.style.width = pcW + "px";
pcContainer.style.maxWidth = "100%";
// Insert canvas behind svg
pcSvg.node().parentNode.insertBefore(pcContainer, pcSvg.node());
pcContainer.appendChild(canvasEl);
pcContainer.appendChild(pcSvg.node());
pcSvg.style("position","relative").style("z-index","1").style("background","transparent");

const ctx = canvasEl.getContext("2d");
ctx.scale(2, 2);

// Axes
for (const dim of dims) {
  const axG = pcG.append("g").attr("transform",`translate(${xPC(dim.key)},0)`);
  axG.append("g").attr("class","axis")
    .call(d3.axisLeft(yScales[dim.key]).ticks(5).tickFormat(dim.fmt).tickSize(4))
    .call(g => g.select(".domain").attr("stroke","#aaa"));
  axG.append("text").attr("class","axis-label")
    .attr("y",-12).attr("text-anchor","middle").text(dim.label);
}

// Brushes
const brushes = {};
const brushSelections = {};

for (const dim of dims) {
  const brush = d3.brushY()
    .extent([[-12, 0],[12, innerH]])
    .on("brush end", (event) => {
      if (event.selection) {
        const [y0, y1] = event.selection;
        brushSelections[dim.key] = [yScales[dim.key].invert(y1), yScales[dim.key].invert(y0)];
      } else {
        delete brushSelections[dim.key];
      }
      updateSelection();
    });
  brushes[dim.key] = brush;
  pcG.append("g")
    .attr("class","brush")
    .attr("transform",`translate(${xPC(dim.key)},0)`)
    .call(brush);
}

let selected = new Set(cities.map(c => c.name));
let hoveredCity = null;

function isSelected(city) {
  for (const key of Object.keys(brushSelections)) {
    const [lo, hi] = brushSelections[key];
    if (city[key] < lo || city[key] > hi) return false;
  }
  return true;
}

function drawPC() {
  ctx.clearRect(0, 0, pcW, pcH);
  const dimKeys = dims.map(d => d.key);

  // Background lines
  for (const city of cities) {
    const sel = selected.has(city.name);
    const hov = hoveredCity === city.name;
    if (hov) continue; // draw last
    ctx.beginPath();
    ctx.globalAlpha = sel ? 0.6 : 0.06;
    ctx.strokeStyle = sel ? continentColors[city.continent] : "#aaa";
    ctx.lineWidth = sel ? 1.8 : 0.8;
    for (let i = 0; i < dimKeys.length; i++) {
      const px = xPC(dimKeys[i]);
      const py = yScales[dimKeys[i]](city[dimKeys[i]]) + margin.top;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  // Hovered city on top
  if (hoveredCity) {
    const city = cities.find(c => c.name === hoveredCity);
    if (city) {
      ctx.beginPath();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = continentColors[city.continent];
      ctx.lineWidth = 3;
      for (let i = 0; i < dimKeys.length; i++) {
        const px = xPC(dimKeys[i]);
        const py = yScales[dimKeys[i]](city[dimKeys[i]]) + margin.top;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }
}

// --- Map ---
const mapSvg = container.append("svg")
  .attr("viewBox",`0 0 ${mapW} ${mapH}`).attr("width","100%")
  .style("margin-top","12px");
mapSvg.append("title").text("World map with city locations");

const projection = d3.geoNaturalEarth1().fitSize([mapW - 20, mapH - 20], {type:"Sphere"})
  .translate([mapW/2, mapH/2]);
const path = d3.geoPath(projection);

const mapG = mapSvg.append("g");
const landG = mapG.append("g");
const cityG = mapG.append("g");

// Load world outline
const worldUrl = "https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json";
const world = await d3.json(worldUrl);
const land = feature(world, world.objects.land);

landG.append("path").datum({type:"Sphere"})
  .attr("d",path).attr("fill","none").attr("stroke","#ccc");
landG.append("path").datum(land)
  .attr("d",path).attr("fill","#eee").attr("stroke","#ccc").attr("stroke-width",0.5);

// City dots
const cityDots = cityG.selectAll(".city-dot").data(cities).join("circle")
  .attr("class","city-dot")
  .attr("cx", d => projection([d.lon, d.lat])[0])
  .attr("cy", d => projection([d.lon, d.lat])[1])
  .attr("r", 4)
  .attr("fill", d => continentColors[d.continent])
  .attr("stroke","#fff").attr("stroke-width",1.2)
  .attr("opacity",0.85);

const cityLabels = cityG.selectAll(".city-label").data(cities).join("text")
  .attr("x", d => projection([d.lon, d.lat])[0])
  .attr("y", d => projection([d.lon, d.lat])[1] - 7)
  .attr("text-anchor","middle")
  .attr("font-size","8px").attr("fill","var(--text-muted)")
  .attr("opacity",0)
  .text(d => d.name);

// Tooltip
const tip = d3.select("#tip");

cityDots
  .on("pointerenter", (event, d) => {
    hoveredCity = d.name;
    drawPC();
    updateMapDots();
    tip.style("opacity",1)
      .html(`<strong>${d.name}</strong><br>Pop: ${d.pop >= 1000 ? (d.pop/1000).toFixed(1)+"M" : d.pop+"K"}<br>Temp: ${d.temp}\u00b0C | Rain: ${d.rain}mm<br>Cost: ${d.cost}`);
  })
  .on("pointermove", (event) => {
    tip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 10) + "px");
  })
  .on("pointerleave", () => {
    hoveredCity = null;
    drawPC();
    updateMapDots();
    tip.style("opacity",0);
  });

function updateMapDots() {
  cityDots.transition().duration(200)
    .attr("r", d => {
      if (hoveredCity === d.name) return 8;
      return selected.has(d.name) ? 5 : 2.5;
    })
    .attr("opacity", d => {
      if (hoveredCity === d.name) return 1;
      return selected.has(d.name) ? 0.9 : 0.15;
    })
    .attr("stroke-width", d => hoveredCity === d.name ? 2 : 1.2);

  cityLabels.transition().duration(200)
    .attr("opacity", d => {
      if (hoveredCity === d.name) return 1;
      return selected.has(d.name) && Object.keys(brushSelections).length > 0 ? 0.8 : 0;
    });
}

function updateSelection() {
  selected = new Set(cities.filter(isSelected).map(c => c.name));
  drawPC();
  updateMapDots();
}

drawPC();
updateMapDots();
</script>
</body>
</html>
