<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Network Evolution — Small Multiples Force</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #333;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    color: #777;
    margin-bottom: 12px;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 16px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #f0f0f0; border-color: #aaa; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.active { background: #4477AA; color: #fff; border-color: #4477AA; }
  .legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: #555;
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-swatch {
    width: 20px;
    height: 3px;
    border-radius: 1px;
  }
  .legend-swatch.dashed {
    background: repeating-linear-gradient(90deg, #EE6677 0, #EE6677 4px, transparent 4px, transparent 8px);
  }
  #container { position: relative; }
  .panel-label {
    font-size: 13px;
    font-weight: 600;
    fill: #333;
  }
  .panel-stats {
    font-size: 11px;
    fill: #888;
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
  }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(255,255,255,0.95);
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    color: #333;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    display: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<h1>Network Evolution Over 6 Months</h1>
<p class="subtitle">Each panel is an independent force simulation. Hover nodes for details.</p>
<div class="controls">
  <button id="btn-animate">Animate Sequence</button>
  <button id="btn-reset">Reset</button>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#228833"></div> New edge</div>
    <div class="legend-item"><div class="legend-swatch dashed"></div> Removed edge</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#999"></div> Persistent edge</div>
  </div>
</div>
<div id="container">
  <div class="tooltip" id="tooltip"></div>
</div>
<script>
(() => {
  // -- Tol palette --
  const tol = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377","#BBBBBB"];
  const colorNew = "#228833";
  const colorRemoved = "#EE6677";
  const colorPersist = "#bbb";
  const colorNode = "#4477AA";
  const colorNodeHighlight = "#AA3377";

  // -- Layout --
  const cols = 3, rows = 2;
  const totalW = 1200, totalH = 720;
  const pad = { top: 8, right: 8, bottom: 8, left: 8 };
  const gapX = 16, gapY = 32;
  const cellW = (totalW - pad.left - pad.right - (cols - 1) * gapX) / cols;
  const cellH = (totalH - pad.top - pad.bottom - (rows - 1) * gapY) / rows;
  const plotMargin = { top: 28, right: 8, bottom: 8, left: 8 };
  const plotW = cellW - plotMargin.left - plotMargin.right;
  const plotH = cellH - plotMargin.top - plotMargin.bottom;

  // -- Generate synthetic network data --
  const months = ["January", "February", "March", "April", "May", "June"];
  const rng = d3.randomLcg(42);
  const rand = d3.randomUniform.source(rng)(0, 1);
  const randInt = (lo, hi) => Math.floor(rand() * (hi - lo)) + lo;

  // 20 nodes, some appearing/disappearing over time
  const allNodes = d3.range(20).map(i => ({
    id: `n${i}`,
    label: `Node ${i}`,
    group: i % 4,
    appearMonth: i < 14 ? 0 : randInt(1, 4),
    disappearMonth: i < 16 ? 6 : randInt(3, 6)
  }));

  // Build edge sets per month: start with a base, evolve
  function generateEdgeSets() {
    const sets = [];
    // Base edges (month 0)
    const baseEdges = new Set();
    for (let i = 0; i < 30; i++) {
      const a = randInt(0, 14), b = randInt(0, 14);
      if (a !== b) baseEdges.add(`${Math.min(a, b)}-${Math.max(a, b)}`);
    }
    sets.push(new Set(baseEdges));

    for (let m = 1; m < 6; m++) {
      const prev = new Set(sets[m - 1]);
      // Remove some edges
      const prevArr = [...prev];
      const removeCount = randInt(2, 5);
      for (let r = 0; r < removeCount && prevArr.length > 5; r++) {
        const idx = randInt(0, prevArr.length);
        prev.delete(prevArr[idx]);
        prevArr.splice(idx, 1);
      }
      // Add new edges
      const activeNodes = allNodes.filter(n => n.appearMonth <= m && n.disappearMonth > m).map(n => parseInt(n.id.slice(1)));
      const addCount = randInt(3, 6);
      for (let a = 0; a < addCount; a++) {
        if (activeNodes.length < 2) break;
        const i1 = activeNodes[randInt(0, activeNodes.length)];
        const i2 = activeNodes[randInt(0, activeNodes.length)];
        if (i1 !== i2) prev.add(`${Math.min(i1, i2)}-${Math.max(i1, i2)}`);
      }
      sets.push(prev);
    }
    return sets;
  }

  const edgeSets = generateEdgeSets();

  // Build per-month data with edge classification
  function buildMonthData(monthIdx) {
    const currentEdges = edgeSets[monthIdx];
    const prevEdges = monthIdx > 0 ? edgeSets[monthIdx - 1] : new Set();

    const activeNodes = allNodes.filter(n => n.appearMonth <= monthIdx && n.disappearMonth > monthIdx);
    const nodeIds = new Set(activeNodes.map(n => n.id));

    const links = [];
    // Persistent + new edges
    for (const e of currentEdges) {
      const [a, b] = e.split("-").map(Number);
      const sId = `n${a}`, tId = `n${b}`;
      if (!nodeIds.has(sId) || !nodeIds.has(tId)) continue;
      const isNew = !prevEdges.has(e);
      links.push({ source: sId, target: tId, status: isNew ? "new" : "persist" });
    }
    // Removed edges (were in prev, not in current) — show as dashed
    if (monthIdx > 0) {
      for (const e of prevEdges) {
        if (!currentEdges.has(e)) {
          const [a, b] = e.split("-").map(Number);
          const sId = `n${a}`, tId = `n${b}`;
          if (!nodeIds.has(sId) || !nodeIds.has(tId)) continue;
          links.push({ source: sId, target: tId, status: "removed" });
        }
      }
    }

    return {
      month: months[monthIdx],
      monthIdx,
      nodes: activeNodes.map(d => ({ ...d })),
      links,
      nodeCount: activeNodes.length,
      edgeCount: [...currentEdges].filter(e => {
        const [a, b] = e.split("-").map(Number);
        return nodeIds.has(`n${a}`) && nodeIds.has(`n${b}`);
      }).length,
      newCount: links.filter(l => l.status === "new").length,
      removedCount: links.filter(l => l.status === "removed").length
    };
  }

  const panelData = months.map((_, i) => buildMonthData(i));

  // -- SVG setup --
  const svg = d3.select("#container")
    .append("svg")
    .attr("width", totalW)
    .attr("height", totalH)
    .attr("viewBox", `0 0 ${totalW} ${totalH}`);

  const tooltip = d3.select("#tooltip");

  // -- Draw panels --
  const simulations = [];
  const panelGroups = [];

  panelData.forEach((pd, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = pad.left + col * (cellW + gapX);
    const cy = pad.top + row * (cellH + gapY);

    const g = svg.append("g")
      .attr("transform", `translate(${cx}, ${cy})`);

    // Panel background
    g.append("rect")
      .attr("width", cellW)
      .attr("height", cellH)
      .attr("fill", "#fff")
      .attr("stroke", "#e0e0e0")
      .attr("rx", 4);

    // Title
    g.append("text")
      .attr("class", "panel-label")
      .attr("x", plotMargin.left)
      .attr("y", 18)
      .text(pd.month);

    // Stats
    g.append("text")
      .attr("class", "panel-stats")
      .attr("x", cellW - plotMargin.right)
      .attr("y", 18)
      .attr("text-anchor", "end")
      .text(`${pd.nodeCount}n ${pd.edgeCount}e`);

    const plotG = g.append("g")
      .attr("transform", `translate(${plotMargin.left}, ${plotMargin.top})`);

    // Clip
    const clipId = `clip-${i}`;
    plotG.append("clipPath").attr("id", clipId)
      .append("rect").attr("width", plotW).attr("height", plotH);

    const content = plotG.append("g").attr("clip-path", `url(#${clipId})`);

    // Links
    const linkG = content.append("g");
    const linkSel = linkG.selectAll("line")
      .data(pd.links)
      .join("line")
        .attr("stroke", d => d.status === "new" ? colorNew : d.status === "removed" ? colorRemoved : colorPersist)
        .attr("stroke-width", d => d.status === "removed" ? 1.2 : 1.5)
        .attr("stroke-dasharray", d => d.status === "removed" ? "4,3" : null)
        .attr("stroke-opacity", d => d.status === "removed" ? 0.6 : 0.7);

    // Nodes
    const nodeG = content.append("g");
    const nodeSel = nodeG.selectAll("circle")
      .data(pd.nodes, d => d.id)
      .join("circle")
        .attr("r", 6)
        .attr("fill", colorNode)
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.5)
        .attr("cursor", "pointer")
        .on("pointerenter", (event, d) => {
          d3.select(event.currentTarget).attr("fill", colorNodeHighlight).attr("r", 8);
          const connections = pd.links.filter(l =>
            (typeof l.source === "object" ? l.source.id : l.source) === d.id ||
            (typeof l.target === "object" ? l.target.id : l.target) === d.id
          );
          tooltip.style("display", "block")
            .html(`<strong>${d.label}</strong><br>Group ${d.group} &middot; ${connections.length} connections`);
        })
        .on("pointermove", (event) => {
          const rect = document.getElementById("container").getBoundingClientRect();
          tooltip
            .style("left", (event.clientX - rect.left + 12) + "px")
            .style("top", (event.clientY - rect.top - 10) + "px");
        })
        .on("pointerleave", (event) => {
          d3.select(event.currentTarget).attr("fill", colorNode).attr("r", 6);
          tooltip.style("display", "none");
        });

    // Force simulation
    const sim = d3.forceSimulation(pd.nodes)
      .force("link", d3.forceLink(pd.links).id(d => d.id).distance(40).strength(0.4))
      .force("charge", d3.forceManyBody().strength(-120).distanceMax(plotW * 0.6))
      .force("center", d3.forceCenter(plotW / 2, plotH / 2))
      .force("collide", d3.forceCollide(8))
      .force("x", d3.forceX(plotW / 2).strength(0.06))
      .force("y", d3.forceY(plotH / 2).strength(0.06))
      .alphaDecay(0.03)
      .on("tick", () => {
        // Clamp to plot area
        pd.nodes.forEach(d => {
          d.x = Math.max(8, Math.min(plotW - 8, d.x));
          d.y = Math.max(8, Math.min(plotH - 8, d.y));
        });
        linkSel
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);
        nodeSel
          .attr("cx", d => d.x)
          .attr("cy", d => d.y);
      });

    // Drag
    nodeSel.call(d3.drag()
      .on("start", (event, d) => {
        if (!event.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on("drag", (event, d) => {
        d.fx = event.x; d.fy = event.y;
      })
      .on("end", (event, d) => {
        if (!event.active) sim.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
    );

    simulations.push(sim);
    panelGroups.push({ g, plotG, content, linkSel, nodeSel, sim, data: pd, cx, cy });
  });

  // -- Animate button: morph between panels sequentially --
  // Highlights each panel in sequence with a border pulse + node repositioning
  let animating = false;
  const btnAnimate = d3.select("#btn-animate");
  const btnReset = d3.select("#btn-reset");

  function animateSequence() {
    if (animating) return;
    animating = true;
    btnAnimate.classed("active", true).attr("disabled", true);

    const duration = 600;
    const dwell = 300;

    function highlightPanel(idx) {
      if (idx >= panelGroups.length) {
        animating = false;
        btnAnimate.classed("active", false).attr("disabled", null);
        return;
      }

      const pg = panelGroups[idx];

      // Highlight border
      pg.g.select("rect")
        .transition("highlight").duration(200)
        .attr("stroke", "#4477AA")
        .attr("stroke-width", 2.5);

      // Reheat simulation with a fresh arrangement push
      pg.sim.alpha(0.8).restart();

      // Stagger nodes inward then back out
      pg.nodeSel
        .transition("pulse").duration(duration / 2)
        .attr("r", 9)
        .attr("fill", colorNodeHighlight)
        .transition().duration(duration / 2)
        .attr("r", 6)
        .attr("fill", colorNode);

      // Flash new edges
      pg.linkSel.filter(d => d.status === "new")
        .transition("flash").duration(duration / 2)
        .attr("stroke-width", 3.5)
        .attr("stroke-opacity", 1)
        .transition().duration(duration / 2)
        .attr("stroke-width", 1.5)
        .attr("stroke-opacity", 0.7);

      // Flash removed edges
      pg.linkSel.filter(d => d.status === "removed")
        .transition("flash").duration(duration / 2)
        .attr("stroke-width", 2.5)
        .attr("stroke-opacity", 1)
        .transition().duration(duration / 2)
        .attr("stroke-width", 1.2)
        .attr("stroke-opacity", 0.6);

      // Remove highlight and advance
      setTimeout(() => {
        pg.g.select("rect")
          .transition("highlight").duration(300)
          .attr("stroke", "#e0e0e0")
          .attr("stroke-width", 1);
        setTimeout(() => highlightPanel(idx + 1), dwell);
      }, duration + 100);
    }

    highlightPanel(0);
  }

  function resetPanels() {
    panelGroups.forEach(pg => {
      pg.sim.alpha(1).restart();
      pg.g.select("rect")
        .transition().duration(200)
        .attr("stroke", "#e0e0e0")
        .attr("stroke-width", 1);
    });
  }

  btnAnimate.on("click", animateSequence);
  btnReset.on("click", resetPanels);
})();
</script>
</body>
</html>
