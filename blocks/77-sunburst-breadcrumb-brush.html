<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunburst Breadcrumb Brush</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fafafa; color: #333; }
  #container { width: 100%; max-width: 1200px; margin: 0 auto; text-align: center; }
  #breadcrumb { height: 34px; padding: 4px 16px; display: flex; align-items: center; gap: 0; overflow-x: auto; }
  #badge { padding: 6px 16px; font-size: 13px; color: #555; }
  .tooltip {
    position: absolute; pointer-events: none; background: rgba(0,0,0,0.85);
    color: #fff; padding: 8px 12px; border-radius: 4px; font-size: 12px;
    display: none; z-index: 10; line-height: 1.4;
  }
  #sunburst-wrap { position: relative; display: inline-block; }
</style>
</head>
<body>
<div id="container">
  <div id="breadcrumb"></div>
  <div id="badge"></div>
  <div id="sunburst-wrap">
    <div class="tooltip" id="tooltip"></div>
  </div>
</div>
<script>
const TOL = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377"];

// --- Synthetic data: 4-level product taxonomy ---
const rng = d3.randomLcg(7);
const rand = (lo, hi) => lo + rng() * (hi - lo);

const departments = ["Electronics","Clothing","Home","Food","Sports","Beauty"];
const catPool = [
  ["Phones","Laptops","Audio","Cameras","Wearables"],
  ["Men","Women","Kids","Accessories","Shoes"],
  ["Furniture","Kitchen","Bedding","Decor","Garden"],
  ["Snacks","Beverages","Dairy","Bakery","Frozen"],
  ["Fitness","Outdoor","Team","Water","Winter"],
  ["Skincare","Makeup","Fragrance","Hair","Bath"]
];
const subPool = ["Basic","Premium","Pro","Eco","Classic","Ultra"];

const buildChildren = () => {
  return departments.map((dept, di) => {
    const nCats = 3 + Math.floor(rng() * 3);
    const cats = catPool[di].slice(0, nCats);
    return {
      name: dept,
      children: cats.map(cat => {
        const nSubs = 3 + Math.floor(rng() * 4);
        return {
          name: cat,
          children: d3.range(nSubs).map(i => ({
            name: `${cat} ${subPool[i % subPool.length]}`,
            sales_value: Math.round(rand(500, 15000))
          }))
        };
      })
    };
  });
};

const data = { name: "All Products", children: buildChildren() };
const root = d3.hierarchy(data)
  .sum(d => d.sales_value || 0)
  .sort((a, b) => b.value - a.value);

const totalLeaves = root.leaves().length;
const totalValue = root.value;

// --- Color: OKLCH-inspired using Tol base hues ---
const deptColor = d3.scaleOrdinal().domain(departments).range(TOL);

const getDept = (d) => {
  let n = d;
  while (n.depth > 1) n = n.parent;
  return n.data.name;
};

const nodeColor = (d) => {
  if (d.depth === 0) return "#fff";
  const base = d3.hcl(deptColor(getDept(d)));
  // Deeper = lighter, less chroma
  const depthFactor = d.depth - 1;
  base.l = Math.min(92, base.l + depthFactor * 12);
  base.c = Math.max(10, base.c - depthFactor * 8);
  return base.toString();
};

const desatColor = (d) => {
  const c = d3.hcl(nodeColor(d));
  c.c = 2;
  c.l = 82;
  return c.toString();
};

// --- Sunburst layout ---
const width = 600, height = 600;
const radius = width / 2;

const partition = d3.partition().size([2 * Math.PI, radius]);
partition(root);

const arc = d3.arc()
  .startAngle(d => d.x0)
  .endAngle(d => d.x1)
  .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
  .padRadius(radius / 2)
  .innerRadius(d => d.y0)
  .outerRadius(d => d.y1 - 1);

const svg = d3.select("#sunburst-wrap").append("svg")
  .attr("width", width).attr("height", height)
  .style("font-family", "system-ui, sans-serif");

const g = svg.append("g")
  .attr("transform", `translate(${width / 2},${height / 2})`);

// Store current angles for transitions
root.each(d => {
  d.current = { x0: d.x0, x1: d.x1, y0: d.y0, y1: d.y1 };
});

const paths = g.selectAll("path.arc")
  .data(root.descendants().filter(d => d.depth > 0))
  .join("path")
  .attr("class", "arc")
  .attr("d", d => arc(d.current))
  .attr("fill", d => nodeColor(d))
  .attr("stroke", "#fff")
  .attr("stroke-width", 0.5)
  .style("cursor", "pointer");

// Labels on arcs
const labels = g.selectAll("text.arc-label")
  .data(root.descendants().filter(d => d.depth > 0))
  .join("text")
  .attr("class", "arc-label")
  .attr("pointer-events", "none")
  .attr("text-anchor", "middle")
  .attr("dy", "0.35em")
  .attr("font-size", d => d.depth === 1 ? "11px" : "9px")
  .attr("fill", "#333")
  .text(d => d.data.name);

const positionLabel = (d) => {
  const angle = (d.x0 + d.x1) / 2;
  const r = (d.y0 + d.y1) / 2;
  const arcLen = (d.x1 - d.x0) * r;
  return { angle, r, visible: arcLen > 30 && (d.y1 - d.y0) > 20 };
};

const updateLabels = () => {
  labels.each(function(d) {
    const { angle, r, visible } = positionLabel(d.current);
    const el = d3.select(this);
    el.attr("opacity", visible ? 1 : 0);
    if (visible) {
      const x = r * Math.sin(angle);
      const y = -r * Math.cos(angle);
      const rotate = angle * 180 / Math.PI;
      const flip = angle > Math.PI;
      el.attr("transform",
        `translate(${x},${y}) rotate(${flip ? rotate - 180 : rotate})`);
    }
  });
};
updateLabels();

// --- Radial brush state ---
let brushAngleStart = null, brushAngleEnd = null;
let brushActive = false;
const brushLine1 = g.append("line").attr("stroke", "#333").attr("stroke-width", 1.5).attr("display", "none");
const brushLine2 = g.append("line").attr("stroke", "#333").attr("stroke-width", 1.5).attr("display", "none");
const brushArc = g.append("path").attr("fill", "none").attr("stroke", "#333").attr("stroke-width", 2).attr("display", "none");

const selectedSet = new Set();

const updateBrushVisuals = () => {
  if (!brushActive || brushAngleStart == null || brushAngleEnd == null) {
    brushLine1.attr("display", "none");
    brushLine2.attr("display", "none");
    brushArc.attr("display", "none");
    return;
  }
  const outerR = root.children[0].y1; // outer ring radius
  const innerR = root.leaves()[0].y0;

  const drawLine = (line, angle) => {
    line.attr("display", null)
      .attr("x1", innerR * Math.sin(angle))
      .attr("y1", -innerR * Math.cos(angle))
      .attr("x2", outerR * Math.sin(angle))
      .attr("y2", -outerR * Math.cos(angle));
  };
  drawLine(brushLine1, brushAngleStart);
  drawLine(brushLine2, brushAngleEnd);

  const arcGen = d3.arc()
    .innerRadius(outerR - 2).outerRadius(outerR + 3)
    .startAngle(Math.min(brushAngleStart, brushAngleEnd))
    .endAngle(Math.max(brushAngleStart, brushAngleEnd));
  brushArc.attr("display", null).attr("d", arcGen()).attr("fill", "#4477AA").attr("opacity", 0.4);
};

const applyBrushSelection = () => {
  selectedSet.clear();
  if (!brushActive) {
    paths.attr("fill", d => nodeColor(d));
    updateBadge();
    updateBreadcrumb(currentFocus);
    return;
  }
  const lo = Math.min(brushAngleStart, brushAngleEnd);
  const hi = Math.max(brushAngleStart, brushAngleEnd);
  const leaves = root.leaves();

  leaves.forEach(l => {
    const mid = (l.current.x0 + l.current.x1) / 2;
    if (mid >= lo && mid <= hi) selectedSet.add(l);
  });

  // Ancestors of selected keep color
  const ancestorSet = new Set();
  selectedSet.forEach(l => {
    let n = l;
    while (n) { ancestorSet.add(n); n = n.parent; }
  });

  paths.attr("fill", d => {
    if (selectedSet.has(d) || ancestorSet.has(d)) return nodeColor(d);
    return desatColor(d);
  });

  updateBadge();
  // breadcrumb: common ancestor
  if (selectedSet.size > 0) {
    const selArr = [...selectedSet];
    let common = selArr[0];
    for (let i = 1; i < selArr.length; i++) {
      common = lca(common, selArr[i]);
    }
    updateBreadcrumb(common);
  }
};

const lca = (a, b) => {
  const aAnc = new Set();
  let n = a;
  while (n) { aAnc.add(n); n = n.parent; }
  n = b;
  while (n) { if (aAnc.has(n)) return n; n = n.parent; }
  return root;
};

// Drag on outer ring for radial brush
const outerRingR = root.leaves()[0] ? root.leaves()[0].y1 : radius;
const innerRingR = root.leaves()[0] ? root.leaves()[0].y0 : radius * 0.6;

svg.on("pointerdown", (event) => {
  const [mx, my] = d3.pointer(event, g.node());
  const dist = Math.sqrt(mx * mx + my * my);
  if (dist >= innerRingR - 10 && dist <= outerRingR + 20) {
    brushActive = true;
    brushAngleStart = Math.atan2(mx, -my);
    if (brushAngleStart < 0) brushAngleStart += 2 * Math.PI;
    brushAngleEnd = brushAngleStart;
    svg.node().setPointerCapture(event.pointerId);
    event.preventDefault();
  }
});

svg.on("pointermove", (event) => {
  if (!brushActive) return;
  const [mx, my] = d3.pointer(event, g.node());
  brushAngleEnd = Math.atan2(mx, -my);
  if (brushAngleEnd < 0) brushAngleEnd += 2 * Math.PI;
  updateBrushVisuals();
  applyBrushSelection();
});

svg.on("pointerup", () => {
  if (brushActive && Math.abs(brushAngleEnd - brushAngleStart) < 0.02) {
    // Too small, cancel
    brushActive = false;
    updateBrushVisuals();
    applyBrushSelection();
  }
});

// --- Badge ---
const badge = d3.select("#badge");
const updateBadge = () => {
  if (selectedSet.size > 0) {
    const selVal = d3.sum([...selectedSet], d => d.value);
    badge.text(`Selected ${selectedSet.size} of ${totalLeaves} ($${d3.format(",")(selVal)})`);
  } else {
    badge.text(`${totalLeaves} products \u2014 $${d3.format(",")(totalValue)} total`);
  }
};
updateBadge();

// --- Breadcrumb ---
let currentFocus = root;
const breadcrumb = d3.select("#breadcrumb");

const updateBreadcrumb = (node) => {
  const trail = node.ancestors().reverse();
  breadcrumb.selectAll("*").remove();
  trail.forEach((d, i) => {
    if (i > 0) {
      breadcrumb.append("span")
        .style("margin", "0 2px")
        .style("color", "#aaa")
        .text("\u203A");
    }
    const crumb = breadcrumb.append("span")
      .style("display", "inline-block")
      .style("padding", "3px 10px")
      .style("background", d.depth > 0 ? nodeColor(d) : "#e0e0e0")
      .style("border-radius", "3px")
      .style("font-size", "12px")
      .style("font-weight", 600)
      .style("cursor", "pointer")
      .style("color", "#333")
      .text(d.data.name)
      .on("click", () => zoomTo(d));
  });
};
updateBreadcrumb(root);

// --- Zoom on click ---
const zoomTo = (p) => {
  currentFocus = p;
  // Reset brush on zoom
  brushActive = false;
  selectedSet.clear();
  updateBrushVisuals();

  root.each(d => {
    d.target = {
      x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      y0: Math.max(0, d.y0 - p.depth),
      y1: Math.max(0, d.y1 - p.depth),
    };
  });

  const t = svg.transition().duration(750);
  paths.transition(t)
    .tween("data", d => {
      const i = d3.interpolate(d.current, d.target);
      return t => { d.current = i(t); };
    })
    .attrTween("d", d => () => arc(d.current))
    .attr("fill", d => nodeColor(d))
    .attr("opacity", d => {
      // Hide arcs outside visible ring
      return d.current.y1 <= 0 || d.current.y0 >= (radius) ? 0 : 1;
    });

  labels.transition(t)
    .tween("labelPos", function(d) {
      return (time) => {
        if (time === 1) updateLabels();
      };
    })
    .attr("opacity", 0);

  t.end().then(() => {
    updateLabels();
    paths.attr("pointer-events", d =>
      d.current.y1 > 0 && d.current.y0 < radius ? "auto" : "none"
    );
  }).catch(() => {});

  updateBreadcrumb(p);
  updateBadge();
};

paths.on("click", (event, d) => {
  if (d.children) {
    event.stopPropagation();
    zoomTo(d);
  }
});

// Click center to zoom out
g.append("circle")
  .attr("r", root.y1 || 30)
  .attr("fill", "transparent")
  .style("cursor", "pointer")
  .on("click", () => {
    if (currentFocus !== root) {
      zoomTo(currentFocus.parent || root);
    }
  });

// Tooltip
const tooltip = d3.select("#tooltip");
paths.on("pointerenter", (event, d) => {
  tooltip.style("display", "block")
    .html(`<strong>${d.data.name}</strong><br>Value: $${d3.format(",")(d.value)}<br>Depth: ${d.depth}`);
})
.on("pointermove", (event) => {
  const [mx, my] = d3.pointer(event, document.getElementById("sunburst-wrap"));
  tooltip.style("left", `${mx + 14}px`).style("top", `${my - 10}px`);
})
.on("pointerleave", () => tooltip.style("display", "none"));
</script>
</body>
</html>
