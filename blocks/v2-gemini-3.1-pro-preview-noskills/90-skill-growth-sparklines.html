<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Growth Sparklines</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f4f4f4;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            background-color: #e0e0e0;
        }
        .sparkline {
            fill: none;
            stroke: #4caf50;
            stroke-width: 2;
        }
        .sparkline-area {
            fill: #4caf50;
            opacity: 0.2;
        }
        .sparkline-point {
            fill: #4caf50;
        }
    </style>
</head>
<body>
    <h2>Skill Growth Over Time</h2>
    <table id="skillsTable">
        <thead>
            <tr>
                <th data-sort="name">Skill Name <span class="sort-icon"></span></th>
                <th data-sort="level">Current Level <span class="sort-icon"></span></th>
                <th>Growth (Sparkline)</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <script>
        const data = [
            { name: "JavaScript", level: 90, history: [40, 50, 65, 75, 85, 90] },
            { name: "Python", level: 85, history: [30, 45, 60, 70, 80, 85] },
            { name: "D3.js", level: 75, history: [10, 20, 35, 50, 65, 75] },
            { name: "React", level: 88, history: [20, 40, 60, 75, 85, 88] },
            { name: "Node.js", level: 80, history: [30, 40, 50, 65, 75, 80] },
            { name: "SQL", level: 70, history: [40, 45, 50, 60, 65, 70] },
            { name: "TypeScript", level: 82, history: [10, 30, 50, 65, 75, 82] },
            { name: "GraphQL", level: 65, history: [5, 15, 25, 40, 55, 65] }
        ];

        let currentSort = { column: 'level', direction: 'desc' };

        function renderTable() {
            const sortedData = [...data].sort((a, b) => {
                let valA = a[currentSort.column];
                let valB = b[currentSort.column];
                
                if (typeof valA === 'string') {
                    valA = valA.toLowerCase();
                    valB = valB.toLowerCase();
                }

                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            const tbody = d3.select("#skillsTable tbody");
            const rows = tbody.selectAll("tr").data(sortedData, d => d.name);
            const rowsEnter = rows.enter().append("tr");
            
            rowsEnter.append("td").attr("class", "cell-name");
            rowsEnter.append("td").attr("class", "cell-level");
            rowsEnter.append("td").attr("class", "cell-sparkline");

            const allRows = rowsEnter.merge(rows);

            allRows.select(".cell-name").text(d => d.name);
            allRows.select(".cell-level").text(d => d.level);

            allRows.select(".cell-sparkline").each(function(d) {
                const cell = d3.select(this);
                cell.selectAll("*").remove();

                const width = 120;
                const height = 30;
                const margin = { top: 5, right: 5, bottom: 5, left: 5 };
                const innerWidth = width - margin.left - margin.right;
                const innerHeight = height - margin.top - margin.bottom;

                const svg = cell.append("svg")
                    .attr("width", width)
                    .attr("height", height);
                
                const g = svg.append("g")
                    .attr("transform", `translate(${margin.left},${margin.top})`);

                const xScale = d3.scaleLinear()
                    .domain([0, d.history.length - 1])
                    .range([0, innerWidth]);

                const yScale = d3.scaleLinear()
                    .domain([0, 100])
                    .range([innerHeight, 0]);

                const line = d3.line()
                    .x((_, i) => xScale(i))
                    .y(val => yScale(val))
                    .curve(d3.curveMonotoneX);

                const area = d3.area()
                    .x((_, i) => xScale(i))
                    .y0(innerHeight)
                    .y1(val => yScale(val))
                    .curve(d3.curveMonotoneX);

                g.append("path")
                    .datum(d.history)
                    .attr("class", "sparkline-area")
                    .attr("d", area);

                g.append("path")
                    .datum(d.history)
                    .attr("class", "sparkline")
                    .attr("d", line);
                
                g.append("circle")
                    .attr("class", "sparkline-point")
                    .attr("cx", xScale(d.history.length - 1))
                    .attr("cy", yScale(d.history[d.history.length - 1]))
                    .attr("r", 3);
            });

            rows.exit().remove();

            d3.selectAll("th").selectAll(".sort-icon").text("");
            if (currentSort.column) {
                const icon = currentSort.direction === 'asc' ? ' ▲' : ' ▼';
                d3.select(`th[data-sort="${currentSort.column}"] .sort-icon`).text(icon);
            }
        }

        d3.selectAll("th[data-sort]").on("click", function() {
            const column = d3.select(this).attr("data-sort");
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'desc';
            }
            renderTable();
        });

        renderTable();
    </script>
</body>
</html>
