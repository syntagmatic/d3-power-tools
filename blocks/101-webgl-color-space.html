<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Space — OKLCH in 3D</title>
<style>
  :root {
    --bg: #1a1a1a;
    --text: #e0e0e0;
    --text-muted: #999;
    --font: system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    overflow: hidden; width: 100vw; height: 100vh;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; top: 20px; left: 24px;
    pointer-events: none;
  }
  .overlay h1 { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
  .overlay .sub { font-size: 12px; color: var(--text-muted); }
  .controls {
    position: absolute; top: 20px; right: 24px;
    display: flex; flex-direction: column; gap: 12px;
    pointer-events: auto;
  }
  .control-group label {
    font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;
  }
  .control-group input[type="range"] {
    width: 160px; accent-color: #88CCEE;
  }
  .toggle-row {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
  }
  .toggle-row input { accent-color: #88CCEE; }
  .range-val { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: rgba(30,30,30,0.92); border: 1px solid #444;
    border-radius: 6px; padding: 10px 14px;
    font-size: 12px; line-height: 1.6;
    transition: opacity 0.12s; backdrop-filter: blur(4px);
    min-width: 160px;
  }
  .tooltip .swatch {
    width: 32px; height: 32px; border-radius: 4px;
    border: 1px solid #555; margin-bottom: 6px;
  }
  .tooltip .name { font-weight: 600; font-size: 13px; }
  .tooltip .detail { color: var(--text-muted); }
  .instructions {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; color: var(--text-muted);
    opacity: 0.7;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="overlay">
  <h1>Color Space</h1>
  <div class="sub" id="count-label">1500 colors in OKLCH</div>
</div>
<div class="controls">
  <div class="control-group">
    <label>Lightness range: <span class="range-val" id="l-range-label">0.10 – 0.95</span></label>
    <input type="range" id="l-min" min="0.1" max="0.9" step="0.05" value="0.1">
    <input type="range" id="l-max" min="0.15" max="0.95" step="0.05" value="0.95">
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="named-only">
    <label for="named-only">Show named colors only</label>
  </div>
</div>
<div class="tooltip" id="tip">
  <div class="swatch" id="tip-swatch"></div>
  <div class="name" id="tip-name"></div>
  <div class="detail" id="tip-detail"></div>
</div>
<div class="instructions">Drag to rotate &middot; Scroll to zoom</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", {antialias: true, alpha: false});

// Named CSS colors
const namedColors = [
  "aliceblue","antiquewhite","aqua","aquamarine","azure","beige","bisque","black",
  "blanchedalmond","blue","blueviolet","brown","burlywood","cadetblue","chartreuse",
  "chocolate","coral","cornflowerblue","cornsilk","crimson","cyan","darkblue",
  "darkcyan","darkgoldenrod","darkgray","darkgreen","darkkhaki","darkmagenta",
  "darkolivegreen","darkorange","darkorchid","darkred","darksalmon","darkseagreen",
  "darkslateblue","darkslategray","darkturquoise","darkviolet","deeppink",
  "deepskyblue","dimgray","dodgerblue","firebrick","floralwhite","forestgreen",
  "fuchsia","gainsboro","ghostwhite","gold","goldenrod","gray","green","greenyellow",
  "honeydew","hotpink","indianred","indigo","ivory","khaki","lavender",
  "lavenderblush","lawngreen","lemonchiffon","lightblue","lightcoral","lightcyan",
  "lightgoldenrodyellow","lightgray","lightgreen","lightpink","lightsalmon",
  "lightseagreen","lightskyblue","lightslategray","lightsteelblue","lightyellow",
  "lime","limegreen","linen","magenta","maroon","mediumaquamarine","mediumblue",
  "mediumorchid","mediumpurple","mediumseagreen","mediumslateblue",
  "mediumspringgreen","mediumturquoise","mediumvioletred","midnightblue",
  "mintcream","mistyrose","moccasin","navajowhite","navy","oldlace","olive",
  "olivedrab","orange","orangered","orchid","palegoldenrod","palegreen",
  "paleturquoise","palevioletred","papayawhip","peachpuff","peru","pink","plum",
  "powderblue","purple","rebeccapurple","red","rosybrown","royalblue","saddlebrown",
  "salmon","sandybrown","seagreen","seashell","sienna","silver","skyblue",
  "slateblue","slategray","snow","springgreen","steelblue","tan","teal","thistle",
  "tomato","turquoise","violet","wheat","white","whitesmoke","yellow","yellowgreen"
];

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return [r,g,b];
}

function srgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055)/1.055, 2.4);
}

function rgbToOklch(r, g, b) {
  const lr = srgbToLinear(r), lg = srgbToLinear(g), lb = srgbToLinear(b);
  const l_ = 0.4122214708*lr + 0.5363325363*lg + 0.0514459929*lb;
  const m_ = 0.2119034982*lr + 0.6806995451*lg + 0.1073969566*lb;
  const s_ = 0.0883024619*lr + 0.2220049401*lg + 0.6896926080*lb;
  const l1 = Math.cbrt(l_), m1 = Math.cbrt(m_), s1 = Math.cbrt(s_);
  const L = 0.2104542553*l1 + 0.7936177850*m1 - 0.0040720468*s1;
  const a = 1.9779984951*l1 - 2.4285922050*m1 + 0.4505937099*s1;
  const bv = 0.0259040371*l1 + 0.7827717662*m1 - 0.8086757660*s1;
  const C = Math.sqrt(a*a + bv*bv);
  let H = Math.atan2(bv, a) * 180 / Math.PI;
  if (H < 0) H += 360;
  return [L, C, H];
}

function oklchInGamut(L, C, H) {
  // Approximate check: convert back and see if in [0,1]
  const a = C * Math.cos(H * Math.PI / 180);
  const b = C * Math.sin(H * Math.PI / 180);
  const l1 = L + 0.3963377774*a + 0.2158037573*b;
  const m1 = L - 0.1055613458*a - 0.0638541728*b;
  const s1 = L - 0.0894841775*a - 1.2914855480*b;
  const l_ = l1*l1*l1, m_ = m1*m1*m1, s_ = s1*s1*s1;
  const r = 4.0767416621*l_ - 3.3077115913*m_ + 0.2309699292*s_;
  const g = -1.2684380046*l_ + 2.6097574011*m_ - 0.3413193965*s_;
  const bv = -0.0041960863*l_ - 0.7034186147*m_ + 1.7076147010*s_;
  const tol = -0.002;
  return r >= tol && r <= 1.002 && g >= tol && g <= 1.002 && bv >= tol && bv <= 1.002;
}

function oklchToSrgb(L, C, H) {
  const a = C * Math.cos(H * Math.PI / 180);
  const b = C * Math.sin(H * Math.PI / 180);
  const l1 = L + 0.3963377774*a + 0.2158037573*b;
  const m1 = L - 0.1055613458*a - 0.0638541728*b;
  const s1 = L - 0.0894841775*a - 1.2914855480*b;
  const l_ = l1*l1*l1, m_ = m1*m1*m1, s_ = s1*s1*s1;
  let r = 4.0767416621*l_ - 3.3077115913*m_ + 0.2309699292*s_;
  let g = -1.2684380046*l_ + 2.6097574011*m_ - 0.3413193965*s_;
  let bv = -0.0041960863*l_ - 0.7034186147*m_ + 1.7076147010*s_;
  r = Math.max(0,Math.min(1,r)); g = Math.max(0,Math.min(1,g)); bv = Math.max(0,Math.min(1,bv));
  // Linear to sRGB
  const f = c => c <= 0.0031308 ? 12.92*c : 1.055*Math.pow(c,1/2.4)-0.055;
  return [f(r),f(g),f(bv)];
}

// Generate colors
const allColors = [];

// Grid sample
const Lsteps = 20, Csteps = 15, Hsteps = 6;
for (let li = 0; li < Lsteps; li++) {
  const L = 0.1 + (0.85 * li / (Lsteps-1));
  for (let ci = 0; ci < Csteps; ci++) {
    const C = 0.01 + (0.34 * ci / (Csteps-1));
    for (let hi = 0; hi < Hsteps; hi++) {
      const H = 360 * hi / Hsteps;
      if (oklchInGamut(L, C, H)) {
        const [r,g,b] = oklchToSrgb(L, C, H);
        const hex = "#" + [r,g,b].map(v => Math.round(v*255).toString(16).padStart(2,"0")).join("");
        allColors.push({name:`oklch(${L.toFixed(2)} ${C.toFixed(2)} ${H.toFixed(0)})`, hex, L, C, H, r, g, b, named:false});
      }
    }
  }
}

// Extra sampling for more coverage
for (let i = 0; i < 40; i++) {
  for (let hi = 0; hi < 60; hi++) {
    const L = 0.1 + 0.85 * (i / 39);
    const H = 6 * hi;
    for (let ci = 0; ci < 8; ci++) {
      const C = 0.02 + 0.30 * (ci / 7);
      if (oklchInGamut(L, C, H)) {
        const [r,g,b] = oklchToSrgb(L, C, H);
        const hex = "#" + [r,g,b].map(v => Math.round(v*255).toString(16).padStart(2,"0")).join("");
        // Avoid too many duplicates
        if (!allColors.some(c => Math.abs(c.L-L)<0.02 && Math.abs(c.C-C)<0.02 && Math.abs(c.H-H)<5)) {
          allColors.push({name:`oklch(${L.toFixed(2)} ${C.toFixed(2)} ${H.toFixed(0)})`, hex, L, C, H, r, g, b, named:false});
        }
      }
    }
  }
}

// Named CSS colors
const tempEl = document.createElement("div");
document.body.appendChild(tempEl);
for (const name of namedColors) {
  tempEl.style.color = name;
  const computed = getComputedStyle(tempEl).color;
  const m = computed.match(/(\d+)/g);
  if (m) {
    const [r,g,b] = m.map(Number).map(v=>v/255);
    const [L,C,H] = rgbToOklch(r,g,b);
    const hex = "#" + [r,g,b].map(v => Math.round(v*255).toString(16).padStart(2,"0")).join("");
    allColors.push({name, hex, L, C, H, r, g, b, named:true});
  }
}
document.body.removeChild(tempEl);

// Trim to ~1500
const trimmed = allColors.slice(0, 1800);

// Convert to 3D positions: H→angle around Y, C→radius, L→Y
function colorTo3D(c) {
  const angle = c.H * Math.PI / 180;
  const radius = c.C * 6; // scale up
  const y = (c.L - 0.5) * 4; // center around 0
  return [Math.cos(angle) * radius, y, Math.sin(angle) * radius];
}

// --- WebGL Setup ---
function resize() {
  const dpr = devicePixelRatio;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener("resize", resize);

const vsrc = `
  attribute vec3 aPos;
  attribute vec3 aColor;
  attribute float aVisible;
  uniform mat4 uMVP;
  uniform float uPointSize;
  varying vec3 vColor;
  varying float vVisible;
  void main() {
    vColor = aColor;
    vVisible = aVisible;
    gl_Position = uMVP * vec4(aPos, 1.0);
    gl_PointSize = uPointSize / gl_Position.w;
  }
`;
const fsrc = `
  precision mediump float;
  varying vec3 vColor;
  varying float vVisible;
  void main() {
    if (vVisible < 0.5) discard;
    float d = length(gl_PointCoord - 0.5);
    if (d > 0.5) discard;
    float alpha = smoothstep(0.5, 0.38, d);
    gl_FragColor = vec4(vColor, alpha);
  }
`;

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(vsrc, gl.VERTEX_SHADER));
gl.attachShader(prog, compileShader(fsrc, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);

const aPos = gl.getAttribLocation(prog, "aPos");
const aColor = gl.getAttribLocation(prog, "aColor");
const aVisible = gl.getAttribLocation(prog, "aVisible");
const uMVP = gl.getUniformLocation(prog, "uMVP");
const uPointSize = gl.getUniformLocation(prog, "uPointSize");

// Buffers
const N = trimmed.length;
const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const visible = new Float32Array(N);

for (let i = 0; i < N; i++) {
  const [x,y,z] = colorTo3D(trimmed[i]);
  positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
  colors[i*3] = trimmed[i].r; colors[i*3+1] = trimmed[i].g; colors[i*3+2] = trimmed[i].b;
  visible[i] = 1;
}

const posBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

const colBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);

const visBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, visBuf);
gl.bufferData(gl.ARRAY_BUFFER, visible, gl.DYNAMIC_DRAW);

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0.1, 0.1, 0.1, 1);

// Camera
let rotX = -0.4, rotY = 0.8, dist = 8;
let dragging = false, lastX = 0, lastY = 0;

canvas.addEventListener("pointerdown", e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (dragging) {
    rotY += (e.clientX - lastX) * 0.005;
    rotX += (e.clientY - lastY) * 0.005;
    rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
    lastX = e.clientX; lastY = e.clientY;
  }
  // Hover detection (approximate: project all points, find closest)
  handleHover(e.clientX, e.clientY);
});
canvas.addEventListener("pointerup", () => dragging = false);
canvas.addEventListener("wheel", e => {
  dist *= 1 + e.deltaY * 0.001;
  dist = Math.max(3, Math.min(20, dist));
  e.preventDefault();
}, {passive: false});

// Matrix helpers
function mat4Perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov/2);
  const nf = 1 / (near - far);
  return [f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0];
}
function mat4LookAt(eye, center, up) {
  const z = normalize(sub(eye,center));
  const x = normalize(cross(up,z));
  const y = cross(z,x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -dot(x,eye),-dot(y,eye),-dot(z,eye),1];
}
function mat4Mul(a,b) {
  const o = new Array(16).fill(0);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)
    o[j*4+i]+=a[k*4+i]*b[j*4+k];
  return o;
}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function normalize(v){const l=Math.sqrt(dot(v,v));return l?[v[0]/l,v[1]/l,v[2]/l]:[0,0,0];}

function getMVP() {
  const aspect = canvas.width / canvas.height;
  const eye = [
    dist * Math.cos(rotX) * Math.sin(rotY),
    dist * Math.sin(rotX),
    dist * Math.cos(rotX) * Math.cos(rotY)
  ];
  const proj = mat4Perspective(Math.PI/4, aspect, 0.1, 100);
  const view = mat4LookAt(eye, [0,0,0], [0,1,0]);
  return {mvp: mat4Mul(proj, view), eye, proj, view};
}

// Hover
const tip = document.getElementById("tip");
const tipSwatch = document.getElementById("tip-swatch");
const tipName = document.getElementById("tip-name");
const tipDetail = document.getElementById("tip-detail");

function project(pos3d, mvp) {
  const x = mvp[0]*pos3d[0]+mvp[4]*pos3d[1]+mvp[8]*pos3d[2]+mvp[12];
  const y = mvp[1]*pos3d[0]+mvp[5]*pos3d[1]+mvp[9]*pos3d[2]+mvp[13];
  const w = mvp[3]*pos3d[0]+mvp[7]*pos3d[1]+mvp[11]*pos3d[2]+mvp[15];
  return [(x/w+1)*canvas.width/2/devicePixelRatio, (1-y/w)*canvas.height/2/devicePixelRatio];
}

function handleHover(mx, my) {
  if (dragging) { tip.style.opacity = 0; return; }
  const {mvp} = getMVP();
  let bestDist = 20, bestIdx = -1;
  for (let i = 0; i < N; i++) {
    if (visible[i] < 0.5) continue;
    const [sx, sy] = project([positions[i*3],positions[i*3+1],positions[i*3+2]], mvp);
    const d = Math.hypot(sx - mx, sy - my);
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }
  if (bestIdx >= 0) {
    const c = trimmed[bestIdx];
    tipSwatch.style.background = c.hex;
    tipName.textContent = c.named ? c.name : c.hex;
    tipDetail.innerHTML = `${c.hex}<br>L: ${c.L.toFixed(2)} C: ${c.C.toFixed(2)} H: ${c.H.toFixed(0)}\u00b0`;
    tip.style.opacity = 1;
    tip.style.left = Math.min(mx + 16, innerWidth - 200) + "px";
    tip.style.top = (my - 20) + "px";
  } else {
    tip.style.opacity = 0;
  }
}

// Controls
const lMinEl = document.getElementById("l-min");
const lMaxEl = document.getElementById("l-max");
const namedOnlyEl = document.getElementById("named-only");
const lRangeLabel = document.getElementById("l-range-label");
const countLabel = document.getElementById("count-label");

function updateFilters() {
  const lMin = +lMinEl.value, lMax = +lMaxEl.value;
  const namedOnly = namedOnlyEl.checked;
  lRangeLabel.textContent = `${lMin.toFixed(2)} \u2013 ${lMax.toFixed(2)}`;
  let count = 0;
  for (let i = 0; i < N; i++) {
    const c = trimmed[i];
    const show = c.L >= lMin && c.L <= lMax && (!namedOnly || c.named);
    visible[i] = show ? 1 : 0;
    if (show) count++;
  }
  countLabel.textContent = `${count} colors in OKLCH${namedOnly ? " (named only)" : ""}`;
  gl.bindBuffer(gl.ARRAY_BUFFER, visBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, visible);
}

lMinEl.addEventListener("input", updateFilters);
lMaxEl.addEventListener("input", updateFilters);
namedOnlyEl.addEventListener("change", updateFilters);

// Render loop
function draw() {
  resize();
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const {mvp} = getMVP();
  gl.uniformMatrix4fv(uMVP, false, new Float32Array(mvp));
  gl.uniform1f(uPointSize, 40);

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.enableVertexAttribArray(aColor);
  gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, visBuf);
  gl.enableVertexAttribArray(aVisible);
  gl.vertexAttribPointer(aVisible, 1, gl.FLOAT, false, 0, 0);

  gl.drawArrays(gl.POINTS, 0, N);
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
