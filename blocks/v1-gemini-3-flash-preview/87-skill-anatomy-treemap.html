<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Anatomy v1 — treemap of line counts</title>
<style>
  :root {
    --bg: #fdfdfd;
    --text: #111;
    --text-muted: #555;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  header {
    text-align: center;
    margin-bottom: 30px;
    max-width: 900px;
    width: 100%;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  #chart {
    width: 100%;
    max-width: 1000px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(10,10,10,0.95);
    color: #fff;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 6px;
    display: none;
    z-index: 100;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    backdrop-filter: blur(4px);
  }
  .tooltip b { font-weight: 600; display: block; margin-bottom: 2px; }
  .tooltip .cat { font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; }
  .tooltip .val { margin-top: 4px; font-variant-numeric: tabular-nums; }
  
  svg {
    display: block;
    shape-rendering: crispEdges;
  }
  .leaf rect {
    transition: filter 0.2s ease;
  }
  .leaf:hover rect {
    filter: brightness(0.9) saturate(1.2);
  }
</style>
</head>
<body>
<header>
  <h1>Skill Anatomy</h1>
  <p class="subtitle">A treemap of Gemini CLI's skill documentation. Each area represents the number of lines in its corresponding <code>SKILL.md</code> file, grouped by functional category.</p>
</header>
<div id="chart"></div>
<div class="tooltip" id="tooltip"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const skills = [
  {name:"time-series",lines:317,category:"Seeing change"},
  {name:"sparkcharts",lines:340,category:"Before you render"},
  {name:"responsive",lines:309,category:"Making it work"},
  {name:"edge-bundling",lines:237,category:"Seeing structure"},
  {name:"coordination",lines:133,category:"Before you render"},
  {name:"linked-views",lines:53,category:"Seeing patterns"},
  {name:"data-gathering",lines:195,category:"Before you render"},
  {name:"color",lines:329,category:"Making it legible"},
  {name:"network",lines:266,category:"Seeing structure"},
  {name:"webgl",lines:273,category:"Making it work"},
  {name:"navigation",lines:286,category:"Making it work"},
  {name:"annotation",lines:320,category:"Making it legible"},
  {name:"motion",lines:253,category:"Seeing change"},
  {name:"visual-texture",lines:210,category:"Making it legible"},
  {name:"brushing",lines:304,category:"Seeing patterns"},
  {name:"scales",lines:308,category:"Making it legible"},
  {name:"canvas",lines:251,category:"Making it work"},
  {name:"parallel-coordinates",lines:331,category:"Seeing patterns"},
  {name:"small-multiples",lines:228,category:"Before you render"},
  {name:"hierarchy-layouts",lines:231,category:"Seeing structure"},
  {name:"canvas-accessibility",lines:341,category:"Making it legible"},
  {name:"shape-morphing",lines:216,category:"Seeing change"},
  {name:"choreography",lines:93,category:"Seeing change"},
  {name:"force",lines:286,category:"Seeing structure"},
  {name:"hierarchy-interaction",lines:184,category:"Seeing structure"},
  {name:"distributions",lines:325,category:"Seeing patterns"},
  {name:"cartography",lines:279,category:"Seeing place"},
  {name:"data-table",lines:327,category:"Making it legible"}
];

const totalLines = d3.sum(skills, d => d.lines);

// Group into hierarchy
const nested = d3.groups(skills, d => d.category)
  .map(([key, children]) => ({
    name: key,
    children: children
  }));

const root = d3.hierarchy({name: "skills", children: nested})
  .sum(d => d.lines)
  .sort((a, b) => b.value - a.value);

// Category hues (refined palette)
const catHues = {
  "Before you render": 45,  // Amber
  "Seeing patterns": 265,   // Purple
  "Seeing structure": 170,  // Teal
  "Seeing place": 120,      // Green
  "Seeing change": 345,     // Pink/Red
  "Making it legible": 205, // Blue
  "Making it work": 25      // Orange
};

const catExtents = {};
skills.forEach(s => {
  if (!catExtents[s.category]) catExtents[s.category] = [Infinity, -Infinity];
  catExtents[s.category][0] = Math.min(catExtents[s.category][0], s.lines);
  catExtents[s.category][1] = Math.max(catExtents[s.category][1], s.lines);
});

function getCellColor(d) {
  const category = d.data.category;
  const hue = catHues[category] || 0;
  const [min, max] = catExtents[category];
  const t = max === min ? 0.5 : (d.data.lines - min) / (max - min);
  // Lightness from 75 (fewer lines) to 45 (more lines)
  return d3.hsl(hue, 0.45 + t * 0.15, 0.75 - t * 0.3).formatHex();
}

function getHeaderColor(catName) {
  const hue = catHues[catName] || 0;
  return d3.hsl(hue, 0.3, 0.94).formatHex();
}

const width = 1000;
const height = 640;

d3.treemap()
  .size([width, height])
  .paddingInner(1)
  .paddingOuter(4)
  .paddingTop(28)
  .round(true)
  (root);

const svg = d3.select("#chart").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("width", "100%")
  .style("user-select", "none");

// Category Groups
const catNodes = svg.selectAll("g.category")
  .data(root.children)
  .join("g")
  .attr("class", "category");

catNodes.append("rect")
  .attr("x", d => d.x0)
  .attr("y", d => d.y0)
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => d.y1 - d.y0)
  .attr("fill", d => getHeaderColor(d.data.name))
  .attr("rx", 6);

catNodes.append("text")
  .attr("x", d => d.x0 + 10)
  .attr("y", d => d.y0 + 19)
  .text(d => d.data.name)
  .attr("font-size", "12px")
  .attr("font-weight", "700")
  .attr("fill", d => d3.hsl(catHues[d.data.name], 0.6, 0.25).formatHex());

// Skill Leaves
const leafNodes = svg.selectAll("g.leaf")
  .data(root.leaves())
  .join("g")
  .attr("class", "leaf");

leafNodes.append("rect")
  .attr("x", d => d.x0)
  .attr("y", d => d.y0)
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => d.y1 - d.y0)
  .attr("fill", d => getCellColor(d))
  .attr("rx", 2)
  .attr("stroke", "#fff")
  .attr("stroke-width", 1);

const tooltip = d3.select("#tooltip");

leafNodes.on("mouseenter", function(event, d) {
    const pct = ((d.data.lines / totalLines) * 100).toFixed(1);
    tooltip.style("display", "block")
      .html(`
        <span class="cat">${d.data.category}</span>
        <b>${d.data.name}</b>
        <div class="val">${d.data.lines.toLocaleString()} lines (${pct}%)</div>
      `);
    
    d3.select(this).select("rect")
      .attr("stroke", "#000")
      .attr("stroke-width", 2)
      .raise();
  })
  .on("mousemove", function(event) {
    tooltip.style("left", (event.clientX + 15) + "px")
           .style("top", (event.clientY + 15) + "px");
  })
  .on("mouseleave", function() {
    tooltip.style("display", "none");
    d3.select(this).select("rect")
      .attr("stroke", "#fff")
      .attr("stroke-width", 1);
  });

// Labels
leafNodes.each(function(d) {
  const w = d.x1 - d.x0;
  const h = d.y1 - d.y0;
  if (w < 40 || h < 25) return;

  const g = d3.select(this);
  const color = d3.color(getCellColor(d));
  const brightness = (color.r * 299 + color.g * 587 + color.b * 114) / 1000;
  const textColor = brightness < 150 ? "#fff" : "#000";

  g.append("text")
    .attr("x", d.x0 + 5)
    .attr("y", d.y0 + 15)
    .text(d.data.name)
    .attr("font-size", w > 80 ? "11px" : "10px")
    .attr("font-weight", "600")
    .attr("fill", textColor)
    .attr("opacity", 0.9)
    .attr("pointer-events", "none");

  if (h > 40 && w > 60) {
    g.append("text")
      .attr("x", d.x0 + 5)
      .attr("y", d.y0 + 28)
      .text(d.data.lines)
      .attr("font-size", "10px")
      .attr("fill", textColor)
      .attr("opacity", 0.6)
      .attr("pointer-events", "none");
  }
});

</script>
</body>
</html>
