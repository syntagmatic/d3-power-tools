<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Server KPI Dashboard | Threshold Scale</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --healthy: #10b981;
      --warning: #f59e0b;
      --critical: #ef4444;
      --accent: #3b82f6;
      --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", monospace;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .title-area p {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .controls {
      display: flex;
      gap: 24px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .control-label .val {
      font-family: var(--font-mono);
      color: var(--text-main);
    }

    input[type="range"] {
      width: 140px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .table-container {
      position: relative;
      width: 100%;
    }

    /* Header styling */
    .table-header {
      display: grid;
      grid-template-columns: 140px 100px 120px 180px 100px 100px;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 12px 32px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-cell {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .header-cell:hover { color: var(--text-main); }
    .header-cell.sort-active { color: var(--accent); }
    .header-cell.num { justify-content: flex-end; }
    .sort-icon { font-size: 10px; opacity: 0.5; }

    /* Row styling */
    .rows-wrapper {
      position: relative;
      height: 800px; /* 20 rows * 40px */
      overflow: hidden;
    }

    .row {
      position: absolute;
      left: 0;
      right: 0;
      height: 40px;
      display: grid;
      grid-template-columns: 140px 100px 120px 180px 100px 100px;
      padding: 0 32px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      transition: background-color 0.2s;
      font-size: 0.875rem;
    }

    .row:hover { background-color: #f8fafc; }

    .cell.mono { font-family: var(--font-mono); font-size: 0.75rem; }
    .cell.num { text-align: right; display: block; }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      font-size: 0.75rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .spark-container, .bullet-container {
      display: flex;
      align-items: center;
      height: 100%;
    }

    svg { overflow: visible; }

    .bullet-bar-bg { fill: #e2e8f0; rx: 2; }
    .bullet-bar-val { transition: fill 0.3s, width 0.3s; rx: 2; }
    .bullet-marker { stroke: var(--text-main); stroke-width: 1.5; }
    .bullet-label { font-family: var(--font-mono); font-size: 9px; fill: var(--text-muted); }

    .spark-path { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .spark-area { fill: var(--accent); fill-opacity: 0.1; }
    .spark-dot { transition: fill 0.3s; }

    .summary-bar {
      padding: 12px 32px;
      background: #f1f5f9;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .summary-item { display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-area">
      <h1>Server Health Dashboard</h1>
      <p>Real-time performance monitoring with dynamic thresholds</p>
    </div>
    <div class="controls">
      <div class="control-group">
        <div class="control-label">Warning <span class="val" id="warn-val">70%</span></div>
        <input type="range" id="warn-slider" min="40" max="85" value="70">
      </div>
      <div class="control-group">
        <div class="control-label">Critical <span class="val" id="crit-val">85%</span></div>
        <input type="range" id="crit-slider" min="60" max="98" value="85">
      </div>
    </div>
  </header>

  <div class="table-container">
    <div class="table-header" id="table-header">
      <div class="header-cell" data-key="name">Server <span class="sort-icon"></span></div>
      <div class="header-cell" data-key="status">Status <span class="sort-icon"></span></div>
      <div class="header-cell" data-key="cpu">CPU <span class="sort-icon"></span></div>
      <div class="header-cell" data-key="mem">Memory <span class="sort-icon"></span></div>
      <div class="header-cell num" data-key="uptime">Uptime <span class="sort-icon"></span></div>
      <div class="header-cell num" data-key="req">Requests <span class="sort-icon"></span></div>
    </div>
    <div class="rows-wrapper" id="rows-wrapper"></div>
  </div>

  <div class="summary-bar" id="summary-bar">
    <div class="summary-item"><div class="status-dot" style="background: var(--healthy)"></div> <span id="count-healthy">0</span> Healthy</div>
    <div class="summary-item"><div class="status-dot" style="background: var(--warning)"></div> <span id="count-warning">0</span> Warning</div>
    <div class="summary-item"><div class="status-dot" style="background: var(--critical)"></div> <span id="count-critical">0</span> Critical</div>
  </div>
</div>

<script>
(() => {
  // --- Constants & Config ---
  const ROW_HEIGHT = 40;
  const NUM_ROWS = 20;
  const COLORS = {
    healthy: "#10b981",
    warning: "#f59e0b",
    critical: "#ef4444"
  };

  // --- State ---
  let warnThreshold = 70;
  let critThreshold = 85;
  let sortKey = "status";
  let sortAsc = false;

  // --- Data Generation ---
  const rng = d3.randomLcg(123);
  const servers = ["Alpha", "Beta", "Gamma", "Delta", "Epsilon", "Zeta", "Eta", "Theta", "Iota", "Kappa", "Lambda", "Mu", "Nu", "Xi", "Omicron", "Pi", "Rho", "Sigma", "Tau", "Upsilon"];
  
  const data = servers.map((name, i) => {
    const type = ["Web", "API", "DB", "LB", "Worker"][i % 5];
    const baseCpu = 20 + rng() * 60;
    const cpuHistory = Array.from({ length: 30 }, () => {
      let v = baseCpu + (rng() - 0.5) * 40;
      return Math.max(5, Math.min(98, v));
    });
    const memLimit = [8, 16, 32, 64, 128][Math.floor(rng() * 5)];
    const memUsed = +(memLimit * (0.3 + rng() * 0.6)).toFixed(1);
    
    return {
      id: `srv-${i}`,
      name: `${type}-${name}`,
      cpuHistory: cpuHistory,
      cpu: cpuHistory[cpuHistory.length - 1],
      memUsed: memUsed,
      memLimit: memLimit,
      uptime: +(98 + rng() * 1.99).toFixed(2),
      req: Math.floor(100 + rng() * 9900)
    };
  });

  // --- Helpers ---
  const getStatus = (cpu) => {
    if (cpu >= critThreshold) return 2; // Critical
    if (cpu >= warnThreshold) return 1; // Warning
    return 0; // Healthy
  };

  const getStatusColor = (status) => [COLORS.healthy, COLORS.warning, COLORS.critical][status];
  const getStatusLabel = (status) => ["Healthy", "Warning", "Critical"][status];

  // --- Main Render Function ---
  function update() {
    // 1. Sort data
    const sorted = [...data].sort((a, b) => {
      let vA, vB;
      if (sortKey === "name") { vA = a.name; vB = b.name; }
      else if (sortKey === "status") { vA = getStatus(a.cpu); vB = getStatus(b.cpu); }
      else if (sortKey === "cpu") { vA = a.cpu; vB = b.cpu; }
      else if (sortKey === "mem") { vA = a.memUsed / a.memLimit; vB = b.memUsed / b.memLimit; }
      else if (sortKey === "uptime") { vA = a.uptime; vB = b.uptime; }
      else if (sortKey === "req") { vA = a.req; vB = b.req; }
      
      const res = vA < vB ? -1 : vA > vB ? 1 : 0;
      return sortAsc ? res : -res;
    });

    // 2. Summary Counts
    const counts = [0, 0, 0];
    data.forEach(d => counts[getStatus(d.cpu)]++);
    d3.select("#count-healthy").text(counts[0]);
    d3.select("#count-warning").text(counts[1]);
    d3.select("#count-critical").text(counts[2]);

    // 3. Update Headers
    d3.selectAll(".header-cell").each(function() {
      const el = d3.select(this);
      const key = el.attr("data-key");
      el.classed("sort-active", key === sortKey);
      el.select(".sort-icon").text(key === sortKey ? (sortAsc ? "↑" : "↓") : "");
    });

    // 4. Join Rows
    const rows = d3.select("#rows-wrapper")
      .selectAll(".row")
      .data(sorted, d => d.id)
      .join(
        enter => {
          const row = enter.append("div").attr("class", "row");
          
          row.append("div").attr("class", "cell mono name");
          row.append("div").attr("class", "cell status");
          row.append("div").attr("class", "cell cpu");
          row.append("div").attr("class", "cell mem");
          row.append("div").attr("class", "cell num mono uptime");
          row.append("div").attr("class", "cell num mono req");
          
          return row;
        }
      );

    // 5. Animate Position
    rows.transition()
      .duration(600)
      .ease(d3.easeCubicInOut)
      .style("transform", (d, i) => `translateY(${i * ROW_HEIGHT}px)`);

    // 6. Update Content & Threshold-driven visuals
    rows.each(function(d) {
      const row = d3.select(this);
      const status = getStatus(d.cpu);
      const color = getStatusColor(status);

      // Name
      row.select(".name").text(d.name);

      // Status
      let badge = row.select(".status").selectAll(".status-badge").data([d]).join("div").attr("class", "status-badge");
      badge.selectAll(".status-dot").data([d]).join("div").attr("class", "status-dot")
        .style("background-color", color);
      badge.selectAll(".status-text").data([d]).join("span").attr("class", "status-text")
        .text(getStatusLabel(status));

      // CPU Sparkline
      const sparkW = 100, sparkH = 24;
      const x = d3.scaleLinear([0, d.cpuHistory.length - 1], [2, sparkW - 2]);
      const y = d3.scaleLinear([0, 100], [sparkH - 2, 2]);
      
      const line = d3.line().x((_, i) => x(i)).y(v => y(v)).curve(d3.curveMonotoneX);
      const area = d3.area().x((_, i) => x(i)).y0(sparkH).y1(v => y(v)).curve(d3.curveMonotoneX);

      let sparkSvg = row.select(".cpu").selectAll("svg").data([d]).join("svg")
        .attr("width", sparkW).attr("height", sparkH);
      
      sparkSvg.selectAll(".spark-area").data([d.cpuHistory]).join("path").attr("class", "spark-area").attr("d", area);
      sparkSvg.selectAll(".spark-path").data([d.cpuHistory]).join("path").attr("class", "spark-path").attr("d", line);
      sparkSvg.selectAll(".spark-dot").data([d]).join("circle").attr("class", "spark-dot")
        .attr("cx", x(d.cpuHistory.length - 1)).attr("cy", y(d.cpu))
        .attr("r", 2.5).attr("fill", color);

      // Memory Bullet
      const bulletW = 140, bulletH = 12;
      const bx = d3.scaleLinear([0, d.memLimit], [0, bulletW]);
      const memStatus = d.memUsed / d.memLimit > 0.85 ? 2 : d.memUsed / d.memLimit > 0.65 ? 1 : 0;
      
      let bulletSvg = row.select(".mem").selectAll("svg").data([d]).join("svg")
        .attr("width", bulletW + 40).attr("height", 24);
      
      bulletSvg.selectAll(".bullet-bar-bg").data([d]).join("rect").attr("class", "bullet-bar-bg")
        .attr("x", 0).attr("y", 6).attr("width", bulletW).attr("height", bulletH);
      
      bulletSvg.selectAll(".bullet-bar-val").data([d]).join("rect").attr("class", "bullet-bar-val")
        .attr("x", 0).attr("y", 6).attr("width", bx(d.memUsed)).attr("height", bulletH)
        .attr("fill", getStatusColor(memStatus));
        
      bulletSvg.selectAll(".bullet-marker").data([d]).join("line").attr("class", "bullet-marker")
        .attr("x1", bx(d.memLimit * 0.75)).attr("x2", bx(d.memLimit * 0.75))
        .attr("y1", 4).attr("y2", 20);

      bulletSvg.selectAll(".bullet-label").data([d]).join("text").attr("class", "bullet-label")
        .attr("x", bulletW + 4).attr("y", 16)
        .text(`${d.memUsed}G`);

      // Numbers
      row.select(".uptime").text(d.uptime + "%");
      row.select(".req").text(d3.format(",")(d.req));
    });
  }

  // --- Event Listeners ---
  d3.select("#warn-slider").on("input", function() {
    warnThreshold = +this.value;
    if (warnThreshold >= critThreshold) {
      critThreshold = Math.min(98, warnThreshold + 2);
      d3.select("#crit-slider").property("value", critThreshold);
      d3.select("#crit-val").text(critThreshold + "%");
    }
    d3.select("#warn-val").text(warnThreshold + "%");
    update();
  });

  d3.select("#crit-slider").on("input", function() {
    critThreshold = +this.value;
    if (critThreshold <= warnThreshold) {
      warnThreshold = Math.max(40, critThreshold - 2);
      d3.select("#warn-slider").property("value", warnThreshold);
      d3.select("#warn-val").text(warnThreshold + "%");
    }
    d3.select("#crit-val").text(critThreshold + "%");
    update();
  });

  d3.selectAll(".header-cell").on("click", function() {
    const key = d3.select(this).attr("data-key");
    if (sortKey === key) sortAsc = !sortAsc;
    else {
      sortKey = key;
      sortAsc = (key === "name" || key === "uptime" || key === "req"); // Default sort directions
    }
    update();
  });

  // --- Initialize ---
  update();
})();
</script>
</body>
</html>
