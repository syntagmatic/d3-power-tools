<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Normal QQ Plot with Confidence Envelope</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #2d3436;
      --accent-color: #0984e3;
      --danger-color: #d63031;
      --envelope-color: rgba(9, 132, 227, 0.15);
      --grid-color: #dfe6e9;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #container {
      background: var(--bg-color);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 5px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #636e72;
      margin-bottom: 25px;
      text-align: center;
    }

    .axis text {
      font-size: 11px;
      fill: #636e72;
    }

    .axis line, .axis path {
      stroke: var(--grid-color);
    }

    .grid line {
      stroke: var(--grid-color);
      stroke-opacity: 0.7;
      shape-rendering: crispEdges;
    }

    .grid path {
      stroke-width: 0;
    }

    .qq-point {
      stroke-width: 1px;
      transition: r 0.2s ease, stroke-width 0.2s ease;
    }

    .qq-point.outside {
      fill: var(--danger-color);
      stroke: #a01a1a;
    }

    .reference-line {
      stroke: #636e72;
      stroke-width: 1.5;
      stroke-dasharray: 4, 4;
    }

    .envelope {
      fill: var(--envelope-color);
      stroke: none;
    }

    .tooltip {
      position: absolute;
      padding: 10px;
      background: rgba(45, 52, 54, 0.95);
      color: white;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .tooltip div { margin-bottom: 4px; }
    .tooltip div:last-child { margin-bottom: 0; }
    .tooltip span { font-weight: 700; color: #74b9ff; }

    .inset-box {
      fill: #fdfdfd;
      stroke: #dfe6e9;
      stroke-width: 1;
    }

    .histogram-bar {
      fill: #b2bec3;
      opacity: 0.7;
    }

    .density-curve {
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 2;
    }

    .normal-overlay {
      fill: none;
      stroke: #636e72;
      stroke-width: 1.5;
      stroke-dasharray: 3, 2;
    }
  </style>
</head>
<body>

<div id="container">
  <div class="title">Normal Q-Q Plot</div>
  <div class="subtitle">Mixture: 80% Normal + 20% Shifted (N=200)</div>
  <div id="vis"></div>
  <div class="tooltip" id="tooltip"></div>
</div>

<script>
  // Configuration
  const width = 600;
  const height = 500;
  const margin = { top: 40, right: 40, bottom: 60, left: 60 };
  const innerWidth = width - margin.left - margin.right;
  const innerHeight = height - margin.top - margin.bottom;

  const n = 200;
  const seed = 42;

  // 1. Data Generation (80% Normal + 20% Shifted)
  const random = d3.randomLcg(seed / 100);
  const genNormal = d3.randomNormal.source(random)(0, 1);
  const genShifted = d3.randomNormal.source(random)(3, 1);
  
  const rawData = Array.from({ length: n }, () => {
    return random() < 0.8 ? genNormal() : genShifted();
  });

  // Sort data for quantiles
  const sortedData = [...rawData].sort((a, b) => a - b);
  const mean = d3.mean(sortedData);
  const std = d3.deviation(sortedData);
  const standardizedData = sortedData.map(d => (d - mean) / std);

  // 2. Normal Quantile Function (Rational approximation)
  function qnorm(p) {
    // Beasley-Springer-Moro approximation
    const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
    const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
    const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
    const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
    
    if (p <= 0) return -5;
    if (p >= 1) return 5;
    
    let q, r;
    if (p < 0.02425) {
      q = Math.sqrt(-2 * Math.log(p));
      return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
             ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    } else if (p <= 0.97575) {
      q = p - 0.5;
      r = q * q;
      return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q /
             (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
    } else {
      q = Math.sqrt(-2 * Math.log(1 - p));
      return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
              ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    }
  }

  function pnorm(x) {
    return 0.5 * (1 + erf(x / Math.sqrt(2)));
  }

  function erf(x) {
    // approximation
    const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
    const sign = (x < 0) ? -1 : 1;
    x = Math.abs(x);
    const t = 1.0 / (1.0 + p * x);
    const y = 1.0 - (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1) * t * Math.exp(-x * x);
    return sign * y;
  }

  // 3. Calculate QQ Data Points
  const qqPoints = sortedData.map((d, i) => {
    // Fractional rank (Blom's plotting position is common: (i - 0.375) / (n + 0.25))
    const p = (i + 1 - 0.5) / n;
    const theoreticalZ = qnorm(p);
    const sampleZ = (d - mean) / std;
    
    // Confidence Band SE
    // SE(z_p) = sqrt(p(1-p)/n) / phi(z_p)
    const phi = Math.exp(-0.5 * theoreticalZ * theoreticalZ) / Math.sqrt(2 * Math.PI);
    const se = Math.sqrt(p * (1 - p) / n) / phi;
    const marginOfError = 1.96 * se;

    return {
      value: d,
      theoreticalZ,
      sampleZ,
      upper: theoreticalZ + marginOfError,
      lower: theoreticalZ - marginOfError,
      outside: sampleZ > theoreticalZ + marginOfError || sampleZ < theoreticalZ - marginOfError
    };
  });

  // 4. Scales
  const xExtent = d3.extent(qqPoints, d => d.theoreticalZ);
  const yExtent = d3.extent(qqPoints, d => d.sampleZ);
  const absMax = Math.max(Math.abs(xExtent[0]), Math.abs(xExtent[1]), Math.abs(yExtent[0]), Math.abs(yExtent[1])) + 0.5;

  const xScale = d3.scaleLinear()
    .domain([-absMax, absMax])
    .range([0, innerWidth]);

  const yScale = d3.scaleLinear()
    .domain([-absMax, absMax])
    .range([innerHeight, 0]);

  // 5. SVG Setup
  const svg = d3.select("#vis").append("svg")
    .attr("width", width)
    .attr("height", height);

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // Grid lines
  g.append("g")
    .attr("class", "grid")
    .attr("transform", `translate(0,${innerHeight})`)
    .call(d3.axisBottom(xScale).tickSize(-innerHeight).tickFormat(""));

  g.append("g")
    .attr("class", "grid")
    .call(d3.axisLeft(yScale).tickSize(-innerWidth).tickFormat(""));

  // 6. Confidence Envelope
  const areaGenerator = d3.area()
    .x(d => xScale(d.theoreticalZ))
    .y0(d => yScale(d.lower))
    .y1(d => yScale(d.upper))
    .curve(d3.curveMonotoneX);

  g.append("path")
    .datum(qqPoints)
    .attr("class", "envelope")
    .attr("d", areaGenerator);

  // 7. Reference Line (y=x)
  g.append("line")
    .attr("class", "reference-line")
    .attr("x1", xScale(-absMax))
    .attr("y1", yScale(-absMax))
    .attr("x2", xScale(absMax))
    .attr("y2", yScale(absMax));

  // 8. Axes
  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${innerHeight})`)
    .call(d3.axisBottom(xScale));

  g.append("g")
    .attr("class", "axis")
    .call(d3.axisLeft(yScale));

  // Axis Labels
  g.append("text")
    .attr("x", innerWidth / 2)
    .attr("y", innerHeight + 40)
    .attr("text-anchor", "middle")
    .attr("fill", "#636e72")
    .style("font-size", "12px")
    .text("Theoretical Quantiles (Normal)");

  g.append("text")
    .attr("transform", "rotate(-90)")
    .attr("x", -innerHeight / 2)
    .attr("y", -45)
    .attr("text-anchor", "middle")
    .attr("fill", "#636e72")
    .style("font-size", "12px")
    .text("Sample Quantiles (Standardized)");

  // 9. QQ Points
  const tooltip = d3.select("#tooltip");

  g.selectAll(".qq-point")
    .data(qqPoints)
    .enter()
    .append("circle")
    .attr("class", d => `qq-point ${d.outside ? "outside" : ""}`)
    .attr("cx", d => xScale(d.theoreticalZ))
    .attr("cy", d => yScale(d.sampleZ))
    .attr("r", 4)
    .attr("fill", d => d.outside ? "var(--danger-color)" : "var(--accent-color)")
    .attr("opacity", 0.7)
    .on("mouseover", function(event, d) {
      d3.select(this).attr("r", 6).attr("opacity", 1);
      tooltip.style("opacity", 1)
        .html(`
          <div>Value: <span>${d.value.toFixed(2)}</span></div>
          <div>Z-Score: <span>${d.sampleZ.toFixed(2)}</span></div>
          <div>Theoretical: <span>${d.theoreticalZ.toFixed(2)}</span></div>
        `);
    })
    .on("mousemove", function(event) {
      tooltip.style("left", (event.pageX + 15) + "px")
             .style("top", (event.pageY - 28) + "px");
    })
    .on("mouseout", function() {
      d3.select(this).attr("r", 4).attr("opacity", 0.7);
      tooltip.style("opacity", 0);
    });

  // 10. Inset Histogram
  const insetWidth = 140;
  const insetHeight = 100;
  const insetX = 20;
  const insetY = 20;

  const insetG = g.append("g")
    .attr("transform", `translate(${insetX}, ${insetY})`);

  insetG.append("rect")
    .attr("class", "inset-box")
    .attr("width", insetWidth)
    .attr("height", insetHeight)
    .attr("rx", 4);

  const histX = d3.scaleLinear()
    .domain(d3.extent(rawData))
    .range([10, insetWidth - 10]);

  const bins = d3.bin()
    .domain(histX.domain())
    .thresholds(15)(rawData);

  const histY = d3.scaleLinear()
    .domain([0, d3.max(bins, d => d.length)])
    .range([insetHeight - 10, 10]);

  insetG.selectAll(".histogram-bar")
    .data(bins)
    .enter()
    .append("rect")
    .attr("class", "histogram-bar")
    .attr("x", d => histX(d.x0) + 1)
    .attr("y", d => histY(d.length))
    .attr("width", d => Math.max(0, histX(d.x1) - histX(d.x0) - 1))
    .attr("height", d => insetHeight - 10 - histY(d.length));

  // Inset Density Curve (Mixture)
  const densityData = d3.range(histX.domain()[0], histX.domain()[1], 0.1).map(x => {
    // Mixture PDF: 0.8 * N(0,1) + 0.2 * N(3,1)
    const pdf1 = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * x * x);
    const pdf2 = (1 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * (x - 3) * (x - 3));
    return { x, y: 0.8 * pdf1 + 0.2 * pdf2 };
  });

  const densityY = d3.scaleLinear()
    .domain([0, d3.max(densityData, d => d.y)])
    .range([insetHeight - 10, 10]);

  const lineGen = d3.line()
    .x(d => histX(d.x))
    .y(d => densityY(d.y))
    .curve(d3.curveBasis);

  insetG.append("path")
    .datum(densityData)
    .attr("class", "density-curve")
    .attr("d", lineGen);

  // Normal Overlay (Standard Normal for comparison)
  const normalOverlayData = d3.range(histX.domain()[0], histX.domain()[1], 0.1).map(x => {
    // Scaled to match the mixture mean and std
    const z = (x - mean) / std;
    const pdf = (1 / (std * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * z * z);
    return { x, y: pdf };
  });

  const overlayLineGen = d3.line()
    .x(d => histX(d.x))
    .y(d => densityY(d.y))
    .curve(d3.curveBasis);

  insetG.append("path")
    .datum(normalOverlayData)
    .attr("class", "normal-overlay")
    .attr("d", overlayLineGen);

  insetG.append("text")
    .attr("x", insetWidth / 2)
    .attr("y", insetHeight - 2)
    .attr("text-anchor", "middle")
    .style("font-size", "8px")
    .attr("fill", "#636e72")
    .text("Value Distribution");

</script>
</body>
</html>
