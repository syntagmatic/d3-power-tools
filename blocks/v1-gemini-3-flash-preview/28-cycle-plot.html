<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Sales Cycle Plot (2021-2025)</title>
    <style>
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --color-bg: #ffffff;
            --color-text: #1a1a1a;
            --color-text-muted: #666666;
            --color-border: #eeeeee;
            --color-accent: #2c7bb6;
            --color-mean: #d7191c;
            --color-holiday: #fdae61;
            --color-grid: #f5f5f5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #1a1a1a;
                --color-text: #e0e0e0;
                --color-text-muted: #999999;
                --color-border: #333333;
                --color-accent: #5dade2;
                --color-mean: #ec7063;
                --color-holiday: #f5b041;
                --color-grid: #262626;
            }
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 14px;
            color: var(--color-text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        #chart {
            width: 100%;
            overflow-x: auto;
        }

        svg {
            display: block;
            margin: 0 auto;
        }

        .axis-label {
            font-size: 11px;
            fill: var(--color-text-muted);
        }

        .month-label {
            font-size: 13px;
            font-weight: 600;
            fill: var(--color-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .year-label {
            font-size: 10px;
            fill: var(--color-text-muted);
        }

        .mean-line {
            stroke: var(--color-mean);
            stroke-width: 1.5;
            stroke-dasharray: 3, 2;
            opacity: 0.8;
        }

        .trend-line {
            fill: none;
            stroke: var(--color-accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .data-point {
            fill: var(--color-bg);
            stroke: var(--color-accent);
            stroke-width: 2;
        }

        .extreme-label {
            font-size: 10px;
            font-weight: 700;
        }

        .high-label {
            fill: #27ae60;
        }

        .low-label {
            fill: #c0392b;
        }

        .holiday-bracket {
            stroke: var(--color-holiday);
            stroke-width: 2;
            fill: none;
        }

        .holiday-text {
            fill: var(--color-holiday);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .panel-bg {
            fill: var(--color-grid);
            opacity: 0.3;
        }

        .grid-line {
            stroke: var(--color-border);
            stroke-width: 1;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 32px;
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Retail Sales Performance Analysis</h1>
        <p class="subtitle">A monthly cycle plot showing year-over-year trends (2021&ndash;2025). Each panel isolates a specific month to reveal seasonal growth patterns independent of the calendar sequence.</p>
    </header>

    <div id="chart"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-swatch" style="background-color: var(--color-accent);"></div>
            <span>Year-over-Year Trend</span>
        </div>
        <div class="legend-item">
            <div class="legend-swatch" style="border: 2px solid var(--color-mean); height: 0; width: 20px; border-style: dashed;"></div>
            <span>Monthly Average (5-Year)</span>
        </div>
        <div class="legend-item">
            <div class="legend-swatch" style="background-color: var(--color-holiday);"></div>
            <span>Holiday Season</span>
        </div>
    </div>
</div>

<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // --- Configuration ---
    const margin = { top: 60, right: 30, bottom: 40, left: 60 };
    const panelWidth = 80;
    const panelHeight = 350;
    const padding = 15;
    const totalWidth = margin.left + (panelWidth * 12) + margin.right;
    const totalHeight = margin.top + panelHeight + margin.bottom;

    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const years = [2021, 2022, 2023, 2024, 2025];

    // --- Data Generation ---
    const seed = 42;
    const random = d3.randomNormal.source(d3.randomLcg(seed))(0, 1);

    const generateData = () => {
        const data = [];
        const baseSales = 120; // in thousands
        const annualGrowth = 0.06;
        const seasonalFactors = [0.8, 0.75, 0.95, 1.05, 1.1, 1.05, 1.0, 1.02, 1.1, 1.2, 1.6, 2.1];

        years.forEach((year, yIdx) => {
            const growthFactor = Math.pow(1 + annualGrowth, yIdx);
            months.forEach((month, mIdx) => {
                const noise = 1 + (random() * 0.05);
                const value = baseSales * growthFactor * seasonalFactors[mIdx] * noise;
                data.push({
                    year,
                    month,
                    monthIdx: mIdx,
                    value: value
                });
            });
        });
        return data;
    };

    const data = generateData();
    const dataByMonth = d3.group(data, d => d.month);

    // --- Scales ---
    const x = d3.scalePoint()
        .domain(years)
        .range([padding, panelWidth - padding]);

    const y = d3.scaleLinear()
        .domain([0, d3.max(data, d => d.value) * 1.1])
        .range([panelHeight, 0])
        .nice();

    // --- Visualization ---
    const svg = d3.select("#chart")
        .append("svg")
        .attr("width", totalWidth)
        .attr("height", totalHeight)
        .attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`)
        .style("max-width", "100%")
        .style("height", "auto");

    const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    // Y Axis (shared)
    const yAxis = d3.axisLeft(y)
        .ticks(8)
        .tickFormat(d => `$${d}k`)
        .tickSize(-totalWidth + margin.left + margin.right);

    const yAxisG = g.append("g")
        .attr("class", "axis")
        .call(yAxis);

    yAxisG.selectAll(".tick line")
        .attr("class", "grid-line");
    yAxisG.select(".domain").remove();

    // Find global extremes
    const globalMax = d3.greatest(data, d => d.value);
    const globalMin = d3.least(data, d => d.value);

    // Render Panels
    months.forEach((month, i) => {
        const monthData = dataByMonth.get(month);
        const meanValue = d3.mean(monthData, d => d.value);
        
        const panel = g.append("g")
            .attr("transform", `translate(${i * panelWidth}, 0)`);

        // Subtle background for alternating panels
        if (i % 2 === 0) {
            panel.append("rect")
                .attr("class", "panel-bg")
                .attr("width", panelWidth)
                .attr("height", panelHeight);
        }

        // Panel vertical divider
        if (i > 0) {
            panel.append("line")
                .attr("x1", 0)
                .attr("x2", 0)
                .attr("y1", 0)
                .attr("y2", panelHeight)
                .attr("stroke", "var(--color-border)");
        }

        // Monthly Mean Line
        panel.append("line")
            .attr("class", "mean-line")
            .attr("x1", 5)
            .attr("x2", panelWidth - 5)
            .attr("y1", y(meanValue))
            .attr("y2", y(meanValue));

        // Trend Line
        const line = d3.line()
            .x(d => x(d.year))
            .y(d => y(d.value));

        panel.append("path")
            .datum(monthData)
            .attr("class", "trend-line")
            .attr("d", line);

        // Data Points
        panel.selectAll(".data-point")
            .data(monthData)
            .enter()
            .append("circle")
            .attr("class", "data-point")
            .attr("cx", d => x(d.year))
            .attr("cy", d => y(d.value))
            .attr("r", 3.5);

        // Month Labels
        panel.append("text")
            .attr("class", "month-label")
            .attr("x", panelWidth / 2)
            .attr("y", -15)
            .attr("text-anchor", "middle")
            .text(month);

        // Year labels for first and last panel, or every 2nd
        if (i === 0 || i === 11) {
            years.forEach(year => {
                panel.append("text")
                    .attr("class", "year-label")
                    .attr("x", x(year))
                    .attr("y", panelHeight + 15)
                    .attr("text-anchor", "middle")
                    .text(`'${String(year).slice(2)}`);
            });
        }

        // High/Low Labels
        monthData.forEach(d => {
            if (d === globalMax) {
                panel.append("text")
                    .attr("class", "extreme-label high-label")
                    .attr("x", x(d.year))
                    .attr("y", y(d.value) - 10)
                    .attr("text-anchor", "middle")
                    .text("HIGH");
                
                panel.append("text")
                    .attr("class", "year-label")
                    .attr("x", x(d.year))
                    .attr("y", y(d.value) - 22)
                    .attr("text-anchor", "middle")
                    .style("font-weight", "bold")
                    .text(`$${Math.round(d.value)}k`);
            }
            if (d === globalMin) {
                panel.append("text")
                    .attr("class", "extreme-label low-label")
                    .attr("x", x(d.year))
                    .attr("y", y(d.value) + 15)
                    .attr("text-anchor", "middle")
                    .text("LOW");

                panel.append("text")
                    .attr("class", "year-label")
                    .attr("x", x(d.year))
                    .attr("y", y(d.value) + 27)
                    .attr("text-anchor", "middle")
                    .style("font-weight", "bold")
                    .text(`$${Math.round(d.value)}k`);
            }
        });
    });

    // --- Holiday Season Bracket ---
    const holidayStart = 10 * panelWidth + padding;
    const holidayEnd = 11 * panelWidth + panelWidth - padding;
    const bracketY = -40;

    const bracketPath = d3.path();
    bracketPath.moveTo(holidayStart, bracketY + 8);
    bracketPath.lineTo(holidayStart, bracketY);
    bracketPath.lineTo(holidayEnd, bracketY);
    bracketPath.lineTo(holidayEnd, bracketY + 8);

    g.append("path")
        .attr("class", "holiday-bracket")
        .attr("d", bracketPath.toString());

    g.append("text")
        .attr("class", "holiday-text")
        .attr("x", (holidayStart + holidayEnd) / 2)
        .attr("y", bracketY - 6)
        .attr("text-anchor", "middle")
        .text("Holiday Season Peak");

</script>

</body>
</html>
