<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjacency Matrix Reordering</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-color: #333;
            --matrix-empty: #f0f0f0;
            --matrix-hover: #e0e0e0;
            --highlight: #ffcc00;
            --primary: #4682b4;
            --secondary: #ff7f0e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:hover {
            background: #eee;
        }

        button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        #viz {
            position: relative;
        }

        .node-label {
            font-size: 10px;
            cursor: default;
        }

        .matrix-cell {
            stroke: #fff;
            stroke-width: 0.5px;
        }

        .bar {
            fill: var(--primary);
            opacity: 0.7;
        }

        .bar-label {
            font-size: 9px;
            fill: #666;
        }

        .guide {
            stroke: #999;
            stroke-dasharray: 2,2;
            pointer-events: none;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="order-name" class="active">Order by Name</button>
        <button id="order-degree">Order by Degree</button>
        <button id="order-community">Order by Community</button>
    </div>

    <div id="viz"></div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        const nNodes = 35;
        const nCommunities = 5;
        const width = 600;
        const height = 600;
        const margin = { top: 100, right: 150, bottom: 20, left: 100 };
        const matrixSize = width - margin.left - margin.right;
        const barWidth = 100;

        // Colors for communities
        const colorScale = d3.scaleOrdinal(d3.schemeTableau10);

        // 1. Data Generation
        const nodes = d3.range(nNodes).map(i => ({
            id: i,
            name: `Node ${String.fromCharCode(65 + (i % 26))}${i >= 26 ? Math.floor(i / 26) : ""}`,
            community: Math.floor(i / (nNodes / nCommunities)),
            degree: 0
        }));

        const links = [];
        const matrix = [];

        // Initialize matrix
        for (let i = 0; i < nNodes; i++) {
            matrix[i] = d3.range(nNodes).map(j => ({ x: j, y: i, z: 0 }));
        }

        // Generate ~200 weighted edges
        let edgeCount = 0;
        while (edgeCount < 200) {
            const i = Math.floor(Math.random() * nNodes);
            const j = Math.floor(Math.random() * nNodes);
            if (i === j) continue;

            const sameComm = nodes[i].community === nodes[j].community;
            const prob = sameComm ? 0.6 : 0.05;

            if (Math.random() < prob) {
                const weight = sameComm ? Math.random() * 0.8 + 0.2 : Math.random() * 0.4;
                if (matrix[i][j].z === 0) {
                    matrix[i][j].z = weight;
                    matrix[j][i].z = weight; // Undirected
                    nodes[i].degree += weight;
                    nodes[j].degree += weight;
                    links.push({ source: i, target: j, weight });
                    edgeCount++;
                }
            }
        }

        // 2. Setup Scales
        const x = d3.scaleBand().range([0, matrixSize]).padding(0.05);
        const y = d3.scaleBand().range([0, matrixSize]).padding(0.05);
        const opacity = d3.scaleLinear().domain([0, 1]).range([0, 1]).clamp(true);
        const barScale = d3.scaleLinear().domain([0, d3.max(nodes, d => d.degree)]).range([0, barWidth]);

        const svg = d3.select("#viz")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Orders
        const orders = {
            name: d3.range(nNodes).sort((a, b) => d3.ascending(nodes[a].name, nodes[b].name)),
            degree: d3.range(nNodes).sort((a, b) => d3.descending(nodes[a].degree, nodes[b].degree)),
            community: d3.range(nNodes).sort((a, b) => {
                if (nodes[a].community !== nodes[b].community) {
                    return nodes[a].community - nodes[b].community;
                }
                return d3.ascending(nodes[a].name, nodes[b].name);
            })
        };

        x.domain(orders.name);
        y.domain(orders.name);

        // Background
        g.append("rect")
            .attr("class", "background")
            .attr("width", matrixSize)
            .attr("height", matrixSize)
            .attr("fill", "#fff");

        // 3. Render Matrix
        const row = g.selectAll(".row")
            .data(matrix)
            .enter().append("g")
            .attr("class", "row")
            .attr("transform", (d, i) => `translate(0,${y(i)})`);

        const cell = row.selectAll(".matrix-cell")
            .data(d => d.filter(item => item.z > 0))
            .enter().append("rect")
            .attr("class", "matrix-cell")
            .attr("x", d => x(d.x))
            .attr("width", x.bandwidth())
            .attr("height", y.bandwidth())
            .style("fill-opacity", d => opacity(d.z))
            .style("fill", d => {
                return nodes[d.x].community === nodes[d.y].community 
                    ? colorScale(nodes[d.x].community) 
                    : "#666";
            })
            .on("mouseover", mouseover)
            .on("mouseout", mouseout);

        // Row Labels
        row.append("text")
            .attr("class", "node-label")
            .attr("x", -6)
            .attr("y", y.bandwidth() / 2)
            .attr("dy", ".32em")
            .attr("text-anchor", "end")
            .text((d, i) => nodes[i].name)
            .style("fill", (d, i) => colorScale(nodes[i].community));

        // Column Labels
        const column = g.selectAll(".column")
            .data(nodes)
            .enter().append("g")
            .attr("class", "column")
            .attr("transform", (d, i) => `translate(${x(i)},0)rotate(-90)`);

        column.append("text")
            .attr("class", "node-label")
            .attr("x", 6)
            .attr("y", x.bandwidth() / 2)
            .attr("dy", ".32em")
            .attr("text-anchor", "start")
            .text((d, i) => d.name)
            .style("fill", d => colorScale(d.community));

        // 4. Side Bar Chart (Degree)
        const rowBars = g.selectAll(".row-bar")
            .data(nodes)
            .enter().append("rect")
            .attr("class", "bar row-bar")
            .attr("x", matrixSize + 10)
            .attr("y", d => y(d.id))
            .attr("height", y.bandwidth())
            .attr("width", d => barScale(d.degree))
            .style("fill", d => colorScale(d.community));

        const colBars = g.selectAll(".col-bar")
            .data(nodes)
            .enter().append("rect")
            .attr("class", "bar col-bar")
            .attr("x", d => x(d.id))
            .attr("y", -margin.top + 20)
            .attr("width", x.bandwidth())
            .attr("height", d => barScale(d.degree))
            .style("fill", d => colorScale(d.community));

        // Guides
        const hGuide = g.append("line").attr("class", "guide").attr("opacity", 0);
        const vGuide = g.append("line").attr("class", "guide").attr("opacity", 0);

        function mouseover(event, d) {
            d3.selectAll(".row text").classed("active", (p, i) => i === d.y);
            d3.selectAll(".column text").classed("active", (p, i) => i === d.x);

            hGuide.attr("x1", 0).attr("x2", matrixSize + barWidth + 10)
                  .attr("y1", y(d.y) + y.bandwidth()/2).attr("y2", y(d.y) + y.bandwidth()/2)
                  .attr("opacity", 1);
            
            vGuide.attr("y1", -margin.top + 20).attr("y2", matrixSize)
                  .attr("x1", x(d.x) + x.bandwidth()/2).attr("x2", x(d.x) + x.bandwidth()/2)
                  .attr("opacity", 1);

            const tooltip = d3.select("#tooltip");
            tooltip.style("opacity", 1)
                .html(`<strong>${nodes[d.y].name} &harr; ${nodes[d.x].name}</strong><br>Weight: ${d.z.toFixed(2)}`)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
        }

        function mouseout() {
            d3.selectAll("text").classed("active", false);
            hGuide.attr("opacity", 0);
            vGuide.attr("opacity", 0);
            d3.select("#tooltip").style("opacity", 0);
        }

        // 5. Reordering Logic
        function updateOrder(value) {
            const newOrder = orders[value];
            x.domain(newOrder);
            y.domain(newOrder);

            const t = g.transition().duration(2000);

            t.selectAll(".row")
                .delay((d, i) => x(i) * 2)
                .attr("transform", (d, i) => `translate(0,${y(i)})`);

            t.selectAll(".matrix-cell")
                .delay(d => x(d.x) * 2)
                .attr("x", d => x(d.x));

            t.selectAll(".column")
                .delay((d, i) => x(i) * 2)
                .attr("transform", (d, i) => `translate(${x(i)},0)rotate(-90)`);

            t.selectAll(".row-bar")
                .delay((d, i) => x(i) * 2)
                .attr("y", d => y(d.id));

            t.selectAll(".col-bar")
                .delay((d, i) => x(i) * 2)
                .attr("x", d => x(d.id));
        }

        d3.select("#order-name").on("click", function() {
            d3.selectAll("button").classed("active", false);
            d3.select(this).classed("active", true);
            updateOrder("name");
        });

        d3.select("#order-degree").on("click", function() {
            d3.selectAll("button").classed("active", false);
            d3.select(this).classed("active", true);
            updateOrder("degree");
        });

        d3.select("#order-community").on("click", function() {
            d3.selectAll("button").classed("active", false);
            d3.select(this).classed("active", true);
            updateOrder("community");
        });

    </script>
</body>
</html>
