<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hierarchy Data Table - D3 Power Tools</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e0e0e0;
    --hover: #f5f9ff;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --folder: #f59e0b;
    --file: #94a3b8;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: #f8fafc;
    color: var(--text);
    padding: 2rem;
    line-height: 1.5;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--bg);
    border-radius: 8px;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .header {
    padding: 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }

  .controls {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .search-wrapper {
    position: relative;
    width: 300px;
  }

  .search-wrapper input {
    width: 100%;
    padding: 0.5rem 0.75rem 0.5rem 2.25rem;
    font-size: 0.875rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-wrapper input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }

  .search-icon {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .stats { font-size: 0.75rem; color: var(--muted); font-weight: 500; }

  .table-scroll {
    overflow-x: auto;
    max-height: 700px;
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.875rem;
  }

  thead {
    position: sticky;
    top: 0;
    background: #fdfdfd;
    z-index: 10;
  }

  th {
    padding: 0.75rem 1rem;
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 2px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
  }

  th:hover {
    background: #f1f5f9;
    color: var(--text);
  }

  th.sort-active {
    color: var(--accent);
    background: var(--accent-bg);
  }

  th .sort-indicator {
    display: inline-block;
    width: 1rem;
    text-align: center;
    margin-left: 0.25rem;
    font-size: 0.75rem;
  }

  tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--hover); }
  tbody tr:nth-child(even) { background: #fafafa; }
  tbody tr:nth-child(even):hover { background: var(--hover); }

  td {
    padding: 0.625rem 1rem;
    border-bottom: 1px solid #f1f5f9;
    white-space: nowrap;
    vertical-align: middle;
  }

  .name-cell {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.2s;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .toggle:hover {
    background: var(--border);
    color: var(--text);
  }

  .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .icon-folder { color: var(--folder); }
  .icon-file { color: var(--file); }

  .name-text { font-weight: 500; }
  .folder-row .name-text { color: var(--text); font-weight: 600; }
  .match { background: #fef08a; border-radius: 2px; }

  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .spark-bar-container {
    width: 80px;
    height: 8px;
    background: #f1f5f9;
    border-radius: 4px;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
  }

  .spark-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
  }

  .donut-container {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .footer {
    padding: 1rem 1.5rem;
    background: #f8fafc;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--muted);
    text-align: right;
  }

  /* Custom scrollbar */
  .table-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .table-scroll::-webkit-scrollbar-track { background: transparent; }
  .table-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .table-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>File System Explorer</h1>
    <div class="controls">
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search files and folders..." aria-label="Search">
      </div>
      <div class="stats" id="table-stats"></div>
    </div>
  </div>

  <div class="table-scroll">
    <table id="hierarchy-table">
      <thead>
        <tr>
          <th data-key="name" style="width: 350px;">Name<span class="sort-indicator"></span></th>
          <th data-key="size" class="num" style="width: 120px;">Size<span class="sort-indicator"></span></th>
          <th data-key="proportion" style="width: 120px;">Proportion<span class="sort-indicator"></span></th>
          <th data-key="share" style="width: 80px; text-align: center;">Share<span class="sort-indicator"></span></th>
          <th data-key="count" class="num" style="width: 100px;">Files<span class="sort-indicator"></span></th>
          <th data-key="modified" style="width: 150px;">Modified<span class="sort-indicator"></span></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="footer">
    Use search to auto-expand hierarchy. Sort columns within each level.
  </div>
</div>

<script>
(() => {
  // --- Data Generation ---
  const rng = d3.randomLcg(123);
  const rand = (min, max) => min + rng() * (max - min);
  const randInt = (min, max) => Math.floor(rand(min, max + 1));
  const pick = arr => arr[randInt(0, arr.length - 1)];

  const dirNames = ['src', 'public', 'tests', 'docs', 'node_modules', 'assets', 'dist', 'config', 'scripts', 'lib'];
  const fileNames = ['index', 'utils', 'styles', 'main', 'app', 'core', 'helpers', 'types', 'constants', 'api', 'setup', 'test', 'README', 'LICENSE'];
  const extensions = ['.js', '.ts', '.tsx', '.json', '.md', '.css', '.svg', '.png', '.html', '.yml'];

  const generateData = () => {
    const nodes = [];
    let idCounter = 0;

    const root = {
      id: "root",
      parentId: null,
      name: "d3-power-tools",
      type: "folder",
      modified: new Date(2025, 11, 28)
    };
    nodes.push(root);

    const createLevel = (parent, depth, count) => {
      if (depth > 3) return;
      const numChildren = count || randInt(3, 8);

      for (let i = 0; i < numChildren; i++) {
        const id = `node-${++idCounter}`;
        const isFolder = depth < 2 ? (rng() > 0.3) : (rng() > 0.7);
        const name = isFolder ? pick(dirNames) + (rng() > 0.8 ? `-${i}` : '') : pick(fileNames) + pick(extensions);

        const node = {
          id,
          parentId: parent.id,
          name,
          type: isFolder ? "folder" : "file",
          modified: new Date(2026, randInt(0, 2), randInt(1, 28)),
          size: isFolder ? 0 : Math.pow(10, rand(1, 6)) // 10B to 1MB
        };

        nodes.push(node);
        if (isFolder) createLevel(node, depth + 1);
      }
    };

    createLevel(root, 0, 10);
    return nodes;
  };

  const rawData = generateData();
  const stratify = d3.stratify().id(d => d.id).parentId(d => d.parentId);
  const rootNode = stratify(rawData);

  // Roll up sizes and file counts
  rootNode.sum(d => d.type === 'file' ? d.size : 0);
  rootNode.eachAfter(d => {
    if (d.data.type === 'folder') {
      d.data.size = d.value;
      d.data.fileCount = d.leaves().filter(l => l.data.type === 'file').length;
    } else {
      d.data.fileCount = 1;
    }
  });

  // --- State ---
  const state = {
    expanded: new Set(["root"]),
    sortBy: "name",
    sortAsc: true,
    search: ""
  };

  // --- Helpers ---
  const formatSize = (bytes) => {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  };

  const formatDate = d3.timeFormat("%Y-%m-%d %H:%M");

  const highlight = (text, query) => {
    if (!query) return text;
    const parts = text.split(new RegExp(`(${query})`, 'gi'));
    return parts.map(p => p.toLowerCase() === query.toLowerCase() ? `<span class="match">${p}</span>` : p).join('');
  };

  const getVisibleRows = () => {
    const visible = [];
    const query = state.search.toLowerCase();

    // Search logic: if child matches, parent must be expanded
    const matches = new Set();
    if (query) {
      rootNode.descendants().forEach(d => {
        if (d.data.name.toLowerCase().includes(query)) {
          matches.add(d.id);
          let p = d.parent;
          while (p) {
            state.expanded.add(p.id);
            matches.add(p.id);
            p = p.parent;
          }
        }
      });
    }

    const traverse = (node) => {
      if (query && !matches.has(node.id)) return;
      visible.push(node);

      if (state.expanded.has(node.id) && node.children) {
        // Sort children
        const sorted = [...node.children].sort((a, b) => {
          // Folders always first? Or follow sort? Usually folders first is better for UX
          const typeA = a.data.type === 'folder' ? 0 : 1;
          const typeB = b.data.type === 'folder' ? 0 : 1;
          if (typeA !== typeB) return typeA - typeB;

          let va = a.data[state.sortBy];
          let vb = b.data[state.sortBy];

          if (state.sortBy === 'name') {
            va = va.toLowerCase();
            vb = vb.toLowerCase();
          }

          const res = d3.ascending(va, vb);
          return state.sortAsc ? res : -res;
        });

        sorted.forEach(traverse);
      }
    };

    traverse(rootNode);
    return visible;
  };

  // --- Rendering ---
  const table = d3.select("#hierarchy-table");
  const tbody = table.select("tbody");
  const statsEl = d3.select("#table-stats");

  const arc = d3.arc().innerRadius(6).outerRadius(10);
  const pie = d3.pie().value(d => d).sort(null);

  const render = () => {
    const rows = getVisibleRows();
    statsEl.text(`${rows.length} items shown`);

    const tr = tbody.selectAll("tr")
      .data(rows, d => d.id)
      .join(
        enter => enter.append("tr"),
        update => update,
        exit => exit.remove()
      )
      .attr("class", d => d.data.type === 'folder' ? 'folder-row' : 'file-row');

    // Name Column
    tr.selectAll("td.name-col").data(d => [d]).join("td")
      .attr("class", "name-col")
      .html(function(d) {
        const indent = d.depth * 24;
        const toggle = d.children
          ? `<span class="toggle" data-id="${d.id}">${state.expanded.has(d.id) ? '▼' : '▶'}</span>`
          : `<span style="width:20px;display:inline-block"></span>`;

        const icon = d.data.type === 'folder'
          ? `<svg class="icon icon-folder" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>`
          : `<svg class="icon icon-file" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg>`;

        return `
          <div class="name-cell" style="padding-left: ${indent}px">
            ${toggle}
            ${icon}
            <span class="name-text">${highlight(d.data.name, state.search)}</span>
          </div>
        `;
      });

    // Size Column
    tr.selectAll("td.size-col").data(d => [d]).join("td")
      .attr("class", "size-col num")
      .text(d => formatSize(d.data.size));

    // Proportion Column
    tr.selectAll("td.prop-col").data(d => [d]).join("td")
      .attr("class", "prop-col")
      .html(d => {
        const parentSize = d.parent ? d.parent.data.size : d.data.size;
        const pct = parentSize > 0 ? (d.data.size / parentSize) * 100 : 0;
        return `
          <div class="spark-bar-container" title="${pct.toFixed(1)}% of parent">
            <div class="spark-bar-fill" style="width: ${pct}%"></div>
          </div>
        `;
      });

    // Share Column (Donut)
    tr.selectAll("td.share-col").data(d => [d]).join("td")
      .attr("class", "share-col")
      .each(function(d) {
        const parentSize = d.parent ? d.parent.data.size : d.data.size;
        const pct = parentSize > 0 ? d.data.size / parentSize : 1;

        const container = d3.select(this).selectAll("div.donut-container").data([d]).join("div")
          .attr("class", "donut-container");

        const svg = container.selectAll("svg").data([d]).join("svg")
          .attr("width", 24)
          .attr("height", 24);

        const g = svg.selectAll("g").data([d]).join("g")
          .attr("transform", "translate(12,12)");

        const data = [pct, 1 - pct];
        const arcs = pie(data);

        g.selectAll("path")
          .data(arcs)
          .join("path")
          .attr("d", arc)
          .attr("fill", (da, i) => i === 0 ? "#2563eb" : "#e2e8f0");
      });

    // File Count Column
    tr.selectAll("td.count-col").data(d => [d]).join("td")
      .attr("class", "count-col num")
      .text(d => d.data.type === 'folder' ? d.data.fileCount.toLocaleString() : '—');

    // Modified Column
    tr.selectAll("td.mod-col").data(d => [d]).join("td")
      .attr("class", "mod-col")
      .style("color", "var(--muted)")
      .text(d => formatDate(d.data.modified));
  };

  // --- Events ---
  tbody.on("click", (e) => {
    const toggle = e.target.closest(".toggle");
    if (!toggle) return;
    const id = toggle.dataset.id;
    if (state.expanded.has(id)) {
      state.expanded.delete(id);
    } else {
      state.expanded.add(id);
    }
    render();
  });

  d3.select("thead tr").selectAll("th").on("click", function() {
    const key = d3.select(this).attr("data-key");
    if (key === "proportion" || key === "share") return;

    if (state.sortBy === key) {
      state.sortAsc = !state.sortAsc;
    } else {
      state.sortBy = key;
      state.sortAsc = true;
    }

    // Update UI
    d3.selectAll("th").classed("sort-active", false).select(".sort-indicator").text("");
    d3.select(this).classed("sort-active", true)
      .select(".sort-indicator").text(state.sortAsc ? "↑" : "↓");

    render();
  });

  d3.select("#search-input").on("input", function() {
    state.search = this.value;
    render();
  });

  // Initial sort indicator
  d3.select(`th[data-key="${state.sortBy}"]`).classed("sort-active", true).select(".sort-indicator").text("↑");

  render();
})();
</script>
</body>
</html>
