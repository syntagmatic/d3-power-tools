<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrient Treemap Explorer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --color-bg: #fff;
  --color-text: #1a1a1a;
  --color-text-muted: #666;
  --color-border: #ddd;
  --color-surface: #f9f9f9;
  --shadow: 0 2px 8px rgba(0,0,0,0.1);
}

body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  margin: 0;
  padding: 20px;
  line-height: 1.5;
}

header {
  margin-bottom: 20px;
}

h1 {
  font-size: 22px;
  font-weight: 600;
  margin: 0;
}

.subtitle {
  font-size: 14px;
  color: var(--color-text-muted);
  margin-top: 4px;
}

#dashboard {
  display: flex;
  flex-direction: column;
  gap: 24px;
  max-width: 1000px;
  margin: 0 auto;
}

/* Treemap Styling */
.treemap-container {
  position: relative;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  overflow: hidden;
  background: #eee;
}

.breadcrumb {
  padding: 8px 12px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  font-size: 13px;
  display: flex;
  gap: 6px;
  align-items: center;
}

.breadcrumb span {
  cursor: pointer;
  color: #2068a0;
}

.breadcrumb span:hover {
  text-decoration: underline;
}

.breadcrumb span.current {
  color: var(--color-text);
  cursor: default;
  font-weight: 600;
}

.breadcrumb span.current:hover {
  text-decoration: none;
}

svg {
  display: block;
}

.node rect {
  stroke: #fff;
  stroke-width: 1px;
}

.node text {
  font-size: 11px;
  font-weight: 600;
  fill: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  pointer-events: none;
}

/* Parcoords Styling */
.parcoords-container {
  position: relative;
  height: 240px;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  background: var(--color-surface);
}

#pc-canvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}

#pc-svg {
  position: absolute;
  top: 0;
  left: 0;
}

.axis-label {
  font-size: 11px;
  font-weight: 600;
  fill: #444;
}

.tick text {
  font-size: 10px;
  fill: #777;
}

.domain, .tick line {
  stroke: #ccc;
}

/* Legend */
#legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  font-size: 12px;
  margin-top: 8px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 2px;
}

/* Tooltip */
.tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 12px;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.2s;
  box-shadow: var(--shadow);
  line-height: 1.4;
}

.tooltip b {
  font-size: 13px;
  display: block;
  margin-bottom: 2px;
}
</style>
</head>
<body>

<header>
  <h1>Nutrient Treemap Explorer</h1>
  <p class="subtitle">Click groups to zoom. Brush axes below to filter treemap. Hover for details.</p>
</header>

<div id="dashboard">
  <div class="treemap-container">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="treemap"></div>
  </div>

  <div class="parcoords-container">
    <canvas id="pc-canvas"></canvas>
    <svg id="pc-svg"></svg>
  </div>

  <div id="legend"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// --- Data ---
const groupColors = {
  "Fruits": "#4477AA",
  "Vegetables": "#228833",
  "Grains": "#CCBB44",
  "Proteins": "#EE6677",
  "Dairy": "#66CCEE",
  "Nuts & Seeds": "#AA3377",
  "Oils": "#BBBBBB"
};

const rawData = [
  // Fruits
  {name: "Apple", group: "Fruits", calories: 52, protein: 0.3, fat: 0.2, carbs: 14, fiber: 2.4, sugar: 10},
  {name: "Banana", group: "Fruits", calories: 89, protein: 1.1, fat: 0.3, carbs: 23, fiber: 2.6, sugar: 12},
  {name: "Orange", group: "Fruits", calories: 47, protein: 0.9, fat: 0.1, carbs: 12, fiber: 2.4, sugar: 9},
  {name: "Strawberry", group: "Fruits", calories: 32, protein: 0.7, fat: 0.3, carbs: 8, fiber: 2, sugar: 5},
  {name: "Avocado", group: "Fruits", calories: 160, protein: 2, fat: 15, carbs: 9, fiber: 7, sugar: 0.7},
  {name: "Mango", group: "Fruits", calories: 60, protein: 0.8, fat: 0.4, carbs: 15, fiber: 1.6, sugar: 14},
  {name: "Grapes", group: "Fruits", calories: 69, protein: 0.7, fat: 0.2, carbs: 18, fiber: 0.9, sugar: 16},
  // Vegetables
  {name: "Broccoli", group: "Vegetables", calories: 34, protein: 2.8, fat: 0.4, carbs: 7, fiber: 2.6, sugar: 1.7},
  {name: "Spinach", group: "Vegetables", calories: 23, protein: 2.9, fat: 0.4, carbs: 3.6, fiber: 2.2, sugar: 0.4},
  {name: "Carrot", group: "Vegetables", calories: 41, protein: 0.9, fat: 0.2, carbs: 10, fiber: 2.8, sugar: 5},
  {name: "Potato", group: "Vegetables", calories: 77, protein: 2, fat: 0.1, carbs: 17, fiber: 2.2, sugar: 0.8},
  {name: "Kale", group: "Vegetables", calories: 49, protein: 4.3, fat: 0.9, carbs: 9, fiber: 3.6, sugar: 2.3},
  {name: "Tomato", group: "Vegetables", calories: 18, protein: 0.9, fat: 0.2, carbs: 3.9, fiber: 1.2, sugar: 2.6},
  // Grains
  {name: "Rice", group: "Grains", calories: 130, protein: 2.7, fat: 0.3, carbs: 28, fiber: 0.4, sugar: 0.1},
  {name: "Wheat Bread", group: "Grains", calories: 265, protein: 9, fat: 3.2, carbs: 49, fiber: 2.7, sugar: 5},
  {name: "Oats", group: "Grains", calories: 389, protein: 17, fat: 7, carbs: 66, fiber: 11, sugar: 1},
  {name: "Quinoa", group: "Grains", calories: 120, protein: 4.4, fat: 1.9, carbs: 21, fiber: 2.8, sugar: 0.9},
  // Proteins
  {name: "Chicken", group: "Proteins", calories: 165, protein: 31, fat: 3.6, carbs: 0, fiber: 0, sugar: 0},
  {name: "Beef", group: "Proteins", calories: 250, protein: 26, fat: 15, carbs: 0, fiber: 0, sugar: 0},
  {name: "Salmon", group: "Proteins", calories: 208, protein: 20, fat: 13, carbs: 0, fiber: 0, sugar: 0},
  {name: "Tofu", group: "Proteins", calories: 76, protein: 8, fat: 4.8, carbs: 1.9, fiber: 0.3, sugar: 0.6},
  {name: "Lentils", group: "Proteins", calories: 116, protein: 9, fat: 0.4, carbs: 20, fiber: 8, sugar: 1.8},
  // Dairy
  {name: "Milk", group: "Dairy", calories: 42, protein: 3.4, fat: 1, carbs: 5, fiber: 0, sugar: 5},
  {name: "Cheese", group: "Dairy", calories: 402, protein: 25, fat: 33, carbs: 1.3, fiber: 0, sugar: 0.5},
  {name: "Yogurt", group: "Dairy", calories: 59, protein: 10, fat: 0.7, carbs: 3.6, fiber: 0, sugar: 3.2},
  {name: "Butter", group: "Dairy", calories: 717, protein: 0.9, fat: 81, carbs: 0.1, fiber: 0, sugar: 0.1},
  // Nuts & Seeds
  {name: "Almonds", group: "Nuts & Seeds", calories: 579, protein: 21, fat: 50, carbs: 22, fiber: 12, sugar: 4},
  {name: "Walnuts", group: "Nuts & Seeds", calories: 654, protein: 15, fat: 65, carbs: 14, fiber: 7, sugar: 2.6},
  {name: "Chia Seeds", group: "Nuts & Seeds", calories: 486, protein: 17, fat: 31, carbs: 42, fiber: 34, sugar: 0},
  // Oils
  {name: "Olive Oil", group: "Oils", calories: 884, protein: 0, fat: 100, carbs: 0, fiber: 0, sugar: 0},
  {name: "Coconut Oil", group: "Oils", calories: 862, protein: 0, fat: 100, carbs: 0, fiber: 0, sugar: 0}
];

const nutrients = ["calories", "protein", "fat", "carbs", "fiber", "sugar"];
const nutrientLabels = {
  calories: "Calories",
  protein: "Protein (g)",
  fat: "Fat (g)",
  carbs: "Carbs (g)",
  fiber: "Fiber (g)",
  sugar: "Sugar (g)"
};

// --- Hierarchy ---
const groups = d3.group(rawData, d => d.group);
const hierarchyData = {
  name: "All Foods",
  children: Array.from(groups, ([name, children]) => ({
    name,
    children: children.map(c => ({...c, value: c.calories}))
  }))
};

const root = d3.hierarchy(hierarchyData)
  .sum(d => d.value || 0)
  .sort((a, b) => b.value - a.value);

// --- Layout Configuration ---
const width = document.querySelector("#dashboard").clientWidth;
const tmHeight = 400;
const pcHeight = 240;

const margin = {top: 30, right: 40, bottom: 20, left: 40};

// --- Treemap Setup ---
const x = d3.scaleLinear().domain([0, width]).range([0, width]);
const y = d3.scaleLinear().domain([0, tmHeight]).range([0, tmHeight]);

const treemap = d3.treemap()
  .size([width, tmHeight])
  .paddingInner(1)
  .paddingOuter(2)
  .round(true);

treemap(root);

const svg = d3.select("#treemap").append("svg")
  .attr("width", width)
  .attr("height", tmHeight)
  .attr("viewBox", `0 0 ${width} ${tmHeight}`);

let focus = root;
let hoveredNode = null;
let activeFilters = new Set(); // Food names that pass the PC brush filter

const nodes = svg.selectAll("g")
  .data(root.descendants())
  .join("g")
  .attr("class", d => `node ${d.children ? "parent" : "leaf"}`)
  .attr("transform", d => `translate(${x(d.x0)},${y(d.y0)})`);

nodes.append("rect")
  .attr("width", d => x(d.x1) - x(d.x0))
  .attr("height", d => y(d.y1) - y(d.y0))
  .attr("fill", d => {
    if (d.depth === 0) return "none";
    if (d.depth === 1) return groupColors[d.data.name];
    return groupColors[d.parent.data.name];
  })
  .attr("fill-opacity", d => d.children ? 0.3 : 0.9)
  .attr("cursor", d => d.children ? "pointer" : "default");

nodes.append("clipPath")
  .attr("id", (d, i) => `clip-${i}`)
  .append("rect")
  .attr("width", d => x(d.x1) - x(d.x0))
  .attr("height", d => y(d.y1) - y(d.y0));

nodes.append("text")
  .attr("clip-path", (d, i) => `url(#clip-${i})`)
  .attr("x", 4)
  .attr("y", 14)
  .text(d => d.data.name)
  .attr("opacity", d => {
    const w = x(d.x1) - x(d.x0);
    const h = y(d.y1) - y(d.y0);
    return (w > 40 && h > 15) ? 1 : 0;
  });

// --- Parallel Coordinates Setup ---
const pcCanvas = document.getElementById("pc-canvas");
const pcSvg = d3.select("#pc-svg");
const pctx = pcCanvas.getContext("2d");

pcCanvas.width = width * window.devicePixelRatio;
pcCanvas.height = pcHeight * window.devicePixelRatio;
pcCanvas.style.width = width + "px";
pcCanvas.style.height = pcHeight + "px";
pctx.scale(window.devicePixelRatio, window.devicePixelRatio);

pcSvg.attr("width", width).attr("height", pcHeight);

const xPC = d3.scalePoint().domain(nutrients).range([margin.left, width - margin.right]).padding(0.1);
const yPC = {};
nutrients.forEach(n => {
  yPC[n] = d3.scaleLinear()
    .domain([0, d3.max(rawData, d => d[n]) * 1.05])
    .range([pcHeight - margin.bottom, margin.top]);
});

let brushes = {};

function updateActiveFilters() {
  const filtered = rawData.filter(d => {
    return Object.entries(brushes).every(([attr, range]) => {
      const val = d[attr];
      const [y1, y0] = range; // range is [pixel_top, pixel_bottom]
      const scaledVal = yPC[attr](val);
      return scaledVal >= y1 && scaledVal <= y0;
    });
  });
  
  if (Object.keys(brushes).length === 0) {
    activeFilters = new Set();
  } else {
    activeFilters = new Set(filtered.map(d => d.name));
  }
}

function drawPC() {
  pctx.clearRect(0, 0, width, pcHeight);
  
  const visibleNodes = focus.leaves().map(d => d.data);
  
  // Background lines
  pctx.globalAlpha = 0.05;
  pctx.strokeStyle = "#000";
  rawData.forEach(d => {
    pctx.beginPath();
    nutrients.forEach((n, i) => {
      const px = xPC(n), py = yPC[n](d[n]);
      if (i === 0) pctx.moveTo(px, py);
      else pctx.lineTo(px, py);
    });
    pctx.stroke();
  });

  // Foreground lines
  pctx.globalAlpha = 0.6;
  rawData.forEach(d => {
    const isVisible = visibleNodes.some(v => v.name === d.name);
    const isFiltered = activeFilters.size === 0 || activeFilters.has(d.name);
    const isHovered = hoveredNode && hoveredNode.data.name === d.name;
    
    if (!isVisible && !isHovered) return;
    
    pctx.beginPath();
    pctx.lineWidth = isHovered ? 3 : 1.5;
    pctx.globalAlpha = isHovered ? 1 : isFiltered ? 0.6 : 0.1;
    pctx.strokeStyle = isHovered ? "#000" : groupColors[d.group];
    
    nutrients.forEach((n, i) => {
      const px = xPC(n), py = yPC[n](d[n]);
      if (i === 0) pctx.moveTo(px, py);
      else pctx.lineTo(px, py);
    });
    pctx.stroke();
  });
}

function updateTreemapOpacity() {
  nodes.filter(d => !d.children).select("rect")
    .transition().duration(200)
    .attr("fill-opacity", d => {
      if (activeFilters.size === 0) return 0.9;
      return activeFilters.has(d.data.name) ? 0.9 : 0.15;
    });
}

// --- Interaction Logic ---
const tooltip = d3.select("#tooltip");

nodes.on("mouseenter", (event, d) => {
  if (d.depth === 0) return;
  hoveredNode = d;
  drawPC();
  
  if (!d.children) {
    tooltip.style("opacity", 1)
      .html(`<b>${d.data.name}</b>
             ${nutrientLabels.calories}: ${d.data.calories}<br>
             ${nutrientLabels.protein}: ${d.data.protein}g | ${nutrientLabels.fat}: ${d.data.fat}g<br>
             ${nutrientLabels.carbs}: ${d.data.carbs}g | ${nutrientLabels.sugar}: ${d.data.sugar}g`);
  }
})
.on("mousemove", (event) => {
  tooltip.style("left", (event.pageX + 15) + "px")
         .style("top", (event.pageY - 10) + "px");
})
.on("mouseleave", () => {
  hoveredNode = null;
  drawPC();
  tooltip.style("opacity", 0);
})
.on("click", (event, d) => {
  if (d.children) zoom(d);
});

function zoom(d) {
  focus = d;
  
  const transition = svg.transition().duration(750);
  
  x.domain([d.x0, d.x1]);
  y.domain([d.y0, d.y1]);
  
  nodes.transition(transition)
    .attr("transform", n => `translate(${x(n.x0)},${y(n.y0)})`);
    
  nodes.select("rect").transition(transition)
    .attr("width", n => x(n.x1) - x(n.x0))
    .attr("height", n => y(n.y1) - y(n.y0));
    
  nodes.select("clipPath rect").transition(transition)
    .attr("width", n => x(n.x1) - x(n.x0))
    .attr("height", n => y(n.y1) - y(n.y0));
    
  nodes.select("text").transition(transition)
    .attr("opacity", n => {
      const w = x(n.x1) - x(n.x0);
      const h = y(n.y1) - y(n.y0);
      // Only show text for nodes inside focus
      const inFocus = n.x0 >= d.x0 && n.x1 <= d.x1 && n.y0 >= d.y0 && n.y1 <= d.y1;
      return (inFocus && w > 40 && h > 15) ? 1 : 0;
    });

  updateBreadcrumb();
  drawPC();
}

function updateBreadcrumb() {
  const crumbs = focus.ancestors().reverse();
  const bc = d3.select("#breadcrumb").html("");
  
  crumbs.forEach((d, i) => {
    const span = bc.append("span")
      .text(d.data.name)
      .classed("current", i === crumbs.length - 1);
    
    if (i < crumbs.length - 1) {
      span.on("click", () => zoom(d));
      bc.append("span").text(" › ").style("color", "#999").style("margin", "0 4px");
    }
  });
}

// --- Axes and Brushes ---
nutrients.forEach(n => {
  const g = pcSvg.append("g")
    .attr("transform", `translate(${xPC(n)},0)`);
    
  g.call(d3.axisLeft(yPC[n]).ticks(8).tickSize(-5));
  
  g.append("text")
    .attr("class", "axis-label")
    .attr("y", margin.top - 12)
    .attr("text-anchor", "middle")
    .text(nutrientLabels[n]);
    
  const brush = d3.brushY()
    .extent([[-10, margin.top], [10, pcHeight - margin.bottom]])
    .on("brush end", (event) => {
      if (event.selection) {
        brushes[n] = event.selection;
      } else {
        delete brushes[n];
      }
      updateActiveFilters();
      updateTreemapOpacity();
      drawPC();
    });
    
  g.append("g").call(brush);
});

// --- Legend ---
const legend = d3.select("#legend");
Object.entries(groupColors).forEach(([group, color]) => {
  const item = legend.append("div").attr("class", "legend-item");
  item.append("div").attr("class", "legend-swatch").style("background", color);
  item.append("span").text(group);
});

// Init
updateBreadcrumb();
drawPC();

</script>
</body>
</html>
