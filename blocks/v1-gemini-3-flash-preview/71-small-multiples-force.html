<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Evolution - Small Multiples</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --text: #f1f5f9;
            --new: #22c55e;
            --removed: #ef4444;
            --persistent: #94a3b8;
            --node: #38bdf8;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .controls {
            margin-bottom: 20px;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        button:active {
            transform: translateY(1px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 3 / 2;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            transition: border-color 0.3s, transform 0.3s;
        }

        .panel.active {
            border-color: #3b82f6;
            transform: scale(1.02);
            z-index: 10;
        }

        .panel-label {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            pointer-events: none;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .swatch {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Network Evolution - 6 Month Analysis</h1>
        <div class="controls">
            <button id="animateBtn">Animate Sequence</button>
        </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="legend">
        <div class="legend-item"><div class="swatch" style="background: var(--persistent)"></div> Persistent</div>
        <div class="legend-item"><div class="swatch" style="background: var(--new)"></div> New Edge</div>
        <div class="legend-item"><div class="swatch" style="background: var(--removed); border: 1px dashed white; background: none;"></div> Removed</div>
    </div>

    <script>
        const months = ["January", "February", "March", "April", "May", "June"];
        const numNodes = 15;
        const nodes = d3.range(numNodes).map(i => ({ id: i, name: String.fromCharCode(65 + i) }));
        
        // Generate evolving data
        function generateData() {
            const history = [];
            let currentEdges = [];

            // Seed initial edges
            for(let i=0; i<numNodes; i++) {
                for(let j=i+1; j<numNodes; j++) {
                    if(Math.random() < 0.15) {
                        currentEdges.push({ source: i, target: j });
                    }
                }
            }

            for(let m=0; m<6; m++) {
                const prevEdges = [...currentEdges];
                
                if (m > 0) {
                    // Add some edges
                    const toAdd = Math.floor(Math.random() * 3) + 1;
                    for(let i=0; i<toAdd; i++) {
                        const s = Math.floor(Math.random() * numNodes);
                        const t = Math.floor(Math.random() * numNodes);
                        if (s !== t && !currentEdges.some(e => (e.source === s && e.target === t) || (e.source === t && e.target === s))) {
                            currentEdges.push({ source: s, target: t });
                        }
                    }
                    // Remove some edges
                    const toRemove = Math.floor(Math.random() * 2) + 1;
                    for(let i=0; i<toRemove; i++) {
                        if (currentEdges.length > 5) {
                            const idx = Math.floor(Math.random() * currentEdges.length);
                            currentEdges.splice(idx, 1);
                        }
                    }
                }

                const monthEdges = currentEdges.map(e => ({...e, type: 'persistent'}));
                const removedEdges = [];

                if (m > 0) {
                    monthEdges.forEach(e => {
                        const wasPresent = prevEdges.some(pe => 
                            (pe.source === e.source && pe.target === e.target) || 
                            (pe.source === e.target && pe.target === e.source)
                        );
                        if (!wasPresent) e.type = 'new';
                    });

                    prevEdges.forEach(pe => {
                        const isPresent = currentEdges.some(ce => 
                            (ce.source === pe.source && ce.target === pe.target) || 
                            (ce.source === pe.target && ce.target === pe.source)
                        );
                        if (!isPresent) {
                            removedEdges.push({ ...pe, type: 'removed' });
                        }
                    });
                }

                history.push({
                    month: months[m],
                    nodes: nodes.map(n => ({...n})),
                    edges: [...monthEdges, ...removedEdges]
                });
            }
            return history;
        }

        const data = generateData();
        const grid = d3.select("#grid");
        const simulations = [];

        data.forEach((monthData, i) => {
            const panel = grid.append("div")
                .attr("class", "panel")
                .attr("id", `panel-${i}`);

            panel.append("div")
                .attr("class", "panel-label")
                .text(monthData.month);

            const width = 400; // Reference internal width
            const height = 300;

            const svg = panel.append("svg")
                .attr("viewBox", `0 0 ${width} ${height}`);

            const simulation = d3.forceSimulation(monthData.nodes)
                .force("link", d3.forceLink(monthData.edges.filter(e => e.type !== 'removed'))
                    .id(d => d.id)
                    .distance(60))
                .force("charge", d3.forceManyBody().strength(-150))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collision", d3.forceCollide().radius(20));

            // Force calculation for removed edges - keep them visible but non-binding
            // We'll manually update their positions based on nodes
            
            const link = svg.append("g")
                .attr("class", "links")
                .selectAll("line")
                .data(monthData.edges)
                .join("line")
                .attr("stroke", d => {
                    if (d.type === 'new') return "var(--new)";
                    if (d.type === 'removed') return "var(--removed)";
                    return "var(--persistent)";
                })
                .attr("stroke-opacity", d => d.type === 'removed' ? 0.4 : 0.8)
                .attr("stroke-width", d => d.type === 'new' ? 3 : 1.5)
                .attr("stroke-dasharray", d => d.type === 'removed' ? "4,4" : "none");

            const node = svg.append("g")
                .attr("class", "nodes")
                .selectAll("circle")
                .data(monthData.nodes)
                .join("circle")
                .attr("r", 6)
                .attr("fill", "var(--node)")
                .attr("stroke", "#fff")
                .attr("stroke-width", 1);

            const label = svg.append("g")
                .attr("class", "labels")
                .selectAll("text")
                .data(monthData.nodes)
                .join("text")
                .attr("dy", 12)
                .attr("text-anchor", "middle")
                .attr("font-size", "10px")
                .attr("fill", "#94a3b8")
                .text(d => d.name);

            simulation.on("tick", () => {
                link
                    .attr("x1", d => {
                        const s = monthData.nodes.find(n => n.id === (typeof d.source === 'object' ? d.source.id : d.source));
                        return s.x;
                    })
                    .attr("y1", d => {
                        const s = monthData.nodes.find(n => n.id === (typeof d.source === 'object' ? d.source.id : d.source));
                        return s.y;
                    })
                    .attr("x2", d => {
                        const t = monthData.nodes.find(n => n.id === (typeof d.target === 'object' ? d.target.id : d.target));
                        return t.x;
                    })
                    .attr("y2", d => {
                        const t = monthData.nodes.find(n => n.id === (typeof d.target === 'object' ? d.target.id : d.target));
                        return t.y;
                    });

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);
                
                label
                    .attr("x", d => d.x)
                    .attr("y", d => d.y);
            });

            simulations.push(simulation);
        });

        // Sequential Animation logic
        let isAnimating = false;
        d3.select("#animateBtn").on("click", async function() {
            if (isAnimating) return;
            isAnimating = true;
            d3.select(this).style("opacity", 0.5);

            for(let i=0; i<6; i++) {
                // Highlight panel
                d3.selectAll(".panel").classed("active", false);
                d3.select(`#panel-${i}`).classed("active", true);
                
                // Reheat the simulation to give it a "pop"
                simulations[i].alpha(0.3).restart();
                
                await new Promise(r => setTimeout(r, 1500));
            }

            d3.selectAll(".panel").classed("active", false);
            d3.select(this).style("opacity", 1);
            isAnimating = false;
        });
    </script>
</body>
</html>
