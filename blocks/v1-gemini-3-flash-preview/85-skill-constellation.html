<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Constellation — D3.js Power Tools</title>
<style>
  :root {
    --bg: #0b0e14;
    --text: #e1e7f0;
    --text-muted: #7d8590;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --accent: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
  }
  .overlay {
    position: absolute;
    top: 24px; left: 24px;
    z-index: 10;
    pointer-events: none;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .description {
    font-size: 13px;
    color: var(--text-muted);
    max-width: 320px;
    line-height: 1.5;
  }
  .legend {
    position: absolute;
    bottom: 24px; left: 24px;
    font-size: 11px;
    color: var(--text-muted);
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(11, 14, 20, 0.8);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(22, 27, 34, 0.95);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    display: none;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
  }
  .tooltip-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; display: block; }
  .tooltip-meta { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tooltip-stats { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
  svg { cursor: grab; }
  svg:active { cursor: grabbing; }
  line.link {
    stroke-opacity: 0.2;
    stroke-linecap: round;
  }
  circle.node {
    stroke: var(--bg);
    stroke-width: 1.5px;
    transition: filter 0.2s, stroke-width 0.2s;
  }
  text.label {
    fill: var(--text-muted);
    font-size: 10px;
    pointer-events: none;
    transition: fill 0.2s, font-size 0.2s;
  }
  .node:hover { filter: brightness(1.2); cursor: pointer; }
  .highlight link { stroke-opacity: 0.8; }
  .highlight label { fill: var(--text); font-size: 12px; font-weight: 500; }
</style>
</head>
<body>

<div class="overlay">

  <p class="description">Force-directed network of skill co-occurrence across 105 visualization blocks. Nodes sized by frequency, connected by shared usage.</p>
</div>

<div class="legend" id="legend"></div>
<div class="tooltip" id="tooltip"></div>

"target": "scales", "weight": 3}, {"source": "network", "target": "visual-texture", "weight": 1}, {"source": "force", "target": "visual-texture", "weight": 1}, {"source": "cartography", "target": "visual-texture", "weight": 1}, {"source": "canvas", "target": "visual-texture", "weight": 1}, {"source": "canvas-accessibility", "target": "force", "weight": 1}, {"source": "data-table", "target": "force", "weight": 1}, {"source": "canvas-accessibility", "target": "cartography", "weight": 1}, {"source": "cartography", "target": "data-table", "weight": 1}, {"source": "hierarchy-layouts", "target": "visual-texture", "weight": 1}, {"source": "scales", "target": "visual-texture", "weight": 1}, {"source": "hierarchy-layouts", "target": "scales", "weight": 2}, {"source": "brushing", "target": "webgl", "weight": 1}, {"source": "scales", "target": "webgl", "weight": 1}, {"source": "force", "target": "webgl", "weight": 1}, {"source": "motion", "target": "webgl", "weight": 2}, {"source": "force", "target": "motion", "weight": 2}, {"source": "time-series", "target": "webgl", "weight": 1}, {"source": "canvas", "target": "webgl", "weight": 1}, {"source": "distributions", "target": "webgl", "weight": 1}, {"source": "navigation", "target": "webgl", "weight": 2}, {"source": "distributions", "target": "navigation", "weight": 2}, {"source": "edge-bundling", "target": "webgl", "weight": 1}, {"source": "network", "target": "webgl", "weight": 1}, {"source": "edge-bundling", "target": "network", "weight": 1}, {"source": "hierarchy-layouts", "target": "webgl", "weight": 1}, {"source": "brushing", "target": "hierarchy-interaction", "weight": 2}, {"source": "distributions", "target": "hierarchy-interaction", "weight": 1}, {"source": "navigation", "target": "responsive", "weight": 1}, {"source": "canvas", "target": "parallel-coordinates", "weight": 1}, {"source": "linked-views", "target": "parallel-coordinates", "weight": 3}, {"source": "brushing", "target": "small-multiples", "weight": 2}, {"sourc otion", "weight": 1}, {"source": "data-gathering", "target": "sparkcharts", "weight": 1}, {"source": "sparkcharts", "target": "time-series", "weight": 1}, {"source": "cartography", "target": "time-series", "weight": 1}, {"source": "cartography", "target": "linked-views", "weight": 2}, {"source": "cartography", "target": "edge-bundling", "weight": 1}, {"source": "parallel-coordinates", "target": "small-multiples", "weight": 1}, {"source": "brushing", "target": "motion", "weight": 1}, {"source": "shape-morphing", "target": "time-series", "weight": 1}, {"source": "cartography", "target": "parallel-coordinates", "weight": 1}, {"source": "color", "target": "webgl", "weight": 1}, {"source": "distributions", "target": "sparkcharts", "weight": 1}, {"source": "small-multiples", "target": "sparkcharts", "weight": 1}, {"source": "distributions", "target": "small-multiples", "weight": 1}, {"source": "hierarchy-interaction", "target": "parallel-coordinates", "weight": 1}, {"source": "hierarchy-interaction", "target": "linked-views", "weight": 1}, {"source": "network", "target": "time-series", "weight": 1}]};

const categories = [...new Set(data.nodes.map(d => d.category))].sort();
// GitHub-like dark theme colors
const colors = ["#58a6ff", "#3fb950", "#d29922", "#f85149", "#bc8cff", "#ff7b72"];
const colorScale = d3.scaleOrdinal().domain(categories).range(colors);

// Setup Legend
const legend = d3.select("#legend");
categories.forEach(cat => {
  const item = legend.append("div").attr("class", "legend-item");
  item.append("div").attr("class", "legend-dot").style("background", colorScale(cat));
  item.append("span").text(cat);
});

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("body").append("svg")
  .attr("width", width)
  .attr("height", height)
  .call(d3.zoom().scaleExtent([0.5, 4]).on("zoom", (event) => {
    g.attr("transform", event.transform);
  }));

const g = svg.append("g");

const rScale = d3.scaleSqrt()
  .domain([0, d3.max(data.nodes, d => d.count)])
  .range([6, 22]);

const strokeScale = d3.scaleLinear()
  .domain([1, d3.max(data.links, d => d.weight)])
  .range([1, 8]);

const simulation = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links).id(d => d.id).distance(100))
  .force("charge", d3.forceManyBody().strength(-300))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => rScale(d.count) + 5));

const link = g.append("g")
  .attr("class", "links")
  .selectAll("line")
  .data(data.links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", "#444c56")
  .attr("stroke-width", d => strokeScale(d.weight));

const node = g.append("g")
  .attr("class", "nodes")
  .selectAll("g")
  .data(data.nodes)
  .join("g")
  .call(d3.drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended));

node.append("circle")
  .attr("class", "node")
  .attr("r", d => rScale(d.count))
  .attr("fill", d => colorScale(d.category));

node.append("text")
  .attr("class", "label")
  .attr("dy", d => rScale(d.count) + 12)
  .attr("text-anchor", "middle")
  .text(d => d.name);

const tooltip = d3.select("#tooltip");

node.on("mouseover", (event, d) => {
  tooltip.style("display", "block")
    .html(`
      <span class="tooltip-name">${d.name}</span>
      <span class="tooltip-meta">${d.category}</span>
      <div class="tooltip-stats">
        Used in <strong>${d.count}</strong> blocks
      </div>
    `);
  
  // Highlight connections
  link.style("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 0.8 : 0.1)
      .style("stroke", l => (l.source.id === d.id || l.target.id === d.id) ? colorScale(d.category) : "#444c56");
  
  node.style("opacity", n => {
    if (n.id === d.id) return 1;
    const isConnected = data.links.some(l => 
      (l.source.id === d.id && l.target.id === n.id) || 
      (l.target.id === d.id && l.source.id === n.id)
    );
    return isConnected ? 1 : 0.2;
  });
})
.on("mousemove", (event) => {
  tooltip.style("left", (event.pageX + 15) + "px")
         .style("top", (event.pageY - 10) + "px");
})
.on("mouseout", () => {
  tooltip.style("display", "none");
  link.style("stroke-opacity", 0.2).style("stroke", "#444c56");
  node.style("opacity", 1);
});

simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

function dragstarted(event) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  event.subject.fx = event.subject.x;
  event.subject.fy = event.subject.y;
}

function dragged(event) {
  event.subject.fx = event.x;
  event.subject.fy = event.y;
}

function dragended(event) {
  if (!event.active) simulation.alphaTarget(0);
  event.subject.fx = null;
  event.subject.fy = null;
}

window.addEventListener("resize", () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  svg.attr("width", w).attr("height", h);
  simulation.force("center", d3.forceCenter(w / 2, h / 2)).restart();
});

</script>
</body>
</html>
