<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Container Query Chart — D3 Power Tools</title>
  <link rel="stylesheet" href="../../style/d3-power-tools.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --chart-height: 320px;
    }

    body {
      padding: var(--sp-6);
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: var(--sp-8);
    }

    .demo-grid {
      display: flex;
      flex-direction: column;
      gap: var(--sp-8);
    }

    .row {
      display: flex;
      gap: var(--sp-6);
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* Container setup */
    .chart-wrapper {
      container-type: inline-size;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      transition: border-color var(--duration);
    }

    .chart-wrapper:hover {
      border-color: var(--color-link);
    }

    .size-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--color-border);
      color: var(--color-text-muted);
      font-size: 10px;
      padding: 2px 6px;
      border-bottom-left-radius: var(--radius);
      z-index: 10;
      font-family: var(--font-mono);
    }

    /* Content styling */
    .kpi-container {
      display: none;
      height: 100px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-2);
      text-align: center;
    }

    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-link);
      line-height: 1;
    }

    .kpi-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-faint);
      margin-top: 4px;
    }

    /* Container Queries for pure CSS adaptations */
    @container (max-width: 149px) {
      .chart-svg { display: none; }
      .kpi-container { display: flex; }
      .chart-wrapper { height: auto !important; }
    }

    @container (min-width: 150px) {
      .chart-svg { display: block; }
      .kpi-container { display: none; }
    }

    .annotation-text {
      font-size: 11px;
      fill: var(--color-text-muted);
      pointer-events: none;
    }

    .trend-line {
      stroke: var(--color-text-faint);
      stroke-width: 1.5;
      stroke-dasharray: 4 2;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Container <b>Query</b> Chart</h1>
    <p class="subtitle">Single D3 component adapting across 6 sizes (800px to 80px) using Container Queries and ResizeObserver.</p>
  </div>

  <div class="demo-grid">
    <!-- Large -->
    <div class="row">
      <div class="chart-wrapper" style="width: 800px; height: 350px;">
        <div class="size-badge">800px</div>
        <div class="kpi-container"></div>
      </div>
    </div>

    <!-- Mediums -->
    <div class="row">
      <div class="chart-wrapper" style="width: 400px; height: 280px;">
        <div class="size-badge">400px</div>
        <div class="kpi-container"></div>
      </div>
      <div class="chart-wrapper" style="width: 320px; height: 240px;">
        <div class="size-badge">320px</div>
        <div class="kpi-container"></div>
      </div>
    </div>

    <!-- Small & Micros -->
    <div class="row">
      <div class="chart-wrapper" style="width: 240px; height: 160px;">
        <div class="size-badge">240px</div>
        <div class="kpi-container"></div>
      </div>
      <div class="chart-wrapper" style="width: 140px;">
        <div class="size-badge">140px</div>
        <div class="kpi-container"></div>
      </div>
      <div class="chart-wrapper" style="width: 80px;">
        <div class="size-badge">80px</div>
        <div class="kpi-container"></div>
      </div>
    </div>
  </div>

  <script src="../../style/theme-switch.js"></script>
  <script>
    (function() {
      // 1. Data Generation
      const seed = d3.randomLcg(0.42);
      const randomNormal = d3.randomNormal.source(seed);
      const categories = ["Direct", "Organic", "Social", "Referral"];
      const colors = [
        "var(--color-cat-1)",
        "var(--color-cat-2)",
        "var(--color-cat-3)",
        "var(--color-cat-4)"
      ];

      const data = Array.from({ length: 60 }, (_, i) => {
        const catIdx = Math.floor(seed() * categories.length);
        const x = seed() * 100;
        // Add some correlation
        const y = 20 + (x * 0.5) + randomNormal(0, 15)();
        return {
          id: i,
          x: x,
          y: y,
          category: categories[catIdx],
          color: colors[catIdx]
        };
      });

      const xExtent = d3.extent(data, d => d.x);
      const yExtent = d3.extent(data, d => d.y);
      const avgY = d3.mean(data, d => d.y);

      // Linear regression for trend line
      const xMean = d3.mean(data, d => d.x);
      const yMean = d3.mean(data, d => d.y);
      const ssXX = d3.sum(data, d => Math.pow(d.x - xMean, 2));
      const ssXY = d3.sum(data, d => (d.x - xMean) * (d.y - yMean));
      const slope = ssXY / ssXX;
      const intercept = yMean - slope * xMean;

      // 2. Chart Component
      function renderChart(container) {
        const wrapper = d3.select(container);
        const rect = container.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        // KPI Update (for sizes < 150px)
        const kpi = wrapper.select(".kpi-container");
        if (kpi.empty() === false) {
          kpi.html(`
            <div class="kpi-value">${d3.format(".1f")(avgY)}</div>
            <div class="kpi-label">Avg Value</div>
          `);
        }

        if (width < 150) return; // Managed by CSS for micro sizes

        // Clear previous SVG
        wrapper.selectAll("svg").remove();

        const isFull = width >= 600;
        const isMedium = width >= 300 && width < 600;
        const isSpark = width < 300;

        const margin = isFull 
          ? { top: 40, right: 120, bottom: 50, left: 60 }
          : isMedium
            ? { top: 20, right: 20, bottom: 40, left: 45 }
            : { top: 10, right: 10, bottom: 10, left: 10 };

        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;

        if (innerWidth <= 0 || innerHeight <= 0) return;

        const svg = wrapper.append("svg")
          .attr("class", "chart-svg")
          .attr("width", width)
          .attr("height", height);

        const g = svg.append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);

        // Scales
        const x = d3.scaleLinear().domain([0, 100]).range([0, innerWidth]);
        const y = d3.scaleLinear().domain([0, d3.max(data, d => d.y) + 10]).range([innerHeight, 0]);

        // Trend line coordinates
        const trendData = [
          { x: 0, y: intercept },
          { x: 100, y: slope * 100 + intercept }
        ];

        // 3. Conditional Rendering based on width

        // Grid lines (Full only)
        if (isFull) {
          g.append("g")
            .attr("class", "grid")
            .attr("opacity", 0.5)
            .call(d3.axisLeft(y).tickSize(-innerWidth).tickFormat(""));
        }

        // Axes
        if (!isSpark) {
          const xAxis = d3.axisBottom(x).ticks(isFull ? 10 : 5);
          const yAxis = d3.axisLeft(y).ticks(isFull ? 8 : 4);

          g.append("g")
            .attr("transform", `translate(0,${innerHeight})`)
            .call(xAxis);

          g.append("g")
            .call(yAxis);

          if (isFull) {
            // Axis Labels
            g.append("text")
              .attr("x", innerWidth / 2)
              .attr("y", innerHeight + 40)
              .attr("text-anchor", "middle")
              .attr("fill", "var(--color-text-muted)")
              .style("font-size", "12px")
              .text("Engine Efficiency (%)");

            g.append("text")
              .attr("transform", "rotate(-90)")
              .attr("x", -innerHeight / 2)
              .attr("y", -45)
              .attr("text-anchor", "middle")
              .attr("fill", "var(--color-text-muted)")
              .style("font-size", "12px")
              .text("Performance Score");
          }
        }

        // Trend Line
        const line = d3.line()
          .x(d => x(d.x))
          .y(d => y(d.y));

        g.append("path")
          .datum(trendData)
          .attr("class", "trend-line")
          .attr("d", line);

        // Data Points
        g.selectAll(".dot")
          .data(data)
          .enter().append("circle")
            .attr("class", "dot")
            .attr("cx", d => x(d.x))
            .attr("cy", d => y(d.y))
            .attr("r", isFull ? 4 : isMedium ? 3 : 2)
            .attr("fill", d => d.color)
            .attr("stroke", "var(--color-bg)")
            .attr("stroke-width", isFull ? 1 : 0.5)
            .attr("opacity", 0.8);

        // Annotations & Legend (Full only)
        if (isFull) {
          // Legend
          const legend = svg.append("g")
            .attr("transform", `translate(${width - 110}, ${margin.top})`);

          categories.forEach((cat, i) => {
            const lg = legend.append("g")
              .attr("transform", `translate(0, ${i * 20})`);
            
            lg.append("rect")
              .attr("width", 12)
              .attr("height", 12)
              .attr("rx", 2)
              .attr("fill", colors[i]);
            
            lg.append("text")
              .attr("x", 18)
              .attr("y", 10)
              .attr("font-size", "11px")
              .attr("fill", "var(--color-text-muted)")
              .text(cat);
          });

          // Highlight Top Performer
          const topPoint = data.reduce((prev, current) => (prev.y > current.y) ? prev : current);
          
          const ann = g.append("g")
            .attr("transform", `translate(${x(topPoint.x)}, ${y(topPoint.y)})`);
          
          ann.append("line")
            .attr("x1", 0).attr("y1", 0)
            .attr("x2", 15).attr("y2", -20)
            .attr("stroke", "var(--color-text-faint)")
            .attr("stroke-width", 1);
          
          ann.append("text")
            .attr("x", 18)
            .attr("y", -20)
            .attr("class", "annotation-text")
            .attr("alignment-baseline", "middle")
            .text("Top Performer");
        }
      }

      // 4. Initialize All
      const wrappers = document.querySelectorAll(".chart-wrapper");
      wrappers.forEach(container => {
        renderChart(container);
        
        // Use ResizeObserver for responsive re-rendering
        const ro = new ResizeObserver(() => {
          renderChart(container);
        });
        ro.observe(container);
      });

    })();
  </script>
</body>
</html>
