<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collapsible Taxonomy Tree with Search</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #fafafa; color: #333; }
  #controls {
    position: sticky; top: 0; z-index: 10;
    background: #fafafa; padding: 12px 20px; border-bottom: 1px solid #ddd;
  }
  #search {
    width: 320px; padding: 6px 12px; font-size: 14px;
    border: 1px solid #ccc; border-radius: 4px; outline: none;
    font-family: system-ui, sans-serif;
  }
  #search:focus { border-color: #888; }
  #match-count { margin-left: 12px; font-size: 13px; color: #888; }
  #tree-container { overflow-x: auto; padding: 10px 0; }
  .node circle { cursor: pointer; stroke-width: 1.5px; }
  .node text { font-size: 12px; pointer-events: none; }
  .link { fill: none; stroke: #bbb; stroke-width: 1px; }
</style>
</head>
<body>
<div id="controls">
  <input id="search" type="text" placeholder="Search taxonomy...">
  <span id="match-count"></span>
</div>
<div id="tree-container">
  <svg id="tree-svg"></svg>
</div>
<script type="module">

          ]},

          ]},

        ]},

          ]},

          ]}
        ]}
      ]}
    ]},
    { name: "Viruses", children: [
      { name: "dsDNA Viruses", children: [
        { name: "Caudovirales", children: [
          { name: "Myoviridae" }, { name: "Siphoviridae" }, { name: "Podoviridae" }
        ]},
        { name: "Herpesvirales", children: [
          { name: "Herpesviridae" }, { name: "Alloherpesviridae" }
        ]}
      ]},
      { name: "ssRNA Viruses", children: [
        { name: "Picornavirales", children: [
          { name: "Picornaviridae" }, { name: "Caliciviridae" }
        ]},
        { name: "Mononegavirales", children: [
          { name: "Paramyxoviridae" }, { name: "Rhabdoviridae" }, { name: "Filoviridae" }
        ]},
        { name: "Nidovirales", children: [
          { name: "Coronaviridae" }, { name: "Arteriviridae" }
        ]}
      ]},
      { name: "Retroviruses", children: [
        { name: "Orthoretrovirinae", children: [
          { name: "Lentivirus" }, { name: "Alpharetrovirus" }
        ]},
        { name: "Spumaretrovirinae", children: [
          { name: "Spumavirus" }
        ]}
      ]}
    ]}
  ]
};

// --- Build hierarchy ---
const root = d3.hierarchy(taxonomyData);
let idCounter = 0;
root.each(d => { d.id = idCounter++; });

// Count total descendants for badge
root.each(d => {
  d.data._totalDescendants = d.descendants().length - 1;
});

// Collapse nodes deeper than level 1 (root=0, domains=1 are expanded; kingdoms=2+ collapsed)
root.each(d => {
  if (d.depth >= 2 && d.children) {
    d._children = d.children;
    d.children = null;
  }
});

// --- Layout ---
const margin = { top: 20, right: 200, bottom: 20, left: 60 };
const dx = 22; // vertical spacing between nodes
const dy = 200; // horizontal spacing between levels

const svg = d3.select("#tree-svg");
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
const linkGroup = g.append("g").attr("class", "links");
const nodeGroup = g.append("g").attr("class", "nodes");

const treeLayout = d3.tree().nodeSize([dx, dy]);

// Stash initial positions
root.x0 = 0;
root.y0 = 0;

const duration = 500;
const linkGen = d3.linkHorizontal().x(d => d.y).y(d => d.x);

let searchTerm = "";
let matchedNodes = new Set();

function countDescendants(d) {
  // Count all hidden descendants
  let count = 0;
  const stack = [...(d._children || [])];
  while (stack.length) {
    const n = stack.pop();
    count++;
    if (n.children) stack.push(...n.children);
    if (n._children) stack.push(...n._children);
  }
  return count;
}

function update(source) {
  const treeData = treeLayout(root);
  const nodes = treeData.descendants();
  const links = treeData.links();

  // Compute vertical extent and resize SVG
  let minX = Infinity, maxX = -Infinity;
  nodes.forEach(d => {
    if (d.x < minX) minX = d.x;
    if (d.x > maxX) maxX = d.x;
  });
  const height = maxX - minX + margin.top + margin.bottom + dx;
  const width = d3.max(nodes, d => d.y) + margin.left + margin.right + 120;

  svg.transition().duration(duration)
    .attr("width", Math.max(width, 600))
    .attr("height", height);

  g.transition().duration(duration)
    .attr("transform", `translate(${margin.left},${-minX + margin.top})`);

  // --- Links ---
  const link = linkGroup.selectAll("path.link")
    .data(links, d => d.target.id);

  const linkEnter = link.enter().append("path")
    .attr("class", "link")
    .attr("d", () => {
      const o = { x: source.x0, y: source.y0 };
      return linkGen({ source: o, target: o });
    });

  const linkMerged = linkEnter.merge(link);
  linkMerged.transition().duration(duration)
    .attr("d", linkGen)
    .attr("opacity", d => {
      if (!searchTerm) return 1;
      return (matchedNodes.has(d.source.id) || matchedNodes.has(d.target.id)) ? 1 : 0.15;
    });

  link.exit().transition().duration(duration)
    .attr("d", () => {
      const o = { x: source.x, y: source.y };
      return linkGen({ source: o, target: o });
    })
    .remove();

  // --- Nodes ---
  const node = nodeGroup.selectAll("g.node")
    .data(nodes, d => d.id);

  const nodeEnter = node.enter().append("g")
    .attr("class", "node")
    .attr("transform", `translate(${source.y0},${source.x0})`)
    .on("click", (event, d) => {
      if (d.children) {
        d._children = d.children;
        d.children = null;
      } else if (d._children) {
        d.children = d._children;
        d._children = null;
      }
      update(d);
    });

  nodeEnter.append("circle")
    .attr("r", 0)
    .attr("fill", d => d._children ? "#fff" : (d.children ? "#fff" : "#666"))
    .attr("stroke", "#555");

  // Labels: collapsed or leaf nodes get labels right, expanded internal nodes left
  const labelX = d => d.children ? -10 : 10;
  const labelAnchor = d => d.children ? "end" : "start";

  nodeEnter.append("text")
    .attr("class", "label")
    .attr("dy", "0.35em")
    .attr("x", labelX)
    .attr("text-anchor", labelAnchor)
    .text(d => d.data.name);

  // Merge
  const nodeMerged = nodeEnter.merge(node);

  nodeMerged.transition().duration(duration)
    .attr("transform", d => `translate(${d.y},${d.x})`);

  nodeMerged.select("circle")
    .transition().duration(duration)
    .attr("r", d => {
      if (searchTerm && matchedNodes.has(d.id) && d.data._isDirectMatch) return 8;
      return 6;
    })
    .attr("fill", d => {
      if (searchTerm && matchedNodes.has(d.id) && d.data._isDirectMatch) return "#EE6677";
      return d._children ? "#fff" : (d.children ? "#fff" : "#666");
    })
    .attr("stroke", d => {
      if (searchTerm && matchedNodes.has(d.id) && d.data._isDirectMatch) return "#EE6677";
      return "#555";
    })
    .attr("stroke-width", d => {
      if (searchTerm && matchedNodes.has(d.id) && d.data._isDirectMatch) return 3;
      return 1.5;
    });

  // Update label text: include "+" and descendant count for collapsed nodes
  nodeMerged.select("text.label")
    .attr("x", labelX)
    .attr("text-anchor", labelAnchor)
    .text(d => {
      let text = d.data.name;
      if (d._children) {
        const n = countDescendants(d);
        text += n > 0 ? ` + (${n})` : " +";
      }
      return text;
    })
    .transition().duration(duration)
    .attr("fill", d => {
      if (searchTerm && matchedNodes.has(d.id) && d.data._isDirectMatch) return "#EE6677";
      return "#333";
    })
    .attr("font-weight", d => {
      if (searchTerm && matchedNodes.has(d.id) && d.data._isDirectMatch) return "bold";
      return "normal";
    });

  // Opacity for non-matching nodes during search
  nodeMerged.transition().duration(duration)
    .attr("opacity", d => {
      if (!searchTerm) return 1;
      return matchedNodes.has(d.id) ? 1 : 0.3;
    });

  // Exit
  const nodeExit = node.exit().transition().duration(duration)
    .attr("transform", `translate(${source.y},${source.x})`)
    .remove();

  nodeExit.select("circle").attr("r", 0);

  // Stash positions for next transition
  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

// --- Search ---
function expandToNode(d) {
  // Walk up ancestors and expand each
  const ancestors = [];
  let current = d.parent;
  while (current) {
    ancestors.push(current);
    current = current.parent;
  }
  // Expand from root down
  ancestors.reverse().forEach(a => {
    if (a._children) {
      a.children = a._children;
      a._children = null;
    }
  });
}

function performSearch(term) {
  searchTerm = term.trim().toLowerCase();
  matchedNodes.clear();

  // Clear direct match flags
  root.each(d => { d.data._isDirectMatch = false; });

  if (searchTerm) {
    // Find matching nodes in the full tree (traverse both children and _children)
    const allNodes = [];
    const stack = [root];
    while (stack.length) {
      const n = stack.pop();
      allNodes.push(n);
      if (n.children) stack.push(...n.children);
      if (n._children) stack.push(...n._children);
    }

    const directMatches = allNodes.filter(d =>
      d.data.name.toLowerCase().includes(searchTerm)
    );

    // Mark direct matches and expand paths
    directMatches.forEach(d => {
      d.data._isDirectMatch = true;
      expandToNode(d);
    });

    // After expansion, recompute and mark matched + ancestor IDs
    if (directMatches.length > 0) {
      // Re-traverse visible nodes to build matched set
      const visibleNodes = root.descendants();
      visibleNodes.forEach(d => {
        if (d.data._isDirectMatch) {
          // Mark this node and all ancestors
          let cur = d;
          while (cur) {
            matchedNodes.add(cur.id);
            cur = cur.parent;
          }
        }
      });
    }

    d3.select("#match-count").text(
      directMatches.length > 0
        ? `${directMatches.length} match${directMatches.length > 1 ? "es" : ""}`
        : "No matches"
    );
  } else {
    d3.select("#match-count").text("");
  }

  update(root);
}

d3.select("#search").on("input", function () {
  performSearch(this.value);
});

// Initial render
update(root);
</script>
</body>
</html>
