<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nutrient Treemap Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; overflow: hidden; }
#treemap { width: 100vw; height: 55vh; position: relative; }
#parcoords { width: 100vw; height: 45vh; position: relative; }
.treemap-cell { cursor: pointer; stroke: #1a1a2e; stroke-width: 1px; }
.treemap-label { pointer-events: none; fill: #fff; font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
.group-label { pointer-events: none; fill: rgba(255,255,255,0.9); font-size: 14px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.breadcrumb { position: absolute; top: 8px; left: 12px; font-size: 13px; color: #aaa; z-index: 10; }
.breadcrumb span { cursor: pointer; color: #7ecfff; }
.breadcrumb span:hover { text-decoration: underline; }
.axis-label { fill: #999; font-size: 11px; }
.axis line, .axis path { stroke: #555; }
.axis text { fill: #999; font-size: 10px; }
.pc-line { fill: none; stroke-width: 1.2; opacity: 0.4; }
.pc-line.highlighted { opacity: 0.85; stroke-width: 2; }
.pc-line.dimmed { opacity: 0.05; }
.brush .selection { fill: #7ecfff; fill-opacity: 0.25; stroke: #7ecfff; }
.treemap-cell.dimmed { opacity: 0.15; }
.treemap-cell.highlighted { stroke: #fff; stroke-width: 2px; }
</style>
</head>
<body>
<div id="treemap"><div class="breadcrumb" id="breadcrumb">All Foods</div></div>
<div id="parcoords"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic nutrition data ---
const groups = [
  { name: "Fruits", color: "#e8575a", foods: [

    { name: "Banana", calories: 89, protein: 1.1, fat: 0.3, carbs: 23, fiber: 2.6, sugar: 12 },

    { name: "Strawberry", calories: 32, protein: 0.7, fat: 0.3, carbs: 8, fiber: 2, sugar: 5 },
    { name: "Blueberry", calories: 57, protein: 0.7, fat: 0.3, carbs: 14, fiber: 2.4, sugar: 10 },
    { name: "Mango", calories: 60, protein: 0.8, fat: 0.4, carbs: 15, fiber: 1.6, sugar: 14 },
    { name: "Grape", calories: 69, protein: 0.7, fat: 0.2, carbs: 18, fiber: 0.9, sugar: 16 },
    { name: "Pineapple", calories: 50, protein: 0.5, fat: 0.1, carbs: 13, fiber: 1.4, sugar: 10 },
    { name: "Watermelon", calories: 30, protein: 0.6, fat: 0.2, carbs: 8, fiber: 0.4, sugar: 6 },
    { name: "Peach", calories: 39, protein: 0.9, fat: 0.3, carbs: 10, fiber: 1.5, sugar: 8 },
    { name: "Kiwi", calories: 61, protein: 1.1, fat: 0.5, carbs: 15, fiber: 3, sugar: 9 },
    { name: "Cherry", calories: 50, protein: 1, fat: 0.3, carbs: 12, fiber: 1.6, sugar: 8 },
  ]},
  { name: "Vegetables", color: "#5aad5a", foods: [
    { name: "Broccoli", calories: 34, protein: 2.8, fat: 0.4, carbs: 7, fiber: 2.6, sugar: 1.7 },
    { name: "Carrot", calories: 41, protein: 0.9, fat: 0.2, carbs: 10, fiber: 2.8, sugar: 5 },
    { name: "Spinach", calories: 23, protein: 2.9, fat: 0.4, carbs: 3.6, fiber: 2.2, sugar: 0.4 },
    { name: "Kale", calories: 49, protein: 4.3, fat: 0.9, carbs: 9, fiber: 3.6, sugar: 2.3 },
    { name: "Bell Pepper", calories: 31, protein: 1, fat: 0.3, carbs: 6, fiber: 2.1, sugar: 4 },
    { name: "Tomato", calories: 18, protein: 0.9, fat: 0.2, carbs: 3.9, fiber: 1.2, sugar: 2.6 },
    { name: "Cucumber", calories: 15, protein: 0.7, fat: 0.1, carbs: 3.6, fiber: 0.5, sugar: 1.7 },
    { name: "Zucchini", calories: 17, protein: 1.2, fat: 0.3, carbs: 3.1, fiber: 1, sugar: 2.5 },
    { name: "Sweet Potato", calories: 86, protein: 1.6, fat: 0.1, carbs: 20, fiber: 3, sugar: 4.2 },
    { name: "Cauliflower", calories: 25, protein: 1.9, fat: 0.3, carbs: 5, fiber: 2, sugar: 1.9 },
    { name: "Asparagus", calories: 20, protein: 2.2, fat: 0.1, carbs: 3.9, fiber: 2.1, sugar: 1.9 },
  ]},
  { name: "Grains", color: "#d4a843", foods: [
    { name: "White Rice", calories: 130, protein: 2.7, fat: 0.3, carbs: 28, fiber: 0.4, sugar: 0 },
    { name: "Brown Rice", calories: 112, protein: 2.6, fat: 0.9, carbs: 24, fiber: 1.8, sugar: 0.4 },
    { name: "Oats", calories: 389, protein: 17, fat: 7, carbs: 66, fiber: 11, sugar: 1 },
    { name: "Quinoa", calories: 120, protein: 4.4, fat: 1.9, carbs: 21, fiber: 2.8, sugar: 0.9 },
    { name: "Wheat Bread", calories: 265, protein: 9, fat: 3.2, carbs: 49, fiber: 2.7, sugar: 5 },
    { name: "Pasta", calories: 131, protein: 5, fat: 1.1, carbs: 25, fiber: 1.8, sugar: 0.6 },
    { name: "Barley", calories: 354, protein: 12, fat: 2.3, carbs: 73, fiber: 17, sugar: 0.8 },
    { name: "Corn", calories: 86, protein: 3.3, fat: 1.4, carbs: 19, fiber: 2.7, sugar: 3.2 },
    { name: "Rye Bread", calories: 259, protein: 8.5, fat: 3.3, carbs: 48, fiber: 5.8, sugar: 4 },
    { name: "Millet", calories: 119, protein: 3.5, fat: 1, carbs: 23, fiber: 1.3, sugar: 0.3 },
  ]},
  { name: "Proteins", color: "#8e6cc0", foods: [
    { name: "Chicken Breast", calories: 165, protein: 31, fat: 3.6, carbs: 0, fiber: 0, sugar: 0 },
    { name: "Salmon", calories: 208, protein: 20, fat: 13, carbs: 0, fiber: 0, sugar: 0 },
    { name: "Egg", calories: 155, protein: 13, fat: 11, carbs: 1.1, fiber: 0, sugar: 1.1 },
    { name: "Tofu", calories: 76, protein: 8, fat: 4.8, carbs: 1.9, fiber: 0.3, sugar: 0.7 },
    { name: "Lentils", calories: 116, protein: 9, fat: 0.4, carbs: 20, fiber: 8, sugar: 1.8 },
    { name: "Beef Sirloin", calories: 271, protein: 26, fat: 18, carbs: 0, fiber: 0, sugar: 0 },
    { name: "Tuna", calories: 132, protein: 28, fat: 1.3, carbs: 0, fiber: 0, sugar: 0 },
    { name: "Chickpeas", calories: 164, protein: 8.9, fat: 2.6, carbs: 27, fiber: 7.6, sugar: 4.8 },
    { name: "Turkey", calories: 135, protein: 30, fat: 1, carbs: 0, fiber: 0, sugar: 0 },
    { name: "Shrimp", calories: 99, protein: 24, fat: 0.3, carbs: 0.2, fiber: 0, sugar: 0 },
    { name: "Black Beans", calories: 132, protein: 8.9, fat: 0.5, carbs: 24, fiber: 8.7, sugar: 0.3 },
  ]},
  { name: "Dairy", color: "#5b9bd5", foods: [
    { name: "Whole Milk", calories: 61, protein: 3.2, fat: 3.3, carbs: 4.8, fiber: 0, sugar: 5 },
    { name: "Cheddar", calories: 403, protein: 25, fat: 33, carbs: 1.3, fiber: 0, sugar: 0.5 },
    { name: "Greek Yogurt", calories: 59, protein: 10, fat: 0.7, carbs: 3.6, fiber: 0, sugar: 3.2 },
    { name: "Butter", calories: 717, protein: 0.9, fat: 81, carbs: 0.1, fiber: 0, sugar: 0.1 },
    { name: "Mozzarella", calories: 280, protein: 28, fat: 17, carbs: 3.1, fiber: 0, sugar: 1.1 },
    { name: "Cottage Cheese", calories: 98, protein: 11, fat: 4.3, carbs: 3.4, fiber: 0, sugar: 2.7 },
    { name: "Cream Cheese", calories: 342, protein: 6, fat: 34, carbs: 4, fiber: 0, sugar: 3.2 },
    { name: "Parmesan", calories: 431, protein: 38, fat: 29, carbs: 4.1, fiber: 0, sugar: 0.9 },
  ]},
  { name: "Nuts & Seeds", color: "#c98b4a", foods: [
    { name: "Almonds", calories: 579, protein: 21, fat: 50, carbs: 22, fiber: 12, sugar: 4 },
    { name: "Walnuts", calories: 654, protein: 15, fat: 65, carbs: 14, fiber: 6.7, sugar: 2.6 },
    { name: "Peanuts", calories: 567, protein: 26, fat: 49, carbs: 16, fiber: 8.5, sugar: 4 },
    { name: "Cashews", calories: 553, protein: 18, fat: 44, carbs: 30, fiber: 3.3, sugar: 6 },
    { name: "Chia Seeds", calories: 486, protein: 17, fat: 31, carbs: 42, fiber: 34, sugar: 0 },
    { name: "Flax Seeds", calories: 534, protein: 18, fat: 42, carbs: 29, fiber: 27, sugar: 1.6 },
    { name: "Sunflower Seeds", calories: 584, protein: 21, fat: 51, carbs: 20, fiber: 8.6, sugar: 2.6 },
    { name: "Pumpkin Seeds", calories: 559, protein: 30, fat: 49, carbs: 11, fiber: 6, sugar: 1.4 },
    { name: "Pistachios", calories: 560, protein: 20, fat: 45, carbs: 28, fiber: 10, sugar: 8 },
  ]},
];

const dims = ["calories", "protein", "fat", "carbs", "fiber", "sugar"];
const dimLabels = { calories: "Calories", protein: "Protein (g)", fat: "Fat (g)", carbs: "Carbs (g)", fiber: "Fiber (g)", sugar: "Sugar (g)" };

// Build flat list with group references
const allFoods = [];
const groupColorMap = {};
groups.forEach(g => {
  groupColorMap[g.name] = g.color;
  g.foods.forEach(f => {
    allFoods.push({ ...f, group: g.name, color: g.color });
  });
});

// Build hierarchy
const hierarchyData = {
  name: "All Foods",
  children: groups.map(g => ({
    name: g.name,
    children: g.foods.map(f => ({ name: f.name, value: f.calories, group: g.name, ...f }))
  }))
};

// ---- TREEMAP ----
const treemapDiv = document.getElementById("treemap");
const tmRect = treemapDiv.getBoundingClientRect();
const tmW = tmRect.width, tmH = tmRect.height - 30;

const tmSvg = d3.select("#treemap").append("svg")
  .attr("width", tmW).attr("height", tmH)
  .style("margin-top", "30px");

const root = d3.hierarchy(hierarchyData).sum(d => d.value).sort((a, b) => b.value - a.value);
d3.treemap().size([tmW, tmH]).padding(2).paddingTop(20).round(true)(root);

let currentRoot = root;
const breadcrumb = document.getElementById("breadcrumb");

function groupColor(d) {
  if (d.data.group) return groupColorMap[d.data.group];
  if (d.data.color) return d.data.color;
  const leaf = d.leaves()[0];
  return leaf ? groupColorMap[leaf.data.group] : "#666";
}

function renderTreemap(node, transition = true) {
  currentRoot = node;
  const isRoot = node === root;

  // Update breadcrumb
  if (isRoot) {
    breadcrumb.innerHTML = "All Foods";
  } else {
    breadcrumb.innerHTML = `<span id="bc-root">All Foods</span> / ${node.data.name}`;
    document.getElementById("bc-root").onclick = () => {
      d3.treemap().size([tmW, tmH]).padding(2).paddingTop(20).round(true)(root);
      renderTreemap(root);
    };
  }

  // Recompute layout for the selected node
  let displayChildren;
  if (isRoot) {
    displayChildren = [];
    node.children.forEach(g => {
      displayChildren.push(g); // group node for label
      if (g.children) g.children.forEach(c => displayChildren.push(c));
    });
  } else {
    displayChildren = node.children || [];
  }

  const cells = tmSvg.selectAll(".treemap-cell").data(isRoot ? node.leaves() : displayChildren, d => d.data.name);

  const cellsEnter = cells.enter().append("rect").attr("class", "treemap-cell");
  const cellsMerge = cellsEnter.merge(cells);

  const t = transition ? d3.transition().duration(500) : null;

  cellsMerge
    .attr("fill", d => {
      const c = groupColor(d);
      return d.children ? d3.color(c).darker(0.3) : c;
    })
    .on("click", (e, d) => {
      if (isRoot && d.parent && d.parent !== root) {
        // Clicked a leaf at root level -> zoom to its group
        const groupNode = d.parent;
        d3.treemap().size([tmW, tmH]).padding(3).round(true)(groupNode);
        renderTreemap(groupNode);
      } else if (!isRoot) {
        // Zoomed in, click goes back to root
        d3.treemap().size([tmW, tmH]).padding(2).paddingTop(20).round(true)(root);
        renderTreemap(root);
      }
    });

  if (t) {
    cellsMerge.transition(t)
      .attr("x", d => d.x0).attr("y", d => d.y0)
      .attr("width", d => Math.max(0, d.x1 - d.x0))
      .attr("height", d => Math.max(0, d.y1 - d.y0));
  } else {
    cellsMerge
      .attr("x", d => d.x0).attr("y", d => d.y0)
      .attr("width", d => Math.max(0, d.x1 - d.x0))
      .attr("height", d => Math.max(0, d.y1 - d.y0));
  }

  cells.exit().remove();

  // Labels
  const labels = tmSvg.selectAll(".treemap-label").data(
    (isRoot ? node.leaves() : displayChildren).filter(d => !d.children && (d.x1 - d.x0) > 35 && (d.y1 - d.y0) > 14),
    d => d.data.name
  );
  const labelsEnter = labels.enter().append("text").attr("class", "treemap-label");
  const labelsMerge = labelsEnter.merge(labels);

  labelsMerge
    .text(d => d.data.name)
    .attr("font-size", d => {
      const w = d.x1 - d.x0, h = d.y1 - d.y0;
      return Math.min(12, Math.max(9, Math.min(w / 6, h / 2))) + "px";
    });

  if (t) {
    labelsMerge.transition(t)
      .attr("x", d => d.x0 + 4).attr("y", d => d.y0 + 14);
  } else {
    labelsMerge.attr("x", d => d.x0 + 4).attr("y", d => d.y0 + 14);
  }
  labels.exit().remove();

  // Group labels (root view only)
  const groupData = isRoot ? node.children.filter(g => (g.x1 - g.x0) > 40) : [];
  const gLabels = tmSvg.selectAll(".group-label").data(groupData, d => d.data.name);
  const gLabelsEnter = gLabels.enter().append("text").attr("class", "group-label");
  gLabelsEnter.merge(gLabels)
    .text(d => d.data.name)
    .attr("x", d => d.x0 + 4).attr("y", d => d.y0 + 15);
  gLabels.exit().remove();
}

renderTreemap(root, false);

// ---- PARALLEL COORDINATES ----
const pcDiv = document.getElementById("parcoords");
const pcRect = pcDiv.getBoundingClientRect();
const pcMargin = { top: 30, right: 30, bottom: 20, left: 30 };
const pcW = pcRect.width - pcMargin.left - pcMargin.right;
const pcH = pcRect.height - pcMargin.top - pcMargin.bottom;

const pcSvg = d3.select("#parcoords").append("svg")
  .attr("width", pcRect.width).attr("height", pcRect.height)
  .append("g").attr("transform", `translate(${pcMargin.left},${pcMargin.top})`);

const xPC = d3.scalePoint().domain(dims).range([0, pcW]).padding(0.1);
const yScales = {};
dims.forEach(dim => {
  const ext = d3.extent(allFoods, d => d[dim]);
  yScales[dim] = d3.scaleLinear().domain([ext[0], ext[1] * 1.05]).range([pcH, 0]).nice();
});

function pcPath(d) {
  return d3.line()(dims.map(dim => [xPC(dim), yScales[dim](d[dim])]));
}

// Lines
const pcLines = pcSvg.append("g").selectAll("path")
  .data(allFoods).join("path")
  .attr("class", "pc-line")
  .attr("d", pcPath)
  .attr("stroke", d => d.color);

// Axes
const brushes = {};
dims.forEach(dim => {
  const g = pcSvg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${xPC(dim)},0)`)
    .call(d3.axisLeft(yScales[dim]).ticks(6));

  g.append("text")
    .attr("class", "axis-label")
    .attr("y", -12).attr("x", 0)
    .attr("text-anchor", "middle")
    .text(dimLabels[dim]);

  const brush = d3.brushY()
    .extent([[-12, 0], [12, pcH]])
    .on("brush end", brushed);

  g.append("g").attr("class", "brush").call(brush);
  brushes[dim] = brush;
});

function brushed() {
  const active = [];
  dims.forEach(dim => {
    const sel = d3.brushSelection(pcSvg.select(`.axis:nth-child(${dims.indexOf(dim) + allFoods.length + 1}) .brush`).node());
  });

  // Gather active brush extents
  const filters = {};
  pcSvg.selectAll(".brush").each(function(_, i) {
    const sel = d3.brushSelection(this);
    if (sel) {
      const dim = dims[i];
      filters[dim] = [yScales[dim].invert(sel[1]), yScales[dim].invert(sel[0])];
    }
  });

  const hasFilter = Object.keys(filters).length > 0;

  if (!hasFilter) {
    pcLines.attr("class", "pc-line").attr("opacity", null);
    tmSvg.selectAll(".treemap-cell").attr("class", "treemap-cell");
    return;
  }

  const selected = new Set();
  allFoods.forEach(food => {
    let pass = true;
    for (const [dim, [lo, hi]] of Object.entries(filters)) {
      if (food[dim] < lo || food[dim] > hi) { pass = false; break; }
    }
    if (pass) selected.add(food.name);
  });

  pcLines
    .classed("highlighted", d => selected.has(d.name))
    .classed("dimmed", d => !selected.has(d.name));

  tmSvg.selectAll(".treemap-cell")
    .classed("highlighted", d => !d.children && selected.has(d.data.name))
    .classed("dimmed", d => !d.children && !selected.has(d.data.name));
}
</script>
</body>
</html>
