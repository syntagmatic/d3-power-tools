<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Metrics Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    padding: 24px;
    min-height: 100vh;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #replay-btn {
    background: #2a2d3a;
    border: 1px solid #3a3d4a;
    color: #aab;
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #replay-btn:hover { background: #3a3d4a; color: #fff; }

  /* KPI Cards */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: #1a1d2a;
    border: 1px solid #2a2d3a;
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .kpi-label { font-size: 12px; color: #889; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-value { font-size: 28px; font-weight: 700; color: #fff; }
  .kpi-change { font-size: 12px; }
  .kpi-change.up { color: #4ade80; }
  .kpi-change.down { color: #f87171; }
  .kpi-chart { margin-top: 8px; }

  /* Table */
  .table-wrap {
    background: #1a1d2a;
    border: 1px solid #2a2d3a;
    border-radius: 10px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    padding: 12px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #889;
    border-bottom: 1px solid #2a2d3a;
    font-weight: 600;
  }
  tbody td {
    padding: 10px 16px;
    font-size: 13px;
    border-bottom: 1px solid #1e2130;
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #1e2135; }
  .server-name { font-weight: 600; color: #fff; }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-dot.healthy { background: #4ade80; }
  .status-dot.warning { background: #facc15; }
  .status-dot.critical { background: #f87171; }
  .metric-val { font-variant-numeric: tabular-nums; }
  .metric-val.high { color: #f87171; }
  .metric-val.mid { color: #facc15; }
  .metric-val.ok { color: #4ade80; }
</style>
</head>
<body>
<h1>Server Metrics <button id="replay-btn">↻ Replay</button></h1>
<div class="kpi-row" id="kpi-row"></div>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Server</th>
        <th>Status</th>
        <th>CPU %</th>
        <th>CPU Trend</th>
        <th>Memory %</th>
        <th>Mem Trend</th>
        <th>Latency (ms)</th>
        <th>Latency Trend</th>
        <th>Errors/min</th>
        <th>Uptime</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic Data ---
const rng = d3.randomLcg(42);
const randNorm = d3.randomNormal.source(rng);
const randUni = d3.randomUniform.source(rng);

const serverNames = [
  "us-east-web-01", "us-east-web-02", "us-west-api-01", "us-west-api-02",
  "eu-west-db-01", "eu-west-db-02", "ap-south-cache-01", "ap-south-cache-02",
  "us-east-worker-01", "us-west-worker-02", "eu-central-lb-01", "ap-east-cdn-01"
];

const N = 30; // sparkline points

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function genTimeSeries(base, vol, lo = 0, hi = 100) {
  const vals = [];
  let v = base;
  for (let i = 0; i < N; i++) {
    v += randNorm(0, vol)();
    v = clamp(v, lo, hi);
    vals.push(v);
  }
  return vals;
}

const servers = serverNames.map(name => {
  const cpuBase = randUni(20, 85)();
  const memBase = randUni(30, 90)();
  const latBase = randUni(5, 200)();
  const cpu = genTimeSeries(cpuBase, 4);
  const mem = genTimeSeries(memBase, 3);
  const latency = genTimeSeries(latBase, latBase * 0.1, 1, 500);
  const errors = Array.from({ length: N }, () => Math.max(0, Math.round(randNorm(cpuBase > 70 ? 8 : 1, 3)())));
  const uptime = +(randUni(95, 100)()).toFixed(2);
  const cpuLast = cpu[cpu.length - 1];
  const status = cpuLast > 80 ? "critical" : cpuLast > 60 ? "warning" : "healthy";
  return { name, status, cpu, mem, latency, errors, uptime };
});

// --- KPI data ---
const avgCpu = d3.mean(servers, d => d.cpu[N - 1]);
const avgMem = d3.mean(servers, d => d.mem[N - 1]);
const avgLat = d3.mean(servers, d => d.latency[N - 1]);
const totalErrors = d3.sum(servers, d => d.errors[N - 1]);
const prevAvgCpu = d3.mean(servers, d => d.cpu[N - 2]);
const prevTotalErrors = d3.sum(servers, d => d.errors[N - 2]);

// Aggregate time series for KPIs
const aggCpu = d3.range(N).map(i => d3.mean(servers, s => s.cpu[i]));
const aggMem = d3.range(N).map(i => d3.mean(servers, s => s.mem[i]));
const aggLat = d3.range(N).map(i => d3.mean(servers, s => s.latency[i]));
const aggErrors = d3.range(N).map(i => d3.sum(servers, s => s.errors[i]));

// --- KPI Cards ---
const kpis = [
  { label: "Avg CPU", value: `${avgCpu.toFixed(1)}%`, change: avgCpu - prevAvgCpu, type: "spark-area", data: aggCpu, color: "#60a5fa" },
  { label: "Avg Memory", value: `${avgMem.toFixed(1)}%`, change: null, type: "spark-bar", data: aggMem, color: "#a78bfa" },
  { label: "Avg Latency", value: `${avgLat.toFixed(0)} ms`, change: null, type: "bullet", data: aggLat, color: "#facc15" },
  { label: "Errors/min", value: totalErrors, change: totalErrors - prevTotalErrors, type: "winloss", data: aggErrors, color: "#f87171" },
];

const kpiRow = d3.select("#kpi-row");

kpis.forEach(kpi => {
  const card = kpiRow.append("div").attr("class", "kpi-card");
  card.append("div").attr("class", "kpi-label").text(kpi.label);
  card.append("div").attr("class", "kpi-value").text(kpi.value);
  if (kpi.change !== null) {
    const dir = kpi.change >= 0 ? "up" : "down";
    const arrow = kpi.change >= 0 ? "▲" : "▼";
    // For CPU/errors, up is bad
    const cls = (kpi.label.includes("CPU") || kpi.label.includes("Error"))
      ? (kpi.change >= 0 ? "down" : "up")
      : (kpi.change >= 0 ? "up" : "down");
    card.append("div").attr("class", `kpi-change ${cls}`).text(`${arrow} ${Math.abs(kpi.change).toFixed(1)}`);
  }

  const cw = 220, ch = 40;
  const svg = card.append("div").attr("class", "kpi-chart")
    .append("svg").attr("width", cw).attr("height", ch);

  const x = d3.scaleLinear().domain([0, N - 1]).range([0, cw]);

  if (kpi.type === "spark-area") {
    const y = d3.scaleLinear().domain(d3.extent(kpi.data)).nice().range([ch - 2, 2]);
    const area = d3.area().x((_, i) => x(i)).y0(ch).y1((d) => y(d)).curve(d3.curveMonotoneX);
    const line = d3.line().x((_, i) => x(i)).y(d => y(d)).curve(d3.curveMonotoneX);
    svg.append("path").datum(kpi.data).attr("d", area).attr("fill", kpi.color).attr("fill-opacity", 0.15);
    svg.append("path").datum(kpi.data).attr("d", line).attr("fill", "none").attr("stroke", kpi.color).attr("stroke-width", 1.5);
  } else if (kpi.type === "spark-bar") {
    const y = d3.scaleLinear().domain([0, d3.max(kpi.data)]).range([ch, 2]);
    const bw = cw / N - 1;
    svg.selectAll("rect").data(kpi.data).join("rect")
      .attr("x", (_, i) => x(i)).attr("y", d => y(d))
      .attr("width", Math.max(1, bw)).attr("height", d => ch - y(d))
      .attr("fill", kpi.color).attr("fill-opacity", 0.6).attr("rx", 1);
  } else if (kpi.type === "bullet") {
    const maxVal = d3.max(kpi.data);
    const bx = d3.scaleLinear().domain([0, maxVal * 1.2]).range([0, cw]);
    const last = kpi.data[kpi.data.length - 1];
    const avg = d3.mean(kpi.data);
    // Background range bands
    svg.append("rect").attr("width", cw).attr("height", ch).attr("fill", "#2a2d3a").attr("rx", 4);
    svg.append("rect").attr("width", bx(maxVal * 0.75)).attr("height", ch).attr("fill", "#333648").attr("rx", 4);
    svg.append("rect").attr("width", bx(maxVal * 0.5)).attr("height", ch).attr("fill", "#3a3e52").attr("rx", 4);
    // Actual bar
    svg.append("rect").attr("y", ch * 0.3).attr("height", ch * 0.4).attr("width", bx(last)).attr("fill", kpi.color).attr("rx", 2);
    // Target marker
    svg.append("line").attr("x1", bx(avg)).attr("x2", bx(avg)).attr("y1", ch * 0.15).attr("y2", ch * 0.85)
      .attr("stroke", "#fff").attr("stroke-width", 2);
  } else if (kpi.type === "winloss") {
    // Bars above/below a threshold
    const threshold = d3.median(kpi.data);
    const maxDev = d3.max(kpi.data, d => Math.abs(d - threshold));
    const y = d3.scaleLinear().domain([-maxDev, maxDev]).range([ch - 2, 2]);
    const bw = cw / N - 1;
    svg.selectAll("rect").data(kpi.data).join("rect")
      .attr("x", (_, i) => x(i))
      .attr("y", d => d >= threshold ? y(d - threshold) : y(0))
      .attr("width", Math.max(1, bw))
      .attr("height", d => Math.abs(y(0) - y(d - threshold)))
      .attr("fill", d => d >= threshold ? "#f87171" : "#4ade80")
      .attr("fill-opacity", 0.7)
      .attr("rx", 1);
  }
});

// --- Table ---
const sparkW = 120, sparkH = 28;

function colorClass(val, thresholds = [60, 80]) {
  return val > thresholds[1] ? "high" : val > thresholds[0] ? "mid" : "ok";
}

function buildTable() {
  const tbody = d3.select("#table-body");
  tbody.selectAll("*").remove();

  servers.forEach((s, rowIdx) => {
    const tr = tbody.append("tr");

    // Name
    tr.append("td").attr("class", "server-name").text(s.name);

    // Status
    const statusTd = tr.append("td");
    statusTd.append("span").attr("class", `status-dot ${s.status}`);
    statusTd.append("span").text(s.status);

    // CPU value
    const cpuVal = s.cpu[N - 1];
    tr.append("td").attr("class", `metric-val ${colorClass(cpuVal)}`).text(`${cpuVal.toFixed(1)}%`);

    // CPU sparkline
    const cpuTd = tr.append("td");
    createSparkline(cpuTd, s.cpu, "#60a5fa", rowIdx, [0, 100]);

    // Mem value
    const memVal = s.mem[N - 1];
    tr.append("td").attr("class", `metric-val ${colorClass(memVal)}`).text(`${memVal.toFixed(1)}%`);

    // Mem sparkline
    const memTd = tr.append("td");
    createSparkline(memTd, s.mem, "#a78bfa", rowIdx, [0, 100]);

    // Latency value
    const latVal = s.latency[N - 1];
    tr.append("td").attr("class", `metric-val ${colorClass(latVal, [50, 150])}`).text(`${latVal.toFixed(0)}`);

    // Latency sparkline
    const latTd = tr.append("td");
    createSparkline(latTd, s.latency, "#facc15", rowIdx);

    // Errors
    const errVal = s.errors[N - 1];
    tr.append("td").attr("class", `metric-val ${errVal > 5 ? "high" : errVal > 2 ? "mid" : "ok"}`).text(errVal);

    // Uptime
    tr.append("td").attr("class", `metric-val ${s.uptime >= 99.9 ? "ok" : s.uptime >= 99 ? "mid" : "high"}`)
      .text(`${s.uptime}%`);
  });
}

let clipCounter = 0;

function createSparkline(td, data, color, rowIdx, domain) {
  const id = `clip-${clipCounter++}`;
  const svg = td.append("svg").attr("width", sparkW).attr("height", sparkH);
  const x = d3.scaleLinear().domain([0, N - 1]).range([2, sparkW - 2]);
  const ext = domain || d3.extent(data);
  const y = d3.scaleLinear().domain(ext).range([sparkH - 3, 3]);

  // ClipPath for reveal animation
  const clip = svg.append("defs").append("clipPath").attr("id", id);
  const clipRect = clip.append("rect")
    .attr("x", 0).attr("y", 0)
    .attr("width", 0).attr("height", sparkH);

  const line = d3.line().x((_, i) => x(i)).y(d => y(d)).curve(d3.curveMonotoneX);
  const area = d3.area().x((_, i) => x(i)).y0(sparkH).y1(d => y(d)).curve(d3.curveMonotoneX);

  const g = svg.append("g").attr("clip-path", `url(#${id})`);
  g.append("path").datum(data).attr("d", area).attr("fill", color).attr("fill-opacity", 0.1);
  g.append("path").datum(data).attr("d", line).attr("fill", "none").attr("stroke", color).attr("stroke-width", 1.5);

  // End dot
  g.append("circle")
    .attr("cx", x(N - 1)).attr("cy", y(data[N - 1]))
    .attr("r", 2.5).attr("fill", color);

  // Animate clip reveal with stagger
  clipRect.transition()
    .delay(rowIdx * 80)
    .duration(800)
    .ease(d3.easeCubicOut)
    .attr("width", sparkW);
}

function replay() {
  clipCounter = 0;
  buildTable();
}

buildTable();
document.getElementById("replay-btn").addEventListener("click", replay);
</script>
</body>
</html>
