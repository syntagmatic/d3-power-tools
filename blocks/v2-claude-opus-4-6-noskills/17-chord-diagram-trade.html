<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Global Trade Flows — Chord Diagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
  svg { overflow: visible; }
  .arc path { stroke: #0a0a1a; stroke-width: 1.5px; cursor: pointer; }
  .chord path { mix-blend-mode: screen; }
  .tick line { stroke: #555; }
  .tick text { fill: #999; font-size: 10px; }
  .group-label { fill: #ddd; font-size: 12px; font-weight: 600; pointer-events: none; }
  .title { fill: #eee; font-size: 20px; font-weight: 700; text-anchor: middle; }
  .subtitle { fill: #888; font-size: 13px; text-anchor: middle; }
  .fade { opacity: 0.04 !important; }
</style>
</head>
<body>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const countries = ["USA","China","Germany","Japan","UK","France","S. Korea","India","Canada","Mexico"];

// Asymmetric trade matrix (billions USD, synthetic but realistic magnitudes)
const matrix = [
//        USA   CHN   DEU   JPN    UK   FRA   KOR   IND   CAN   MEX
  [   0,  130,   60,   75,   55,   35,   55,   25,  280,  265], // USA exports to
  [ 450,    0,   75,  140,   55,   30,  160,   70,   25,   20], // China exports to
  [  60,   95,    0,   20,   80,  100,   15,   12,   10,   12], // Germany
  [  140,  135,   22,    0,   12,    8,   30,   10,   12,   15], // Japan
  [  50,   25,   45,    8,    0,   35,    6,   10,    8,    4], // UK
  [  35,   20,   70,    6,   30,    0,    5,    8,    6,    5], // France
  [  75,  125,   10,   25,    8,    5,    0,   15,    6,    8], // S. Korea
  [  55,   15,   10,    5,   12,    6,    8,    0,    4,    5], // India
  [ 310,   18,    5,   10,   12,    4,    4,    3,    0,    5], // Canada
  [ 350,   10,    8,    5,    3,    3,    4,    3,    8,    0], // Mexico
];

const width = 780, height = 780;
const outerRadius = Math.min(width, height) * 0.5 - 80;
const innerRadius = outerRadius - 24;

const svg = d3.select("body").append("svg")
  .attr("width", width).attr("height", height)
  .attr("viewBox", [-width/2, -height/2, width, height]);

svg.append("text").attr("class","title").attr("y", -height/2 + 30).text("Global Trade Flows");
svg.append("text").attr("class","subtitle").attr("y", -height/2 + 52).text("Bilateral goods trade between 10 major economies (synthetic data, $B)");

const color = d3.scaleOrdinal()
  .domain(d3.range(10))
  .range(["#4e79a7","#e15759","#f28e2b","#76b7b2","#59a14f","#edc948","#b07aa1","#ff9da7","#9c755f","#bab0ac"]);

const chord = d3.chord()
  .padAngle(0.04)
  .sortSubgroups(d3.descending)
  .sortChords(d3.descending);

const chords = chord(matrix);

const arc = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);
const ribbon = d3.ribbon().radius(innerRadius);

// --- Tick generator ---
function groupTicks(d, step) {
  const k = (d.endAngle - d.startAngle) / d.value;
  return d3.range(0, d.value, step).map(v => ({ value: v, angle: v * k + d.startAngle }));
}

// --- Draw arcs ---
const arcGroup = svg.append("g").attr("class","arc")
  .selectAll("g")
  .data(chords.groups)
  .join("g");

const arcPaths = arcGroup.append("path")
  .attr("fill", d => color(d.index))
  .attr("d", arc);

// --- Ticks ---
const tickStep = 50; // every 50B
const tickG = arcGroup.append("g")
  .selectAll("g")
  .data(d => groupTicks(d, tickStep))
  .join("g")
  .attr("transform", d => `rotate(${d.angle * 180 / Math.PI - 90}) translate(${outerRadius},0)`);

tickG.append("line").attr("x2", 5);

tickG.filter(d => d.value % 100 === 0)
  .append("text")
  .attr("class","tick")
  .attr("x", 8)
  .attr("dy", "0.35em")
  .attr("transform", d => d.angle > Math.PI ? "rotate(180) translate(-16)" : null)
  .style("text-anchor", d => d.angle > Math.PI ? "end" : null)
  .text(d => `${d.value}B`);

// --- Country labels ---
arcGroup.append("text")
  .attr("class","group-label")
  .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
  .attr("dy", "0.35em")
  .attr("transform", d => `rotate(${d.angle * 180 / Math.PI - 90}) translate(${outerRadius + 26}) ${d.angle > Math.PI ? "rotate(180)" : ""}`)
  .attr("text-anchor", d => d.angle > Math.PI ? "end" : null)
  .text(d => countries[d.index]);

// --- Draw chords ---
const chordPaths = svg.append("g").attr("class","chord")
  .selectAll("path")
  .data(chords)
  .join("path")
  .attr("d", ribbon)
  .attr("fill", d => color(d.source.index))
  .attr("opacity", 0.72);

// --- Entrance animation ---
// Phase 1: arcs grow from zero angle
const arcInterp = arcPaths.nodes().map((_, i) => {
  const g = chords.groups[i];
  return { startAngle: g.startAngle, endAngle: g.startAngle }; // start collapsed
});

// Set initial state
arcPaths.attr("d", (d, i) => arc({ ...d, endAngle: d.startAngle }));
tickG.style("opacity", 0);
svg.selectAll(".group-label").style("opacity", 0);
chordPaths.attr("opacity", 0);

// Phase 1: grow arcs
arcPaths.transition().duration(900).ease(d3.easeCubicOut)
  .attrTween("d", function(d) {
    const i = d3.interpolate(d.startAngle, d.endAngle);
    return t => arc({ ...d, endAngle: i(t) });
  });

// Fade in labels + ticks
tickG.transition().delay(600).duration(400).style("opacity", 1);
svg.selectAll(".group-label").transition().delay(600).duration(400).style("opacity", 1);

// Phase 2: chords appear
chordPaths.transition().delay(950).duration(700).ease(d3.easeCubicOut)
  .attr("opacity", 0.72);

// --- Hover interaction: isolate a country's flows ---
arcGroup.on("mouseover", function(event, d) {
  chordPaths.classed("fade", p => p.source.index !== d.index && p.target.index !== d.index);
  arcPaths.classed("fade", p => {
    // Keep arcs that are the hovered country or connected to it
    if (p.index === d.index) return false;
    return !chords.some(c =>
      (c.source.index === d.index && c.target.index === p.index) ||
      (c.target.index === d.index && c.source.index === p.index)
    );
  });
}).on("mouseout", function() {
  chordPaths.classed("fade", false);
  arcPaths.classed("fade", false);
});
</script>
</body>
</html>
