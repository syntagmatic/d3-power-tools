<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City Similarity Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e0e0e0; font-family: 'Helvetica Neue', sans-serif; }
  h1 { text-align: center; padding: 18px 0 4px; font-size: 20px; font-weight: 400; letter-spacing: 1px; color: #ccc; }
  .subtitle { text-align: center; font-size: 12px; color: #777; margin-bottom: 10px; }
  #parallel { width: 100%; }
  #map { width: 100%; }
  .axis text { font-size: 10px; fill: #999; }
  .axis .domain, .axis line { stroke: #444; }
  .axis-label { font-size: 11px; fill: #aaa; font-weight: 500; }
  .brush .selection { fill: #ff6b3520; stroke: #ff6b35; stroke-width: 1.5; }
  .city-label { font-size: 9px; fill: #bbb; pointer-events: none; }
  .land { fill: #1a1a2e; stroke: #2a2a4e; stroke-width: 0.5; }
  .border { fill: none; stroke: #2a2a4e; stroke-width: 0.3; }
  .graticule { fill: none; stroke: #1a1a2e; stroke-width: 0.3; }
  .legend { font-size: 10px; fill: #888; }
</style>
</head>
<body>
<h1>City Similarity Explorer</h1>
<p class="subtitle">Brush any axis to filter — matching cities highlight on the map</p>
<div id="parallel"></div>
<div id="map"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

const cities = [
  { name: "Tokyo", lat: 35.68, lon: 139.69, population: 13960, density: 6363, elevation: 40, temp: 15.4, rainfall: 1530, cost: 82 },
  { name: "Delhi", lat: 28.61, lon: 77.21, population: 11030, density: 11320, elevation: 216, temp: 25.0, rainfall: 797, cost: 33 },
  { name: "Shanghai", lat: 31.23, lon: 121.47, population: 24870, density: 3830, elevation: 4, temp: 16.1, rainfall: 1166, cost: 52 },
  { name: "São Paulo", lat: -23.55, lon: -46.63, population: 12330, density: 7398, elevation: 760, temp: 19.2, rainfall: 1454, cost: 40 },
  { name: "Mumbai", lat: 19.08, lon: 72.88, population: 12480, density: 20634, elevation: 14, temp: 27.2, rainfall: 2167, cost: 35 },
  { name: "Beijing", lat: 39.90, lon: 116.40, population: 21540, density: 1313, elevation: 43, temp: 12.9, rainfall: 571, cost: 48 },
  { name: "Cairo", lat: 30.04, lon: 31.24, population: 9540, density: 19376, elevation: 75, temp: 21.7, rainfall: 25, cost: 28 },
  { name: "Mexico City", lat: 19.43, lon: -99.13, population: 9210, density: 6000, elevation: 2240, temp: 15.9, rainfall: 846, cost: 36 },
  { name: "Dhaka", lat: 23.81, lon: 90.41, population: 8910, density: 23234, elevation: 8, temp: 25.8, rainfall: 2123, cost: 24 },
  { name: "Osaka", lat: 34.69, lon: 135.50, population: 2750, density: 12000, elevation: 10, temp: 16.9, rainfall: 1306, cost: 76 },
  { name: "New York", lat: 40.71, lon: -74.01, population: 8340, density: 10194, elevation: 10, temp: 12.9, rainfall: 1268, cost: 91 },
  { name: "Karachi", lat: 24.86, lon: 67.01, population: 14910, density: 6663, elevation: 8, temp: 26.0, rainfall: 234, cost: 26 },
  { name: "Buenos Aires", lat: -34.60, lon: -58.38, population: 3060, density: 14308, elevation: 25, temp: 17.9, rainfall: 1236, cost: 38 },
  { name: "Istanbul", lat: 41.01, lon: 28.98, population: 15460, density: 2965, elevation: 40, temp: 14.7, rainfall: 677, cost: 37 },
  { name: "Lagos", lat: 6.52, lon: 3.38, population: 15390, density: 6871, elevation: 41, temp: 27.0, rainfall: 1693, cost: 42 },
  { name: "London", lat: 51.51, lon: -0.13, population: 8980, density: 5701, elevation: 11, temp: 11.3, rainfall: 602, cost: 88 },
  { name: "Bangkok", lat: 13.76, lon: 100.50, population: 8280, density: 5300, elevation: 2, temp: 28.6, rainfall: 1648, cost: 41 },
  { name: "Kinshasa", lat: -4.44, lon: 15.27, population: 14340, density: 14600, elevation: 240, temp: 25.3, rainfall: 1420, cost: 50 },
  { name: "Lima", lat: -12.05, lon: -77.04, population: 9750, density: 3500, elevation: 161, temp: 18.7, rainfall: 16, cost: 34 },
  { name: "Tehran", lat: 35.69, lon: 51.39, population: 8690, density: 11886, elevation: 1190, temp: 17.0, rainfall: 230, cost: 30 },
  { name: "Paris", lat: 48.86, lon: 2.35, population: 2160, density: 20545, elevation: 35, temp: 12.3, rainfall: 637, cost: 85 },
  { name: "Bogotá", lat: 4.71, lon: -74.07, population: 7410, density: 4500, elevation: 2640, temp: 13.5, rainfall: 1014, cost: 32 },
  { name: "Johannesburg", lat: -26.20, lon: 28.04, population: 5640, density: 2364, elevation: 1753, temp: 15.5, rainfall: 713, cost: 39 },
  { name: "Singapore", lat: 1.35, lon: 103.82, population: 5640, density: 7804, elevation: 15, temp: 27.0, rainfall: 2340, cost: 80 },
  { name: "Riyadh", lat: 24.69, lon: 46.72, population: 7680, density: 4700, elevation: 612, temp: 25.6, rainfall: 100, cost: 45 },
  { name: "Santiago", lat: -33.45, lon: -70.67, population: 5610, density: 8464, elevation: 520, temp: 14.4, rainfall: 312, cost: 37 },
  { name: "Sydney", lat: -33.87, lon: 151.21, population: 5310, density: 2037, elevation: 58, temp: 18.4, rainfall: 1214, cost: 78 },
  { name: "Nairobi", lat: -1.29, lon: 36.82, population: 4400, density: 6300, elevation: 1795, temp: 17.8, rainfall: 869, cost: 36 },
  { name: "Moscow", lat: 55.76, lon: 37.62, population: 12640, density: 4834, elevation: 156, temp: 5.8, rainfall: 707, cost: 46 },
  { name: "Toronto", lat: 43.65, lon: -79.38, population: 2930, density: 4334, elevation: 76, temp: 9.4, rainfall: 831, cost: 72 },
  { name: "Addis Ababa", lat: 9.02, lon: 38.75, population: 3430, density: 5165, elevation: 2355, temp: 16.3, rainfall: 1143, cost: 30 },
  { name: "Berlin", lat: 52.52, lon: 13.41, population: 3640, density: 4088, elevation: 34, temp: 10.3, rainfall: 570, cost: 65 },
  { name: "Madrid", lat: 40.42, lon: -3.70, population: 3220, density: 5330, elevation: 667, temp: 14.5, rainfall: 436, cost: 58 },
  { name: "Casablanca", lat: 33.57, lon: -7.59, population: 3710, density: 14200, elevation: 27, temp: 17.7, rainfall: 426, cost: 32 },
  { name: "Kabul", lat: 34.53, lon: 69.17, population: 4220, density: 16000, elevation: 1791, temp: 12.1, rainfall: 330, cost: 22 },
  { name: "Hanoi", lat: 21.03, lon: 105.85, population: 8050, density: 2300, elevation: 12, temp: 23.6, rainfall: 1676, cost: 29 },
  { name: "Kuala Lumpur", lat: 3.14, lon: 101.69, population: 1770, density: 7290, elevation: 60, temp: 27.5, rainfall: 2627, cost: 38 },
  { name: "Rome", lat: 41.90, lon: 12.50, population: 2870, density: 2232, elevation: 21, temp: 15.7, rainfall: 798, cost: 62 },
  { name: "Denver", lat: 39.74, lon: -104.99, population: 715, density: 1700, elevation: 1609, temp: 10.4, rainfall: 401, cost: 68 },
  { name: "Cape Town", lat: -33.93, lon: 18.42, population: 4620, density: 1530, elevation: 0, temp: 16.7, rainfall: 515, cost: 35 },
];

const dimensions = [
  { key: "population", label: "Population (K)" },
  { key: "density", label: "Density (/km²)" },
  { key: "elevation", label: "Elevation (m)" },
  { key: "temp", label: "Avg Temp (°C)" },
  { key: "rainfall", label: "Rainfall (mm)" },
  { key: "cost", label: "Cost Index" },
];

// Parallel coordinates
const pcMargin = { top: 40, right: 30, bottom: 10, left: 30 };
const pcWidth = Math.min(window.innerWidth, 1200);
const pcHeight = 300;
const innerW = pcWidth - pcMargin.left - pcMargin.right;
const innerH = pcHeight - pcMargin.top - pcMargin.bottom;

const svgPC = d3.select("#parallel").append("svg")
  .attr("width", pcWidth).attr("height", pcHeight)
  .append("g").attr("transform", `translate(${pcMargin.left},${pcMargin.top})`);

const x = d3.scalePoint().domain(dimensions.map(d => d.key)).range([0, innerW]).padding(0.1);
const yScales = {};
dimensions.forEach(dim => {
  yScales[dim.key] = d3.scaleLinear()
    .domain(d3.extent(cities, c => c[dim.key])).nice()
    .range([innerH, 0]);
});

const color = d3.scaleSequential(d3.interpolatePlasma).domain([0, cities.length - 1]);

function path(d) {
  return d3.line()(dimensions.map(dim => [x(dim.key), yScales[dim.key](d[dim.key])]));
}

const background = svgPC.append("g").attr("class", "background")
  .selectAll("path").data(cities).join("path")
  .attr("d", path)
  .attr("fill", "none").attr("stroke", "#333").attr("stroke-width", 1).attr("opacity", 0.3);

const foreground = svgPC.append("g").attr("class", "foreground")
  .selectAll("path").data(cities).join("path")
  .attr("d", path)
  .attr("fill", "none")
  .attr("stroke", (d, i) => color(i))
  .attr("stroke-width", 1.5).attr("opacity", 0.8);

const brushes = {};
const activeBrushes = {};

const axes = svgPC.selectAll(".axis")
  .data(dimensions).join("g")
  .attr("class", "axis")
  .attr("transform", d => `translate(${x(d.key)},0)`)
  .each(function(d) {
    d3.select(this).call(d3.axisLeft(yScales[d.key]).ticks(5));
    const brush = d3.brushY()
      .extent([[-12, 0], [12, innerH]])
      .on("start brush end", brushed);
    brushes[d.key] = brush;
    d3.select(this).append("g").attr("class", "brush").call(brush);
  });

axes.append("text").attr("class", "axis-label")
  .attr("y", -12).attr("text-anchor", "middle")
  .text(d => d.label);

function brushed(event) {
  dimensions.forEach(dim => {
    const node = svgPC.select(`.axis:nth-child(${dimensions.indexOf(dim) + 1}) .brush`).node();
    if (!node) return;
    const sel = d3.brushSelection(node);
    if (sel) {
      activeBrushes[dim.key] = sel;
    } else {
      delete activeBrushes[dim.key];
    }
  });

  const selected = cities.filter(city => {
    return Object.entries(activeBrushes).every(([key, [y0, y1]]) => {
      const val = yScales[key](city[key]);
      return val >= y0 && val <= y1;
    });
  });

  const selectedSet = new Set(selected.map(c => c.name));

  foreground.attr("stroke", (d, i) => selectedSet.size === cities.length || selectedSet.has(d.name) ? color(i) : "#222")
    .attr("opacity", d => selectedSet.size === cities.length || selectedSet.has(d.name) ? 0.85 : 0.05)
    .attr("stroke-width", d => selectedSet.size === cities.length || selectedSet.has(d.name) ? 1.8 : 0.5);

  updateMap(selectedSet);
}

// World map
const mapMargin = { top: 10, right: 20, bottom: 20, left: 20 };
const mapWidth = Math.min(window.innerWidth, 1200);
const mapHeight = 380;

const svgMap = d3.select("#map").append("svg")
  .attr("width", mapWidth).attr("height", mapHeight);

const projection = d3.geoNaturalEarth1()
  .scale(mapWidth / 5.8)
  .translate([mapWidth / 2, mapHeight / 2 + 10]);
const geoPath = d3.geoPath(projection);

const graticule = d3.geoGraticule10();
svgMap.append("path").datum(graticule).attr("class", "graticule").attr("d", geoPath);

const mapG = svgMap.append("g");

const worldUrl = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";
const world = await d3.json(worldUrl);
const land = topojson.feature(world, world.objects.countries);
const borders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

mapG.selectAll(".land").data(land.features).join("path")
  .attr("class", "land").attr("d", geoPath);
mapG.append("path").datum(borders).attr("class", "border").attr("d", geoPath);

const cityG = svgMap.append("g");

const cityDots = cityG.selectAll("circle")
  .data(cities).join("circle")
  .attr("cx", d => projection([d.lon, d.lat])[0])
  .attr("cy", d => projection([d.lon, d.lat])[1])
  .attr("r", 4)
  .attr("fill", (d, i) => color(i))
  .attr("stroke", "#000").attr("stroke-width", 0.8)
  .attr("opacity", 0.9);

const cityLabels = cityG.selectAll("text")
  .data(cities).join("text")
  .attr("class", "city-label")
  .attr("x", d => projection([d.lon, d.lat])[0] + 6)
  .attr("y", d => projection([d.lon, d.lat])[1] + 3)
  .text(d => d.name)
  .attr("opacity", 0);

function updateMap(selectedSet) {
  const allSelected = selectedSet.size === cities.length;

  cityDots
    .attr("r", d => allSelected || selectedSet.has(d.name) ? 5 : 2.5)
    .attr("fill", (d, i) => allSelected || selectedSet.has(d.name) ? color(i) : "#333")
    .attr("stroke", d => allSelected || selectedSet.has(d.name) ? "#fff" : "#222")
    .attr("stroke-width", d => allSelected || selectedSet.has(d.name) ? 1.2 : 0.4)
    .attr("opacity", d => allSelected || selectedSet.has(d.name) ? 1 : 0.3);

  cityLabels
    .attr("opacity", d => !allSelected && selectedSet.has(d.name) ? 1 : 0)
    .attr("fill", d => selectedSet.has(d.name) ? "#eee" : "#555");
}
</script>
</body>
</html>
