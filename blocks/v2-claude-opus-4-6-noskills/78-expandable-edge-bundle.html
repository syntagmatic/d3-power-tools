<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expandable Edge Bundle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: system-ui, sans-serif; }
  svg { display: block; }
  .node circle { cursor: pointer; stroke: #1a1a2e; stroke-width: 1.5px; }
  .node text { fill: #8899aa; font-size: 10px; pointer-events: none; }
  .node--internal circle { fill: #334; }
  .node--internal.collapsed circle { fill: #5577cc; }
  .node--leaf circle { fill: #44ccaa; }
  .link { fill: none; stroke-opacity: 0.35; }
  .info { position: fixed; top: 16px; left: 16px; color: #556; font-size: 12px; }
</style>
</head>
<body>
<div class="info">Click internal nodes to collapse/expand subtrees</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic hierarchical data ---
const tree = {
  name: "root",
  children: [
    { name: "Analysis", children: [
      { name: "Cluster", children: [
        { name: "AgglomerativeCluster" },
        { name: "CommunityStructure" },
        { name: "HierarchicalCluster" },
        { name: "MergeEdge" }
      ]},
      { name: "Graph", children: [
        { name: "BetweennessCentrality" },
        { name: "LinkDistance" },
        { name: "MaximalCliques" },
        { name: "ShortestPaths" },
        { name: "SpanningTree" }
      ]},
      { name: "Optimization", children: [
        { name: "AspectRatioBanker" },
        { name: "GradientDescent" },
        { name: "SimulatedAnnealing" }
      ]}
    ]},
    { name: "Animate", children: [
      { name: "Easing", children: [
        { name: "BackEase" },
        { name: "BounceEase" },
        { name: "ElasticEase" }
      ]},
      { name: "Interpolate", children: [
        { name: "ArrayInterpolator" },
        { name: "ColorInterpolator" },
        { name: "NumberInterpolator" },
        { name: "PointInterpolator" }
      ]},
      { name: "Scheduling", children: [
        { name: "Parallel" },
        { name: "Pause" },
        { name: "Scheduler" },
        { name: "Sequence" },
        { name: "Transition" },
        { name: "Tween" }
      ]}
    ]},
    { name: "Data", children: [
      { name: "Converters", children: [
        { name: "DelimitedText" },
        { name: "GraphMLConverter" },
        { name: "JSONConverter" }
      ]},
      { name: "DataSchema", children: [
        { name: "DataField" },
        { name: "DataTable" },
        { name: "DataSet" },
        { name: "DataSource" },
        { name: "DataUtil" }
      ]}
    ]},
    { name: "Display", children: [
      { name: "DirtySprite" },
      { name: "LineSprite" },
      { name: "RectSprite" },
      { name: "TextSprite" }
    ]},
    { name: "Flex", children: [
      { name: "FlexItem", children: [
        { name: "FlexRow" },
        { name: "FlexColumn" },
        { name: "FlexGrid" }
      ]}
    ]},
    { name: "Physics", children: [
      { name: "DragForce" },
      { name: "GravityForce" },
      { name: "NBodyForce" },
      { name: "Particle" },
      { name: "Simulation" },
      { name: "Spring" },
      { name: "SpringForce" }
    ]},
    { name: "Query", children: [
      { name: "AggregateExpression", children: [
        { name: "Average" },
        { name: "Count" },
        { name: "Distinct" },
        { name: "Maximum" },
        { name: "Minimum" },
        { name: "Sum" },
        { name: "Variance" }
      ]},
      { name: "Expression", children: [
        { name: "And" },
        { name: "Comparison" },
        { name: "IsA" },
        { name: "Literal" },
        { name: "Not" },
        { name: "Or" },
        { name: "Xor" }
      ]},
      { name: "Methods", children: [
        { name: "Add" },
        { name: "OrderBy" },
        { name: "Range" },
        { name: "Select" },
        { name: "Where" }
      ]}
    ]},
    { name: "Scale", children: [
      { name: "LinearScale" },
      { name: "LogScale" },
      { name: "OrdinalScale" },
      { name: "QuantileScale" },
      { name: "QuantitativeScale" },
      { name: "RootScale" },
      { name: "TimeScale" }
    ]},
    { name: "Util", children: [
      { name: "Arrays" },
      { name: "Colors" },
      { name: "Dates" },
      { name: "Displays" },
      { name: "Filter" },
      { name: "Geometry" },
      { name: "Heap" },
      { name: "Math" },
      { name: "Orientation" },
      { name: "Property" },
      { name: "Shapes" },
      { name: "Sort" },
      { name: "Stats" },
      { name: "Strings" }
    ]},
    { name: "Vis", children: [
      { name: "Axis", children: [
        { name: "Axes" },
        { name: "AxisGridLine" },
        { name: "AxisLabel" },
        { name: "CartesianAxes" }
      ]},
      { name: "Controls", children: [
        { name: "AnchorControl" },
        { name: "ClickControl" },
        { name: "DragControl" },
        { name: "ExpandControl" },
        { name: "HoverControl" },
        { name: "SelectionControl" },
        { name: "TooltipControl" }
      ]},
      { name: "Legend", children: [
        { name: "Legend" },
        { name: "LegendItem" },
        { name: "LegendRange" }
      ]},
      { name: "Operator", children: [
        { name: "Distortion" },
        { name: "Encoder" },
        { name: "Filter" },
        { name: "LabLayout" },
        { name: "Labeler" },
        { name: "Layout" },
        { name: "SortOperator" }
      ]}
    ]}
  ]
};

// --- Generate synthetic links between leaves ---
const root = d3.hierarchy(tree);
const leaves = root.leaves();
const leafByName = new Map(leaves.map(d => [d.data.name, d]));
const leafNames = [...leafByName.keys()];

// Create deterministic pseudo-random connections
function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 16807 + 0) % 2147483647; return s / 2147483647; };
}
const rand = seededRandom(42);
const connections = [];
for (let i = 0; i < 120; i++) {
  const a = leafNames[Math.floor(rand() * leafNames.length)];
  const b = leafNames[Math.floor(rand() * leafNames.length)];
  if (a !== b) connections.push({ source: a, target: b });
}

// --- Layout constants ---
const width = 960, height = 960;
const radius = width / 2 - 120;

const svg = d3.select("body").append("svg")
  .attr("width", width)
  .attr("height", height)
  .append("g")
  .attr("transform", `translate(${width/2},${height/2})`);

const linkGroup = svg.append("g").attr("class", "links");
const nodeGroup = svg.append("g").attr("class", "nodes");

// Track collapsed state
const collapsed = new Set();

// Color scale for bundles
const bundleColor = d3.scaleOrdinal(d3.schemeTableau10);

// --- Core layout function ---
function getVisibleRoot() {
  // Deep clone tree, pruning collapsed subtrees
  function cloneTree(node) {
    const clone = { name: node.name, _original: node };
    if (node.children && !collapsed.has(node.name)) {
      clone.children = node.children.map(cloneTree);
    } else if (node.children) {
      // Collapsed: mark as stub (it absorbs its leaves)
      clone._collapsed = true;
      clone._leafCount = d3.hierarchy(node).leaves().length;
    }
    return clone;
  }
  return d3.hierarchy(cloneTree(tree));
}

function getVisibleLeaves(visRoot) {
  // Leaves of the visible tree (includes collapsed stubs)
  return visRoot.leaves();
}

// Map from original leaf name to the visible node that represents it
function buildLeafMap(visRoot) {
  const map = new Map();
  visRoot.each(d => {
    if (!d.children) {
      if (d.data._collapsed) {
        // This collapsed node absorbs all descendant leaves of the original
        const origNode = d.data._original;
        d3.hierarchy(origNode).leaves().forEach(l => map.set(l.data.name, d));
      } else {
        map.set(d.data.name, d);
      }
    }
  });
  return map;
}

// Compute LCA-based bundled path between two nodes in the radial layout
function bundlePath(source, target) {
  // Walk up to find ancestors
  function ancestors(node) {
    const path = [node];
    let cur = node;
    while (cur.parent) { cur = cur.parent; path.push(cur); }
    return path;
  }
  const sa = ancestors(source);
  const ta = ancestors(target);
  const saSet = new Set(sa);
  // Find LCA
  let lca = ta.find(n => saSet.has(n));
  // Build path: source -> ... -> LCA -> ... -> target
  const up = [];
  let cur = source;
  while (cur !== lca) { up.push(cur); cur = cur.parent; }
  up.push(lca);
  const down = [];
  cur = target;
  while (cur !== lca) { down.push(cur); cur = cur.parent; }
  return up.concat(down.reverse());
}

// Polar to Cartesian
function px(d) { return d.y * Math.cos((d.x - 90) * Math.PI / 180); }
function py(d) { return d.y * Math.sin((d.x - 90) * Math.PI / 180); }

// Line generator with d3.curveBundle
const line = d3.lineRadial()
  .curve(d3.curveBundle.beta(0.85))
  .radius(d => d.y)
  .angle(d => d.x * Math.PI / 180);

const duration = 600;

function update() {
  const visRoot = getVisibleRoot();

  // Apply radial cluster layout
  const cluster = d3.cluster().size([360, radius]);
  cluster(visRoot);

  const visLeafMap = buildLeafMap(visRoot);

  // --- Aggregate connections ---
  // Group connections by their visible endpoints
  const edgeAgg = new Map();
  connections.forEach(c => {
    const s = visLeafMap.get(c.source);
    const t = visLeafMap.get(c.target);
    if (!s || !t || s === t) return;
    const key = [s.data.name, t.data.name].sort().join("||");
    if (!edgeAgg.has(key)) edgeAgg.set(key, { source: s, target: t, count: 0 });
    edgeAgg.get(key).count++;
  });
  const edges = [...edgeAgg.values()];

  // --- Draw links ---
  const maxCount = d3.max(edges, d => d.count) || 1;

  const links = linkGroup.selectAll("path.link")
    .data(edges, d => [d.source.data.name, d.target.data.name].sort().join("||"));

  links.exit()
    .transition().duration(duration)
    .style("stroke-opacity", 0)
    .remove();

  const linksEnter = links.enter().append("path")
    .attr("class", "link")
    .style("stroke-opacity", 0);

  const linksMerge = linksEnter.merge(links);

  linksMerge.each(function(d) {
    d._path = bundlePath(d.source, d.target);
  });

  linksMerge
    .transition().duration(duration)
    .attrTween("d", function(d) {
      const prevPath = this.__prevPath || d._path;
      const nextPath = d._path;
      // Interpolate each control point in polar coords
      const maxLen = Math.max(prevPath.length, nextPath.length);
      const padded = (arr, len) => {
        if (arr.length >= len) return arr;
        const last = arr[arr.length - 1];
        return arr.concat(Array(len - arr.length).fill(last));
      };
      const pp = padded(prevPath, maxLen);
      const np = padded(nextPath, maxLen);
      return t => {
        const pts = pp.map((p, i) => ({
          x: p.x + (np[i].x - p.x) * t,
          y: p.y + (np[i].y - p.y) * t
        }));
        return line(pts);
      };
    })
    .style("stroke", d => {
      const topAncestor = d.source.ancestors().find(a => a.depth === 1);
      return topAncestor ? bundleColor(topAncestor.data.name) : "#556";
    })
    .style("stroke-width", d => 0.8 + (d.count / maxCount) * 3.5)
    .style("stroke-opacity", d => 0.15 + (d.count / maxCount) * 0.45);

  linksMerge.each(function(d) { this.__prevPath = d._path; });

  // --- Draw nodes ---
  const allNodes = visRoot.descendants();

  const nodes = nodeGroup.selectAll("g.node")
    .data(allNodes, d => d.data.name);

  nodes.exit()
    .transition().duration(duration)
    .style("opacity", 0)
    .remove();

  const nodesEnter = nodes.enter().append("g")
    .attr("class", d => `node ${d.children ? "node--internal" : "node--leaf"}`)
    .style("opacity", 0)
    .attr("transform", d => `rotate(${d.x - 90}) translate(${d.y},0)`);

  nodesEnter.append("circle");
  nodesEnter.append("text");

  const nodesMerge = nodesEnter.merge(nodes);

  nodesMerge
    .classed("node--internal", d => !!d.children || d.data._collapsed)
    .classed("node--leaf", d => !d.children && !d.data._collapsed)
    .classed("collapsed", d => !!d.data._collapsed)
    .transition().duration(duration)
    .style("opacity", 1)
    .attr("transform", d => `rotate(${d.x - 90}) translate(${d.y},0)`);

  nodesMerge.select("circle")
    .attr("r", d => {
      if (d.data._collapsed) return 3 + Math.sqrt(d.data._leafCount) * 1.5;
      return d.children ? 3.5 : 2.5;
    })
    .attr("fill", d => {
      if (d.data._collapsed) return "#5577cc";
      if (d.children) return "#334";
      return "#44ccaa";
    });

  nodesMerge.select("text")
    .attr("dy", "0.31em")
    .attr("x", d => d.x < 180 ? 8 : -8)
    .attr("text-anchor", d => d.x < 180 ? "start" : "end")
    .attr("transform", d => d.x >= 180 ? "rotate(180)" : null)
    .text(d => (!d.children && !d.data._collapsed) || d.data._collapsed ? d.data.name : "")
    .style("fill", d => d.data._collapsed ? "#7799dd" : "#8899aa");

  // --- Click handler for collapse/expand ---
  nodesMerge
    .style("cursor", d => (d.children || d.data._collapsed) ? "pointer" : "default")
    .on("click", (event, d) => {
      if (!d.children && !d.data._collapsed) return;
      const name = d.data.name;
      if (name === "root") return; // don't collapse root
      if (collapsed.has(name)) {
        collapsed.delete(name);
      } else {
        collapsed.add(name);
      }
      update();
    });
}

update();
</script>
</body>
</html>
