<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phyllotaxis Data Art</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #111;
    color: #ccc;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    color: #eee;
    margin-bottom: 16px;
  }
  #canvas-container {
    position: relative;
    width: 700px;
    height: 700px;
  }
  canvas {
    display: block;
    border-radius: 8px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
    align-items: center;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-group label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
  }
  .control-group .value {
    font-size: 0.7rem;
    color: #666;
    text-align: right;
  }
  input[type="range"] {
    width: 140px;
    accent-color: #66ccee;
  }
  button#play-pause {
    background: #222;
    border: 1px solid #444;
    color: #ccc;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-family: system-ui;
    font-size: 0.85rem;
    transition: background 0.2s;
  }
  button#play-pause:hover { background: #333; }
</style>
</head>
<body>

<h1>Phyllotaxis</h1>
<div id="canvas-container"></div>

<div class="controls">
  <div class="control-group">
    <label>Dots <span class="value" id="dots-val">2000</span></label>
    <input type="range" id="dots" min="500" max="3000" value="2000" step="50">
  </div>
  <div class="control-group">
    <label>Angle Offset <span class="value" id="offset-val">0.000</span></label>
    <input type="range" id="angle-offset" min="0" max="0.1" value="0" step="0.001">
  </div>
  <div class="control-group">
    <label>Speed <span class="value" id="speed-val">1.0</span></label>
    <input type="range" id="speed" min="0.1" max="3" value="1" step="0.1">
  </div>
  <button id="play-pause">Pause</button>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const W = 700, H = 700;
const cx = W / 2, cy = H / 2;
const dpr = devicePixelRatio || 1;

// Canvas setup — DPR-aware
const container = d3.select("#canvas-container");
const canvas = container.append("canvas")
    .attr("width", W * dpr)
    .attr("height", H * dpr)
    .style("width", `${W}px`)
    .style("height", `${H}px`)
  .node();
const ctx = canvas.getContext("2d");
ctx.scale(dpr, dpr);

// Golden angle: the irrational angle that maximizes packing
const BASE_GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

// State
let numDots = 2000;
let angleOffset = 0;
let speed = 1;
let paused = false;

// Controls
const dotsSlider = document.getElementById("dots");
const offsetSlider = document.getElementById("angle-offset");
const speedSlider = document.getElementById("speed");
const playBtn = document.getElementById("play-pause");

dotsSlider.addEventListener("input", () => {
  numDots = +dotsSlider.value;
  document.getElementById("dots-val").textContent = numDots;
});
offsetSlider.addEventListener("input", () => {
  angleOffset = +offsetSlider.value;
  document.getElementById("offset-val").textContent = angleOffset.toFixed(3);
});
speedSlider.addEventListener("input", () => {
  speed = +speedSlider.value;
  document.getElementById("speed-val").textContent = speed.toFixed(1);
});
playBtn.addEventListener("click", () => {
  paused = !paused;
  playBtn.textContent = paused ? "Play" : "Pause";
});

// Spacing scales outer dots to fill canvas
const spacing = 8;

function draw(elapsed) {
  const t = elapsed * speed;

  ctx.clearRect(0, 0, W, H);

  // Dark background
  ctx.fillStyle = "#111";
  ctx.fillRect(0, 0, W, H);

  // Angle varies slowly around golden angle — shifts spiral arms
  const dynamicAngle = BASE_GOLDEN_ANGLE + angleOffset + Math.sin(t / 5000) * 0.02;
  // Global rotation
  const rotation = t * 0.0001;

  // --- Glow pass: additive blending at 3x size, low opacity ---
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.1;
  for (let i = 0; i < numDots; i++) {
    const angle = i * dynamicAngle + rotation;
    const r = Math.sqrt(i) * spacing;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;

    // Pulsing radius
    const baseR = 2 + (i / numDots) * 3;
    const pulse = Math.sin(t / 1000 + i * 0.01) * 1.5;
    const dotR = Math.max(0.5, baseR + pulse);

    // HSL color from angle
    const hue = ((angle * 180 / Math.PI) % 360 + 360) % 360;
    ctx.fillStyle = `hsl(${hue}, 70%, 55%)`;

    ctx.beginPath();
    ctx.arc(x, y, dotR * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // --- Main pass: normal dots ---
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  for (let i = 0; i < numDots; i++) {
    const angle = i * dynamicAngle + rotation;
    const r = Math.sqrt(i) * spacing;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;

    const baseR = 2 + (i / numDots) * 3;
    const pulse = Math.sin(t / 1000 + i * 0.01) * 1.5;
    const dotR = Math.max(0.5, baseR + pulse);

    const hue = ((angle * 180 / Math.PI) % 360 + 360) % 360;
    ctx.fillStyle = `hsl(${hue}, 70%, 55%)`;

    ctx.beginPath();
    ctx.arc(x, y, dotR, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Animation loop via d3.timer
const timer = d3.timer((elapsed) => {
  if (!paused) {
    draw(elapsed);
  }
});

// Draw initial frame
draw(0);
</script>
</body>
</html>
