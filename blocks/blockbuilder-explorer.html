<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blockbuilder Explorer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #111;
    color: #ccc;
    margin: 0;
    overflow: hidden;
    height: 100vh;
  }

  /* --- Grid layout --- */
  .app {
    display: grid;
    grid-template-rows: auto 140px 1fr 240px;
    height: 100vh;
    padding: 8px 12px;
    gap: 6px;
  }

  /* --- Header --- */
  .header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 4px 0;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: #eee;
  }
  #status {
    font-size: 13px;
    color: #888;
  }
  #reset-btn {
    margin-left: auto;
    font-family: system-ui;
    font-size: 12px;
    padding: 3px 10px;
    border: 1px solid #555;
    border-radius: 3px;
    background: #222;
    color: #ccc;
    cursor: pointer;
  }
  #reset-btn:hover { background: #333; }

  /* --- Panels --- */
  .panel {
    position: relative;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 4px;
    overflow: hidden;
  }
  .panel-label {
    position: absolute;
    top: 6px;
    left: 10px;
    font-size: 11px;
    font-weight: 600;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    z-index: 2;
    pointer-events: none;
  }

  /* --- Middle row --- */
  .middle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  /* --- Timeline --- */
  #timeline .bar-bg { fill: #333; }
  #timeline .bar-fg { fill: #4477AA; }
  #timeline .axis text { fill: #888; font-size: 10px; }
  #timeline .axis path, #timeline .axis line { stroke: #444; }
  #timeline .brush .selection {
    fill: #4477AA;
    fill-opacity: 0.2;
    stroke: #4477AA;
    stroke-width: 1;
  }

  /* --- Network --- */
  #network canvas {
    position: absolute;
    top: 0;
    left: 0;
  }
  #network .node-label {
    font-size: 9px;
    fill: #aaa;
    pointer-events: none;
  }
  #network .selected-label {
    font-size: 11px;
    fill: #fff;
    font-weight: 600;
  }

  /* --- Colors --- */
  #colors canvas {
    position: absolute;
    top: 0;
    left: 0;
  }

  /* --- Block list --- */
  #blocklist {
    overflow-y: auto;
    overflow-x: hidden;
  }
  .block-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-bottom: 1px solid #222;
    cursor: pointer;
    height: 48px;
  }
  .block-row:hover { background: #252525; }
  .block-thumb {
    width: 56px;
    height: 36px;
    background: #333;
    border-radius: 2px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .block-desc {
    flex: 1;
    font-size: 12px;
    color: #bbb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .block-author {
    font-size: 11px;
    color: #666;
    width: 80px;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .block-date {
    font-size: 11px;
    color: #555;
    width: 70px;
    flex-shrink: 0;
    text-align: right;
  }
  .api-badge {
    display: inline-block;
    font-size: 9px;
    padding: 1px 4px;
    background: #2a2a3a;
    color: #8888cc;
    border-radius: 2px;
    margin-right: 3px;
  }

  /* --- Loading overlay --- */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 12px;
    transition: opacity 0.3s;
  }
  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .progress-bar {
    width: 300px;
    height: 4px;
    background: #333;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #4477AA;
    width: 0%;
    transition: width 0.2s;
  }
  .loading-text {
    font-size: 13px;
    color: #888;
  }

  /* --- Tooltip --- */
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #222;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 11px;
    color: #ddd;
    z-index: 50;
    max-width: 280px;
    display: none;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Blockbuilder Explorer</h1>
    <span id="status">Loading...</span>
    <button id="reset-btn">Reset</button>
  </div>
  <div id="timeline" class="panel">
    <span class="panel-label">Blocks over time</span>
  </div>
  <div class="middle">
    <div id="network" class="panel">
      <span class="panel-label">D3 API co-occurrence</span>
    </div>
    <div id="colors" class="panel">
      <span class="panel-label">Color usage</span>
    </div>
  </div>
  <div id="blocklist" class="panel"></div>
</div>

<div class="loading-overlay" id="loading">
  <div class="loading-text" id="loading-text">Loading blocks-api.json...</div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script type="module">

// ============================================================
// State management
// ============================================================

function createStore(initialState) {
  let state = { ...initialState };
  const listeners = new Set();
  return {
    getState: () => state,
    setState(updates) {
      const prev = state;
      state = { ...state, ...updates };
      for (const fn of listeners) fn(state, prev);
    },
    subscribe(fn) {
      listeners.add(fn);
      return () => listeners.delete(fn);
    },
  };
}

const store = createStore({
  timeRange: null,     // [Date, Date] or null
  selectedApi: null,   // function name string or null
  filteredIndices: null, // Set or null (null = all)
});

// ============================================================
// BitFilter
// ============================================================

class BitFilter {
  #n; #masks;
  constructor(n) { this.#n = n; this.#masks = new Map(); }

  set(dim, predicate, data) {
    const words = Math.ceil(this.#n / 32);
    const mask = new Uint32Array(words);
    for (let i = 0; i < this.#n; i++) {
      if (predicate(data[i])) mask[i >> 5] |= 1 << (i & 31);
    }
    this.#masks.set(dim, mask);
  }

  clear(dim) { this.#masks.delete(dim); }

  filtered() {
    if (this.#masks.size === 0) return null; // null = everything
    const words = Math.ceil(this.#n / 32);
    const result = new Uint32Array(words).fill(0xFFFFFFFF);
    for (const mask of this.#masks.values()) {
      for (let w = 0; w < words; w++) result[w] &= mask[w];
    }
    const indices = new Set();
    for (let w = 0; w < words; w++) {
      let bits = result[w];
      while (bits) {
        const bit = bits & -bits;
        indices.add((w << 5) + (31 - Math.clz32(bit)));
        bits ^= bit;
      }
    }
    return indices;
  }
}

// ============================================================
// Dirty-flag rendering
// ============================================================

const LAYER = { TIMELINE: 1, NETWORK: 2, COLORS: 4, LIST: 8, ALL: 15 };
let dirtyLayers = 0;
const updaters = {};

function markDirty(layers) {
  const wasDirty = dirtyLayers;
  dirtyLayers |= layers;
  if (!wasDirty) requestAnimationFrame(flush);
}

function flush() {
  const d = dirtyLayers;
  dirtyLayers = 0;
  if (d & LAYER.TIMELINE && updaters.timeline) updaters.timeline();
  if (d & LAYER.NETWORK && updaters.network) updaters.network();
  if (d & LAYER.COLORS && updaters.colors) updaters.colors();
  if (d & LAYER.LIST && updaters.list) updaters.list();
}

// ============================================================
// Tooltip
// ============================================================

const tooltipEl = document.getElementById("tooltip");

function showTooltip(x, y, html) {
  tooltipEl.style.display = "block";
  tooltipEl.innerHTML = html;
  tooltipEl.style.left = (x + 12) + "px";
  tooltipEl.style.top = (y - 10) + "px";
}
function hideTooltip() { tooltipEl.style.display = "none"; }

// ============================================================
// Data loading
// ============================================================

async function fetchWithProgress(url, label) {
  const loadingText = document.getElementById("loading-text");
  const progressFill = document.getElementById("progress-fill");
  loadingText.textContent = label;

  const response = await fetch(url);
  const contentLength = +response.headers.get("Content-Length") || 0;

  if (!contentLength || !response.body) {
    const json = await response.json();
    progressFill.style.width = "100%";
    return json;
  }

  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    progressFill.style.width = Math.round((received / contentLength) * 100) + "%";
  }

  const blob = new Blob(chunks);
  const text = await blob.text();
  return JSON.parse(text);
}

// ============================================================
// Data processing
// ============================================================

function processApiData(raw) {
  const fmt = d3.utcParse("%Y-%m-%dT%H:%M:%S.%LZ");
  const blocks = raw.map((d, i) => ({
    idx: i,
    id: d.id || d.userId + "/" + i,
    userId: d.userId || "unknown",
    description: d.description || "",
    created: d.created_at ? (fmt(d.created_at) || new Date(d.created_at)) : null,
    api: d.api || {},
    thumbnail: d.thumbnail,
  })).filter(d => d.created !== null);

  blocks.sort((a, b) => a.created - b.created);
  blocks.forEach((d, i) => d.idx = i);
  return blocks;
}

function buildCooccurrence(blocks, topN = 60) {
  // Count total occurrences of each API function
  const apiCounts = new Map();
  for (const b of blocks) {
    for (const fn of Object.keys(b.api)) {
      apiCounts.set(fn, (apiCounts.get(fn) || 0) + 1);
    }
  }

  // Top N by count
  const topFuncs = [...apiCounts.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, topN)
    .map(d => d[0]);
  const topSet = new Set(topFuncs);

  // Co-occurrence
  const cooc = new Map();
  for (const b of blocks) {
    const funcs = Object.keys(b.api).filter(f => topSet.has(f));
    for (let i = 0; i < funcs.length; i++) {
      for (let j = i + 1; j < funcs.length; j++) {
        const key = funcs[i] < funcs[j]
          ? funcs[i] + "|" + funcs[j]
          : funcs[j] + "|" + funcs[i];
        cooc.set(key, (cooc.get(key) || 0) + 1);
      }
    }
  }

  // Build nodes and edges
  const nodes = topFuncs.map(fn => ({
    id: fn,
    label: fn.replace(/^d3\./, ""),
    count: apiCounts.get(fn),
  }));

  const minWeight = Math.max(5, d3.quantile([...cooc.values()].sort(d3.ascending), 0.5));
  const links = [];
  for (const [key, weight] of cooc) {
    if (weight >= minWeight) {
      const [source, target] = key.split("|");
      links.push({ source, target, weight });
    }
  }

  return { nodes, links };
}

// ============================================================
// View 1: Timeline
// ============================================================

function createTimeline(container, blocks, bitFilter) {
  const el = document.getElementById(container);
  const rect = el.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;
  const margin = { top: 24, right: 16, bottom: 24, left: 50 };
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  const svg = d3.select(el).append("svg")
    .attr("width", width).attr("height", height);

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // Scales
  const timeExtent = d3.extent(blocks, d => d.created);
  const x = d3.scaleUtc().domain(timeExtent).range([0, innerW]);

  const bins = d3.bin()
    .value(d => d.created)
    .domain(x.domain())
    .thresholds(d3.utcMonth.range(...x.domain()))(blocks);

  const maxCount = d3.max(bins, b => b.length);
  const y = d3.scaleLinear().domain([0, maxCount]).nice().range([innerH, 0]);

  // Background bars
  g.selectAll(".bar-bg")
    .data(bins)
    .join("rect")
      .attr("class", "bar-bg")
      .attr("x", d => x(d.x0) + 0.5)
      .attr("width", d => Math.max(0, x(d.x1) - x(d.x0) - 1))
      .attr("y", d => y(d.length))
      .attr("height", d => innerH - y(d.length));

  // Foreground bars
  const fgBars = g.selectAll(".bar-fg")
    .data(bins)
    .join("rect")
      .attr("class", "bar-fg")
      .attr("x", d => x(d.x0) + 0.5)
      .attr("width", d => Math.max(0, x(d.x1) - x(d.x0) - 1))
      .attr("y", d => y(d.length))
      .attr("height", d => innerH - y(d.length));

  // Axes
  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x).ticks(d3.utcYear.every(1)));

  g.append("g")
    .attr("class", "axis")
    .call(d3.axisLeft(y).ticks(4));

  // Brush
  const brush = d3.brushX()
    .extent([[0, 0], [innerW, innerH]])
    .on("brush end", event => {
      if (event.selection) {
        const [px0, px1] = event.selection;
        const range = [x.invert(px0), x.invert(px1)];
        store.setState({ timeRange: range });
        bitFilter.set("time", d => d.created >= range[0] && d.created <= range[1], blocks);
      } else {
        store.setState({ timeRange: null });
        bitFilter.clear("time");
      }
      store.setState({ filteredIndices: bitFilter.filtered() });
      markDirty(LAYER.NETWORK | LAYER.COLORS | LAYER.LIST);
    });

  const brushG = g.append("g").attr("class", "brush").call(brush);

  // Update: recompute foreground bins from filtered data
  updaters.timeline = () => {
    const indices = store.getState().filteredIndices;
    const filtered = indices ? blocks.filter(d => indices.has(d.idx)) : blocks;
    const thresholds = d3.utcMonth.range(...x.domain());
    const filteredBins = d3.bin()
      .value(d => d.created)
      .domain(x.domain())
      .thresholds(thresholds)(filtered);

    fgBars.data(filteredBins)
      .attr("y", d => y(d.length))
      .attr("height", d => innerH - y(d.length));
  };

  return { brush, brushG };
}

// ============================================================
// View 2: API Network
// ============================================================

function createNetwork(container, blocks, graph, bitFilter) {
  const el = document.getElementById(container);
  const rect = el.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;
  const margin = { top: 24, right: 8, bottom: 8, left: 8 };
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  // Clone nodes/links for simulation
  const nodes = graph.nodes.map(d => ({ ...d }));
  const links = graph.links.map(d => ({ ...d }));

  // Node size scale
  const rScale = d3.scaleSqrt()
    .domain(d3.extent(nodes, d => d.count))
    .range([3, 16]);

  // Edge thickness
  const wScale = d3.scaleLinear()
    .domain(d3.extent(links, d => d.weight))
    .range([0.3, 2.5]);

  // Force simulation — pre-compute
  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id)
      .distance(d => 60 / Math.sqrt(Math.max(1, d.weight / 50))))
    .force("charge", d3.forceManyBody().strength(-80).distanceMax(250))
    .force("center", d3.forceCenter(innerW / 2, innerH / 2))
    .force("collide", d3.forceCollide(d => rScale(d.count) + 3))
    .force("x", d3.forceX(innerW / 2).strength(0.05))
    .force("y", d3.forceY(innerH / 2).strength(0.05))
    .stop();

  for (let i = 0; i < 300; i++) simulation.tick();

  // Clamp positions
  for (const n of nodes) {
    n.x = Math.max(rScale(n.count), Math.min(innerW - rScale(n.count), n.x));
    n.y = Math.max(rScale(n.count), Math.min(innerH - rScale(n.count), n.y));
  }

  // Canvas setup
  const dpr = devicePixelRatio;
  const canvas = d3.select(el).append("canvas")
    .attr("width", width * dpr).attr("height", height * dpr)
    .style("width", width + "px").style("height", height + "px")
    .node();
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  // SVG overlay for labels and interaction
  const svg = d3.select(el).append("svg")
    .attr("width", width).attr("height", height)
    .style("position", "absolute").style("top", 0).style("left", 0);

  const gLabels = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // Top labels
  const topNodes = nodes.slice().sort((a, b) => b.count - a.count).slice(0, 15);
  gLabels.selectAll(".node-label")
    .data(topNodes)
    .join("text")
      .attr("class", "node-label")
      .attr("x", d => d.x)
      .attr("y", d => d.y - rScale(d.count) - 3)
      .attr("text-anchor", "middle")
      .text(d => d.label);

  // Quadtree for hit detection
  const quadtree = d3.quadtree()
    .x(d => d.x).y(d => d.y)
    .addAll(nodes);

  // Interaction
  const interactionRect = svg.append("rect")
    .attr("x", margin.left).attr("y", margin.top)
    .attr("width", innerW).attr("height", innerH)
    .attr("fill", "none").attr("pointer-events", "all");

  let hoveredNode = null;

  interactionRect.on("pointermove", event => {
    const [mx, my] = d3.pointer(event);
    const nx = mx - margin.left, ny = my - margin.top;
    const nearest = quadtree.find(nx, ny, 20);
    if (nearest !== hoveredNode) {
      hoveredNode = nearest;
      if (nearest) {
        showTooltip(event.clientX, event.clientY,
          `<strong>${nearest.id}</strong><br>${d3.format(",")(nearest.count)} blocks`);
      } else {
        hideTooltip();
      }
      markDirty(LAYER.NETWORK);
    }
  });

  interactionRect.on("pointerleave", () => {
    hoveredNode = null;
    hideTooltip();
    markDirty(LAYER.NETWORK);
  });

  interactionRect.on("click", event => {
    const [mx, my] = d3.pointer(event);
    const nx = mx - margin.left, ny = my - margin.top;
    const nearest = quadtree.find(nx, ny, 20);
    const currentApi = store.getState().selectedApi;

    if (nearest && nearest.id !== currentApi) {
      store.setState({ selectedApi: nearest.id });
      bitFilter.set("api", d => d.api && d.api[nearest.id], blocks);
    } else {
      store.setState({ selectedApi: null });
      bitFilter.clear("api");
    }
    store.setState({ filteredIndices: bitFilter.filtered() });
    markDirty(LAYER.ALL);
  });

  // Draw function
  function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.translate(margin.left, margin.top);

    const selectedApi = store.getState().selectedApi;
    const connectedNodes = new Set();
    if (selectedApi) {
      connectedNodes.add(selectedApi);
      for (const l of links) {
        const sid = typeof l.source === "object" ? l.source.id : l.source;
        const tid = typeof l.target === "object" ? l.target.id : l.target;
        if (sid === selectedApi) connectedNodes.add(tid);
        if (tid === selectedApi) connectedNodes.add(sid);
      }
    }

    // Edges
    for (const l of links) {
      const s = typeof l.source === "object" ? l.source : nodes.find(n => n.id === l.source);
      const t = typeof l.target === "object" ? l.target : nodes.find(n => n.id === l.target);
      const active = !selectedApi ||
        (connectedNodes.has(s.id) && connectedNodes.has(t.id));
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(t.x, t.y);
      ctx.strokeStyle = active ? "rgba(68,119,170,0.4)" : "rgba(68,119,170,0.06)";
      ctx.lineWidth = active ? wScale(l.weight) : 0.3;
      ctx.stroke();
    }

    // Nodes
    for (const n of nodes) {
      const r = rScale(n.count);
      const active = !selectedApi || connectedNodes.has(n.id);
      const hovered = n === hoveredNode;

      ctx.beginPath();
      ctx.arc(n.x, n.y, hovered ? r + 2 : r, 0, Math.PI * 2);
      if (n.id === selectedApi) {
        ctx.fillStyle = "#4477AA";
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
      } else if (hovered) {
        ctx.fillStyle = "#6699CC";
        ctx.fill();
      } else {
        ctx.fillStyle = active ? "rgba(68,119,170,0.7)" : "rgba(68,119,170,0.15)";
        ctx.fill();
      }
    }

    ctx.restore();
  }

  updaters.network = draw;
  draw();
}

// ============================================================
// View 3: Color Distribution
// ============================================================

function createColorView(container, blocks, colorMap, bitFilter) {
  const el = document.getElementById(container);
  const rect = el.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;
  const margin = { top: 28, right: 12, bottom: 24, left: 40 };
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  // Aggregate colors across all blocks
  const colorAgg = new Map();
  const blockColorIndex = new Map(); // hex -> Set of block indices

  for (const [blockId, colors] of colorMap) {
    const block = blocks.find(b => b.id === blockId);
    if (!block) continue;
    for (const [hex, count] of Object.entries(colors)) {
      if (!hex.match(/^#[0-9a-fA-F]{6}$/)) continue;
      const c = d3.hcl(hex);
      if (isNaN(c.h) || isNaN(c.c) || isNaN(c.l)) continue;
      // Round for aggregation
      const hBin = Math.round(c.h / 3) * 3;
      const lBin = Math.round(c.l / 3) * 3;
      const key = hBin + "," + lBin;
      if (!colorAgg.has(key)) {
        colorAgg.set(key, { h: hBin, l: lBin, hex, count: 0, blockIndices: new Set() });
      }
      const entry = colorAgg.get(key);
      entry.count += count;
      entry.blockIndices.add(block.idx);
    }
  }

  const colorPoints = [...colorAgg.values()];

  // Scales
  const x = d3.scaleLinear().domain([0, 360]).range([0, innerW]);
  const y = d3.scaleLinear().domain([0, 100]).range([innerH, 0]);
  const rScale = d3.scaleSqrt()
    .domain(d3.extent(colorPoints, d => d.count))
    .range([1, 8]);

  // Canvas
  const dpr = devicePixelRatio;
  const canvas = d3.select(el).append("canvas")
    .attr("width", width * dpr).attr("height", height * dpr)
    .style("width", width + "px").style("height", height + "px")
    .node();
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  // SVG overlay for axes
  const svg = d3.select(el).append("svg")
    .attr("width", width).attr("height", height)
    .style("position", "absolute").style("top", 0).style("left", 0)
    .style("pointer-events", "none");

  const gAxes = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  gAxes.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x).tickValues([0, 60, 120, 180, 240, 300, 360])
      .tickFormat(d => d + "\u00B0"))
    .selectAll("text").style("fill", "#888").style("font-size", "9px");
  gAxes.selectAll(".axis path, .axis line").style("stroke", "#444");

  gAxes.append("g")
    .attr("class", "axis")
    .call(d3.axisLeft(y).ticks(5))
    .selectAll("text").style("fill", "#888").style("font-size", "9px");
  gAxes.selectAll(".axis path, .axis line").style("stroke", "#444");

  // Axis labels
  gAxes.append("text")
    .attr("x", innerW / 2).attr("y", innerH + 20)
    .attr("text-anchor", "middle")
    .style("fill", "#666").style("font-size", "9px")
    .text("Hue");

  gAxes.append("text")
    .attr("transform", "rotate(-90)")
    .attr("x", -innerH / 2).attr("y", -28)
    .attr("text-anchor", "middle")
    .style("fill", "#666").style("font-size", "9px")
    .text("Lightness");

  function draw() {
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.translate(margin.left, margin.top);

    const indices = store.getState().filteredIndices;
    const hasFilter = indices !== null;

    // Background (dimmed) when filtered
    if (hasFilter) {
      ctx.globalAlpha = 0.08;
      for (const p of colorPoints) {
        ctx.fillStyle = p.hex;
        ctx.beginPath();
        ctx.arc(x(p.h), y(p.l), rScale(p.count), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Foreground
    ctx.globalAlpha = hasFilter ? 0.8 : 0.5;
    for (const p of colorPoints) {
      if (hasFilter) {
        // Check if any of this color's blocks pass the filter
        let passes = false;
        for (const bi of p.blockIndices) {
          if (indices.has(bi)) { passes = true; break; }
        }
        if (!passes) continue;
      }
      ctx.fillStyle = p.hex;
      ctx.beginPath();
      ctx.arc(x(p.h), y(p.l), rScale(p.count), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  updaters.colors = draw;
  draw();
}

// ============================================================
// View 4: Block List
// ============================================================

function createBlockList(container, blocks) {
  const el = document.getElementById(container);
  const formatDate = d3.utcFormat("%Y-%m");

  function renderList() {
    const indices = store.getState().filteredIndices;
    const filtered = indices
      ? blocks.filter(d => indices.has(d.idx))
      : blocks;

    // Sort by date descending
    const sorted = filtered.slice().sort((a, b) => b.created - a.created);

    // Limit rendered rows for performance
    const maxRows = 200;
    const shown = sorted.slice(0, maxRows);

    // Update status
    const total = blocks.length;
    const count = filtered.length;
    document.getElementById("status").textContent =
      `Showing ${d3.format(",")(count)} of ${d3.format(",")(total)} blocks`;

    // Virtual-ish rendering: just cap at 200 rows
    el.innerHTML = "";
    const frag = document.createDocumentFragment();

    for (const b of shown) {
      const row = document.createElement("div");
      row.className = "block-row";
      row.onclick = () => window.open(`https://bl.ocks.org/${b.userId}/${b.id}`, "_blank");

      // Thumbnail
      const thumb = document.createElement("img");
      thumb.className = "block-thumb";
      thumb.loading = "lazy";
      thumb.src = `https://bl.ocks.org/${b.userId}/raw/${b.id}/thumbnail.png`;
      thumb.onerror = () => { thumb.style.display = "none"; };
      row.appendChild(thumb);

      // Description
      const desc = document.createElement("span");
      desc.className = "block-desc";
      const topApis = Object.entries(b.api)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3)
        .map(([fn]) => `<span class="api-badge">${fn.replace("d3.", "")}</span>`)
        .join("");
      desc.innerHTML = (b.description || "(untitled)") + " " + topApis;
      row.appendChild(desc);

      // Author
      const author = document.createElement("span");
      author.className = "block-author";
      author.textContent = b.userId;
      row.appendChild(author);

      // Date
      const date = document.createElement("span");
      date.className = "block-date";
      date.textContent = formatDate(b.created);
      row.appendChild(date);

      frag.appendChild(row);
    }

    el.appendChild(frag);
  }

  updaters.list = renderList;
  renderList();
}

// ============================================================
// Reset
// ============================================================

function setupReset(bitFilter, timelineParts) {
  d3.select("#reset-btn").on("click", () => {
    bitFilter.clear("time");
    bitFilter.clear("api");
    store.setState({
      timeRange: null,
      selectedApi: null,
      filteredIndices: null,
    });
    if (timelineParts) {
      timelineParts.brushG.call(timelineParts.brush.move, null);
    }
    markDirty(LAYER.ALL);
  });
}

// ============================================================
// Main
// ============================================================

async function main() {
  const loadingEl = document.getElementById("loading");

  // Load primary data
  const raw = await fetchWithProgress(
    "https://storage.googleapis.com/bb-search-data/parsed/blocks-api.json",
    "Loading blocks-api.json (10 MB)..."
  );

  document.getElementById("loading-text").textContent = "Processing...";
  await new Promise(r => setTimeout(r, 10)); // let UI update

  const blocks = processApiData(raw);
  const bitFilter = new BitFilter(blocks.length);

  // Build co-occurrence graph
  const graph = buildCooccurrence(blocks, 60);

  // Render views
  const timelineParts = createTimeline("timeline", blocks, bitFilter);
  createNetwork("network", blocks, graph, bitFilter);
  createBlockList("blocklist", blocks);

  setupReset(bitFilter, timelineParts);

  // Hide loading
  loadingEl.classList.add("hidden");
  setTimeout(() => loadingEl.remove(), 500);

  // Load colors in background
  try {
    const rawColors = await fetchWithProgress(
      "https://storage.googleapis.com/bb-search-data/parsed/blocks-colors.json",
      "Loading colors..."
    );
    const colorMap = new Map();
    for (const d of rawColors) {
      if (d.colors && d.id) colorMap.set(d.id, d.colors);
    }
    createColorView("colors", blocks, colorMap, bitFilter);
    d3.select("#colors .panel-label").text(`Color usage (${d3.format(",")(colorMap.size)} blocks)`);
  } catch (e) {
    d3.select("#colors .panel-label").text("Color data unavailable");
    console.warn("Failed to load colors:", e);
  }
}

main().catch(e => {
  console.error(e);
  document.getElementById("loading-text").textContent = "Error: " + e.message;
});

</script>
