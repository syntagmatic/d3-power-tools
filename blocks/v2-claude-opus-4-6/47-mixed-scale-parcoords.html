<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mixed-Scale Parallel Coordinates — 300 Employees</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h1 { font-size: 1.1rem; font-weight: 500; margin: 18px 0 4px; color: #ccc; letter-spacing: 0.02em; }
  .subtitle { font-size: 0.78rem; color: #888; margin-bottom: 12px; }
  #container { position: relative; width: 960px; height: 520px; }
  canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  svg { position: absolute; top: 0; left: 0; }
  .axis path, .axis line { stroke: #555; }
  .axis text { fill: #aaa; font-size: 10px; }
  .axis-label { fill: #ddd; font-size: 11px; font-weight: 600; text-anchor: middle; cursor: default; }
  .brush .selection { fill: rgba(100, 180, 255, 0.25); stroke: #6ab4ff; stroke-width: 1.5; rx: 3; }
  .brush .handle { fill: #6ab4ff; rx: 2; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; margin-top: 8px; font-size: 0.75rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; color: #aaa; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; }
  .count { font-size: 0.8rem; color: #888; margin-top: 6px; }
</style>
</head>
<body>
<h1>Employee Profile Explorer</h1>
<p class="subtitle">Parallel coordinates with mixed scale types — brush axes to filter</p>
<div id="container"></div>
<div class="legend" id="legend"></div>
<div class="count" id="count"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data ---
const departments = ["Engineering", "Sales", "Marketing", "Finance", "Operations", "Design", "Data Science", "HR"];
const levels = ["Junior", "Mid", "Senior", "Lead", "Director", "VP"];
const n = 300;
const rng = d3.randomLcg(42);
const rand = d3.randomNormal.source(rng);
const randU = d3.randomUniform.source(rng);

const data = Array.from({ length: n }, (_, i) => {
  const dept = departments[Math.floor(randU(0, departments.length)())];
  const levelIdx = Math.min(levels.length - 1, Math.max(0, Math.floor(rand(1.8, 1.2)())));
  const level = levels[levelIdx];
  const age = Math.round(Math.max(22, Math.min(65, rand(35, 9)())));
  const experience = Math.round(Math.max(0, Math.min(age - 20, rand(levelIdx * 3 + 2, 4)())));
  // Salary: log-distributed, correlated with level and experience
  const baseSalary = 35000 * Math.pow(1.45, levelIdx) + experience * 2500;
  const salary = Math.round(Math.max(30000, baseSalary * (0.8 + randU(0, 0.5)())));
  const performance = Math.round(Math.max(1, Math.min(10, rand(5.5 + levelIdx * 0.4, 1.8)())) * 10) / 10;
  return { age, experience, salary, department: dept, level, performance, _i: i };
});

// --- Layout ---
const margin = { top: 42, right: 40, bottom: 28, left: 40 };
const width = 960, height = 520;
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

// --- Dimensions (in axis order) ---
const dimensions = [
  { key: "age", label: "Age", type: "linear" },
  { key: "experience", label: "Experience", type: "linear" },
  { key: "salary", label: "Salary", type: "log" },
  { key: "department", label: "Department", type: "ordinal" },
  { key: "level", label: "Level", type: "ordinal" },
  { key: "performance", label: "Performance", type: "linear" },
];

// --- Scales ---
const xScale = d3.scalePoint(dimensions.map(d => d.key), [0, innerW]).padding(0.08);

const yScales = {};
for (const dim of dimensions) {
  const vals = data.map(d => d[dim.key]);
  if (dim.type === "linear") {
    yScales[dim.key] = d3.scaleLinear(d3.extent(vals), [innerH, 0]).nice();
  } else if (dim.type === "log") {
    const ext = d3.extent(vals);
    yScales[dim.key] = d3.scaleLog([Math.max(1, ext[0]), ext[1]], [innerH, 0]).nice();
  } else {
    // Ordinal point
    const domain = dim.key === "level" ? levels : [...new Set(vals)].sort();
    yScales[dim.key] = d3.scalePoint(domain, [innerH, 0]).padding(0.15);
  }
}

// --- Color by department ---
const colorScale = d3.scaleOrdinal(departments, d3.schemeTableau10);

// --- Canvas (data lines) ---
const container = d3.select("#container");
const dpr = window.devicePixelRatio || 1;
const canvas = container.append("canvas")
  .attr("width", width * dpr).attr("height", height * dpr)
  .style("width", width + "px").style("height", height + "px");
const ctx = canvas.node().getContext("2d");
ctx.scale(dpr, dpr);

// --- SVG (axes, brushes, labels) ---
const svg = container.append("svg")
  .attr("width", width).attr("height", height)
  .append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// --- Brushes state ---
const brushSelections = {};

// --- Draw lines ---
function pathLine(d, ctx) {
  let first = true;
  for (const dim of dimensions) {
    const x = xScale(dim.key);
    const y = yScales[dim.key](d[dim.key]);
    if (y == null || isNaN(y)) return false;
    if (first) { ctx.moveTo(x, y); first = false; }
    else ctx.lineTo(x, y);
  }
  return true;
}

function isSelected(d) {
  for (const dim of dimensions) {
    const sel = brushSelections[dim.key];
    if (!sel) continue;
    const [y0, y1] = sel;
    const scale = yScales[dim.key];
    if (dim.type === "ordinal") {
      // For ordinal: check if the point's y falls within brush range
      const yVal = scale(d[dim.key]);
      if (yVal < y0 || yVal > y1) return false;
    } else {
      const yVal = scale(d[dim.key]);
      if (yVal < y0 || yVal > y1) return false;
    }
  }
  return true;
}

function render() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(margin.left, margin.top);

  const selected = [], unselected = [];
  const hasBrush = Object.keys(brushSelections).length > 0;

  for (const d of data) {
    if (!hasBrush || isSelected(d)) selected.push(d);
    else unselected.push(d);
  }

  // Background (unselected)
  ctx.globalAlpha = 0.08;
  ctx.lineWidth = 1;
  for (const d of unselected) {
    ctx.strokeStyle = colorScale(d.department);
    ctx.beginPath();
    pathLine(d, ctx);
    ctx.stroke();
  }

  // Foreground (selected)
  const alpha = Math.max(0.15, Math.min(0.85, 80 / selected.length));
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 1.3;
  for (const d of selected) {
    ctx.strokeStyle = colorScale(d.department);
    ctx.beginPath();
    pathLine(d, ctx);
    ctx.stroke();
  }

  ctx.restore();

  d3.select("#count").text(`${selected.length} of ${n} employees selected`);
}

// --- Axes ---
for (const dim of dimensions) {
  const g = svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${xScale(dim.key)},0)`);

  let axis;
  if (dim.type === "log") {
    axis = d3.axisLeft(yScales[dim.key])
      .ticks(6, d => d >= 1000 ? `${d / 1000}k` : d);
    // Custom tick format for salary
    g.call(d3.axisLeft(yScales[dim.key]).ticks(6))
      .call(g => g.selectAll(".tick text").text(d => {
        if (d >= 1000000) return `${d / 1000000}M`;
        if (d >= 1000) return `${d / 1000}k`;
        return d;
      }));
  } else if (dim.type === "ordinal") {
    g.call(d3.axisLeft(yScales[dim.key]));
  } else {
    g.call(d3.axisLeft(yScales[dim.key]).ticks(6));
  }

  // Axis label
  g.append("text")
    .attr("class", "axis-label")
    .attr("y", -26)
    .text(dim.label);
}

// --- Brushes ---
for (const dim of dimensions) {
  const brush = d3.brushY()
    .extent([[-12, 0], [12, innerH]])
    .on("brush end", function (event) {
      if (event.selection) {
        brushSelections[dim.key] = event.selection;
      } else {
        delete brushSelections[dim.key];
      }
      render();
    });

  svg.append("g")
    .attr("class", "brush")
    .attr("transform", `translate(${xScale(dim.key)},0)`)
    .call(brush);
}

// --- Legend ---
const legend = d3.select("#legend");
for (const dept of departments) {
  const item = legend.append("span").attr("class", "legend-item");
  item.append("span").attr("class", "legend-swatch")
    .style("background", colorScale(dept));
  item.append("span").text(dept);
}

// --- Initial render ---
render();
</script>
</body>
</html>
