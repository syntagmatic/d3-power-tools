<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon Chart Stack — 8 Server CPU Series</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: "Inter", system-ui, sans-serif; padding: 24px; }
  h1 { font-size: 1.1rem; font-weight: 500; margin-bottom: 4px; color: #b8c0e0; }
  .subtitle { font-size: 0.75rem; color: #6a7194; margin-bottom: 16px; }
  #chart { position: relative; }
  .row-label { font-size: 0.7rem; fill: #8890b0; font-family: "SF Mono", "Fira Code", monospace; }
  .crosshair-line { stroke: rgba(255,255,255,0.35); stroke-width: 1; pointer-events: none; }
  .tooltip-box {
    position: absolute; pointer-events: none;
    background: rgba(20, 20, 40, 0.92); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; padding: 8px 10px; font-size: 0.7rem;
    font-family: "SF Mono", "Fira Code", monospace;
    line-height: 1.6; white-space: nowrap; backdrop-filter: blur(6px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .tooltip-time { color: #8890b0; font-size: 0.65rem; margin-bottom: 4px; }
  .tooltip-row { display: flex; align-items: center; gap: 6px; }
  .tooltip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .tooltip-name { color: #a0a8c8; min-width: 56px; }
  .tooltip-val { color: #e0e0e0; font-weight: 600; }
  .axis-line { stroke: #2a2d48; }
  .tick text { fill: #6a7194; font-size: 0.65rem; }
  .tick line { stroke: #2a2d48; }
  .domain { stroke: #2a2d48; }
</style>
</head>
<body>
<h1>Server CPU Utilization — 24-Hour Horizon Stack</h1>
<p class="subtitle">3-band horizon fold · 1-minute resolution · hover for crosshair</p>
<div id="chart"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Configuration ---
const servers = [
  { name: "web-01", group: "frontend", base: 35 },
  { name: "web-02", group: "frontend", base: 32 },
  { name: "api-01", group: "backend",  base: 45 },
  { name: "api-02", group: "backend",  base: 42 },
  { name: "db-01",  group: "database", base: 28 },
  { name: "db-02",  group: "database", base: 25 },
  { name: "cache-1", group: "cache",   base: 18 },
  { name: "cache-2", group: "cache",   base: 15 },
];

const N = 1440; // 24h at 1-min resolution
const bands = 3;
const rowH = 42;
const margin = { top: 28, right: 16, bottom: 32, left: 64 };
const width = Math.min(1200, window.innerWidth - 48);
const height = margin.top + servers.length * rowH + margin.bottom;

// --- Synthetic Data ---
// Seeded PRNG for reproducibility
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(42);

// Correlated spike clusters: define group-wide events
const spikeClusters = [
  { minute: 180,  duration: 40, groups: ["frontend", "backend"], intensity: 55 },  // 3 AM deploy
  { minute: 540,  duration: 60, groups: ["frontend", "backend", "database"], intensity: 45 }, // 9 AM traffic ramp
  { minute: 720,  duration: 90, groups: ["frontend", "backend", "cache", "database"], intensity: 60 }, // noon peak
  { minute: 900,  duration: 30, groups: ["database"], intensity: 70 },             // 3 PM batch job
  { minute: 1020, duration: 50, groups: ["frontend", "backend"], intensity: 40 },  // 5 PM traffic
  { minute: 1260, duration: 25, groups: ["cache", "database"], intensity: 50 },    // 9 PM backup
];

function generateSeries(server) {
  const start = new Date(2026, 2, 28, 0, 0, 0); // March 28, 2026
  const data = new Array(N);

  // Brownian-ish base with diurnal pattern
  let walk = 0;
  for (let i = 0; i < N; i++) {
    const hour = i / 60;
    // Diurnal curve: busier during business hours
    const diurnal = 12 * Math.sin(Math.PI * (hour - 6) / 12) * (hour >= 6 && hour <= 20 ? 1 : 0.2);
    walk += (rng() - 0.5) * 3;
    walk *= 0.98; // mean-revert

    let spike = 0;
    for (const cluster of spikeClusters) {
      if (cluster.groups.includes(server.group)) {
        const dist = i - cluster.minute;
        if (dist >= 0 && dist < cluster.duration) {
          // Bell-shaped spike with per-server jitter
          const t = dist / cluster.duration;
          const bell = Math.exp(-((t - 0.4) ** 2) / 0.06);
          spike += cluster.intensity * bell * (0.7 + 0.6 * rng());
        }
      }
    }

    const value = Math.max(0, Math.min(100, server.base + diurnal + walk + spike + (rng() - 0.5) * 6));
    data[i] = { date: new Date(+start + i * 60000), value };
  }
  return data;
}

const allSeries = servers.map(s => ({ ...s, data: generateSeries(s) }));

// --- Color per group ---
const groupColors = {
  frontend: "#4fc3f7",
  backend:  "#81c784",
  database: "#ffb74d",
  cache:    "#ce93d8",
};

// --- Scales ---
const x = d3.scaleUtc()
  .domain([allSeries[0].data[0].date, allSeries[0].data[N - 1].date])
  .range([margin.left, width - margin.right]);

// --- SVG ---
const svg = d3.select("#chart").append("svg")
  .attr("width", width)
  .attr("height", height)
  .style("overflow", "visible");

// Time axis
const xAxis = svg.append("g")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x)
    .ticks(d3.timeHour.every(3))
    .tickFormat(d3.utcFormat("%-I %p"))
    .tickSize(-height + margin.top + margin.bottom)
  );
xAxis.select(".domain").remove();
xAxis.selectAll(".tick line").attr("stroke", "#2a2d48").attr("stroke-dasharray", "2,3");

// --- Horizon rows ---
const step = 100 / bands; // each band covers 0..step of CPU%

allSeries.forEach((series, si) => {
  const y0 = margin.top + si * rowH;
  const g = svg.append("g").attr("transform", `translate(0,${y0})`);

  // Row label
  g.append("text")
    .attr("class", "row-label")
    .attr("x", margin.left - 8)
    .attr("y", rowH / 2)
    .attr("dy", "0.35em")
    .attr("text-anchor", "end")
    .text(series.name);

  // Separator line
  g.append("line")
    .attr("x1", margin.left).attr("x2", width - margin.right)
    .attr("y1", rowH).attr("y2", rowH)
    .attr("stroke", "#2a2d48").attr("stroke-width", 0.5);

  const baseColor = groupColors[series.group];
  const yScale = d3.scaleLinear().domain([0, step]).range([rowH, 0]);

  const area = d3.area()
    .x(d => x(d.date))
    .y0(rowH)
    .y1(d => yScale(d.value))
    .curve(d3.curveMonotoneX);

  // Render each band layer
  for (let band = 0; band < bands; band++) {
    const bandData = series.data.map(d => ({
      date: d.date,
      value: Math.max(0, Math.min(step, d.value - band * step)),
    }));

    const opacity = (band + 1) / bands;
    g.append("path")
      .datum(bandData)
      .attr("d", area)
      .attr("fill", baseColor)
      .attr("fill-opacity", opacity * 0.85)
      .attr("clip-path", `inset(0 ${width - margin.right}px 0 ${margin.left}px)`);
  }
});

// Clip horizon rows to chart area
svg.append("defs").append("clipPath").attr("id", "chart-clip")
  .append("rect")
  .attr("x", margin.left).attr("y", margin.top)
  .attr("width", width - margin.left - margin.right)
  .attr("height", servers.length * rowH);

// Re-render horizon paths inside clip
svg.selectAll("g").each(function() {
  d3.select(this).selectAll("path").attr("clip-path", null);
});

// Simple clip via overflow on each row — use a clip rect per row
allSeries.forEach((_, si) => {
  const clipId = `clip-row-${si}`;
  svg.select("defs").append("clipPath").attr("id", clipId)
    .append("rect")
    .attr("x", margin.left).attr("y", 0)
    .attr("width", width - margin.left - margin.right)
    .attr("height", rowH);
  svg.selectAll("g").filter((_, i) => i === si + 1) // +1 for axis group
    .attr("clip-path", `url(#${clipId})`);
});

// --- Crosshair + Tooltip ---
const crosshairLine = svg.append("line")
  .attr("class", "crosshair-line")
  .attr("y1", margin.top)
  .attr("y2", height - margin.bottom)
  .style("display", "none");

const tooltip = d3.select("#chart").append("div")
  .attr("class", "tooltip-box")
  .style("display", "none");

// Bisector for finding nearest minute
const bisect = d3.bisector(d => d.date).left;

// Interaction overlay
svg.append("rect")
  .attr("x", margin.left).attr("y", margin.top)
  .attr("width", width - margin.left - margin.right)
  .attr("height", servers.length * rowH)
  .attr("fill", "transparent")
  .on("pointermove", onPointerMove)
  .on("pointerleave", onPointerLeave);

function onPointerMove(event) {
  const [mx] = d3.pointer(event);
  const date = x.invert(mx);
  const idx = Math.min(N - 1, Math.max(0, bisect(allSeries[0].data, date)));

  crosshairLine
    .attr("x1", x(allSeries[0].data[idx].date))
    .attr("x2", x(allSeries[0].data[idx].date))
    .style("display", null);

  const timeStr = d3.utcFormat("%b %d, %-I:%M %p")(allSeries[0].data[idx].date);
  let html = `<div class="tooltip-time">${timeStr}</div>`;
  for (const series of allSeries) {
    const val = series.data[idx].value;
    const color = groupColors[series.group];
    html += `<div class="tooltip-row">
      <span class="tooltip-dot" style="background:${color}"></span>
      <span class="tooltip-name">${series.name}</span>
      <span class="tooltip-val">${val.toFixed(1)}%</span>
    </div>`;
  }

  tooltip.html(html).style("display", "block");

  // Position tooltip
  const chartRect = document.getElementById("chart").getBoundingClientRect();
  const txRaw = x(allSeries[0].data[idx].date) + 16;
  const tooltipNode = tooltip.node();
  const tw = tooltipNode.offsetWidth;
  const tx = txRaw + tw > width ? txRaw - tw - 32 : txRaw;
  tooltip.style("left", tx + "px").style("top", margin.top + "px");
}

function onPointerLeave() {
  crosshairLine.style("display", "none");
  tooltip.style("display", "none");
}

// --- Legend ---
const legend = svg.append("g")
  .attr("transform", `translate(${margin.left}, ${height - margin.bottom + 20})`);

const groups = Object.entries(groupColors);
groups.forEach(([name, color], i) => {
  const lg = legend.append("g").attr("transform", `translate(${i * 100}, 0)`);
  lg.append("rect").attr("width", 10).attr("height", 10).attr("rx", 2).attr("fill", color).attr("opacity", 0.85);
  lg.append("text").attr("x", 14).attr("y", 9).attr("fill", "#8890b0").attr("font-size", "0.65rem").text(name);
});
</script>
</body>
</html>
