<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cycle Plot — Monthly Retail Sales</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: "Helvetica Neue", sans-serif; background: #fafafa; display: flex; justify-content: center; padding: 24px 12px; }
  h1 { font-size: 18px; font-weight: 600; color: #222; }
  .subtitle { font-size: 13px; color: #666; margin-top: 2px; }
  .source { font-size: 11px; color: #999; margin-top: 6px; }
  .panel-label { font-size: 12px; font-weight: 600; fill: #333; }
  .year-label { font-size: 9px; fill: #888; }
  .mean-label { font-size: 9px; fill: #e15759; }
  .high-low-label { font-size: 9px; font-weight: 600; }
  .bracket-label { font-size: 11px; font-weight: 600; fill: #8b6914; }
</style>
</head>
<body>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data: 5 years of monthly retail sales ---
const years = [2019, 2020, 2021, 2022, 2023];
const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Base seasonal pattern (billions $) — realistic US retail shape
const baseSeasonal = [420, 390, 430, 440, 460, 470, 465, 480, 460, 475, 520, 590];
// Year-over-year growth factors
const yearGrowth = { 2019: 1.0, 2020: 0.95, 2021: 1.08, 2022: 1.18, 2023: 1.24 };

const rng = d3.randomNormal(0, 8);
const data = [];
years.forEach(year => {
  monthNames.forEach((m, mi) => {
    const base = baseSeasonal[mi] * yearGrowth[year];
    // COVID dip in spring 2020
    let covid = 1;
    if (year === 2020 && mi >= 2 && mi <= 4) covid = 0.82 + mi * 0.03;
    data.push({
      year, month: mi, monthName: m,
      value: Math.round(base * covid + rng())
    });
  });
});

// --- Layout ---
const margin = { top: 70, right: 20, bottom: 50, left: 50 };
const totalWidth = 960, totalHeight = 380;
const width = totalWidth - margin.left - margin.right;
const height = totalHeight - margin.top - margin.bottom;
const panelW = width / 12;
const panelPad = 6;

const svg = d3.select("body").append("svg")
  .attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`)
  .attr("width", totalWidth)
  .append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// --- Scales ---
const yExtent = d3.extent(data, d => d.value);
const y = d3.scaleLinear()
  .domain([yExtent[0] - 20, yExtent[1] + 20])
  .range([height, 0]);

const xLocal = d3.scalePoint()
  .domain(years)
  .range([panelPad, panelW - panelPad]);

// --- Title ---
d3.select("svg").append("text")
  .attr("x", totalWidth / 2).attr("y", 24)
  .attr("text-anchor", "middle")
  .attr("font-size", 18).attr("font-weight", 600).attr("fill", "#222")
  .text("Monthly Retail Sales — Cycle Plot");

d3.select("svg").append("text")
  .attr("x", totalWidth / 2).attr("y", 42)
  .attr("text-anchor", "middle")
  .attr("font-size", 13).attr("fill", "#666")
  .text("5-year year-over-year trend by month (2019–2023), billions $");

// --- Y axis ---
const yAxis = d3.axisLeft(y).ticks(6).tickFormat(d => `$${d}`);
svg.append("g")
  .call(yAxis)
  .call(g => g.select(".domain").remove())
  .call(g => g.selectAll(".tick line")
    .clone()
    .attr("x2", width)
    .attr("stroke", "#e0e0e0")
    .attr("stroke-dasharray", "2,2"));

// --- Per-month panels ---
const byMonth = d3.group(data, d => d.month);

monthNames.forEach((name, mi) => {
  const panel = svg.append("g")
    .attr("transform", `translate(${mi * panelW}, 0)`);

  const monthData = byMonth.get(mi).sort((a, b) => a.year - b.year);
  const mean = d3.mean(monthData, d => d.value);

  // Panel separator
  if (mi > 0) {
    panel.append("line")
      .attr("x1", 0).attr("x2", 0)
      .attr("y1", 0).attr("y2", height)
      .attr("stroke", "#e8e8e8");
  }

  // Month label
  panel.append("text")
    .attr("x", panelW / 2).attr("y", height + 16)
    .attr("text-anchor", "middle")
    .attr("class", "panel-label")
    .text(name);

  // Mean line
  panel.append("line")
    .attr("x1", panelPad - 2).attr("x2", panelW - panelPad + 2)
    .attr("y1", y(mean)).attr("y2", y(mean))
    .attr("stroke", "#e15759")
    .attr("stroke-width", 1.5)
    .attr("stroke-dasharray", "4,2");

  // Mean value label (show on select months to avoid clutter)
  if (mi === 0 || mi === 6 || mi === 11) {
    panel.append("text")
      .attr("x", panelW - panelPad + 4).attr("y", y(mean) + 3)
      .attr("class", "mean-label")
      .attr("text-anchor", "start")
      .text(`$${Math.round(mean)}`);
  }

  // Trend line through years
  const line = d3.line()
    .x(d => xLocal(d.year))
    .y(d => y(d.value));

  panel.append("path")
    .datum(monthData)
    .attr("d", line)
    .attr("fill", "none")
    .attr("stroke", "steelblue")
    .attr("stroke-width", 1.8);

  // Data points
  panel.selectAll("circle")
    .data(monthData)
    .join("circle")
    .attr("cx", d => xLocal(d.year))
    .attr("cy", d => y(d.value))
    .attr("r", 2.5)
    .attr("fill", "steelblue");

  // Year labels on first month
  if (mi === 0) {
    monthData.forEach(d => {
      panel.append("text")
        .attr("x", xLocal(d.year))
        .attr("y", height + 30)
        .attr("text-anchor", "middle")
        .attr("class", "year-label")
        .text(d.year);
    });
  }

  // High and low labels
  const high = d3.greatest(monthData, d => d.value);
  const low = d3.least(monthData, d => d.value);

  // High label
  panel.append("text")
    .attr("x", xLocal(high.year))
    .attr("y", y(high.value) - 7)
    .attr("text-anchor", "middle")
    .attr("class", "high-low-label")
    .attr("fill", "#2a7f2a")
    .text(`$${high.value}`);

  // Low label
  panel.append("text")
    .attr("x", xLocal(low.year))
    .attr("y", y(low.value) + 14)
    .attr("text-anchor", "middle")
    .attr("class", "high-low-label")
    .attr("fill", "#c44e52")
    .text(`$${low.value}`);
});

// --- Holiday season bracket annotation (Oct–Dec) ---
const bracketStart = 10 * panelW + panelPad;
const bracketEnd = 12 * panelW - panelPad;
const bracketY = -12;

const bracket = svg.append("g").attr("class", "bracket");

// Bracket shape
bracket.append("path")
  .attr("d", `M${bracketStart},${bracketY + 6} L${bracketStart},${bracketY} L${bracketEnd},${bracketY} L${bracketEnd},${bracketY + 6}`)
  .attr("fill", "none")
  .attr("stroke", "#8b6914")
  .attr("stroke-width", 1.5);

// Bracket label
bracket.append("text")
  .attr("x", (bracketStart + bracketEnd) / 2)
  .attr("y", bracketY - 4)
  .attr("text-anchor", "middle")
  .attr("class", "bracket-label")
  .text("Holiday Season");

// --- Legend ---
const legend = svg.append("g")
  .attr("transform", `translate(${width - 160}, ${-30})`);

legend.append("line")
  .attr("x1", 0).attr("x2", 20).attr("y1", 0).attr("y2", 0)
  .attr("stroke", "steelblue").attr("stroke-width", 1.8);
legend.append("text")
  .attr("x", 24).attr("y", 4)
  .attr("font-size", 11).attr("fill", "#444")
  .text("Year-over-year trend");

legend.append("line")
  .attr("x1", 0).attr("x2", 20).attr("y1", 16).attr("y2", 16)
  .attr("stroke", "#e15759").attr("stroke-width", 1.5)
  .attr("stroke-dasharray", "4,2");
legend.append("text")
  .attr("x", 24).attr("y", 20)
  .attr("font-size", 11).attr("fill", "#444")
  .text("Monthly mean");

// --- Source ---
d3.select("svg").append("text")
  .attr("x", totalWidth / 2).attr("y", totalHeight - 4)
  .attr("text-anchor", "middle")
  .attr("font-size", 11).attr("fill", "#999")
  .text("Synthetic data — modeled on US Census Bureau MARTS retail estimates");

</script>
</body>
</html>
