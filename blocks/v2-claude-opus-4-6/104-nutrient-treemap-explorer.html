<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrient Treemap Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #222; }
  #container { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 12px; }
  #breadcrumb { font-size: 13px; margin-bottom: 6px; min-height: 20px; }
  #breadcrumb span { cursor: pointer; color: #2563eb; }
  #breadcrumb span:hover { text-decoration: underline; }
  #breadcrumb span.current { color: #222; cursor: default; font-weight: 600; }
  #breadcrumb span.sep { color: #999; cursor: default; }
  #treemap-container { position: relative; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; background: #fff; }
  #treemap-container svg { display: block; }
  .cell rect { stroke: #fff; stroke-width: 1px; cursor: pointer; }
  .cell rect.highlighted { stroke: #f59e0b; stroke-width: 2.5px; }
  .cell rect.dimmed { opacity: 0.25; }
  .cell text { pointer-events: none; fill: #fff; font-size: 11px; font-weight: 500; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  .cell text.group-label { font-size: 13px; font-weight: 700; }
  #parcoords-container { margin-top: 16px; border: 1px solid #ddd; border-radius: 4px; background: #fff; position: relative; }
  #parcoords-container canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  #parcoords-container svg { position: relative; display: block; }
  .axis text { font-size: 11px; }
  .axis-label { font-size: 12px; font-weight: 600; fill: #333; cursor: default; }
  .brush .selection { fill: #2563eb; fill-opacity: 0.2; stroke: #2563eb; stroke-width: 1px; }
  .instructions { font-size: 12px; color: #888; margin-top: 6px; }
</style>
</head>
<body>
<div id="container">
  <h1>Nutrient Treemap Explorer</h1>
  <p class="subtitle">Food groups → foods. Click to zoom. Brush parallel coordinates axes to highlight.</p>
  <div id="breadcrumb"></div>
  <div id="treemap-container"></div>
  <div id="parcoords-container"></div>
  <p class="instructions">Click a group to zoom in · Click background to zoom out · Drag on axes below to filter</p>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// ── Synthetic nutrient data ──
const foodGroups = {
  "Grains": [
    { name: "White Rice", calories: 130, protein: 2.7, fat: 0.3, carbs: 28, fiber: 0.4, sugar: 0.1 },
    { name: "Brown Rice", calories: 112, protein: 2.6, fat: 0.9, carbs: 24, fiber: 1.8, sugar: 0.4 },
    { name: "Whole Wheat Bread", calories: 247, protein: 13, fat: 3.4, carbs: 41, fiber: 7, sugar: 6 },
    { name: "Oatmeal", calories: 68, protein: 2.4, fat: 1.4, carbs: 12, fiber: 1.7, sugar: 0.5 },
    { name: "Quinoa", calories: 120, protein: 4.4, fat: 1.9, carbs: 21, fiber: 2.8, sugar: 0.9 },
    { name: "Corn Tortilla", calories: 218, protein: 5.7, fat: 2.8, carbs: 44, fiber: 5.4, sugar: 1.1 },
    { name: "Pasta", calories: 131, protein: 5, fat: 1.1, carbs: 25, fiber: 1.8, sugar: 0.6 },
    { name: "Barley", calories: 123, protein: 2.3, fat: 0.4, carbs: 28, fiber: 3.8, sugar: 0.3 },
  ],
  "Vegetables": [
    { name: "Broccoli", calories: 34, protein: 2.8, fat: 0.4, carbs: 7, fiber: 2.6, sugar: 1.7 },
    { name: "Carrot", calories: 41, protein: 0.9, fat: 0.2, carbs: 10, fiber: 2.8, sugar: 4.7 },
    { name: "Spinach", calories: 23, protein: 2.9, fat: 0.4, carbs: 3.6, fiber: 2.2, sugar: 0.4 },
    { name: "Sweet Potato", calories: 86, protein: 1.6, fat: 0.1, carbs: 20, fiber: 3, sugar: 4.2 },
    { name: "Bell Pepper", calories: 31, protein: 1, fat: 0.3, carbs: 6, fiber: 2.1, sugar: 4.2 },
    { name: "Kale", calories: 49, protein: 4.3, fat: 0.9, carbs: 9, fiber: 3.6, sugar: 2.3 },
    { name: "Cauliflower", calories: 25, protein: 1.9, fat: 0.3, carbs: 5, fiber: 2, sugar: 1.9 },
    { name: "Zucchini", calories: 17, protein: 1.2, fat: 0.3, carbs: 3.1, fiber: 1, sugar: 2.5 },
    { name: "Tomato", calories: 18, protein: 0.9, fat: 0.2, carbs: 3.9, fiber: 1.2, sugar: 2.6 },
    { name: "Green Beans", calories: 31, protein: 1.8, fat: 0.1, carbs: 7, fiber: 3.4, sugar: 1.4 },
  ],
  "Fruits": [
    { name: "Apple", calories: 52, protein: 0.3, fat: 0.2, carbs: 14, fiber: 2.4, sugar: 10 },
    { name: "Banana", calories: 89, protein: 1.1, fat: 0.3, carbs: 23, fiber: 2.6, sugar: 12 },
    { name: "Orange", calories: 47, protein: 0.9, fat: 0.1, carbs: 12, fiber: 2.4, sugar: 9.4 },
    { name: "Strawberry", calories: 32, protein: 0.7, fat: 0.3, carbs: 7.7, fiber: 2, sugar: 4.9 },
    { name: "Blueberry", calories: 57, protein: 0.7, fat: 0.3, carbs: 14, fiber: 2.4, sugar: 10 },
    { name: "Mango", calories: 60, protein: 0.8, fat: 0.4, carbs: 15, fiber: 1.6, sugar: 14 },
    { name: "Grapes", calories: 69, protein: 0.7, fat: 0.2, carbs: 18, fiber: 0.9, sugar: 16 },
    { name: "Avocado", calories: 160, protein: 2, fat: 15, carbs: 9, fiber: 6.7, sugar: 0.7 },
    { name: "Pineapple", calories: 50, protein: 0.5, fat: 0.1, carbs: 13, fiber: 1.4, sugar: 10 },
  ],
  "Proteins": [
    { name: "Chicken Breast", calories: 165, protein: 31, fat: 3.6, carbs: 0, fiber: 0, sugar: 0 },
    { name: "Salmon", calories: 208, protein: 20, fat: 13, carbs: 0, fiber: 0, sugar: 0 },
    { name: "Egg", calories: 155, protein: 13, fat: 11, carbs: 1.1, fiber: 0, sugar: 1.1 },
    { name: "Ground Beef", calories: 250, protein: 26, fat: 15, carbs: 0, fiber: 0, sugar: 0 },
    { name: "Tofu", calories: 76, protein: 8, fat: 4.8, carbs: 1.9, fiber: 0.3, sugar: 0.6 },
    { name: "Lentils", calories: 116, protein: 9, fat: 0.4, carbs: 20, fiber: 7.9, sugar: 1.8 },
    { name: "Tuna", calories: 132, protein: 28, fat: 1.3, carbs: 0, fiber: 0, sugar: 0 },
    { name: "Shrimp", calories: 99, protein: 24, fat: 0.3, carbs: 0.2, fiber: 0, sugar: 0 },
    { name: "Turkey", calories: 135, protein: 30, fat: 1, carbs: 0, fiber: 0, sugar: 0 },
  ],
  "Dairy": [
    { name: "Whole Milk", calories: 61, protein: 3.2, fat: 3.3, carbs: 4.8, fiber: 0, sugar: 5.1 },
    { name: "Cheddar", calories: 403, protein: 25, fat: 33, carbs: 1.3, fiber: 0, sugar: 0.5 },
    { name: "Greek Yogurt", calories: 59, protein: 10, fat: 0.7, carbs: 3.6, fiber: 0, sugar: 3.2 },
    { name: "Cottage Cheese", calories: 98, protein: 11, fat: 4.3, carbs: 3.4, fiber: 0, sugar: 2.7 },
    { name: "Mozzarella", calories: 280, protein: 28, fat: 17, carbs: 3.1, fiber: 0, sugar: 1 },
    { name: "Butter", calories: 717, protein: 0.9, fat: 81, carbs: 0.1, fiber: 0, sugar: 0.1 },
    { name: "Cream Cheese", calories: 342, protein: 5.9, fat: 34, carbs: 4.1, fiber: 0, sugar: 3.2 },
  ],
  "Nuts & Seeds": [
    { name: "Almonds", calories: 579, protein: 21, fat: 50, carbs: 22, fiber: 12, sugar: 4.4 },
    { name: "Walnuts", calories: 654, protein: 15, fat: 65, carbs: 14, fiber: 6.7, sugar: 2.6 },
    { name: "Peanuts", calories: 567, protein: 26, fat: 49, carbs: 16, fiber: 8.5, sugar: 4 },
    { name: "Chia Seeds", calories: 486, protein: 17, fat: 31, carbs: 42, fiber: 34, sugar: 0 },
    { name: "Sunflower Seeds", calories: 584, protein: 21, fat: 51, carbs: 20, fiber: 8.6, sugar: 2.6 },
    { name: "Cashews", calories: 553, protein: 18, fat: 44, carbs: 30, fiber: 3.3, sugar: 5.9 },
    { name: "Flaxseed", calories: 534, protein: 18, fat: 42, carbs: 29, fiber: 27, sugar: 1.6 },
  ],
  "Sweets": [
    { name: "Dark Chocolate", calories: 546, protein: 5, fat: 31, carbs: 60, fiber: 7, sugar: 48 },
    { name: "Milk Chocolate", calories: 535, protein: 8, fat: 30, carbs: 59, fiber: 3.4, sugar: 52 },
    { name: "Honey", calories: 304, protein: 0.3, fat: 0, carbs: 82, fiber: 0.2, sugar: 82 },
    { name: "Ice Cream", calories: 207, protein: 3.5, fat: 11, carbs: 24, fiber: 0.7, sugar: 21 },
    { name: "Cookie", calories: 488, protein: 5.4, fat: 23, carbs: 67, fiber: 1.8, sugar: 32 },
    { name: "Donut", calories: 452, protein: 4.9, fat: 25, carbs: 51, fiber: 1.7, sugar: 18 },
  ],
};

const dims = ["calories", "protein", "fat", "carbs", "fiber", "sugar"];
const groupColor = d3.scaleOrdinal()
  .domain(Object.keys(foodGroups))
  .range(["#6366f1", "#10b981", "#f59e0b", "#ef4444", "#3b82f6", "#8b5cf6", "#ec4899"]);

// Flatten for parcoords
const flatData = [];
for (const [group, foods] of Object.entries(foodGroups)) {
  for (const food of foods) {
    flatData.push({ ...food, group });
  }
}

// Build hierarchy
const hierarchyData = {
  name: "All Foods",
  children: Object.entries(foodGroups).map(([group, foods]) => ({
    name: group,
    children: foods.map(f => ({ name: f.name, value: f.calories, group }))
  }))
};

// ── Layout ──
const tmWidth = 1168, tmHeight = 500;
const pcMargin = { top: 36, right: 30, bottom: 12, left: 30 };
const pcWidth = 1168, pcHeight = 220;
const pcInner = { w: pcWidth - pcMargin.left - pcMargin.right, h: pcHeight - pcMargin.top - pcMargin.bottom };

// ── Treemap ──
const root = d3.hierarchy(hierarchyData)
  .sum(d => d.value)
  .sort((a, b) => b.value - a.value);

d3.treemap().tile(d3.treemapSquarify).size([tmWidth, tmHeight]).paddingInner(2).paddingTop(22)(root);

const x = d3.scaleLinear().domain([0, tmWidth]).rangeRound([0, tmWidth]);
const y = d3.scaleLinear().domain([0, tmHeight]).rangeRound([0, tmHeight]);

let currentFocus = root;

const tmSvg = d3.select("#treemap-container").append("svg")
  .attr("viewBox", `0 0 ${tmWidth} ${tmHeight}`)
  .attr("width", "100%")
  .style("font", "11px system-ui, sans-serif");

const cellGroup = tmSvg.append("g");

function isDescendant(d, ancestor) {
  let node = d;
  while (node) {
    if (node === ancestor) return true;
    node = node.parent;
  }
  return false;
}

function getColor(d) {
  let node = d;
  while (node.depth > 1) node = node.parent;
  return node.depth === 1 ? groupColor(node.data.name) : "#ccc";
}

function renderTreemap() {
  const leaves = root.leaves();
  const groups = root.children || [];

  cellGroup.selectAll("*").remove();

  // Group headers
  const gGroup = cellGroup.selectAll("g.group-cell")
    .data(groups, d => d.data.name)
    .join("g")
    .attr("class", "group-cell")
    .attr("transform", d => `translate(${x(d.x0)},${y(d.y0)})`);

  gGroup.append("rect")
    .attr("width", d => Math.max(0, x(d.x1) - x(d.x0)))
    .attr("height", d => Math.max(0, y(d.y1) - y(d.y0)))
    .attr("fill", d => d3.color(groupColor(d.data.name)).brighter(1.5))
    .attr("rx", 2)
    .style("cursor", "pointer")
    .on("click", (event, d) => {
      event.stopPropagation();
      zoomTo(d === currentFocus ? root : d);
    });

  gGroup.append("text")
    .attr("class", "group-label")
    .attr("x", 4)
    .attr("y", 15)
    .text(d => d.data.name)
    .attr("fill", "#333")
    .style("text-shadow", "none")
    .style("font-size", "12px")
    .style("font-weight", "700")
    .each(function(d) {
      const w = x(d.x1) - x(d.x0);
      if (this.getComputedTextLength() > w - 8) d3.select(this).text("");
    });

  // Leaf cells
  const cell = cellGroup.selectAll("g.cell")
    .data(leaves, d => d.data.name)
    .join("g")
    .attr("class", "cell")
    .attr("transform", d => `translate(${x(d.x0)},${y(d.y0)})`);

  cell.append("rect")
    .attr("width", d => Math.max(0, x(d.x1) - x(d.x0)))
    .attr("height", d => Math.max(0, y(d.y1) - y(d.y0)))
    .attr("fill", d => getColor(d))
    .attr("rx", 1)
    .on("click", (event, d) => {
      event.stopPropagation();
      if (d.parent && d.parent !== currentFocus) {
        zoomTo(d.parent);
      }
    });

  cell.append("text")
    .attr("x", 3)
    .attr("y", 13)
    .text(d => d.data.name)
    .each(function(d) {
      const w = x(d.x1) - x(d.x0);
      const h = y(d.y1) - y(d.y0);
      if (this.getComputedTextLength() > w - 6 || h < 16) d3.select(this).text("");
    });

  // Click background to zoom out
  tmSvg.on("click", () => {
    if (currentFocus !== root) zoomTo(root);
  });
}

function zoomTo(group) {
  currentFocus = group;
  x.domain([group.x0, group.x1]);
  y.domain([group.y0, group.y1]);

  const t = tmSvg.transition().duration(650).ease(d3.easeCubicInOut);

  cellGroup.selectAll("g.group-cell")
    .transition(t)
    .attr("transform", d => `translate(${x(d.x0)},${y(d.y0)})`)
    .style("opacity", d => (d === group || group === root) ? 1 : 0)
    .select("rect")
      .attr("width", d => Math.max(0, x(d.x1) - x(d.x0)))
      .attr("height", d => Math.max(0, y(d.y1) - y(d.y0)));

  cellGroup.selectAll("g.group-cell text")
    .transition(t)
    .style("opacity", d => {
      if (d === group && group !== root) return 0;
      return 1;
    });

  cellGroup.selectAll("g.cell")
    .transition(t)
    .attr("transform", d => `translate(${x(d.x0)},${y(d.y0)})`)
    .style("opacity", d => isDescendant(d, group) ? 1 : 0);

  cellGroup.selectAll("g.cell rect")
    .transition(t)
    .attr("width", d => Math.max(0, x(d.x1) - x(d.x0)))
    .attr("height", d => Math.max(0, y(d.y1) - y(d.y0)));

  // Re-fit labels after transition
  t.end().then(() => {
    cellGroup.selectAll("g.cell text").each(function(d) {
      const w = x(d.x1) - x(d.x0);
      const h = y(d.y1) - y(d.y0);
      const visible = isDescendant(d, group) && w > 30 && h > 16;
      d3.select(this).text(visible ? d.data.name : "");
    });
    cellGroup.selectAll("g.group-cell text").each(function(d) {
      const w = x(d.x1) - x(d.x0);
      const visible = w > 50;
      const show = (d === group && group !== root) ? false : visible;
      d3.select(this).text(show ? d.data.name : "");
    });
  }).catch(() => {});

  updateBreadcrumb();
}

function updateBreadcrumb() {
  const bc = d3.select("#breadcrumb");
  const ancestors = currentFocus.ancestors().reverse();
  bc.html("");
  ancestors.forEach((d, i) => {
    if (i > 0) bc.append("span").attr("class", "sep").text(" › ");
    const span = bc.append("span")
      .text(d.data.name)
      .classed("current", i === ancestors.length - 1);
    if (i < ancestors.length - 1) {
      span.on("click", () => zoomTo(d));
    }
  });
}

// ── Parallel Coordinates ──
const pcContainer = d3.select("#parcoords-container");

const canvas = pcContainer.append("canvas")
  .attr("width", pcWidth)
  .attr("height", pcHeight)
  .style("width", pcWidth + "px")
  .style("height", pcHeight + "px");

const dpr = window.devicePixelRatio || 1;
const canvasEl = canvas.node();
canvasEl.width = pcWidth * dpr;
canvasEl.height = pcHeight * dpr;
const ctx = canvasEl.getContext("2d");
ctx.scale(dpr, dpr);

const pcSvg = pcContainer.append("svg")
  .attr("width", pcWidth)
  .attr("height", pcHeight);

const pcG = pcSvg.append("g")
  .attr("transform", `translate(${pcMargin.left},${pcMargin.top})`);

const xPC = d3.scalePoint().domain(dims).range([0, pcInner.w]);
const yScales = {};
for (const dim of dims) {
  yScales[dim] = d3.scaleLinear()
    .domain(d3.extent(flatData, d => d[dim])).nice()
    .range([pcInner.h, 0]);
}

const dimLabels = {
  calories: "Calories", protein: "Protein (g)", fat: "Fat (g)",
  carbs: "Carbs (g)", fiber: "Fiber (g)", sugar: "Sugar (g)"
};

// Axes
const axisG = pcG.selectAll("g.axis")
  .data(dims)
  .join("g")
  .attr("class", "axis")
  .attr("transform", d => `translate(${xPC(d)},0)`);

axisG.each(function(dim) {
  d3.select(this).call(d3.axisLeft(yScales[dim]).ticks(5));
});

axisG.append("text")
  .attr("class", "axis-label")
  .attr("y", -14)
  .attr("text-anchor", "middle")
  .text(d => dimLabels[d]);

// Brushes
const brushes = {};
const filters = {};

const brush = d3.brushY()
  .extent([[-12, 0], [12, pcInner.h]])
  .on("brush end", function(event, dim) {
    if (!event.selection) {
      delete filters[dim];
    } else {
      const [y0, y1] = event.selection;
      const scale = yScales[dim];
      filters[dim] = d => {
        const v = scale(d[dim]);
        return v >= y0 && v <= y1;
      };
    }
    const selected = getSelected();
    drawPC(selected);
    highlightTreemap(selected);
  });

axisG.append("g")
  .attr("class", "brush")
  .each(function(dim) {
    d3.select(this).call(brush);
    brushes[dim] = this;
  });

function getSelected() {
  if (Object.keys(filters).length === 0) return null;
  return new Set(flatData.filter(d =>
    Object.values(filters).every(f => f(d))
  ).map(d => d.name));
}

function drawPC(selected) {
  ctx.clearRect(0, 0, pcWidth, pcHeight);
  ctx.save();
  ctx.translate(pcMargin.left, pcMargin.top);

  const drawLine = (d, style) => {
    ctx.strokeStyle = style;
    ctx.beginPath();
    dims.forEach((dim, i) => {
      const px = xPC(dim);
      const py = yScales[dim](d[dim]);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.stroke();
  };

  // Ghost layer
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.15;
  for (const d of flatData) {
    drawLine(d, d3.color(groupColor(d.group)).toString());
  }

  // Active layer
  if (selected) {
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 1.8;
    for (const d of flatData) {
      if (selected.has(d.name)) {
        drawLine(d, groupColor(d.group));
      }
    }
  } else {
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.2;
    for (const d of flatData) {
      drawLine(d, groupColor(d.group));
    }
  }

  ctx.restore();
}

function highlightTreemap(selected) {
  cellGroup.selectAll("g.cell rect")
    .classed("highlighted", d => selected ? selected.has(d.data.name) : false)
    .classed("dimmed", d => selected ? !selected.has(d.data.name) : false);
}

// ── Initialize ──
renderTreemap();
updateBreadcrumb();
drawPC(null);
</script>
</body>
</html>
