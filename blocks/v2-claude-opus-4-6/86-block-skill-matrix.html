<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block × Skill Matrix</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #111; color: #ccc; font-family: "Helvetica Neue", sans-serif; overflow: hidden; }
  #container { width: 100vw; height: 100vh; position: relative; }
  .title { position: absolute; top: 12px; left: 16px; font-size: 14px; color: #999; z-index: 10; pointer-events: none; }
  .title span { color: #eee; font-weight: 600; }
  #controls { position: absolute; top: 10px; right: 16px; z-index: 10; display: flex; gap: 8px; }
  #controls button {
    background: #222; border: 1px solid #444; color: #ccc; padding: 4px 10px;
    font-size: 11px; cursor: pointer; border-radius: 3px;
  }
  #controls button:hover { background: #333; }
  #controls button.active { background: #335; border-color: #68f; color: #9bf; }
  #tooltip {
    position: absolute; pointer-events: none; background: rgba(0,0,0,0.88);
    border: 1px solid #555; border-radius: 4px; padding: 6px 10px;
    font-size: 12px; color: #eee; display: none; z-index: 20; white-space: nowrap;
  }
</style>
</head>
<body>

  <div class="title"><span>Block × Skill Matrix</span> — 105 blocks, 34 skills</div>
  <div id="controls">
    <button class="active" data-order="category">By Category</button>
    <button data-order="frequency">By Frequency</button>
    <button data-order="alpha">A–Z</button>
  </div>
  <div id="tooltip"></div>
</div>

  {id:"90",name:"Skill Growth Sparklines",skills:["sparkcharts","data-gathering","time-series"]},
  {id:"91",name:"Test Coverage Heatmap",skills:["color","scales","data-table"]},
  {id:"92",name:"Score Delta Waterfall",skills:["scales","annotation","color"]},
  {id:"93",name:"Prompt Complexity Scatter",skills:["brushing","annotation","scales"]},
  {id:"94",name:"Election Swing Map",skills:["cartography","time-series","linked-views"]},
  {id:"95",name:"Flight Route Bundling",skills:["edge-bundling","cartography","canvas"]},
  {id:"96",name:"Regional Parcoords Grid",skills:["parallel-coordinates","small-multiples","brushing"]},
  {id:"97",name:"Supply Chain Sankey",skills:["network","motion","brushing"]},
  {id:"98",name:"Shape-Morphing Timeline",skills:["shape-morphing","time-series","motion"]},
  {id:"99",name:"Tidal Harmonic Decomposition",skills:["time-series","distributions","annotation"]},
  {id:"100",name:"City Similarity Explorer",skills:["parallel-coordinates","cartography","linked-views"]},
  {id:"101",name:"WebGL Color Space",skills:["webgl","color","navigation"]},
  {id:"102",name:"Earthquake Depth Globe",skills:["cartography","distributions","canvas"]},
  {id:"103",name:"Book Sentence Rhythm",skills:["sparkcharts","distributions","small-multiples"]},
  {id:"104",name:"Nutrient Treemap Explorer",skills:["hierarchy-interaction","parallel-coordinates","linked-views"]},
  {id:"105",name:"Migration Flow Chord",skills:["network","time-series","motion"]},
];

// Skill categories for grouping
const skillCategories = {
  "parallel-coordinates": "Patterns", "brushing": "Patterns", "linked-views": "Patterns",
  "distributions": "Patterns", "small-multiples": "Patterns",
  "hierarchy-layouts": "Structure", "hierarchy-interaction": "Structure",
  "edge-bundling": "Structure", "force": "Structure", "network": "Structure",
  "cartography": "Place",
  "time-series": "Change", "motion": "Change", "shape-morphing": "Change",
  "scales": "Legibility", "color": "Legibility", "visual-texture": "Legibility",
  "annotation": "Legibility", "data-table": "Legibility", "canvas-accessibility": "Legibility",
  "canvas": "Performance", "webgl": "Performance", "navigation": "Performance", "responsive": "Performance",
  "data-gathering": "Data", "sparkcharts": "Data",
};

const categoryOrder = ["Patterns","Structure","Place","Change","Legibility","Performance","Data"];
const categoryColors = {
  "Patterns":"#6baed6","Structure":"#74c476","Place":"#fd8d3c",
  "Change":"#e377c2","Legibility":"#fdd835","Performance":"#ef5350","Data":"#ab47bc"
};

// Collect unique skills
const allSkills = Array.from(new Set(blocks.flatMap(b => b.skills))).sort();
const skillFreq = new Map();
allSkills.forEach(s => skillFreq.set(s, 0));
blocks.forEach(b => b.skills.forEach(s => skillFreq.set(s, skillFreq.get(s) + 1)));

// Orderings
const orderFns = {
  category: [...allSkills].sort((a, b) => {
    const ca = categoryOrder.indexOf(skillCategories[a] || "Data");
    const cb = categoryOrder.indexOf(skillCategories[b] || "Data");
    return ca - cb || a.localeCompare(b);
  }),
  frequency: [...allSkills].sort((a, b) => skillFreq.get(b) - skillFreq.get(a)),
  alpha: [...allSkills].sort(),
};

let currentOrder = "category";
let orderedSkills = orderFns[currentOrder];

// ── Layout ──────────────────────────────────────────────────────────────
const margin = { top: 180, right: 20, bottom: 30, left: 40 };
const container = document.getElementById("container");
const tooltip = document.getElementById("tooltip");

const svg = d3.select("#container").append("svg")
  .attr("width", "100%").attr("height", "100%");

const width = container.clientWidth;
const height = container.clientHeight;
svg.attr("viewBox", `0 0 ${width} ${height}`);

const matrixWidth = width - margin.left - margin.right;
const matrixHeight = height - margin.top - margin.bottom;
const cellW = Math.min(matrixWidth / allSkills.length, 18);
const cellH = Math.min(matrixHeight / blocks.length, 6);
const totalW = cellW * allSkills.length;
const totalH = cellH * blocks.length;

// Center the matrix
const offsetX = margin.left + (matrixWidth - totalW) / 2;
const offsetY = margin.top + (matrixHeight - totalH) / 2;

const g = svg.append("g").attr("transform", `translate(${offsetX},${offsetY})`);

// ── Zoom ────────────────────────────────────────────────────────────────
const zoom = d3.zoom()
  .scaleExtent([1, 6])
  .translateExtent([[0, 0], [totalW, totalH]])
  .on("zoom", ({transform}) => {
    g.attr("transform", `translate(${offsetX + transform.x},${offsetY + transform.y}) scale(${transform.k})`);
  });
svg.call(zoom);

// ── Build matrix ────────────────────────────────────────────────────────
const cellColor = d3.scaleOrdinal()
  .domain(categoryOrder)
  .range(categoryOrder.map(c => categoryColors[c]));

// Build a lookup set for fast cell checks
const blockSkillSet = new Set();
blocks.forEach(b => b.skills.forEach(s => blockSkillSet.add(`${b.id}|${s}`)));

// Row backgrounds (alternating)
const rows = g.selectAll(".row")
  .data(blocks)
  .join("g")
  .attr("class", "row")
  .attr("transform", (d, i) => `translate(0,${i * cellH})`);

rows.append("rect")
  .attr("width", totalW)
  .attr("height", cellH)
  .attr("fill", (d, i) => i % 2 === 0 ? "rgba(255,255,255,0.015)" : "none");

// Cells
function renderCells() {
  const skillIndex = new Map(orderedSkills.map((s, i) => [s, i]));

  // Flatten to cell data
  const cells = [];
  blocks.forEach((b, bi) => {
    b.skills.forEach(s => {
      cells.push({ block: b, skill: s, bi, si: skillIndex.get(s) });
    });
  });

  const cellSel = g.selectAll(".cell")
    .data(cells, d => `${d.block.id}|${d.skill}`);

  cellSel.join(
    enter => enter.append("rect")
      .attr("class", "cell")
      .attr("rx", 1)
      .attr("width", Math.max(cellW - 1, 1))
      .attr("height", Math.max(cellH - 1, 0.5))
      .attr("y", d => d.bi * cellH)
      .attr("x", d => d.si * cellW)
      .attr("fill", d => {
        const cat = skillCategories[d.skill] || "Data";
        const c = d3.color(categoryColors[cat]);
        c.opacity = 0.8;
        return c + "";
      })
      .attr("stroke", "none")
      .on("pointerenter", (e, d) => {
        // Highlight row + col
        g.selectAll(".cell")
          .attr("opacity", c => c.bi === d.bi || c.skill === d.skill ? 1 : 0.15);
        g.selectAll(".col-label")
          .attr("fill", c => c === d.skill ? "#fff" : "#666");
        // Tooltip
        tooltip.style.display = "block";
        tooltip.innerHTML = `<strong>#${d.block.id}</strong> ${d.block.name}<br>Skill: <strong>${d.skill}</strong> (${skillCategories[d.skill]})`;
      })
      .on("pointermove", (e) => {
        tooltip.style.left = (e.clientX + 12) + "px";
        tooltip.style.top = (e.clientY - 10) + "px";
      })
      .on("pointerleave", () => {
        g.selectAll(".cell").attr("opacity", 1);
        g.selectAll(".col-label").attr("fill", "#999");
        tooltip.style.display = "none";
      }),
    update => update.transition().duration(500)
      .attr("x", d => d.si * cellW),
    exit => exit.remove()
  );
}

// Column labels (skill names)
function renderLabels() {
  const skillIndex = new Map(orderedSkills.map((s, i) => [s, i]));

  g.selectAll(".col-label").remove();
  g.selectAll(".col-label")
    .data(orderedSkills)
    .join("text")
    .attr("class", "col-label")
    .attr("x", 0)
    .attr("y", 0)
    .attr("transform", (d, i) => `translate(${i * cellW + cellW / 2}, -6) rotate(-55)`)
    .attr("text-anchor", "start")
    .attr("font-size", Math.min(cellW * 0.7, 10))
    .attr("fill", "#999")
    .text(d => d);

  // Category color bar at top
  g.selectAll(".cat-bar").remove();
  g.selectAll(".cat-bar")
    .data(orderedSkills)
    .join("rect")
    .attr("class", "cat-bar")
    .attr("x", (d, i) => i * cellW)
    .attr("y", -4)
    .attr("width", Math.max(cellW - 1, 1))
    .attr("height", 3)
    .attr("rx", 1)
    .attr("fill", d => categoryColors[skillCategories[d] || "Data"])
    .attr("opacity", 0.6);

  // Frequency bar below matrix
  g.selectAll(".freq-bar").remove();
  g.selectAll(".freq-bar")
    .data(orderedSkills)
    .join("rect")
    .attr("class", "freq-bar")
    .attr("x", (d, i) => i * cellW)
    .attr("y", totalH + 2)
    .attr("width", Math.max(cellW - 1, 1))
    .attr("height", d => (skillFreq.get(d) / d3.max([...skillFreq.values()])) * 16)
    .attr("rx", 1)
    .attr("fill", d => categoryColors[skillCategories[d] || "Data"])
    .attr("opacity", 0.4);
}

// Block ID labels on left
g.selectAll(".block-label")
  .data(blocks.filter((d, i) => i % 5 === 0))
  .join("text")
  .attr("class", "block-label")
  .attr("x", -4)
  .attr("y", (d, i) => i * 5 * cellH + cellH / 2)
  .attr("text-anchor", "end")
  .attr("dominant-baseline", "middle")
  .attr("font-size", Math.min(cellH * 0.9, 8))
  .attr("fill", "#666")
  .text(d => d.id);

renderCells();
renderLabels();

// ── Controls ────────────────────────────────────────────────────────────
d3.selectAll("#controls button").on("click", function() {
  const order = this.dataset.order;
  if (order === currentOrder) return;
  currentOrder = order;
  orderedSkills = orderFns[order];
  d3.selectAll("#controls button").classed("active", false);
  d3.select(this).classed("active", true);
  renderCells();
  renderLabels();
});

// Category legend
const legend = svg.append("g")
  .attr("transform", `translate(${offsetX}, ${offsetY - 120})`);

categoryOrder.forEach((cat, i) => {
  const lx = i * 100;
  legend.append("rect").attr("x", lx).attr("y", 0).attr("width", 8).attr("height", 8)
    .attr("rx", 2).attr("fill", categoryColors[cat]).attr("opacity", 0.8);
  legend.append("text").attr("x", lx + 12).attr("y", 8)
    .attr("font-size", 10).attr("fill", "#888").text(cat);
});

</script>
</body>
</html>
