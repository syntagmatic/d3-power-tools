<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collapsible Taxonomy Tree with Search</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa;
    color: #222;
  }
  #controls {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #search {
    font-size: 14px;
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 280px;
    outline: none;
  }
  #search:focus { border-color: #4a90d9; box-shadow: 0 0 0 2px rgba(74,144,217,0.2); }
  #match-count {
    font-size: 13px;
    color: #777;
    min-width: 100px;
  }
  #tree-container {
    margin-top: 52px;
    overflow: auto;
    width: 100vw;
    height: calc(100vh - 52px);
  }
  .node circle {
    cursor: pointer;
    stroke-width: 1.5px;
  }
  .node text {
    font-size: 12px;
    pointer-events: none;
  }
  .node--collapsed circle { fill: #555; stroke: #333; }
  .node--leaf circle { fill: #fff; stroke: #999; }
  .node--expanded circle { fill: #fff; stroke: #555; }
  .node--match circle { fill: #f0c040 !important; stroke: #d4a017 !important; }
  .node--match text { font-weight: 700; fill: #8b6914; }
  .node--path circle { stroke: #4a90d9 !important; stroke-width: 2px; }
  .link { fill: none; stroke: #ccc; stroke-width: 1.2px; }
  .link--path { stroke: #4a90d9; stroke-width: 2px; }
  .descendant-count {
    font-size: 9px;
    fill: #fff;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="controls">
  <input id="search" type="text" placeholder="Search taxonomy (e.g. Canis, Felidae)…" autocomplete="off">
  <span id="match-count"></span>
</div>
<div id="tree-container">
  <svg id="tree-svg"></svg>
</div>

<script type="module">

        ]},

          ]},

          ]},

        ]},

          ]},

        ]},

          ]},

          ]}
        ]}
      ]},
      { name: "Amphibia", children: [

            { name: "Lithobates", children: [{ name: "L. catesbeianus" }] }
          ]},
          { name: "Dendrobatidae", children: [

          ]}
        ]},
        { name: "Caudata", children: [
          { name: "Salamandridae", children: [
            { name: "Salamandra", children: [{ name: "S. salamandra" }] }
          ]},
          { name: "Ambystomatidae", children: [
            { name: "Ambystoma", children: [{ name: "A. mexicanum" }] }
          ]}
        ]}
      ]}
    ]},
    { name: "Arthropoda", children: [
      { name: "Insecta", children: [
        { name: "Lepidoptera", children: [
          { name: "Nymphalidae", children: [
            { name: "Danaus", children: [{ name: "D. plexippus" }] },
            { name: "Vanessa", children: [{ name: "V. cardui" }] }
          ]},
          { name: "Papilionidae", children: [
            { name: "Papilio", children: [{ name: "P. machaon" }] }
          ]}
        ]},
        { name: "Coleoptera", children: [
          { name: "Coccinellidae", children: [
            { name: "Coccinella", children: [{ name: "C. septempunctata" }] }
          ]},

          ]}
        ]},
        { name: "Hymenoptera", children: [
          { name: "Apidae", children: [
            { name: "Apis", children: [{ name: "A. mellifera" }] },
            { name: "Bombus", children: [{ name: "B. terrestris" }] }
          ]},
          { name: "Formicidae", children: [
            { name: "Atta", children: [{ name: "A. cephalotes" }] }
          ]}
        ]}
      ]},
      { name: "Arachnida", children: [
        { name: "Araneae", children: [
          { name: "Theraphosidae", children: [
            { name: "Brachypelma", children: [{ name: "B. hamorii" }] }
          ]},
          { name: "Araneidae", children: [
            { name: "Argiope", children: [{ name: "A. bruennichi" }] }
          ]}
        ]}
      ]}
    ]},
    { name: "Mollusca", children: [
      { name: "Cephalopoda", children: [
        { name: "Octopodidae", children: [
          { name: "Octopus", children: [{ name: "O. vulgaris" }] }
        ]},
        { name: "Loliginidae", children: [
          { name: "Loligo", children: [{ name: "L. vulgaris" }] }
        ]}
      ]},
      { name: "Gastropoda", children: [
        { name: "Helicidae", children: [
          { name: "Helix", children: [{ name: "H. pomatia" }] }
        ]}
      ]}
    ]}
  ]
};

// ── Setup ──
const margin = { top: 20, right: 180, bottom: 20, left: 60 };
const nodeRadius = 6;
const dy = 18; // vertical spacing between nodes
const dx = 220; // horizontal spacing between levels
const duration = 400;

const root = d3.hierarchy(taxonomyData);

// Count all descendants
root.each(d => {
  d._totalDescendants = d.descendants().length - 1;
});

// Initially collapse everything except the first two levels
root.each(d => {
  if (d.depth >= 2 && d.children) {
    d._children = d.children;
    d.children = null;
  }
});

const tree = d3.tree().nodeSize([dy, dx]);

const svg = d3.select("#tree-svg");
const g = svg.append("g");

const linkGroup = g.append("g").attr("class", "links");
const nodeGroup = g.append("g").attr("class", "nodes");

// Zoom
const container = d3.select("#tree-container");
const zoom = d3.zoom()
  .scaleExtent([0.2, 3])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

// ── Search state ──
let matchSet = new Set();
let pathSet = new Set();

// ── Diagonal link generator ──
const diagonal = d3.linkHorizontal()
  .x(d => d.y)
  .y(d => d.x);

// ── Collapse / expand helpers ──
function collapse(d) {
  if (d.children) {
    d._children = d.children;
    d.children = null;
  }
}

function expandNode(d) {
  if (d._children) {
    d.children = d._children;
    d._children = null;
  }
}

function expandPath(d) {
  // Expand all ancestors from root to this node
  const ancestors = d.ancestors().reverse();
  for (const a of ancestors) {
    expandNode(a);
  }
}

// ── Count hidden descendants ──
function hiddenCount(d) {
  if (!d._children) return 0;
  let count = 0;
  const stack = [...d._children];
  while (stack.length) {
    const n = stack.pop();
    count++;
    const kids = n.children || n._children;
    if (kids) stack.push(...kids);
  }
  return count;
}

// ── Update ──
function update(source) {
  tree(root);

  // Get all visible nodes and links
  const nodes = root.descendants();
  const links = root.links();

  // Compute height needed
  let x0 = Infinity, x1 = -Infinity;
  root.each(d => {
    if (d.x > x1) x1 = d.x;
    if (d.x < x0) x0 = d.x;
  });
  const height = x1 - x0 + margin.top + margin.bottom + 40;
  const width = Math.max(960, d3.max(nodes, d => d.y) + margin.left + margin.right + 200);

  svg
    .attr("width", width)
    .attr("height", height)
    .attr("viewBox", [0, x0 - margin.top - 20, width, height]);

  // ── Links ──
  const link = linkGroup.selectAll("path.link")
    .data(links, d => d.target.data.name + d.target.depth);

  const linkEnter = link.enter().append("path")
    .attr("class", d => "link" + (pathSet.has(d.target) ? " link--path" : ""))
    .attr("d", () => {
      const o = { x: source.x0 ?? source.x, y: source.y0 ?? source.y };
      return diagonal({ source: o, target: o });
    });

  const linkMerge = linkEnter.merge(link);

  linkMerge.transition().duration(duration)
    .attr("d", diagonal)
    .attr("class", d => "link" + (pathSet.has(d.target) ? " link--path" : ""));

  link.exit().transition().duration(duration)
    .attr("d", () => {
      const o = { x: source.x, y: source.y };
      return diagonal({ source: o, target: o });
    })
    .remove();

  // ── Nodes ──
  const node = nodeGroup.selectAll("g.node")
    .data(nodes, d => d.data.name + d.depth);

  const nodeEnter = node.enter().append("g")
    .attr("class", "node")
    .attr("transform", () => `translate(${source.y0 ?? source.y},${source.x0 ?? source.x})`)
    .attr("opacity", 0)
    .on("click", (event, d) => {
      if (d.children) {
        collapse(d);
      } else if (d._children) {
        expandNode(d);
      }
      update(d);
    });

  nodeEnter.append("circle").attr("r", nodeRadius);

  nodeEnter.append("text")
    .attr("dy", "0.32em")
    .attr("x", d => (d.children || d._children) ? -10 : 10)
    .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
    .text(d => d.data.name);

  // Descendant count text (for collapsed nodes)
  nodeEnter.append("text")
    .attr("class", "descendant-count");

  const nodeMerge = nodeEnter.merge(node);

  nodeMerge.transition().duration(duration)
    .attr("transform", d => `translate(${d.y},${d.x})`)
    .attr("opacity", 1);

  // Update classes
  nodeMerge.each(function(d) {
    const sel = d3.select(this);
    const isMatch = matchSet.has(d);
    const isPath = pathSet.has(d);
    const isCollapsed = d._children;
    const isLeaf = !d.children && !d._children;

    sel.select("circle")
      .classed("node--match", false)
      .classed("node--path", false)
      .attr("r", nodeRadius);

    sel.attr("class", "node"
      + (isMatch ? " node--match" : "")
      + (isPath ? " node--path" : "")
      + (isCollapsed ? " node--collapsed" : isLeaf ? " node--leaf" : " node--expanded")
    );

    // Update text anchor for nodes that changed children state
    sel.select("text:not(.descendant-count)")
      .attr("x", (d.children || d._children) ? -10 : 10)
      .attr("text-anchor", (d.children || d._children) ? "end" : "start");

    // Descendant count
    const count = hiddenCount(d);
    sel.select(".descendant-count")
      .text(count > 0 ? count : "")
      .attr("opacity", count > 0 ? 1 : 0);
  });

  node.exit().transition().duration(duration)
    .attr("transform", `translate(${source.y},${source.x})`)
    .attr("opacity", 0)
    .remove();

  // Stash positions for next transition
  nodes.forEach(d => {
    d.x0 = d.x;
    d.y0 = d.y;
  });
}

// ── Search ──
function doSearch(query) {
  matchSet = new Set();
  pathSet = new Set();

  if (!query.trim()) {
    d3.select("#match-count").text("");
    update(root);
    return;
  }

  const q = query.toLowerCase();

  // Find all matching nodes in the full tree (including hidden)
  const allNodes = [];
  const stack = [root];
  while (stack.length) {
    const n = stack.pop();
    allNodes.push(n);
    if (n.children) stack.push(...n.children);
    if (n._children) stack.push(...n._children);
  }

  const matches = allNodes.filter(d => d.data.name.toLowerCase().includes(q));

  if (matches.length === 0) {
    d3.select("#match-count").text("No matches");
    update(root);
    return;
  }

  // Expand paths to all matches
  for (const m of matches) {
    matchSet.add(m);
    expandPath(m);
    // Mark path ancestors
    for (const a of m.ancestors()) {
      pathSet.add(a);
    }
  }

  d3.select("#match-count").text(`${matches.length} match${matches.length > 1 ? "es" : ""}`);
  update(root);

  // Scroll to first match after transition
  setTimeout(() => {
    const firstMatch = matches[0];
    if (firstMatch) {
      const transform = d3.zoomTransform(svg.node());
      const tx = -firstMatch.y * transform.k + 300;
      const ty = -firstMatch.x * transform.k + window.innerHeight / 2;
      svg.transition().duration(500)
        .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(transform.k));
    }
  }, duration + 50);
}

// Debounced search
let searchTimeout;
d3.select("#search").on("input", function() {
  clearTimeout(searchTimeout);
  const val = this.value;
  searchTimeout = setTimeout(() => doSearch(val), 200);
});

// ── Initial render ──
root.x0 = 0;
root.y0 = 0;
update(root);

// Center on root
setTimeout(() => {
  svg.call(zoom.transform, d3.zoomIdentity.translate(margin.left + 40, window.innerHeight / 2));
}, 100);
</script>
</body>
</html>
