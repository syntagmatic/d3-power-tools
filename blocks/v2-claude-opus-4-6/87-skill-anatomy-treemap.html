<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Anatomy Treemap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #f0f0f0;
  }
  .subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 16px;
  }
  #chart {
    position: relative;
    width: 100%;
    max-width: 960px;
  }
  .breadcrumb {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 8px;
    height: 18px;
  }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: #fff; text-decoration: underline; }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(10, 10, 30, 0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    color: #ddd;
    max-width: 240px;
    z-index: 10;
    backdrop-filter: blur(4px);
    display: none;
  }
  .tooltip .name { font-weight: 600; color: #fff; }
  .tooltip .lines { color: #aaa; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
    font-size: 12px;
    color: #999;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    opacity: 0.85;
  }
  .legend-item:hover { opacity: 1; }
  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
  }
</style>
</head>
<body>
<h1>Skill Anatomy</h1>
<p class="subtitle">Treemap of skill file sizes (lines) grouped by category — a self-portrait of the D3 Power Tools project</p>
<div id="chart">
  <div class="breadcrumb" id="breadcrumb"></div>
  <svg id="treemap"></svg>
</div>
<div class="legend" id="legend"></div>
<div class="tooltip" id="tooltip"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Synthetic data modeled on actual skill directory structure
const skills = {
  name: "skills",
  children: [
    { name: "Seeing Patterns", children: [
      { name: "parallel-coordinates", lines: 342 },
      { name: "brushing", lines: 287 },
      { name: "linked-views", lines: 310 },
      { name: "distributions", lines: 265 }
    ]},
    { name: "Seeing Structure", children: [
      { name: "hierarchy-layouts", lines: 232 },
      { name: "hierarchy-interaction", lines: 198 },
      { name: "edge-bundling", lines: 175 },
      { name: "force", lines: 320 },
      { name: "network", lines: 245 }
    ]},
    { name: "Seeing Place", children: [
      { name: "cartography", lines: 485 }
    ]},
    { name: "Seeing Change", children: [
      { name: "time-series", lines: 298 },
      { name: "motion", lines: 187 },
      { name: "shape-morphing", lines: 162 }
    ]},
    { name: "Making It Legible", children: [
      { name: "scales", lines: 275 },
      { name: "color", lines: 380 },
      { name: "visual-texture", lines: 195 },
      { name: "annotation", lines: 230 },
      { name: "data-table", lines: 145 },
      { name: "canvas-accessibility", lines: 168 }
    ]},
    { name: "Making It Work", children: [
      { name: "canvas", lines: 310 },
      { name: "webgl", lines: 265 },
      { name: "navigation", lines: 218 },
      { name: "responsive", lines: 192 }
    ]},
    { name: "Before You Render", children: [
      { name: "data-gathering", lines: 205 },
      { name: "sparkcharts", lines: 148 },
      { name: "small-multiples", lines: 178 }
    ]},
    { name: "Meta Skills", children: [
      { name: "d3-idioms", lines: 155 },
      { name: "jig-template", lines: 188 },
      { name: "visual-critic", lines: 142 },
      { name: "encoding-integrity", lines: 165 },
      { name: "stress-test", lines: 130 },
      { name: "cognitive-load", lines: 118 },
      { name: "calibrate-tool", lines: 135 },
      { name: "sharpen-tool", lines: 110 }
    ]}
  ]
};

const width = 960;
const height = 560;
const margin = { top: 0, right: 0, bottom: 0, left: 0 };

const svg = d3.select("#treemap")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("width", "100%")
  .style("display", "block");

const root = d3.hierarchy(skills)
  .sum(d => d.lines || 0)
  .sort((a, b) => b.value - a.value);

const categories = root.children.map(d => d.data.name);
const color = d3.scaleOrdinal()
  .domain(categories)
  .range([
    "#4e79a7", "#f28e2b", "#59a14f", "#e15759",
    "#76b7b2", "#edc948", "#b07aa1", "#9c755f"
  ]);

const treemap = d3.treemap()
  .size([width, height])
  .paddingTop(22)
  .paddingRight(2)
  .paddingBottom(2)
  .paddingLeft(2)
  .paddingInner(2)
  .tile(d3.treemapSquarify)
  .round(true);

treemap(root);

// Category group backgrounds
const groups = svg.selectAll("g.category")
  .data(root.children)
  .join("g")
    .attr("class", "category");

groups.append("rect")
  .attr("x", d => d.x0)
  .attr("y", d => d.y0)
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => d.y1 - d.y0)
  .attr("fill", d => color(d.data.name))
  .attr("fill-opacity", 0.12)
  .attr("rx", 3);

groups.append("text")
  .attr("x", d => d.x0 + 6)
  .attr("y", d => d.y0 + 15)
  .text(d => d.data.name)
  .attr("fill", d => d3.lab(color(d.data.name)).brighter(1.2))
  .attr("font-size", "11px")
  .attr("font-weight", 600)
  .each(function(d) {
    const available = d.x1 - d.x0 - 12;
    if (this.getComputedTextLength() > available) {
      let t = d.data.name;
      while (this.getComputedTextLength() > available && t.length > 0) {
        t = t.slice(0, -1);
        d3.select(this).text(t + "…");
      }
    }
  });

// Leaf cells
const leaves = root.leaves();
const cell = svg.selectAll("g.leaf")
  .data(leaves)
  .join("g")
    .attr("class", "leaf")
    .attr("transform", d => `translate(${d.x0},${d.y0})`);

cell.append("rect")
  .attr("width", d => Math.max(0, d.x1 - d.x0))
  .attr("height", d => Math.max(0, d.y1 - d.y0))
  .attr("fill", d => color(d.parent.data.name))
  .attr("fill-opacity", 0.7)
  .attr("rx", 2)
  .attr("stroke", "#1a1a2e")
  .attr("stroke-width", 1);

// Labels
cell.append("text")
  .attr("x", 4)
  .attr("y", 14)
  .attr("fill", "#fff")
  .attr("font-size", "11px")
  .attr("font-weight", 500)
  .text(d => d.data.name)
  .each(function(d) {
    const cw = d.x1 - d.x0 - 8;
    const ch = d.y1 - d.y0;
    if (ch < 16) { d3.select(this).remove(); return; }
    let text = d.data.name;
    while (this.getComputedTextLength() > cw && text.length > 0) {
      text = text.slice(0, -1);
      d3.select(this).text(text + "…");
    }
    if (text.length === 0) d3.select(this).remove();
  });

// Line count labels
cell.append("text")
  .attr("x", 4)
  .attr("y", 27)
  .attr("fill", "rgba(255,255,255,0.55)")
  .attr("font-size", "10px")
  .text(d => `${d.data.lines} lines`)
  .each(function(d) {
    const cw = d.x1 - d.x0 - 8;
    const ch = d.y1 - d.y0;
    if (ch < 30 || cw < 50) d3.select(this).remove();
  });

// Tooltip
const tooltip = d3.select("#tooltip");

cell.on("pointerenter", (event, d) => {
    const cat = d.parent.data.name;
    const pct = ((d.value / root.value) * 100).toFixed(1);
    tooltip.style("display", "block").html(
      `<div class="name">${d.data.name}</div>` +
      `<div>${cat}</div>` +
      `<div class="lines">${d.data.lines} lines (${pct}% of total)</div>`
    );
    d3.select(event.currentTarget).select("rect")
      .attr("fill-opacity", 0.95)
      .attr("stroke", "#fff")
      .attr("stroke-width", 1.5);
  })
  .on("pointermove", (event) => {
    tooltip
      .style("left", event.clientX + 14 + "px")
      .style("top", event.clientY - 10 + "px");
  })
  .on("pointerleave", (event) => {
    tooltip.style("display", "none");
    d3.select(event.currentTarget).select("rect")
      .attr("fill-opacity", 0.7)
      .attr("stroke", "#1a1a2e")
      .attr("stroke-width", 1);
  });

// Legend
const legend = d3.select("#legend");
categories.forEach(cat => {
  const catNode = root.children.find(d => d.data.name === cat);
  const item = legend.append("div").attr("class", "legend-item");
  item.append("div").attr("class", "legend-swatch")
    .style("background", color(cat));
  item.append("span").text(`${cat} (${catNode.value})`);
});

// Total line in subtitle
const totalLines = root.value;
d3.select(".subtitle").text(
  `Treemap of ${leaves.length} skill files — ${totalLines.toLocaleString()} total lines, grouped by category`
);
</script>
</body>
</html>
