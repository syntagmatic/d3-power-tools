<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dual-Encoded Bar Chart — Color + Pattern for Accessibility</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #fafafa; color: #333; padding: 24px; }
  h1 { text-align: center; font-size: 20px; margin-bottom: 24px; font-weight: 600; }
  .container { display: flex; justify-content: center; align-items: flex-start; gap: 0; flex-wrap: nowrap; }
  .chart-wrapper { text-align: center; }
  .chart-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #555; }
  .legend-wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 20px; align-self: center; margin-top: 40px; }
  .legend-title { font-size: 12px; font-weight: 600; margin-bottom: 10px; color: #555; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
  .legend-swatch { width: 24px; height: 18px; border: 1px solid #999; }
  .bar-label { font-size: 10px; fill: #333; text-anchor: middle; }
  .axis text { font-size: 11px; }
  .axis path, .axis line { stroke: #ccc; }
</style>
</head>
<body>
<h1>Dual-Encoded Bar Chart — Color + Pattern for Accessibility</h1>
<div class="container">
  <div class="chart-wrapper">
    <div class="chart-label">Normal Vision</div>
    <svg id="chart-normal"></svg>
  </div>
  <div class="legend-wrapper" id="legend"></div>
  <div class="chart-wrapper">
    <div class="chart-label">Deuteranopia Simulation</div>
    <svg id="chart-deutan"></svg>
  </div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Data ---
const products = ["Product A", "Product B", "Product C", "Product D"];
const quarters = ["Q1", "Q2", "Q3", "Q4"];
const data = [
  { quarter: "Q1", product: "Product A", revenue: 32 },
  { quarter: "Q1", product: "Product B", revenue: 45 },
  { quarter: "Q1", product: "Product C", revenue: 28 },
  { quarter: "Q1", product: "Product D", revenue: 18 },
  { quarter: "Q2", product: "Product A", revenue: 41 },
  { quarter: "Q2", product: "Product B", revenue: 52 },
  { quarter: "Q2", product: "Product C", revenue: 35 },
  { quarter: "Q2", product: "Product D", revenue: 24 },
  { quarter: "Q3", product: "Product A", revenue: 55 },
  { quarter: "Q3", product: "Product B", revenue: 61 },
  { quarter: "Q3", product: "Product C", revenue: 48 },
  { quarter: "Q3", product: "Product D", revenue: 37 },
  { quarter: "Q4", product: "Product A", revenue: 68 },
  { quarter: "Q4", product: "Product B", revenue: 74 },
  { quarter: "Q4", product: "Product C", revenue: 59 },
  { quarter: "Q4", product: "Product D", revenue: 43 },
];

// --- Color + pattern config ---
const config = [
  { product: "Product A", color: "#4477AA", darkColor: "#264466", patternType: "hatch" },
  { product: "Product B", color: "#EE6677", darkColor: "#993344", patternType: "horizontal" },
  { product: "Product C", color: "#228833", darkColor: "#114419", patternType: "stipple" },
  { product: "Product D", color: "#CCBB44", darkColor: "#887722", patternType: "crosshatch" },
];

const colorMap = new Map(config.map(c => [c.product, c.color]));

// --- Dimensions ---
const width = 500, height = 400;
const margin = { top: 30, right: 20, bottom: 40, left: 55 };
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

// --- Scales ---
const x0 = d3.scaleBand().domain(quarters).range([0, innerW]).paddingInner(0.2).paddingOuter(0.1);
const x1 = d3.scaleBand().domain(products).range([0, x0.bandwidth()]).padding(0.08);
const y = d3.scaleLinear().domain([0, 80]).range([innerH, 0]);

// --- Pattern definitions ---
function addPatterns(defs, prefix) {
  const spacing = 4;

  // Diagonal hatch for Product A
  defs.append("pattern")
    .attr("id", `${prefix}-hatch`)
    .attr("width", spacing).attr("height", spacing)
    .attr("patternUnits", "userSpaceOnUse")
    .attr("patternTransform", "rotate(45)")
    .append("line")
      .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", spacing)
      .attr("stroke", config[0].darkColor).attr("stroke-width", 1.2).attr("stroke-opacity", 0.5);

  // Horizontal stripes for Product B
  defs.append("pattern")
    .attr("id", `${prefix}-horizontal`)
    .attr("width", spacing).attr("height", spacing)
    .attr("patternUnits", "userSpaceOnUse")
    .append("line")
      .attr("x1", 0).attr("y1", spacing / 2).attr("x2", spacing).attr("y2", spacing / 2)
      .attr("stroke", config[1].darkColor).attr("stroke-width", 1.2).attr("stroke-opacity", 0.5);

  // Stipple dots for Product C (3px spacing)
  const stipPat = defs.append("pattern")
    .attr("id", `${prefix}-stipple`)
    .attr("width", 3).attr("height", 3)
    .attr("patternUnits", "userSpaceOnUse");
  stipPat.append("circle")
    .attr("cx", 1.5).attr("cy", 1.5).attr("r", 0.8)
    .attr("fill", config[2].darkColor).attr("fill-opacity", 0.5);

  // Crosshatch for Product D
  const crossPat = defs.append("pattern")
    .attr("id", `${prefix}-crosshatch`)
    .attr("width", spacing).attr("height", spacing)
    .attr("patternUnits", "userSpaceOnUse");
  crossPat.append("line")
    .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", spacing)
    .attr("stroke", config[3].darkColor).attr("stroke-width", 1).attr("stroke-opacity", 0.45)
    .attr("transform", `rotate(45, ${spacing/2}, ${spacing/2})`);
  crossPat.append("line")
    .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", spacing)
    .attr("stroke", config[3].darkColor).attr("stroke-width", 1).attr("stroke-opacity", 0.45)
    .attr("transform", `rotate(-45, ${spacing/2}, ${spacing/2})`);
}

// Brettel deuteranopia color matrix (approximation)
function addDeutanFilter(defs, id) {
  const filter = defs.append("filter").attr("id", id);
  filter.append("feColorMatrix")
    .attr("type", "matrix")
    .attr("values", [
      0.625, 0.375, 0.0, 0, 0,
      0.700, 0.300, 0.0, 0, 0,
      0.0,   0.300, 0.700, 0, 0,
      0,     0,     0,     1, 0
    ].join(" "));
}

// --- Draw chart ---
function drawChart(svgId, prefix, filterUrl) {
  const svg = d3.select(`#${svgId}`)
    .attr("width", width)
    .attr("height", height);

  const defs = svg.append("defs");
  addPatterns(defs, prefix);

  if (filterUrl) {
    addDeutanFilter(defs, `${prefix}-deutan`);
  }

  const wrapper = filterUrl
    ? svg.append("g").attr("filter", `url(#${prefix}-deutan)`)
    : svg.append("g");

  const g = wrapper.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // Axes
  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x0).tickSizeOuter(0));

  g.append("g")
    .attr("class", "axis")
    .call(d3.axisLeft(y).ticks(5).tickFormat(d => `$${d}M`));

  // Grouped bars
  const grouped = d3.groups(data, d => d.quarter);

  const quarterGroups = g.selectAll(".quarter-group")
    .data(grouped)
    .join("g")
      .attr("class", "quarter-group")
      .attr("transform", ([q]) => `translate(${x0(q)},0)`);

  // Each bar: color rect + pattern rect on top
  quarterGroups.each(function([, items]) {
    const group = d3.select(this);

    items.forEach(d => {
      const cfg = config.find(c => c.product === d.product);
      const bx = x1(d.product);
      const by = y(d.revenue);
      const bw = x1.bandwidth();
      const bh = innerH - by;

      // Color fill
      group.append("rect")
        .attr("x", bx).attr("y", by)
        .attr("width", bw).attr("height", bh)
        .attr("fill", cfg.color);

      // Pattern overlay
      group.append("rect")
        .attr("x", bx).attr("y", by)
        .attr("width", bw).attr("height", bh)
        .attr("fill", `url(#${prefix}-${cfg.patternType})`);

      // Value label
      group.append("text")
        .attr("class", "bar-label")
        .attr("x", bx + bw / 2)
        .attr("y", by - 4)
        .text(`$${d.revenue}M`);
    });
  });
}

drawChart("chart-normal", "norm", false);
drawChart("chart-deutan", "deut", true);

// --- Legend ---
const legendContainer = d3.select("#legend");
legendContainer.append("div").attr("class", "legend-title").text("Products");

// Create a small SVG for legend swatches with patterns
const legendSvg = legendContainer.append("svg")
  .attr("width", 140).attr("height", config.length * 32 + 4);

const legendDefs = legendSvg.append("defs");
addPatterns(legendDefs, "leg");

config.forEach((cfg, i) => {
  const gy = i * 32 + 4;

  // Color + pattern swatch
  legendSvg.append("rect")
    .attr("x", 4).attr("y", gy)
    .attr("width", 24).attr("height", 18)
    .attr("fill", cfg.color)
    .attr("stroke", "#999").attr("stroke-width", 0.5);
  legendSvg.append("rect")
    .attr("x", 4).attr("y", gy)
    .attr("width", 24).attr("height", 18)
    .attr("fill", `url(#leg-${cfg.patternType})`);

  // Label
  legendSvg.append("text")
    .attr("x", 34).attr("y", gy + 13)
    .attr("font-size", 12).attr("fill", "#333")
    .text(cfg.product);
});
</script>
</body>
</html>
