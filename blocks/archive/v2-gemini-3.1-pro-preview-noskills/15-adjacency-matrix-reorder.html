<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adjacency Matrix Reorder</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            margin-bottom: 20px;
            text-align: center;
        }
        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #fff;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #e9e9e9;
        }
        button.active {
            background-color: #007bff;
            color: #fff;
            border-color: #007bff;
        }
        .matrix-container {
            display: flex;
            justify-content: center;
        }
        svg {
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .cell {
            stroke: #fff;
            stroke-width: 0.5px;
            cursor: pointer;
            transition: opacity 0.2s, stroke-width 0.2s;
        }
        .cell:hover {
            stroke: #000;
            stroke-width: 1.5px;
        }
        text {
            font-size: 11px;
            fill: #333;
            transition: font-weight 0.2s, fill 0.2s;
        }
        text.active {
            font-weight: 700;
            fill: #000;
            font-size: 12px;
        }
        .bar {
            transition: opacity 0.2s;
        }
        .axis line, .axis path {
            stroke: #ddd;
        }
        .axis text {
            fill: #777;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Network Adjacency Matrix</h2>
    </div>
    <div class="controls">
        <label style="font-weight: 600; color: #555;">Order By:</label>
        <button id="order-name" class="active">Name</button>
        <button id="order-degree">Degree</button>
        <button id="order-community">Community</button>
    </div>
    <div class="matrix-container" id="chart"></div>

    <script>
        // Parameters
        const numNodes = 35;
        const numCommunities = 5;
        const targetEdges = 200;

        // Generate Nodes
        const nodes = d3.range(numNodes).map(i => ({
            id: i,
            name: `Node ${String(i).padStart(2, '0')}`,
            community: Math.floor(Math.random() * numCommunities),
            degree: 0 // Will be calculated
        }));

        // Generate Edges
        const edges = [];
        let edgeCount = 0;
        const maxAttempts = 10000;
        let attempts = 0;

        while (edgeCount < targetEdges && attempts < maxAttempts) {
            let source = Math.floor(Math.random() * numNodes);
            let target = Math.floor(Math.random() * numNodes);
            
            if (source !== target) {
                // Higher probability of connecting within the same community
                let isSameCommunity = nodes[source].community === nodes[target].community;
                let prob = isSameCommunity ? 0.8 : 0.05; // Make inter-community sparse
                
                if (Math.random() < prob) {
                    // Ensure undirected unique edge
                    let minId = Math.min(source, target);
                    let maxId = Math.max(source, target);
                    
                    if (!edges.find(e => e.source === minId && e.target === maxId)) {
                        let weight = Math.floor(Math.random() * 10) + 1;
                        edges.push({ source: minId, target: maxId, weight: weight });
                        
                        // Update degree
                        nodes[minId].degree += weight;
                        nodes[maxId].degree += weight;
                        
                        edgeCount++;
                    }
                }
            }
            attempts++;
        }

        // Create Matrix Data Structure
        const matrix = [];
        for (let i = 0; i < numNodes; i++) {
            matrix[i] = [];
            for (let j = 0; j < numNodes; j++) {
                matrix[i][j] = { row: i, col: j, weight: 0 };
            }
        }

        // Fill Matrix with Edges (Undirected)
        edges.forEach(e => {
            matrix[e.source][e.target].weight = e.weight;
            matrix[e.target][e.source].weight = e.weight;
        });

        // Flatten Matrix for D3 Selection
        const cellData = [];
        for (let i = 0; i < numNodes; i++) {
            for (let j = 0; j < numNodes; j++) {
                cellData.push(matrix[i][j]);
            }
        }

        // Define Orders
        const orders = {
            name: d3.range(numNodes).sort((a, b) => d3.ascending(nodes[a].name, nodes[b].name)),
            degree: d3.range(numNodes).sort((a, b) => d3.descending(nodes[a].degree, nodes[b].degree)),
            community: d3.range(numNodes).sort((a, b) => {
                if (nodes[a].community !== nodes[b].community) {
                    return d3.ascending(nodes[a].community, nodes[b].community);
                }
                return d3.descending(nodes[a].degree, nodes[b].degree);
            })
        };

        // Dimensions
        const margin = { top: 120, right: 150, bottom: 20, left: 120 };
        const width = 600;
        const height = 600;

        // Scales
        const x = d3.scaleBand()
            .range([0, width])
            .domain(orders.name)
            .paddingInner(0.05);

        const communityColor = d3.scaleOrdinal(d3.schemeCategory10).domain(d3.range(numCommunities));
        const opacityScale = d3.scaleLinear().domain([0, 10]).range([0.15, 1]);
        const degreeScale = d3.scaleLinear()
            .domain([0, d3.max(nodes, d => d.degree)])
            .range([0, 100]);

        // SVG Setup
        const svg = d3.select("#chart").append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Cell Color Logic
        function getCellColor(d) {
            if (d.weight === 0) return "#f4f4f4";
            const sourceNode = nodes[d.row];
            const targetNode = nodes[d.col];
            if (sourceNode.community === targetNode.community) {
                return communityColor(sourceNode.community);
            }
            return "#888"; // Inter-community edges
        }

        function getCellOpacity(d) {
            if (d.weight === 0) return 1;
            return opacityScale(d.weight);
        }

        // Draw Cells
        const cells = svg.selectAll(".cell")
            .data(cellData)
            .enter().append("rect")
            .attr("class", "cell")
            .attr("x", d => x(d.col))
            .attr("y", d => x(d.row))
            .attr("width", x.bandwidth())
            .attr("height", x.bandwidth())
            .style("fill", getCellColor)
            .style("fill-opacity", getCellOpacity)
            .on("mouseover", function(event, d) {
                // Highlight cells in same row or column
                cells.style("opacity", cell => (cell.row === d.row || cell.col === d.col) ? 1 : 0.15);
                
                // Highlight labels
                rowLabels.classed("active", node => node.id === d.row);
                svg.selectAll(".colLabel").classed("active", node => node.id === d.col);
            })
            .on("mouseout", function() {
                cells.style("opacity", 1);
                rowLabels.classed("active", false);
                svg.selectAll(".colLabel").classed("active", false);
            });

        // Draw Row Labels
        const rowLabels = svg.selectAll(".rowLabel")
            .data(nodes)
            .enter().append("text")
            .attr("class", "rowLabel")
            .attr("x", -8)
            .attr("y", d => x(d.id) + x.bandwidth() / 2)
            .attr("dy", "0.32em")
            .attr("text-anchor", "end")
            .text(d => d.name)
            .style("fill", d => communityColor(d.community));

        // Draw Column Labels
        const colLabelsG = svg.selectAll(".colLabelG")
            .data(nodes)
            .enter().append("g")
            .attr("class", "colLabelG")
            .attr("transform", d => `translate(${x(d.id) + x.bandwidth() / 2}, -8) rotate(-90)`);
            
        colLabelsG.append("text")
            .attr("class", "colLabel")
            .attr("text-anchor", "start")
            .attr("dy", "0.32em")
            .text(d => d.name)
            .style("fill", d => communityColor(d.community));

        // Draw Side Bar Chart (Degrees)
        const barsGroup = svg.append("g")
            .attr("transform", `translate(${width + 10}, 0)`);

        barsGroup.append("text")
            .attr("x", 0)
            .attr("y", -10)
            .attr("font-size", "12px")
            .attr("font-weight", "bold")
            .attr("fill", "#555")
            .text("Node Degree");

        const bars = barsGroup.selectAll(".bar")
            .data(nodes)
            .enter().append("rect")
            .attr("class", "bar")
            .attr("x", 0)
            .attr("y", d => x(d.id))
            .attr("width", d => degreeScale(d.degree))
            .attr("height", x.bandwidth())
            .style("fill", d => communityColor(d.community));

        const barLabels = barsGroup.selectAll(".barLabel")
            .data(nodes)
            .enter().append("text")
            .attr("class", "barLabel")
            .attr("x", d => degreeScale(d.degree) + 4)
            .attr("y", d => x(d.id) + x.bandwidth() / 2)
            .attr("dy", "0.32em")
            .attr("font-size", "10px")
            .text(d => d.degree);

        // Sorting Logic
        function updateOrder(newOrderType) {
            const newOrder = orders[newOrderType];
            x.domain(newOrder);

            const t = svg.transition().duration(1000);

            // Move Cells
            cells.transition(t)
                .attr("x", d => x(d.col))
                .attr("y", d => x(d.row));

            // Move Row Labels
            rowLabels.transition(t)
                .attr("y", d => x(d.id) + x.bandwidth() / 2);

            // Move Column Labels
            colLabelsG.transition(t)
                .attr("transform", d => `translate(${x(d.id) + x.bandwidth() / 2}, -8) rotate(-90)`);

            // Move Bars
            bars.transition(t)
                .attr("y", d => x(d.id));
                
            barLabels.transition(t)
                .attr("y", d => x(d.id) + x.bandwidth() / 2);
        }

        // Button Listeners
        d3.selectAll("button").on("click", function() {
            // Update active state
            d3.selectAll("button").classed("active", false);
            d3.select(this).classed("active", true);

            // Trigger reorder
            const orderType = this.id.replace("order-", "");
            updateOrder(orderType);
        });

    </script>
</body>
</html>
