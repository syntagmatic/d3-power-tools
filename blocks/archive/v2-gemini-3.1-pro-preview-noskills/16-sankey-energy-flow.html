<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sankey Diagram: Energy Flow</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 2rem;
            color: #0f172a;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            margin: 0 0 0.5rem 0;
            color: #0f172a;
            font-size: 28px;
        }
        .header p {
            margin: 0;
            color: #64748b;
            font-size: 15px;
        }
        #chart-wrapper {
            max-width: 1400px;
            margin: 0 auto;
        }
        .chart-container {
            width: 100%;
            height: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            position: relative;
            overflow: hidden;
        }
        .node {
            cursor: grab;
        }
        .node:active {
            cursor: grabbing;
        }
        .node rect {
            fill-opacity: 0.95;
            stroke: #fff;
            stroke-width: 1px;
            transition: fill-opacity 0.2s;
        }
        .node text {
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(255,255,255,0.95), 0 -1px 4px rgba(255,255,255,0.95), 1px 0 4px rgba(255,255,255,0.95), -1px 0 4px rgba(255,255,255,0.95);
        }
        .link {
            fill: none;
            stroke-opacity: 0.35;
            transition: stroke-opacity 0.2s, stroke 0.2s;
        }
        .link.loss-link {
            stroke-opacity: 0.5;
        }
        .link:hover {
            stroke-opacity: 0.8 !important;
            cursor: pointer;
        }
        
        /* Highlight states when hovering over chart */
        .chart-container.hovering .link {
            stroke-opacity: 0.08;
        }
        .chart-container.hovering .link.highlight {
            stroke-opacity: 0.65;
        }
        .chart-container.hovering .link.highlight.loss-link {
            stroke-opacity: 0.85;
        }
        .chart-container.hovering .node {
            opacity: 0.25;
            transition: opacity 0.2s;
        }
        .chart-container.hovering .node.highlight {
            opacity: 1;
        }
        
        .tooltip {
            position: absolute;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            border-radius: 6px;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.5;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 20;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div id="chart-wrapper">
        <div class="header">
            <h1>Estimated Energy Flow</h1>
            <p>Interactive Sankey Diagram (~35 links across 5 stages) &bull; Values in Arbitrary Quads</p>
        </div>
        <div id="chart" class="chart-container">
            <div id="tooltip" class="tooltip"></div>
        </div>
    </div>

    <script>
        // Define energy flow data (Approx 35 links, 5 stages, matching requirements)
        const data = {
            nodes: [
                {name: "Coal", category: "source"},
                {name: "Natural Gas", category: "source"},
                {name: "Petroleum", category: "source"},
                {name: "Nuclear", category: "source"},
                {name: "Renewables", category: "source"},
                {name: "Imports", category: "source"},
                
                {name: "Electricity Generation", category: "gen"},
                {name: "Grid", category: "grid"},
                
                {name: "Residential", category: "sector"},
                {name: "Commercial", category: "sector"},
                {name: "Industrial", category: "sector"},
                {name: "Transportation", category: "sector"},
                
                {name: "Space Heating", category: "enduse"},
                {name: "Water Heating", category: "enduse"},
                {name: "Lighting", category: "enduse"},
                {name: "HVAC", category: "enduse"},
                {name: "Vehicles", category: "enduse"},
                {name: "Other", category: "enduse"},
                
                {name: "Rejected Energy", category: "loss"}
            ],
            links: [
                // Stage 1: Sources -> Generation (6 links)
                {source: 0, target: 6, value: 9},
                {source: 1, target: 6, value: 12},
                {source: 2, target: 6, value: 1},
                {source: 3, target: 6, value: 8},
                {source: 4, target: 6, value: 7},
                {source: 5, target: 6, value: 1},
                
                // Stage 1/2: Sources -> Sectors & Grid (11 links)
                {source: 0, target: 10, value: 1},
                {source: 1, target: 8, value: 5},
                {source: 1, target: 9, value: 4},
                {source: 1, target: 10, value: 9},
                {source: 2, target: 10, value: 8},
                {source: 2, target: 11, value: 26},
                {source: 4, target: 8, value: 1},
                {source: 4, target: 10, value: 2},
                {source: 4, target: 11, value: 2},
                {source: 5, target: 7, value: 2},
                {source: 5, target: 10, value: 1},
                {source: 5, target: 11, value: 1},
                
                // Stage 2: Gen -> Grid & Losses (2 links)
                {source: 6, target: 7, value: 13},
                {source: 6, target: 18, value: 25},
                
                // Stage 3: Grid -> Sectors (4 links)
                {source: 7, target: 8, value: 5},
                {source: 7, target: 9, value: 5},
                {source: 7, target: 10, value: 4},
                {source: 7, target: 11, value: 1},
                
                // Stage 4: Sectors -> End Uses & Losses (18 links)
                {source: 8, target: 12, value: 4},
                {source: 8, target: 13, value: 2},
                {source: 8, target: 14, value: 1},
                {source: 8, target: 15, value: 1},
                {source: 8, target: 17, value: 1},
                {source: 8, target: 18, value: 2},
                
                {source: 9, target: 12, value: 2},
                {source: 9, target: 14, value": 2},
                {source: 9, target: 15, value: 2},
                {source: 9, target: 17, value: 2},
                {source: 9, target: 18, value: 1},
                
                {source: 10, target: 12, value: 2},
                {source: 10, target: 13, value: 2},
                {source: 10, target: 15, value: 2},
                {source: 10, target: 17, value: 9},
                {source: 10, target: 18, value: 10},
                
                {source: 11, target: 16, value: 8},
                {source: 11, target: 18, value: 22}
            ]
        };

        const width = 1400;
        const height = 800;
        const margin = {top: 40, right: 180, bottom: 40, left: 160};

        const svg = d3.select("#chart").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .style("display", "block");

        const colorScale = d3.scaleOrdinal()
            .domain(["Coal", "Natural Gas", "Petroleum", "Nuclear", "Renewables", "Imports", 
                     "Electricity Generation", "Grid", 
                     "Residential", "Commercial", "Industrial", "Transportation",
                     "Space Heating", "Water Heating", "Lighting", "HVAC", "Vehicles", "Other"])
            .range(["#475569", "#3b82f6", "#10b981", "#8b5cf6", "#22c55e", "#6366f1",
                    "#f59e0b", "#d97706",
                    "#ec4899", "#d946ef", "#a855f7", "#3b82f6",
                    "#06b6d4", "#0ea5e9", "#eab308", "#f43f5e", "#14b8a6", "#94a3b8"]);

        function getNodeColor(node) {
            if (node.name === "Rejected Energy") return "#ef4444"; // Distinct color for loss
            return colorScale(node.name);
        }

        const sankey = d3.sankey()
            .nodeAlign(d3.sankeyJustify)
            .nodeWidth(22)
            .nodePadding(20)
            .extent([[margin.left, margin.top], [width - margin.right, height - margin.bottom]]);

        const graph = sankey({
            nodes: data.nodes.map(d => Object.assign({}, d)),
            links: data.links.map(d => Object.assign({}, d))
        });

        // Pre-compute link logic for styling
        graph.links.forEach(d => {
            if (d.target.name === "Rejected Energy") {
                d.isLoss = true;
            }
        });

        const totalEnergy = d3.sum(graph.nodes.filter(n => n.targetLinks.length === 0), n => n.value);
        const format = d3.format(",.1f");

        const defs = svg.append("defs");
        graph.links.forEach((d, i) => {
            const gradient = defs.append("linearGradient")
                .attr("id", `gradient-${i}`)
                .attr("gradientUnits", "userSpaceOnUse")
                .attr("x1", d.source.x1)
                .attr("x2", d.target.x0);

            gradient.append("stop")
                .attr("offset", "0%")
                .attr("stop-color", getNodeColor(d.source));

            gradient.append("stop")
                .attr("offset", "100%")
                .attr("stop-color", getNodeColor(d.target));
        });

        const chartContainer = d3.select(".chart-container");
        const chartNode = document.getElementById("chart");
        const tooltip = d3.select("#tooltip");

        function getTooltipPos(event) {
            const rect = chartNode.getBoundingClientRect();
            return {
                x: event.clientX - rect.left + 15,
                y: event.clientY - rect.top + 15
            };
        }

        const linkPath = svg.append("g")
            .attr("fill", "none")
            .style("mix-blend-mode", "multiply")
            .selectAll("path")
            .data(graph.links)
            .join("path")
            .attr("class", d => `link ${d.isLoss ? 'loss-link' : ''}`)
            .attr("d", d3.sankeyLinkHorizontal())
            .attr("stroke-width", d => Math.max(1, d.width))
            .style("stroke", (d, i) => d.isLoss ? "#ef4444" : `url(#gradient-${i})`);

        const nodeGroup = svg.append("g")
            .selectAll("g")
            .data(graph.nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .subject(d => d)
                .on("start", function() {
                    this.parentNode.appendChild(this);
                })
                .on("drag", function(event, d) {
                    const nodeHeight = d.y1 - d.y0;
                    let newY0 = d.y0 + event.dy;
                    newY0 = Math.max(margin.top, Math.min(height - margin.bottom - nodeHeight, newY0));
                    const actualDy = newY0 - d.y0;
                    
                    d.y0 += actualDy;
                    d.y1 += actualDy;
                    
                    d3.select(this).select("rect").attr("y", d.y0);
                    d3.select(this).select("text").attr("y", (d.y0 + d.y1) / 2);
                    
                    sankey.update(graph);
                    linkPath.attr("d", d3.sankeyLinkHorizontal());
                })
            );

        nodeGroup.append("rect")
            .attr("x", d => d.x0)
            .attr("y", d => d.y0)
            .attr("height", d => d.y1 - d.y0)
            .attr("width", d => d.x1 - d.x0)
            .attr("fill", d => getNodeColor(d))
            .attr("rx", 3)
            .attr("ry", 3);

        nodeGroup.append("text")
            .attr("x", d => d.x0 < width / 2 ? d.x1 + 8 : d.x0 - 8)
            .attr("y", d => (d.y0 + d.y1) / 2)
            .attr("dy", "0.35em")
            .attr("text-anchor", d => d.x0 < width / 2 ? "start" : "end")
            .text(d => d.name)
            .style("fill", "#1e293b")
            .style("font-size", "14px")
            .style("font-weight", "600");

        // Hover functionality to highlight connected paths
        function highlightConnected(d, isNode) {
            chartContainer.classed("hovering", true);
            const connectedNodes = new Set();
            const connectedLinks = new Set();
            
            function traverseForward(n) {
                n.sourceLinks.forEach(l => {
                    connectedLinks.add(l);
                    connectedNodes.add(l.target);
                    traverseForward(l.target);
                });
            }
            
            function traverseBackward(n) {
                n.targetLinks.forEach(l => {
                    connectedLinks.add(l);
                    connectedNodes.add(l.source);
                    traverseBackward(l.source);
                });
            }

            if (isNode) {
                connectedNodes.add(d);
                traverseForward(d);
                traverseBackward(d);
            } else {
                connectedLinks.add(d);
                connectedNodes.add(d.source);
                connectedNodes.add(d.target);
                traverseForward(d.target);
                traverseBackward(d.source);
            }
            
            nodeGroup.classed("highlight", n => connectedNodes.has(n));
            linkPath.classed("highlight", l => connectedLinks.has(l));
        }

        function unhighlight() {
            chartContainer.classed("hovering", false);
            nodeGroup.classed("highlight", false);
            linkPath.classed("highlight", false);
        }

        // Add tooltips and interactivity
        nodeGroup
            .on("mouseover", function(event, d) {
                highlightConnected(d, true);
                const pct = ((d.value / totalEnergy) * 100).toFixed(1);
                tooltip.html(`<strong>${d.name}</strong><br>Total Flow: ${format(d.value)} Quads (${pct}%)`)
                       .style("opacity", 1);
            })
            .on("mousemove", function(event) {
                const pos = getTooltipPos(event);
                tooltip.style("left", pos.x + "px").style("top", pos.y + "px");
            })
            .on("mouseout", function() {
                unhighlight();
                tooltip.style("opacity", 0);
            });

        linkPath
            .on("mouseover", function(event, d) {
                highlightConnected(d, false);
                const pct = ((d.value / totalEnergy) * 100).toFixed(1);
                tooltip.html(`<strong>${d.source.name} &rarr; ${d.target.name}</strong><br>Flow: ${format(d.value)} Quads (${pct}%)`)
                       .style("opacity", 1);
            })
            .on("mousemove", function(event) {
                const pos = getTooltipPos(event);
                tooltip.style("left", pos.x + "px").style("top", pos.y + "px");
            })
            .on("mouseout", function() {
                unhighlight();
                tooltip.style("opacity", 0);
            });
    </script>
</body>
</html>
