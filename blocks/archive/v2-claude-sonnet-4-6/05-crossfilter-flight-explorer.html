<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crossfilter Flight Explorer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 28px 32px;
    min-height: 100vh;
  }

  header { margin-bottom: 22px; }
  h1 { font-size: 1.2rem; font-weight: 600; color: #e6edf3; letter-spacing: -0.01em; }
  .subtitle { font-size: 0.8125rem; color: #6e7681; margin-top: 4px; }

  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
    padding: 10px 14px;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    width: fit-content;
  }

  .counter {
    font-size: 0.8125rem;
    color: #6e7681;
  }
  .counter strong { color: #e6edf3; font-size: 1rem; }
  .counter .total { color: #6e7681; }

  .divider { width: 1px; height: 16px; background: #21262d; }

  button#reset {
    padding: 5px 14px;
    background: transparent;
    color: #6e7681;
    border: 1px solid #30363d;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.78rem;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  button#reset:hover { color: #c9d1d9; border-color: #6e7681; background: #21262d; }
  button#reset.active { color: #58a6ff; border-color: #58a6ff; }

  .charts {
    display: flex;
    gap: 20px;
    flex-wrap: nowrap;
  }

  .chart-wrap {
    flex: 1 1 0;
    min-width: 220px;
  }

  .chart-label {
    font-size: 0.72rem;
    font-weight: 500;
    color: #6e7681;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    user-select: none;
  }

  .chart-svg-wrap {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    overflow: hidden;
  }

  /* D3 elements */
  .ghost-bar { fill: #21262d; }
  .active-bar { fill: #1f6feb; transition: fill 0.12s; }

  .chart-wrap.brushed .active-bar { fill: #388bfd; }

  .axis text { fill: #484f58; font-size: 10.5px; }
  .axis .domain { stroke: #21262d; }
  .axis .tick line { stroke: #21262d; }

  .brush .selection {
    fill: rgba(56, 139, 253, 0.12);
    stroke: #388bfd;
    stroke-width: 1.5px;
  }
  .brush .handle {
    fill: #388bfd;
    fill-opacity: 0.9;
  }
  .brush .overlay { cursor: crosshair; }
</style>
</head>
<body>

<header>
  <h1>Flight Explorer</h1>
  <p class="subtitle">Brush any histogram to filter. All brushes intersect.</p>
</header>

<div class="controls">
  <div class="counter">
    <strong id="sel-count">2,000</strong>
    <span class="total"> of 2,000 flights</span>
  </div>
  <div class="divider"></div>
  <button id="reset">Reset</button>
</div>

<div class="charts">
  <div class="chart-wrap" id="wrap-hour">
    <div class="chart-label">Departure Hour</div>
    <div class="chart-svg-wrap" id="chart-hour"></div>
  </div>
  <div class="chart-wrap" id="wrap-delay">
    <div class="chart-label">Arrival Delay (min)</div>
    <div class="chart-svg-wrap" id="chart-delay"></div>
  </div>
  <div class="chart-wrap" id="wrap-distance">
    <div class="chart-label">Distance (miles)</div>
    <div class="chart-svg-wrap" id="chart-distance"></div>
  </div>
</div>

<script>
// ─── Data Generation ─────────────────────────────────────────────────────────

(function () {
  const N = 2000;

  // Seeded PRNG (mulberry32)
  let s = 0xdeadbeef;
  const rand = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  // Box-Muller normal(mu, sigma)
  const randn = (mu = 0, sigma = 1) => {
    const u = rand() + 1e-10, v = rand();
    return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  const flights = Array.from({ length: N }, () => {
    // Bimodal departure: morning peak ~7.5h, evening peak ~17.5h
    const peak = rand() < 0.52 ? 7.5 : 17.5;
    const hour = Math.max(0, Math.min(23.99, randn(peak, 1.7)));

    // Delay: mostly on-time with right skew; 18% chance of significant delay
    let delay = randn(-3, 12);
    if (rand() < 0.18) delay += rand() * 90 + 20;
    delay = Math.max(-30, Math.min(200, delay));

    // Distance: log-normal, clipped to realistic range
    const dist = Math.round(Math.exp(randn(6.35, 0.62)));
    const distance = Math.max(80, Math.min(4200, dist));

    return { hour, delay, distance };
  });

  // ─── Crossfilter State ──────────────────────────────────────────────────────

  const filters = { hour: null, delay: null, distance: null };

  const isSelected = d =>
    (!filters.hour     || (d.hour     >= filters.hour[0]     && d.hour     <= filters.hour[1]))
    && (!filters.delay    || (d.delay    >= filters.delay[0]    && d.delay    <= filters.delay[1]))
    && (!filters.distance || (d.distance >= filters.distance[0] && d.distance <= filters.distance[1]));

  const selectedCount = () => flights.reduce((n, d) => n + isSelected(d), 0);

  // ─── Chart Factory ──────────────────────────────────────────────────────────

  const MARGIN = { top: 14, right: 18, bottom: 32, left: 42 };
  const H = 170;

  function buildChart({ containerId, wrapId, accessor, domain, thresholds, tickFormat, filterKey }) {
    const container = document.getElementById(containerId);
    const W = container.parentElement.clientWidth || 300;
    const iW = W - MARGIN.left - MARGIN.right;
    const iH = H - MARGIN.top - MARGIN.bottom;

    const svg = d3.select(`#${containerId}`)
      .append('svg')
      .attr('width', W)
      .attr('height', H);

    const g = svg.append('g')
      .attr('transform', `translate(${MARGIN.left},${MARGIN.top})`);

    const x = d3.scaleLinear().domain(domain).range([0, iW]);

    // Pre-bin full dataset
    const binner = d3.bin().domain(domain).thresholds(thresholds);
    const fullBins = binner(flights.map(accessor));
    const yMax = d3.max(fullBins, b => b.length);
    const y = d3.scaleLinear().domain([0, yMax * 1.08]).range([iH, 0]);

    const barW = b => Math.max(0, x(b.x1) - x(b.x0) - 1.5);
    const barX = b => x(b.x0) + 0.75;

    // Ghost bars — full dataset, never changes
    g.append('g').attr('class', 'ghost-bars')
      .selectAll('rect').data(fullBins).join('rect')
      .attr('class', 'ghost-bar')
      .attr('x', barX).attr('width', barW)
      .attr('y', b => y(b.length)).attr('height', b => iH - y(b.length));

    // Active bars — filtered subset
    const activeBarsG = g.append('g').attr('class', 'active-bars');
    const activeBars = activeBarsG.selectAll('rect').data(fullBins).join('rect')
      .attr('class', 'active-bar')
      .attr('x', barX).attr('width', barW)
      .attr('y', iH).attr('height', 0);

    // X axis
    g.append('g').attr('class', 'axis')
      .attr('transform', `translate(0,${iH})`)
      .call(d3.axisBottom(x)
        .tickValues(thresholds.filter((_, i) => i % Math.ceil(thresholds.length / 7) === 0))
        .tickFormat(tickFormat)
        .tickSize(4))
      .call(ax => ax.select('.domain').attr('stroke', '#21262d'));

    // Brush
    const brush = d3.brushX()
      .extent([[0, 0], [iW, iH]])
      .on('brush end', function (event) {
        const wrap = document.getElementById(wrapId);
        if (!event.selection) {
          filters[filterKey] = null;
          wrap.classList.remove('brushed');
        } else {
          filters[filterKey] = event.selection.map(px => x.invert(px));
          wrap.classList.add('brushed');
        }
        updateAll(filterKey);
      });

    g.append('g').attr('class', 'brush').call(brush);

    // Update: rebin filtered data using same thresholds
    function update() {
      const filteredVals = flights.filter(isSelected).map(accessor);
      const filtBins = binner(filteredVals);
      activeBars.data(filtBins)
        .attr('y', b => y(b.length))
        .attr('height', b => iH - y(b.length));
    }

    return { update, brush, g };
  }

  // ─── Instantiate Charts ─────────────────────────────────────────────────────

  const hourThresholds  = d3.range(0, 24.1, 1);
  const delayThresholds = d3.range(-30, 205, 10);
  const distThresholds  = d3.range(0, 4400, 200);

  const charts = [];

  charts.push(buildChart({
    containerId: 'chart-hour',
    wrapId: 'wrap-hour',
    accessor: d => d.hour,
    domain: [0, 24],
    thresholds: hourThresholds,
    tickFormat: d => `${d}:00`,
    filterKey: 'hour'
  }));

  charts.push(buildChart({
    containerId: 'chart-delay',
    wrapId: 'wrap-delay',
    accessor: d => d.delay,
    domain: [-30, 200],
    thresholds: delayThresholds,
    tickFormat: d => d >= 0 ? `+${d}` : `${d}`,
    filterKey: 'delay'
  }));

  charts.push(buildChart({
    containerId: 'chart-distance',
    wrapId: 'wrap-distance',
    accessor: d => d.distance,
    domain: [0, 4400],
    thresholds: distThresholds,
    tickFormat: d => d >= 1000 ? `${d / 1000}k` : `${d}`,
    filterKey: 'distance'
  }));

  // ─── Coordinated Updates ────────────────────────────────────────────────────

  function updateAll(source) {
    charts.forEach(c => c.update());
    const n = selectedCount();
    document.getElementById('sel-count').textContent = n.toLocaleString();
    const hasFilter = Object.values(filters).some(Boolean);
    document.getElementById('reset').classList.toggle('active', hasFilter);
  }

  // ─── Reset ──────────────────────────────────────────────────────────────────

  document.getElementById('reset').addEventListener('click', () => {
    filters.hour = null;
    filters.delay = null;
    filters.distance = null;
    charts.forEach(c => c.g.select('.brush').call(c.brush.move, null));
    document.querySelectorAll('.chart-wrap').forEach(w => w.classList.remove('brushed'));
    updateAll(null);
  });

  // Initial render
  updateAll(null);

})();
</script>
</body>
</html>
