<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block × Skill Matrix</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #111318;
  color: #d0d4e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#header {
  padding: 14px 20px 8px;
  flex-shrink: 0;
}
h1 { font-size: 17px; font-weight: 600; color: #f0f2ff; letter-spacing: 0.01em; }
.subtitle { font-size: 12px; color: #667; margin-top: 3px; }
#controls {
  padding: 6px 20px;
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  flex-shrink: 0;
}
.ctrl-group { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #889; }
select {
  background: #1a1d27;
  color: #bbc;
  border: 1px solid #2a2d3a;
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  outline: none;
}
select:hover { border-color: #3a3d50; }
#legend {
  padding: 4px 20px 6px;
  display: flex; gap: 14px; flex-wrap: wrap; flex-shrink: 0;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #778; cursor: default; }
.legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
#chart-container {
  flex: 1;
  overflow: auto;
  padding: 0 20px 20px;
  position: relative;
}
svg#chart { display: block; }
.row-label {
  font-size: 10px;
  fill: #778;
  dominant-baseline: middle;
  cursor: default;
}
.row-label-hover { fill: #ccd; }
.col-label {
  font-size: 10px;
  fill: #889;
  cursor: default;
}
.col-label-hover { fill: #dde; }
.cat-band { opacity: 0.07; }
.freq-bar { opacity: 0.6; }
.row-hl { fill: rgba(255,255,255,0.04); }
.col-hl { fill: rgba(255,255,255,0.05); }
.cell-active { rx: 1; }
.cell-empty { opacity: 0.5; }
#tooltip {
  position: fixed;
  background: #1a1d27;
  border: 1px solid #2f3245;
  border-radius: 6px;
  padding: 10px 13px;
  font-size: 12px;
  pointer-events: none;
  max-width: 260px;
  z-index: 999;
  box-shadow: 0 4px 20px rgba(0,0,0,.6);
  display: none;
}
.tt-title { font-weight: 600; color: #e8eaf6; font-size: 12.5px; margin-bottom: 7px; line-height: 1.3; }
.tt-skill { color: #aab; margin-bottom: 4px; font-size: 11px; }
.tt-skills { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.tt-tag {
  display: inline-block;
  background: #222535;
  border-radius: 3px;
  padding: 1px 6px;
  font-size: 10.5px;
  color: #889;
  border: 1px solid #2a2d40;
}
.tt-tag.highlight { border-color: #4a5580; color: #aac0ff; background: #1e2540; }
</style>
</head>
<body>
<div id="header">
  <h1>Block × Skill Matrix</h1>
  <p class="subtitle" id="stats-line">Loading…</p>
</div>
<div id="controls">
  <div class="ctrl-group">
    Sort blocks:
    <select id="sort-blocks">
      <option value="index">By number</option>

      <option value="alpha">Alphabetical</option>

<div id="legend"></div>
<div id="chart-container">

</div>
<div id="tooltip"></div>

// Skill category taxonomy
const CATEGORIES = {
  patterns:  { label: "Patterns",   color: "#4e8ac7", skills: ["parallel-coordinates","brushing","linked-views","distributions"] },
  structure: { label: "Structure",  color: "#e0843a", skills: ["hierarchy-layouts","hierarchy-interaction","edge-bundling","force","network"] },
  place:     { label: "Place",      color: "#56a356", skills: ["cartography"] },
  change:    { label: "Change",     color: "#d95f5f", skills: ["time-series","motion","shape-morphing"] },
  legible:   { label: "Legible",    color: "#9e72c8", skills: ["scales","color","visual-texture","annotation","data-table","canvas-accessibility"] },
  work:      { label: "Work",       color: "#4abab5", skills: ["canvas","webgl","navigation","responsive"] },
  data:      { label: "Data",       color: "#c8aa3f", skills: ["data-gathering","sparkcharts","small-multiples"] },
};

// Build skill → category map
const skillCat = {};
const catOrder = ["patterns","structure","place","change","legible","work","data"];
for (const [cat, { skills }] of Object.entries(CATEGORIES)) {
  for (const s of skills) skillCat[s] = cat;
}

// Collect all skills in manifest order (category grouping)
const allSkills = catOrder.flatMap(c => CATEGORIES[c].skills);

// ─── SETUP ─────────────────────────────────────────────────────────────────
const CELL = 11;
const LABEL_W = 188;   // left labels
const FREQ_H = 36;     // frequency bars below matrix
const COL_HDR = 110;   // column header height (rotated labels)
const ROW_NUM_W = 26;  // block number prefix

// Compute skill frequencies
const skillFreq = {};
for (const s of allSkills) skillFreq[s] = 0;
for (const b of blocks) for (const s of b.skills) skillFreq[s] = (skillFreq[s] || 0) + 1;

// Update stats line
document.getElementById("stats-line").textContent =
  `${blocks.length} blocks · ${allSkills.length} skills · ${blocks.reduce((s, b) => s + b.skills.length, 0)} total assignments`;

// ─── RENDER ────────────────────────────────────────────────────────────────
const svg = d3.select("#chart");
const tooltip = document.getElementById("tooltip");

let blockOrder = blocks.map((_, i) => i);
let skillOrder = allSkills.map((_, i) => i);

function getSkillOrder(mode) {
  if (mode === "category") return allSkills.map((_, i) => i);
  if (mode === "freq") return allSkills.map((_, i) => i).sort((a, b) => skillFreq[allSkills[b]] - skillFreq[allSkills[a]]);
  if (mode === "alpha") return allSkills.map((_, i) => i).sort((a, b) => allSkills[a].localeCompare(allSkills[b]));
}

function getBlockOrder(mode) {
  if (mode === "index") return blocks.map((_, i) => i);
  if (mode === "primary") return blocks.map((_, i) => i).sort((a, b) => {
    const ca = skillCat[blocks[a].skills[0]] || "";
    const cb = skillCat[blocks[b].skills[0]] || "";
    return ca.localeCompare(cb) || a - b;
  });
  if (mode === "alpha") return blocks.map((_, i) => i).sort((a, b) =>
    blocks[a].name.localeCompare(blocks[b].name));
}

function render() {
  const nB = blocks.length;
  const nS = allSkills.length;

  const W = LABEL_W + nS * CELL;
  const H = COL_HDR + nB * CELL + FREQ_H + 4;

  svg.attr("width", W).attr("height", H);
  svg.selectAll("*").remove();

  // ── Category bands (column backgrounds) ──────────────────────────────────
  let col = 0;
  for (const cat of catOrder) {
    const catSkills = CATEGORIES[cat].skills;
    // find positions of these skills in current skillOrder
    const positions = skillOrder
      .filter(si => CATEGORIES[cat].skills.includes(allSkills[si]))
      .map(si => skillOrder.indexOf(si));
    // actually: compute column indices for this category's skills
    const cols = skillOrder
      .map((si, col) => ({ si, col }))
      .filter(({ si }) => skillCat[allSkills[si]] === cat);
    if (!cols.length) continue;
    const xs = cols.map(d => d.col);
    const x0 = Math.min(...xs);
    const x1 = Math.max(...xs);
    svg.append("rect")
      .attr("class", "cat-band")
      .attr("x", LABEL_W + x0 * CELL)
      .attr("y", 0)
      .attr("width", (x1 - x0 + 1) * CELL)
      .attr("height", H)
      .attr("fill", CATEGORIES[cat].color);
  }

  // ── Row highlight group ──────────────────────────────────────────────────
  const rowHl = svg.append("rect").attr("class", "row-hl")
    .attr("x", 0).attr("y", 0).attr("width", W).attr("height", CELL)
    .attr("fill", "transparent");

  const colHl = svg.append("rect").attr("class", "col-hl")
    .attr("x", LABEL_W).attr("y", 0)
    .attr("width", CELL).attr("height", COL_HDR + nB * CELL)
    .attr("fill", "transparent");

  // ── Column headers (skill names, rotated) ────────────────────────────────
  const colLabels = svg.selectAll(".col-label")
    .data(skillOrder)
    .join("text")
    .attr("class", "col-label")
    .attr("x", (si, col) => LABEL_W + skillOrder.indexOf(si) * CELL + CELL / 2)
    .attr("y", COL_HDR - 6)
    .attr("transform", (si, col) => {
      const cx = LABEL_W + skillOrder.indexOf(si) * CELL + CELL / 2;
      return `rotate(-45, ${cx}, ${COL_HDR - 6})`;
    })
    .attr("text-anchor", "start")
    .attr("fill", si => CATEGORIES[skillCat[allSkills[si]]]?.color || "#888")
    .attr("font-size", 10)
    .text(si => allSkills[si]);

  // ── Cells ────────────────────────────────────────────────────────────────
  const cellData = [];
  for (let row = 0; row < nB; row++) {
    const bi = blockOrder[row];
    const b = blocks[bi];
    for (let col = 0; col < nS; col++) {
      const si = skillOrder[col];
      const s = allSkills[si];
      const active = b.skills.includes(s);
      cellData.push({ row, col, bi, si, active });
    }
  }

  svg.selectAll(".cell")
    .data(cellData)
    .join("rect")
    .attr("class", "cell")
    .attr("x", d => LABEL_W + d.col * CELL + 1)
    .attr("y", d => COL_HDR + d.row * CELL + 1)
    .attr("width", CELL - 2)
    .attr("height", CELL - 2)
    .attr("rx", d => d.active ? 1.5 : 0)
    .attr("fill", d => d.active
      ? CATEGORIES[skillCat[allSkills[d.si]]]?.color || "#888"
      : "#1a1d27")
    .attr("opacity", d => d.active ? 0.88 : 0.35)
    .on("mouseover", (event, d) => {
      // row/col highlight
      rowHl
        .attr("y", COL_HDR + d.row * CELL)
        .attr("height", CELL)
        .attr("fill", "rgba(255,255,255,0.05)");
      colHl
        .attr("x", LABEL_W + d.col * CELL)
        .attr("width", CELL)
        .attr("fill", "rgba(255,255,255,0.06)");

      // dim all col labels, highlight active
      svg.selectAll(".col-label")
        .attr("opacity", si => skillOrder.indexOf(si) === d.col ? 1 : 0.4);
      svg.selectAll(".row-label")
        .attr("opacity", function() {
          return +this.getAttribute("data-row") === d.row ? 1 : 0.4;
        });

      // tooltip
      const b = blocks[blockOrder[d.row]];
      const s = allSkills[d.si];
      const cat = skillCat[s];
      const catColor = CATEGORIES[cat]?.color || "#888";
      const tagsHtml = b.skills.map(sk =>
        `<span class="tt-tag ${sk === s ? 'highlight' : ''}" style="${sk === s ? `border-color:${catColor}55;color:${catColor};background:${catColor}18` : ''}">${sk}</span>`
      ).join("");
      tooltip.innerHTML = `
        <div class="tt-title">#${b.id} ${b.name}</div>
        <div class="tt-skill" style="color:${catColor}">${s}</div>
        <div class="tt-skills">${tagsHtml}</div>
      `;
      tooltip.style.display = "block";
      moveTooltip(event);
    })
    .on("mousemove", moveTooltip)
    .on("mouseout", () => {
      rowHl.attr("fill", "transparent");
      colHl.attr("fill", "transparent");
      svg.selectAll(".col-label").attr("opacity", 1);
      svg.selectAll(".row-label").attr("opacity", 1);
      tooltip.style.display = "none";
    });

  // ── Row labels ──────────────────────────────────────────────────────────
  svg.selectAll(".row-label")
    .data(blockOrder)
    .join("text")
    .attr("class", "row-label")
    .attr("data-row", (bi, row) => row)
    .attr("x", LABEL_W - 6)
    .attr("y", (bi, row) => COL_HDR + row * CELL + CELL / 2)
    .attr("text-anchor", "end")
    .attr("dominant-baseline", "middle")
    .attr("fill", "#667")
    .attr("font-size", 9.5)
    .text(bi => {
      const name = blocks[bi].name;
      const num = blocks[bi].id;
      const trunc = name.length > 26 ? name.slice(0, 24) + "…" : name;
      return `${num} ${trunc}`;
    });

  // ── Frequency bars ───────────────────────────────────────────────────────
  const freqY = COL_HDR + nB * CELL + 4;
  const maxFreq = d3.max(allSkills, s => skillFreq[s]);
  const freqScale = d3.scaleLinear().domain([0, maxFreq]).range([0, FREQ_H - 8]);

  svg.selectAll(".freq-bar")
    .data(skillOrder)
    .join("rect")
    .attr("class", "freq-bar")
    .attr("x", (si, col) => LABEL_W + skillOrder.indexOf(si) * CELL + 1)
    .attr("y", si => freqY + (FREQ_H - 8) - freqScale(skillFreq[allSkills[si]]))
    .attr("width", CELL - 2)
    .attr("height", si => freqScale(skillFreq[allSkills[si]]))
    .attr("fill", si => CATEGORIES[skillCat[allSkills[si]]]?.color || "#888")
    .attr("rx", 1);

  // Freq axis label
  svg.append("text")
    .attr("x", LABEL_W - 6)
    .attr("y", freqY + (FREQ_H - 8) / 2)
    .attr("text-anchor", "end")
    .attr("dominant-baseline", "middle")
    .attr("font-size", 9)
    .attr("fill", "#445")
    .text("freq");

  // ── Grid lines ──────────────────────────────────────────────────────────
  // Subtle category separators in columns
  let prevCat = null;
  for (let col = 0; col < nS; col++) {
    const si = skillOrder[col];
    const cat = skillCat[allSkills[si]];
    if (cat !== prevCat && prevCat !== null) {
      svg.append("line")
        .attr("x1", LABEL_W + col * CELL)
        .attr("y1", COL_HDR)
        .attr("x2", LABEL_W + col * CELL)
        .attr("y2", COL_HDR + nB * CELL)
        .attr("stroke", "#222535")
        .attr("stroke-width", 1);
    }
    prevCat = cat;
  }
}

function moveTooltip(event) {
  const W = 260;
  let x = event.clientX + 14;
  let y = event.clientY + 14;
  if (x + W > window.innerWidth - 10) x = event.clientX - W - 14;
  if (y + 120 > window.innerHeight) y = event.clientY - 130;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}

// ─── LEGEND ──────────────────────────────────────────────────────────────
const legend = document.getElementById("legend");
for (const cat of catOrder) {
  const { label, color, skills } = CATEGORIES[cat];
  const div = document.createElement("div");
  div.className = "legend-item";
  div.innerHTML = `<div class="legend-dot" style="background:${color}"></div><span>${label} (${skills.length})</span>`;
  legend.appendChild(div);
}

// ─── CONTROLS ────────────────────────────────────────────────────────────
blockOrder = getBlockOrder("index");
skillOrder = getSkillOrder("category");
render();

document.getElementById("sort-blocks").addEventListener("change", e => {
  blockOrder = getBlockOrder(e.target.value);
  render();
});
document.getElementById("sort-skills").addEventListener("change", e => {
  skillOrder = getSkillOrder(e.target.value);
  render();
});

</script>
</body>
</html>
