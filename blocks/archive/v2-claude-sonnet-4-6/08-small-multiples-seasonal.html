<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Energy Consumption – Seasonal Patterns</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 24px 28px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1117;
    color: #d4d4d8;
    min-height: 100vh;
  }
  .title  { font-size: 15px; font-weight: 600; color: #f4f4f5; margin: 0 0 3px; }
  .sub    { font-size: 12px; color: #71717a; margin: 0 0 13px; }
  .legend {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    align-items: center;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: #a1a1aa;
    cursor: default;
  }
  .leg-item svg { flex-shrink: 0; }
  #grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    cursor: crosshair;
  }
  .panel svg { display: block; width: 100%; }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(12, 14, 19, 0.96);
    border: 1px solid #27272a;
    border-radius: 7px;
    padding: 9px 13px;
    font-size: 11.5px;
    line-height: 1.75;
    display: none;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    min-width: 148px;
  }
  .tt-head { font-weight: 600; color: #e4e4e7; font-size: 12px; margin-bottom: 3px; }
  .tt-row  { display: flex; justify-content: space-between; gap: 16px; }
  .tt-val  { font-weight: 500; color: #f4f4f5; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<h1 class="title">Daily Energy Consumption by Month</h1>
<p class="sub">kWh per day &nbsp;·&nbsp; winter heating and summer cooling drive seasonal peaks &nbsp;·&nbsp; hover any panel to compare across months</p>
<div class="legend" id="legend"></div>
<div id="grid"></div>
<div id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
// ── Seeded RNG ────────────────────────────────────────────────────────────────
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0xCAFE42);

// ── Configuration ────────────────────────────────────────────────────────────
const YEARS  = [2022, 2023, 2024];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS   = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

// Monthly average energy (kWh/day): U-shaped seasonal curve
// Winter = heating, Summer = AC; Spring/Fall are valleys
const BASE = [114, 103, 78, 56, 51, 76, 98, 94, 66, 54, 74, 112];

// DOY offset for day-of-week calculation
const DOY = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];

// Year-over-year characteristics
//   2022: mild year — modest heating, modest cooling
//   2023: hot summer — record AC demand, average winter
//   2024: cold winter — heavy heating, average summer
const PROFILES = {
  2022: { w: 0.91, sp: 0.97, su: 0.95, fa: 0.98 },
  2023: { w: 0.99, sp: 1.00, su: 1.18, fa: 1.04 },
  2024: { w: 1.14, sp: 1.04, su: 1.01, fa: 0.99 },
};

const SEASON = m =>
  m <= 1 || m === 11 ? 'w' :
  m <= 4             ? 'sp' :
  m <= 7             ? 'su' : 'fa';

// ── Generate synthetic data ──────────────────────────────────────────────────
// rawData[year][month] = [{day, value}, ...]
const rawData = {};
YEARS.forEach(yr => {
  rawData[yr] = MONTHS.map((_, m) => {
    const n    = DAYS[m];
    const base = BASE[m];
    const mult = PROFILES[yr][SEASON(m)];
    const days = [];
    for (let d = 1; d <= n; d++) {
      const dow      = (DOY[m] + d + (yr - 2022) * 365) % 7;
      const wkBoost  = (dow === 0 || dow === 6) ? 1.07 : 1.0; // home weekend bump
      const noise    = (rand() - 0.5) * 0.30;
      const val      = Math.max(18, base * mult * wkBoost * (1 + noise));
      days.push({ day: d, value: +val.toFixed(1) });
    }
    return days;
  });
});

// ── SVG layout ───────────────────────────────────────────────────────────────
const VW = 244, VH = 152;  // viewBox
const M  = { top: 20, right: 6, bottom: 22, left: 35 };
const PW = VW - M.left - M.right;   // 203
const PH = VH - M.top  - M.bottom;  // 110

// ── Shared scales ────────────────────────────────────────────────────────────
const xScale = d3.scaleLinear([1, 31], [0, PW]);
const yMax   = d3.max(YEARS.flatMap(yr => rawData[yr].flat().map(d => d.value))) * 1.08;
const yScale = d3.scaleLinear([0, yMax], [PH, 0]);

// ── Year aesthetics ──────────────────────────────────────────────────────────
const Y_COLOR = { 2022: '#60a5fa', 2023: '#f87171', 2024: '#4ade80' };
const Y_DASH  = { 2022: 'none',    2023: '5,3',      2024: '2,3'   };
const Y_WIDTH = { 2022: 1.4,       2023: 1.5,         2024: 1.4    };

// ── Legend ───────────────────────────────────────────────────────────────────
const legendEl = document.getElementById('legend');
YEARS.forEach(yr => {
  const item = document.createElement('div');
  item.className = 'leg-item';
  item.innerHTML =
    `<svg width="24" height="12">
       <line x1="0" y1="6" x2="24" y2="6"
             stroke="${Y_COLOR[yr]}" stroke-width="${Y_WIDTH[yr]}"
             stroke-dasharray="${Y_DASH[yr]}"/>
     </svg>
     <span>${yr}</span>`;
  legendEl.appendChild(item);
});

// ── Line generator ───────────────────────────────────────────────────────────
const lineGen = d3.line()
  .x(d => xScale(d.day))
  .y(d => yScale(d.value))
  .curve(d3.curveMonotoneX);

// ── Render panels ────────────────────────────────────────────────────────────
const gridEl       = document.getElementById('grid');
const tooltip      = document.getElementById('tooltip');
const allCrosshairs = [];  // one D3 selection per panel

MONTHS.forEach((name, m) => {
  const col         = m % 4;
  const row         = Math.floor(m / 4);
  const isLeft      = col === 0;
  const isBottom    = row === 2;

  const div = document.createElement('div');
  div.className = 'panel';
  gridEl.appendChild(div);

  const svg = d3.select(div).append('svg')
    .attr('viewBox', `0 0 ${VW} ${VH}`)
    .attr('aria-label', `${name} energy consumption`);

  // Clip path keeps lines inside plot area
  svg.append('defs').append('clipPath')
    .attr('id', `clip${m}`)
    .append('rect').attr('width', PW).attr('height', PH);

  const g = svg.append('g').attr('transform', `translate(${M.left},${M.top})`);

  // Panel background
  g.append('rect')
    .attr('width', PW).attr('height', PH)
    .attr('fill', '#181b23').attr('rx', 2);

  // Horizontal grid lines
  g.selectAll('.hg')
    .data(yScale.ticks(4)).join('line').attr('class', 'hg')
    .attr('x1', 0).attr('x2', PW)
    .attr('y1', d => yScale(d)).attr('y2', d => yScale(d))
    .attr('stroke', '#262933').attr('stroke-width', 0.6);

  // Year data lines (clipped)
  const gClip = g.append('g').attr('clip-path', `url(#clip${m})`);
  YEARS.forEach(yr => {
    gClip.append('path')
      .datum(rawData[yr][m])
      .attr('d', lineGen)
      .attr('fill', 'none')
      .attr('stroke', Y_COLOR[yr])
      .attr('stroke-width', Y_WIDTH[yr])
      .attr('stroke-dasharray', Y_DASH[yr])
      .attr('opacity', 0.82);
  });

  // Y-axis — leftmost column only
  if (isLeft) {
    g.append('g')
      .call(d3.axisLeft(yScale)
        .ticks(4)
        .tickSize(3)
        .tickFormat(d => d === 0 ? '' : d))
      .call(ag => ag.select('.domain').remove())
      .call(ag => ag.selectAll('text')
        .attr('font-size', 9).attr('fill', '#52525b').attr('dx', -2))
      .call(ag => ag.selectAll('line')
        .attr('stroke', '#3f3f46'));
    // y-axis label
    g.append('text')
      .attr('transform', `translate(-28, ${PH / 2}) rotate(-90)`)
      .attr('text-anchor', 'middle')
      .attr('font-size', 8.5).attr('fill', '#52525b')
      .text('kWh/day');
  }

  // X-axis — bottom row only
  if (isBottom) {
    g.append('g')
      .attr('transform', `translate(0,${PH})`)
      .call(d3.axisBottom(xScale)
        .tickValues([1, 8, 15, 22, 29])
        .tickSize(3)
        .tickFormat(d3.format('d')))
      .call(ag => ag.select('.domain').attr('stroke', '#3f3f46'))
      .call(ag => ag.selectAll('text')
        .attr('font-size', 9).attr('fill', '#52525b'))
      .call(ag => ag.selectAll('line')
        .attr('stroke', '#3f3f46'));
  } else {
    // Subtle bottom border
    g.append('line')
      .attr('x1', 0).attr('x2', PW)
      .attr('y1', PH).attr('y2', PH)
      .attr('stroke', '#262933').attr('stroke-width', 0.6);
  }

  // Month label
  g.append('text')
    .attr('x', PW / 2).attr('y', -5)
    .attr('text-anchor', 'middle')
    .attr('font-size', 11).attr('font-weight', 500)
    .attr('fill', '#71717a')
    .text(name);

  // Crosshair line (hidden by default)
  const crosshair = g.append('line')
    .attr('y1', 0).attr('y2', PH)
    .attr('stroke', '#e4e4e7').attr('stroke-width', 0.9)
    .attr('stroke-dasharray', '3,3').attr('opacity', 0.65)
    .style('display', 'none').style('pointer-events', 'none');

  allCrosshairs.push({ el: crosshair, m });

  // Dot markers per year at crosshair position
  const dots = YEARS.map(yr =>
    g.append('circle')
      .attr('r', 2.8)
      .attr('fill', Y_COLOR[yr])
      .attr('stroke', '#0f1117').attr('stroke-width', 1)
      .style('display', 'none').style('pointer-events', 'none')
  );

  // Invisible overlay for pointer events
  g.append('rect')
    .attr('width', PW).attr('height', PH)
    .attr('fill', 'none').attr('pointer-events', 'all')
    .on('pointermove', function(event) {
      const [mx] = d3.pointer(event);
      const px   = Math.max(0, Math.min(PW, mx));
      const day  = Math.max(1, Math.min(31, Math.round(xScale.invert(px))));
      const snapX = xScale(day);

      // Broadcast crosshair x to ALL panels
      allCrosshairs.forEach(({ el }) => {
        el.attr('x1', snapX).attr('x2', snapX).style('display', null);
      });

      // Show dots at this panel's crosshair position
      YEARS.forEach((yr, i) => {
        const pt = rawData[yr][m].find(d => d.day === day);
        if (pt) {
          dots[i].attr('cx', snapX).attr('cy', yScale(pt.value)).style('display', null);
        } else {
          dots[i].style('display', 'none');
        }
      });

      // Build tooltip
      let html = `<div class="tt-head">${name} &nbsp;·&nbsp; Day ${day}</div>`;
      YEARS.forEach(yr => {
        const pt  = rawData[yr][m].find(d => d.day === day);
        const val = pt ? `${pt.value.toFixed(1)} kWh` : '—';
        html += `<div class="tt-row">
          <span style="color:${Y_COLOR[yr]}">${yr}</span>
          <span class="tt-val">${val}</span>
        </div>`;
      });
      tooltip.innerHTML = html;

      // Position tooltip (flip left if near right edge)
      const ttW  = 162;
      const left = event.clientX > window.innerWidth - ttW - 30
        ? event.clientX - ttW - 14
        : event.clientX + 16;
      tooltip.style.cssText += `;display:block;left:${left}px;top:${event.clientY - 14}px`;
    });
});

// Hide all crosshairs when mouse leaves the entire grid
gridEl.addEventListener('pointerleave', () => {
  allCrosshairs.forEach(({ el }) => el.style('display', 'none'));
  tooltip.style.display = 'none';
  // Also hide dots — easiest is to just re-select them
  d3.selectAll('circle').style('display', 'none');
});
</script>
</body>
</html>
