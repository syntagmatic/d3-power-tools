<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World City Similarity Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a1628;
      color: #c0d4e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    #app {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 20px 32px;
    }
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #e0eef8;
      letter-spacing: 0.01em;
    }
    .subtitle {
      font-size: 12px;
      color: #4e6e88;
      margin-bottom: 16px;
    }
    #reset-btn {
      background: rgba(255, 190, 60, 0.12);
      border: 1px solid rgba(255, 190, 60, 0.35);
      color: #ffbe3c;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #reset-btn:hover { background: rgba(255, 190, 60, 0.22); }
    #reset-btn:disabled { opacity: 0.35; cursor: default; }
    #parcoords-container {
      background: #0e1e30;
      border: 1px solid #162840;
      border-radius: 8px;
      overflow: hidden;
    }
    #stats-bar {
      font-size: 12px;
      color: #4e6e88;
      padding: 8px 2px;
    }
    #stats-bar b { color: #ffbe3c; font-weight: 600; }
    #map-container {
      background: #0e1e30;
      border: 1px solid #162840;
      border-radius: 8px;
      overflow: hidden;
    }
    .brush .selection {
      fill: rgba(255, 190, 60, 0.15);
      stroke: #ffbe3c;
      stroke-width: 1px;
    }
    .brush .handle {
      fill: #ffbe3c;
      opacity: 0.8;
    }
    #tooltip {
      position: fixed;
      background: rgba(10, 22, 40, 0.95);
      border: 1px solid #1e3c5a;
      border-radius: 6px;
      padding: 9px 13px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 100;
      line-height: 1.7;
      max-width: 200px;
    }
    #tooltip .t-name { font-weight: 600; color: #e0eef8; font-size: 13px; }
    #tooltip .t-country { color: #4e6e88; font-size: 11px; margin-bottom: 5px; }
    #tooltip .t-row { color: #8aaac0; }
    #tooltip .t-val { color: #c0d4e8; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>World City Similarity Explorer</h1>
    <button id="reset-btn" disabled>Reset filters</button>
  </div>
  <p class="subtitle">40 cities · 6 dimensions — brush any axis to filter · hover cities for details</p>
  <div id="parcoords-container"></div>
  <div id="stats-bar">Showing <b id="count">40</b> of 40 cities</div>
  <div id="map-container"></div>
</div>
<div id="tooltip"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

// ── City data (all synthetic / inline) ──────────────────────────────────────
const cities = [
  { name: "Tokyo",         country: "Japan",          lon:  139.7, lat:  35.7,  population: 37.4, density:  6200, elevation:   40, temperature: 15.4, rainfall: 1530, cost: 85  },
  { name: "Delhi",         country: "India",          lon:   77.2, lat:  28.6,  population: 30.3, density: 11300, elevation:  216, temperature: 25.0, rainfall:  800, cost: 25  },
  { name: "Shanghai",      country: "China",          lon:  121.5, lat:  31.2,  population: 24.1, density:  3800, elevation:    4, temperature: 15.7, rainfall: 1100, cost: 60  },
  { name: "São Paulo",     country: "Brazil",         lon:  -46.6, lat: -23.5,  population: 21.7, density:  7400, elevation:  760, temperature: 19.0, rainfall: 1450, cost: 40  },
  { name: "Mexico City",   country: "Mexico",         lon:  -99.1, lat:  19.4,  population: 21.6, density:  5900, elevation: 2240, temperature: 16.0, rainfall:  700, cost: 40  },
  { name: "Cairo",         country: "Egypt",          lon:   31.2, lat:  30.1,  population: 21.3, density: 19000, elevation:   23, temperature: 21.4, rainfall:   25, cost: 30  },
  { name: "Mumbai",        country: "India",          lon:   72.9, lat:  19.1,  population: 20.7, density: 12500, elevation:   14, temperature: 27.0, rainfall: 2000, cost: 35  },
  { name: "Beijing",       country: "China",          lon:  116.4, lat:  39.9,  population: 20.9, density:  1300, elevation:   44, temperature: 12.9, rainfall:  615, cost: 55  },
  { name: "Dhaka",         country: "Bangladesh",     lon:   90.4, lat:  23.7,  population: 21.0, density: 22000, elevation:    8, temperature: 26.0, rainfall: 2100, cost: 20  },
  { name: "Osaka",         country: "Japan",          lon:  135.5, lat:  34.7,  population: 19.1, density: 12000, elevation:    5, temperature: 16.5, rainfall: 1300, cost: 75  },
  { name: "New York",      country: "USA",            lon:  -74.0, lat:  40.7,  population: 18.8, density: 10400, elevation:   10, temperature: 12.9, rainfall: 1270, cost: 100 },
  { name: "Karachi",       country: "Pakistan",       lon:   67.0, lat:  24.9,  population: 15.4, density:  6000, elevation:   10, temperature: 26.0, rainfall:  200, cost: 25  },
  { name: "Chongqing",     country: "China",          lon:  106.6, lat:  29.6,  population: 15.0, density:  1050, elevation:  267, temperature: 18.0, rainfall: 1100, cost: 40  },
  { name: "Istanbul",      country: "Turkey",         lon:   29.0, lat:  41.0,  population: 14.8, density:  2900, elevation:  100, temperature: 13.8, rainfall:  800, cost: 50  },
  { name: "Kinshasa",      country: "D.R. Congo",     lon:   15.3, lat:  -4.3,  population: 14.6, density:   500, elevation:  320, temperature: 25.0, rainfall: 1500, cost: 20  },
  { name: "Lagos",         country: "Nigeria",        lon:    3.4, lat:   6.5,  population: 14.3, density:  6800, elevation:   41, temperature: 27.0, rainfall: 1600, cost: 30  },
  { name: "Manila",        country: "Philippines",    lon:  121.0, lat:  14.6,  population: 13.9, density: 46000, elevation:   16, temperature: 27.0, rainfall: 2000, cost: 30  },
  { name: "Moscow",        country: "Russia",         lon:   37.6, lat:  55.8,  population: 12.6, density:  4900, elevation:  156, temperature:  5.8, rainfall:  700, cost: 65  },
  { name: "Guangzhou",     country: "China",          lon:  113.3, lat:  23.1,  population: 12.6, density:  3300, elevation:   21, temperature: 22.0, rainfall: 1750, cost: 50  },
  { name: "Shenzhen",      country: "China",          lon:  114.1, lat:  22.5,  population: 12.5, density:  6200, elevation:   30, temperature: 22.4, rainfall: 1950, cost: 55  },
  { name: "Lima",          country: "Peru",           lon:  -77.0, lat: -12.0,  population: 11.0, density:  2800, elevation:  154, temperature: 18.8, rainfall:    9, cost: 40  },
  { name: "Paris",         country: "France",         lon:    2.3, lat:  48.9,  population: 11.0, density:  3800, elevation:   35, temperature: 11.3, rainfall:  637, cost: 90  },
  { name: "Jakarta",       country: "Indonesia",      lon:  106.8, lat:  -6.2,  population: 10.8, density: 15000, elevation:    8, temperature: 28.0, rainfall: 1800, cost: 35  },
  { name: "Bogotá",        country: "Colombia",       lon:  -74.1, lat:   4.7,  population: 10.9, density:  4400, elevation: 2640, temperature: 14.0, rainfall:  800, cost: 35  },
  { name: "Bangkok",       country: "Thailand",       lon:  100.5, lat:  13.8,  population: 10.5, density:  4200, elevation:    2, temperature: 28.0, rainfall: 1400, cost: 35  },
  { name: "Seoul",         country: "South Korea",    lon:  127.0, lat:  37.6,  population:  9.9, density: 16000, elevation:   38, temperature: 12.5, rainfall: 1400, cost: 75  },
  { name: "Chicago",       country: "USA",            lon:  -87.6, lat:  41.9,  population:  9.5, density:  1530, elevation:  176, temperature:  9.8, rainfall:  910, cost: 85  },
  { name: "London",        country: "UK",             lon:   -0.1, lat:  51.5,  population:  9.3, density:  5500, elevation:   11, temperature: 11.3, rainfall:  600, cost: 95  },
  { name: "Tehran",        country: "Iran",           lon:   51.4, lat:  35.7,  population:  9.1, density: 11700, elevation: 1200, temperature: 17.0, rainfall:  250, cost: 30  },
  { name: "Ho Chi Minh",   country: "Vietnam",        lon:  106.7, lat:  10.8,  population:  9.0, density:  3900, elevation:    5, temperature: 27.0, rainfall: 1800, cost: 25  },
  { name: "Johannesburg",  country: "South Africa",   lon:   28.0, lat: -26.2,  population:  5.6, density:  2700, elevation: 1750, temperature: 15.8, rainfall:  713, cost: 45  },
  { name: "Toronto",       country: "Canada",         lon:  -79.4, lat:  43.7,  population:  6.2, density:  4330, elevation:   76, temperature:  9.4, rainfall:  790, cost: 85  },
  { name: "Hong Kong",     country: "China",          lon:  114.2, lat:  22.3,  population:  7.5, density:  6700, elevation:   60, temperature: 23.0, rainfall: 2400, cost: 100 },
  { name: "Singapore",     country: "Singapore",      lon:  103.8, lat:   1.4,  population:  5.9, density:  8000, elevation:   15, temperature: 27.0, rainfall: 2340, cost: 105 },
  { name: "Sydney",        country: "Australia",      lon:  151.2, lat: -33.9,  population:  5.3, density:   430, elevation:   58, temperature: 17.7, rainfall: 1200, cost: 90  },
  { name: "Dubai",         country: "UAE",            lon:   55.3, lat:  25.2,  population:  3.3, density:   750, elevation:    5, temperature: 26.7, rainfall:  100, cost: 80  },
  { name: "Nairobi",       country: "Kenya",          lon:   36.8, lat:  -1.3,  population:  4.9, density:  4500, elevation: 1795, temperature: 17.7, rainfall:  800, cost: 30  },
  { name: "Cape Town",     country: "South Africa",   lon:   18.4, lat: -33.9,  population:  4.6, density:  1500, elevation:  120, temperature: 17.5, rainfall:  510, cost: 50  },
  { name: "Vancouver",     country: "Canada",         lon: -123.1, lat:  49.3,  population:  2.6, density:  5500, elevation:   70, temperature: 10.9, rainfall: 1155, cost: 90  },
  { name: "San Francisco", country: "USA",            lon: -122.4, lat:  37.8,  population:  4.7, density:  6700, elevation:   16, temperature: 13.8, rainfall:  530, cost: 110 },
];

// ── Dimension config ─────────────────────────────────────────────────────────
const dims = [
  { key: "population",  label: "Population",  unit: "M pop",   fmt: d => d3.format(".1f")(d) },
  { key: "density",     label: "Density",     unit: "per km²", fmt: d => d3.format(",d")(d)  },
  { key: "elevation",   label: "Elevation",   unit: "metres",  fmt: d => d3.format(",d")(d)  },
  { key: "temperature", label: "Temperature", unit: "°C avg",  fmt: d => d3.format(".1f")(d) },
  { key: "rainfall",    label: "Rainfall",    unit: "mm/yr",   fmt: d => d3.format(",d")(d)  },
  { key: "cost",        label: "Cost Index",  unit: "NYC=100", fmt: d => d3.format("d")(d)   },
];

// ── Shared state ─────────────────────────────────────────────────────────────
const brushSelections = {}; // key → [y0, y1] | null

function isActive(city) {
  for (const [key, sel] of Object.entries(brushSelections)) {
    if (!sel) continue;
    const py = yScales[key](city[key]);
    if (py < sel[0] || py > sel[1]) return false;
  }
  return true;
}

// ── Parcoords layout ──────────────────────────────────────────────────────────
const pcM = { top: 58, right: 48, bottom: 16, left: 48 };
const pcTW = 940, pcTH = 265;
const pcW = pcTW - pcM.left - pcM.right;
const pcH = pcTH - pcM.top - pcM.bottom;

const xScale = d3.scalePoint()
  .domain(dims.map(d => d.key))
  .range([0, pcW])
  .padding(0.12);

const yScales = {};
for (const d of dims) {
  const [lo, hi] = d3.extent(cities, c => c[d.key]);
  const pad = (hi - lo) * 0.06;
  yScales[d.key] = d3.scaleLinear().domain([lo - pad, hi + pad]).range([pcH, 0]);
}

// ── Build parcoords ───────────────────────────────────────────────────────────
const pcSvg = d3.select("#parcoords-container").append("svg")
  .attr("width", pcTW).attr("height", pcTH)
  .attr("viewBox", `0 0 ${pcTW} ${pcTH}`);

const pcG = pcSvg.append("g").attr("transform", `translate(${pcM.left},${pcM.top})`);

// Background area for each axis band
const bandW = pcW / (dims.length - 1) * 0.4;
pcG.selectAll(".axis-band")
  .data(dims)
  .join("rect")
  .attr("class", "axis-band")
  .attr("x", d => xScale(d.key) - bandW / 2)
  .attr("y", 0)
  .attr("width", bandW)
  .attr("height", pcH)
  .attr("fill", "rgba(255,255,255,0.015)")
  .attr("rx", 2);

// City polylines
function linePath(city) {
  return d3.line()(dims.map(d => [xScale(d.key), yScales[d.key](city[d.key])]));
}

const linesG = pcG.append("g");
const lines = linesG.selectAll("path")
  .data(cities)
  .join("path")
  .attr("d", linePath)
  .attr("fill", "none")
  .attr("stroke", "rgba(100, 160, 220, 0.15)")
  .attr("stroke-width", 1.4);

// Axes + brushes
const brushHandles = []; // { key, brush, g }

for (const dim of dims) {
  const x = xScale(dim.key);
  const axG = pcG.append("g").attr("transform", `translate(${x},0)`);

  // Axis rule
  axG.append("line")
    .attr("y2", pcH)
    .attr("stroke", "#1e3c5a")
    .attr("stroke-width", 1.5);

  // Ticks + labels (right-aligned ticks)
  const ax = d3.axisRight(yScales[dim.key])
    .ticks(5)
    .tickSize(4)
    .tickFormat(dim.fmt);

  axG.call(ax)
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll(".tick line").attr("stroke", "#1e3c5a").attr("x1", -4).attr("x2", 4))
    .call(g => g.selectAll(".tick text")
      .attr("x", 8)
      .attr("fill", "#4e6e88")
      .attr("font-size", "10px"));

  // Axis title
  axG.append("text")
    .attr("y", -26)
    .attr("text-anchor", "middle")
    .attr("fill", "#a0c0dc")
    .attr("font-size", "12px")
    .attr("font-weight", "500")
    .text(dim.label);

  // Unit label
  axG.append("text")
    .attr("y", -13)
    .attr("text-anchor", "middle")
    .attr("fill", "#3a5a78")
    .attr("font-size", "10px")
    .text(dim.unit);

  // Brush
  const brush = d3.brushY()
    .extent([[-10, 0], [10, pcH]])
    .on("brush end", function({ selection }) {
      if (selection) {
        brushSelections[dim.key] = selection;
      } else {
        delete brushSelections[dim.key];
      }
      updateViews();
      d3.select("#reset-btn").attr("disabled", Object.keys(brushSelections).length === 0 ? true : null);
    });

  const brushG = axG.append("g").attr("class", "brush").call(brush);
  brushHandles.push({ key: dim.key, brush, g: brushG });
}

// ── World map ─────────────────────────────────────────────────────────────────
const mapM = { top: 18, right: 18, bottom: 18, left: 18 };
const mapTW = 940, mapTH = 460;
const mapW = mapTW - mapM.left - mapM.right;
const mapH = mapTH - mapM.top - mapM.bottom;

const mapSvg = d3.select("#map-container").append("svg")
  .attr("width", mapTW).attr("height", mapTH)
  .attr("viewBox", `0 0 ${mapTW} ${mapTH}`);

const mapG = mapSvg.append("g").attr("transform", `translate(${mapM.left},${mapM.top})`);

const projection = d3.geoNaturalEarth1().fitSize([mapW, mapH], { type: "Sphere" });
const geoPath = d3.geoPath(projection);

// Ocean
mapG.append("path")
  .datum({ type: "Sphere" })
  .attr("d", geoPath)
  .attr("fill", "#091520")
  .attr("stroke", "#162840")
  .attr("stroke-width", 0.5);

// Graticule
mapG.append("path")
  .datum(d3.geoGraticule()())
  .attr("d", geoPath)
  .attr("fill", "none")
  .attr("stroke", "rgba(22, 40, 64, 0.8)")
  .attr("stroke-width", 0.4);

// Load world topology
const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
const land = topojson.feature(world, world.objects.land);
const borders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

mapG.append("path")
  .datum(land)
  .attr("d", geoPath)
  .attr("fill", "#142236")
  .attr("stroke", "none");

mapG.append("path")
  .datum(borders)
  .attr("d", geoPath)
  .attr("fill", "none")
  .attr("stroke", "#1e3050")
  .attr("stroke-width", 0.5);

// Inactive city layer (always shown)
const inactiveDots = mapG.append("g").attr("class", "inactive-dots");
const activeDots = mapG.append("g").attr("class", "active-dots");
const labelLayer = mapG.append("g").attr("class", "labels");

// Project all cities once
const projected = cities.map(c => {
  const [px, py] = projection([c.lon, c.lat]);
  return { ...c, px, py };
});

// Tooltip
const tooltip = d3.select("#tooltip");

function showTooltip(event, d) {
  tooltip
    .style("opacity", 1)
    .html(`
      <div class="t-name">${d.name}</div>
      <div class="t-country">${d.country}</div>
      <div class="t-row">Population <span class="t-val">${d.population}M</span></div>
      <div class="t-row">Density <span class="t-val">${d3.format(",")(d.density)}/km²</span></div>
      <div class="t-row">Elevation <span class="t-val">${d3.format(",")(d.elevation)} m</span></div>
      <div class="t-row">Temperature <span class="t-val">${d.temperature}°C</span></div>
      <div class="t-row">Rainfall <span class="t-val">${d3.format(",")(d.rainfall)} mm</span></div>
      <div class="t-row">Cost Index <span class="t-val">${d.cost}</span></div>
    `);
}

function moveTooltip(event) {
  const x = event.clientX + 16;
  const y = event.clientY - 10;
  tooltip.style("left", x + "px").style("top", y + "px");
}

// ── Update both views ─────────────────────────────────────────────────────────
function updateViews() {
  const activeSet = new Set(cities.filter(isActive));
  const count = activeSet.size;

  d3.select("#count").text(count);

  // — Parcoords lines —
  lines
    .attr("stroke", c => activeSet.has(c) ? "rgba(255, 190, 60, 0.6)" : "rgba(100, 160, 220, 0.07)")
    .attr("stroke-width", c => activeSet.has(c) ? 1.8 : 1.2);

  // Raise active lines so they draw on top
  lines.filter(c => activeSet.has(c)).raise();

  // — Map dots —
  const activeCities = projected.filter(c => activeSet.has(c));
  const inactiveCities = projected.filter(c => !activeSet.has(c));

  // Inactive dots
  inactiveDots.selectAll("circle")
    .data(inactiveCities, d => d.name)
    .join("circle")
    .attr("cx", d => d.px)
    .attr("cy", d => d.py)
    .attr("r", 3)
    .attr("fill", "rgba(80, 120, 160, 0.25)")
    .attr("stroke", "rgba(60, 100, 140, 0.3)")
    .attr("stroke-width", 0.8)
    .attr("cursor", "pointer")
    .on("mouseover", (event, d) => { showTooltip(event, d); moveTooltip(event); })
    .on("mousemove", moveTooltip)
    .on("mouseout", () => tooltip.style("opacity", 0));

  // Active dots with glow effect via filter
  const dotsSel = activeDots.selectAll("g.city-marker")
    .data(activeCities, d => d.name)
    .join(
      enter => enter.append("g").attr("class", "city-marker"),
      update => update,
      exit => exit.remove()
    )
    .attr("transform", d => `translate(${d.px},${d.py})`)
    .attr("cursor", "pointer")
    .on("mouseover", (event, d) => { showTooltip(event, d); moveTooltip(event); })
    .on("mousemove", moveTooltip)
    .on("mouseout", () => tooltip.style("opacity", 0));

  // Glow ring
  dotsSel.selectAll("circle.glow")
    .data([null])
    .join("circle")
    .attr("class", "glow")
    .attr("r", 8)
    .attr("fill", "rgba(255, 190, 60, 0.08)")
    .attr("stroke", "rgba(255, 190, 60, 0.2)")
    .attr("stroke-width", 1);

  // Main dot
  dotsSel.selectAll("circle.dot")
    .data([null])
    .join("circle")
    .attr("class", "dot")
    .attr("r", 4.5)
    .attr("fill", "#ffbe3c")
    .attr("stroke", "rgba(255, 230, 140, 0.7)")
    .attr("stroke-width", 1.2);

  // City name labels (only when ≤ 18 selected)
  labelLayer.selectAll("text")
    .data(count <= 18 ? activeCities : [], d => d.name)
    .join(
      enter => enter.append("text")
        .attr("opacity", 0)
        .call(t => t.transition().duration(200).attr("opacity", 1)),
      update => update,
      exit => exit.call(t => t.transition().duration(150).attr("opacity", 0).remove())
    )
    .attr("x", d => d.px + 6)
    .attr("y", d => d.py - 6)
    .attr("fill", "#e0d080")
    .attr("font-size", "10px")
    .attr("font-family", "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif")
    .attr("pointer-events", "none")
    .text(d => d.name);
}

// ── Reset button ──────────────────────────────────────────────────────────────
d3.select("#reset-btn").on("click", () => {
  for (const { brush, g } of brushHandles) {
    g.call(brush.move, null);
  }
  // brushSelections cleared via brush events above
});

// ── Initial render ────────────────────────────────────────────────────────────
updateViews();
</script>
</body>
</html>
