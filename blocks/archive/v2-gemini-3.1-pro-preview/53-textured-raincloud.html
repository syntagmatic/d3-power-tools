<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Textured Raincloud Plot</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: #ffffff;
      color: #111;
    }
    .header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      max-width: 900px;
    }
    .title h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
    }
    .title p {
      margin: 0;
      color: #555;
      font-size: 15px;
    }
    .controls {
      background: #f4f4f4;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .controls input {
      cursor: pointer;
    }
    .colorblind-active svg {
      filter: url(#deuteranopia-filter);
    }
    #chart {
      max-width: 900px;
    }
    svg {
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <h1>Treatment Efficacy Distributions</h1>
      <p>Raincloud plot with dual-encoded groups (Tol color + SVG pattern) for accessibility.</p>
    </div>
    <label class="controls">
      <input type="checkbox" id="sim-toggle"> Simulate Deuteranopia
    </label>
  </div>
  <div id="chart"></div>
  <script>
    const width = 900;
    const height = 700;
    const margin = { top: 20, right: 40, bottom: 60, left: 120 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const svg = d3.select("#chart").append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("viewBox", `0 0 ${width} ${height}`);

    const defs = svg.append("defs");
    
    defs.append("filter")
      .attr("id", "deuteranopia-filter")
      .append("feColorMatrix")
      .attr("type", "matrix")
      .attr("values", "0.625 0.375 0 0 0  0.700 0.300 0 0 0  0 0.300 0.700 0 0  0 0 0 1 0");

    const strokeColor = "rgba(0,0,0,0.4)";
    
    // 1. Diagonal hatch
    const p1 = defs.append("pattern").attr("id", "pat-1").attr("width", 8).attr("height", 8).attr("patternUnits", "userSpaceOnUse").attr("patternTransform", "rotate(45)");
    p1.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8).attr("stroke", strokeColor).attr("stroke-width", 1.5);

    // 2. Dots
    const p2 = defs.append("pattern").attr("id", "pat-2").attr("width", 8).attr("height", 8).attr("patternUnits", "userSpaceOnUse");
    p2.append("circle").attr("cx", 4).attr("cy", 4).attr("r", 1.5).attr("fill", strokeColor);

    // 3. Cross-hatch
    const p3 = defs.append("pattern").attr("id", "pat-3").attr("width", 8).attr("height", 8).attr("patternUnits", "userSpaceOnUse");
    p3.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8).attr("stroke", strokeColor).attr("stroke-width", 1.5);
    p3.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 8).attr("y2", 0).attr("stroke", strokeColor).attr("stroke-width", 1.5);

    // 4. Horizontal lines
    const p4 = defs.append("pattern").attr("id", "pat-4").attr("width", 8).attr("height", 8).attr("patternUnits", "userSpaceOnUse");
    p4.append("line").attr("x1", 0).attr("y1", 4).attr("x2", 8).attr("y2", 4).attr("stroke", strokeColor).attr("stroke-width", 1.5);

    // 5. Diamonds
    const p5 = defs.append("pattern").attr("id", "pat-5").attr("width", 12).attr("height", 12).attr("patternUnits", "userSpaceOnUse");
    p5.append("path").attr("d", "M6,1 L11,6 L6,11 L1,6 Z").attr("fill", strokeColor);

    // 6. Vertical lines
    const p6 = defs.append("pattern").attr("id", "pat-6").attr("width", 8).attr("height", 8).attr("patternUnits", "userSpaceOnUse");
    p6.append("line").attr("x1", 4).attr("y1", 0).attr("x2", 4).attr("y2", 8).attr("stroke", strokeColor).attr("stroke-width", 1.5);

    const n = 150;
    const data = [];
    const groups = ["Control", "Treatment A", "Treatment B", "Treatment C", "Treatment D", "Treatment E"];
    
    const seed = d3.randomLcg(42);
    const rNorm = d3.randomNormal.source(seed);
    const rLog = d3.randomLogNormal.source(seed);
    const rUni = d3.randomUniform.source(seed);

    const distributions = [
      rNorm(50, 8),
      rNorm(65, 12),
      rLog(3.9, 0.25),
      () => (seed() < 0.4 ? rNorm(35, 6)() : rNorm(75, 7)()),
      rNorm(45, 5),
      rUni(30, 85)
    ];

    groups.forEach((g, i) => {
      for (let j = 0; j < n; j++) {
        data.push({ group: g, value: distributions[i]() });
      }
    });

    const gaussian = (x) => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
    function kde(kernel, bandwidth, vals) {
      return (points) => points.map(x => [
        x,
        d3.mean(vals, v => kernel((x - v) / bandwidth)) / bandwidth
      ]);
    }

    function computeStats(values) {
      const sorted = Float64Array.from(values).sort();
      const q1 = d3.quantile(sorted, 0.25), q3 = d3.quantile(sorted, 0.75), iqr = q3 - q1;
      const lowerFence = q1 - 1.5 * iqr, upperFence = q3 + 1.5 * iqr;
      return {
        min: sorted[0], max: sorted[sorted.length - 1],
        q1, median: d3.quantile(sorted, 0.5), q3, iqr,
        whiskerLow: d3.min(sorted.filter(v => v >= lowerFence)),
        whiskerHigh: d3.max(sorted.filter(v => v <= upperFence))
      };
    }

    const grouped = d3.group(data, d => d.group);
    const groupData = Array.from(grouped, ([key, values]) => {
      const vals = values.map(d => d.value);
      const stats = computeStats(vals);
      
      const sorted = Float64Array.from(vals).sort();
      const std = d3.deviation(vals), iqr = d3.quantile(sorted, 0.75) - d3.quantile(sorted, 0.25);
      let bw_kde = 0.9 * Math.min(std, iqr / 1.34) * Math.pow(vals.length, -0.2);
      if (bw_kde === 0) bw_kde = 0.5;
      
      if (key === "Treatment C") bw_kde *= 0.6; // preserve bimodal shape
      
      const minX = Math.max(0, stats.min - 3 * bw_kde);
      const maxX = stats.max + 3 * bw_kde;
      const ticks = Array.from({length: 200}, (_, i) => minX + (maxX - minX) * i / 199);
      
      const density = kde(gaussian, bw_kde, vals)(ticks);
      density.unshift([ticks[0] - bw_kde, 0]);
      density.push([ticks[ticks.length - 1] + bw_kde, 0]);
      
      return { key, values, stats, density, maxDensity: d3.max(density, d => d[1]) };
    });

    const globalMaxDensity = d3.max(groupData, d => d.maxDensity);
    
    const xScale = d3.scaleLinear()
      .domain([0, d3.max(data, d => d.value)]).nice()
      .range([0, innerWidth]);

    const yBand = d3.scaleBand()
      .domain(groups)
      .range([0, innerHeight])
      .padding(0.15);

    const bw = yBand.bandwidth();
    const densityScale = d3.scaleLinear()
      .domain([0, globalMaxDensity])
      .range([0, bw * 0.45]);

    const tolBright = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377"];
    const patterns = ["pat-1", "pat-2", "pat-3", "pat-4", "pat-5", "pat-6"];

    const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const xAxis = d3.axisBottom(xScale).ticks(10);
    g.append("g")
      .attr("transform", `translate(0, ${innerHeight})`)
      .call(xAxis)
      .call(g => g.select(".domain").attr("stroke-width", 1.5).attr("stroke", "#555"))
      .call(g => g.selectAll(".tick line").attr("stroke-opacity", 0.3).attr("stroke", "#555"))
      .call(g => g.selectAll("text").style("font-size", "13px").style("fill", "#333"));

    g.append("text")
      .attr("x", innerWidth / 2)
      .attr("y", innerHeight + 45)
      .attr("text-anchor", "middle")
      .style("font-size", "15px")
      .style("font-weight", "600")
      .style("fill", "#333")
      .text("Metric Value");

    const yAxis = d3.axisLeft(yBand).tickSize(0).tickPadding(12);
    g.append("g")
      .call(yAxis)
      .call(g => g.select(".domain").remove())
      .call(g => g.selectAll("text").style("font-size", "14px").style("font-weight", "600").style("fill", "#111"));

    const row = g.selectAll(".row")
      .data(groupData)
      .join("g")
      .attr("class", "row")
      .attr("transform", d => `translate(0, ${yBand(d.key)})`);

    const violinHeight = bw * 0.45;
    const boxTop = bw * 0.50;
    const boxHeight = bw * 0.16;
    const boxCenter = boxTop + boxHeight / 2;
    const jitterTop = bw * 0.72;
    const jitterHeight = bw * 0.28;

    const violinArea = d3.area()
      .x(d => xScale(d[0]))
      .y0(violinHeight)
      .y1(d => violinHeight - densityScale(d[1]))
      .curve(d3.curveBasis);

    const bgOpacity = 0.5;

    // Half-Violin (Color + Pattern + Outline)
    row.append("path")
      .attr("d", d => violinArea(d.density))
      .attr("fill", (d, i) => tolBright[i])
      .attr("opacity", bgOpacity);

    row.append("path")
      .attr("d", d => violinArea(d.density))
      .attr("fill", (d, i) => `url(#${patterns[i]})`);

    row.append("path")
      .attr("d", d => violinArea(d.density))
      .attr("fill", "none")
      .attr("stroke", "#333")
      .attr("stroke-width", 1.2)
      .attr("stroke-opacity", 0.8);

    // Box Plot Whiskers and Caps
    row.append("line").attr("x1", d => xScale(d.stats.whiskerLow)).attr("x2", d => xScale(d.stats.q1))
      .attr("y1", boxCenter).attr("y2", boxCenter).attr("stroke", "#333").attr("stroke-width", 1.5);
    row.append("line").attr("x1", d => xScale(d.stats.q3)).attr("x2", d => xScale(d.stats.whiskerHigh))
      .attr("y1", boxCenter).attr("y2", boxCenter).attr("stroke", "#333").attr("stroke-width", 1.5);

    row.append("line").attr("x1", d => xScale(d.stats.whiskerLow)).attr("x2", d => xScale(d.stats.whiskerLow))
      .attr("y1", boxCenter - boxHeight/3).attr("y2", boxCenter + boxHeight/3).attr("stroke", "#333").attr("stroke-width", 1.5);
    row.append("line").attr("x1", d => xScale(d.stats.whiskerHigh)).attr("x2", d => xScale(d.stats.whiskerHigh))
      .attr("y1", boxCenter - boxHeight/3).attr("y2", boxCenter + boxHeight/3).attr("stroke", "#333").attr("stroke-width", 1.5);

    // Box Plot Body (Color + Pattern)
    row.append("rect")
      .attr("x", d => xScale(d.stats.q1))
      .attr("width", d => xScale(d.stats.q3) - xScale(d.stats.q1))
      .attr("y", boxTop)
      .attr("height", boxHeight)
      .attr("fill", (d, i) => tolBright[i])
      .attr("opacity", bgOpacity);

    row.append("rect")
      .attr("x", d => xScale(d.stats.q1))
      .attr("width", d => xScale(d.stats.q3) - xScale(d.stats.q1))
      .attr("y", boxTop)
      .attr("height", boxHeight)
      .attr("fill", (d, i) => `url(#${patterns[i]})`)
      .attr("stroke", "#333")
      .attr("stroke-width", 1.5);

    // Median Line
    row.append("line")
      .attr("x1", d => xScale(d.stats.median))
      .attr("x2", d => xScale(d.stats.median))
      .attr("y1", boxTop)
      .attr("y2", boxTop + boxHeight)
      .attr("stroke", "#111")
      .attr("stroke-width", 2.5);

    // Jittered Strip
    const jitterRandom = d3.randomLcg(100);
    
    row.each(function(d, i) {
      d3.select(this).selectAll(".point")
        .data(d.values)
        .join("circle")
        .attr("class", "point")
        .attr("cx", pd => xScale(pd.value))
        .attr("cy", () => jitterTop + jitterRandom() * jitterHeight)
        .attr("r", 2.5)
        .attr("fill", tolBright[i])
        .attr("opacity", 0.7)
        .attr("stroke", "#222")
        .attr("stroke-width", 0.5)
        .attr("stroke-opacity", 0.8);
    });

    // Deuteranopia Toggle Logic
    document.getElementById('sim-toggle').addEventListener('change', function() {
      if (this.checked) {
        document.body.classList.add('colorblind-active');
      } else {
        document.body.classList.remove('colorblind-active');
      }
    });
  </script>
</body>
</html>
