<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallel Coordinates & Sparkline Table</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f4f5;
    color: #1a1a2e;
    margin: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .dashboard {
    width: 100%;
    max-width: 1000px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    padding: 32px;
    box-sizing: border-box;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    border-bottom: 1px solid #f0f0f0;
    padding-bottom: 20px;
  }
  .title-group h1 {
    margin: 0 0 6px 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .title-group p {
    margin: 0;
    color: #64748b;
    font-size: 14px;
  }
  .badge {
    background: #eef2ff;
    color: #4f46e5;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 1px 2px rgba(79, 70, 229, 0.1);
  }
  .badge::before {
    content: "";
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4f46e5;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
    70% { box-shadow: 0 0 0 6px rgba(79, 70, 229, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
  }
  
  .viz-container {
    position: relative;
    width: 100%;
    height: 420px;
    margin-bottom: 40px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
  svg.axes {
    position: absolute;
    top: 0;
    left: 0;
    overflow: visible;
    touch-action: none;
  }
  
  .axis-label {
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    fill: #334155;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .axis path, .axis line {
    stroke: #e2e8f0;
  }
  .axis text {
    fill: #64748b;
    font-size: 11px;
  }
  .brush .selection {
    fill: #4f46e5;
    fill-opacity: 0.15;
    stroke: #4f46e5;
    stroke-width: 1;
    rx: 2;
  }
  .strum-line {
    stroke: #e11d48;
    stroke-width: 2.5;
    stroke-dasharray: 4 4;
    pointer-events: none;
  }
  
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  th {
    text-align: right;
    border-bottom: 2px solid #e2e8f0;
    padding: 12px 16px;
    font-size: 12px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  th:first-child { text-align: left; }
  th.spark-th { text-align: center; }
  td {
    border-bottom: 1px solid #f1f5f9;
    padding: 16px;
    font-size: 14px;
    vertical-align: middle;
  }
  td:first-child {
    text-align: left;
    font-weight: 600;
    color: #1e293b;
  }
  .num {
    text-align: right;
    width: 110px;
    color: #475569;
    font-weight: 500;
  }
  .spark-cell {
    width: 200px;
    text-align: center;
    padding: 8px 16px;
  }
  .spark-svg {
    display: inline-block;
    overflow: visible;
    vertical-align: middle;
  }
  
  .hints {
    margin-top: 24px;
    font-size: 13px;
    color: #64748b;
    text-align: center;
    padding-top: 16px;
    border-top: 1px dashed #e2e8f0;
  }
  kbd {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    color: #334155;
    box-shadow: 0 1px 1px rgba(0,0,0,0.05);
  }
</style>
</head>
<body>
<div class="dashboard">
  <div class="header">
    <div class="title-group">
      <h1>Synthetic Cities Analysis</h1>
      <p>Correlated metrics across 6 geographic regions.</p>
    </div>
    <div class="badge" id="count-badge">150 / 150 selected</div>
  </div>
  
  <div class="viz-container"></div>
  
  <table>
    <thead>
      <tr>
        <th>Metric</th>
        <th>Min</th>
        <th class="spark-th">Distribution</th>
        <th>Median</th>
        <th>Max</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  
  <div class="hints">
    <b>Interaction:</b> Drag on any axis to brush • <kbd>Shift</kbd> + Drag across lines to strum • Double-click background to clear strums
  </div>
</div>

<script>
// 1. Data Generation
const regions = ["North", "South", "East", "West", "Central", "Coastal"];
const data = Array.from({length: 150}, (_, i) => {
  const region = regions[i % 6];
  
  let elevation = Math.random() * 3000;
  if (region === "Coastal") elevation = Math.random() * 100;
  if (region === "North") elevation += 500;
  
  let temp = 32 - (elevation / 150) + (Math.random() * 8 - 4);
  if (region === "North") temp -= 12;
  if (region === "South") temp += 6;
  
  let rainfall = Math.max(0, 150 - Math.abs(temp - 20) * 5 + (region === "Coastal" ? 60 : 0) + Math.random() * 50);
  
  let population = Math.max(10000, 5000000 * Math.exp(-elevation / 1000) * (0.5 + Math.random()));
  
  let density = Math.max(10, population / (50 + Math.random() * 500));
  
  let gdp = population * (25000 + (temp > 15 && temp < 25 ? 12000 : 0) + Math.random() * 20000);
  
  return { id: i, region, population, temp, elevation, rainfall, gdp, density };
});

const dims = [
  { key: "population", name: "Population", format: d3.format(".2s") },
  { key: "temp", name: "Temp (°C)", format: d3.format(".1f") },
  { key: "elevation", name: "Elevation (m)", format: d3.format(".0f") },
  { key: "rainfall", name: "Rainfall (mm)", format: d3.format(".0f") },
  { key: "gdp", name: "GDP ($)", format: d3.format(".2s") },
  { key: "density", name: "Density (/km²)", format: d3.format(".0f") }
];

// 2. Setup Dimensions and Canvas/SVG Layers
const vizContainer = document.querySelector('.viz-container');
const vizWidth = vizContainer.clientWidth || 936; 
const margin = {top: 30, right: 10, bottom: 20, left: 10};
const width = vizWidth - margin.left - margin.right;
const height = 420 - margin.top - margin.bottom;

const container = d3.select(".viz-container");

const canvas = container.append("canvas")
  .attr("width", width * devicePixelRatio)
  .attr("height", height * devicePixelRatio)
  .style("width", width + "px")
  .style("height", height + "px")
  .style("margin-left", margin.left + "px")
  .style("margin-top", margin.top + "px");

const ctx = canvas.node().getContext("2d");
ctx.scale(devicePixelRatio, devicePixelRatio);

const svg = container.append("svg")
  .attr("class", "axes")
  .attr("width", vizWidth)
  .attr("height", 420);

const g = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

// 3. Scales
const x = d3.scalePoint().range([0, width]).domain(dims.map(d => d.key));
const y = {};
dims.forEach(d => {
  y[d.key] = d3.scaleLinear()
    .domain(d3.extent(data, item => item[d.key]))
    .nice()
    .range([height, 0]);
});

const color = d3.scaleOrdinal(d3.schemeTableau10).domain(regions);

// 4. Line Rendering
function drawLines(selectedData) {
  ctx.clearRect(0, 0, width, height);
  
  // Render unselected (background)
  ctx.globalAlpha = 0.1;
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#94a3b8";
  ctx.beginPath();
  data.forEach(d => {
    if (!selectedData.includes(d)) {
      dims.forEach((dim, i) => {
        const px = x(dim.key);
        const py = y[dim.key](d[dim.key]);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
    }
  });
  ctx.stroke();
  
  // Render selected (foreground)
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = 1.5;
  selectedData.forEach(d => {
    ctx.strokeStyle = color(d.region);
    ctx.beginPath();
    dims.forEach((dim, i) => {
      const px = x(dim.key);
      const py = y[dim.key](d[dim.key]);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.stroke();
  });
}

// 5. Strumming Interaction (Intersection Brushing)
let strums = [];
let isStrumming = false;
let currentStrum = null;
const strumGroup = g.append("g").attr("class", "strums");

function segmentsIntersect(p1, p2, p3, p4) {
  const direction = (pi, pj, pk) => (pk[0] - pi[0]) * (pj[1] - pi[1]) - (pj[0] - pi[0]) * (pk[1] - pi[1]);
  const onSegment = (pi, pj, pk) => Math.min(pi[0], pj[0]) <= pk[0] && pk[0] <= Math.max(pi[0], pj[0]) && Math.min(pi[1], pj[1]) <= pk[1] && pk[1] <= Math.max(pi[1], pj[1]);
  const d1 = direction(p3, p4, p1), d2 = direction(p3, p4, p2);
  const d3 = direction(p1, p2, p3), d4 = direction(p1, p2, p4);
  if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return true;
  if (d1 === 0 && onSegment(p3, p4, p1)) return true;
  if (d2 === 0 && onSegment(p3, p4, p2)) return true;
  if (d3 === 0 && onSegment(p1, p2, p3)) return true;
  if (d4 === 0 && onSegment(p1, p2, p4)) return true;
  return false;
}

svg.on("pointerdown", e => {
  if (e.shiftKey) {
    e.preventDefault();
    const [px, py] = d3.pointer(e, g.node());
    isStrumming = true;
    currentStrum = { start: [px, py], end: [px, py] };
    strums.push(currentStrum);
    svg.node().setPointerCapture(e.pointerId);
  }
});

svg.on("pointermove", e => {
  if (isStrumming && currentStrum) {
    const [px, py] = d3.pointer(e, g.node());
    currentStrum.end = [px, py];
    drawStrums();
    updateSelection();
  }
});

svg.on("pointerup", e => {
  if (isStrumming) {
    isStrumming = false;
    svg.node().releasePointerCapture(e.pointerId);
  }
});

svg.on("dblclick", () => {
  strums = [];
  drawStrums();
  updateSelection();
});

function drawStrums() {
  const lines = strumGroup.selectAll(".strum-line").data(strums);
  lines.enter().append("line").attr("class", "strum-line")
    .merge(lines)
    .attr("x1", d => d.start[0])
    .attr("y1", d => d.start[1])
    .attr("x2", d => d.end[0])
    .attr("y2", d => d.end[1]);
  lines.exit().remove();
}

// 6. Axis Brushing
let activeFilters = {};
const brushes = {};

function brushed(event, d) {
  if (event.selection) {
    activeFilters[d.key] = event.selection;
  } else {
    delete activeFilters[d.key];
  }
  updateSelection();
}

const axes = g.selectAll(".axis")
  .data(dims)
  .enter().append("g")
  .attr("class", "axis")
  .attr("transform", d => `translate(${x(d.key)},0)`);

axes.each(function(d) {
  d3.select(this).call(d3.axisLeft(y[d.key]).ticks(6).tickFormat(d.format).tickSizeOuter(0));
  
  brushes[d.key] = d3.brushY()
    .extent([[-12, 0], [12, height]])
    .filter(event => !event.ctrlKey && !event.button && !event.shiftKey) // Let Shift+Drag pass to SVG for strumming
    .on("brush end", brushed);
    
  d3.select(this).append("g")
    .attr("class", "brush")
    .call(brushes[d.key]);
});

axes.append("text")
  .attr("class", "axis-label")
  .attr("text-anchor", "middle")
  .attr("y", -14)
  .text(d => d.name);

// 7. Sparkline Table Initialization
const tbody = d3.select("table tbody");
const sparkW = 180;
const sparkH = 32;
const allBins = {};

// Precompute global bins so backgrounds stay consistent
dims.forEach(dim => {
  const values = data.map(d => d[dim.key]);
  const domain = y[dim.key].domain();
  const binGen = d3.bin().domain(domain).thresholds(24);
  const bins = binGen(values);
  allBins[dim.key] = {
    domain,
    bins,
    binGen,
    maxCount: d3.max(bins, b => b.length)
  };
});

// 8. Update Functions
function updateTable(selected) {
  const rows = tbody.selectAll("tr").data(dims, d => d.key);
  
  const rowsEnter = rows.enter().append("tr");
  rowsEnter.append("td").text(d => d.name);
  rowsEnter.append("td").attr("class", "num min");
  
  const sparkTd = rowsEnter.append("td").attr("class", "spark-cell");
  const sparkSvg = sparkTd.append("svg")
    .attr("class", "spark-svg")
    .attr("width", sparkW)
    .attr("height", sparkH);
    
  // Draw global distribution background bars
  sparkSvg.each(function(d) {
    const sSvg = d3.select(this);
    const info = allBins[d.key];
    const bx = d3.scaleLinear().domain(info.domain).range([0, sparkW]);
    const by = d3.scaleLinear().domain([0, info.maxCount]).range([sparkH, 0]);
    
    sSvg.selectAll(".bg-bar")
      .data(info.bins)
      .enter().append("rect")
      .attr("class", "bg-bar")
      .attr("x", b => bx(b.x0))
      .attr("width", b => Math.max(1, bx(b.x1) - bx(b.x0) - 1))
      .attr("y", b => by(b.length))
      .attr("height", b => sparkH - by(b.length))
      .attr("fill", "#f1f5f9")
      .attr("rx", 1);
      
    sSvg.append("g").attr("class", "fg-bars");
  });
  
  rowsEnter.append("td").attr("class", "num median");
  rowsEnter.append("td").attr("class", "num max");
  
  const allRows = rowsEnter.merge(rows);
  
  // Update numbers and foreground bars based on selection
  allRows.each(function(d) {
    const row = d3.select(this);
    const vals = selected.map(item => item[d.key]).sort(d3.ascending);
    
    if (vals.length > 0) {
      row.select(".min").text(d.format(vals[0]));
      row.select(".median").text(d.format(d3.median(vals)));
      row.select(".max").text(d.format(vals[vals.length - 1]));
    } else {
      row.select(".min").text("-");
      row.select(".median").text("-");
      row.select(".max").text("-");
    }
    
    const info = allBins[d.key];
    const fgBins = info.binGen(vals);
    const bx = d3.scaleLinear().domain(info.domain).range([0, sparkW]);
    const by = d3.scaleLinear().domain([0, info.maxCount]).range([sparkH, 0]);
    
    const fgBars = row.select(".fg-bars").selectAll("rect").data(fgBins);
    fgBars.enter().append("rect")
      .merge(fgBars)
      .attr("x", b => bx(b.x0))
      .attr("width", b => Math.max(1, bx(b.x1) - bx(b.x0) - 1))
      .attr("y", b => by(b.length))
      .attr("height", b => sparkH - by(b.length))
      .attr("fill", "#4f46e5")
      .attr("rx", 1);
      
    fgBars.exit().remove();
  });
}

function updateSelection() {
  const selected = data.filter(d => {
    // 1. Apply Axis Brushes (Intersection/AND)
    for (const key in activeFilters) {
      const [y0, y1] = activeFilters[key];
      const py = y[key](d[key]);
      if (py < y0 || py > y1) return false;
    }
    
    // 2. Apply Strums (Intersection/AND across multiple strums)
    if (strums.length > 0) {
      for (const strum of strums) {
        let intersectsLine = false;
        for (let i = 0; i < dims.length - 1; i++) {
          const p1 = [x(dims[i].key), y[dims[i].key](d[dims[i].key])];
          const p2 = [x(dims[i+1].key), y[dims[i+1].key](d[dims[i+1].key])];
          if (segmentsIntersect(p1, p2, strum.start, strum.end)) {
            intersectsLine = true;
            break;
          }
        }
        if (!intersectsLine) return false;
      }
    }
    return true;
  });
  
  d3.select("#count-badge").text(`${selected.length} / ${data.length} selected`);
  drawLines(selected);
  updateTable(selected);
}

// 9. Initial Render
drawLines(data);
updateTable(data);

</script>
</body>
</html>
