<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Distributions — before and after calibration</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --text-muted: #666;
    --font: system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 2px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .legend {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch {
    width: 24px; height: 12px; border-radius: 2px; flex-shrink: 0;
  }
  #chart { width: 100%; max-width: 800px; }
</style>
</head>
<body>
<h1>Score Distributions</h1>
<p class="subtitle">Before and after calibration &mdash; KDE density per agent across 84 blocks</p>
<div class="legend">
  <div class="legend-item">
    <div class="legend-swatch" style="background:rgba(150,150,150,0.3); border:1px solid #aaa;"></div>
    v1 pre-calibration
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background:rgba(68,119,170,0.5); border:1px solid #4477AA;"></div>
    v2 post-calibration
  </div>
</div>
<div id="chart"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const agents = ["Visual","Deception","Interaction","Perceptual","Metamorphic"];

const v1Raw = {
1:[5,7,4,6,5],2:[4,8,5,5,4],3:[6,7,8,5,4],4:[6,7,7,6,4],5:[4,7,4,7,5],6:[5,9,7,7,3],7:[4,6,3,6,5],8:[4,8,5,7,4],9:[7,7,5,7,5],10:[3,8,5,7,5],11:[3,8,6,6,5],12:[4,8,7,7,5],13:[3,9,5,6,4],14:[3,8,6,6,5],15:[4,8,5,7,6],16:[4,8,5,7,5],17:[4,8,5,6,5],18:[5,9,6,7,7],19:[5,8,5,7,5],20:[4,7,6,6,5],21:[5,7,7,7,6],22:[3,7,4,7,3],23:[4,7,3,7,4],24:[5,8,5,6,5],25:[5,8,4,6,5],26:[5,7,6,5,4],27:[6,8,5,6,7],28:[6,8,8,7,3],29:[3,7,4,6,5],30:[5,7,5,7,5],31:[4,8,7,7,7],32:[3,8,4,5,4],33:[6,7,8,6,5],34:[7,8,8,7,4],35:[6,8,6,6,5],36:[4,8,5,7,5],37:[8,7,6,8,5],38:[6,5,8,7,4],39:[3,8,7,6,5],40:[4,7,6,7,5],41:[5,8,6,6,6],42:[3,9,6,6,5],43:[7,7,6,8,7],44:[7,9,8,8,8],45:[7,9,4,8,7],46:[7,9,6,8,7],47:[7,9,6,7,5],48:[7,7,6,5,7],49:[7,9,7,7,8],50:[8,10,8,8,8],51:[8,9,7,6,8],52:[8,9,7,8,6],53:[8,10,8,8,8],54:[7,9,8,7,7],55:[5,9,5,7,6],56:[4.5,9,3,5,7],57:[5,9,7,7,8],58:[6,9,7,8,7],59:[6,9,6,6,7],60:[6,9,7,7,5],61:[5,9,4,6,7],62:[7,9,5,8,7],63:[4,8,4,8,6],64:[6,8,6,7,7],65:[7,8,7,7,8],66:[7,9,7,8,8],67:[7,9,6,7,8],68:[7,9,7,7,8],69:[7,8,8,8,8],70:[7,9,7,7,7],71:[6,9,6,5,7],72:[7,9,7,9,6],73:[7,9,7,8,8],74:[7,9,8,8,8],75:[7,9,6,7,8],76:[7,9,7,7,8],77:[7,9,5,7,7],78:[7,9,6,7,8],79:[8,8,7,8,8],80:[7,8,8,8,7],81:[7,10,7,8,8],82:[8,9,7,8,8],83:[7,10,6,7,7],84:[7,9,8,9,8]
};

const v2Raw = {
1:[7,8,6,6,7],2:[8,9,7,7,7],3:[7,8,7,5,8],4:[8,8,7,7,6],5:[7,7,6,7,7],6:[9,9,7,8,8],7:[7,8,5,7,7],8:[7,8,7,7,7],9:[8,7,7,7,6],10:[8,9,6,8,7],11:[7,8,6,6,6],12:[8,8,7,6,7],13:[7,9,6,6,7],14:[7,8,7,7,7],15:[8,9,7,7,7],16:[8,8,6,7,8],17:[7,9,6,6,7],18:[7,9,7,7,8],19:[8,8,7,7,7],20:[7,7,7,6,6],21:[5,6,7,5,6],22:[7,8,6,7,7],23:[7,8,5,7,7],24:[8,8,7,7,8],25:[5,8,6,6,6],26:[8,9,7,8,7],27:[7,9,6,6,8],28:[8,8,7,8,7],29:[7,8,5,7,6],30:[7,9,7,7,6],31:[7,8,5,7,7],32:[6,8,6,5,6],33:[8,8,7,8,7],34:[8,9,7,7,7],35:[7,8,7,6,7],36:[7,8,6,7,8],37:[6,7,7,6,6],38:[7,5,7,6,7],39:[5,8,6,4,6],40:[7,9,6,7,7],41:[8,8,7,7,7],42:[8,9,6,7,7],43:[8,9,7,7,7],44:[7,9,7,6,7],45:[7,8,5,6,5],46:[7,8,7,8,7],47:[7,8,7,5,7],48:[7,9,6,6,6],49:[7,8,6,7,7],50:[8,9,7,8,7],51:[7,8,7,7,7],52:[7,7,7,7,7],53:[8,9,7,8,8],54:[7,8,6,6,7],55:[7,8,6,7,6],56:[7,8,5,7,6],57:[8,8,7,8,7],58:[8,8,7,8,7],59:[8,8,5,7,7],60:[7,8,6,6,7],61:[7,8,6,7,7],62:[7,8,6,7,6],63:[7,9,5,8,6],64:[6,8,6,5,7],65:[7,8,7,7,7],66:[7,8,7,7,8],67:[7,9,6,6,7],68:[8,8,7,8,7],69:[8,9,7,8,8],70:[7,8,6,6,6],71:[6,8,5,5,6],72:[7,9,6,7,7],73:[7,8,6,7,6],74:[8,7,7,8,7],75:[6,8,7,5,7],76:[8,8,6,7,7],77:[7,8,5,6,6],78:[5,8,5,4,6],79:[7,7,6,6,7],80:[8,8,7,8,6],81:[8,9,7,8,7],82:[7,8,7,6,7],83:[7,7,6,7,6],84:[8,8,7,9,7]
};

// Extract per-agent score arrays
function extractAgentScores(raw) {
  return agents.map((_, ai) =>
    Object.values(raw).map(scores => scores[ai])
  );
}

const v1Scores = extractAgentScores(v1Raw);
const v2Scores = extractAgentScores(v2Raw);

// Gaussian KDE
function kde(kernel, thresholds, data) {
  return thresholds.map(t => [t, d3.mean(data, d => kernel(t - d))]);
}

function epanechnikov(bandwidth) {
  return x => {
    x = x / bandwidth;
    return Math.abs(x) <= 1 ? 0.75 * (1 - x * x) / bandwidth : 0;
  };
}

// Use Gaussian kernel for smoother results
function gaussian(bandwidth) {
  const k = 1 / (bandwidth * Math.sqrt(2 * Math.PI));
  return x => k * Math.exp(-0.5 * (x / bandwidth) ** 2);
}

const bw = 0.8;
const xDomain = [1, 10];
const xTicks = d3.range(1, 10.05, 0.1);

// Compute all densities
const v1Densities = v1Scores.map(scores => kde(gaussian(bw), xTicks, scores));
const v2Densities = v2Scores.map(scores => kde(gaussian(bw), xTicks, scores));

const maxDensity = d3.max([...v1Densities, ...v2Densities].flat(), d => d[1]);

// Agent colors for v2
const agentColors = ["#CC6677","#332288","#44AA99","#DDCC77","#AA4499"];

// Layout
const margin = {top: 10, right: 40, bottom: 40, left: 120};
const width = 760;
const rowHeight = 100;
const overlap = 30; // px overlap between rows
const totalH = margin.top + margin.bottom + agents.length * rowHeight - (agents.length - 1) * overlap;

const svg = d3.select("#chart").append("svg")
  .attr("viewBox", `0 0 ${width} ${totalH}`)
  .attr("width", "100%");

svg.append("title").text("Score Distributions — KDE ridgeline plot before and after calibration");

const innerW = width - margin.left - margin.right;

const xScale = d3.scaleLinear().domain(xDomain).range([0, innerW]);
const yScale = d3.scaleLinear().domain([0, maxDensity]).range([rowHeight - 10, 0]);

const area = d3.area()
  .x(d => xScale(d[0]))
  .y0(rowHeight - 10)
  .y1(d => yScale(d[1]))
  .curve(d3.curveBasis);

const line = d3.line()
  .x(d => xScale(d[0]))
  .y(d => yScale(d[1]))
  .curve(d3.curveBasis);

// Draw rows
agents.forEach((agent, i) => {
  const yOff = margin.top + i * (rowHeight - overlap);
  const rowG = svg.append("g")
    .attr("transform", `translate(${margin.left},${yOff})`);

  // Background fill to mask overlap
  rowG.append("rect")
    .attr("x", -margin.left)
    .attr("width", width)
    .attr("height", rowHeight)
    .attr("fill", "var(--bg)")
    .attr("opacity", 0.7);

  // Baseline
  rowG.append("line")
    .attr("x1", 0).attr("x2", innerW)
    .attr("y1", rowHeight - 10).attr("y2", rowHeight - 10)
    .attr("stroke", "#ddd").attr("stroke-width", 0.5);

  // v1 ghost fill
  rowG.append("path")
    .datum(v1Densities[i])
    .attr("d", area)
    .attr("fill", "#999")
    .attr("fill-opacity", 0.2)
    .attr("stroke", "#999")
    .attr("stroke-width", 0.8)
    .attr("stroke-opacity", 0.4);

  // v2 solid fill
  rowG.append("path")
    .datum(v2Densities[i])
    .attr("d", area)
    .attr("fill", agentColors[i])
    .attr("fill-opacity", 0.45)
    .attr("stroke", agentColors[i])
    .attr("stroke-width", 1.5);

  // Agent label
  rowG.append("text")
    .attr("x", -12)
    .attr("y", rowHeight / 2 + 2)
    .attr("text-anchor", "end")
    .attr("font-size", "13px")
    .attr("font-weight", "600")
    .attr("fill", "#333")
    .text(agent);

  // Median markers
  const v1Med = d3.median(v1Scores[i]);
  const v2Med = d3.median(v2Scores[i]);

  // v1 median
  rowG.append("line")
    .attr("x1", xScale(v1Med)).attr("x2", xScale(v1Med))
    .attr("y1", rowHeight - 10).attr("y2", rowHeight - 20)
    .attr("stroke", "#888").attr("stroke-width", 1.5)
    .attr("stroke-dasharray", "3,2");

  rowG.append("text")
    .attr("x", xScale(v1Med))
    .attr("y", rowHeight - 22)
    .attr("text-anchor", "middle")
    .attr("font-size", "9px")
    .attr("fill", "#888")
    .text(`v1: ${v1Med}`);

  // v2 median
  rowG.append("line")
    .attr("x1", xScale(v2Med)).attr("x2", xScale(v2Med))
    .attr("y1", rowHeight - 10).attr("y2", rowHeight - 34)
    .attr("stroke", agentColors[i]).attr("stroke-width", 1.5);

  rowG.append("text")
    .attr("x", xScale(v2Med))
    .attr("y", rowHeight - 36)
    .attr("text-anchor", "middle")
    .attr("font-size", "9px")
    .attr("font-weight", "600")
    .attr("fill", agentColors[i])
    .text(`v2: ${v2Med}`);
});

// Shared x-axis
const axisG = svg.append("g")
  .attr("transform", `translate(${margin.left},${totalH - margin.bottom + 5})`);

axisG.call(d3.axisBottom(xScale).ticks(9).tickSize(4))
  .select(".domain").attr("stroke", "#aaa");

axisG.selectAll(".tick text").attr("font-size", "11px").attr("fill", "#666");

axisG.append("text")
  .attr("x", innerW / 2)
  .attr("y", 30)
  .attr("text-anchor", "middle")
  .attr("font-size", "12px")
  .attr("fill", "#666")
  .text("Score");
</script>
</body>
</html>
