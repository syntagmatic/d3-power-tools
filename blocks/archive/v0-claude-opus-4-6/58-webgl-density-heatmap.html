<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGL Density Heatmap</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; }
  #container { position: relative; width: 1200px; height: 800px; margin: 0 auto; }
  canvas#glCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  svg#overlay { position: absolute; top: 0; left: 0; }
  #badge { position: absolute; top: 12px; right: 80px; background: rgba(30,30,60,0.85);
    padding: 6px 14px; border-radius: 4px; font-size: 13px; color: #aab; z-index: 10; }
</style>
</head>
<body>
<div id="container">
  <canvas id="glCanvas"></canvas>
  <svg id="overlay"></svg>
  <div id="badge">Density view</div>
</div>
<script>
(() => {
  const W = 1200, H = 800;
  const margin = { top: 40, right: 60, bottom: 50, left: 60 };
  const width = W - margin.left - margin.right;
  const height = H - margin.top - margin.bottom;
  const dpr = window.devicePixelRatio || 1;
  const N = 500000;

  // Seeded RNG
  const mulberry32 = (a) => () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rng = mulberry32(42);
  const randn = () => {
    let u; do { u = rng(); } while (u === 0);
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng());
  };

  const clusters = [
    { cx: 0.25, cy: 0.3, sx: 0.08, sy: 0.06, n: Math.floor(N * 0.35) },
    { cx: 0.7, cy: 0.65, sx: 0.1, sy: 0.08, n: Math.floor(N * 0.3) },
    { cx: 0.5, cy: 0.2, sx: 0.06, sy: 0.12, n: Math.floor(N * 0.2) },
    { cx: 0.3, cy: 0.75, sx: 0.07, sy: 0.05, n: N - Math.floor(N * 0.85) },
  ];

  const positions = new Float32Array(N * 2);
  const clusterIds = new Uint8Array(N);
  let idx = 0;
  clusters.forEach((c, ci) => {
    for (let i = 0; i < c.n; i++) {
      positions[idx * 2] = c.cx + randn() * c.sx;
      positions[idx * 2 + 1] = c.cy + randn() * c.sy;
      clusterIds[idx] = ci;
      idx++;
    }
  });

  // Tol bright RGBA
  const tolBright = [
    [0.267, 0.467, 0.667, 0.7],
    [0.933, 0.4, 0.467, 0.7],
    [0.133, 0.667, 0.533, 0.7],
    [0.933, 0.733, 0.2, 0.7]
  ];

  // D3 scales
  const xScale = d3.scaleLinear().domain([0, 1]).range([margin.left, margin.left + width]);
  const yScale = d3.scaleLinear().domain([0, 1]).range([margin.top, margin.top + height]);

  // --- CPU density heatmap for initial render + WebGL points for zoom ---
  // Compute density on a grid via CPU, upload as texture, render as fullscreen quad
  const gridSize = 256;
  const grid = new Float32Array(gridSize * gridSize);

  // Bin all points into grid
  for (let i = 0; i < N; i++) {
    const gx = Math.floor(positions[i * 2] * (gridSize - 1));
    const gy = Math.floor(positions[i * 2 + 1] * (gridSize - 1));
    if (gx >= 0 && gx < gridSize && gy >= 0 && gy < gridSize) {
      grid[gy * gridSize + gx] += 1;
    }
  }

  // Gaussian blur the grid (simple 5x5 kernel)
  const blurred = new Float32Array(gridSize * gridSize);
  const kernel = [1, 4, 6, 4, 1];
  const ksum = 256; // 16*16
  // Horizontal pass
  const temp = new Float32Array(gridSize * gridSize);
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      let sum = 0;
      for (let k = -2; k <= 2; k++) {
        const xi = Math.min(Math.max(x + k, 0), gridSize - 1);
        sum += grid[y * gridSize + xi] * kernel[k + 2];
      }
      temp[y * gridSize + x] = sum;
    }
  }
  // Vertical pass
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      let sum = 0;
      for (let k = -2; k <= 2; k++) {
        const yi = Math.min(Math.max(y + k, 0), gridSize - 1);
        sum += temp[yi * gridSize + x] * kernel[k + 2];
      }
      blurred[y * gridSize + x] = sum / ksum;
    }
  }

  // Find max for normalization
  let maxVal = 0;
  for (let i = 0; i < blurred.length; i++) if (blurred[i] > maxVal) maxVal = blurred[i];

  // Create RGBA texture data with color ramp
  const rampColors = [
    [10,10,30], [20,30,90], [30,80,160], [40,150,190],
    [80,210,180], [180,225,100], [245,235,80], [255,255,255]
  ];
  const colorRamp = (t) => {
    const s = Math.min(t, 1) * (rampColors.length - 1);
    const lo = Math.floor(s), hi = Math.min(lo + 1, rampColors.length - 1);
    const f = s - lo;
    return [
      rampColors[lo][0] * (1 - f) + rampColors[hi][0] * f,
      rampColors[lo][1] * (1 - f) + rampColors[hi][1] * f,
      rampColors[lo][2] * (1 - f) + rampColors[hi][2] * f
    ];
  };

  const texData = new Uint8Array(gridSize * gridSize * 4);
  for (let i = 0; i < gridSize * gridSize; i++) {
    const t = Math.pow(blurred[i] / maxVal, 0.5); // sqrt for perceptual scaling
    if (t < 0.01) {
      texData[i * 4] = 26; texData[i * 4 + 1] = 26; texData[i * 4 + 2] = 46; texData[i * 4 + 3] = 255;
    } else {
      const c = colorRamp(t);
      texData[i * 4] = c[0]; texData[i * 4 + 1] = c[1]; texData[i * 4 + 2] = c[2]; texData[i * 4 + 3] = 255;
    }
  }

  // --- WebGL setup ---
  const canvas = document.getElementById('glCanvas');
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  const gl = canvas.getContext('webgl2', { antialias: true, premultipliedAlpha: false, alpha: true });
  if (!gl) { document.body.innerHTML = '<p>WebGL2 not supported</p>'; return; }
  gl.viewport(0, 0, W * dpr, H * dpr);

  const mkShader = (src, type) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  };
  const mkProgram = (vSrc, fSrc) => {
    const p = gl.createProgram();
    gl.attachShader(p, mkShader(vSrc, gl.VERTEX_SHADER));
    gl.attachShader(p, mkShader(fSrc, gl.FRAGMENT_SHADER));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    return p;
  };

  // --- Heatmap quad shader ---
  const heatProg = mkProgram(
`#version 300 es
in vec2 a_position;
uniform vec4 u_rect;
uniform vec2 u_resolution;
out vec2 v_uv;
void main() {
  vec2 pos = u_rect.xy + a_position * u_rect.zw;
  vec2 clip = (pos / u_resolution) * 2.0 - 1.0;
  clip.y = -clip.y;
  gl_Position = vec4(clip, 0.0, 1.0);
  v_uv = a_position;
}`,
`#version 300 es
precision mediump float;
uniform sampler2D u_tex;
in vec2 v_uv;
out vec4 fragColor;
void main() {
  fragColor = texture(u_tex, v_uv);
}`
  );

  // --- Points shader ---
  const pointsProg = mkProgram(
`#version 300 es
in vec2 a_position;
in vec4 a_color;
uniform vec2 u_resolution;
uniform vec2 u_translate;
uniform float u_scale;
uniform float u_dpr;
out vec4 v_color;
void main() {
  vec2 pos = a_position * u_scale + u_translate;
  vec2 clip = (pos / u_resolution) * 2.0 - 1.0;
  clip.y = -clip.y;
  gl_Position = vec4(clip, 0.0, 1.0);
  gl_PointSize = 3.0 * u_dpr;
  v_color = a_color;
}`,
`#version 300 es
precision mediump float;
in vec4 v_color;
out vec4 fragColor;
void main() {
  float dist = length(gl_PointCoord - 0.5);
  if (dist > 0.5) discard;
  fragColor = vec4(v_color.rgb, v_color.a * (1.0 - smoothstep(0.35, 0.5, dist)));
}`
  );

  // --- Pixel positions ---
  const pixelPos = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) {
    pixelPos[i * 2] = xScale(positions[i * 2]);
    pixelPos[i * 2 + 1] = yScale(positions[i * 2 + 1]);
  }

  const colorDataArr = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const c = tolBright[clusterIds[i]];
    colorDataArr[i * 4] = c[0]; colorDataArr[i * 4 + 1] = c[1];
    colorDataArr[i * 4 + 2] = c[2]; colorDataArr[i * 4 + 3] = c[3];
  }

  // Upload buffers
  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, pixelPos, gl.STATIC_DRAW);

  const colBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.bufferData(gl.ARRAY_BUFFER, colorDataArr, gl.STATIC_DRAW);

  // Unit quad [0,1]x[0,1]
  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]), gl.STATIC_DRAW);

  // Heatmap texture
  const heatTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, heatTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gridSize, gridSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, texData);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  // --- VAOs ---
  const heatVAO = gl.createVertexArray();
  gl.bindVertexArray(heatVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  const hpLoc = gl.getAttribLocation(heatProg, 'a_position');
  gl.enableVertexAttribArray(hpLoc);
  gl.vertexAttribPointer(hpLoc, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  const pointsVAO = gl.createVertexArray();
  gl.bindVertexArray(pointsVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  const ppLoc = gl.getAttribLocation(pointsProg, 'a_position');
  gl.enableVertexAttribArray(ppLoc);
  gl.vertexAttribPointer(ppLoc, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  const pcLoc = gl.getAttribLocation(pointsProg, 'a_color');
  gl.enableVertexAttribArray(pcLoc);
  gl.vertexAttribPointer(pcLoc, 4, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  // --- SVG overlay ---
  const svg = d3.select('#overlay').attr('width', W).attr('height', H).style('pointer-events', 'all');
  const xAxis = d3.axisBottom(xScale).ticks(10);
  const yAxis = d3.axisLeft(yScale).ticks(10);
  const gx = svg.append('g').attr('transform', `translate(0,${margin.top + height})`).call(xAxis);
  const gy = svg.append('g').attr('transform', `translate(${margin.left},0)`).call(yAxis);

  const styleAxes = () => {
    svg.selectAll('.tick text').attr('fill', '#aab');
    svg.selectAll('.tick line').attr('stroke', '#556');
    svg.selectAll('.domain').attr('stroke', '#556');
  };
  styleAxes();

  svg.append('text').attr('x', W / 2).attr('y', H - 6).attr('text-anchor', 'middle')
    .attr('fill', '#aab').attr('font-size', 13).text('Feature 1');
  svg.append('text').attr('transform', 'rotate(-90)').attr('x', -H / 2).attr('y', 14)
    .attr('text-anchor', 'middle').attr('fill', '#aab').attr('font-size', 13).text('Feature 2');
  svg.append('text').attr('x', W / 2).attr('y', 24).attr('text-anchor', 'middle')
    .attr('fill', '#dde').attr('font-size', 16).attr('font-weight', 600)
    .text('WebGL Density Heatmap \u2014 500K Points with Semantic Zoom');

  // Zoom target
  svg.append('rect').attr('x', margin.left).attr('y', margin.top)
    .attr('width', width).attr('height', height)
    .attr('fill', 'none').attr('pointer-events', 'all');

  // Legend
  const legG = svg.append('g').attr('transform', `translate(${W - 270}, ${H - 70})`);
  const defs = svg.append('defs');
  const grad = defs.append('linearGradient').attr('id', 'rampGrad');
  [[0,'#0a0a1f'],[0.14,'#141e5a'],[0.28,'#1e50a0'],[0.42,'#2896be'],
   [0.57,'#50d2b4'],[0.71,'#b4e164'],[0.85,'#f5eb50'],[1,'#ffffff']]
    .forEach(([o,c]) => grad.append('stop').attr('offset', o).attr('stop-color', c));
  legG.append('rect').attr('width', 200).attr('height', 14).attr('rx', 2).attr('fill', 'url(#rampGrad)');
  legG.append('text').attr('y', -4).attr('fill', '#aab').attr('font-size', 10).text('Low');
  legG.append('text').attr('x', 200).attr('y', -4).attr('fill', '#aab').attr('font-size', 10)
    .attr('text-anchor', 'end').text('High');
  legG.append('text').attr('x', 100).attr('y', -4).attr('fill', '#aab').attr('font-size', 10)
    .attr('text-anchor', 'middle').text('Density');

  // --- LOD ---
  let currentMode = 'density';
  const badge = document.getElementById('badge');

  const drawHeatmap = (transform) => {
    gl.clearColor(0.102, 0.102, 0.18, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(heatProg);
    gl.bindVertexArray(heatVAO);

    // Compute the quad rect in pixel coords, accounting for zoom
    const rx = margin.left * transform.k + transform.x;
    const ry = margin.top * transform.k + transform.y;
    const rw = width * transform.k;
    const rh = height * transform.k;

    gl.uniform4f(gl.getUniformLocation(heatProg, 'u_rect'), rx, ry, rw, rh);
    gl.uniform2f(gl.getUniformLocation(heatProg, 'u_resolution'), W, H);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, heatTex);
    gl.uniform1i(gl.getUniformLocation(heatProg, 'u_tex'), 0);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };

  const drawPoints = (transform) => {
    gl.clearColor(0.102, 0.102, 0.18, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(pointsProg);
    gl.bindVertexArray(pointsVAO);
    gl.uniform2f(gl.getUniformLocation(pointsProg, 'u_resolution'), W, H);
    gl.uniform2f(gl.getUniformLocation(pointsProg, 'u_translate'), transform.x, transform.y);
    gl.uniform1f(gl.getUniformLocation(pointsProg, 'u_scale'), transform.k);
    gl.uniform1f(gl.getUniformLocation(pointsProg, 'u_dpr'), dpr);
    gl.drawArrays(gl.POINTS, 0, N);
    gl.disable(gl.BLEND);
  };

  const draw = (transform) => {
    const k = transform.k;
    if (currentMode === 'density' && k >= 4) currentMode = 'points';
    else if (currentMode === 'points' && k < 2) currentMode = 'density';

    if (currentMode === 'density') {
      drawHeatmap(transform);
      badge.textContent = `Density view \u2014 ${k.toFixed(1)}x`;
    } else {
      drawPoints(transform);
      badge.textContent = `Point view \u2014 ${k.toFixed(1)}x`;
    }

    const zx = transform.rescaleX(xScale);
    const zy = transform.rescaleY(yScale);
    gx.call(xAxis.scale(zx));
    gy.call(yAxis.scale(zy));
    styleAxes();
  };

  svg.call(d3.zoom().scaleExtent([1, 200]).on('zoom', ({ transform }) => draw(transform)));
  draw(d3.zoomIdentity);

})();
</script>
</body>
</html>
