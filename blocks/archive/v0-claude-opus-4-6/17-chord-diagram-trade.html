<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Global Trade Flows — Chord Diagram</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #fafafa;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  #chart { position: relative; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.5;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .tooltip.visible { opacity: 1; }
</style>
</head>
<body>
<div id="chart">
  <div class="tooltip" id="tooltip"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Data ---
const countries = [
  "USA", "China", "Germany", "Japan", "UK",
  "France", "S. Korea", "India", "Canada", "Mexico"
];

// Asymmetric trade matrix (billions USD). Row = exporter, Col = importer.
// Roughly realistic magnitudes based on recent trade data.
const matrix = [
  //  USA  CHN  DEU  JPN   UK  FRA  KOR  IND  CAN  MEX
  [   0,  150, 65,  75,  70,  40,  55,  35, 310, 275], // USA exports
  [ 540,   0, 110,  140, 70,  50,  160, 90,  45,  50], // China exports
  [ 135, 105,   0,   25, 95,  110, 20,  15,  12,  18], // Germany exports
  [ 140, 165,  22,   0,  15,  10,  50,  12,  12,  15], // Japan exports
  [  60,  30,  50,   12,  0,   45, 10,  12,   8,   5], // UK exports
  [  40,  25,  80,   10, 40,   0,  10,   8,   6,   5], // France exports
  [  80, 160,  12,   30, 10,   8,   0,  15,   8,   7], // S. Korea exports
  [  60,  20,  12,    6, 12,   6,   8,   0,   5,   4], // India exports
  [ 380,  25,   8,   10,  8,   4,   5,   4,   0,   6], // Canada exports
  [ 400,  10,  10,    5,  3,   3,   4,   3,  10,   0], // Mexico exports
];

// --- Layout ---
const width = 700, height = 700;
const outerRadius = 550 / 2;
const innerRadius = outerRadius - 24;

// Tol bright (7) + 3 from muted to reach 10
const colors = [
  "#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE",
  "#AA3377", "#CC6677", "#117733", "#88CCEE", "#882255"
];
const color = (i) => colors[i];

const chord = d3.chord()
    .padAngle(0.04)
    .sortSubgroups(d3.descending);

const arc = d3.arc()
    .innerRadius(innerRadius)
    .outerRadius(outerRadius);

const ribbon = d3.ribbon()
    .radius(innerRadius);

const chords = chord(matrix);

// --- SVG ---
const svg = d3.select("#chart").append("svg")
    .attr("width", width)
    .attr("height", height)
  .append("g")
    .attr("transform", `translate(${width / 2},${height / 2})`);

const tooltip = d3.select("#tooltip");

// Helper: format billions
const fmt = v => `$${(v).toFixed(1)}B`;

// --- Draw arcs ---
const groupG = svg.append("g")
    .attr("class", "groups")
  .selectAll("g")
  .data(chords.groups)
  .join("g");

const arcPaths = groupG.append("path")
    .attr("d", d => {
      // Start from zero angle for animation
      const zeroArc = { ...d, startAngle: d.startAngle, endAngle: d.startAngle };
      return arc(zeroArc);
    })
    .attr("fill", d => color(d.index))
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.5);

// Animate arcs: grow from zero angle
arcPaths.transition()
    .duration(400)
    .ease(d3.easeCubicOut)
    .attrTween("d", function(d) {
      const i = d3.interpolate(
        { ...d, endAngle: d.startAngle },
        d
      );
      return t => arc(i(t));
    });

// --- Tick marks ---
const ticks = groupG.append("g")
    .attr("opacity", 0)
  .selectAll("g")
  .data(d => groupTicks(d, 100))
  .join("g")
    .attr("transform", d => `rotate(${d.angle * 180 / Math.PI - 90}) translate(${outerRadius},0)`);

ticks.append("line")
    .attr("x2", 5)
    .attr("stroke", "#333");

ticks.filter(d => d.value % 500 === 0)
  .append("text")
    .attr("x", 8)
    .attr("dy", "0.35em")
    .attr("transform", d => d.angle > Math.PI ? "rotate(180) translate(-16)" : null)
    .attr("text-anchor", d => d.angle > Math.PI ? "end" : null)
    .attr("font-size", 10)
    .attr("fill", "#555")
    .text(d => `${d.value}`);

// Fade in ticks after arcs
groupG.selectAll("g")
  .transition()
    .delay(400)
    .duration(300)
    .attr("opacity", 1);

// --- Arc labels ---
const labels = groupG.append("text")
    .each(d => { d.angle2 = (d.startAngle + d.endAngle) / 2; })
    .attr("dy", "0.35em")
    .attr("font-size", 12)
    .attr("font-weight", 600)
    .attr("fill", "#333")
    .attr("text-anchor", d => d.angle2 > Math.PI ? "end" : null)
    .attr("transform", d =>
      `rotate(${d.angle2 * 180 / Math.PI - 90})` +
      `translate(${outerRadius + 22})` +
      (d.angle2 > Math.PI ? "rotate(180)" : "")
    )
    .attr("opacity", 0)
    .text(d => countries[d.index]);

labels.transition()
    .delay(300)
    .duration(300)
    .attr("opacity", 1);

// --- Draw chords ---
const chordPaths = svg.append("g")
    .attr("class", "chords")
    .attr("fill-opacity", 0.5)
  .selectAll("path")
  .data(chords)
  .join("path")
    .attr("d", d => {
      // Start from zero-width chords
      const zero = {
        source: { ...d.source, startAngle: d.source.startAngle, endAngle: d.source.startAngle },
        target: { ...d.target, startAngle: d.target.startAngle, endAngle: d.target.startAngle }
      };
      return ribbon(zero);
    })
    .attr("fill", d => {
      // Color by larger exporter
      return matrix[d.source.index][d.target.index] >= matrix[d.target.index][d.source.index]
        ? color(d.source.index)
        : color(d.target.index);
    })
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.3);

// Animate chords: grow after arcs (400ms delay)
chordPaths.transition()
    .delay(400)
    .duration(800)
    .ease(d3.easeCubicOut)
    .attrTween("d", function(d) {
      const sourceI = d3.interpolate(
        { ...d.source, endAngle: d.source.startAngle },
        d.source
      );
      const targetI = d3.interpolate(
        { ...d.target, endAngle: d.target.startAngle },
        d.target
      );
      return t => ribbon({ source: sourceI(t), target: targetI(t) });
    });

// --- Hover: arcs ---
groupG
    .on("pointerenter", function(event, d) {
      // Fade unrelated chords
      chordPaths.interrupt().transition().duration(200)
          .attr("fill-opacity", c =>
            c.source.index === d.index || c.target.index === d.index ? 0.5 : 0.05
          );

      // Compute exports/imports
      const exports = d3.sum(matrix[d.index]);
      const imports = d3.sum(matrix.map(row => row[d.index]));
      tooltip.classed("visible", true)
          .html(`<strong>${countries[d.index]}</strong><br>${fmt(exports)} exports, ${fmt(imports)} imports<br>${fmt(exports + imports)} total trade`);
      positionTooltip(event);
    })
    .on("pointermove", positionTooltip)
    .on("pointerleave", resetHover);

// --- Hover: chords ---
chordPaths
    .on("pointerenter", function(event, d) {
      chordPaths.interrupt().transition().duration(200)
          .attr("fill-opacity", c => c === d ? 0.7 : 0.05);

      const a = countries[d.source.index];
      const b = countries[d.target.index];
      const ab = matrix[d.source.index][d.target.index];
      const ba = matrix[d.target.index][d.source.index];
      tooltip.classed("visible", true)
          .html(`<strong>${a} → ${b}</strong>: ${fmt(ab)}<br><strong>${b} → ${a}</strong>: ${fmt(ba)}`);
      positionTooltip(event);
    })
    .on("pointermove", positionTooltip)
    .on("pointerleave", resetHover);

function resetHover() {
  chordPaths.interrupt().transition().duration(300)
      .attr("fill-opacity", 0.5);
  tooltip.classed("visible", false);
}

function positionTooltip(event) {
  const chartRect = d3.select("#chart").node().getBoundingClientRect();
  tooltip
      .style("left", (event.clientX - chartRect.left + 12) + "px")
      .style("top", (event.clientY - chartRect.top - 28) + "px");
}

// --- Tick helper ---
function groupTicks(d, step) {
  const k = (d.endAngle - d.startAngle) / d.value;
  return d3.range(0, d.value, step).map(value => ({
    value,
    angle: value * k + d.startAngle
  }));
}
</script>
</body>
</html>
