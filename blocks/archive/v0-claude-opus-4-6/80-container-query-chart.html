<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Container Query Chart</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fafafa; color: #333; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 16px; font-weight: 600; }
  .grid {
    display: grid;
    grid-template-columns: 800px 500px 350px;
    gap: 16px;
    margin-bottom: 16px;
  }
  .grid2 {
    display: grid;
    grid-template-columns: 200px 120px 80px;
    gap: 16px;
  }
  .chart-wrapper {
    container-type: inline-size;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    position: relative;
    overflow: hidden;
    padding: 10px;
  }
  .size-label {
    position: absolute; top: 4px; right: 8px;
    font-size: 10px; color: #999; z-index: 2;
  }
  /* Container query CSS adaptations */
  @container (max-width: 299px) {
    .legend, .axis-label, .annotation { display: none !important; }
  }
  @container (max-width: 149px) {
    .chart-svg { display: none !important; }
    .kpi { display: flex !important; }
  }
  @container (min-width: 150px) {
    .kpi { display: none !important; }
  }
  .kpi {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80px;
    font-weight: 700;
  }
  .kpi .value { font-size: 22px; color: #4477AA; }
  .kpi .label { font-size: 10px; color: #777; margin-top: 2px; }
  .kpi .delta { font-size: 12px; margin-top: 2px; }
  .delta.up { color: #228833; }
  .delta.down { color: #EE6677; }
</style>
</head>
<body>
<h1>Container Query Chart — Same Data at 6 Sizes</h1>
<div class="grid" id="row1"></div>
<div class="grid2" id="row2"></div>
<script>
(() => {
  const TOL = ["#4477AA","#EE6677","#228833","#CCBB44"];
  const cats = ["Engineering","Sales","Marketing","Support"];
  const rng = d3.randomLcg(7);
  const randN = d3.randomNormal.source(rng);

  // 50 records
  const data = d3.range(50).map(i => {
    const catIdx = Math.floor(rng() * 4);
    return {
      id: i,
      x: 20 + rng() * 50,
      y: 20000 + rng() * 130000,
      category: cats[catIdx],
      catIdx,
      label: `P${i}`
    };
  });

  const meanIncome = d3.mean(data, d => d.y);
  const medianIncome = d3.median(data, d => d.y);
  // Trend line
  const xMean = d3.mean(data, d => d.x);
  const yMean = d3.mean(data, d => d.y);
  const slope = d3.sum(data, d => (d.x - xMean) * (d.y - yMean)) / d3.sum(data, d => (d.x - xMean) ** 2);
  const intercept = yMean - slope * xMean;

  const sizes = [800, 500, 350, 200, 120, 80];

  const containers = [];
  sizes.forEach((w, i) => {
    const parent = i < 3 ? document.getElementById("row1") : document.getElementById("row2");
    const wrapper = document.createElement("div");
    wrapper.className = "chart-wrapper";
    wrapper.innerHTML = `<span class="size-label">${w}px</span>
      <div class="kpi">
        <span class="value">$${Math.round(meanIncome / 1000)}k</span>
        <span class="label">Mean Income</span>
        <span class="delta ${slope > 0 ? 'up' : 'down'}">${slope > 0 ? '\u25B2' : '\u25BC'} with age</span>
      </div>`;
    parent.appendChild(wrapper);
    containers.push(wrapper);
  });

  const renderChart = (container) => {
    const rect = container.getBoundingClientRect();
    const cw = rect.width - 20; // padding
    const ch = Math.min(cw * 0.6, 300);

    // Remove old SVG
    d3.select(container).selectAll("svg").remove();

    if (cw < 150) return; // KPI mode via CSS

    const isSparkline = cw < 300;
    const isMedium = cw >= 300 && cw < 600;
    const isFull = cw >= 600;

    const m = isSparkline
      ? { top: 4, right: 4, bottom: 4, left: 4 }
      : isMedium
        ? { top: 10, right: 10, bottom: 28, left: 44 }
        : { top: 14, right: 100, bottom: 36, left: 50 };

    const w = cw - m.left - m.right;
    const h = ch - m.top - m.bottom;
    if (w < 10 || h < 10) return;

    const svg = d3.select(container).append("svg")
      .attr("class", "chart-svg")
      .attr("width", cw)
      .attr("height", ch);

    const g = svg.append("g").attr("transform", `translate(${m.left},${m.top})`);

    const xScale = d3.scaleLinear().domain(d3.extent(data, d => d.x)).nice().range([0, w]);
    const yScale = d3.scaleLinear().domain(d3.extent(data, d => d.y)).nice().range([h, 0]);

    if (isSparkline) {
      // Dots only + trend line
      g.selectAll("circle")
        .data(data)
        .join("circle")
          .attr("cx", d => xScale(d.x))
          .attr("cy", d => yScale(d.y))
          .attr("r", 2)
          .attr("fill", d => TOL[d.catIdx])
          .attr("opacity", 0.7);

      const xExt = d3.extent(data, d => d.x);
      g.append("line")
        .attr("x1", xScale(xExt[0])).attr("y1", yScale(slope * xExt[0] + intercept))
        .attr("x2", xScale(xExt[1])).attr("y2", yScale(slope * xExt[1] + intercept))
        .attr("stroke", "#999").attr("stroke-width", 1.5).attr("stroke-dasharray", "4,3");
      return;
    }

    // Axes
    const xAxis = g.append("g").attr("transform", `translate(0,${h})`)
      .call(d3.axisBottom(xScale).ticks(Math.max(3, Math.floor(w / 80))));
    const yAxis = g.append("g")
      .call(d3.axisLeft(yScale).ticks(Math.max(3, Math.floor(h / 50)), "~s"));

    if (isFull) {
      // Axis labels
      g.append("text").attr("class", "axis-label")
        .attr("x", w / 2).attr("y", h + 32).attr("text-anchor", "middle")
        .attr("font-size", 12).attr("fill", "#555").text("Age");
      g.append("text").attr("class", "axis-label")
        .attr("transform", "rotate(-90)").attr("x", -h / 2).attr("y", -38)
        .attr("text-anchor", "middle").attr("font-size", 12).attr("fill", "#555").text("Income ($)");
    }

    // Dots
    g.selectAll("circle")
      .data(data)
      .join("circle")
        .attr("cx", d => xScale(d.x))
        .attr("cy", d => yScale(d.y))
        .attr("r", isFull ? 4 : 3)
        .attr("fill", d => TOL[d.catIdx])
        .attr("opacity", 0.7);

    // Trend line
    const xExt = d3.extent(data, d => d.x);
    g.append("line")
      .attr("x1", xScale(xExt[0])).attr("y1", yScale(slope * xExt[0] + intercept))
      .attr("x2", xScale(xExt[1])).attr("y2", yScale(slope * xExt[1] + intercept))
      .attr("stroke", "#999").attr("stroke-width", 1.5).attr("stroke-dasharray", "4,3");

    // Legend (full and medium)
    if (isFull) {
      const legend = svg.append("g").attr("class", "legend")
        .attr("transform", `translate(${cw - 90}, ${m.top + 10})`);
      cats.forEach((c, i) => {
        const row = legend.append("g").attr("transform", `translate(0,${i * 18})`);
        row.append("circle").attr("r", 4).attr("cx", 0).attr("cy", 0).attr("fill", TOL[i]);
        row.append("text").attr("x", 10).attr("y", 4).text(c).attr("font-size", 11).attr("fill", "#555");
      });
      // Annotation for highest earner
      const top = data.reduce((a, b) => a.y > b.y ? a : b);
      g.append("text").attr("class", "annotation")
        .attr("x", xScale(top.x) + 8).attr("y", yScale(top.y) - 8)
        .attr("font-size", 10).attr("fill", "#555").text(`Top: $${d3.format(",.0f")(top.y)}`);
    }
    if (isMedium) {
      const legend = svg.append("g").attr("class", "legend")
        .attr("transform", `translate(${m.left}, ${ch - 6})`);
      cats.forEach((c, i) => {
        const xOff = i * (w / 4);
        legend.append("circle").attr("r", 3).attr("cx", xOff).attr("cy", 0).attr("fill", TOL[i]);
        legend.append("text").attr("x", xOff + 7).attr("y", 3).text(c).attr("font-size", 9).attr("fill", "#777");
      });
    }
  };

  // Initial render + ResizeObserver
  containers.forEach(c => {
    renderChart(c);
    const ro = new ResizeObserver(() => renderChart(c));
    ro.observe(c);
  });
})();
</script>
</body>
</html>
