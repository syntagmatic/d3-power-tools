<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parallel Coords + Sparkline Table</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #333; padding: 16px 20px; }
  h2 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  #status { font-size: 12px; color: #888; margin-bottom: 10px; }
  #status b { color: #333; }
  #pc-container { position: relative; margin-bottom: 16px; }
  #pc-container canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  #pc-container > svg { position: absolute; top: 0; left: 0; }
  .axis text { font-size: 10px; fill: #666; }
  .axis .domain, .axis line { stroke: #ccc; }
  .axis-label { font-size: 11px; font-weight: 600; fill: #333; text-anchor: middle; cursor: pointer; }
  .axis-label:hover { fill: #4477AA; }
  .brush .selection { fill: #4477AA; fill-opacity: 0.2; stroke: #4477AA; stroke-width: 1; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid #eee; }
  th { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; color: #999; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 11px; }
  td.spark { white-space: nowrap; line-height: 0; padding: 3px 6px; }
  td.spark svg { display: block; }
  .region-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; font-size: 11px; color: #666; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<h2>City Metrics Explorer</h2>
<div id="status">Showing <b id="count">150</b> of 150 cities</div>
<div class="legend" id="legend"></div>
<div id="pc-container"></div>
<table id="summary"><thead><tr><th>Axis</th><th>Distribution</th><th class="num">Min</th><th class="num">Median</th><th class="num">Max</th></tr></thead><tbody></tbody></table>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

// ── Data ────────────────────────────────────────────────────────────
const regions = ["Northeast", "Southeast", "Midwest", "Southwest", "West Coast", "Mountain"];
const tolBright = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377"];
const regionColor = Object.fromEntries(regions.map((r, i) => [r, tolBright[i]]));

function generate() {
  const cities = [];
  const cityNames = [
    "New York","Boston","Philadelphia","Hartford","Portland ME","Baltimore","Providence","Newark",
    "Atlanta","Miami","Charlotte","Nashville","Tampa","Orlando","Richmond","Savannah","Jacksonville","Raleigh",
    "Chicago","Detroit","Minneapolis","Milwaukee","Columbus","Indianapolis","Cleveland","St Louis","Cincinnati","Kansas City",
    "Phoenix","Dallas","Houston","San Antonio","Austin","Denver","Tucson","El Paso","Albuquerque","Las Vegas","Oklahoma City",
    "Los Angeles","San Francisco","Seattle","San Diego","Sacramento","Portland OR","San Jose",
    "Salt Lake City","Boise","Reno","Helena","Billings","Cheyenne","Missoula","Rapid City","Flagstaff","Durango","Idaho Falls","Provo","Logan","Ogden","Casper","Great Falls","Butte","Pocatello","Twin Falls","Bozeman","Kalispell","Whitefish","Jackson","Cody","Laramie","Rock Springs","Sheridan","Gillette","Riverton","Thermopolis","Evanston","Lander","Powell","Worland","Rawlins","Douglas","Torrington","Buffalo","Newcastle","Sundance","Moorcroft","Upton","Pine Bluffs","Guernsey","Glenrock","Mills","Bar Nunn","Edgerton","Midwest WY","Kaycee","Ten Sleep","Meeteetse","Greybull","Lovell","Byron","Cowley","Deaver","Frannie","Ralston","Burlington","Basin","Manderson","Hyattville","Shell","Emblem","Otto","Garland","Clark","Wapiti","Valley","Painter","Cooke City","Silver Gate","Gardiner","Emigrant","Pray","Livingston","Big Timber","Columbus MT","Laurel","Red Lodge","Joliet","Fromberg","Bridger","Roberts","Belfry","Warren","Edgar"
  ];
  for (let i = 0; i < 150; i++) {
    const region = regions[i < 8 ? 0 : i < 18 ? 1 : i < 28 ? 2 : i < 39 ? 3 : i < 46 ? 4 : 5];
    const isCoast = region === "West Coast" || region === "Northeast";
    const isMountain = region === "Mountain" || region === "Southwest";
    const elevation = isMountain ? 3000 + Math.random() * 5000 : isCoast ? 10 + Math.random() * 500 : 200 + Math.random() * 2000;
    const baseTemp = isMountain ? 45 - elevation * 0.003 : region === "Southeast" ? 68 + Math.random() * 10 : region === "Southwest" ? 72 + Math.random() * 8 : isCoast ? 52 + Math.random() * 12 : 48 + Math.random() * 10;
    const avgTemp = Math.max(30, Math.min(90, baseTemp + (Math.random() - 0.5) * 8));
    const rainfall = region === "Southwest" || region === "Mountain" ? 5 + Math.random() * 20 : region === "Southeast" ? 40 + Math.random() * 40 : 25 + Math.random() * 35;
    const pop = Math.round(Math.pow(10, 4 + Math.random() * 3) * (isCoast ? 2 : 1));
    const density = Math.round(pop / (10 + Math.random() * 200));
    const gdp = Math.round(20000 + Math.random() * 50000 + (isCoast ? 15000 : 0));
    cities.push({
      city: cityNames[i] || `City ${i}`,
      region, population: pop, avg_temp: Math.round(avgTemp * 10) / 10,
      elevation: Math.round(elevation), rainfall: Math.round(rainfall * 10) / 10,
      gdp_per_capita: gdp, density: Math.max(50, density)
    });
  }
  return cities;
}

const data = generate();
const dimensions = ["population", "avg_temp", "elevation", "rainfall", "gdp_per_capita", "density"];
const dimLabels = { population: "Population", avg_temp: "Avg Temp (°F)", elevation: "Elevation (ft)", rainfall: "Rainfall (in)", gdp_per_capita: "GDP/Cap ($)", density: "Density (/mi²)" };
const dimFormats = {
  population: d3.format(",.0f"), avg_temp: d => d.toFixed(1) + "°",
  elevation: d3.format(",.0f"), rainfall: d => d.toFixed(1),
  gdp_per_capita: d3.format("$,.0f"), density: d3.format(",.0f")
};

// ── Legend ───────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
regions.forEach(r => {
  const item = document.createElement("span");
  item.className = "legend-item";
  item.innerHTML = `<span class="region-dot" style="background:${regionColor[r]}"></span>${r}`;
  legendEl.appendChild(item);
});

// ── Layout ──────────────────────────────────────────────────────────
const containerEl = document.getElementById("pc-container");
const fullWidth = Math.min(1160, window.innerWidth - 40);
const margin = { top: 28, right: 20, bottom: 8, left: 20 };
const width = fullWidth - margin.left - margin.right;
const height = 320;
const fullHeight = height + margin.top + margin.bottom;
containerEl.style.width = fullWidth + "px";
containerEl.style.height = fullHeight + "px";

// ── Canvas ──────────────────────────────────────────────────────────
const dpr = window.devicePixelRatio || 1;
const canvas = document.createElement("canvas");
canvas.width = fullWidth * dpr;
canvas.height = fullHeight * dpr;
canvas.style.width = fullWidth + "px";
canvas.style.height = fullHeight + "px";
containerEl.appendChild(canvas);
const ctx = canvas.getContext("2d");
ctx.scale(dpr, dpr);

// ── SVG ─────────────────────────────────────────────────────────────
const svg = d3.select(containerEl).append("svg")
  .attr("width", fullWidth).attr("height", fullHeight);
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// ── Scales ──────────────────────────────────────────────────────────
const xScale = d3.scalePoint().domain(dimensions).range([0, width]).padding(0.08);
const yScales = {};
dimensions.forEach(dim => {
  const ext = d3.extent(data, d => d[dim]);
  const pad = (ext[1] - ext[0]) * 0.05;
  yScales[dim] = d3.scaleLinear().domain([ext[0] - pad, ext[1] + pad]).range([height, 0]);
});

// ── Axes ────────────────────────────────────────────────────────────
dimensions.forEach(dim => {
  const x = xScale(dim);
  const axisG = g.append("g").attr("class", "axis").attr("transform", `translate(${x},0)`);
  const axis = d3.axisLeft(yScales[dim]).ticks(6).tickFormat(dimFormats[dim]);
  axisG.call(axis);
  axisG.append("text").attr("class", "axis-label").attr("y", -14).text(dimLabels[dim]);
});

// ── Brushes ─────────────────────────────────────────────────────────
const filters = {};
let activeIndices = data.map((_, i) => i);

function updateFilter() {
  activeIndices = data.map((_, i) => i).filter(i => {
    return dimensions.every(dim => {
      if (!filters[dim]) return true;
      const [y0, y1] = filters[dim];
      const val = yScales[dim](data[i][dim]);
      return val >= y0 && val <= y1;
    });
  });
  document.getElementById("count").textContent = activeIndices.length;
  renderCanvas();
  updateTable();
}

dimensions.forEach(dim => {
  const x = xScale(dim);
  const brush = d3.brushY()
    .extent([[-10, 0], [10, height]])
    .on("brush end", function(event) {
      if (event.selection) {
        filters[dim] = event.selection;
      } else {
        delete filters[dim];
      }
      updateFilter();
    });
  g.append("g").attr("class", "brush").attr("transform", `translate(${x},0)`).call(brush);
});

// ── Canvas rendering ────────────────────────────────────────────────
const activeSet = new Set();

function renderCanvas() {
  ctx.clearRect(0, 0, fullWidth, fullHeight);
  ctx.save();
  ctx.translate(margin.left, margin.top);

  activeSet.clear();
  activeIndices.forEach(i => activeSet.add(i));

  const hasFilter = Object.keys(filters).length > 0;
  // Background pass: all lines, very dim
  if (hasFilter) {
    ctx.globalAlpha = 0.04;
    ctx.lineWidth = 0.5;
    data.forEach((d, i) => {
      if (activeSet.has(i)) return;
      ctx.strokeStyle = regionColor[d.region];
      ctx.beginPath();
      dimensions.forEach((dim, j) => {
        const x = xScale(dim), y = yScales[dim](d[dim]);
        j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.stroke();
    });
  }

  // Foreground: active lines
  const alpha = Math.max(0.08, Math.min(0.7, 80 / activeIndices.length));
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 1.2;
  activeIndices.forEach(i => {
    const d = data[i];
    ctx.strokeStyle = regionColor[d.region];
    ctx.beginPath();
    dimensions.forEach((dim, j) => {
      const x = xScale(dim), y = yScales[dim](d[dim]);
      j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  });

  ctx.restore();
}

// ── Summary table with sparklines ───────────────────────────────────
const tbody = d3.select("#summary tbody");
const sparkW = 80, sparkH = 18;

function updateTable() {
  const subset = activeIndices.map(i => data[i]);
  const rows = dimensions.map(dim => {
    const vals = subset.map(d => d[dim]).sort(d3.ascending);
    return {
      dim, label: dimLabels[dim],
      values: vals,
      min: vals[0], median: d3.median(vals), max: vals[vals.length - 1]
    };
  });

  const tr = tbody.selectAll("tr").data(rows, d => d.dim);

  const enter = tr.enter().append("tr");
  enter.append("td").text(d => d.label);
  enter.append("td").attr("class", "spark");
  enter.append("td").attr("class", "num");
  enter.append("td").attr("class", "num");
  enter.append("td").attr("class", "num");

  const merged = enter.merge(tr);
  merged.select("td:nth-child(3)").text(d => dimFormats[d.dim](d.min));
  merged.select("td:nth-child(4)").text(d => dimFormats[d.dim](d.median));
  merged.select("td:nth-child(5)").text(d => dimFormats[d.dim](d.max));

  // Sparkline: mini density area chart
  merged.select("td.spark").each(function(d) {
    d3.select(this).selectAll("svg").remove();
    if (d.values.length === 0) return;
    const svg = d3.select(this).append("svg").attr("width", sparkW).attr("height", sparkH)
      .attr("role", "img").attr("aria-label", `Distribution of ${d.label}`);
    const ext = d3.extent(d.values);
    if (ext[0] === ext[1]) { ext[0] -= 1; ext[1] += 1; }
    const nBins = 20;
    const bins = d3.bin().domain(ext).thresholds(nBins)(d.values);
    const xS = d3.scaleLinear().domain(ext).range([1, sparkW - 1]);
    const yS = d3.scaleLinear().domain([0, d3.max(bins, b => b.length)]).range([sparkH - 1, 1]);
    const area = d3.area()
      .x(b => xS((b.x0 + b.x1) / 2))
      .y0(sparkH - 1).y1(b => yS(b.length))
      .curve(d3.curveMonotoneX);
    svg.append("path").datum(bins).attr("d", area).attr("fill", "#4477AA").attr("opacity", 0.35);
    const line = d3.line().x(b => xS((b.x0 + b.x1) / 2)).y(b => yS(b.length)).curve(d3.curveMonotoneX);
    svg.append("path").datum(bins).attr("d", line).attr("fill", "none").attr("stroke", "#4477AA").attr("stroke-width", 1);
  });
}

// ── Initial render ──────────────────────────────────────────────────
renderCanvas();
updateTable();

</script>
</body>
</html>
