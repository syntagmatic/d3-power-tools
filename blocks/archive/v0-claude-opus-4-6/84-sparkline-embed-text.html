<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparklines Embedded in Text</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fafafa; color: #222; line-height: 1.7; }
  .container { max-width: 800px; margin: 0 auto; padding: 24px 20px; }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 0.82rem; color: #666; margin-bottom: 20px; }
  .narrative { font-size: 0.92rem; margin-bottom: 28px; }
  .narrative p { margin-bottom: 14px; }
  .spark svg { display: inline-block; vertical-align: baseline; margin: 0 2px; }
  /* Table */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  caption { text-align: left; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; caption-side: top; }
  thead { position: sticky; top: 0; z-index: 2; }
  th { background: #f3f3f3; border-bottom: 2px solid #ddd; padding: 7px 8px; text-align: left;
       font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { background: #eaeaea; }
  td { padding: 6px 8px; border-bottom: 1px solid #eee; white-space: nowrap; }
  tr:nth-child(even) { background: #fafafa; }
  tr:nth-child(odd) { background: #fff; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  .change-up { color: #228833; }
  .change-down { color: #EE6677; }
  .sort-arrow { font-size: 0.65rem; margin-left: 2px; }
  @media (max-width: 599px) {
    .table-wrap { overflow-x: scroll; }
    th:first-child, td:first-child { position: sticky; left: 0; background: inherit; z-index: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Q4 2024 Business Review</h1>
  <p class="subtitle">Key metrics with inline trends (Jan 2023 - Dec 2024)</p>

  <div class="narrative" id="narrative"></div>

  <div class="table-wrap">
    <table id="data-table">
      <caption>Metric Summary (24-month view)</caption>
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<script>
(() => {
  // --- Data: 8 metrics, 24 monthly values ---
  const lerp = (a, b, t) => a + (b - a) * t;
  const noise = (amp, seed) => {
    let s = seed;
    return () => { s = (s * 9301 + 49297) % 233280; return (s / 233280 - 0.5) * amp * 2; };
  };

  const genTrend = (start, end, n, amp, seed) => {
    const nf = noise(amp, seed);
    return d3.range(n).map(i => +(lerp(start, end, i / (n - 1)) + nf()).toFixed(2));
  };

  const metrics = [
    { name: "Revenue", unit: "$M", values: genTrend(8.2, 12.1, 24, 0.4, 1), format: d => `$${d.toFixed(1)}M` },
    { name: "Gross Margin", unit: "%", values: genTrend(41, 43, 24, 1.2, 2), format: d => `${d.toFixed(1)}%` },
    { name: "Customer Count", unit: "K", values: genTrend(15, 22, 24, 0.5, 3), format: d => `${d.toFixed(1)}K` },
    { name: "Churn Rate", unit: "%",
      values: (() => {
        const v = genTrend(5.2, 3.8, 24, 0.3, 4);
        v[13] = 6.8; // spike at month 14
        return v;
      })(),
      format: d => `${d.toFixed(1)}%`, inverted: true
    },
    { name: "NPS", unit: "", values: genTrend(35, 52, 24, 5, 5), format: d => d.toFixed(0) },
    { name: "Avg Order Value", unit: "$", values: genTrend(124, 130, 24, 3, 6), format: d => `$${d.toFixed(0)}` },
    { name: "Support Tickets", unit: "K", values: genTrend(4.8, 2.9, 24, 0.3, 7), format: d => `${d.toFixed(1)}K`, inverted: true },
    { name: "Employee Count", unit: "",
      values: (() => {
        const v = d3.range(24).map(i => i < 8 ? 340 : i < 16 ? 370 : 410);
        return v.map((x, i) => x + (i % 3 === 0 ? 2 : 0));
      })(),
      format: d => d.toFixed(0)
    }
  ];

  // Compute derived fields
  metrics.forEach(m => {
    m.latest = m.values.at(-1);
    m.prev = m.values[11]; // 12 months ago
    m.yoy = ((m.latest - m.prev) / Math.abs(m.prev) * 100);
    m.min = d3.min(m.values);
    m.max = d3.max(m.values);
    m.avg = d3.mean(m.values);
    m.direction = m.inverted ? (m.latest < m.prev ? "up" : "down") : (m.latest > m.prev ? "up" : "down");
  });

  const TOL_BLUE = "#4477AA", TOL_RED = "#EE6677";

  // --- Sparkline renderer ---
  const drawSparkline = (container, values, { w = 60, h = 12, direction = "up", showDot = true } = {}) => {
    const svg = d3.select(container).append("svg")
      .attr("width", w).attr("height", h).attr("aria-hidden", "true");
    const x = d3.scaleLinear([0, values.length - 1], [1, w - 2]);
    const y = d3.scaleLinear(d3.extent(values), [h - 1, 1]);
    const line = d3.line((d, i) => x(i), d => y(d)).curve(d3.curveMonotoneX);
    svg.append("path").datum(values)
      .attr("d", line).attr("fill", "none")
      .attr("stroke", "currentColor").attr("stroke-width", 1.5);
    if (showDot) {
      svg.append("circle")
        .attr("cx", x(values.length - 1)).attr("cy", y(values.at(-1)))
        .attr("r", 1.5)
        .attr("fill", direction === "up" ? TOL_BLUE : TOL_RED);
    }
    return svg.node();
  };

  // --- Narrative ---
  const sparkRef = (metricIdx) => `<span class="spark" data-metric="${metricIdx}"></span>`;

  const narrativeHTML = `
    <p>Revenue grew 47% over the past two years, rising from $8.2M to $12.1M ${sparkRef(0)} while
    gross margins held remarkably steady around 42% ${sparkRef(1)}. This margin stability during rapid
    growth reflects disciplined pricing and operational leverage. Customer count expanded from 15K to 22K
    ${sparkRef(2)}, driven by strong product-market fit in the mid-market segment.</p>

    <p>Churn rate declined from 5.2% to 3.8% ${sparkRef(3)}, though a notable spike in February 2024
    coincided with a pricing restructure. Net Promoter Score improved steadily from the mid-30s to 52
    ${sparkRef(4)}, validating the team's focus on customer experience. Average order value remained
    flat at around $127 ${sparkRef(5)}, suggesting growth came from new customers rather than upselling.</p>

    <p>Support ticket volume dropped 40% from 4.8K to 2.9K monthly ${sparkRef(6)}, a direct result of
    the self-service portal launched in Q2 2023. The team grew from 340 to 410 people ${sparkRef(7)} in
    two step-changes aligned with Series B and C funding rounds, maintaining a healthy revenue-per-employee
    ratio throughout the expansion period.</p>
  `;

  document.getElementById("narrative").innerHTML = narrativeHTML;

  // Render inline sparklines
  document.querySelectorAll(".spark").forEach(span => {
    const idx = +span.dataset.metric;
    const m = metrics[idx];
    drawSparkline(span, m.values, { direction: m.direction });
  });

  // --- Data table ---
  const tableCols = [
    { key: "name", label: "Metric", type: "string" },
    { key: "latest", label: "Latest", type: "number" },
    { key: "yoy", label: "YoY Change", type: "number" },
    { key: "trend", label: "Trend", type: "sparkline" },
    { key: "min", label: "Min", type: "number" },
    { key: "max", label: "Max", type: "number" },
    { key: "avg", label: "Avg", type: "number" }
  ];

  const thead = d3.select("#thead-row");
  tableCols.forEach(col => {
    thead.append("th")
      .attr("class", (col.type === "number" || col.type === "sparkline") ? "num" : "")
      .text(col.label)
      .datum(col)
      .on("click", (e, col) => sortTable(col));
  });

  let sortCol = null, sortAsc = true;
  let sortedMetrics = [...metrics];

  const renderTable = () => {
    const tbody = d3.select("#tbody");
    tbody.selectAll("tr").remove();

    sortedMetrics.forEach(m => {
      const tr = tbody.append("tr");
      tableCols.forEach(col => {
        const td = tr.append("td");
        if (col.key === "name") {
          td.text(m.name);
        } else if (col.key === "latest") {
          td.attr("class", "num").text(m.format(m.latest));
        } else if (col.key === "yoy") {
          const isUp = m.yoy >= 0;
          const cls = (m.inverted ? !isUp : isUp) ? "change-up" : "change-down";
          td.attr("class", `num ${cls}`)
            .text((m.yoy >= 0 ? "+" : "") + m.yoy.toFixed(1) + "%");
        } else if (col.key === "trend") {
          td.attr("class", "num");
          drawSparkline(td.node(), m.values, { w: 80, h: 16, direction: m.direction });
        } else if (col.key === "min") {
          td.attr("class", "num").text(m.format(m.min));
        } else if (col.key === "max") {
          td.attr("class", "num").text(m.format(m.max));
        } else if (col.key === "avg") {
          td.attr("class", "num").text(m.format(m.avg));
        }
      });
    });
  };

  const sortTable = (col) => {
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }

    thead.selectAll("th").each(function() {
      const th = d3.select(this);
      th.selectAll(".sort-arrow").remove();
      if (th.datum() === sortCol) {
        th.append("span").attr("class", "sort-arrow").text(sortAsc ? " ▲" : " ▼");
      }
    });

    if (col.type === "string") {
      sortedMetrics.sort((a, b) => (sortAsc ? d3.ascending : d3.descending)(a[col.key], b[col.key]));
    } else if (col.type === "sparkline") {
      sortedMetrics.sort((a, b) => (sortAsc ? d3.ascending : d3.descending)(a.yoy, b.yoy));
    } else {
      sortedMetrics.sort((a, b) => (sortAsc ? d3.ascending : d3.descending)(a[col.key], b[col.key]));
    }
    renderTable();
  };

  renderTable();
})();
</script>
</body>
</html>
