<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidal Harmonic Decomposition</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --text-muted: #666;
    --font: system-ui, -apple-system, sans-serif;
    --m2: #4477AA;
    --s2: #EE6677;
    --k1: #228833;
    --o1: #CCBB44;
    --composite: #333;
    --grid: #e4e4e4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 2px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
  #panels { width: 100%; max-width: 960px; }
  .panel-label {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 12px 0 4px 50px;
  }
  .toggles {
    display: flex; gap: 12px; margin: 0 0 8px 50px; flex-wrap: wrap;
  }
  .toggle-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px;
    border: 2px solid; cursor: pointer; font-size: 12px;
    font-weight: 500; font-family: var(--font);
    transition: background 0.2s, color 0.2s;
    background: #fff;
  }
  .toggle-btn.active { color: #fff; }
  .toggle-btn .swatch {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .amp-bar-wrap {
    display: flex; align-items: center; gap: 8px;
    margin: 2px 0 2px 50px; font-size: 11px; color: var(--text-muted);
  }
  .amp-bar {
    height: 8px; border-radius: 4px; transition: width 0.3s;
  }
  .amp-label { min-width: 28px; font-size: 11px; }
  .axis text { fill: var(--text-muted); font-size: 10px; }
  .axis line, .axis path { stroke: var(--grid); }
  .grid line { stroke: var(--grid); stroke-dasharray: 2,3; }
  .annotation-line { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3,3; }
  .annotation-text { font-size: 10px; fill: var(--text-muted); font-weight: 500; }
</style>
</head>
<body>
<h1>Tidal Harmonic Decomposition</h1>
<p class="subtitle">Toggle constituents to see how 4 harmonics compose a tidal signal</p>
<div id="panels"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Harmonic constituents
const constituents = [
  {id:"M2", label:"M2 — principal lunar", period:12.42, amplitude:1.0, color:"var(--m2)", hex:"#4477AA", active:true},
  {id:"S2", label:"S2 — principal solar", period:12.00, amplitude:0.46, color:"var(--s2)", hex:"#EE6677", active:true},
  {id:"K1", label:"K1 — luni-solar diurnal", period:23.93, amplitude:0.38, color:"var(--k1)", hex:"#228833", active:true},
  {id:"O1", label:"O1 — principal lunar diurnal", period:25.82, amplitude:0.18, color:"var(--o1)", hex:"#CCBB44", active:true},
];

const hours = 720; // 30 days
const dt = 0.5; // half-hour resolution
const n = hours / dt;

// Seeded pseudo-random
let seed = 42;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function generateSignal() {
  seed = 42; // reset seed for consistent noise across toggles
  const times = d3.range(n).map(i => i * dt);
  const signals = times.map(t => {
    let total = 0;
    const components = {};
    for (const c of constituents) {
      const val = c.amplitude * Math.cos(2 * Math.PI * t / c.period);
      components[c.id] = val;
      if (c.active) total += val;
    }
    const noise = (rand() - 0.5) * 0.1;
    return {t, total: total + noise, ...components};
  });
  return signals;
}

let signals = generateSignal();

const margin = {top:12, right:20, bottom:28, left:50};
const fullW = 920, tsH = 280, cycleH = 120;
const innerW = fullW - margin.left - margin.right;

// --- TOP PANEL: Time series ---
const panels = d3.select("#panels");

panels.append("div").attr("class","panel-label").text("30-Day Tidal Signal");

const svg1 = panels.append("svg")
  .attr("viewBox",`0 0 ${fullW} ${tsH + margin.top + margin.bottom}`)
  .attr("width","100%");
svg1.append("title").text("Tidal harmonic decomposition — 30-day time series");

const g1 = svg1.append("g").attr("transform",`translate(${margin.left},${margin.top})`);

const xTs = d3.scaleLinear().domain([0, hours]).range([0, innerW]);
const yTs = d3.scaleLinear().domain([-2.5, 2.5]).range([tsH, 0]);

g1.append("g").attr("class","grid")
  .call(d3.axisLeft(yTs).tickSize(-innerW).tickFormat(""))
  .call(g => g.select(".domain").remove());

g1.append("g").attr("class","axis").attr("transform",`translate(0,${tsH})`)
  .call(d3.axisBottom(xTs).ticks(15).tickFormat(d => `${d}h`))
  .call(g => g.select(".domain").attr("stroke","#ccc"));

g1.append("g").attr("class","axis")
  .call(d3.axisLeft(yTs).ticks(5).tickFormat(d => `${d}m`))
  .call(g => g.select(".domain").remove());

// Zero line
g1.append("line").attr("x1",0).attr("x2",innerW).attr("y1",yTs(0)).attr("y2",yTs(0))
  .attr("stroke","#bbb").attr("stroke-width",1);

// Component lines
const componentPaths = {};
for (const c of constituents) {
  componentPaths[c.id] = g1.append("path")
    .attr("fill","none").attr("stroke",c.hex).attr("stroke-width",1.2)
    .attr("opacity",0.6);
}

// Composite line
const compositePath = g1.append("path")
  .attr("fill","none").attr("stroke","var(--composite)").attr("stroke-width",2);

// Annotations group
const annGroup = g1.append("g");

// --- MIDDLE PANEL: Cycle plot ---
panels.append("div").attr("class","panel-label").style("margin-top","16px").text("24-Hour Cycle Overlay");

const svg2 = panels.append("svg")
  .attr("viewBox",`0 0 ${fullW} ${cycleH + margin.top + margin.bottom + 10}`)
  .attr("width","100%");
svg2.append("title").text("24-hour tidal cycle overlay");

const g2 = svg2.append("g").attr("transform",`translate(${margin.left},${margin.top})`);

const xCycle = d3.scaleLinear().domain([0, 24]).range([0, innerW]);
const yCycle = d3.scaleLinear().domain([-2.5, 2.5]).range([cycleH, 0]);

g2.append("g").attr("class","grid")
  .call(d3.axisLeft(yCycle).tickSize(-innerW).ticks(4).tickFormat(""))
  .call(g => g.select(".domain").remove());

g2.append("g").attr("class","axis").attr("transform",`translate(0,${cycleH})`)
  .call(d3.axisBottom(xCycle).ticks(12).tickFormat(d => `${d}:00`))
  .call(g => g.select(".domain").attr("stroke","#ccc"));

g2.append("g").attr("class","axis")
  .call(d3.axisLeft(yCycle).ticks(4).tickFormat(d => `${d}m`))
  .call(g => g.select(".domain").remove());

g2.append("line").attr("x1",0).attr("x2",innerW).attr("y1",yCycle(0)).attr("y2",yCycle(0))
  .attr("stroke","#bbb").attr("stroke-width",1);

const dayLinesGroup = g2.append("g");
const meanLineEl = g2.append("path")
  .attr("fill","none").attr("stroke","var(--composite)").attr("stroke-width",2.5);

// --- BOTTOM PANEL: Toggles + amplitude bars ---
panels.append("div").attr("class","panel-label").style("margin-top","16px").text("Constituent Controls");

const toggleDiv = panels.append("div").attr("class","toggles");

for (const c of constituents) {
  const btn = toggleDiv.append("button")
    .attr("class","toggle-btn active")
    .style("border-color", c.hex)
    .style("background", c.hex)
    .style("color", "#fff")
    .on("click", () => {
      c.active = !c.active;
      btn.classed("active", c.active)
        .style("background", c.active ? c.hex : "#fff")
        .style("color", c.active ? "#fff" : c.hex);
      update();
    });
  btn.append("span").attr("class","swatch").style("background", c.active ? "#fff" : c.hex);
  btn.append("span").text(c.id);
}

// Amplitude bars
const maxAmp = 1.0;
const barScale = d3.scaleLinear().domain([0, maxAmp]).range([0, 200]);

for (const c of constituents) {
  const row = panels.append("div").attr("class","amp-bar-wrap");
  row.append("span").attr("class","amp-label").style("min-width","28px").text(c.id);
  row.append("div").attr("class","amp-bar")
    .style("width", barScale(c.amplitude) + "px")
    .style("background", c.hex);
  row.append("span").text(`${c.amplitude.toFixed(2)}m`);
}

// Line generators
const tsLine = d3.line().x(d => xTs(d.t)).y(d => yTs(d.v)).curve(d3.curveLinear);
const cycleLine = d3.line().x(d => xCycle(d.t)).y(d => yCycle(d.v)).curve(d3.curveLinear);

function findSpringNeapTides() {
  // Spring: M2+S2 in phase (peaks align), Neap: out of phase
  // Find local maxima in composite that are high (spring) or low (neap)
  const annotations = [];
  const step = 4; // check every 4 points
  for (let i = step; i < signals.length - step; i += step) {
    const prev = signals[i - step].total;
    const curr = signals[i].total;
    const next = signals[i + step].total;
    if (curr > prev && curr > next && curr > 1.2) {
      // potential spring tide peak
      if (annotations.length === 0 || signals[i].t - annotations[annotations.length-1].t > 100) {
        annotations.push({t: signals[i].t, v: curr, label: "Spring tide", type: "spring"});
      }
    }
  }
  // Find neap: low maxima
  for (let i = step; i < signals.length - step; i += step) {
    const prev = signals[i - step].total;
    const curr = signals[i].total;
    const next = signals[i + step].total;
    if (curr > prev && curr > next && curr > 0 && curr < 0.7) {
      if (annotations.filter(a => Math.abs(a.t - signals[i].t) < 80).length === 0) {
        annotations.push({t: signals[i].t, v: curr, label: "Neap tide", type: "neap"});
      }
    }
  }
  return annotations.slice(0, 6); // limit
}

function update() {
  signals = generateSignal();

  // Update time series
  // Downsample for rendering (every 2nd point)
  const tsData = signals.filter((_, i) => i % 2 === 0);

  compositePath.transition().duration(400)
    .attr("d", tsLine(tsData.map(d => ({t: d.t, v: d.total}))));

  for (const c of constituents) {
    const pathData = tsData.map(d => ({t: d.t, v: d[c.id]}));
    componentPaths[c.id].transition().duration(400)
      .attr("d", tsLine(pathData))
      .attr("opacity", c.active ? 0.5 : 0);
  }

  // Annotations
  const anns = findSpringNeapTides();
  annGroup.selectAll("*").remove();
  for (const a of anns) {
    const ax = xTs(a.t), ay = yTs(a.v);
    annGroup.append("line").attr("class","annotation-line")
      .attr("x1",ax).attr("x2",ax).attr("y1",ay - 12).attr("y2",ay - 36);
    annGroup.append("text").attr("class","annotation-text")
      .attr("x",ax).attr("y",ay - 40).attr("text-anchor","middle")
      .text(a.label);
  }

  // Cycle plot
  dayLinesGroup.selectAll("*").remove();
  const days = 30;
  const samplesPerDay = 24 / dt;
  const dayPaths = [];
  for (let d = 0; d < days; d++) {
    const start = d * samplesPerDay;
    const end = Math.min(start + samplesPerDay, signals.length);
    const dayData = [];
    for (let i = start; i < end; i++) {
      dayData.push({t: (signals[i].t % 24), v: signals[i].total});
    }
    dayData.sort((a, b) => a.t - b.t);
    dayPaths.push(dayData);
    dayLinesGroup.append("path")
      .attr("fill","none").attr("stroke","#ccc").attr("stroke-width",0.6)
      .attr("d", cycleLine(dayData));
  }

  // Mean cycle
  const meanBins = d3.range(0, 24, dt);
  const meanData = meanBins.map(t => {
    const vals = dayPaths.map(dp => {
      const close = dp.find(p => Math.abs(p.t - t) < dt * 0.6);
      return close ? close.v : null;
    }).filter(v => v !== null);
    return {t, v: d3.mean(vals) || 0};
  });
  meanLineEl.transition().duration(400).attr("d", cycleLine(meanData));
}

update();
</script>
</body>
</html>
