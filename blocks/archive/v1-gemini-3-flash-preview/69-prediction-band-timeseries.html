<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Revenue Forecast - Prediction Band Time Series</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #2d3436;
            --primary-line: #0984e3;
            --forecast-line: #00cec9;
            --band-95: rgba(9, 132, 227, 0.1);
            --band-80: rgba(9, 132, 227, 0.2);
            --band-50: rgba(9, 132, 227, 0.35);
            --grid-color: #f1f2f6;
            --annotation-color: #636e72;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #container {
            width: 900px;
            position: relative;
        }

        .chart-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: left;
            width: 100%;
        }

        .chart-subtitle {
            font-size: 14px;
            color: #636e72;
            margin-bottom: 24px;
            text-align: left;
            width: 100%;
        }

        svg {
            background: var(--bg-color);
        }

        .axis text {
            font-size: 11px;
            fill: #636e72;
        }

        .axis path, .axis line {
            stroke: #dfe6e9;
        }

        .grid line {
            stroke: var(--grid-color);
        }

        .line {
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .line.actual {
            stroke: var(--primary-line);
        }

        .line.forecast {
            stroke: var(--forecast-line);
            stroke-dasharray: 4,4;
        }

        .area {
            stroke: none;
        }

        .annotation line {
            stroke: var(--annotation-color);
            stroke-width: 1;
            stroke-dasharray: 2,2;
        }

        .annotation text {
            font-size: 11px;
            fill: var(--annotation-color);
            font-weight: 500;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background-color: #2d3436;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #000;
        }

        button:disabled {
            background-color: #dfe6e9;
            color: #b2bec3;
            cursor: not-allowed;
        }

        .legend {
            display: flex;
            gap: 20px;
            font-size: 12px;
            margin-bottom: 10px;
            justify-content: flex-start;
            width: 100%;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div id="container">
    <div class="chart-title">Revenue Trajectory & Strategic Forecast</div>
    <div class="chart-subtitle">Monthly recurring revenue (MRR) with predictive confidence bands</div>
    
    <div class="legend">
        <div class="legend-item"><div class="legend-swatch" style="background: var(--primary-line)"></div> Actual</div>
        <div class="legend-item"><div class="legend-swatch" style="background: var(--forecast-line); border: 1px dashed #ccc"></div> Forecast</div>
        <div class="legend-item"><div class="legend-swatch" style="background: var(--band-50)"></div> 50% CI</div>
        <div class="legend-item"><div class="legend-swatch" style="background: var(--band-80)"></div> 80% CI</div>
        <div class="legend-item"><div class="legend-swatch" style="background: var(--band-95)"></div> 95% CI</div>
    </div>

    <div id="viz"></div>

    <div class="controls">
        <button id="nextBtn">Start Story</button>
        <button id="resetBtn" style="background: #e17055;">Reset</button>
    </div>
</div>

<script>
    // --- Data Generation ---
    const parseDate = d3.timeParse("%Y-%m");
    const startDate = parseDate("2024-01");
    const actualMonths = 30;
    const forecastMonths = 6;
    
    const data = [];
    let currentVal = 120;
    const trend = 1.8;
    const seasonality = 15;

    // Actual Data
    for (let i = 0; i < actualMonths; i++) {
        const date = d3.timeMonth.offset(startDate, i);
        const noise = (Math.random() - 0.5) * 10;
        const seasonalVal = Math.sin(i / 1.5) * seasonality;
        currentVal += trend + (Math.random() - 0.4) * 2;
        data.push({
            date,
            value: currentVal + seasonalVal + noise,
            type: 'actual'
        });
    }

    // Forecast Data
    const lastActual = data[data.length - 1];
    for (let i = 1; i <= forecastMonths; i++) {
        const date = d3.timeMonth.offset(lastActual.date, i);
        const forecastVal = lastActual.value + (trend * i);
        
        // Widening uncertainty
        const spread = i * 8;
        data.push({
            date,
            value: forecastVal,
            type: 'forecast',
            p95_upper: forecastVal + spread * 1.96,
            p95_lower: forecastVal - spread * 1.96,
            p80_upper: forecastVal + spread * 1.28,
            p80_lower: forecastVal - spread * 1.28,
            p50_upper: forecastVal + spread * 0.67,
            p50_lower: forecastVal - spread * 0.67
        });
    }

    const events = [
        { date: d3.timeMonth.offset(startDate, 11), label: "Platform V2 Launch" },
        { date: d3.timeMonth.offset(startDate, 23), label: "EU Market Expansion" },
        { date: lastActual.date, label: "Current Point" }
    ];

    // --- Chart Setup ---
    const margin = {top: 40, right: 60, bottom: 50, left: 60};
    const width = 900 - margin.left - margin.right;
    const height = 500 - margin.top - margin.bottom;

    const svg = d3.select("#viz")
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    const x = d3.scaleTime()
        .domain(d3.extent(data, d => d.date))
        .range([0, width]);

    const y = d3.scaleLinear()
        .domain([0, d3.max(data, d => d.p95_upper || d.value) * 1.1])
        .range([height, 0]);

    // Gridlines
    svg.append("g")
        .attr("class", "grid")
        .call(d3.axisLeft(y)
            .tickSize(-width)
            .tickFormat("")
        );

    // Axes
    const xAxis = d3.axisBottom(x).ticks(8).tickFormat(d3.timeFormat("%b '%y"));
    const yAxis = d3.axisLeft(y).tickFormat(d => `$${d}k`);

    svg.append("g")
        .attr("class", "axis x-axis")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis);

    svg.append("g")
        .attr("class", "axis y-axis")
        .call(yAxis);

    // --- Drawing Layers ---
    
    // 1. Prediction Areas (Fan) - Hidden initially
    const area95 = d3.area()
        .defined(d => d.type === 'forecast' || d === lastActual)
        .x(d => x(d.date))
        .y0(d => y(d.p95_lower || d.value))
        .y1(d => y(d.p95_upper || d.value))
        .curve(d3.curveMonotoneX);

    const area80 = d3.area()
        .defined(d => d.type === 'forecast' || d === lastActual)
        .x(d => x(d.date))
        .y0(d => y(d.p80_lower || d.value))
        .y1(d => y(d.p80_upper || d.value))
        .curve(d3.curveMonotoneX);

    const area50 = d3.area()
        .defined(d => d.type === 'forecast' || d === lastActual)
        .x(d => x(d.date))
        .y0(d => y(d.p50_lower || d.value))
        .y1(d => y(d.p50_upper || d.value))
        .curve(d3.curveMonotoneX);

    const fanGroup = svg.append("g").attr("class", "fan-group");

    const path95 = fanGroup.append("path")
        .datum(data)
        .attr("class", "area area-95")
        .attr("fill", "var(--band-95)")
        .attr("d", area95)
        .style("opacity", 0);

    const path80 = fanGroup.append("path")
        .datum(data)
        .attr("class", "area area-80")
        .attr("fill", "var(--band-80)")
        .attr("d", area80)
        .style("opacity", 0);

    const path50 = fanGroup.append("path")
        .datum(data)
        .attr("class", "area area-50")
        .attr("fill", "var(--band-50)")
        .attr("d", area50)
        .style("opacity", 0);

    // 2. Lines
    const lineGen = d3.line()
        .x(d => x(d.date))
        .y(d => y(d.value))
        .curve(d3.curveMonotoneX);

    const actualPath = svg.append("path")
        .datum(data.filter(d => d.type === 'actual'))
        .attr("class", "line actual")
        .attr("d", lineGen)
        .style("opacity", 0);

    const forecastPath = svg.append("path")
        .datum(data.filter(d => d.type === 'forecast' || d === lastActual))
        .attr("class", "line forecast")
        .attr("d", lineGen)
        .style("opacity", 0);

    // 3. Annotations
    const annotationGroup = svg.append("g").attr("class", "annotations");

    function drawAnnotations() {
        const sel = annotationGroup.selectAll(".annotation")
            .data(events)
            .enter()
            .append("g")
            .attr("class", "annotation")
            .attr("transform", d => `translate(${x(d.date)}, 0)`)
            .style("opacity", 0);

        sel.append("line")
            .attr("y1", 0)
            .attr("y2", height);

        sel.append("text")
            .attr("x", 5)
            .attr("y", 20)
            .text(d => d.label);

        return sel;
    }

    const annotationSel = drawAnnotations();

    // --- Storytelling Logic ---
    let currentStep = 0;
    const steps = [
        { label: "Reveal Actuals", action: revealActuals },
        { label: "Show Key Milestones", action: revealAnnotations },
        { label: "Predict Uncertainty (95%)", action: revealFan95 },
        { label: "Show High Confidence", action: revealFanInner },
        { label: "Final Forecast", action: revealForecastLine }
    ];

    async function revealActuals() {
        const totalLength = actualPath.node().getTotalLength();
        actualPath
            .attr("stroke-dasharray", totalLength + " " + totalLength)
            .attr("stroke-dashoffset", totalLength)
            .style("opacity", 1)
            .transition()
            .duration(2000)
            .ease(d3.easeLinear)
            .attr("stroke-dashoffset", 0);
        
        await new Promise(r => setTimeout(r, 2000));
    }

    async function revealAnnotations() {
        annotationSel.transition()
            .duration(800)
            .delay((d, i) => i * 400)
            .style("opacity", 1);
        
        await new Promise(r => setTimeout(r, 1500));
    }

    async function revealFan95() {
        path95.transition()
            .duration(1000)
            .style("opacity", 1);
        
        await new Promise(r => setTimeout(r, 1000));
    }

    async function revealFanInner() {
        path80.transition()
            .duration(800)
            .style("opacity", 1);
        
        path50.transition()
            .duration(800)
            .delay(400)
            .style("opacity", 1);

        await new Promise(r => setTimeout(r, 1200));
    }

    async function revealForecastLine() {
        forecastPath.transition()
            .duration(1000)
            .style("opacity", 1);
        
        await new Promise(r => setTimeout(r, 1000));
    }

    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetBtn");

    nextBtn.addEventListener("click", async () => {
        if (currentStep < steps.length) {
            nextBtn.disabled = true;
            await steps[currentStep].action();
            currentStep++;
            if (currentStep < steps.length) {
                nextBtn.innerText = steps[currentStep].label;
                nextBtn.disabled = false;
            } else {
                nextBtn.innerText = "Completed";
            }
        }
    });

    resetBtn.addEventListener("click", () => {
        currentStep = 0;
        nextBtn.disabled = false;
        nextBtn.innerText = "Start Story";
        
        actualPath.interrupt().style("opacity", 0).attr("stroke-dasharray", null);
        forecastPath.interrupt().style("opacity", 0);
        path95.interrupt().style("opacity", 0);
        path80.interrupt().style("opacity", 0);
        path50.interrupt().style("opacity", 0);
        annotationSel.interrupt().style("opacity", 0);
    });

</script>

</body>
</html>
