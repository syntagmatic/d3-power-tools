<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regional Manufacturing DNA | Parallel Coordinates Grid</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --panel-bg: #ffffff;
      --border-color: #e9ecef;
      --text-main: #212529;
      --text-muted: #6c757d;
      --accent-color: #007bff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 800px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .description {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .panel-stats {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      font-weight: 500;
    }

    .viz-container {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 1;
      overflow: visible;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .axis line, .axis path {
      stroke: #dee2e6;
    }

    .axis text {
      fill: #adb5bd;
      font-size: 10px;
      font-weight: 500;
    }

    .axis-label {
      font-size: 10px;
      font-weight: 700;
      fill: #495057;
      text-anchor: middle;
    }

    .brush .selection {
      fill: rgba(0,0,0,0.05);
      stroke: #adb5bd;
      stroke-width: 1px;
    }

    .brush .handle {
      fill: #fff;
      stroke: #6c757d;
      stroke-width: 1px;
      rx: 2;
      ry: 2;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Regional Manufacturing DNA</h1>
    <p class="description">
      Comparing 200 vehicles across 6 performance metrics. 
      Brush any axis to filter the global selection across all 4 manufacturing regions.
    </p>
  </header>

  <div class="grid" id="viz-grid"></div>

  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // --- Configuration ---
    const NUM_CARS = 200;
    const REGIONS = [
      { name: "North America", color: "#CC6677" },
      { name: "Europe", color: "#332288" },
      { name: "Japan", color: "#44AA99" },
      { name: "South Korea", color: "#DDCC77" }
    ];

    const DIMENSIONS = [
      { key: "hp", label: "Horsepower", domain: [50, 450] },
      { key: "weight", label: "Weight (lb)", domain: [1500, 5500] },
      { key: "mpg", label: "MPG", domain: [10, 60] },
      { key: "price", label: "Price ($k)", domain: [15, 120] },
      { key: "accel", label: "0-60 mph (s)", domain: [3, 15] },
      { key: "displacement", label: "Disp. (L)", domain: [1.0, 7.0] }
    ];

    // --- Data Generation ---
    function generateData() {
      const data = [];
      const regionProb = [0.3, 0.25, 0.3, 0.15]; // Distribution across regions
      
      for (let i = 0; i < NUM_CARS; i++) {
        // Pick region
        const r = Math.random();
        let regionIdx = 0;
        let sum = 0;
        for (let j = 0; j < regionProb.length; j++) {
          sum += regionProb[j];
          if (r < sum) {
            regionIdx = j;
            break;
          }
        }
        const region = REGIONS[regionIdx];

        // Regional variations (biases)
        const bias = {
          "North America": { hp: 1.2, weight: 1.3, mpg: 0.7, price: 0.9, accel: 0.9, displacement: 1.5 },
          "Europe": { hp: 1.1, weight: 1.0, mpg: 1.0, price: 1.4, accel: 0.8, displacement: 1.0 },
          "Japan": { hp: 0.9, weight: 0.8, mpg: 1.3, price: 0.8, accel: 1.1, displacement: 0.7 },
          "South Korea": { hp: 0.8, weight: 0.8, mpg: 1.4, price: 0.7, accel: 1.2, displacement: 0.6 }
        }[region.name];

        const car = { id: i, region: region.name };
        
        DIMENSIONS.forEach(dim => {
          const base = d3.randomUniform(dim.domain[0], dim.domain[1])();
          const b = bias[dim.key] || 1.0;
          let val = base * b;
          
          // Add some correlation between HP and Displacement, and inverse HP/MPG
          if (dim.key === 'hp') val = val; // keep base
          if (dim.key === 'displacement') val = (car.hp * 0.015) + (base * 0.2);
          if (dim.key === 'mpg') val = 70 - (car.hp * 0.1) - (car.weight * 0.005) + (base * 0.1);

          car[dim.key] = Math.max(dim.domain[0], Math.min(dim.domain[1], val));
        });

        data.push(car);
      }
      return data;
    }

    const data = generateData();

    // --- State Management ---
    const filters = new Map(); // dimKey -> [min, max] normalized 0-1
    const dispatch = d3.dispatch("filter");

    // --- Scales ---
    const yScales = {};
    DIMENSIONS.forEach(dim => {
      yScales[dim.key] = d3.scaleLinear().domain(dim.domain).range([1, 0]); // normalized output for filtering
    });

    // --- Visualization Setup ---
    const margin = { top: 30, right: 30, bottom: 20, left: 30 };
    const dpr = window.devicePixelRatio || 1;

    function createPanel(region, container) {
      const panel = d3.select(container)
        .append("div")
        .attr("class", "panel");

      const header = panel.append("div").attr("class", "panel-header");
      header.append("div")
        .attr("class", "panel-title")
        .style("color", region.color)
        .text(region.name);
      
      const stats = header.append("div").attr("class", "panel-stats");
      
      const vizContainer = panel.append("div").attr("class", "viz-container");
      
      const canvas = vizContainer.append("canvas").node();
      const svg = vizContainer.append("svg");
      
      const ctx = canvas.getContext("2d");
      
      let width, height, innerWidth, innerHeight;
      const xPosition = d3.scalePoint()
        .domain(DIMENSIONS.map(d => d.key))
        .padding(0);

      const yAxisScales = {};
      DIMENSIONS.forEach(dim => {
        yAxisScales[dim.key] = d3.scaleLinear().domain(dim.domain);
      });

      function resize() {
        const rect = vizContainer.node().getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        innerWidth = width - margin.left - margin.right;
        innerHeight = height - margin.top - margin.bottom;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
        
        xPosition.range([margin.left, width - margin.right]);
        DIMENSIONS.forEach(dim => {
          yAxisScales[dim.key].range([height - margin.bottom, margin.top]);
        });

        renderAxes();
        renderLines();
      }

      function renderAxes() {
        svg.selectAll("*").remove();
        
        const axes = svg.selectAll(".axis-group")
          .data(DIMENSIONS)
          .join("g")
          .attr("class", "axis-group")
          .attr("transform", d => `translate(${xPosition(d.key)}, 0)`);

        axes.each(function(d) {
          const g = d3.select(this);
          g.call(d3.axisLeft(yAxisScales[d.key]).ticks(5).tickSize(4));
          g.select(".domain").attr("stroke", "#dee2e6");
          g.selectAll(".tick line").attr("stroke", "#dee2e6");
          g.selectAll(".tick text").attr("fill", "#adb5bd").attr("dx", -2);
        });

        // Labels
        axes.append("text")
          .attr("class", "axis-label")
          .attr("y", margin.top - 12)
          .text(d => d.label);

        // Brushes
        axes.append("g")
          .attr("class", "brush")
          .each(function(d) {
            d3.select(this).call(
              d3.brushY()
                .extent([[-12, margin.top], [12, height - margin.bottom]])
                .on("brush end", (event) => {
                  if (event.selection) {
                    const [y0, y1] = event.selection;
                    const val0 = yAxisScales[d.key].invert(y0);
                    const val1 = yAxisScales[d.key].invert(y1);
                    // Store normalized filters for global check
                    const norm0 = yScales[d.key](val0);
                    const norm1 = yScales[d.key](val1);
                    filters.set(d.key, [Math.min(norm0, norm1), Math.max(norm0, norm1)]);
                  } else {
                    filters.delete(d.key);
                  }
                  dispatch.call("filter", null, d.key);
                })
            );
          });
      }

      function renderLines() {
        ctx.clearRect(0, 0, width, height);
        
        const regionData = data.filter(d => d.region === region.name);
        let visibleCount = 0;

        // Two passes: background (faded) and foreground (highlighted)
        [false, true].forEach(isHighlighted => {
          ctx.beginPath();
          ctx.lineWidth = isHighlighted ? 1.5 : 0.5;
          ctx.strokeStyle = isHighlighted ? region.color : "rgba(200, 200, 200, 0.1)";

          regionData.forEach(d => {
            const passes = DIMENSIONS.every(dim => {
              if (!filters.has(dim.key)) return true;
              const val = yScales[dim.key](d[dim.key]);
              const [min, max] = filters.get(dim.key);
              return val >= min && val <= max;
            });

            if (passes === isHighlighted) {
              if (passes) visibleCount++;
              
              DIMENSIONS.forEach((dim, i) => {
                const x = xPosition(dim.key);
                const y = yAxisScales[dim.key](d[dim.key]);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              });
            }
          });
          ctx.stroke();
        });

        stats.text(`${visibleCount} / ${regionData.length} vehicles`);
      }

      return { resize, renderLines, svg };
    }

    // --- Initialize ---
    const panels = REGIONS.map(region => createPanel(region, "#viz-grid"));

    function updateAll() {
      panels.forEach(p => p.renderLines());
    }

    dispatch.on("filter", (sourceKey) => {
      // Sync brushes across all panels except the one that triggered (optional, 
      // but here we want all panels to show the same brush state visually)
      panels.forEach(p => {
        p.svg.selectAll(".axis-group").each(function(d) {
          // If this axis was filtered, we could update the brush position
          // But d3.brush selection is manual. To avoid infinite loops and complexity,
          // we rely on the fact that 'filters' is global and 'renderLines' uses it.
          // In a production app, we'd sync the actual brush elements.
        });
        p.renderLines();
      });
    });

    window.addEventListener("resize", () => {
      panels.forEach(p => p.resize());
    });

    // Initial render
    setTimeout(() => {
      panels.forEach(p => p.resize());
    }, 0);

  </script>
</body>
</html>
