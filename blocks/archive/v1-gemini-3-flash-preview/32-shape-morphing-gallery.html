<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3 Shape-Morphing Gallery</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --accent: #38bdf8;
      --accent2: #818cf8;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      padding: 2rem 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      padding: 1rem;
      max-width: 1000px;
      width: 100%;
      box-sizing: border-box;
    }
    .cell {
      background: var(--card-bg);
      border-radius: 8px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid #334155;
      overflow: hidden;
    }
    .cell-label {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      pointer-events: none;
      z-index: 10;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .shape {
      fill: var(--accent);
      fill-opacity: 0.8;
      stroke: var(--accent);
      stroke-width: 1.5;
    }
    .shape-alt {
      fill: var(--accent2);
      fill-opacity: 0.8;
      stroke: var(--accent2);
      stroke-width: 1.5;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Shape-Morphing Gallery</h1>
</header>

<div class="grid" id="gallery"></div>

<script>
  const width = 300;
  const height = 300;
  const margin = 40;

  const demos = [
    { name: "Circle ↔ Rect", id: "circle-rect", draw: drawCircleRect },
    { name: "Bar ↔ Pie", id: "bar-pie", draw: drawBarPie },
    { name: "Star ↔ Circle", id: "star-circle", draw: drawStarCircle },
    { name: "Line ↔ Area", id: "line-area", draw: drawLineArea },
    { name: "Scatter ↔ Bar", id: "scatter-bar", draw: drawScatterBar },
    { name: "H-Bar ↔ V-Bar", id: "h-v-bar", draw: drawHVBar },
    { name: "Grouped ↔ Stacked", id: "grouped-stacked", draw: drawGroupedStacked },
    { name: "Treemap ↔ Circle Pack", id: "treemap-pack", draw: drawTreemapPack },
    { name: "Donut ↔ Sunburst", id: "donut-sunburst", draw: drawDonutSunburst }
  ];

  const grid = d3.select("#gallery");

  demos.forEach((demo, i) => {
    const cell = grid.append("div").attr("class", "cell");
    cell.append("div").attr("class", "cell-label").text(demo.name);
    const svg = cell.append("svg").attr("viewBox", `0 0 ${width} ${height}`);
    demo.draw(svg, i);
  });

  // --- Utility functions ---

  function resample(pathStr, n) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", pathStr);
    const length = path.getTotalLength();
    const points = [];
    for (let i = 0; i < n; i++) {
      const p = path.getPointAtLength((i * length) / (n - 1));
      points.push([p.x, p.y]);
    }
    return points;
  }

  function bestRotation(src, tgt) {
    let minSum = Infinity;
    let bestOffset = 0;
    for (let offset = 0; offset < src.length; offset++) {
      let sum = 0;
      for (let i = 0; i < src.length; i++) {
        const s = src[(i + offset) % src.length];
        const t = tgt[i];
        const dx = s[0] - t[0];
        const dy = s[1] - t[1];
        sum += dx * dx + dy * dy;
      }
      if (sum < minSum) {
        minSum = sum;
        bestOffset = offset;
      }
    }
    return src.slice(bestOffset).concat(src.slice(0, bestOffset));
  }

  function pointsToPath(pts) {
    return "M" + pts.map(p => p[0] + "," + p[1]).join("L") + "Z";
  }

  // --- Demo implementations ---

  function drawCircleRect(svg, idx) {
    const g = svg.append("g").attr("transform", `translate(${width/2}, ${height/2})`);
    const rect = g.append("rect")
      .attr("class", "shape")
      .attr("x", -50)
      .attr("y", -50)
      .attr("width", 100)
      .attr("height", 100)
      .attr("rx", 0);

    function loop() {
      rect.transition()
        .delay(idx * 200)
        .duration(1500)
        .attr("rx", 50)
        .transition()
        .duration(1500)
        .attr("rx", 0)
        .on("end", loop);
    }
    loop();
  }

  function drawBarPie(svg, idx) {
    const data = [30, 50, 20, 40, 60];
    const g = svg.append("g").attr("transform", `translate(${width/2}, ${height/2})`);
    const arc = d3.arc();
    const pie = d3.pie().sort(null);
    const pieData = pie(data);

    const radius = 80;
    const barScale = d3.scaleLinear().domain([0, 60]).range([20, 100]);

    function getBarParams(d, i) {
      const angle = (Math.PI * 2 / data.length);
      return {
        innerRadius: 0,
        outerRadius: barScale(d.data),
        startAngle: i * angle,
        endAngle: (i + 0.8) * angle
      };
    }

    function getPieParams(d) {
      return {
        innerRadius: 0,
        outerRadius: radius,
        startAngle: d.startAngle,
        endAngle: d.endAngle
      };
    }

    const paths = g.selectAll("path")
      .data(pieData)
      .enter().append("path")
      .attr("class", "shape")
      .attr("d", (d, i) => arc(getBarParams(d, i)))
      .each(function(d, i) { this._current = getBarParams(d, i); });

    function loop() {
      paths.transition()
        .delay(idx * 200)
        .duration(1500)
        .attrTween("d", function(d, i) {
          const interp = d3.interpolate(this._current, getPieParams(d));
          return t => {
            this._current = interp(t);
            return arc(this._current);
          };
        })
        .transition()
        .duration(1500)
        .attrTween("d", function(d, i) {
          const interp = d3.interpolate(this._current, getBarParams(d, i));
          return t => {
            this._current = interp(t);
            return arc(this._current);
          };
        })
        .on("end", loop);
    }
    loop();
  }

  function drawStarCircle(svg, idx) {
    const g = svg.append("g").attr("transform", `translate(${width/2}, ${height/2})`);
    
    function starPath(inner, outer, points) {
      const pts = [];
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? outer : inner;
        const a = (Math.PI * i) / points;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      return "M" + pts.join("L") + "Z";
    }

    const circleP = d3.arc()({innerRadius: 0, outerRadius: 70, startAngle: 0, endAngle: Math.PI * 2});
    const starP = starPath(35, 80, 5);

    const n = 128;
    const starPoints = resample(starP, n);
    const circlePoints = bestRotation(resample(circleP, n), starPoints);

    const path = g.append("path")
      .attr("class", "shape")
      .attr("d", pointsToPath(starPoints));

    function loop() {
      path.transition()
        .delay(idx * 200)
        .duration(1500)
        .attrTween("d", () => {
          const interp = d3.interpolate(starPoints, circlePoints);
          return t => pointsToPath(interp(t));
        })
        .transition()
        .duration(1500)
        .attrTween("d", () => {
          const interp = d3.interpolate(circlePoints, starPoints);
          return t => pointsToPath(interp(t));
        })
        .on("end", loop);
    }
    loop();
  }

  function drawLineArea(svg, idx) {
    const data = d3.range(10).map(i => [i * 25 + 35, 150 + Math.sin(i) * 40]);
    const g = svg.append("g");
    
    const line = d3.line();
    const area = d3.area().y0(250);

    const path = g.append("path")
      .attr("class", "shape")
      .attr("fill-opacity", 0.3)
      .attr("d", area(data));

    function loop() {
      path.transition()
        .delay(idx * 200)
        .duration(1500)
        .attr("d", d3.area().y0(y => y[1])(data)) // Collapsed area
        .transition()
        .duration(1500)
        .attr("d", area(data))
        .on("end", loop);
    }
    loop();
  }

  function drawScatterBar(svg, idx) {
    const data = [40, 80, 60, 90, 50];
    const x = d3.scaleBand().domain(d3.range(5)).range([50, 250]).padding(0.2);
    const y = d3.scaleLinear().domain([0, 100]).range([250, 50]);

    const g = svg.append("g");
    const rects = g.selectAll("rect")
      .data(data)
      .enter().append("rect")
      .attr("class", "shape")
      .attr("x", (d, i) => x(i) + x.bandwidth()/2 - 5)
      .attr("y", d => y(d) - 5)
      .attr("width", 10)
      .attr("height", 10)
      .attr("rx", 5);

    function loop() {
      rects.transition()
        .delay(idx * 200)
        .duration(1500)
        .attr("x", (d, i) => x(i))
        .attr("y", d => y(d))
        .attr("width", x.bandwidth())
        .attr("height", d => 250 - y(d))
        .attr("rx", 0)
        .transition()
        .duration(1500)
        .attr("x", (d, i) => x(i) + x.bandwidth()/2 - 5)
        .attr("y", d => y(d) - 5)
        .attr("width", 10)
        .attr("height", 10)
        .attr("rx", 5)
        .on("end", loop);
    }
    loop();
  }

  function drawHVBar(svg, idx) {
    const data = [50, 80, 60];
    const g = svg.append("g");
    
    const bars = g.selectAll("rect")
      .data(data)
      .enter().append("rect")
      .attr("class", "shape")
      .attr("x", 50)
      .attr("y", (d, i) => 80 + i * 50)
      .attr("width", d => d * 2)
      .attr("height", 30);

    function loop() {
      bars.transition()
        .delay(idx * 200)
        .duration(1500)
        .attr("x", (d, i) => 80 + i * 50)
        .attr("y", d => 250 - d * 2)
        .attr("width", 30)
        .attr("height", d => d * 2)
        .transition()
        .duration(1500)
        .attr("x", 50)
        .attr("y", (d, i) => 80 + i * 50)
        .attr("width", d => d * 2)
        .attr("height", 30)
        .on("end", loop);
    }
    loop();
  }

  function drawGroupedStacked(svg, idx) {
    const data = [[20, 30], [40, 20], [30, 40]];
    const g = svg.append("g");
    const x = d3.scaleBand().domain([0, 1, 2]).range([50, 250]).padding(0.2);

    const layers = g.selectAll("g")
      .data([0, 1])
      .enter().append("g")
      .attr("class", (d, i) => i === 0 ? "shape" : "shape-alt");

    const bars = layers.selectAll("rect")
      .data(i => data.map((d, j) => ({val: d[i], group: j, layer: i})))
      .enter().append("rect")
      .attr("fill", "inherit")
      .attr("x", d => x(d.group) + d.layer * x.bandwidth()/2)
      .attr("y", d => 250 - d.val * 2)
      .attr("width", x.bandwidth()/2 - 2)
      .attr("height", d => d.val * 2);

    function loop() {
      bars.transition()
        .delay(idx * 200)
        .duration(1500)
        .attr("x", d => x(d.group))
        .attr("y", d => {
          const base = d.layer === 0 ? 0 : data[d.group][0];
          return 250 - (base + d.val) * 2;
        })
        .attr("width", x.bandwidth())
        .transition()
        .duration(1500)
        .attr("x", d => x(d.group) + d.layer * x.bandwidth()/2)
        .attr("y", d => 250 - d.val * 2)
        .attr("width", x.bandwidth()/2 - 2)
        .on("end", loop);
    }
    loop();
  }

  function drawTreemapPack(svg, idx) {
    const data = {
      children: [{v: 40}, {v: 30}, {v: 25}, {v: 20}, {v: 15}]
    };
    const root = d3.hierarchy(data).sum(d => d.v);
    
    d3.treemap().size([200, 200])(root);
    const treemapData = root.leaves().map(d => [d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0]);
    
    d3.pack().size([200, 200]).padding(2)(root);
    const packData = root.leaves().map(d => [d.x - d.r, d.y - d.r, d.r * 2, d.r * 2, d.r]);

    const g = svg.append("g").attr("transform", "translate(50, 50)");
    const shapes = g.selectAll("rect")
      .data(treemapData)
      .enter().append("rect")
      .attr("class", "shape")
      .attr("x", d => d[0])
      .attr("y", d => d[1])
      .attr("width", d => d[2])
      .attr("height", d => d[3])
      .attr("rx", 0);

    function loop() {
      shapes.transition()
        .delay(idx * 200)
        .duration(1500)
        .attr("x", (d, i) => packData[i][0])
        .attr("y", (d, i) => packData[i][1])
        .attr("width", (d, i) => packData[i][2])
        .attr("height", (d, i) => packData[i][3])
        .attr("rx", (d, i) => packData[i][4])
        .transition()
        .duration(1500)
        .attr("x", d => d[0])
        .attr("y", d => d[1])
        .attr("width", d => d[2])
        .attr("height", d => d[3])
        .attr("rx", 0)
        .on("end", loop);
    }
    loop();
  }

  function drawDonutSunburst(svg, idx) {
    const data = {
      children: [
        { children: [{v: 10}, {v: 15}] },
        { children: [{v: 20}, {v: 5}] },
        { children: [{v: 15}, {v: 15}] }
      ]
    };
    const root = d3.hierarchy(data).sum(d => d.v);
    d3.partition().size([2 * Math.PI, 80])(root);

    const g = svg.append("g").attr("transform", `translate(${width/2}, ${height/2})`);
    const arc = d3.arc();

    const paths = g.selectAll("path")
      .data(root.descendants().filter(d => d.depth > 0))
      .enter().append("path")
      .attr("class", d => d.depth === 1 ? "shape" : "shape-alt")
      .attr("d", d => arc({
        innerRadius: 40,
        outerRadius: 80,
        startAngle: d.x0,
        endAngle: d.x1
      }))
      .each(function(d) {
        this._current = { innerRadius: 40, outerRadius: 80, startAngle: d.x0, endAngle: d.x1 };
      });

    function loop() {
      paths.transition()
        .delay(idx * 200)
        .duration(1500)
        .attrTween("d", function(d) {
          const target = {
            innerRadius: d.y0 + 20,
            outerRadius: d.y1 + 20,
            startAngle: d.x0,
            endAngle: d.x1
          };
          const interp = d3.interpolate(this._current, target);
          return t => {
            this._current = interp(t);
            return arc(this._current);
          };
        })
        .transition()
        .duration(1500)
        .attrTween("d", function(d) {
          const target = {
            innerRadius: 40,
            outerRadius: 80,
            startAngle: d.x0,
            endAngle: d.x1
          };
          const interp = d3.interpolate(this._current, target);
          return t => {
            this._current = interp(t);
            return arc(this._current);
          };
        })
        .on("end", loop);
    }
    loop();
  }

</script>
</body>
</html>
