<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Diagram: Character Co-occurrences</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --secondary-text: #666;
            --accent-color: #4f46e5;
            --grid-color: #e5e5e5;
            --node-stroke: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --secondary-text: #94a3b8;
            --accent-color: #818cf8;
            --grid-color: #334155;
            --node-stroke: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        p.description {
            font-size: 0.95rem;
            color: var(--secondary-text);
            max-width: 600px;
        }

        #chart {
            width: 100%;
            height: 600px;
            position: relative;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            margin-top: 1rem;
        }

        .tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }

        .stats {
            font-size: 0.85rem;
            color: var(--secondary-text);
            font-variant-numeric: tabular-nums;
        }

        .brush .selection {
            fill: var(--accent-color);
            fill-opacity: 0.1;
            stroke: var(--accent-color);
            stroke-width: 1px;
        }

        .node-label {
            font-size: 10px;
            fill: var(--secondary-text);
            font-weight: 500;
        }

        .axis-label {
            font-size: 11px;
            fill: var(--secondary-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Character Co-occurrence Arc Diagram</h1>
        <p class="description">
            Visualizing the relationships between 30 characters in a synthetic novel. Nodes are ordered by first chapter appearance. Arc heights and widths reflect co-occurrence frequency.
        </p>
    </header>

    <div class="controls">
        <div id="brush-info" class="stats">Showing all chapters (1–20)</div>
    </div>

    <div id="chart">
        <div id="tooltip" class="tooltip"></div>
    </div>
</div>

<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // --- Synthetic Data Generation ---
    const characterNames = [
        "Aria", "Bastian", "Caelum", "Daphne", "Elias", "Faye", "Gideon", "Hana", "Isidore", "Juno",
        "Kael", "Lyra", "Milo", "Nova", "Orion", "Petra", "Quinn", "Rowan", "Sora", "Thorne",
        "Ursula", "Vane", "Wren", "Xander", "Yara", "Zephyr", "Alaric", "Beatrix", "Cyrus", "Dora"
    ];

    const NUM_CHAPTERS = 20;
    const rng = d3.randomLcg(123);
    const randInt = (min, max) => Math.floor(rng() * (max - min + 1)) + min;

    // Characters with random first appearance
    const nodes = characterNames.map((name, i) => ({
        id: i,
        name: name,
        firstChapter: randInt(1, 15), // Characters mostly appear early to mid
        importance: randInt(2, 10)
    }));

    // Sort nodes by first chapter appearance, then name
    nodes.sort((a, b) => a.firstChapter - b.firstChapter || a.name.localeCompare(b.name));
    
    // Assign index based on order
    nodes.forEach((node, i) => node.index = i);

    // Generate co-occurrences (links)
    const links = [];
    const linkMap = new Set();

    for (let i = 0; i < nodes.length; i++) {
        // Each character has 2-6 connections
        const numConns = randInt(2, 6);
        for (let j = 0; j < numConns; j++) {
            const targetIdx = randInt(0, nodes.length - 1);
            if (targetIdx === i) continue;
            
            const [s, t] = i < targetIdx ? [i, targetIdx] : [targetIdx, i];
            const key = `${s}-${t}`;
            
            if (!linkMap.has(key)) {
                linkMap.add(key);
                // Weight is somewhat related to chapter proximity or importance
                const dist = Math.abs(nodes[s].firstChapter - nodes[t].firstChapter);
                const weight = Math.max(1, randInt(1, 10) - Math.floor(dist / 3));
                links.push({
                    source: nodes[s],
                    target: nodes[t],
                    weight: weight,
                    key: key
                });
            }
        }
    }

    // --- Visualization Setup ---
    const container = d3.select("#chart");
    const width = container.node().clientWidth;
    const height = container.node().clientHeight;
    const margin = { top: 40, right: 60, bottom: 120, left: 60 };

    const svg = container.append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height]);

    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const x = d3.scalePoint()
        .domain(nodes.map(d => d.name))
        .range([0, innerWidth]);

    const weightScale = d3.scaleLinear()
        .domain([1, d3.max(links, d => d.weight)])
        .range([2, 8]); // Stroke width

    const heightScale = d3.scaleLinear()
        .domain([1, d3.max(links, d => d.weight)])
        .range([50, innerHeight * 0.8]); // Arc height

    const colorScale = d3.scaleSequential(d3.interpolateCool)
        .domain([1, NUM_CHAPTERS]);

    const chartG = svg.append("g")
        .attr("transform", `translate(${margin.left}, ${margin.top + innerHeight})`);

    // --- Drawing ---

    // Arcs
    const arcs = chartG.append("g")
        .selectAll("path")
        .data(links)
        .join("path")
        .attr("class", "arc")
        .attr("d", d => {
            const start = x(d.source.name);
            const end = x(d.target.name);
            const arcH = heightScale(d.weight);
            // Quadratic Bezier: M start,0 Q middle,-height end,0
            return `M ${start},0 Q ${(start + end) / 2},${-arcH} ${end},0`;
        })
        .attr("fill", "none")
        .attr("stroke", d => d3.interpolateLab(colorScale(d.source.firstChapter), colorScale(d.target.firstChapter))(0.5))
        .attr("stroke-width", d => weightScale(d.weight))
        .attr("stroke-opacity", 0.3)
        .style("transition", "stroke-opacity 0.2s, stroke 0.2s");

    // Nodes
    const nodeG = chartG.append("g")
        .selectAll("g")
        .data(nodes)
        .join("g")
        .attr("transform", d => `translate(${x(d.name)}, 0)`);

    const nodeCircles = nodeG.append("circle")
        .attr("r", d => 4 + d.importance / 2)
        .attr("fill", d => colorScale(d.firstChapter))
        .attr("stroke", "var(--node-stroke)")
        .attr("stroke-width", 2)
        .style("cursor", "pointer");

    const nodeLabels = nodeG.append("text")
        .attr("class", "node-label")
        .attr("transform", "rotate(45)")
        .attr("x", 10)
        .attr("y", 5)
        .text(d => d.name);

    // Chapter Axis
    const chapterScale = d3.scaleLinear()
        .domain([1, NUM_CHAPTERS])
        .range([0, innerWidth]);

    const axisG = svg.append("g")
        .attr("transform", `translate(${margin.left}, ${height - 40})`);

    axisG.call(d3.axisBottom(chapterScale).ticks(20).tickFormat(d => `Ch ${d}`))
        .call(g => g.select(".domain").attr("stroke", "var(--grid-color)"))
        .call(g => g.selectAll(".tick line").attr("stroke", "var(--grid-color)"))
        .call(g => g.selectAll(".tick text").attr("fill", "var(--secondary-text)").attr("font-size", "9px"));

    axisG.append("text")
        .attr("class", "axis-label")
        .attr("x", innerWidth / 2)
        .attr("y", 35)
        .attr("text-anchor", "middle")
        .text("Appearance Chapter");

    // --- Interactions ---

    const tooltip = d3.select("#tooltip");

    nodeCircles
        .on("mouseover", function(event, d) {
            const connectedLinks = links.filter(l => l.source.id === d.id || l.target.id === d.id);
            const connectedNodeIds = new Set(connectedLinks.flatMap(l => [l.source.id, l.target.id]));

            arcs.style("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.05)
                .style("stroke", l => (l.source.id === d.id || l.target.id === d.id) ? "var(--accent-color)" : null);

            nodeCircles.style("opacity", n => connectedNodeIds.has(n.id) ? 1 : 0.2);
            nodeLabels.style("opacity", n => connectedNodeIds.has(n.id) ? 1 : 0.2);

            tooltip.style("opacity", 1)
                .html(`<strong>${d.name}</strong><br>First appearance: Chapter ${d.firstChapter}<br>Connections: ${connectedLinks.length}`)
                .style("left", `${event.pageX + 15}px`)
                .style("top", `${event.pageY - 28}px`);
            
            d3.select(this).attr("stroke", "var(--accent-color)").attr("stroke-width", 3);
        })
        .on("mousemove", function(event) {
            tooltip.style("left", `${event.pageX + 15}px`)
                .style("top", `${event.pageY - 28}px`);
        })
        .on("mouseout", function() {
            arcs.style("stroke-opacity", 0.3).style("stroke", null);
            nodeCircles.style("opacity", 1).attr("stroke", "var(--node-stroke)").attr("stroke-width", 2);
            nodeLabels.style("opacity", 1);
            tooltip.style("opacity", 0);
        });

    // --- Brush ---
    const brush = d3.brushX()
        .extent([[0, -10], [innerWidth, 20]])
        .on("brush end", brushed);

    const brushG = axisG.append("g")
        .attr("class", "brush")
        .call(brush);

    function brushed(event) {
        const selection = event.selection;
        if (!selection) {
            arcs.attr("display", null);
            nodeCircles.attr("display", null);
            nodeLabels.attr("display", null);
            d3.select("#brush-info").text("Showing all chapters (1–20)");
            return;
        }

        const [x0, x1] = selection.map(chapterScale.invert);
        const chStart = Math.round(x0);
        const chEnd = Math.round(x1);

        d3.select("#brush-info").text(`Chapters ${chStart}–${chEnd}`);

        nodeCircles.attr("display", d => (d.firstChapter >= chStart && d.firstChapter <= chEnd) ? null : "none");
        nodeLabels.attr("display", d => (d.firstChapter >= chStart && d.firstChapter <= chEnd) ? null : "none");
        
        arcs.attr("display", l => {
            const sInRange = l.source.firstChapter >= chStart && l.source.firstChapter <= chEnd;
            const tInRange = l.target.firstChapter >= chStart && l.target.firstChapter <= chEnd;
            return (sInRange && tInRange) ? null : "none";
        });
    }

</script>
</body>
</html>
