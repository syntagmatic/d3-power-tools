<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block × Skill Matrix</title>
    <link rel="stylesheet" href="../../style/d3-power-tools.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: var(--sp-4);
        }

        .header {
            margin-bottom: var(--sp-4);
            flex-shrink: 0;
        }

        .container {
            flex-grow: 1;
            position: relative;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            overflow: hidden;
            border-radius: var(--radius);
        }

        .chart-svg {
            cursor: grab;
            width: 100%;
            height: 100%;
        }

        .chart-svg:active {
            cursor: grabbing;
        }

        .cell {
            stroke: var(--color-border-light);
            stroke-width: 0.5px;
        }

        .cell.active {
            fill: var(--color-cat-1);
        }

        .cell.inactive {
            fill: var(--color-bg);
        }

        .cell:hover {
            fill: var(--color-cat-2);
            opacity: 0.8;
        }

        .label {
            font-size: 10px;
            fill: var(--color-text-muted);
            pointer-events: none;
            font-family: var(--font-sans);
        }

        .label.active {
            fill: var(--color-text);
            font-weight: 600;
        }

        .row-hover, .col-hover {
            fill: var(--color-hover-bg);
            pointer-events: none;
        }

        .legend {
            display: flex;
            gap: var(--sp-4);
            font-size: 12px;
            margin-top: var(--sp-2);
            color: var(--color-text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
        }

        .legend-box {
            width: 12px;
            height: 12px;
            border: 1px solid var(--color-border-light);
        }

        .legend-box.active {
            background: var(--color-cat-1);
        }

        .tooltip-content b {
            display: block;
            margin-bottom: 4px;
            color: var(--color-cat-1);
        }

        .tooltip-content i {
            font-size: 11px;
            color: var(--color-text-faint);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Block <b>×</b> Skill Matrix</h1>
        <p class="subtitle">Adjacency matrix mapping 105 visualization blocks to 28 D3.js skills.</p>
        
        <div class="controls" style="margin-top: var(--sp-4);">
            <label>Sort Rows:</label>
            <button id="sort-id" class="active">By ID</button>
            <button id="sort-name">By Name</button>
            <button id="sort-count">By Skill Count</button>
            
            <label style="margin-left: var(--sp-4);">Sort Cols:</label>
            <button id="sort-col-alpha" class="active">Alphabetical</button>
            <button id="sort-col-usage">By Usage</button>

            <button id="reset-zoom" style="margin-left: auto;">Reset Zoom</button>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box active"></div>
                <span>Skill utilized</span>
            </div>
            <div class="legend-item">
                <div class="legend-box"></div>
                <span>Not used</span>
            </div>
            <div class="legend-item" style="margin-left: auto;">
                <span>Scroll to zoom, drag to pan</span>
            </div>
        </div>
    </div>

    <div class="container">
        <svg id="matrix" class="chart-svg"></svg>
        <div id="tooltip" class="tooltip"></div>
    </div>

    { "id": "102", "name": "Earthquake Depth Globe", "skills": ["cartography", "distributions", "canvas"] },
    { "id": "103", "name": "Book Sentence Rhythm", "skills": ["sparkcharts", "distributions", "small-multiples"] },
    { "id": "104", "name": "Nutrient Treemap Explorer", "skills": ["hierarchy-interaction", "parallel-coordinates", "linked-views"] },
    { "id": "105", "name": "Migration Flow Chord", "skills": ["network", "time-series", "motion"] }

        const allSkills = [
            "annotation", "brushing", "canvas", "canvas-accessibility", "cartography", 
            "choreography", "color", "coordination", "data-gathering", "data-table", 
            "distributions", "edge-bundling", "force", "hierarchy-interaction", 
            "hierarchy-layouts", "linked-views", "motion", "navigation", "network", 
            "parallel-coordinates", "responsive", "scales", "shape-morphing", 
            "small-multiples", "sparkcharts", "time-series", "visual-texture", "webgl"
        ];

        // Prepare data
        const blocks = manifest.blocks.map(d => ({
            ...d,
            skillCount: d.skills.length
        }));

        const skillUsage = allSkills.map(skill => ({
            name: skill,
            count: blocks.filter(b => b.skills.includes(skill)).length
        }));

        const margin = { top: 120, right: 20, bottom: 20, left: 220 };
        const cellSize = 18;
        
        const width = allSkills.length * cellSize;
        const height = blocks.length * cellSize;

        const svg = d3.select("#matrix")
            .attr("viewBox", [0, 0, width + margin.left + margin.right, height + margin.top + margin.bottom]);

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Containers for labels and matrix
        const rowG = g.append("g").attr("class", "rows");
        const colG = g.append("g").attr("class", "cols");
        const cellG = g.append("g").attr("class", "cells");
        
        // Hover highlights
        const rowHover = cellG.append("rect").attr("class", "row-hover").attr("width", width).attr("height", cellSize).style("opacity", 0);
        const colHover = cellG.append("rect").attr("class", "col-hover").attr("width", cellSize).attr("height", height).style("opacity", 0);

        // Scales
        const x = d3.scaleBand().domain(allSkills).range([0, width]);
        const y = d3.scaleBand().domain(blocks.map(d => d.id)).range([0, height]);

        // Draw Column Labels
        function updateCols() {
            const cols = colG.selectAll(".col-label")
                .data(allSkills, d => d)
                .join("g")
                .attr("class", "col-label")
                .attr("transform", d => `translate(${x(d) + x.bandwidth() / 2}, 0)`);

            cols.append("text")
                .attr("class", "label")
                .attr("transform", "rotate(-45)")
                .attr("x", 5)
                .attr("y", -5)
                .style("text-anchor", "start")
                .text(d => d);
        }

        // Draw Row Labels
        function updateRows() {
            const rows = rowG.selectAll(".row-label")
                .data(blocks, d => d.id)
                .join("g")
                .attr("class", "row-label")
                .attr("transform", d => `translate(0, ${y(d.id) + y.bandwidth() / 2})`);

            rows.selectAll("text").remove();
            
            rows.append("text")
                .attr("class", "label")
                .attr("x", -10)
                .attr("dy", "0.35em")
                .style("text-anchor", "end")
                .text(d => `${d.id} ${d.name}`);
        }

        // Draw Cells
        function updateCells() {
            const rows = cellG.selectAll(".matrix-row")
                .data(blocks, d => d.id)
                .join("g")
                .attr("class", "matrix-row")
                .attr("transform", d => `translate(0, ${y(d.id)})`);

            const cells = rows.selectAll(".cell")
                .data(d => allSkills.map(skill => ({ 
                    skill, 
                    blockId: d.id, 
                    blockName: d.name,
                    active: d.skills.includes(skill) 
                })), d => d.skill)
                .join("rect")
                .attr("class", d => `cell ${d.active ? 'active' : 'inactive'}`)
                .attr("x", d => x(d.skill))
                .attr("width", x.bandwidth())
                .attr("height", y.bandwidth())
                .on("mouseenter", (event, d) => {
                    rowHover.attr("y", y(d.blockId)).style("opacity", 1);
                    colHover.attr("x", x(d.skill)).style("opacity", 1);
                    
                    d3.select("#tooltip")
                        .classed("visible", true)
                        .html(`
                            <div class="tooltip-content">
                                <b>${d.blockId}. ${d.blockName}</b>
                                Skill: ${d.skill}<br>
                                <i>${d.active ? "Utilized" : "Not used"}</i>
                            </div>
                        `);
                    
                    // Highlight labels
                    colG.selectAll(".label").classed("active", l => l === d.skill);
                    rowG.selectAll(".label").classed("active", l => l.id === d.blockId);
                })
                .on("mousemove", (event) => {
                    d3.select("#tooltip")
                        .style("left", (event.pageX + 15) + "px")
                        .style("top", (event.pageY - 15) + "px");
                })
                .on("mouseleave", () => {
                    rowHover.style("opacity", 0);
                    colHover.style("opacity", 0);
                    d3.select("#tooltip").classed("visible", false);
                    colG.selectAll(".label").classed("active", false);
                    rowG.selectAll(".label").classed("active", false);
                });
        }

        updateCols();
        updateRows();
        updateCells();

        // Zoom functionality
        const zoom = d3.zoom()
            .scaleExtent([0.1, 5])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        // Initial view
        const container = d3.select(".container").node();
        const initialScale = 0.6;
        svg.call(zoom.transform, d3.zoomIdentity.translate(20, 20).scale(initialScale));

        // Sorting logic
        d3.select("#sort-id").on("click", function() {
            setBtnActive(this);
            y.domain(blocks.sort((a, b) => d3.ascending(a.id, b.id)).map(d => d.id));
            transition();
        });

        d3.select("#sort-name").on("click", function() {
            setBtnActive(this);
            y.domain(blocks.sort((a, b) => d3.ascending(a.name, b.name)).map(d => d.id));
            transition();
        });

        d3.select("#sort-count").on("click", function() {
            setBtnActive(this);
            y.domain(blocks.sort((a, b) => d3.descending(a.skillCount, b.skillCount) || d3.ascending(a.id, b.id)).map(d => d.id));
            transition();
        });

        d3.select("#sort-col-alpha").on("click", function() {
            setBtnActive(this);
            x.domain(allSkills.sort(d3.ascending));
            transition();
        });

        d3.select("#sort-col-usage").on("click", function() {
            setBtnActive(this);
            x.domain(skillUsage.sort((a, b) => d3.descending(a.count, b.count) || d3.ascending(a.name, b.name)).map(d => d.name));
            transition();
        });

        d3.select("#reset-zoom").on("click", () => {
            svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(20, 20).scale(initialScale));
        });

        function setBtnActive(btn) {
            d3.select(btn.parentNode).selectAll("button").classed("active", false);
            d3.select(btn).classed("active", true);
        }

        function transition() {
            const t = svg.transition().duration(750);
            
            rowG.selectAll(".row-label")
                .transition(t)
                .attr("transform", d => `translate(0, ${y(d.id) + y.bandwidth() / 2})`);

            colG.selectAll(".col-label")
                .transition(t)
                .attr("transform", d => `translate(${x(d) + x.bandwidth() / 2}, 0)`);

            cellG.selectAll(".matrix-row")
                .transition(t)
                .attr("transform", d => `translate(0, ${y(d.id)})`);

            cellG.selectAll(".cell")
                .transition(t)
                .attr("x", d => x(d.skill));
                
            colHover.transition(t).attr("width", x.bandwidth());
            rowHover.transition(t).attr("height", y.bandwidth());
        }

    </script>
</body>
</html>
