<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marimekko Chart - Market Share Analysis</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --tooltip-bg: rgba(255, 255, 255, 0.95);
            --tooltip-shadow: 0 4px 12px rgba(0,0,0,0.15);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 960px;
        }

        h1 {
            font-weight: 300;
            margin-bottom: 10px;
            text-align: center;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        #chart {
            width: 100%;
            height: 600px;
            position: relative;
        }

        .segment {
            stroke: #fff;
            stroke-width: 1px;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .segment:hover {
            opacity: 0.85;
            stroke: #000;
            stroke-width: 1.5px;
        }

        .label {
            font-size: 11px;
            pointer-events: none;
            fill: #fff;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .axis-label {
            font-size: 12px;
            fill: #444;
            font-weight: 600;
        }

        .tooltip {
            position: absolute;
            padding: 10px 14px;
            background: var(--tooltip-bg);
            border: 1px solid #ddd;
            border-radius: 4px;
            pointer-events: none;
            font-size: 13px;
            box-shadow: var(--tooltip-shadow);
            z-index: 10;
            display: none;
            line-height: 1.4;
        }

        .tooltip b {
            display: block;
            margin-bottom: 4px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 12px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            margin-right: 6px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Market Share Analysis</h1>
        <p class="description">Marimekko Chart: Column widths represent category total market size. Segment heights represent subcategory share within each category.</p>
        <div id="chart"></div>
        <div class="legend" id="legend"></div>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <script>
        const data = {
            name: "Market",
            children: [
                {
                    name: "Tech Giants",
                    children: [
                        { name: "Hardware", value: 450 },
                        { name: "Software", value: 320 },
                        { name: "Cloud", value: 280 },
                        { name: "Ads", value: 150 }
                    ]
                },
                {
                    name: "Retail Leaders",
                    children: [
                        { name: "Hardware", value: 120 },
                        { name: "Software", value: 40 },
                        { name: "Cloud", value: 10 },
                        { name: "Ads", value: 80 }
                    ]
                },
                {
                    name: "Financials",
                    children: [
                        { name: "Hardware", value: 30 },
                        { name: "Software", value: 210 },
                        { name: "Cloud", value: 90 },
                        { name: "Ads", value: 40 }
                    ]
                },
                {
                    name: "Automotive",
                    children: [
                        { name: "Hardware", value: 540 },
                        { name: "Software", value: 110 },
                        { name: "Cloud", value: 30 },
                        { name: "Ads", value: 20 }
                    ]
                },
                {
                    name: "Healthcare",
                    children: [
                        { name: "Hardware", value: 180 },
                        { name: "Software", value: 160 },
                        { name: "Cloud", value: 40 },
                        { name: "Ads", value: 10 }
                    ]
                }
            ]
        };

        const width = 960;
        const height = 500;
        const margin = { top: 40, right: 10, bottom: 40, left: 10 };

        const svg = d3.select("#chart")
            .append("svg")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("width", "100%")
            .attr("height", "100%");

        const tooltip = d3.select("#tooltip");

        // Hierarchy and Treemap
        const root = d3.hierarchy(data)
            .sum(d => d.value)
            .sort((a, b) => b.value - a.value);

        const treemap = d3.treemap()
            .size([width - margin.left - margin.right, height - margin.top - margin.bottom])
            .tile(d3.treemapSliceDice)
            .paddingInner(0);

        treemap(root);

        // Colors
        const subcategories = Array.from(new Set(data.children.flatMap(c => c.children.map(s => s.name))));
        const color = d3.scaleOrdinal()
            .domain(subcategories)
            .range(d3.schemeTableau10);

        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // Draw segments
        const leaf = g.selectAll(".leaf")
            .data(root.leaves())
            .join("g")
            .attr("class", "leaf")
            .attr("transform", d => `translate(${d.x0},${d.y0})`);

        leaf.append("rect")
            .attr("class", "segment")
            .attr("fill", d => color(d.data.name))
            .attr("width", d => d.x1 - d.x0)
            .attr("height", d => d.y1 - d.y0)
            .on("mouseover", function(event, d) {
                const categoryTotal = d.parent.value;
                const grandTotal = root.value;
                const catPercent = (categoryTotal / grandTotal * 100).toFixed(1);
                const subPercent = (d.value / categoryTotal * 100).toFixed(1);
                const totalPercent = (d.value / grandTotal * 100).toFixed(1);

                tooltip.style("display", "block")
                    .html(`
                        <b>${d.parent.data.name} &rsaquo; ${d.data.name}</b>
                        Value: ${d.value}M<br/>
                        Share of Category: ${subPercent}%<br/>
                        Share of Market: ${totalPercent}%<br/>
                        Category Size: ${categoryTotal}M (${catPercent}%)
                    `);
            })
            .on("mousemove", function(event) {
                const containerRect = document.getElementById("chart").getBoundingClientRect();
                tooltip.style("left", (event.clientX - containerRect.left + 15) + "px")
                       .style("top", (event.clientY - containerRect.top + 15) + "px");
            })
            .on("mouseout", () => tooltip.style("display", "none"));

        // Add labels for segments (only if they fit)
        leaf.append("text")
            .attr("class", "label")
            .attr("x", 5)
            .attr("y", 15)
            .text(d => (d.x1 - d.x0 > 40 && d.y1 - d.y0 > 20) ? d.data.name : "")
            .attr("clip-path", d => `inset(0 ${d.x1 - d.x0} ${d.y1 - d.y0} 0)`);

        // Category labels (on top)
        const categories = root.children;
        g.selectAll(".category-label")
            .data(categories)
            .join("text")
            .attr("class", "axis-label")
            .attr("x", d => d.x0 + 5)
            .attr("y", -10)
            .text(d => (d.x1 - d.x0 > 50) ? d.data.name : (d.x1 - d.x0 > 20 ? d.data.name.substring(0, 1) : ""));

        // Value labels for columns (on bottom)
        g.selectAll(".value-label")
            .data(categories)
            .join("text")
            .attr("class", "axis-label")
            .attr("x", d => d.x0 + 5)
            .attr("y", height - margin.top - margin.bottom + 20)
            .text(d => (d.x1 - d.x0 > 40) ? `${Math.round(d.value / root.value * 100)}%` : "");

        // Legend
        const legend = d3.select("#legend");
        subcategories.forEach(sub => {
            const item = legend.append("div").attr("class", "legend-item");
            item.append("div")
                .attr("class", "legend-color")
                .style("background-color", color(sub));
            item.append("span").text(sub);
        });

    </script>
</body>
</html>
