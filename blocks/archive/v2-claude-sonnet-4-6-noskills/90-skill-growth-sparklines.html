<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Growth Sparklines</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 32px 24px;
  }

  .header {
    margin-bottom: 28px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 600;
    color: #f8fafc;
    letter-spacing: -0.3px;
  }

  .header p {
    font-size: 13px;
    color: #64748b;
    margin-top: 5px;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid #1e293b;
    background: #1a1f2e;
    color: #94a3b8;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { background: #1e293b; color: #cbd5e1; }
  .filter-btn.active { background: #1e40af; border-color: #2563eb; color: #bfdbfe; }

  .search-box {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #1e293b;
    background: #1a1f2e;
    color: #e2e8f0;
    font-size: 13px;
    outline: none;
    width: 200px;
    transition: border-color 0.15s;
  }
  .search-box::placeholder { color: #475569; }
  .search-box:focus { border-color: #2563eb; }

  .table-wrapper {
    border-radius: 10px;
    border: 1px solid #1e293b;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead {
    background: #141924;
  }

  th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: #475569;
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
    border-bottom: 1px solid #1e293b;
    transition: color 0.15s;
  }

  th:hover { color: #94a3b8; }
  th.sorted { color: #60a5fa; }

  th .sort-icon {
    display: inline-block;
    margin-left: 4px;
    opacity: 0.4;
    font-size: 10px;
  }
  th.sorted .sort-icon { opacity: 1; }

  tbody tr {
    border-bottom: 1px solid #0d1117;
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #141924; }

  td {
    padding: 9px 14px;
    font-size: 13px;
    vertical-align: middle;
  }

  .skill-name {
    font-weight: 500;
    color: #e2e8f0;
    white-space: nowrap;
  }

  .category-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }

  .score-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-bar-bg {
    flex: 1;
    height: 4px;
    background: #1e293b;
    border-radius: 2px;
    min-width: 60px;
    max-width: 80px;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }

  .score-value {
    font-size: 12px;
    font-weight: 600;
    min-width: 28px;
    text-align: right;
    color: #94a3b8;
  }

  .sparkline-cell {
    width: 120px;
  }

  .sparkline-cell svg {
    display: block;
  }

  .delta-cell {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .delta-positive { color: #34d399; }
  .delta-negative { color: #f87171; }
  .delta-neutral { color: #64748b; }

  .trend-icon {
    font-size: 14px;
  }

  .summary-bar {
    display: flex;
    gap: 24px;
    padding: 12px 0;
    margin-bottom: 16px;
  }

  .summary-stat {
    text-align: center;
  }

  .summary-stat .value {
    font-size: 22px;
    font-weight: 700;
    color: #f8fafc;
    line-height: 1;
  }

  .summary-stat .label {
    font-size: 11px;
    color: #475569;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .no-results {
    text-align: center;
    color: #475569;
    padding: 40px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Skill Growth Tracker</h1>
  <p>D3 visualization skills — 8-quarter growth curves, sortable by any column</p>
</div>

<div class="summary-bar" id="summary-bar"></div>

<div class="controls">
  <input class="search-box" id="search" type="text" placeholder="Search skills…">
  <div class="filter-group" id="filter-group"></div>
</div>

<div class="table-wrapper">
  <table id="skill-table">
    <thead>
      <tr>
        <th data-col="name">Skill <span class="sort-icon">↕</span></th>
        <th data-col="category">Category <span class="sort-icon">↕</span></th>
        <th data-col="current" style="text-align:right">Score <span class="sort-icon">↕</span></th>
        <th data-col="sparkline" style="cursor:default">Growth (8 qtrs)</th>
        <th data-col="delta">Δ Last Qtr <span class="sort-icon">↕</span></th>
        <th data-col="trend">Trend <span class="sort-icon">↕</span></th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script type="module">
const SKILLS = [
  { name: "parallel-coordinates", category: "Patterns",   series: [42, 48, 53, 61, 67, 72, 79, 84] },
  { name: "brushing",             category: "Patterns",   series: [38, 44, 50, 58, 63, 70, 74, 80] },
  { name: "linked-views",         category: "Patterns",   series: [30, 36, 42, 50, 56, 62, 68, 75] },
  { name: "distributions",        category: "Patterns",   series: [55, 60, 65, 68, 71, 75, 78, 82] },
  { name: "hierarchy-layouts",    category: "Structure",  series: [48, 54, 60, 65, 70, 74, 77, 81] },
  { name: "hierarchy-interaction",category: "Structure",  series: [35, 40, 46, 52, 58, 64, 69, 76] },
  { name: "edge-bundling",        category: "Structure",  series: [28, 34, 42, 49, 55, 60, 65, 71] },
  { name: "force",                category: "Structure",  series: [50, 55, 60, 65, 70, 75, 79, 85] },
  { name: "network",              category: "Structure",  series: [44, 50, 55, 60, 65, 70, 74, 79] },
  { name: "cartography",          category: "Place",      series: [32, 38, 45, 52, 59, 65, 71, 78] },
  { name: "time-series",          category: "Change",     series: [60, 64, 68, 71, 74, 77, 80, 84] },
  { name: "motion",               category: "Change",     series: [45, 50, 56, 61, 65, 69, 73, 78] },
  { name: "shape-morphing",       category: "Change",     series: [22, 28, 34, 41, 48, 54, 60, 67] },
  { name: "scales",               category: "Legibility", series: [65, 70, 73, 76, 79, 81, 83, 86] },
  { name: "color",                category: "Legibility", series: [58, 63, 67, 71, 74, 77, 80, 83] },
  { name: "visual-texture",       category: "Legibility", series: [20, 26, 33, 40, 47, 54, 61, 69] },
  { name: "annotation",           category: "Legibility", series: [40, 46, 52, 57, 62, 67, 72, 77] },
  { name: "data-table",           category: "Legibility", series: [50, 54, 58, 62, 66, 70, 73, 77] },
  { name: "canvas-accessibility", category: "Legibility", series: [18, 24, 30, 37, 44, 51, 58, 65] },
  { name: "canvas",               category: "Performance",series: [55, 60, 65, 70, 74, 77, 81, 85] },
  { name: "webgl",                category: "Performance",series: [15, 22, 30, 38, 46, 54, 62, 70] },
  { name: "navigation",           category: "Performance",series: [52, 57, 62, 66, 70, 74, 77, 81] },
  { name: "responsive",           category: "Performance",series: [48, 53, 58, 63, 67, 71, 75, 79] },
  { name: "data-gathering",       category: "Before",     series: [62, 65, 68, 71, 73, 75, 77, 80] },
  { name: "sparkcharts",          category: "Before",     series: [45, 50, 55, 60, 65, 70, 75, 80] },
  { name: "small-multiples",      category: "Before",     series: [40, 46, 52, 57, 62, 67, 72, 77] },
];

// Add some noise to make series more organic
const rng = (seed) => {
  let s = seed;
  return () => { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
};

SKILLS.forEach((d, i) => {
  const rand = rng(i * 31 + 7);
  d.series = d.series.map(v => Math.max(5, Math.min(99, v + (rand() - 0.5) * 6)));
  d.current = d.series[d.series.length - 1];
  d.delta = d.series[d.series.length - 1] - d.series[d.series.length - 2];
  const slope = d3.leastSquares(d3.range(d.series.length), d.series);
  d.trend = slope[0] > 1.5 ? "rising" : slope[0] < -0.5 ? "falling" : "steady";
});

// Category metadata
const CATEGORY_COLORS = {
  "Patterns":    { bg: "#1e3a5f", text: "#60a5fa" },
  "Structure":   { bg: "#1a3a2a", text: "#34d399" },
  "Place":       { bg: "#2d2a1a", text: "#fbbf24" },
  "Change":      { bg: "#2a1a3a", text: "#a78bfa" },
  "Legibility":  { bg: "#3a1a2a", text: "#f472b6" },
  "Performance": { bg: "#1a2a3a", text: "#38bdf8" },
  "Before":      { bg: "#2a2a1a", text: "#d4a855" },
};

const CATEGORIES = Object.keys(CATEGORY_COLORS);

// State
let sortCol = "current";
let sortDir = -1; // -1 = desc, 1 = asc
let activeCategory = "All";
let searchQuery = "";

// Sparkline renderer
function renderSparkline(container, series, trend) {
  const W = 120, H = 32;
  const x = d3.scaleLinear().domain([0, series.length - 1]).range([2, W - 2]);
  const y = d3.scaleLinear().domain([0, 100]).range([H - 2, 2]);

  const line = d3.line()
    .x((_, i) => x(i))
    .y(d => y(d))
    .curve(d3.curveCatmullRom.alpha(0.5));

  const area = d3.area()
    .x((_, i) => x(i))
    .y0(H - 2)
    .y1(d => y(d))
    .curve(d3.curveCatmullRom.alpha(0.5));

  const strokeColor = trend === "rising" ? "#34d399"
    : trend === "falling" ? "#f87171"
    : "#60a5fa";

  const fillColor = trend === "rising" ? "#34d39920"
    : trend === "falling" ? "#f8717120"
    : "#60a5fa18";

  const svg = d3.select(container)
    .append("svg")
    .attr("width", W)
    .attr("height", H)
    .attr("viewBox", `0 0 ${W} ${H}`);

  // Area fill
  svg.append("path")
    .datum(series)
    .attr("d", area)
    .attr("fill", fillColor);

  // Line
  svg.append("path")
    .datum(series)
    .attr("d", line)
    .attr("fill", "none")
    .attr("stroke", strokeColor)
    .attr("stroke-width", 1.5)
    .attr("stroke-linecap", "round");

  // Terminal dot
  const last = series[series.length - 1];
  svg.append("circle")
    .attr("cx", x(series.length - 1))
    .attr("cy", y(last))
    .attr("r", 2.5)
    .attr("fill", strokeColor);
}

function scoreColor(v) {
  if (v >= 80) return "#34d399";
  if (v >= 65) return "#60a5fa";
  if (v >= 50) return "#fbbf24";
  return "#f87171";
}

function render() {
  const query = searchQuery.toLowerCase();

  let data = SKILLS.filter(d => {
    if (activeCategory !== "All" && d.category !== activeCategory) return false;
    if (query && !d.name.toLowerCase().includes(query) && !d.category.toLowerCase().includes(query)) return false;
    return true;
  });

  data.sort((a, b) => {
    let av, bv;
    if (sortCol === "name") { av = a.name; bv = b.name; }
    else if (sortCol === "category") { av = a.category; bv = b.category; }
    else if (sortCol === "current") { av = a.current; bv = b.current; }
    else if (sortCol === "delta") { av = a.delta; bv = b.delta; }
    else if (sortCol === "trend") { av = a.trend; bv = b.trend; }
    else return 0;

    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  if (data.length === 0) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="6" class="no-results">No matching skills</td>`;
    tbody.appendChild(tr);
    return;
  }

  data.forEach(d => {
    const catStyle = CATEGORY_COLORS[d.category] || { bg: "#1e293b", text: "#94a3b8" };
    const sc = scoreColor(d.current);
    const deltaSign = d.delta > 0 ? "+" : "";
    const deltaClass = d.delta > 1.5 ? "delta-positive" : d.delta < -1 ? "delta-negative" : "delta-neutral";
    const trendIcon = d.trend === "rising" ? "↗" : d.trend === "falling" ? "↘" : "→";
    const trendClass = d.trend === "rising" ? "delta-positive" : d.trend === "falling" ? "delta-negative" : "delta-neutral";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="skill-name">${d.name}</span></td>
      <td>
        <span class="category-badge" style="background:${catStyle.bg};color:${catStyle.text}">
          ${d.category}
        </span>
      </td>
      <td>
        <div class="score-cell">
          <div class="score-bar-bg">
            <div class="score-bar-fill" style="width:${d.current}%;background:${sc}"></div>
          </div>
          <span class="score-value" style="color:${sc}">${Math.round(d.current)}</span>
        </div>
      </td>
      <td class="sparkline-cell" data-sparkline></td>
      <td><span class="${deltaClass}">${deltaSign}${d.delta.toFixed(1)}</span></td>
      <td><span class="trend-icon ${trendClass}">${trendIcon} ${d.trend}</span></td>
    `;

    tbody.appendChild(tr);
    renderSparkline(tr.querySelector("[data-sparkline]"), d.series, d.trend);
  });

  // Update sort icons
  document.querySelectorAll("th[data-col]").forEach(th => {
    const col = th.dataset.col;
    th.classList.toggle("sorted", col === sortCol);
    const icon = th.querySelector(".sort-icon");
    if (icon) {
      if (col === sortCol) {
        icon.textContent = sortDir === -1 ? "↓" : "↑";
      } else {
        icon.textContent = "↕";
      }
    }
  });

  // Update summary
  renderSummary(data);
}

function renderSummary(data) {
  const avgScore = data.length ? d3.mean(data, d => d.current) : 0;
  const rising = data.filter(d => d.trend === "rising").length;
  const avgDelta = data.length ? d3.mean(data, d => d.delta) : 0;
  const top = data.length ? d3.max(data, d => d.current) : 0;

  document.getElementById("summary-bar").innerHTML = `
    <div class="summary-stat">
      <div class="value">${data.length}</div>
      <div class="label">Skills</div>
    </div>
    <div class="summary-stat">
      <div class="value" style="color:#60a5fa">${Math.round(avgScore)}</div>
      <div class="label">Avg Score</div>
    </div>
    <div class="summary-stat">
      <div class="value" style="color:#34d399">${rising}</div>
      <div class="label">Rising</div>
    </div>
    <div class="summary-stat">
      <div class="value" style="color:${avgDelta >= 0 ? '#34d399' : '#f87171'}">${avgDelta >= 0 ? "+" : ""}${avgDelta.toFixed(1)}</div>
      <div class="label">Avg Δ</div>
    </div>
    <div class="summary-stat">
      <div class="value" style="color:#34d399">${Math.round(top)}</div>
      <div class="label">Top Score</div>
    </div>
  `;
}

// Build category filters
function buildFilters() {
  const fg = document.getElementById("filter-group");
  ["All", ...CATEGORIES].forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat === activeCategory ? " active" : "");
    btn.textContent = cat;
    btn.addEventListener("click", () => {
      activeCategory = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
    fg.appendChild(btn);
  });
}

// Sort on header click
document.querySelectorAll("th[data-col]").forEach(th => {
  if (th.dataset.col === "sparkline") return;
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortDir *= -1;
    } else {
      sortCol = col;
      sortDir = col === "name" || col === "category" ? 1 : -1;
    }
    render();
  });
});

// Search
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  render();
});

// Init
buildFilters();
render();
</script>
</body>
</html>
