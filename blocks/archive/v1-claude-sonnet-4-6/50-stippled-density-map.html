<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stippled Density Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e8;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px 0;
  }
  h1 { font-size: 20px; color: #2a2a2a; letter-spacing: 0.02em; margin-bottom: 2px; }
  .subtitle { font-size: 13px; color: #777; font-weight: 400; margin-bottom: 12px; }
  #map-container { position: relative; }
  canvas, svg { position: absolute; top: 0; left: 0; }
  .tooltip {
    position: absolute; pointer-events: none; background: rgba(255,255,255,0.96);
    border: 1px solid #bbb; border-radius: 5px; padding: 8px 12px; font-size: 12.5px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10); display: none; line-height: 1.6;
    color: #333; max-width: 220px; z-index: 10;
  }
  .tooltip strong { font-size: 13.5px; color: #1a1a1a; }
  .tooltip .num { font-family: "SF Mono", Monaco, "Cascadia Code", monospace; font-size: 12px; }
  .tooltip .label { color: #888; font-size: 11.5px; }
  .legend {
    position: absolute; bottom: 24px; left: 24px;
    background: rgba(245,240,232,0.94); border: 1px solid #c5bfb3;
    border-radius: 5px; padding: 10px 16px; font-size: 12px; color: #555;
    line-height: 1.7;
  }
  .legend .title { font-weight: 600; color: #333; margin-bottom: 2px; }
  .legend .detail { color: #888; font-size: 11px; }
  @media print {
    body { background: #fff; }
    .tooltip { display: none !important; }
    .legend { background: #fff; border-color: #999; }
  }
</style>
</head>
<body>
<h1>U.S. Population Density by Stipple</h1>
<div class="subtitle">One dot = 10,000 people &middot; rejection-sampled inside state boundaries</div>
<div id="map-container">
  <div class="tooltip" id="tooltip"></div>
  <div class="legend" id="legend"></div>
</div>

<script>
(async () => {
  const W = 1200, H = 800;
  const dpr = window.devicePixelRatio || 1;

  const container = d3.select("#map-container")
    .style("width", W + "px").style("height", H + "px");

  // Canvas for stipple dots
  const canvas = container.append("canvas")
    .attr("width", W * dpr).attr("height", H * dpr)
    .style("width", W + "px").style("height", H + "px")
    .node();
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  // SVG overlay for borders and hover
  const svg = container.append("svg")
    .attr("width", W).attr("height", H);

  // Load canonical US TopoJSON atlas
  const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
  const states = topojson.feature(us, us.objects.states).features;
  const stateMesh = topojson.mesh(us, us.objects.states, (a, b) => a !== b);
  const nation = topojson.merge(us, us.objects.states.geometries);

  // AlbersUsa: equal-area composite with AK/HI insets
  const projection = d3.geoAlbersUsa().fitSize([W - 80, H - 60], nation)
    .translate([W / 2, H / 2]);
  const path = d3.geoPath(projection);
  const canvasPath = d3.geoPath(projection, ctx);

  // 2020 Census populations (approximate)
  const popData = new Map([
    ["01",5024279],["02",733391],["04",7151502],["05",3011524],["06",39538223],
    ["08",5773714],["09",3605944],["10",989948],["11",689545],["12",21538187],
    ["13",10711908],["15",1455271],["16",1839106],["17",12812508],["18",6732219],
    ["19",3190369],["20",2937880],["21",4505836],["22",4657757],["23",1362359],
    ["24",6177224],["25",7029917],["26",10077331],["27",5706494],["28",2961279],
    ["29",6154913],["30",1084225],["31",1961504],["32",3104614],["33",1377529],
    ["34",9288994],["35",2117522],["36",20201249],["37",10439388],["38",779094],
    ["39",11799448],["40",3959353],["41",4237256],["42",13002700],["44",1097379],
    ["45",5118425],["46",886667],["47",6910840],["48",29145505],["49",3271616],
    ["50",643077],["51",8631393],["53",7614893],["54",1793716],["55",5893718],["56",576851]
  ]);

  // State areas in sq miles
  const areaData = new Map([
    ["01",52420],["02",665384],["04",113990],["05",53179],["06",163695],
    ["08",104094],["09",5543],["10",2489],["11",68],["12",65758],
    ["13",59425],["15",10932],["16",83569],["17",57914],["18",36420],
    ["19",56273],["20",82278],["21",40408],["22",52378],["23",35380],
    ["24",12407],["25",10554],["26",96714],["27",86936],["28",48432],
    ["29",69707],["30",147040],["31",77348],["32",110572],["33",9349],
    ["34",8723],["35",121590],["36",54555],["37",53819],["38",70698],
    ["39",44826],["40",69899],["41",98379],["42",46054],["44",1545],
    ["45",32020],["46",77116],["47",42144],["48",268596],["49",84897],
    ["50",9616],["51",42775],["53",71298],["54",24230],["55",65496],["56",97813]
  ]);

  const stateNames = new Map([
    ["01","Alabama"],["02","Alaska"],["04","Arizona"],["05","Arkansas"],["06","California"],
    ["08","Colorado"],["09","Connecticut"],["10","Delaware"],["11","District of Columbia"],
    ["12","Florida"],["13","Georgia"],["15","Hawaii"],["16","Idaho"],["17","Illinois"],
    ["18","Indiana"],["19","Iowa"],["20","Kansas"],["21","Kentucky"],["22","Louisiana"],
    ["23","Maine"],["24","Maryland"],["25","Massachusetts"],["26","Michigan"],
    ["27","Minnesota"],["28","Mississippi"],["29","Missouri"],["30","Montana"],
    ["31","Nebraska"],["32","Nevada"],["33","New Hampshire"],["34","New Jersey"],
    ["35","New Mexico"],["36","New York"],["37","North Carolina"],["38","North Dakota"],
    ["39","Ohio"],["40","Oklahoma"],["41","Oregon"],["42","Pennsylvania"],
    ["44","Rhode Island"],["45","South Carolina"],["46","South Dakota"],
    ["47","Tennessee"],["48","Texas"],["49","Utah"],["50","Vermont"],
    ["51","Virginia"],["53","Washington"],["54","West Virginia"],["55","Wisconsin"],["56","Wyoming"]
  ]);

  // Seeded PRNG (mulberry32) for reproducible dot placement
  const mulberry32 = (a) => () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const prng = mulberry32(42);

  // Store dot positions per state for hover highlighting
  const dotsByState = new Map();
  const dotScale = 10000; // 1 dot = 10,000 people
  let totalDots = 0;

  // --- Rejection sampling: place dots inside state polygons ---
  for (const state of states) {
    const fips = String(state.id).padStart(2, "0");
    const pop = popData.get(fips);
    if (!pop) continue;

    const nDots = Math.round(pop / dotScale);
    totalDots += nDots;

    const bounds = path.bounds(state);
    const [x0, y0] = bounds[0];
    const [x1, y1] = bounds[1];
    const bw = x1 - x0, bh = y1 - y0;

    const dots = [];
    let attempts = 0;
    const maxAttempts = nDots * 100; // generous budget for oddly-shaped states

    while (dots.length < nDots && attempts < maxAttempts) {
      attempts++;
      const px = x0 + prng() * bw;
      const py = y0 + prng() * bh;
      const geo = projection.invert([px, py]);
      if (geo && d3.geoContains(state, geo)) {
        dots.push([px, py]);
      }
    }
    dotsByState.set(fips, dots);
  }

  // --- Draw all dots on canvas ---
  const dotRadius = 0.9;
  const dotColor = "rgba(45, 40, 35, 0.72)";
  const dotColorHighlight = "#4477AA"; // Tol blue for highlight

  function drawAllDots(highlightFips = null) {
    ctx.clearRect(0, 0, W, H);

    // Draw non-highlighted dots first
    ctx.fillStyle = highlightFips ? "rgba(45, 40, 35, 0.25)" : dotColor;
    ctx.beginPath();
    for (const [fips, dots] of dotsByState) {
      if (fips === highlightFips) continue;
      for (const [px, py] of dots) {
        ctx.moveTo(px + dotRadius, py);
        ctx.arc(px, py, dotRadius, 0, Math.PI * 2);
      }
    }
    ctx.fill();

    // Draw highlighted state dots
    if (highlightFips) {
      const hDots = dotsByState.get(highlightFips);
      if (hDots) {
        ctx.fillStyle = dotColorHighlight;
        ctx.beginPath();
        for (const [px, py] of hDots) {
          ctx.moveTo(px + 1.2, py);
          ctx.arc(px, py, 1.2, 0, Math.PI * 2);
        }
        ctx.fill();
      }
    }
  }

  drawAllDots();

  // --- SVG layer: state borders ---
  svg.append("path")
    .datum(stateMesh)
    .attr("d", path)
    .attr("fill", "none")
    .attr("stroke", "#b5ad9e")
    .attr("stroke-width", 0.6)
    .attr("stroke-linejoin", "round");

  svg.append("path")
    .datum(nation)
    .attr("d", path)
    .attr("fill", "none")
    .attr("stroke", "#666")
    .attr("stroke-width", 1.2)
    .attr("stroke-linejoin", "round");

  // --- Interaction: invisible hover paths + tooltip ---
  const tooltip = d3.select("#tooltip");
  const fmt = d3.format(",");
  let activeFips = null;

  const hoverGroup = svg.append("g");
  const hoverPaths = hoverGroup.selectAll("path")
    .data(states).join("path")
    .attr("d", path)
    .attr("fill", "transparent")
    .attr("stroke", "none")
    .style("cursor", "pointer")
    .on("pointerenter", function(event, d) {
      const fips = String(d.id).padStart(2, "0");
      if (activeFips === fips) return;
      activeFips = fips;

      const pop = popData.get(fips) || 0;
      const area = areaData.get(fips) || 1;
      const density = Math.round(pop / area);
      const name = stateNames.get(fips) || "Unknown";
      const nDots = Math.round(pop / dotScale);

      // Highlight border
      d3.select(this).attr("stroke", "#333").attr("stroke-width", 2);

      // Redraw canvas with highlight
      drawAllDots(fips);

      tooltip.style("display", "block").html(
        `<strong>${name}</strong><br>` +
        `<span class="label">Population</span> <span class="num">${fmt(pop)}</span><br>` +
        `<span class="label">Density</span> <span class="num">${fmt(density)}</span>/mi&sup2;<br>` +
        `<span class="label">Dots</span> <span class="num">${fmt(nDots)}</span>`
      );
    })
    .on("pointermove", (event) => {
      const [mx, my] = d3.pointer(event, container.node());
      // Keep tooltip within container bounds
      const tx = Math.min(mx + 16, W - 180);
      const ty = Math.max(my - 12, 8);
      tooltip.style("left", tx + "px").style("top", ty + "px");
    })
    .on("pointerleave", function() {
      activeFips = null;
      d3.select(this).attr("stroke", "none").attr("stroke-width", 0);
      drawAllDots();
      tooltip.style("display", "none");
    });

  // --- Legend ---
  const maxDensity = d3.max([...popData.entries()], ([fips]) => {
    const pop = popData.get(fips) || 0;
    const area = areaData.get(fips) || 1;
    return Math.round(pop / area);
  });

  d3.select("#legend").html(
    `<div class="title">&#9679; = ${fmt(dotScale)} people</div>` +
    `<div>~${fmt(totalDots)} dots total</div>` +
    `<div class="detail" style="margin-top:6px;">` +
    `Densest: NJ ${fmt(Math.round(9288994/8723))}/mi&sup2;<br>` +
    `Sparsest: WY ${fmt(Math.round(576851/97813))}/mi&sup2;</div>` +
    `<div class="detail" style="margin-top:4px;">Print-friendly &middot; no color encoding</div>`
  );

})();
</script>
</body>
</html>
