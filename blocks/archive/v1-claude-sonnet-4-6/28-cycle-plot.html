<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retail Sales — Monthly Cycle Plot (2020–2024)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 11px;
    line-height: 1.5;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    opacity: 0;
    transition: opacity 0.15s;
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
  }
  .tooltip strong {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 12px;
  }
</style>
</head>
<body>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(() => {
  // --- Tol palette ---
  const tolQual = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377","#BBBBBB"];
  const yearColors = ["#BBCCEE","#77AADD","#4477AA","#2255AA","#114488"];

  // --- Data generation ---
  const months = d3.range(12);
  const years = [2020, 2021, 2022, 2023, 2024];
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  // Realistic seasonal pattern: post-holiday dip, spring recovery, summer lull, back-to-school bump, holiday surge
  const seasonalBase = [82, 76, 88, 96, 104, 100, 93, 98, 106, 112, 138, 158];

  // Deterministic noise per [year][month] — creates real-looking variation
  const noise = [
    [ 1.8, -4.2,  2.5, -1.0,  3.8, -3.1,  0.5, -2.0,  4.5, -1.5,  3.2, -5.8],
    [-2.3,  3.5, -4.0,  1.8, -0.5,  4.2, -3.0,  2.5, -2.2,  3.8, -4.5,  2.1],
    [ 4.5, -1.8,  0.8, -3.5,  2.2, -1.0,  3.0, -4.2,  1.5,  2.0, -2.8,  5.5],
    [-1.2,  2.0, -3.5,  4.2, -2.5,  0.8, -1.5,  3.8, -4.0,  1.2,  5.8, -3.2],
    [ 2.8, -3.0,  4.2, -2.0,  1.5, -4.5,  2.0, -0.5,  3.2, -2.8,  4.5,  7.2]
  ];

  const data = [];
  years.forEach((year, yi) => {
    const growth = Math.pow(1.035, yi); // 3.5% YoY growth trend
    months.forEach((month, mi) => {
      // Add a COVID dip for 2020 spring
      let covidAdj = 0;
      if (year === 2020 && month >= 2 && month <= 5) covidAdj = -12 + (month - 2) * 4;
      const value = seasonalBase[mi] * growth + noise[yi][mi] + covidAdj;
      data.push({ year, month, value: Math.round(value * 10) / 10, monthName: monthNames[mi] });
    });
  });

  // --- Layout ---
  const panelW = 88;
  const panelH = 320;
  const margin = { top: 72, right: 30, bottom: 60, left: 56 };
  const panelPad = 8;
  const totalW = margin.left + panelW * 12 + margin.right;
  const totalH = margin.top + panelH + margin.bottom;

  const svg = d3.select("body").append("svg")
      .attr("width", totalW)
      .attr("height", totalH)
      .attr("viewBox", `0 0 ${totalW} ${totalH}`);

  // --- Tooltip ---
  const tooltip = d3.select("body").append("div").attr("class", "tooltip");

  // --- Scales ---
  const yExtent = [d3.min(data, d => d.value) - 5, d3.max(data, d => d.value) + 8];
  const y = d3.scaleLinear().domain(yExtent).range([panelH, 0]).nice();

  const xPanel = d3.scalePoint()
      .domain(years)
      .range([panelPad, panelW - panelPad]);

  const colorScale = d3.scaleOrdinal()
      .domain(years)
      .range(yearColors);

  // --- Title ---
  svg.append("text")
      .attr("x", totalW / 2).attr("y", 22)
      .attr("text-anchor", "middle")
      .attr("font-size", 17).attr("font-weight", 700).attr("fill", "#222")
      .text("U.S. Monthly Retail Sales — Cycle Plot (2020–2024)");

  svg.append("text")
      .attr("x", totalW / 2).attr("y", 40)
      .attr("text-anchor", "middle")
      .attr("font-size", 12).attr("fill", "#666")
      .text("Each panel shows one month across five years. Dashed line = monthly mean. Hover for details.");

  // --- Chart area ---
  const chart = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

  // Y axis
  const yAxis = d3.axisLeft(y).ticks(8).tickFormat(d => `$${d}`);
  chart.append("g")
      .attr("class", "y-axis")
      .call(yAxis)
      .call(g => g.select(".domain").remove())
      .call(g => g.selectAll("text").attr("fill", "#555").attr("font-size", 10))
      .call(g => g.selectAll("line").attr("stroke", "#ccc"));

  // Y axis label
  chart.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -panelH / 2).attr("y", -42)
      .attr("text-anchor", "middle")
      .attr("font-size", 11).attr("fill", "#666")
      .text("Sales ($B)");

  // Gridlines
  chart.append("g")
    .selectAll("line")
    .data(y.ticks(8))
    .join("line")
      .attr("x1", 0).attr("x2", panelW * 12)
      .attr("y1", d => y(d)).attr("y2", d => y(d))
      .attr("stroke", "#eee").attr("stroke-width", 0.5);

  // --- Find extremes ---
  const sorted = [...data].sort((a, b) => a.value - b.value);
  const lowest = sorted[0];
  const highest = sorted[sorted.length - 1];

  // Per-month data
  const byMonth = d3.group(data, d => d.month);

  // Line generator
  const line = d3.line()
      .x(d => xPanel(d.year))
      .y(d => y(d.value));

  // --- Highlight state ---
  let activeYear = null;

  // --- Draw panels ---
  const panels = months.map(month => {
    const g = chart.append("g")
        .attr("transform", `translate(${month * panelW},0)`);
    return { g, month };
  });

  panels.forEach(({ g, month }, mi) => {
    // Panel divider
    if (mi > 0) {
      g.append("line")
          .attr("x1", 0).attr("x2", 0)
          .attr("y1", -4).attr("y2", panelH)
          .attr("stroke", "#e0e0e0").attr("stroke-width", 1);
    }

    const monthData = [...byMonth.get(month)].sort((a, b) => a.year - b.year);
    const monthMean = d3.mean(monthData, d => d.value);

    // Mean line (dashed)
    g.append("line")
        .attr("class", "mean-line")
        .attr("x1", panelPad - 4).attr("x2", panelW - panelPad + 4)
        .attr("y1", y(monthMean)).attr("y2", y(monthMean))
        .attr("stroke", "#AA3377").attr("stroke-width", 1.5)
        .attr("stroke-dasharray", "4 2");

    // Mean value label (small, right-aligned)
    g.append("text")
        .attr("x", panelW - panelPad + 6).attr("y", y(monthMean) + 3)
        .attr("font-size", 8).attr("fill", "#AA3377")
        .attr("text-anchor", "start")
        .text(`$${monthMean.toFixed(0)}`);

    // Connecting line
    g.append("path")
        .datum(monthData)
        .attr("class", "trend-line")
        .attr("d", line)
        .attr("fill", "none")
        .attr("stroke", "#888")
        .attr("stroke-width", 1.3);

    // Data points
    g.selectAll(".dot")
      .data(monthData)
      .join("circle")
        .attr("class", "dot")
        .attr("cx", d => xPanel(d.year))
        .attr("cy", d => y(d.value))
        .attr("r", 4.5)
        .attr("fill", d => colorScale(d.year))
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.5)
        .style("cursor", "pointer")
        .on("pointerenter", (event, d) => {
          const diff = d.value - monthMean;
          const sign = diff >= 0 ? "+" : "";
          tooltip.html(
            `<strong>${d.monthName} ${d.year}</strong><br>` +
            `Sales: $${d.value.toFixed(1)}B<br>` +
            `vs. mean: ${sign}${diff.toFixed(1)}`
          ).style("opacity", 1);
          // Highlight year across all panels
          activeYear = d.year;
          updateHighlight();
        })
        .on("pointermove", event => {
          tooltip
            .style("left", `${Math.min(event.pageX + 14, window.innerWidth - 160)}px`)
            .style("top", `${event.pageY - 50}px`);
        })
        .on("pointerleave", () => {
          tooltip.style("opacity", 0);
          activeYear = null;
          updateHighlight();
        });

    // Month label
    g.append("text")
        .attr("x", panelW / 2).attr("y", -10)
        .attr("text-anchor", "middle")
        .attr("font-size", 12).attr("font-weight", 600).attr("fill", "#333")
        .text(monthNames[mi]);

    // Year tick labels (bottom)
    years.forEach(yr => {
      g.append("text")
          .attr("x", xPanel(yr)).attr("y", panelH + 14)
          .attr("text-anchor", "middle")
          .attr("font-size", 8.5).attr("fill", "#888")
          .text(`'${String(yr).slice(2)}`);
    });

    // --- Annotate high/low ---
    [highest, lowest].forEach(pt => {
      if (pt.month !== month) return;
      const isHigh = pt === highest;
      const cx = xPanel(pt.year);
      const cy = y(pt.value);
      const offsetY = isHigh ? -16 : 20;

      // Background rect for readability
      const label = `${isHigh ? "High" : "Low"}: $${pt.value.toFixed(0)}`;
      const labelW = label.length * 5.5;
      g.append("rect")
          .attr("x", cx - labelW / 2 - 2).attr("y", cy + offsetY - 10)
          .attr("width", labelW + 4).attr("height", 13)
          .attr("rx", 2)
          .attr("fill", "#fff").attr("opacity", 0.85);

      g.append("text")
          .attr("x", cx).attr("y", cy + offsetY)
          .attr("text-anchor", "middle")
          .attr("font-size", 10).attr("font-weight", 600)
          .attr("fill", isHigh ? "#228833" : "#EE6677")
          .text(label);

      // Small connector
      g.append("line")
          .attr("x1", cx).attr("x2", cx)
          .attr("y1", cy + (isHigh ? -5 : 6))
          .attr("y2", cy + (isHigh ? -10 : 13))
          .attr("stroke", isHigh ? "#228833" : "#EE6677")
          .attr("stroke-width", 1);
    });
  });

  // --- Holiday Season bracket (Nov–Dec) ---
  const bracketX1 = 10 * panelW + panelPad;
  const bracketX2 = 12 * panelW - panelPad;
  const bracketY = -32;

  chart.append("path")
      .attr("d", `M${bracketX1},${bracketY + 10} L${bracketX1},${bracketY} L${bracketX2},${bracketY} L${bracketX2},${bracketY + 10}`)
      .attr("fill", "none")
      .attr("stroke", "#AA3377")
      .attr("stroke-width", 1.5);

  // Light shading behind holiday panels
  chart.append("rect")
      .attr("x", 10 * panelW).attr("y", 0)
      .attr("width", 2 * panelW).attr("height", panelH)
      .attr("fill", "#AA3377").attr("opacity", 0.03);

  chart.append("text")
      .attr("x", (bracketX1 + bracketX2) / 2).attr("y", bracketY - 5)
      .attr("text-anchor", "middle")
      .attr("font-size", 11).attr("font-weight", 600).attr("fill", "#AA3377")
      .text("Holiday Season");

  // --- COVID annotation on Apr 2020 ---
  const covidMonth = 3; // April
  const covidPt = data.find(d => d.year === 2020 && d.month === covidMonth);
  if (covidPt) {
    const cx = covidMonth * panelW + xPanel(2020);
    const cy = y(covidPt.value);
    chart.append("line")
        .attr("x1", cx).attr("x2", cx + 22)
        .attr("y1", cy + 4).attr("y2", cy + 30)
        .attr("stroke", "#EE6677").attr("stroke-width", 0.8);
    // Background
    chart.append("rect")
        .attr("x", cx + 10).attr("y", cy + 26)
        .attr("width", 72).attr("height", 14)
        .attr("rx", 2)
        .attr("fill", "#fff").attr("opacity", 0.9);
    chart.append("text")
        .attr("x", cx + 24).attr("y", cy + 37)
        .attr("font-size", 9).attr("fill", "#EE6677").attr("font-weight", 500)
        .text("COVID dip");
  }

  // --- Year color legend ---
  const legend = svg.append("g")
      .attr("transform", `translate(${margin.left + panelW * 12 - 220},${totalH - 22})`);

  legend.append("text")
      .attr("x", -8).attr("y", 4)
      .attr("text-anchor", "end")
      .attr("font-size", 10).attr("fill", "#666")
      .text("Year:");

  years.forEach((yr, i) => {
    const g = legend.append("g")
        .attr("transform", `translate(${i * 44},0)`)
        .style("cursor", "pointer")
        .on("pointerenter", () => { activeYear = yr; updateHighlight(); })
        .on("pointerleave", () => { activeYear = null; updateHighlight(); });

    g.append("circle")
        .attr("r", 5)
        .attr("fill", colorScale(yr))
        .attr("stroke", "#fff").attr("stroke-width", 1.5);
    g.append("text")
        .attr("x", 9).attr("y", 4)
        .attr("font-size", 10).attr("fill", "#555")
        .text(yr);
  });

  // Mean legend
  legend.append("line")
      .attr("x1", years.length * 44 + 10).attr("x2", years.length * 44 + 30)
      .attr("y1", 0).attr("y2", 0)
      .attr("stroke", "#AA3377").attr("stroke-width", 1.5)
      .attr("stroke-dasharray", "4 2");

  legend.append("text")
      .attr("x", years.length * 44 + 34).attr("y", 4)
      .attr("font-size", 10).attr("fill", "#666")
      .text("Monthly mean");

  // --- Source line ---
  svg.append("text")
      .attr("x", margin.left).attr("y", totalH - 6)
      .attr("font-size", 9).attr("fill", "#aaa")
      .text("Synthetic data for illustration");

  // --- Highlight update ---
  function updateHighlight() {
    chart.selectAll(".dot")
        .transition().duration(120)
        .attr("r", d => activeYear === null ? 4.5 : d.year === activeYear ? 6 : 3)
        .attr("opacity", d => activeYear === null ? 1 : d.year === activeYear ? 1 : 0.25)
        .attr("stroke-width", d => activeYear === null ? 1.5 : d.year === activeYear ? 2 : 1);

    chart.selectAll(".trend-line")
        .transition().duration(120)
        .attr("stroke-opacity", activeYear === null ? 1 : 0.2);
  }

})();
</script>
</body>
</html>
