<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small Multiples — Seasonal Energy Consumption</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fafafa;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  #container {
    width: 1200px;
    max-width: 100%;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #222;
    text-align: center;
    margin: 16px 0 2px;
  }
  .subtitle {
    font-size: 13px;
    color: #666;
    text-align: center;
    margin-bottom: 12px;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 8px;
    font-size: 12px;
    color: #444;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-swatch {
    width: 20px;
    height: 3px;
    border-radius: 1px;
  }
  .crosshair { pointer-events: none; }
  .tooltip-box {
    position: absolute;
    pointer-events: none;
    background: rgba(255,255,255,0.95);
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 11px;
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
    color: #333;
    line-height: 1.5;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    display: none;
    white-space: nowrap;
  }
  .month-label {
    font-size: 12px;
    font-weight: 600;
    fill: #333;
  }
  .axis text {
    font-size: 10px;
    fill: #666;
  }
  .axis line, .axis path {
    stroke: #ccc;
  }
  .grid line {
    stroke: #eee;
    stroke-dasharray: 2,2;
  }
  .grid path { display: none; }
</style>
</head>
<body>
<div id="container">
  <h1>Daily Energy Consumption by Month</h1>
  <p class="subtitle">Three years overlaid — winter heating and summer AC create the seasonal U-shape</p>
  <div class="legend" id="legend"></div>
  <svg id="chart"></svg>
  <div class="tooltip-box" id="tooltip"></div>
</div>
<script>
(() => {
  // --- Tol palette for 3 years ---
  const yearColors = ["#4477AA", "#EE6677", "#228833"];
  const years = [2022, 2023, 2024];
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const daysInMonth = [31,28,31,30,31,30,31,31,30,31,30,31];

  // --- Generate synthetic data ---
  // Energy consumption with seasonal pattern: high winter (heating), high summer (AC), low spring/fall
  function seededRandom(seed) {
    let s = seed;
    return () => { s = (s * 16807 + 0) % 2147483647; return s / 2147483647; };
  }

  const data = [];
  const rng = seededRandom(42);

  years.forEach((year, yi) => {
    const yearTrend = yi * 2; // slight upward trend across years
    for (let m = 0; m < 12; m++) {
      const days = daysInMonth[m];
      for (let d = 1; d <= days; d++) {
        // Seasonal curve: high in Jan (heating), dips in April-May, rises in Jul-Aug (AC), dips in Oct
        const dayOfYear = d + daysInMonth.slice(0, m).reduce((a, b) => a + b, 0);
        const seasonAngle = (dayOfYear / 365) * 2 * Math.PI;
        // Two peaks: winter (day ~15) and summer (day ~200)
        const winterPeak = 45 * Math.exp(-((dayOfYear - 15) ** 2) / 3000);
        const winterPeak2 = 45 * Math.exp(-((dayOfYear - 365) ** 2) / 3000); // wrap around
        const summerPeak = 35 * Math.exp(-((dayOfYear - 200) ** 2) / 2500);
        const baseline = 30 + yearTrend;
        const seasonal = winterPeak + winterPeak2 + summerPeak;
        // Weekend effect: slightly higher on weekends (people home)
        const date = new Date(year, m, d);
        const dow = date.getDay();
        const weekendBoost = (dow === 0 || dow === 6) ? 3 : 0;
        const noise = (rng() - 0.5) * 12;
        const value = Math.max(10, baseline + seasonal + weekendBoost + noise);

        data.push({ year, month: m, day: d, value, date });
      }
    }
  });

  // --- Layout ---
  const cols = 4, rows = 3;
  const outerMargin = { top: 8, right: 24, bottom: 32, left: 24 };
  const cellPadding = { x: 12, y: 28 };
  const cellMargin = { top: 18, right: 8, bottom: 22, left: 36 };

  const totalW = 1200;
  const cellW = (totalW - outerMargin.left - outerMargin.right - (cols - 1) * cellPadding.x) / cols;
  const cellH = 150;
  const plotW = cellW - cellMargin.left - cellMargin.right;
  const plotH = cellH - cellMargin.top - cellMargin.bottom;
  const totalH = outerMargin.top + rows * cellH + (rows - 1) * cellPadding.y + outerMargin.bottom;

  // --- Shared scales ---
  const xScale = d3.scaleLinear().domain([1, 31]).range([0, plotW]);
  const yExtent = d3.extent(data, d => d.value);
  const yScale = d3.scaleLinear().domain([yExtent[0] - 2, yExtent[1] + 2]).range([plotH, 0]);

  // --- SVG setup ---
  const svg = d3.select("#chart")
    .attr("width", totalW)
    .attr("height", totalH)
    .attr("viewBox", `0 0 ${totalW} ${totalH}`);

  // --- Legend ---
  const legend = d3.select("#legend");
  years.forEach((yr, i) => {
    const item = legend.append("div").attr("class", "legend-item");
    item.append("div").attr("class", "legend-swatch").style("background", yearColors[i]);
    item.append("span").text(yr);
  });

  // --- Group data by month and year ---
  const byMonthYear = d3.group(data, d => d.month, d => d.year);

  // --- Tooltip ---
  const tooltip = d3.select("#tooltip");

  // --- Draw panels ---
  const panels = [];
  const crosshairLines = [];

  for (let m = 0; m < 12; m++) {
    const col = m % cols;
    const row = Math.floor(m / cols);
    const cx = outerMargin.left + col * (cellW + cellPadding.x);
    const cy = outerMargin.top + row * (cellH + cellPadding.y);

    const g = svg.append("g").attr("transform", `translate(${cx + cellMargin.left},${cy + cellMargin.top})`);

    // Month label
    g.append("text")
      .attr("class", "month-label")
      .attr("x", plotW / 2)
      .attr("y", -6)
      .attr("text-anchor", "middle")
      .text(monthNames[m]);

    // Grid lines
    g.append("g")
      .attr("class", "grid")
      .call(d3.axisLeft(yScale).ticks(4).tickSize(-plotW).tickFormat(""));

    // Y axis — only on leftmost column
    if (col === 0) {
      g.append("g")
        .attr("class", "axis")
        .call(d3.axisLeft(yScale).ticks(4).tickFormat(d => `${d}`));
    }

    // X axis — only on bottom row
    if (row === rows - 1) {
      g.append("g")
        .attr("class", "axis")
        .attr("transform", `translate(0,${plotH})`)
        .call(d3.axisBottom(xScale).ticks(5).tickFormat(d => d));
    }

    // Draw lines for each year
    const line = d3.line()
      .x(d => xScale(d.day))
      .y(d => yScale(d.value))
      .curve(d3.curveMonotoneX);

    const monthData = byMonthYear.get(m);

    years.forEach((yr, yi) => {
      const yearData = monthData?.get(yr);
      if (!yearData) return;
      const sorted = yearData.sort((a, b) => a.day - b.day);

      g.append("path")
        .datum(sorted)
        .attr("d", line)
        .attr("fill", "none")
        .attr("stroke", yearColors[yi])
        .attr("stroke-width", 1.5)
        .attr("stroke-opacity", 0.85);
    });

    // Crosshair line (hidden by default)
    const crosshair = g.append("line")
      .attr("class", "crosshair")
      .attr("y1", 0)
      .attr("y2", plotH)
      .attr("stroke", "#333")
      .attr("stroke-width", 0.8)
      .attr("stroke-dasharray", "3,2")
      .style("display", "none");

    crosshairLines.push(crosshair);

    // Hover dots per year
    const dots = years.map((yr, yi) =>
      g.append("circle")
        .attr("r", 3.5)
        .attr("fill", yearColors[yi])
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.2)
        .style("display", "none")
        .style("pointer-events", "none")
    );

    panels.push({ g, cx, cy, m, dots });

    // Invisible interaction rect for this panel
    g.append("rect")
      .attr("width", plotW)
      .attr("height", plotH)
      .attr("fill", "none")
      .attr("pointer-events", "all")
      .style("cursor", "crosshair")
      .on("pointermove", (event) => {
        const [mx] = d3.pointer(event);
        const day = Math.round(xScale.invert(mx));
        const clampedDay = Math.max(1, Math.min(31, day));
        showCrosshair(clampedDay, event);
      })
      .on("pointerleave", hideCrosshair);
  }

  // Y-axis label (shared)
  svg.append("text")
    .attr("transform", `translate(12,${outerMargin.top + totalH / 2}) rotate(-90)`)
    .attr("text-anchor", "middle")
    .attr("font-size", 11)
    .attr("fill", "#666")
    .text("kWh");

  // X-axis label (shared)
  svg.append("text")
    .attr("x", totalW / 2)
    .attr("y", totalH - 4)
    .attr("text-anchor", "middle")
    .attr("font-size", 11)
    .attr("fill", "#666")
    .text("Day of month");

  // --- Crosshair logic ---
  function showCrosshair(day, event) {
    const px = xScale(day);

    // Update all 12 panels
    panels.forEach((panel, m) => {
      crosshairLines[m].attr("x1", px).attr("x2", px).style("display", null);

      const monthData = byMonthYear.get(m);
      years.forEach((yr, yi) => {
        const yearData = monthData?.get(yr);
        if (!yearData) { panel.dots[yi].style("display", "none"); return; }
        const point = yearData.find(d => d.day === day);
        if (point) {
          panel.dots[yi]
            .attr("cx", xScale(point.day))
            .attr("cy", yScale(point.value))
            .style("display", null);
        } else {
          panel.dots[yi].style("display", "none");
        }
      });
    });

    // Tooltip — show values for the hovered month
    const hoverMonth = panels.find(p => {
      const rect = event.target.getBoundingClientRect();
      return rect; // we know which panel from the event
    });

    // Find which month panel triggered the event
    const panelG = event.target.parentNode;
    const panelInfo = panels.find(p => p.g.node() === panelG);
    if (!panelInfo) return;

    const monthData = byMonthYear.get(panelInfo.m);
    let html = `<strong>${monthNames[panelInfo.m]} ${day}</strong><br>`;
    years.forEach((yr, yi) => {
      const yearData = monthData?.get(yr);
      const point = yearData?.find(d => d.day === day);
      if (point) {
        html += `<span style="color:${yearColors[yi]}">●</span> ${yr}: ${point.value.toFixed(1)} kWh<br>`;
      }
    });

    const containerRect = document.getElementById("container").getBoundingClientRect();
    const svgRect = document.getElementById("chart").getBoundingClientRect();
    const absX = svgRect.left - containerRect.left + panelInfo.cx + cellMargin.left + px;
    const absY = svgRect.top - containerRect.top + panelInfo.cy + cellMargin.top;

    tooltip
      .style("display", "block")
      .html(html)
      .style("left", `${absX + 12}px`)
      .style("top", `${absY - 10}px`);

    // Flip tooltip if it would overflow right
    const tipNode = tooltip.node();
    if (absX + 12 + tipNode.offsetWidth > totalW) {
      tooltip.style("left", `${absX - tipNode.offsetWidth - 8}px`);
    }
  }

  function hideCrosshair() {
    crosshairLines.forEach(line => line.style("display", "none"));
    panels.forEach(panel => panel.dots.forEach(dot => dot.style("display", "none")));
    tooltip.style("display", "none");
  }

})();
</script>
</body>
</html>
