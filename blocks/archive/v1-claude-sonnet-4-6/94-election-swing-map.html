<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Election Swing Map — County Choropleth with Linked Histogram</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111827;
    color: #d1d5db;
    font-family: "Inter", system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px 0;
    flex-shrink: 0;
  }
  h1 { font-size: 16px; font-weight: 600; color: #f3f4f6; }
  .subtitle { font-size: 11px; color: #6b7280; margin-top: 2px; }
  #main { flex: 1; display: flex; min-height: 0; }
  #map-panel { flex: 3; position: relative; }
  #hist-panel { flex: 1; min-width: 260px; border-left: 1px solid #1f2937; display: flex; flex-direction: column; }
  #hist-panel .panel-title {
    padding: 12px 16px 4px;
    font-size: 12px; font-weight: 600; color: #9ca3af;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  canvas { display: block; }
  svg { display: block; }

  #slider-bar {
    padding: 8px 24px 14px;
    display: flex; align-items: center; gap: 16px;
    flex-shrink: 0; border-top: 1px solid #1f2937;
  }
  #slider-bar label { font-size: 12px; color: #9ca3af; white-space: nowrap; }
  #year-slider { flex: 1; accent-color: #6366f1; }
  #year-label { font-size: 14px; font-weight: 600; color: #e5e7eb; min-width: 40px; }
  .play-btn {
    background: none; border: 1px solid #374151; border-radius: 4px;
    color: #d1d5db; font-size: 12px; padding: 3px 10px; cursor: pointer;
  }
  .play-btn:hover { border-color: #6366f1; color: #a5b4fc; }

  .legend-bar {
    position: absolute; bottom: 12px; left: 24px;
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: #9ca3af;
    pointer-events: none;
  }
  .legend-bar canvas { border-radius: 2px; }

  .tooltip {
    position: absolute; pointer-events: none;
    background: rgba(15, 20, 35, 0.94);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px; padding: 8px 12px;
    font-size: 11px; line-height: 1.5;
    color: #d1d5db; max-width: 260px;
    opacity: 0; transition: opacity 0.12s;
    backdrop-filter: blur(8px); z-index: 10;
  }
  .tooltip strong { color: #f3f4f6; }
  .brush-info {
    position: absolute; bottom: 8px; right: 12px;
    font-size: 10px; color: #6b7280;
  }
</style>
</head>
<body>
<header>
  <h1>US County Election Swing</h1>
  <div class="subtitle">Synthetic data — 5 elections. Brush the histogram to highlight counties by swing magnitude.</div>
</header>
<div id="main">
  <div id="map-panel">
    <canvas id="map-canvas"></canvas>
    <svg id="map-svg"></svg>
    <div class="legend-bar">
      <span>D +30</span>
      <canvas id="legend-canvas" width="180" height="12"></canvas>
      <span>R +30</span>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div id="hist-panel">
    <div class="panel-title">Swing Distribution</div>
    <svg id="hist-svg"></svg>
    <div class="brush-info" id="brush-info"></div>
  </div>
</div>
<div id="slider-bar">
  <label>Election year</label>
  <input type="range" id="year-slider" min="0" max="4" step="1" value="0">
  <span id="year-label"></span>
  <button class="play-btn" id="play-btn">▶ Play</button>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

// ── Synthetic county geometry (simplified US counties as TopoJSON) ──
// We'll fetch the standard US atlas and generate synthetic election data
const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-albers-10m.json");

const counties = topojson.feature(us, us.objects.counties);
const states = topojson.mesh(us, us.objects.states, (a, b) => a !== b);
const nation = topojson.mesh(us, us.objects.nation);

const years = [2008, 2012, 2016, 2020, 2024];

// ── Synthetic election data ──
// Seed a deterministic pseudo-random generator
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(42);

// Generate a base lean per county, then shift per year
const countyIds = counties.features.map(f => f.id);
const baseLean = new Map(); // -1 = deep blue, +1 = deep red
countyIds.forEach(id => {
  // Base: random lean centered slightly right (rural bias)
  baseLean.set(id, (rng() - 0.45) * 60); // range roughly -27 to +33
});

// National swing per year (D-favorable negative, R-favorable positive)
const nationalSwing = [−6, −3, 2, −5, 1]; // 2008 D+6, 2012 D+3, 2016 R+2, 2020 D+5, 2024 R+1

// margin[yearIdx] -> Map(countyId -> margin)  negative=D, positive=R
const margins = years.map((yr, yi) => {
  const m = new Map();
  countyIds.forEach(id => {
    const base = baseLean.get(id);
    const noise = (rng() - 0.5) * 8;
    const swing = nationalSwing[yi];
    m.set(id, Math.max(-50, Math.min(50, base + swing + noise)));
  });
  return m;
});

// Swing = change from previous election
function getSwing(yi, id) {
  if (yi === 0) return 0;
  return margins[yi].get(id) - margins[yi - 1].get(id);
}

// ── Color scale ──
const colorScale = d3.scaleDiverging()
  .domain([-30, 0, 30])
  .interpolator(d3.interpolateRdBu)
  .clamp(true);

// Note: D3 interpolateRdBu goes red(negative) -> blue(positive)
// We want blue=D(negative margin), red=R(positive margin)
// So we reverse: margin -> colorScale(-margin)
function marginColor(margin) {
  return colorScale(-margin);
}

// ── Legend ──
const legendCanvas = document.getElementById("legend-canvas");
const legendCtx = legendCanvas.getContext("2d");
for (let i = 0; i < 180; i++) {
  const v = -30 + (60 * i / 179);
  legendCtx.fillStyle = marginColor(v);
  legendCtx.fillRect(i, 0, 1, 12);
}

// ── Map (Canvas for counties, SVG for borders + interaction) ──
const mapPanel = document.getElementById("map-panel");
const mapCanvas = document.getElementById("map-canvas");
const mapSvg = d3.select("#map-svg");
const tooltip = document.getElementById("tooltip");

let currentYear = 0;
let brushedRange = null; // [minSwing, maxSwing] or null
const highlightedCounties = new Set();

// Null projection — counties-albers-10m is pre-projected
const path = d3.geoPath();

function resize() {
  const { width, height } = mapPanel.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  mapCanvas.width = width * dpr;
  mapCanvas.height = height * dpr;
  mapCanvas.style.width = width + "px";
  mapCanvas.style.height = height + "px";
  mapCanvas.style.position = "absolute";
  mapCanvas.style.top = "0";

  mapSvg
    .attr("width", width)
    .attr("height", height)
    .style("position", "absolute")
    .style("top", "0");

  // Fit the pre-projected geometry into our panel
  const bounds = path.bounds(nation);
  const bw = bounds[1][0] - bounds[0][0];
  const bh = bounds[1][1] - bounds[0][1];
  const s = 0.92 * Math.min(width / bw, height / bh);
  const tx = (width - s * bw) / 2 - s * bounds[0][0];
  const ty = (height - s * bh) / 2 - s * bounds[0][1];

  mapCanvas._transform = { s, tx, ty, dpr, width, height };

  drawMap();
  drawBorders();
}

function drawMap() {
  const { s, tx, ty, dpr } = mapCanvas._transform;
  const ctx = mapCanvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);

  const projPath = d3.geoPath().context(ctx);
  // Apply transform
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(s, s);

  const yi = currentYear;
  const m = margins[yi];

  counties.features.forEach(f => {
    const id = f.id;
    const margin = m.get(id) ?? 0;
    const swing = getSwing(yi, id);

    let alpha = 1;
    if (brushedRange) {
      if (swing < brushedRange[0] || swing > brushedRange[1]) {
        alpha = 0.08;
      }
    }

    ctx.globalAlpha = alpha;
    ctx.fillStyle = marginColor(margin);
    ctx.beginPath();
    projPath(f);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawBorders() {
  const { s, tx, ty, width, height } = mapCanvas._transform;
  mapSvg.selectAll("*").remove();

  const g = mapSvg.append("g")
    .attr("transform", `translate(${tx},${ty}) scale(${s})`);

  g.append("path")
    .datum(states)
    .attr("d", path)
    .attr("fill", "none")
    .attr("stroke", "#374151")
    .attr("stroke-width", 0.6 / s)
    .attr("stroke-linejoin", "round");

  g.append("path")
    .datum(nation)
    .attr("d", path)
    .attr("fill", "none")
    .attr("stroke", "#4b5563")
    .attr("stroke-width", 1 / s);

  // Invisible county paths for hover
  g.selectAll(".county-hover")
    .data(counties.features)
    .join("path")
      .attr("class", "county-hover")
      .attr("d", path)
      .attr("fill", "transparent")
      .attr("stroke", "none")
      .style("pointer-events", "all")
      .on("pointerenter", (event, f) => {
        const id = f.id;
        const margin = margins[currentYear].get(id) ?? 0;
        const swing = getSwing(currentYear, id);
        const party = margin < 0 ? "D" : "R";
        const swingDir = swing > 0 ? "R" : "D";
        tooltip.innerHTML = `
          <strong>FIPS ${id}</strong><br>
          Margin: <span style="color:${marginColor(margin)}">${party} +${Math.abs(margin).toFixed(1)}</span><br>
          Swing: ${currentYear > 0 ? `${swingDir} +${Math.abs(swing).toFixed(1)}` : "—"}
        `;
        tooltip.style.opacity = 1;
      })
      .on("pointermove", event => {
        const [x, y] = d3.pointer(event, mapPanel);
        tooltip.style.left = (x + 14) + "px";
        tooltip.style.top = (y - 10) + "px";
      })
      .on("pointerleave", () => {
        tooltip.style.opacity = 0;
      });
}

// ── Histogram ──
const histSvg = d3.select("#hist-svg");
const brushInfo = document.getElementById("brush-info");

function drawHistogram() {
  const panel = document.getElementById("hist-panel");
  const rect = panel.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height - 40; // minus title + info

  histSvg
    .attr("width", width)
    .attr("height", height);

  histSvg.selectAll("*").remove();

  const margin = { top: 16, right: 16, bottom: 32, left: 44 };
  const w = width - margin.left - margin.right;
  const h = height - margin.top - margin.bottom;

  const yi = currentYear;
  const swings = countyIds.map(id => getSwing(yi, id));

  if (yi === 0) {
    histSvg.append("text")
      .attr("x", width / 2).attr("y", height / 2)
      .attr("text-anchor", "middle")
      .attr("fill", "#6b7280")
      .attr("font-size", 12)
      .text("No swing data for first election");
    return;
  }

  const x = d3.scaleLinear().domain([-20, 20]).range([0, w]);
  const bins = d3.bin().domain(x.domain()).thresholds(40)(swings);
  const y = d3.scaleLinear().domain([0, d3.max(bins, d => d.length)]).nice().range([h, 0]);

  const g = histSvg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // Bars
  g.selectAll("rect")
    .data(bins)
    .join("rect")
      .attr("x", d => x(d.x0) + 0.5)
      .attr("width", d => Math.max(0, x(d.x1) - x(d.x0) - 1))
      .attr("y", d => y(d.length))
      .attr("height", d => h - y(d.length))
      .attr("fill", d => {
        const mid = (d.x0 + d.x1) / 2;
        return mid > 0 ? "#ef4444" : "#3b82f6";
      })
      .attr("opacity", 0.7);

  // Axes
  g.append("g")
    .attr("transform", `translate(0,${h})`)
    .call(d3.axisBottom(x).ticks(8).tickFormat(d => (d > 0 ? "R+" : "D+") + Math.abs(d)))
    .call(g => g.select(".domain").attr("stroke", "#374151"))
    .call(g => g.selectAll(".tick line").attr("stroke", "#374151"))
    .call(g => g.selectAll(".tick text").attr("fill", "#9ca3af").attr("font-size", 9));

  g.append("g")
    .call(d3.axisLeft(y).ticks(5))
    .call(g => g.select(".domain").attr("stroke", "#374151"))
    .call(g => g.selectAll(".tick line").attr("stroke", "#374151"))
    .call(g => g.selectAll(".tick text").attr("fill", "#9ca3af").attr("font-size", 9));

  // Zero line
  g.append("line")
    .attr("x1", x(0)).attr("x2", x(0))
    .attr("y1", 0).attr("y2", h)
    .attr("stroke", "#6b7280")
    .attr("stroke-dasharray", "3,3")
    .attr("opacity", 0.5);

  // Brush
  const brush = d3.brushX()
    .extent([[0, 0], [w, h]])
    .on("brush end", ({ selection }) => {
      if (selection) {
        const [x0, x1] = selection.map(x.invert);
        brushedRange = [x0, x1];
        const count = swings.filter(s => s >= x0 && s <= x1).length;
        brushInfo.textContent = `${count} counties in range`;
      } else {
        brushedRange = null;
        brushInfo.textContent = "";
      }
      drawMap();
    });

  g.append("g")
    .attr("class", "brush")
    .call(brush)
    .call(g => g.selectAll(".selection")
      .attr("fill", "#6366f1")
      .attr("fill-opacity", 0.25)
      .attr("stroke", "#818cf8"));
}

// ── Slider ──
const slider = document.getElementById("year-slider");
const yearLabel = document.getElementById("year-label");
const playBtn = document.getElementById("play-btn");

function setYear(yi) {
  currentYear = yi;
  slider.value = yi;
  yearLabel.textContent = years[yi];
  brushedRange = null;
  brushInfo.textContent = "";
  drawMap();
  drawHistogram();
}

slider.addEventListener("input", () => setYear(+slider.value));

let playing = false;
let playTimer;
playBtn.addEventListener("click", () => {
  if (playing) {
    clearInterval(playTimer);
    playBtn.textContent = "▶ Play";
    playing = false;
  } else {
    playing = true;
    playBtn.textContent = "⏸ Pause";
    playTimer = setInterval(() => {
      const next = (currentYear + 1) % years.length;
      setYear(next);
      if (next === years.length - 1) {
        clearInterval(playTimer);
        playBtn.textContent = "▶ Play";
        playing = false;
      }
    }, 1200);
  }
});

// ── Init ──
window.addEventListener("resize", () => { resize(); drawHistogram(); });
setYear(0);
resize();
drawHistogram();
</script>
</body>
</html>
