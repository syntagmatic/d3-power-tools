<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block–Skill Adjacency Matrix</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #0a0a0f;
    color: #ccc;
    overflow: hidden;
    height: 100vh;
  }
  #header {
    padding: 12px 20px 8px;
    display: flex;
    align-items: baseline;
    gap: 24px;
    background: #0a0a0f;
    border-bottom: 1px solid #222;
    z-index: 10;
    position: relative;
  }
  #header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #eee;
    white-space: nowrap;
  }
  .controls {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 12px;
  }
  .controls label {
    color: #888;
  }
  .controls select {
    background: #1a1a24;
    color: #ccc;
    border: 1px solid #333;
    padding: 3px 6px;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
  }
  .controls select:hover { border-color: #555; }
  #legend {
    display: flex;
    gap: 12px;
    margin-left: auto;
    font-size: 11px;
    align-items: center;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    opacity: 0.85;
    transition: opacity 0.15s;
  }
  .legend-item:hover { opacity: 1; }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }
  #chart-container {
    position: relative;
    width: 100%;
    height: calc(100vh - 48px);
    overflow: hidden;
  }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(15, 15, 25, 0.95);
    border: 1px solid #444;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    color: #ddd;
    z-index: 100;
    display: none;
    max-width: 320px;
    backdrop-filter: blur(4px);
  }
  #tooltip .tt-block { font-weight: 600; color: #fff; }
  #tooltip .tt-skill { color: #aaa; }
  #tooltip .tt-cat { font-size: 10px; margin-top: 2px; }
  .cell { transition: opacity 0.15s; }
  .axis-label {
    font-size: 10px;
    fill: #888;
    cursor: default;
  }
  .axis-label:hover { fill: #ddd; }
  .skill-count, .block-count {
    font-size: 9px;
    fill: #555;
  }
  .grid-line { stroke: #1a1a24; stroke-width: 0.5; }
</style>
</head>
<body>
<div id="header">
  <h1>Block–Skill Matrix</h1>
  <div class="controls">
    <label>Sort blocks:
      <select id="sort-blocks">
        <option value="id">by ID</option>
        <option value="usage">by skill count</option>
        <option value="name">by name</option>
      </select>
    </label>
    <label>Sort skills:
      <select id="sort-skills">
        <option value="usage" selected>by usage count</option>
        <option value="name">by name</option>
        <option value="category">by category</option>
      </select>
    </label>
  </div>
  <div id="legend"></div>
</div>
<div id="chart-container">
  <svg id="matrix"></svg>
</div>
<div id="tooltip"></div>

<script type="module">
// --- Real data from manifest ---

const blocks = [

  {id:"77",name:"Sunburst Breadcrumb Brush",skills:["hierarchy-interaction","brushing","color"]},
  {id:"78",name:"Expandable Edge Bundle",skills:["hierarchy-interaction","edge-bundling","canvas"]},
  {id:"79",name:"Reduced Motion Dashboard",skills:["responsive","motion","linked-views"]},
  {id:"80",name:"Container Query Chart",skills:["responsive","small-multiples","scales"]},
  {id:"81",name:"Letter-Value Table Toggle",skills:["data-table","distributions","canvas-accessibility"]},
  {id:"82",name:"Hive Plot Accessible",skills:["network","canvas-accessibility","scales"]},
  {id:"83",name:"Community Detection Table",skills:["network","data-table","color"]},
  {id:"84",name:"Sparkline Embed Text",skills:["sparkcharts","data-table","responsive"]},
  {id:"85",name:"Skill Constellation",skills:["force","network","color"]},
  {id:"86",name:"Block–Skill Matrix",skills:["network","scales","navigation"]},
  {id:"87",name:"Skill Anatomy Treemap",skills:["hierarchy-layouts","color","annotation"]},
  {id:"88",name:"Agent Disagreement Parcoords",skills:["parallel-coordinates","brushing","color"]},
  {id:"89",name:"Score Ridge Plot",skills:["distributions","color","motion"]},
  {id:"90",name:"Skill Growth Sparklines",skills:["sparkcharts","data-gathering","time-series"]},
  {id:"91",name:"Test Coverage Heatmap",skills:["color","scales","data-table"]},
  {id:"92",name:"Score Delta Waterfall",skills:["scales","annotation","color"]},
  {id:"93",name:"Prompt Complexity Scatter",skills:["brushing","annotation","scales"]},
  {id:"94",name:"Election Swing Map",skills:["cartography","time-series","linked-views"]},
  {id:"95",name:"Flight Route Bundling",skills:["edge-bundling","cartography","canvas"]},
  {id:"96",name:"Regional Parcoords Grid",skills:["parallel-coordinates","small-multiples","brushing"]},
  {id:"97",name:"Supply Chain Sankey",skills:["network","motion","brushing"]},
  {id:"98",name:"Shape Morphing Timeline",skills:["shape-morphing","time-series","motion"]},
  {id:"99",name:"Tidal Harmonic Decomposition",skills:["time-series","distributions","annotation"]},
  {id:"100",name:"City Similarity Explorer",skills:["parallel-coordinates","cartography","linked-views"]},
  {id:"101",name:"WebGL Color Space",skills:["webgl","color","navigation"]},
  {id:"102",name:"Earthquake Depth Globe",skills:["cartography","distributions","canvas"]},
  {id:"103",name:"Book Sentence Rhythm",skills:["sparkcharts","distributions","small-multiples"]},
  {id:"104",name:"Nutrient Treemap Explorer",skills:["hierarchy-interaction","parallel-coordinates","linked-views"]},
  {id:"105",name:"Migration Flow Chord",skills:["network","time-series","motion"]}
];

// Derive skill list and usage counts
const allSkills = Object.keys(skillCategories);
const skillUsage = new Map();
allSkills.forEach(s => skillUsage.set(s, 0));
blocks.forEach(b => b.skills.forEach(s => skillUsage.set(s, (skillUsage.get(s) || 0) + 1)));

// Build matrix lookup
const matrix = new Set();
blocks.forEach(b => b.skills.forEach(s => matrix.add(`${b.id}|${s}`)));

// --- Layout ---
const margin = { top: 160, right: 20, bottom: 30, left: 200 };
const cellSize = 11;
const cellPad = 1;

const container = document.getElementById("chart-container");
const svg = d3.select("#matrix");
const tooltip = d3.select("#tooltip");

// Legend
const legendEl = document.getElementById("legend");
const cats = [...new Set(Object.values(skillCategories))];
cats.forEach(cat => {
  const item = document.createElement("span");
  item.className = "legend-item";
  item.innerHTML = `<span class="legend-swatch" style="background:${categoryColors[cat]}"></span>${cat}`;
  legendEl.appendChild(item);
});

// Sort functions
const sortBlocks = {
  id: (a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}),
  name: (a, b) => a.name.localeCompare(b.name),
  usage: (a, b) => b.skills.length - a.skills.length || a.id.localeCompare(b.id, undefined, {numeric: true})
};

const sortSkills = {
  name: (a, b) => a.localeCompare(b),
  usage: (a, b) => skillUsage.get(b) - skillUsage.get(a) || a.localeCompare(b),
  category: (a, b) => {
    const ci = cats.indexOf(skillCategories[a]) - cats.indexOf(skillCategories[b]);
    return ci !== 0 ? ci : a.localeCompare(b);
  }
};

let currentBlockSort = "id";
let currentSkillSort = "usage";
let sortedBlocks = [...blocks].sort(sortBlocks[currentBlockSort]);
let sortedSkills = [...allSkills].sort(sortSkills[currentSkillSort]);

function getColor(skill) {
  const cat = skillCategories[skill];
  return categoryColors[cat] || "#666";
}

// --- Zoom ---
const zoom = d3.zoom()
  .scaleExtent([0.5, 3])
  .on("zoom", (event) => {
    g.attr("transform", event.transform);
  });

svg.call(zoom);

const g = svg.append("g");

function render() {
  const totalW = margin.left + sortedSkills.length * (cellSize + cellPad) + margin.right;
  const totalH = margin.top + sortedBlocks.length * (cellSize + cellPad) + margin.bottom;

  svg
    .attr("width", container.clientWidth)
    .attr("height", container.clientHeight);

  // scales
  const x = d3.scaleBand()
    .domain(sortedSkills)
    .range([margin.left, margin.left + sortedSkills.length * (cellSize + cellPad)])
    .padding(0.1);

  const y = d3.scaleBand()
    .domain(sortedBlocks.map(b => b.id))
    .range([margin.top, margin.top + sortedBlocks.length * (cellSize + cellPad)])
    .padding(0.1);

  g.selectAll("*").remove();

  // Grid background lines — horizontal
  g.selectAll(".hline")
    .data(sortedBlocks)
    .join("line")
    .attr("class", "grid-line")
    .attr("x1", margin.left)
    .attr("x2", margin.left + sortedSkills.length * (cellSize + cellPad))
    .attr("y1", d => y(d.id) + y.bandwidth() + cellPad / 2)
    .attr("y2", d => y(d.id) + y.bandwidth() + cellPad / 2);

  // Grid background lines — vertical
  g.selectAll(".vline")
    .data(sortedSkills)
    .join("line")
    .attr("class", "grid-line")
    .attr("x1", d => x(d) + x.bandwidth() + cellPad / 2)
    .attr("x2", d => x(d) + x.bandwidth() + cellPad / 2)
    .attr("y1", margin.top)
    .attr("y2", margin.top + sortedBlocks.length * (cellSize + cellPad));

  // Cells
  const cellData = [];
  sortedBlocks.forEach(block => {
    sortedSkills.forEach(skill => {
      if (matrix.has(`${block.id}|${skill}`)) {
        cellData.push({ block, skill });
      }
    });
  });

  g.selectAll(".cell")
    .data(cellData, d => `${d.block.id}|${d.skill}`)
    .join("rect")
    .attr("class", "cell")
    .attr("x", d => x(d.skill))
    .attr("y", d => y(d.block.id))
    .attr("width", x.bandwidth())
    .attr("height", y.bandwidth())
    .attr("rx", 1.5)
    .attr("fill", d => getColor(d.skill))
    .attr("opacity", 0.85)
    .on("pointerenter", (event, d) => {
      const cat = skillCategories[d.skill];
      tooltip.html(
        `<span class="tt-block">#${d.block.id} ${d.block.name}</span><br>` +
        `<span class="tt-skill">${d.skill}</span>` +
        `<div class="tt-cat" style="color:${getColor(d.skill)}">${cat}</div>`
      ).style("display", "block");

      // Highlight row and column
      g.selectAll(".cell")
        .attr("opacity", c =>
          c.block.id === d.block.id || c.skill === d.skill ? 1 : 0.2
        );
      g.selectAll(".block-label")
        .attr("fill", l => l.id === d.block.id ? "#fff" : "#888");
      g.selectAll(".skill-label")
        .attr("fill", l => l === d.skill ? "#fff" : "#888");
    })
    .on("pointermove", (event) => {
      const tx = event.clientX + 14;
      const ty = event.clientY - 10;
      tooltip
        .style("left", Math.min(tx, window.innerWidth - 260) + "px")
        .style("top", Math.min(ty, window.innerHeight - 80) + "px");
    })
    .on("pointerleave", () => {
      tooltip.style("display", "none");
      g.selectAll(".cell").attr("opacity", 0.85);
      g.selectAll(".block-label").attr("fill", "#888");
      g.selectAll(".skill-label").attr("fill", "#888");
    });

  // Block labels (rows)
  g.selectAll(".block-label")
    .data(sortedBlocks)
    .join("text")
    .attr("class", "block-label axis-label")
    .attr("x", margin.left - 6)
    .attr("y", d => y(d.id) + y.bandwidth() / 2)
    .attr("dy", "0.35em")
    .attr("text-anchor", "end")
    .text(d => `${d.id} ${d.name}`)
    .each(function() {
      // Truncate long labels
      const node = d3.select(this);
      if (this.getComputedTextLength && this.getComputedTextLength() > margin.left - 16) {
        let txt = node.text();
        while (this.getComputedTextLength() > margin.left - 20 && txt.length > 0) {
          txt = txt.slice(0, -1);
          node.text(txt + "…");
        }
      }
    });

  // Block usage count (right side)
  g.selectAll(".block-count")
    .data(sortedBlocks)
    .join("text")
    .attr("class", "block-count")
    .attr("x", margin.left + sortedSkills.length * (cellSize + cellPad) + 4)
    .attr("y", d => y(d.id) + y.bandwidth() / 2)
    .attr("dy", "0.35em")
    .text(d => d.skills.length);

  // Skill labels (columns, rotated)
  g.selectAll(".skill-label")
    .data(sortedSkills)
    .join("text")
    .attr("class", "skill-label axis-label")
    .attr("transform", d => `translate(${x(d) + x.bandwidth() / 2},${margin.top - 6}) rotate(-55)`)
    .attr("text-anchor", "start")
    .text(d => d);

  // Skill usage count (bottom)
  g.selectAll(".skill-count")
    .data(sortedSkills)
    .join("text")
    .attr("class", "skill-count")
    .attr("transform", d => `translate(${x(d) + x.bandwidth() / 2},${margin.top + sortedBlocks.length * (cellSize + cellPad) + 12})`)
    .attr("text-anchor", "middle")
    .text(d => skillUsage.get(d));

  // Fit initial view
  const bounds = g.node().getBBox();
  const fullW = container.clientWidth;
  const fullH = container.clientHeight;
  const scale = Math.min(
    fullW / (bounds.width + 40),
    fullH / (bounds.height + 40),
    1.0
  );
  const tx = (fullW - bounds.width * scale) / 2 - bounds.x * scale;
  const ty = (fullH - bounds.height * scale) / 2 - bounds.y * scale;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// Sort controls
d3.select("#sort-blocks").on("change", function() {
  currentBlockSort = this.value;
  sortedBlocks = [...blocks].sort(sortBlocks[currentBlockSort]);
  render();
});

d3.select("#sort-skills").on("change", function() {
  currentSkillSort = this.value;
  sortedSkills = [...allSkills].sort(sortSkills[currentSkillSort]);
  render();
});

// Resize
new ResizeObserver(() => {
  svg
    .attr("width", container.clientWidth)
    .attr("height", container.clientHeight);
}).observe(container);

render();
</script>
</body>
</html>
