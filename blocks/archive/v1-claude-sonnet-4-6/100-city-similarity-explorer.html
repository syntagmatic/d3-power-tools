<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City Similarity Explorer</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0a0a12;color:#e0e0e0}
  h1{margin:0;padding:16px 24px 4px;font-size:18px;font-weight:600;letter-spacing:0.02em}
  .subtitle{padding:0 24px 8px;font-size:13px;color:#888}
  #parcoords{position:relative;width:100%;height:320px}
  #parcoords canvas,#parcoords svg{position:absolute;top:0;left:0}
  #parcoords svg{pointer-events:all}
  #parcoords canvas{pointer-events:none}
  #map-container{position:relative;width:100%;height:420px}
  #map-container canvas{position:absolute;top:0;left:0}
  .axis text{font-size:11px;fill:#aaa}
  .axis .domain,.axis line{stroke:#444}
  .axis-label{font-size:11px;fill:#ccc;text-anchor:middle;font-weight:600}
  .brush .selection{fill:rgba(100,180,255,0.25);stroke:#6ab4ff;stroke-width:1}
  .tooltip{position:fixed;padding:6px 10px;background:rgba(20,20,30,0.92);border:1px solid #555;border-radius:4px;font-size:12px;pointer-events:none;color:#ddd;white-space:nowrap;display:none;z-index:10}
  .legend{padding:4px 24px 12px;font-size:12px;color:#888}
</style>
</head>
<body>
<h1>City Similarity Explorer</h1>
<p class="subtitle">Brush axes to filter &middot; hover for details &middot; 40 world cities &times; 6 dimensions</p>
<div id="parcoords"></div>
<div id="map-container"></div>
<p class="legend">Selected: <span id="count">40</span> / 40 cities</p>
<div class="tooltip" id="tooltip"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

// ── Synthetic data ──────────────────────────────────────────────────
const cities = [

  {name:"Dhaka",lat:23.81,lon:90.41,population:8910,density:23234,elevation:8,temp:26.1,rainfall:2123,cost:28},

  {name:"Ho Chi Minh",lat:10.82,lon:106.63,population:8993,density:4292,elevation:19,temp:28.0,rainfall:1931,cost:35},
  {name:"Nairobi",lat:-1.29,lon:36.82,population:4397,density:6210,elevation:1661,temp:19.1,rainfall:869,cost:40},
  {name:"Singapore",lat:1.35,lon:103.82,population:5454,density:8358,elevation:15,temp:27.5,rainfall:2340,cost:95},
  {name:"Riyadh",lat:24.71,lon:46.68,population:7680,density:3900,elevation:612,temp:26.8,rainfall:100,cost:52},
  {name:"Moscow",lat:55.76,lon:37.62,population:12500,density:4900,elevation:156,temp:6.7,rainfall:707,cost:50},
  {name:"Paris",lat:48.86,lon:2.35,population:2161,density:20500,elevation:35,temp:12.3,rainfall:637,cost:106},
  {name:"Sydney",lat:-33.87,lon:151.21,population:5312,density:2037,elevation:58,temp:18.4,rainfall:1213,cost:88},
  {name:"Johannesburg",lat:-26.20,lon:28.05,population:5635,density:2860,elevation:1753,temp:16.7,rainfall:713,cost:43},
  {name:"Toronto",lat:43.65,lon:-79.38,population:2930,density:4334,elevation:76,temp:9.4,rainfall:831,cost:82},
  {name:"Berlin",lat:52.52,lon:13.41,population:3645,density:4090,elevation:34,temp:10.4,rainfall:570,cost:72},
  {name:"Madrid",lat:40.42,lon:-3.70,population:3223,density:5400,elevation:667,temp:15.0,rainfall:436,cost:67},
  {name:"Santiago",lat:-33.45,lon:-70.67,population:5614,density:8500,elevation:520,temp:14.4,rainfall:312,cost:45},
  {name:"Addis Ababa",lat:9.02,lon:38.75,population:3352,density:5165,elevation:2355,temp:16.3,rainfall:1143,cost:32},
  {name:"Denver",lat:39.74,lon:-104.99,population:715,density:1800,elevation:1609,temp:10.8,rainfall:396,cost:75},
  {name:"Kathmandu",lat:27.72,lon:85.32,population:1442,density:20288,elevation:1400,temp:18.9,rainfall:1505,cost:25},
  {name:"La Paz",lat:-16.50,lon:-68.15,population:816,density:4600,elevation:3640,temp:8.5,rainfall:575,cost:29},
  {name:"Reykjavik",lat:64.15,lon:-21.93,population:131,density:500,elevation:15,temp:5.0,rainfall:799,cost:96},
  {name:"Dubai",lat:25.20,lon:55.27,population:3490,density:762,elevation:5,temp:28.2,rainfall:94,cost:80},
  {name:"Cape Town",lat:-33.93,lon:18.42,population:4618,density:1530,elevation:0,temp:17.4,rainfall:515,cost:39},
];

const dims = [
  {key:"population",label:"Population (k)"},
  {key:"density",label:"Density (/km²)"},
  {key:"elevation",label:"Elevation (m)"},
  {key:"temp",label:"Avg Temp (°C)"},
  {key:"rainfall",label:"Rainfall (mm)"},
  {key:"cost",label:"Cost Index"},
];

// ── Selection model ─────────────────────────────────────────────────
class SelectionModel {
  #keys = new Set();
  #dispatch = d3.dispatch("change");
  select(keys, source) {
    this.#keys = new Set(keys);
    this.#dispatch.call("change", null, {keys: this.#keys, source});
  }
  clear(source) {
    this.#keys.clear();
    this.#dispatch.call("change", null, {keys: this.#keys, source});
  }
  isSelected(key) { return this.#keys.size === 0 || this.#keys.has(key); }
  get size() { return this.#keys.size; }
  on(event, fn) { this.#dispatch.on(event, fn); return this; }
}

const sel = new SelectionModel();
const tooltip = document.getElementById("tooltip");
const countEl = document.getElementById("count");

// ── Parallel coordinates ────────────────────────────────────────────
const pcDiv = document.getElementById("parcoords");
const margin = {top: 32, right: 24, bottom: 12, left: 24};
const pcWidth = pcDiv.clientWidth;
const pcHeight = 320;
const W = pcWidth - margin.left - margin.right;
const H = pcHeight - margin.top - margin.bottom;

const canvas = document.createElement("canvas");
canvas.width = pcWidth * devicePixelRatio;
canvas.height = pcHeight * devicePixelRatio;
canvas.style.width = pcWidth + "px";
canvas.style.height = pcHeight + "px";
pcDiv.appendChild(canvas);
const ctx = canvas.getContext("2d");
ctx.scale(devicePixelRatio, devicePixelRatio);

const svg = d3.select(pcDiv).append("svg")
  .attr("width", pcWidth).attr("height", pcHeight);
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

const x = d3.scalePoint().domain(dims.map(d => d.key)).range([0, W]).padding(0.08);
const scales = {};
for (const dim of dims) {
  const ext = d3.extent(cities, d => d[dim.key]);
  scales[dim.key] = d3.scaleLinear().domain(ext).nice().range([H, 0]);
}

// Axes
const axisGroups = g.selectAll(".axis")
  .data(dims)
  .join("g")
    .attr("class", "axis")
    .attr("transform", d => `translate(${x(d.key)},0)`)
    .each(function(d) { d3.select(this).call(d3.axisLeft(scales[d.key]).ticks(6)); });

axisGroups.append("text")
  .attr("class", "axis-label")
  .attr("y", -16)
  .text(d => d.label);

// Brushes
const filters = {};
const brushes = axisGroups.append("g")
  .attr("class", "brush")
  .each(function(d) {
    d3.select(this).call(
      d3.brushY()
        .extent([[-12, 0], [12, H]])
        .on("brush end", function(event) {
          if (!event.selection) {
            delete filters[d.key];
          } else {
            const [y0, y1] = event.selection;
            const s = scales[d.key];
            filters[d.key] = v => { const py = s(v); return py >= y0 && py <= y1; };
          }
          applyFilters();
        })
    );
  });

function applyFilters() {
  const active = Object.keys(filters);
  if (active.length === 0) {
    sel.clear("parcoords");
  } else {
    const keys = cities
      .filter(c => active.every(k => filters[k](c[k])))
      .map(c => c.name);
    sel.select(keys, "parcoords");
  }
}

// Canvas rendering
function drawPC() {
  ctx.clearRect(0, 0, pcWidth, pcHeight);
  ctx.save();
  ctx.translate(margin.left, margin.top);

  // Background (unselected) lines
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = "#6ab4ff";
  for (const c of cities) {
    if (sel.isSelected(c.name) && sel.size > 0) continue;
    drawLine(c);
  }

  // Ghost lines for unselected when filter active
  if (sel.size > 0) {
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = "#555";
    for (const c of cities) {
      if (!sel.isSelected(c.name)) drawLine(c);
    }
    // Foreground (selected) lines
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = "#6ab4ff";
    ctx.lineWidth = 1.8;
    for (const c of cities) {
      if (sel.isSelected(c.name)) drawLine(c);
    }
  }

  ctx.restore();
}

function drawLine(c) {
  ctx.beginPath();
  dims.forEach((d, i) => {
    const px = x(d.key), py = scales[d.key](c[d.key]);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  });
  ctx.stroke();
}

// ── World map ───────────────────────────────────────────────────────
const mapDiv = document.getElementById("map-container");
const mapW = mapDiv.clientWidth;
const mapH = 420;

const mapCanvas = document.createElement("canvas");
mapCanvas.width = mapW * devicePixelRatio;
mapCanvas.height = mapH * devicePixelRatio;
mapCanvas.style.width = mapW + "px";
mapCanvas.style.height = mapH + "px";
mapDiv.appendChild(mapCanvas);
const mCtx = mapCanvas.getContext("2d");
mCtx.scale(devicePixelRatio, devicePixelRatio);

// SVG overlay for interaction
const mapSvg = d3.select(mapDiv).append("svg")
  .attr("width", mapW).attr("height", mapH)
  .style("position", "absolute").style("top", 0).style("left", 0);

const projection = d3.geoEqualEarth().fitSize([mapW - 40, mapH - 40], {type: "Sphere"})
  .translate([mapW / 2, mapH / 2]);
const path = d3.geoPath(projection);
const canvasPath = d3.geoPath(projection, mCtx);

// Load world TopoJSON
const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
const countries = topojson.feature(world, world.objects.countries).features;
const borders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

function drawMap() {
  mCtx.clearRect(0, 0, mapW, mapH);

  // Ocean
  mCtx.beginPath();
  canvasPath({type: "Sphere"});
  mCtx.fillStyle = "#0d1117";
  mCtx.fill();
  mCtx.strokeStyle = "#2a2a3a";
  mCtx.lineWidth = 0.5;
  mCtx.stroke();

  // Countries
  mCtx.fillStyle = "#1a1a2e";
  for (const f of countries) {
    mCtx.beginPath();
    canvasPath(f);
    mCtx.fill();
  }

  // Borders
  mCtx.beginPath();
  canvasPath(borders);
  mCtx.strokeStyle = "#2a2a3a";
  mCtx.lineWidth = 0.3;
  mCtx.stroke();

  // Cities — unselected
  for (const c of cities) {
    if (sel.isSelected(c.name) && sel.size > 0) continue;
    const [cx, cy] = projection([c.lon, c.lat]);
    mCtx.beginPath();
    mCtx.arc(cx, cy, 3, 0, Math.PI * 2);
    mCtx.fillStyle = sel.size > 0 ? "rgba(100,100,100,0.4)" : "rgba(106,180,255,0.6)";
    mCtx.fill();
  }

  // Cities — selected
  if (sel.size > 0) {
    for (const c of cities) {
      if (!sel.isSelected(c.name)) continue;
      const [cx, cy] = projection([c.lon, c.lat]);
      // Glow
      mCtx.beginPath();
      mCtx.arc(cx, cy, 8, 0, Math.PI * 2);
      mCtx.fillStyle = "rgba(106,180,255,0.15)";
      mCtx.fill();
      // Dot
      mCtx.beginPath();
      mCtx.arc(cx, cy, 4, 0, Math.PI * 2);
      mCtx.fillStyle = "#6ab4ff";
      mCtx.fill();
      mCtx.strokeStyle = "#fff";
      mCtx.lineWidth = 0.8;
      mCtx.stroke();
    }
  }
}

// City labels on SVG for hover
const cityDots = mapSvg.selectAll(".city-hit")
  .data(cities)
  .join("circle")
    .attr("class", "city-hit")
    .attr("cx", d => projection([d.lon, d.lat])[0])
    .attr("cy", d => projection([d.lon, d.lat])[1])
    .attr("r", 8)
    .attr("fill", "transparent")
    .attr("cursor", "pointer")
    .on("pointerenter", (event, d) => {
      tooltip.style.display = "block";
      tooltip.innerHTML = `<strong>${d.name}</strong><br>Pop: ${d.population}k · Density: ${d3.format(",")(d.density)}/km²<br>Elev: ${d.elevation}m · Temp: ${d.temp}°C<br>Rain: ${d.rainfall}mm · Cost: ${d.cost}`;
    })
    .on("pointermove", (event) => {
      tooltip.style.left = event.clientX + 12 + "px";
      tooltip.style.top = event.clientY - 10 + "px";
    })
    .on("pointerleave", () => { tooltip.style.display = "none"; });

// Also hover on parcoords SVG
svg.on("pointermove", (event) => {
  const [mx, my] = d3.pointer(event);
  const px = mx - margin.left, py = my - margin.top;
  if (px < 0 || px > W || py < 0 || py > H) { tooltip.style.display = "none"; return; }
  // Find nearest city line
  let best = null, bestDist = 20;
  for (const c of cities) {
    let dist = 0, count = 0;
    for (const d of dims) {
      const ax = x(d.key), ay = scales[d.key](c[d.key]);
      const dx = px - ax, dy = py - ay;
      const dd = Math.sqrt(dx * dx + dy * dy);
      if (dd < 30) { dist += dd; count++; }
    }
    if (count > 0 && dist / count < bestDist) { bestDist = dist / count; best = c; }
  }
  if (best) {
    tooltip.style.display = "block";
    tooltip.innerHTML = `<strong>${best.name}</strong><br>Pop: ${best.population}k · Density: ${d3.format(",")(best.density)}/km²<br>Elev: ${best.elevation}m · Temp: ${best.temp}°C<br>Rain: ${best.rainfall}mm · Cost: ${best.cost}`;
    tooltip.style.left = event.clientX + 12 + "px";
    tooltip.style.top = event.clientY - 10 + "px";
  } else {
    tooltip.style.display = "none";
  }
}).on("pointerleave", () => { tooltip.style.display = "none"; });

// ── Link views ──────────────────────────────────────────────────────
let renderPending = false;
function scheduleRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    renderPending = false;
    drawPC();
    drawMap();
    countEl.textContent = sel.size === 0 ? cities.length : sel.size;
  });
}

sel.on("change", scheduleRender);

// Initial render
drawPC();
drawMap();
</script>
