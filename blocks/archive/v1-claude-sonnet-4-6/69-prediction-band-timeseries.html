<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prediction Band Time Series</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa; color: #333;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .container { width: 1200px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .subtitle { font-size: 13px; color: #777; margin: 2px 0 14px; }
  .chart-area { position: relative; }
  svg { display: block; }
  svg text { font-family: system-ui, -apple-system, sans-serif; }

  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: #fff; border: 1px solid #ddd; border-radius: 6px;
    padding: 8px 12px; font-size: 12px; line-height: 1.5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: opacity 0.12s;
  }
  .tooltip .date { font-weight: 600; margin-bottom: 2px; }
  .tooltip .val { font-family: "SF Mono", Monaco, "Cascadia Code", monospace; }
  .tooltip .band-label { color: #888; font-size: 11px; }

  .controls {
    display: flex; gap: 10px; margin-top: 14px; align-items: center;
  }
  .step-btn {
    padding: 6px 20px; font-size: 13px; font-weight: 500;
    border: 1.5px solid #4477AA; border-radius: 5px;
    background: #fff; color: #4477AA; cursor: pointer;
    font-family: system-ui; transition: all 0.15s;
  }
  .step-btn:hover { background: #4477AA; color: #fff; }
  .step-btn:disabled { opacity: 0.4; cursor: default; background: #fff; color: #4477AA; }
  .step-label {
    font-size: 12px; color: #999; margin-left: 8px;
  }

  .legend {
    display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; }
  .legend-swatch { width: 18px; height: 3px; border-radius: 1px; }
  .legend-band { width: 16px; height: 10px; border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <h1>Monthly Revenue with Forecast Fan Chart</h1>
  <p class="subtitle">30 months actual revenue, 6-month forecast with 50 / 80 / 95% confidence bands. Click through the story.</p>
  <div class="chart-area" id="chart">
    <div class="tooltip" id="tip"></div>
  </div>
  <div class="controls">
    <button class="step-btn" id="nextBtn">Tell the Story</button>
    <button class="step-btn" id="resetBtn">Reset</button>
    <span class="step-label" id="stepLabel"></span>
  </div>
  <div class="legend" id="legend"></div>
</div>
<script>
(() => {
  // --- Palette: Tol muted ---
  const TOL = {
    blue: "#4477AA", red: "#EE6677", green: "#228833",
    yellow: "#CCBB44", cyan: "#66CCEE", purple: "#AA3377", grey: "#BBBBBB"
  };

  // --- Dimensions ---
  const fullW = 1200, fullH = 800;
  const margin = { top: 50, right: 60, bottom: 60, left: 72 };
  const W = fullW - margin.left - margin.right;
  const H = fullH - margin.top - margin.bottom;

  // --- Synthetic data: 30 actual + 6 forecast ---
  const rng = d3.randomLcg(42);
  const normal = () => {
    let u, v;
    do { u = rng(); } while (u === 0);
    v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  const actual = [];
  const base0 = 1.8; // starting revenue $M
  let prev = base0;
  for (let i = 0; i < 30; i++) {
    const date = new Date(Date.UTC(2022, i, 1));
    const trend = base0 + 1.8 * (i / 29);
    const seasonal = 0.25 * Math.sin((i / 12) * 2 * Math.PI - Math.PI / 4);
    // Event bumps
    const launchBump = (i >= 6 && i <= 9) ? 0.15 * (i - 5) : 0;
    const priceBump = (i >= 15) ? 0.3 : 0;
    const competitorDip = (i >= 21 && i <= 24) ? -0.2 * (3 - Math.abs(i - 22.5)) : 0;
    const noise = normal() * 0.12;
    const val = trend + seasonal + launchBump + priceBump + competitorDip + noise;
    prev = val;
    actual.push({ date, value: val, type: "actual" });
  }

  const lastActualVal = actual[actual.length - 1].value;
  const lastActualDate = actual[actual.length - 1].date;
  const forecast = [];
  for (let i = 0; i < 6; i++) {
    const date = new Date(Date.UTC(2024, 5 + i, 1));
    const trend = lastActualVal + 0.07 * (i + 1);
    const seasonal = 0.18 * Math.sin(((30 + i) / 12) * 2 * Math.PI - Math.PI / 4);
    const median = trend + seasonal;
    const spread = 0.12 + 0.09 * i; // widening uncertainty
    forecast.push({
      date, value: median, type: "forecast",
      p50lo: median - spread * 0.674,
      p50hi: median + spread * 0.674,
      p80lo: median - spread * 1.282,
      p80hi: median + spread * 1.282,
      p95lo: median - spread * 1.960,
      p95hi: median + spread * 1.960,
    });
  }

  // Bridge point: last actual with zero-width bands for continuous area
  const bridgePt = {
    date: lastActualDate, value: lastActualVal, type: "forecast",
    p50lo: lastActualVal, p50hi: lastActualVal,
    p80lo: lastActualVal, p80hi: lastActualVal,
    p95lo: lastActualVal, p95hi: lastActualVal,
  };
  const forecastWithBridge = [bridgePt, ...forecast];

  const allData = [...actual, ...forecast];

  // --- Event annotations ---
  const events = [
    { date: new Date(Date.UTC(2022, 6, 1)), label: "Product Launch",
      body: "New SaaS tier drove 40% signup increase", dx: 30, dy: -50 },
    { date: new Date(Date.UTC(2023, 3, 1)), label: "Price Increase",
      body: "15% price hike with minimal churn", dx: 30, dy: -65 },
    { date: new Date(Date.UTC(2023, 9, 1)), label: "Competitor Entry",
      body: "Market share pressure slowed growth", dx: -30, dy: -50 },
  ];

  // Assign y from nearest actual data point
  events.forEach(e => {
    const nearest = actual.reduce((b, d) =>
      Math.abs(d.date - e.date) < Math.abs(b.date - e.date) ? d : b);
    e.y = nearest.value;
  });

  // --- Story steps ---
  const storySteps = [
    { id: "actual", label: "Revenue grew steadily over 30 months...",
      show: ["actualLine", "actualDots"] },
    { id: "event0", label: "A product launch in Jul 2022 accelerated growth.",
      show: ["actualLine", "actualDots", "event0"] },
    { id: "event1", label: "A price increase in Apr 2023 boosted revenue further.",
      show: ["actualLine", "actualDots", "event0", "event1"] },
    { id: "event2", label: "A competitor entered in Oct 2023, slowing momentum.",
      show: ["actualLine", "actualDots", "event0", "event1", "event2"] },
    { id: "forecast", label: "The forecast shows cautious optimism with widening uncertainty.",
      show: ["actualLine", "actualDots", "event0", "event1", "event2", "bands", "forecastLine", "divider"] },
  ];

  // --- Scales ---
  const allVals = allData.flatMap(d => {
    const v = [d.value];
    if (d.p95lo != null) v.push(d.p95lo, d.p95hi);
    return v;
  });
  const x = d3.scaleUtc()
    .domain(d3.extent(allData, d => d.date))
    .range([0, W]);
  const y = d3.scaleLinear()
    .domain([d3.min(allVals) - 0.3, d3.max(allVals) + 0.4])
    .range([H, 0]);

  // --- SVG ---
  const svg = d3.select("#chart").append("svg")
    .attr("width", fullW).attr("height", fullH)
    .attr("viewBox", `0 0 ${fullW} ${fullH}`);

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // Grid lines
  g.append("g").attr("class", "grid")
    .selectAll("line")
    .data(y.ticks(8))
    .join("line")
      .attr("x1", 0).attr("x2", W)
      .attr("y1", d => y(d)).attr("y2", d => y(d))
      .attr("stroke", "#e8e8e8").attr("stroke-width", 0.8);

  // Axes
  const xAxis = g.append("g").attr("transform", `translate(0,${H})`)
    .call(d3.axisBottom(x)
      .ticks(d3.utcMonth.every(3))
      .tickFormat(d3.utcFormat("%b '%y"))
      .tickSizeOuter(0))
    .call(g => g.select(".domain").attr("stroke", "#ccc"));
  xAxis.selectAll("text").attr("font-size", "11px").attr("fill", "#666");
  xAxis.selectAll("line").attr("stroke", "#ccc");

  const yAxis = g.append("g")
    .call(d3.axisLeft(y)
      .ticks(8)
      .tickFormat(d => `$${d.toFixed(1)}M`)
      .tickSizeOuter(0))
    .call(g => g.select(".domain").attr("stroke", "#ccc"));
  yAxis.selectAll("text").attr("font-size", "11px").attr("fill", "#666");
  yAxis.selectAll("line").attr("stroke", "#ccc");

  // Y label
  g.append("text")
    .attr("transform", "rotate(-90)")
    .attr("x", -H / 2).attr("y", -52)
    .attr("text-anchor", "middle")
    .attr("font-size", "12px").attr("fill", "#888").attr("font-weight", 500)
    .text("Revenue ($M)");

  // --- Layers (order matters for SVG stacking) ---
  const bandLayer = g.append("g").attr("class", "band-layer");
  const forecastLineLayer = g.append("g").attr("class", "forecast-line-layer");
  const actualLineLayer = g.append("g").attr("class", "actual-line-layer");
  const dotLayer = g.append("g").attr("class", "dot-layer");
  const annotLayer = g.append("g").attr("class", "annot-layer");
  const hoverLayer = g.append("g").attr("class", "hover-layer");

  // --- Prediction bands (widest first, narrowest on top) ---
  const bands = [
    { lo: "p95lo", hi: "p95hi", opacity: 0.12, label: "95%" },
    { lo: "p80lo", hi: "p80hi", opacity: 0.22, label: "80%" },
    { lo: "p50lo", hi: "p50hi", opacity: 0.35, label: "50%" },
  ];

  const bandPaths = [];
  bands.forEach(b => {
    const path = bandLayer.append("path")
      .datum(forecastWithBridge)
      .attr("d", d3.area()
        .x(d => x(d.date))
        .y0(d => y(d[b.lo]))
        .y1(d => y(d[b.hi]))
        .curve(d3.curveMonotoneX))
      .attr("fill", TOL.cyan)
      .attr("fill-opacity", 0)
      .attr("class", "band");
    bandPaths.push(path);
  });

  // Forecast median dashed line
  const fLine = forecastLineLayer.append("path")
    .datum(forecastWithBridge)
    .attr("d", d3.line().x(d => x(d.date)).y(d => y(d.value)).curve(d3.curveMonotoneX))
    .attr("fill", "none").attr("stroke", TOL.cyan)
    .attr("stroke-width", 2.5).attr("stroke-dasharray", "8,5")
    .attr("opacity", 0);

  // Divider line at forecast start
  const dividerLine = forecastLineLayer.append("line")
    .attr("x1", x(lastActualDate)).attr("x2", x(lastActualDate))
    .attr("y1", -10).attr("y2", H + 10)
    .attr("stroke", "#bbb").attr("stroke-dasharray", "5,4").attr("stroke-width", 1)
    .attr("opacity", 0);

  forecastLineLayer.append("text")
    .attr("x", x(lastActualDate) + 6).attr("y", -2)
    .attr("font-size", "10px").attr("fill", "#999").attr("font-weight", 600)
    .text("Forecast")
    .attr("opacity", 0)
    .attr("class", "divider-label");

  // --- Actual line ---
  const lineGen = d3.line().x(d => x(d.date)).y(d => y(d.value)).curve(d3.curveMonotoneX);

  const actualPath = actualLineLayer.append("path")
    .datum(actual)
    .attr("d", lineGen)
    .attr("fill", "none").attr("stroke", TOL.blue)
    .attr("stroke-width", 2.5).attr("stroke-linecap", "round")
    .attr("opacity", 0);

  // Animate actual line drawing
  const totalLen = actualPath.node().getTotalLength();
  actualPath
    .attr("stroke-dasharray", `${totalLen} ${totalLen}`)
    .attr("stroke-dashoffset", totalLen);

  // Actual dots
  const dots = dotLayer.selectAll("circle.dot")
    .data(actual)
    .join("circle")
      .attr("class", "dot")
      .attr("cx", d => x(d.date)).attr("cy", d => y(d.value))
      .attr("r", 3).attr("fill", TOL.blue)
      .attr("stroke", "#fff").attr("stroke-width", 1.2)
      .attr("opacity", 0);

  // --- Event annotations ---
  const eventGroups = events.map((ev, idx) => {
    const eg = annotLayer.append("g")
      .attr("class", `event-annot event-${idx}`)
      .attr("opacity", 0);

    // Vertical marker line
    eg.append("line")
      .attr("x1", x(ev.date)).attr("x2", x(ev.date))
      .attr("y1", 0).attr("y2", H)
      .attr("stroke", TOL.purple).attr("stroke-width", 1)
      .attr("stroke-dasharray", "4,3").attr("opacity", 0.5);

    // Diamond marker at data point
    eg.append("path")
      .attr("d", d3.symbol().type(d3.symbolDiamond).size(80)())
      .attr("transform", `translate(${x(ev.date)},${y(ev.y)})`)
      .attr("fill", TOL.purple).attr("stroke", "#fff").attr("stroke-width", 1);

    // Leader line
    const noteX = x(ev.date) + ev.dx;
    const noteY = y(ev.y) + ev.dy;
    eg.append("path")
      .attr("d", `M${x(ev.date)},${y(ev.y) - 7} Q${x(ev.date) + ev.dx * 0.3},${noteY + 12} ${noteX},${noteY + 12}`)
      .attr("fill", "none").attr("stroke", TOL.purple)
      .attr("stroke-width", 0.8).attr("opacity", 0.7);

    // Background rect for label
    const textW = Math.max(ev.label.length, ev.body.length) * 5.8 + 12;
    const textH = 34;
    const rx = ev.dx > 0 ? noteX - 4 : noteX - textW + 4;
    eg.append("rect")
      .attr("x", rx).attr("y", noteY - 13)
      .attr("width", textW).attr("height", textH)
      .attr("fill", "#fff").attr("rx", 4)
      .attr("stroke", "#e0e0e0").attr("stroke-width", 0.5)
      .attr("opacity", 0.95);

    // Title
    const anchor = ev.dx > 0 ? "start" : "end";
    eg.append("text")
      .attr("x", ev.dx > 0 ? noteX : noteX)
      .attr("y", noteY)
      .attr("text-anchor", anchor)
      .attr("font-size", "11px").attr("font-weight", 700)
      .attr("fill", TOL.purple)
      .text(ev.label);

    // Body
    eg.append("text")
      .attr("x", ev.dx > 0 ? noteX : noteX)
      .attr("y", noteY + 14)
      .attr("text-anchor", anchor)
      .attr("font-size", "10px").attr("fill", "#777")
      .text(ev.body);

    return eg;
  });

  // --- Crosshair + tooltip ---
  const crosshairLine = hoverLayer.append("line")
    .attr("y1", 0).attr("y2", H)
    .attr("stroke", "#aaa").attr("stroke-width", 0.8)
    .attr("stroke-dasharray", "3,3").attr("opacity", 0);

  const crosshairDot = hoverLayer.append("circle")
    .attr("r", 5).attr("fill", "none")
    .attr("stroke", TOL.blue).attr("stroke-width", 2)
    .attr("opacity", 0);

  const tip = d3.select("#tip");
  const fmt = d3.utcFormat("%b %Y");
  const valFmt = d => `$${d.toFixed(2)}M`;

  // Build Delaunay for all data points
  const delaunay = d3.Delaunay.from(allData, d => x(d.date), d => y(d.value));

  // Invisible interaction rect
  hoverLayer.append("rect")
    .attr("width", W).attr("height", H)
    .attr("fill", "none").attr("pointer-events", "all")
    .attr("cursor", "crosshair")
    .on("pointermove", (event) => {
      const [mx, my] = d3.pointer(event);
      const idx = delaunay.find(mx, my);
      const d = allData[idx];
      if (!d) return;

      const px = x(d.date), py = y(d.value);
      crosshairLine.attr("x1", px).attr("x2", px).attr("opacity", 1);
      crosshairDot.attr("cx", px).attr("cy", py).attr("opacity", 1)
        .attr("stroke", d.type === "forecast" ? TOL.cyan : TOL.blue);

      let html = `<div class="date">${fmt(d.date)}</div>`;
      html += `<div class="val">${d.type === "actual" ? "Actual" : "Forecast"}: ${valFmt(d.value)}</div>`;
      if (d.type === "forecast") {
        html += `<div class="band-label">50% CI: ${valFmt(d.p50lo)} - ${valFmt(d.p50hi)}</div>`;
        html += `<div class="band-label">80% CI: ${valFmt(d.p80lo)} - ${valFmt(d.p80hi)}</div>`;
        html += `<div class="band-label">95% CI: ${valFmt(d.p95lo)} - ${valFmt(d.p95hi)}</div>`;
      }
      tip.html(html);

      // Position tooltip, clamped to chart bounds
      const tipW = tip.node().offsetWidth;
      const tipH = tip.node().offsetHeight;
      let tx = px + margin.left + 14;
      let ty = py + margin.top - tipH / 2;
      if (tx + tipW > fullW - 10) tx = px + margin.left - tipW - 14;
      if (ty < 4) ty = 4;
      if (ty + tipH > fullH - 4) ty = fullH - tipH - 4;
      tip.style("left", `${tx}px`).style("top", `${ty}px`).style("opacity", 1);
    })
    .on("pointerleave", () => {
      crosshairLine.attr("opacity", 0);
      crosshairDot.attr("opacity", 0);
      tip.style("opacity", 0);
    });

  // --- Step-sequenced story reveal ---
  let currentStep = -1;

  const layerMap = {
    actualLine: { enter: () => {
      actualPath.attr("opacity", 1)
        .transition().duration(1200).ease(d3.easeCubicOut)
        .attr("stroke-dashoffset", 0);
    }, exit: () => {
      actualPath.attr("opacity", 0)
        .attr("stroke-dashoffset", totalLen);
    }},
    actualDots: { enter: () => {
      dots.transition().duration(600).delay((d, i) => i * 20)
        .attr("opacity", 1);
    }, exit: () => {
      dots.attr("opacity", 0);
    }},
    event0: { enter: () => fadeIn(eventGroups[0]), exit: () => fadeOut(eventGroups[0]) },
    event1: { enter: () => fadeIn(eventGroups[1]), exit: () => fadeOut(eventGroups[1]) },
    event2: { enter: () => fadeIn(eventGroups[2]), exit: () => fadeOut(eventGroups[2]) },
    bands: { enter: () => {
      bandPaths.forEach((p, i) => {
        p.transition().duration(700).delay(i * 150)
          .attr("fill-opacity", bands[i].opacity);
      });
    }, exit: () => {
      bandPaths.forEach(p => p.attr("fill-opacity", 0));
    }},
    forecastLine: { enter: () => {
      fLine.transition().duration(600).attr("opacity", 1);
    }, exit: () => {
      fLine.attr("opacity", 0);
    }},
    divider: { enter: () => {
      dividerLine.transition().duration(400).attr("opacity", 1);
      forecastLineLayer.select(".divider-label").transition().duration(400).attr("opacity", 1);
    }, exit: () => {
      dividerLine.attr("opacity", 0);
      forecastLineLayer.select(".divider-label").attr("opacity", 0);
    }},
  };

  function fadeIn(sel) {
    sel.transition().duration(500).ease(d3.easeCubicOut).attr("opacity", 1);
  }
  function fadeOut(sel) {
    sel.interrupt().attr("opacity", 0);
  }

  function goToStep(stepIdx) {
    if (stepIdx < 0 || stepIdx >= storySteps.length) return;
    const step = storySteps[stepIdx];
    const showSet = new Set(step.show);

    // Enter new layers, exit removed ones
    for (const [key, layer] of Object.entries(layerMap)) {
      if (showSet.has(key)) {
        layer.enter();
      } else {
        layer.exit();
      }
    }

    currentStep = stepIdx;
    d3.select("#stepLabel").text(`Step ${stepIdx + 1}/${storySteps.length}: ${step.label}`);
    d3.select("#nextBtn").text(stepIdx < storySteps.length - 1 ? "Next" : "Done")
      .attr("disabled", stepIdx >= storySteps.length - 1 ? true : null);
  }

  d3.select("#nextBtn").on("click", () => {
    if (currentStep < storySteps.length - 1) {
      goToStep(currentStep + 1);
    }
  });

  d3.select("#resetBtn").on("click", () => {
    currentStep = -1;
    for (const layer of Object.values(layerMap)) layer.exit();
    d3.select("#stepLabel").text("");
    d3.select("#nextBtn").text("Tell the Story").attr("disabled", null);
  });

  // Start with everything hidden -- story reveals it
  // But show a subtle prompt
  d3.select("#stepLabel").text("Click \"Tell the Story\" to begin");

  // --- Legend ---
  const legendDiv = d3.select("#legend");
  const legendItems = [
    { label: "Actual", color: TOL.blue, type: "line" },
    { label: "Forecast median", color: TOL.cyan, type: "dashed" },
    { label: "50% confidence", color: TOL.cyan, opacity: 0.35, type: "band" },
    { label: "80% confidence", color: TOL.cyan, opacity: 0.22, type: "band" },
    { label: "95% confidence", color: TOL.cyan, opacity: 0.12, type: "band" },
    { label: "Event marker", color: TOL.purple, type: "marker" },
  ];
  legendItems.forEach(item => {
    const el = legendDiv.append("div").attr("class", "legend-item");
    if (item.type === "line") {
      el.append("div").attr("class", "legend-swatch")
        .style("background", item.color);
    } else if (item.type === "dashed") {
      const ls = el.append("svg").attr("width", 20).attr("height", 6);
      ls.append("line").attr("x1", 0).attr("x2", 20).attr("y1", 3).attr("y2", 3)
        .attr("stroke", item.color).attr("stroke-width", 2.5).attr("stroke-dasharray", "5,3");
    } else if (item.type === "band") {
      el.append("div").attr("class", "legend-band")
        .style("background", item.color).style("opacity", item.opacity);
    } else if (item.type === "marker") {
      const ls = el.append("svg").attr("width", 14).attr("height", 14);
      ls.append("path")
        .attr("d", d3.symbol().type(d3.symbolDiamond).size(50)())
        .attr("transform", "translate(7,7)")
        .attr("fill", item.color);
    }
    el.append("span").text(item.label);
  });

  // Source line
  d3.select(".container").append("div")
    .style("font-size", "10px").style("color", "#bbb").style("margin-top", "8px")
    .text("Synthetic data for demonstration. Confidence intervals from normal quantiles.");
})();
</script>
</body>
</html>
