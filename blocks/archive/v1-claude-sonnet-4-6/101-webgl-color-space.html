<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1500 Named Colors in 3D OKLCH Space</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; overflow: hidden; }
canvas { display: block; }
#tooltip {
  position: absolute; pointer-events: none; display: none;
  background: rgba(20,20,40,0.92); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px; padding: 8px 12px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5); z-index: 10;
  max-width: 220px;
}
#tooltip .swatch {
  width: 32px; height: 32px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.3); display: inline-block;
  vertical-align: middle; margin-right: 8px;
}
#tooltip .info { display: inline-block; vertical-align: middle; }
#tooltip .name { font-weight: 600; font-size: 14px; }
#tooltip .vals { font-size: 11px; opacity: 0.7; margin-top: 2px; }
#controls {
  position: absolute; top: 16px; left: 16px; z-index: 5;
  background: rgba(20,20,40,0.85); border-radius: 8px; padding: 14px 18px;
  border: 1px solid rgba(255,255,255,0.1); font-size: 13px; min-width: 220px;
}
#controls h3 { font-size: 15px; margin-bottom: 10px; font-weight: 600; }
#controls label { display: block; margin: 6px 0 2px; font-size: 12px; opacity: 0.7; }
#controls input[type="range"] { width: 100%; accent-color: #7c83ff; }
.range-vals { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.5; }
#axes-label {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  font-size: 12px; opacity: 0.5; z-index: 5;
}
#count-label {
  position: absolute; top: 16px; right: 16px; z-index: 5;
  font-size: 13px; opacity: 0.7; background: rgba(20,20,40,0.85);
  border-radius: 6px; padding: 8px 14px; border: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="tooltip"><span class="swatch"></span><span class="info"><div class="name"></div><div class="vals"></div></span></div>
<div id="controls">
  <h3>Slice Planes</h3>
  <label>Lightness range</label>
  <input type="range" id="lMin" min="0" max="1" step="0.01" value="0">
  <input type="range" id="lMax" min="0" max="1" step="0.01" value="1">
  <div class="range-vals"><span id="lMinV">0%</span><span id="lMaxV">100%</span></div>
  <label>Chroma range</label>
  <input type="range" id="cMin" min="0" max="0.4" step="0.005" value="0">
  <input type="range" id="cMax" min="0" max="0.4" step="0.005" value="0.4">
  <div class="range-vals"><span id="cMinV">0.00</span><span id="cMaxV">0.40</span></div>
  <label style="margin-top:10px; opacity:0.4; font-size:11px;">Drag to orbit · Scroll to zoom</label>
</div>
<div id="count-label">Showing <span id="visCount">0</span> / <span id="totalCount">0</span> colors</div>
<div id="axes-label">X: Hue (°) · Y: Lightness · Z: Chroma</div>

<script type="module">
// ── Generate 1500 named colors ──
// Start from CSS named colors then generate additional synthetic color names
const CSS_COLORS = {
  aliceblue:'#f0f8ff',antiquewhite:'#faebd7',aqua:'#00ffff',aquamarine:'#7fffd4',
  azure:'#f0ffff',beige:'#f5f5dc',bisque:'#ffe4c4',black:'#000000',
  blanchedalmond:'#ffebcd',blue:'#0000ff',blueviolet:'#8a2be2',brown:'#a52a2a',
  burlywood:'#deb887',cadetblue:'#5f9ea0',chartreuse:'#7fff00',chocolate:'#d2691e',
  coral:'#ff7f50',cornflowerblue:'#6495ed',cornsilk:'#fff8dc',crimson:'#dc143c',
  cyan:'#00ffff',darkblue:'#00008b',darkcyan:'#008b8b',darkgoldenrod:'#b8860b',
  darkgray:'#a9a9a9',darkgreen:'#006400',darkkhaki:'#bdb76b',darkmagenta:'#8b008b',
  darkolivegreen:'#556b2f',darkorange:'#ff8c00',darkorchid:'#9932cc',darkred:'#8b0000',
  darksalmon:'#e9967a',darkseagreen:'#8fbc8f',darkslateblue:'#483d8b',darkslategray:'#2f4f4f',
  darkturquoise:'#00ced1',darkviolet:'#9400d3',deeppink:'#ff1493',deepskyblue:'#00bfff',
  dimgray:'#696969',dodgerblue:'#1e90ff',firebrick:'#b22222',floralwhite:'#fffaf0',
  forestgreen:'#228b22',fuchsia:'#ff00ff',gainsboro:'#dcdcdc',ghostwhite:'#f8f8ff',
  gold:'#ffd700',goldenrod:'#daa520',gray:'#808080',green:'#008000',
  greenyellow:'#adff2f',honeydew:'#f0fff0',hotpink:'#ff69b4',indianred:'#cd5c5c',
  indigo:'#4b0082',ivory:'#fffff0',khaki:'#f0e68c',lavender:'#e6e6fa',
  lavenderblush:'#fff0f5',lawngreen:'#7cfc00',lemonchiffon:'#fffacd',lightblue:'#add8e6',
  lightcoral:'#f08080',lightcyan:'#e0ffff',lightgoldenrodyellow:'#fafad2',lightgray:'#d3d3d3',
  lightgreen:'#90ee90',lightpink:'#ffb6c1',lightsalmon:'#ffa07a',lightseagreen:'#20b2aa',
  lightskyblue:'#87cefa',lightslategray:'#778899',lightsteelblue:'#b0c4de',lightyellow:'#ffffe0',
  lime:'#00ff00',limegreen:'#32cd32',linen:'#faf0e6',magenta:'#ff00ff',
  maroon:'#800000',mediumaquamarine:'#66cdaa',mediumblue:'#0000cd',mediumorchid:'#ba55d3',
  mediumpurple:'#9370db',mediumseagreen:'#3cb371',mediumslateblue:'#7b68ee',
  mediumspringgreen:'#00fa9a',mediumturquoise:'#48d1cc',mediumvioletred:'#c71585',
  midnightblue:'#191970',mintcream:'#f5fffa',mistyrose:'#ffe4e1',moccasin:'#ffe4b5',
  navajowhite:'#ffdead',navy:'#000080',oldlace:'#fdf5e6',olive:'#808000',
  olivedrab:'#6b8e23',orange:'#ffa500',orangered:'#ff4500',orchid:'#da70d6',
  palegoldenrod:'#eee8aa',palegreen:'#98fb98',paleturquoise:'#afeeee',palevioletred:'#db7093',
  papayawhip:'#ffefd5',peachpuff:'#ffdab9',peru:'#cd853f',pink:'#ffc0cb',
  plum:'#dda0dd',powderblue:'#b0e0e6',purple:'#800080',rebeccapurple:'#663399',
  red:'#ff0000',rosybrown:'#bc8f8f',royalblue:'#4169e1',saddlebrown:'#8b4513',
  salmon:'#fa8072',sandybrown:'#f4a460',seagreen:'#2e8b57',seashell:'#fff5ee',
  sienna:'#a0522d',silver:'#c0c0c0',skyblue:'#87ceeb',slateblue:'#6a5acd',
  slategray:'#708090',snow:'#fffafa',springgreen:'#00ff7f',steelblue:'#4682b4',
  tan:'#d2b48c',teal:'#008080',thistle:'#d8bfd8',tomato:'#ff6347',
  turquoise:'#40e0d0',violet:'#ee82ee',wheat:'#f5deb3',white:'#ffffff',
  whitesmoke:'#f5f5f5',yellow:'#ffff00',yellowgreen:'#9acd32'
};

// Prefixes and suffixes for generating named color variants
const PREFIXES = ['pale','deep','bright','soft','muted','warm','cool','dusty','rich','vivid',
  'faded','burnt','icy','smoky','stormy','misty','hazy','crisp','bold','dark','light',
  'pastel','neon','antique','vintage','fresh','electric','royal','sunset','dawn','twilight',
  'midnight','ocean','forest','desert','arctic','tropical','autumn','spring','summer','winter'];
const SUFFIXES = ['shade','tint','glow','haze','mist','frost','dusk','bloom','wash','blush',
  'dust','gleam','spark','flame','ember','stone','silk','pearl','clay','ash',
  'cream','ivory','opal','jade','moss','sage','fern','cedar','bark','rust',
  'sand','honey','amber','copper','bronze','pewter','steel','slate','smoke','shadow'];

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

// sRGB → linear
function linearize(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }

// Linear RGB → OKLCH via OKLab
function rgbToOklch(r, g, b) {
  const lr = linearize(r), lg = linearize(g), lb = linearize(b);
  const l_ = 0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb;
  const m_ = 0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb;
  const s_ = 0.0883024619 * lr + 0.2220049168 * lg + 0.6896926213 * lb;
  const l1 = Math.cbrt(l_), m1 = Math.cbrt(m_), s1 = Math.cbrt(s_);
  const L = 0.2104542553 * l1 + 0.7936177850 * m1 - 0.0040720468 * s1;
  const a = 1.9779984951 * l1 - 2.4285922050 * m1 + 0.4505937099 * s1;
  const bv = 0.0259040371 * l1 + 0.7827717662 * m1 - 0.8086757660 * s1;
  const C = Math.sqrt(a * a + bv * bv);
  let H = Math.atan2(bv, a) * 180 / Math.PI;
  if (H < 0) H += 360;
  return [L, C, H];
}

// Build 1500 colors
const colors = [];
const baseEntries = Object.entries(CSS_COLORS);

// Add all CSS named colors first
for (const [name, hex] of baseEntries) {
  const [r, g, b] = hexToRgb(hex);
  const [L, C, H] = rgbToOklch(r, g, b);
  colors.push({ name, hex, r, g, b, L, C, H });
}

// Generate synthetic variants to reach 1500
const rng = (() => { let s = 42; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; })();

while (colors.length < 1500) {
  const base = baseEntries[Math.floor(rng() * baseEntries.length)];
  const usePrefix = rng() > 0.4;
  const useSuffix = rng() > 0.5;
  const prefix = PREFIXES[Math.floor(rng() * PREFIXES.length)];
  const suffix = SUFFIXES[Math.floor(rng() * SUFFIXES.length)];
  let name = base[0];
  if (usePrefix) name = prefix + ' ' + name;
  if (useSuffix) name = name + ' ' + suffix;
  if (colors.some(c => c.name === name)) continue;

  // Vary the base color
  let [r, g, b] = hexToRgb(base[1]);
  const vary = () => Math.max(0, Math.min(255, Math.round(r + (rng() - 0.5) * 80)));
  r = vary(); g = Math.max(0, Math.min(255, Math.round(g + (rng() - 0.5) * 80)));
  b = Math.max(0, Math.min(255, Math.round(b + (rng() - 0.5) * 80)));
  const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  const [L, C, H] = rgbToOklch(r, g, b);
  colors.push({ name, hex, r, g, b, L, C, H });
}

// ── WebGL Setup ──
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
if (!gl) document.body.innerHTML = '<h1 style="color:white;padding:40px">WebGL not supported</h1>';

function resize() {
  const dpr = devicePixelRatio;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
addEventListener('resize', resize);

// Shaders
const vsSource = `
  attribute vec3 aPos;
  attribute vec3 aColor;
  attribute float aVisible;
  uniform mat4 uProj;
  uniform mat4 uView;
  uniform float uPointSize;
  varying vec3 vColor;
  varying float vVisible;
  void main() {
    vColor = aColor;
    vVisible = aVisible;
    gl_Position = uProj * uView * vec4(aPos, 1.0);
    gl_PointSize = uPointSize / gl_Position.w;
  }
`;

const fsSource = `
  precision mediump float;
  varying vec3 vColor;
  varying float vVisible;
  void main() {
    if (vVisible < 0.5) discard;
    float d = length(gl_PointCoord - vec2(0.5));
    if (d > 0.5) discard;
    float alpha = 1.0 - smoothstep(0.35, 0.5, d);
    gl_FragColor = vec4(vColor, alpha);
  }
`;

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(vsSource, gl.VERTEX_SHADER));
gl.attachShader(prog, compileShader(fsSource, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
gl.useProgram(prog);

const aPos = gl.getAttribLocation(prog, 'aPos');
const aColor = gl.getAttribLocation(prog, 'aColor');
const aVisible = gl.getAttribLocation(prog, 'aVisible');
const uProj = gl.getUniformLocation(prog, 'uProj');
const uView = gl.getUniformLocation(prog, 'uView');
const uPointSize = gl.getUniformLocation(prog, 'uPointSize');

// Map OKLCH to 3D positions: H→X (circular mapped to [-1,1]), L→Y, C→Z
const N = colors.length;
const positions = new Float32Array(N * 3);
const colorData = new Float32Array(N * 3);
const visibility = new Float32Array(N);

for (let i = 0; i < N; i++) {
  const c = colors[i];
  // Map hue 0-360 to angle, project to x,z plane; L to y; C as radius modifier
  const hRad = c.H * Math.PI / 180;
  const radius = c.C * 4; // scale chroma for visibility
  positions[i * 3] = Math.cos(hRad) * radius;
  positions[i * 3 + 1] = (c.L - 0.5) * 3; // center lightness around 0
  positions[i * 3 + 2] = Math.sin(hRad) * radius;
  colorData[i * 3] = c.r / 255;
  colorData[i * 3 + 1] = c.g / 255;
  colorData[i * 3 + 2] = c.b / 255;
  visibility[i] = 1.0;
}

const posBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

const colBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
gl.bufferData(gl.ARRAY_BUFFER, colorData, gl.STATIC_DRAW);

const visBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, visBuf);
gl.bufferData(gl.ARRAY_BUFFER, visibility, gl.DYNAMIC_DRAW);

// ── Matrix math (no dependencies) ──
function mat4Perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2);
  const nf = 1 / (near - far);
  return new Float32Array([
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) * nf, -1,
    0, 0, 2 * far * near * nf, 0
  ]);
}

function mat4LookAt(eye, center, up) {
  const z = normalize(sub(eye, center));
  const x = normalize(cross(up, z));
  const y = cross(z, x);
  return new Float32Array([
    x[0], y[0], z[0], 0,
    x[1], y[1], z[1], 0,
    x[2], y[2], z[2], 0,
    -dot(x, eye), -dot(y, eye), -dot(z, eye), 1
  ]);
}

function sub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function dot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function normalize(v) { const l = Math.sqrt(dot(v, v)); return l > 0 ? [v[0]/l, v[1]/l, v[2]/l] : v; }

// ── Orbit camera ──
let orbitTheta = 0.5; // azimuth
let orbitPhi = 0.4;   // elevation
let orbitDist = 5;
let autoRotate = true;

function getCameraPos() {
  return [
    orbitDist * Math.cos(orbitPhi) * Math.sin(orbitTheta),
    orbitDist * Math.sin(orbitPhi),
    orbitDist * Math.cos(orbitPhi) * Math.cos(orbitTheta)
  ];
}

// Mouse orbit controls
let dragging = false, lastX, lastY;
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  autoRotate = false;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (dragging) {
    orbitTheta += (e.clientX - lastX) * 0.005;
    orbitPhi = Math.max(-1.4, Math.min(1.4, orbitPhi + (e.clientY - lastY) * 0.005));
    lastX = e.clientX; lastY = e.clientY;
  }
});
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  orbitDist = Math.max(1.5, Math.min(20, orbitDist + e.deltaY * 0.005));
}, { passive: false });

// ── Slice plane controls ──
const lMinEl = document.getElementById('lMin'), lMaxEl = document.getElementById('lMax');
const cMinEl = document.getElementById('cMin'), cMaxEl = document.getElementById('cMax');
const lMinV = document.getElementById('lMinV'), lMaxV = document.getElementById('lMaxV');
const cMinV = document.getElementById('cMinV'), cMaxV = document.getElementById('cMaxV');
const visCount = document.getElementById('visCount');
const totalCount = document.getElementById('totalCount');
totalCount.textContent = N;

function updateSlice() {
  const lMin = +lMinEl.value, lMax = +lMaxEl.value;
  const cMin = +cMinEl.value, cMax = +cMaxEl.value;
  lMinV.textContent = Math.round(lMin * 100) + '%';
  lMaxV.textContent = Math.round(lMax * 100) + '%';
  cMinV.textContent = cMin.toFixed(2);
  cMaxV.textContent = cMax.toFixed(2);
  let count = 0;
  for (let i = 0; i < N; i++) {
    const c = colors[i];
    const vis = c.L >= lMin && c.L <= lMax && c.C >= cMin && c.C <= cMax ? 1.0 : 0.0;
    visibility[i] = vis;
    if (vis > 0.5) count++;
  }
  visCount.textContent = count;
  gl.bindBuffer(gl.ARRAY_BUFFER, visBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, visibility);
}

[lMinEl, lMaxEl, cMinEl, cMaxEl].forEach(el => el.addEventListener('input', updateSlice));
updateSlice();

// ── Hover / pick via projection ──
const tooltip = document.getElementById('tooltip');
const ttSwatch = tooltip.querySelector('.swatch');
const ttName = tooltip.querySelector('.name');
const ttVals = tooltip.querySelector('.vals');

let mouseX = -1, mouseY = -1;
canvas.addEventListener('pointermove', e => {
  if (!dragging) { mouseX = e.clientX; mouseY = e.clientY; }
});
canvas.addEventListener('pointerleave', () => { mouseX = -1; tooltip.style.display = 'none'; });

function projectPoint(pos, viewMat, projMat, w, h) {
  // Multiply by view
  const vx = viewMat[0]*pos[0] + viewMat[4]*pos[1] + viewMat[8]*pos[2] + viewMat[12];
  const vy = viewMat[1]*pos[0] + viewMat[5]*pos[1] + viewMat[9]*pos[2] + viewMat[13];
  const vz = viewMat[2]*pos[0] + viewMat[6]*pos[1] + viewMat[10]*pos[2] + viewMat[14];
  const vw = viewMat[3]*pos[0] + viewMat[7]*pos[1] + viewMat[11]*pos[2] + viewMat[15];
  // Multiply by projection
  const px = projMat[0]*vx + projMat[4]*vy + projMat[8]*vz + projMat[12]*vw;
  const py = projMat[1]*vx + projMat[5]*vy + projMat[9]*vz + projMat[13]*vw;
  const pw = projMat[3]*vx + projMat[7]*vy + projMat[11]*vz + projMat[15]*vw;
  if (pw <= 0) return null;
  return [(px / pw * 0.5 + 0.5) * w, (0.5 - py / pw * 0.5) * h];
}

// ── Render loop ──
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0.102, 0.102, 0.18, 1);

let lastPickFrame = 0;

function render(t) {
  requestAnimationFrame(render);
  if (autoRotate) orbitTheta += 0.003;

  resize();
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const aspect = canvas.width / canvas.height;
  const projMat = mat4Perspective(Math.PI / 3, aspect, 0.1, 100);
  const eye = getCameraPos();
  const viewMat = mat4LookAt(eye, [0, 0, 0], [0, 1, 0]);

  gl.useProgram(prog);
  gl.uniformMatrix4fv(uProj, false, projMat);
  gl.uniformMatrix4fv(uView, false, viewMat);
  gl.uniform1f(uPointSize, 120 * devicePixelRatio);

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.enableVertexAttribArray(aColor);
  gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, visBuf);
  gl.enableVertexAttribArray(aVisible);
  gl.vertexAttribPointer(aVisible, 1, gl.FLOAT, false, 0, 0);

  gl.drawArrays(gl.POINTS, 0, N);

  // Pick nearest visible point (throttled to every 3 frames)
  if (mouseX >= 0 && !dragging && ++lastPickFrame % 3 === 0) {
    let bestIdx = -1, bestDist = 18; // 18px threshold
    for (let i = 0; i < N; i++) {
      if (visibility[i] < 0.5) continue;
      const sp = projectPoint(
        [positions[i*3], positions[i*3+1], positions[i*3+2]],
        viewMat, projMat, innerWidth, innerHeight
      );
      if (!sp) continue;
      const dx = sp[0] - mouseX, dy = sp[1] - mouseY;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    if (bestIdx >= 0) {
      const c = colors[bestIdx];
      ttSwatch.style.background = c.hex;
      ttName.textContent = c.name;
      ttVals.textContent = `${c.hex}  L:${(c.L*100).toFixed(0)}% C:${c.C.toFixed(3)} H:${c.H.toFixed(0)}°`;
      tooltip.style.display = 'block';
      tooltip.style.left = Math.min(mouseX + 14, innerWidth - 230) + 'px';
      tooltip.style.top = Math.min(mouseY - 10, innerHeight - 70) + 'px';
    } else {
      tooltip.style.display = 'none';
    }
  }
}

requestAnimationFrame(render);
</script>
</body>
</html>
