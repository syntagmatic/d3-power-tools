<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accessible Force-Directed Network</title>
<style>
:root {
  --bg: #fff;
  --fg: #222;
  --muted: #666;
  --accent: #2563eb;
  --accent2: #dc2626;
  --node-default: #94a3b8;
  --link-color: rgba(0,0,0,0.12);
  --focus-ring: #f59e0b;
  --table-stripe: #f8fafc;
  --table-border: #e2e8f0;
  --community-0: #2563eb;
  --community-1: #dc2626;
  --community-2: #059669;
  --community-3: #d97706;
  --community-4: #7c3aed;
  --community-5: #db2777;
  --community-6: #0891b2;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e2e;
    --fg: #cdd6f4;
    --muted: #a6adc8;
    --link-color: rgba(205,214,244,0.1);
    --table-stripe: #282838;
    --table-border: #45475a;
  }
}

@media (forced-colors: active) {
  :root {
    --bg: Canvas;
    --fg: CanvasText;
    --muted: CanvasText;
    --accent: LinkText;
    --accent2: LinkText;
    --focus-ring: Highlight;
    --link-color: CanvasText;
    --table-stripe: Canvas;
    --table-border: CanvasText;
    --community-0: LinkText;
    --community-1: VisitedText;
    --community-2: ActiveText;
    --community-3: Highlight;
    --community-4: LinkText;
    --community-5: VisitedText;
    --community-6: ActiveText;
  }
  canvas { forced-color-adjust: none; }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
}

h1 {
  font-size: 1.25rem;
  padding: 0.75rem 1rem 0;
  font-weight: 600;
}

.instructions {
  font-size: 0.8rem;
  color: var(--muted);
  padding: 0.25rem 1rem 0.5rem;
}

.canvas-wrap {
  position: relative;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
}

canvas {
  display: block;
  width: 100%;
  background: var(--bg);
  cursor: grab;
}

canvas:focus {
  outline: 3px solid var(--focus-ring);
  outline-offset: -3px;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  border: 0;
}

#live-region {
  position: absolute;
  top: 0; left: 1rem;
  background: var(--bg);
  border: 1px solid var(--table-border);
  padding: 0.4rem 0.75rem;
  font-size: 0.85rem;
  border-radius: 0 0 6px 6px;
  max-width: 400px;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}

#live-region.visible { opacity: 1; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  padding: 0.5rem 1rem;
  font-size: 0.8rem;
  max-width: 960px;
  margin: 0 auto;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

.legend-swatch {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1px solid var(--fg);
}

.table-wrap {
  max-width: 960px;
  margin: 1rem auto;
  padding: 0 1rem 2rem;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}

thead th {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 2px solid var(--fg);
  padding: 0.4rem 0.6rem;
  text-align: left;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}

thead th:hover { color: var(--accent); }
thead th .sort-arrow { margin-left: 0.3rem; font-size: 0.7rem; }

tbody tr:nth-child(even) { background: var(--table-stripe); }

tbody tr.highlighted {
  outline: 2px solid var(--focus-ring);
  outline-offset: -2px;
}

td {
  padding: 0.35rem 0.6rem;
  border-bottom: 1px solid var(--table-border);
  white-space: nowrap;
}

.table-scroll {
  max-height: 350px;
  overflow-y: auto;
  border: 1px solid var(--table-border);
  border-radius: 4px;
}
</style>
</head>
<body>
<h1>Force-Directed Network — 150 Nodes</h1>
<p class="instructions">
  Click canvas to focus. Arrow keys: navigate to nearest node in that direction. Tab/Shift+Tab: cycle nodes. Enter: select/deselect. Escape: deselect.
</p>
<div class="canvas-wrap">
  <canvas id="graph" tabindex="0" role="img" aria-label="Force-directed network graph with 150 nodes in 7 communities. Use arrow keys to navigate between nodes."></canvas>
  <div id="live-region" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
<div class="legend" id="legend" role="img" aria-label="Community color legend"></div>
<div class="table-wrap">
  <h2 style="font-size:1rem; margin-bottom:0.5rem;">Node Data</h2>
  <div class="table-scroll">
    <table id="data-table" aria-label="Network node data">
      <thead>
        <tr>
          <th data-col="id" aria-sort="none">ID <span class="sort-arrow"></span></th>
          <th data-col="label" aria-sort="none">Label <span class="sort-arrow"></span></th>
          <th data-col="community" aria-sort="none">Community <span class="sort-arrow"></span></th>
          <th data-col="degree" aria-sort="none">Degree <span class="sort-arrow"></span></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data ---
const N = 150;
const COMMUNITIES = 7;
const rng = d3.randomLcg(42);
const rand = d3.randomUniform.source(rng)(0, 1);

const nodes = Array.from({length: N}, (_, i) => ({
  id: i,
  label: `Node ${i}`,
  community: Math.floor(rand() * COMMUNITIES),
  x: 0, y: 0, vx: 0, vy: 0
}));

const links = [];
const linkSet = new Set();
// Intra-community links (denser)
for (let i = 0; i < N; i++) {
  for (let j = i + 1; j < N; j++) {
    if (nodes[i].community === nodes[j].community) {
      if (rand() < 0.12) {
        links.push({source: i, target: j});
        linkSet.add(`${i}-${j}`);
      }
    } else if (rand() < 0.008) {
      links.push({source: i, target: j});
      linkSet.add(`${i}-${j}`);
    }
  }
}

// Compute degree
const degreeMap = new Map(nodes.map(n => [n.id, 0]));
links.forEach(l => {
  degreeMap.set(l.source, degreeMap.get(l.source) + 1);
  degreeMap.set(l.target, degreeMap.get(l.target) + 1);
});
nodes.forEach(n => n.degree = degreeMap.get(n.id));

// Adjacency list
const adjList = new Map(nodes.map(n => [n.id, []]));
links.forEach(l => {
  adjList.get(l.source).push(l.target);
  adjList.get(l.target).push(l.source);
});

// --- Colors ---
const communityColors = [
  "#2563eb", "#dc2626", "#059669", "#d97706", "#7c3aed", "#db2777", "#0891b2"
];
const communityNames = [
  "Blue", "Red", "Green", "Amber", "Violet", "Pink", "Cyan"
];

// --- Canvas setup ---
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
const dpr = window.devicePixelRatio || 1;
let width, height;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  width = rect.width;
  height = Math.min(width * 0.65, 600);
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.height = `${height}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener("resize", () => { resize(); sim.alpha(0.05).restart(); });

// --- Force simulation ---
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(40).strength(0.4))
  .force("charge", d3.forceManyBody().strength(-60))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collide", d3.forceCollide(8))
  .force("x", d3.forceX(width / 2).strength(0.04))
  .force("y", d3.forceY(height / 2).strength(0.04))
  .on("tick", draw);

// --- Quadtree for spatial queries ---
let quadtree;

function updateQuadtree() {
  quadtree = d3.quadtree()
    .x(d => d.x)
    .y(d => d.y)
    .addAll(nodes);
}

// --- Rendering ---
const nodeRadius = d => 3 + Math.sqrt(d.degree) * 1.5;

// Forced colors detection
const forcedColors = window.matchMedia("(forced-colors: active)").matches;

function draw() {
  updateQuadtree();
  ctx.clearRect(0, 0, width, height);

  // Links
  ctx.strokeStyle = forcedColors ? "CanvasText" : "rgba(0,0,0,0.08)";
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  for (const l of links) {
    const s = l.source, t = l.target;
    // Highlight links for focused/selected node
    if (focusedNode && (s.id === focusedNode.id || t.id === focusedNode.id)) continue;
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(t.x, t.y);
  }
  ctx.stroke();

  // Highlighted links
  if (focusedNode) {
    ctx.strokeStyle = forcedColors ? "Highlight" : "rgba(37,99,235,0.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const l of links) {
      const s = l.source, t = l.target;
      if (s.id === focusedNode.id || t.id === focusedNode.id) {
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(t.x, t.y);
      }
    }
    ctx.stroke();
  }

  // Nodes
  for (const n of nodes) {
    const r = nodeRadius(n);
    const isFocused = focusedNode && n.id === focusedNode.id;
    const isNeighbor = focusedNode && adjList.get(focusedNode.id).includes(n.id);

    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);

    if (forcedColors) {
      ctx.fillStyle = isFocused ? "Highlight" : isNeighbor ? "LinkText" : "CanvasText";
    } else {
      const alpha = focusedNode ? (isFocused || isNeighbor ? 1 : 0.2) : 0.85;
      const c = d3.color(communityColors[n.community]);
      c.opacity = alpha;
      ctx.fillStyle = c.toString();
    }
    ctx.fill();

    // Focus ring
    if (isFocused) {
      ctx.strokeStyle = forcedColors ? "Highlight" : "#f59e0b";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Label for focused node
  if (focusedNode) {
    const r = nodeRadius(focusedNode);
    ctx.font = "bold 11px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillStyle = forcedColors ? "CanvasText" : "#222";
    ctx.fillText(focusedNode.label, focusedNode.x, focusedNode.y - r - 5);
  }
}

// --- Interaction state ---
let focusedNode = null;

const liveRegion = document.getElementById("live-region");
let liveTimeout;

function announce(text) {
  liveRegion.textContent = text;
  liveRegion.classList.add("visible");
  clearTimeout(liveTimeout);
  liveTimeout = setTimeout(() => liveRegion.classList.remove("visible"), 3000);
}

function focusNode(node) {
  focusedNode = node;
  draw();
  if (node) {
    const neighbors = adjList.get(node.id);
    const neighborNames = neighbors.slice(0, 5).map(id => nodes[id].label).join(", ");
    const more = neighbors.length > 5 ? ` and ${neighbors.length - 5} more` : "";
    announce(
      `${node.label}. Community: ${communityNames[node.community]}. ` +
      `${node.degree} connections: ${neighborNames}${more}.`
    );
    highlightTableRow(node.id);
  } else {
    announce("No node selected.");
    highlightTableRow(null);
  }
}

// --- Directional cone navigation via quadtree ---
function findNodeInDirection(from, dx, dy) {
  if (!from) {
    // No focused node: pick the node closest to center
    return quadtree.find(width / 2, height / 2);
  }

  const angle = Math.atan2(dy, dx);
  const coneHalf = Math.PI / 3; // 60-degree half-cone
  let best = null;
  let bestDist = Infinity;

  for (const n of nodes) {
    if (n.id === from.id) continue;
    const ndx = n.x - from.x;
    const ndy = n.y - from.y;
    const dist = Math.sqrt(ndx * ndx + ndy * ndy);
    if (dist < 1) continue;

    let nodeAngle = Math.atan2(ndy, ndx);
    let diff = nodeAngle - angle;
    // Normalize to [-PI, PI]
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;

    if (Math.abs(diff) <= coneHalf && dist < bestDist) {
      best = n;
      bestDist = dist;
    }
  }
  return best;
}

// Tab cycling (sorted by id)
const sortedNodes = [...nodes].sort((a, b) => a.id - b.id);
function cycleNode(forward) {
  if (!focusedNode) {
    focusNode(sortedNodes[0]);
    return;
  }
  const idx = sortedNodes.findIndex(n => n.id === focusedNode.id);
  const next = forward
    ? sortedNodes[(idx + 1) % sortedNodes.length]
    : sortedNodes[(idx - 1 + sortedNodes.length) % sortedNodes.length];
  focusNode(next);
}

// --- Keyboard handler ---
canvas.addEventListener("keydown", e => {
  const dirMap = {
    ArrowUp: [0, -1],
    ArrowDown: [0, 1],
    ArrowLeft: [-1, 0],
    ArrowRight: [1, 0],
  };

  if (dirMap[e.key]) {
    e.preventDefault();
    const [dx, dy] = dirMap[e.key];
    const target = findNodeInDirection(focusedNode, dx, dy);
    if (target) focusNode(target);
  } else if (e.key === "Tab") {
    e.preventDefault();
    cycleNode(!e.shiftKey);
  } else if (e.key === "Escape") {
    e.preventDefault();
    focusNode(null);
  } else if (e.key === "Enter") {
    e.preventDefault();
    // Toggle: if focused, deselect; if not, keep
    if (focusedNode) focusNode(null);
  }
});

// --- Mouse/pointer interaction ---
canvas.addEventListener("pointerdown", e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const found = quadtree.find(mx, my, 20);
  focusNode(found || null);
  canvas.focus();
});

// --- Legend ---
const legend = document.getElementById("legend");
for (let i = 0; i < COMMUNITIES; i++) {
  const count = nodes.filter(n => n.community === i).length;
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<span class="legend-swatch" style="background:${communityColors[i]}"></span>${communityNames[i]} (${count})`;
  legend.appendChild(item);
}

// --- Data table ---
const tableBody = document.getElementById("table-body");
let tableData = [...nodes];
let sortCol = null;
let sortAsc = true;

function renderTable() {
  tableBody.innerHTML = "";
  for (const n of tableData) {
    const tr = document.createElement("tr");
    tr.dataset.nodeId = n.id;
    tr.innerHTML = `
      <td>${n.id}</td>
      <td>${n.label}</td>
      <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${communityColors[n.community]};vertical-align:middle;margin-right:4px;border:1px solid var(--fg)"></span>${communityNames[n.community]}</td>
      <td>${n.degree}</td>
    `;
    tr.style.cursor = "pointer";
    tr.addEventListener("click", () => {
      focusNode(n);
      // Scroll canvas into view
      canvas.scrollIntoView({behavior: "smooth", block: "nearest"});
      canvas.focus();
    });
    tableBody.appendChild(tr);
  }
}

function highlightTableRow(nodeId) {
  tableBody.querySelectorAll("tr.highlighted").forEach(tr => tr.classList.remove("highlighted"));
  if (nodeId !== null) {
    const tr = tableBody.querySelector(`tr[data-node-id="${nodeId}"]`);
    if (tr) {
      tr.classList.add("highlighted");
      tr.scrollIntoView({behavior: "smooth", block: "nearest"});
    }
  }
}

// Sort headers
document.querySelectorAll("#data-table thead th").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortAsc = !sortAsc;
    } else {
      sortCol = col;
      sortAsc = true;
    }

    // Update aria-sort
    document.querySelectorAll("#data-table thead th").forEach(h => {
      h.setAttribute("aria-sort", "none");
      h.querySelector(".sort-arrow").textContent = "";
    });
    th.setAttribute("aria-sort", sortAsc ? "ascending" : "descending");
    th.querySelector(".sort-arrow").textContent = sortAsc ? "▲" : "▼";

    tableData.sort((a, b) => {
      let va = a[col], vb = b[col];
      if (typeof va === "string") return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
      return sortAsc ? va - vb : vb - va;
    });

    renderTable();
    if (focusedNode) highlightTableRow(focusedNode.id);
  });
});

renderTable();

// Initial warm-up
sim.alpha(1).restart();
</script>
</body>
</html>
