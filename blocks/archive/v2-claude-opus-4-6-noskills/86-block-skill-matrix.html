<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Block × Skill Matrix</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #c8c8d0; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
  #container { width: 100vw; height: 100vh; position: relative; }
  #controls { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; }
  #controls button {
    background: #1a1a2e; border: 1px solid #333; color: #aaa; padding: 5px 12px;
    border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.15s;
  }
  #controls button:hover { background: #252540; color: #ddd; border-color: #555; }
  #controls button.active { background: #2a2a4e; color: #fff; border-color: #667; }
  #tooltip {
    position: absolute; pointer-events: none; background: #1a1a2eee; border: 1px solid #444;
    border-radius: 6px; padding: 8px 12px; font-size: 12px; line-height: 1.5;
    display: none; z-index: 20; max-width: 300px; backdrop-filter: blur(8px);
  }
  #tooltip .block-name { color: #8be9fd; font-weight: 600; }
  #tooltip .skill-name { color: #f1fa8c; font-weight: 600; }
  #legend { position: absolute; bottom: 12px; left: 12px; z-index: 10; display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 2px; }
  #info { position: absolute; top: 12px; right: 12px; z-index: 10; font-size: 11px; color: #666; text-align: right; }
</style>
</head>
<body>
<div id="container">
  <div id="controls">
    <button id="sort-id" class="active">By ID</button>
    <button id="sort-skills">By Skill Count</button>
    <button id="sort-category">By Category</button>
    <span style="color:#555; font-size:11px; margin-left:8px;">Scroll to zoom · Drag to pan</span>
  </div>
  <div id="tooltip"></div>
  <div id="legend"></div>
  <div id="info">86 blocks × 33 skills<br>258 connections</div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// ── Data: blocks and their skills from manifest ──
const blocks = [
  {id:"01",name:"Parallel Coords + Sparkline Table",skills:["parallel-coordinates","brushing","sparkcharts"]},
  {id:"02",name:"Linked Scatterplot Matrix",skills:["brushing","linked-views","distributions"]},
  {id:"03",name:"Violin Plot Orchestra",skills:["distributions","color","responsive"]},
  {id:"04",name:"Bee Swarm Census",skills:["distributions","force","annotation"]},
  {id:"05",name:"Crossfilter Flight Explorer",skills:["linked-views","brushing","time-series"]},
  {id:"06",name:"QQ Plot with Confidence Bands",skills:["distributions","annotation","color"]},
  {id:"07",name:"Density Contour Heatmap",skills:["distributions","canvas","brushing"]},
  {id:"08",name:"Small Multiples Seasonal",skills:["small-multiples","time-series","responsive"]},
  {id:"09",name:"Sparkline Dashboard Table",skills:["sparkcharts","data-table","color"]},
  {id:"10",name:"Strip Plot with Marginals",skills:["distributions","brushing","annotation"]},
  {id:"11",name:"Zoomable Treemap",skills:["hierarchy-layouts","hierarchy-interaction","color"]},
  {id:"12",name:"Sunburst to Icicle Morph",skills:["hierarchy-layouts","shape-morphing","motion"]},
  {id:"13",name:"Radial Dendrogram + Edge Bundling",skills:["edge-bundling","hierarchy-layouts","canvas"]},
  {id:"14",name:"Force-Directed Clustering",skills:["force","network","canvas"]},
  {id:"15",name:"Adjacency Matrix Reorder",skills:["network","color","data-table"]},
  {id:"16",name:"Sankey Energy Flow",skills:["network","annotation","responsive"]},
  {id:"17",name:"Chord Diagram of Trade",skills:["network","color","motion"]},
  {id:"18",name:"Collapsible Tree with Search",skills:["hierarchy-interaction","annotation","motion"]},
  {id:"19",name:"Circle Packing Zoom",skills:["hierarchy-layouts","navigation","color"]},
  {id:"20",name:"Arc Diagram",skills:["network","color","brushing"]},
  {id:"21",name:"US Choropleth",skills:["cartography","color","annotation"]},
  {id:"22",name:"Rotating Globe",skills:["cartography","canvas","motion"]},
  {id:"23",name:"Hex Bin Map",skills:["cartography","canvas","distributions"]},
  {id:"24",name:"Flow Map with Curved Arrows",skills:["cartography","network","motion"]},
  {id:"25",name:"Projection Morphing Showcase",skills:["cartography","shape-morphing","motion"]},
  {id:"26",name:"Horizon Chart Stack",skills:["time-series","color","responsive"]},
  {id:"27",name:"Swimlane Gantt Chart",skills:["time-series","annotation","brushing"]},
  {id:"28",name:"Cycle Plot",skills:["time-series","small-multiples","annotation"]},
  {id:"29",name:"Bar Chart Race",skills:["motion","color","annotation"]},
  {id:"30",name:"Scrollytelling Climate",skills:["motion","annotation","responsive"]},
  {id:"31",name:"Streaming Real-Time Line",skills:["time-series","canvas","navigation"]},
  {id:"32",name:"Shape Morphing Gallery",skills:["shape-morphing","motion","color"]},
  {id:"33",name:"Annotation Showcase",skills:["annotation","color","responsive"]},
  {id:"34",name:"Visual Texture A11y Chart",skills:["visual-texture","color","distributions"]},
  {id:"35",name:"Color Palette Explorer",skills:["color","canvas","responsive"]},
  {id:"36",name:"Responsive Multi-Breakpoint",skills:["responsive","annotation","small-multiples"]},
  {id:"37",name:"Accessible Canvas Scatterplot",skills:["canvas-accessibility","canvas","data-table"]},
  {id:"38",name:"Dual-Axis with Gap Handling",skills:["scales","time-series","annotation"]},
  {id:"39",name:"Quadtree Hit Detection Demo",skills:["canvas","navigation","force"]},
  {id:"40",name:"Minimap Navigator",skills:["navigation","canvas","linked-views"]},
  {id:"41",name:"Force + Bundling + Chord Triptych",skills:["force","edge-bundling","shape-morphing"]},
  {id:"42",name:"Phyllotaxis Data Art",skills:["canvas","color","motion"]},
  {id:"43",name:"Classification Choropleth",skills:["scales","cartography","color"]},
  {id:"44",name:"Diverging Midpoint Heatmap",skills:["scales","small-multiples","annotation"]},
  {id:"45",name:"Log Scale Bee Swarm",skills:["scales","force","distributions"]},
  {id:"46",name:"Threshold Scale KPI Dashboard",skills:["scales","data-table","sparkcharts"]},
  {id:"47",name:"Mixed-Scale Parallel Coords",skills:["scales","parallel-coordinates","brushing"]},
  {id:"48",name:"Scale Perception Network",skills:["scales","force","network"]},
  {id:"49",name:"Textured Network Diagram",skills:["visual-texture","network","force"]},
  {id:"50",name:"Stippled Density Map",skills:["visual-texture","cartography","canvas"]},
  {id:"51",name:"Accessible Force Network",skills:["canvas-accessibility","force","data-table"]},
  {id:"52",name:"Accessible Choropleth",skills:["canvas-accessibility","cartography","data-table"]},
  {id:"53",name:"Textured Raincloud Plot",skills:["visual-texture","distributions","color"]},
  {id:"54",name:"Textured Bivariate Treemap",skills:["visual-texture","hierarchy-layouts","scales"]},
  {id:"55",name:"WebGL Million-Point Scatter",skills:["webgl","brushing","scales"]},
  {id:"56",name:"WebGL Force Galaxy",skills:["webgl","force","motion"]},
  {id:"57",name:"WebGL Streaming Particles",skills:["webgl","time-series","canvas"]},
  {id:"58",name:"WebGL Density Heatmap",skills:["webgl","distributions","navigation"]},
  {id:"59",name:"WebGL Edge-Bundled Network",skills:["webgl","edge-bundling","network"]},
  {id:"60",name:"WebGL Animated Treemap",skills:["webgl","hierarchy-layouts","motion"]},
  {id:"61",name:"Progressive Crossfilter",skills:["brushing","linked-views","canvas"]},
  {id:"62",name:"Icicle Brush Explorer",skills:["hierarchy-interaction","brushing","distributions"]},
  {id:"63",name:"Semantic Zoom Distributions",skills:["navigation","distributions","responsive"]},
  {id:"64",name:"Strum Brush Parallel Coords",skills:["parallel-coordinates","canvas","linked-views"]},
  {id:"65",name:"Brush Composition Scatterplots",skills:["brushing","small-multiples","annotation"]},
  {id:"66",name:"Falcon Prefetch Histogram",skills:["brushing","data-gathering","time-series"]},
  {id:"67",name:"Temporal Edge Bundling",skills:["edge-bundling","time-series","motion"]},
  {id:"68",name:"Animated Sparkline Table",skills:["sparkcharts","motion","data-table"]},
  {id:"69",name:"Prediction Band Time Series",skills:["time-series","annotation","distributions"]},
  {id:"70",name:"Gantt with Edge-Bundled Deps",skills:["edge-bundling","time-series","hierarchy-layouts"]},
  {id:"71",name:"Small Multiples Force Network",skills:["small-multiples","force","motion"]},
  {id:"72",name:"Scrollytelling Network Growth",skills:["motion","network","annotation"]},
  {id:"73",name:"Expandable Hierarchy Table",skills:["data-table","hierarchy-layouts","sparkcharts"]},
  {id:"74",name:"Marimekko Chart",skills:["hierarchy-layouts","scales","color"]},
  {id:"75",name:"Flame Chart Profiler",skills:["hierarchy-layouts","navigation","canvas"]},
  {id:"76",name:"Treemap Sparkline Dashboard",skills:["hierarchy-layouts","sparkcharts","responsive"]},
  {id:"77",name:"Sunburst Breadcrumb Brush",skills:["hierarchy-interaction","brushing","color"]},
  {id:"78",name:"Expandable Edge Bundle",skills:["hierarchy-interaction","edge-bundling","canvas"]},
  {id:"79",name:"Reduced Motion Dashboard",skills:["responsive","motion","linked-views"]},
  {id:"80",name:"Container Query Chart",skills:["responsive","small-multiples","scales"]},
  {id:"81",name:"Letter-Value Plot Table Toggle",skills:["data-table","distributions","canvas-accessibility"]},
  {id:"82",name:"Accessible Hive Plot",skills:["network","canvas-accessibility","scales"]},
  {id:"83",name:"Community Detection Table",skills:["network","data-table","color"]},
  {id:"84",name:"Sparklines Embedded in Text",skills:["sparkcharts","data-table","responsive"]},
  {id:"85",name:"Skill Constellation",skills:["force","network","color"]},
  {id:"86",name:"Block × Skill Matrix",skills:["network","scales","navigation"]},
];

// ── Skill categories ──
const skillCategories = {
  "parallel-coordinates": "Seeing patterns",
  "brushing": "Seeing patterns",
  "linked-views": "Seeing patterns",
  "distributions": "Seeing patterns",
  "hierarchy-layouts": "Seeing structure",
  "hierarchy-interaction": "Seeing structure",
  "edge-bundling": "Seeing structure",
  "force": "Seeing structure",
  "network": "Seeing structure",
  "cartography": "Seeing place",
  "time-series": "Seeing change",
  "motion": "Seeing change",
  "shape-morphing": "Seeing change",
  "scales": "Making it legible",
  "color": "Making it legible",
  "visual-texture": "Making it legible",
  "annotation": "Making it legible",
  "data-table": "Making it legible",
  "canvas-accessibility": "Making it legible",
  "canvas": "Making it work",
  "webgl": "Making it work",
  "navigation": "Making it work",
  "responsive": "Making it work",
  "data-gathering": "Before you render",
  "sparkcharts": "Before you render",
  "small-multiples": "Before you render",
};

const categoryColors = {
  "Seeing patterns": "#8be9fd",
  "Seeing structure": "#bd93f9",
  "Seeing place": "#50fa7b",
  "Seeing change": "#ffb86c",
  "Making it legible": "#f1fa8c",
  "Making it work": "#ff79c6",
  "Before you render": "#ff5555",
};

// ── Derive unique skills sorted by category then name ──
const allSkills = [...new Set(blocks.flatMap(b => b.skills))];
const categoryOrder = ["Seeing patterns","Seeing structure","Seeing place","Seeing change","Making it legible","Making it work","Before you render"];
allSkills.sort((a, b) => {
  const ca = categoryOrder.indexOf(skillCategories[a]);
  const cb = categoryOrder.indexOf(skillCategories[b]);
  return ca !== cb ? ca - cb : a.localeCompare(b);
});

// Skill usage counts
const skillCounts = new Map();
allSkills.forEach(s => skillCounts.set(s, 0));
blocks.forEach(b => b.skills.forEach(s => skillCounts.set(s, (skillCounts.get(s)||0)+1)));

// Block skill counts
blocks.forEach(b => b.skillCount = b.skills.length);

// ── Layout ──
const margin = { top: 180, right: 30, bottom: 30, left: 260 };
const cellSize = 14;
const cellPad = 2;
const width = margin.left + allSkills.length * (cellSize + cellPad) + margin.right;
const height = margin.top + blocks.length * (cellSize + cellPad) + margin.bottom;

const container = d3.select("#container");
const svg = container.append("svg")
  .attr("width", "100%")
  .attr("height", "100%")
  .style("position", "absolute")
  .style("top", 0);

const g = svg.append("g");

// ── Zoom ──
const zoom = d3.zoom()
  .scaleExtent([0.4, 4])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

// Center initially
const vw = window.innerWidth, vh = window.innerHeight;
const initScale = Math.min(vw / width, vh / height) * 0.92;
const tx = (vw - width * initScale) / 2;
const ty = (vh - height * initScale) / 2;
svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(initScale));

// ── Scales ──
let blockOrder = blocks.map((_, i) => i);
const xScale = d3.scaleBand().domain(d3.range(allSkills.length)).range([margin.left, margin.left + allSkills.length * (cellSize + cellPad)]).padding(0.1);
const yScale = d3.scaleBand().domain(d3.range(blocks.length)).range([margin.top, margin.top + blocks.length * (cellSize + cellPad)]).padding(0.1);

// ── Build connection set ──
const connections = new Set();
blocks.forEach((b, bi) => b.skills.forEach(s => {
  const si = allSkills.indexOf(s);
  if (si >= 0) connections.add(`${bi}-${si}`);
}));

// ── Draw column headers (skills) ──
const colHeaders = g.append("g").attr("class", "col-headers");
colHeaders.selectAll("text")
  .data(allSkills)
  .join("text")
  .attr("x", (_, i) => xScale(i) + cellSize / 2)
  .attr("y", margin.top - 8)
  .attr("text-anchor", "start")
  .attr("transform", (_, i) => `rotate(-55, ${xScale(i) + cellSize / 2}, ${margin.top - 8})`)
  .attr("fill", d => categoryColors[skillCategories[d]] || "#888")
  .attr("font-size", 10)
  .attr("font-weight", 500)
  .text(d => d);

// ── Skill count bars at top ──
const maxSkillCount = d3.max([...skillCounts.values()]);
const barScale = d3.scaleLinear().domain([0, maxSkillCount]).range([0, 40]);
g.append("g").selectAll("rect")
  .data(allSkills)
  .join("rect")
  .attr("x", (_, i) => xScale(i))
  .attr("y", d => margin.top - 80 - barScale(skillCounts.get(d)))
  .attr("width", cellSize)
  .attr("height", d => barScale(skillCounts.get(d)))
  .attr("fill", d => categoryColors[skillCategories[d]] || "#555")
  .attr("opacity", 0.4)
  .attr("rx", 1);

// ── Draw row labels (blocks) ──
const rowLabels = g.append("g").attr("class", "row-labels");

const updateRowLabels = () => {
  rowLabels.selectAll("text")
    .data(blockOrder, d => d)
    .join("text")
    .transition().duration(600)
    .attr("x", margin.left - 8)
    .attr("y", (d, i) => yScale(i) + cellSize / 2 + 3)
    .attr("text-anchor", "end")
    .attr("fill", "#999")
    .attr("font-size", 9)
    .text(d => `${blocks[d].id} ${blocks[d].name}`);
};
updateRowLabels();

// ── Draw cells ──
const cellData = [];
blocks.forEach((b, bi) => {
  allSkills.forEach((s, si) => {
    if (b.skills.includes(s)) {
      cellData.push({ bi, si, block: b, skill: s });
    }
  });
});

const cells = g.append("g").attr("class", "cells");

const updateCells = () => {
  cells.selectAll("rect")
    .data(cellData, d => `${d.bi}-${d.si}`)
    .join("rect")
    .transition().duration(600)
    .attr("x", d => xScale(d.si))
    .attr("y", d => yScale(blockOrder.indexOf(d.bi)))
    .attr("width", cellSize)
    .attr("height", cellSize)
    .attr("rx", 2)
    .attr("fill", d => categoryColors[skillCategories[d.skill]] || "#555")
    .attr("opacity", 0.85);
};
updateCells();

// ── Grid lines (faint) ──
const gridG = g.append("g").attr("class", "grid").attr("opacity", 0.06);
allSkills.forEach((_, i) => {
  gridG.append("line")
    .attr("x1", xScale(i) - 1).attr("x2", xScale(i) - 1)
    .attr("y1", margin.top).attr("y2", height - margin.bottom)
    .attr("stroke", "#fff");
});
blocks.forEach((_, i) => {
  gridG.append("line")
    .attr("x1", margin.left).attr("x2", width - margin.right)
    .attr("y1", yScale(i) - 1).attr("y2", yScale(i) - 1)
    .attr("stroke", "#fff");
});

// ── Hover highlights ──
const hoverRowLine = g.append("rect").attr("fill", "#fff").attr("opacity", 0).attr("height", cellSize + 2).attr("pointer-events", "none");
const hoverColLine = g.append("rect").attr("fill", "#fff").attr("opacity", 0).attr("width", cellSize + 2).attr("pointer-events", "none");

const tooltip = d3.select("#tooltip");

// Invisible overlay for hit detection
const overlay = g.append("g").attr("class", "overlay");
overlay.selectAll("rect")
  .data(cellData)
  .join("rect")
  .attr("x", d => xScale(d.si))
  .attr("y", d => yScale(blockOrder.indexOf(d.bi)))
  .attr("width", cellSize)
  .attr("height", cellSize)
  .attr("fill", "transparent")
  .attr("cursor", "pointer")
  .on("pointerenter", function(e, d) {
    const row = blockOrder.indexOf(d.bi);
    hoverRowLine
      .attr("x", margin.left).attr("width", width - margin.left - margin.right)
      .attr("y", yScale(row) - 1).attr("opacity", 0.04);
    hoverColLine
      .attr("x", xScale(d.si) - 1).attr("height", height - margin.top - margin.bottom)
      .attr("y", margin.top).attr("opacity", 0.04);

    // Highlight connected cells
    cells.selectAll("rect").attr("opacity", c =>
      c.bi === d.bi || c.si === d.si ? 1 : 0.2
    );

    tooltip.style("display", "block")
      .html(`<span class="block-name">${d.block.id} ${d.block.name}</span><br><span class="skill-name">${d.skill}</span><br><span style="color:#666">${skillCategories[d.skill]}</span>`)
      .style("left", (e.clientX + 14) + "px")
      .style("top", (e.clientY - 10) + "px");
  })
  .on("pointermove", (e) => {
    tooltip.style("left", (e.clientX + 14) + "px").style("top", (e.clientY - 10) + "px");
  })
  .on("pointerleave", () => {
    hoverRowLine.attr("opacity", 0);
    hoverColLine.attr("opacity", 0);
    cells.selectAll("rect").attr("opacity", 0.85);
    tooltip.style("display", "none");
  });

const updateOverlay = () => {
  overlay.selectAll("rect")
    .data(cellData, d => `${d.bi}-${d.si}`)
    .attr("y", d => yScale(blockOrder.indexOf(d.bi)));
};

// ── Sort controls ──
const sortById = () => {
  blockOrder = blocks.map((_, i) => i);
  updateCells(); updateRowLabels(); updateOverlay();
  d3.selectAll("#controls button").classed("active", false);
  d3.select("#sort-id").classed("active", true);
};

const sortBySkills = () => {
  blockOrder = [...blocks.keys()].sort((a, b) => blocks[b].skillCount - blocks[a].skillCount || a - b);
  updateCells(); updateRowLabels(); updateOverlay();
  d3.selectAll("#controls button").classed("active", false);
  d3.select("#sort-skills").classed("active", true);
};

const sortByCategory = () => {
  // Group blocks by their primary skill's category
  const blockCat = bi => {
    const primary = blocks[bi].skills[0];
    return categoryOrder.indexOf(skillCategories[primary]);
  };
  blockOrder = [...blocks.keys()].sort((a, b) => blockCat(a) - blockCat(b) || a - b);
  updateCells(); updateRowLabels(); updateOverlay();
  d3.selectAll("#controls button").classed("active", false);
  d3.select("#sort-category").classed("active", true);
};

d3.select("#sort-id").on("click", sortById);
d3.select("#sort-skills").on("click", sortBySkills);
d3.select("#sort-category").on("click", sortByCategory);

// ── Legend ──
const legend = d3.select("#legend");
categoryOrder.forEach(cat => {
  const item = legend.append("div").attr("class", "legend-item");
  item.append("div").attr("class", "legend-swatch").style("background", categoryColors[cat]);
  item.append("span").text(cat);
});

// ── Category separator lines ──
let prevCat = null;
allSkills.forEach((s, i) => {
  const cat = skillCategories[s];
  if (prevCat && cat !== prevCat) {
    g.append("line")
      .attr("x1", xScale(i) - 2).attr("x2", xScale(i) - 2)
      .attr("y1", margin.top - 90).attr("y2", height - margin.bottom)
      .attr("stroke", "#333").attr("stroke-dasharray", "2,3");
  }
  prevCat = cat;
});

// Update info
d3.select("#info").html(`${blocks.length} blocks × ${allSkills.length} skills<br>${cellData.length} connections`);
</script>
</body>
</html>
