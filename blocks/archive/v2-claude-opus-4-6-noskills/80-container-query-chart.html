<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Container Query Chart — 6 Sizes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f5f7;
    padding: 2rem;
    color: #1a1a2e;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 1.5rem; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .grid > :nth-child(1) { grid-column: 1 / -1; }

  .panel {
    background: #fff;
    border-radius: 10px;
    padding: 1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .panel-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #999;
    margin-bottom: 0.5rem;
  }

  .chart-wrapper {
    container-type: inline-size;
    width: 100%;
    height: 100%;
  }

  /* Size presets for the 6 panels */
  .size-xl .chart-wrapper { height: 380px; }
  .size-lg .chart-wrapper { height: 300px; }
  .size-md .chart-wrapper { height: 240px; }
  .size-sm .chart-wrapper { height: 180px; }
  .size-xs .chart-wrapper { height: 100px; }
  .size-xxs .chart-wrapper { height: 80px; }

  /* Chart container element */
  .chart-container {
    width: 100%;
    height: 100%;
    position: relative;
  }

  /* ---- Container query breakpoints ---- */

  /* Default (<150px): KPI number */
  .chart-container .kpi { display: flex; }
  .chart-container .spark { display: none; }
  .chart-container .svg-chart { display: none; }

  /* 150px+: sparkline dots */
  @container (min-width: 150px) {
    .chart-container .kpi { display: none; }
    .chart-container .spark { display: block; }
    .chart-container .svg-chart { display: none; }
  }

  /* 300px+: simplified scatter */
  @container (min-width: 300px) {
    .chart-container .kpi { display: none; }
    .chart-container .spark { display: none; }
    .chart-container .svg-chart { display: block; }
    .chart-container .annotation { display: none; }
    .chart-container .axis-label { display: none; }
  }

  /* 600px+: full scatter with annotations */
  @container (min-width: 600px) {
    .chart-container .annotation { display: block !important; }
    .chart-container .axis-label { display: block !important; }
  }

  .kpi {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    gap: 2px;
  }
  .kpi .value {
    font-size: 1.8rem;
    font-weight: 700;
    color: #4361ee;
  }
  .kpi .label {
    font-size: 0.6rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .spark {
    width: 100%;
    height: 100%;
  }

  .svg-chart {
    width: 100%;
    height: 100%;
  }
  .svg-chart svg {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<h1>Revenue vs. Customer Satisfaction</h1>
<p class="subtitle">Same dataset, 6 container sizes — from full scatter to single KPI</p>

<div class="grid">
  <div class="panel size-xl"><div class="panel-label">XL — 100% width (~900px+)</div><div class="chart-wrapper"><div class="chart-container" id="chart-xl"></div></div></div>
  <div class="panel size-lg"><div class="panel-label">Large — ~450px</div><div class="chart-wrapper"><div class="chart-container" id="chart-lg"></div></div></div>
  <div class="panel size-md"><div class="panel-label">Medium — ~350px</div><div class="chart-wrapper"><div class="chart-container" id="chart-md"></div></div></div>
  <div class="panel size-sm"><div class="panel-label">Small — ~200px</div><div class="chart-wrapper"><div class="chart-container" id="chart-sm"></div></div></div>
  <div class="panel size-xs"><div class="panel-label">XS — ~150px</div><div class="chart-wrapper"><div class="chart-container" id="chart-xs"></div></div></div>
  <div class="panel size-xxs"><div class="panel-label">XXS — ~100px</div><div class="chart-wrapper"><div class="chart-container" id="chart-xxs"></div></div></div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data ---
const rng = d3.randomLcg(42);
const randNorm = d3.randomNormal.source(rng);
const categories = ["Enterprise", "Mid-Market", "SMB", "Startup"];
const catColors = { Enterprise: "#4361ee", "Mid-Market": "#3a86ff", SMB: "#7209b7", Startup: "#f72585" };

const data = d3.range(60).map(i => {
  const cat = categories[i % 4];
  const baseRev = cat === "Enterprise" ? 800 : cat === "Mid-Market" ? 400 : cat === "SMB" ? 200 : 100;
  const revenue = Math.max(20, baseRev + randNorm(0, baseRev * 0.4)());
  const satisfaction = Math.min(100, Math.max(10, 40 + revenue * 0.04 + randNorm(0, 12)()));
  return { id: i, category: cat, revenue: Math.round(revenue), satisfaction: Math.round(satisfaction * 10) / 10 };
});

const avgSatisfaction = d3.mean(data, d => d.satisfaction).toFixed(1);
const topPoint = data.reduce((a, b) => a.revenue > b.revenue ? a : b);
const outlier = data.reduce((a, b) => a.satisfaction < b.satisfaction ? a : b);

// --- Reusable chart renderer ---
function renderChart(container) {
  const el = document.getElementById(container);

  // KPI view
  const kpi = document.createElement("div");
  kpi.className = "kpi";
  kpi.innerHTML = `<span class="value">${avgSatisfaction}</span><span class="label">Avg Satisfaction</span>`;
  el.appendChild(kpi);

  // Sparkline view
  const sparkDiv = document.createElement("div");
  sparkDiv.className = "spark";
  el.appendChild(sparkDiv);

  // SVG scatter view
  const chartDiv = document.createElement("div");
  chartDiv.className = "svg-chart";
  el.appendChild(chartDiv);

  // We use ResizeObserver to render SVG at the right size
  const ro = new ResizeObserver(entries => {
    for (const entry of entries) {
      const w = entry.contentRect.width;
      const h = entry.contentRect.height;
      if (w > 0 && h > 0) {
        drawSpark(sparkDiv, w, h);
        drawScatter(chartDiv, w, h);
      }
    }
  });
  ro.observe(el);
}

const xScale = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue) * 1.1]);
const yScale = d3.scaleLinear().domain([0, 100]);

function drawSpark(container, w, h) {
  container.innerHTML = "";
  const margin = { top: 6, right: 6, bottom: 6, left: 6 };
  const iw = w - margin.left - margin.right;
  const ih = h - margin.top - margin.bottom;

  const svg = d3.select(container).append("svg").attr("width", w).attr("height", h);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = xScale.copy().range([0, iw]);
  const y = yScale.copy().range([ih, 0]);

  g.selectAll("circle")
    .data(data)
    .join("circle")
    .attr("cx", d => x(d.revenue))
    .attr("cy", d => y(d.satisfaction))
    .attr("r", 2)
    .attr("fill", d => catColors[d.category])
    .attr("opacity", 0.7);
}

function drawScatter(container, w, h) {
  container.innerHTML = "";
  const isLarge = w >= 600;
  const margin = isLarge
    ? { top: 20, right: 30, bottom: 45, left: 50 }
    : { top: 12, right: 16, bottom: 30, left: 36 };

  const iw = w - margin.left - margin.right;
  const ih = h - margin.top - margin.bottom;

  const svg = d3.select(container).append("svg").attr("width", w).attr("height", h);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = xScale.copy().range([0, iw]);
  const y = yScale.copy().range([ih, 0]);

  // Axes
  const xAxis = isLarge ? d3.axisBottom(x).ticks(8).tickFormat(d => `$${d}k`) : d3.axisBottom(x).ticks(4).tickFormat(d => `${d}`);
  const yAxis = isLarge ? d3.axisLeft(y).ticks(6) : d3.axisLeft(y).ticks(4);

  g.append("g")
    .attr("transform", `translate(0,${ih})`)
    .call(xAxis)
    .call(g => g.select(".domain").attr("stroke", "#ccc"))
    .call(g => g.selectAll(".tick line").attr("stroke", "#ddd"));

  g.append("g")
    .call(yAxis)
    .call(g => g.select(".domain").attr("stroke", "#ccc"))
    .call(g => g.selectAll(".tick line").attr("stroke", "#ddd"));

  // Grid lines
  g.append("g").attr("class", "grid")
    .selectAll("line")
    .data(y.ticks(isLarge ? 6 : 4))
    .join("line")
    .attr("x1", 0).attr("x2", iw)
    .attr("y1", d => y(d)).attr("y2", d => y(d))
    .attr("stroke", "#f0f0f0");

  // Axis labels (large only via CSS)
  g.append("text").attr("class", "axis-label")
    .attr("x", iw / 2).attr("y", ih + 38)
    .attr("text-anchor", "middle")
    .attr("font-size", "0.75rem").attr("fill", "#666")
    .text("Revenue ($k)");

  g.append("text").attr("class", "axis-label")
    .attr("transform", `rotate(-90)`)
    .attr("x", -ih / 2).attr("y", -38)
    .attr("text-anchor", "middle")
    .attr("font-size", "0.75rem").attr("fill", "#666")
    .text("Satisfaction Score");

  // Trend line
  const sorted = [...data].sort((a, b) => a.revenue - b.revenue);
  const xMean = d3.mean(data, d => d.revenue);
  const yMean = d3.mean(data, d => d.satisfaction);
  const num = d3.sum(data, d => (d.revenue - xMean) * (d.satisfaction - yMean));
  const den = d3.sum(data, d => (d.revenue - xMean) ** 2);
  const slope = num / den;
  const intercept = yMean - slope * xMean;
  const lineX0 = d3.min(data, d => d.revenue);
  const lineX1 = d3.max(data, d => d.revenue);

  g.append("line")
    .attr("x1", x(lineX0)).attr("y1", y(intercept + slope * lineX0))
    .attr("x2", x(lineX1)).attr("y2", y(intercept + slope * lineX1))
    .attr("stroke", "#aaa").attr("stroke-width", 1.5)
    .attr("stroke-dasharray", "5,4").attr("opacity", 0.6);

  // Points
  const rScale = isLarge ? 5 : 3.5;
  g.selectAll("circle")
    .data(data)
    .join("circle")
    .attr("cx", d => x(d.revenue))
    .attr("cy", d => y(d.satisfaction))
    .attr("r", rScale)
    .attr("fill", d => catColors[d.category])
    .attr("opacity", 0.75)
    .attr("stroke", "#fff")
    .attr("stroke-width", 1);

  // Legend (large only via annotation class)
  const legend = g.append("g").attr("class", "annotation")
    .attr("transform", `translate(${iw - 120}, 0)`);

  categories.forEach((cat, i) => {
    const row = legend.append("g").attr("transform", `translate(0, ${i * 18})`);
    row.append("circle").attr("r", 4).attr("cx", 0).attr("cy", 0).attr("fill", catColors[cat]);
    row.append("text").attr("x", 10).attr("y", 4).attr("font-size", "0.65rem").attr("fill", "#555").text(cat);
  });

  // Annotations (large only)
  const annotG = g.append("g").attr("class", "annotation");

  // Top revenue callout
  annotG.append("line")
    .attr("x1", x(topPoint.revenue)).attr("y1", y(topPoint.satisfaction) - 8)
    .attr("x2", x(topPoint.revenue) - 20).attr("y2", y(topPoint.satisfaction) - 30)
    .attr("stroke", "#333").attr("stroke-width", 1);
  annotG.append("text")
    .attr("x", x(topPoint.revenue) - 22).attr("y", y(topPoint.satisfaction) - 34)
    .attr("text-anchor", "end").attr("font-size", "0.65rem").attr("fill", "#333").attr("font-weight", 600)
    .text(`Top: $${topPoint.revenue}k`);

  // Lowest satisfaction callout
  annotG.append("line")
    .attr("x1", x(outlier.revenue)).attr("y1", y(outlier.satisfaction) + 8)
    .attr("x2", x(outlier.revenue) + 20).attr("y2", y(outlier.satisfaction) + 30)
    .attr("stroke", "#e63946").attr("stroke-width", 1);
  annotG.append("text")
    .attr("x", x(outlier.revenue) + 22).attr("y", y(outlier.satisfaction) + 42)
    .attr("text-anchor", "start").attr("font-size", "0.65rem").attr("fill", "#e63946").attr("font-weight", 600)
    .text(`Low sat: ${outlier.satisfaction}`);

  // Average line
  annotG.append("line")
    .attr("x1", 0).attr("x2", iw)
    .attr("y1", y(+avgSatisfaction)).attr("y2", y(+avgSatisfaction))
    .attr("stroke", "#4361ee").attr("stroke-width", 1)
    .attr("stroke-dasharray", "3,3").attr("opacity", 0.5);
  annotG.append("text")
    .attr("x", iw + 2).attr("y", y(+avgSatisfaction) + 3)
    .attr("font-size", "0.6rem").attr("fill", "#4361ee")
    .text(`avg ${avgSatisfaction}`);
}

// Render all 6 panels
["chart-xl", "chart-lg", "chart-md", "chart-sm", "chart-xs", "chart-xxs"].forEach(renderChart);
</script>
</body>
</html>
