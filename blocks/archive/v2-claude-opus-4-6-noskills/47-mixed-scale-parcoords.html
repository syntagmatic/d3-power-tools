<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mixed-Scale Parallel Coordinates</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
h1 { font-size: 1.4rem; margin-bottom: 4px; color: #fff; }
.subtitle { font-size: 0.85rem; color: #999; margin-bottom: 16px; }
#container { position: relative; width: 960px; height: 520px; }
canvas { position: absolute; top: 0; left: 0; }
svg { position: absolute; top: 0; left: 0; }
.axis text { font-size: 11px; fill: #bbb; }
.axis .domain, .axis line { stroke: #555; }
.axis-label { font-size: 12px; font-weight: 600; fill: #ddd; text-anchor: middle; }
.brush .selection { fill-opacity: 0.25; fill: #7ecfff; stroke: #7ecfff; stroke-width: 1; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; color: #ccc; }
.legend-swatch { width: 14px; height: 14px; border-radius: 3px; }
.info { font-size: 0.75rem; color: #777; margin-top: 8px; }
</style>
</head>
<body>
<h1>Employee Profile Explorer</h1>
<p class="subtitle">300 employees across 6 departments — brush axes to filter</p>
<div id="container"></div>
<div class="legend" id="legend"></div>
<p class="info" id="info">Showing 300 of 300 employees</p>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data ---
const departments = ["Engineering", "Marketing", "Sales", "Finance", "HR", "Operations"];
const levels = ["Junior", "Mid", "Senior", "Lead", "Director"];
const ratings = ["Needs Improvement", "Meets", "Exceeds", "Outstanding"];
const deptColor = d3.scaleOrdinal()
  .domain(departments)
  .range(["#4fc3f7", "#ff8a65", "#aed581", "#ce93d8", "#fff176", "#ef5350"]);

const rng = d3.randomLcg(42);
const rand = d3.randomNormal.source(rng);
const randU = d3.randomUniform.source(rng);

const data = d3.range(300).map(i => {
  const dept = departments[Math.floor(randU()() * departments.length)];
  const yearsExp = Math.max(0, Math.round(rand(8, 5)()));
  const levelIdx = Math.min(levels.length - 1, Math.max(0, Math.round(yearsExp / 4 + rand(0, 0.6)())));
  const baseSalary = 35000 * Math.pow(1.18, yearsExp) * (1 + rand(0, 0.15)());
  const salary = Math.max(30000, Math.round(baseSalary / 1000) * 1000);
  const satisfaction = Math.min(10, Math.max(1, Math.round(rand(6.5, 1.8)() * 10) / 10));
  const ratingIdx = Math.min(ratings.length - 1, Math.max(0, Math.round(rand(1.5, 0.8)())));
  return {
    years_experience: yearsExp,
    satisfaction,
    salary,
    department: dept,
    level: levels[levelIdx],
    rating: ratings[ratingIdx]
  };
});

// --- Dimensions ---
const dims = [
  { key: "years_experience", label: "Years Exp.", type: "linear" },
  { key: "satisfaction", label: "Satisfaction", type: "linear" },
  { key: "salary", label: "Salary", type: "log" },
  { key: "department", label: "Department", type: "ordinal", domain: departments },
  { key: "level", label: "Level", type: "ordinal", domain: levels },
  { key: "rating", label: "Rating", type: "ordinal", domain: ratings }
];

// --- Layout ---
const margin = { top: 40, right: 30, bottom: 20, left: 30 };
const width = 960, height = 520;
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const x = d3.scalePoint().domain(dims.map(d => d.key)).range([0, innerW]).padding(0.08);

// Build y scales
const y = {};
for (const dim of dims) {
  if (dim.type === "linear") {
    const ext = d3.extent(data, d => d[dim.key]);
    y[dim.key] = d3.scaleLinear().domain([ext[1], ext[0]]).range([0, innerH]).nice();
  } else if (dim.type === "log") {
    const ext = d3.extent(data, d => d[dim.key]);
    y[dim.key] = d3.scaleLog().domain([ext[1], ext[0]]).range([0, innerH]).nice();
  } else {
    y[dim.key] = d3.scalePoint().domain(dim.domain).range([0, innerH]).padding(0.5);
  }
}

// --- Canvas layer ---
const canvas = d3.select("#container").append("canvas")
  .attr("width", width * devicePixelRatio)
  .attr("height", height * devicePixelRatio)
  .style("width", width + "px")
  .style("height", height + "px");
const ctx = canvas.node().getContext("2d");
ctx.scale(devicePixelRatio, devicePixelRatio);

// --- SVG layer ---
const svg = d3.select("#container").append("svg")
  .attr("width", width).attr("height", height);
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// --- Draw axes ---
for (const dim of dims) {
  const xPos = x(dim.key);
  const axisG = g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${xPos},0)`);

  let axis;
  if (dim.type === "log") {
    axis = d3.axisLeft(y[dim.key]).ticks(6, "$,.0f");
  } else if (dim.type === "linear") {
    axis = d3.axisLeft(y[dim.key]).ticks(6);
  } else {
    axis = d3.axisLeft(y[dim.key]);
  }
  axisG.call(axis);

  axisG.append("text")
    .attr("class", "axis-label")
    .attr("y", -22)
    .text(dim.label);
}

// --- Brushing ---
const brushes = {};
const brushSelections = {};

function brushed(dimKey) {
  return function(event) {
    if (event.selection) {
      brushSelections[dimKey] = event.selection;
    } else {
      delete brushSelections[dimKey];
    }
    render();
  };
}

for (const dim of dims) {
  const brush = d3.brushY()
    .extent([[-12, 0], [12, innerH]])
    .on("brush end", brushed(dim.key));
  brushes[dim.key] = brush;

  g.append("g")
    .attr("class", "brush")
    .attr("transform", `translate(${x(dim.key)},0)`)
    .call(brush);
}

// --- Test if row is active ---
function isActive(d) {
  for (const key in brushSelections) {
    const [y0, y1] = brushSelections[key];
    const val = y[key](d[key]);
    if (val < y0 || val > y1) return false;
  }
  return true;
}

// --- Render ---
function render() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(margin.left, margin.top);

  const active = [];
  const inactive = [];
  for (const d of data) {
    if (isActive(d)) active.push(d);
    else inactive.push(d);
  }

  // Draw inactive lines (faded)
  ctx.globalAlpha = 0.06;
  ctx.lineWidth = 1;
  for (const d of inactive) {
    drawLine(d, "#666");
  }

  // Draw active lines
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = 1.5;
  for (const d of active) {
    drawLine(d, deptColor(d.department));
  }

  ctx.restore();

  d3.select("#info").text(`Showing ${active.length} of ${data.length} employees`);
}

function drawLine(d, color) {
  ctx.strokeStyle = color;
  ctx.beginPath();
  let first = true;
  for (const dim of dims) {
    const px = x(dim.key);
    const py = y[dim.key](d[dim.key]);
    if (first) { ctx.moveTo(px, py); first = false; }
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

render();

// --- Legend ---
const legend = d3.select("#legend");
for (const dept of departments) {
  const item = legend.append("span").attr("class", "legend-item");
  item.append("span").attr("class", "legend-swatch").style("background", deptColor(dept));
  item.append("span").text(dept);
}
</script>
</body>
</html>
