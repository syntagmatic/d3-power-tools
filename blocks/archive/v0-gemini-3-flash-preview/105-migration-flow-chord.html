<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Migration Flows (1980-2020)</title>
    <link rel="stylesheet" href="../../style/d3-power-tools.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            padding: var(--sp-6);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            width: 100%;
            text-align: left;
            margin-bottom: var(--sp-6);
        }

        .viz-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #chord-chart {
            margin-bottom: var(--sp-8);
        }

        #area-chart-container {
            width: 100%;
            height: 300px;
            display: flex;
            flex-direction: column;
        }

        #area-chart-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: var(--sp-2);
            color: var(--color-text-muted);
        }

        .controls {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: var(--sp-4);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: var(--sp-4);
            width: 350px;
            background: var(--color-surface);
            padding: var(--sp-2) var(--sp-4);
            border-radius: var(--radius);
            border: 1px solid var(--color-border-light);
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }

        .decade-label {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 50px;
            text-align: right;
            color: var(--color-primary);
        }

        .ribbon {
            fill-opacity: 0.65;
            stroke-width: 0.5px;
            transition: fill-opacity var(--duration);
        }

        .ribbon:hover {
            fill-opacity: 0.9;
        }

        .ribbon.faded {
            fill-opacity: 0.05;
            stroke-opacity: 0.05;
        }

        .group-arc {
            cursor: pointer;
            transition: transform var(--duration) ease;
        }

        .group-label {
            font-size: 11px;
            font-weight: 500;
            pointer-events: none;
        }

        .area-layer {
            transition: opacity var(--duration);
        }

        .area-layer.faded {
            opacity: 0.2;
        }

        .tooltip {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            padding: var(--sp-2) var(--sp-3);
            font-size: 12px;
            box-shadow: var(--shadow-lg);
            border-radius: var(--radius);
            border: 1px solid var(--color-border);
        }

        [data-theme="dark"] .tooltip {
            background: rgba(45, 45, 80, 0.95);
            border-color: var(--color-border);
        }

        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Global Migration <b>Flows</b></h1>
        <p class="subtitle">Synthetic inter-regional migration flows by decade. Hover a region arc to see inflow composition and net migration trends.</p>
    </div>

    <div class="controls">
        <div class="slider-container">
            <label for="decade-slider">Decade:</label>
            <input type="range" id="decade-slider" min="0" max="4" step="1" value="4">
            <span class="decade-label" id="current-decade">2020</span>
        </div>
    </div>

    <div class="viz-container">
        <div id="chord-chart"></div>
        <div id="area-chart-container">
            <div id="area-chart-title">Migration Inflow Breakdown</div>
            <div id="area-chart"></div>
        </div>
    </div>

    <div id="tooltip" class="tooltip" style="position: fixed; pointer-events: none; opacity: 0; z-index: 1000;"></div>

    <script>
        const regions = [
            "Africa", "Central/South Asia", "East/Southeast Asia", 
            "Europe", "Latin America", "Middle East", 
            "North America", "Oceania"
        ];

        const decades = [1980, 1990, 2000, 2010, 2020];
        
        // Custom color palette (Paul Tol)
        const colors = [
            "#4477AA", "#EE6677", "#228833", "#CCBB44", 
            "#66CCEE", "#AA3377", "#BBBBBB", "#332288"
        ];

        // 1. Data Generation
        function generateData() {
            const data = [];
            decades.forEach((d, di) => {
                const matrix = [];
                regions.forEach((s, si) => {
                    const row = [];
                    regions.forEach((t, ti) => {
                        if (si === ti) {
                            row.push(0); 
                        } else {
                            // Seed based on indices to keep trends consistent
                            let seed = (si * 7 + ti * 13) % 100;
                            let base = 20 + seed * 0.5;
                            
                            // Regional attractiveness bias
                            if (t === 6) base += 80; // North America
                            if (t === 3) base += 60; // Europe
                            if (t === 5) base += 40; // Middle East
                            
                            // Regional outflow bias
                            if (si === 1 || si === 2) base += 30; // Asia
                            if (si === 0) base += 20; // Africa
                            
                            // Temporal trend
                            const trend = 1 + di * 0.15 + (Math.sin(di + si) * 0.1); 
                            row.push(Math.round(base * trend));
                        }
                    });
                    matrix.push(row);
                });
                data.push(matrix);
            });
            return data;
        }

        const flowData = generateData();
        let currentDecadeIdx = 4;
        let hoveredRegionIdx = null;

        // 2. Chord Chart
        const width = 600;
        const height = 600;
        const outerRadius = Math.min(width, height) * 0.5 - 60;
        const innerRadius = outerRadius - 20;

        const chord = d3.chord()
            .padAngle(0.04)
            .sortSubgroups(d3.descending);

        const arc = d3.arc()
            .innerRadius(innerRadius)
            .outerRadius(outerRadius);

        const ribbon = d3.ribbon()
            .radius(innerRadius);

        const svgChord = d3.select("#chord-chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .append("g")
            .attr("transform", `translate(${width/2},${height/2})`);

        // Initialize Chord Chart
        function initChord() {
            const chords = chord(flowData[currentDecadeIdx]);

            // Groups (Regions)
            const groups = svgChord.datum(chords)
                .append("g")
                .attr("class", "groups")
                .selectAll("g")
                .data(d => d.groups)
                .enter().append("g")
                .attr("class", "group-arc")
                .on("mouseover", (event, d) => {
                    hoveredRegionIdx = d.index;
                    updateHoverState();
                    showTooltip(event, d);
                })
                .on("mouseout", () => {
                    hoveredRegionIdx = null;
                    updateHoverState();
                    hideTooltip();
                })
                .on("mousemove", moveTooltip);

            groups.append("path")
                .attr("fill", d => colors[d.index])
                .attr("d", arc);

            // Labels
            groups.append("text")
                .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
                .attr("dy", ".35em")
                .attr("class", "group-label")
                .attr("transform", d => `
                    rotate(${(d.angle * 180 / Math.PI - 90)})
                    translate(${outerRadius + 10})
                    ${d.angle > Math.PI ? "rotate(180)" : ""}
                `)
                .attr("text-anchor", d => d.angle > Math.PI ? "end" : "start")
                .text(d => regions[d.index]);

            // Ribbons (Flows)
            svgChord.append("g")
                .attr("class", "ribbons")
                .selectAll("path")
                .data(chords)
                .enter().append("path")
                .attr("class", "ribbon")
                .attr("d", ribbon)
                .attr("fill", d => colors[d.source.index])
                .attr("stroke", d => d3.rgb(colors[d.source.index]).darker());
        }

        function updateChord() {
            const chords = chord(flowData[currentDecadeIdx]);
            
            // Transition Ribbons
            const ribbons = svgChord.select(".ribbons")
                .selectAll("path")
                .data(chords);

            ribbons.transition()
                .duration(500)
                .attr("d", ribbon);

            // Transition Groups
            const groups = svgChord.select(".groups")
                .selectAll(".group-arc")
                .data(chords.groups);

            groups.select("path")
                .transition()
                .duration(500)
                .attr("d", arc);

            groups.select("text")
                .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
                .transition()
                .duration(500)
                .attr("transform", d => `
                    rotate(${(d.angle * 180 / Math.PI - 90)})
                    translate(${outerRadius + 10})
                    ${d.angle > Math.PI ? "rotate(180)" : ""}
                `)
                .attr("text-anchor", d => d.angle > Math.PI ? "end" : "start");

            if (hoveredRegionIdx !== null) {
                updateHoverState();
            }
        }

        function updateHoverState() {
            if (hoveredRegionIdx === null) {
                svgChord.selectAll(".ribbon").classed("faded", false);
            } else {
                svgChord.selectAll(".ribbon")
                    .classed("faded", d => d.source.index !== hoveredRegionIdx && d.target.index !== hoveredRegionIdx);
            }
            updateAreaChart();
        }

        // 3. Area Chart
        const areaWidth = 960;
        const areaHeight = 250;
        const margin = {top: 20, right: 30, bottom: 30, left: 60};

        const svgArea = d3.select("#area-chart")
            .append("svg")
            .attr("width", "100%")
            .attr("height", areaHeight)
            .attr("viewBox", `0 0 ${areaWidth} ${areaHeight}`)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const xArea = d3.scalePoint()
            .domain(decades)
            .range([0, areaWidth - margin.left - margin.right]);

        const yArea = d3.scaleLinear()
            .range([areaHeight - margin.top - margin.bottom, 0]);

        const areaGenerator = d3.area()
            .x(d => xArea(d.data.decade))
            .y0(d => yArea(d[0]))
            .y1(d => yArea(d[1]))
            .curve(d3.curveMonotoneX);

        svgArea.append("g")
            .attr("class", "x-axis")
            .attr("transform", `translate(0,${areaHeight - margin.top - margin.bottom})`)
            .call(d3.axisBottom(xArea));

        const yAxisG = svgArea.append("g")
            .attr("class", "y-axis");

        function updateAreaChart() {
            let areaData;
            let keys;
            
            if (hoveredRegionIdx === null) {
                // Total net migration for all regions across time
                keys = regions.map((_, i) => i);
                areaData = decades.map((d, di) => {
                    const row = {decade: d};
                    regions.forEach((r, ri) => {
                        const inflow = d3.sum(flowData[di], m => m[ri]);
                        const outflow = d3.sum(flowData[di][ri]);
                        row[ri] = inflow - outflow;
                    });
                    return row;
                });
                d3.select("#area-chart-title").text("Net Migration Trends by Region");
            } else {
                // Net contribution from each other region to the hovered region
                keys = regions.map((_, i) => i).filter(i => i !== hoveredRegionIdx);
                areaData = decades.map((d, di) => {
                    const row = {decade: d};
                    keys.forEach(ri => {
                        // Net contribution from ri to hoveredRegionIdx
                        row[ri] = flowData[di][ri][hoveredRegionIdx] - flowData[di][hoveredRegionIdx][ri];
                    });
                    return row;
                });
                d3.select("#area-chart-title").text(`Net Migration Components for ${regions[hoveredRegionIdx]}`);
            }

            const stack = d3.stack()
                .keys(keys)
                .offset(d3.stackOffsetDiverging);
            
            const layers = stack(areaData);

            const yMin = d3.min(layers, l => d3.min(l, d => d[0]));
            const yMax = d3.max(layers, l => d3.max(l, d => d[1]));
            
            yArea.domain([yMin, yMax]).nice();
            yAxisG.transition().duration(400).call(d3.axisLeft(yArea).ticks(5));

            const paths = svgArea.selectAll(".area-layer")
                .data(layers, d => d.key);

            paths.enter().append("path")
                .attr("class", "area-layer")
                .merge(paths)
                .transition()
                .duration(400)
                .attr("d", areaGenerator)
                .attr("fill", d => colors[d.key])
                .attr("fill-opacity", 0.85);

            paths.exit().remove();

            // Add/update zero line
            let zeroLine = svgArea.selectAll(".zero-line").data([0]);
            zeroLine.enter().append("line")
                .attr("class", "zero-line")
                .merge(zeroLine)
                .attr("x1", 0)
                .attr("x2", areaWidth - margin.left - margin.right)
                .transition().duration(400)
                .attr("y1", yArea(0))
                .attr("y2", yArea(0))
                .attr("stroke", "var(--color-text)")
                .attr("stroke-width", 1)
                .attr("stroke-dasharray", "2,2")
                .attr("opacity", 0.5);
        }

        // 4. Tooltip & Interactions
        const tooltip = d3.select("#tooltip");

        function showTooltip(event, d) {
            const decade = decades[currentDecadeIdx];
            const region = regions[d.index];
            const inflow = d3.sum(flowData[currentDecadeIdx], row => row[d.index]);
            const outflow = d3.sum(flowData[currentDecadeIdx][d.index]);
            const net = inflow - outflow;

            tooltip.style("opacity", 1).html(`
                <div style="font-weight: 600; margin-bottom: 4px;">${region} (${decade})</div>
                <div style="display: flex; justify-content: space-between; gap: 20px;">
                    <span>Total Inflow:</span>
                    <span style="font-family: monospace;">${inflow}k</span>
                </div>
                <div style="display: flex; justify-content: space-between; gap: 20px;">
                    <span>Total Outflow:</span>
                    <span style="font-family: monospace;">${outflow}k</span>
                </div>
                <div style="display: flex; justify-content: space-between; gap: 20px; border-top: 1px solid var(--color-border); margin-top: 4px; padding-top: 4px;">
                    <span>Net Migration:</span>
                    <span style="font-family: monospace; font-weight: 600; color: ${net >= 0 ? 'var(--color-positive)' : 'var(--color-negative)'}">
                        ${net > 0 ? '+' : ''}${net}k
                    </span>
                </div>
            `);
        }

        function moveTooltip(event) {
            tooltip.style("left", (event.clientX + 15) + "px")
                   .style("top", (event.clientY - 15) + "px");
        }

        function hideTooltip() {
            tooltip.style("opacity", 0);
        }

        // 5. Controls
        d3.select("#decade-slider").on("input", function() {
            currentDecadeIdx = +this.value;
            d3.select("#current-decade").text(decades[currentDecadeIdx]);
            updateChord();
            updateAreaChart();
        });

        // Start
        initChord();
        updateAreaChart();

    </script>
</body>
</html>
