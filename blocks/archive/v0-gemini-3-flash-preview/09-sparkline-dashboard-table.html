<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3 Sparkline Dashboard Table</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --header-bg: #f8f9fa;
      --border-color: #dee2e6;
      --row-hover: #f1f3f5;
      --row-alt: #f8f9fa;
      --text-color: #212529;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: var(--font-main);
      font-size: 12px;
      color: var(--text-color);
      background-color: #f0f2f5;
    }

    .dashboard-container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--bg-color);
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .table-container {
      position: relative;
      overflow-x: auto;
    }

    .table {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 800px;
    }

    .thead {
      display: flex;
      background: var(--header-bg);
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
      font-weight: 600;
    }

    .tbody {
      position: relative;
      /* Height will be set dynamically based on row count */
    }

    .tr {
      display: flex;
      width: 100%;
      border-bottom: 1px solid var(--border-color);
      box-sizing: border-box;
      transition: background-color 0.2s;
    }

    .tbody .tr {
      position: absolute;
      left: 0;
      top: 0;
      background: var(--bg-color);
    }

    .tbody .tr:nth-child(even) {
      background: var(--row-alt);
    }

    .tbody .tr:hover {
      background: var(--row-hover);
      z-index: 5;
    }

    .th, .td {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      flex: 1;
      overflow: hidden;
    }

    .th {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .th:hover {
      background: #e9ecef;
    }

    .th.active {
      background: #e2e6ea;
    }

    .sort-indicator {
      margin-left: 4px;
      display: inline-block;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
    }

    .sort-asc .sort-indicator {
      border-bottom: 4px solid #495057;
    }

    .sort-desc .sort-indicator {
      border-top: 4px solid #495057;
    }

    .td-num {
      justify-content: flex-end;
      font-family: var(--font-mono);
    }

    .ticker {
      font-weight: bold;
    }

    .sector-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    svg {
      display: block;
    }

    .sparkline-path {
      fill: none;
      stroke: #4477AA;
      stroke-width: 1;
    }

    .sparkline-area {
      fill: #4477AA;
      opacity: 0.1;
    }

    .sparkbar-rect {
      fill: #adb5bd;
    }

    .strip-win { fill: #228833; }
    .strip-loss { fill: #EE6677; }
    .strip-neutral { fill: #dee2e6; }

    /* Bullet chart colors */
    .bullet-range { fill: #e9ecef; }
    .bullet-target { stroke: #212529; stroke-width: 2; }
    .bullet-measure-pos { fill: #228833; }
    .bullet-measure-neg { fill: #EE6677; }

    .col-ticker { flex: 0 0 70px; }
    .col-sector { flex: 0 0 110px; }
    .col-price-30d { flex: 0 0 80px; }
    .col-volume { flex: 0 0 60px; }
    .col-winloss { flex: 0 0 100px; }
    .col-performance { flex: 0 0 100px; }
    .col-price { flex: 0 0 80px; text-align: right; }
  </style>
</head>
<body>

<div class="dashboard-container">
  <div class="table-container">
    <div id="table" class="table">
      <div class="thead">
        <div class="th col-ticker" data-key="ticker">Ticker<span class="sort-indicator"></span></div>
        <div class="th col-sector" data-key="sector">Sector<span class="sort-indicator"></span></div>
        <div class="th col-price-30d" data-key="performance_pct">30d Price<span class="sort-indicator"></span></div>
        <div class="th col-volume" data-key="avg_volume">Volume<span class="sort-indicator"></span></div>
        <div class="th col-winloss" data-key="win_count">Win/Loss<span class="sort-indicator"></span></div>
        <div class="th col-performance" data-key="performance_pct">Performance<span class="sort-indicator"></span></div>
        <div class="th col-price td-num" data-key="price">Price<span class="sort-indicator"></span></div>
      </div>
      <div class="tbody" id="tbody"></div>
    </div>
  </div>
</div>

<script>
  // Configuration
  const ROW_HEIGHT = 40;
  const SECTORS = [
    { name: "Technology", color: "#4477AA" },
    { name: "Healthcare", color: "#EE6677" },
    { name: "Finance", color: "#228833" },
    { name: "Consumer", color: "#CCBB44" },
    { name: "Energy", color: "#66CCEE" }
  ];

  const TICKERS = ["AAPL", "MSFT", "GOOG", "AMZN", "META", "TSLA", "BRK", "V", "JPM", "WMT", "MA", "PG", "UNH", "HD", "BAC", "XOM", "CVX", "LLY", "ABBV", "PFE", "COST", "DIS", "ADBE", "ORCL", "CSCO"];
  const NAMES = ["Apple Inc.", "Microsoft Corp.", "Alphabet Inc.", "Amazon.com Inc.", "Meta Platforms", "Tesla Inc.", "Berkshire Hathaway", "Visa Inc.", "JPMorgan Chase", "Walmart Inc.", "Mastercard Inc.", "Procter & Gamble", "UnitedHealth Group", "Home Depot", "Bank of America", "Exxon Mobil", "Chevron Corp.", "Eli Lilly", "AbbVie Inc.", "Pfizer Inc.", "Costco Wholesale", "Disney", "Adobe Inc.", "Oracle Corp.", "Cisco Systems"];

  // Generate synthetic data
  const data = TICKERS.map((ticker, i) => {
    const sectorObj = SECTORS[Math.floor(Math.random() * SECTORS.length)];
    const price = 10 + Math.random() * 490;
    
    // 30 days of prices
    let lastPrice = price;
    const prices_30d = Array.from({ length: 30 }, () => {
      lastPrice *= (1 + (Math.random() - 0.5) * 0.04);
      return lastPrice;
    });

    // 7 days of volumes
    const volume_7d = Array.from({ length: 7 }, () => 1000 + Math.random() * 9000);
    const avg_volume = d3.mean(volume_7d);

    // 20 days of returns
    const daily_returns_20d = Array.from({ length: 20 }, () => (Math.random() - 0.45) * 0.05);
    const win_count = daily_returns_20d.filter(r => r > 0).length;

    const performance_pct = -30 + Math.random() * 80;
    const target_pct = 5 + Math.random() * 25;

    return {
      id: i,
      ticker,
      company_name: NAMES[i],
      sector: sectorObj.name,
      sectorColor: sectorObj.color,
      price,
      prices_30d,
      volume_7d,
      avg_volume,
      daily_returns_20d,
      win_count,
      performance_pct,
      target_pct
    };
  });

  const tbody = d3.select("#tbody")
    .style("height", `${data.length * ROW_HEIGHT}px`);

  let sortKey = "ticker";
  let sortDirection = 1; // 1: asc, -1: desc

  const formatCurrency = d3.format("$,.2f");

  function render() {
    // Sort data
    const sortedData = [...data].sort((a, b) => {
      const va = a[sortKey];
      const vb = b[sortKey];
      if (va < vb) return -1 * sortDirection;
      if (va > vb) return 1 * sortDirection;
      return 0;
    });

    // Map ID to target Y position
    const positions = new Map(sortedData.map((d, i) => [d.id, i * ROW_HEIGHT]));

    // Update headers
    d3.selectAll(".th")
      .classed("active", d => d3.select(event?.currentTarget).attr("data-key") === sortKey)
      .each(function() {
        const key = d3.select(this).attr("data-key");
        d3.select(this)
          .classed("sort-asc", key === sortKey && sortDirection === 1)
          .classed("sort-desc", key === sortKey && sortDirection === -1);
      });

    // Data join
    const rows = tbody.selectAll(".tr")
      .data(data, d => d.id)
      .join(
        enter => {
          const row = enter.append("div")
            .attr("class", "tr")
            .style("height", `${ROW_HEIGHT}px`)
            .style("transform", d => `translateY(${positions.get(d.id)}px)`);

          // Column 1: Ticker
          row.append("div").attr("class", "td col-ticker ticker").text(d => d.ticker);

          // Column 2: Sector
          const sectorCell = row.append("div").attr("class", "td col-sector");
          sectorCell.append("span").attr("class", "sector-dot").style("background-color", d => d.sectorColor);
          sectorCell.append("span").text(d => d.sector);

          // Column 3: 30d Price (Spark Area)
          const sparklineCell = row.append("div").attr("class", "td col-price-30d");
          renderSparkline(sparklineCell);

          // Column 4: Volume (Spark Bar)
          const volumeCell = row.append("div").attr("class", "td col-volume");
          renderSparkBar(volumeCell);

          // Column 5: Win/Loss (Strip)
          const winLossCell = row.append("div").attr("class", "td col-winloss");
          renderWinLoss(winLossCell);

          // Column 6: Performance (Bullet)
          const perfCell = row.append("div").attr("class", "td col-performance");
          renderBullet(perfCell);

          // Column 7: Price
          row.append("div").attr("class", "td td-num col-price").text(d => formatCurrency(d.price));

          return row;
        },
        update => update.transition().duration(300)
          .style("transform", d => `translateY(${positions.get(d.id)}px)`)
      );
  }

  function renderSparkline(container) {
    const w = 60, h = 24, p = 2;
    container.each(function(d) {
      const svg = d3.select(this).append("svg").attr("width", w).attr("height", h);
      const x = d3.scaleLinear().domain([0, d.prices_30d.length - 1]).range([p, w - p]);
      const y = d3.scaleLinear().domain(d3.extent(d.prices_30d)).range([h - p, p]);

      const area = d3.area()
        .x((_, i) => x(i))
        .y0(h)
        .y1(v => y(v))
        .curve(d3.curveMonotoneX);

      const line = d3.line()
        .x((_, i) => x(i))
        .y(v => y(v))
        .curve(d3.curveMonotoneX);

      svg.append("path").datum(d.prices_30d).attr("class", "sparkline-area").attr("d", area);
      svg.append("path").datum(d.prices_30d).attr("class", "sparkline-path").attr("d", line);
      
      // Last point dot
      svg.append("circle")
        .attr("cx", x(d.prices_30d.length - 1))
        .attr("cy", y(d.prices_30d[d.prices_30d.length - 1]))
        .attr("r", 2)
        .attr("fill", "#4477AA");
    });
  }

  function renderSparkBar(container) {
    const w = 40, h = 20, gap = 1;
    container.each(function(d) {
      const svg = d3.select(this).append("svg").attr("width", w).attr("height", h);
      const x = d3.scaleBand().domain(d3.range(d.volume_7d.length)).range([0, w]).paddingInner(0.2);
      const y = d3.scaleLinear().domain([0, d3.max(d.volume_7d)]).range([h, 0]);

      svg.selectAll("rect")
        .data(d.volume_7d)
        .join("rect")
        .attr("class", "sparkbar-rect")
        .attr("x", (_, i) => x(i))
        .attr("y", v => y(v))
        .attr("width", x.bandwidth())
        .attr("height", v => h - y(v));
    });
  }

  function renderWinLoss(container) {
    const w = 80, h = 12, gap = 1;
    container.each(function(d) {
      const svg = d3.select(this).append("svg").attr("width", w).attr("height", h);
      const rw = (w - (d.daily_returns_20d.length - 1) * gap) / d.daily_returns_20d.length;

      svg.selectAll("rect")
        .data(d.daily_returns_20d)
        .join("rect")
        .attr("x", (_, i) => i * (rw + gap))
        .attr("y", 0)
        .attr("width", rw)
        .attr("height", h)
        .attr("class", v => v > 0 ? "strip-win" : v < 0 ? "strip-loss" : "strip-neutral");
    });
  }

  function renderBullet(container) {
    const w = 80, h = 16;
    container.each(function(d) {
      const svg = d3.select(this).append("svg").attr("width", w).attr("height", h);
      const maxRange = Math.max(50, d.performance_pct, d.target_pct);
      const x = d3.scaleLinear().domain([0, maxRange]).range([0, w]);

      // Range background
      svg.append("rect")
        .attr("class", "bullet-range")
        .attr("x", 0).attr("y", 2).attr("width", w).attr("height", h - 4);

      // Measure bar
      const isOver = d.performance_pct >= d.target_pct;
      svg.append("rect")
        .attr("class", isOver ? "bullet-measure-pos" : "bullet-measure-neg")
        .attr("x", 0).attr("y", 5).attr("width", x(Math.max(0, d.performance_pct))).attr("height", h - 10);

      // Target marker
      svg.append("line")
        .attr("class", "bullet-target")
        .attr("x1", x(d.target_pct)).attr("x2", x(d.target_pct))
        .attr("y1", 2).attr("y2", h - 2);
    });
  }

  // Sorting interaction
  d3.selectAll(".th").on("click", function() {
    const key = d3.select(this).attr("data-key");
    if (sortKey === key) {
      sortDirection *= -1;
    } else {
      sortKey = key;
      sortDirection = 1;
    }
    render();
  });

  // Initial render
  render();

</script>
</body>
</html>
