<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regional Manufacturing Priorities — Parallel Coordinates Grid</title>
  <link rel="stylesheet" href="../../style/d3-power-tools.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      padding: var(--sp-6);
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: var(--sp-6);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: var(--sp-8);
      margin-top: var(--sp-4);
    }

    .panel {
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius);
      padding: var(--sp-4);
      position: relative;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: var(--sp-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .region-tag {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: #fff;
      text-transform: uppercase;
    }

    .parcoords-svg {
      width: 100%;
      height: 240px;
      display: block;
    }

    .axis line, .axis path {
      stroke: var(--color-border);
    }

    .axis text {
      font-size: 10px;
      fill: var(--color-text-muted);
    }

    .axis-label {
      font-size: 10px;
      font-weight: 600;
      text-anchor: middle;
      fill: var(--color-text);
      cursor: default;
    }

    .line-bg {
      fill: none;
      stroke: var(--color-border-light);
      stroke-width: 1px;
      opacity: 0.2;
    }

    .line-fg {
      fill: none;
      stroke-width: 1.5px;
      opacity: 0.8;
      transition: opacity 0.2s, stroke-width 0.2s;
    }

    .line-fg.dimmed {
      opacity: 0.05;
      stroke-width: 1px;
    }

    .brush .selection {
      fill: var(--color-link);
      fill-opacity: 0.2;
      stroke: var(--color-link);
      stroke-width: 1px;
    }

    .legend {
      display: flex;
      gap: var(--sp-4);
      margin-bottom: var(--sp-6);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-size: 12px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }

    .controls {
      margin-bottom: var(--sp-4);
    }

    [data-theme="dark"] .panel {
      background: var(--color-surface);
    }
  </style>
</head>
<body>

<header>
  <h1>Regional Manufacturing Priorities</h1>
  <p class="subtitle">Synthetic car dataset (200 models) split by manufacturing region. Brush any axis to filter globally.</p>
</header>

<div class="legend" id="legend"></div>

<div class="controls">
  <button id="reset-btn">Reset All Brushes</button>
</div>

<div class="grid" id="grid"></div>

<script>
  // Configuration
  const REGIONS = [
    { id: 'USA', name: 'USA', color: 'var(--color-cat-1)' },
    { id: 'Europe', name: 'Europe', color: 'var(--color-cat-2)' },
    { id: 'Japan', name: 'Japan', color: 'var(--color-cat-3)' },
    { id: 'South Korea', name: 'South Korea', color: 'var(--color-cat-4)' }
  ];

  const DIMENSIONS = [
    { key: 'price', label: 'Price ($)', format: d3.format('$,.0f') },
    { key: 'hp', label: 'HP', format: d3.format('.0f') },
    { key: 'mpg', label: 'MPG', format: d3.format('.0f') },
    { key: 'weight', label: 'Weight (lb)', format: d3.format(',.0f') },
    { key: 'accel', label: '0-60s', format: d3.format('.1f') },
    { key: 'displ', label: 'Displ (L)', format: d3.format('.1f') }
  ];

  const NUM_CARS = 200;

  // Generate synthetic data
  function generateData() {
    const data = [];
    const regionIds = REGIONS.map(r => r.id);

    for (let i = 0; i < NUM_CARS; i++) {
      const region = regionIds[i % regionIds.length];
      const d = { id: i, region: region };

      // Base characteristics by region
      if (region === 'USA') {
        d.hp = 150 + Math.random() * 300;
        d.mpg = 12 + Math.random() * 13;
        d.weight = 3500 + Math.random() * 2000;
        d.accel = 4.0 + Math.random() * 5.0;
        d.displ = 3.5 + Math.random() * 4.5;
      } else if (region === 'Europe') {
        d.hp = 100 + Math.random() * 500;
        d.mpg = 18 + Math.random() * 27;
        d.weight = 2800 + Math.random() * 2000;
        d.accel = 3.0 + Math.random() * 7.0;
        d.displ = 1.6 + Math.random() * 2.4;
      } else if (region === 'Japan') {
        d.hp = 70 + Math.random() * 230;
        d.mpg = 25 + Math.random() * 35;
        d.weight = 2000 + Math.random() * 1500;
        d.accel = 6.0 + Math.random() * 6.0;
        d.displ = 0.6 + Math.random() * 1.9;
      } else { // South Korea
        d.hp = 120 + Math.random() * 230;
        d.mpg = 22 + Math.random() * 33;
        d.weight = 2500 + Math.random() * 1500;
        d.accel = 5.0 + Math.random() * 6.0;
        d.displ = 1.4 + Math.random() * 2.1;
      }

      // Add noise and cross-dimension logic
      // Price is correlated with HP and Weight
      d.price = (d.hp * 100) + (d.weight * 5) + (Math.random() * 10000);
      if (region === 'Europe' && d.hp > 400) d.price *= 1.5; // Luxury/Sports tax

      data.push(d);
    }
    return data;
  }

  const data = generateData();

  // Scales
  const yScales = {};
  DIMENSIONS.forEach(dim => {
    const extent = d3.extent(data, d => d[dim.key]);
    yScales[dim.key] = d3.scaleLinear()
      .domain(extent)
      .range([200, 0])
      .nice();
  });

  // Global Filter State
  const filters = new Map(); // dimension -> [min, max]

  function updateGlobalFilters() {
    const activeFilters = Array.from(filters.entries());

    d3.selectAll('.line-fg').classed('dimmed', d => {
      return activeFilters.some(([dim, [min, max]]) => {
        const val = d[dim];
        return val < min || val > max;
      });
    });
  }

  // Render Legend
  const legend = d3.select('#legend');
  REGIONS.forEach(r => {
    const item = legend.append('div').attr('class', 'legend-item');
    item.append('div')
      .attr('class', 'legend-color')
      .style('background', r.color);
    item.append('span').text(r.name);
  });

  // Render Grid Panels
  const grid = d3.select('#grid');
  const panels = {};

  REGIONS.forEach(region => {
    const regionData = data.filter(d => d.region === region.id);

    const panel = grid.append('div').attr('class', 'panel');
    const header = panel.append('div').attr('class', 'panel-title');
    header.append('span').text(`Region: ${region.name}`);
    header.append('span')
      .attr('class', 'region-tag')
      .style('background', region.color)
      .text(region.id);

    const container = panel.append('div').attr('class', 'parcoords-container');
    const width = 500; // Relative to CSS
    const height = 240;
    const margin = { top: 30, right: 30, bottom: 20, left: 30 };

    const svg = container.append('svg')
      .attr('viewBox', `0 0 ${width} ${height}`)
      .attr('class', 'parcoords-svg');

    const x = d3.scalePoint()
      .domain(DIMENSIONS.map(d => d.key))
      .range([margin.left, width - margin.right]);

    const line = d3.line()
      .defined(d => !isNaN(d[1]))
      .x(d => d[0])
      .y(d => d[1]);

    function getPath(d) {
      return line(DIMENSIONS.map(dim => [x(dim.key), yScales[dim.key](d[dim.key])]));
    }

    // Draw lines
    const gLines = svg.append('g').attr('class', 'lines');

    // Background lines for context (optional, maybe too noisy?)
    // Here we only show this region's lines.

    gLines.selectAll('.line-fg')
      .data(regionData)
      .enter()
      .append('path')
      .attr('class', 'line-fg')
      .attr('d', getPath)
      .style('stroke', region.color);

    // Draw axes
    const gAxes = svg.append('g').attr('class', 'axes');

    const axes = gAxes.selectAll('.axis')
      .data(DIMENSIONS)
      .enter()
      .append('g')
      .attr('class', 'axis')
      .attr('transform', d => `translate(${x(d.key)}, 0)`);

    axes.append('g')
      .attr('transform', `translate(0, ${margin.top})`)
      .each(function(d) {
        d3.select(this).call(d3.axisLeft(yScales[d.key]).ticks(5).tickSize(3));
      });

    axes.append('text')
      .attr('class', 'axis-label')
      .attr('y', margin.top - 10)
      .text(d => d.label);

    // Brushes
    const brushHeight = 200;
    const brushes = axes.append('g')
      .attr('class', 'brush')
      .attr('transform', `translate(-10, ${margin.top})`);

    const brush = d3.brushY()
      .extent([[0, 0], [20, brushHeight]])
      .on('start brush end', brushed);

    brushes.call(brush);

    function brushed(event, dimObj) {
      const selection = event.selection;
      const dim = dimObj.key;

      if (!selection) {
        filters.delete(dim);
      } else {
        const [y1, y0] = selection.map(yScales[dim].invert);
        filters.set(dim, [Math.min(y0, y1), Math.max(y0, y1)]);
      }

      // If it was a manual user interaction, update all panels
      if (event.sourceEvent) {
        // Sync brushes across all panels for the SAME dimension
        syncBrushes(dim, selection, region.id);
        updateGlobalFilters();
      }
    }

    panels[region.id] = {
      svg: svg,
      brush: brush,
      brushes: brushes,
      x: x
    };
  });

  function syncBrushes(dim, selection, sourceRegionId) {
    REGIONS.forEach(region => {
      if (region.id === sourceRegionId) return;

      const panel = panels[region.id];
      const brushGroup = panel.brushes.filter(d => d.key === dim);

      // Call brush.move without triggering events recursively
      // We check event.sourceEvent in 'brushed' to avoid loops.
      brushGroup.call(panel.brush.move, selection);
    });
  }

  d3.select('#reset-btn').on('click', () => {
    filters.clear();
    REGIONS.forEach(region => {
      const panel = panels[region.id];
      panel.brushes.call(panel.brush.move, null);
    });
    updateGlobalFilters();
  });

</script>

</body>
</html>
