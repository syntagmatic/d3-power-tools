<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Container Query Chart — One Component, Six Sizes</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; padding: 24px; }
  h1 { font-size: 1.2rem; font-weight: 600; color: #333; margin-bottom: 6px; }
  .subtitle { font-size: 0.85rem; color: #777; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .size-slot {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .size-label {
    font-size: 0.75rem;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .chart-host {
    container-type: inline-size;
    overflow: hidden;
    border: 1px dashed #ddd;
    border-radius: 4px;
    width: 100%;
    height: 100%;
  }

  /* ---- Chart component CSS, driven by container queries ---- */
  .cq-chart {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .cq-chart .chart-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: #333;
    padding: 8px 10px 0;
  }
  .cq-chart .chart-body { flex: 1; min-height: 0; }
  .cq-chart .chart-body svg { display: block; }
  .cq-chart .annotation { display: none; }
  .cq-chart .kpi-view { display: none; }
  .cq-chart .legend { display: none; }

  /* 600px+ : full scatter with annotations and legend */
  @container (min-width: 600px) {
    .cq-chart .annotation { display: block; }
    .cq-chart .legend { display: flex; gap: 12px; padding: 4px 10px 8px; flex-wrap: wrap; }
    .cq-chart .chart-title { font-size: 0.9rem; }
  }

  /* 300-599px : simplified scatter, no annotations or legend */
  @container (min-width: 300px) and (max-width: 599px) {
    .cq-chart .chart-title { font-size: 0.8rem; }
  }

  /* 150-299px : sparkline dots */
  @container (max-width: 299px) {
    .cq-chart .chart-title { font-size: 0.7rem; padding: 4px 6px 0; }
    .cq-chart .axis { display: none; }
  }

  /* <150px : KPI only */
  @container (max-width: 149px) {
    .cq-chart .chart-body { display: none; }
    .cq-chart .chart-title { display: none; }
    .cq-chart .kpi-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 8px;
      text-align: center;
    }
    .cq-chart .kpi-view .kpi-number {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2563eb;
      line-height: 1.1;
    }
    .cq-chart .kpi-view .kpi-label {
      font-size: 0.6rem;
      color: #888;
      margin-top: 2px;
    }
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    color: #555;
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
</style>
</head>
<body>

<h1>One Chart Component, Six Container Sizes</h1>
<p class="subtitle">Same data and code — container queries adapt the presentation. Dashed borders show the container.</p>

<div class="grid" id="grid"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// ── Synthetic data ──────────────────────────────────────────
const rng = d3.randomLcg(42);
const randNorm = d3.randomNormal.source(rng);
const categories = ["Engineering", "Design", "Marketing", "Sales"];
const colors = { Engineering: "#2563eb", Design: "#e45f56", Marketing: "#16a34a", Sales: "#f59e0b" };

const data = [];
categories.forEach(cat => {
  const n = 20 + Math.floor(rng() * 15);
  const xBase = randNorm(50, 15);
  const yBase = randNorm(60, 20);
  const sBase = randNorm(8, 3);
  for (let i = 0; i < n; i++) {
    data.push({
      category: cat,
      x: Math.max(0, Math.min(100, xBase())),
      y: Math.max(0, Math.min(100, yBase())),
      size: Math.max(2, sBase()),
      label: i === 0 ? cat : null
    });
  }
});

// KPI: correlation of x vs y
const corrX = data.map(d => d.x), corrY = data.map(d => d.y);
const meanX = d3.mean(corrX), meanY = d3.mean(corrY);
const num = d3.sum(data.map((_, i) => (corrX[i] - meanX) * (corrY[i] - meanY)));
const den = Math.sqrt(
  d3.sum(corrX.map(v => (v - meanX) ** 2)) *
  d3.sum(corrY.map(v => (v - meanY) ** 2))
);
const correlation = (num / den).toFixed(2);

// Annotations for the full view
const annotations = [
  { x: d3.max(data, d => d.x), y: data.find(d => d.x === d3.max(data, d => d.x)).y, text: "Highest effort" },
  { x: data.find(d => d.y === d3.max(data, d => d.y)).x, y: d3.max(data, d => d.y), text: "Top performer" }
];

// ── Size configurations ─────────────────────────────────────
const sizes = [
  { label: "720 × 400 — Full", w: 720, h: 400 },
  { label: "600 × 350 — Annotations", w: 600, h: 350 },
  { label: "450 × 280 — Simplified", w: 450, h: 280 },
  { label: "300 × 200 — Compact", w: 300, h: 200 },
  { label: "180 × 140 — Sparkline dots", w: 180, h: 140 },
  { label: "120 × 100 — KPI only", w: 120, h: 100 }
];

// ── Render a chart component into a container ───────────────
function renderChart(container, width, height) {
  const el = document.createElement("div");
  el.className = "cq-chart";
  el.style.height = height + "px";

  // Title
  const title = document.createElement("div");
  title.className = "chart-title";
  title.textContent = "Effort vs Performance";
  el.appendChild(title);

  // Legend (visible only at 600px+ via container query)
  const legend = document.createElement("div");
  legend.className = "legend";
  categories.forEach(cat => {
    const item = document.createElement("span");
    item.className = "legend-item";
    item.innerHTML = `<span class="legend-swatch" style="background:${colors[cat]}"></span>${cat}`;
    legend.appendChild(item);
  });
  el.appendChild(legend);

  // KPI view (visible only at <150px via container query)
  const kpi = document.createElement("div");
  kpi.className = "kpi-view";
  kpi.innerHTML = `<span class="kpi-number">r=${correlation}</span><span class="kpi-label">${data.length} points</span>`;
  el.appendChild(kpi);

  // Chart body
  const body = document.createElement("div");
  body.className = "chart-body";
  el.appendChild(body);
  container.appendChild(el);

  // Use ResizeObserver so the SVG fills whatever space the body gets
  const ro = new ResizeObserver(([entry]) => {
    const { width: w, height: h } = entry.contentRect;
    if (w < 10 || h < 10) return;
    body.innerHTML = "";
    drawSVG(body, w, h, container.clientWidth);
  });
  ro.observe(body);
}

function drawSVG(body, w, h, containerWidth) {
  const isSparkline = containerWidth < 300;
  const isSimplified = containerWidth < 600;

  const margin = isSparkline
    ? { top: 4, right: 4, bottom: 4, left: 4 }
    : isSimplified
      ? { top: 8, right: 12, bottom: 28, left: 32 }
      : { top: 10, right: 16, bottom: 36, left: 44 };

  const innerW = w - margin.left - margin.right;
  const innerH = h - margin.top - margin.bottom;
  if (innerW < 5 || innerH < 5) return;

  const svg = d3.select(body).append("svg")
    .attr("width", w)
    .attr("height", h)
    .attr("viewBox", `0 0 ${w} ${h}`);

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleLinear().domain([0, 100]).range([0, innerW]);
  const y = d3.scaleLinear().domain([0, 100]).range([innerH, 0]);
  const r = d3.scaleSqrt().domain([2, 20]).range(isSparkline ? [1.5, 4] : [3, 14]);

  // Axes (hidden via CSS at sparkline sizes)
  if (!isSparkline) {
    const xAxis = g.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${innerH})`)
      .call(d3.axisBottom(x).ticks(Math.max(2, Math.floor(innerW / 80))).tickSize(-innerH));

    const yAxis = g.append("g")
      .attr("class", "axis")
      .call(d3.axisLeft(y).ticks(Math.max(2, Math.floor(innerH / 50))).tickSize(-innerW));

    // Style gridlines
    svg.selectAll(".axis line").attr("stroke", "#e8e8e8").attr("stroke-dasharray", "2,2");
    svg.selectAll(".axis .domain").attr("stroke", "#ccc");
    svg.selectAll(".axis text").attr("fill", "#888").style("font-size", isSimplified ? "9px" : "11px");

    // Axis labels at full size
    if (!isSimplified) {
      g.append("text")
        .attr("x", innerW / 2).attr("y", innerH + margin.bottom - 4)
        .attr("text-anchor", "middle")
        .attr("fill", "#666").style("font-size", "11px")
        .text("Effort →");
      g.append("text")
        .attr("transform", `rotate(-90)`)
        .attr("x", -innerH / 2).attr("y", -margin.left + 14)
        .attr("text-anchor", "middle")
        .attr("fill", "#666").style("font-size", "11px")
        .text("↑ Performance");
    }
  }

  // Points
  g.selectAll("circle")
    .data(data)
    .join("circle")
    .attr("cx", d => x(d.x))
    .attr("cy", d => y(d.y))
    .attr("r", d => r(d.size))
    .attr("fill", d => colors[d.category])
    .attr("opacity", isSparkline ? 0.7 : 0.6)
    .attr("stroke", isSparkline ? "none" : "#fff")
    .attr("stroke-width", isSparkline ? 0 : 0.5);

  // Annotations (visible only at 600px+ via container query)
  if (!isSimplified) {
    annotations.forEach(a => {
      const ag = g.append("g").attr("class", "annotation");
      const ax = x(a.x), ay = y(a.y);
      const dx = ax > innerW * 0.7 ? -60 : 20;
      const dy = ay < 40 ? 20 : -20;
      ag.append("line")
        .attr("x1", ax).attr("y1", ay)
        .attr("x2", ax + dx).attr("y2", ay + dy)
        .attr("stroke", "#555").attr("stroke-width", 1);
      ag.append("text")
        .attr("x", ax + dx + (dx > 0 ? 4 : -4))
        .attr("y", ay + dy + 4)
        .attr("text-anchor", dx > 0 ? "start" : "end")
        .attr("fill", "#444")
        .style("font-size", "10px")
        .style("font-weight", "500")
        .text(a.text);
    });
  }
}

// ── Build the page ──────────────────────────────────────────
const grid = document.getElementById("grid");

sizes.forEach(s => {
  const slot = document.createElement("div");
  slot.className = "size-slot";

  const label = document.createElement("div");
  label.className = "size-label";
  label.textContent = s.label;
  slot.appendChild(label);

  const host = document.createElement("div");
  host.className = "chart-host";
  host.style.width = s.w + "px";
  host.style.height = s.h + "px";
  slot.appendChild(host);

  grid.appendChild(slot);
  renderChart(host, s.w, s.h);
});
</script>
</body>
</html>
