<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textured Raincloud Plots</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #fafaf7; font-family: -apple-system, system-ui, sans-serif; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; color: #222; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 16px; }
  .controls { margin-bottom: 12px; }
  .toggle-btn {
    font-size: 13px; padding: 6px 14px; border: 1px solid #999; border-radius: 4px;
    background: #fff; cursor: pointer; color: #333; transition: all 0.15s;
  }
  .toggle-btn.active { background: #333; color: #fff; border-color: #333; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 12px; color: #444; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 18px; height: 14px; border: 1px solid #999; border-radius: 2px; }
  svg text { font-family: -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<h1>Raincloud Plots — Texture + Color Dual Encoding</h1>
<p class="subtitle">Half-violin KDE, box plot, and jittered strip for 6 treatment groups. Toggle deuteranopia simulation to verify patterns carry the encoding.</p>
<div class="controls">
  <button class="toggle-btn" id="cvdToggle">Deuteranopia Simulation</button>
</div>
<div id="chart"></div>
<div class="legend" id="legend"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data ---
const groups = ["Control", "Drug A", "Drug B", "Drug C", "Drug D", "Drug E"];
const generators = [
  { mean: 52, sd: 10 },
  { mean: 60, sd: 12 },
  { mean: 45, sd: 8, skew: -0.6 },
  { mean: 70, sd: 14 },
  { mean: 55, sd: 9, bimodal: true, mean2: 75, sd2: 6, mix: 0.4 },
  { mean: 48, sd: 11 },
];

const rng = d3.randomLcg(12345);
const normal = d3.randomNormal.source(rng);

function generateGroup(spec, n = 80) {
  const vals = [];
  for (let i = 0; i < n; i++) {
    if (spec.bimodal && rng() < spec.mix) {
      vals.push(normal(spec.mean2, spec.sd2)());
    } else {
      let v = normal(spec.mean, spec.sd)();
      if (spec.skew) v += spec.skew * spec.sd * Math.pow(Math.abs(normal(0, 1)()), 1.5) * Math.sign(spec.skew);
      vals.push(v);
    }
  }
  return vals;
}

const data = groups.map((name, i) => {
  const values = generateGroup(generators[i]);
  return { name, values };
});

// --- Tol Bright palette (6 colors) ---
const tolBright = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377"];

// --- Deuteranopia simulation (Viénot 1999 matrices) ---
const deutMatrix = [
  0.367322, 0.860646, -0.227968,
  0.280085, 0.672501,  0.047413,
 -0.011820, 0.042940,  0.968881
];

function linearize(c) {
  c /= 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
function delinearize(c) {
  return Math.round(Math.max(0, Math.min(255,
    (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(Math.max(0, c), 1 / 2.4) - 0.055) * 255)));
}

function simDeut(hex) {
  const c = d3.color(hex);
  const lr = linearize(c.r), lg = linearize(c.g), lb = linearize(c.b);
  const m = deutMatrix;
  const r = delinearize(m[0] * lr + m[1] * lg + m[2] * lb);
  const g = delinearize(m[3] * lr + m[4] * lg + m[5] * lb);
  const b = delinearize(m[6] * lr + m[7] * lg + m[8] * lb);
  return `rgb(${r},${g},${b})`;
}

// --- Stats ---
function computeStats(values) {
  const sorted = Float64Array.from(values).sort();
  const q1 = d3.quantile(sorted, 0.25), q3 = d3.quantile(sorted, 0.75), iqr = q3 - q1;
  const lowerFence = q1 - 1.5 * iqr, upperFence = q3 + 1.5 * iqr;
  return {
    min: sorted[0], max: sorted[sorted.length - 1],
    q1, median: d3.quantile(sorted, 0.5), q3, iqr,
    whiskerLow: d3.min(sorted.filter(v => v >= lowerFence)),
    whiskerHigh: d3.max(sorted.filter(v => v <= upperFence)),
    outliers: sorted.filter(v => v < lowerFence || v > upperFence),
    n: sorted.length,
  };
}

// --- KDE ---
const gaussian = x => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);

function kde(kernel, bandwidth, data) {
  return points => points.map(x => [x, d3.mean(data, v => kernel((x - v) / bandwidth)) / bandwidth]);
}

function silvermanBW(values) {
  const sorted = Float64Array.from(values).sort();
  const std = d3.deviation(values);
  const iqr = d3.quantile(sorted, 0.75) - d3.quantile(sorted, 0.25);
  return 0.9 * Math.min(std, iqr / 1.34) * Math.pow(values.length, -0.2);
}

// --- Layout ---
const margin = { top: 20, right: 30, bottom: 40, left: 72 };
const width = 780, height = 500;
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const allValues = data.flatMap(d => d.values);
const xExtent = d3.extent(allValues);
const xPad = (xExtent[1] - xExtent[0]) * 0.08;
const xScale = d3.scaleLinear([xExtent[0] - xPad, xExtent[1] + xPad], [0, innerW]);
const yBand = d3.scaleBand(groups, [0, innerH]).paddingInner(0.15).paddingOuter(0.1);

const svg = d3.select("#chart").append("svg")
  .attr("width", width).attr("height", height)
  .attr("viewBox", `0 0 ${width} ${height}`);

const defs = svg.append("defs");
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// --- Patterns (6 texton-diverse patterns) ---
const patternSpecs = [
  { id: "pat-hatch",      type: "hatch",      angle: 45, size: 7, sw: 1.5 },
  { id: "pat-dots",       type: "dots",        size: 8, r: 1.8 },
  { id: "pat-cross",      type: "crosshatch",  size: 7, sw: 1.3 },
  { id: "pat-horiz",      type: "hatch",       angle: 0, size: 6, sw: 1.5 },
  { id: "pat-zigzag",     type: "zigzag",      size: 10, sw: 1.5 },
  { id: "pat-vert",       type: "hatch",       angle: 90, size: 6, sw: 1.5 },
];

function createPatterns() {
  defs.selectAll("pattern").remove();
  patternSpecs.forEach(spec => {
    const p = defs.append("pattern")
      .attr("id", spec.id)
      .attr("width", spec.size).attr("height", spec.size)
      .attr("patternUnits", "userSpaceOnUse");

    const stroke = "rgba(0,0,0,0.3)";

    if (spec.type === "hatch") {
      p.attr("patternTransform", `rotate(${spec.angle})`);
      p.append("line")
        .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", spec.size)
        .attr("stroke", stroke).attr("stroke-width", spec.sw);
    } else if (spec.type === "dots") {
      p.append("circle")
        .attr("cx", spec.size / 2).attr("cy", spec.size / 2).attr("r", spec.r)
        .attr("fill", stroke);
    } else if (spec.type === "crosshatch") {
      p.append("line").attr("x1", 0).attr("y1", 0).attr("x2", spec.size).attr("y2", spec.size)
        .attr("stroke", stroke).attr("stroke-width", spec.sw);
      p.append("line").attr("x1", spec.size).attr("y1", 0).attr("x2", 0).attr("y2", spec.size)
        .attr("stroke", stroke).attr("stroke-width", spec.sw);
    } else if (spec.type === "zigzag") {
      const s = spec.size, h = s / 2;
      p.append("polyline")
        .attr("points", `0,${h} ${h / 2},0 ${h},${h} ${h + h / 2},0 ${s},${h}`)
        .attr("fill", "none").attr("stroke", stroke).attr("stroke-width", spec.sw);
      p.append("polyline")
        .attr("points", `0,${s} ${h / 2},${h} ${h},${s} ${h + h / 2},${h} ${s},${s}`)
        .attr("fill", "none").attr("stroke", stroke).attr("stroke-width", spec.sw);
    }
  });
}
createPatterns();

// --- Compute densities ---
const groupData = data.map((d, i) => {
  const stats = computeStats(d.values);
  const bw = silvermanBW(d.values);
  const ticks = d3.ticks(xExtent[0] - 3 * bw, xExtent[1] + 3 * bw, 200);
  const density = kde(gaussian, bw, d.values)(ticks);
  // Clip to observed range
  const clipped = density.filter(p => p[0] >= stats.min && p[0] <= stats.max);
  return { ...d, stats, density: clipped, index: i };
});

const maxDensity = d3.max(groupData, d => d3.max(d.density, p => p[1]));

// --- Draw ---
let cvdActive = false;
const getColor = (i) => cvdActive ? simDeut(tolBright[i]) : tolBright[i];

function draw() {
  g.selectAll(".rain-group").remove();

  const bw = yBand.bandwidth();
  const violinHeight = bw * 0.42;
  const boxY = bw * 0.46;
  const boxH = bw * 0.12;
  const stripY = bw * 0.64;
  const stripH = bw * 0.28;

  const densityScale = d3.scaleLinear([0, maxDensity], [0, violinHeight]);

  const jitterRng = d3.randomLcg(42);

  for (const gd of groupData) {
    const group = g.append("g")
      .attr("class", "rain-group")
      .attr("transform", `translate(0,${yBand(gd.name)})`);

    const color = getColor(gd.index);
    const patId = patternSpecs[gd.index].id;

    // Half-violin (density curve going upward from baseline)
    const area = d3.area()
      .x(d => xScale(d[0]))
      .y0(violinHeight)
      .y1(d => violinHeight - densityScale(d[1]))
      .curve(d3.curveBasis);

    // Color fill
    group.append("path")
      .datum(gd.density)
      .attr("d", area)
      .attr("fill", color)
      .attr("opacity", 0.65);

    // Pattern overlay
    group.append("path")
      .datum(gd.density)
      .attr("d", area)
      .attr("fill", `url(#${patId})`)
      .attr("stroke", d3.color(color).darker(0.5))
      .attr("stroke-width", 0.8);

    // Box plot
    const s = gd.stats;
    // Whisker line
    group.append("line")
      .attr("x1", xScale(s.whiskerLow)).attr("x2", xScale(s.whiskerHigh))
      .attr("y1", boxY + boxH / 2).attr("y2", boxY + boxH / 2)
      .attr("stroke", "#333").attr("stroke-width", 1);

    // Whisker caps
    for (const w of [s.whiskerLow, s.whiskerHigh]) {
      group.append("line")
        .attr("x1", xScale(w)).attr("x2", xScale(w))
        .attr("y1", boxY + 1).attr("y2", boxY + boxH - 1)
        .attr("stroke", "#333").attr("stroke-width", 1);
    }

    // Box
    group.append("rect")
      .attr("x", xScale(s.q1)).attr("width", xScale(s.q3) - xScale(s.q1))
      .attr("y", boxY).attr("height", boxH)
      .attr("fill", "#fff").attr("stroke", "#333").attr("stroke-width", 1.2)
      .attr("rx", 1);

    // Median line
    group.append("line")
      .attr("x1", xScale(s.median)).attr("x2", xScale(s.median))
      .attr("y1", boxY).attr("y2", boxY + boxH)
      .attr("stroke", "#333").attr("stroke-width", 2);

    // Jittered strip
    const jitter = () => (jitterRng() - 0.5) * stripH * 0.85;
    group.selectAll(".strip-dot")
      .data(gd.values)
      .join("circle")
        .attr("cx", d => xScale(d))
        .attr("cy", () => stripY + stripH / 2 + jitter())
        .attr("r", 2.2)
        .attr("fill", color)
        .attr("opacity", 0.6)
        .attr("stroke", d3.color(color).darker(0.8))
        .attr("stroke-width", 0.4);

    // Outliers (larger, open circles)
    group.selectAll(".outlier")
      .data(s.outliers)
      .join("circle")
        .attr("cx", d => xScale(d))
        .attr("cy", boxY + boxH / 2)
        .attr("r", 3)
        .attr("fill", "none")
        .attr("stroke", "#333")
        .attr("stroke-width", 1.2);
  }
}

// --- Axes ---
g.append("g")
  .attr("transform", `translate(0,${innerH})`)
  .call(d3.axisBottom(xScale).ticks(8))
  .call(g => g.select(".domain").remove())
  .selectAll("text").attr("fill", "#555").style("font-size", "11px");

g.append("g")
  .call(d3.axisLeft(yBand).tickSize(0).tickPadding(8))
  .call(g => g.select(".domain").remove())
  .selectAll("text").attr("fill", "#333").style("font-size", "12px").style("font-weight", "500");

// X axis label
g.append("text")
  .attr("x", innerW / 2).attr("y", innerH + 34)
  .attr("text-anchor", "middle").attr("fill", "#555")
  .style("font-size", "12px")
  .text("Measurement Value");

draw();

// --- Legend ---
function drawLegend() {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  const patternLabels = ["Diagonal hatch", "Dots", "Cross-hatch", "Horizontal lines", "Zigzag", "Vertical lines"];
  groups.forEach((name, i) => {
    const item = document.createElement("div");
    item.className = "legend-item";
    const sw = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    sw.setAttribute("width", 18);
    sw.setAttribute("height", 14);
    sw.setAttribute("class", "legend-swatch");
    const rect1 = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect1.setAttribute("width", 18); rect1.setAttribute("height", 14);
    rect1.setAttribute("fill", getColor(i)); rect1.setAttribute("opacity", "0.65");
    sw.appendChild(rect1);
    const rect2 = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect2.setAttribute("width", 18); rect2.setAttribute("height", 14);
    rect2.setAttribute("fill", `url(#${patternSpecs[i].id})`);
    sw.appendChild(rect2);
    item.appendChild(sw);
    item.appendChild(document.createTextNode(`${name} — ${patternLabels[i]}`));
    legend.appendChild(item);
  });
}
drawLegend();

// --- CVD Toggle ---
document.getElementById("cvdToggle").addEventListener("click", function () {
  cvdActive = !cvdActive;
  this.classList.toggle("active", cvdActive);
  draw();
  drawLegend();
});
</script>
</body>
</html>
