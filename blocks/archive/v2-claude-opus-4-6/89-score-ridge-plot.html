<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Score Distributions: Before & After Calibration</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: 'Helvetica Neue', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { overflow: visible; }
  .title { fill: #e0e0e0; font-size: 18px; font-weight: 600; }
  .subtitle { fill: #888; font-size: 12px; }
  .axis text { fill: #999; font-size: 11px; }
  .axis line, .axis path { stroke: #444; }
  .row-label { fill: #ccc; font-size: 11px; font-weight: 500; }
  .legend-label { fill: #bbb; font-size: 11px; }
</style>
</head>
<body>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data: audit scores for 8 dimensions, before and after calibration ---
const rng = d3.randomLcg(42);
const normal = d3.randomNormal.source(rng);
const dimensions = [
  "Data Integrity",
  "Visual Encoding",
  "Interaction",
  "Accessibility",
  "Color Usage",
  "Layout & Labels",
  "Performance",
  "Code Quality"
];

// Before calibration: scores cluster high with little spread (lenient, compressed)
// After calibration: scores spread out, shift slightly lower, reveal true distribution shape
const generateBefore = (dim, i) => {
  const base = 72 + i * 2.5;
  const gen = normal(base, 6 + i * 0.5);
  return d3.range(200).map(() => Math.max(0, Math.min(100, gen())));
};

const generateAfter = (dim, i) => {
  // Calibration spreads scores, reveals bimodality in some dimensions
  const mainGen = normal(58 + i * 3, 12 + i);
  const highGen = normal(85 + i, 5);
  const bimodalWeight = [0, 0.3, 0, 0.25, 0, 0.2, 0.35, 0][i];
  return d3.range(200).map(() => {
    const v = rng() < bimodalWeight ? highGen() : mainGen();
    return Math.max(0, Math.min(100, v));
  });
};

const data = dimensions.map((dim, i) => ({
  dimension: dim,
  before: generateBefore(dim, i),
  after: generateAfter(dim, i)
}));

// --- KDE ---
const gaussian = x => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);

function kde(kernel, bandwidth, values) {
  return points => points.map(x => [
    x,
    d3.mean(values, v => kernel((x - v) / bandwidth)) / bandwidth
  ]);
}

function silvermanBandwidth(values) {
  const sorted = Float64Array.from(values).sort();
  const std = d3.deviation(values);
  const iqr = d3.quantile(sorted, 0.75) - d3.quantile(sorted, 0.25);
  return 0.9 * Math.min(std, iqr / 1.34) * Math.pow(values.length, -0.2);
}

// --- Layout ---
const width = 800, height = 620;
const margin = { top: 60, right: 30, bottom: 40, left: 120 };
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const svg = d3.select("body").append("svg")
  .attr("width", width).attr("height", height)
  .attr("viewBox", `0 0 ${width} ${height}`);

const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// Scales
const xScale = d3.scaleLinear([0, 100], [0, innerW]);
const yBand = d3.scaleBandish
  ? d3.scaleBand(dimensions, [0, innerH]).paddingInner(0.05)
  : d3.scaleBand(dimensions, [0, innerH]).paddingInner(0.05);

const overlap = 0.65;
const ticks = d3.range(0, 101, 0.5);

// Compute densities and find global max
let maxDensity = 0;
const densities = data.map(d => {
  const bwB = silvermanBandwidth(d.before);
  const bwA = silvermanBandwidth(d.after);
  const densityBefore = kde(gaussian, bwB, d.before)(ticks);
  const densityAfter = kde(gaussian, bwA, d.after)(ticks);
  maxDensity = Math.max(maxDensity,
    d3.max(densityBefore, p => p[1]),
    d3.max(densityAfter, p => p[1])
  );
  return { dimension: d.dimension, before: densityBefore, after: densityAfter };
});

const ridgeHeight = yBand.step() * (1 + overlap);
const densityY = d3.scaleLinear([0, maxDensity], [0, ridgeHeight]);

// Colors
const colorBefore = "#ff6b6b";
const colorAfter = "#4ecdc4";
const fillBefore = "rgba(255,107,107,0.35)";
const fillAfter = "rgba(78,205,196,0.35)";

// Area generators
const areaBefore = d3.area()
  .x(d => xScale(d[0]))
  .y0(0)
  .y1(d => -densityY(d[1]))
  .curve(d3.curveBasis);

const areaAfter = d3.area()
  .x(d => xScale(d[0]))
  .y0(0)
  .y1(d => -densityY(d[1]))
  .curve(d3.curveBasis);

// Draw ridges — bottom-to-top so lower rows are in front
const rows = g.selectAll(".ridge")
  .data(densities.slice().reverse())
  .join("g")
    .attr("class", "ridge")
    .attr("transform", d => `translate(0,${yBand(d.dimension) + yBand.bandwidth()})`);

// Before (red) — behind
rows.append("path")
  .attr("d", d => areaBefore(d.before))
  .attr("fill", fillBefore)
  .attr("stroke", colorBefore)
  .attr("stroke-width", 1.5)
  .attr("opacity", 0);

// After (teal) — in front
rows.append("path")
  .attr("d", d => areaAfter(d.after))
  .attr("fill", fillAfter)
  .attr("stroke", colorAfter)
  .attr("stroke-width", 1.5)
  .attr("opacity", 0);

// Animate in with stagger
rows.selectAll("path")
  .transition()
  .duration(800)
  .delay((d, i, nodes) => {
    const rowIdx = densities.length - 1 - Math.floor(Array.from(nodes).indexOf(nodes[i]) / 1);
    const parentIdx = [...nodes[i].parentNode.parentNode.children].indexOf(nodes[i].parentNode);
    return parentIdx * 80 + i * 200;
  })
  .attr("opacity", 1);

// X axis
g.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${innerH})`)
  .call(d3.axisBottom(xScale).ticks(10).tickFormat(d => d))
  .call(g => g.select(".domain").remove());

// X axis label
g.append("text")
  .attr("x", innerW / 2).attr("y", innerH + 35)
  .attr("text-anchor", "middle")
  .attr("fill", "#888").attr("font-size", 12)
  .text("Score");

// Row labels
g.selectAll(".row-label")
  .data(dimensions)
  .join("text")
    .attr("class", "row-label")
    .attr("x", -12)
    .attr("y", d => yBand(d) + yBand.bandwidth() - 2)
    .attr("text-anchor", "end")
    .text(d => d);

// Title
svg.append("text")
  .attr("class", "title")
  .attr("x", margin.left).attr("y", 28)
  .text("Score Distributions: Before & After Calibration");

svg.append("text")
  .attr("class", "subtitle")
  .attr("x", margin.left).attr("y", 46)
  .text("Calibration spreads compressed scores, revealing true quality variation");

// Legend
const legend = svg.append("g").attr("transform", `translate(${width - 220}, 20)`);

[[colorBefore, fillBefore, "Before calibration"], [colorAfter, fillAfter, "After calibration"]].forEach(([stroke, fill, label], i) => {
  const lg = legend.append("g").attr("transform", `translate(0,${i * 20})`);
  lg.append("line").attr("x1", 0).attr("x2", 24).attr("y1", 6).attr("y2", 6)
    .attr("stroke", stroke).attr("stroke-width", 2);
  lg.append("rect").attr("x", 4).attr("y", 0).attr("width", 16).attr("height", 12)
    .attr("fill", fill).attr("stroke", "none").attr("rx", 2);
  lg.append("text").attr("class", "legend-label")
    .attr("x", 30).attr("y", 10).text(label);
});

// Median markers
const medianG = g.selectAll(".median-group")
  .data(data)
  .join("g")
    .attr("class", "median-group")
    .attr("transform", d => `translate(0,${yBand(d.dimension) + yBand.bandwidth()})`);

medianG.each(function(d) {
  const grp = d3.select(this);
  const medBefore = d3.median(d.before);
  const medAfter = d3.median(d.after);

  // Small tick marks for medians
  grp.append("line")
    .attr("x1", xScale(medBefore)).attr("x2", xScale(medBefore))
    .attr("y1", 1).attr("y2", 5)
    .attr("stroke", colorBefore).attr("stroke-width", 2)
    .attr("opacity", 0)
    .transition().delay(1200).duration(400).attr("opacity", 0.8);

  grp.append("line")
    .attr("x1", xScale(medAfter)).attr("x2", xScale(medAfter))
    .attr("y1", 1).attr("y2", 5)
    .attr("stroke", colorAfter).attr("stroke-width", 2)
    .attr("opacity", 0)
    .transition().delay(1400).duration(400).attr("opacity", 0.8);
});
</script>
</body>
</html>
