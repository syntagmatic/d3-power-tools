<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grouped Bar Chart — Color + Pattern Dual Encoding</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f8f8f8; color: #222;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 20px; }
  .panels { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
  .panel-label {
    text-anchor: middle; font-size: 13px; font-weight: 600; fill: #444;
  }
  .axis text { font-size: 11px; fill: #555; }
  .axis path, .axis line { stroke: #ccc; }
  .legend-label { font-size: 11px; fill: #444; }
</style>
</head>
<body>
<h1>Quarterly Revenue by Product Line</h1>
<p class="subtitle">Left: normal vision &middot; Right: deuteranopia simulation &middot; Patterns remain distinguishable in both</p>
<div class="panels" id="panels"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data ---
const categories = ["Q1", "Q2", "Q3", "Q4"];
const groups = ["Hardware", "Software", "Services", "Support"];
const data = categories.flatMap(cat => groups.map(g => ({
  category: cat, group: g,
  value: Math.round(40 + Math.random() * 60)
})));

// --- Colors: Tol Bright (CVD-safe) ---
const colors = { Hardware: "#4477AA", Software: "#EE6677", Services: "#228833", Support: "#CCBB44" };

// --- Brettel deuteranopia simulation ---
// Brettel 1997 half-plane matrices for deuteranopia
function srgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
function linearToSrgb(c) {
  return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
}
// Vienot 1999 deuteranopia matrix (simpler, good approximation)
const deutanMatrix = [
  0.29275,  0.70725,  0.00000,
  0.29275,  0.70725,  0.00000,
 -0.02234,  0.02234,  1.00000
];
function simulateDeutan(hex) {
  const c = d3.color(hex);
  const lr = srgbToLinear(c.r / 255), lg = srgbToLinear(c.g / 255), lb = srgbToLinear(c.b / 255);
  const m = deutanMatrix;
  const sr = m[0]*lr + m[1]*lg + m[2]*lb;
  const sg = m[3]*lr + m[4]*lg + m[5]*lb;
  const sb = m[6]*lr + m[7]*lg + m[8]*lb;
  const r = Math.round(Math.max(0, Math.min(1, linearToSrgb(sr))) * 255);
  const g = Math.round(Math.max(0, Math.min(1, linearToSrgb(sg))) * 255);
  const b = Math.round(Math.max(0, Math.min(1, linearToSrgb(sb))) * 255);
  return d3.rgb(r, g, b).formatHex();
}

// --- Pattern definitions ---
function addPatterns(defs, colorMap, prefix) {
  const patternDefs = [
    { group: "Hardware", type: "hatch" },
    { group: "Software", type: "stripe" },
    { group: "Services", type: "stipple" },
    { group: "Support", type: "crosshatch" }
  ];
  for (const { group, type } of patternDefs) {
    const fill = colorMap[group];
    const id = `${prefix}-${type}`;
    const size = 8;

    // Background rect with color
    const p = defs.append("pattern")
      .attr("id", id).attr("width", size).attr("height", size)
      .attr("patternUnits", "userSpaceOnUse");

    p.append("rect").attr("width", size).attr("height", size).attr("fill", fill);

    if (type === "hatch") {
      // Diagonal hatch at 45°
      p.attr("patternTransform", "rotate(45)");
      p.append("line")
        .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
        .attr("stroke", "rgba(0,0,0,0.25)").attr("stroke-width", 2);
    } else if (type === "stripe") {
      // Horizontal stripes
      p.append("line")
        .attr("x1", 0).attr("y1", 2).attr("x2", size).attr("y2", 2)
        .attr("stroke", "rgba(0,0,0,0.25)").attr("stroke-width", 2);
      p.append("line")
        .attr("x1", 0).attr("y1", 6).attr("x2", size).attr("y2", 6)
        .attr("stroke", "rgba(0,0,0,0.25)").attr("stroke-width", 2);
    } else if (type === "stipple") {
      // Dot grid
      p.append("circle").attr("cx", 2).attr("cy", 2).attr("r", 1.2).attr("fill", "rgba(0,0,0,0.22)");
      p.append("circle").attr("cx", 6).attr("cy", 6).attr("r", 1.2).attr("fill", "rgba(0,0,0,0.22)");
    } else if (type === "crosshatch") {
      // Cross-hatch
      p.attr("patternTransform", "rotate(45)");
      p.append("line")
        .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", size)
        .attr("stroke", "rgba(0,0,0,0.2)").attr("stroke-width", 1.5);
      p.append("line")
        .attr("x1", 0).attr("y1", 0).attr("x2", size).attr("y2", 0)
        .attr("stroke", "rgba(0,0,0,0.2)").attr("stroke-width", 1.5);
    }
  }
}

function patternId(prefix, group) {
  const types = { Hardware: "hatch", Software: "stripe", Services: "stipple", Support: "crosshatch" };
  return `${prefix}-${types[group]}`;
}

// --- Chart dimensions ---
const margin = { top: 32, right: 16, bottom: 36, left: 44 };
const panelW = 380, panelH = 300;
const width = panelW - margin.left - margin.right;
const height = panelH - margin.top - margin.bottom;

// --- Scales ---
const x0 = d3.scaleBand().domain(categories).range([0, width]).paddingInner(0.2).paddingOuter(0.1);
const x1 = d3.scaleBand().domain(groups).range([0, x0.bandwidth()]).padding(0.08);
const y = d3.scaleLinear().domain([0, 100]).range([height, 0]).nice();

// --- Render a panel ---
function renderPanel(container, title, colorMap, prefix) {
  const svg = d3.select(container).append("svg")
    .attr("width", panelW).attr("height", panelH + 60)
    .attr("role", "img")
    .attr("aria-label", `Grouped bar chart: ${title}`);

  const defs = svg.append("defs");
  addPatterns(defs, colorMap, prefix);

  // Panel label
  svg.append("text")
    .attr("class", "panel-label")
    .attr("x", panelW / 2).attr("y", 18)
    .text(title);

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // Axes
  g.append("g").attr("class", "axis")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x0).tickSize(0).tickPadding(8))
    .call(g => g.select(".domain").remove());

  g.append("g").attr("class", "axis")
    .call(d3.axisLeft(y).ticks(5).tickFormat(d => `$${d}M`))
    .call(g => g.select(".domain").remove());

  // Bars
  for (const d of data) {
    const bar = g.append("rect")
      .attr("x", x0(d.category) + x1(d.group))
      .attr("y", y(d.value))
      .attr("width", x1.bandwidth())
      .attr("height", height - y(d.value))
      .attr("fill", `url(#${patternId(prefix, d.group)})`)
      .attr("stroke", "#fff").attr("stroke-width", 0.5);
  }

  // Legend below chart
  const legend = svg.append("g")
    .attr("transform", `translate(${margin.left}, ${panelH + 8})`);

  const patternTypes = ["hatch", "stripe", "stipple", "crosshatch"];
  const patternLabels = ["Diagonal hatch", "Horiz. stripes", "Stipple dots", "Cross-hatch"];

  groups.forEach((grp, i) => {
    const lg = legend.append("g").attr("transform", `translate(${i * 92}, 0)`);
    lg.append("rect")
      .attr("width", 14).attr("height", 14).attr("rx", 2)
      .attr("fill", `url(#${patternId(prefix, grp)})`)
      .attr("stroke", "#999").attr("stroke-width", 0.5);
    lg.append("text")
      .attr("class", "legend-label")
      .attr("x", 18).attr("y", 11)
      .text(grp);
  });

  // Pattern-only legend row
  const patLeg = svg.append("g")
    .attr("transform", `translate(${margin.left}, ${panelH + 30})`);
  groups.forEach((grp, i) => {
    const lg = patLeg.append("g").attr("transform", `translate(${i * 92}, 0)`);
    lg.append("text")
      .attr("class", "legend-label")
      .attr("x", 0).attr("y", 10)
      .style("font-size", "9px").style("fill", "#888")
      .text(patternLabels[i]);
  });
}

// --- Build panels ---
const panels = document.getElementById("panels");

const normalDiv = document.createElement("div");
panels.appendChild(normalDiv);
renderPanel(normalDiv, "Normal Vision", colors, "norm");

const deutanColors = {};
for (const [k, v] of Object.entries(colors)) deutanColors[k] = simulateDeutan(v);

const deutanDiv = document.createElement("div");
panels.appendChild(deutanDiv);
renderPanel(deutanDiv, "Deuteranopia Simulation", deutanColors, "deut");

</script>
</body>
</html>
