<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hex-Binned US Population Centers</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 1rem; }
  h1 { font-size: 1.2rem; font-weight: 500; margin-bottom: 0.5rem; color: #ccc; }
  #container { position: relative; }
  canvas, svg { position: absolute; top: 0; left: 0; }
  svg { pointer-events: none; }
  .controls { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem; font-size: 0.85rem; }
  .controls label { color: #aaa; }
  .controls input[type="range"] { width: 180px; accent-color: #5ac8c8; }
  .controls span { min-width: 3ch; text-align: right; color: #5ac8c8; font-variant-numeric: tabular-nums; }
  .legend { position: absolute; bottom: 12px; right: 12px; background: rgba(26,26,46,0.85); border: 1px solid #333; border-radius: 4px; padding: 8px 10px; font-size: 0.75rem; pointer-events: none; }
  .legend-title { margin-bottom: 4px; color: #aaa; }
  .legend-bar { display: flex; height: 12px; border-radius: 2px; overflow: hidden; }
  .legend-labels { display: flex; justify-content: space-between; margin-top: 2px; color: #888; font-size: 0.65rem; }
</style>
</head>
<body>
<h1>Hex-Binned US Map — 20,000 Synthetic GPS Points</h1>
<div class="controls">
  <label for="radius-slider">Hex radius:</label>
  <input type="range" id="radius-slider" min="4" max="16" step="1" value="10">
  <span id="radius-value">10</span><span style="color:#aaa">px</span>
</div>
<div id="container"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";
import { hexbin as d3Hexbin } from "https://cdn.jsdelivr.net/npm/d3-hexbin@0.2/+esm";

const width = 960, height = 600;
const dpr = devicePixelRatio;

// --- Container ---
const container = d3.select("#container")
  .style("width", `${width}px`).style("height", `${height}px`);

// --- Canvas layer (hexagons) ---
const canvas = container.append("canvas")
  .attr("width", width * dpr).attr("height", height * dpr)
  .style("width", `${width}px`).style("height", `${height}px`)
  .node();
const ctx = canvas.getContext("2d");
ctx.scale(dpr, dpr);

// --- SVG layer (state outlines + legend) ---
const svg = container.append("svg")
  .attr("width", width).attr("height", height)
  .attr("viewBox", `0 0 ${width} ${height}`);

// --- Load US topology ---
const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
const states = topojson.feature(us, us.objects.states).features;
const stateMesh = topojson.mesh(us, us.objects.states, (a, b) => a !== b);
const nation = topojson.merge(us, us.objects.states.geometries);

const projection = d3.geoAlbersUsa().fitSize([width - 20, height - 20], nation).translate([width / 2, height / 2]);
const path = d3.geoPath(projection);

// --- Generate 20,000 synthetic points around population centers ---
// Major US cities [lon, lat, relative weight]
const centers = [
  [-74.006, 40.713, 12],   // New York
  [-118.244, 34.052, 10],  // Los Angeles
  [-87.630, 41.878, 8],    // Chicago
  [-95.370, 29.760, 7],    // Houston
  [-112.074, 33.449, 5],   // Phoenix
  [-75.165, 39.953, 5],    // Philadelphia
  [-98.494, 29.425, 5],    // San Antonio
  [-117.161, 32.716, 5],   // San Diego
  [-96.797, 32.777, 5],    // Dallas
  [-122.419, 37.775, 6],   // San Francisco
  [-77.037, 38.907, 5],    // Washington DC
  [-80.191, 25.762, 5],    // Miami
  [-84.388, 33.749, 5],    // Atlanta
  [-71.059, 42.360, 5],    // Boston
  [-122.332, 47.606, 4],   // Seattle
  [-104.990, 39.739, 4],   // Denver
  [-83.046, 42.331, 4],    // Detroit
  [-90.199, 38.627, 3],    // St. Louis
  [-86.158, 39.769, 3],    // Indianapolis
  [-81.695, 41.500, 3],    // Cleveland
  [-93.265, 44.978, 3],    // Minneapolis
  [-85.764, 38.253, 3],    // Louisville
  [-86.784, 36.163, 3],    // Nashville
  [-97.517, 35.467, 3],    // Oklahoma City
  [-106.651, 35.084, 2],   // Albuquerque
  [-111.891, 40.761, 3],   // Salt Lake City
  [-82.999, 39.961, 3],    // Columbus OH
  [-80.843, 35.227, 3],    // Charlotte
  [-90.075, 29.951, 3],    // New Orleans
  [-94.580, 39.099, 3],    // Kansas City
  [-121.469, 38.556, 2],   // Sacramento
  [-123.087, 44.052, 2],   // Oregon (Eugene area)
  [-73.757, 42.653, 2],    // Albany NY
  [-76.612, 39.290, 3],    // Baltimore
  [-72.682, 41.764, 2],    // Hartford
  [-79.995, 40.441, 4],    // Pittsburgh
  [-78.639, 35.780, 3],    // Raleigh
  [-81.656, 30.332, 2],    // Jacksonville FL
  [-82.459, 27.948, 3],    // Tampa
  [-115.139, 36.170, 3],   // Las Vegas
];

const totalWeight = d3.sum(centers, d => d[2]);
const rng = d3.randomLcg(42);
const normal = d3.randomNormal.source(rng);

const points = [];
for (const [lon, lat, weight] of centers) {
  const count = Math.round(20000 * weight / totalWeight);
  const lonSpread = normal(lon, 1.5);
  const latSpread = normal(lat, 0.8);
  for (let i = 0; i < count; i++) {
    const p = projection([lonSpread(), latSpread()]);
    if (p) points.push({ x: p[0], y: p[1] });
  }
}

// --- Color scale ---
const colorScheme = [
  "#0d0887", "#3b049a", "#7201a8", "#a52c60",
  "#d44842", "#ed7953", "#f0a43a", "#f0f921"
];
const colorInterpolator = d3.interpolateRgbBasis(colorScheme);

// --- Render function ---
let currentRadius = 10;

function render(radius) {
  currentRadius = radius;
  const hexbin = d3Hexbin()
    .x(d => d.x).y(d => d.y)
    .radius(radius)
    .extent([[0, 0], [width, height]]);

  const bins = hexbin(points);
  const maxCount = d3.max(bins, d => d.length);
  const color = d3.scaleSequential([0, maxCount], colorInterpolator);

  // Clear canvas
  ctx.clearRect(0, 0, width, height);

  // Draw hexagons on canvas
  const hexPath = new Path2D(hexbin.hexagon());
  for (const bin of bins) {
    ctx.save();
    ctx.translate(bin.x, bin.y);
    ctx.fillStyle = color(bin.length);
    ctx.globalAlpha = 0.85;
    ctx.fill(hexPath);
    ctx.restore();
  }

  // Draw state outlines on canvas (over hexagons)
  ctx.globalAlpha = 1;
  ctx.beginPath();
  d3.geoPath(projection, ctx)(stateMesh);
  ctx.strokeStyle = "rgba(200,200,220,0.4)";
  ctx.lineWidth = 0.75;
  ctx.stroke();

  // Nation outline
  ctx.beginPath();
  d3.geoPath(projection, ctx)(nation);
  ctx.strokeStyle = "rgba(200,200,220,0.6)";
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Update legend
  updateLegend(maxCount);
}

// --- Legend ---
function updateLegend(maxCount) {
  svg.selectAll(".legend-group").remove();
  const g = svg.append("g").attr("class", "legend-group")
    .attr("transform", `translate(${width - 170}, ${height - 60})`);

  g.append("rect").attr("x", -8).attr("y", -22).attr("width", 160).attr("height", 56)
    .attr("rx", 4).attr("fill", "rgba(26,26,46,0.85)").attr("stroke", "#333");

  g.append("text").attr("y", -8).attr("fill", "#aaa").attr("font-size", "0.7rem").text("Points per hex");

  const barWidth = 140, barHeight = 12;
  const steps = 50;
  const stepW = barWidth / steps;
  for (let i = 0; i < steps; i++) {
    g.append("rect")
      .attr("x", i * stepW).attr("y", 0)
      .attr("width", stepW + 0.5).attr("height", barHeight)
      .attr("fill", colorInterpolator(i / (steps - 1)));
  }

  g.append("text").attr("y", barHeight + 12).attr("fill", "#888").attr("font-size", "0.6rem").text("0");
  g.append("text").attr("x", barWidth).attr("y", barHeight + 12)
    .attr("fill", "#888").attr("font-size", "0.6rem").attr("text-anchor", "end").text(maxCount);
}

// --- Slider ---
const slider = document.getElementById("radius-slider");
const valueLabel = document.getElementById("radius-value");
slider.addEventListener("input", () => {
  const r = +slider.value;
  valueLabel.textContent = r;
  render(r);
});

// --- Initial render ---
render(10);
</script>
</body>
</html>
