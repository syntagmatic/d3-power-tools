<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape Morphing Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .grid { display: grid; grid-template-columns: repeat(3, 280px); grid-template-rows: repeat(3, 280px); gap: 12px; padding: 20px; }
  .cell { background: #14141f; border-radius: 10px; overflow: hidden; position: relative; }
  .cell svg { display: block; }
  .cell-label { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 11px; color: rgba(255,255,255,0.45); letter-spacing: 0.5px; pointer-events: none; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const W = 280, H = 280, M = 30;

const cells = [
  { id: "circle-rect",       label: "Circle ↔ Rect",          delay: 0 },
  { id: "bar-pie",           label: "Bar ↔ Pie",              delay: 400 },
  { id: "star-circle",       label: "Star ↔ Circle",          delay: 800 },
  { id: "line-area",         label: "Line ↔ Area",            delay: 200 },
  { id: "scatter-bar",       label: "Scatter ↔ Bar",          delay: 600 },
  { id: "horiz-vert",        label: "Horizontal ↔ Vertical",  delay: 1000 },
  { id: "grouped-stacked",   label: "Grouped ↔ Stacked",      delay: 300 },
  { id: "treemap-pack",      label: "Treemap ↔ Pack",         delay: 700 },
  { id: "donut-sunburst",    label: "Donut ↔ Sunburst",       delay: 1100 },
];

const grid = d3.select("#grid");

cells.forEach(c => {
  const div = grid.append("div").attr("class", "cell").attr("id", c.id);
  div.append("svg").attr("width", W).attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
  div.append("div").attr("class", "cell-label").text(c.label);
});

const dur = 1800, pause = 600;

// ── 1. Circle ↔ Rect ──
{
  const svg = d3.select("#circle-rect svg");
  const cx = W / 2, cy = H / 2, size = 100;
  const rect = svg.append("rect")
    .attr("x", cx - size / 2).attr("y", cy - size / 2)
    .attr("width", size).attr("height", size)
    .attr("rx", size / 2).attr("ry", size / 2)
    .attr("fill", "#6366f1");

  let toRect = true;
  const loop = () => {
    rect.transition().duration(dur).ease(d3.easeCubicInOut)
      .attr("rx", toRect ? 4 : size / 2)
      .attr("ry", toRect ? 4 : size / 2)
      .on("end", () => { toRect = !toRect; setTimeout(loop, pause); });
  };
  setTimeout(loop, cells[0].delay);
}

// ── 2. Bar ↔ Pie ──
{
  const svg = d3.select("#bar-pie svg");
  const data = [3, 5, 2, 4, 6, 3];
  const n = data.length;
  const cx = W / 2, cy = H / 2, R = 90;
  const arc = d3.arc();
  const color = d3.scaleOrdinal(d3.schemeTableau10);
  const total = d3.sum(data);

  const barParams = data.map((d, i) => {
    const angle = (2 * Math.PI) / n;
    const maxVal = d3.max(data);
    return { startAngle: i * angle, endAngle: (i + 1) * angle - 0.02, innerRadius: 0, outerRadius: (d / maxVal) * R };
  });

  const pieGen = d3.pie().sort(null).value(d => d);
  const pieData = pieGen(data);
  const pieParams = pieData.map(d => ({ startAngle: d.startAngle, endAngle: d.endAngle, innerRadius: 0, outerRadius: R }));

  const g = svg.append("g").attr("transform", `translate(${cx},${cy})`);
  const paths = g.selectAll("path").data(data).join("path")
    .attr("fill", (_, i) => color(i));

  paths.each(function (_, i) { this.__arcParams = { ...barParams[i] }; });
  paths.attr("d", function () { return arc(this.__arcParams); });

  let toPie = true;
  const loop = () => {
    paths.transition().duration(dur).ease(d3.easeCubicInOut)
      .attrTween("d", function (_, i) {
        const prev = { ...this.__arcParams };
        const next = toPie ? pieParams[i] : barParams[i];
        const interp = d3.interpolate(prev, next);
        return t => {
          const p = interp(t);
          this.__arcParams = p;
          return arc(p);
        };
      })
      .on("end", (_, i) => { if (i === n - 1) { toPie = !toPie; setTimeout(loop, pause); } });
  };
  setTimeout(loop, cells[1].delay);
}

// ── 3. Star ↔ Circle ──
{
  const svg = d3.select("#star-circle svg");
  const cx = W / 2, cy = H / 2, R = 80, r = 35, N = 128;

  const starPoints = (outerR, innerR, tips = 5) => {
    const pts = [];
    for (let i = 0; i < tips * 2; i++) {
      const angle = (Math.PI / tips) * i - Math.PI / 2;
      const rad = i % 2 === 0 ? outerR : innerR;
      pts.push([cx + rad * Math.cos(angle), cy + rad * Math.sin(angle)]);
    }
    return pts;
  };

  const resample = (pts, n) => {
    const line = d3.line()(pts) + "Z";
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", line);
    const len = path.getTotalLength();
    return d3.range(n).map(i => {
      const p = path.getPointAtLength((i / n) * len);
      return [p.x, p.y];
    });
  };

  const circlePoints = d3.range(N).map(i => {
    const a = (2 * Math.PI * i) / N - Math.PI / 2;
    return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
  });

  const starPts = resample(starPoints(R, r), N);
  const circlePts = circlePoints;

  const pathEl = svg.append("path")
    .attr("fill", "#f59e0b")
    .attr("d", d3.line()(starPts) + "Z");

  let toCircle = true;
  const loop = () => {
    const from = toCircle ? starPts : circlePts;
    const to = toCircle ? circlePts : starPts;
    pathEl.transition().duration(dur).ease(d3.easeCubicInOut)
      .attrTween("d", () => {
        const interp = from.map((p, i) => d3.interpolate(p, to[i]));
        return t => d3.line()(interp.map(fn => fn(t))) + "Z";
      })
      .on("end", () => { toCircle = !toCircle; setTimeout(loop, pause); });
  };
  setTimeout(loop, cells[2].delay);
}

// ── 4. Line ↔ Area ──
{
  const svg = d3.select("#line-area svg");
  const data = d3.range(20).map(i => ({ x: i, y: 30 + Math.random() * 60 }));
  const x = d3.scaleLinear().domain([0, 19]).range([M, W - M]);
  const y = d3.scaleLinear().domain([0, 100]).range([H - M, M]);

  const lineGen = d3.line().x(d => x(d.x)).y(d => y(d.y)).curve(d3.curveCatmullRom);
  const areaGen = d3.area().x(d => x(d.x)).y0(y(0)).y1(d => y(d.y)).curve(d3.curveCatmullRom);

  const area = svg.append("path").datum(data)
    .attr("fill", "rgba(16,185,129,0.3)").attr("d", areaGen).attr("opacity", 0);
  const line = svg.append("path").datum(data)
    .attr("fill", "none").attr("stroke", "#10b981").attr("stroke-width", 2.5).attr("d", lineGen);

  // Axes
  svg.append("g").attr("transform", `translate(0,${H - M})`).call(d3.axisBottom(x).ticks(5)).selectAll("text,line,path").attr("stroke", "#444").attr("fill", "#666");
  svg.append("g").attr("transform", `translate(${M},0)`).call(d3.axisLeft(y).ticks(5)).selectAll("text,line,path").attr("stroke", "#444").attr("fill", "#666");

  let toArea = true;
  const loop = () => {
    area.transition().duration(dur).ease(d3.easeCubicInOut).attr("opacity", toArea ? 1 : 0);
    line.transition().duration(dur).ease(d3.easeCubicInOut)
      .attr("stroke-width", toArea ? 1.5 : 2.5)
      .on("end", () => { toArea = !toArea; setTimeout(loop, pause); });
  };
  setTimeout(loop, cells[3].delay);
}

// ── 5. Scatter ↔ Bar ──
{
  const svg = d3.select("#scatter-bar svg");
  const n = 8;
  const data = d3.range(n).map(i => ({ x: i, y: 20 + Math.random() * 70 }));
  const x = d3.scaleBand().domain(d3.range(n)).range([M, W - M]).padding(0.3);
  const y = d3.scaleLinear().domain([0, 100]).range([H - M, M]);
  const color = d3.scaleOrdinal(d3.schemePastel1);

  const rects = svg.selectAll("rect").data(data).join("rect")
    .attr("fill", (_, i) => color(i))
    .attr("rx", x.bandwidth() / 2)
    .attr("x", d => x(d.x) + x.bandwidth() / 2 - 5)
    .attr("y", d => y(d.y) - 5)
    .attr("width", 10).attr("height", 10);

  let toBar = true;
  const loop = () => {
    rects.transition().duration(dur).ease(d3.easeCubicInOut)
      .attr("x", d => toBar ? x(d.x) : x(d.x) + x.bandwidth() / 2 - 5)
      .attr("y", d => toBar ? y(d.y) : y(d.y) - 5)
      .attr("width", toBar ? x.bandwidth() : 10)
      .attr("height", d => toBar ? (H - M) - y(d.y) : 10)
      .attr("rx", toBar ? 3 : 5)
      .on("end", (_, i) => { if (i === n - 1) { toBar = !toBar; setTimeout(loop, pause); } });
  };
  setTimeout(loop, cells[4].delay);
}

// ── 6. Horizontal ↔ Vertical bars ──
{
  const svg = d3.select("#horiz-vert svg");
  const n = 6;
  const data = d3.range(n).map(i => ({ cat: i, val: 20 + Math.random() * 70 }));
  const xB = d3.scaleBand().domain(d3.range(n)).range([M, W - M]).padding(0.25);
  const yB = d3.scaleBand().domain(d3.range(n)).range([M, H - M]).padding(0.25);
  const xL = d3.scaleLinear().domain([0, 100]).range([M, W - M]);
  const yL = d3.scaleLinear().domain([0, 100]).range([H - M, M]);
  const color = d3.scaleOrdinal(d3.schemeSet2);

  const bars = svg.selectAll("rect").data(data).join("rect")
    .attr("fill", (_, i) => color(i))
    .attr("rx", 3)
    .attr("x", d => xB(d.cat))
    .attr("y", d => yL(d.val))
    .attr("width", xB.bandwidth())
    .attr("height", d => (H - M) - yL(d.val));

  let toHoriz = true;
  const loop = () => {
    bars.transition().duration(dur).ease(d3.easeCubicInOut)
      .attr("x",      d => toHoriz ? M : xB(d.cat))
      .attr("y",      d => toHoriz ? yB(d.cat) : yL(d.val))
      .attr("width",  d => toHoriz ? xL(d.val) - M : xB.bandwidth())
      .attr("height", d => toHoriz ? yB.bandwidth() : (H - M) - yL(d.val))
      .on("end", (_, i) => { if (i === n - 1) { toHoriz = !toHoriz; setTimeout(loop, pause); } });
  };
  setTimeout(loop, cells[5].delay);
}

// ── 7. Grouped ↔ Stacked ──
{
  const svg = d3.select("#grouped-stacked svg");
  const categories = 4, series = 3;
  const raw = d3.range(categories).map(c =>
    d3.range(series).map(s => ({ cat: c, ser: s, val: 10 + Math.random() * 30 }))
  );
  const flat = raw.flat();
  const x0 = d3.scaleBand().domain(d3.range(categories)).range([M, W - M]).padding(0.2);
  const x1 = d3.scaleBand().domain(d3.range(series)).range([0, x0.bandwidth()]).padding(0.05);
  const yMax = d3.max(raw, g => d3.sum(g, d => d.val));
  const y = d3.scaleLinear().domain([0, yMax]).range([H - M, M]);
  const color = d3.scaleOrdinal(["#818cf8", "#f472b6", "#34d399"]);

  // Precompute stacked positions
  raw.forEach(g => {
    let cum = 0;
    g.forEach(d => { d.y0s = cum; d.y1s = cum + d.val; cum += d.val; });
  });

  const bars = svg.selectAll("rect").data(flat).join("rect")
    .attr("fill", d => color(d.ser))
    .attr("rx", 2)
    .attr("x", d => x0(d.cat) + x1(d.ser))
    .attr("y", d => y(d.val))
    .attr("width", x1.bandwidth())
    .attr("height", d => (H - M) - y(d.val));

  let toStacked = true;
  const loop = () => {
    bars.transition().duration(dur).ease(d3.easeCubicInOut)
      .attr("x", d => toStacked ? x0(d.cat) : x0(d.cat) + x1(d.ser))
      .attr("y", d => toStacked ? y(d.y1s) : y(d.val))
      .attr("width", toStacked ? x0.bandwidth() : x1.bandwidth())
      .attr("height", d => toStacked ? y(d.y0s) - y(d.y1s) : (H - M) - y(d.val))
      .on("end", (_, i) => { if (i === flat.length - 1) { toStacked = !toStacked; setTimeout(loop, pause); } });
  };
  setTimeout(loop, cells[6].delay);
}

// ── 8. Treemap ↔ Circle Pack ──
{
  const svg = d3.select("#treemap-pack svg");
  const treeData = {
    name: "root",
    children: d3.range(12).map(i => ({ name: `n${i}`, value: 5 + Math.random() * 40 }))
  };
  const root = d3.hierarchy(treeData).sum(d => d.value);
  const color = d3.scaleOrdinal(d3.schemeTableau10);

  // Treemap layout
  const treemap = d3.treemap().size([W - 2 * 20, H - 2 * 20]).padding(2)(root.copy());
  const treemapLeaves = treemap.leaves();

  // Pack layout
  const pack = d3.pack().size([W - 2 * 20, H - 2 * 20]).padding(3)(root.copy());
  const packLeaves = pack.leaves();

  const g = svg.append("g").attr("transform", "translate(20,20)");

  const rects = g.selectAll("rect").data(treemapLeaves).join("rect")
    .attr("fill", (_, i) => color(i))
    .attr("opacity", 0.85)
    .attr("rx", 2)
    .attr("x", d => d.x0)
    .attr("y", d => d.y0)
    .attr("width", d => d.x1 - d.x0)
    .attr("height", d => d.y1 - d.y0);

  let toPack = true;
  const loop = () => {
    rects.transition().duration(dur).ease(d3.easeCubicInOut)
      .attr("x", (_, i) => toPack ? packLeaves[i].x - packLeaves[i].r : treemapLeaves[i].x0)
      .attr("y", (_, i) => toPack ? packLeaves[i].y - packLeaves[i].r : treemapLeaves[i].y0)
      .attr("width", (_, i) => toPack ? packLeaves[i].r * 2 : treemapLeaves[i].x1 - treemapLeaves[i].x0)
      .attr("height", (_, i) => toPack ? packLeaves[i].r * 2 : treemapLeaves[i].y1 - treemapLeaves[i].y0)
      .attr("rx", (_, i) => toPack ? packLeaves[i].r : 2)
      .on("end", (_, i) => { if (i === treemapLeaves.length - 1) { toPack = !toPack; setTimeout(loop, pause); } });
  };
  setTimeout(loop, cells[7].delay);
}

// ── 9. Donut ↔ Sunburst ──
{
  const svg = d3.select("#donut-sunburst svg");
  const cx = W / 2, cy = H / 2;
  const outerR = 100, innerR = 50;
  const data = {
    name: "root",
    children: [
      { name: "A", children: [{ name: "A1", value: 5 }, { name: "A2", value: 3 }] },
      { name: "B", children: [{ name: "B1", value: 4 }, { name: "B2", value: 6 }, { name: "B3", value: 2 }] },
      { name: "C", children: [{ name: "C1", value: 7 }, { name: "C2", value: 2 }] },
      { name: "D", children: [{ name: "D1", value: 3 }, { name: "D2", value: 4 }] },
    ]
  };

  const root = d3.hierarchy(data).sum(d => d.value);
  const partition = d3.partition().size([2 * Math.PI, outerR]);
  partition(root);

  const arc = d3.arc();
  const color = d3.scaleOrdinal(d3.schemeTableau10);
  const nodes = root.descendants().filter(d => d.depth > 0);

  // Donut state: depth-1 nodes get full ring, depth-2 collapsed
  const donutParams = nodes.map(d => {
    if (d.depth === 1) {
      return { startAngle: d.x0, endAngle: d.x1, innerRadius: innerR, outerRadius: outerR };
    }
    // Collapse children into parent ring
    return { startAngle: d.x0, endAngle: d.x1, innerRadius: innerR, outerRadius: innerR };
  });

  // Sunburst state: show hierarchy
  const sunburstParams = nodes.map(d => {
    const innerRing = d.depth === 1 ? 25 : 55;
    const outerRing = d.depth === 1 ? 55 : outerR;
    return { startAngle: d.x0, endAngle: d.x1, innerRadius: innerRing, outerRadius: outerRing };
  });

  const g = svg.append("g").attr("transform", `translate(${cx},${cy})`);
  const paths = g.selectAll("path").data(nodes).join("path")
    .attr("fill", d => d.depth === 1 ? color(d.data.name) : d3.color(color(d.parent.data.name)).brighter(0.6))
    .attr("stroke", "#14141f").attr("stroke-width", 1);

  paths.each(function (_, i) { this.__arcParams = { ...donutParams[i] }; });
  paths.attr("d", function () { return arc(this.__arcParams); });

  let toSunburst = true;
  const loop = () => {
    paths.transition().duration(dur).ease(d3.easeCubicInOut)
      .attrTween("d", function (_, i) {
        const prev = { ...this.__arcParams };
        const next = toSunburst ? sunburstParams[i] : donutParams[i];
        const interp = d3.interpolate(prev, next);
        return t => {
          const p = interp(t);
          this.__arcParams = p;
          return arc(p);
        };
      })
      .on("end", (_, i) => { if (i === nodes.length - 1) { toSunburst = !toSunburst; setTimeout(loop, pause); } });
  };
  setTimeout(loop, cells[8].delay);
}
</script>
</body>
</html>
