<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Similarity Explorer</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; }
  h1 { text-align: center; padding: 16px 0 4px; font-size: 1.3rem; font-weight: 500; color: #c8d6e5; letter-spacing: 0.5px; }
  .subtitle { text-align: center; font-size: 0.8rem; color: #778ca3; margin-bottom: 8px; }
  #parcoords { position: relative; width: 100%; height: 320px; }
  #parcoords canvas, #parcoords svg { position: absolute; top: 0; left: 0; }
  #parcoords canvas { pointer-events: none; }
  #map-container { width: 100%; display: flex; justify-content: center; }
  #map-container svg { display: block; }
  .axis text { font-size: 11px; fill: #aaa; }
  .axis line, .axis path { stroke: #555; }
  .axis-label { font-size: 11px; font-weight: 600; fill: #c8d6e5; text-anchor: middle; }
  .brush .selection { fill: rgba(100, 180, 255, 0.25); stroke: #64b4ff; stroke-width: 1.5px; }
  .city-label { font-size: 9px; fill: #ccc; pointer-events: none; }
  .legend { font-size: 11px; fill: #999; }
</style>
</head>
<body>
<h1>City Similarity Explorer</h1>
<p class="subtitle">Brush any axis to filter — selected cities highlight on the map</p>
<div id="parcoords"></div>
<div id="map-container"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

// ── Synthetic city data ──────────────────────────────────────────────
const cities = [
  { name: "Tokyo", lon: 139.69, lat: 35.69, population: 37400, density: 6158, elevation: 40, temp: 15.4, rainfall: 1530, cost: 86 },
  { name: "Delhi", lon: 77.10, lat: 28.70, population: 32900, density: 11312, elevation: 216, temp: 25.0, rainfall: 797, cost: 33 },
  { name: "Shanghai", lon: 121.47, lat: 31.23, population: 28500, density: 3826, elevation: 4, temp: 16.1, rainfall: 1166, cost: 55 },
  { name: "São Paulo", lon: -46.63, lat: -23.55, population: 22400, density: 7398, elevation: 760, temp: 19.3, rainfall: 1454, cost: 42 },
  { name: "Mexico City", lon: -99.13, lat: 19.43, population: 21800, density: 5966, elevation: 2240, temp: 16.6, rainfall: 846, cost: 38 },
  { name: "Cairo", lon: 31.24, lat: 30.04, population: 21300, density: 19376, elevation: 75, temp: 21.7, rainfall: 25, cost: 30 },
  { name: "Mumbai", lon: 72.88, lat: 19.08, population: 21200, density: 20634, elevation: 14, temp: 27.2, rainfall: 2422, cost: 36 },
  { name: "Beijing", lon: 116.41, lat: 39.90, population: 20900, density: 1313, elevation: 43, temp: 12.9, rainfall: 578, cost: 52 },
  { name: "Dhaka", lon: 90.41, lat: 23.81, population: 22900, density: 23234, elevation: 8, temp: 25.8, rainfall: 2123, cost: 28 },
  { name: "Osaka", lon: 135.50, lat: 34.69, population: 19200, density: 4631, elevation: 12, temp: 16.9, rainfall: 1306, cost: 78 },
  { name: "New York", lon: -74.01, lat: 40.71, population: 18800, density: 10194, elevation: 10, temp: 12.3, rainfall: 1268, cost: 100 },
  { name: "Karachi", lon: 67.01, lat: 24.86, population: 16800, density: 24000, elevation: 10, temp: 26.0, rainfall: 234, cost: 26 },
  { name: "Buenos Aires", lon: -58.38, lat: -34.60, population: 15400, density: 5142, elevation: 25, temp: 17.9, rainfall: 1242, cost: 40 },
  { name: "Istanbul", lon: 28.98, lat: 41.01, population: 15600, density: 2965, elevation: 40, temp: 14.4, rainfall: 677, cost: 37 },
  { name: "Lagos", lon: 3.39, lat: 6.52, population: 15300, density: 6871, elevation: 41, temp: 27.0, rainfall: 1693, cost: 39 },
  { name: "Manila", lon: 120.98, lat: 14.60, population: 14400, density: 42857, elevation: 16, temp: 28.3, rainfall: 1877, cost: 35 },
  { name: "Moscow", lon: 37.62, lat: 55.76, population: 12600, density: 4834, elevation: 156, temp: 5.8, rainfall: 707, cost: 55 },
  { name: "London", lon: -0.12, lat: 51.51, population: 9500, density: 5598, elevation: 11, temp: 11.3, rainfall: 602, cost: 90 },
  { name: "Paris", lon: 2.35, lat: 48.86, population: 11000, density: 20545, elevation: 35, temp: 12.3, rainfall: 637, cost: 88 },
  { name: "Lima", lon: -77.03, lat: -12.05, population: 10800, density: 3200, elevation: 154, temp: 18.7, rainfall: 10, cost: 35 },
  { name: "Bangkok", lon: 100.50, lat: 13.76, population: 10700, density: 3600, elevation: 2, temp: 28.6, rainfall: 1648, cost: 40 },
  { name: "Seoul", lon: 126.98, lat: 37.57, population: 9900, density: 15872, elevation: 38, temp: 12.5, rainfall: 1394, cost: 72 },
  { name: "Nairobi", lon: 36.82, lat: -1.29, population: 4900, density: 4509, elevation: 1795, temp: 17.8, rainfall: 869, cost: 37 },
  { name: "Johannesburg", lon: 28.05, lat: -26.20, population: 6000, density: 2696, elevation: 1753, temp: 15.5, rainfall: 713, cost: 42 },
  { name: "Sydney", lon: 151.21, lat: -33.87, population: 5300, density: 2037, elevation: 58, temp: 18.4, rainfall: 1213, cost: 82 },
  { name: "Singapore", lon: 103.82, lat: 1.35, population: 5900, density: 7953, elevation: 15, temp: 27.0, rainfall: 2340, cost: 85 },
  { name: "Berlin", lon: 13.41, lat: 52.52, population: 3700, density: 4090, elevation: 34, temp: 10.3, rainfall: 570, cost: 68 },
  { name: "Madrid", lon: -3.70, lat: 40.42, population: 6700, density: 5337, elevation: 657, temp: 14.5, rainfall: 436, cost: 62 },
  { name: "Toronto", lon: -79.38, lat: 43.65, population: 6200, density: 4334, elevation: 76, temp: 9.4, rainfall: 831, cost: 72 },
  { name: "Santiago", lon: -70.67, lat: -33.45, population: 6800, density: 8470, elevation: 520, temp: 14.4, rainfall: 312, cost: 44 },
  { name: "Dubai", lon: 55.30, lat: 25.20, population: 3600, density: 808, elevation: 5, temp: 27.2, rainfall: 95, cost: 75 },
  { name: "Bogotá", lon: -74.07, lat: 4.71, population: 11400, density: 7400, elevation: 2640, temp: 13.5, rainfall: 1020, cost: 32 },
  { name: "Addis Ababa", lon: 38.75, lat: 9.02, population: 5200, density: 6700, elevation: 2355, temp: 16.3, rainfall: 1143, cost: 30 },
  { name: "Denver", lon: -104.99, lat: 39.74, population: 2900, density: 1698, elevation: 1609, temp: 10.4, rainfall: 396, cost: 65 },
  { name: "Reykjavík", lon: -21.94, lat: 64.15, population: 230, density: 1100, elevation: 14, temp: 4.7, rainfall: 799, cost: 92 },
  { name: "La Paz", lon: -68.15, lat: -16.50, population: 2000, density: 4800, elevation: 3640, temp: 7.7, rainfall: 575, cost: 28 },
  { name: "Kathmandu", lon: 85.32, lat: 27.72, population: 1500, density: 20288, elevation: 1400, temp: 18.1, rainfall: 1505, cost: 25 },
  { name: "Anchorage", lon: -149.90, lat: 61.22, population: 290, density: 67, elevation: 31, temp: 2.8, rainfall: 408, cost: 70 },
  { name: "Ulaanbaatar", lon: 106.92, lat: 47.92, population: 1500, density: 311, elevation: 1350, temp: -0.4, rainfall: 267, cost: 32 },
  { name: "Marrakech", lon: -8.00, lat: 31.63, population: 1100, density: 2800, elevation: 466, temp: 19.6, rainfall: 238, cost: 34 },
];

const dims = [
  { key: "population", label: "Population (k)" },
  { key: "density", label: "Density (/km²)" },
  { key: "elevation", label: "Elevation (m)" },
  { key: "temp", label: "Avg Temp (°C)" },
  { key: "rainfall", label: "Rainfall (mm)" },
  { key: "cost", label: "Cost Index" },
];

// ── Parallel Coordinates ─────────────────────────────────────────────
const pcDiv = document.getElementById("parcoords");
const margin = { top: 36, right: 24, bottom: 12, left: 24 };
const width = pcDiv.clientWidth || 960;
const height = 320;
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const canvas = d3.select(pcDiv).append("canvas")
  .attr("width", width * devicePixelRatio)
  .attr("height", height * devicePixelRatio)
  .style("width", width + "px")
  .style("height", height + "px");
const ctx = canvas.node().getContext("2d");
ctx.scale(devicePixelRatio, devicePixelRatio);

const svg = d3.select(pcDiv).append("svg")
  .attr("width", width).attr("height", height);
const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

const xScale = d3.scalePoint().domain(dims.map(d => d.key)).range([0, innerW]);
const yScales = {};
for (const dim of dims) {
  const ext = d3.extent(cities, d => d[dim.key]);
  const pad = (ext[1] - ext[0]) * 0.05;
  yScales[dim.key] = d3.scaleLinear().domain([ext[0] - pad, ext[1] + pad]).range([innerH, 0]);
}

// Color by temp (cool→warm)
const colorScale = d3.scaleSequential(d3.interpolateRdYlBu).domain([30, -2]);

function linePath(d) {
  ctx.beginPath();
  dims.forEach((dim, i) => {
    const x = xScale(dim.key) + margin.left;
    const y = yScales[dim.key](d[dim.key]) + margin.top;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
}

const brushes = {};
let activeBrushes = {};

function getSelected() {
  const keys = Object.keys(activeBrushes);
  if (keys.length === 0) return cities;
  return cities.filter(d =>
    keys.every(k => {
      const [y0, y1] = activeBrushes[k];
      const val = yScales[k](d[k]);
      return val >= y0 && val <= y1;
    })
  );
}

function renderLines() {
  ctx.clearRect(0, 0, width, height);
  const selected = new Set(getSelected());

  // Ghost layer
  ctx.globalAlpha = 0.12;
  ctx.lineWidth = 1;
  for (const d of cities) {
    if (selected.has(d)) continue;
    ctx.strokeStyle = "#556";
    linePath(d);
    ctx.stroke();
  }

  // Active layer
  ctx.globalAlpha = 0.75;
  ctx.lineWidth = 2;
  for (const d of selected) {
    ctx.strokeStyle = colorScale(d.temp);
    linePath(d);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  updateMap(selected);
}

// Axes
for (const dim of dims) {
  const x = xScale(dim.key);
  const axisG = g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${x},0)`)
    .call(d3.axisLeft(yScales[dim.key]).ticks(6).tickSize(-4));

  axisG.append("text")
    .attr("class", "axis-label")
    .attr("y", -16)
    .text(dim.label);

  // Brush
  const brush = d3.brushY()
    .extent([[-12, 0], [12, innerH]])
    .on("brush end", (event) => {
      if (event.selection) {
        activeBrushes[dim.key] = event.selection;
      } else {
        delete activeBrushes[dim.key];
      }
      renderLines();
    });

  axisG.append("g").attr("class", "brush").call(brush);
}

// ── World Map ────────────────────────────────────────────────────────
const mapW = Math.min(width, 960);
const mapH = 380;
const mapSvg = d3.select("#map-container").append("svg")
  .attr("width", mapW).attr("height", mapH);

const projection = d3.geoNaturalEarth1().fitSize([mapW - 20, mapH - 20], { type: "Sphere" })
  .translate([mapW / 2, mapH / 2]);
const path = d3.geoPath(projection);

const mapG = mapSvg.append("g");

// Graticule
mapG.append("path")
  .datum(d3.geoGraticule10())
  .attr("d", path)
  .attr("fill", "none")
  .attr("stroke", "#2a2a4a")
  .attr("stroke-width", 0.4);

// Sphere outline
mapG.append("path")
  .datum({ type: "Sphere" })
  .attr("d", path)
  .attr("fill", "#16213e")
  .attr("stroke", "#334");

const landG = mapG.append("g");
const dotG = mapG.append("g");
const labelG = mapG.append("g");

// Load world topology
const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
const land = topojson.feature(world, world.objects.land);
const borders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

landG.append("path").datum(land).attr("d", path).attr("fill", "#1e2d4a").attr("stroke", "none");
landG.append("path").datum(borders).attr("d", path).attr("fill", "none").attr("stroke", "#2a3a5a").attr("stroke-width", 0.5);

// City dots
const cityProj = cities.map(d => {
  const [cx, cy] = projection([d.lon, d.lat]);
  return { ...d, cx, cy };
});

dotG.selectAll("circle.ghost")
  .data(cityProj)
  .join("circle")
  .attr("class", "ghost")
  .attr("cx", d => d.cx).attr("cy", d => d.cy)
  .attr("r", 3)
  .attr("fill", "#445")
  .attr("stroke", "none");

const activeDots = dotG.selectAll("circle.active")
  .data(cityProj)
  .join("circle")
  .attr("class", "active")
  .attr("cx", d => d.cx).attr("cy", d => d.cy)
  .attr("r", 5)
  .attr("fill", d => colorScale(d.temp))
  .attr("stroke", "#fff")
  .attr("stroke-width", 1.2)
  .attr("opacity", 1);

const activeLabels = labelG.selectAll("text")
  .data(cityProj)
  .join("text")
  .attr("class", "city-label")
  .attr("x", d => d.cx + 7)
  .attr("y", d => d.cy + 3)
  .text(d => d.name);

function updateMap(selectedSet) {
  activeDots
    .attr("opacity", d => selectedSet.has(d) ? 1 : 0)
    .attr("r", d => selectedSet.has(d) ? 5 : 0);
  activeLabels
    .attr("opacity", d => selectedSet.has(d) ? 1 : 0);
}

// Initial render
renderLines();
</script>
</body>
</html>
