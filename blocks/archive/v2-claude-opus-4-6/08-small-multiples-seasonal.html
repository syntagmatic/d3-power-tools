<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Energy Consumption by Month — 3-Year Overlay</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #333;
    padding: 24px;
  }
  h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 2px; }
  .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 16px; }
  #chart { width: 100%; }
  .panel-label {
    font-size: 11px;
    font-weight: 600;
    fill: #333;
  }
  .axis text { font-size: 9px; fill: #777; }
  .axis line, .axis path { stroke: #ccc; }
  .axis path { display: none; }
  .crosshair { stroke: #333; stroke-width: 0.75; stroke-dasharray: 3,2; pointer-events: none; }
  .tooltip-box {
    position: absolute;
    pointer-events: none;
    background: rgba(255,255,255,0.95);
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 11px;
    line-height: 1.5;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    white-space: nowrap;
  }
  .tooltip-box .tt-title { font-weight: 600; margin-bottom: 2px; }
  .legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 18px; height: 3px; border-radius: 1px; }
</style>
</head>
<body>
<h1>Daily Energy Consumption by Month</h1>
<p class="subtitle">Kilowatt-hours per day — seasonal heating and cooling patterns across three years</p>
<div class="legend" id="legend"></div>
<div style="position:relative">
  <svg id="chart"></svg>
  <div class="tooltip-box" id="tooltip" style="display:none"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data ---
const years = [2022, 2023, 2024];
const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function seasonalBase(month, day) {
  // Day of year approximation
  const doy = [0,31,59,90,120,151,181,212,243,273,304,334][month] + day;
  // U-shaped curve: high in winter, dip in spring/fall, secondary peak in summer
  const heating = 35 * Math.exp(-((doy - 15) ** 2) / 3000) + 35 * Math.exp(-((doy - 350) ** 2) / 3000);
  const cooling = 22 * Math.exp(-((doy - 200) ** 2) / 2500);
  const base = 18; // baseload
  return base + heating + cooling;
}

// Seeded PRNG (simple mulberry32)
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

const data = [];
years.forEach((year, yi) => {
  const rng = mulberry32(year * 1000 + 42);
  for (let m = 0; m < 12; m++) {
    const daysInMonth = new Date(year, m + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const base = seasonalBase(m, d);
      // Year-over-year slight trend + noise
      const trend = yi * 1.5;
      const noise = (rng() - 0.5) * 12;
      const weekend = (new Date(year, m, d).getDay() % 6 === 0) ? 3 : 0;
      data.push({ year, month: m, day: d, value: Math.max(5, base + trend + noise + weekend) });
    }
  }
});

// --- Layout ---
const cols = 4, rows = 3;
const containerWidth = Math.min(960, window.innerWidth - 48);
const margin = { top: 28, right: 8, bottom: 22, left: 36 };
const gap = { x: 12, y: 10 };
const outerPad = { top: 4, left: 0, right: 0, bottom: 0 };
const cellWidth = (containerWidth - outerPad.left - outerPad.right - gap.x * (cols - 1)) / cols;
const cellHeight = cellWidth * 0.6;
const plotWidth = cellWidth - margin.left - margin.right;
const plotHeight = cellHeight - margin.top - margin.bottom;
const totalWidth = containerWidth;
const totalHeight = outerPad.top + rows * cellHeight + (rows - 1) * gap.y + outerPad.bottom;

// --- Scales (shared) ---
const xDomain = [1, 31];
const yExtent = d3.extent(data, d => d.value);
const yDomain = [Math.floor(yExtent[0] / 5) * 5, Math.ceil(yExtent[1] / 5) * 5];
const xScale = d3.scaleLinear().domain(xDomain).range([0, plotWidth]);
const yScale = d3.scaleLinear().domain(yDomain).range([plotHeight, 0]).nice();

const yearColors = d3.scaleOrdinal().domain(years).range(["#4e79a7", "#e15759", "#59a14f"]);

// --- Legend ---
const legend = d3.select("#legend");
years.forEach(y => {
  const item = legend.append("div").attr("class", "legend-item");
  item.append("div").attr("class", "legend-swatch").style("background", yearColors(y));
  item.append("span").text(y);
});

// --- SVG ---
const svg = d3.select("#chart")
  .attr("width", totalWidth)
  .attr("height", totalHeight);

const grouped = d3.group(data, d => d.month, d => d.year);
const panels = [];

monthNames.forEach((name, mi) => {
  const col = mi % cols;
  const row = Math.floor(mi / cols);
  const tx = outerPad.left + col * (cellWidth + gap.x);
  const ty = outerPad.top + row * (cellHeight + gap.y);

  const g = svg.append("g").attr("transform", `translate(${tx},${ty})`);

  // Panel background
  g.append("rect")
    .attr("x", margin.left).attr("y", margin.top)
    .attr("width", plotWidth).attr("height", plotHeight)
    .attr("fill", "#fff").attr("stroke", "#e0e0e0").attr("stroke-width", 0.5);

  // Label
  g.append("text")
    .attr("class", "panel-label")
    .attr("x", margin.left + plotWidth / 2)
    .attr("y", margin.top - 8)
    .attr("text-anchor", "middle")
    .text(name);

  const plot = g.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // Gridlines
  yScale.ticks(4).forEach(t => {
    plot.append("line")
      .attr("x1", 0).attr("x2", plotWidth)
      .attr("y1", yScale(t)).attr("y2", yScale(t))
      .attr("stroke", "#eee").attr("stroke-width", 0.5);
  });

  // Axes: y only on left column, x only on bottom row
  if (col === 0) {
    const yAxis = d3.axisLeft(yScale).ticks(4).tickSize(-3);
    plot.append("g").attr("class", "axis").call(yAxis);
  }
  if (row === rows - 1) {
    const xAxis = d3.axisBottom(xScale).ticks(5).tickFormat(d => d);
    plot.append("g").attr("class", "axis")
      .attr("transform", `translate(0,${plotHeight})`)
      .call(xAxis);
  }

  // Lines per year
  const monthData = grouped.get(mi);
  const line = d3.line()
    .x(d => xScale(d.day))
    .y(d => yScale(d.value))
    .curve(d3.curveMonotoneX);

  years.forEach(year => {
    const yearData = monthData?.get(year) ?? [];
    plot.append("path")
      .datum(yearData.sort((a, b) => a.day - b.day))
      .attr("d", line)
      .attr("fill", "none")
      .attr("stroke", yearColors(year))
      .attr("stroke-width", 1.5)
      .attr("stroke-opacity", 0.85);
  });

  // Crosshair line (hidden initially)
  const crosshair = plot.append("line")
    .attr("class", "crosshair")
    .attr("y1", 0).attr("y2", plotHeight)
    .style("display", "none");

  // Dots for tooltip (one per year)
  const dots = years.map(year =>
    plot.append("circle")
      .attr("r", 3)
      .attr("fill", yearColors(year))
      .attr("stroke", "#fff")
      .attr("stroke-width", 1)
      .style("display", "none")
  );

  // Invisible rect for pointer events
  const hitArea = plot.append("rect")
    .attr("width", plotWidth).attr("height", plotHeight)
    .attr("fill", "none").attr("pointer-events", "all");

  panels.push({ mi, g, plot, crosshair, dots, hitArea, tx, ty, monthData });
});

// --- Synchronized crosshair ---
const tooltip = d3.select("#tooltip");

function updateCrosshair(dayX, sourceMonth) {
  const day = Math.round(xScale.invert(dayX));
  if (day < 1 || day > 31) { clearCrosshair(); return; }
  const px = xScale(day);

  panels.forEach(p => {
    p.crosshair.attr("x1", px).attr("x2", px).style("display", null);
    years.forEach((year, yi) => {
      const vals = p.monthData?.get(year) ?? [];
      const d = vals.find(v => v.day === day);
      if (d) {
        p.dots[yi].attr("cx", xScale(d.day)).attr("cy", yScale(d.value)).style("display", null);
      } else {
        p.dots[yi].style("display", "none");
      }
    });
  });

  // Tooltip near source panel
  const sp = panels[sourceMonth];
  let html = `<div class="tt-title">${monthNames[sourceMonth]} ${day}</div>`;
  years.forEach(year => {
    const vals = sp.monthData?.get(year) ?? [];
    const d = vals.find(v => v.day === day);
    const color = yearColors(year);
    html += d
      ? `<div><span style="color:${color}; font-weight:600">■</span> ${year}: ${d.value.toFixed(1)} kWh</div>`
      : `<div><span style="color:${color}">■</span> ${year}: —</div>`;
  });
  tooltip.html(html).style("display", null);

  // Position tooltip
  const chartRect = document.getElementById("chart").getBoundingClientRect();
  const parentRect = document.getElementById("chart").parentElement.getBoundingClientRect();
  let ttLeft = sp.tx + margin.left + px + 12;
  let ttTop = sp.ty + margin.top + 10;

  // Flip if near right edge
  const ttNode = tooltip.node();
  if (ttLeft + ttNode.offsetWidth > totalWidth - 10) {
    ttLeft = sp.tx + margin.left + px - ttNode.offsetWidth - 12;
  }

  tooltip.style("left", ttLeft + "px").style("top", ttTop + "px");
}

function clearCrosshair() {
  panels.forEach(p => {
    p.crosshair.style("display", "none");
    p.dots.forEach(dot => dot.style("display", "none"));
  });
  tooltip.style("display", "none");
}

panels.forEach(p => {
  p.hitArea
    .on("pointermove", event => {
      const [mx] = d3.pointer(event);
      updateCrosshair(mx, p.mi);
    })
    .on("pointerleave", clearCrosshair);
});
</script>
</body>
</html>
