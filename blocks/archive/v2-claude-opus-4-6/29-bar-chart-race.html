<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Chart Race — GDP by Country</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f13;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }
  #container {
    width: 100%;
    max-width: 960px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
    color: #f0f0f0;
  }
  .subtitle {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 0.75rem;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }
  button {
    background: #2a2a35;
    border: 1px solid #444;
    color: #e0e0e0;
    padding: 0.35rem 0.9rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.15s;
  }
  button:hover { background: #3a3a48; }
  button.active { background: #4a6fa5; border-color: #5a8fc5; }
  .speed-controls {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8rem;
    color: #999;
  }
  .speed-controls button { padding: 0.25rem 0.55rem; font-size: 0.75rem; }
  .year-display {
    font-size: 3.5rem;
    font-weight: 700;
    color: rgba(255,255,255,0.08);
    position: absolute;
    right: 1rem;
    bottom: 0.5rem;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .chart-wrapper {
    position: relative;
    background: #16161d;
    border-radius: 8px;
    padding: 1rem 1rem 0.5rem 1rem;
    overflow: hidden;
  }
  .bar-label {
    font-size: 0.75rem;
    fill: #e0e0e0;
    font-weight: 600;
  }
  .bar-value {
    font-size: 0.7rem;
    fill: #aaa;
  }
  .axis text {
    fill: #666;
    font-size: 0.7rem;
  }
  .axis line, .axis path {
    stroke: #333;
  }
  .tick line {
    stroke: #262630;
  }
</style>
</head>
<body>
<div id="container">
  <h1>GDP by Country</h1>
  <p class="subtitle">Nominal GDP in trillions USD, 1995–2024 (synthetic data)</p>
  <div class="controls">
    <button id="playBtn">▶ Play</button>
    <div class="speed-controls">
      <span>Speed:</span>
      <button data-speed="2000">0.5×</button>
      <button data-speed="1000" class="active">1×</button>
      <button data-speed="500">2×</button>
      <button data-speed="250">4×</button>
    </div>
  </div>
  <div class="chart-wrapper">
    <svg id="chart"></svg>
    <div class="year-display" id="yearDisplay">1995</div>
  </div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic GDP Data ---
// Base GDP in trillions USD (circa 1995), annual growth rates tuned for realism
const countries = [
  { name: "United States",  base: 7.64,  growth: i => 0.042 + 0.005 * Math.sin(i * 0.4) - (i >= 13 && i <= 14 ? 0.03 : 0) },
  { name: "China",          base: 0.73,  growth: i => i < 15 ? 0.14 - i * 0.002 : 0.065 + 0.005 * Math.sin(i * 0.3) },
  { name: "Japan",          base: 5.45,  growth: i => 0.008 + 0.01 * Math.sin(i * 0.5) - (i >= 13 ? 0.005 : 0) },
  { name: "Germany",        base: 2.59,  growth: i => 0.028 + 0.008 * Math.sin(i * 0.4) - (i >= 13 && i <= 14 ? 0.025 : 0) },
  { name: "United Kingdom", base: 1.34,  growth: i => 0.038 + 0.006 * Math.sin(i * 0.35) - (i >= 13 && i <= 14 ? 0.02 : 0) },
  { name: "France",         base: 1.61,  growth: i => 0.026 + 0.006 * Math.sin(i * 0.4) - (i >= 13 && i <= 14 ? 0.02 : 0) },
  { name: "India",          base: 0.36,  growth: i => i < 10 ? 0.09 : 0.085 + 0.01 * Math.sin(i * 0.25) },
  { name: "Italy",          base: 1.17,  growth: i => 0.018 + 0.008 * Math.sin(i * 0.35) - (i >= 13 && i <= 15 ? 0.02 : 0) },
  { name: "Brazil",         base: 0.77,  growth: i => i < 16 ? 0.065 + 0.02 * Math.sin(i * 0.3) : 0.025 + 0.01 * Math.sin(i * 0.3) },
  { name: "Canada",         base: 0.60,  growth: i => 0.038 + 0.008 * Math.sin(i * 0.4) - (i >= 13 && i <= 14 ? 0.02 : 0) },
  { name: "South Korea",    base: 0.56,  growth: i => 0.065 + 0.01 * Math.sin(i * 0.3) - (i >= 13 ? 0.015 : 0) },
  { name: "Russia",         base: 0.40,  growth: i => i < 5 ? 0.08 : i < 14 ? 0.06 + 0.015 * Math.sin(i * 0.3) : 0.02 },
  { name: "Australia",      base: 0.37,  growth: i => 0.055 + 0.01 * Math.sin(i * 0.35) },
  { name: "Mexico",         base: 0.34,  growth: i => 0.045 + 0.015 * Math.sin(i * 0.3) },
  { name: "Indonesia",      base: 0.20,  growth: i => i < 3 ? 0.02 : 0.08 + 0.01 * Math.sin(i * 0.25) },
];

const startYear = 1995;
const numYears = 30;
const years = d3.range(numYears).map(i => startYear + i);

// Generate GDP time series
const data = new Map();
for (const c of countries) {
  const values = [c.base];
  for (let i = 1; i < numYears; i++) {
    const rate = c.growth(i);
    values.push(values[i - 1] * (1 + rate));
  }
  data.set(c.name, values);
}

// Assign stable colors per country using OKLCH for perceptual uniformity
const colorMap = new Map();
countries.forEach((c, i) => {
  const hue = (i * 360 / countries.length + 210) % 360;
  colorMap.set(c.name, `oklch(68% 0.14 ${hue})`);
});

// --- Chart Setup ---
const n = 12; // bars shown
const margin = { top: 8, right: 90, bottom: 24, left: 120 };
const barHeight = 32;
const barGap = 4;
const innerHeight = n * (barHeight + barGap);
const width = 920;
const height = innerHeight + margin.top + margin.bottom;

const svg = d3.select("#chart")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("width", "100%");

const g = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const innerWidth = width - margin.left - margin.right;

const x = d3.scaleLinear().range([0, innerWidth]);
const y = d3.scaleBand()
  .domain(d3.range(n))
  .range([0, innerHeight])
  .padding(0.1);

// Gridlines
const xAxisG = g.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${innerHeight})`);

const gridG = g.append("g").attr("class", "axis");

// --- Keyframes: interpolate between years for smooth animation ---
const k = 10; // interpolation steps between years
const keyframes = [];
for (let yi = 0; yi < years.length - 1; yi++) {
  for (let ki = 0; ki < k; ki++) {
    const t = ki / k;
    const year = years[yi] + t;
    const frame = countries.map(c => {
      const vals = data.get(c.name);
      const v = vals[yi] * (1 - t) + vals[yi + 1] * t;
      return { name: c.name, value: v };
    });
    frame.sort((a, b) => b.value - a.value);
    keyframes.push({ year, ranked: frame.slice(0, n) });
  }
}
// Add final frame
keyframes.push({
  year: years[years.length - 1],
  ranked: countries.map(c => ({ name: c.name, value: data.get(c.name)[numYears - 1] }))
    .sort((a, b) => b.value - a.value).slice(0, n)
});

// --- Render ---
let frameIndex = 0;
let playing = false;
let interval = 1000;
let timer = null;

function render(frame) {
  const { year, ranked } = frame;

  // Update year display
  d3.select("#yearDisplay").text(Math.round(year));

  // Update x scale domain
  x.domain([0, d3.max(ranked, d => d.value) * 1.05]);

  // X axis
  xAxisG.call(
    d3.axisBottom(x)
      .ticks(5)
      .tickFormat(d => `$${d.toFixed(1)}T`)
      .tickSize(0)
  ).call(g => g.select(".domain").remove());

  // Gridlines
  gridG.call(
    d3.axisBottom(x)
      .ticks(5)
      .tickSize(innerHeight)
      .tickFormat("")
  )
  .call(g => g.select(".domain").remove())
  .call(g => g.selectAll(".tick line").attr("stroke", "#262630"));

  // Bars
  const bars = g.selectAll(".bar-g")
    .data(ranked, d => d.name)
    .join(
      enter => {
        const eg = enter.append("g").attr("class", "bar-g");
        eg.append("rect").attr("class", "bar-rect")
          .attr("height", y.bandwidth())
          .attr("rx", 3)
          .attr("fill", d => colorMap.get(d.name));
        eg.append("text").attr("class", "bar-label")
          .attr("dy", "0.35em")
          .attr("text-anchor", "end")
          .attr("x", -8);
        eg.append("text").attr("class", "bar-value")
          .attr("dy", "0.35em")
          .attr("x", 6);
        return eg;
      },
      update => update,
      exit => exit.remove()
    );

  // Position bars with transition
  const t = d3.transition().duration(interval / k).ease(d3.easeLinear);

  bars.transition(t)
    .attr("transform", (d, i) => `translate(0,${y(i)})`);

  bars.select(".bar-rect")
    .transition(t)
    .attr("width", d => Math.max(0, x(d.value)));

  bars.select(".bar-label")
    .attr("y", y.bandwidth() / 2)
    .text(d => d.name);

  bars.select(".bar-value")
    .transition(t)
    .attr("x", d => x(d.value) + 6)
    .attr("y", y.bandwidth() / 2)
    .tween("text", function(d) {
      const node = this;
      const prev = +node.dataset.value || d.value;
      node.dataset.value = d.value;
      const i = d3.interpolateNumber(prev, d.value);
      return t => node.textContent = `$${i(t).toFixed(2)}T`;
    });
}

// Initial render
render(keyframes[0]);

// --- Playback ---
function tick() {
  frameIndex++;
  if (frameIndex >= keyframes.length) {
    frameIndex = keyframes.length - 1;
    stop();
    return;
  }
  render(keyframes[frameIndex]);
}

function play() {
  if (frameIndex >= keyframes.length - 1) frameIndex = 0;
  playing = true;
  d3.select("#playBtn").text("⏸ Pause").classed("active", true);
  timer = d3.interval(tick, interval / k);
}

function stop() {
  playing = false;
  d3.select("#playBtn").text("▶ Play").classed("active", false);
  if (timer) { timer.stop(); timer = null; }
}

d3.select("#playBtn").on("click", () => {
  playing ? stop() : play();
});

// Speed buttons
d3.selectAll(".speed-controls button").on("click", function() {
  d3.selectAll(".speed-controls button").classed("active", false);
  d3.select(this).classed("active", true);
  interval = +this.dataset.speed;
  if (playing) {
    timer.stop();
    timer = d3.interval(tick, interval / k);
  }
});

</script>
</body>
</html>
