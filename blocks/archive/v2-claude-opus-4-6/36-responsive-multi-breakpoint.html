<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive Multi-Breakpoint Chart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f8f8f8; color: #333; }
  #chart-wrapper {
    width: 100%; height: 100vh; overflow: hidden;
    container-type: inline-size;
  }
  svg { display: block; }
  .axis text { font-size: 11px; fill: #555; }
  .axis path, .axis line { stroke: #ccc; }
  .legend-item text { font-size: 12px; fill: #444; }
  .title { font-size: 16px; font-weight: 600; fill: #222; }
  .subtitle { font-size: 12px; fill: #888; }
  .histogram-bar { opacity: 0.35; }
  .box-line { stroke-width: 1.5; }
  .box-rect { opacity: 0.25; }
  .median-line { stroke-width: 2.5; }
</style>
</head>
<body>
<div id="chart-wrapper"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic data ---
const rng = d3.randomLcg(42);
const normal = d3.randomNormal.source(rng);
const categories = ["Alpha", "Beta", "Gamma", "Delta"];
const colors = ["#e15759", "#4e79a7", "#59a14f", "#f28e2b"];
const colorScale = d3.scaleOrdinal().domain(categories).range(colors);

const data = [];
const distributions = [
  { mx: 45, my: 60, sx: 12, sy: 15 },
  { mx: 65, my: 40, sx: 10, sy: 12 },
  { mx: 30, my: 75, sx: 8, sy: 10 },
  { mx: 70, my: 55, sx: 15, sy: 18 },
];
categories.forEach((cat, ci) => {
  const { mx, my, sx, sy } = distributions[ci];
  const nx = normal(mx, sx);
  const ny = normal(my, sy);
  const n = 60 + Math.floor(rng() * 40);
  for (let i = 0; i < n; i++) {
    data.push({ x: nx(), y: ny(), category: cat });
  }
});

const xExtent = d3.extent(data, d => d.x);
const yExtent = d3.extent(data, d => d.y);
const xPad = (xExtent[1] - xExtent[0]) * 0.05;
const yPad = (yExtent[1] - yExtent[0]) * 0.05;
const xDomain = [xExtent[0] - xPad, xExtent[1] + xPad];
const yDomain = [yExtent[0] - yPad, yExtent[1] + yPad];

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const dur = reduceMotion ? 0 : 500;

const wrapper = document.getElementById("chart-wrapper");
const svg = d3.select(wrapper).append("svg");

// Persistent groups
const gHistTop = svg.append("g").attr("class", "hist-top");
const gHistRight = svg.append("g").attr("class", "hist-right");
const gMain = svg.append("g").attr("class", "main");
const gXAxis = svg.append("g").attr("class", "axis x-axis");
const gYAxis = svg.append("g").attr("class", "axis y-axis");
const gLegend = svg.append("g").attr("class", "legend");
const gTitle = svg.append("g").attr("class", "title-group");

let lastLayout = null;

function render(width, height) {
  svg.attr("width", width).attr("height", height);

  let layout;
  if (width >= 1000) layout = "wide";
  else if (width >= 600) layout = "medium";
  else layout = "narrow";

  const t = svg.transition().duration(dur);

  if (layout === "wide") renderWide(width, height, t);
  else if (layout === "medium") renderMedium(width, height, t);
  else renderNarrow(width, height, t);

  lastLayout = layout;
}

// --- WIDE: scatter + marginal histograms ---
function renderWide(width, height, t) {
  const histSize = 60;
  const margin = { top: 45, right: histSize + 20, bottom: 50, left: 55 };
  const iw = width - margin.left - margin.right;
  const ih = height - margin.top - margin.bottom - histSize;

  const x = d3.scaleLinear().domain(xDomain).range([0, iw]);
  const y = d3.scaleLinear().domain(yDomain).range([ih, 0]);

  // Title
  gTitle.transition(t).attr("transform", `translate(${margin.left}, 22)`);
  titleUpdate("Multivariate Explorer", "Resize window to see layout adapt");

  // Axes
  gXAxis.transition(t).attr("transform", `translate(${margin.left}, ${margin.top + ih + histSize})`);
  gXAxis.transition(t).call(d3.axisBottom(x).ticks(Math.floor(iw / 80)));
  gYAxis.transition(t).attr("transform", `translate(${margin.left}, ${margin.top + histSize})`);
  gYAxis.transition(t).call(d3.axisLeft(y).ticks(Math.floor(ih / 60)));

  // Scatter
  gMain.transition(t).attr("transform", `translate(${margin.left}, ${margin.top + histSize})`);
  const circles = gMain.selectAll("circle").data(data, (d, i) => i);
  circles.join(
    enter => enter.append("circle")
      .attr("cx", d => x(d.x)).attr("cy", d => y(d.y))
      .attr("r", 0).attr("fill", d => colorScale(d.category)).attr("opacity", 0.7)
      .call(e => e.transition(t).attr("r", 3.5)),
    update => update.call(u => u.transition(t)
      .attr("cx", d => x(d.x)).attr("cy", d => y(d.y)).attr("r", 3.5).attr("opacity", 0.7)),
    exit => exit.transition(t).attr("r", 0).remove()
  );

  // Top histogram (x marginal)
  gHistTop.transition(t).attr("transform", `translate(${margin.left}, ${margin.top})`).style("opacity", 1);
  renderHistogram(gHistTop, data, d => d.x, x, histSize, "x", t);

  // Right histogram (y marginal)
  gHistRight.transition(t).attr("transform", `translate(${margin.left + iw}, ${margin.top + histSize})`).style("opacity", 1);
  renderHistogram(gHistRight, data, d => d.y, y, histSize, "y", t);

  // Legend inline top-right
  gLegend.transition(t).attr("transform", `translate(${width - 140}, ${margin.top + histSize + 10})`);
  renderLegend(t, "vertical");
}

// --- MEDIUM: scatter, legend below ---
function renderMedium(width, height, t) {
  const legendH = 40;
  const margin = { top: 45, right: 20, bottom: 50 + legendH, left: 50 };
  const iw = width - margin.left - margin.right;
  const ih = height - margin.top - margin.bottom;

  const x = d3.scaleLinear().domain(xDomain).range([0, iw]);
  const y = d3.scaleLinear().domain(yDomain).range([ih, 0]);

  gTitle.transition(t).attr("transform", `translate(${margin.left}, 22)`);
  titleUpdate("Multivariate Explorer", "Medium layout — simplified scatter");

  gXAxis.transition(t).attr("transform", `translate(${margin.left}, ${margin.top + ih})`);
  gXAxis.transition(t).call(d3.axisBottom(x).ticks(Math.floor(iw / 80)));
  gYAxis.transition(t).attr("transform", `translate(${margin.left}, ${margin.top})`);
  gYAxis.transition(t).call(d3.axisLeft(y).ticks(Math.floor(ih / 60)));

  gMain.transition(t).attr("transform", `translate(${margin.left}, ${margin.top})`);
  const circles = gMain.selectAll("circle").data(data, (d, i) => i);
  circles.join(
    enter => enter.append("circle")
      .attr("cx", d => x(d.x)).attr("cy", d => y(d.y))
      .attr("r", 0).attr("fill", d => colorScale(d.category)).attr("opacity", 0.7)
      .call(e => e.transition(t).attr("r", 3)),
    update => update.call(u => u.transition(t)
      .attr("cx", d => x(d.x)).attr("cy", d => y(d.y)).attr("r", 3).attr("opacity", 0.7)),
    exit => exit.transition(t).attr("r", 0).remove()
  );

  // Hide histograms
  gHistTop.transition(t).style("opacity", 0);
  gHistTop.selectAll("rect").transition(t).attr("width", 0).attr("height", 0);
  gHistRight.transition(t).style("opacity", 0);
  gHistRight.selectAll("rect").transition(t).attr("width", 0).attr("height", 0);

  // Legend below chart
  gLegend.transition(t).attr("transform", `translate(${margin.left + iw / 2 - categories.length * 45}, ${height - legendH + 5})`);
  renderLegend(t, "horizontal");
}

// --- NARROW: strip plot + box overlays ---
function renderNarrow(width, height, t) {
  const margin = { top: 45, right: 15, bottom: 30, left: 65 };
  const iw = width - margin.left - margin.right;
  const ih = height - margin.top - margin.bottom;

  const y = d3.scaleBand().domain(categories).range([0, ih]).padding(0.3);
  const x = d3.scaleLinear().domain(xDomain).range([0, iw]);

  gTitle.transition(t).attr("transform", `translate(${margin.left}, 22)`);
  titleUpdate("Multivariate Explorer", "Narrow — strip plot with box overlays");

  gXAxis.transition(t).attr("transform", `translate(${margin.left}, ${margin.top + ih})`);
  gXAxis.transition(t).call(d3.axisBottom(x).ticks(Math.max(3, Math.floor(iw / 60))));
  gYAxis.transition(t).attr("transform", `translate(${margin.left}, ${margin.top})`);
  gYAxis.transition(t).call(d3.axisLeft(y));

  gMain.transition(t).attr("transform", `translate(${margin.left}, ${margin.top})`);

  // Hide histograms
  gHistTop.transition(t).style("opacity", 0);
  gHistRight.transition(t).style("opacity", 0);

  // Hide legend (category on y-axis)
  gLegend.selectAll("*").transition(t).attr("opacity", 0).remove();

  // Box overlays per category
  const boxData = categories.map(cat => {
    const vals = data.filter(d => d.category === cat).map(d => d.x).sort(d3.ascending);
    const q1 = d3.quantile(vals, 0.25);
    const median = d3.quantile(vals, 0.5);
    const q3 = d3.quantile(vals, 0.75);
    const iqr = q3 - q1;
    const min = Math.max(d3.min(vals), q1 - 1.5 * iqr);
    const max = Math.min(d3.max(vals), q3 + 1.5 * iqr);
    return { cat, q1, median, q3, min, max };
  });

  const boxes = gMain.selectAll(".box-group").data(boxData, d => d.cat);
  const boxEnter = boxes.enter().append("g").attr("class", "box-group");

  // Whisker line
  boxEnter.append("line").attr("class", "box-line");
  // IQR rect
  boxEnter.append("rect").attr("class", "box-rect");
  // Median line
  boxEnter.append("line").attr("class", "median-line");

  const boxMerge = boxEnter.merge(boxes);
  boxMerge.each(function(d) {
    const g = d3.select(this);
    const cy = y(d.cat) + y.bandwidth() / 2;
    const bh = y.bandwidth() * 0.6;

    g.select(".box-line")
      .transition(t)
      .attr("x1", x(d.min)).attr("x2", x(d.max))
      .attr("y1", cy).attr("y2", cy)
      .attr("stroke", colorScale(d.cat));

    g.select(".box-rect")
      .transition(t)
      .attr("x", x(d.q1)).attr("width", x(d.q3) - x(d.q1))
      .attr("y", cy - bh / 2).attr("height", bh)
      .attr("fill", colorScale(d.cat));

    g.select(".median-line")
      .transition(t)
      .attr("x1", x(d.median)).attr("x2", x(d.median))
      .attr("y1", cy - bh / 2).attr("y2", cy + bh / 2)
      .attr("stroke", colorScale(d.cat));
  });

  boxes.exit().transition(t).attr("opacity", 0).remove();

  // Strip points — map to band position + jitter
  const jitterRng = d3.randomLcg(99);
  const circles = gMain.selectAll("circle").data(data, (d, i) => i);
  circles.join(
    enter => enter.append("circle")
      .attr("cx", d => x(d.x))
      .attr("cy", d => y(d.category) + y.bandwidth() * (0.2 + jitterRng() * 0.6))
      .attr("r", 0).attr("fill", d => colorScale(d.category)).attr("opacity", 0.5)
      .call(e => e.transition(t).attr("r", 2.5)),
    update => update.call(u => u.transition(t)
      .attr("cx", d => x(d.x))
      .attr("cy", d => y(d.category) + y.bandwidth() * (0.2 + d3.randomLcg(99 + data.indexOf(d))() * 0.6))
      .attr("r", 2.5).attr("opacity", 0.5)),
    exit => exit.transition(t).attr("r", 0).remove()
  );
}

// --- Histogram helper ---
function renderHistogram(g, dataset, accessor, posScale, size, orient, t) {
  const bins = d3.bin()
    .domain(posScale.domain())
    .thresholds(posScale.ticks(20))
    .value(accessor)(dataset);

  const countMax = d3.max(bins, b => b.length);

  categories.forEach((cat, ci) => {
    const catBins = bins.map(b => ({
      x0: b.x0, x1: b.x1,
      count: b.filter(d => d.category === cat).length
    }));

    const barSel = g.selectAll(`.histogram-bar-${ci}`).data(catBins, d => d.x0);

    if (orient === "x") {
      const hScale = d3.scaleLinear().domain([0, countMax]).range([size, 0]);
      barSel.join(
        enter => enter.append("rect").attr("class", `histogram-bar histogram-bar-${ci}`)
          .attr("x", d => posScale(d.x0) + 1).attr("width", d => Math.max(0, posScale(d.x1) - posScale(d.x0) - 1))
          .attr("y", size).attr("height", 0)
          .attr("fill", colors[ci])
          .call(e => e.transition(t).attr("y", d => hScale(d.count)).attr("height", d => size - hScale(d.count))),
        update => update.transition(t)
          .attr("x", d => posScale(d.x0) + 1).attr("width", d => Math.max(0, posScale(d.x1) - posScale(d.x0) - 1))
          .attr("y", d => hScale(d.count)).attr("height", d => size - hScale(d.count)),
        exit => exit.transition(t).attr("height", 0).remove()
      );
    } else {
      const hScale = d3.scaleLinear().domain([0, countMax]).range([0, size]);
      barSel.join(
        enter => enter.append("rect").attr("class", `histogram-bar histogram-bar-${ci}`)
          .attr("y", d => posScale(d.x1) + 1).attr("height", d => Math.max(0, posScale(d.x0) - posScale(d.x1) - 1))
          .attr("x", 0).attr("width", 0)
          .attr("fill", colors[ci])
          .call(e => e.transition(t).attr("width", d => hScale(d.count))),
        update => update.transition(t)
          .attr("y", d => posScale(d.x1) + 1).attr("height", d => Math.max(0, posScale(d.x0) - posScale(d.x1) - 1))
          .attr("width", d => hScale(d.count)),
        exit => exit.transition(t).attr("width", 0).remove()
      );
    }
  });
}

// --- Legend helper ---
function renderLegend(t, orient) {
  const items = gLegend.selectAll(".legend-item").data(categories, d => d);
  const enter = items.enter().append("g").attr("class", "legend-item").attr("opacity", 0);
  enter.append("rect").attr("width", 12).attr("height", 12).attr("rx", 2);
  enter.append("text").attr("x", 16).attr("y", 10);

  const merged = enter.merge(items);
  merged.transition(t).attr("opacity", 1);

  if (orient === "horizontal") {
    merged.transition(t).attr("transform", (d, i) => `translate(${i * 90}, 0)`);
  } else {
    merged.transition(t).attr("transform", (d, i) => `translate(0, ${i * 22})`);
  }

  merged.select("rect").attr("fill", d => colorScale(d));
  merged.select("text").text(d => d);

  items.exit().transition(t).attr("opacity", 0).remove();
}

// --- Title helper ---
function titleUpdate(title, sub) {
  let titleEl = gTitle.select(".title");
  if (titleEl.empty()) titleEl = gTitle.append("text").attr("class", "title");
  titleEl.text(title);

  let subEl = gTitle.select(".subtitle");
  if (subEl.empty()) subEl = gTitle.append("text").attr("class", "subtitle").attr("dy", 16);
  subEl.text(sub);
}

// --- Clean up box groups when leaving narrow ---
function cleanBoxes() {
  gMain.selectAll(".box-group").remove();
}

// --- ResizeObserver ---
let lastWidth = 0;
const ro = new ResizeObserver(([entry]) => {
  const { width, height } = entry.contentRect;
  if (width < 1 || height < 1) return;
  if (Math.abs(width - lastWidth) < 1) return; // skip height-only changes
  lastWidth = width;

  // Clean layout-specific elements on layout change
  const newLayout = width >= 1000 ? "wide" : width >= 600 ? "medium" : "narrow";
  if (lastLayout && lastLayout !== newLayout) {
    if (lastLayout === "narrow") cleanBoxes();
  }

  render(width, height);
});
ro.observe(wrapper);
</script>
</body>
</html>
