<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunburst with Breadcrumb Trail & Radial Brush</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    color: #333;
  }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 16px; }
  #breadcrumb {
    display: flex;
    gap: 4px;
    align-items: center;
    min-height: 32px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .crumb {
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    color: #fff;
    transition: opacity 0.15s;
  }
  .crumb:hover { opacity: 0.85; }
  .crumb-sep { color: #aaa; font-size: 0.75rem; }
  #chart { position: relative; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(0,0,0,0.82);
    color: #fff;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 0.78rem;
    line-height: 1.4;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .instructions {
    font-size: 0.75rem;
    color: #888;
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>
<h1>Product Taxonomy</h1>
<p class="subtitle">4-level hierarchy · ~150 leaves</p>
<div id="breadcrumb"></div>
<div id="chart"><div class="tooltip" id="tooltip"></div></div>
<p class="instructions">Click inner rings to zoom · Drag along outer ring to select angular range · Click center to zoom out</p>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// ── Synthetic data: 4-level product taxonomy ──
const taxonomy = {
  name: "Products",
  children: [
    { name: "Electronics", children: [
      { name: "Computers", children: [
        { name: "Laptops", children: [
          { name: "Ultrabook", value: 42 }, { name: "Gaming Laptop", value: 38 },
          { name: "Chromebook", value: 18 }, { name: "Workstation", value: 15 }
        ]},
        { name: "Desktops", children: [
          { name: "Tower", value: 22 }, { name: "Mini PC", value: 14 },
          { name: "All-in-One", value: 19 }
        ]},
        { name: "Tablets", children: [
          { name: "iPad", value: 35 }, { name: "Android Tablet", value: 20 },
          { name: "E-Reader", value: 16 }
        ]}
      ]},
      { name: "Audio", children: [
        { name: "Headphones", children: [
          { name: "Over-Ear", value: 28 }, { name: "In-Ear", value: 32 },
          { name: "Wireless Buds", value: 40 }
        ]},
        { name: "Speakers", children: [
          { name: "Bluetooth", value: 25 }, { name: "Soundbar", value: 18 },
          { name: "Smart Speaker", value: 30 }
        ]}
      ]},
      { name: "Phones", children: [
        { name: "Smartphones", children: [
          { name: "Flagship", value: 48 }, { name: "Mid-Range", value: 36 },
          { name: "Budget", value: 28 }
        ]},
        { name: "Accessories", children: [
          { name: "Cases", value: 15 }, { name: "Chargers", value: 20 },
          { name: "Screen Guards", value: 12 }
        ]}
      ]},
      { name: "Wearables", children: [
        { name: "Smartwatches", children: [
          { name: "Fitness Watch", value: 30 }, { name: "Luxury Watch", value: 12 }
        ]},
        { name: "Fitness Bands", children: [
          { name: "Basic Band", value: 22 }, { name: "Advanced Band", value: 16 }
        ]}
      ]}
    ]},
    { name: "Home & Garden", children: [
      { name: "Furniture", children: [
        { name: "Living Room", children: [
          { name: "Sofa", value: 35 }, { name: "Coffee Table", value: 18 },
          { name: "TV Stand", value: 14 }, { name: "Bookshelf", value: 20 }
        ]},
        { name: "Bedroom", children: [
          { name: "Bed Frame", value: 30 }, { name: "Nightstand", value: 12 },
          { name: "Dresser", value: 16 }, { name: "Wardrobe", value: 22 }
        ]},
        { name: "Office", children: [
          { name: "Desk", value: 28 }, { name: "Office Chair", value: 34 },
          { name: "Filing Cabinet", value: 8 }
        ]}
      ]},
      { name: "Kitchen", children: [
        { name: "Appliances", children: [
          { name: "Blender", value: 18 }, { name: "Coffee Maker", value: 24 },
          { name: "Toaster", value: 14 }, { name: "Air Fryer", value: 28 }
        ]},
        { name: "Cookware", children: [
          { name: "Pots & Pans", value: 22 }, { name: "Knives", value: 16 },
          { name: "Bakeware", value: 12 }
        ]}
      ]},
      { name: "Garden", children: [
        { name: "Tools", children: [
          { name: "Mower", value: 20 }, { name: "Pruner", value: 10 },
          { name: "Hose", value: 12 }
        ]},
        { name: "Decor", children: [
          { name: "Planters", value: 15 }, { name: "Lighting", value: 18 },
          { name: "Fountain", value: 8 }
        ]}
      ]}
    ]},
    { name: "Clothing", children: [
      { name: "Men", children: [
        { name: "Tops", children: [
          { name: "T-Shirts", value: 30 }, { name: "Shirts", value: 24 },
          { name: "Sweaters", value: 18 }
        ]},
        { name: "Bottoms", children: [
          { name: "Jeans", value: 26 }, { name: "Chinos", value: 16 },
          { name: "Shorts", value: 14 }
        ]},
        { name: "Outerwear", children: [
          { name: "Jackets", value: 22 }, { name: "Coats", value: 15 }
        ]}
      ]},
      { name: "Women", children: [
        { name: "Tops", children: [
          { name: "Blouses", value: 22 }, { name: "T-Shirts", value: 28 },
          { name: "Sweaters", value: 16 }
        ]},
        { name: "Bottoms", children: [
          { name: "Jeans", value: 24 }, { name: "Skirts", value: 18 },
          { name: "Trousers", value: 14 }
        ]},
        { name: "Dresses", children: [
          { name: "Casual", value: 20 }, { name: "Formal", value: 14 },
          { name: "Maxi", value: 12 }
        ]}
      ]},
      { name: "Kids", children: [
        { name: "Boys", children: [
          { name: "T-Shirts", value: 16 }, { name: "Shorts", value: 12 },
          { name: "Jackets", value: 10 }
        ]},
        { name: "Girls", children: [
          { name: "Dresses", value: 18 }, { name: "Tops", value: 14 },
          { name: "Leggings", value: 12 }
        ]}
      ]}
    ]},
    { name: "Sports", children: [
      { name: "Fitness", children: [
        { name: "Cardio", children: [
          { name: "Treadmill", value: 25 }, { name: "Bike", value: 20 },
          { name: "Elliptical", value: 15 }
        ]},
        { name: "Strength", children: [
          { name: "Dumbbells", value: 22 }, { name: "Barbell Set", value: 18 },
          { name: "Resistance Bands", value: 14 }, { name: "Kettlebell", value: 12 }
        ]}
      ]},
      { name: "Outdoor", children: [
        { name: "Camping", children: [
          { name: "Tent", value: 20 }, { name: "Sleeping Bag", value: 16 },
          { name: "Cooler", value: 12 }
        ]},
        { name: "Cycling", children: [
          { name: "Road Bike", value: 18 }, { name: "Mountain Bike", value: 22 },
          { name: "Helmet", value: 10 }
        ]},
        { name: "Water Sports", children: [
          { name: "Kayak", value: 14 }, { name: "Paddleboard", value: 16 },
          { name: "Snorkel Set", value: 10 }
        ]}
      ]},
      { name: "Team Sports", children: [
        { name: "Ball Sports", children: [
          { name: "Soccer Ball", value: 18 }, { name: "Basketball", value: 16 },
          { name: "Tennis Racket", value: 14 }
        ]},
        { name: "Protective Gear", children: [
          { name: "Shin Guards", value: 8 }, { name: "Knee Pads", value: 10 },
          { name: "Gloves", value: 12 }
        ]}
      ]}
    ]}
  ]
};

// ── Layout ──
const width = 760, height = 760;
const radius = Math.min(width, height) / 2;
const innerRadius = radius * 0.12;

const root = d3.hierarchy(taxonomy)
  .sum(d => d.value || 0)
  .sort((a, b) => b.value - a.value);

const partition = d3.partition().size([2 * Math.PI, radius]);
partition(root);

// Color: top-level categories get distinct hues, children inherit with lightness variation
const topColors = d3.scaleOrdinal()
  .domain(root.children.map(d => d.data.name))
  .range(["#4e79a7", "#e15759", "#59a14f", "#f28e2b"]);

function nodeColor(d) {
  if (d.depth === 0) return "#fff";
  const ancestor = d.ancestors().find(a => a.depth === 1);
  const base = d3.hcl(topColors(ancestor.data.name));
  // Vary lightness by depth
  base.l = Math.min(92, base.l + (d.depth - 1) * 12);
  base.c = Math.max(20, base.c - (d.depth - 1) * 8);
  return base.toString();
}

// ── Arc generator ──
const arc = d3.arc()
  .startAngle(d => d.x0)
  .endAngle(d => d.x1)
  .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.005))
  .padRadius(radius / 2)
  .innerRadius(d => Math.max(innerRadius, d.y0))
  .outerRadius(d => d.y1 - 1);

// ── SVG ──
const svg = d3.select("#chart").append("svg")
  .attr("width", width)
  .attr("height", height)
  .attr("viewBox", [-width / 2, -height / 2, width, height])
  .style("font", "10px system-ui, sans-serif");

// ── State ──
let currentFocus = root;
let brushAngle = null; // { start, end } in radians or null

// ── Draw arcs ──
const paths = svg.append("g")
  .selectAll("path")
  .data(root.descendants().filter(d => d.depth > 0))
  .join("path")
    .attr("d", d => arc(d))
    .attr("fill", d => nodeColor(d))
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.5)
    .style("cursor", "pointer");

// Stash current values for transitions
paths.each(d => {
  d.current = { x0: d.x0, x1: d.x1, y0: d.y0, y1: d.y1 };
});

// ── Labels ──
const labels = svg.append("g")
  .attr("pointer-events", "none")
  .attr("text-anchor", "middle")
  .selectAll("text")
  .data(root.descendants().filter(d => d.depth > 0))
  .join("text")
    .attr("dy", "0.35em")
    .attr("fill-opacity", d => labelVisible(d) ? 1 : 0)
    .attr("transform", d => labelTransform(d))
    .text(d => d.data.name)
    .style("font-size", d => d.depth <= 2 ? "10px" : "8.5px")
    .style("fill", d => {
      const c = d3.hcl(nodeColor(d));
      return c.l > 60 ? "#333" : "#fff";
    });

function labelVisible(d) {
  return d.y1 <= radius && d.y0 >= innerRadius && (d.x1 - d.x0) > 0.04;
}

function labelTransform(d) {
  const angle = (d.x0 + d.x1) / 2;
  const r = (d.y0 + d.y1) / 2;
  const rotate = angle * 180 / Math.PI - 90;
  const flip = angle > Math.PI;
  return `rotate(${rotate}) translate(${r},0) rotate(${flip ? 180 : 0})`;
}

// ── Center circle (click to zoom out) ──
const centerCircle = svg.append("circle")
  .attr("r", innerRadius)
  .attr("fill", "#fff")
  .attr("stroke", "#ddd")
  .style("cursor", "pointer")
  .on("click", () => {
    if (currentFocus.parent) clicked(null, currentFocus.parent);
  });

const centerLabel = svg.append("text")
  .attr("text-anchor", "middle")
  .attr("dy", "0.35em")
  .attr("fill", "#666")
  .style("font-size", "11px")
  .style("pointer-events", "none")
  .text("Products");

// ── Click to zoom ──
paths.on("click", (event, d) => {
  // Only zoom on non-leaf inner rings (not outermost)
  if (d.children) clicked(event, d);
});

function clicked(event, p) {
  currentFocus = p;
  updateBreadcrumb(p);
  centerLabel.text(p.depth === 0 ? "Products" : p.data.name);

  root.each(d => {
    d.target = {
      x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
      y0: Math.max(0, d.y0 - p.depth),
      y1: Math.max(0, d.y1 - p.depth),
    };
  });

  // Scale radii to fill available space
  const maxDepth = root.leaves().reduce((mx, l) => Math.max(mx, l.depth - p.depth), 0);
  const ringWidth = (radius - innerRadius) / maxDepth;
  root.each(d => {
    d.target.y0 = d.target.y0 > 0 ? innerRadius + (d.target.y0 - 1) * ringWidth : 0;
    d.target.y1 = d.target.y1 > 0 ? innerRadius + (d.target.y1 - 1) * ringWidth : 0;
  });

  // Clear brush on zoom
  brushAngle = null;
  brushOverlay.attr("d", "");
  applyBrush();

  const t = svg.transition().duration(650);

  paths.transition(t)
    .tween("data", d => {
      const i = d3.interpolate(d.current, d.target);
      return t => d.current = i(t);
    })
    .attrTween("d", d => () => arc(d.current))
    .attr("fill-opacity", d => arcVisible(d.target) ? 1 : 0)
    .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none");

  labels.transition(t)
    .attr("fill-opacity", d => labelVisibleTarget(d) ? 1 : 0)
    .attrTween("transform", d => () => labelTransformCurrent(d));
}

function arcVisible(d) {
  return d.y1 > innerRadius && d.y0 < radius && d.x1 > d.x0 + 0.001;
}

function labelVisibleTarget(d) {
  return arcVisible(d.target) && (d.target.x1 - d.target.x0) > 0.04;
}

function labelTransformCurrent(d) {
  const angle = (d.current.x0 + d.current.x1) / 2;
  const r = (d.current.y0 + d.current.y1) / 2;
  const rotate = angle * 180 / Math.PI - 90;
  const flip = angle > Math.PI;
  return `rotate(${rotate}) translate(${r},0) rotate(${flip ? 180 : 0})`;
}

// ── Breadcrumb ──
const breadcrumbEl = d3.select("#breadcrumb");

function updateBreadcrumb(node) {
  const chain = node.ancestors().reverse();
  const crumbs = breadcrumbEl.selectAll(".crumb-group")
    .data(chain, d => d.data.name + d.depth);

  crumbs.exit().remove();

  const enter = crumbs.enter().append("span").attr("class", "crumb-group");
  enter.each(function(d, i) {
    if (i > 0) d3.select(this).append("span").attr("class", "crumb-sep").text("›");
    d3.select(this).append("span")
      .attr("class", "crumb")
      .style("background", d.depth === 0 ? "#888" : nodeColor(d))
      .style("color", () => {
        const c = d3.hcl(d.depth === 0 ? "#888" : nodeColor(d));
        return c.l > 60 ? "#333" : "#fff";
      })
      .text(d.data.name)
      .on("click", (event) => {
        event.stopPropagation();
        clicked(null, d);
      });
  });
}
updateBreadcrumb(root);

// ── Radial brush on outer ring ──
// Invisible ring captures drag on the outermost band
const outerRingInner = root.children
  ? Math.max(...root.descendants().filter(d => d.depth > 0).map(d => d.y0))
  : radius * 0.75;

const brushOverlay = svg.append("path")
  .attr("fill", "rgba(100, 140, 200, 0.18)")
  .attr("stroke", "rgba(60, 100, 180, 0.5)")
  .attr("stroke-width", 1.5)
  .style("pointer-events", "none");

// Invisible ring for drag target
const brushRing = svg.append("circle")
  .attr("r", radius * 0.97)
  .attr("fill", "transparent")
  .attr("stroke", "none")
  .style("cursor", "crosshair");

function angleFromEvent(event) {
  const [x, y] = d3.pointer(event, svg.node());
  // Offset for SVG viewBox center
  let a = Math.atan2(y, x) + Math.PI / 2;
  if (a < 0) a += 2 * Math.PI;
  return a;
}

function brushArc(startAngle, endAngle) {
  // Draw a ring sector for the brush
  const innerR = innerRadius;
  const outerR = radius;
  const a = d3.arc()
    .innerRadius(innerR)
    .outerRadius(outerR)
    .startAngle(startAngle)
    .endAngle(endAngle);
  return a();
}

let dragging = false;

brushRing.call(d3.drag()
  .on("start", function(event) {
    dragging = true;
    const a = angleFromEvent(event.sourceEvent);
    brushAngle = { start: a, end: a };
    brushOverlay.attr("d", "");
  })
  .on("drag", function(event) {
    if (!dragging) return;
    const a = angleFromEvent(event.sourceEvent);
    brushAngle.end = a;

    let s = brushAngle.start, e = brushAngle.end;
    // Normalize so we always draw the shorter arc in drag direction
    if (e < s) { [s, e] = [e, s]; }
    // If span > PI, the user probably wants the other direction
    if (e - s > Math.PI) {
      brushOverlay.attr("d", brushArc(e, s + 2 * Math.PI));
    } else {
      brushOverlay.attr("d", brushArc(s, e));
    }
    applyBrush();
  })
  .on("end", function() {
    dragging = false;
    if (brushAngle && Math.abs(brushAngle.end - brushAngle.start) < 0.02) {
      // Too small — clear
      brushAngle = null;
      brushOverlay.attr("d", "");
      applyBrush();
    }
  })
);

// Double-click to clear brush
brushRing.on("dblclick", () => {
  brushAngle = null;
  brushOverlay.attr("d", "");
  applyBrush();
});

function normalizeAngle(a) {
  return ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
}

function isAngleInBrush(midAngle) {
  if (!brushAngle) return true;
  let s = normalizeAngle(brushAngle.start);
  let e = normalizeAngle(brushAngle.end);

  // Determine brush range
  let bStart, bEnd;
  if (s <= e) {
    if (e - s <= Math.PI) { bStart = s; bEnd = e; }
    else { bStart = e; bEnd = s + 2 * Math.PI; }
  } else {
    if (s - e <= Math.PI) { bStart = e; bEnd = s; }
    else { bStart = s; bEnd = e + 2 * Math.PI; }
  }

  const m = normalizeAngle(midAngle);
  // Check if m is within [bStart, bEnd] (wrapping)
  if (bEnd > 2 * Math.PI) {
    return m >= bStart || m <= (bEnd - 2 * Math.PI);
  }
  return m >= bStart && m <= bEnd;
}

function applyBrush() {
  paths
    .transition().duration(150)
    .attr("fill", d => {
      const mid = (d.current.x0 + d.current.x1) / 2;
      if (!brushAngle || isAngleInBrush(mid)) return nodeColor(d);
      // Desaturate
      const c = d3.hcl(nodeColor(d));
      c.c = Math.max(0, c.c * 0.15);
      c.l = Math.min(95, c.l * 1.15);
      return c.toString();
    })
    .attr("opacity", d => {
      const mid = (d.current.x0 + d.current.x1) / 2;
      return (!brushAngle || isAngleInBrush(mid)) ? 1 : 0.45;
    });

  labels
    .transition().duration(150)
    .attr("fill-opacity", d => {
      if (!labelVisibleCurrent(d)) return 0;
      const mid = (d.current.x0 + d.current.x1) / 2;
      return (!brushAngle || isAngleInBrush(mid)) ? 1 : 0.25;
    });
}

function labelVisibleCurrent(d) {
  return d.current.y1 > innerRadius && d.current.y0 < radius
    && (d.current.x1 - d.current.x0) > 0.04;
}

// ── Tooltip ──
const tooltip = d3.select("#tooltip");

paths
  .on("pointerenter", function(event, d) {
    const chain = d.ancestors().map(a => a.data.name).reverse().slice(1).join(" › ");
    tooltip
      .style("opacity", 1)
      .html(`<strong>${chain}</strong><br>Value: ${d.value.toLocaleString()}`);
  })
  .on("pointermove", function(event) {
    const [x, y] = d3.pointer(event, document.getElementById("chart"));
    tooltip
      .style("left", (x + 14) + "px")
      .style("top", (y - 10) + "px");
  })
  .on("pointerleave", function() {
    tooltip.style("opacity", 0);
  });

</script>
</body>
</html>
