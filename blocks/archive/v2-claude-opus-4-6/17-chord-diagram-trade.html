<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Trade Flows — Chord Diagram</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #chart { position: relative; }
  h1 {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #b0b0c8;
    white-space: nowrap;
  }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(10, 10, 30, 0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    color: #d0d0e0;
    opacity: 0;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="chart">
  <h1>Bilateral Trade Flows Between 10 Economies (USD Billions)</h1>
  <div class="tooltip" id="tooltip"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// --- Synthetic asymmetric trade matrix (USD billions) ---
const countries = [
  "United States", "China", "Germany", "Japan", "United Kingdom",
  "France", "South Korea", "India", "Canada", "Mexico"
];
const n = countries.length;

// Row i → Col j = exports from i to j
const matrix = [
//  US   CN   DE   JP   UK   FR   KR   IN   CA   MX
  [  0, 124,  58,  75,  61,  37,  56,  27, 307, 265], // US
  [536,   0,  76,  134, 63,  29,  109, 74,  32,  18], // CN
  [ 135, 96,   0,  22,  82, 105,  15,  12,  10,  17], // DE
  [ 132, 137, 20,   0,  12,   8,  53,  10,  11,  14], // JP
  [  56,  23, 47,  10,   0,  34,   7,   9,   8,   4], // UK
  [  39,  21, 73,   8,  33,   0,   5,   6,   5,   3], // FR
  [  73,  162, 9,  25,   6,   4,   0,  13,   5,   3], // KR
  [  53,  15,  9,   5,  10,   5,   6,   0,   4,   3], // IN
  [ 294,  18, 5,  10,  13,   4,   4,   3,   0,   6], // CA
  [ 340,  4,   7,   5,   3,   2,   3,   2,  10,   0], // MX
];

// --- Dimensions ---
const width = 760, height = 760;
const outerRadius = Math.min(width, height) * 0.42;
const innerRadius = outerRadius - 24;

// --- Color scale (Tol muted, good for colorblind) ---
const colorValues = [
  "#332288", "#88CCEE", "#44AA99", "#117733", "#999933",
  "#DDCC77", "#CC6677", "#882255", "#AA4499", "#EE8866"
];
const color = d3.scaleOrdinal().domain(d3.range(n)).range(colorValues);

// --- Chord layout ---
const chord = d3.chord()
  .padAngle(0.04)
  .sortSubgroups(d3.descending)
  .sortChords(d3.descending);

const chords = chord(matrix);

const arc = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);
const ribbon = d3.ribbon().radius(innerRadius);

// --- SVG ---
const svg = d3.select("#chart")
  .append("svg")
    .attr("width", width)
    .attr("height", height)
    .attr("viewBox", [-width / 2, -height / 2, width, height]);

const g = svg.append("g");

// --- Tick helper ---
function groupTicks(d, step) {
  const k = (d.endAngle - d.startAngle) / d.value;
  return d3.range(0, d.value, step).map(value => ({
    value,
    angle: value * k + d.startAngle
  }));
}

// --- Draw arcs (initially zero-length for animation) ---
const groupG = g.append("g")
  .selectAll("g")
  .data(chords.groups)
  .join("g");

const arcPaths = groupG.append("path")
  .attr("fill", d => color(d.index))
  .attr("stroke", "rgba(255,255,255,0.08)")
  .each(function(d) {
    // Store start state for entrance animation (collapsed arc)
    const mid = (d.startAngle + d.endAngle) / 2;
    this._start = { startAngle: mid, endAngle: mid, value: d.value };
    this._end = d;
  })
  .attr("d", function() { return arc(this._start); });

// --- Tick marks (hidden initially) ---
const tickG = groupG.append("g")
  .style("opacity", 0)
  .selectAll("g")
  .data(d => groupTicks(d, 50)) // every 50B
  .join("g")
    .attr("transform", d =>
      `rotate(${d.angle * 180 / Math.PI - 90}) translate(${outerRadius},0)`);

tickG.append("line")
  .attr("x2", 5)
  .attr("stroke", "#808090");

tickG.filter(d => d.value % 100 === 0)
  .append("text")
    .attr("x", 8)
    .attr("dy", "0.35em")
    .attr("fill", "#999")
    .attr("font-size", "9px")
    .attr("transform", d => d.angle > Math.PI ? "rotate(180) translate(-16)" : null)
    .attr("text-anchor", d => d.angle > Math.PI ? "end" : null)
    .text(d => `${d.value}B`);

// --- Country labels (hidden initially) ---
const labels = groupG.append("text")
  .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
  .attr("dy", "0.35em")
  .attr("font-size", "11px")
  .attr("font-weight", 500)
  .attr("fill", d => d3.lab(color(d.index)).l > 60 ? "#222" : "#ddd")
  .attr("transform", d => {
    const rotate = d.angle * 180 / Math.PI - 90;
    const flip = d.angle > Math.PI;
    return `rotate(${rotate}) translate(${outerRadius + 24}) ${flip ? "rotate(180)" : ""}`;
  })
  .attr("text-anchor", d => d.angle > Math.PI ? "end" : "start")
  .text(d => countries[d.index])
  .style("opacity", 0);

// --- Chords (hidden initially) ---
const chordPaths = g.append("g")
    .attr("fill-opacity", 0.72)
  .selectAll("path")
  .data(chords)
  .join("path")
    .attr("d", ribbon)
    .attr("fill", d => color(d.source.index))
    .attr("stroke", "rgba(0,0,0,0.15)")
    .style("opacity", 0);

// --- Entrance animation ---
// Phase 1: arcs grow (0 → 600ms)
arcPaths.transition()
  .duration(600)
  .ease(d3.easeCubicOut)
  .attrTween("d", function(d) {
    const interp = d3.interpolate(this._start, d);
    return t => arc(interp(t));
  });

// Phase 2: labels + ticks appear (400ms)
labels.transition().delay(500).duration(400).style("opacity", 1);
groupG.selectAll("g").transition().delay(500).duration(400).style("opacity", 1);

// Phase 3: chords fade in (600ms, staggered)
chordPaths.transition()
  .delay((d, i) => 700 + i * 8)
  .duration(500)
  .ease(d3.easeCubicIn)
  .style("opacity", 1);

// --- Tooltip ---
const tooltip = d3.select("#tooltip");

function showTooltip(evt, html) {
  const rect = document.getElementById("chart").getBoundingClientRect();
  tooltip
    .html(html)
    .style("left", `${evt.clientX - rect.left + 14}px`)
    .style("top", `${evt.clientY - rect.top - 10}px`)
    .style("opacity", 1);
}
function hideTooltip() { tooltip.style("opacity", 0); }

const fmt = d3.format(",.0f");

// --- Hover: isolate a country's trade flows ---
groupG
  .on("pointerenter", function(evt, d) {
    // Dim all chords, highlight only those involving this group
    chordPaths.transition().duration(200)
      .style("opacity", c =>
        c.source.index === d.index || c.target.index === d.index ? 1 : 0.04
      );

    // Dim other arcs
    arcPaths.transition().duration(200)
      .style("opacity", a => a.index === d.index ? 1 : 0.25);

    const total = d3.sum(matrix[d.index]) + d3.sum(matrix.map(r => r[d.index]));
    const exp = d3.sum(matrix[d.index]);
    const imp = d3.sum(matrix.map(r => r[d.index]));
    showTooltip(evt,
      `<strong style="color:${color(d.index)}">${countries[d.index]}</strong><br>` +
      `Exports: $${fmt(exp)}B<br>Imports: $${fmt(imp)}B<br>` +
      `Total trade: $${fmt(total)}B`
    );
  })
  .on("pointermove", function(evt) {
    const rect = document.getElementById("chart").getBoundingClientRect();
    tooltip
      .style("left", `${evt.clientX - rect.left + 14}px`)
      .style("top", `${evt.clientY - rect.top - 10}px`);
  })
  .on("pointerleave", function() {
    chordPaths.transition().duration(300).style("opacity", 1);
    arcPaths.transition().duration(300).style("opacity", 1);
    hideTooltip();
  });

// --- Chord hover for specific bilateral flow ---
chordPaths
  .on("pointerenter", function(evt, d) {
    d3.select(this).raise().transition().duration(100).attr("fill-opacity", 0.9);
    const srcName = countries[d.source.index];
    const tgtName = countries[d.target.index];
    const fwd = matrix[d.source.index][d.target.index];
    const rev = matrix[d.target.index][d.source.index];
    showTooltip(evt,
      `<strong style="color:${color(d.source.index)}">${srcName}</strong> → ` +
      `<strong style="color:${color(d.target.index)}">${tgtName}</strong>: $${fmt(fwd)}B<br>` +
      `<strong style="color:${color(d.target.index)}">${tgtName}</strong> → ` +
      `<strong style="color:${color(d.source.index)}">${srcName}</strong>: $${fmt(rev)}B`
    );
  })
  .on("pointermove", function(evt) {
    const rect = document.getElementById("chart").getBoundingClientRect();
    tooltip
      .style("left", `${evt.clientX - rect.left + 14}px`)
      .style("top", `${evt.clientY - rect.top - 10}px`);
  })
  .on("pointerleave", function() {
    d3.select(this).transition().duration(200).attr("fill-opacity", 0.72);
    hideTooltip();
  });
</script>
</body>
</html>
