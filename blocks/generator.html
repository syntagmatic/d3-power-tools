<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Generator — D3 Power Tools</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px 24px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 18px; font-weight: 300; margin: 0 0 2px; }
  h1 b { font-weight: 500; }
  .lead { color: #888; font-size: 12px; margin: 0 0 14px; }
  button {
    background: #1a1a1a; color: #eee; border: 1px solid #333;
    border-radius: 0; padding: 4px 12px; font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  button:hover { background: #282828; border-color: #555; }
  button.primary { background: #3182bd; border-color: #3182bd; }
  button.primary:hover { background: #2171a5; }

  .filters {
    display: flex; gap: 4px; flex-wrap: wrap;
    margin-bottom: 12px; align-items: center;
  }
  .filter-btn {
    padding: 2px 8px; font-size: 10px;
    border-radius: 0; background: #1a1a2e;
    border: 1px solid #2a2a3e; color: #7b93db;
  }
  .filter-btn:hover { background: #252540; border-color: #3a3a5e; }
  .filter-btn.active { background: #3182bd; border-color: #3182bd; color: #fff; }
  .filter-label {
    font-size: 10px; color: #555; padding: 2px 0;
    margin-right: 2px; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .pager {
    display: flex; gap: 6px; align-items: center;
    justify-content: center; margin-top: 14px; padding: 8px 0;
  }
  .pager-info {
    font-size: 11px; color: #555; margin: 0 6px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px;
  }

  /* ── Block card ── */
  .block {
    background: #1a1a1a;
    overflow: hidden; border: 1px solid #222;
  }

  /* ── Header: title + tabs on one line ── */
  .block-bar {
    display: flex; align-items: stretch;
    border-bottom: 1px solid #222;
    background: #151515;
  }
  .block-title {
    font-size: 11px; font-weight: 600; margin: 0;
    padding: 4px 10px;
    display: flex; align-items: center;
    border-right: 1px solid #222;
    white-space: nowrap;
    color: #ccc;
  }
  .tab {
    padding: 4px 8px; font-size: 10px; color: #555;
    cursor: pointer; border: none; background: none;
    border-bottom: 2px solid transparent;
    font-family: inherit; border-radius: 0;
  }
  .tab:hover { color: #aaa; background: none; }
  .tab.active { color: #eee; border-bottom-color: #3182bd; background: none; }

  /* ── Tab panels ── */
  .panel { display: none !important; }
  .panel.active { display: block !important; }
  .panel-skills.active { display: flex !important; }

  .panel-demo svg, .panel-demo canvas {
    display: block; width: 100%; height: 180px; background: #0a0a0a;
  }

  .panel-prompt, .panel-code {
    padding: 8px 10px; font-size: 11px; line-height: 1.5;
    max-height: 240px; overflow-y: auto;
  }
  .panel-prompt { color: #b8c9e0; white-space: pre-wrap; }
  .panel-code pre {
    margin: 0; white-space: pre-wrap; word-break: break-all;
    color: #a8d8a8; font-size: 10px; font-family: "SF Mono", Menlo, monospace;
  }

  /* ── Controls toggle + panel ── */
  .ctrl-toggle {
    display: flex; align-items: center;
    padding: 0; border: none; border-top: 1px solid #222;
    background: #181818; width: 100%;
    cursor: pointer; font-family: inherit;
    font-size: 10px; color: #666;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .ctrl-toggle:hover { background: #1e1e1e; color: #999; }
  .ctrl-toggle .ctrl-arrow {
    padding: 4px 8px; color: #3182bd; font-size: 12px;
    flex-shrink: 0;
  }
  .ctrl-toggle .ctrl-label { padding: 4px 0; }
  .ctrl-toggle.hidden { display: none; }

  .inline-controls {
    padding: 6px 10px 4px;
    background: #141414;
    border-top: 1px solid #1e1e1e;
  }
  .inline-controls.hidden { display: none; }
  .param-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 3px; font-size: 10px;
  }
  .param-row label {
    width: 80px; flex-shrink: 0; color: #555;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .param-row input[type=range] {
    flex: 1; accent-color: #3182bd; height: 12px;
    -webkit-appearance: none; appearance: none;
    background: transparent;
  }
  .param-row input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: #2a2a2a; border-radius: 0;
  }
  .param-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 10px; height: 10px; background: #3182bd;
    border-radius: 0; margin-top: -3.5px; cursor: pointer;
  }
  .param-row input[type=range]::-moz-range-track {
    height: 3px; background: #2a2a2a; border: none;
  }
  .param-row input[type=range]::-moz-range-thumb {
    width: 10px; height: 10px; background: #3182bd;
    border-radius: 0; border: none; cursor: pointer;
  }
  .param-row .param-val {
    width: 34px; text-align: right; color: #4a6a8a;
    font-family: "SF Mono", Menlo, monospace; font-size: 9px;
  }
  .param-row select {
    flex: 1; background: #1a1a1a; color: #ccc; border: 1px solid #333;
    border-radius: 0; padding: 1px 4px; font-size: 10px; font-family: inherit;
  }

  .panel-skills {
    padding: 8px 10px; flex-wrap: wrap; gap: 4px;
  }
  .tag {
    display: inline-block; background: #1a1a2e; color: #7b93db;
    font-size: 9px; padding: 1px 5px;
  }

  /* scrollbar */
  .panel-prompt::-webkit-scrollbar, .panel-code::-webkit-scrollbar {
    width: 3px;
  }
  .panel-prompt::-webkit-scrollbar-thumb, .panel-code::-webkit-scrollbar-thumb {
    background: #333;
  }
</style>
</head>
<body>

<h1><b>Block</b> Generator</h1>
<p class="lead">Animated D3 compositions — each one combines multiple skills.</p>

<div class="filters" id="filters">
  <span class="filter-label">Filter:</span>
</div>

<div class="grid" id="grid"></div>

<div class="pager" id="pager"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const W = 320, H = 180;

// ── Utilities ───────────────────────────────────────────────────────

const palettes = {
  tableau: d3.schemeTableau10,
  blues: ["#08519c","#3182bd","#6baed6","#9ecae1","#c6dbef"],
  warm: ["#e6550d","#fd8d3c","#fdae6b","#fdd0a2","#feedde"],
  cool: ["#756bb1","#9e9ac8","#bcbddc","#dadaeb","#f2f0f7"],
  greens: ["#006d2c","#31a354","#74c476","#a1d99b","#c7e9c0"],
  neon: ["#39ff14","#ff073a","#00f0ff","#ff6ec7","#ffff33"],
  mono: ["#fff","#ccc","#999","#666","#333"],
};

function rng(lo, hi) { return lo + Math.random() * (hi - lo); }
function rint(lo, hi) { return Math.floor(rng(lo, hi)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ── Generator registry ──────────────────────────────────────────────
// Each generator defines:
//   name, prompt, skills,
//   params: [{key, label, type, min, max, step, default, options}],
//   make(svg, params)  — renders into svg using params
//   code(params)        — returns the code string

const generators = [

// ────────────────────────────────────────────────────────────────────
{
  name: "Orbital Particles",
  prompt: `Create an animation of particles orbiting a central point on elliptical paths.
Multiple orbital rings at different radii and tilts, each holding several particles.
Particles pulse in opacity as they travel. Use a random color palette.`,
  skills: ["force-simulation", "animated-transitions", "color-and-compositing"],
  params: [
    { key: "nOrbits",  label: "Orbits",       type: "range", min: 2,   max: 10,  step: 1,    default: 5  },
    { key: "nPerOrbit",label: "Per orbit",     type: "range", min: 2,   max: 12,  step: 1,    default: 5  },
    { key: "maxRadius",label: "Max radius",    type: "range", min: 30,  max: 150, step: 5,    default: 80 },
    { key: "dotSize",  label: "Dot size",      type: "range", min: 1,   max: 8,   step: 0.5,  default: 3  },
    { key: "speed",    label: "Speed",         type: "range", min: 0.1, max: 2,   step: 0.1,  default: 0.7},
    { key: "palette",  label: "Palette",       type: "select", options: Object.keys(palettes), default: "tableau" },
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const g = svg.append("g").attr("transform", `translate(${W/2},${H/2})`);
    const particles = [];
    for (let o = 0; o < p.nOrbits; o++) {
      const rx = rng(20, p.maxRadius), ry = rng(15, p.maxRadius * 0.7);
      const spd = rng(0.3, 1.2) * p.speed * (Math.random() > 0.5 ? 1 : -1);
      const tilt = rng(-0.3, 0.3);
      for (let i = 0; i < p.nPerOrbit; i++) {
        particles.push({ rx, ry, speed: spd, tilt, phase: (i / p.nPerOrbit) * Math.PI * 2,
          color: pal[o % pal.length], r: rng(p.dotSize * 0.6, p.dotSize * 1.4) });
      }
    }
    const dots = g.selectAll("circle").data(particles).join("circle")
      .attr("fill", d => d.color).attr("r", d => d.r);
    d3.timer(t => {
      dots.each(function(d) {
        const a = d.phase + t / 1000 * d.speed;
        d3.select(this).attr("cx", d.rx * Math.cos(a)).attr("cy", d.ry * Math.sin(a) * Math.cos(d.tilt))
          .attr("opacity", 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(a)));
      });
    });
  },
  code(p) {
    return `const pal = ${JSON.stringify(palettes[p.palette])};
const g = svg.append("g").attr("transform", \`translate(\${W/2},\${H/2})\`);
const particles = [];
for (let o = 0; o < ${p.nOrbits}; o++) {
  const rx = rng(20, ${p.maxRadius}), ry = rng(15, ${(p.maxRadius * 0.7).toFixed(0)});
  const spd = rng(0.3, 1.2) * ${p.speed} * (Math.random() > 0.5 ? 1 : -1);
  const tilt = rng(-0.3, 0.3);
  for (let i = 0; i < ${p.nPerOrbit}; i++) {
    particles.push({ rx, ry, speed: spd, tilt,
      phase: (i / ${p.nPerOrbit}) * Math.PI * 2,
      color: pal[o % pal.length],
      r: rng(${(p.dotSize*0.6).toFixed(1)}, ${(p.dotSize*1.4).toFixed(1)}) });
  }
}
const dots = g.selectAll("circle").data(particles).join("circle")
  .attr("fill", d => d.color).attr("r", d => d.r);
d3.timer(t => {
  dots.each(function(d) {
    const a = d.phase + t / 1000 * d.speed;
    d3.select(this)
      .attr("cx", d.rx * Math.cos(a))
      .attr("cy", d.ry * Math.sin(a) * Math.cos(d.tilt))
      .attr("opacity", 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(a)));
  });
});`;
  }
},

// ────────────────────────────────────────────────────────────────────
{
  name: "Wave Interference",
  prompt: `Create a canvas-based pixel field showing interference patterns from multiple wave sources.
Each source emits concentric waves; overlapping waves add together.
Animate the phase to make the pattern shift continuously. Map wave amplitude to color.`,
  skills: ["canvas-rendering", "animated-transitions", "color-and-compositing"],
  params: [
    { key: "nSources", label: "Sources",    type: "range", min: 2,   max: 6,   step: 1,    default: 3  },
    { key: "freq",     label: "Frequency",   type: "range", min: 0.01,max: 0.12,step: 0.005,default: 0.05},
    { key: "speed",    label: "Speed",       type: "range", min: 0.5, max: 5,   step: 0.5,  default: 2  },
    { key: "cellSize", label: "Pixel size",  type: "range", min: 2,   max: 8,   step: 1,    default: 4  },
    { key: "palette",  label: "Palette",     type: "select", options: Object.keys(palettes), default: "cool" },
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const fo = svg.append("foreignObject").attr("width", W).attr("height", H);
    const canvas = fo.append("xhtml:canvas").attr("width", W).attr("height", H)
      .style("width", "100%").style("height", "100%");
    const ctx = canvas.node().getContext("2d");
    const sources = d3.range(p.nSources).map(() => ({
      x: rng(0, W), y: rng(0, H), freq: rng(p.freq * 0.6, p.freq * 1.4),
      speed: rng(p.speed * 0.3, p.speed) / 1000, amp: rng(0.3, 1)
    }));
    const colorScale = d3.scaleSequential(t => d3.interpolateRgb(pal[0], pal[pal.length-1])(t));
    d3.timer(t => {
      ctx.clearRect(0, 0, W, H);
      for (let x = 0; x < W; x += p.cellSize) {
        for (let y = 0; y < H; y += p.cellSize) {
          let v = 0;
          for (const s of sources) {
            const dist = Math.sqrt((x-s.x)**2 + (y-s.y)**2);
            v += s.amp * Math.sin(dist * s.freq - t * s.speed);
          }
          ctx.fillStyle = colorScale((v / sources.length + 1) / 2);
          ctx.globalAlpha = 0.8;
          ctx.fillRect(x, y, p.cellSize, p.cellSize);
        }
      }
    });
  },
  code(p) {
    return `const pal = ${JSON.stringify(palettes[p.palette])};
const canvas = /* ... canvas element ... */;
const ctx = canvas.getContext("2d");
const sources = d3.range(${p.nSources}).map(() => ({
  x: rng(0, W), y: rng(0, H),
  freq: rng(${(p.freq*0.6).toFixed(3)}, ${(p.freq*1.4).toFixed(3)}),
  speed: rng(${(p.speed*0.3/1000).toFixed(5)}, ${(p.speed/1000).toFixed(4)}),
  amp: rng(0.3, 1)
}));
const colorScale = d3.scaleSequential(t =>
  d3.interpolateRgb(pal[0], pal[pal.length-1])(t));
d3.timer(t => {
  ctx.clearRect(0, 0, W, H);
  for (let x = 0; x < W; x += ${p.cellSize}) {
    for (let y = 0; y < H; y += ${p.cellSize}) {
      let v = 0;
      for (const s of sources) {
        const dist = Math.sqrt((x-s.x)**2 + (y-s.y)**2);
        v += s.amp * Math.sin(dist * s.freq - t * s.speed);
      }
      ctx.fillStyle = colorScale((v / sources.length + 1) / 2);
      ctx.globalAlpha = 0.8;
      ctx.fillRect(x, y, ${p.cellSize}, ${p.cellSize});
    }
  }
});`;
  }
},

// ────────────────────────────────────────────────────────────────────
{
  name: "Morphing Polygon",
  prompt: `Animate a shape that smoothly morphs between geometric forms: circle, triangle, pentagon, hexagon, and stars.
Resample each shape to the same number of points, then interpolate between them.
Slowly rotate the hue over time.`,
  skills: ["shape-morphing", "animated-transitions", "color-and-compositing"],
  params: [
    { key: "nShapes",  label: "Shapes",       type: "range", min: 2,  max: 6,    step: 1,   default: 4  },
    { key: "radius",   label: "Radius",       type: "range", min: 20, max: 80,   step: 5,   default: 60 },
    { key: "nPts",     label: "Sample pts",   type: "range", min: 24, max: 128,  step: 8,   default: 64 },
    { key: "transDur", label: "Trans (ms)",   type: "range", min: 500,max: 3000, step: 100, default: 1500},
    { key: "holdDur",  label: "Hold (ms)",    type: "range", min: 500,max: 3000, step: 100, default: 1500},
    { key: "strokeW",  label: "Stroke",       type: "range", min: 0,  max: 4,    step: 0.5, default: 1.5},
  ],
  make(svg, p) {
    const g = svg.append("g").attr("transform", `translate(${W/2},${H/2})`);
    const r = p.radius;
    function polyPts(sides, rotation = 0) {
      return d3.range(p.nPts).map(i => {
        const a = (i / p.nPts) * Math.PI * 2 + rotation;
        const frac = (a % (Math.PI * 2 / sides)) / (Math.PI * 2 / sides);
        const pr = r / Math.cos(Math.PI/sides) * Math.cos(Math.PI/sides - Math.abs(frac-0.5)*Math.PI*2/sides);
        return [pr * Math.cos(a), pr * Math.sin(a)];
      });
    }
    function starPts(points, outer, inner) {
      return d3.range(p.nPts).map(i => {
        const a = (i / p.nPts) * Math.PI * 2 - Math.PI / 2;
        const spoke = Math.floor((i / p.nPts) * points * 2);
        const t = (i / p.nPts * points * 2) % 1;
        const prevR = spoke % 2 === 0 ? inner : outer;
        const curR = spoke % 2 === 0 ? outer : inner;
        const smoothR = prevR + (curR - prevR) * (0.5 - 0.5 * Math.cos(t * Math.PI));
        return [smoothR * Math.cos(a), smoothR * Math.sin(a)];
      });
    }
    const allShapes = [
      d3.range(p.nPts).map(i => { const a=(i/p.nPts)*Math.PI*2; return [r*Math.cos(a), r*Math.sin(a)]; }),
      polyPts(3), polyPts(5), polyPts(6, Math.PI/6),
      starPts(5, r*0.9, r*0.4), starPts(8, r*0.85, r*0.5),
    ].slice(0, p.nShapes);
    const path = g.append("path").attr("opacity", 0.8).attr("stroke", "#fff").attr("stroke-width", p.strokeW);
    const cycleDur = (p.transDur + p.holdDur) * allShapes.length;
    d3.timer(t => {
      const cycleT = t % cycleDur;
      const seg = Math.floor(cycleT / (p.transDur + p.holdDur));
      const segT = cycleT - seg * (p.transDur + p.holdDur);
      const pr = segT < p.transDur ? d3.easeCubicInOut(segT / p.transDur) : 1;
      const from = allShapes[seg], to = allShapes[(seg+1) % allShapes.length];
      const pts = from.map((fp, i) => [fp[0]+(to[i][0]-fp[0])*pr, fp[1]+(to[i][1]-fp[1])*pr]);
      path.attr("d", "M"+pts.map(q => q[0].toFixed(1)+","+q[1].toFixed(1)).join("L")+"Z")
        .attr("fill", d3.hsl((t/8000*360)%360, 0.6, 0.5));
    });
  },
  code(p) {
    return `// Morphing polygon — ${p.nShapes} shapes, ${p.nPts} sample points
const r = ${p.radius};
const shapes = [circle, ${["triangle","pentagon","hexagon","star5","star8"].slice(0, p.nShapes-1).join(", ")}];
// Each shape resampled to ${p.nPts} evenly-spaced [x,y] points
const path = g.append("path").attr("stroke-width", ${p.strokeW});
const cycleDur = (${p.transDur} + ${p.holdDur}) * shapes.length;
d3.timer(t => {
  const seg = Math.floor((t % cycleDur) / ${p.transDur + p.holdDur});
  const segT = (t % cycleDur) - seg * ${p.transDur + p.holdDur};
  const p = segT < ${p.transDur} ? d3.easeCubicInOut(segT / ${p.transDur}) : 1;
  const pts = shapes[seg].map((fp, i) => [
    fp[0] + (shapes[(seg+1) % shapes.length][i][0] - fp[0]) * p,
    fp[1] + (shapes[(seg+1) % shapes.length][i][1] - fp[1]) * p,
  ]);
  path.attr("d", "M" + pts.map(q => q.join(",")).join("L") + "Z")
    .attr("fill", d3.hsl((t / 8000 * 360) % 360, 0.6, 0.5));
});`;
  }
},

// ────────────────────────────────────────────────────────────────────
{
  name: "Rising Bubbles",
  prompt: `Create an animation of bubbles rising from the bottom of the viewport.
Each bubble has a random size, speed, and gentle horizontal wobble.
Bubbles fade in as they rise and reset to the bottom when they leave the top.`,
  skills: ["force-simulation", "animated-transitions", "color-and-compositing"],
  params: [
    { key: "count",   label: "Bubbles",     type: "range", min: 10, max: 100, step: 5,   default: 40 },
    { key: "maxR",    label: "Max size",     type: "range", min: 3,  max: 20,  step: 1,   default: 10 },
    { key: "speed",   label: "Speed",        type: "range", min: 0.1,max: 2,   step: 0.1, default: 0.8},
    { key: "wobble",  label: "Wobble",       type: "range", min: 0,  max: 20,  step: 1,   default: 8  },
    { key: "palette", label: "Palette",      type: "select", options: Object.keys(palettes), default: "blues"},
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const bubbles = d3.range(p.count).map(() => ({
      x: rng(10, W-10), y: rng(0, H+200), r: rng(2, p.maxR),
      speed: rng(0.3, 1.2) * p.speed, wobbleF: rng(0.5, 2),
      phase: rng(0, Math.PI*2), color: pick(pal),
    }));
    const circles = svg.selectAll("circle").data(bubbles).join("circle")
      .attr("fill", d => d.color).attr("stroke", d => d3.color(d.color).brighter(0.5))
      .attr("stroke-width", 0.5);
    d3.timer(t => {
      circles.each(function(d) {
        d.y -= d.speed * 0.3;
        if (d.y < -d.r*2) { d.y = H + d.r*2; d.x = rng(10, W-10); }
        d3.select(this).attr("cx", d.x + Math.sin(t/500*d.wobbleF+d.phase)*p.wobble)
          .attr("cy", d.y).attr("r", d.r)
          .attr("opacity", 0.3 + 0.5 * Math.min(1, (H-d.y)/H));
      });
    });
  },
  code(p) {
    return `const pal = ${JSON.stringify(palettes[p.palette])};
const bubbles = d3.range(${p.count}).map(() => ({
  x: rng(10, W-10), y: rng(0, H+200),
  r: rng(2, ${p.maxR}),
  speed: rng(0.3, 1.2) * ${p.speed},
  wobbleF: rng(0.5, 2),
  phase: rng(0, Math.PI*2),
  color: pick(pal),
}));
const circles = svg.selectAll("circle").data(bubbles).join("circle")
  .attr("fill", d => d.color)

{

  skills: ["hierarchy-layouts", "animated-transitions", "color-and-compositing"],
  params: [
    { key: "nCells",   label: "Cells",      type: "range", min: 4,  max: 24,  step: 2,   default: 12 },

    { key: "speed",    label: "Speed",       type: "range", min: 300,max: 2000,step: 100, default: 1000},

  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const rawData = { children: d3.range(p.nCells).map(i => ({ id: i, baseValue: 10 + Math.random()*90 })) };
    const rects = svg.selectAll("rect").data(d3.range(p.nCells)).join("rect")
      .attr("rx", 2).attr("stroke", "#111").attr("stroke-width", 1);
    d3.timer(t => {
      rawData.children.forEach((d, i) => { d.value = d.baseValue * (1 + p.breathAmp * Math.sin(t/p.speed + i*0.8)); });
      const root = d3.hierarchy(rawData).sum(d => d.value);
      d3.treemap().size([W, H]).padding(2).round(true)(root);
      const leaves = root.leaves();
      rects.each(function(d, i) {
        if (i < leaves.length) {
          const lf = leaves[i];
          d3.select(this).attr("x", lf.x0).attr("y", lf.y0)
            .attr("width", lf.x1-lf.x0).attr("height", lf.y1-lf.y0)
            .attr("fill", pal[i % pal.length]).attr("opacity", 0.7);
        }
      });
    });
  },
  code(p) {
    return `const pal = ${JSON.stringify(palettes[p.palette])};

  prompt: `Create a stack of sine waves filling the viewport as layered area charts.

  skills: ["data-preparation", "axes-and-scales", "animated-transitions"],
  params: [
    { key: "nLayers", label: "Layers",     type: "range", min: 3,  max: 12, step: 1,   default: 6  },

  make(svg, p) {

      .x((d, i) => (i / (nPts - 1)) * W)
      .y0(d => d[0]).y1(d => d[1]);
    const paths = svg.selectAll("path").data(d3.range(p.nLayers)).join("path")

{
  name: "Sunburst Spin",
  prompt: `Create a sunburst partition layout from random hierarchical data.
Slowly rotate the entire sunburst. Cycle the color hue over time so
sectors shift color while maintaining relative contrast between depths.`,
  skills: ["hierarchy-layouts", "animated-transitions", "color-and-compositing"],
  params: [
    { key: "nGroups",  label: "Groups",      type: "range", min: 3,  max: 8,  step: 1,    default: 5  },
    { key: "maxDepth", label: "Max depth",    type: "range", min: 2,  max: 4,  step: 1,    default: 3  },
    { key: "speed",    label: "Spin speed",   type: "range", min: 1,  max: 20, step: 1,    default: 6  },
    { key: "hueSpeed", label: "Hue speed",    type: "range", min: 1,  max: 30, step: 1,    default: 10 },
    { key: "palette",  label: "Palette",      type: "select", options: Object.keys(palettes), default: "tableau"},
  ],
  make(svg, p) {
    const g = svg.append("g").attr("transform", `translate(${W/2},${H/2})`);
    const r = Math.min(W, H) / 2 - 6;
    function makeChildren(depth) {
      if (depth >= p.maxDepth) return undefined;
      const n = rint(2, 5);
      return d3.range(n).map(() => ({ value: rng(5, 30), children: makeChildren(depth + 1) }));
    }
    const data = { children: d3.range(p.nGroups).map(() => ({ children: makeChildren(1) || [{ value: rng(5, 30) }] })) };
    const root = d3.hierarchy(data).sum(d => d.value);
    d3.partition().size([2 * Math.PI, r])(root);
    const arc = d3.arc().startAngle(d => d.x0).endAngle(d => d.x1)
      .innerRadius(d => d.y0).outerRadius(d => d.y1);
    const descendants = root.descendants().filter(d => d.depth);
    const paths = g.selectAll("path").data(descendants).join("path")
      .attr("d", arc).attr("stroke", "#111").attr("stroke-width", 0.5);
    d3.timer(t => {
      g.attr("transform", `translate(${W/2},${H/2}) rotate(${t / 1000 * p.speed})`);
      const hueShift = (t / 1000 * p.hueSpeed) % 360;
      paths.each(function(d, i) {
        const hue = (i * 37 + hueShift) % 360;
        const light = 35 + d.depth * 12;
        d3.select(this).attr("fill", d3.hsl(hue, 0.65, light / 100));
      });
    });
  },
  code(p) {
    return `const r = Math.min(W, H) / 2 - 6;
const root = d3.hierarchy(data).sum(d => d.value);
d3.partition().size([2 * Math.PI, r])(root);
const arc = d3.arc()
  .startAngle(d => d.x0).endAngle(d => d.x1)
  .innerRadius(d => d.y0).outerRadius(d => d.y1);
const paths = g.selectAll("path")
  .data(root.descendants().filter(d => d.depth))
  .join("path").attr("d", arc);
d3.timer(t => {
  g.attr("transform",
    \`translate(\${W/2},\${H/2}) rotate(\${t / 1000 * ${p.speed}})\`);
  const hueShift = (t / 1000 * ${p.hueSpeed}) % 360;
  paths.each(function(d, i) {
    const hue = (i * 37 + hueShift) % 360;
    d3.select(this).attr("fill", d3.hsl(hue, 0.65, (35 + d.depth * 12) / 100));
  });
});`;
  }
},

{
  name: "Arc Diagram",
  prompt: `Create an arc diagram: nodes arranged on a horizontal line with curved arcs
connecting pairs above. Animate arc opacity in a staggered wave so connections
light up in sequence. Nodes pulse gently.`,
  skills: ["network-visualization", "animated-transitions", "axes-and-scales"],
  params: [
    { key: "nNodes",  label: "Nodes",       type: "range", min: 8,   max: 30,  step: 2,   default: 16 },
    { key: "nLinks",  label: "Links",       type: "range", min: 6,   max: 40,  step: 2,   default: 20 },
    { key: "arcH",    label: "Arc height",   type: "range", min: 0.3, max: 1,   step: 0.1, default: 0.6},
    { key: "speed",   label: "Speed",        type: "range", min: 200, max: 1500,step: 100, default: 600},
    { key: "palette", label: "Palette",      type: "select", options: Object.keys(palettes), default: "tableau"},
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const m = { l: 15, r: 15, b: 30 };
    const baseY = H - m.b;
    const nodes = d3.range(p.nNodes).map(i => ({
      x: m.l + (i / (p.nNodes - 1)) * (W - m.l - m.r), y: baseY,
    }));
    const links = d3.range(p.nLinks).map(() => {
      let s = rint(0, p.nNodes), t = rint(0, p.nNodes);
      while (t === s) t = rint(0, p.nNodes);
      if (s > t) [s, t] = [t, s];
      return { s, t };
    });
    links.forEach(lk => {
      const sx = nodes[lk.s].x, tx = nodes[lk.t].x;
      const mx = (sx + tx) / 2, arcR = (tx - sx) / 2 * p.arcH;
      svg.append("path")
        .attr("d", `M${sx},${baseY} Q${mx},${baseY - arcR * 2} ${tx},${baseY}`)
        .attr("fill", "none").attr("stroke", pal[lk.s % pal.length])
        .attr("stroke-width", 1).attr("class", "arc-link")
        .datum(lk);
    });
    const arcLinks = svg.selectAll(".arc-link");
    const dots = svg.selectAll("circle").data(nodes).join("circle")
      .attr("cx", d => d.x).attr("cy", d => d.y)
      .attr("fill", (d, i) => pal[i % pal.length]);
    d3.timer(t => {
      dots.attr("r", (d, i) => 3 + Math.sin(t / 400 + i * 0.3) * 1);
      arcLinks.attr("opacity", function(d, i) {
        return 0.15 + 0.6 * Math.max(0, Math.sin(t / p.speed - i * 0.4));
      });
    });
  },
  code(p) {
    return `const pal = ${JSON.stringify(palettes[p.palette])};
const baseY = H - 30;
const nodes = d3.range(${p.nNodes}).map(i => ({
  x: 15 + (i / ${p.nNodes - 1}) * (W - 30), y: baseY,
}));
const links = d3.range(${p.nLinks}).map(() => {
  let s = rint(0, ${p.nNodes}), t = rint(0, ${p.nNodes});
  while (t === s) t = rint(0, ${p.nNodes});
  return s < t ? { s, t } : { s: t, t: s };
});
// draw quadratic arcs above baseline
links.forEach(lk => {
  const sx = nodes[lk.s].x, tx = nodes[lk.t].x;
  const mx = (sx + tx) / 2, arcR = (tx - sx) / 2 * ${p.arcH};
  svg.append("path")
    .attr("d", \`M\${sx},\${baseY} Q\${mx},\${baseY - arcR * 2} \${tx},\${baseY}\`)
    .attr("fill", "none").attr("stroke", pal[lk.s % pal.length]);
});
d3.timer(t => {
  arcLinks.attr("opacity", (d, i) =>
    0.15 + 0.6 * Math.max(0, Math.sin(t / ${p.speed} - i * 0.4)));
});`;
  }
},

// ────────────────────────────────────────────────────────────────────
{
  name: "Hexbin Pulse",
  prompt: `Fill the viewport with a hexagonal grid. Assign each hex a random value
that oscillates over time. Map values to color and opacity, creating
a heatmap that pulses and shifts like a living organism.`,
  skills: ["data-preparation", "color-and-compositing", "animated-transitions"],
  params: [
    { key: "hexR",    label: "Hex radius",   type: "range", min: 6,  max: 20, step: 1,   default: 12 },
    { key: "speed",   label: "Speed",        type: "range", min: 300,max: 2000,step: 100, default: 800},
    { key: "palette", label: "Palette",      type: "select", options: Object.keys(palettes), default: "warm"},
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const r = p.hexR;
    // pointy-top hex: width = sqrt(3)*r, height = 2*r
    const hexW = Math.sqrt(3) * r, hexH = 2 * r;
    const hexes = [];
    for (let row = -1; row * hexH * 0.75 < H + hexH; row++) {
      const yOff = row % 2 === 0 ? 0 : hexW * 0.5;
      for (let col = -1; col * hexW < W + hexW; col++) {
        hexes.push({ x: yOff + col * hexW, y: row * hexH * 0.75, phase: rng(0, Math.PI * 2) });
      }
    }
    function hexPath(cx, cy) {
      const pts = d3.range(6).map(i => {
        const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      });
      return "M" + pts.map(q => q[0].toFixed(1)+","+q[1].toFixed(1)).join("L") + "Z";
    }
    const paths = svg.selectAll("path").data(hexes).join("path")
      .attr("d", d => hexPath(d.x, d.y)).attr("stroke", "#111").attr("stroke-width", 0.5);
    d3.timer(t => {
      paths.each(function(d) {
        const val = (Math.sin(t / p.speed + d.phase + d.x * 0.02 + d.y * 0.03) + 1) / 2;
        d3.select(this)
          .attr("fill", pal[Math.floor(val * (pal.length - 1))])
          .attr("opacity", 0.3 + val * 0.7);
      });
    });
  },
  code(p) {
    return `const pal = ${JSON.stringify(palettes[p.palette])};
const r = ${p.hexR};
// pointy-top hex: width = sqrt(3)*r, height = 2*r
const hexW = Math.sqrt(3) * r, hexH = 2 * r;
const hexes = [];
for (let row = -1; row * hexH * 0.75 < H + hexH; row++) {
  const yOff = row % 2 === 0 ? 0 : hexW * 0.5;
  for (let col = -1; col * hexW < W + hexW; col++)
    hexes.push({ x: yOff + col * hexW, y: row * hexH * 0.75,
      phase: rng(0, Math.PI * 2) });
}
// hexPath: 6-point pointy-top polygon centered at (cx, cy)
const paths = svg.selectAll("path").data(hexes).join("path")
  .attr("d", d => hexPath(d.x, d.y));
d3.timer(t => {
  paths.each(function(d) {
    const val = (Math.sin(t / ${p.speed} + d.phase + d.x * 0.02 + d.y * 0.03) + 1) / 2;
    d3.select(this)
      .attr("fill", pal[Math.floor(val * (pal.length - 1))])
      .attr("opacity", 0.3 + val * 0.7);
  });
});`;
  }
},

// ────────────────────────────────────────────────────────────────────
{
  name: "Gravity Wells",
  prompt: `Simulate particles drawn toward orbiting attractor points.
Attractors move on slow circular paths. Particles accelerate toward the
nearest attractor, creating swirling streams. Particles that get too close respawn.`,
  skills: ["force-simulation", "animated-transitions", "canvas-rendering"],
  params: [
    { key: "nParts",    label: "Particles",  type: "range", min: 50,  max: 300, step: 25,  default: 150},
    { key: "nAttract",  label: "Attractors",  type: "range", min: 1,   max: 5,   step: 1,   default: 2  },
    { key: "strength",  label: "Gravity",     type: "range", min: 0.01,max: 0.1, step: 0.01,default: 0.03},
    { key: "palette",   label: "Palette",     type: "select", options: Object.keys(palettes), default: "cool"},
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const attractors = d3.range(p.nAttract).map(i => ({
      cx: W/2, cy: H/2, orbitR: rng(20, 60), speed: rng(0.0005, 0.002),
      phase: (i / p.nAttract) * Math.PI * 2,
    }));
    const parts = d3.range(p.nParts).map(() => ({
      x: rng(0, W), y: rng(0, H), vx: 0, vy: 0, color: pick(pal),
    }));
    const dots = svg.selectAll("circle.pt").data(parts).join("circle")
      .attr("class", "pt").attr("r", 1.5).attr("fill", d => d.color);
    const wells = svg.selectAll("circle.well").data(attractors).join("circle")
      .attr("class", "well").attr("r", 4)
      .attr("fill", "none").attr("stroke", "#fff").attr("stroke-width", 0.5).attr("opacity", 0.3);
    d3.timer(t => {
      attractors.forEach(a => {
        a.x = W/2 + a.orbitR * Math.cos(t * a.speed + a.phase);
        a.y = H/2 + a.orbitR * Math.sin(t * a.speed + a.phase);
      });
      wells.attr("cx", d => d.x).attr("cy", d => d.y);
      parts.forEach(pt => {
        let ax = 0, ay = 0;
        attractors.forEach(a => {
          const dx = a.x - pt.x, dy = a.y - pt.y;
          const dist = Math.max(5, Math.sqrt(dx*dx + dy*dy));
          if (dist < 3) { pt.x = rng(0, W); pt.y = rng(0, H); pt.vx = 0; pt.vy = 0; return; }
          ax += (dx / dist) * p.strength; ay += (dy / dist) * p.strength;
        });
        pt.vx = (pt.vx + ax) * 0.99; pt.vy = (pt.vy + ay) * 0.99;
        pt.x += pt.vx; pt.y += pt.vy;
        if (pt.x < 0 || pt.x > W || pt.y < 0 || pt.y > H) {
          pt.x = rng(0, W); pt.y = rng(0, H); pt.vx = 0; pt.vy = 0;
        }
      });
      dots.attr("cx", d => d.x).attr("cy", d => d.y)
        .attr("opacity", d => 0.4 + 0.6 * Math.min(1, Math.hypot(d.vx, d.vy) * 5));
    });
  },
  code(p) {
    return `const attractors = d3.range(${p.nAttract}).map(i => ({
  cx: W/2, cy: H/2, orbitR: rng(20, 60),
  speed: rng(0.0005, 0.002),
  phase: (i / ${p.nAttract}) * Math.PI * 2,
}));
const parts = d3.range(${p.nParts}).map(() => ({
  x: rng(0, W), y: rng(0, H), vx: 0, vy: 0, color: pick(pal),
}));
d3.timer(t => {
  attractors.forEach(a => {
    a.x = W/2 + a.orbitR * Math.cos(t * a.speed + a.phase);
    a.y = H/2 + a.orbitR * Math.sin(t * a.speed + a.phase);
  });
  parts.forEach(pt => {
    attractors.forEach(a => {
      const dx = a.x - pt.x, dy = a.y - pt.y;
      const dist = Math.max(5, Math.hypot(dx, dy));
      pt.vx += (dx / dist) * ${p.strength};
      pt.vy += (dy / dist) * ${p.strength};
    });
    pt.vx *= 0.99; pt.vy *= 0.99;
    pt.x += pt.vx; pt.y += pt.vy;
  });
  // update circle positions
});`;
  }
},

// ────────────────────────────────────────────────────────────────────
{

  prompt: `Create a kaleidoscope effect by drawing shapes in one sector and reflecting
them across multiple axes of symmetry. Animate the shapes' positions and sizes.

        });

        const mirrorG = g.append("g")
          .attr("transform", `rotate(${fold * 360 / p.folds}) scale(1,-1)`);
        shapes.forEach(s => {
          const angle = s.baseAngle + Math.sin(t / p.speed + s.phase) * 0.3;
          const dist = s.baseDist + Math.sin(t / (p.speed * 0.7) + s.phase) * 8;
          const x = dist * Math.cos(angle), y = dist * Math.sin(angle);
          const r = s.r + Math.sin(t / 600 + s.phase) * 2;
          mirrorG.append("circle").attr("cx", x).attr("cy", y).attr("r", Math.max(1, r))
            .attr("fill", s.color).attr("opacity", 0.6);

      }
    });
  },
  code(p) {
    return `const sectorAngle = Math.PI * 2 / ${p.folds};
const shapes = d3.range(${p.nShapes}).map(i => ({
  baseAngle: rng(0, sectorAngle),
  baseDist: rng(10, Math.min(W,H)/2 - 10),
  r: rng(3, ${p.maxR}), color: pal[i % pal.length],
  phase: rng(0, Math.PI * 2),
}));
d3.timer(t => {
  g.selectAll("*").remove();
  for (let fold = 0; fold < ${p.folds}; fold++) {
    const foldG = g.append("g")
      .attr("transform", \`rotate(\${fold * ${360 / p.folds}})\`);
    shapes.forEach(s => {
      const angle = s.baseAngle + Math.sin(t / ${p.speed} + s.phase) * 0.3;
      const dist = s.baseDist + Math.sin(t / ${p.speed * 0.7} + s.phase) * 8;
      foldG.append("circle")

  }
});`;

{
  name: "DNA Helix",
  prompt: `Draw a rotating double helix viewed from the side. Two sine waves offset
by half a period form the backbone strands. Horizontal rungs connect
corresponding points. Animate rotation by shifting the phase.`,
  skills: ["shape-morphing", "animated-transitions", "axes-and-scales"],
  params: [
    { key: "nRungs",  label: "Rungs",       type: "range", min: 10, max: 40, step: 2,   default: 20 },
    { key: "amp",     label: "Amplitude",    type: "range", min: 10, max: 50, step: 5,   default: 30 },
    { key: "speed",   label: "Speed",        type: "range", min: 500,max: 4000,step: 500,default: 1500},
    { key: "strandW", label: "Strand width", type: "range", min: 1,  max: 4,  step: 0.5, default: 2  },
    { key: "palette", label: "Palette",      type: "select", options: Object.keys(palettes), default: "tableau"},
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const m = { l: 20, r: 20, t: 15, b: 15 };
    const nPts = 80;
    const strand1 = svg.append("path").attr("fill", "none")
      .attr("stroke", pal[0]).attr("stroke-width", p.strandW).attr("stroke-linecap", "round");
    const strand2 = svg.append("path").attr("fill", "none")
      .attr("stroke", pal[Math.min(1, pal.length-1)]).attr("stroke-width", p.strandW).attr("stroke-linecap", "round");
    const rungG = svg.append("g");
    d3.timer(t => {
      const phase = t / p.speed;
      const pts1 = d3.range(nPts).map(i => {
        const x = m.l + (i / (nPts-1)) * (W - m.l - m.r);
        const y = H/2 + p.amp * Math.sin((i / nPts) * Math.PI * 4 + phase);
        return [x, y];
      });
      const pts2 = d3.range(nPts).map(i => {
        const x = m.l + (i / (nPts-1)) * (W - m.l - m.r);
        const y = H/2 + p.amp * Math.sin((i / nPts) * Math.PI * 4 + phase + Math.PI);
        return [x, y];
      });
      strand1.attr("d", d3.line().curve(d3.curveBasis)(pts1));
      strand2.attr("d", d3.line().curve(d3.curveBasis)(pts2));
      // rungs
      rungG.selectAll("*").remove();
      d3.range(p.nRungs).forEach(i => {
        const idx = Math.floor((i / p.nRungs) * nPts);
        const z = Math.cos((idx / nPts) * Math.PI * 4 + phase);
        if (z > -0.2) { // only draw rungs facing us
          rungG.append("line")
            .attr("x1", pts1[idx][0]).attr("y1", pts1[idx][1])
            .attr("x2", pts2[idx][0]).attr("y2", pts2[idx][1])
            .attr("stroke", pal[(i + 2) % pal.length]).attr("stroke-width", 1.5)
            .attr("opacity", 0.3 + z * 0.7);

      });
    });

  .attr("stroke", pal[0]).attr("stroke-width", ${p.strandW});
const strand2 = svg.append("path").attr("fill", "none")
  .attr("stroke", pal[1]).attr("stroke-width", ${p.strandW});
d3.timer(t => {
  const phase = t / ${p.speed};
  const pts1 = d3.range(80).map(i => {
    const x = 20 + (i / 79) * (W - 40);
    const y = H/2 + ${p.amp} * Math.sin((i / 80) * Math.PI * 4 + phase);
    return [x, y];
  });
  // pts2: same but + Math.PI offset
  strand1.attr("d", d3.line().curve(d3.curveBasis)(pts1));
  // draw ${p.nRungs} rungs connecting strands, hide back-facing
});`;
  }

{
  name: "Sankey Flow",
  prompt: `Create a simple Sankey-like flow diagram with 3 stages of nodes.
Animate particles traveling along the curved link paths between nodes.
Each particle follows a cubic Bezier curve between source and target.`,
  skills: ["network-visualization", "data-preparation", "animated-transitions"],
  params: [
    { key: "nPerStage",label: "Nodes/stage", type: "range", min: 2,  max: 5,  step: 1,   default: 3  },
    { key: "nDots",    label: "Dots/link",    type: "range", min: 1,  max: 6,  step: 1,   default: 3  },
    { key: "dotR",     label: "Dot size",     type: "range", min: 1,  max: 4,  step: 0.5, default: 2  },
    { key: "speed",    label: "Speed",        type: "range", min: 2000,max: 8000,step: 500,default: 4000},
    { key: "palette",  label: "Palette",      type: "select", options: Object.keys(palettes), default: "tableau"},
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const m = { t: 10, r: 10, b: 10, l: 10 };
    const stageX = [0.1, 0.5, 0.9];
    const nodeW = 10;
    const allNodes = [];
    stageX.forEach((sx, si) => {
      const n = si === 1 ? p.nPerStage : Math.max(2, p.nPerStage - 1);
      d3.range(n).forEach(ni => {
        const h = ((H - m.t - m.b) * 0.7) / n;
        const totalH = h * n;
        const y0 = m.t + (H - m.t - m.b - totalH) / 2 + ni * h;
        allNodes.push({ x: m.l + sx * (W - m.l - m.r), y: y0 + 2, h: h - 4, stage: si, color: pal[allNodes.length % pal.length] });
      });
    });
    // draw nodes
    allNodes.forEach(n => {
      svg.append("rect").attr("x", n.x).attr("y", n.y).attr("width", nodeW).attr("height", n.h)
        .attr("fill", n.color).attr("rx", 1);
    });
    // links: each node in stage i connects to random node in stage i+1
    const links = [];
    const stage0 = allNodes.filter(n => n.stage === 0);
    const stage1 = allNodes.filter(n => n.stage === 1);
    const stage2 = allNodes.filter(n => n.stage === 2);
    stage0.forEach(s => { stage1.forEach(t => { links.push({ s, t, sy: 0.5, ty: 0.5 }); }); });
    stage1.forEach(s => { stage2.forEach(t => { links.push({ s, t, sy: 0.5, ty: 0.5 }); }); });
    // draw link paths
    links.forEach(lk => {
      const x0 = lk.s.x + nodeW, y0 = lk.s.y + lk.s.h * lk.sy;
      const x1 = lk.t.x, y1 = lk.t.y + lk.t.h * lk.ty;
      const mx = (x0 + x1) / 2;
      svg.append("path").attr("d", `M${x0},${y0}C${mx},${y0} ${mx},${y1} ${x1},${y1}`)
        .attr("fill", "none").attr("stroke", "#ddd").attr("stroke-width", 1.5).attr("opacity", 0.3);
    });
    // particles
    const particles = links.flatMap((lk, li) =>
      d3.range(p.nDots).map(pi => ({ link: lk, phase: pi / p.nDots, color: lk.s.color }))
    );
    const dots = svg.selectAll("circle.particle").data(particles).join("circle")
      .attr("class", "particle").attr("r", p.dotR).attr("fill", d => d.color).attr("opacity", 0.7);
    d3.timer(t => {
      dots.each(function(d) {
        const lk = d.link;
        const x0 = lk.s.x + nodeW, y0 = lk.s.y + lk.s.h * lk.sy;
        const x1 = lk.t.x, y1 = lk.t.y + lk.t.h * lk.ty;
        const mx = (x0 + x1) / 2;
        const u = ((t / p.speed + d.phase) % 1), v = 1 - u;
        const cx = v*v*v*x0 + 3*v*v*u*mx + 3*v*u*u*mx + u*u*u*x1;
        const cy = v*v*v*y0 + 3*v*v*u*y0 + 3*v*u*u*y1 + u*u*u*y1;
        d3.select(this).attr("cx", cx).attr("cy", cy);
      });
    });
  },
  code(p) {
    return `// 3-stage Sankey with ${p.nPerStage} nodes per stage
// Draw rects for nodes, cubic Bezier paths for links
const particles = links.flatMap((lk, li) =>
  d3.range(${p.nDots}).map(pi => ({
    link: lk, phase: pi / ${p.nDots}, color: lk.s.color
  })));
const dots = svg.selectAll("circle.particle")
  .data(particles).join("circle")
  .attr("r", ${p.dotR}).attr("fill", d => d.color);
d3.timer(t => {
  dots.each(function(d) {
    const u = ((t / ${p.speed} + d.phase) % 1), v = 1 - u;
    // cubic Bezier: B(u) = v³·P0 + 3v²u·P1 + 3vu²·P2 + u³·P3
    const cx = v*v*v*x0 + 3*v*v*u*mx + 3*v*u*u*mx + u*u*u*x1;
    const cy = v*v*v*y0 + 3*v*v*u*y0 + 3*v*u*u*y1 + u*u*u*y1;
    d3.select(this).attr("cx", cx).attr("cy", cy);
  });
});`;
  }
},

{
  name: "Fractal Tree",
  prompt: `Grow a fractal tree from the bottom center. Branches split recursively
with randomized angles and lengths. Animate by gradually increasing the
visible depth over time, then resetting — the tree appears to grow.`,
  skills: ["hierarchy-layouts", "animated-transitions", "force-simulation"],
  params: [
    { key: "maxDepth", label: "Max depth",   type: "range", min: 4,  max: 10, step: 1,   default: 7  },
    { key: "branchR",  label: "Branch ratio", type: "range", min: 0.5,max: 0.85,step: 0.05,default: 0.7},
    { key: "spread",   label: "Spread",       type: "range", min: 15, max: 50, step: 5,   default: 30 },
    { key: "growSpeed",label: "Grow speed",   type: "range", min: 500,max: 3000,step: 250, default: 1000},
    { key: "palette",  label: "Palette",      type: "select", options: Object.keys(palettes), default: "greens"},
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    // precompute branches
    const branches = [];
    function branch(x, y, angle, len, depth) {
      if (depth > p.maxDepth || len < 2) return;
      const x2 = x + Math.cos(angle) * len, y2 = y + Math.sin(angle) * len;
      branches.push({ x1: x, y1: y, x2, y2, depth, len });
      const spread = (p.spread * Math.PI / 180) * (0.8 + Math.random() * 0.4);
      branch(x2, y2, angle - spread, len * p.branchR, depth + 1);
      branch(x2, y2, angle + spread, len * p.branchR, depth + 1);
      if (Math.random() > 0.6) branch(x2, y2, angle + (Math.random()-0.5)*spread*0.5, len * p.branchR * 0.8, depth + 1);
    }
    branch(W/2, H - 8, -Math.PI/2, 40, 0);
    const lines = svg.selectAll("line").data(branches).join("line")
      .attr("x1", d => d.x1).attr("y1", d => d.y1)
      .attr("x2", d => d.x2).attr("y2", d => d.y2)
      .attr("stroke-linecap", "round");
    const cycleDur = p.maxDepth * p.growSpeed + 2000;
    d3.timer(t => {
      const cycleT = t % cycleDur;
      const growDepth = cycleT / p.growSpeed;
      lines.each(function(d) {
        const progress = Math.max(0, Math.min(1, growDepth - d.depth));
        d3.select(this)
          .attr("stroke", d.depth < 3 ? pal[0] : pal[Math.min(d.depth - 2, pal.length - 1)])
          .attr("stroke-width", Math.max(0.5, 3 - d.depth * 0.3))
          .attr("opacity", progress);
      });
    });
  },
  code(p) {
    return `// Recursive branch generator
function branch(x, y, angle, len, depth) {
  if (depth > ${p.maxDepth} || len < 2) return;
  const x2 = x + Math.cos(angle) * len;
  const y2 = y + Math.sin(angle) * len;
  branches.push({ x1: x, y1: y, x2, y2, depth });
  const spread = ${p.spread} * Math.PI / 180;
  branch(x2, y2, angle - spread, len * ${p.branchR}, depth + 1);
  branch(x2, y2, angle + spread, len * ${p.branchR}, depth + 1);
}
branch(W/2, H - 8, -Math.PI/2, 40, 0);
// Animate: reveal by depth over time
d3.timer(t => {
  const growDepth = (t % cycleDur) / ${p.growSpeed};
  lines.attr("opacity", d => Math.max(0, Math.min(1, growDepth - d.depth)));
});`;
  }
},

{
  name: "Moiré Patterns",
  prompt: `Draw two overlapping grids of parallel lines, each rotating at a
slightly different speed. The interference between the grids creates
shifting moiré patterns. Use thin strokes for crisp interference.`,
  skills: ["canvas-rendering", "animated-transitions", "shape-morphing"],
  params: [
    { key: "nLines",  label: "Lines/grid",  type: "range", min: 10, max: 40, step: 2,   default: 20 },
    { key: "speed1",  label: "Speed 1",      type: "range", min: 1,  max: 15, step: 1,   default: 4  },
    { key: "speed2",  label: "Speed 2",      type: "range", min: 1,  max: 15, step: 1,   default: 5  },
    { key: "strokeW", label: "Stroke",       type: "range", min: 0.3,max: 2,  step: 0.1, default: 0.8},
    { key: "palette", label: "Palette",      type: "select", options: Object.keys(palettes), default: "mono"},
  ],
  make(svg, p) {
    const pal = palettes[p.palette];
    const g1 = svg.append("g"), g2 = svg.append("g");
    const cx = W / 2, cy = H / 2;
    const lineLen = Math.hypot(W, H);
    const gap = lineLen / p.nLines;
    function buildGrid(g, color) {
      for (let i = -p.nLines; i <= p.nLines; i++) {
        g.append("line")
          .attr("x1", -lineLen/2).attr("y1", i * gap)
          .attr("x2", lineLen/2).attr("y2", i * gap)
          .attr("stroke", color).attr("stroke-width", p.strokeW).attr("opacity", 0.6);
      }
    }
    buildGrid(g1, pal[0]);
    buildGrid(g2, pal[Math.min(1, pal.length - 1)]);
    d3.timer(t => {
      g1.attr("transform", `translate(${cx},${cy}) rotate(${t / 1000 * p.speed1})`);
      g2.attr("transform", `translate(${cx},${cy}) rotate(${t / 1000 * p.speed2})`);
    });
  },
  code(p) {
    return `const lineLen = Math.hypot(W, H);
const gap = lineLen / ${p.nLines};
function buildGrid(g, color) {
  for (let i = -${p.nLines}; i <= ${p.nLines}; i++) {
    g.append("line")
      .attr("x1", -lineLen/2).attr("y1", i * gap)
      .attr("x2", lineLen/2).attr("y2", i * gap)
      .attr("stroke", color).attr("stroke-width", ${p.strokeW});
  }
}
buildGrid(g1, pal[0]);
buildGrid(g2, pal[1]);
d3.timer(t => {
  g1.attr("transform",
    \`translate(\${cx},\${cy}) rotate(\${t / 1000 * ${p.speed1}})\`);
  g2.attr("transform",
    \`translate(\${cx},\${cy}) rotate(\${t / 1000 * ${p.speed2}})\`);
});`;
  }
},

{
  name: "Bar Race",
  prompt: `Animate a horizontal bar chart where bar values change randomly each cycle.

  make(svg, p) {

      id: i, value: rng(10, 100), color: pal[i % pal.length],
    }));
    const x = d3.scaleLinear().range([m.l, W - m.r]);
    const bars = svg.selectAll("rect").data(items, d => d.id).join("rect")
      .attr("rx", 2).attr("height", barH).attr("fill", d => d.color);

      .attr("font-size", 9).attr("fill", "#eee").attr("dy", "0.35em")
      .attr("font-family", "Helvetica Neue, sans-serif");
    function update() {
      items.forEach(d => { d.value = rng(10, 100); });
      items.sort((a, b) => b.value - a.value);
      x.domain([0, d3.max(items, d => d.value) * 1.1]);
      bars.data(items, d => d.id)
        .transition().duration(p.stepDur * 0.8).ease(d3.easeCubicInOut)
        .attr("x", m.l).attr("width", d => x(d.value) - m.l)

          const self = d3.select(this);

          const interp = d3.interpolateRound(prev, Math.round(d.value));

        });

    update();
    d3.interval(update, p.stepDur);
  },

  id: i, value: rng(10, 100), color: pal[i % pal.length],

update();
d3.interval(update, ${p.stepDur});`;
  }

{
  name: "Fireworks",
  prompt: `Simulate firework bursts: periodically launch a rocket from the bottom

  skills: ["force-simulation", "animated-transitions", "color-and-compositing"],

    { key: "gravity",  label: "Gravity",      type: "range", min: 0.01,max: 0.08,step: 0.01,default: 0.03},
    { key: "sparkLife", label: "Spark life",  type: "range", min: 30, max: 120,step: 10,  default: 60 },
    { key: "palette",  label: "Palette",      type: "select", options: Object.keys(palettes), default: "neon"},

  make(svg, p) {

    d3.timer(t => {
      if (t - lastBurst > p.burstRate) {
        lastBurst = t;
        const cx = rng(40, W - 40), cy = rng(20, H * 0.5);
        const color = pick(pal);
        for (let i = 0; i < p.nSparks; i++) {
          const angle = (i / p.nSparks) * Math.PI * 2 + rng(-0.2, 0.2);
          const speed = rng(0.8, 2.5);
          sparks.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            age: 0, color, r: rng(1, 3),
          });
        }
      }
      // update
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx; s.y += s.vy; s.vy += p.gravity;
        s.vx *= 0.98; s.age++;
        if (s.age > p.sparkLife) sparks.splice(i, 1);
      }
      const dots = g.selectAll("circle").data(sparks);
      dots.exit().remove();
      dots.enter().append("circle")
        .merge(dots)
        .attr("cx", d => d.x).attr("cy", d => d.y).attr("r", d => d.r)
        .attr("fill", d => d.color)
        .attr("opacity", d => Math.max(0, 1 - d.age / p.sparkLife));
    });
  },
  code(p) {
    return `const pal = ${JSON.stringify(palettes[p.palette])};
const sparks = [];
let lastBurst = 0;
d3.timer(t => {
  if (t - lastBurst > ${p.burstRate}) {
    lastBurst = t;
    const cx = rng(40, W - 40), cy = rng(20, H * 0.5);
    const color = pick(pal);
    for (let i = 0; i < ${p.nSparks}; i++) {
      const angle = (i / ${p.nSparks}) * Math.PI * 2 + rng(-0.2, 0.2);
      const speed = rng(0.8, 2.5);
      sparks.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        age: 0, color, r: rng(1, 3),
      });
    }
  }
  sparks.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    s.vy += ${p.gravity}; s.vx *= 0.98; s.age++;
  });
  // remove expired, update circles
});`;
  }
},

]; // end generators


// ── Block rendering ─────────────────────────────────────────────────

const grid = d3.select("#grid");

function createBlock(gen) {
  // resolve default params
  const params = {};
  gen.params.forEach(p => { params[p.key] = p.default; });

  const block = grid.append("div").attr("class", "block");

  // bar: title + tabs on one line
  const bar = block.append("div").attr("class", "block-bar");
  bar.append("div").attr("class", "block-title").text(gen.name);

  const tabDefs = [
    { id: "demo",   label: "Demo" },
    { id: "prompt", label: "Prompt" },
    { id: "code",   label: "Code" },
    { id: "skills", label: "Skills" },
  ];
  tabDefs.forEach((td, i) => {
    bar.append("button").attr("class", `tab${i === 0 ? " active" : ""}`)
      .attr("data-panel", td.id).text(td.label);
  });

  // panels container
  const panels = block.append("div");

  // demo panel
  const demoPanel = panels.append("div").attr("class", "panel panel-demo active")
    .attr("data-panel", "demo");
  const svg = demoPanel.append("svg")
    .attr("viewBox", `0 0 ${W} ${H}`)
    .attr("preserveAspectRatio", "xMidYMid slice");

  // prompt panel
  panels.append("div").attr("class", "panel panel-prompt").attr("data-panel", "prompt")
    .text(gen.prompt);

  // code panel
  const codePanel = panels.append("div").attr("class", "panel panel-code").attr("data-panel", "code");
  codePanel.append("pre").text(gen.code(params));

  // skills panel
  const skillsPanel = panels.append("div").attr("class", "panel panel-skills").attr("data-panel", "skills");
  gen.skills.forEach(s => {
    skillsPanel.append("span").attr("class", "tag").text(s);
  });

  // controls toggle button
  let ctrlsOpen = true;
  const ctrlToggle = block.append("button").attr("class", "ctrl-toggle")
    .on("click", () => {
      ctrlsOpen = !ctrlsOpen;
      ctrlPanel.classed("hidden", !ctrlsOpen);
      ctrlToggle.select(".ctrl-arrow").text(ctrlsOpen ? "▾" : "▸");
      ctrlToggle.select(".ctrl-label").text(ctrlsOpen ? "Hide Controls" : "Show Controls");
    });
  ctrlToggle.append("span").attr("class", "ctrl-arrow").text("▾");
  ctrlToggle.append("span").attr("class", "ctrl-label").text("Hide Controls");

  // inline controls
  const ctrlPanel = block.append("div").attr("class", "inline-controls");

  if (gen.params.length === 0) {
    ctrlToggle.classed("hidden", true);
  }

  gen.params.forEach(pDef => {
    const row = ctrlPanel.append("div").attr("class", "param-row");
    row.append("label").text(pDef.label);

    if (pDef.type === "select") {
      const sel = row.append("select");
      pDef.options.forEach(opt => {
        sel.append("option").attr("value", opt).text(opt)
          .property("selected", opt === pDef.default);
      });
      sel.on("change", function() {
        params[pDef.key] = this.value;
        rebuild();
      });
    } else {
      const inp = row.append("input").attr("type", "range")
        .attr("min", pDef.min).attr("max", pDef.max).attr("step", pDef.step)
        .attr("value", pDef.default);
      const val = row.append("span").attr("class", "param-val").text(pDef.default);
      inp.on("input", function() {
        const v = +this.value;
        params[pDef.key] = v;
        val.text(v % 1 === 0 ? v : v.toFixed(1));
        rebuild();
      });
    }
  });

  // tab switching — show/hide controls based on active tab
  bar.selectAll(".tab").on("click", function() {
    const panelId = d3.select(this).attr("data-panel");
    bar.selectAll(".tab").classed("active", false);
    d3.select(this).classed("active", true);
    panels.selectAll(".panel").classed("active", false);
    panels.select(`[data-panel="${panelId}"]`).classed("active", true);
    const onDemo = panelId === "demo";
    ctrlToggle.classed("hidden", !onDemo || gen.params.length === 0);
    ctrlPanel.classed("hidden", !onDemo || !ctrlsOpen);
  });

  // render + rebuild on param change
  let blockTimers = [];
  function rebuild() {
    blockTimers.forEach(t => t.stop());
    blockTimers = [];
    svg.selectAll("*").remove();
    const origTimer = d3.timer, origInterval = d3.interval;
    d3.timer = function(cb) {
      const t = origTimer(cb);
      blockTimers.push(t);
      activeTimers.push(t);
      return t;
    };
    d3.interval = function(cb, delay) {
      const t = origInterval(cb, delay);
      blockTimers.push(t);
      activeTimers.push(t);
      return t;
    };
    gen.make(svg, params);
    d3.timer = origTimer;
    d3.interval = origInterval;
    codePanel.select("pre").text(gen.code(params));
  }

  rebuild();
}

// ── Pagination + filtering ───────────────────────────────────────────

const PAGE_SIZE = 6;
let activeFilters = new Set();
let currentPage = 0;
let activeTimers = []; // track timers for cleanup

// collect all unique skills
const allSkills = [...new Set(generators.flatMap(g => g.skills))].sort();

// build filter buttons
const filtersEl = d3.select("#filters");
allSkills.forEach(skill => {
  filtersEl.append("button")
    .attr("class", "filter-btn")
    .text(skill)
    .on("click", function() {
      if (activeFilters.has(skill)) {
        activeFilters.delete(skill);
        d3.select(this).classed("active", false);
      } else {
        activeFilters.add(skill);
        d3.select(this).classed("active", true);
      }
      currentPage = 0;
      renderPage();
    });
});

function getFiltered() {
  if (activeFilters.size === 0) return generators;
  return generators.filter(g =>
    [...activeFilters].every(s => g.skills.includes(s))
  );
}

function stopAllTimers() {
  activeTimers.forEach(t => t.stop());
  activeTimers = [];
}

function renderPage() {
  stopAllTimers();
  grid.html("");

  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages - 1);
  const start = currentPage * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  // intercept d3.timer and d3.interval to track for cleanup
  const origTimer = d3.timer, origInterval = d3.interval;
  d3.timer = function(cb) { const t = origTimer(cb); activeTimers.push(t); return t; };
  d3.interval = function(cb, delay) { const t = origInterval(cb, delay); activeTimers.push(t); return t; };

  pageItems.forEach(gen => createBlock(gen));

  d3.timer = origTimer;
  d3.interval = origInterval;

  // pager
  const pager = d3.select("#pager");
  pager.html("");

  if (filtered.length === 0) {
    pager.append("span").attr("class", "pager-info").text("No blocks match these filters.");
    return;
  }

  pager.append("button")
    .text("\u2190 Prev")
    .attr("disabled", currentPage === 0 ? true : null)
    .on("click", () => { currentPage--; renderPage(); });

  pager.append("span").attr("class", "pager-info")
    .text(`${start + 1}\u2013${Math.min(start + PAGE_SIZE, filtered.length)} of ${filtered.length}`);

  pager.append("button")
    .text("Next \u2192")
    .attr("disabled", currentPage >= totalPages - 1 ? true : null)
    .on("click", () => { currentPage++; renderPage(); });
}

renderPage();
</script>
