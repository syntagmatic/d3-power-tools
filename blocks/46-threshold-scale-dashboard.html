<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Threshold Scale KPI Dashboard</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa; color: #222;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 24px;
  }
  .dashboard { width: 100%; max-width: 1160px; }
  h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 2px; }
  .subtitle { font-size: 0.82rem; color: #666; margin-bottom: 14px; }

  /* KPI summary cards */
  .kpi-strip {
    display: flex; gap: 12px; margin-bottom: 16px;
  }
  .kpi-card {
    flex: 1; padding: 10px 14px; border-radius: 6px;
    border: 1px solid #e0e0e0; background: #fff;
    display: flex; flex-direction: column; align-items: center;
  }
  .kpi-card .count {
    font-size: 1.6rem; font-weight: 700;
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
    font-variant-numeric: tabular-nums;
    transition: color 300ms;
  }
  .kpi-card .label { font-size: 0.72rem; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  /* Threshold controls */
  .controls {
    display: flex; gap: 28px; align-items: center;
    margin-bottom: 14px; font-size: 0.8rem;
    background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
    padding: 10px 18px;
  }
  .controls .slider-group { display: flex; align-items: center; gap: 8px; }
  .controls .slider-group .dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  .controls input[type=range] {
    width: 140px; accent-color: #555;
  }
  .controls .val {
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
    font-size: 0.82rem; min-width: 36px; text-align: right;
  }

  /* Table */
  .table-wrap {
    border: 1px solid #ddd; border-radius: 6px; overflow: hidden;
    background: #fff;
  }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: #f5f5f5; padding: 9px 10px;
    text-align: left; border-bottom: 2px solid #d0d0d0;
    cursor: pointer; user-select: none; white-space: nowrap;
    font-weight: 600; font-size: 0.78rem; color: #444;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  thead th:hover { background: #eaeaea; }
  thead th.active { color: #222; }
  thead th .arrow { font-size: 9px; margin-left: 3px; opacity: 0.5; }
  thead th.active .arrow { opacity: 1; }
  thead th.num { text-align: right; }

  tbody td {
    padding: 7px 10px; vertical-align: middle;
    border-bottom: 1px solid #f0f0f0;
  }
  tbody tr { background: #fff; }
  tbody tr:nth-child(even) { background: #fafafa; }
  tbody tr:hover { background: #f0f5ff; }
  tbody tr.transitioning { z-index: 1; }

  td.mono {
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
    font-variant-numeric: tabular-nums; font-size: 12px;
  }
  td.num { text-align: right; }

  .status-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    transition: background-color 250ms ease-out;
    vertical-align: middle;
  }
  .status-text {
    margin-left: 6px; font-size: 11px; vertical-align: middle;
    transition: color 250ms ease-out;
  }

  /* Uptime bar */
  .uptime-cell { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .uptime-bar-bg {
    width: 48px; height: 6px; background: #e8e8e8; border-radius: 3px;
    overflow: hidden; position: relative;
  }
  .uptime-bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 300ms ease-out, background-color 300ms ease-out;
  }

  /* Sparkline SVG in cell */
  td svg { display: block; }

  .legend {
    display: flex; gap: 16px; font-size: 0.72rem; color: #777;
    margin-top: 8px;
  }
  .legend .swatch {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle;
  }
</style>
</head>
<body>
<div class="dashboard">
  <h1>Server Health Dashboard</h1>
  <div class="subtitle">20 servers &middot; threshold sliders recolor all indicators live &middot; click headers to sort</div>

  <div class="kpi-strip" id="kpi-strip"></div>

  <div class="controls">
    <div class="slider-group">
      <span class="dot" style="background:#CCBB44"></span>
      <span>Warning CPU %</span>
      <input type="range" id="warn-slider" min="40" max="90" value="70" step="1">
      <span class="val" id="warn-val">70%</span>
    </div>
    <div class="slider-group">
      <span class="dot" style="background:#EE6677"></span>
      <span>Critical CPU %</span>
      <input type="range" id="crit-slider" min="50" max="98" value="85" step="1">
      <span class="val" id="crit-val">85%</span>
    </div>
  </div>

  <div class="table-wrap">
    <table id="kpi-table">
      <thead><tr id="header-row"></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div class="legend">
    <span><span class="swatch" style="background:#228833"></span>Healthy</span>
    <span><span class="swatch" style="background:#CCBB44"></span>Warning</span>
    <span><span class="swatch" style="background:#EE6677"></span>Critical</span>
    <span style="margin-left:auto">Bullet chart target line = 75% capacity</span>
  </div>
</div>

<script>
(() => {
  // Tol colorblind-safe palette
  const C = {
    green: "#228833", yellow: "#CCBB44", red: "#EE6677",
    blue: "#4477AA", cyan: "#66CCEE", purple: "#AA3377", grey: "#BBBBBB"
  };

  // --- Seeded data generation ---
  const rng = d3.randomLcg(12345);
  const rand = (lo, hi) => lo + rng() * (hi - lo);

  const prefixes = ["web", "api", "db", "cache", "worker", "proxy", "queue", "ml"];
  const serverNames = Array.from({ length: 20 }, (_, i) => {
    const prefix = prefixes[i % prefixes.length];
    return `${prefix}-${String(Math.floor(i / prefixes.length) + 1).padStart(2, "0")}`;
  });

  const data = serverNames.map((name, idx) => {
    // Create structurally interesting CPU histories: some stable, some spiky, some trending up
    const base = 20 + rand(0, 60);
    const volatility = rand(3, 20);
    const trend = rand(-0.3, 0.5); // some servers trending hotter
    const cpuHistory = Array.from({ length: 30 }, (_, t) => {
      const v = base + trend * t + (rand(0, 1) - 0.5) * volatility * 2;
      return Math.max(2, Math.min(99, v));
    });

    const memLimit = [8, 16, 32, 64, 128][Math.floor(rand(0, 5))];
    const memUsed = +(memLimit * (0.2 + rand(0, 0.7))).toFixed(1);
    // Uptime: mostly high, a few degraded
    const uptime = rand(0, 1) < 0.15 ? +(92 + rand(0, 5)).toFixed(2) : +(99 + rand(0, 0.99)).toFixed(2);
    const reqRate = Math.round(100 + rand(0, 1) ** 2 * 9900); // right-skewed

    return {
      id: name,
      server_name: name,
      cpu_history: cpuHistory,
      cpu_current: cpuHistory.at(-1),
      mem_used: memUsed,
      mem_limit: memLimit,
      mem_pct: memUsed / memLimit,
      uptime_pct: uptime,
      request_rate: reqRate
    };
  });

  // --- State ---
  let warnThreshold = 70;
  let critThreshold = 85;
  let sortKey = "status";
  let sortDir = 1; // 1 = ascending, -1 = descending

  const statusOf = d => {
    const cpu = d.cpu_current;
    return cpu >= critThreshold ? 2 : cpu >= warnThreshold ? 1 : 0;
  };
  const statusColor = s => [C.green, C.yellow, C.red][s];
  const statusLabel = s => ["healthy", "warning", "critical"][s];

  // --- Columns ---
  const columns = [
    { key: "server_name", label: "Server", type: "string", w: null },
    { key: "status", label: "Status", type: "status", w: null },
    { key: "cpu_spark", label: "CPU History", type: "spark", w: null },
    { key: "cpu_current", label: "CPU %", type: "number", format: v => v.toFixed(1) + "%", w: null },
    { key: "mem_bullet", label: "Memory", type: "bullet", w: null },
    { key: "uptime_pct", label: "Uptime", type: "uptime", w: null },
    { key: "request_rate", label: "Req/s", type: "number", format: d3.format(","), w: null }
  ];

  // --- Header ---
  const headerRow = d3.select("#header-row");
  headerRow.selectAll("th").data(columns).join("th")
    .attr("class", d => (d.type === "number" || d.type === "uptime" ? "num " : "") + (d.key === sortKey ? "active" : ""))
    .html(d => `${d.label}<span class="arrow"></span>`)
    .on("pointerdown", (e, col) => {
      if (sortKey === col.key) sortDir *= -1;
      else { sortKey = col.key; sortDir = 1; }
      render(true);
    });

  const tbody = d3.select("#table-body");

  // --- Sparkline ---
  const sparkW = 72, sparkH = 22;
  const cpuYDomain = [0, 100]; // shared scale for all CPU sparklines

  const drawSparkline = (td, d) => {
    const values = d.cpu_history;
    let svg = td.select("svg");
    if (svg.empty()) {
      svg = td.append("svg")
        .attr("width", sparkW).attr("height", sparkH)
        .attr("role", "img")
        .attr("aria-label", `CPU trend for ${d.server_name}`);
    }
    svg.selectAll("*").remove();

    const x = d3.scaleLinear([0, values.length - 1], [1, sparkW - 1]);
    const y = d3.scaleLinear(cpuYDomain, [sparkH - 1, 1]);

    // Threshold bands
    const warnY = y(warnThreshold), critY = y(critThreshold);
    svg.append("rect")
      .attr("x", 0).attr("y", critY).attr("width", sparkW).attr("height", warnY - critY)
      .attr("fill", C.yellow).attr("opacity", 0.08);
    svg.append("rect")
      .attr("x", 0).attr("y", 0).attr("width", sparkW).attr("height", critY)
      .attr("fill", C.red).attr("opacity", 0.08);

    // Area + line
    const area = d3.area()
      .x((_, i) => x(i)).y0(sparkH).y1(v => y(v))
      .curve(d3.curveMonotoneX);
    const line = d3.line()
      .x((_, i) => x(i)).y(v => y(v))
      .curve(d3.curveMonotoneX);

    svg.append("path").datum(values)
      .attr("d", area).attr("fill", C.blue).attr("opacity", 0.1);
    svg.append("path").datum(values)
      .attr("d", line).attr("fill", "none").attr("stroke", C.blue).attr("stroke-width", 1.5);

    // Endpoint dot colored by status
    const last = values.at(-1);
    const s = last >= critThreshold ? 2 : last >= warnThreshold ? 1 : 0;
    svg.append("circle")
      .attr("cx", x(values.length - 1)).attr("cy", y(last))
      .attr("r", 2.5).attr("fill", statusColor(s));
  };

  // --- Bullet chart ---
  const bulletW = 90, bulletH = 14;
  const drawBullet = (td, d) => {
    let svg = td.select("svg");
    if (svg.empty()) {
      svg = td.append("svg")
        .attr("width", bulletW + 44).attr("height", bulletH)
        .attr("role", "img")
        .attr("aria-label", `Memory ${d.mem_used}/${d.mem_limit} GB`);
    }
    svg.selectAll("*").remove();

    const x = d3.scaleLinear([0, d.mem_limit], [0, bulletW]);
    const pct = d.mem_pct;
    const barColor = pct >= (critThreshold / 100) ? C.red
      : pct >= (warnThreshold / 100) ? C.yellow : C.green;

    // Qualitative ranges
    svg.append("rect").attr("width", bulletW).attr("height", bulletH)
      .attr("fill", "#eaeaea").attr("rx", 2);
    svg.append("rect").attr("width", x(d.mem_limit * 0.75)).attr("height", bulletH)
      .attr("fill", "#e0e0e0").attr("rx", 2);

    // Measure bar
    svg.append("rect")
      .attr("y", 3).attr("width", x(d.mem_used)).attr("height", bulletH - 6)
      .attr("fill", barColor).attr("rx", 1.5);

    // Target marker at 75%
    const targetX = x(d.mem_limit * 0.75);
    svg.append("line")
      .attr("x1", targetX).attr("x2", targetX)
      .attr("y1", 1).attr("y2", bulletH - 1)
      .attr("stroke", "#555").attr("stroke-width", 1.5);

    // Label
    svg.append("text")
      .attr("x", bulletW + 5).attr("y", bulletH / 2 + 4)
      .attr("font-size", 10).attr("fill", "#666")
      .attr("font-family", "'SF Mono', Monaco, monospace")
      .text(`${d.mem_used}/${d.mem_limit}G`);
  };

  // --- Uptime cell ---
  const drawUptime = (td, d) => {
    let wrap = td.select(".uptime-cell");
    if (wrap.empty()) {
      wrap = td.append("div").attr("class", "uptime-cell");
      wrap.append("span").attr("class", "mono");
      const bg = wrap.append("div").attr("class", "uptime-bar-bg");
      bg.append("div").attr("class", "uptime-bar-fill");
    }
    const upColor = d.uptime_pct >= 99.5 ? C.green : d.uptime_pct >= 97 ? C.yellow : C.red;
    wrap.select("span.mono").text(d.uptime_pct.toFixed(2) + "%");
    wrap.select(".uptime-bar-fill")
      .style("width", `${Math.min(100, (d.uptime_pct / 100) * 100)}%`)
      .style("background-color", upColor);
  };

  // --- Sort ---
  const sortVal = (d, key) => {
    switch (key) {
      case "status": return statusOf(d);
      case "server_name": return d.server_name;
      case "cpu_spark": return d.cpu_current;
      case "cpu_current": return d.cpu_current;
      case "mem_bullet": return d.mem_pct;
      case "uptime_pct": return d.uptime_pct;
      case "request_rate": return d.request_rate;
      default: return 0;
    }
  };

  const sortData = arr => {
    const sorted = [...arr];
    sorted.sort((a, b) => {
      const va = sortVal(a, sortKey), vb = sortVal(b, sortKey);
      const cmp = typeof va === "string" ? d3.ascending(va, vb) : d3.ascending(va, vb);
      return cmp * sortDir;
    });
    return sorted;
  };

  // --- KPI cards ---
  const kpiStrip = d3.select("#kpi-strip");
  const kpiDefs = [
    { key: "critical", label: "Critical", color: C.red },
    { key: "warning", label: "Warning", color: C.yellow },
    { key: "healthy", label: "Healthy", color: C.green },
    { key: "avg_cpu", label: "Avg CPU", color: C.blue },
  ];
  kpiDefs.forEach(k => {
    const card = kpiStrip.append("div").attr("class", "kpi-card").attr("id", `kpi-${k.key}`);
    card.append("div").attr("class", "count").style("color", k.color);
    card.append("div").attr("class", "label").text(k.label);
  });

  const updateKPIs = () => {
    const counts = [0, 0, 0];
    let cpuSum = 0;
    data.forEach(d => { counts[statusOf(d)]++; cpuSum += d.cpu_current; });
    d3.select("#kpi-critical .count").text(counts[2]);
    d3.select("#kpi-warning .count").text(counts[1]);
    d3.select("#kpi-healthy .count").text(counts[0]);
    d3.select("#kpi-avg_cpu .count").text((cpuSum / data.length).toFixed(1) + "%");
  };

  // --- Update header arrows ---
  const updateArrows = () => {
    headerRow.selectAll("th").data(columns)
      .attr("class", d => (d.type === "number" || d.type === "uptime" ? "num " : "") + (d.key === sortKey ? "active" : ""))
      .each(function(col) {
        d3.select(this).select(".arrow")
          .text(col.key === sortKey ? (sortDir === 1 ? " \u25B2" : " \u25BC") : "");
      });
  };

  // --- Animated row repositioning ---
  // Track previous positions for FLIP animation
  let prevPositions = new Map();

  const capturePositions = () => {
    const map = new Map();
    tbody.selectAll("tr").each(function(d) {
      if (d) map.set(d.id, this.getBoundingClientRect().top);
    });
    return map;
  };

  const animateRows = (oldPositions) => {
    tbody.selectAll("tr").each(function(d) {
      if (!d || !oldPositions.has(d.id)) return;
      const oldTop = oldPositions.get(d.id);
      const newTop = this.getBoundingClientRect().top;
      const delta = oldTop - newTop;
      if (Math.abs(delta) < 1) return;
      const tr = d3.select(this);
      tr.classed("transitioning", true)
        .style("transform", `translateY(${delta}px)`)
        .style("transition", "none");
      // Force reflow
      this.offsetHeight; // eslint-disable-line
      tr.style("transition", "transform 400ms cubic-bezier(0.25, 0.46, 0.45, 0.94)")
        .style("transform", "translateY(0)")
        .on("transitionend", function() {
          d3.select(this).classed("transitioning", false)
            .style("transform", null).style("transition", null);
        });
    });
  };

  // --- Render ---
  const render = (animate = false) => {
    updateKPIs();
    updateArrows();

    const sorted = sortData(data);

    // Capture old positions before DOM changes
    const oldPos = animate ? capturePositions() : null;

    // Data join with key
    const rows = tbody.selectAll("tr")
      .data(sorted, d => d.id)
      .join(
        enter => {
          const tr = enter.append("tr");
          columns.forEach(() => tr.append("td"));
          return tr;
        },
        update => update,
        exit => exit.remove()
      )
      .order(); // reorder DOM to match data order

    // Fill cells
    rows.each(function(d) {
      const tds = d3.select(this).selectAll("td").nodes();
      columns.forEach((col, i) => {
        const td = d3.select(tds[i]);
        td.attr("class",
          col.type === "number" ? "num mono" :
          col.key === "server_name" ? "mono" :
          col.type === "uptime" ? "num" : ""
        );

        if (col.key === "server_name") {
          td.text(d.server_name);
        } else if (col.key === "status") {
          let dot = td.select(".status-dot");
          if (dot.empty()) dot = td.append("span").attr("class", "status-dot");
          const s = statusOf(d);
          dot.style("background-color", statusColor(s));
          let lbl = td.select(".status-text");
          if (lbl.empty()) lbl = td.append("span").attr("class", "status-text");
          lbl.text(statusLabel(s)).style("color", statusColor(s));
        } else if (col.key === "cpu_spark") {
          drawSparkline(td, d);
        } else if (col.key === "cpu_current") {
          const s = statusOf(d);
          td.text(col.format(d.cpu_current))
            .style("color", statusColor(s))
            .style("font-weight", s === 2 ? "600" : "normal");
        } else if (col.key === "mem_bullet") {
          drawBullet(td, d);
        } else if (col.type === "uptime") {
          drawUptime(td, d);
        } else if (col.type === "number") {
          td.text(col.format(d[col.key]));
        }
      });
    });

    // Animate if requested
    if (animate && oldPos && oldPos.size > 0) {
      animateRows(oldPos);
    }
  };

  // --- Slider handlers ---
  const warnSlider = d3.select("#warn-slider");
  const critSlider = d3.select("#crit-slider");

  warnSlider.on("input", function() {
    warnThreshold = +this.value;
    if (warnThreshold >= critThreshold) {
      critThreshold = Math.min(98, warnThreshold + 5);
      critSlider.property("value", critThreshold);
      d3.select("#crit-val").text(critThreshold + "%");
    }
    d3.select("#warn-val").text(warnThreshold + "%");
    render(sortKey === "status"); // animate if sorted by status since order may change
  });

  critSlider.on("input", function() {
    critThreshold = +this.value;
    if (critThreshold <= warnThreshold) {
      warnThreshold = Math.max(40, critThreshold - 5);
      warnSlider.property("value", warnThreshold);
      d3.select("#warn-val").text(warnThreshold + "%");
    }
    d3.select("#crit-val").text(critThreshold + "%");
    render(sortKey === "status");
  });

  // Initial render
  render();
})();
</script>
</body>
</html>
