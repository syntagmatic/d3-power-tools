<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrollytelling Network Growth</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fafafa; font-family: system-ui, sans-serif; }
  .container { display: flex; position: relative; }
  .scroll-text {
    width: 40%; padding: 0 32px;
  }
  .section {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; padding: 40px 0;
  }
  .section h2 { font-size: 20px; margin-bottom: 12px; color: #222; }
  .section p { font-size: 14px; line-height: 1.7; color: #555; max-width: 360px; }
  .sticky-wrap {
    width: 60%; height: 100vh; position: sticky; top: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .step-dots {
    position: fixed; left: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 10;
  }
  .step-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ccc;
    transition: background 300ms, transform 300ms;
  }
  .step-dot.active { background: #4477AA; transform: scale(1.4); }
  svg text.annotation {
    font-size: 11px; fill: #333; font-weight: 600;
    pointer-events: none;
  }
  svg text.annotation-sub {
    font-size: 10px; fill: #777; font-style: italic;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="step-dots" id="dots"></div>
<div class="container">
  <div class="scroll-text" id="scrollText"></div>
  <div class="sticky-wrap">
    <svg id="viz" width="500" height="500"></svg>
  </div>
</div>
<script>
const TOL = ["#4477AA","#EE6677","#228833","#CCBB44","#66CCEE","#AA3377","#BBBBBB"];
const svgW = 500, svgH = 500;
const rng = d3.randomLcg(7);

// --- Stage data ---
// Stage 1: 5 founders, fully connected
const founders = d3.range(5).map(i => ({ id: i, group: "founder", label: `F${i+1}`, stage: 1 }));
const founderEdges = [];
for (let i = 0; i < 5; i++) for (let j = i + 1; j < 5; j++) founderEdges.push({ source: i, target: j, stage: 1 });

// Stage 2: +15 early adopters connected to founders
const earlyAdopters = d3.range(15).map(i => ({ id: 5 + i, group: "early", label: `EA${i+1}`, stage: 2 }));
const earlyEdges = earlyAdopters.map(n => ({
  source: n.id, target: Math.floor(rng() * 5), stage: 2
}));
// Some inter-early edges
for (let i = 0; i < 8; i++) {
  const s = 5 + Math.floor(rng() * 15), t = 5 + Math.floor(rng() * 15);
  if (s !== t) earlyEdges.push({ source: s, target: t, stage: 2 });
}

// Stage 3: +20 in 3 clusters
const clusters = ["alpha","beta","gamma"];
const clusterNodes = d3.range(20).map(i => ({
  id: 20 + i, group: clusters[i % 3], label: `C${i+1}`, stage: 3
}));
const clusterEdges = [];
for (let i = 0; i < 20; i++) {
  for (let j = i + 1; j < 20; j++) {
    if (clusterNodes[i].group === clusterNodes[j].group && rng() < 0.35) {
      clusterEdges.push({ source: 20 + i, target: 20 + j, stage: 3 });
    }
  }
}
// Connect each cluster to 1-2 early adopters
clusters.forEach((c, ci) => {
  const member = clusterNodes.find(n => n.group === c);
  clusterEdges.push({ source: member.id, target: 5 + ci * 3, stage: 3 });
});

// Stage 4: +10 bridges connecting clusters
const bridges = d3.range(10).map(i => ({ id: 40 + i, group: "bridge", label: `B${i+1}`, stage: 4 }));
const bridgeEdges = [];
bridges.forEach((b, i) => {
  const c1 = 20 + (i % 3) * 7, c2 = 20 + ((i + 1) % 3) * 7 + Math.floor(rng() * 3);
  bridgeEdges.push({ source: b.id, target: c1, stage: 4 });
  bridgeEdges.push({ source: b.id, target: c2, stage: 4 });
});

// Stage 5: all 50, fill edges
const fillEdges = [];
for (let i = 0; i < 15; i++) {
  const s = Math.floor(rng() * 50), t = Math.floor(rng() * 50);
  if (s !== t) fillEdges.push({ source: s, target: t, stage: 5 });
}

const allNodes = [...founders, ...earlyAdopters, ...clusterNodes, ...bridges];
const stages = [
  { nodes: founders, edges: founderEdges, title: "The Founders", text: "Five people who knew each other. A fully connected core of mutual trust that would become the backbone of everything that followed." },
  { nodes: [...founders, ...earlyAdopters], edges: [...founderEdges, ...earlyEdges], title: "Early Adopters", text: "Fifteen newcomers, each drawn in by a founder. The star topology of early growth: every new connection routes through the original five." },
  { nodes: [...founders, ...earlyAdopters, ...clusterNodes], edges: [...founderEdges, ...earlyEdges, ...clusterEdges], title: "Communities Form", text: "Three distinct clusters emerge. People connect to others like themselves, creating dense local neighborhoods that barely know each other exists." },
  { nodes: [...founders, ...earlyAdopters, ...clusterNodes, ...bridges], edges: [...founderEdges, ...earlyEdges, ...clusterEdges, ...bridgeEdges], title: "Bridges Appear", text: "Ten bridge nodes span the gaps between communities. These structural bridges are rare but powerful: they control information flow between clusters." },
  { nodes: allNodes, edges: [...founderEdges, ...earlyEdges, ...clusterEdges, ...bridgeEdges, ...fillEdges], title: "The Full Network", text: "The mature network: 50 nodes, dense connections, emergent structure. Note the isolates at the periphery, connected by a single thread." }
];

// Scroll sections
const scrollText = d3.select("#scrollText");
stages.forEach((s, i) => {
  const sec = scrollText.append("div").attr("class", "section").attr("id", `section-${i}`);
  sec.append("h2").text(s.title);
  sec.append("p").text(s.text);
});

// Step dots
const dots = d3.select("#dots");
stages.forEach((_, i) => {
  dots.append("div").attr("class", `step-dot${i === 0 ? " active" : ""}`).attr("data-step", i);
});

// SVG setup
const svg = d3.select("#viz");
const gLinks = svg.append("g");
const gNodes = svg.append("g");
const gAnnotations = svg.append("g");

// Force simulation
const simulation = d3.forceSimulation()
  .force("link", d3.forceLink().id(d => d.id).distance(40))
  .force("charge", d3.forceManyBody().strength(-40))
  .force("center", d3.forceCenter(svgW / 2, svgH / 2))
  .force("collide", d3.forceCollide(8))
  .alphaTarget(0.05)
  .on("tick", ticked);

let currentStage = -1;
const nodeMap = new Map();

const groupColor = d3.scaleOrdinal()
  .domain(["founder","early","alpha","beta","gamma","bridge"])
  .range([TOL[0], TOL[4], TOL[2], TOL[3], TOL[5], TOL[1]]);

function ticked() {
  gLinks.selectAll("line")
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  gNodes.selectAll("circle")
    .attr("cx", d => d.x).attr("cy", d => d.y);
  updateAnnotations();
}

function goToStage(idx) {
  if (idx === currentStage || idx < 0 || idx >= stages.length) return;
  currentStage = idx;

  const stage = stages[idx];
  const stageNodes = stage.nodes.map(d => {
    if (nodeMap.has(d.id)) return nodeMap.get(d.id);
    const n = { ...d, x: svgW / 2 + (rng() - 0.5) * 20, y: svgH / 2 + (rng() - 0.5) * 20 };
    nodeMap.set(d.id, n);
    return n;
  });
  const stageEdges = stage.edges.map(e => ({ source: e.source, target: e.target }));

  // Update nodes
  gNodes.selectAll("circle")
    .data(stageNodes, d => d.id)
    .join(
      enter => enter.append("circle")
        .attr("cx", svgW / 2).attr("cy", svgH / 2)
        .attr("r", 0)
        .attr("fill", d => groupColor(d.group))
        .attr("stroke", "white").attr("stroke-width", 1)
        .call(e => e.transition().duration(600).attr("r", 5)),
      update => update,
      exit => exit.transition().duration(400).attr("r", 0).remove()
    );

  // Update links
  gLinks.selectAll("line")
    .data(stageEdges, d => `${d.source}-${d.target}`)
    .join(
      enter => enter.append("line")
        .attr("stroke", "#999").attr("stroke-opacity", 0).attr("stroke-width", 1)
        .call(e => e.transition().duration(600).attr("stroke-opacity", 0.3)),
      update => update,
      exit => exit.transition().duration(400).attr("stroke-opacity", 0).remove()
    );

  // Update simulation
  simulation.nodes(stageNodes);
  simulation.force("link").links(stageEdges);
  simulation.alpha(0.5).restart();

  // Update dots
  d3.selectAll(".step-dot").classed("active", (_, i) => i === idx);
}

function updateAnnotations() {
  gAnnotations.selectAll("*").remove();
  if (currentStage === 0) {
    // "Hub" label on first founder
    const f0 = nodeMap.get(0);
    if (f0) {
      gAnnotations.append("text").attr("class", "annotation")
        .attr("x", f0.x + 12).attr("y", f0.y - 10).text("Hub");
    }
  } else if (currentStage === 2) {
    // Community brackets
    ["alpha","beta","gamma"].forEach((c, ci) => {
      const members = [...nodeMap.values()].filter(n => n.group === c);
      if (members.length === 0) return;
      const cx = d3.mean(members, d => d.x), cy = d3.mean(members, d => d.y);
      gAnnotations.append("text").attr("class", "annotation")
        .attr("x", cx).attr("y", cy - 20).attr("text-anchor", "middle")
        .text(`Cluster ${c.charAt(0).toUpperCase() + c.slice(1)}`);
      // Bracket circle
      const maxR = d3.max(members, d => Math.hypot(d.x - cx, d.y - cy)) + 12;
      gAnnotations.append("circle")
        .attr("cx", cx).attr("cy", cy).attr("r", maxR)
        .attr("fill", "none").attr("stroke", groupColor(c))
        .attr("stroke-opacity", 0.3).attr("stroke-dasharray", "4,3");
    });
  } else if (currentStage === 3) {
    // "Bridge" labels
    [...nodeMap.values()].filter(n => n.group === "bridge").slice(0, 3).forEach(b => {
      gAnnotations.append("text").attr("class", "annotation-sub")
        .attr("x", b.x + 10).attr("y", b.y - 8).text("Bridge");
    });
  } else if (currentStage === 4) {
    // Find peripheral nodes (low degree)
    const degMap = new Map();
    stages[4].edges.forEach(e => {
      degMap.set(e.source, (degMap.get(e.source) || 0) + 1);
      degMap.set(e.target, (degMap.get(e.target) || 0) + 1);
    });
    const isolates = [...nodeMap.values()].filter(n => (degMap.get(n.id) || 0) <= 1).slice(0, 2);
    isolates.forEach(n => {
      gAnnotations.append("text").attr("class", "annotation-sub")
        .attr("x", n.x + 10).attr("y", n.y - 8).text("Isolate");
    });
  }
}

// IntersectionObserver
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const idx = parseInt(entry.target.id.split("-")[1]);
      goToStage(idx);
    }
  });
}, { threshold: 0.5 });

document.querySelectorAll(".section").forEach(sec => observer.observe(sec));

// Initialize
goToStage(0);
</script>
</body>
</html>
