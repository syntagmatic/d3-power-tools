<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrient Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#f8f7f4;color:#2a2a2a;padding:20px 28px}
h1{font-size:24px;font-weight:700;letter-spacing:-.4px;margin-bottom:4px}
.subtitle{font-size:13px;color:#888;margin-bottom:12px}
.breadcrumb{font-size:12px;color:#666;margin-bottom:8px;height:18px}
.breadcrumb span{cursor:pointer;color:#4477aa;text-decoration:underline}
.treemap-container{position:relative;width:100%;border-radius:6px;overflow:hidden;background:#e8e6e0}
.treemap-cell{position:absolute;overflow:hidden;border:1px solid rgba(255,255,255,0.6);transition:opacity .3s}
.treemap-cell:hover{border-color:rgba(255,255,255,0.9)}
.cell-label{position:absolute;padding:3px 5px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5);pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parcoords-container{margin-top:12px;position:relative}
.parcoords-container canvas{position:absolute;top:0;left:0}
.axis-label{font-size:10px;fill:#666;text-anchor:middle}
.axis-name{font-size:11px;fill:#444;font-weight:600;text-anchor:middle}
.tooltip{position:fixed;pointer-events:none;background:rgba(40,40,40,0.95);color:#fff;padding:8px 12px;border-radius:5px;font-size:12px;z-index:100;opacity:0;transition:opacity .15s;line-height:1.5;max-width:220px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:#666}
.legend-item{display:flex;align-items:center;gap:4px;cursor:pointer}
.legend-swatch{width:14px;height:14px;border-radius:3px}
</style>
</head>
<body>
<h1>Nutrient Explorer</h1>
<p class="subtitle">Click a food group to zoom in. Brush parallel coordinates axes to filter.</p>
<div class="breadcrumb" id="breadcrumb">All Foods</div>
<div class="treemap-container" id="treemap"></div>
<div class="parcoords-container" id="parcoords">
  <canvas id="pc-canvas"></canvas>
  <svg id="pc-svg"></svg>
</div>
<div class="legend" id="legend"></div>
<div class="tooltip" id="tooltip"></div>

<script type="module">
// --- DATA ---
const groupColors = {
  "Fruits":"#88ccee","Vegetables":"#44aa99","Grains":"#ddcc77","Proteins":"#cc6677",
  "Dairy":"#aa4499","Nuts & Seeds":"#882255","Legumes":"#332288","Oils & Fats":"#999933"
};

const foods = [
  // Fruits
  {name:"Apple",group:"Fruits",calories:52,protein:0.3,fat:0.2,carbs:14,fiber:2.4,sugar:10},
  {name:"Banana",group:"Fruits",calories:89,protein:1.1,fat:0.3,carbs:23,fiber:2.6,sugar:12},
  {name:"Orange",group:"Fruits",calories:47,protein:0.9,fat:0.1,carbs:12,fiber:2.4,sugar:9},
  {name:"Strawberry",group:"Fruits",calories:32,protein:0.7,fat:0.3,carbs:8,fiber:2,sugar:5},
  {name:"Avocado",group:"Fruits",calories:160,protein:2,fat:15,carbs:9,fiber:7,sugar:0.7},
  {name:"Mango",group:"Fruits",calories:60,protein:0.8,fat:0.4,carbs:15,fiber:1.6,sugar:14},
  {name:"Grapes",group:"Fruits",calories:69,protein:0.7,fat:0.2,carbs:18,fiber:0.9,sugar:16},
  {name:"Blueberry",group:"Fruits",calories:57,protein:0.7,fat:0.3,carbs:14,fiber:2.4,sugar:10},
  // Vegetables
  {name:"Broccoli",group:"Vegetables",calories:34,protein:2.8,fat:0.4,carbs:7,fiber:2.6,sugar:1.7},
  {name:"Spinach",group:"Vegetables",calories:23,protein:2.9,fat:0.4,carbs:3.6,fiber:2.2,sugar:0.4},
  {name:"Carrot",group:"Vegetables",calories:41,protein:0.9,fat:0.2,carbs:10,fiber:2.8,sugar:5},
  {name:"Potato",group:"Vegetables",calories:77,protein:2,fat:0.1,carbs:17,fiber:2.2,sugar:0.8},
  {name:"Kale",group:"Vegetables",calories:49,protein:4.3,fat:0.9,carbs:9,fiber:3.6,sugar:2.3},
  {name:"Tomato",group:"Vegetables",calories:18,protein:0.9,fat:0.2,carbs:3.9,fiber:1.2,sugar:2.6},
  {name:"Bell Pepper",group:"Vegetables",calories:31,protein:1,fat:0.3,carbs:6,fiber:2.1,sugar:4.2},
  {name:"Sweet Potato",group:"Vegetables",calories:86,protein:1.6,fat:0.1,carbs:20,fiber:3,sugar:4.2},
  // Grains
  {name:"Rice",group:"Grains",calories:130,protein:2.7,fat:0.3,carbs:28,fiber:0.4,sugar:0.1},
  {name:"Wheat Bread",group:"Grains",calories:265,protein:9,fat:3.2,carbs:49,fiber:2.7,sugar:5},
  {name:"Oats",group:"Grains",calories:389,protein:17,fat:7,carbs:66,fiber:11,sugar:1},
  {name:"Quinoa",group:"Grains",calories:120,protein:4.4,fat:1.9,carbs:21,fiber:2.8,sugar:0.9},
  {name:"Pasta",group:"Grains",calories:131,protein:5,fat:1.1,carbs:25,fiber:1.8,sugar:0.6},
  {name:"Corn",group:"Grains",calories:86,protein:3.3,fat:1.4,carbs:19,fiber:2.7,sugar:3.2},
  {name:"Barley",group:"Grains",calories:123,protein:2.3,fat:0.4,carbs:28,fiber:3.8,sugar:0.3},
  // Proteins
  {name:"Chicken",group:"Proteins",calories:165,protein:31,fat:3.6,carbs:0,fiber:0,sugar:0},
  {name:"Beef",group:"Proteins",calories:250,protein:26,fat:15,carbs:0,fiber:0,sugar:0},
  {name:"Salmon",group:"Proteins",calories:208,protein:20,fat:13,carbs:0,fiber:0,sugar:0},
  {name:"Tofu",group:"Proteins",calories:76,protein:8,fat:4.8,carbs:1.9,fiber:0.3,sugar:0.6},
  {name:"Eggs",group:"Proteins",calories:155,protein:13,fat:11,carbs:1.1,fiber:0,sugar:1.1},
  {name:"Lentils",group:"Proteins",calories:116,protein:9,fat:0.4,carbs:20,fiber:8,sugar:1.8},
  {name:"Shrimp",group:"Proteins",calories:99,protein:24,fat:0.3,carbs:0.2,fiber:0,sugar:0},
  // Dairy
  {name:"Milk",group:"Dairy",calories:42,protein:3.4,fat:1,carbs:5,fiber:0,sugar:5},
  {name:"Cheese",group:"Dairy",calories:402,protein:25,fat:33,carbs:1.3,fiber:0,sugar:0.5},
  {name:"Yogurt",group:"Dairy",calories:59,protein:10,fat:0.7,carbs:3.6,fiber:0,sugar:3.2},
  {name:"Butter",group:"Dairy",calories:717,protein:0.9,fat:81,carbs:0.1,fiber:0,sugar:0.1},
  {name:"Cream",group:"Dairy",calories:340,protein:2.1,fat:36,carbs:2.8,fiber:0,sugar:2.8},
  {name:"Cottage Cheese",group:"Dairy",calories:98,protein:11,fat:4.3,carbs:3.4,fiber:0,sugar:2.7},
  // Nuts & Seeds
  {name:"Almonds",group:"Nuts & Seeds",calories:579,protein:21,fat:50,carbs:22,fiber:12,sugar:4},
  {name:"Walnuts",group:"Nuts & Seeds",calories:654,protein:15,fat:65,carbs:14,fiber:7,sugar:2.6},
  {name:"Peanuts",group:"Nuts & Seeds",calories:567,protein:26,fat:49,carbs:16,fiber:9,sugar:4},
  {name:"Chia Seeds",group:"Nuts & Seeds",calories:486,protein:17,fat:31,carbs:42,fiber:34,sugar:0},
  {name:"Cashews",group:"Nuts & Seeds",calories:553,protein:18,fat:44,carbs:30,fiber:3.3,sugar:6},
  {name:"Sunflower Seeds",group:"Nuts & Seeds",calories:584,protein:21,fat:51,carbs:20,fiber:9,sugar:2.6},
  // Legumes
  {name:"Black Beans",group:"Legumes",calories:132,protein:9,fat:0.5,carbs:24,fiber:8.7,sugar:0.3},
  {name:"Chickpeas",group:"Legumes",calories:164,protein:9,fat:2.6,carbs:27,fiber:8,sugar:4.8},
  {name:"Kidney Beans",group:"Legumes",calories:127,protein:9,fat:0.5,carbs:22,fiber:6.4,sugar:2},
  {name:"Soybeans",group:"Legumes",calories:173,protein:17,fat:9,carbs:10,fiber:6,sugar:3},
  {name:"Green Peas",group:"Legumes",calories:81,protein:5,fat:0.4,carbs:14,fiber:5,sugar:6},
  {name:"Lima Beans",group:"Legumes",calories:115,protein:8,fat:0.4,carbs:21,fiber:7,sugar:3},
  // Oils & Fats
  {name:"Olive Oil",group:"Oils & Fats",calories:884,protein:0,fat:100,carbs:0,fiber:0,sugar:0},
  {name:"Coconut Oil",group:"Oils & Fats",calories:862,protein:0,fat:100,carbs:0,fiber:0,sugar:0},
  {name:"Avocado Oil",group:"Oils & Fats",calories:884,protein:0,fat:100,carbs:0,fiber:0,sugar:0},
  {name:"Ghee",group:"Oils & Fats",calories:900,protein:0,fat:100,carbs:0,fiber:0,sugar:0},
  {name:"Flaxseed Oil",group:"Oils & Fats",calories:884,protein:0,fat:100,carbs:0,fiber:0,sugar:0},
];

const axes = ["calories","protein","fat","carbs","fiber","sugar"];
const axisLabels = {calories:"Calories",protein:"Protein (g)",fat:"Fat (g)",carbs:"Carbs (g)",fiber:"Fiber (g)",sugar:"Sugar (g)"};

// Build hierarchy
const root = d3.hierarchy({name:"All Foods",children:
  Object.entries(d3.group(foods, d=>d.group)).map(([g,items])=>({
    name:g, children:items.map(f=>({...f,value:f.calories}))
  }))
}).sum(d=>d.value||0).sort((a,b)=>b.value-a.value);

// --- DISPATCH ---
const dispatch = d3.dispatch("hover","brushPC","zoomTreemap");

// --- TREEMAP ---
const tmContainer = document.getElementById("treemap");
const tmW = tmContainer.getBoundingClientRect().width;
const tmH = Math.min(420, window.innerHeight * 0.45);
tmContainer.style.height = tmH + "px";

const treemap = d3.treemap().size([tmW, tmH]).paddingInner(2).paddingOuter(3).round(true);
treemap(root);

let currentZoom = null; // null = root view
const tooltip = document.getElementById("tooltip");
let pcHighlighted = new Set(); // names highlighted by parcoords brush

function getVisibleFoods() {
  if (currentZoom) {
    return foods.filter(f => f.group === currentZoom);
  }
  return foods;
}

function renderTreemap() {
  tmContainer.innerHTML = "";
  let leaves;

  if (currentZoom) {
    const groupNode = root.children.find(c => c.data.name === currentZoom);
    if (!groupNode) return;
    const sub = d3.hierarchy({name:currentZoom, children:groupNode.data.children})
      .sum(d=>d.value||0).sort((a,b)=>b.value-a.value);
    d3.treemap().size([tmW, tmH]).paddingInner(3).paddingOuter(6).round(true)(sub);
    leaves = sub.leaves();
  } else {
    treemap(root);
    leaves = root.leaves();
  }

  leaves.forEach(leaf => {
    const d = leaf.data;
    const w = leaf.x1 - leaf.x0;
    const h = leaf.y1 - leaf.y0;
    if (w < 2 || h < 2) return;

    const group = d.group || leaf.parent?.data.name || "";
    const color = groupColors[group] || "#999";
    const cell = document.createElement("div");
    cell.className = "treemap-cell";
    cell.style.left = leaf.x0 + "px";
    cell.style.top = leaf.y0 + "px";
    cell.style.width = w + "px";
    cell.style.height = h + "px";
    cell.style.background = color;

    // Desaturate if parcoords brush active and not matching
    if (pcHighlighted.size > 0 && !pcHighlighted.has(d.name)) {
      cell.style.opacity = 0.3;
    }

    if (w > 35 && h > 16) {
      const label = document.createElement("div");
      label.className = "cell-label";
      label.style.width = (w - 4) + "px";
      label.textContent = d.name;
      cell.appendChild(label);
    }

    cell.addEventListener("mouseenter", (e) => {
      const name = d.name;
      tooltip.innerHTML = `<strong>${name}</strong><br>${d.calories||d.value} cal | ${d.protein||0}g protein<br>${d.fat||0}g fat | ${d.carbs||0}g carbs`;
      tooltip.style.opacity = 1;
      tooltip.style.left = e.clientX + 14 + "px";
      tooltip.style.top = e.clientY - 10 + "px";
      dispatch.call("hover", null, name);
    });
    cell.addEventListener("mousemove", (e) => {
      tooltip.style.left = e.clientX + 14 + "px";
      tooltip.style.top = e.clientY - 10 + "px";
    });
    cell.addEventListener("mouseleave", () => {
      tooltip.style.opacity = 0;
      dispatch.call("hover", null, null);
    });
    cell.addEventListener("click", () => {
      if (!currentZoom && group) {
        currentZoom = group;
        renderTreemap();
        renderPC();
        updateBreadcrumb();
      }
    });

    tmContainer.appendChild(cell);
  });
}

function updateBreadcrumb() {
  const bc = document.getElementById("breadcrumb");
  if (currentZoom) {
    bc.innerHTML = `<span id="bc-root">All Foods</span> › ${currentZoom}`;
    document.getElementById("bc-root").addEventListener("click", () => {
      currentZoom = null;
      renderTreemap();
      renderPC();
      updateBreadcrumb();
    });
  } else {
    bc.textContent = "All Foods";
  }
}

renderTreemap();

// --- PARALLEL COORDINATES ---
const pcContainer = document.getElementById("parcoords");
const pcCanvas = document.getElementById("pc-canvas");
const pcSvg = d3.select("#pc-svg");
const pm = {top:28, right:30, bottom:20, left:30};
const pcW = tmW;
const pcH = 240;
pcCanvas.width = pcW * 2;
pcCanvas.height = pcH * 2;
pcCanvas.style.width = pcW + "px";
pcCanvas.style.height = pcH + "px";
pcSvg.attr("width", pcW).attr("height", pcH);
pcSvg.append("title").text("Parallel coordinates of food nutrients");
pcContainer.style.width = pcW + "px";
pcContainer.style.height = pcH + "px";

const pctx = pcCanvas.getContext("2d");
pctx.scale(2, 2);

const xPC = d3.scalePoint().domain(axes).range([pm.left, pcW - pm.right]).padding(0.1);
const yScales = {};
axes.forEach(a => {
  yScales[a] = d3.scaleLinear()
    .domain([0, d3.max(foods, f => f[a]) * 1.05])
    .range([pcH - pm.bottom, pm.top]);
});

let hoveredFood = null;
let brushRanges = {}; // axis -> [y0, y1] in pixel space

function renderPC() {
  const visible = getVisibleFoods();
  pctx.clearRect(0, 0, pcW, pcH);

  // Lines
  visible.forEach(f => {
    const isHov = f.name === hoveredFood;
    const isBrushed = pcHighlighted.size === 0 || pcHighlighted.has(f.name);

    pctx.beginPath();
    pctx.globalAlpha = isHov ? 1 : isBrushed ? 0.5 : 0.06;
    pctx.strokeStyle = isHov ? "#fff" : groupColors[f.group];
    pctx.lineWidth = isHov ? 2.5 : 1.2;

    axes.forEach((a, i) => {
      const x = xPC(a), y = yScales[a](f[a]);
      if (i === 0) pctx.moveTo(x, y);
      else pctx.lineTo(x, y);
    });
    pctx.stroke();
  });
  pctx.globalAlpha = 1;

  // SVG axes
  pcSvg.selectAll(".pc-axis").remove();
  axes.forEach(a => {
    const g = pcSvg.append("g").attr("class","pc-axis")
      .attr("transform", `translate(${xPC(a)},0)`)
      .call(d3.axisLeft(yScales[a]).ticks(5).tickSize(-4));
    g.selectAll("text").attr("font-size",9).attr("fill","#888");
    g.select(".domain").attr("stroke","#bbb");
    g.selectAll(".tick line").attr("stroke","#ddd");
    g.append("text").attr("class","axis-name").attr("y", pm.top - 14).text(axisLabels[a]);
  });

  // Brushes on axes
  pcSvg.selectAll(".pc-brush").remove();
  axes.forEach(a => {
    const brushY = d3.brushY()
      .extent([[xPC(a)-12, pm.top],[xPC(a)+12, pcH-pm.bottom]])
      .on("brush end", function(event) {
        if (event.selection) {
          brushRanges[a] = event.selection;
        } else {
          delete brushRanges[a];
        }
        // Compute highlighted
        pcHighlighted = new Set();
        const visible = getVisibleFoods();
        visible.forEach(f => {
          let pass = true;
          for (const [axis, [y0, y1]] of Object.entries(brushRanges)) {
            const val = yScales[axis](f[axis]);
            if (val < y0 || val > y1) { pass = false; break; }
          }
          if (pass) pcHighlighted.add(f.name);
        });
        if (Object.keys(brushRanges).length === 0) pcHighlighted = new Set();
        renderPC();
        renderTreemap();
      });
    pcSvg.append("g").attr("class","pc-brush").call(brushY);
  });
}

renderPC();

// Hover dispatch
dispatch.on("hover.pc", name => {
  hoveredFood = name;
  renderPC();
});

// --- LEGEND ---
const legendEl = document.getElementById("legend");
Object.entries(groupColors).forEach(([g, c]) => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-swatch" style="background:${c}"></div>${g}`;
  item.addEventListener("click", () => {
    currentZoom = g;
    renderTreemap();
    renderPC();
    updateBreadcrumb();
  });
  legendEl.appendChild(item);
});
</script>
</body>
</html>
