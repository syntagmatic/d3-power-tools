<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibration Impact — which blocks gained or lost</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #1a1a1a; line-height: 1.5; }
  .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 0.82rem; color: #666; margin-bottom: 24px; }
  .chart-wrap { overflow-x: auto; }
  svg text { font-family: system-ui, -apple-system, sans-serif; }
  .annotation { font-size: 0.65rem; fill: #333; font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <h1>Calibration Impact — which blocks gained or lost</h1>
  <p class="subtitle">Composite score change (v2 − v1) per block, sorted by magnitude</p>
  <div class="chart-wrap" id="chart"></div>
</div>
<script>
(() => {
  const v1 = {1:[5,7,4,6,5],2:[4,8,5,5,4],3:[6,7,8,5,4],4:[6,7,7,6,4],5:[4,7,4,7,5],6:[5,9,7,7,3],7:[4,6,3,6,5],8:[4,8,5,7,4],9:[7,7,5,7,5],10:[3,8,5,7,5],11:[3,8,6,6,5],12:[4,8,7,7,5],13:[3,9,5,6,4],14:[3,8,6,6,5],15:[4,8,5,7,6],16:[4,8,5,7,5],17:[4,8,5,6,5],18:[5,9,6,7,7],19:[5,8,5,7,5],20:[4,7,6,6,5],21:[5,7,7,7,6],22:[3,7,4,7,3],23:[4,7,3,7,4],24:[5,8,5,6,5],25:[5,8,4,6,5],26:[5,7,6,5,4],27:[6,8,5,6,7],28:[6,8,8,7,3],29:[3,7,4,6,5],30:[5,7,5,7,5],31:[4,8,7,7,7],32:[3,8,4,5,4],33:[6,7,8,6,5],34:[7,8,8,7,4],35:[6,8,6,6,5],36:[4,8,5,7,5],37:[8,7,6,8,5],38:[6,5,8,7,4],39:[3,8,7,6,5],40:[4,7,6,7,5],41:[5,8,6,6,6],42:[3,9,6,6,5],43:[7,7,6,8,7],44:[7,9,8,8,8],45:[7,9,4,8,7],46:[7,9,6,8,7],47:[7,9,6,7,5],48:[7,7,6,5,7],49:[7,9,7,7,8],50:[8,10,8,8,8],51:[8,9,7,6,8],52:[8,9,7,8,6],53:[8,10,8,8,8],54:[7,9,8,7,7],55:[5,9,5,7,6],56:[4.5,9,3,5,7],57:[5,9,7,7,8],58:[6,9,7,8,7],59:[6,9,6,6,7],60:[6,9,7,7,5],61:[5,9,4,6,7],62:[7,9,5,8,7],63:[4,8,4,8,6],64:[6,8,6,7,7],65:[7,8,7,7,8],66:[7,9,7,8,8],67:[7,9,6,7,8],68:[7,9,7,7,8],69:[7,8,8,8,8],70:[7,9,7,7,7],71:[6,9,6,5,7],72:[7,9,7,9,6],73:[7,9,7,8,8],74:[7,9,8,8,8],75:[7,9,6,7,8],76:[7,9,7,7,8],77:[7,9,5,7,7],78:[7,9,6,7,8],79:[8,8,7,8,8],80:[7,8,8,8,7],81:[7,10,7,8,8],82:[8,9,7,8,8],83:[7,10,6,7,7],84:[7,9,8,9,8]};

  const v2 = {1:[7,8,6,6,7],2:[8,9,7,7,7],3:[7,8,7,5,8],4:[8,8,7,7,6],5:[7,7,6,7,7],6:[9,9,7,8,8],7:[7,8,5,7,7],8:[7,8,7,7,7],9:[8,7,7,7,6],10:[8,9,6,8,7],11:[7,8,6,6,6],12:[8,8,7,6,7],13:[7,9,6,6,7],14:[7,8,7,7,7],15:[8,9,7,7,7],16:[8,8,6,7,8],17:[7,9,6,6,7],18:[7,9,7,7,8],19:[8,8,7,7,7],20:[7,7,7,6,6],21:[5,6,7,5,6],22:[7,8,6,7,7],23:[7,8,5,7,7],24:[8,8,7,7,8],25:[5,8,6,6,6],26:[8,9,7,8,7],27:[7,9,6,6,8],28:[8,8,7,8,7],29:[7,8,5,7,6],30:[7,9,7,7,6],31:[7,8,5,7,7],32:[6,8,6,5,6],33:[8,8,7,8,7],34:[8,9,7,7,7],35:[7,8,7,6,7],36:[7,8,6,7,8],37:[6,7,7,6,6],38:[7,5,7,6,7],39:[5,8,6,4,6],40:[7,9,6,7,7],41:[8,8,7,7,7],42:[8,9,6,7,7],43:[8,9,7,7,7],44:[7,9,7,6,7],45:[7,8,5,6,5],46:[7,8,7,8,7],47:[7,8,7,5,7],48:[7,9,6,6,6],49:[7,8,6,7,7],50:[8,9,7,8,7],51:[7,8,7,7,7],52:[7,7,7,7,7],53:[8,9,7,8,8],54:[7,8,6,6,7],55:[7,8,6,7,6],56:[7,8,5,7,6],57:[8,8,7,8,7],58:[8,8,7,8,7],59:[8,8,5,7,7],60:[7,8,6,6,7],61:[7,8,6,7,7],62:[7,8,6,7,6],63:[7,9,5,8,6],64:[6,8,6,5,7],65:[7,8,7,7,7],66:[7,8,7,7,8],67:[7,9,6,6,7],68:[8,8,7,8,7],69:[8,9,7,8,8],70:[7,8,6,6,6],71:[6,8,5,5,6],72:[7,9,6,7,7],73:[7,8,6,7,6],74:[8,7,7,8,7],75:[6,8,7,5,7],76:[8,8,6,7,7],77:[7,8,5,6,6],78:[5,8,5,4,6],79:[7,7,6,6,7],80:[8,8,7,8,6],81:[8,9,7,8,7],82:[7,8,7,6,7],83:[7,7,6,7,6],84:[8,8,7,9,7]};

  const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;

  const data = [];
  for (let i = 1; i <= 84; i++) {
    const s1 = avg(v1[i]);
    const s2 = avg(v2[i]);
    data.push({ block: i, v1: s1, v2: s2, delta: +(s2 - s1).toFixed(2) });
  }

  // Sort by delta descending
  data.sort((a, b) => b.delta - a.delta);

  const margin = { top: 50, right: 20, bottom: 60, left: 60 };
  const width = 940 - margin.left - margin.right;
  const height = 420 - margin.top - margin.bottom;

  const svg = d3.select("#chart").append("svg")
    .attr("viewBox", `0 0 940 420`)
    .attr("width", "100%")
    .attr("height", 420);

  svg.append("title").text("Waterfall chart showing composite score change (v2 minus v1) for each of 84 blocks");

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand().domain(data.map((d, i) => i)).range([0, width]).padding(0.15);
  const yMax = d3.max(data, d => Math.abs(d.delta));
  const y = d3.scaleLinear().domain([-yMax - 0.3, yMax + 0.3]).range([height, 0]).nice();

  // Zero line
  g.append("line")
    .attr("x1", 0).attr("x2", width)
    .attr("y1", y(0)).attr("y2", y(0))
    .attr("stroke", "#333").attr("stroke-width", 1.5);

  // Bars
  g.selectAll(".bar")
    .data(data)
    .join("rect")
    .attr("class", "bar")
    .attr("x", (d, i) => x(i))
    .attr("width", x.bandwidth())
    .attr("y", d => d.delta >= 0 ? y(d.delta) : y(0))
    .attr("height", d => Math.abs(y(d.delta) - y(0)))
    .attr("fill", d => {
      if (Math.abs(d.delta) <= 0.1) return "#aaa";
      return d.delta > 0 ? "#228833" : "#CC3311";
    })
    .attr("rx", 1);

  // X axis — block numbers
  const xAxis = g.append("g").attr("transform", `translate(0,${height})`);
  xAxis.selectAll("text")
    .data(data)
    .join("text")
    .attr("x", (d, i) => x(i) + x.bandwidth() / 2)
    .attr("y", 12)
    .attr("text-anchor", "end")
    .attr("transform", (d, i) => `rotate(-60,${x(i) + x.bandwidth() / 2},12)`)
    .attr("font-size", "0.5rem")
    .attr("fill", "#666")
    .text(d => d.block);

  xAxis.append("line").attr("x1", 0).attr("x2", width).attr("stroke", "#ccc");

  // Y axis
  const yAxisG = g.append("g").call(d3.axisLeft(y).ticks(8).tickSize(-width));
  yAxisG.selectAll(".tick line").attr("stroke", "#e8e8e8");
  yAxisG.select(".domain").remove();
  yAxisG.selectAll("text").attr("font-size", "0.68rem").attr("fill", "#555");

  // Y label
  g.append("text")
    .attr("transform", "rotate(-90)")
    .attr("x", -height / 2).attr("y", -42)
    .attr("text-anchor", "middle")
    .attr("font-size", "0.75rem")
    .attr("fill", "#444")
    .text("Score change (v2 − v1)");

  // Annotations: top 3 gainers, top 3 losers
  const top3 = data.slice(0, 3);
  const bottom3 = data.slice(-3).reverse();

  const annotate = (items, above) => {
    const offsets = above ? [{dx:0,dy:-8},{dx:60,dy:-20},{dx:120,dy:-32}]
                         : [{dx:0,dy:14},{dx:-60,dy:26},{dx:-120,dy:38}];
    items.forEach((d, k) => {
      const i = data.indexOf(d);
      const bx = x(i) + x.bandwidth() / 2;
      const lx = bx + offsets[k].dx;
      const ly = above ? y(d.delta) + offsets[k].dy : y(d.delta) + offsets[k].dy;
      g.append("line")
        .attr("x1", bx).attr("x2", lx)
        .attr("y1", above ? y(d.delta) - 2 : y(d.delta) + 2)
        .attr("y2", ly + (above ? 4 : -10))
        .attr("stroke", "#888").attr("stroke-width", 0.7);
      g.append("text")
        .attr("class", "annotation")
        .attr("x", lx).attr("y", ly)
        .attr("text-anchor", "middle")
        .text(`#${d.block} (${d.delta > 0 ? "+" : ""}${d.delta.toFixed(1)})`);
    });
  };

  annotate(top3, true);
  annotate(bottom3, false);
})();
</script>
</body>
</html>
