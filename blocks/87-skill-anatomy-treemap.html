<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Anatomy Treemap</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
    color: #f0f0f0;
  }
  .subtitle {
    font-size: 0.82rem;
    color: #888;
    margin-bottom: 16px;
  }
  #chart { position: relative; }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(15, 15, 25, 0.95);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.78rem;
    line-height: 1.5;
    color: #ccc;
    backdrop-filter: blur(8px);
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
    max-width: 240px;
  }
  .tooltip .name { font-weight: 600; color: #fff; }
  .tooltip .lines { color: #aaa; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    justify-content: center;
    margin-top: 14px;
    font-size: 0.72rem;
    color: #999;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: default;
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }
</style>
</head>
<body>
<h1>Skill Anatomy</h1>
<p class="subtitle">D3 Power Tools — line counts by category</p>
<div id="chart"></div>
<div class="tooltip" id="tooltip"></div>
<div class="legend" id="legend"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Synthetic data: skill line counts grouped by category
const data = {
  name: "skills",
  children: [
    { name: "Seeing Patterns", children: [
      { name: "parallel-coordinates", lines: 680 },
      { name: "brushing", lines: 520 },
      { name: "linked-views", lines: 610 },
      { name: "distributions", lines: 470 },
    ]},
    { name: "Seeing Structure", children: [
      { name: "hierarchy-layouts", lines: 740 },
      { name: "hierarchy-interaction", lines: 430 },
      { name: "edge-bundling", lines: 380 },
      { name: "force", lines: 710 },
      { name: "network", lines: 560 },
    ]},
    { name: "Seeing Place", children: [
      { name: "cartography", lines: 1120 },
    ]},
    { name: "Seeing Change", children: [
      { name: "time-series", lines: 620 },
      { name: "motion", lines: 340 },
      { name: "shape-morphing", lines: 290 },
    ]},
    { name: "Making It Legible", children: [
      { name: "scales", lines: 510 },
      { name: "color", lines: 640 },
      { name: "visual-texture", lines: 380 },
      { name: "annotation", lines: 450 },
      { name: "data-table", lines: 320 },
      { name: "canvas-accessibility", lines: 360 },
    ]},
    { name: "Making It Work", children: [
      { name: "canvas", lines: 580 },
      { name: "webgl", lines: 490 },
      { name: "navigation", lines: 410 },
      { name: "responsive", lines: 350 },
    ]},
    { name: "Before You Render", children: [
      { name: "data-gathering", lines: 440 },
      { name: "sparkcharts", lines: 310 },
      { name: "small-multiples", lines: 370 },
    ]},
    { name: "Meta Skills", children: [
      { name: "d3-idioms", lines: 390 },
      { name: "jig-template", lines: 460 },
      { name: "visual-critic", lines: 280 },
      { name: "encoding-integrity", lines: 350 },
      { name: "stress-test", lines: 320 },
      { name: "cognitive-load", lines: 270 },
      { name: "calibrate-tool", lines: 240 },
      { name: "sharpen-tool", lines: 220 },
    ]},
  ]
};

const width = 900;
const height = 560;

const categoryColors = d3.scaleOrdinal()
  .domain(data.children.map(d => d.name))
  .range([
    "#6366f1", // indigo — patterns
    "#f59e0b", // amber — structure
    "#10b981", // emerald — place
    "#ef4444", // red — change
    "#8b5cf6", // violet — legible
    "#06b6d4", // cyan — work
    "#f97316", // orange — before render
    "#64748b", // slate — meta
  ]);

const root = d3.treemap()
  .size([width, height])
  .paddingOuter(4)
  .paddingInner(2)
  .paddingTop(20)
  .round(true)
  .tile(d3.treemapSquarify.ratio(1.2))
  (d3.hierarchy(data)
    .sum(d => d.lines)
    .sort((a, b) => b.value - a.value));

const svg = d3.select("#chart")
  .append("svg")
  .attr("width", width)
  .attr("height", height)
  .attr("viewBox", [0, 0, width, height]);

const tooltip = d3.select("#tooltip");

// Category groups (depth 1)
const categoryNodes = root.children;

const catGroup = svg.selectAll(".cat")
  .data(categoryNodes)
  .join("g")
  .attr("class", "cat");

// Category background
catGroup.append("rect")
  .attr("x", d => d.x0)
  .attr("y", d => d.y0)
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => d.y1 - d.y0)
  .attr("fill", d => d3.color(categoryColors(d.data.name)).darker(1.8))
  .attr("rx", 3);

// Category label
catGroup.append("text")
  .attr("x", d => d.x0 + 6)
  .attr("y", d => d.y0 + 14)
  .text(d => d.data.name)
  .attr("fill", d => d3.color(categoryColors(d.data.name)).brighter(0.8))
  .attr("font-size", "10px")
  .attr("font-weight", 600)
  .attr("opacity", 0.9);

// Leaf cells (depth 2)
const leaves = root.leaves();

const leaf = svg.selectAll(".leaf")
  .data(leaves)
  .join("g")
  .attr("class", "leaf");

leaf.append("rect")
  .attr("x", d => d.x0)
  .attr("y", d => d.y0)
  .attr("width", d => d.x1 - d.x0)
  .attr("height", d => d.y1 - d.y0)
  .attr("fill", d => categoryColors(d.parent.data.name))
  .attr("opacity", d => 0.55 + 0.45 * (d.data.lines / 1120))
  .attr("rx", 2)
  .attr("stroke", "rgba(0,0,0,0.3)")
  .attr("stroke-width", 0.5)
  .style("cursor", "default")
  .on("pointerenter", (event, d) => {
    d3.select(event.currentTarget)
      .attr("stroke", "#fff")
      .attr("stroke-width", 1.5);
    tooltip
      .style("opacity", 1)
      .html(`<span class="name">${d.data.name}</span><br>
             <span class="lines">${d.data.lines.toLocaleString()} lines</span><br>
             ${d.parent.data.name}`);
  })
  .on("pointermove", (event) => {
    tooltip
      .style("left", event.clientX + 14 + "px")
      .style("top", event.clientY - 10 + "px");
  })
  .on("pointerleave", (event) => {
    d3.select(event.currentTarget)
      .attr("stroke", "rgba(0,0,0,0.3)")
      .attr("stroke-width", 0.5);
    tooltip.style("opacity", 0);
  });

// Leaf labels — only if cell is big enough
leaf.each(function(d) {
  const w = d.x1 - d.x0;
  const h = d.y1 - d.y0;
  if (w < 42 || h < 28) return;

  const g = d3.select(this);
  const name = d.data.name;
  const fontSize = w < 60 ? 8.5 : w < 90 ? 9.5 : 10.5;

  g.append("text")
    .attr("x", d.x0 + 4)
    .attr("y", d.y0 + fontSize + 3)
    .text(name)
    .attr("fill", "#fff")
    .attr("font-size", fontSize + "px")
    .attr("font-weight", 500)
    .attr("opacity", 0.92)
    .attr("pointer-events", "none");

  if (h > 38) {
    g.append("text")
      .attr("x", d.x0 + 4)
      .attr("y", d.y0 + fontSize + 15)
      .text(d.data.lines.toLocaleString() + " lines")
      .attr("fill", "#fff")
      .attr("font-size", (fontSize - 1.5) + "px")
      .attr("opacity", 0.55)
      .attr("pointer-events", "none");
  }
});

// Legend
const legend = d3.select("#legend");
data.children.forEach(cat => {
  const total = cat.children.reduce((s, c) => s + c.lines, 0);
  legend.append("div")
    .attr("class", "legend-item")
    .html(`<div class="legend-swatch" style="background:${categoryColors(cat.name)}"></div>
           ${cat.name} <span style="color:#666">(${total.toLocaleString()})</span>`);
});
</script>
</body>
</html>
