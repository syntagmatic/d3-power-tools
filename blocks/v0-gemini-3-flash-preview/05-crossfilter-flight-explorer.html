<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossfilter Flight Explorer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 20px;
      color: #333;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .counter {
      font-size: 1.2rem;
      font-weight: 500;
    }
    .counter span {
      font-weight: 700;
      color: #4477AA;
    }
    #reset-btn {
      padding: 8px 16px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    #reset-btn:hover {
      background: #e0e0e0;
    }
    .panel {
      margin-bottom: 30px;
    }
    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
    }
    .axis text {
      font-size: 11px;
      fill: #888;
    }
    .axis line, .axis path {
      stroke: #ddd;
    }
    .bar-bg {
      fill: #eee;
    }
    .bar-fg {
      fill: #4477AA;
    }
    .brush .selection {
      fill: #4477AA;
      fill-opacity: 0.15;
      stroke: #4477AA;
      stroke-width: 1px;
    }
    .brush .handle {
      fill: #4477AA;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="counter">Showing <span id="count-n">2,000</span> of 2,000 flights</div>
    <button id="reset-btn">Reset All</button>
  </div>

  <div id="hour-panel" class="panel">
    <div class="panel-title">Departure Hour</div>
    <div class="chart"></div>
  </div>

  <div id="delay-panel" class="panel">
    <div class="panel-title">Arrival Delay (Minutes)</div>
    <div class="chart"></div>
  </div>

  <div id="distance-panel" class="panel">
    <div class="panel-title">Distance (Miles)</div>
    <div class="chart"></div>
  </div>

  <script>
    // 1. Data Generation
    const n = 2000;
    const carriers = ["AA", "DL", "UA", "WN", "AS", "B6"];
    
    // Normal distributions for peaks
    const hourDist1 = d3.randomNormal(8, 1.5);
    const hourDist2 = d3.randomNormal(17, 2.0);
    
    const data = Array.from({length: n}, (_, i) => {
      // Hour: peak at 8 and 17
      let hour;
      const rH = Math.random();
      if (rH < 0.45) hour = hourDist1();
      else if (rH < 0.85) hour = hourDist2();
      else hour = Math.random() * 24;
      hour = Math.max(0, Math.min(23.99, hour));

      // Delay: right-skewed, -10 to 180
      // Use a squared distribution for skew
      const delay = Math.pow(Math.random(), 2.5) * 190 - 10;

      // Distance: 100 to 3000
      const distance = 100 + Math.random() * 2900;

      return {
        id: i,
        hour,
        delay,
        distance,
        carrier: carriers[Math.floor(Math.random() * carriers.length)],
        dow: Math.floor(Math.random() * 7)
      };
    });

    // 2. State Management
    const filters = {
      hour: null,
      delay: null,
      distance: null
    };

    function passes(d, dim) {
      const f = filters[dim];
      if (!f) return true;
      return d[dim] >= f[0] && d[dim] <= f[1];
    }

    // 3. Chart Setup
    const width = 860;
    const height = 160;
    const margin = {top: 10, right: 20, bottom: 30, left: 30};
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const panels = [
      {
        id: "hour",
        label: "Departure Hour",
        domain: [0, 24],
        bins: 24,
        accessor: d => d.hour,
        format: d => d + ":00"
      },
      {
        id: "delay",
        label: "Arrival Delay",
        domain: [-10, 180],
        bins: 20,
        accessor: d => d.delay,
        format: d => d + "m"
      },
      {
        id: "distance",
        label: "Distance",
        domain: [100, 3000],
        bins: 15,
        accessor: d => d.distance,
        format: d => d + "mi"
      }
    ];

    // Initialize charts
    panels.forEach(p => {
      p.x = d3.scaleLinear().domain(p.domain).range([0, innerWidth]);
      
      // Create bins
      const binGenerator = d3.bin()
        .domain(p.domain)
        .thresholds(p.x.ticks(p.bins))
        .value(p.accessor);
      
      p.allBins = binGenerator(data);
      
      p.y = d3.scaleLinear()
        .domain([0, d3.max(p.allBins, d => d.length)])
        .range([innerHeight, 0])
        .nice();
        
      const svg = d3.select(`#${p.id}-panel .chart`)
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Axes
      svg.append("g")
        .attr("transform", `translate(0,${innerHeight})`)
        .attr("class", "axis x-axis")
        .call(d3.axisBottom(p.x).ticks(p.bins / (p.id === 'hour' ? 2 : 1)).tickFormat(p.format));

      // Background bars
      p.bgBars = svg.selectAll(".bar-bg")
        .data(p.allBins)
        .join("rect")
        .attr("class", "bar-bg")
        .attr("x", d => p.x(d.x0) + 1)
        .attr("y", d => p.y(d.length))
        .attr("width", d => Math.max(0, p.x(d.x1) - p.x(d.x0) - 1))
        .attr("height", d => innerHeight - p.y(d.length));

      // Foreground bars
      p.fgBars = svg.selectAll(".bar-fg")
        .data(p.allBins)
        .join("rect")
        .attr("class", "bar-fg")
        .attr("x", d => p.x(d.x0) + 1)
        .attr("y", d => p.y(d.length))
        .attr("width", d => Math.max(0, p.x(d.x1) - p.x(d.x0) - 1))
        .attr("height", d => innerHeight - p.y(d.length));

      // Brush
      p.brush = d3.brushX()
        .extent([[0, 0], [innerWidth, innerHeight]])
        .on("brush end", (event) => {
          if (event.sourceEvent === null) return; // ignore programmatic moves
          
          if (!event.selection) {
            filters[p.id] = null;
          } else {
            filters[p.id] = event.selection.map(p.x.invert);
          }
          
          update();
        });

      p.brushGroup = svg.append("g")
        .attr("class", "brush")
        .call(p.brush);
        
      p.binGenerator = binGenerator;
    });

    function update() {
      // 1. Calculate the subset passing ALL active filters for the counter
      const filteredData = data.filter(d => 
        Object.keys(filters).every(k => passes(d, k))
      );
      
      d3.select("#count-n").text(d3.format(",")(filteredData.length));

      // 2. For each panel, update foreground bars based on OTHER filters
      panels.forEach(p => {
        const otherFilteredData = data.filter(d => 
          Object.keys(filters).every(k => k === p.id || passes(d, k))
        );
        
        const newBins = p.binGenerator(otherFilteredData);
        
        p.fgBars.data(newBins)
          .transition()
          .duration(300)
          .attr("y", d => p.y(d.length))
          .attr("height", d => innerHeight - p.y(d.length));
      });
    }

    // Reset button
    d3.select("#reset-btn").on("click", () => {
      panels.forEach(p => {
        p.brushGroup.call(p.brush.move, null);
        filters[p.id] = null;
      });
      update();
    });

  </script>
</body>
</html>
