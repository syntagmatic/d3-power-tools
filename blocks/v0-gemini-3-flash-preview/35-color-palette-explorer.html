<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Explorer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --border: #e0e0e0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    #chart-container {
      width: 100%;
      height: 300px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fafafa;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      transition: all 0.2s;
    }
    button.active {
      background: #333;
      color: white;
      border-color: #333;
    }
    button:hover:not(.active) {
      background: #f0f0f0;
    }
    .matrix-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .matrix-title {
      font-size: 14px;
      font-weight: 600;
    }
    #contrast-matrix {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border: 1px solid var(--border);
      width: 250px;
      height: 250px;
    }
    .matrix-cell {
      width: 41.6px;
      height: 41.6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: bold;
      border: 0.5px solid #eee;
      background: white;
    }
    .cvd-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .cvd-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .cvd-label {
      width: 150px;
      font-size: 12px;
      font-weight: 500;
      text-align: right;
    }
    .cvd-swatches {
      display: flex;
      gap: 4px;
    }
    .swatch {
      width: 40px;
      height: 30px;
      border-radius: 2px;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .pass { color: #2e7d32; }
    .fail { color: #d32f2f; }
  </style>
</head>
<body>

<div class="container">
  <div id="chart-container"></div>

  <div class="controls" id="palette-selector"></div>

  <div class="matrix-section">
    <div class="matrix-title">WCAG Contrast Matrix (AA 4.5:1)</div>
    <div id="contrast-matrix"></div>
  </div>

  <div class="cvd-section">
    <div class="cvd-row" id="row-original">
      <div class="cvd-label">Original</div>
      <div class="cvd-swatches"></div>
    </div>
    <div class="cvd-row" id="row-protanopia">
      <div class="cvd-label">Protanopia (Red-blind)</div>
      <div class="cvd-swatches"></div>
    </div>
    <div class="cvd-row" id="row-deuteranopia">
      <div class="cvd-label">Deuteranopia (Green-blind)</div>
      <div class="cvd-swatches"></div>
    </div>
    <div class="cvd-row" id="row-tritanopia">
      <div class="cvd-label">Tritanopia (Blue-blind)</div>
      <div class="cvd-swatches"></div>
    </div>
  </div>
</div>

<script>
  // Palettes
  const palettes = [
    { name: "Tol Bright", colors: ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377"] },
    { name: "Tol Vibrant", colors: ["#EE7733", "#0077BB", "#33BBEE", "#EE3377", "#CC3311", "#009988"] },
    { name: "Tol Muted", colors: ["#88CCEE", "#44AA99", "#117733", "#999933", "#DDCC77", "#CC6677"] },
    { name: "Tol Light", colors: ["#77AADD", "#EE8866", "#EEDD88", "#FFAABB", "#99DDFF", "#44BB99"] },
    { name: "D3 Tableau10", colors: d3.schemeTableau10.slice(0, 6) },
    { name: "D3 Category10", colors: d3.schemeCategory10.slice(0, 6) }
  ];

  let currentPalette = palettes[0];

  // Data generation
  const groups = ["A", "B", "C", "D", "E"];
  const categories = d3.range(6).map(i => `Cat ${i+1}`);
  const data = groups.flatMap(g => categories.map(c => ({
    group: g,
    category: c,
    value: Math.random() * 80 + 20
  })));

  // Setup Chart
  const margin = {top: 20, right: 20, bottom: 40, left: 40};
  const width = document.getElementById('chart-container').clientWidth - margin.left - margin.right;
  const height = 300 - margin.top - margin.bottom;

  const svg = d3.select("#chart-container").append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
    .append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

  const x0 = d3.scaleBand().domain(groups).rangeRound([0, width]).paddingInner(0.1);
  const x1 = d3.scaleBand().domain(categories).rangeRound([0, x0.bandwidth()]).padding(0.05);
  const y = d3.scaleLinear().domain([0, 100]).rangeRound([height, 0]);

  svg.append("g")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x0));

  svg.append("g")
    .call(d3.axisLeft(y).ticks(5));

  const barGroups = svg.selectAll(".group")
    .data(groups)
    .join("g")
      .attr("class", "group")
      .attr("transform", d => `translate(${x0(d)},0)`);

  function updateChart() {
    barGroups.selectAll("rect")
      .data(g => data.filter(d => d.group === g))
      .join("rect")
        .attr("x", d => x1(d.category))
        .attr("y", d => y(d.value))
        .attr("width", x1.bandwidth())
        .attr("height", d => height - y(d.value))
        .transition().duration(500)
        .attr("fill", (d, i) => currentPalette.colors[i]);
  }

  // Contrast Matrix
  function relativeLuminance(hex) {
    const [r, g, b] = [1, 3, 5].map(i => {
      const c = parseInt(hex.slice(i, i + 2), 16) / 255;
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  function contrastRatio(a, b) {
    const l1 = relativeLuminance(a), l2 = relativeLuminance(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }

  function updateMatrix() {
    const matrix = d3.select("#contrast-matrix");
    matrix.selectAll("*").remove();
    
    const colors = currentPalette.colors;
    for (let i = 0; i < 6; i++) {
      for (let j = 0; j < 6; j++) {
        const c1 = colors[i], c2 = colors[j];
        const ratio = contrastRatio(c1, c2);
        const l1 = relativeLuminance(c1), l2 = relativeLuminance(c2);
        const textColor = l1 < l2 ? c1 : c2;
        
        matrix.append("div")
          .attr("class", "matrix-cell")
          .style("color", textColor)
          .classed("pass", ratio >= 4.5)
          .classed("fail", ratio < 4.5)
          .text(ratio.toFixed(1) + ":1");
      }
    }
  }

  // CVD Simulation
  const matrices = {
    protanopia: [
      0.152286, 1.052583, -0.204868,
      0.114503, 0.786281,  0.099216,
     -0.003882, -0.048116, 1.051998
    ],
    deuteranopia: [
      0.367322, 0.860646, -0.227968,
      0.280085, 0.672501,  0.047413,
     -0.011820, 0.042940,  0.968881
    ],
    tritanopia: [
      1.255528, -0.076749, -0.178779,
     -0.078411,  0.930809,  0.147602,
      0.004733,  0.691367,  0.303900
    ]
  };

  function linearize(c) {
    c /= 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }

  function delinearize(c) {
    c = Math.max(0, Math.min(1, c));
    return Math.round((c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055) * 255);
  }

  function simulate(hex, type) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const m = matrices[type];
    const lr = linearize(r), lg = linearize(g), lb = linearize(b);
    const sr = delinearize(m[0] * lr + m[1] * lg + m[2] * lb);
    const sg = delinearize(m[3] * lr + m[4] * lg + m[5] * lb);
    const sb = delinearize(m[6] * lr + m[7] * lg + m[8] * lb);
    return `rgb(${sr}, ${sg}, ${sb})`;
  }

  function updateCVD() {
    ["original", "protanopia", "deuteranopia", "tritanopia"].forEach(type => {
      const container = d3.select(`#row-${type} .cvd-swatches`);
      container.selectAll("*").remove();
      currentPalette.colors.forEach(c => {
        const color = type === "original" ? c : simulate(c, type);
        container.append("div")
          .attr("class", "swatch")
          .style("background-color", color);
      });
    });
  }

  // Palette Selector
  const selector = d3.select("#palette-selector");
  palettes.forEach(p => {
    selector.append("button")
      .text(p.name)
      .classed("active", p === currentPalette)
      .on("click", function() {
        selector.selectAll("button").classed("active", false);
        d3.select(this).classed("active", true);
        currentPalette = p;
        updateChart();
        updateMatrix();
        updateCVD();
      });
  });

  // Initial render
  updateChart();
  updateMatrix();
  updateCVD();

</script>
</body>
</html>
