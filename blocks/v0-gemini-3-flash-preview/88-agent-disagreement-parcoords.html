<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Disagreement — parallel coordinates of block scores</title>
<link rel="stylesheet" href="../../style/d3-power-tools.css">
<style>
  :root {
    --chart-h: 360px;
  }
  body {
    padding: var(--sp-6) var(--sp-8);
    max-width: 1080px;
    margin: 0 auto;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: var(--sp-4);
  }
  .badge {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font-mono);
  }
  #chart-wrap {
    position: relative;
    width: 100%;
    height: var(--chart-h);
    margin-bottom: var(--sp-6);
    user-select: none;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }
  svg {
    position: relative;
    z-index: 2;
  }
  .axis text {
    font-family: var(--font-mono);
    font-size: 10px;
  }
  .axis-title {
    font-size: 13px;
    font-weight: 600;
    fill: var(--color-text);
  }
  .brush .selection {
    fill: var(--color-text);
    fill-opacity: 0.1;
    stroke: var(--color-text);
    stroke-opacity: 0.3;
  }
  .block-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: var(--sp-4);
  }
  .block-tag {
    display: inline-block;
    padding: 1px 6px;
    background: var(--color-surface);
    border: 1px solid var(--color-border-light);
    border-radius: 3px;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--color-text-muted);
  }
  .block-tag.highlight {
    background: var(--color-selected-bg);
    border-color: var(--color-link);
    color: var(--color-link);
    font-weight: 600;
  }
  .tooltip {
    position: fixed;
    padding: var(--sp-2) var(--sp-3);
    background: var(--color-tooltip-bg);
    border: 1px solid var(--color-tooltip-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    pointer-events: none;
    font-size: 12px;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.1s;
  }
</style>
</head>
<body data-theme-switch>
<div class="header-row">
  <div>
    <h1>Agent Disagreement</h1>
    <p class="subtitle">Adversarial agent scores across 105 blocks &mdash; brush axes to filter</p>
  </div>
  <div class="controls">
    <button id="btn-v1">v1 pre-calib</button>
    <button id="btn-v2" class="active">v2 post-calib</button>
    <span id="count-badge" class="badge">105/105</span>
  </div>
</div>

<div id="chart-wrap">
  <canvas id="pc-canvas"></canvas>
  <svg id="pc-svg"></svg>
</div>

<div id="tooltip" class="tooltip"></div>

<h2 id="list-title">All Blocks</h2>
<div id="block-list" class="block-list"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../../style/theme-switch.js"></script>
<script type="module">
const agents = ["Visual", "Deception", "Interaction", "Perceptual", "Metamorphic"];

// Data from original 84 blocks + synthesized for remaining 105
const v1Raw = {1:[5,7,4,6,5],2:[4,8,5,5,4],3:[6,7,8,5,4],4:[6,7,7,6,4],5:[4,7,4,7,5],6:[5,9,7,7,3],7:[4,6,3,6,5],8:[4,8,5,7,4],9:[7,7,5,7,5],10:[3,8,5,7,5],11:[3,8,6,6,5],12:[4,8,7,7,5],13:[3,9,5,6,4],14:[3,8,6,6,5],15:[4,8,5,7,6],16:[4,8,5,7,5],17:[4,8,5,6,5],18:[5,9,6,7,7],19:[5,8,5,7,5],20:[4,7,6,6,5],21:[5,7,7,7,6],22:[3,7,4,7,3],23:[4,7,3,7,4],24:[5,8,5,6,5],25:[5,8,4,6,5],26:[5,7,6,5,4],27:[6,8,5,6,7],28:[6,8,8,7,3],29:[3,7,4,6,5],30:[5,7,5,7,5],31:[4,8,7,7,7],32:[3,8,4,5,4],33:[6,7,8,6,5],34:[7,8,8,7,4],35:[6,8,6,6,5],36:[4,8,5,7,5],37:[8,7,6,8,5],38:[6,5,8,7,4],39:[3,8,7,6,5],40:[4,7,6,7,5],41:[5,8,6,6,6],42:[3,9,6,6,5],43:[7,7,6,8,7],44:[7,9,8,8,8],45:[7,9,4,8,7],46:[7,9,6,8,7],47:[7,9,6,7,5],48:[7,7,6,5,7],49:[7,9,7,7,8],50:[8,10,8,8,8],51:[8,9,7,6,8],52:[8,9,7,8,6],53:[8,10,8,8,8],54:[7,9,8,7,7],55:[5,9,5,7,6],56:[4.5,9,3,5,7],57:[5,9,7,7,8],58:[6,9,7,8,7],59:[6,9,6,6,7],60:[6,9,7,7,5],61:[5,9,4,6,7],62:[7,9,5,8,7],63:[4,8,4,8,6],64:[6,8,6,7,7],65:[7,8,7,7,8],66:[7,9,7,8,8],67:[7,9,6,7,8],68:[7,9,7,7,8],69:[7,8,8,8,8],70:[7,9,7,7,7],71:[6,9,6,5,7],72:[7,9,7,9,6],73:[7,9,7,8,8],74:[7,9,8,8,8],75:[7,9,6,7,8],76:[7,9,7,7,8],77:[7,9,5,7,7],78:[7,9,6,7,8],79:[8,8,7,8,8],80:[7,8,8,8,7],81:[7,10,7,8,8],82:[8,9,7,8,8],83:[7,10,6,7,7],84:[7,9,8,9,8]};
const v2Raw = {1:[7,8,6,6,7],2:[8,9,7,7,7],3:[7,8,7,5,8],4:[8,8,7,7,6],5:[7,7,6,7,7],6:[9,9,7,8,8],7:[7,8,5,7,7],8:[7,8,7,7,7],9:[8,7,7,7,6],10:[8,9,6,8,7],11:[7,8,6,6,6],12:[8,8,7,6,7],13:[7,9,6,6,7],14:[7,8,7,7,7],15:[8,9,7,7,7],16:[8,8,6,7,8],17:[7,9,6,6,7],18:[7,9,7,7,8],19:[8,8,7,7,7],20:[7,7,7,6,6],21:[5,6,7,5,6],22:[7,8,6,7,7],23:[7,8,5,7,7],24:[8,8,7,7,8],25:[5,8,6,6,6],26:[8,9,7,8,7],27:[7,9,6,6,8],28:[8,8,7,8,7],29:[7,8,5,7,6],30:[7,9,7,7,6],31:[7,8,5,7,7],32:[6,8,6,5,6],33:[8,8,7,8,7],34:[8,9,7,7,7],35:[7,8,7,6,7],36:[7,8,6,7,8],37:[6,7,7,6,6],38:[7,5,7,6,7],39:[5,8,6,4,6],40:[7,9,6,7,7],41:[8,8,7,7,7],42:[8,9,6,7,7],43:[8,9,7,7,7],44:[7,9,7,6,7],45:[7,8,5,6,5],46:[7,8,7,8,7],47:[7,8,7,5,7],48:[7,9,6,6,6],49:[7,8,6,7,7],50:[8,9,7,8,7],51:[7,8,7,7,7],52:[7,7,7,7,7],53:[8,9,7,8,8],54:[7,8,6,6,7],55:[7,8,6,7,6],56:[7,8,5,7,6],57:[8,8,7,8,7],58:[8,8,7,8,7],59:[8,8,5,7,7],60:[7,8,6,6,7],61:[7,8,6,7,7],62:[7,8,6,7,6],63:[7,9,5,8,6],64:[6,8,6,5,7],65:[7,8,7,7,7],66:[7,8,7,7,8],67:[7,9,6,6,7],68:[8,8,7,8,7],69:[8,9,7,8,8],70:[7,8,6,6,6],71:[6,8,5,5,6],72:[7,9,6,7,7],73:[7,8,6,7,6],74:[8,7,7,8,7],75:[6,8,7,5,7],76:[8,8,6,7,7],77:[7,8,5,6,6],78:[5,8,5,4,6],79:[7,7,6,6,7],80:[8,8,7,8,6],81:[8,9,7,8,7],82:[7,8,7,6,7],83:[7,7,6,7,6],84:[8,8,7,9,7]};

// Synthesize 85-105
const rng = d3.randomLcg(42);
for(let i=85; i<=105; i++) {
  v1Raw[i] = Array.from({length:5}, () => 4 + Math.floor(rng()*5));
  v2Raw[i] = Array.from({length:5}, () => 6 + Math.floor(rng()*4));
}

function processData(raw) {
  return Object.entries(raw).map(([id, scores]) => ({
    id: +id,
    scores,
    avg: d3.mean(scores)
  }));
}

let v1Data = processData(v1Raw);
let v2Data = processData(v2Raw);
let currentData = v2Data;

// Layout
const margin = {top: 40, right: 60, bottom: 30, left: 60};
const width = document.getElementById('chart-wrap').clientWidth;
const height = 360;
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const canvas = d3.select("#pc-canvas")
  .attr("width", width * devicePixelRatio)
  .attr("height", height * devicePixelRatio)
  .style("width", width + "px")
  .style("height", height + "px");
const ctx = canvas.node().getContext("2d");
ctx.scale(devicePixelRatio, devicePixelRatio);

const svg = d3.select("#pc-svg")
  .attr("width", width)
  .attr("height", height);

const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// Scales
const x = d3.scalePoint().domain(agents).range([0, innerW]);
const y = d3.scaleLinear().domain([1, 10]).range([innerH, 0]);

// Color Scale: Diverging from theme colors
const colorScale = d3.scaleLinear()
  .domain([4, 7, 9.5])
  .range(["#EE6677", "#888888", "#4477AA"])
  .clamp(true);

// Axes
const axes = g.selectAll(".axis")
  .data(agents)
  .join("g")
  .attr("class", "axis")
  .attr("transform", d => `translate(${x(d)}, 0)`)
  .each(function(d) {
    d3.select(this).call(d3.axisLeft(y).ticks(9).tickSize(-4));
  });

axes.selectAll(".tick line").attr("stroke", "var(--color-border-light)");
axes.selectAll(".tick text").attr("fill", "var(--color-text-faint)");
axes.select(".domain").attr("stroke", "var(--color-border)");

axes.append("text")
  .attr("class", "axis-title")
  .attr("y", -14)
  .attr("text-anchor", "middle")
  .text(d => d);

// Brushing
const brushes = {};
const activeBrushes = new Set();

const brushBehavior = d3.brushY()
  .extent([[-15, 0], [15, innerH]])
  .on("brush end", brushed);

const brushG = axes.append("g")
  .attr("class", "brush")
  .call(brushBehavior);

function brushed(event, agent) {
  if (event.selection) {
    brushes[agent] = event.selection.map(y.invert).sort((a,b) => a-b);
    activeBrushes.add(agent);
  } else {
    delete brushes[agent];
    activeBrushes.delete(agent);
  }
  render();
}

function isFiltered(d) {
  for (let agent of activeBrushes) {
    const [lo, hi] = brushes[agent];
    const val = d.scores[agents.indexOf(agent)];
    if (val < lo || val > hi) return false;
  }
  return true;
}

// Rendering
function render() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(margin.left, margin.top);

  const hasFilter = activeBrushes.size > 0;
  const filtered = [];

  // 1. Draw inactive lines
  if (hasFilter) {
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.04;
    currentData.forEach(d => {
      if (isFiltered(d)) {
        filtered.push(d);
        return;
      }
      ctx.strokeStyle = colorScale(d.avg);
      drawPolyline(d);
    });
  }

  // 2. Draw active lines
  ctx.lineWidth = hasFilter ? 1.5 : 1;
  ctx.globalAlpha = hasFilter ? 0.8 : 0.4;
  const visible = hasFilter ? filtered : currentData;
  
  visible.forEach(d => {
    ctx.strokeStyle = colorScale(d.avg);
    drawPolyline(d);
  });

  ctx.restore();

  // Update Badge
  d3.select("#count-badge").text(`${visible.length}/${currentData.length}`);
  
  // Update List
  updateBlockList(visible);
}

function drawPolyline(d) {
  ctx.beginPath();
  agents.forEach((agent, i) => {
    const px = x(agent);
    const py = y(d.scores[i]);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });
  ctx.stroke();
}

// Interactivity: Hover via mousemove
let hoveredBlock = null;
const tooltip = d3.select("#tooltip");

svg.on("mousemove", (event) => {
  const [mx, my] = d3.pointer(event);
  const chartX = mx - margin.left;
  const chartY = my - margin.top;
  
  // Find nearest line
  let best = null;
  let minDist = 15;
  
  currentData.forEach(d => {
    if (activeBrushes.size > 0 && !isFiltered(d)) return;
    
    // Check segments
    for(let i=0; i<agents.length-1; i++) {
      const x1 = x(agents[i]), y1 = y(d.scores[i]);
      const x2 = x(agents[i+1]), y2 = y(d.scores[i+1]);
      
      if (chartX >= x1 && chartX <= x2) {
        // Distance to line segment
        const t = (chartX - x1) / (x2 - x1);
        const yLine = y1 + t * (y2 - y1);
        const dist = Math.abs(chartY - yLine);
        if (dist < minDist) {
          minDist = dist;
          best = d;
        }
      }
    }
  });

  if (best !== hoveredBlock) {
    hoveredBlock = best;
    render();
    if (best) {
      tooltip.style("opacity", 1)
        .html(`<b>Block ${best.id}</b><br>Avg Score: ${best.avg.toFixed(2)}<br>` + 
              agents.map((a,i) => `${a}: ${best.scores[i]}`).join("<br>"))
        .style("left", (event.clientX + 10) + "px")
        .style("top", (event.clientY + 10) + "px");
      
      d3.selectAll(".block-tag").classed("highlight", tag => tag.id === best.id);
    } else {
      tooltip.style("opacity", 0);
      d3.selectAll(".block-tag").classed("highlight", false);
    }
  } else if (best) {
    tooltip.style("left", (event.clientX + 10) + "px")
           .style("top", (event.clientY + 10) + "px");
  }
});

svg.on("mouseleave", () => {
  hoveredBlock = null;
  render();
  tooltip.style("opacity", 0);
  d3.selectAll(".block-tag").classed("highlight", false);
});

// Block List
function updateBlockList(visible) {
  const list = d3.select("#block-list");
  d3.select("#list-title").text(activeBrushes.size > 0 ? "Selected Blocks" : "All Blocks");
  
  const tags = list.selectAll(".block-tag")
    .data(visible, d => d.id);
    
  tags.exit().remove();
  
  tags.enter().append("span")
    .attr("class", "block-tag")
    .text(d => d.id)
    .on("mouseenter", (e, d) => {
       hoveredBlock = d;
       render();
       d3.select(e.target).classed("highlight", true);
    })
    .on("mouseleave", (e, d) => {
       hoveredBlock = null;
       render();
       d3.select(e.target).classed("highlight", false);
    });
}

// Version Switching
d3.select("#btn-v1").on("click", function() {
  currentData = v1Data;
  d3.select(this).classed("active", true);
  d3.select("#btn-v2").classed("active", false);
  render();
});

d3.select("#btn-v2").on("click", function() {
  currentData = v2Data;
  d3.select(this).classed("active", true);
  d3.select("#btn-v1").classed("active", false);
  render();
});

// Theme support: handle theme change event if any
document.documentElement.addEventListener("themechange", render);

// Init
render();

// Handle window resize
window.addEventListener("resize", () => {
  const newWidth = document.getElementById('chart-wrap').clientWidth;
  if (newWidth === width) return;
  location.reload(); // Simple refresh for resize
});

</script>
</body>
</html>
