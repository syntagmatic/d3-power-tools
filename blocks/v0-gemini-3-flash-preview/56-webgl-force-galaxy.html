<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>50K-Node Force Galaxy</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background: #0a0a1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        #container { position: relative; width: 800px; height: 700px; margin: 0 auto; background: #0a0a1a; }
        canvas, svg { position: absolute; top: 0; left: 0; width: 800px; height: 700px; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        h1 { margin: 0 0 10px 0; font-size: 20px; font-weight: 300; letter-spacing: 1.5px; text-transform: uppercase; color: #fff; text-shadow: 0 0 10px rgba(74, 175, 255, 0.5); }
        #controls { pointer-events: auto; display: flex; align-items: center; gap: 15px; }
        button { background: rgba(26, 26, 58, 0.8); color: #fff; border: 1px solid #44af; padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: bold; border-radius: 2px; transition: all 0.2s; }
        button:hover { background: rgba(42, 42, 74, 0.9); border-color: #4af; box-shadow: 0 0 10px rgba(74, 175, 255, 0.3); }
        #alpha-wrap { display: flex; align-items: center; gap: 8px; }
        #alpha-container { width: 120px; height: 4px; background: #1a1a2a; border-radius: 2px; overflow: hidden; }
        #alpha-bar { height: 100%; background: linear-gradient(90deg, #4af, #a4f); width: 0%; transition: width 0.1s; }
        #alpha-text { font-family: monospace; font-size: 11px; color: #889; min-width: 40px; }
        #tooltip { position: absolute; background: rgba(5, 5, 15, 0.95); border: 1px solid #334; padding: 10px; font-size: 12px; pointer-events: none; visibility: hidden; z-index: 100; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); line-height: 1.4; border-left: 3px solid #4af; }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="viz"></canvas>
        <svg id="overlay"></svg>
        <div id="ui">
            <h1>50K-Node Force Galaxy</h1>
            <div id="controls">
                <button id="reheat">REHEAT SIMULATION</button>
                <div id="alpha-wrap">
                    <div id="alpha-container"><div id="alpha-bar"></div></div>
                    <span id="alpha-text"></span>
                </div>
            </div>
        </div>
        <div id="tooltip"></div>
    </div>

    <script>
        const width = 800, height = 700;
        const numNodes = 50000;
        const numCommunities = 8;
        const numEdges = 80000;

        // Tol Muted palette
        const tolMuted = ["#88CCEE", "#44AA99", "#117733", "#999933", "#DDCC77", "#CC6677", "#882255", "#AA4499"];
        const communityColors = tolMuted.map(c => {
            const rgb = d3.rgb(c);
            return [rgb.r/255, rgb.g/255, rgb.b/255, 0.8];
        });

        // 1. Data Generation
        const nodes = Array.from({length: numNodes}, (_, i) => ({
            id: i,
            community: Math.floor(Math.random() * numCommunities),
            degree: 0,
            x: (Math.random() - 0.5) * width + width/2,
            y: (Math.random() - 0.5) * height + height/2
        }));

        const edges = [];
        // Group nodes by community for faster edge generation
        const nodesByComm = d3.group(nodes, d => d.community);
        
        for (let i = 0; i < numEdges; i++) {
            const isInternal = Math.random() < 0.85;
            const sourceIdx = Math.floor(Math.random() * numNodes);
            const source = nodes[sourceIdx];
            let target;

            if (isInternal) {
                const commNodes = nodesByComm.get(source.community);
                target = commNodes[Math.floor(Math.random() * commNodes.length)];
            } else {
                target = nodes[Math.floor(Math.random() * numNodes)];
            }

            if (source.id !== target.id) {
                edges.push({source: source.id, target: target.id});
                source.degree++;
                target.degree++;
            }
        }

        const communityCenters = Array.from({length: numCommunities}, (_, i) => {
            const angle = (i / numCommunities) * 2 * Math.PI;
            return {
                x: width/2 + 220 * Math.cos(angle),
                y: height/2 + 220 * Math.sin(angle)
            };
        });

        // 2. Force Simulation
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(edges).id(d => d.id).distance(d => d.source.community === d.target.community ? 15 : 60))
            .force("charge", d3.forceManyBody().strength(-8))
            .force("x", d3.forceX().x(d => communityCenters[d.community].x).strength(0.12))
            .force("y", d3.forceY().y(d => communityCenters[d.community].y).strength(0.12))
            .alphaDecay(0.01);

        // 3. WebGL Setup
        const canvas = document.getElementById("viz");
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        const gl = canvas.getContext("webgl2", {antialias: true, premultipliedAlpha: false});

        const vsSource = `#version 300 es
        layout(location = 0) in vec2 a_quad;
        layout(location = 1) in vec2 a_offset;
        layout(location = 2) in float a_size;
        layout(location = 3) in vec4 a_color;
        uniform vec2 u_resolution;
        out vec4 v_color;
        out vec2 v_uv;
        void main() {
            vec2 pos = a_quad * a_size + a_offset;
            vec2 clip = (pos / u_resolution) * 2.0 - 1.0;
            gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
            v_color = a_color;
            v_uv = a_quad;
        }`;

        const fsSource = `#version 300 es
        precision mediump float;
        in vec4 v_color;
        in vec2 v_uv;
        out vec4 fragColor;
        void main() {
            float dist = length(v_uv);
            if (dist > 0.5) discard;
            float alpha = 1.0 - smoothstep(0.4, 0.5, dist);
            fragColor = vec4(v_color.rgb, v_color.a * alpha);
        }`;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);

        // Instanced attributes
        const quadBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5,-0.5, 0.5,-0.5, 0.5,0.5, -0.5,-0.5, 0.5,0.5, -0.5,0.5]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        const posData = new Float32Array(numNodes * 2);
        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, posData, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(1, 1);

        const sizeData = new Float32Array(numNodes);
        for (let i = 0; i < numNodes; i++) sizeData[i] = Math.sqrt(nodes[i].degree) * 1.5;
        const sizeBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, sizeData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(2, 1);

        const colorData = new Float32Array(numNodes * 4);
        for (let i = 0; i < numNodes; i++) {
            const c = communityColors[nodes[i].community];
            colorData.set(c, i * 4);
        }
        const colorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, colorData, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(3);
        gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(3, 1);

        gl.uniform2f(gl.getUniformLocation(program, "u_resolution"), width, height);
        gl.viewport(0, 0, width * dpr, height * dpr);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

        // 4. Interaction
        let qt;
        const tooltip = d3.select("#tooltip");
        d3.select("#overlay").on("pointermove", (event) => {
            if (!qt) return;
            const [mx, my] = d3.pointer(event);
            const d = qt.find(mx, my, 15);
            if (d) {
                tooltip.style("visibility", "visible")
                    .style("left", (event.pageX + 15) + "px")
                    .style("top", (event.pageY + 15) + "px")
                    .html(`<strong>Community:</strong> ${d.community}<br><strong>Degree:</strong> ${d.degree}`);
            } else {
                tooltip.style("visibility", "hidden");
            }
        });

        // 5. Animation Loop
        const alphaBar = document.getElementById("alpha-bar");
        const alphaText = document.getElementById("alpha-text");

        function render() {
            simulation.tick();
            
            for (let i = 0; i < numNodes; i++) {
                posData[i*2] = nodes[i].x;
                posData[i*2+1] = nodes[i].y;
            }
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, posData);

            gl.clearColor(0.04, 0.04, 0.1, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, numNodes);

            const alpha = simulation.alpha();
            alphaBar.style.width = (alpha * 100) + "%";
            alphaText.textContent = alpha.toFixed(4);

            qt = d3.quadtree().x(d => d.x).y(d => d.y).addAll(nodes);
            
            requestAnimationFrame(render);
        }

        document.getElementById("reheat").onclick = () => {
            simulation.alpha(1).restart();
        };

        render();
    </script>
</body>
</html>
