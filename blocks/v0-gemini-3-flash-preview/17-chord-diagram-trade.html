<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Trade Flow - Chord Diagram</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #chart-container {
            position: relative;
            width: 800px;
            height: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        .chord {
            stroke-width: 0.5px;
            transition: opacity 0.2s;
        }
        .arc {
            cursor: pointer;
        }
        .label {
            font-size: 12px;
            font-weight: 500;
            fill: #444;
            pointer-events: none;
        }
        .tick line {
            stroke: #999;
            stroke-width: 1px;
        }
        .tick text {
            font-size: 10px;
            fill: #666;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ddd;
            border-radius: 4px;
            pointer-events: none;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .tooltip strong {
            display: block;
            margin-bottom: 4px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

<div id="chart-container">
    <div class="title">Major Global Trade Flows (Billions USD)</div>
    <div id="chart"></div>
    <div class="tooltip" id="tooltip"></div>
</div>

<script>
    // Data: Trade matrix (exports from row to column)
    const countries = ["USA", "China", "Germany", "Japan", "UK", "France", "S. Korea", "India", "Canada", "Mexico"];
    
    // Realistic Trade Matrix (Billions USD) - Estimates for 2024
    // Rows = Exporters, Cols = Importers
    const matrix = [
        [0, 150, 75, 80, 70, 40, 70, 50, 350, 320], // USA
        [500, 0, 120, 160, 100, 50, 180, 120, 100, 80], // China
        [80, 110, 0, 25, 90, 150, 25, 20, 15, 12], // Germany
        [85, 150, 25, 0, 15, 10, 75, 18, 12, 10], // Japan
        [75, 30, 80, 15, 0, 45, 10, 15, 12, 8], // UK
        [45, 35, 140, 12, 50, 0, 12, 10, 10, 8], // France
        [75, 170, 20, 50, 12, 10, 0, 15, 10, 10], // S. Korea
        [55, 25, 18, 15, 22, 12, 18, 0, 8, 10], // India
        [450, 30, 12, 15, 20, 10, 15, 10, 0, 10], // Canada
        [480, 20, 10, 12, 8, 8, 12, 10, 15, 0]  // Mexico
    ];

    const width = 800;
    const height = 700;
    const outerRadius = 275;
    const innerRadius = outerRadius - 20;

    const svg = d3.select("#chart")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", `translate(${width / 2},${height / 2})`);

    const chord = d3.chord()
        .padAngle(0.04)
        .sortSubgroups(d3.descending);

    const arc = d3.arc()
        .innerRadius(innerRadius)
        .outerRadius(outerRadius);

    const ribbon = d3.ribbon()
        .radius(innerRadius);

    // Paul Tol Bright Palette (10 colors)
    const colors = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377", "#BBBBBB", "#222255", "#444444", "#999933"];
    const colorScale = d3.scaleOrdinal()
        .domain(d3.range(10))
        .range(colors);

    const chords = chord(matrix);
    const tooltip = d3.select("#tooltip");

    // 1. Draw Arcs (Countries)
    const gArc = svg.append("g")
        .selectAll("g")
        .data(chords.groups)
        .join("g")
        .attr("class", "arc-group");

    const pathArc = gArc.append("path")
        .attr("class", "arc")
        .style("fill", d => colorScale(d.index))
        .style("stroke", d => d3.rgb(colorScale(d.index)).darker())
        .on("mouseover", (event, d) => {
            fade(0.05, d.index);
            showCountryTooltip(event, d);
        })
        .on("mouseout", () => {
            fade(0.5);
            tooltip.style("opacity", 0);
        });

    // Arc animation
    pathArc.transition()
        .duration(400)
        .ease(d3.easeCubicOut)
        .attrTween("d", d => {
            const i = d3.interpolate(d.startAngle, d.endAngle);
            return t => {
                d.endAngle = i(t);
                return arc(d);
            };
        });

    // 2. Draw Labels
    gArc.append("text")
        .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
        .attr("class", "label")
        .attr("dy", ".35em")
        .attr("transform", d => `
            rotate(${(d.angle * 180 / Math.PI - 90)})
            translate(${outerRadius + 10})
            ${d.angle > Math.PI ? "rotate(180)" : ""}
        `)
        .attr("text-anchor", d => d.angle > Math.PI ? "end" : "start")
        .text(d => countries[d.index])
        .style("opacity", 0)
        .transition()
        .delay(400)
        .duration(400)
        .style("opacity", 1);

    // 3. Draw Ticks
    const gTicks = gArc.append("g")
        .selectAll("g")
        .data(d => groupTicks(d, 100))
        .join("g")
        .attr("class", "tick")
        .attr("transform", d => `rotate(${d.angle * 180 / Math.PI - 90}) translate(${outerRadius},0)`);

    gTicks.append("line")
        .attr("x2", 6);

    gTicks.append("text")
        .attr("x", 8)
        .attr("dy", ".35em")
        .attr("transform", d => d.angle > Math.PI ? "rotate(180) translate(-16)" : null)
        .attr("text-anchor", d => d.angle > Math.PI ? "end" : "start")
        .text(d => d.label)
        .style("opacity", 0)
        .transition()
        .delay(400)
        .duration(400)
        .style("opacity", 1);

    // 4. Draw Chords
    const pathChord = svg.append("g")
        .attr("fill-opacity", 0.5)
        .selectAll("path")
        .data(chords)
        .join("path")
        .attr("class", "chord")
        .style("fill", d => {
            // Color by the larger exporter
            return matrix[d.source.index][d.target.index] > matrix[d.target.index][d.source.index] 
                ? colorScale(d.source.index) 
                : colorScale(d.target.index);
        })
        .style("stroke", d => d3.rgb(colorScale(d.source.index)).darker())
        .on("mouseover", (event, d) => {
            d3.select(event.currentTarget).style("fill-opacity", 0.8);
            showChordTooltip(event, d);
        })
        .on("mouseout", (event) => {
            d3.select(event.currentTarget).style("fill-opacity", 0.5);
            tooltip.style("opacity", 0);
        });

    // Chord animation: grow from center
    pathChord.style("opacity", 0)
        .transition()
        .delay(400)
        .duration(800)
        .ease(d3.easeCubicOut)
        .style("opacity", 1)
        .attrTween("d", d => {
            const i = d3.interpolate({source: {startAngle: d.source.startAngle, endAngle: d.source.startAngle}, target: {startAngle: d.target.startAngle, endAngle: d.target.startAngle}}, d);
            return t => ribbon(i(t));
        });

    // Interactions
    function fade(opacity, index = null) {
        pathChord.transition()
            .duration(200)
            .style("opacity", d => {
                if (index === null) return 1;
                return (d.source.index === index || d.target.index === index) ? 1 : opacity;
            });
    }

    function showCountryTooltip(event, d) {
        const exports = matrix[d.index].reduce((a, b) => a + b, 0);
        const imports = matrix.reduce((acc, row) => acc + row[d.index], 0);
        const total = exports + imports;

        tooltip.html(`
            <strong>${countries[d.index]}</strong>
            Exports: $${exports.toFixed(1)}B<br/>
            Imports: $${imports.toFixed(1)}B<br/>
            Total Trade: $${total.toFixed(1)}B
        `)
        .style("left", (event.pageX + 15) + "px")
        .style("top", (event.pageY - 15) + "px")
        .style("opacity", 1);
    }

    function showChordTooltip(event, d) {
        const sourceCountry = countries[d.source.index];
        const targetCountry = countries[d.target.index];
        const sourceToTarget = matrix[d.source.index][d.target.index];
        const targetToSource = matrix[d.target.index][d.source.index];

        tooltip.html(`
            <strong>${sourceCountry} ⟷ ${targetCountry}</strong>
            ${sourceCountry} Exports to ${targetCountry}: $${sourceToTarget.toFixed(1)}B<br/>
            ${targetCountry} Exports to ${sourceCountry}: $${targetToSource.toFixed(1)}B<br/>
            Total Bilateral: $${(sourceToTarget + targetToSource).toFixed(1)}B
        `)
        .style("left", (event.pageX + 15) + "px")
        .style("top", (event.pageY - 15) + "px")
        .style("opacity", 1);
    }

    function groupTicks(d, step) {
        const k = (d.endAngle - d.startAngle) / d.value;
        return d3.range(0, d.value, step).map(value => {
            return {
                value: value,
                angle: value * k + d.startAngle,
                label: value % 500 === 0 ? `$${value}B` : ""
            };
        });
    }

</script>

</body>
</html>
