<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Edge Bundling - D3.js Power Tools</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --panel-bg: #f8f9fa;
            --border-color: #dddddd;
            --primary-blue: #4477AA;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 800px;
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas, svg {
            position: absolute;
            top: 100px;
            left: 100px;
        }

        #controls {
            position: fixed;
            bottom: 40px;
            width: 600px;
            background: var(--panel-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type=range] {
            flex-grow: 1;
            cursor: pointer;
        }

        #play-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            min-width: 80px;
            transition: background 0.2s;
        }

        #play-btn:hover {
            background: #336699;
        }

        .labels {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 12px;
            color: #666;
        }

        #header {
            margin-top: 30px;
            text-align: center;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 700;
        }

        #stats {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            background: #eee;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            color: var(--primary-blue);
        }

        #month-display {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-blue);
            min-width: 100px;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="header">
    <h1>Temporal Edge Bundling</h1>
    <div id="stats">
        Active Connections: <span id="edge-count" class="badge">0</span>
    </div>
</div>

<div id="container">
    <canvas id="edge-canvas"></canvas>
    <svg id="node-svg"></svg>
</div>

<div id="controls">
    <div class="slider-row">
        <button id="play-btn">Play</button>
        <input type="range" id="month-slider" min="1" max="12" value="1">
        <div id="month-display">January</div>
    </div>
    <div class="labels">
        <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span>
        <span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
    </div>
</div>

<script>
    const width = 600;
    const height = 600;
    const radius = width / 2;
    const innerRadius = radius - 80;

    const TOL_BRIGHT = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE"];
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    // 1. Data Generation
    function generateData() {
        const departments = ["Engineering", "Sales", "Marketing", "Design", "Product"];
        const hierarchy = { name: "Root", children: [] };
        const leaves = [];

        departments.forEach((dept, i) => {
            const deptNode = { name: dept, color: TOL_BRIGHT[i], children: [] };
            hierarchy.children.push(deptNode);

            const numTeams = 4 + Math.floor(Math.random() * 2);
            for (let t = 0; t < numTeams; t++) {
                const teamNode = { name: `${dept} Team ${t+1}`, children: [] };
                deptNode.children.push(teamNode);

                const numMembers = 4 + Math.floor(Math.random() * 2);
                for (let m = 0; m < numMembers; m++) {
                    const leaf = { 
                        id: `${dept}-${t}-${m}`,
                        name: `Member ${m+1}`,
                        dept: dept,
                        deptColor: TOL_BRIGHT[i]
                    };
                    teamNode.children.push(leaf);
                    leaves.push(leaf);
                }
            }
        });

        const edges = [];
        const numEdges = 300;
        for (let i = 0; i < numEdges; i++) {
            const source = leaves[Math.floor(Math.random() * leaves.length)];
            let target = leaves[Math.floor(Math.random() * leaves.length)];
            
            // Cross-department edges
            while (target.dept === source.dept) {
                target = leaves[Math.floor(Math.random() * leaves.length)];
            }

            const startMonth = 1 + Math.floor(Math.random() * 11);
            const duration = 1 + Math.floor(Math.random() * 4);
            const endMonth = Math.min(12, startMonth + duration);

            edges.push({
                sourceId: source.id,
                targetId: target.id,
                startMonth,
                endMonth
            });
        }

        return { hierarchy, edges };
    }

    const { hierarchy, edges } = generateData();

    // 2. Setup Canvas & SVG
    const dpr = window.devicePixelRatio || 1;
    const canvas = d3.select("#edge-canvas")
        .attr("width", width * dpr)
        .attr("height", height * dpr)
        .style("width", `${width}px`)
        .style("height", `${height}px`)
        .node();
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    const svg = d3.select("#node-svg")
        .attr("width", width)
        .attr("height", height);

    const g = svg.append("g")
        .attr("transform", `translate(${radius},${radius})`);

    // 3. Layout
    const cluster = d3.cluster()
        .size([2 * Math.PI, innerRadius]);

    const root = d3.hierarchy(hierarchy);
    cluster(root);

    const nodesById = new Map(root.leaves().map(d => [d.data.id, d]));

    // Pre-calculate edge paths (LCA routing)
    const edgePaths = edges.map(e => {
        const source = nodesById.get(e.sourceId);
        const target = nodesById.get(e.targetId);
        if (!source || !target) return null;
        return {
            ...e,
            path: source.path(target)
        };
    }).filter(d => d !== null);

    const line = d3.lineRadial()
        .curve(d3.curveBundle.beta(0.15))
        .radius(d => d.y)
        .angle(d => d.x)
        .context(ctx);

    // 4. Interaction State
    let currentMonth = 1;
    let isPlaying = false;
    let timer = null;

    function update() {
        const activeEdges = edgePaths.filter(e => currentMonth >= e.startMonth && currentMonth <= e.endMonth);
        const activeNodeIds = new Set();
        activeEdges.forEach(e => {
            activeNodeIds.add(e.sourceId);
            activeNodeIds.add(e.targetId);
        });

        // Update Stats
        d3.select("#edge-count").text(activeEdges.length);
        d3.select("#month-display").text(MONTHS[currentMonth - 1]);
        d3.select("#month-slider").property("value", currentMonth);

        // Draw Canvas Edges
        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.translate(radius, radius);
        ctx.strokeStyle = "rgba(68, 119, 170, 0.3)"; // Tol Blue
        ctx.lineWidth = 1;

        activeEdges.forEach(e => {
            ctx.beginPath();
            line(e.path);
            ctx.stroke();
        });
        ctx.restore();

        // Update SVG Nodes
        g.selectAll("circle")
            .data(root.leaves(), d => d.data.id)
            .join("circle")
            .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
            .transition()
            .duration(300)
            .attr("r", d => activeNodeIds.has(d.data.id) ? 5 : 3)
            .attr("fill", d => activeNodeIds.has(d.data.id) ? d.data.deptColor : "#BBBBBB")
            .attr("opacity", d => activeNodeIds.has(d.data.id) ? 1 : 0.3);
    }

    // Initial Render
    update();

    // 5. Controls Logic
    d3.select("#month-slider").on("input", function() {
        currentMonth = +this.value;
        update();
        if (isPlaying) stop();
    });

    function play() {
        isPlaying = true;
        d3.select("#play-btn").text("Pause");
        timer = setInterval(() => {
            currentMonth = (currentMonth % 12) + 1;
            update();
        }, 800);
    }

    function stop() {
        isPlaying = false;
        d3.select("#play-btn").text("Play");
        clearInterval(timer);
    }

    d3.select("#play-btn").on("click", () => {
        if (isPlaying) stop();
        else play();
    });

</script>
</body>
</html>
