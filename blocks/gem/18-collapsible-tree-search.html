<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biological Taxonomy - Collapsible Tree Search</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --link-color: #cccccc;
            --node-fill: #ffffff;
            --leaf-fill: #999999;
            --highlight-color: #EE6677;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-box {
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: white;
            padding: 10px 0;
            z-index: 100;
            border-bottom: 1px solid #eee;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #666;
        }

        .tree-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .node circle {
            cursor: pointer;
            stroke: #666;
            stroke-width: 1.5px;
            fill: var(--node-fill);
        }

        .node--internal circle {
            fill: var(--node-fill);
        }

        .node--leaf circle {
            fill: var(--leaf-fill);
            stroke: none;
        }

        .node text {
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .link {
            fill: none;
            stroke: var(--link-color);
            stroke-width: 1px;
        }

        .node-highlight circle {
            stroke: var(--highlight-color);
            stroke-width: 3px;
            filter: drop-shadow(0 0 4px var(--highlight-color));
        }

        .node-highlight text {
            fill: var(--highlight-color);
            font-weight: bold;
        }

        .dimmed {
            opacity: 0.3;
        }

        .badge {
            font-size: 10px;
            fill: #777;
            font-style: italic;
        }

        .plus-icon {
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
            alignment-baseline: middle;
            fill: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Biological Taxonomy Explorer</h1>
        <div class="search-box">
            <input type="text" id="search" placeholder="Search taxonomy (e.g., Mammalia, Chordata)..." autocomplete="off">
        </div>
        <div class="tree-container">
            <svg id="viz"></svg>
        </div>
    </div>

    <script>
        // 1. Data Generation
        function generateTaxonomy() {
            const domains = ["Archaea", "Bacteria", "Eukaryota", "Viruses"];
            const eukKingdoms = ["Animalia", "Plantae", "Fungi", "Protista"];
            const bacKingdoms = ["Proteobacteria", "Firmicutes", "Actinobacteria", "Cyanobacteria"];
            const archKingdoms = ["Euryarchaeota", "TACK group", "Asgardarchaeota"];
            const virKingdoms = ["Duplodnaviria", "Varidnaviria", "Riboviria"];

            const animalPhyla = ["Chordata", "Arthropoda", "Mollusca", "Annelida", "Cnidaria"];
            const plantPhyla = ["Bryophyta", "Pteridophyta", "Pinophyta", "Magnoliophyta"];
            
            const chordateClasses = ["Mammalia", "Aves", "Reptilia", "Amphibia", "Actinopterygii"];
            const arthropodClasses = ["Insecta", "Arachnida", "Malacostraca", "Chilopoda"];
            
            const mammalOrders = ["Primates", "Carnivora", "Rodentia", "Cetartiodactyla", "Chiroptera"];

            function buildBranch(name, childrenNames, depth, maxDepth) {
                const node = { name };
                if (depth < maxDepth && childrenNames && childrenNames.length > 0) {
                    node.children = childrenNames.map(c => {
                        let grandkids = [];
                        if (name === "Life") return buildBranch(c, 
                            c === "Eukaryota" ? eukKingdoms : 
                            c === "Bacteria" ? bacKingdoms : 
                            c === "Archaea" ? archKingdoms : virKingdoms, depth + 1, maxDepth);
                        
                        if (name === "Eukaryota") {
                            if (c === "Animalia") grandkids = animalPhyla;
                            if (c === "Plantae") grandkids = plantPhyla;
                        }
                        
                        if (name === "Animalia") {
                            if (c === "Chordata") grandkids = chordateClasses;
                            if (c === "Arthropoda") grandkids = arthropodClasses;
                        }

                        if (name === "Chordata") {
                            if (c === "Mammalia") grandkids = mammalOrders;
                        }

                        // Fill in random names for generic branches to reach node count
                        if (grandkids.length === 0 && depth < maxDepth - 1) {
                            const count = 3 + Math.floor(Math.random() * 2);
                            grandkids = Array.from({length: count}, (_, i) => `${c} Subgroup ${i+1}`);
                        }

                        return buildBranch(c, grandkids, depth + 1, maxDepth);
                    });
                }
                return node;
            }

            return buildBranch("Life", domains, 0, 5);
        }

        const data = generateTaxonomy();

        // 2. Setup Dimensions
        const margin = {top: 20, right: 120, bottom: 20, left: 80};
        const width = 1200 - margin.left - margin.right;
        let height = 800 - margin.top - margin.bottom;

        const svg = d3.select("#viz")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        let i = 0;
        const duration = 500;
        let root;

        const tree = d3.tree().nodeSize([30, 180]);
        const diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x);

        root = d3.hierarchy(data, d => d.children);
        root.x0 = height / 2;
        root.y0 = 0;

        // Initially expand first 2 levels (root level 0 and its children level 1)
        root.descendants().forEach(d => {
            if (d.depth >= 2) {
                if (d.children) {
                    d._children = d.children;
                    d.children = null;
                }
            }
        });

        update(root);

        function update(source) {
            const nodes = root.descendants();
            const links = root.links();

            // Recompute layout
            tree(root);

            // Compute new height based on expanded nodes
            let left = root, right = root;
            root.each(node => {
                if (node.x < left.x) left = node;
                if (node.x > right.x) right = node;
            });
            const newHeight = right.x - left.x + margin.top + margin.bottom + 100;
            d3.select("#viz").transition().duration(duration).attr("height", Math.max(800, newHeight));

            // Update nodes
            const node = svg.selectAll("g.node")
                .data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append("g")
                .attr("class", d => `node ${d.children || d._children ? "node--internal" : "node--leaf"}`)
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .on("click", (event, d) => {
                    if (d.children) {
                        d._children = d.children;
                        d.children = null;
                    } else if (d._children) {
                        d.children = d._children;
                        d._children = null;
                    }
                    update(d);
                });

            nodeEnter.append("circle")
                .attr("r", 1e-6);

            nodeEnter.append("text")
                .attr("dy", ".35em")
                .attr("x", d => d.children || d._children ? -12 : 12)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .text(d => d.data.name);

            // Plus icon for collapsed nodes
            nodeEnter.append("text")
                .attr("class", "plus-icon")
                .attr("dy", ".35em")
                .text("+")
                .style("opacity", 0);

            // Descendant count badge
            nodeEnter.append("text")
                .attr("class", "badge")
                .attr("dy", "1.4em")
                .attr("x", d => d.children || d._children ? -12 : 12)
                .attr("text-anchor", d => d.children || d._children ? "end" : "start")
                .style("opacity", 0);

            const nodeUpdate = nodeEnter.merge(node);

            nodeUpdate.transition().duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            nodeUpdate.select("circle")
                .attr("r", 6)
                .style("fill", d => d._children ? "#fff" : (d.children ? "#fff" : "#999"));

            nodeUpdate.select(".plus-icon")
                .style("opacity", d => d._children ? 1 : 0);

            nodeUpdate.select(".badge")
                .text(d => d._children ? `(${countDescendants(d)} descendants)` : "")
                .style("opacity", d => d._children ? 1 : 0);

            const nodeExit = node.exit().transition().duration(duration)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();

            nodeExit.select("circle").attr("r", 1e-6);
            nodeExit.select("text").style("fill-opacity", 1e-6);

            // Update links
            const link = svg.selectAll("path.link")
                .data(links, d => d.target.id);

            const linkEnter = link.enter().insert("path", "g")
                .attr("class", "link")
                .attr("d", d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal({source: o, target: o});
                });

            link.merge(linkEnter).transition().duration(duration)
                .attr("d", diagonal);

            link.exit().transition().duration(duration)
                .attr("d", d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal({source: o, target: o});
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        function countDescendants(d) {
            let count = 0;
            function recurse(node) {
                const children = node.children || node._children;
                if (children) {
                    count += children.length;
                    children.forEach(recurse);
                }
            }
            recurse(d);
            return count;
        }

        // 3. Search Functionality
        const searchInput = d3.select("#search");
        searchInput.on("input", function() {
            const term = this.value.toLowerCase();
            
            if (!term) {
                // Clear search
                svg.selectAll(".node").classed("dimmed", false).classed("node-highlight", false);
                svg.selectAll(".link").classed("dimmed", false);
                return;
            }

            // Mark all nodes that match or have matching descendants
            const matches = [];
            root.descendants().forEach(d => {
                d.isMatch = d.data.name.toLowerCase().includes(term);
                if (d.isMatch) matches.push(d);
            });

            if (matches.length > 0) {
                // Expand paths to matches
                matches.forEach(d => {
                    let curr = d;
                    while (curr.parent) {
                        if (curr.parent._children) {
                            curr.parent.children = curr.parent._children;
                            curr.parent._children = null;
                        }
                        curr = curr.parent;
                    }
                });
                
                update(root);

                // Highlight and Dim
                svg.selectAll(".node")
                    .classed("node-highlight", d => d.isMatch)
                    .classed("dimmed", d => {
                        // Keep visible if it's on a path to a match or is a match
                        const onPath = matches.some(m => m.ancestors().includes(d) || d.ancestors().includes(m));
                        return !onPath;
                    });
                
                svg.selectAll(".link")
                    .classed("dimmed", d => {
                        const targetOnPath = matches.some(m => m.ancestors().includes(d.target));
                        return !targetOnPath;
                    });
            } else {
                // No matches
                svg.selectAll(".node").classed("dimmed", true).classed("node-highlight", false);
                svg.selectAll(".link").classed("dimmed", true);
            }
        });

    </script>
</body>
</html>
