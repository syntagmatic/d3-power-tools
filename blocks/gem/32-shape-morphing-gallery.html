<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shape Morphing Gallery</title>
    <link rel="stylesheet" href="../../style/d3-power-tools.css">
    <style>
        body { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 250px);
            grid-gap: 20px;
        }
        .cell {
            width: 250px;
            height: 230px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius);
            background: var(--color-surface);
            padding: 10px;
            box-shadow: var(--shadow);
        }
        .cell svg { width: 250px; height: 190px; }
        .label { margin-top: 8px; font-size: 11px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <h1>Shape Morphing <b>Gallery</b></h1>
    <div class="grid" id="grid"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        const colors = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377", "#BBBBBB"];
        const grid = d3.select("#grid");

        const morphs = [
            { name: "Circle ↔ Rectangle", init: initCircleRect },
            { name: "Bar ↔ Pie Slice", init: initBarPie },
            { name: "Star ↔ Circle", init: initStarCircle },
            { name: "Line ↔ Area", init: initLineArea },
            { name: "Scatter ↔ Bar", init: initScatterBar },
            { name: "Horizontal ↔ Vertical Bars", init: initHVBar },
            { name: "Grouped ↔ Stacked", init: initGroupedStacked },
            { name: "Treemap ↔ Circle Pack", init: initTreemapPack },
            { name: "Donut ↔ Sunburst", init: initDonutSunburst }
        ];

        morphs.forEach((m, i) => {
            const cell = grid.append("div").attr("class", "cell");
            const svg = cell.append("svg").attr("viewBox", "0 0 250 190");
            cell.append("div").attr("class", "label").text(m.name);
            m.init(svg, i * 200);
        });

        function loop(transition, forward, reverse, delay) {
            transition
                .delay(delay)
                .duration(1500)
                .call(forward)
                .transition()
                .delay(500)
                .duration(1500)
                .call(reverse)
                .transition()
                .delay(500)
                .on("end", function() { loop(d3.select(this).transition(), forward, reverse, 0); });
        }

        // 1. CIRCLE ↔ RECTANGLE
        function initCircleRect(svg, delay) {
            const g = svg.append("g").attr("transform", "translate(125, 95)");
            const rect = g.append("rect")
                .attr("x", -60).attr("y", -60)
                .attr("width", 120).attr("height", 120)
                .attr("rx", 60).attr("ry", 60)
                .attr("fill", colors[0]);

            function forward(t) { t.attr("rx", 0).attr("ry", 0); }
            function reverse(t) { t.attr("rx", 60).attr("ry", 60); }
            loop(rect.transition(), forward, reverse, delay);
        }

        // 2. BAR ↔ PIE SLICE
        function initBarPie(svg, delay) {
            const g = svg.append("g").attr("transform", "translate(125, 120)");
            
            function getRectPoints(w, h) {
                const pts = [];
                const n = 10;
                for(let i=0; i<n; i++) pts.push([-w/2 + i*w/n, -h]);
                for(let i=0; i<n; i++) pts.push([w/2, -h + i*h/n]);
                for(let i=0; i<n; i++) pts.push([w/2 - i*w/n, 0]);
                for(let i=0; i<n; i++) pts.push([-w/2, 0 - i*h/n]);
                return pts;
            }
            
            function getArcPoints(inner, outer, start, end) {
                const pts = [];
                const n = 19; 
                for(let i=0; i<=n; i++) {
                    const a = start + (i/n)*(end-start);
                    pts.push([outer * Math.sin(a), -outer * Math.cos(a)]);
                }
                for(let i=0; i<=n; i++) {
                    const a = end - (i/n)*(end-start);
                    pts.push([inner * Math.sin(a), -inner * Math.cos(a)]);
                }
                return pts;
            }

            const barPts = getRectPoints(40, 100);
            const piePts = getArcPoints(0, 100, -Math.PI/3, Math.PI/3);
            const line = d3.line().curve(d3.curveLinearClosed);
            
            const path = g.append("path")
                .attr("d", line(barPts))
                .attr("fill", colors[1]);

            function forward(t) {
                t.attrTween("d", () => {
                    const interp = d3.interpolate(barPts, piePts);
                    return t => line(interp(t));
                });
            }
            function reverse(t) {
                t.attrTween("d", () => {
                    const interp = d3.interpolate(piePts, barPts);
                    return t => line(interp(t));
                });
            }
            loop(path.transition(), forward, reverse, delay);
        }

        // 3. STAR ↔ CIRCLE
        function initStarCircle(svg, delay) {
            const g = svg.append("g").attr("transform", "translate(125, 95)");
            
            function getPoints(rInner, rOuter) {
                const pts = [];
                for(let i=0; i<10; i++) {
                    const r = i % 2 === 0 ? rOuter : rInner;
                    const a = (i / 10) * Math.PI * 2 - Math.PI/2;
                    pts.push([r * Math.cos(a), r * Math.sin(a)]);
                }
                return pts;
            }

            const star = getPoints(25, 65);
            const circle = getPoints(65, 65);
            const line = d3.line().curve(d3.curveLinearClosed);

            const path = g.append("path")
                .attr("d", line(star))
                .attr("fill", colors[2]);

            function forward(t) {
                t.attrTween("d", () => {
                    const interp = d3.interpolate(star, circle);
                    return t => line(interp(t));
                });
            }
            function reverse(t) {
                t.attrTween("d", () => {
                    const interp = d3.interpolate(circle, star);
                    return t => line(interp(t));
                });
            }
            loop(path.transition(), forward, reverse, delay);
        }

        // 4. LINE ↔ AREA
        function initLineArea(svg, delay) {
            const g = svg.append("g").attr("transform", "translate(40, 35)");
            const data = [10, 50, 30, 80, 40, 90, 20];
            const x = d3.scaleLinear().domain([0, 6]).range([0, 170]);
            const y = d3.scaleLinear().domain([0, 100]).range([120, 0]);
            
            const areaGen = d3.area().x((d, i) => x(i)).y1(d => y(d));

            const path = g.append("path")
                .attr("d", areaGen.y0(d => y(d))(data))
                .attr("fill", colors[3])
                .attr("fill-opacity", 0)
                .attr("stroke", colors[3])
                .attr("stroke-width", 2.5)
                .attr("stroke-linejoin", "round")
                .attr("stroke-linecap", "round");

            function forward(t) {
                t.attrTween("d", () => t => {
                    areaGen.y0((v) => y(v) + t * (120 - y(v)));
                    return areaGen(data);
                }).attr("fill-opacity", 0.6);
            }
            function reverse(t) {
                t.attrTween("d", () => t => {
                    areaGen.y0((v) => 120 - t * (120 - y(v)));
                    return areaGen(data);
                }).attr("fill-opacity", 0);
            }
            loop(path.transition(), forward, reverse, delay);
        }

        // 5. SCATTER ↔ BAR
        function initScatterBar(svg, delay) {
            const g = svg.append("g").attr("transform", "translate(40, 35)");
            const data = [30, 70, 45, 90, 20, 55, 80, 40];
            const x = d3.scaleLinear().domain([0, 7]).range([10, 160]);
            
            const bars = g.selectAll("rect")
                .data(data)
                .enter().append("rect")
                .attr("x", (d, i) => x(i) - 5)
                .attr("y", (d, i) => 120 - d - (i%2?20:10))
                .attr("width", 10).attr("height", 10)
                .attr("rx", 5).attr("ry", 5)
                .attr("fill", (d, i) => colors[i % colors.length]);

            function forward(t) {
                t.attr("x", (d, i) => x(i) - 8)
                 .attr("y", d => 120 - d)
                 .attr("width", 16).attr("height", d => d)
                 .attr("rx", 0).attr("ry", 0);
            }
            function reverse(t) {
                t.attr("x", (d, i) => x(i) - 5)
                 .attr("y", (d, i) => 120 - d - (i%2?20:10))
                 .attr("width", 10).attr("height", 10)
                 .attr("rx", 5).attr("ry", 5);
            }
            loop(bars.transition(), forward, reverse, delay);
        }

        // 6. HORIZONTAL ↔ VERTICAL BARS
        function initHVBar(svg, delay) {
            const g = svg.append("g").attr("transform", "translate(45, 30)");
            const data = [40, 80, 60, 100, 70, 90];
            
            const bars = g.selectAll("rect")
                .data(data)
                .enter().append("rect")
                .attr("x", 0)
                .attr("y", (d, i) => i * 22)
                .attr("width", d => d * 1.5)
                .attr("height", 16)
                .attr("fill", (d, i) => colors[i % colors.length]);

            function forward(t) {
                t.attr("x", (d, i) => i * 28)
                 .attr("y", d => 130 - d)
                 .attr("width", 20)
                 .attr("height", d => d);
            }
            function reverse(t) {
                t.attr("x", 0)
                 .attr("y", (d, i) => i * 22)
                 .attr("width", d => d * 1.5)
                 .attr("height", 16);
            }
            loop(bars.transition(), forward, reverse, delay);
        }

        // 7. GROUPED ↔ STACKED
        function initGroupedStacked(svg, delay) {
            const g = svg.append("g").attr("transform", "translate(45, 30)");
            const data = [ [20, 30, 25], [35, 20, 40], [25, 45, 20] ];
            
            const groups = g.selectAll("g")
                .data(data)
                .enter().append("g")
                .attr("transform", (d, i) => `translate(${i * 55}, 0)`);

            const bars = groups.selectAll("rect")
                .data(d => d)
                .enter().append("rect")
                .attr("x", (d, i) => i * 14)
                .attr("y", d => 130 - d)
                .attr("width", 12)
                .attr("height", d => d)
                .attr("fill", (d, i) => colors[i % colors.length]);

            function forward(t) {
                t.attr("x", 0)
                 .attr("y", function(d, i) {
                     const group = d3.select(this.parentNode).datum();
                     let sum = 0;
                     for(let j=0; j<i; j++) sum += group[j];
                     return 130 - sum - d;
                 })
                 .attr("width", 40);
            }
            function reverse(t) {
                t.attr("x", (d, i) => i * 14)
                 .attr("y", d => 130 - d)
                 .attr("width", 12);
            }
            loop(bars.transition(), forward, reverse, delay);
        }

        // 8. TREEMAP ↔ CIRCLE PACK
        function initTreemapPack(svg, delay) {
            const g = svg.append("g").attr("transform", "translate(40, 25)");
            const data = [30, 20, 25, 15, 10, 18, 12, 22, 14, 16, 11, 13];
            const nodes = data.map((d, i) => ({
                id: i,
                tx: (i % 4) * 45,
                ty: Math.floor(i / 4) * 50,
                tw: 40,
                th: 45,
                cx: 20 + (i % 4) * 45,
                cy: 22.5 + Math.floor(i / 4) * 50,
                cr: Math.sqrt(d) * 3.5
            }));

            const bars = g.selectAll("rect")
                .data(nodes)
                .enter().append("rect")
                .attr("x", d => d.tx).attr("y", d => d.ty)
                .attr("width", d => d.tw).attr("height", d => d.th)
                .attr("rx", 0).attr("ry", 0)
                .attr("fill", (d, i) => colors[i % colors.length]);

            function forward(t) {
                t.attr("x", d => d.cx - d.cr).attr("y", d => d.cy - d.cr)
                 .attr("width", d => d.cr * 2).attr("height", d => d.cr * 2)
                 .attr("rx", d => d.cr).attr("ry", d => d.cr);
            }
            function reverse(t) {
                t.attr("x", d => d.tx).attr("y", d => d.ty)
                 .attr("width", d => d.tw).attr("height", d => d.th)
                 .attr("rx", 0).attr("ry", 0);
            }
            loop(bars.transition(), forward, reverse, delay);
        }

        // 9. DONUT ↔ SUNBURST
        function initDonutSunburst(svg, delay) {
            const g = svg.append("g").attr("transform", "translate(125, 95)");
            const arc = d3.arc();
            const data = d3.range(8).map(i => ({
                id: i,
                start: (i / 8) * Math.PI * 2,
                end: ((i + 1) / 8) * Math.PI * 2
            }));

            const inner = g.selectAll(".inner")
                .data(data)
                .enter().append("path")
                .attr("d", d => arc({innerRadius: 40, outerRadius: 70, startAngle: d.start, endAngle: d.end}))
                .attr("fill", (d, i) => colors[Math.floor(i/2) % colors.length]);

            const outer = g.selectAll(".outer")
                .data(data)
                .enter().append("path")
                .attr("d", d => arc({innerRadius: 70, outerRadius: 70, startAngle: d.start, endAngle: d.end}))
                .attr("fill", (d, i) => colors[i % colors.length])
                .attr("opacity", 0);

            function forward(t) {
                inner.transition(t)
                    .attrTween("d", d => {
                        const interp = d3.interpolate({innerRadius: 40, outerRadius: 70}, {innerRadius: 40, outerRadius: 60});
                        return t => arc({...d, ...interp(t)});
                    })
                    .attr("fill", (d, i) => colors[i % colors.length]);
                outer.transition(t)
                    .attrTween("d", d => {
                        const interp = d3.interpolate({innerRadius: 70, outerRadius: 70}, {innerRadius: 60, outerRadius: 85});
                        return t => arc({...d, ...interp(t)});
                    })
                    .attr("opacity", 1);
            }
            function reverse(t) {
                inner.transition(t)
                    .attrTween("d", d => {
                        const interp = d3.interpolate({innerRadius: 40, outerRadius: 60}, {innerRadius: 40, outerRadius: 70});
                        return t => arc({...d, ...interp(t)});
                    })
                    .attr("fill", (d, i) => colors[Math.floor(i/2) % colors.length]);
                outer.transition(t)
                    .attrTween("d", d => {
                        const interp = d3.interpolate({innerRadius: 60, outerRadius: 85}, {innerRadius: 70, outerRadius: 70});
                        return t => arc({...d, ...interp(t)});
                    })
                    .attr("opacity", 0);
            }
            
            function run() {
                const f = d3.transition().delay(delay).duration(1500);
                forward(f);
                f.transition().delay(500).duration(1500)
                    .call(reverse)
                    .transition().delay(500)
                    .on("end", () => { delay = 0; run(); });
            }
            run();
        }
    </script>
</body>
</html>
