<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Force Network</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #dddddd;
            --row-hover: #f5f5f5;
            --row-selected: #e3f2fd;
            --focus-ring: #000000;
            --focus-halo: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #container {
            width: 700px;
        }

        #viz-wrapper {
            position: relative;
            width: 700px;
            height: 500px;
            border: 1px solid var(--border-color);
            background: #fafafa;
            margin-bottom: 20px;
            outline: none;
        }

        #network-canvas {
            display: block;
            cursor: crosshair;
        }

        #network-canvas:focus {
            outline: 2px solid #1a73e8;
            outline-offset: 2px;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        #table-container {
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            background: #eee;
            z-index: 1;
        }

        th, td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: #e0e0e0;
        }

        tr:hover {
            background-color: var(--row-hover);
            cursor: pointer;
        }

        tr.focused-row {
            background-color: var(--row-selected);
            outline: 2px solid #1a73e8;
            outline-offset: -2px;
        }

        td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Forced Colors Mode */
        @media (forced-colors: active) {
            #viz-wrapper {
                border: 2px solid CanvasText;
            }
            .focused-row {
                outline: 2px solid Highlight;
            }
        }
    </style>
</head>
<body>

<div id="container">
    <h1 style="font-size: 1.5rem; margin-top: 0;">Accessible Force Network</h1>
    <p style="font-size: 0.9rem; color: #666; margin-bottom: 1rem;">
        Spatial navigation: Use <b>Arrow Keys</b> to explore nodes. <b>Tab</b> focuses the most connected node. <b>Home/End</b> jumps alphabetically. <b>Enter</b> selects, <b>Esc</b> clears.
    </p>

    <div id="viz-wrapper">
        <canvas id="network-canvas" tabindex="0" role="application" aria-label="Interactive force-directed network graph of 150 nodes. Use arrow keys to navigate, Enter to select."></canvas>
        <svg id="overlay"></svg>
    </div>

    <div id="aria-live" class="sr-only" aria-live="polite"></div>

    <div id="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th data-key="name">Name</th>
                    <th data-key="community">Community</th>
                    <th data-key="degree" class="num">Degree</th>
                    <th data-key="connections">Connections</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
/**
 * CONFIG & DATA GENERATION
 */
const width = 700;
const height = 500;
const nodeCount = 150;
const communityCount = 6;
const nodesPerCommunity = 25;
const targetEdges = 250;
const tolBright = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377"];

// Generate nodes
const nodes = d3.range(nodeCount).map(i => ({
    id: i,
    name: `Node ${String.fromCharCode(65 + (i % 26))}${Math.floor(i / 26)}`,
    community: Math.floor(i / nodesPerCommunity),
    degree: 0,
    connections: []
}));

// Generate edges (70% within, 30% between)
const links = [];
const internalEdges = Math.round(targetEdges * 0.7);
const externalEdges = targetEdges - internalEdges;

// Internal links
for (let i = 0; i < internalEdges; i++) {
    const comm = Math.floor(Math.random() * communityCount);
    const startIdx = comm * nodesPerCommunity;
    let u = startIdx + Math.floor(Math.random() * nodesPerCommunity);
    let v = startIdx + Math.floor(Math.random() * nodesPerCommunity);
    if (u !== v && !links.find(l => (l.source === u && l.target === v) || (l.source === v && l.target === u))) {
        links.push({ source: u, target: v });
    } else {
        i--; // retry
    }
}

// External links
for (let i = 0; i < externalEdges; i++) {
    let u = Math.floor(Math.random() * nodeCount);
    let v = Math.floor(Math.random() * nodeCount);
    const commU = Math.floor(u / nodesPerCommunity);
    const commV = Math.floor(v / nodesPerCommunity);
    if (commU !== commV && !links.find(l => (l.source === u && l.target === v) || (l.source === v && l.target === u))) {
        links.push({ source: u, target: v });
    } else {
        i--; // retry
    }
}

// Calculate degrees and adjacency
links.forEach(l => {
    nodes[l.source].degree++;
    nodes[l.target].degree++;
    nodes[l.source].connections.push(nodes[l.target].name);
    nodes[l.target].connections.push(nodes[l.source].name);
});

/**
 * STATE MANAGEMENT
 */
let focusedNode = null;
let selectedNode = null;
let currentSort = { key: 'degree', direction: -1 };

/**
 * CANVAS SETUP
 */
const canvas = d3.select("#network-canvas");
const ctx = canvas.node().getContext("2d");
const dpr = window.devicePixelRatio || 1;
canvas.attr("width", width * dpr).attr("height", height * dpr)
      .style("width", `${width}px`).style("height", `${height}px`);
ctx.scale(dpr, dpr);

const svg = d3.select("#overlay")
    .attr("width", width)
    .attr("height", height);

/**
 * FORCE SIMULATION
 */
const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(30))
    .force("charge", d3.forceManyBody().strength(-25))
    .force("collide", d3.forceCollide(6))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .on("tick", render);

/**
 * RENDERING
 */
const isHighContrast = window.matchMedia('(forced-colors: active)').matches;

function render() {
    ctx.clearRect(0, 0, width, height);

    // Draw Edges
    ctx.beginPath();
    ctx.strokeStyle = isHighContrast ? "CanvasText" : "rgba(150, 150, 150, 0.15)";
    ctx.lineWidth = isHighContrast ? 1.5 : 0.8;
    for (const l of links) {
        ctx.moveTo(l.source.x, l.source.y);
        ctx.lineTo(l.target.x, l.target.y);
    }
    ctx.stroke();

    // Draw Nodes
    nodes.forEach(d => {
        ctx.beginPath();
        if (isHighContrast) {
            ctx.strokeStyle = "CanvasText";
            ctx.lineWidth = 2;
            ctx.arc(d.x, d.y, 5, 0, 2 * Math.PI);
            ctx.stroke();
            // Optional: fill with community color but for high contrast usually we keep it simple
            // Requirement says "draw hollow circles" for forced-colors
        } else {
            ctx.fillStyle = tolBright[d.community % tolBright.length];
            ctx.arc(d.x, d.y, 5, 0, 2 * Math.PI);
            ctx.fill();
        }
    });

    updateOverlays();
}

function updateOverlays() {
    const focus = focusedNode || selectedNode;
    const ring = svg.selectAll(".focus-ring").data(focus ? [focus] : []);

    ring.join(
        enter => {
            const g = enter.append("g").attr("class", "focus-ring");
            g.append("circle").attr("class", "halo")
                .attr("r", 9).attr("fill", "none")
                .attr("stroke", "var(--focus-halo)").attr("stroke-width", 4);
            g.append("circle").attr("class", "ring")
                .attr("r", 9).attr("fill", "none")
                .attr("stroke", d => d === selectedNode ? "#1a73e8" : "var(--focus-ring)")
                .attr("stroke-width", 2);
            return g;
        },
        update => {
            update.attr("transform", d => `translate(${d.x},${d.y})`);
            update.select(".ring").attr("stroke", d => d === selectedNode ? "#1a73e8" : "var(--focus-ring)");
            return update;
        },
        exit => exit.remove()
    );
}

/**
 * ACCESSIBILITY & NAVIGATION
 */
const qt = d3.quadtree().x(d => d.x).y(d => d.y);

function announce(node) {
    if (!node) return;
    const live = document.getElementById("aria-live");
    const topConns = node.connections.slice(0, 3).join(", ");
    live.textContent = `${node.name}, Community ${node.community + 1}, ${node.degree} connections. Connected to ${topConns}${node.degree > 3 ? " and others" : ""}.`;
}

function setFocus(node, scrollTable = true) {
    focusedNode = node;
    if (node && scrollTable) {
        const row = document.getElementById(`row-${node.id}`);
        if (row) {
            row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    }
    renderTable();
    announce(node);
    render();
}

// Directional navigation logic
function inDirection(ox, oy, tx, ty, dir) {
    const dx = tx - ox, dy = ty - oy;
    if (!dx && !dy) return false;
    switch (dir) {
        case 'ArrowRight': return dx > 0 && Math.abs(dy) <= dx;
        case 'ArrowLeft':  return dx < 0 && Math.abs(dy) <= -dx;
        case 'ArrowDown':  return dy > 0 && Math.abs(dx) <= dy;
        case 'ArrowUp':    return dy < 0 && Math.abs(dx) <= -dy;
    }
    return false;
}

function findNearest(current, key) {
    if (!current) return nodes.sort((a,b) => b.degree - a.degree)[0];
    const cx = current.x, cy = current.y;
    let best = null, bestDist = Infinity;

    nodes.forEach(d => {
        if (d === current) return;
        if (!inDirection(cx, cy, d.x, d.y, key)) return;
        const dist = Math.hypot(d.x - cx, d.y - cy);
        if (dist < bestDist) {
            bestDist = dist;
            best = d;
        }
    });
    return best || current;
}

canvas.on("keydown", (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        const next = findNearest(focusedNode || selectedNode, e.key);
        if (next) setFocus(next);
    } else if (e.key === "Enter") {
        selectedNode = focusedNode;
        render();
    } else if (e.key === "Escape") {
        focusedNode = null;
        selectedNode = null;
        render();
    } else if (e.key === "Home") {
        const sorted = [...nodes].sort((a,b) => a.name.localeCompare(b.name));
        setFocus(sorted[0]);
    } else if (e.key === "End") {
        const sorted = [...nodes].sort((a,b) => a.name.localeCompare(b.name));
        setFocus(sorted[sorted.length - 1]);
    } else if (e.key === "Tab") {
        // If not already focused on a node, focus highest degree
        if (!focusedNode) {
            const highest = [...nodes].sort((a,b) => b.degree - a.degree)[0];
            setFocus(highest);
        }
    }
});

// Mouse interaction
canvas.on("mousemove", (e) => {
    const [mx, my] = d3.pointer(e);
    const nearest = d3.quadtree().x(d => d.x).y(d => d.y).addAll(nodes).find(mx, my, 20);
    if (nearest !== focusedNode) {
        focusedNode = nearest;
        render();
        renderTable();
    }
});

canvas.on("click", (e) => {
    const [mx, my] = d3.pointer(e);
    const nearest = d3.quadtree().x(d => d.x).y(d => d.y).addAll(nodes).find(mx, my, 20);
    selectedNode = nearest;
    if (nearest) setFocus(nearest);
    render();
});

/**
 * DATA TABLE
 */
function renderTable() {
    const sortedNodes = [...nodes].sort((a, b) => {
        let vA = a[currentSort.key];
        let vB = b[currentSort.key];
        if (typeof vA === 'string') return vA.localeCompare(vB) * currentSort.direction;
        return (vA - vB) * currentSort.direction;
    });

    const tbody = d3.select("#data-table tbody");
    const rows = tbody.selectAll("tr")
        .data(sortedNodes, d => d.id)
        .join("tr")
        .attr("id", d => `row-${d.id}`)
        .classed("focused-row", d => d === focusedNode || d === selectedNode)
        .on("click", (e, d) => setFocus(d, false));

    rows.selectAll("td")
        .data(d => [
            { val: d.name, class: "" },
            { val: d.community + 1, class: "" },
            { val: d.degree, class: "num" },
            { val: d.connections.slice(0, 3).join(", ") + (d.connections.length > 3 ? "..." : ""), class: "" }
        ])
        .join("td")
        .attr("class", d => d.class)
        .text(d => d.val);
}

d3.selectAll("th").on("click", function() {
    const key = d3.select(this).attr("data-key");
    if (currentSort.key === key) {
        currentSort.direction *= -1;
    } else {
        currentSort.key = key;
        currentSort.direction = 1;
    }
    renderTable();
});

// Initial table render
renderTable();

// Update forced colors if they change
window.matchMedia('(forced-colors: active)').addEventListener('change', () => {
    location.reload(); // Simplest way to re-init all settings
});

</script>
</body>
</html>
