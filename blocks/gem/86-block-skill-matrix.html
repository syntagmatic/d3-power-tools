<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block × Skill Matrix</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --cell-bg: #1e293b;
            --cell-active: #38bdf8;
            --cell-hover: #0ea5e9;
            --highlight: #f43f5e;
            --label-color: #94a3b8;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            background: var(--cell-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .matrix-container {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding-bottom: 40px;
        }

        svg {
            background: var(--bg-color);
            user-select: none;
        }

        .cell {
            stroke: var(--bg-color);
            stroke-width: 1px;
        }

        .label {
            font-size: 9px;
            fill: var(--label-color);
            cursor: default;
        }

        .label.active {
            fill: var(--text-color);
            font-weight: bold;
        }

        .row-highlight, .col-highlight {
            pointer-events: none;
            fill: rgba(255, 255, 255, 0.05);
        }

        .tooltip {
            position: absolute;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            pointer-events: none;
            font-size: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 100;
            display: none;
        }

        .tooltip .block-name {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
            color: var(--cell-active);
        }

        .tooltip .skill-name {
            color: var(--label-color);
        }

        ::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--label-color);
        }
    </style>
</head>
<body>
    <header>
        <h1>Block × Skill Matrix</h1>
        <div class="controls">
            <label for="row-sort">Sort Blocks:</label>
            <select id="row-sort">
                <option value="id">By ID</option>
                <option value="name">By Name</option>
                <option value="count">By Skill Count</option>
            </select>
            <label for="col-sort">Sort Skills:</label>
            <select id="col-sort">
                <option value="name">By Name</option>
                <option value="count">By Block Usage</option>
            </select>
        </div>
    </header>

    <div class="matrix-container">
        <div id="matrix"></div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        const manifest = {

    { "id": "53", "name": "Textured Raincloud Plot", "skills": ["visual-texture", "distributions", "color"] },
    { "id": "54", "name": "Textured Bivariate Treemap", "skills": ["visual-texture", "hierarchy-layouts", "scales"] },

    { "id": "76", "name": "Treemap Sparkline Dashboard", "skills": ["hierarchy-layouts", "sparkcharts", "responsive"] },
    { "id": "77", "name": "Sunburst Breadcrumb Brush", "skills": ["hierarchy-interaction", "brushing", "color"] },
    { "id": "78", "name": "Expandable Edge Bundle", "skills": ["hierarchy-interaction", "edge-bundling", "canvas"] },
    { "id": "79", "name": "Reduced Motion Dashboard", "skills": ["responsive", "motion", "linked-views"] },
    { "id": "80", "name": "Container Query Chart", "skills": ["responsive", "small-multiples", "scales"] },
    { "id": "81", "name": "Letter-Value Plot with Table Toggle", "skills": ["data-table", "distributions", "canvas-accessibility"] },
    { "id": "82", "name": "Accessible Hive Plot", "skills": ["network", "canvas-accessibility", "scales"] },
    { "id": "83", "name": "Community Detection with Table", "skills": ["network", "data-table", "color"] },

    { "id": "85", "name": "Skill Constellation", "skills": ["force", "network", "color"] },
    { "id": "86", "name": "Block × Skill Matrix", "skills": ["network", "scales", "navigation"] },

    { "id": "91", "name": "Test Coverage Heatmap", "skills": ["color", "scales", "data-table"] },
    { "id": "92", "name": "Score Delta Waterfall", "skills": ["scales", "annotation", "color"] },
    { "id": "93", "name": "Prompt Complexity Scatter", "skills": ["brushing", "annotation", "scales"] },
    { "id": "94", "name": "Election Swing Map", "skills": ["cartography", "time-series", "linked-views"] },
    { "id": "95", "name": "Flight Route Bundling", "skills": ["edge-bundling", "cartography", "canvas"] },
    { "id": "96", "name": "Regional Parcoords Grid", "skills": ["parallel-coordinates", "small-multiples", "brushing"] },
    { "id": "97", "name": "Supply Chain Sankey", "skills": ["network", "motion", "brushing"] },
    { "id": "98", "name": "Shape-Morphing Timeline", "skills": ["shape-morphing", "time-series", "motion"] },
    { "id": "99", "name": "Tidal Harmonic Decomposition", "skills": ["time-series", "distributions", "annotation"] },
    { "id": "100", "name": "City Similarity Explorer", "skills": ["parallel-coordinates", "cartography", "linked-views"] },
    { "id": "101", "name": "WebGL Color Space", "skills": ["webgl", "color", "navigation"] },
    { "id": "102", "name": "Earthquake Depth Globe", "skills": ["cartography", "distributions", "canvas"] },
    { "id": "103", "name": "Book Sentence Rhythm", "skills": ["sparkcharts", "distributions", "small-multiples"] },
    { "id": "104", "name": "Nutrient Treemap Explorer", "skills": ["hierarchy-interaction", "parallel-coordinates", "linked-views"] },
    { "id": "105", "name": "Migration Flow Chord", "skills": ["network", "time-series", "motion"] }
  ]
};

        const skills = [
            "annotation", "brushing", "canvas", "canvas-accessibility", "cartography", 
            "color", "data-gathering", "data-table", "distributions", "edge-bundling", 
            "force", "hierarchy-interaction", "hierarchy-layouts", "linked-views", 
            "motion", "navigation", "network", "parallel-coordinates", "responsive", 
            "scales", "shape-morphing", "small-multiples", "sparkcharts", "time-series", 
            "visual-texture", "webgl"
        ];

        // Process data
        const blocks = manifest.blocks;
        const skillCounts = {};
        skills.forEach(s => skillCounts[s] = 0);
        blocks.forEach(b => {
            b.skillCount = b.skills.length;
            b.skills.forEach(s => {
                if (skillCounts[s] !== undefined) skillCounts[s]++;
            });
        });

        const margin = { top: 120, right: 20, bottom: 20, left: 240 };
        const cellSize = 12;
        const width = skills.length * cellSize;
        const height = blocks.length * cellSize;

        const svg = d3.select("#matrix")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        const x = d3.scaleBand()
            .domain(skills)
            .range([0, width])
            .padding(0);

        const y = d3.scaleBand()
            .domain(blocks.map(d => d.id))
            .range([0, height])
            .padding(0);

        // Grid lines
        svg.append("g")
            .attr("class", "grid")
            .selectAll("line")
            .data(skills)
            .enter().append("line")
            .attr("x1", d => x(d))
            .attr("x2", d => x(d))
            .attr("y1", 0)
            .attr("y2", height)
            .attr("stroke", "var(--border-color)")
            .attr("stroke-width", 0.5);

        svg.append("g")
            .attr("class", "grid")
            .selectAll("line")
            .data(blocks)
            .enter().append("line")
            .attr("x1", 0)
            .attr("x2", width)
            .attr("y1", d => y(d.id))
            .attr("y2", d => y(d.id))
            .attr("stroke", "var(--border-color)")
            .attr("stroke-width", 0.5);

        // Highlight layers
        const rowHighlight = svg.append("rect")
            .attr("class", "row-highlight")
            .attr("width", width)
            .attr("height", cellSize)
            .attr("display", "none");

        const colHighlight = svg.append("rect")
            .attr("class", "col-highlight")
            .attr("width", cellSize)
            .attr("height", height)
            .attr("display", "none");

        // Labels
        const colLabels = svg.append("g")
            .selectAll(".col-label")
            .data(skills)
            .enter().append("text")
            .attr("class", "label col-label")
            .attr("x", d => x(d) + cellSize / 2)
            .attr("y", -10)
            .attr("text-anchor", "start")
            .attr("transform", d => `rotate(-45, ${x(d) + cellSize / 2}, -10)`)
            .text(d => d);

        const rowLabels = svg.append("g")
            .selectAll(".row-label")
            .data(blocks)
            .enter().append("text")
            .attr("class", "label row-label")
            .attr("x", -10)
            .attr("y", d => y(d.id) + cellSize / 2)
            .attr("dy", "0.35em")
            .attr("text-anchor", "end")
            .text(d => `${d.id}: ${d.name}`);

        // Matrix Cells
        const cells = svg.append("g")
            .selectAll(".cell")
            .data(blocks.flatMap(b => skills.map(s => ({
                blockId: b.id,
                blockName: b.name,
                skillName: s,
                active: b.skills.includes(s)
            }))))
            .enter().append("rect")
            .attr("class", "cell")
            .attr("x", d => x(d.skillName))
            .attr("y", d => y(d.blockId))
            .attr("width", cellSize)
            .attr("height", cellSize)
            .attr("fill", d => d.active ? "var(--cell-active)" : "var(--cell-bg)")
            .on("mouseover", function(event, d) {
                rowHighlight.attr("y", y(d.blockId)).attr("display", null);
                colHighlight.attr("x", x(d.skillName)).attr("display", null);
                
                rowLabels.classed("active", l => l.id === d.blockId);
                colLabels.classed("active", l => l === d.skillName);

                d3.select(this).attr("fill", d.active ? "var(--cell-hover)" : "rgba(255,255,255,0.1)");

                const tooltip = d3.select("#tooltip");
                tooltip.style("display", "block")
                    .html(`<span class="block-name">${d.blockName}</span><span class="skill-name">Skill: ${d.skillName}</span>`);
            })
            .on("mousemove", function(event) {
                d3.select("#tooltip")
                    .style("left", (event.pageX + 15) + "px")
                    .style("top", (event.pageY - 10) + "px");
            })
            .on("mouseout", function(event, d) {
                rowHighlight.attr("display", "none");
                colHighlight.attr("display", "none");
                rowLabels.classed("active", false);
                colLabels.classed("active", false);
                d3.select(this).attr("fill", d.active ? "var(--cell-active)" : "var(--cell-bg)");
                d3.select("#tooltip").style("display", "none");
            });

        // Sorting
        function updateSorting() {
            const rowSort = d3.select("#row-sort").property("value");
            const colSort = d3.select("#col-sort").property("value");

            // Sort blocks
            let sortedBlocks = [...blocks];
            if (rowSort === "name") {
                sortedBlocks.sort((a, b) => a.name.localeCompare(b.name));
            } else if (rowSort === "count") {
                sortedBlocks.sort((a, b) => b.skillCount - a.skillCount || a.id.localeCompare(b.id));
            } else {
                sortedBlocks.sort((a, b) => a.id.localeCompare(b.id));
            }
            y.domain(sortedBlocks.map(d => d.id));

            // Sort skills
            let sortedSkills = [...skills];
            if (colSort === "count") {
                sortedSkills.sort((a, b) => skillCounts[b] - skillCounts[a] || a.localeCompare(b));
            } else {
                sortedSkills.sort((a, b) => a.localeCompare(b));
            }
            x.domain(sortedSkills);

            const t = svg.transition().duration(750);

            cells.transition(t)
                .attr("x", d => x(d.skillName))
                .attr("y", d => y(d.blockId));

            rowLabels.transition(t)
                .attr("y", d => y(d.id) + cellSize / 2);

            colLabels.transition(t)
                .attr("x", d => x(d) + cellSize / 2)
                .attr("transform", d => `rotate(-45, ${x(d) + cellSize / 2}, -10)`);
        }

        d3.select("#row-sort").on("change", updateSorting);
        d3.select("#col-sort").on("change", updateSorting);

    </script>
</body>
</html>
