<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Temperature Departures from Normal (°C)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #2d3436;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 30px;
      color: #1e272e;
    }

    #container {
      position: relative;
      width: 1000px;
    }

    .tooltip {
      position: absolute;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #dfe6e9;
      border-radius: 4px;
      pointer-events: none;
      font-size: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 100;
    }

    .city-label {
      font-size: 14px;
      font-weight: 600;
      fill: #636e72;
    }

    .month-label {
      font-size: 12px;
      font-weight: 500;
      fill: #b2bec3;
    }

    .annotation-text {
      font-size: 11px;
      font-weight: 500;
    }

    .legend-text {
      font-size: 11px;
      fill: #636e72;
    }

    .day-rect {
      stroke: #fff;
      stroke-width: 0.5px;
    }

    .day-rect:hover {
      stroke: #2d3436;
      stroke-width: 1px;
    }
  </style>
</head>
<body>

  <h1>Daily Temperature Departures from Normal (°C)</h1>

  <div id="container">
    <div id="tooltip" class="tooltip"></div>
    <svg id="viz"></svg>
  </div>

  <script>
    // Configuration
    const width = 1000;
    const margin = { top: 40, right: 60, bottom: 80, left: 100 };
    const cityNames = ["Oslo", "Phoenix", "Singapore"];
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    
    const dayWidth = 4.5;
    const dayHeight = 15;
    const monthPadding = 10;
    const cityPadding = 40;

    // 1. Data Generation
    const data = [];
    const seed = 42;
    const random = d3.randomLcg(seed);

    function generateCityData(cityName, minRange, maxRange, options = {}) {
      const cityData = [];
      const startDate = new Date(2025, 0, 1);
      
      for (let i = 0; i < 365; i++) {
        const currentDate = new Date(startDate);
        currentDate.setDate(startDate.getDate() + i);
        
        let departure = 0;
        const month = currentDate.getMonth();
        const day = currentDate.getDate();

        if (cityName === "Oslo") {
          // Oslo: departures range -12 to +8, cold snaps in Jan-Feb, heat wave in July.
          departure = random() * 6 - 3; // base noise
          if (month <= 1) { // Jan-Feb
            departure -= 2;
            if (i >= 15 && i <= 18) departure = -11 + random() * 2; // Cold snap
          } else if (month === 6) { // July
            departure += 3;
            if (day >= 10 && day <= 15) departure += 4; // Heat wave
          }
        } else if (cityName === "Phoenix") {
          // Phoenix: departures range -6 to +14, heat waves June-Aug.
          departure = random() * 6 - 1; // base noise
          if (month >= 5 && month <= 7) { // June-Aug
            departure += 4;
            if (day >= 15 && day <= 22 && month === 6) departure = 12 + random() * 2; // Heat wave
          } else if (month >= 10 || month <= 1) {
            departure -= 1;
          }
        } else if (cityName === "Singapore") {
          // Singapore: departures range -3 to +4, narrow stable range.
          departure = random() * 4 - 1.5;
        }

        // Clamp to ranges
        departure = Math.max(minRange, Math.min(maxRange, departure));

        cityData.push({
          city: cityName,
          date: currentDate,
          month: month,
          day: day,
          dayOfYear: i,
          value: departure
        });
      }
      return cityData;
    }

    const osloData = generateCityData("Oslo", -12, 8);
    const phoenixData = generateCityData("Phoenix", -6, 14);
    const singaporeData = generateCityData("Singapore", -3, 4);
    const allData = [...osloData, ...phoenixData, ...singaporeData];

    // 2. Scales
    const colorScale = d3.scaleDiverging()
      .domain([-12, 0, 14]) // Midpoint at 0 is critical
      .interpolator(t => {
        if (t <= 0.5) return d3.interpolateRgb("#4477AA", "#ffffff")(t * 2);
        return d3.interpolateRgb("#ffffff", "#EE6677")((t - 0.5) * 2);
      });

    // 3. Layout and Rendering
    const svg = d3.select("#viz")
      .attr("width", width)
      .attr("height", 600);

    const chart = svg.append("g")
      .attr("transform", `translate(${margin.left}, ${margin.top})`);

    // Month headers
    const monthX = (m) => m * (7 * dayWidth + monthPadding);

    chart.selectAll(".month-label")
      .data(monthNames)
      .enter()
      .append("text")
      .attr("class", "month-label")
      .attr("x", (d, i) => monthX(i) + (7 * dayWidth) / 2)
      .attr("y", -10)
      .attr("text-anchor", "middle")
      .text(d => d);

    // City rows
    cityNames.forEach((city, cityIdx) => {
      const cityGroup = chart.append("g")
        .attr("transform", `translate(0, ${cityIdx * (5 * dayHeight + cityPadding)})`);

      cityGroup.append("text")
        .attr("class", "city-label")
        .attr("x", -10)
        .attr("y", (5 * dayHeight) / 2)
        .attr("text-anchor", "end")
        .attr("dominant-baseline", "middle")
        .text(city);

      const cityDataFiltered = allData.filter(d => d.city === city);

      cityGroup.selectAll(".day-rect")
        .data(cityDataFiltered)
        .enter()
        .append("rect")
        .attr("class", "day-rect")
        .attr("x", d => {
          const weekInMonth = Math.floor((d.day - 1) / 7);
          const dayInWeek = (d.day - 1) % 7;
          return monthX(d.month) + dayInWeek * dayWidth;
        })
        .attr("y", d => Math.floor((d.day - 1) / 7) * dayHeight)
        .attr("width", dayWidth)
        .attr("height", dayHeight)
        .attr("fill", d => colorScale(d.value))
        .on("mouseover", function(event, d) {
          const tooltip = d3.select("#tooltip");
          const qualLabel = d.value > 2 ? "Much Warmer" : d.value > 0 ? "Warmer" : d.value < -2 ? "Much Colder" : d.value < 0 ? "Colder" : "Normal";
          tooltip.style("opacity", 1)
            .html(`
              <strong>${d.city}</strong><br/>
              ${d3.timeFormat("%B %d, %Y")(d.date)}<br/>
              Departure: <strong>${d.value.toFixed(1)}°C</strong><br/>
              Status: ${qualLabel}
            `);
        })
        .on("mousemove", function(event) {
          d3.select("#tooltip")
            .style("left", (event.pageX - 70) + "px")
            .style("top", (event.pageY - 110) + "px");
        })
        .on("mouseout", function() {
          d3.select("#tooltip").style("opacity", 0);
        });
    });

    // 4. Annotations
    const annotations = chart.append("g").attr("class", "annotations");

    // Oslo cold snap
    const osloY = 0;
    annotations.append("line")
      .attr("x1", monthX(0) + 3 * dayWidth)
      .attr("y1", osloY + 2 * dayHeight)
      .attr("x2", monthX(0) - 20)
      .attr("y2", osloY - 15)
      .attr("stroke", "#4477AA")
      .attr("stroke-dasharray", "2,2");

    annotations.append("text")
      .attr("class", "annotation-text")
      .attr("x", monthX(0) - 25)
      .attr("y", osloY - 20)
      .attr("text-anchor", "start")
      .attr("fill", "#4477AA")
      .text("Cold snap: -11°C, 4 consecutive days");

    // Phoenix heat wave
    const phoenixY = 1 * (5 * dayHeight + cityPadding);
    annotations.append("line")
      .attr("x1", monthX(6) + 4 * dayWidth)
      .attr("y1", phoenixY + 2.5 * dayHeight)
      .attr("x2", monthX(7) + 20)
      .attr("y2", phoenixY + 6 * dayHeight)
      .attr("stroke", "#EE6677")
      .attr("stroke-dasharray", "2,2");

    annotations.append("text")
      .attr("class", "annotation-text")
      .attr("x", monthX(7) + 20)
      .attr("y", phoenixY + 6.5 * dayHeight + 5)
      .attr("text-anchor", "start")
      .attr("fill", "#EE6677")
      .text("Heat wave: +12°C, 8 days");

    // Singapore stability
    const singaporeY = 2 * (5 * dayHeight + cityPadding);
    const sgWidth = monthX(11) + 7 * dayWidth;
    
    annotations.append("path")
      .attr("d", `M 0 ${singaporeY + 5.5 * dayHeight} L 0 ${singaporeY + 6 * dayHeight} L ${sgWidth} ${singaporeY + 6 * dayHeight} L ${sgWidth} ${singaporeY + 5.5 * dayHeight}`)
      .attr("fill", "none")
      .attr("stroke", "#b2bec3")
      .attr("stroke-width", 1);

    annotations.append("text")
      .attr("class", "annotation-text")
      .attr("x", sgWidth / 2)
      .attr("y", singaporeY + 7 * dayHeight)
      .attr("text-anchor", "middle")
      .attr("fill", "#636e72")
      .text("Annual range: only 7°C");

    // 5. Color Legend
    const legendWidth = 300;
    const legendHeight = 10;
    const legendX = (width - margin.left - margin.right - legendWidth) / 2;
    const legendY = 3 * (5 * dayHeight + cityPadding) + 10;

    const legend = chart.append("g")
      .attr("transform", `translate(${legendX}, ${legendY})`);

    const legendScale = d3.scaleLinear()
      .domain([-12, 14])
      .range([0, legendWidth]);

    const legendGradient = svg.append("defs")
      .append("linearGradient")
      .attr("id", "legend-gradient")
      .attr("x1", "0%").attr("y1", "0%")
      .attr("x2", "100%").attr("y2", "0%");

    const gradientSteps = 20;
    for (let i = 0; i <= gradientSteps; i++) {
      const t = i / gradientSteps;
      const val = -12 + t * (14 - (-12));
      legendGradient.append("stop")
        .attr("offset", `${t * 100}%`)
        .attr("stop-color", colorScale(val));
    }

    legend.append("rect")
      .attr("width", legendWidth)
      .attr("height", legendHeight)
      .attr("fill", "url(#legend-gradient)");

    const legendAxis = d3.axisBottom(legendScale)
      .tickValues([-12, -8, -4, 0, 4, 8, 12])
      .tickFormat(d => (d > 0 ? "+" : "") + d + "°");

    legend.append("g")
      .attr("transform", `translate(0, ${legendHeight})`)
      .call(legendAxis)
      .select(".domain").remove();

    legend.append("text")
      .attr("class", "legend-text")
      .attr("x", legendWidth / 2)
      .attr("y", legendHeight + 35)
      .attr("text-anchor", "middle")
      .text("Departure from Normal (°C)");

    // Mark the zero point on legend
    legend.append("line")
      .attr("x1", legendScale(0))
      .attr("x2", legendScale(0))
      .attr("y1", -2)
      .attr("y2", legendHeight + 2)
      .attr("stroke", "#2d3436")
      .attr("stroke-width", 2);

  </script>
</body>
</html>
