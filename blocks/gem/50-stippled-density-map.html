<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>US Population Density Stipple Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <style>
        body {
            margin: 0;
            background: #f5f0e8;
            color: #333;
            font-family: "Georgia", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title {
            text-align: center;
            padding: 30px 20px 10px;
        }
        .title h1 {
            margin: 0;
            font-size: 28px;
            font-weight: normal;
        }
        .title p {
            margin: 8px 0 0;
            font-style: italic;
            color: #555;
            max-width: 600px;
        }
        #container {
            width: 960px;
            height: 600px;
            position: relative;
            margin-bottom: 40px;
        }
        canvas, svg {
            position: absolute;
            top: 0;
            left: 0;
        }
        .legend {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(245, 240, 232, 0.9);
            padding: 15px;
            border: 1px solid #dcd5cc;
            font-size: 14px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.05);
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 4px;
        }
        .legend-row {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }
        .dot-sample {
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
            margin-right: 10px;
        }
        .density-examples {
            margin-top: 15px;
            display: flex;
            gap: 20px;
        }
        .example {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
        }
        .example-box {
            width: 30px;
            height: 30px;
            border: 1px solid #ccc;
            margin-bottom: 4px;
            background: #fff;
            position: relative;
        }
        .tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #333;
            padding: 8px 12px;
            pointer-events: none;
            font-size: 13px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
            display: none;
            z-index: 100;
        }
        .tooltip b {
            display: block;
            border-bottom: 1px solid #eee;
            margin-bottom: 4px;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>Population Density by Stipple</h1>
        <p>A Print-Friendly Alternative to Choropleth Maps</p>
    </div>
    
    <div id="container">
        <canvas id="stipple-canvas" width="960" height="600"></canvas>
        <svg id="map-svg" width="960" height="600"></svg>
        <div class="legend">
            <div class="legend-title">Legend</div>
            <div class="legend-row">
                <div class="dot-sample"></div>
                <span>• = 10,000 People</span>
            </div>
            <div class="density-examples">
                <div class="example">
                    <div class="example-box" id="ex-low"></div>
                    <span>Low Density</span>
                </div>
                <div class="example">
                    <div class="example-box" id="ex-med"></div>
                    <span>Moderate</span>
                </div>
                <div class="example">
                    <div class="example-box" id="ex-high"></div>
                    <span>High Density</span>
                </div>
            </div>
        </div>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <script>
        const population = {
            "Alabama": 5024279, "Alaska": 733391, "Arizona": 7151502, "Arkansas": 3011524,
            "California": 39538223, "Colorado": 5773714, "Connecticut": 3605944, "Delaware": 989948,
            "District of Columbia": 689545, "Florida": 21538187, "Georgia": 10711908, "Hawaii": 1455271,
            "Idaho": 1839106, "Illinois": 12812508, "Indiana": 6785528, "Iowa": 3190369,
            "Kansas": 2937880, "Kentucky": 4505836, "Louisiana": 4657757, "Maine": 1362359,
            "Maryland": 6177224, "Massachusetts": 7029917, "Michigan": 10077331, "Minnesota": 5706494,
            "Mississippi": 2961279, "Missouri": 6154913, "Montana": 1084225, "Nebraska": 1961504,
            "Nevada": 3104614, "New Hampshire": 1377529, "New Jersey": 9288994, "New Mexico": 2117522,
            "New York": 20201249, "North Carolina": 10439388, "North Dakota": 779094, "Ohio": 11799448,
            "Oklahoma": 3959353, "Oregon": 4237256, "Pennsylvania": 13002700, "Rhode Island": 1097379,
            "South Carolina": 5118425, "South Dakota": 886667, "Tennessee": 6910840, "Texas": 29145505,
            "Utah": 3271616, "Vermont": 643077, "Virginia": 8631393, "Washington": 7705281,
            "West Virginia": 1793716, "Wisconsin": 5893718, "Wyoming": 576851
        };

        const area = {
            "Alabama": 52420, "Alaska": 665384, "Arizona": 113990, "Arkansas": 53178,
            "California": 163696, "Colorado": 104094, "Connecticut": 5543, "Delaware": 2489,
            "District of Columbia": 68, "Florida": 65757, "Georgia": 59425, "Hawaii": 10931,
            "Idaho": 83568, "Illinois": 57913, "Indiana": 36419, "Iowa": 56272,
            "Kansas": 82278, "Kentucky": 40407, "Louisiana": 52378, "Maine": 35379,
            "Maryland": 12405, "Massachusetts": 10554, "Michigan": 96713, "Minnesota": 86935,
            "Mississippi": 48431, "Missouri": 69707, "Montana": 147040, "Nebraska": 77347,
            "Nevada": 110571, "New Hampshire": 9349, "New Jersey": 8722, "New Mexico": 121590,
            "New York": 54555, "North Carolina": 53819, "North Dakota": 70698, "Ohio": 44825,
            "Oklahoma": 69898, "Oregon": 98378, "Pennsylvania": 46054, "Rhode Island": 1545,
            "South Carolina": 32020, "South Dakota": 77116, "Tennessee": 42144, "Texas": 268596,
            "Utah": 84896, "Vermont": 9616, "Virginia": 42774, "Washington": 71297,
            "West Virginia": 24230, "Wisconsin": 65496, "Wyoming": 97813
        };

        async function init() {
            const width = 960;
            const height = 600;
            const projection = d3.geoAlbersUsa().scale(1070).translate([width / 2, height / 2]);
            const geoPath = d3.geoPath(projection);
            const random = d3.randomLcg(42);

            const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
            const states = topojson.feature(us, us.objects.states).features;
            const nation = topojson.merge(us, us.objects.states.geometries);
            const borders = topojson.mesh(us, us.objects.states, (a, b) => a !== b);

            const canvas = document.getElementById("stipple-canvas");
            const ctx = canvas.getContext("2d");
            
            const offCanvas = document.createElement("canvas");
            offCanvas.width = width;
            offCanvas.height = height;
            const offCtx = offCanvas.getContext("2d");

            ctx.fillStyle = "rgba(51, 51, 51, 0.7)";
            
            states.forEach(state => {
                const name = state.properties.name;
                const pop = population[name];
                if (!pop) return;
                const numDots = Math.round(pop / 10000);
                
                offCtx.clearRect(0, 0, width, height);
                offCtx.beginPath();
                geoPath.context(offCtx)(state);
                offCtx.fillStyle = "black";
                offCtx.fill();
                
                const imageData = offCtx.getImageData(0, 0, width, height);
                const bounds = geoPath.bounds(state);
                const x0 = Math.max(0, Math.floor(bounds[0][0]));
                const y0 = Math.max(0, Math.floor(bounds[0][1]));
                const x1 = Math.min(width, Math.ceil(bounds[1][0]));
                const y1 = Math.min(height, Math.ceil(bounds[1][1]));
                
                let count = 0;
                let attempts = 0;
                while (count < numDots && attempts < numDots * 50) {
                    const rx = x0 + random() * (x1 - x0);
                    const ry = y0 + random() * (y1 - y0);
                    const ix = Math.floor(rx);
                    const iy = Math.floor(ry);
                    if (ix >= 0 && ix < width && iy >= 0 && iy < height) {
                        if (imageData.data[(iy * width + ix) * 4 + 3] > 0) {
                            ctx.fillRect(rx, ry, 1, 1);
                            count++;
                        }
                    }
                    attempts++;
                }
            });

            const svg = d3.select("#map-svg");
            
            svg.append("path")
                .datum(borders)
                .attr("fill", "none")
                .attr("stroke", "#999")
                .attr("stroke-width", 0.5)
                .attr("d", geoPath);

            svg.append("path")
                .datum(nation)
                .attr("fill", "none")
                .attr("stroke", "#333")
                .attr("stroke-width", 1)
                .attr("d", geoPath);

            const highlight = svg.append("path")
                .attr("fill", "rgba(0,0,0,0.05)")
                .attr("stroke", "#000")
                .attr("stroke-width", 1.5)
                .attr("pointer-events", "none")
                .attr("display", "none");

            const tooltip = d3.select("#tooltip");

            svg.on("mousemove", (event) => {
                const [mx, my] = d3.pointer(event);
                const pos = projection.invert([mx, my]);
                let found = null;
                if (pos) {
                    found = states.find(f => d3.geoContains(f, pos));
                }
                
                if (found) {
                    const name = found.properties.name;
                    const pop = population[name];
                    const a = area[name];
                    const dens = pop / a;
                    
                    highlight.datum(found).attr("d", geoPath).attr("display", null);
                    
                    tooltip.style("display", "block")
                        .style("left", (event.pageX + 15) + "px")
                        .style("top", (event.pageY + 15) + "px")
                        .html(`<b>${name}</b>
                               Population: ${pop.toLocaleString()}<br>
                               Density: ${dens.toFixed(1)} / sq mi`);
                } else {
                    highlight.attr("display", "none");
                    tooltip.style("display", "none");
                }
            }).on("mouseleave", () => {
                highlight.attr("display", "none");
                tooltip.style("display", "none");
            });

            const exampleRandom = d3.randomLcg(123);
            drawExample("ex-low", 1, exampleRandom);
            drawExample("ex-med", 15, exampleRandom);
            drawExample("ex-high", 150, exampleRandom);
        }

        function drawExample(id, n, random) {
            const container = document.getElementById(id);
            const canvas = document.createElement("canvas");
            canvas.width = 30;
            canvas.height = 30;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "rgba(51, 51, 51, 0.7)";
            for (let i = 0; i < n; i++) {
                ctx.fillRect(random() * 30, random() * 30, 1, 1);
            }
            container.appendChild(canvas);
        }

        init();
    </script>
</body>
</html>
