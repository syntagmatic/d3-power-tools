<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Query Chart Component</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #222222;
            --grid: #eeeeee;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Tol Bright Palette */
            --color-0: #4477AA;
            --color-1: #EE6677;
            --color-2: #228833;
            --color-3: #CCBB44;
        }

        body {
            font-family: var(--font-main);
            color: var(--fg);
            background: var(--bg);
            margin: 2rem;
            line-height: 1.5;
        }

        h1 { font-weight: 300; margin-bottom: 2rem; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 2rem;
            align-items: start;
        }

        /* The containers that hold our chart components */
        .chart-wrapper {
            container-type: inline-size;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f9f9f9;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chart-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            padding: 4px 8px;
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        .chart-container {
            flex: 1;
            width: 100%;
            height: 250px; /* Fixed height for this demo */
            background: #fff;
        }

        /* Container Query for visual styling adjustments */
        @container (max-width: 600px) {
            .chart-container { height: 200px; }
        }
        @container (max-width: 300px) {
            .chart-container { height: 120px; }
        }
        @container (max-width: 150px) {
            .chart-container { height: 80px; }
        }

        /* Width-specific grid placement for the demo */
        .w-800 { grid-column: span 8; width: 800px; }
        .w-500 { grid-column: span 5; width: 500px; }
        .w-350 { grid-column: span 4; width: 350px; }
        .w-200 { grid-column: span 2; width: 200px; }
        .w-120 { grid-column: span 1; width: 120px; }
        .w-80  { grid-column: span 1; width: 80px; }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        @container (max-width: 100px) {
            .kpi-value { font-size: 1rem; }
        }

        .delta {
            font-size: 0.8rem;
            margin-left: 4px;
        }
        .delta.up { color: #228833; }
    </style>
</head>
<body>

    <h1>Container Query Adaptive Charts</h1>
    
    <div class="dashboard-grid">
        <div class="chart-wrapper w-800">
            <div class="chart-label">800px - Full Display</div>
            <div class="chart-container" id="chart-1"></div>
        </div>
        
        <div class="chart-wrapper w-500">
            <div class="chart-label">500px - Compact</div>
            <div class="chart-container" id="chart-2"></div>
        </div>
        
        <div class="chart-wrapper w-350">
            <div class="chart-label">350px - Compact</div>
            <div class="chart-container" id="chart-3"></div>
        </div>
        
        <div class="chart-wrapper w-200">
            <div class="chart-label">200px - Micro</div>
            <div class="chart-container" id="chart-4"></div>
        </div>

        <div class="chart-wrapper w-120">
            <div class="chart-label">120px - KPI</div>
            <div class="chart-container" id="chart-5"></div>
        </div>

        <div class="chart-wrapper w-80">
            <div class="chart-label">80px - KPI</div>
            <div class="chart-container" id="chart-6"></div>
        </div>
    </div>

    <script>
        // 1. Data Generation
        const categories = ["Engineering", "Design", "Marketing", "Sales"];
        const colors = ["#4477AA", "#EE6677", "#228833", "#CCBB44"];
        
        const data = Array.from({ length: 50 }, (_, i) => {
            const age = 20 + Math.random() * 50;
            // Income generally increases with age but with noise
            const income = 20000 + (age - 20) * 2000 + Math.random() * 30000;
            const categoryIdx = Math.floor(Math.random() * 4);
            return {
                x: age,
                y: income,
                category: categories[categoryIdx],
                color: colors[categoryIdx],
                label: `Person ${i + 1}`
            };
        });

        const meanIncome = d3.mean(data, d => d.y);
        const prevMeanIncome = meanIncome * 0.92; // Mock previous for delta

        // 2. Reusable Chart Component
        function renderChart(containerSelector, width, height) {
            const container = d3.select(containerSelector);
            container.selectAll("*").remove();

            if (width >= 600) {
                renderTier1(container, width, height);
            } else if (width >= 300) {
                renderTier2(container, width, height);
            } else if (width >= 150) {
                renderTier3(container, width, height);
            } else {
                renderTier4(container, width, height);
            }
        }

        function renderTier1(container, width, height) {
            const margin = { top: 40, right: 120, bottom: 50, left: 60 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const x = d3.scaleLinear().domain([20, 70]).range([0, innerWidth]);
            const y = d3.scaleLinear().domain([0, 160000]).range([innerHeight, 0]);

            // Grid lines
            svg.append("g").attr("class", "grid")
                .attr("stroke", "#eee")
                .call(d3.axisLeft(y).tickSize(-innerWidth).tickFormat(""));

            // Axes
            svg.append("g")
                .attr("transform", `translate(0,${innerHeight})`)
                .call(d3.axisBottom(x).ticks(innerWidth / 80));
            
            svg.append("g")
                .call(d3.axisLeft(y).ticks(5).tickFormat(d3.format("$.0s")));

            // Labels
            svg.append("text")
                .attr("x", innerWidth / 2)
                .attr("y", innerHeight + 40)
                .attr("text-anchor", "middle")
                .style("font-size", "12px")
                .text("Age (Years)");

            svg.append("text")
                .attr("transform", "rotate(-90)")
                .attr("x", -innerHeight / 2)
                .attr("y", -45)
                .attr("text-anchor", "middle")
                .style("font-size", "12px")
                .text("Annual Income");

            // Scatter points
            svg.selectAll("circle")
                .data(data)
                .join("circle")
                .attr("cx", d => x(d.x))
                .attr("cy", d => y(d.y))
                .attr("r", 5)
                .attr("fill", d => d.color)
                .attr("stroke", "#fff")
                .attr("stroke-width", 1)
                .attr("opacity", 0.8);

            // Legend
            const legend = svg.append("g")
                .attr("transform", `translate(${innerWidth + 20}, 0)`);

            categories.forEach((cat, i) => {
                const row = legend.append("g").attr("transform", `translate(0, ${i * 20})`);
                row.append("rect").attr("width", 12).attr("height", 12).attr("fill", colors[i]);
                row.append("text").attr("x", 18).attr("y", 10).style("font-size", "11px").text(cat);
            });

            // Annotation
            svg.append("text")
                .attr("x", x(65))
                .attr("y", y(140000))
                .style("font-size", "11px")
                .style("font-weight", "bold")
                .attr("text-anchor", "end")
                .text("High Earners Cluster →");
        }

        function renderTier2(container, width, height) {
            const margin = { top: 20, right: 20, bottom: 60, left: 50 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const x = d3.scaleLinear().domain([20, 70]).range([0, innerWidth]);
            const y = d3.scaleLinear().domain([0, 160000]).range([innerHeight, 0]);

            svg.append("g")
                .attr("transform", `translate(0,${innerHeight})`)
                .call(d3.axisBottom(x).ticks(Math.max(2, innerWidth / 100)));
            
            svg.append("g")
                .call(d3.axisLeft(y).ticks(3).tickFormat(d3.format("$.0s")));

            svg.selectAll("circle")
                .data(data)
                .join("circle")
                .attr("cx", d => x(d.x))
                .attr("cy", d => y(d.y))
                .attr("r", 3.5)
                .attr("fill", d => d.color)
                .attr("opacity", 0.7);

            // Legend below
            const legend = svg.append("g")
                .attr("transform", `translate(0, ${innerHeight + 35})`);

            categories.forEach((cat, i) => {
                const spacing = innerWidth / 4;
                const row = legend.append("g").attr("transform", `translate(${i * spacing}, 0)`);
                row.append("circle").attr("r", 4).attr("fill", colors[i]);
                row.append("text").attr("x", 8).attr("y", 4).style("font-size", "9px").text(cat);
            });
        }

        function renderTier3(container, width, height) {
            const margin = { top: 10, right: 10, bottom: 10, left: 10 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const x = d3.scaleLinear().domain([20, 70]).range([0, innerWidth]);
            const y = d3.scaleLinear().domain([0, 160000]).range([innerHeight, 0]);

            // Trend line (linear regression simple)
            const sumX = d3.sum(data, d => d.x);
            const sumY = d3.sum(data, d => d.y);
            const sumXY = d3.sum(data, d => d.x * d.y);
            const sumXX = d3.sum(data, d => d.x * d.x);
            const n = data.length;
            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;

            const x1 = 20, y1 = slope * x1 + intercept;
            const x2 = 70, y2 = slope * x2 + intercept;

            svg.append("line")
                .attr("x1", x(x1)).attr("y1", y(y1))
                .attr("x2", x(x2)).attr("y2", y(y2))
                .attr("stroke", "#aaa")
                .attr("stroke-width", 2)
                .attr("stroke-dasharray", "4,2");

            svg.selectAll("circle")
                .data(data)
                .join("circle")
                .attr("cx", d => x(d.x))
                .attr("cy", d => y(d.y))
                .attr("r", 2)
                .attr("fill", d => d.color)
                .attr("opacity", 0.5);
        }

        function renderTier4(container, width, height) {
            const delta = ((meanIncome - prevMeanIncome) / prevMeanIncome) * 100;
            const formatted = d3.format("$.0s")(meanIncome).replace("G", "B").replace("M", "M").replace("k", "k");
            
            container.append("div")
                .attr("class", "kpi-value")
                .html(`
                    ${formatted}
                    <span class="delta up">▲${delta.toFixed(0)}%</span>
                `);
        }

        // 3. Observer Initialization
        const wrappers = document.querySelectorAll('.chart-container');
        wrappers.forEach(el => {
            const ro = new ResizeObserver(entries => {
                for (let entry of entries) {
                    const { width, height } = entry.contentRect;
                    if (width > 0) renderChart(`#${el.id}`, width, height);
                }
            });
            ro.observe(el);
        });

    </script>
</body>
</html>
