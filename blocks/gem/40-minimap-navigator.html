<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimap Navigator - D3.js Power Tools</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: #222; }
        .chart-wrapper {
            position: relative;
            width: 100%;
            user-select: none;
        }
        canvas {
            display: block;
            pointer-events: none;
        }
        svg.overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .minimap-wrapper {
            position: relative;
            width: 100%;
            height: 100px;
            margin-top: 20px;
            background: #fafafa;
            border: 1px solid #eee;
        }
        .stats-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
            color: #666;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .stat-item b { color: #333; }
        .brush .selection {
            fill: #4477AA;
            fill-opacity: 0.2;
            stroke: #4477AA;
            stroke-opacity: 0.5;
        }
        .axis text { font-size: 10px; fill: #888; }
        .axis path, .axis line { stroke: #eee; }
    </style>
</head>
<body>

<div class="container">
    <h1>Minimap Navigator: 50,000 Points</h1>
    
    <div class="chart-wrapper" id="main-chart">
        <canvas id="main-canvas"></canvas>
        <svg id="main-svg" class="overlay"></svg>
    </div>

    <div class="minimap-wrapper" id="minimap">
        <canvas id="minimap-canvas"></canvas>
        <svg id="minimap-svg" class="overlay"></svg>
    </div>

    <div class="stats-bar" id="stats">
        <div class="stat-item">Range: <b id="stat-range">-</b></div>
        <div class="stat-item">Min: <b id="stat-min">-</b></div>
        <div class="stat-item)Max: <b id="stat-max">-</b></div>
        <div class="stat-item">Mean: <b id="stat-mean">-</b></div>
    </div>
</div>

<script>
    // Configuration
    const N = 50000;
    const width = 1000;
    const mainHeight = 400;
    const miniHeight = 100;
    const margin = { top: 20, right: 30, bottom: 30, left: 50 };
    const miniMargin = { top: 5, right: 30, bottom: 20, left: 50 };

    const innerWidth = width - margin.left - margin.right;
    const innerMainHeight = mainHeight - margin.top - margin.bottom;
    const innerMiniHeight = miniHeight - miniMargin.top - miniMargin.bottom;

    // 1. Data Generation: Fractal Random Walk
    function generateData() {
        const data = new Array(N);
        const now = new Date();
        const oneYearAgo = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
        const timeStep = (now - oneYearAgo) / N;

        let val = 50;
        for (let i = 0; i < N; i++) {
            // Large trend
            const trend = Math.sin(i / N * Math.PI * 2) * 10;
            // Medium oscillations
            const osc = Math.sin(i / N * Math.PI * 20) * 5;
            // Fine noise / random walk
            val += (Math.random() - 0.5) * 2;
            
            data[i] = {
                date: new Date(oneYearAgo.getTime() + i * timeStep),
                value: val + trend + osc
            };
        }
        return data;
    }

    const fullData = generateData();

    // 2. LTTB Implementation
    function lttb(data, threshold) {
        const length = data.length;
        if (threshold >= length || threshold === 0) return data;

        const sampled = [];
        let sampledIndex = 0;

        // Bucket size. Leave room for start and end data points
        const every = (length - 2) / (threshold - 2);

        let a = 0; // Initially a is the first point in the triangle
        let maxAreaPoint, maxArea, area, nextA;

        sampled[sampledIndex++] = data[a]; // Always add the first point

        for (let i = 0; i < threshold - 2; i++) {
            // Calculate point average for next bucket (containing c)
            let avgX = 0, avgY = 0, avgRangeStart = Math.floor((i + 1) * every) + 1,
                avgRangeEnd = Math.floor((i + 2) * every) + 1;
            avgRangeEnd = avgRangeEnd < length ? avgRangeEnd : length;

            let avgRangeLength = avgRangeEnd - avgRangeStart;

            for (; avgRangeStart < avgRangeEnd; avgRangeStart++) {
                avgX += data[avgRangeStart].date.getTime();
                avgY += data[avgRangeStart].value;
            }
            avgX /= avgRangeLength;
            avgY /= avgRangeLength;

            // Get the range for this bucket
            let rangeOffs = Math.floor((i + 0) * every) + 1,
                rangeTo = Math.floor((i + 1) * every) + 1;

            // Point a
            let pointAx = data[a].date.getTime(),
                pointAy = data[a].value;

            maxArea = area = -1;

            for (; rangeOffs < rangeTo; rangeOffs++) {
                // Calculate triangle area over three buckets
                area = Math.abs((pointAx - avgX) * (data[rangeOffs].value - pointAy) -
                                (pointAx - data[rangeOffs].date.getTime()) * (avgY - pointAy)
                               ) * 0.5;
                if (area > maxArea) {
                    maxArea = area;
                    maxAreaPoint = data[rangeOffs];
                    nextA = rangeOffs; // Next a is this b
                }
            }

            sampled[sampledIndex++] = maxAreaPoint; // Pick this point from the bucket
            a = nextA; // This a is the next a (point b becomes a)
        }

        sampled[sampledIndex++] = data[length - 1]; // Always add the last point

        return sampled;
    }

    // Pre-downsample for minimap
    const miniData = lttb(fullData, 500);

    // 3. Setup Scales & Canvas
    const x = d3.scaleUtc()
        .domain(d3.extent(fullData, d => d.date))
        .range([0, innerWidth]);

    const y = d3.scaleLinear()
        .domain(d3.extent(fullData, d => d.value))
        .nice()
        .range([innerMainHeight, 0]);

    const xMini = x.copy().range([0, innerWidth]);
    const yMini = y.copy().range([innerMiniHeight, 0]);

    // Canvas setup
    function setupCanvas(id, w, h) {
        const dpr = window.devicePixelRatio || 1;
        const canvas = d3.select(id)
            .attr("width", w * dpr)
            .attr("height", h * dpr)
            .style("width", w + "px")
            .style("height", h + "px")
            .node();
        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);
        return ctx;
    }

    const mainCtx = setupCanvas("#main-canvas", width, mainHeight);
    const miniCtx = setupCanvas("#minimap-canvas", width, miniHeight);

    const mainSvg = d3.select("#main-svg")
        .attr("viewBox", `0 0 ${width} ${mainHeight}`);
    const miniSvg = d3.select("#minimap-svg")
        .attr("viewBox", `0 0 ${width} ${miniHeight}`);

    // Axes
    const xAxis = d3.axisBottom(x).ticks(innerWidth / 80);
    const yAxis = d3.axisLeft(y).ticks(innerMainHeight / 40);

    const gx = mainSvg.append("g")
        .attr("class", "axis x-axis")
        .attr("transform", `translate(${margin.left}, ${mainHeight - margin.bottom})`)
        .call(xAxis);

    const gy = mainSvg.append("g")
        .attr("class", "axis y-axis")
        .attr("transform", `translate(${margin.left}, ${margin.top})`)
        .call(yAxis);

    // Initial View: Last 1 hour
    const endTime = fullData[N - 1].date;
    const startTime = new Date(endTime.getTime() - 1 * 60 * 60 * 1000);
    const initialDomain = [startTime, endTime];

    // 4. Rendering Logic
    function renderMain(transform) {
        const zx = transform.rescaleX(x);
        const [d0, d1] = zx.domain();
        
        // Find visible data
        const bisect = d3.bisector(d => d.date).left;
        const i0 = Math.max(0, bisect(fullData, d0) - 1);
        const i1 = Math.min(N - 1, bisect(fullData, d1) + 1);
        let visibleData = fullData.slice(i0, i1 + 1);

        // Stats calculation
        const stats = {
            min: d3.min(visibleData, d => d.value),
            max: d3.max(visibleData, d => d.value),
            mean: d3.mean(visibleData, d => d.value)
        };
        updateStats(d0, d1, stats);

        // Auto-scale Y to visible range
        y.domain([stats.min, stats.max]).nice();
        gy.call(yAxis.scale(y));
        gx.call(xAxis.scale(zx));

        mainCtx.clearRect(0, 0, width, mainHeight);
        mainCtx.save();
        mainCtx.translate(margin.left, margin.top);

        const visibleCount = visibleData.length;
        const durationMin = (d1 - d0) / (60 * 1000);

        // Downsampling for main chart if view is wide
        if (durationMin > 12 * 60) {
            visibleData = lttb(visibleData, innerWidth * 2);
        }

        mainCtx.beginPath();
        mainCtx.lineJoin = "round";
        mainCtx.lineCap = "round";
        mainCtx.strokeStyle = "#4477AA";
        mainCtx.lineWidth = 1;

        visibleData.forEach((d, i) => {
            const px = zx(d.date);
            const py = y(d.value);
            if (i === 0) mainCtx.moveTo(px, py);
            else mainCtx.lineTo(px, py);
        });
        mainCtx.stroke();

        // Show dots if zoomed in very tight (< 5 minutes)
        if (durationMin < 5) {
            mainCtx.fillStyle = "#4477AA";
            visibleData.forEach(d => {
                mainCtx.beginPath();
                mainCtx.arc(zx(d.date), y(d.value), 2, 0, Math.PI * 2);
                mainCtx.fill();
            });
        }

        mainCtx.restore();
    }

    function renderMini() {
        miniCtx.clearRect(0, 0, width, miniHeight);
        miniCtx.save();
        miniCtx.translate(miniMargin.left, miniMargin.top);
        
        miniCtx.beginPath();
        miniCtx.strokeStyle = "#999999";
        miniCtx.lineWidth = 0.5;
        
        miniData.forEach((d, i) => {
            const px = xMini(d.date);
            const py = yMini(d.value);
            if (i === 0) miniCtx.moveTo(px, py);
            else miniCtx.lineTo(px, py);
        });
        miniCtx.stroke();
        miniCtx.restore();
    }

    function updateStats(d0, d1, s) {
        const fmtTime = d3.utcFormat("%b %d, %H:%M:%S");
        d3.select("#stat-range").text(`${fmtTime(d0)} - ${fmtTime(d1)}`);
        d3.select("#stat-min").text(s.min.toFixed(2));
        d3.select("#stat-max").text(s.max.toFixed(2));
        d3.select("#stat-mean").text(s.mean.toFixed(2));
    }

    // 5. Interaction: Zoom & Brush
    const zoom = d3.zoom()
        .scaleExtent([1, 10000])
        .translateExtent([[0, 0], [innerWidth, innerMainHeight]])
        .extent([[0, 0], [innerWidth, innerMainHeight]])
        .on("zoom", zoomed);

    const brush = d3.brushX()
        .extent([[0, 0], [innerWidth, innerMiniHeight]])
        .on("brush end", brushed);

    const gBrush = miniSvg.append("g")
        .attr("class", "brush")
        .attr("transform", `translate(${miniMargin.left}, ${miniMargin.top})`)
        .call(brush);

    // Transparent rect to capture zoom events on main chart
    mainSvg.append("rect")
        .attr("width", innerWidth)
        .attr("height", innerMainHeight)
        .attr("transform", `translate(${margin.left}, ${margin.top})`)
        .attr("fill", "none")
        .attr("pointer-events", "all")
        .call(zoom);

    function zoomed(event) {
        if (event.sourceEvent && event.sourceEvent.type === "brush") return;
        const transform = event.transform;
        renderMain(transform);
        
        // Update brush position
        const zx = transform.rescaleX(x);
        const [d0, d1] = zx.domain();
        gBrush.call(brush.move, [xMini(d0), xMini(d1)]);
    }

    function brushed(event) {
        if (!event.selection) return;
        if (event.sourceEvent && event.sourceEvent.type === "zoom") return;
        
        const [s0, s1] = event.selection;
        const d0 = xMini.invert(s0);
        const d1 = xMini.invert(s1);

        const k = innerWidth / (s1 - s0);
        const tx = -s0 * k;
        
        const transform = d3.zoomIdentity.scale(k).translate(tx, 0);
        
        // Update zoom state on main chart without triggering zoomed event again
        d3.select("#main-svg rect").call(zoom.transform, transform);
        
        renderMain(transform);
    }

    // Initialize
    renderMini();
    
    // Set initial view
    const x0 = x(initialDomain[0]);
    const x1 = x(initialDomain[1]);
    const initialK = innerWidth / (x1 - x0);
    const initialTX = -x0 * initialK;
    const initialTransform = d3.zoomIdentity.scale(initialK).translate(initialTX, 0);
    
    d3.select("#main-svg rect").call(zoom.transform, initialTransform);

</script>

</body>
</html>
