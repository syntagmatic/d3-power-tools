<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World GDP Rankings — Bar Chart Race</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --accent-color: #007bff;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: relative;
        }

        header {
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .source {
            font-size: 14px;
            color: #6c757d;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            width: 100%;
        }

        button {
            padding: 8px 16px;
            border: 1px solid #dee2e6;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: #e9ecef;
        }

        button.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        #play-pause {
            min-width: 80px;
        }

        .year-display {
            position: absolute;
            top: 100px;
            right: 40px;
            font-size: 80px;
            font-weight: 800;
            color: #e9ecef;
            pointer-events: none;
            user-select: none;
        }

        svg {
            overflow: visible;
        }

        .bar-label {
            font-size: 14px;
            font-weight: 600;
            text-anchor: end;
        }

        .value-label {
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .flag {
            font-size: 18px;
        }

        .grid-line {
            stroke: #f1f3f5;
            stroke-width: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>World GDP Rankings — Bar Chart Race</h1>
        <div class="source">Source: Synthetic data for demonstration (GDP in Billions USD)</div>
    </header>

    <div class="controls">
        <button id="play-pause">Pause</button>
        <div style="margin-left: auto; display: flex; gap: 8px; align-items: center;">
            <span style="font-size: 14px; color: #6c757d;">Speed:</span>
            <button class="speed-btn" data-speed="0.5">0.5x</button>
            <button class="speed-btn active" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="2">2x</button>
        </div>
    </div>

    <div id="chart"></div>
    <div class="year-display" id="year-text">1994</div>
</div>

<script>
    // 1. Data Generation
    const countries = [
        { id: "USA", name: "USA", code: "us", color: "#4477AA" },
        { id: "CHN", name: "China", code: "cn", color: "#EE6677" },
        { id: "JPN", name: "Japan", code: "jp", color: "#228833" },
        { id: "DEU", name: "Germany", code: "de", color: "#CCBB44" },
        { id: "GBR", name: "UK", code: "gb", color: "#66CCEE" },
        { id: "IND", name: "India", code: "in", color: "#AA3377" },
        { id: "FRA", name: "France", code: "fr", color: "#BBBBBB" },
        { id: "ITA", name: "Italy", code: "it", color: "#EE7733" },
        { id: "BRA", name: "Brazil", code: "br", color: "#0077BB" },
        { id: "CAN", name: "Canada", code: "ca", color: "#33BBEE" },
        { id: "RUS", name: "Russia", code: "ru", color: "#EE3377" },
        { id: "KOR", name: "South Korea", code: "kr", color: "#CC3311" },
        { id: "AUS", name: "Australia", code: "au", color: "#009988" },
        { id: "ESP", name: "Spain", code: "es", color: "#CC6677" },
        { id: "MEX", name: "Mexico", code: "mx", color: "#332288" }
    ];

    const countryToEmoji = {
        us: "🇺🇸", cn: "🇨🇳", jp: "🇯🇵", de: "🇩🇪", gb: "🇬🇧",
        in: "🇮🇳", fr: "🇫🇷", it: "🇮🇹", br: "🇧🇷", ca: "🇨🇦",
        ru: "🇷🇺", kr: "🇰🇷", au: "🇦🇺", es: "🇪🇸", mx: "🇲🇽"
    };

    const startYear = 1994;
    const endYear = 2023;
    const years = d3.range(startYear, endYear + 1);

    // Initial GDPs in 1994 (approximate relative scales)
    const baseGDP = {
        USA: 7300, CHN: 600, JPN: 4900, DEU: 2200, GBR: 1150,
        IND: 330, FRA: 1400, ITA: 1100, BRA: 550, CAN: 570,
        RUS: 400, KOR: 450, AUS: 350, ESP: 530, MEX: 520
    };

    // Growth rates (annual % with some noise and trends)
    function getGrowthRate(id, year) {
        if (id === "CHN") {
            if (year < 2010) return 0.09 + Math.random() * 0.04;
            if (year < 2018) return 0.07 + Math.random() * 0.02;
            return 0.04 + Math.random() * 0.02;
        }
        if (id === "IND") {
            if (year < 2005) return 0.05 + Math.random() * 0.02;
            return 0.07 + Math.random() * 0.02;
        }
        if (id === "JPN") return 0.005 + Math.random() * 0.01;
        if (id === "USA") return 0.025 + Math.random() * 0.015;
        if (id === "KOR") return 0.04 + Math.random() * 0.02;
        if (id === "RUS") {
            if (year > 2014) return 0.005 + Math.random() * 0.01;
            return 0.03 + Math.random() * 0.03;
        }
        // General growth for others
        return 0.015 + Math.random() * 0.025;
    }

    const data = [];
    const currentGDP = { ...baseGDP };

    years.forEach(year => {
        countries.forEach(c => {
            if (year > startYear) {
                currentGDP[c.id] *= (1 + getGrowthRate(c.id, year));
            }
            data.push({
                year,
                id: c.id,
                name: c.name,
                code: c.code,
                value: currentGDP[c.id],
                color: c.color
            });
        });
    });

    // 2. Setup Chart
    const margin = { top: 20, right: 100, bottom: 10, left: 120 };
    const width = 1000 - margin.left - margin.right;
    const height = 500 - margin.top - margin.bottom;
    const topN = 12;
    const barPadding = 0.15;
    const duration = 600;

    const svg = d3.select("#chart")
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    const x = d3.scaleLinear().range([0, width]);
    const y = d3.scaleBand()
        .domain(d3.range(topN))
        .range([0, height])
        .padding(barPadding);

    const yearText = d3.select("#year-text");
    
    let currentYearIndex = 0;
    let isPlaying = true;
    let speedMultiplier = 1;
    let timer;

    // 3. Update Function
    function update(year) {
        const yearData = data.filter(d => d.year === year)
            .sort((a, b) => b.value - a.value)
            .slice(0, topN);

        yearData.forEach((d, i) => d.rank = i);

        x.domain([0, d3.max(data.filter(d => d.year === year), d => d.value) * 1.1]);

        yearText.text(year);

        const currentDuration = duration / speedMultiplier;

        // BARS
        const bars = svg.selectAll(".bar-group")
            .data(yearData, d => d.id);

        const barsEnter = bars.enter()
            .append("g")
            .attr("class", "bar-group")
            .attr("transform", d => `translate(0,${height + 100})`);

        barsEnter.append("rect")
            .attr("class", "bar")
            .attr("fill", d => d.color)
            .attr("height", y.bandwidth())
            .attr("width", 0)
            .attr("rx", 4);

        barsEnter.append("text")
            .attr("class", "bar-label")
            .attr("x", -10)
            .attr("y", y.bandwidth() / 2)
            .attr("dy", "0.35em")
            .text(d => d.name);

        barsEnter.append("text")
            .attr("class", "value-label")
            .attr("x", 5)
            .attr("y", y.bandwidth() / 2)
            .attr("dy", "0.35em");

        barsEnter.append("text")
            .attr("class", "flag")
            .attr("x", 5)
            .attr("y", y.bandwidth() / 2)
            .attr("dy", "0.35em")
            .text(d => countryToEmoji[d.code]);

        const barsUpdate = bars.merge(barsEnter);

        barsUpdate.transition()
            .duration(currentDuration)
            .ease(d3.easeLinear)
            .attr("transform", d => `translate(0,${y(d.rank)})`);

        barsUpdate.select("rect")
            .transition()
            .duration(currentDuration)
            .ease(d3.easeLinear)
            .attr("width", d => x(d.value));

        barsUpdate.select(".value-label")
            .transition()
            .duration(currentDuration)
            .ease(d3.easeLinear)
            .attr("x", d => x(d.value) + 35)
            .textTween(function(d) {
                const i = d3.interpolateNumber(parseFloat(this.textContent.replace(/,/g, '')) || 0, d.value);
                return t => d3.format(",.0f")(i(t));
            });

        barsUpdate.select(".flag")
            .transition()
            .duration(currentDuration)
            .ease(d3.easeLinear)
            .attr("x", d => x(d.value) + 5);

        bars.exit()
            .transition()
            .duration(currentDuration)
            .ease(d3.easeLinear)
            .attr("transform", d => `translate(0,${height + 100})`)
            .remove();
    }

    // 4. Animation Control
    function next() {
        if (currentYearIndex >= years.length - 1) {
            currentYearIndex = 0;
        } else {
            currentYearIndex++;
        }
        update(years[currentYearIndex]);
        
        if (isPlaying) {
            timer = setTimeout(next, duration / speedMultiplier);
        }
    }

    // 5. Interaction
    d3.select("#play-pause").on("click", function() {
        isPlaying = !isPlaying;
        d3.select(this).text(isPlaying ? "Pause" : "Play");
        if (isPlaying) next();
        else clearTimeout(timer);
    });

    d3.selectAll(".speed-btn").on("click", function() {
        d3.selectAll(".speed-btn").classed("active", false);
        d3.select(this).classed("active", true);
        speedMultiplier = +this.getAttribute("data-speed");
        
        // If playing, reset timer to apply new speed immediately
        if (isPlaying) {
            clearTimeout(timer);
            next();
        }
    });

    // Initial Start
    update(years[0]);
    timer = setTimeout(next, duration);

</script>
</body>
</html>
