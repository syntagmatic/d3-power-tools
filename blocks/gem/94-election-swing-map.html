<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election Swing Explorer</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a2e;
    --muted: #64748b;
    --border: #e2e8f0;
    --highlight: #3b82f6;
    --accent-red: #ef4444;
    --accent-blue: #3b82f6;
  }
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    min-height: 100vh;
    line-height: 1.5;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
    max-width: 800px;
  }

  h1 {
    font-size: 1.875rem;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-size: 1rem;
    color: var(--muted);
  }

  #dashboard {
    width: 100%;
    max-width: 1000px;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    background: #fff;
    padding: 1rem;
    border-radius: 12px;
  }

  .map-container {
    position: relative;
    width: 100%;
    background: #f8fafc;
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  #map-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1.5rem;
    background: #f1f5f9;
    border-radius: 8px;
  }

  .slider-box {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--muted);
  }

  .current-year {
    font-size: 1.25rem;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  input[type=range] {
    width: 100%;
    height: 6px;
    background: #cbd5e1;
    border-radius: 3px;
    appearance: none;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 18px;
    height: 18px;
    background: var(--text);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.1s;
  }

  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.1);
  }

  .cycle-ticks {
    display: flex;
    justify-content: space-between;
    padding: 0 4px;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .histogram-container {
    width: 100%;
  }

  #hist-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .county {
    stroke: none;
    transition: opacity 0.2s;
  }

  .state-border {
    fill: none;
    stroke: #fff;
    stroke-width: 1;
    pointer-events: none;
  }

  .nation-border {
    fill: none;
    stroke: #fff;
    stroke-width: 1.5;
    pointer-events: none;
  }

  .brush .selection {
    fill: #3b82f6;
    fill-opacity: 0.1;
    stroke: #3b82f6;
    stroke-width: 1px;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(15, 23, 42, 0.9);
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.75rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    opacity: 0;
    z-index: 10;
  }

  .legend {
    position: absolute;
    bottom: 1rem;
    right: 1rem;
    background: rgba(255, 255, 255, 0.8);
    padding: 0.5rem;
    border-radius: 4px;
    font-size: 0.7rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .legend-gradient {
    width: 120px;
    height: 10px;
    background: linear-gradient(to right, #b2182b, #ef8a62, #fddbc7, #f7f7f7, #d1e5f0, #67a9cf, #2166ac);
    border-radius: 2px;
  }

  .legend-labels {
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<header>
  <h1>Election Swing Explorer</h1>
  <p class="subtitle">Synthetic US county-level analysis across 5 election cycles. Shift the slider to see temporal swings; brush the histogram to filter the map.</p>
</header>

<div id="dashboard">
  <div class="map-container">
    <svg id="map-svg"></svg>
    <div class="legend">
      <div class="legend-labels">
        <span>Red Shift</span>
        <span>Blue Shift</span>
      </div>
      <div class="legend-gradient"></div>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="controls">
    <div class="slider-box">
      <div class="slider-header">
        <span>ELECTION CYCLE</span>
        <span class="current-year" id="year-display">2008</span>
      </div>
      <input type="range" id="cycle-slider" min="0" max="4" value="0" step="1">
      <div class="cycle-ticks">
        <span>2008</span>
        <span>2012</span>
        <span>2016</span>
        <span>2020</span>
        <span>2024</span>
      </div>
    </div>

    <div class="histogram-container">
      <svg id="hist-svg"></svg>
    </div>
  </div>
</div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

// Constants
const width = 960;
const mapHeight = 600;
const histHeight = 120;
const margin = { top: 10, right: 20, bottom: 30, left: 40 };
const cycles = [2008, 2012, 2016, 2020, 2024];

// State
let currentCycle = 0;
let brushExtent = null;
let countyData = new Map();

// Color Scale: RdBu diverging (flipped to match political colors: Red low, Blue high)
// d3.interpolateRdBu(0) is deep red, 1 is deep blue.
const colorScale = d3.scaleSequential(d3.interpolateRdBu).domain([-0.6, 0.6]);

// Load Data
async function init() {
  const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json");
  const counties = topojson.feature(us, us.objects.counties).features;
  const states = topojson.mesh(us, us.objects.states, (a, b) => a !== b);
  const nation = topojson.mesh(us, us.objects.nation);

  // Generate Synthetic Data
  // Each county gets a baseline "partisanship" and 5 cycles of swing
  const randomNormal = d3.randomNormal(0, 0.08);
  const randomPartisanship = d3.randomUniform(-0.4, 0.4);
  
  // National trends per cycle
  const nationalDrift = [0, -0.04, -0.08, 0.06, -0.02];

  counties.forEach(d => {
    const base = randomPartisanship();
    const swings = cycles.map((y, i) => {
      const val = base + nationalDrift[i] + randomNormal();
      return Math.max(-1, Math.min(1, val));
    });
    countyData.set(d.id, swings);
  });

  // Projection
  const projection = d3.geoAlbersUsa().fitSize([width, mapHeight], {type: "FeatureCollection", features: counties});
  const path = d3.geoPath(projection);

  // SVG Setup
  const mapSvg = d3.select("#map-svg")
    .attr("viewBox", [0, 0, width, mapHeight]);

  const histSvg = d3.select("#hist-svg")
    .attr("viewBox", [0, 0, width, histHeight]);

  // Tooltip
  const tooltip = d3.select("#tooltip");

  // Render Map
  const countyGroup = mapSvg.append("g");
  
  const countyPaths = countyGroup.selectAll(".county")
    .data(counties)
    .join("path")
    .attr("class", "county")
    .attr("d", path)
    .attr("fill", d => colorScale(countyData.get(d.id)[currentCycle]))
    .on("mouseenter", (event, d) => {
      const val = countyData.get(d.id)[currentCycle];
      tooltip.style("opacity", 1)
        .html(`
          <strong>${d.properties.name} County</strong><br/>
          Swing: <span style="color:${val > 0 ? '#3b82f6' : '#ef4444'}">${(val * 100).toFixed(1)}%</span>
        `);
    })
    .on("mousemove", (event) => {
      tooltip.style("left", (event.pageX + 15) + "px")
             .style("top", (event.pageY - 15) + "px");
    })
    .on("mouseleave", () => tooltip.style("opacity", 0));

  mapSvg.append("path")
    .datum(states)
    .attr("class", "state-border")
    .attr("d", path);

  mapSvg.append("path")
    .datum(nation)
    .attr("class", "nation-border")
    .attr("d", path);

  // Histogram Logic
  const xHist = d3.scaleLinear().domain([-0.8, 0.8]).range([margin.left, width - margin.right]);
  const yHist = d3.scaleLinear().range([histHeight - margin.bottom, margin.top]);

  const xAxis = d3.axisBottom(xHist).ticks(10).tickFormat(d => (d * 100) + "%");
  histSvg.append("g")
    .attr("transform", `translate(0,${histHeight - margin.bottom})`)
    .call(xAxis)
    .call(g => g.select(".domain").remove());

  const histBars = histSvg.append("g");

  function updateHistogram(cycleIdx, duration = 600) {
    const values = Array.from(countyData.values()).map(v => v[cycleIdx]);
    const bins = d3.bin().domain(xHist.domain()).thresholds(40)(values);
    
    yHist.domain([0, d3.max(bins, d => d.length)]);

    histBars.selectAll("rect")
      .data(bins)
      .join("rect")
      .transition().duration(duration)
      .attr("x", d => xHist(d.x0) + 1)
      .attr("width", d => Math.max(0, xHist(d.x1) - xHist(d.x0) - 1))
      .attr("y", d => yHist(d.length))
      .attr("height", d => yHist(0) - yHist(d.length))
      .attr("fill", d => colorScale((d.x0 + d.x1) / 2));
  }

  // Interaction: Slider
  const slider = d3.select("#cycle-slider");
  const yearDisplay = d3.select("#year-display");

  slider.on("input", function() {
    currentCycle = +this.value;
    yearDisplay.text(cycles[currentCycle]);
    
    countyPaths.transition().duration(600)
      .attr("fill", d => {
        const val = countyData.get(d.id)[currentCycle];
        if (brushExtent && (val < brushExtent[0] || val > brushExtent[1])) {
          return "#e2e8f0";
        }
        return colorScale(val);
      })
      .attr("opacity", d => {
        if (!brushExtent) return 1;
        const val = countyData.get(d.id)[currentCycle];
        return (val >= brushExtent[0] && val <= brushExtent[1]) ? 1 : 0.2;
      });

    updateHistogram(currentCycle);
  });

  // Interaction: Brush
  const brush = d3.brushX()
    .extent([[margin.left, margin.top], [width - margin.right, histHeight - margin.bottom]])
    .on("brush end", (event) => {
      if (event.selection) {
        brushExtent = event.selection.map(xHist.invert);
        countyPaths
          .attr("fill", d => {
            const val = countyData.get(d.id)[currentCycle];
            return (val >= brushExtent[0] && val <= brushExtent[1]) ? colorScale(val) : "#e2e8f0";
          })
          .attr("opacity", d => {
            const val = countyData.get(d.id)[currentCycle];
            return (val >= brushExtent[0] && val <= brushExtent[1]) ? 1 : 0.2;
          });
      } else {
        brushExtent = null;
        countyPaths
          .attr("fill", d => colorScale(countyData.get(d.id)[currentCycle]))
          .attr("opacity", 1);
      }
    });

  histSvg.append("g")
    .attr("class", "brush")
    .call(brush);

  // Initial Render
  updateHistogram(0, 0);
}

init();
</script>
</body>
</html>
