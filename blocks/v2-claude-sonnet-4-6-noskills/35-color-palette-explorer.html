<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Explorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f5f2;
      --panel: #ffffff;
      --border: #e3e1db;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 2px 8px rgba(0,0,0,0.04);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }

    .page-header {
      margin-bottom: 18px;
    }

    .page-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .page-header p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ── Palette selector ─────────────────────────────── */
    .palette-selector {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .palette-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px 5px 8px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
      color: var(--muted);
      transition: border-color 0.1s, color 0.1s, background 0.1s;
    }

    .palette-btn:hover { border-color: #aaa; color: var(--text); }

    .palette-btn.active {
      border-color: var(--text);
      background: var(--text);
      color: #fff;
    }

    .pdots { display: flex; gap: 3px; }
    .pdot { width: 9px; height: 9px; border-radius: 50%; }

    /* ── Main grid ────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .panel-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── WCAG legend ──────────────────────────────────── */
    .wcag-legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .wl-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .wl-dot { width: 9px; height: 9px; border-radius: 50%; }

    /* ── CVD panel ────────────────────────────────────── */
    .cvd-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .cvd-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
    }

    .cvd-row:last-child { margin-bottom: 0; }

    .cvd-label {
      font-size: 0.76rem;
      color: var(--muted);
      width: 108px;
      flex-shrink: 0;
    }

    .cvd-swatches { display: flex; gap: 5px; flex-wrap: wrap; }

    .swatch {
      width: 52px;
      height: 42px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      cursor: default;
      position: relative;
      transition: transform 0.1s;
    }

    .swatch:hover { transform: scale(1.08); z-index: 1; }

    /* Tooltip */
    .tip {
      position: fixed;
      background: rgba(20,20,20,0.9);
      color: #fff;
      font-size: 0.7rem;
      padding: 5px 9px;
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 100;
    }

    .tip.visible { opacity: 1; }
  </style>
</head>
<body>

  <div class="page-header">
    <h1>Color Palette Explorer</h1>
    <p>Accessibility analysis and CVD simulation for 6 categorical palettes</p>
  </div>

  <div class="palette-selector" id="palette-selector"></div>

  <div class="grid">
    <div class="panel">
      <div class="panel-title">Bar Chart — synthetic category data</div>
      <div id="bar-chart"></div>
    </div>
    <div class="panel">
      <div class="panel-title">WCAG Contrast Matrix — text color (row) on background (column)</div>
      <div id="contrast-matrix"></div>
      <div class="wcag-legend">
        <div class="wl-item"><div class="wl-dot" style="background:#1a6e3e"></div>AAA ≥7.0</div>
        <div class="wl-item"><div class="wl-dot" style="background:#52b788"></div>AA ≥4.5</div>
        <div class="wl-item"><div class="wl-dot" style="background:#f4a261"></div>Large ≥3.0</div>
        <div class="wl-item"><div class="wl-dot" style="background:#e63946"></div>Fail &lt;3.0</div>
      </div>
    </div>
  </div>

  <div class="cvd-panel">
    <div class="panel-title">Color Vision Deficiency Simulation</div>
    <div id="cvd-strips"></div>
  </div>

  <div class="tip" id="tooltip"></div>

  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // ── Palette definitions ──────────────────────────────────────────────
    const PALETTES = {
      'Tol Bright':   ['#4477AA','#EE6677','#228833','#CCBB44','#66CCEE','#AA3377','#BBBBBB'],
      'Tol Vibrant':  ['#EE7733','#0077BB','#33BBEE','#EE3377','#CC3311','#009988','#BBBBBB'],
      'Tol Muted':    ['#332288','#117733','#44AA99','#88CCEE','#DDCC77','#CC6677','#AA4499','#882255'],
      'Tol Light':    ['#77AADD','#EE8866','#EEDD88','#FFAABB','#99DDFF','#44BB99','#BBCC33'],
      'Tableau 10':   [...d3.schemeTableau10],
      'Category 10':  [...d3.schemeCategory10],
    };

    // ── Synthetic data ───────────────────────────────────────────────────
    const LABELS = ['Alpha','Beta','Gamma','Delta','Epsilon','Zeta','Eta','Theta','Iota','Kappa'];
    const VALUES = [87,64,91,43,72,56,83,38,67,79];

    // ── App state ────────────────────────────────────────────────────────
    let active = 'Tol Bright';

    // ── Color math ───────────────────────────────────────────────────────
    function hexToRgb(hex) {
      // normalise 3- or 6-char hex
      const h = hex.replace('#','');
      const n = h.length === 3
        ? h.split('').map(c => parseInt(c+c,16))
        : [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
      return n;
    }

    function toLinear(c) {
      c /= 255;
      return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
    }

    function luminance(hex) {
      const [r,g,b] = hexToRgb(hex);
      return 0.2126*toLinear(r) + 0.7152*toLinear(g) + 0.0722*toLinear(b);
    }

    function contrastRatio(a, b) {
      const L1 = luminance(a), L2 = luminance(b);
      return (Math.max(L1,L2)+0.05) / (Math.min(L1,L2)+0.05);
    }

    // Returns black or white for readable text on hex background
    function textOn(hex) {
      return luminance(hex) > 0.179 ? '#111' : '#fff';
    }

    // WCAG level meta
    function wcagMeta(ratio) {
      if (ratio >= 7)   return { label: 'AAA', color: '#1a6e3e' };
      if (ratio >= 4.5) return { label: 'AA',  color: '#52b788' };
      if (ratio >= 3)   return { label: 'AA*', color: '#f4a261' };
      return                  { label: '✗',   color: '#e63946' };
    }

    // CVD simulation matrices (Viénot simplified)
    const CVD_M = {
      protanopia:   [[0.567,0.433,0],[0.558,0.442,0],[0,0.242,0.758]],
      deuteranopia: [[0.625,0.375,0],[0.700,0.300,0],[0,0.300,0.700]],
      tritanopia:   [[0.950,0.050,0],[0,0.433,0.567],[0,0.475,0.525]],
    };

    function simulateCVD(hex, type) {
      const m = CVD_M[type];
      const [r,g,b] = hexToRgb(hex);
      const clamp = v => Math.round(Math.max(0, Math.min(255, v)));
      const nr = clamp(m[0][0]*r + m[0][1]*g + m[0][2]*b);
      const ng = clamp(m[1][0]*r + m[1][1]*g + m[1][2]*b);
      const nb = clamp(m[2][0]*r + m[2][1]*g + m[2][2]*b);
      return '#' + [nr,ng,nb].map(v => v.toString(16).padStart(2,'0')).join('');
    }

    // ── Tooltip ──────────────────────────────────────────────────────────
    const tipEl = document.getElementById('tooltip');
    function showTip(ev, html) {
      tipEl.innerHTML = html;
      tipEl.classList.add('visible');
      moveTip(ev);
    }
    function moveTip(ev) {
      const x = ev.clientX + 14, y = ev.clientY + 14;
      tipEl.style.left = x + 'px';
      tipEl.style.top  = y + 'px';
    }
    function hideTip() { tipEl.classList.remove('visible'); }

    // ── Palette selector ─────────────────────────────────────────────────
    function renderPaletteSelector() {
      const sel = d3.select('#palette-selector');
      sel.selectAll('*').remove();

      Object.entries(PALETTES).forEach(([name, cols]) => {
        const btn = sel.append('button')
          .attr('class', name === active ? 'palette-btn active' : 'palette-btn')
          .attr('data-name', name)
          .on('click', function() {
            active = name;
            document.querySelectorAll('.palette-btn')
              .forEach(b => b.classList.toggle('active', b.dataset.name === name));
            renderAll();
          });

        const dots = btn.append('span').attr('class','pdots');
        cols.slice(0, 6).forEach(c => {
          dots.append('span')
            .attr('class','pdot')
            .style('background', c)
            .style('outline', '1px solid rgba(0,0,0,0.12)');
        });

        btn.append('span').text(name);
      });
    }

    // ── Bar chart ────────────────────────────────────────────────────────
    function renderBarChart() {
      const colors = PALETTES[active];
      const n = Math.min(colors.length, LABELS.length);
      const data = Array.from({length:n}, (_,i) => ({
        label: LABELS[i], value: VALUES[i], color: colors[i],
      }));

      const el = document.getElementById('bar-chart');
      d3.select(el).selectAll('*').remove();

      const W = el.clientWidth || 380;
      const M = {top:12, right:12, bottom:34, left:42};
      const iW = W - M.left - M.right;
      const iH = 240 - M.top - M.bottom;

      const x = d3.scaleBand().domain(data.map(d=>d.label)).range([0,iW]).padding(0.28);
      const y = d3.scaleLinear().domain([0,100]).nice().range([iH,0]);

      const svg = d3.select(el).append('svg').attr('width',W).attr('height',240);
      const g = svg.append('g').attr('transform',`translate(${M.left},${M.top})`);

      // Gridlines
      g.append('g')
        .call(d3.axisLeft(y).ticks(5).tickSize(-iW).tickFormat(''))
        .call(ax => {
          ax.select('.domain').remove();
          ax.selectAll('.tick line')
            .attr('stroke','#eee').attr('stroke-dasharray','4,3');
        });

      // Bars
      const bars = g.selectAll('.bar').data(data).join('rect')
        .attr('class','bar')
        .attr('x', d => x(d.label))
        .attr('width', x.bandwidth())
        .attr('fill', d => d.color)
        .attr('rx', 3)
        .style('cursor','pointer');

      // Animate in
      bars
        .attr('y', iH).attr('height', 0)
        .transition().duration(480).ease(d3.easeCubicOut)
        .attr('y', d => y(d.value))
        .attr('height', d => iH - y(d.value));

      // Hover
      bars
        .on('mousemove', (ev, d) => {
          showTip(ev, `<b>${d.label}</b>: ${d.value}% &nbsp;<span style="color:${d.color}">■</span> ${d.color}`);
        })
        .on('mouseleave', hideTip);

      // Value labels
      g.selectAll('.vlabel').data(data).join('text')
        .attr('class','vlabel')
        .attr('x', d => x(d.label) + x.bandwidth()/2)
        .attr('y', d => y(d.value) - 5)
        .attr('text-anchor','middle')
        .style('font-size','10px').style('fill','#aaa')
        .text(d => d.value + '%');

      // X axis
      g.append('g')
        .attr('transform',`translate(0,${iH})`)
        .call(d3.axisBottom(x))
        .call(ax => {
          ax.select('.domain').remove();
          ax.selectAll('.tick line').remove();
          ax.selectAll('text').style('font-size','10px').style('fill','#888');
        });

      // Y axis
      g.append('g')
        .call(d3.axisLeft(y).ticks(5).tickFormat(d=>d+'%'))
        .call(ax => {
          ax.select('.domain').remove();
          ax.selectAll('.tick line').remove();
          ax.selectAll('text').style('font-size','10px').style('fill','#bbb');
        });
    }

    // ── Contrast matrix ──────────────────────────────────────────────────
    function renderContrastMatrix() {
      const colors = PALETTES[active];
      const n = colors.length;

      const el = document.getElementById('contrast-matrix');
      d3.select(el).selectAll('*').remove();

      const W = el.clientWidth || 380;
      const HS = 18; // header strip size
      const GAP = 2;
      const cellSize = Math.min(46, Math.floor((W - HS - GAP*(n+1)) / n));
      const totalW = HS + GAP + n*(cellSize+GAP);
      const totalH = HS + GAP + n*(cellSize+GAP);

      const svg = d3.select(el).append('svg')
        .attr('width', totalW).attr('height', totalH);

      // Column headers (background colors)
      colors.forEach((col, j) => {
        svg.append('rect')
          .attr('x', HS + GAP + j*(cellSize+GAP))
          .attr('y', 0)
          .attr('width', cellSize).attr('height', HS-GAP)
          .attr('fill', col).attr('rx', 2);
      });

      // Row headers (text/foreground colors)
      colors.forEach((col, i) => {
        svg.append('rect')
          .attr('x', 0)
          .attr('y', HS + GAP + i*(cellSize+GAP))
          .attr('width', HS-GAP).attr('height', cellSize)
          .attr('fill', col).attr('rx', 2);
      });

      // Matrix cells
      colors.forEach((fg, i) => {
        colors.forEach((bg, j) => {
          const ratio = contrastRatio(fg, bg);
          const meta  = wcagMeta(ratio);
          const cx    = HS + GAP + j*(cellSize+GAP);
          const cy    = HS + GAP + i*(cellSize+GAP);
          const isDiag = i === j;

          const cell = svg.append('g')
            .attr('transform', `translate(${cx},${cy})`)
            .style('cursor','pointer')
            .on('mousemove', ev => {
              showTip(ev,
                `<b style="color:${bg}">bg</b> ${bg} · <b style="color:${fg}">text</b> ${fg}<br>` +
                `Ratio <b>${ratio.toFixed(2)}:1</b> — <b style="color:${meta.color}">${meta.label}</b>`
              );
            })
            .on('mouseleave', hideTip);

          // Background fill
          cell.append('rect')
            .attr('width', cellSize).attr('height', cellSize)
            .attr('fill', isDiag ? '#f0eee8' : bg)
            .attr('rx', 2);

          if (!isDiag) {
            // Ratio text in fg color
            if (cellSize >= 32) {
              cell.append('text')
                .attr('x', cellSize/2).attr('y', cellSize/2 + 1)
                .attr('text-anchor','middle').attr('dominant-baseline','middle')
                .style('font-size', cellSize >= 42 ? '9.5px' : '7.5px')
                .style('font-weight','600').style('fill', fg)
                .text(ratio.toFixed(1));
            }

            // WCAG level indicator bar (bottom strip)
            cell.append('rect')
              .attr('x', 0).attr('y', cellSize - 5)
              .attr('width', cellSize).attr('height', 5)
              .attr('fill', meta.color)
              .attr('rx', 0)
              .style('clip-path', `inset(0 0 0 0 round 0 0 2px 2px)`);
          } else {
            // Diagonal marker
            cell.append('text')
              .attr('x', cellSize/2).attr('y', cellSize/2 + 1)
              .attr('text-anchor','middle').attr('dominant-baseline','middle')
              .style('font-size','10px').style('fill','#ccc')
              .text('—');
          }
        });
      });

      // Small axis labels
      svg.append('text')
        .attr('x', HS + GAP + n*(cellSize+GAP)/2)
        .attr('y', totalH - 1)
        .attr('text-anchor','middle')
        .style('font-size','8px').style('fill','#ccc')
        .text('bg →');

      svg.append('text')
        .attr('transform','rotate(-90)')
        .attr('x', -(HS + GAP + n*(cellSize+GAP)/2))
        .attr('y', 8)
        .attr('text-anchor','middle')
        .style('font-size','8px').style('fill','#ccc')
        .text('text →');
    }

    // ── CVD strips ───────────────────────────────────────────────────────
    function renderCVDStrips() {
      const colors = PALETTES[active];
      const el = document.getElementById('cvd-strips');
      el.innerHTML = '';

      const ROWS = [
        { label: 'Original',     sim: null },
        { label: 'Protanopia',   sim: 'protanopia' },
        { label: 'Deuteranopia', sim: 'deuteranopia' },
        { label: 'Tritanopia',   sim: 'tritanopia' },
      ];

      ROWS.forEach(row => {
        const rowEl = document.createElement('div');
        rowEl.className = 'cvd-row';

        const labelEl = document.createElement('div');
        labelEl.className = 'cvd-label';
        labelEl.textContent = row.label;
        rowEl.appendChild(labelEl);

        const swatchWrap = document.createElement('div');
        swatchWrap.className = 'cvd-swatches';

        colors.forEach((orig, idx) => {
          const simHex = row.sim ? simulateCVD(orig, row.sim) : orig;
          const sw = document.createElement('div');
          sw.className = 'swatch';
          sw.style.background = simHex;
          sw.style.color = textOn(simHex);
          sw.textContent = idx + 1;

          sw.addEventListener('mousemove', ev => {
            const tipText = row.sim
              ? `#${idx+1} ${orig}<br>→ ${simHex} (${row.label})`
              : `#${idx+1} ${orig}`;
            showTip(ev, tipText);
            moveTip(ev);
          });
          sw.addEventListener('mouseleave', hideTip);

          swatchWrap.appendChild(sw);
        });

        rowEl.appendChild(swatchWrap);
        el.appendChild(rowEl);
      });
    }

    // ── Render all ───────────────────────────────────────────────────────
    function renderAll() {
      renderBarChart();
      renderContrastMatrix();
      renderCVDStrips();
    }

    renderPaletteSelector();
    renderAll();

    // Redraw charts on resize (not CVD strips — they're CSS-based)
    window.addEventListener('resize', () => {
      renderBarChart();
      renderContrastMatrix();
    });

    // Move tooltip with cursor
    document.addEventListener('mousemove', ev => {
      if (tipEl.classList.contains('visible')) moveTip(ev);
    });
  </script>
</body>
</html>
