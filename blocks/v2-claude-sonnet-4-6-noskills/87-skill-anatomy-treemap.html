<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Anatomy Treemap</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 16px 24px 10px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #f0f4f8;
  }
  h1 span {
    font-weight: 300;
    color: #718096;
    margin-left: 6px;
    font-size: 14px;
  }
  #chart {
    flex: 1;
    position: relative;
    overflow: hidden;
    padding: 0 16px 16px;
  }
  svg {
    width: 100%;
    height: 100%;
  }
  .cell rect {
    stroke: #0f1117;
    stroke-width: 1.5;
    rx: 3;
    transition: opacity 0.15s;
  }
  .cell:hover rect {
    opacity: 0.85;
    stroke-width: 2;
    stroke: #fff;
  }
  .cell-label {
    pointer-events: none;
    user-select: none;
  }
  .cell-label .skill-name {
    font-size: 11px;
    font-weight: 600;
    fill: rgba(255,255,255,0.92);
    dominant-baseline: hanging;
  }
  .cell-label .skill-lines {
    font-size: 10px;
    font-weight: 400;
    fill: rgba(255,255,255,0.55);
  }
  .group-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    fill: rgba(255,255,255,0.35);
    pointer-events: none;
  }
  #tooltip {
    position: absolute;
    background: rgba(15,17,23,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
    max-width: 220px;
    z-index: 10;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  #tooltip .tt-skill { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  #tooltip .tt-cat { font-size: 11px; margin-bottom: 6px; letter-spacing: 0.04em; }
  #tooltip .tt-row { display: flex; justify-content: space-between; gap: 20px; font-size: 12px; color: #a0aec0; }
  #tooltip .tt-val { color: #e2e8f0; font-weight: 600; }
  #legend {
    padding: 6px 24px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    flex-shrink: 0;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #718096;
    cursor: pointer;
    transition: color 0.15s;
  }
  .legend-item:hover { color: #e2e8f0; }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<header>
  <h1>Skill Anatomy <span>line counts by category · D3 Power Tools</span></h1>
</header>
<div id="legend"></div>
<div id="chart">
  <div id="tooltip"></div>
</div>

<script type="module">

// --- Synthetic data: skill name, category, estimated SKILL.md line count ---
const raw = {
  name: "root",
  children: [
    {
      name: "Seeing patterns",
      children: [
        { name: "parallel-coordinates", lines: 487, sections: 14, examples: 3 },
        { name: "brushing",             lines: 412, sections: 12, examples: 4 },
        { name: "linked-views",         lines: 398, sections: 11, examples: 3 },
        { name: "distributions",        lines: 356, sections: 10, examples: 5 },
      ]
    },
    {
      name: "Seeing structure",
      children: [
        { name: "hierarchy-layouts",    lines: 521, sections: 15, examples: 5 },
        { name: "hierarchy-interaction",lines: 443, sections: 13, examples: 4 },
        { name: "edge-bundling",        lines: 374, sections: 10, examples: 3 },
        { name: "force",               lines: 562, sections: 16, examples: 6 },
        { name: "network",             lines: 389, sections: 11, examples: 4 },
      ]
    },
    {
      name: "Seeing place",
      children: [
        { name: "cartography",         lines: 698, sections: 20, examples: 7 },
      ]
    },
    {
      name: "Seeing change",
      children: [
        { name: "time-series",         lines: 534, sections: 15, examples: 5 },
        { name: "motion",              lines: 367, sections: 10, examples: 4 },
        { name: "shape-morphing",      lines: 298, sections: 9,  examples: 3 },
      ]
    },
    {
      name: "Making it legible",
      children: [
        { name: "scales",              lines: 423, sections: 12, examples: 4 },
        { name: "color",               lines: 576, sections: 17, examples: 5 },
        { name: "visual-texture",      lines: 312, sections: 9,  examples: 3 },
        { name: "annotation",          lines: 389, sections: 11, examples: 4 },
        { name: "data-table",          lines: 267, sections: 8,  examples: 2 },
        { name: "canvas-accessibility",lines: 334, sections: 10, examples: 3 },
      ]
    },
    {
      name: "Making it work",
      children: [
        { name: "canvas",              lines: 478, sections: 14, examples: 4 },
        { name: "webgl",               lines: 612, sections: 17, examples: 4 },
        { name: "navigation",          lines: 445, sections: 13, examples: 4 },
        { name: "responsive",          lines: 356, sections: 10, examples: 3 },
      ]
    },
    {
      name: "Before you render",
      children: [
        { name: "data-gathering",      lines: 445, sections: 13, examples: 4 },
        { name: "sparkcharts",         lines: 289, sections: 8,  examples: 3 },
        { name: "small-multiples",     lines: 367, sections: 11, examples: 3 },
      ]
    },
    {
      name: "Meta · Code guides",
      children: [
        { name: "d3-idioms",           lines: 312, sections: 9,  examples: 5 },
        { name: "jig-template",        lines: 278, sections: 8,  examples: 3 },
      ]
    },
    {
      name: "Meta · Inspection",
      children: [
        { name: "visual-critic",       lines: 334, sections: 10, examples: 4 },
        { name: "encoding-integrity",  lines: 356, sections: 10, examples: 4 },
        { name: "stress-test",         lines: 289, sections: 8,  examples: 3 },
        { name: "cognitive-load",      lines: 267, sections: 8,  examples: 3 },
      ]
    },
    {
      name: "Meta · Workshop",
      children: [
        { name: "calibrate-tool",      lines: 245, sections: 7,  examples: 2 },
        { name: "sharpen-tool",        lines: 234, sections: 7,  examples: 2 },
      ]
    },
  ]
};

// Category colors — one per group
const catColors = {
  "Seeing patterns":    "#4f86c6",
  "Seeing structure":   "#7b68c8",
  "Seeing place":       "#5ba35b",
  "Seeing change":      "#d47f3b",
  "Making it legible":  "#c25b8a",
  "Making it work":     "#3b9fb5",
  "Before you render":  "#8fac3a",
  "Meta · Code guides": "#7d7d7d",
  "Meta · Inspection":  "#a07450",
  "Meta · Workshop":    "#5f8a8a",
};

const totalLines = raw.children.flatMap(c => c.children).reduce((s,d) => s+d.lines, 0);

// --- Legend ---
const legend = document.getElementById("legend");
Object.entries(catColors).forEach(([cat, color]) => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-swatch" style="background:${color}"></div>${cat}`;
  legend.appendChild(item);
});

// --- Chart ---
const container = document.getElementById("chart");
const tooltip   = document.getElementById("tooltip");

const svg = d3.select("#chart").append("svg");

function render() {
  svg.selectAll("*").remove();

  const W = container.clientWidth;
  const H = container.clientHeight;

  svg.attr("viewBox", `0 0 ${W} ${H}`);

  const root = d3.hierarchy(raw)
    .sum(d => d.lines || 0)
    .sort((a, b) => b.value - a.value);

  d3.treemap()
    .size([W, H])
    .paddingOuter(8)
    .paddingTop(22)
    .paddingInner(3)
    .round(true)
    (root);

  // Group backgrounds + labels
  const groups = svg.selectAll(".group")
    .data(root.children)
    .join("g")
    .attr("class", "group");

  groups.append("rect")
    .attr("x", d => d.x0)
    .attr("y", d => d.y0)
    .attr("width",  d => d.x1 - d.x0)
    .attr("height", d => d.y1 - d.y0)
    .attr("fill", d => d3.color(catColors[d.data.name]).darker(1.8))
    .attr("rx", 4);

  groups.append("text")
    .attr("class", "group-label")
    .attr("x", d => d.x0 + 7)
    .attr("y", d => d.y0 + 14)
    .text(d => {
      const w = d.x1 - d.x0;
      return w > 60 ? d.data.name : "";
    });

  // Leaf cells
  const cells = svg.selectAll(".cell")
    .data(root.leaves())
    .join("g")
    .attr("class", "cell")
    .attr("transform", d => `translate(${d.x0},${d.y0})`);

  cells.append("rect")
    .attr("width",  d => Math.max(0, d.x1 - d.x0))
    .attr("height", d => Math.max(0, d.y1 - d.y0))
    .attr("fill", d => catColors[d.parent.data.name])
    .attr("rx", 2);

  // Labels (only if cell is big enough)
  const labelG = cells.append("g")
    .attr("class", "cell-label")
    .attr("transform", "translate(5,5)");

  labelG.each(function(d) {
    const w = d.x1 - d.x0 - 10;
    const h = d.y1 - d.y0 - 10;
    const g = d3.select(this);
    if (w < 30 || h < 14) return;

    // Skill name — possibly truncated
    const name = d.data.name;
    const displayName = w < 80 ? name.split("-").map(p => p[0]).join("") : name;

    g.append("text")
      .attr("class", "skill-name")
      .attr("y", 0)
      .text(displayName)
      .each(function() {
        // Truncate if overflows
        let el = this;
        while (el.getComputedTextLength && el.getComputedTextLength() > w) {
          el.textContent = el.textContent.slice(0, -2) + "…";
        }
      });

    if (h > 28) {
      g.append("text")
        .attr("class", "skill-lines")
        .attr("y", 16)
        .text(`${d.data.lines} lines`);
    }
  });

  // Interactions
  cells
    .on("pointermove", function(event, d) {
      const pct = ((d.data.lines / totalLines) * 100).toFixed(1);
      tooltip.innerHTML = `
        <div class="tt-skill">${d.data.name}</div>
        <div class="tt-cat" style="color:${catColors[d.parent.data.name]}">${d.parent.data.name}</div>
        <div class="tt-row"><span>Lines</span><span class="tt-val">${d.data.lines}</span></div>
        <div class="tt-row"><span>Sections</span><span class="tt-val">${d.data.sections}</span></div>
        <div class="tt-row"><span>Examples</span><span class="tt-val">${d.data.examples}</span></div>
        <div class="tt-row"><span>Share</span><span class="tt-val">${pct}%</span></div>
      `;
      const rect = container.getBoundingClientRect();
      let tx = event.clientX - rect.left + 14;
      let ty = event.clientY - rect.top  + 14;
      if (tx + 230 > W) tx = event.clientX - rect.left - 230;
      if (ty + 130 > H) ty = event.clientY - rect.top  - 130;
      tooltip.style.left   = tx + "px";
      tooltip.style.top    = ty + "px";
      tooltip.style.opacity = 1;
    })
    .on("pointerleave", () => { tooltip.style.opacity = 0; });
}

render();

const ro = new ResizeObserver(() => render());
ro.observe(container);

</script>
</body>
</html>
