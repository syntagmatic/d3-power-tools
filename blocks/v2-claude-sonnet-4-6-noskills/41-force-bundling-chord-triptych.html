<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Force · Edge Bundling · Chord Triptych</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117;
    color: #e2e8f0;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 32px 12px;
    border-bottom: 1px solid #1e2535;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #94a3b8;
    text-transform: uppercase;
  }
  header p {
    font-size: 12px;
    color: #475569;
    margin-top: 3px;
  }
  .panels {
    display: flex;
    flex: 1;
    gap: 0;
    min-height: 0;
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #1e2535;
    min-width: 0;
  }
  .panel:last-child { border-right: none; }
  .panel-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #64748b;
    padding: 10px 16px 6px;
    border-bottom: 1px solid #1a2030;
  }
  .panel svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .panel-body {
    flex: 1;
    min-height: 0;
    position: relative;
  }
  /* Node styles */
  .node circle {
    stroke-width: 1.5;
    cursor: pointer;
    transition: stroke-width 0.15s;
  }
  .node text {
    font-size: 9px;
    fill: #94a3b8;
    pointer-events: none;
    dominant-baseline: middle;
  }
  .link {
    fill: none;
    stroke-opacity: 0.35;
    transition: stroke-opacity 0.15s;
  }
  /* Highlight states */
  .dimmed { opacity: 0.08 !important; }
  .highlighted { stroke-opacity: 0.85 !important; }
  .node.dimmed circle { opacity: 0.08; }
  .node.dimmed text { opacity: 0.08; }
  .node.highlighted circle { stroke-width: 2.5 !important; }
  /* Chord styles */
  .chord-arc path {
    cursor: pointer;
  }
  .chord-ribbon {
    fill-opacity: 0.3;
    stroke: none;
    transition: fill-opacity 0.15s;
  }
  .chord-ribbon.highlighted { fill-opacity: 0.75; }
  .chord-ribbon.dimmed { fill-opacity: 0.03; }
  /* Radial bundling */
  .radial-node circle {
    cursor: pointer;
  }
  .radial-node text {
    font-size: 8.5px;
    fill: #94a3b8;
    pointer-events: none;
  }
  .bundle-link {
    fill: none;
    stroke-opacity: 0.3;
    transition: stroke-opacity 0.15s;
  }
  .bundle-link.highlighted { stroke-opacity: 0.85; }
  .bundle-link.dimmed { stroke-opacity: 0.02; }
  .radial-node.dimmed circle { opacity: 0.08; }
  .radial-node.dimmed text { opacity: 0.08; }
  .radial-node.highlighted circle { stroke-width: 2.5 !important; }
  /* Tooltip */
  #tooltip {
    position: fixed;
    background: #1e2535;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 7px 11px;
    font-size: 11px;
    color: #cbd5e1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 100;
    max-width: 180px;
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .tip-name { font-weight: 600; color: #f1f5f9; }
  #tooltip .tip-group { color: #64748b; font-size: 10px; margin-top: 2px; }
  #tooltip .tip-links { color: #94a3b8; font-size: 10px; margin-top: 1px; }
</style>
</head>
<body>

<header>
  <h1>Force Layout · Radial Edge Bundling · Chord Diagram</h1>
  <p>40-node network · hover any node to highlight connections across all three views</p>
</header>

<div class="panels">
  <div class="panel" id="panel-force">
    <div class="panel-title">Force Layout</div>
    <div class="panel-body" id="body-force"></div>
  </div>
  <div class="panel" id="panel-radial">
    <div class="panel-title">Radial Edge Bundling</div>
    <div class="panel-body" id="body-radial"></div>
  </div>
  <div class="panel" id="panel-chord">
    <div class="panel-title">Chord Diagram</div>
    <div class="panel-body" id="body-chord"></div>
  </div>
</div>

<div id="tooltip"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ── DATA GENERATION ──────────────────────────────────────────────────────────

const GROUPS = [
  { id: 0, name: "Alpha",   color: "#6366f1" },
  { id: 1, name: "Beta",    color: "#22d3ee" },
  { id: 2, name: "Gamma",   color: "#f59e0b" },
  { id: 3, name: "Delta",   color: "#ec4899" },
  { id: 4, name: "Epsilon", color: "#10b981" },
];

const NODE_NAMES = [
  "Alder","Birch","Cedar","Dogwood","Elm",
  "Fern","Ginkgo","Holly","Iris","Juniper",
  "Kale","Larch","Maple","Nettle","Oak",
  "Pine","Quince","Rowan","Sage","Thorn",
  "Umber","Violet","Willow","Xeric","Yarrow",
  "Zinnia","Aspen","Beech","Clover","Daisy",
  "Edelweiss","Flax","Gorse","Heather","Ivy",
  "Jasmine","Kudzu","Lichen","Myrtle","Neem"
];

const nodes = NODE_NAMES.map((name, i) => ({
  id: i,
  name,
  group: Math.floor(i / 8),  // 5 groups: 0-7, 8-15, 16-23, 24-31, 32-39
}));
// fix last group: nodes 32-39 → group 4
nodes.forEach(n => { n.group = Math.min(4, Math.floor(n.id / 8)); });

// Generate links: dense within groups, sparse between
const links = [];
const rng = (() => {
  let s = 42;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
})();

for (let i = 0; i < nodes.length; i++) {
  for (let j = i + 1; j < nodes.length; j++) {
    const sameGroup = nodes[i].group === nodes[j].group;
    const prob = sameGroup ? 0.55 : 0.07;
    if (rng() < prob) {
      links.push({ source: i, target: j, value: 1 + Math.floor(rng() * 3) });
    }
  }
}

// ── DISPATCH ─────────────────────────────────────────────────────────────────
const dispatch = d3.dispatch("nodeenter", "nodeleave");

// ── TOOLTIP ──────────────────────────────────────────────────────────────────
const tooltip = document.getElementById("tooltip");

function showTooltip(event, node) {
  const connCount = links.filter(l =>
    (typeof l.source === 'object' ? l.source.id : l.source) === node.id ||
    (typeof l.target === 'object' ? l.target.id : l.target) === node.id
  ).length;
  tooltip.innerHTML = `
    <div class="tip-name">${node.name}</div>
    <div class="tip-group">${GROUPS[node.group].name} cluster</div>
    <div class="tip-links">${connCount} connections</div>
  `;
  tooltip.classList.add("visible");
}
function moveTooltip(event) {
  tooltip.style.left = (event.clientX + 14) + "px";
  tooltip.style.top  = (event.clientY - 28) + "px";
}
function hideTooltip() {
  tooltip.classList.remove("visible");
}

// ── PANEL 1: FORCE LAYOUT ────────────────────────────────────────────────────
function buildForce(container) {
  const el = container;
  const W = el.clientWidth, H = el.clientHeight;

  const svg = d3.select(el).append("svg")
    .attr("width", W).attr("height", H);

  const g = svg.append("g");

  // zoom
  svg.call(d3.zoom()
    .scaleExtent([0.3, 4])
    .on("zoom", e => g.attr("transform", e.transform)));

  const linkData = links.map(l => ({ ...l }));
  const nodeData = nodes.map(n => ({ ...n }));

  const simulation = d3.forceSimulation(nodeData)
    .force("link", d3.forceLink(linkData).id(d => d.id).distance(55).strength(0.5))
    .force("charge", d3.forceManyBody().strength(-180))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collision", d3.forceCollide(14))
    .force("cluster", () => {
      // mild cluster attraction
      for (const n of nodeData) {
        const peers = nodeData.filter(m => m.group === n.group && m !== n);
        if (!peers.length) continue;
        const cx = d3.mean(peers, d => d.x);
        const cy = d3.mean(peers, d => d.y);
        n.vx = (n.vx || 0) + (cx - n.x) * 0.006;
        n.vy = (n.vy || 0) + (cy - n.y) * 0.006;
      }
    });

  const linkSel = g.append("g").selectAll("line")
    .data(linkData).join("line")
    .attr("class", "link")
    .attr("stroke", d => {
      const sg = nodeData.find(n => n.id === (typeof d.source === 'object' ? d.source.id : d.source))?.group ?? 0;
      const tg = nodeData.find(n => n.id === (typeof d.target === 'object' ? d.target.id : d.target))?.group ?? 0;
      return sg === tg ? GROUPS[sg].color : "#475569";
    })
    .attr("stroke-width", d => 0.5 + d.value * 0.4);

  const nodeSel = g.append("g").selectAll("g.node")
    .data(nodeData).join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end",   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }))
    .on("mouseenter", (event, d) => { dispatch.call("nodeenter", null, d); showTooltip(event, d); })
    .on("mousemove", moveTooltip)
    .on("mouseleave", (event, d) => { dispatch.call("nodeleave", null, d); hideTooltip(); });

  nodeSel.append("circle")
    .attr("r", 7)
    .attr("fill", d => d3.color(GROUPS[d.group].color).darker(0.6) + "")
    .attr("stroke", d => GROUPS[d.group].color);

  nodeSel.append("text")
    .attr("x", 10).attr("y", 0)
    .text(d => d.name.slice(0, 4));

  simulation.on("tick", () => {
    linkSel
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  // highlight handler
  dispatch.on("nodeenter.force", hNode => {
    const hId = hNode.id;
    const connected = new Set([hId]);
    linkData.forEach(l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      if (s === hId) connected.add(t);
      if (t === hId) connected.add(s);
    });

    nodeSel.classed("dimmed", d => !connected.has(d.id))
           .classed("highlighted", d => d.id === hId);
    linkSel.classed("dimmed", d => {
      const s = typeof d.source === 'object' ? d.source.id : d.source;
      const t = typeof d.target === 'object' ? d.target.id : d.target;
      return !(s === hId || t === hId);
    }).classed("highlighted", d => {
      const s = typeof d.source === 'object' ? d.source.id : d.source;
      const t = typeof d.target === 'object' ? d.target.id : d.target;
      return s === hId || t === hId;
    });
  });

  dispatch.on("nodeleave.force", () => {
    nodeSel.classed("dimmed", false).classed("highlighted", false);
    linkSel.classed("dimmed", false).classed("highlighted", false);
  });
}

// ── PANEL 2: RADIAL EDGE BUNDLING ───────────────────────────────────────────
function buildRadial(container) {
  const W = container.clientWidth, H = container.clientHeight;
  const R = Math.min(W, H) / 2 - 60;

  const svg = d3.select(container).append("svg")
    .attr("width", W).attr("height", H);

  const g = svg.append("g").attr("transform", `translate(${W/2},${H/2})`);

  // Sort nodes by group for clean visual grouping
  const sorted = [...nodes].sort((a, b) => a.group - b.group || a.id - b.id);
  const angleScale = d3.scalePoint()
    .domain(sorted.map(d => d.id))
    .range([0, 2 * Math.PI - (2 * Math.PI / sorted.length)])
    .padding(0.1);

  function polarToXY(id, r) {
    const a = angleScale(id) - Math.PI / 2;
    return [Math.cos(a) * r, Math.sin(a) * r];
  }

  // Build hierarchy for bundling: root → groups → nodes
  const hier = {
    id: "root",
    children: GROUPS.map(g => ({
      id: `group-${g.id}`,
      group: g.id,
      children: sorted.filter(n => n.group === g.id).map(n => ({
        id: `node-${n.id}`,
        nodeId: n.id,
        group: n.group,
        name: n.name,
        angle: angleScale(n.id)
      }))
    }))
  };

  const root = d3.hierarchy(hier);
  const leaves = root.leaves();

  // Assign positions to leaf nodes for line()
  leaves.forEach(leaf => {
    const [x, y] = polarToXY(leaf.data.nodeId, R);
    leaf.x = x;
    leaf.y = y;
  });
  // Assign inner node positions (cluster center)
  root.each(n => {
    if (n.children && n.data.id !== "root") {
      const childLeaves = n.leaves();
      n.x = d3.mean(childLeaves, d => d.x) * 0.4;
      n.y = d3.mean(childLeaves, d => d.y) * 0.4;
    }
  });
  root.x = 0; root.y = 0;

  // Map nodeId → hierarchy leaf
  const leafByNodeId = new Map(leaves.map(l => [l.data.nodeId, l]));

  // Build line generator for bundled paths
  // We implement simple hierarchical bundling: path goes source → LCA → target
  function bundledPath(sId, tId) {
    const src = leafByNodeId.get(sId);
    const tgt = leafByNodeId.get(tId);
    if (!src || !tgt) return "";

    const sGroup = nodes.find(n => n.id === sId).group;
    const tGroup = nodes.find(n => n.id === tId).group;

    const [sx, sy] = polarToXY(sId, R);
    const [tx, ty] = polarToXY(tId, R);

    if (sGroup === tGroup) {
      // same group: curve through group center
      const gLeaves = sorted.filter(n => n.group === sGroup);
      const angles = gLeaves.map(n => angleScale(n.id));
      const meanAngle = d3.mean(angles) - Math.PI / 2;
      const cx = Math.cos(meanAngle) * R * 0.35;
      const cy = Math.sin(meanAngle) * R * 0.35;
      return `M${sx},${sy}Q${cx},${cy} ${tx},${ty}`;
    } else {
      // cross-group: route through center
      return `M${sx},${sy}C${sx*0.4},${sy*0.4} ${tx*0.4},${ty*0.4} ${tx},${ty}`;
    }
  }

  // Draw links
  const linkSel = g.append("g").selectAll("path.bundle-link")
    .data(links)
    .join("path")
    .attr("class", "bundle-link")
    .attr("d", d => bundledPath(d.source, d.target))
    .attr("stroke", d => {
      const sg = nodes[d.source]?.group ?? 0;
      const tg = nodes[d.target]?.group ?? 0;
      return sg === tg ? GROUPS[sg].color : "#475569";
    })
    .attr("stroke-width", d => 0.6 + d.value * 0.35);

  // Draw nodes
  const nodeSel = g.append("g").selectAll("g.radial-node")
    .data(sorted)
    .join("g")
    .attr("class", "radial-node")
    .attr("transform", d => {
      const [x, y] = polarToXY(d.id, R);
      return `translate(${x},${y})`;
    })
    .on("mouseenter", (event, d) => { dispatch.call("nodeenter", null, d); showTooltip(event, d); })
    .on("mousemove", moveTooltip)
    .on("mouseleave", (event, d) => { dispatch.call("nodeleave", null, d); hideTooltip(); });

  nodeSel.append("circle")
    .attr("r", 5.5)
    .attr("fill", d => d3.color(GROUPS[d.group].color).darker(0.6) + "")
    .attr("stroke", d => GROUPS[d.group].color)
    .attr("stroke-width", 1.5);

  nodeSel.append("text")
    .attr("text-anchor", d => {
      const a = angleScale(d.id);
      return (a > Math.PI/2 && a < 3*Math.PI/2) ? "end" : "start";
    })
    .attr("x", d => {
      const a = angleScale(d.id);
      return (a > Math.PI/2 && a < 3*Math.PI/2) ? -9 : 9;
    })
    .attr("y", 0)
    .attr("transform", d => {
      const a = (angleScale(d.id) - Math.PI / 2) * 180 / Math.PI;
      const flip = (angleScale(d.id) > Math.PI/2 && angleScale(d.id) < 3*Math.PI/2);
      return `rotate(${flip ? a + 180 : a})`;
    })
    .text(d => d.name.slice(0, 5));

  // group arcs
  GROUPS.forEach(grp => {
    const grpNodes = sorted.filter(n => n.group === grp.id);
    if (!grpNodes.length) return;
    const angles = grpNodes.map(n => angleScale(n.id) - Math.PI/2);
    const minA = d3.min(angles) - 0.08;
    const maxA = d3.max(angles) + 0.08;
    const arc = d3.arc()
      .innerRadius(R + 12).outerRadius(R + 16)
      .startAngle(minA + Math.PI/2).endAngle(maxA + Math.PI/2);
    g.append("path").attr("d", arc()).attr("fill", grp.color).attr("opacity", 0.6);
    // label
    const midA = (minA + maxA) / 2;
    g.append("text")
      .attr("transform", `translate(${Math.cos(midA) * (R + 26)}, ${Math.sin(midA) * (R + 26)}) rotate(${midA * 180/Math.PI + 90})`)
      .attr("text-anchor", "middle").attr("dominant-baseline", "middle")
      .attr("font-size", 8).attr("fill", grp.color).attr("opacity", 0.8)
      .text(grp.name);
  });

  // highlight
  dispatch.on("nodeenter.radial", hNode => {
    const hId = hNode.id;
    const connected = new Set([hId]);
    links.forEach(l => {
      if (l.source === hId) connected.add(l.target);
      if (l.target === hId) connected.add(l.source);
    });

    nodeSel.classed("dimmed", d => !connected.has(d.id))
           .classed("highlighted", d => d.id === hId);

    linkSel.classed("dimmed", d => !(d.source === hId || d.target === hId))
           .classed("highlighted", d => d.source === hId || d.target === hId);
  });

  dispatch.on("nodeleave.radial", () => {
    nodeSel.classed("dimmed", false).classed("highlighted", false);
    linkSel.classed("dimmed", false).classed("highlighted", false);
  });
}

// ── PANEL 3: CHORD DIAGRAM ──────────────────────────────────────────────────
function buildChord(container) {
  const W = container.clientWidth, H = container.clientHeight;
  const R = Math.min(W, H) / 2 - 50;

  const svg = d3.select(container).append("svg")
    .attr("width", W).attr("height", H);

  const g = svg.append("g").attr("transform", `translate(${W/2},${H/2})`);

  const N_GROUPS = GROUPS.length;

  // Build flow matrix: N_GROUPS × N_GROUPS
  const matrix = Array.from({length: N_GROUPS}, () => new Array(N_GROUPS).fill(0));
  links.forEach(l => {
    const sg = nodes[l.source]?.group ?? 0;
    const tg = nodes[l.target]?.group ?? 0;
    matrix[sg][tg] += l.value;
    if (sg !== tg) matrix[tg][sg] += l.value;
  });

  // For node-level highlight we need per-node-pair data
  // Build a per-link chord that knows source/target node ids
  // We use group-level chord for visual, augment ribbons with node info

  const chord = d3.chord()
    .padAngle(0.04)
    .sortSubgroups(d3.descending)(matrix);

  const arc = d3.arc().innerRadius(R - 20).outerRadius(R);
  const ribbon = d3.ribbon().radius(R - 22);

  // Groups (arcs)
  const groupSel = g.append("g").selectAll("g.chord-arc")
    .data(chord.groups)
    .join("g")
    .attr("class", "chord-arc");

  groupSel.append("path")
    .attr("d", arc)
    .attr("fill", d => GROUPS[d.index].color)
    .attr("stroke", d => d3.color(GROUPS[d.index].color).darker(0.5))
    .attr("stroke-width", 0.5)
    .attr("opacity", 0.85);

  // Labels on arcs
  groupSel.append("text")
    .attr("transform", d => {
      const midAngle = (d.startAngle + d.endAngle) / 2 - Math.PI / 2;
      const r = R + 14;
      return `translate(${Math.cos(midAngle)*r}, ${Math.sin(midAngle)*r})`;
    })
    .attr("text-anchor", "middle")
    .attr("dominant-baseline", "middle")
    .attr("font-size", 9)
    .attr("fill", d => GROUPS[d.index].color)
    .text(d => GROUPS[d.index].name);

  // Ribbons
  const ribbonSel = g.append("g").selectAll("path.chord-ribbon")
    .data(chord)
    .join("path")
    .attr("class", "chord-ribbon")
    .attr("d", ribbon)
    .attr("fill", d => {
      const si = d.source.index, ti = d.target.index;
      return si === ti ? GROUPS[si].color : d3.interpolateRgb(GROUPS[si].color, GROUPS[ti].color)(0.5);
    });

  // Arc hover → highlight matching ribbons
  groupSel
    .on("mouseenter", (event, d) => {
      const gIdx = d.index;
      // find all nodes in this group and trigger highlight for the group
      ribbonSel
        .classed("dimmed", r => r.source.index !== gIdx && r.target.index !== gIdx)
        .classed("highlighted", r => r.source.index === gIdx || r.target.index === gIdx);
      groupSel.selectAll("path")
        .attr("opacity", (_, i, nodes) => {
          const nd = d3.select(nodes[i].parentNode).datum();
          return nd.index === gIdx || ribbonSel.data().some(r => (r.source.index === gIdx || r.target.index === gIdx) && (r.source.index === nd.index || r.target.index === nd.index)) ? 0.9 : 0.2;
        });
    })
    .on("mouseleave", () => {
      ribbonSel.classed("dimmed", false).classed("highlighted", false);
      groupSel.selectAll("path").attr("opacity", 0.85);
    });

  // Cross-panel dispatch: map node highlight to group highlight in chord
  dispatch.on("nodeenter.chord", hNode => {
    const hGroup = hNode.group;
    // Which groups are connected to this node?
    const connectedGroups = new Set([hGroup]);
    links.forEach(l => {
      if (l.source === hNode.id) connectedGroups.add(nodes[l.target]?.group);
      if (l.target === hNode.id) connectedGroups.add(nodes[l.source]?.group);
    });

    ribbonSel
      .classed("dimmed", r => !connectedGroups.has(r.source.index) || !connectedGroups.has(r.target.index))
      .classed("highlighted", r => connectedGroups.has(r.source.index) && connectedGroups.has(r.target.index));

    groupSel.selectAll("path")
      .attr("opacity", (d_inner, i, nodeArr) => {
        const pd = d3.select(nodeArr[i].parentNode).datum();
        return connectedGroups.has(pd.index) ? 0.9 : 0.2;
      });
  });

  dispatch.on("nodeleave.chord", () => {
    ribbonSel.classed("dimmed", false).classed("highlighted", false);
    groupSel.selectAll("path").attr("opacity", 0.85);
  });
}

// ── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  const bodyForce  = document.getElementById("body-force");
  const bodyRadial = document.getElementById("body-radial");
  const bodyChord  = document.getElementById("body-chord");

  // Give panels height
  const panelH = window.innerHeight - 80;
  [bodyForce, bodyRadial, bodyChord].forEach(el => {
    el.style.height = panelH + "px";
  });

  buildForce(bodyForce);
  buildRadial(bodyRadial);
  buildChord(bodyChord);
});
</script>
</body>
