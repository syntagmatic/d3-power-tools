<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Similarity Explorer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://d3js.org/topojson.v3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    padding: 18px 0 4px;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: .04em;
    color: #fff;
  }
  .subtitle {
    text-align: center;
    font-size: .78rem;
    color: #888;
    margin-bottom: 14px;
  }
  #parallel {
    width: 100%;
    overflow: visible;
  }
  .axis-label {
    fill: #aaa;
    font-size: 11px;
    text-anchor: middle;
    cursor: default;
    user-select: none;
  }
  .axis-label tspan.unit {
    fill: #666;
    font-size: 9px;
  }
  .domain { stroke: #444; }
  .tick line { stroke: #333; }
  .tick text { fill: #888; font-size: 9px; }
  .city-line {
    fill: none;
    stroke-width: 1.4;
    stroke-opacity: 0.55;
    transition: stroke-opacity 0.1s;
  }
  .city-line.faded {
    stroke-opacity: 0.06;
  }
  .city-line.highlighted {
    stroke-opacity: 0.95;
    stroke-width: 2.2;
  }
  .brush-rect {
    fill: rgba(100, 160, 255, 0.15);
    stroke: rgba(100, 160, 255, 0.7);
    stroke-width: 1;
  }
  #map-section {
    margin: 0 auto;
    max-width: 900px;
    padding: 0 16px 24px;
  }
  #map-title {
    font-size: .82rem;
    color: #888;
    margin-bottom: 8px;
    text-align: center;
  }
  #map-svg {
    width: 100%;
    background: #12161e;
    border-radius: 8px;
    border: 1px solid #222;
  }
  .country {
    fill: #1e2530;
    stroke: #2a3040;
    stroke-width: 0.5;
  }
  .graticule {
    fill: none;
    stroke: #1a2030;
    stroke-width: 0.4;
  }
  .city-dot {
    cursor: pointer;
    transition: r 0.15s;
  }
  .city-dot.inactive {
    fill: #334;
    stroke: #445;
  }
  .city-dot.active {
    stroke-width: 1.5;
  }
  .city-label-map {
    font-size: 9.5px;
    fill: #ccc;
    pointer-events: none;
    text-shadow: 0 0 4px #0f1117, 0 0 4px #0f1117;
  }
  .city-label-map.inactive {
    fill: #445;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    font-size: .75rem;
    color: #888;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend-swatch {
    width: 24px;
    height: 3px;
    border-radius: 2px;
  }
  #selected-count {
    text-align: center;
    font-size: .78rem;
    color: #7090cc;
    margin: 6px 0 10px;
    min-height: 1.1em;
  }
  .tooltip {
    position: fixed;
    background: #1e2433;
    border: 1px solid #334;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 100;
    max-width: 220px;
  }
  .tooltip strong { color: #fff; font-size: 13px; display: block; margin-bottom: 4px; }
  .tooltip .row { display: flex; justify-content: space-between; gap: 16px; color: #aaa; }
  .tooltip .val { color: #cde; }
</style>
</head>
<body>
<h1>City Similarity Explorer</h1>
<p class="subtitle">Brush axes to filter cities &mdash; matching cities highlight on the map</p>

<div id="parallel-container"></div>
<div id="selected-count"></div>

<div id="map-section">
  <div id="map-title">Geographic distribution of selected cities</div>
  <svg id="map-svg"></svg>
</div>

<div class="tooltip" id="tooltip"></div>

<script type="module">
const cities = [
  { name:"Tokyo",       country:"Japan",          lat:35.68, lon:139.69, pop:13960, density:6363, elev:40,   temp:15.4, rain:1528, cost:82 },
  { name:"Delhi",       country:"India",          lat:28.61, lon:77.21,  pop:32226, density:11320,elev:216,  temp:25.0, rain:797,  cost:28 },
  { name:"Shanghai",    country:"China",          lat:31.23, lon:121.47, pop:24281, density:3854, elev:4,    temp:17.1, rain:1166, cost:55 },
  { name:"São Paulo",   country:"Brazil",         lat:-23.55,lon:-46.63, pop:12325, density:7216, elev:760,  temp:19.8, rain:1454, cost:42 },
  { name:"Mexico City", country:"Mexico",         lat:19.43, lon:-99.13, pop:9209,  density:6000, elev:2240, temp:16.0, rain:786,  cost:38 },
  { name:"Cairo",       country:"Egypt",          lat:30.06, lon:31.25,  pop:21750, density:19376,elev:23,   temp:22.0, rain:25,   cost:27 },
  { name:"Mumbai",      country:"India",          lat:19.08, lon:72.88,  pop:20667, density:20694,elev:14,   temp:27.2, rain:2167, cost:34 },
  { name:"Beijing",     country:"China",          lat:39.91, lon:116.39, pop:21542, density:1323, elev:43,   temp:13.0, rain:612,  cost:56 },
  { name:"Dhaka",       country:"Bangladesh",     lat:23.72, lon:90.41,  pop:22478, density:44000,elev:8,    temp:25.9, rain:2123, cost:20 },
  { name:"Osaka",       country:"Japan",          lat:34.69, lon:135.50, pop:2756,  density:12000,elev:20,   temp:16.9, rain:1279, cost:75 },
  { name:"New York",    country:"USA",            lat:40.71, lon:-74.01, pop:8336,  density:10723,elev:10,   temp:12.9, rain:1174, cost:100 },
  { name:"Karachi",     country:"Pakistan",       lat:24.86, lon:67.01,  pop:14910, density:24000,elev:8,    temp:26.0, rain:196,  cost:22 },
  { name:"Buenos Aires",country:"Argentina",      lat:-34.60,lon:-58.38, pop:3054,  density:14827,elev:25,   temp:17.8, rain:1173, cost:45 },
  { name:"Chongqing",   country:"China",          lat:29.56, lon:106.55, pop:32000, density:390,  elev:243,  temp:18.3, rain:1082, cost:35 },
  { name:"Istanbul",    country:"Turkey",         lat:41.01, lon:28.95,  pop:15636, density:2960, elev:100,  temp:14.3, rain:844,  cost:37 },
  { name:"Kinshasa",    country:"DR Congo",       lat:-4.32, lon:15.32,  pop:17071, density:23235,elev:309,  temp:25.2, rain:1388, cost:32 },
  { name:"Lagos",       country:"Nigeria",        lat:6.52,  lon:3.38,   pop:15946, density:20000,elev:41,   temp:27.0, rain:1645, cost:30 },
  { name:"Manila",      country:"Philippines",    lat:14.60, lon:120.98, pop:1846,  density:71263,elev:16,   temp:27.9, rain:1876, cost:29 },
  { name:"Tianjin",     country:"China",          lat:39.13, lon:117.20, pop:13589, density:1276, elev:5,    temp:13.6, rain:536,  cost:42 },
  { name:"Guangzhou",   country:"China",          lat:23.13, lon:113.26, pop:18676, density:1730, elev:11,   temp:22.8, rain:1720, cost:48 },
  { name:"London",      country:"UK",             lat:51.51, lon:-0.13,  pop:9648,  density:5701, elev:11,   temp:11.3, rain:601,  cost:95 },
  { name:"Moscow",      country:"Russia",         lat:55.75, lon:37.62,  pop:12650, density:4925, elev:156,  temp:5.8,  rain:707,  cost:62 },
  { name:"Paris",       country:"France",         lat:48.86, lon:2.35,   pop:2148,  density:20755,elev:35,   temp:12.3, rain:637,  cost:92 },
  { name:"Jakarta",     country:"Indonesia",      lat:-6.21, lon:106.85, pop:10560, density:15900,elev:8,    temp:28.0, rain:1749, cost:31 },
  { name:"Seoul",       country:"South Korea",    lat:37.57, lon:126.98, pop:9776,  density:16194,elev:86,   temp:12.5, rain:1450, cost:71 },
  { name:"Sydney",      country:"Australia",      lat:-33.87,lon:151.21, pop:5312,  density:430,  elev:39,   temp:17.7, rain:1217, cost:89 },
  { name:"Los Angeles", country:"USA",            lat:34.05, lon:-118.24,pop:3979,  density:3276, elev:93,   temp:18.5, rain:381,  cost:93 },
  { name:"Chicago",     country:"USA",            lat:41.85, lon:-87.65, pop:2696,  density:4447, elev:182,  temp:10.3, rain:991,  cost:84 },
  { name:"Bogotá",      country:"Colombia",       lat:4.71,  lon:-74.07, pop:8181,  density:4307, elev:2625, temp:13.5, rain:935,  cost:33 },
  { name:"Lima",        country:"Peru",           lat:-12.05,lon:-77.04, pop:10751, density:3154, elev:154,  temp:18.9, rain:9,    cost:31 },
  { name:"Bangkok",     country:"Thailand",       lat:13.75, lon:100.52, pop:10539, density:5258, elev:1,    temp:28.6, rain:1569, cost:36 },
  { name:"Nairobi",     country:"Kenya",          lat:-1.29, lon:36.82,  pop:4922,  density:5100, elev:1795, temp:17.7, rain:958,  cost:35 },
  { name:"Tehran",      country:"Iran",           lat:35.69, lon:51.39,  pop:9259,  density:11900,elev:1191, temp:17.0, rain:228,  cost:29 },
  { name:"Singapore",   country:"Singapore",      lat:1.35,  lon:103.82, pop:5850,  density:8358, elev:15,   temp:27.5, rain:2165, cost:97 },
  { name:"Johannesburg",country:"South Africa",   lat:-26.20,lon:28.04,  pop:5635,  density:2900, elev:1753, temp:15.4, rain:713,  cost:40 },
  { name:"Toronto",     country:"Canada",         lat:43.65, lon:-79.38, pop:2930,  density:4427, elev:76,   temp:9.4,  rain:831,  cost:83 },
  { name:"Berlin",      country:"Germany",        lat:52.52, lon:13.40,  pop:3769,  density:4206, elev:34,   temp:9.9,  rain:591,  cost:74 },
  { name:"Ho Chi Minh", country:"Vietnam",        lat:10.82, lon:106.63, pop:9321,  density:4292, elev:19,   temp:27.5, rain:1949, cost:24 },
  { name:"Riyadh",      country:"Saudi Arabia",   lat:24.69, lon:46.72,  pop:7676,  density:1586, elev:613,  temp:25.0, rain:101,  cost:52 },
  { name:"Cape Town",   country:"South Africa",   lat:-33.93,lon:18.42,  pop:4618,  density:1530, elev:41,   temp:17.1, rain:515,  cost:44 }
];

const axes = [
  { key:"pop",     label:"Population",  unit:"K",    fmt: d => d3.format(".1f")(d/1000)+"M" },
  { key:"density", label:"Density",     unit:"p/km²",fmt: d => d3.format(",")(d) },
  { key:"elev",    label:"Elevation",   unit:"m",    fmt: d => d3.format(",")(d)+"m" },
  { key:"temp",    label:"Avg Temp",    unit:"°C",   fmt: d => d.toFixed(1)+"°C" },
  { key:"rain",    label:"Rainfall",    unit:"mm/yr",fmt: d => d3.format(",")(d)+"mm" },
  { key:"cost",    label:"Cost Index",  unit:"NYC=100",fmt: d => d.toFixed(0) }
];

// Color: region-based hue
const regionColor = {
  "Japan":"#f9a825","China":"#ef5350","India":"#66bb6a","USA":"#42a5f5",
  "Brazil":"#ab47bc","Mexico":"#ff7043","Egypt":"#ffa726","Bangladesh":"#26c6da",
  "Pakistan":"#8d6e63","Argentina":"#80cbc4","Turkey":"#7e57c2","DR Congo":"#d4e157",
  "Nigeria":"#ff8f00","Philippines":"#26a69a","UK":"#90caf9","Russia":"#b0bec5",
  "France":"#f48fb1","Indonesia":"#a5d6a7","South Korea":"#ffcc02","Australia":"#ffb74d",
  "Colombia":"#80deea","Peru":"#bcaaa4","Thailand":"#aed581","Kenya":"#ff8a65",
  "Iran":"#ce93d8","Singapore":"#80cbc4","South Africa":"#ef9a9a","Canada":"#b3e5fc",
  "Germany":"#ffe082","Vietnam":"#c5e1a5","Saudi Arabia":"#fff176"
};

const color = d => regionColor[d.country] || "#90a4ae";

// ─── Parallel Coordinates ──────────────────────────────────────────────
const margin = { top: 48, right: 30, bottom: 20, left: 30 };
const container = document.getElementById("parallel-container");
const W = Math.min(window.innerWidth, 960);
const H = 280;
const width = W - margin.left - margin.right;
const height = H - margin.top - margin.bottom;

const svg = d3.select("#parallel-container")
  .append("svg")
  .attr("id","parallel")
  .attr("viewBox", `0 0 ${W} ${H}`)
  .attr("width","100%");

const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// Scales per axis
const yScales = {};
axes.forEach(ax => {
  const vals = cities.map(d => d[ax.key]);
  yScales[ax.key] = d3.scaleLinear()
    .domain([d3.min(vals), d3.max(vals)]).nice()
    .range([height, 0]);
});

const xScale = d3.scalePoint()
  .domain(axes.map(a => a.key))
  .range([0, width])
  .padding(0.1);

// Line generator
const lineGen = d => d3.line()(
  axes.map(ax => [xScale(ax.key), yScales[ax.key](d[ax.key])])
);

// Lines
const lines = g.append("g").attr("class","lines")
  .selectAll("path")
  .data(cities)
  .join("path")
  .attr("class","city-line")
  .attr("d", lineGen)
  .attr("stroke", color);

// Axes
const axisGroups = g.selectAll(".ax-group")
  .data(axes)
  .join("g")
  .attr("class","ax-group")
  .attr("transform", d => `translate(${xScale(d.key)},0)`);

axisGroups.each(function(ax) {
  const grp = d3.select(this);
  grp.call(d3.axisLeft(yScales[ax.key]).ticks(5).tickSize(3));
  grp.select(".domain").attr("stroke","#444");
  grp.selectAll(".tick line").attr("stroke","#444");
  grp.selectAll(".tick text").attr("fill","#888").attr("font-size","8px");
});

// Axis labels
axisGroups.append("text")
  .attr("class","axis-label")
  .attr("y", -14)
  .attr("text-anchor","middle")
  .attr("fill","#bbb")
  .attr("font-size","11px")
  .text(d => d.label)
  .append("tspan")
  .attr("class","unit")
  .attr("x",0).attr("dy","13px")
  .attr("fill","#666").attr("font-size","8.5px")
  .text(d => d.unit);

// ─── Brushing ──────────────────────────────────────────────────────────
const brushSelections = {};  // key → [lo, hi] in data space

function brushed(event, ax) {
  if (!event.selection) {
    delete brushSelections[ax.key];
  } else {
    const [y0, y1] = event.selection;
    brushSelections[ax.key] = [
      yScales[ax.key].invert(y1),
      yScales[ax.key].invert(y0)
    ];
  }
  updateFilter();
}

const brushWidth = 18;
axisGroups.each(function(ax) {
  const grp = d3.select(this);
  const brush = d3.brushY()
    .extent([[-brushWidth/2, 0], [brushWidth/2, height]])
    .on("brush end", e => brushed(e, ax));

  grp.append("g")
    .attr("class","brush")
    .call(brush);

  // Style brush overlay
  grp.select(".brush .overlay")
    .attr("fill","rgba(255,255,255,0.02)")
    .attr("stroke","none");
  grp.select(".brush .selection")
    .attr("fill","rgba(100,160,255,0.18)")
    .attr("stroke","rgba(100,160,255,0.7)")
    .attr("stroke-width","1");
});

let selectedCities = new Set(cities.map(d => d.name));

function isSelected(d) {
  return Object.entries(brushSelections).every(([key, [lo, hi]]) => {
    const v = d[key];
    return v >= lo && v <= hi;
  });
}

function updateFilter() {
  const active = Object.keys(brushSelections).length > 0;
  selectedCities = new Set(
    active ? cities.filter(isSelected).map(d => d.name) : cities.map(d => d.name)
  );

  lines.classed("faded", d => active && !selectedCities.has(d.name))
       .classed("highlighted", d => active && selectedCities.has(d.name));

  updateMap();
  updateCount();
}

function updateCount() {
  const n = selectedCities.size;
  const total = cities.length;
  const el = document.getElementById("selected-count");
  if (n === total) {
    el.textContent = `Showing all ${total} cities — brush an axis to filter`;
  } else {
    el.textContent = `${n} of ${total} cities selected`;
  }
}

// ─── World Map ─────────────────────────────────────────────────────────
const mapSvg = d3.select("#map-svg");
const mapW = 860, mapH = 420;
mapSvg.attr("viewBox", `0 0 ${mapW} ${mapH}`);

const projection = d3.geoNaturalEarth1()
  .scale(135)
  .translate([mapW/2, mapH/2]);

const path = d3.geoPath().projection(projection);

// Graticule
mapSvg.append("path")
  .datum(d3.geoGraticule()())
  .attr("class","graticule")
  .attr("d", path);

// Load world topoJSON
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
  .then(r => r.json())
  .then(world => {
    mapSvg.insert("path","path.graticule")
      .datum({type:"Sphere"})
      .attr("fill","#141923")
      .attr("d",path);

    mapSvg.append("g")
      .selectAll("path")
      .data(topojson.feature(world, world.objects.countries).features)
      .join("path")
      .attr("class","country")
      .attr("d", path);

    drawCities();
  })
  .catch(() => {
    // Fallback if CDN unavailable: draw plain background
    mapSvg.insert("rect",":first-child")
      .attr("width",mapW).attr("height",mapH).attr("fill","#141923");
    drawCities();
  });

const tooltip = document.getElementById("tooltip");

function drawCities() {
  const cityG = mapSvg.append("g").attr("class","city-layer");

  cityG.selectAll("circle")
    .data(cities)
    .join("circle")
    .attr("class","city-dot active")
    .attr("cx", d => projection([d.lon, d.lat])?.[0])
    .attr("cy", d => projection([d.lon, d.lat])?.[1])
    .attr("r", 5)
    .attr("fill", color)
    .attr("stroke", d => d3.color(color(d))?.brighter(1)?.toString() || "#fff")
    .attr("stroke-width", 1)
    .attr("opacity", 0.85)
    .on("mousemove", (event, d) => {
      tooltip.style.opacity = "1";
      tooltip.style.left = (event.clientX + 14) + "px";
      tooltip.style.top = (event.clientY - 10) + "px";
      tooltip.innerHTML = `
        <strong>${d.name}</strong>
        <div class="row"><span>Country</span><span class="val">${d.country}</span></div>
        <div class="row"><span>Population</span><span class="val">${(d.pop/1000).toFixed(1)}M</span></div>
        <div class="row"><span>Density</span><span class="val">${d3.format(",")(d.density)} p/km²</span></div>
        <div class="row"><span>Elevation</span><span class="val">${d3.format(",")(d.elev)}m</span></div>
        <div class="row"><span>Avg Temp</span><span class="val">${d.temp.toFixed(1)}°C</span></div>
        <div class="row"><span>Rainfall</span><span class="val">${d3.format(",")(d.rain)} mm/yr</span></div>
        <div class="row"><span>Cost Index</span><span class="val">${d.cost}</span></div>
      `;
    })
    .on("mouseleave", () => { tooltip.style.opacity = "0"; });

  cityG.selectAll("text")
    .data(cities)
    .join("text")
    .attr("class","city-label-map")
    .attr("x", d => (projection([d.lon, d.lat])?.[0] || 0) + 7)
    .attr("y", d => (projection([d.lon, d.lat])?.[1] || 0) + 3)
    .text(d => d.name);
}

function updateMap() {
  const active = Object.keys(brushSelections).length > 0;
  mapSvg.selectAll(".city-dot")
    .classed("active", d => !active || selectedCities.has(d.name))
    .classed("inactive", d => active && !selectedCities.has(d.name))
    .attr("r", d => (!active || selectedCities.has(d.name)) ? 5.5 : 3.5)
    .attr("opacity", d => (!active || selectedCities.has(d.name)) ? 0.9 : 0.25)
    .attr("fill", d => (!active || selectedCities.has(d.name)) ? color(d) : "#334");

  mapSvg.selectAll(".city-label-map")
    .classed("inactive", d => active && !selectedCities.has(d.name));
}

// Initial count
updateCount();

// Responsive
window.addEventListener("resize", () => {
  // viewBox handles scaling; nothing else needed
});
</script>
</body>
</html>
