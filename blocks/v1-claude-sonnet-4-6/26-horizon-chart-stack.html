<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Server CPU — Horizon Chart Stack</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f7f8fa;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width: 1200px; width: 100%; position: relative; }
  h1 { font-size: 17px; font-weight: 600; color: #1a1a2e; margin-bottom: 2px; }
  .subtitle { font-size: 12px; color: #666; margin-bottom: 12px; }
  .crosshair-line { stroke: #333; stroke-width: 1; stroke-dasharray: 3,2; pointer-events: none; }
  .tooltip-panel {
    position: absolute;
    pointer-events: none;
    background: rgba(255,255,255,0.97);
    border: 1px solid #c8cad0;
    border-radius: 5px;
    padding: 10px 12px;
    font-size: 11.5px;
    line-height: 1.7;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    display: none;
    z-index: 10;
  }
  .tooltip-panel .tt-time {
    font-family: monospace;
    font-weight: 700;
    font-size: 12px;
    color: #1a1a2e;
    margin-bottom: 4px;
    border-bottom: 1px solid #e8e8e8;
    padding-bottom: 3px;
  }
  .tooltip-panel .tt-row {
    display: flex;
    justify-content: space-between;
    gap: 24px;
  }
  .tooltip-panel .tt-name { color: #555; }
  .tooltip-panel .tt-val {
    font-family: monospace;
    font-weight: 600;
    color: #1a1a2e;
  }
  .server-label {
    font-size: 11px;
    fill: #444;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Server CPU Usage — 24-Hour Horizon View</h1>
  <p class="subtitle">8 servers, 1-minute resolution, 3-band fold — Tol sequential blues</p>
  <svg id="chart"></svg>
  <div class="tooltip-panel" id="tooltip"></div>
</div>
<script>
(() => {
  // --- Configuration ---
  const nServers = 8;
  const nPoints = 1440;
  const bands = 3;
  const rowHeight = 56;
  const margin = { top: 28, right: 16, bottom: 32, left: 100 };
  const fullWidth = 1200;
  const fullHeight = margin.top + nServers * rowHeight + margin.bottom;
  const width = fullWidth - margin.left - margin.right;
  const height = nServers * rowHeight;

  // Tol sequential blues — 3 bands from light to dark
  const bandColors = ["#9BD2E1", "#5AA5CC", "#2166AC"];

  const serverNames = [
    "web-prod-01", "web-prod-02", "web-prod-03", "api-gateway",
    "db-primary", "db-replica-01", "db-replica-02", "cache-01"
  ];
  const baselines = [32, 28, 35, 52, 44, 30, 26, 18];

  // Groups for correlated spikes: web servers, api, db cluster, cache
  const spikeGroups = [
    [0, 1, 2],     // web cluster
    [3],           // api gateway
    [4, 5, 6],    // db cluster
    [7]            // cache
  ];

  // --- Seeded PRNG ---
  const mulberry32 = (a) => () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rng = mulberry32(2024);

  // --- Generate synthetic data ---
  const startTime = new Date("2025-03-15T00:00:00Z");

  // Create correlated spike events
  const spikeEvents = [];
  // Morning traffic ramp (web + api) ~08:00-09:30
  spikeEvents.push({ start: 480, end: 570, groups: [0, 1], intensity: 0.7 });
  // Midday peak (all) ~12:00-13:00
  spikeEvents.push({ start: 720, end: 780, groups: [0, 1, 2, 3], intensity: 0.85 });
  // DB backup spike ~02:00-02:30
  spikeEvents.push({ start: 120, end: 150, groups: [2], intensity: 0.9 });
  // Cache warming ~06:00-06:15
  spikeEvents.push({ start: 360, end: 375, groups: [3], intensity: 0.6 });
  // Afternoon sustained (web + api + db) ~14:00-16:00
  spikeEvents.push({ start: 840, end: 960, groups: [0, 1, 2], intensity: 0.65 });
  // Evening batch job (db) ~22:00-23:00
  spikeEvents.push({ start: 1320, end: 1380, groups: [2], intensity: 0.75 });
  // Deploy spike (all) ~17:30-17:45
  spikeEvents.push({ start: 1050, end: 1065, groups: [0, 1, 2, 3], intensity: 0.95 });

  const series = serverNames.map((name, si) => {
    const base = baselines[si];
    const values = new Array(nPoints);

    for (let i = 0; i < nPoints; i++) {
      // Diurnal pattern: higher during business hours
      const hour = i / 60;
      const diurnal = 0.5 + 0.5 * Math.sin((hour - 6) * Math.PI / 12);
      let val = base + diurnal * 15;

      // Add correlated spikes
      for (const ev of spikeEvents) {
        const myGroup = spikeGroups.findIndex(g => g.includes(si));
        if (ev.groups.includes(myGroup) && i >= ev.start && i <= ev.end) {
          const progress = (i - ev.start) / (ev.end - ev.start);
          // Bell-shaped spike
          const spike = Math.exp(-Math.pow((progress - 0.5) * 4, 2));
          val += spike * ev.intensity * (100 - base) * (0.8 + 0.4 * rng());
        }
      }

      // Brownian noise
      val += (rng() - 0.5) * 8;
      values[i] = {
        date: new Date(+startTime + i * 60000),
        value: Math.max(0, Math.min(100, val))
      };
    }
    return { name, values };
  });

  // --- D3 Setup ---
  const svg = d3.select("#chart")
    .attr("viewBox", `0 0 ${fullWidth} ${fullHeight}`)
    .attr("width", fullWidth)
    .attr("height", fullHeight);

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleUtc()
    .domain(d3.extent(series[0].values, d => d.date))
    .range([0, width]);

  // --- Draw horizon rows ---
  const maxVal = 100; // CPU percentage
  const step = maxVal / bands;

  const area = d3.area()
    .x(d => x(d.date))
    .y0(rowHeight)
    .y1(d => {
      const y = d3.scaleLinear([0, step], [rowHeight, 0]);
      return y(Math.min(step, d.value));
    })
    .curve(d3.curveMonotoneX);

  series.forEach((s, si) => {
    const row = g.append("g")
      .attr("transform", `translate(0,${si * rowHeight})`);

    // Background
    row.append("rect")
      .attr("width", width)
      .attr("height", rowHeight)
      .attr("fill", si % 2 === 0 ? "#fff" : "#f8f9fb")
      .attr("stroke", "#e8e8ec")
      .attr("stroke-width", 0.5);

    // Server label
    row.append("text")
      .attr("class", "server-label")
      .attr("x", -8)
      .attr("y", rowHeight / 2)
      .attr("dy", "0.35em")
      .attr("text-anchor", "end")
      .text(s.name);

    // Horizon bands — draw from lightest (band 0) to darkest
    for (let band = 0; band < bands; band++) {
      const bandData = s.values.map(d => ({
        date: d.date,
        value: Math.max(0, d.value - band * step)
      }));

      row.append("path")
        .datum(bandData)
        .attr("d", area)
        .attr("fill", bandColors[band])
        .attr("clip-path", `inset(0 0 0 0)`);
    }

    // Thin separator line at bottom
    if (si < nServers - 1) {
      row.append("line")
        .attr("x1", 0).attr("x2", width)
        .attr("y1", rowHeight).attr("y2", rowHeight)
        .attr("stroke", "#d0d3d9")
        .attr("stroke-width", 0.5);
    }
  });

  // --- Time axis ---
  const axisG = g.append("g")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x)
      .ticks(d3.utcHour.every(2))
      .tickFormat(d3.utcFormat("%H:%M"))
      .tickSize(-height)
      .tickPadding(6))
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll(".tick line")
      .attr("stroke", "#ddd")
      .attr("stroke-dasharray", "2,3"))
    .call(g => g.selectAll(".tick text")
      .attr("fill", "#666")
      .style("font-family", "monospace")
      .style("font-size", "10px"));

  // --- Legend ---
  const legend = svg.append("g")
    .attr("transform", `translate(${margin.left + width - 220},${10})`);

  legend.append("text")
    .attr("x", 0).attr("y", 0)
    .attr("dy", "0.8em")
    .attr("fill", "#555")
    .style("font-size", "10px")
    .text("CPU %:");

  bandColors.forEach((c, i) => {
    const lx = 44 + i * 60;
    legend.append("rect")
      .attr("x", lx).attr("y", 2)
      .attr("width", 14).attr("height", 12)
      .attr("rx", 2)
      .attr("fill", c);
    legend.append("text")
      .attr("x", lx + 18).attr("y", 0)
      .attr("dy", "0.85em")
      .attr("fill", "#555")
      .style("font-size", "10px")
      .style("font-family", "monospace")
      .text(`${Math.round(i * step)}-${Math.round((i + 1) * step)}`);
  });

  // --- Crosshair and tooltip ---
  const crosshairLine = g.append("line")
    .attr("class", "crosshair-line")
    .attr("y1", 0)
    .attr("y2", height)
    .style("display", "none");

  // Value markers per row
  const markers = series.map((s, si) =>
    g.append("circle")
      .attr("r", 3)
      .attr("fill", "#2166AC")
      .attr("stroke", "#fff")
      .attr("stroke-width", 1.5)
      .style("display", "none")
  );

  const tooltip = d3.select("#tooltip");
  const bisect = d3.bisector(d => d.date).left;

  // Invisible overlay for pointer events
  g.append("rect")
    .attr("width", width)
    .attr("height", height)
    .attr("fill", "none")
    .attr("pointer-events", "all")
    .on("pointerenter", () => {
      crosshairLine.style("display", null);
      markers.forEach(m => m.style("display", null));
      tooltip.style("display", "block");
    })
    .on("pointerleave", () => {
      crosshairLine.style("display", "none");
      markers.forEach(m => m.style("display", "none"));
      tooltip.style("display", "none");
    })
    .on("pointermove", (event) => {
      const [mx] = d3.pointer(event);
      const date = x.invert(mx);
      const idx = Math.min(nPoints - 1, bisect(series[0].values, date));

      crosshairLine
        .attr("x1", x(series[0].values[idx].date))
        .attr("x2", x(series[0].values[idx].date));

      // Position markers on each row
      series.forEach((s, si) => {
        const val = s.values[idx].value;
        // Map value to y position within the folded row
        const foldedVal = val % step;
        const yScale = d3.scaleLinear([0, step], [rowHeight, 0]);
        markers[si]
          .attr("cx", x(s.values[idx].date))
          .attr("cy", si * rowHeight + yScale(Math.min(step, val > 0 ? (val <= step ? val : foldedVal || step) : 0)));
      });

      // Build tooltip content
      const timeStr = d3.utcFormat("%H:%M")(series[0].values[idx].date);
      let html = `<div class="tt-time">${timeStr} UTC</div>`;
      series.forEach((s, si) => {
        const val = s.values[idx].value;
        const barWidth = Math.round(val);
        html += `<div class="tt-row">
          <span class="tt-name">${s.name}</span>
          <span class="tt-val">${val.toFixed(1)}%</span>
        </div>`;
      });
      tooltip.html(html);

      // Position tooltip
      const chartRect = document.getElementById("chart").getBoundingClientRect();
      const containerRect = document.querySelector(".container").getBoundingClientRect();
      const svgScale = chartRect.width / fullWidth;
      const tipX = chartRect.left - containerRect.left + (margin.left + x(series[0].values[idx].date)) * svgScale;
      const tipY = chartRect.top - containerRect.top + margin.top * svgScale;

      const tipNode = tooltip.node();
      const tipW = tipNode.offsetWidth;
      const containerW = containerRect.width;

      tooltip
        .style("left", `${Math.min(tipX + 14, containerW - tipW - 8)}px`)
        .style("top", `${tipY}px`);
    });

})();
</script>
</body>
</html>
