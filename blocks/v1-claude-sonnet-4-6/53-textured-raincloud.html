<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textured Raincloud Plots — Dual Encoding for Accessibility</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #fafafa; display: flex; justify-content: center; padding: 24px;
  }
  .container { width: 1200px; max-width: 100%; }
  h1 { font-size: 20px; font-weight: 600; color: #222; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 14px; line-height: 1.5; }
  .controls { margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
  .controls button {
    padding: 7px 16px; border: 1px solid #aaa; border-radius: 5px;
    background: #fff; cursor: pointer; font-size: 13px; font-family: system-ui;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .controls button:hover { border-color: #666; }
  .controls button.active { background: #4477AA; color: #fff; border-color: #4477AA; }
  .cvd-note {
    font-size: 12px; color: #555; font-style: italic;
    opacity: 0; transition: opacity 0.3s;
  }
  .cvd-note.visible { opacity: 1; }
  svg { display: block; }
  .tooltip {
    position: absolute; pointer-events: none; background: rgba(255,255,255,0.96);
    border: 1px solid #ccc; border-radius: 4px; padding: 8px 10px;
    font-size: 12px; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    opacity: 0; transition: opacity 0.15s;
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
  }
  .tooltip .label { font-family: system-ui, sans-serif; font-weight: 600; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="container">
  <h1>Textured Raincloud Plots</h1>
  <p class="subtitle">Half-violin KDE + box plot + jittered strip for 6 groups. Each group has a Tol color and a distinct SVG pattern. Toggle deuteranopia simulation to verify patterns carry the encoding alone.</p>
  <div class="controls">
    <button id="cvd-toggle">Simulate Deuteranopia</button>
    <span class="cvd-note" id="cvd-note">Patterns remain distinguishable without color</span>
  </div>
  <div id="chart" style="position:relative;"></div>
</div>

<script>
(() => {
  // --- Seeded PRNG (LCG) ---
  const lcg = s => () => { s = (s * 1664525 + 1013904223) & 0x7fffffff; return s / 0x7fffffff; };
  const rng = lcg(42);
  const rnorm = (mu, sigma) => {
    const u1 = rng(), u2 = rng();
    return mu + sigma * Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  };

  // --- Synthetic data: structurally interesting distributions ---
  const n = 90;
  const groups = [
    { name: "Alpine",    gen: () => rnorm(48, 7) },
    { name: "Boreal",    gen: () => rnorm(64, 11) },
    { name: "Coastal",   gen: () => rng() < 0.45 ? rnorm(32, 5) : rnorm(62, 6) },  // bimodal
    { name: "Desert",    gen: () => { const v = rnorm(38, 13); return v > 15 ? v : 15 + Math.abs(v - 15) * 0.3; } },  // right-skewed
    { name: "Estuary",   gen: () => rnorm(72, 5) },  // tight
    { name: "Fjord",     gen: () => 25 + rng() * 50 }  // uniform
  ];

  const data = groups.map(g => ({
    name: g.name,
    values: d3.range(n).map(() => g.gen())
  }));

  // --- Layout ---
  const margin = { top: 24, right: 180, bottom: 36, left: 70 };
  const width = 1200, height = 700;
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  const svg = d3.select("#chart").append("svg")
    .attr("width", width).attr("height", height)
    .attr("viewBox", `0 0 ${width} ${height}`);

  const defs = svg.append("defs");

  // --- CVD simulation filter (Brettel 1997 deuteranopia approximation) ---
  defs.append("filter").attr("id", "deuteranopia").attr("color-interpolation-filters", "linearRGB")
    .append("feColorMatrix")
      .attr("type", "matrix")
      .attr("values", [
        "0.625 0.375 0.000 0 0",
        "0.700 0.300 0.000 0 0",
        "0.000 0.300 0.700 0 0",
        "0.000 0.000 0.000 1 0"
      ].join(" "));

  // --- Tol Bright palette (6 colors) ---
  const colors = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377"];

  // --- SVG patterns: maximally distinct texton classes ---
  // Diagonal hatch, dot grid, cross-hatch, horizontal lines, waves, vertical lines
  const patternSize = 8;
  const patternStroke = "rgba(0,0,0,0.22)";
  const patternStrokeW = 1.5;

  const patternConfigs = [
    { id: "pat-diag", angle: 45, draw(p, sz) {
      p.append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",sz)
        .attr("stroke", patternStroke).attr("stroke-width", patternStrokeW);
    }},
    { id: "pat-dots", angle: 0, draw(p, sz) {
      p.append("circle").attr("cx", sz/2).attr("cy", sz/2).attr("r", 2)
        .attr("fill", patternStroke);
    }},
    { id: "pat-cross", angle: 45, draw(p, sz) {
      p.append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",sz)
        .attr("stroke", patternStroke).attr("stroke-width", 1.2);
      p.append("line").attr("x1",0).attr("y1",0).attr("x2",sz).attr("y2",0)
        .attr("stroke", patternStroke).attr("stroke-width", 1.2);
    }},
    { id: "pat-horiz", angle: 0, draw(p, sz) {
      p.append("line").attr("x1",0).attr("y1",sz/2).attr("x2",sz).attr("y2",sz/2)
        .attr("stroke", patternStroke).attr("stroke-width", patternStrokeW);
    }},
    { id: "pat-wave", angle: 0, draw(p, sz) {
      p.append("path")
        .attr("d", `M0,${sz*0.5} Q${sz*0.25},${sz*0.15} ${sz*0.5},${sz*0.5} T${sz},${sz*0.5}`)
        .attr("fill", "none").attr("stroke", patternStroke).attr("stroke-width", patternStrokeW);
    }},
    { id: "pat-vert", angle: 0, draw(p, sz) {
      p.append("line").attr("x1",sz/2).attr("y1",0).attr("x2",sz/2).attr("y2",sz)
        .attr("stroke", patternStroke).attr("stroke-width", patternStrokeW);
    }}
  ];

  patternConfigs.forEach(pc => {
    const pat = defs.append("pattern")
      .attr("id", pc.id).attr("width", patternSize).attr("height", patternSize)
      .attr("patternUnits", "userSpaceOnUse");
    if (pc.angle) pat.attr("patternTransform", `rotate(${pc.angle})`);
    pc.draw(pat, patternSize);
  });

  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  // --- Scales ---
  const allValues = data.flatMap(d => d.values);
  const xExtent = d3.extent(allValues);
  const xPad = (xExtent[1] - xExtent[0]) * 0.08;
  const x = d3.scaleLinear().domain([xExtent[0] - xPad, xExtent[1] + xPad]).range([0, innerW]).nice();

  const y = d3.scaleBand().domain(data.map(d => d.name)).range([0, innerH]).paddingInner(0.18);
  const rowH = y.bandwidth();

  // --- KDE ---
  const gaussian = v => Math.exp(-0.5 * v * v) / Math.sqrt(2 * Math.PI);

  const silvermanBW = values => {
    const sorted = Float64Array.from(values).sort();
    const std = d3.deviation(values);
    const iqr = d3.quantile(sorted, 0.75) - d3.quantile(sorted, 0.25);
    return 0.9 * Math.min(std, iqr / 1.34) * Math.pow(values.length, -0.2);
  };

  const kde = (values, bw) => {
    const lo = x.domain()[0], hi = x.domain()[1];
    const ticks = d3.range(lo, hi, (hi - lo) / 200);
    return ticks.map(t => [t, d3.mean(values, v => gaussian((t - v) / bw)) / bw]);
  };

  // --- Stats ---
  const computeStats = values => {
    const sorted = Float64Array.from(values).sort();
    const q1 = d3.quantile(sorted, 0.25), q3 = d3.quantile(sorted, 0.75);
    const iqr = q3 - q1;
    const lf = q1 - 1.5 * iqr, uf = q3 + 1.5 * iqr;
    return {
      n: sorted.length,
      min: sorted[0], max: sorted[sorted.length - 1],
      q1, median: d3.quantile(sorted, 0.5), q3, iqr,
      mean: d3.mean(sorted),
      whiskerLow: d3.min(sorted.filter(v => v >= lf)),
      whiskerHigh: d3.max(sorted.filter(v => v <= uf)),
      outliers: Array.from(sorted.filter(v => v < lf || v > uf))
    };
  };

  // --- Tooltip ---
  const tooltip = d3.select("#chart").append("div").attr("class", "tooltip");

  const showTooltip = (event, html) => {
    const rect = document.getElementById("chart").getBoundingClientRect();
    tooltip.html(html)
      .style("opacity", 1)
      .style("left", (event.clientX - rect.left + 14) + "px")
      .style("top", (event.clientY - rect.top - 10) + "px");
  };
  const hideTooltip = () => tooltip.style("opacity", 0);

  // --- Layout zones within each row ---
  const violinH = rowH * 0.42;
  const boxYOffset = rowH * 0.46;
  const boxH = rowH * 0.1;
  const stripYOffset = rowH * 0.62;
  const stripH = rowH * 0.32;

  // --- Draw each group ---
  data.forEach((group, i) => {
    const row = g.append("g")
      .attr("class", `row row-${i}`)
      .attr("transform", `translate(0,${y(group.name)})`);

    const bw = silvermanBW(group.values);
    const density = kde(group.values, bw);
    const maxDensity = d3.max(density, d => d[1]);
    const stats = computeStats(group.values);
    const color = colors[i];
    const patId = patternConfigs[i].id;

    const densityScale = d3.scaleLinear().domain([0, maxDensity]).range([0, violinH]);

    // Half-violin area (density goes upward from baseline)
    const area = d3.area()
      .x(d => x(d[0]))
      .y0(violinH)
      .y1(d => violinH - densityScale(d[1]))
      .curve(d3.curveBasis);

    const violinPath = area(density);

    // Color fill
    row.append("path")
      .attr("d", violinPath)
      .attr("fill", color)
      .attr("fill-opacity", 0.65)
      .attr("stroke", color)
      .attr("stroke-width", 0.5)
      .attr("stroke-opacity", 0.4);

    // Pattern overlay
    row.append("path")
      .attr("d", violinPath)
      .attr("fill", `url(#${patId})`);

    // --- Box plot ---
    const by = boxYOffset;

    // Whisker line
    row.append("line")
      .attr("x1", x(stats.whiskerLow)).attr("x2", x(stats.whiskerHigh))
      .attr("y1", by + boxH / 2).attr("y2", by + boxH / 2)
      .attr("stroke", "#444").attr("stroke-width", 1);

    // Box rectangle
    row.append("rect")
      .attr("x", x(stats.q1)).attr("y", by)
      .attr("width", Math.max(1, x(stats.q3) - x(stats.q1))).attr("height", boxH)
      .attr("fill", "#fff").attr("stroke", "#444").attr("stroke-width", 1.2)
      .attr("rx", 1);

    // Median line
    row.append("line")
      .attr("x1", x(stats.median)).attr("x2", x(stats.median))
      .attr("y1", by - 1).attr("y2", by + boxH + 1)
      .attr("stroke", "#222").attr("stroke-width", 2);

    // Whisker caps
    [stats.whiskerLow, stats.whiskerHigh].forEach(w => {
      row.append("line")
        .attr("x1", x(w)).attr("x2", x(w))
        .attr("y1", by + 2).attr("y2", by + boxH - 2)
        .attr("stroke", "#444").attr("stroke-width", 1.2);
    });

    // Outlier markers (open circles, not repeated in strip)
    const outlierSet = new Set(stats.outliers);
    stats.outliers.forEach(o => {
      row.append("circle")
        .attr("cx", x(o)).attr("cy", by + boxH / 2).attr("r", 2.5)
        .attr("fill", "none").attr("stroke", "#444").attr("stroke-width", 1);
    });

    // --- Jittered strip (exclude outliers already shown in box) ---
    const jitterRng = lcg(i * 1000 + 7);
    const stripPoints = group.values.filter(v => !outlierSet.has(v));

    row.selectAll(".strip-dot")
      .data(stripPoints)
      .join("circle")
        .attr("class", "strip-dot")
        .attr("cx", d => x(d))
        .attr("cy", () => stripYOffset + jitterRng() * stripH)
        .attr("r", 2.2)
        .attr("fill", color)
        .attr("fill-opacity", 0.5)
        .attr("stroke", color)
        .attr("stroke-width", 0.3)
        .attr("stroke-opacity", 0.3);

    // --- Hover target (invisible rect over row) ---
    row.append("rect")
      .attr("x", 0).attr("y", 0)
      .attr("width", innerW).attr("height", rowH)
      .attr("fill", "transparent")
      .style("cursor", "pointer")
      .on("pointerenter", function(event) {
        // Highlight this row
        g.selectAll(".row").attr("opacity", 0.3);
        row.attr("opacity", 1);
        const html = `<div class="label">${group.name}</div>`
          + `n=${stats.n}  median=${stats.median.toFixed(1)}<br>`
          + `Q1=${stats.q1.toFixed(1)}  Q3=${stats.q3.toFixed(1)}<br>`
          + `mean=${stats.mean.toFixed(1)}  IQR=${stats.iqr.toFixed(1)}`;
        showTooltip(event, html);
      })
      .on("pointermove", function(event) {
        const rect = document.getElementById("chart").getBoundingClientRect();
        tooltip
          .style("left", (event.clientX - rect.left + 14) + "px")
          .style("top", (event.clientY - rect.top - 10) + "px");
      })
      .on("pointerleave", function() {
        g.selectAll(".row").attr("opacity", 1);
        hideTooltip();
      });
  });

  // --- Axes ---
  const xAxis = g.append("g")
    .attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x).ticks(10).tickSizeOuter(0));
  xAxis.selectAll("text").attr("font-size", "11px");
  xAxis.select(".domain").attr("stroke", "#999");

  // X axis label
  g.append("text")
    .attr("x", innerW / 2).attr("y", innerH + 38)
    .attr("text-anchor", "middle")
    .attr("font-size", "12px").attr("fill", "#555")
    .text("Value");

  const yAxis = g.append("g")
    .call(d3.axisLeft(y).tickSize(0).tickPadding(8));
  yAxis.selectAll("text").attr("font-size", "13px").attr("font-weight", "500").attr("fill", "#333");
  yAxis.select(".domain").remove();

  // --- Legend ---
  const legendX = innerW + 24;
  const legend = g.append("g").attr("transform", `translate(${legendX}, 0)`);

  legend.append("text")
    .text("Groups")
    .attr("font-size", "13px").attr("font-weight", "600").attr("fill", "#333");

  const patternLabels = ["Diagonal", "Dots", "Cross", "Horizontal", "Waves", "Vertical"];

  data.forEach((group, i) => {
    const ly = 22 + i * 38;
    const lg = legend.append("g").attr("transform", `translate(0,${ly})`);

    // Color swatch
    lg.append("rect")
      .attr("width", 22).attr("height", 22)
      .attr("fill", colors[i]).attr("rx", 3).attr("fill-opacity", 0.7);

    // Pattern overlay on swatch
    lg.append("rect")
      .attr("width", 22).attr("height", 22)
      .attr("fill", `url(#${patternConfigs[i].id})`).attr("rx", 3);

    // Stroke border
    lg.append("rect")
      .attr("width", 22).attr("height", 22)
      .attr("fill", "none").attr("stroke", "#bbb").attr("stroke-width", 0.8).attr("rx", 3);

    // Group name
    lg.append("text")
      .attr("x", 30).attr("y", 11).attr("dominant-baseline", "central")
      .text(group.name)
      .attr("font-size", "12px").attr("fill", "#333").attr("font-weight", "500");

    // Pattern type hint
    lg.append("text")
      .attr("x", 30).attr("y", 22).attr("dominant-baseline", "hanging")
      .text(patternLabels[i])
      .attr("font-size", "10px").attr("fill", "#999");
  });

  // --- Anatomy labels ---
  const anatY = 22 + data.length * 38 + 24;
  const anat = legend.append("g").attr("transform", `translate(0,${anatY})`);
  anat.append("text")
    .text("Anatomy")
    .attr("font-size", "13px").attr("font-weight", "600").attr("fill", "#333");

  const labels = [
    { text: "Half-violin (KDE)", color: "#4477AA" },
    { text: "Box plot (IQR)", color: "#444" },
    { text: "Jittered strip", color: "#4477AA" }
  ];
  labels.forEach((l, i) => {
    const ay = 18 + i * 20;
    anat.append("circle")
      .attr("cx", 5).attr("cy", ay)
      .attr("r", 4).attr("fill", l.color).attr("fill-opacity", 0.5);
    anat.append("text")
      .attr("x", 16).attr("y", ay).attr("dominant-baseline", "central")
      .text(l.text)
      .attr("font-size", "11px").attr("fill", "#555");
  });

  // --- CVD toggle ---
  let cvdActive = false;
  const cvdBtn = document.getElementById("cvd-toggle");
  const cvdNote = document.getElementById("cvd-note");

  cvdBtn.addEventListener("click", () => {
    cvdActive = !cvdActive;
    cvdBtn.classList.toggle("active", cvdActive);
    cvdNote.classList.toggle("visible", cvdActive);
    svg.attr("filter", cvdActive ? "url(#deuteranopia)" : null);
  });
})();
</script>
</body>
</html>
