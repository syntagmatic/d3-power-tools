<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Semantic Zoom Distributions</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fafafa; color: #333; overflow: hidden; }
  .header { padding: 8px 20px; display: flex; align-items: center; gap: 14px; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .badge { background: #4477AA; color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
  #chart { width: 100%; height: calc(100vh - 44px); min-width: 500px; position: relative; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<div class="header">
  <h1>Semantic Zoom Distributions</h1>
  <span class="badge" id="modeBadge">Overview — 2000 points</span>
</div>
<div id="chart"></div>

<script>
const TOL_SEQ = ["#DDDDEE","#BBBBDD","#9999CC","#7777AA","#555599","#444488","#333377","#222266","#111155","#000044"];
const TOL = ["#4477AA","#EE6677","#228833"];

// --- Generate 3 clusters ---
const rng = () => (Math.random() + Math.random() + Math.random()) / 3;
const clusters = [
  { cx: 300, cy: 250, sx: 80, sy: 60, label: "Alpha" },
  { cx: 700, cy: 400, sx: 100, sy: 80, label: "Beta" },
  { cx: 500, cy: 150, sx: 60, sy: 50, label: "Gamma" },
];

const data = [];
clusters.forEach((c, ci) => {
  const n = ci === 0 ? 700 : ci === 1 ? 800 : 500;
  for (let i = 0; i < n; i++) {
    data.push({
      x: c.cx + (Math.random() + Math.random() - 1) * c.sx * 2,
      y: c.cy + (Math.random() + Math.random() - 1) * c.sy * 2,
      cluster: ci,
      label: `${c.label}-${i}`,
    });
  }
});

// --- Setup ---
const chartEl = document.getElementById("chart");
const width = chartEl.clientWidth;
const height = chartEl.clientHeight;
const margin = { top: 10, right: 10, bottom: 40, left: 50 };
const iw = width - margin.left - margin.right;
const ih = height - margin.top - margin.bottom;

const xScale0 = d3.scaleLinear().domain(d3.extent(data, d => d.x)).nice().range([0, iw]);
const yScale0 = d3.scaleLinear().domain(d3.extent(data, d => d.y)).nice().range([ih, 0]);

const svg = d3.select("#chart").append("svg").attr("width", width).attr("height", height);
const defs = svg.append("defs");

// Clip path
defs.append("clipPath").attr("id", "clip")
  .append("rect").attr("width", iw).attr("height", ih);

const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
const plotArea = g.append("g").attr("clip-path", "url(#clip)");

// Layers
const contourLayer = plotArea.append("g").attr("class", "contours");
const hexLayer = plotArea.append("g").attr("class", "hexagons");
const pointLayer = plotArea.append("g").attr("class", "points");

const xAxisG = g.append("g").attr("transform", `translate(0,${ih})`);
const yAxisG = g.append("g");

let currentMode = "overview";
let currentTransform = d3.zoomIdentity;

// Hysteresis thresholds
const THRESHOLDS = {
  overviewToHex: 3,
  hexToOverview: 1.5,
  hexToPoints: 12,
  pointsToHex: 6,
};

const getMode = (k, prevMode) => {
  if (prevMode === "overview" && k >= THRESHOLDS.overviewToHex) return "hex";
  if (prevMode === "hex" && k < THRESHOLDS.hexToOverview) return "overview";
  if (prevMode === "hex" && k >= THRESHOLDS.hexToPoints) return "points";
  if (prevMode === "points" && k < THRESHOLDS.pointsToHex) return "hex";
  return prevMode;
};

const drawContours = (zx, zy) => {
  // Map data to screen coords
  const pts = data.map(d => [zx(d.x), zy(d.y)]);
  const density = d3.contourDensity()
    .x(d => d[0]).y(d => d[1])
    .size([iw, ih])
    .bandwidth(30)
    .thresholds(10)(pts);

  const colorScale = d3.scaleSequential(d3.interpolateBlues).domain([0, d3.max(density, d => d.value) || 1]);

  contourLayer.selectAll("path").data(density)
    .join("path")
    .attr("d", d3.geoPath())
    .attr("fill", d => colorScale(d.value))
    .attr("stroke", "#4477AA")
    .attr("stroke-width", 0.5)
    .attr("stroke-opacity", 0.4);
};

const drawHex = (zx, zy) => {
  const radius = 15;
  const hexbin = d3.hexbin || null;

  // Manual hex binning since d3-hexbin may not be loaded
  const pts = data.map(d => [zx(d.x), zy(d.y)]);
  const dx = radius * 2 * Math.sin(Math.PI / 3);
  const dy = radius * 1.5;

  const bins = new Map();
  for (const [px, py] of pts) {
    if (px < 0 || px > iw || py < 0 || py > ih) continue;
    const col = Math.round(px / dx);
    const row = Math.round((py - (col & 1) * dy / 2) / dy);
    const key = `${col},${row}`;
    if (!bins.has(key)) bins.set(key, { x: col * dx, y: row * dy + (col & 1) * dy / 2, count: 0 });
    bins.get(key).count++;
  }

  const hexData = Array.from(bins.values());
  const maxCount = d3.max(hexData, d => d.count) || 1;
  const colorScale = d3.scaleSequential(d3.interpolateBlues).domain([0, maxCount]);

  const hexPath = (r) => {
    const angles = d3.range(6).map(i => i * Math.PI / 3);
    return "M" + angles.map(a => [r * Math.sin(a), -r * Math.cos(a)].join(",")).join("L") + "Z";
  };

  hexLayer.selectAll("path").data(hexData, d => `${d.x},${d.y}`)
    .join("path")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .attr("d", hexPath(radius - 0.5))
    .attr("fill", d => colorScale(d.count))
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.5);
};

const drawPoints = (zx, zy) => {
  const visible = data.filter(d => {
    const px = zx(d.x), py = zy(d.y);
    return px >= -10 && px <= iw + 10 && py >= -10 && py <= ih + 10;
  });

  pointLayer.selectAll("circle").data(visible, d => d.label)
    .join("circle")
    .attr("cx", d => zx(d.x))
    .attr("cy", d => zy(d.y))
    .attr("r", 4)
    .attr("fill", d => TOL[d.cluster])
    .attr("opacity", 0.75)
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.5);

  // Show labels at high zoom for visible points (limit to avoid clutter)
  const labelData = visible.slice(0, 80);
  pointLayer.selectAll("text").data(labelData, d => d.label)
    .join("text")
    .attr("x", d => zx(d.x) + 6)
    .attr("y", d => zy(d.y) + 3)
    .text(d => d.label)
    .attr("font-size", "9px")
    .attr("fill", "#333");
};

const render = (transform) => {
  currentTransform = transform;
  const k = transform.k;
  const newMode = getMode(k, currentMode);

  const zx = transform.rescaleX(xScale0);
  const zy = transform.rescaleY(yScale0);

  xAxisG.call(d3.axisBottom(zx).ticks(Math.max(3, iw / 100)));
  yAxisG.call(d3.axisLeft(zy).ticks(Math.max(3, ih / 80)));

  if (newMode !== currentMode) {
    // Fade transition
    contourLayer.transition().duration(300).attr("opacity", newMode === "overview" ? 1 : 0);
    hexLayer.transition().duration(300).attr("opacity", newMode === "hex" ? 1 : 0);
    pointLayer.transition().duration(300).attr("opacity", newMode === "points" ? 1 : 0);

    currentMode = newMode;
  }

  // Draw active layer
  if (currentMode === "overview") {
    contourLayer.attr("opacity", 1);
    drawContours(zx, zy);
  } else if (currentMode === "hex") {
    hexLayer.attr("opacity", 1);
    drawHex(zx, zy);
  } else {
    pointLayer.attr("opacity", 1);
    drawPoints(zx, zy);
  }

  // Clear inactive layers (after transition)
  if (currentMode !== "overview") contourLayer.selectAll("*").remove();
  if (currentMode !== "hex") hexLayer.selectAll("*").remove();
  if (currentMode !== "points") {
    pointLayer.selectAll("*").remove();
  }

  const modeNames = { overview: "Overview (contours)", hex: "Hex bins", points: "Individual points" };
  const visible = currentMode === "points"
    ? data.filter(d => {
        const px = zx(d.x), py = zy(d.y);
        return px >= 0 && px <= iw && py >= 0 && py <= ih;
      }).length
    : data.length;
  document.getElementById("modeBadge").textContent =
    `${modeNames[currentMode]} — ${visible} ${currentMode === "points" ? "visible" : "points"} (k=${k.toFixed(1)})`;
};

// Zoom
let zoomRafId = 0;
const zoom = d3.zoom()
  .scaleExtent([1, 50])
  .on("zoom", ({ transform }) => {
    cancelAnimationFrame(zoomRafId);
    zoomRafId = requestAnimationFrame(() => render(transform));
  });

svg.call(zoom);

// Initial render
render(d3.zoomIdentity);

// Responsive
const ro = new ResizeObserver(([entry]) => {
  const { width: w, height: h } = entry.contentRect;
  if (w > 0) {
    svg.attr("width", w).attr("height", h);
    render(currentTransform);
  }
});
ro.observe(chartEl);
</script>
</body>
</html>
