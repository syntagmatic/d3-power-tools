<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Election Swing Map</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #fafafa;
    color: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 0.95rem;
    color: #666;
    margin-bottom: 16px;
    min-height: 1.4em;
  }
  #container {
    width: 100%;
    max-width: 960px;
  }
  #map-svg {
    width: 100%;
    display: block;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    background: #f0f0f0;
    border-radius: 6px;
    margin: 8px 0;
  }
  .slider-row label {
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    color: #555;
  }
  .slider-row input[type=range] {
    flex: 1;
    accent-color: #4a5568;
  }
  .cycle-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: #888;
    padding: 0 24px;
    margin-bottom: 4px;
  }
  #hist-svg {
    width: 100%;
    display: block;
  }
  .state-boundary {
    fill: none;
    stroke: #fff;
    stroke-width: 0.8;
    pointer-events: none;
  }
  .hist-bar { cursor: crosshair; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(20,20,40,0.92);
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 0.78rem;
    line-height: 1.3;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s;
  }
</style>
</head>
<body>
<h1>Election Swing Map</h1>
<div class="subtitle" id="subtitle">Cycle: 2008</div>
<div id="container">
  <svg id="map-svg"></svg>
  <div class="slider-row">
    <label>Election Cycle</label>
    <input type="range" id="cycle-slider" min="0" max="4" step="1" value="0">
  </div>
  <div class="cycle-labels" id="cycle-labels"></div>
  <svg id="hist-svg"></svg>
</div>
<div class="tooltip" id="tooltip"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

const cycles = [2008, 2012, 2016, 2020, 2024];
const width = 960, mapHeight = 440, histHeight = 160;
const margin = { top: 8, right: 24, bottom: 36, left: 48 };

// Cycle labels
const labelsDiv = document.getElementById("cycle-labels");
labelsDiv.innerHTML = cycles.map(y => `<span>${y}</span>`).join("");

// Load US states
const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
const states = topojson.feature(us, us.objects.states);
const stateMesh = topojson.mesh(us, us.objects.states, (a, b) => a !== b);

// Generate synthetic swing data per state
const rng = d3.randomNormal(0, 0.12);
const swingData = new Map();
states.features.forEach(f => {
  const id = f.id;
  // Start with a lean: some states lean red, some blue
  let lean = (d3.randomUniform(-0.35, 0.35)());
  const vals = [lean];
  for (let i = 1; i < 5; i++) {
    // National wave + local drift
    const wave = (i === 1 ? 0.04 : i === 2 ? -0.06 : i === 3 ? 0.05 : -0.02);
    lean = Math.max(-0.8, Math.min(0.8, lean + rng() + wave));
    vals.push(lean);
  }
  swingData.set(id, vals);
  f.properties.swing = vals;
});

// Projection
const projection = d3.geoAlbersUsa().fitSize([width - 20, mapHeight - 20], states);
const path = d3.geoPath(projection);

// Color scale: RdBu diverging, -1 = red, +1 = blue
const colorScale = (v) => d3.interpolateRdBu(0.5 + v * 0.5);

// Map SVG
const mapSvg = d3.select("#map-svg")
  .attr("viewBox", `0 0 ${width} ${mapHeight}`)
  .attr("preserveAspectRatio", "xMidYMid meet");

mapSvg.append("title").text("Election Swing Map — synthetic US state choropleth across 5 election cycles");

mapSvg.append("rect").attr("width", width).attr("height", mapHeight).attr("fill", "#f5f5f5").attr("rx", 4);

const stateGroup = mapSvg.append("g").attr("transform", "translate(10,10)");

const statePaths = stateGroup.selectAll("path.state")
  .data(states.features)
  .join("path")
    .attr("class", "state")
    .attr("d", path)
    .attr("fill", d => colorScale(d.properties.swing[0]))
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.6)
    .style("cursor", "pointer");

stateGroup.append("path")
  .datum(stateMesh)
  .attr("class", "state-boundary")
  .attr("d", path);

// Tooltip
const tooltip = d3.select("#tooltip");

statePaths
  .on("mouseenter", (event, d) => {
    const idx = +document.getElementById("cycle-slider").value;
    const val = d.properties.swing[idx];
    tooltip.style("opacity", 1).html(
      `<strong>${d.properties.name || "State " + d.id}</strong><br>` +
      `Swing: ${val > 0 ? "+" : ""}${(val * 100).toFixed(1)}%<br>` +
      `${val > 0 ? "Lean Blue" : "Lean Red"}`
    );
  })
  .on("mousemove", (event) => {
    tooltip.style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 28) + "px");
  })
  .on("mouseleave", () => tooltip.style("opacity", 0));

// Histogram
const histSvg = d3.select("#hist-svg")
  .attr("viewBox", `0 0 ${width} ${histHeight}`)
  .attr("preserveAspectRatio", "xMidYMid meet");

histSvg.append("title").text("Distribution of state swing magnitudes");

const hx = d3.scaleLinear().domain([-0.8, 0.8]).range([margin.left, width - margin.right]);
const histGroup = histSvg.append("g");

const xAxisG = histSvg.append("g")
  .attr("transform", `translate(0,${histHeight - margin.bottom})`)
  .call(d3.axisBottom(hx).ticks(10).tickFormat(d => (d > 0 ? "+" : "") + d3.format(".0%")(d)))
  .call(g => g.select(".domain").attr("stroke", "#aaa"))
  .call(g => g.selectAll(".tick text").attr("fill", "#666").style("font-size", "10px"))
  .call(g => g.selectAll(".tick line").attr("stroke", "#ccc"));

histSvg.append("text")
  .attr("x", width / 2).attr("y", histHeight - 2)
  .attr("text-anchor", "middle")
  .attr("fill", "#888").style("font-size", "11px")
  .text("← Red shift | Blue shift →");

const yHist = d3.scaleLinear().range([histHeight - margin.bottom, margin.top + 8]);

let brushSelection = null;

function updateVis(cycleIdx, transition = true) {
  const subtitle = document.getElementById("subtitle");
  subtitle.textContent = `Cycle: ${cycles[cycleIdx]}`;

  const vals = states.features.map(f => f.properties.swing[cycleIdx]);

  // Update map colors
  const sel = statePaths.data(states.features);
  if (transition) {
    sel.transition().duration(500).attr("fill", d => {
      if (brushSelection) {
        const v = d.properties.swing[cycleIdx];
        return (v >= brushSelection[0] && v <= brushSelection[1]) ? colorScale(v) : "#ddd";
      }
      return colorScale(d.properties.swing[cycleIdx]);
    });
  } else {
    sel.attr("fill", d => {
      if (brushSelection) {
        const v = d.properties.swing[cycleIdx];
        return (v >= brushSelection[0] && v <= brushSelection[1]) ? colorScale(v) : "#ddd";
      }
      return colorScale(d.properties.swing[cycleIdx]);
    });
  }

  // Update histogram
  const bins = d3.bin().domain([-0.8, 0.8]).thresholds(24)(vals);
  yHist.domain([0, d3.max(bins, b => b.length)]);

  histGroup.selectAll("rect.hist-bar")
    .data(bins)
    .join(
      enter => enter.append("rect").attr("class", "hist-bar")
        .attr("x", d => hx(d.x0) + 0.5)
        .attr("width", d => Math.max(0, hx(d.x1) - hx(d.x0) - 1))
        .attr("y", histHeight - margin.bottom)
        .attr("height", 0)
        .attr("rx", 1),
      update => update,
      exit => exit.remove()
    )
    .transition().duration(transition ? 400 : 0)
    .attr("x", d => hx(d.x0) + 0.5)
    .attr("width", d => Math.max(0, hx(d.x1) - hx(d.x0) - 1))
    .attr("y", d => yHist(d.length))
    .attr("height", d => histHeight - margin.bottom - yHist(d.length))
    .attr("fill", d => {
      const mid = (d.x0 + d.x1) / 2;
      if (brushSelection && (mid < brushSelection[0] || mid > brushSelection[1])) return "#ddd";
      return colorScale(mid);
    })
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.3);
}

// Brush on histogram
const brush = d3.brushX()
  .extent([[margin.left, margin.top + 4], [width - margin.right, histHeight - margin.bottom]])
  .on("brush end", (event) => {
    const idx = +document.getElementById("cycle-slider").value;
    if (event.selection) {
      brushSelection = event.selection.map(hx.invert);
    } else {
      brushSelection = null;
    }
    updateVis(idx, false);
  });

histSvg.append("g").attr("class", "brush").call(brush);

// Slider
document.getElementById("cycle-slider").addEventListener("input", (e) => {
  updateVis(+e.target.value);
});

updateVis(0, false);
</script>
</body>
</html>
