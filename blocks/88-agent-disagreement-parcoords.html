<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Disagreement — where critics diverge</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --text-muted: #666;
    --font: system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    padding: 20px 24px;
  }
  .header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; font-weight: 600; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }
  .toggle-btn {
    padding: 5px 14px;
    border: 1.5px solid #aaa;
    border-radius: 4px;
    background: #fff;
    font-size: 12px;
    font-family: var(--font);
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s;
  }
  .toggle-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }
  .toggle-btn:hover { border-color: #666; }
  #chart-container {
    position: relative;
    width: 100%;
    max-width: 960px;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
  }
  svg {
    position: relative;
    z-index: 5;
  }
  .brushed-list {
    max-width: 960px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .brushed-list .count { font-weight: 600; color: var(--text); }
  .brushed-list .block-tag {
    display: inline-block;
    background: #e8e8ee;
    padding: 1px 7px;
    border-radius: 3px;
    margin: 1px 2px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<h1>Agent Disagreement</h1>
<p class="subtitle">Parallel coordinates of 5 adversarial agent scores across 84 blocks &mdash; brush axes to filter</p>
<div class="controls">
  <button class="toggle-btn" id="btn-v1">v1 pre-calibration</button>
  <button class="toggle-btn active" id="btn-v2">v2 post-calibration</button>
</div>
<div id="chart-container"></div>
<div class="brushed-list" id="brushed-list"></div>

<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const agents = ["Visual","Deception","Interaction","Perceptual","Metamorphic"];

const v1Raw = {
1:[5,7,4,6,5],2:[4,8,5,5,4],3:[6,7,8,5,4],4:[6,7,7,6,4],5:[4,7,4,7,5],6:[5,9,7,7,3],7:[4,6,3,6,5],8:[4,8,5,7,4],9:[7,7,5,7,5],10:[3,8,5,7,5],11:[3,8,6,6,5],12:[4,8,7,7,5],13:[3,9,5,6,4],14:[3,8,6,6,5],15:[4,8,5,7,6],16:[4,8,5,7,5],17:[4,8,5,6,5],18:[5,9,6,7,7],19:[5,8,5,7,5],20:[4,7,6,6,5],21:[5,7,7,7,6],22:[3,7,4,7,3],23:[4,7,3,7,4],24:[5,8,5,6,5],25:[5,8,4,6,5],26:[5,7,6,5,4],27:[6,8,5,6,7],28:[6,8,8,7,3],29:[3,7,4,6,5],30:[5,7,5,7,5],31:[4,8,7,7,7],32:[3,8,4,5,4],33:[6,7,8,6,5],34:[7,8,8,7,4],35:[6,8,6,6,5],36:[4,8,5,7,5],37:[8,7,6,8,5],38:[6,5,8,7,4],39:[3,8,7,6,5],40:[4,7,6,7,5],41:[5,8,6,6,6],42:[3,9,6,6,5],43:[7,7,6,8,7],44:[7,9,8,8,8],45:[7,9,4,8,7],46:[7,9,6,8,7],47:[7,9,6,7,5],48:[7,7,6,5,7],49:[7,9,7,7,8],50:[8,10,8,8,8],51:[8,9,7,6,8],52:[8,9,7,8,6],53:[8,10,8,8,8],54:[7,9,8,7,7],55:[5,9,5,7,6],56:[4.5,9,3,5,7],57:[5,9,7,7,8],58:[6,9,7,8,7],59:[6,9,6,6,7],60:[6,9,7,7,5],61:[5,9,4,6,7],62:[7,9,5,8,7],63:[4,8,4,8,6],64:[6,8,6,7,7],65:[7,8,7,7,8],66:[7,9,7,8,8],67:[7,9,6,7,8],68:[7,9,7,7,8],69:[7,8,8,8,8],70:[7,9,7,7,7],71:[6,9,6,5,7],72:[7,9,7,9,6],73:[7,9,7,8,8],74:[7,9,8,8,8],75:[7,9,6,7,8],76:[7,9,7,7,8],77:[7,9,5,7,7],78:[7,9,6,7,8],79:[8,8,7,8,8],80:[7,8,8,8,7],81:[7,10,7,8,8],82:[8,9,7,8,8],83:[7,10,6,7,7],84:[7,9,8,9,8]
};

const v2Raw = {
1:[7,8,6,6,7],2:[8,9,7,7,7],3:[7,8,7,5,8],4:[8,8,7,7,6],5:[7,7,6,7,7],6:[9,9,7,8,8],7:[7,8,5,7,7],8:[7,8,7,7,7],9:[8,7,7,7,6],10:[8,9,6,8,7],11:[7,8,6,6,6],12:[8,8,7,6,7],13:[7,9,6,6,7],14:[7,8,7,7,7],15:[8,9,7,7,7],16:[8,8,6,7,8],17:[7,9,6,6,7],18:[7,9,7,7,8],19:[8,8,7,7,7],20:[7,7,7,6,6],21:[5,6,7,5,6],22:[7,8,6,7,7],23:[7,8,5,7,7],24:[8,8,7,7,8],25:[5,8,6,6,6],26:[8,9,7,8,7],27:[7,9,6,6,8],28:[8,8,7,8,7],29:[7,8,5,7,6],30:[7,9,7,7,6],31:[7,8,5,7,7],32:[6,8,6,5,6],33:[8,8,7,8,7],34:[8,9,7,7,7],35:[7,8,7,6,7],36:[7,8,6,7,8],37:[6,7,7,6,6],38:[7,5,7,6,7],39:[5,8,6,4,6],40:[7,9,6,7,7],41:[8,8,7,7,7],42:[8,9,6,7,7],43:[8,9,7,7,7],44:[7,9,7,6,7],45:[7,8,5,6,5],46:[7,8,7,8,7],47:[7,8,7,5,7],48:[7,9,6,6,6],49:[7,8,6,7,7],50:[8,9,7,8,7],51:[7,8,7,7,7],52:[7,7,7,7,7],53:[8,9,7,8,8],54:[7,8,6,6,7],55:[7,8,6,7,6],56:[7,8,5,7,6],57:[8,8,7,8,7],58:[8,8,7,8,7],59:[8,8,5,7,7],60:[7,8,6,6,7],61:[7,8,6,7,7],62:[7,8,6,7,6],63:[7,9,5,8,6],64:[6,8,6,5,7],65:[7,8,7,7,7],66:[7,8,7,7,8],67:[7,9,6,6,7],68:[8,8,7,8,7],69:[8,9,7,8,8],70:[7,8,6,6,6],71:[6,8,5,5,6],72:[7,9,6,7,7],73:[7,8,6,7,6],74:[8,7,7,8,7],75:[6,8,7,5,7],76:[8,8,6,7,7],77:[7,8,5,6,6],78:[5,8,5,4,6],79:[7,7,6,6,7],80:[8,8,7,8,6],81:[8,9,7,8,7],82:[7,8,7,6,7],83:[7,7,6,7,6],84:[8,8,7,9,7]
};

// Build block data
function buildBlocks(raw) {
  return Object.entries(raw).map(([id, scores]) => ({
    id: +id,
    scores,
    avg: d3.mean(scores)
  }));
}

let v1Blocks = buildBlocks(v1Raw);
let v2Blocks = buildBlocks(v2Raw);
let currentVersion = "v2";
let blocks = v2Blocks;

// Layout
const margin = {top: 40, right: 40, bottom: 30, left: 40};
const width = 900;
const height = 340;
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;

const container = document.getElementById("chart-container");
container.style.width = width + "px";
container.style.height = height + "px";

// Canvas for lines
const canvas = document.createElement("canvas");
canvas.width = width * devicePixelRatio;
canvas.height = height * devicePixelRatio;
canvas.style.width = width + "px";
canvas.style.height = height + "px";
container.appendChild(canvas);
const ctx = canvas.getContext("2d");
ctx.scale(devicePixelRatio, devicePixelRatio);

// SVG for axes and brushes
const svg = d3.select(container).append("svg")
  .attr("width", width)
  .attr("height", height);

svg.append("title").text("Agent Disagreement — parallel coordinates of adversarial agent scores");

const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

// Scales
const x = d3.scalePoint().domain(agents).range([0, innerW]);
const y = d3.scaleLinear().domain([1, 10]).range([innerH, 0]);

// Color: diverging by composite score
const colorScale = d3.scaleLinear()
  .domain([4, 6, 8.5])
  .range(["#CC3311", "#888888", "#3366AA"])
  .clamp(true);

// Axes
agents.forEach(agent => {
  const xPos = x(agent);
  const axisG = g.append("g").attr("transform", `translate(${xPos},0)`);
  axisG.call(d3.axisLeft(y).ticks(9).tickSize(-4));
  axisG.select(".domain").attr("stroke", "#999");
  axisG.selectAll(".tick line").attr("stroke", "#ccc");
  axisG.selectAll(".tick text").attr("font-size", "10px").attr("fill", "#666");
  axisG.append("text")
    .attr("y", -14)
    .attr("text-anchor", "middle")
    .attr("font-size", "12px")
    .attr("font-weight", "600")
    .attr("fill", "#333")
    .text(agent);
});

// Brushes
const brushes = {};
const brushSelections = {};
const brushWidth = 28;

agents.forEach((agent, i) => {
  const xPos = x(agent);
  const brush = d3.brushY()
    .extent([[-brushWidth / 2, 0], [brushWidth / 2, innerH]])
    .on("brush end", function(event) {
      if (event.selection) {
        brushSelections[agent] = event.selection.map(y.invert).sort((a, b) => a - b);
      } else {
        delete brushSelections[agent];
      }
      render();
    });

  const brushG = g.append("g")
    .attr("class", "brush")
    .attr("transform", `translate(${xPos},0)`)
    .call(brush);

  brushG.selectAll("rect").attr("rx", 3);
  brushes[agent] = {brush, g: brushG};
});

function isBrushed(block) {
  for (const agent of Object.keys(brushSelections)) {
    const [lo, hi] = brushSelections[agent];
    const idx = agents.indexOf(agent);
    const val = block.scores[idx];
    if (val < lo || val > hi) return false;
  }
  return true;
}

function render() {
  ctx.clearRect(0, 0, width, height);
  ctx.save();
  ctx.translate(margin.left, margin.top);

  const hasBrush = Object.keys(brushSelections).length > 0;
  const brushed = [];

  // Draw faded lines first
  if (hasBrush) {
    ctx.globalAlpha = 0.05;
    ctx.lineWidth = 1;
    blocks.forEach(block => {
      if (isBrushed(block)) return;
      ctx.strokeStyle = colorScale(block.avg);
      ctx.beginPath();
      agents.forEach((agent, i) => {
        const px = x(agent);
        const py = y(block.scores[i]);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
    });
  }

  // Draw active lines
  blocks.forEach(block => {
    const active = !hasBrush || isBrushed(block);
    if (hasBrush && !active) return;
    if (active && hasBrush) brushed.push(block);

    ctx.globalAlpha = hasBrush ? 0.7 : 0.4;
    ctx.lineWidth = hasBrush ? 1.5 : 1;
    ctx.strokeStyle = colorScale(block.avg);
    ctx.beginPath();
    agents.forEach((agent, i) => {
      const px = x(agent);
      const py = y(block.scores[i]);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.stroke();
  });

  ctx.restore();

  // Update brushed list
  const listEl = document.getElementById("brushed-list");
  if (hasBrush) {
    const items = (brushed.length > 0 ? brushed : blocks.filter(isBrushed));
    listEl.innerHTML = `<span class="count">${items.length} of 84 blocks selected:</span> ` +
      items.map(b => `<span class="block-tag">${b.id}</span>`).join("");
  } else {
    listEl.innerHTML = `<span class="count">84 blocks</span> &mdash; brush any axis to filter`;
  }
}

render();

// Version toggle
const btnV1 = document.getElementById("btn-v1");
const btnV2 = document.getElementById("btn-v2");

function switchVersion(v) {
  currentVersion = v;
  blocks = v === "v1" ? v1Blocks : v2Blocks;
  btnV1.classList.toggle("active", v === "v1");
  btnV2.classList.toggle("active", v === "v2");
  // Clear brushes
  for (const agent of agents) {
    brushes[agent].g.call(brushes[agent].brush.move, null);
    delete brushSelections[agent];
  }
  render();
}

btnV1.addEventListener("click", () => switchVersion("v1"));
btnV2.addEventListener("click", () => switchVersion("v2"));
</script>
</body>
</html>
