<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rotating Globe with Pulsing Cities</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #e6edf3;
  }
  #container {
    position: relative;
    width: 600px;
    height: 600px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
  }
  #label {
    position: absolute;
    pointer-events: none;
    background: rgba(13, 17, 23, 0.85);
    color: #e6edf3;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    white-space: nowrap;
    display: none;
    border: 1px solid #30363d;
  }
  h1 {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    color: #8b949e;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="container">
  <canvas id="globe"></canvas>
  <div id="label"></div>
  <h1>World Cities</h1>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const width = 600, height = 600;
const dpr = devicePixelRatio;

// Canvas setup
const canvas = d3.select("#globe")
  .attr("width", width * dpr)
  .attr("height", height * dpr)
  .style("width", `${width}px`)
  .style("height", `${height}px`)
  .node();
const ctx = canvas.getContext("2d");
ctx.scale(dpr, dpr);

// Projection
const projection = d3.geoOrthographic()
  .scale(270)
  .translate([width / 2, height / 2])
  .clipAngle(90);

const path = d3.geoPath(projection, ctx);

// Graticule
const graticule = d3.geoGraticule().step([15, 15])();
const sphere = { type: "Sphere" };

// Simplified world land — rough continent outlines as a single MultiPolygon
// Coordinates are [lon, lat] pairs tracing recognizable continent shapes
const land = {
  type: "MultiPolygon",
  coordinates: [
    // North America
    [[ [-130,50],[-125,60],[-110,68],[-90,70],[-80,65],[-65,60],[-55,48],[-65,43],[-70,41],[-75,35],[-80,25],[-85,30],[-90,28],[-95,28],[-100,30],[-105,32],[-115,32],[-120,35],[-125,45],[-130,50] ]],
    // South America
    [[ [-80,10],[-75,12],[-65,12],[-60,5],[-50,0],[-45,-5],[-40,-10],[-38,-15],[-40,-22],[-45,-25],[-50,-30],[-55,-35],[-60,-40],[-65,-48],[-70,-52],[-75,-45],[-72,-35],[-70,-25],[-70,-18],[-75,-15],[-78,-5],[-80,0],[-80,10] ]],
    // Europe
    [[ [-10,36],[-10,42],[-5,44],[0,43],[3,43],[5,46],[0,48],[-5,48],[0,52],[5,54],[8,55],[12,56],[15,58],[18,60],[22,60],[28,62],[30,65],[25,70],[15,70],[10,65],[5,62],[0,58],[-5,52],[-10,52],[-10,36] ]],
    // Africa
    [[ [-15,12],[-17,15],[-15,28],[-5,36],[10,37],[15,33],[25,32],[30,31],[35,30],[40,12],[42,2],[40,-5],[35,-15],[30,-25],[28,-33],[22,-35],[18,-35],[15,-30],[12,-25],[12,-15],[10,-5],[5,5],[0,6],[-5,5],[-10,8],[-15,12] ]],
    // Asia
    [[ [25,40],[30,42],[35,42],[40,40],[45,40],[50,38],[55,25],[60,25],[65,25],[70,22],[75,15],[78,8],[80,15],[85,22],[88,22],[90,25],[95,18],[100,15],[105,10],[108,15],[110,20],[115,22],[120,25],[125,32],[128,38],[130,42],[135,40],[140,42],[140,52],[135,55],[130,55],[120,55],[110,50],[100,50],[90,48],[80,50],[70,55],[60,55],[55,55],[50,48],[40,45],[35,42],[25,40] ]],
    // Australia
    [[ [115,-35],[115,-30],[120,-20],[130,-15],[135,-12],[140,-15],[145,-15],[150,-22],[153,-27],[152,-33],[148,-38],[140,-38],[135,-35],[125,-35],[115,-35] ]],
    // Greenland
    [[ [-55,60],[-50,62],[-45,65],[-40,70],[-30,75],[-25,78],[-20,76],[-18,72],[-20,68],[-30,65],[-40,60],[-50,60],[-55,60] ]],
    // UK/Ireland approximate
    [[ [-10,50],[-6,52],[-5,55],[-3,58],[0,58],[2,55],[2,52],[0,51],[-5,50],[-10,50] ]],
    // Japan approximate
    [[ [130,31],[131,33],[133,34],[135,35],[137,37],[139,38],[140,40],[142,43],[145,45],[144,43],[141,40],[140,37],[138,35],[135,33],[132,31],[130,31] ]],
  ]
};

const landFeature = { type: "Feature", geometry: land };

// Tol bright palette (6 colors for 6 continents)
const continentColors = {
  "N. America": "#4477AA",
  "S. America": "#EE6677",
  "Europe":     "#228833",
  "Africa":     "#CCBB44",
  "Asia":       "#66CCEE",
  "Oceania":    "#AA3377",
};

// 30 major world cities: [name, lon, lat, continent]
const cities = [
  ["New York", -74.0, 40.7, "N. America"],
  ["Los Angeles", -118.2, 34.1, "N. America"],
  ["Chicago", -87.6, 41.9, "N. America"],
  ["Toronto", -79.4, 43.7, "N. America"],
  ["Mexico City", -99.1, 19.4, "N. America"],
  ["Sao Paulo", -46.6, -23.5, "S. America"],
  ["Buenos Aires", -58.4, -34.6, "S. America"],
  ["Bogota", -74.1, 4.7, "S. America"],
  ["Lima", -77.0, -12.0, "S. America"],
  ["Santiago", -70.7, -33.4, "S. America"],
  ["London", -0.1, 51.5, "Europe"],
  ["Paris", 2.3, 48.9, "Europe"],
  ["Berlin", 13.4, 52.5, "Europe"],
  ["Moscow", 37.6, 55.8, "Europe"],
  ["Rome", 12.5, 41.9, "Europe"],
  ["Cairo", 31.2, 30.0, "Africa"],
  ["Lagos", 3.4, 6.5, "Africa"],
  ["Nairobi", 36.8, -1.3, "Africa"],
  ["Johannesburg", 28.0, -26.2, "Africa"],
  ["Casablanca", -7.6, 33.6, "Africa"],
  ["Tokyo", 139.7, 35.7, "Asia"],
  ["Beijing", 116.4, 39.9, "Asia"],
  ["Mumbai", 72.9, 19.1, "Asia"],
  ["Shanghai", 121.5, 31.2, "Asia"],
  ["Dubai", 55.3, 25.3, "Asia"],
  ["Bangkok", 100.5, 13.8, "Asia"],
  ["Seoul", 127.0, 37.6, "Asia"],
  ["Sydney", 151.2, -33.9, "Oceania"],
  ["Melbourne", 144.9, -37.8, "Oceania"],
  ["Auckland", 174.8, -36.9, "Oceania"],
];

// Rotation state
let rotation = [0, -20, 0]; // [lambda, phi, gamma]
let autoRotate = true;
let dragTimeout = null;
let lastDragEnd = 0;

// Label element
const labelEl = document.getElementById("label");

function render(time) {
  ctx.clearRect(0, 0, width, height);

  // Layer 1: Ocean (sphere)
  ctx.beginPath();
  path(sphere);
  ctx.fillStyle = "#1a2a4a";
  ctx.fill();

  // Layer 2: Land
  ctx.beginPath();
  path(landFeature);
  ctx.fillStyle = "#b8d4a0";
  ctx.fill();
  ctx.strokeStyle = "#666";
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Layer 3: Graticule
  ctx.beginPath();
  path(graticule);
  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Globe outline
  ctx.beginPath();
  path(sphere);
  ctx.strokeStyle = "#444";
  ctx.lineWidth = 1;
  ctx.stroke();

  // Layer 4: Cities
  const pulseT = time || 0;
  for (const city of cities) {
    const coords = [city[1], city[2]];
    const projected = projection(coords);
    if (!projected) continue; // back hemisphere

    // Check if on front hemisphere using geoDistance
    const rotated = projection.rotate();
    const center = [-rotated[0], -rotated[1]];
    const dist = d3.geoDistance(coords, center);
    if (dist > Math.PI / 2) continue;

    const r = 2 + 1.5 * Math.sin(pulseT * 0.003 + city[1] * 0.1);
    const color = continentColors[city[3]];

    ctx.beginPath();
    ctx.moveTo(projected[0] + r, projected[1]);
    ctx.arc(projected[0], projected[1], r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.9;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Glow effect
    ctx.beginPath();
    ctx.moveTo(projected[0] + r + 2, projected[1]);
    ctx.arc(projected[0], projected[1], r + 2, 0, Math.PI * 2);
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.5;
    ctx.globalAlpha = 0.4;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// Animation loop
const timer = d3.timer((elapsed) => {
  if (autoRotate) {
    rotation[0] += 0.3;
    projection.rotate(rotation);
  }
  render(elapsed);
});

// Drag interaction
let dragStart = null;
let rotationStart = null;

const drag = d3.drag()
  .on("start", (event) => {
    autoRotate = false;
    if (dragTimeout) { clearTimeout(dragTimeout); dragTimeout = null; }
    const [mx, my] = d3.pointer(event, canvas);
    dragStart = [mx, my];
    rotationStart = projection.rotate().slice();
  })
  .on("drag", (event) => {
    const [mx, my] = d3.pointer(event, canvas);
    const dx = mx - dragStart[0];
    const dy = my - dragStart[1];
    // Sensitivity: 0.5 degrees per pixel
    rotation = [
      rotationStart[0] + dx * 0.5,
      Math.max(-90, Math.min(90, rotationStart[1] - dy * 0.5)),
      rotationStart[2]
    ];
    projection.rotate(rotation);
  })
  .on("end", () => {
    dragTimeout = setTimeout(() => { autoRotate = true; }, 3000);
  });

d3.select(canvas).call(drag);

// Hover for city labels
d3.select(canvas).on("pointermove", (event) => {
  const [mx, my] = d3.pointer(event, canvas);
  let closest = null;
  let closestDist = Infinity;

  for (const city of cities) {
    const coords = [city[1], city[2]];
    const projected = projection(coords);
    if (!projected) continue;

    const rotated = projection.rotate();
    const center = [-rotated[0], -rotated[1]];
    const dist = d3.geoDistance(coords, center);
    if (dist > Math.PI / 2) continue;

    const dx = projected[0] - mx;
    const dy = projected[1] - my;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 10 && d < closestDist) {
      closestDist = d;
      closest = { name: city[0], x: projected[0], y: projected[1], continent: city[3] };
    }
  }

  if (closest) {
    labelEl.style.display = "block";
    labelEl.textContent = closest.name;
    labelEl.style.left = `${closest.x + 12}px`;
    labelEl.style.top = `${closest.y - 10}px`;
    labelEl.style.borderColor = continentColors[closest.continent];
  } else {
    labelEl.style.display = "none";
  }
});

d3.select(canvas).on("pointerleave", () => {
  labelEl.style.display = "none";
});
</script>
</body>
</html>
